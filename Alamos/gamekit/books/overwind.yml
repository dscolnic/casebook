            - ask: Turn the arrival rate into kilograms a second.
              answer: 1
              candidates:
                - text: 320 ÷ 60 = 5.33 kg/s
                  rule: conversion of the rate
                  survives: true
                  why: >-
                    Tonnes an hour divided by minutes in an hour. It is out by a factor of seventeen
                    and it is a number of a believable size for a small belt.
                - text: 320,000 ÷ 3,600 = 88.9 kg/s
                  rule: conversion of the rate
                - text: 320 × 1,000 × 3,600 = 1.15 × 10⁹ kg/s
                  rule: conversion of the rate
                  why: >-
                    Multiplied by the seconds in an hour instead of divided. A billion kilograms a
                    second is the flow of a large river.
                - text: 320,000 ÷ 60 = 5,333 kg/s
                  rule: conversion of the rate
                  why: >-
                    Kilograms an hour divided by minutes. Two conversions, each half done.
            - ask: Write the momentum given to the ore that lands in a short interval.
              answer: 2
              candidates:
                - text: Δp = m·v, with m the whole shift's ore
                  rule: impulse and momentum
                  why: >-
                    A shift's worth of momentum delivered in one interval. What is wanted is the ore
                    that arrives during the interval, which is the rate times the interval.
                - text: Δp = ½·(dm/dt)·Δt·v²
                  rule: rearrangement
                  survives: true
                  why: >-
                    An energy has been written where a momentum belongs — the half and the square are
                    the tell. It gives 278 newtons, close enough to the true answer to be adopted.
                - text: Δp = (dm/dt)·Δt·v
                  rule: impulse and momentum
                - text: Δp = (dm/dt)·v
                  rule: impulse and momentum
                  why: >-
                    That is already a force rather than a momentum. Skipping the interval here means
                    it cannot be cancelled at the next line, which is the step that makes the answer
                    independent of it.
            - ask: Divide by the interval to get the force.
              answer: 0
              candidates:
                - text: F = (dm/dt)·v, the interval cancelling
                  rule: taking the limit of the interval
                - text: F = (dm/dt)·v·Δt
                  rule: rearrangement
                  why: >-
                    Multiplied by the interval rather than divided, so the answer depends on a choice
                    that was arbitrary.
                - text: F = (dm/dt)·v ÷ 2
                  rule: taking the limit of the interval
                  survives: true
                  why: >-
                    A half that belongs to a mean speed. The ore does not accelerate gradually across
                    the interval — each grain is brought to belt speed by the belt it is sitting on —
                    and this halves the answer for a reason that sounds like care.
                - text: F = v·Δt ÷ (dm/dt), the interval divided out the other way
                  rule: rearrangement
                  why: >-
                    Inverted. The units come out as metre seconds squared per kilogram, which is

warmups:
  trial-near:
    title: Walk the yard before the inspection
    why: >-
      Five buildings, a headframe and a conveyor, and the rope runs across the yard at head height
      between two of them. Walk it once in daylight. On the day of the inspection you will be crossing
      this ground with a submission in your hand and a winder running, and knowing where the rope is
      matters more here than anywhere else on the site.
  trial-far:
    title: The bench track, and the hut at the end of it
    why: >-
      The gravity station is three hundred metres out along the bench and the track is peat for the
      last hundred. Take it once before you need to, because the day Dr. Lena Sokol, the geophysicist,
      has the shaft for two hours you will be walking it with an instrument that must not be jarred.
  greet:
    title: Twelve people, and two of them have been arguing for two years
    why: >-
      This shaft runs on an argument between Delia Marchetti, the winding engineer, and Samuel Otieno,
      the chief rope examiner, and you will be carrying numbers between them all fortnight. Get round
      the whole crew first, because half of what is not in the submission is in somebody's notebook.
  follow:
    title: The rope inspection route, walked by the man who splices it
    why: >-
      Kit Nowak, the rope splicer, walks the rope from the drum to the sheave to the cappel on the
      same route every week, and the route is not written down anywhere. Stay with him along it. Where
      he stops is where the rope is watched, and the forty metres that have been cut off it in two
      years were all cut at one of those stops.
  hunt:
    title: Six guide clamps, and the sheet accounts for four
    item: { name: guide clamp, plural: guide clamps }
    why: >-
      The cage runs on steel guides held by clamps, and two of the clamps replaced after March are not
      where the sheet says they are. A clamp nobody can find is either doing nothing or holding a
      guide out of line, and a guide out of line is what turns a bounce into a jam.
  canvass:
    title: Who else felt the March stop
    why: >-
      Eleven men were underground when the brake went on in March and the only record is a drum trace
      and a position tape. Ask round the crew and the fitters until enough accounts agree on what the
      cage did afterwards, because two instruments and no witnesses is not an account of an incident.
  evade:
    title: The maker's man who wants to fit new pads today
    why: >-
      He has driven three hours with a set of pads and wants them on before the inspection, which
      would replace the one piece of physical evidence from March. The argument belongs to Iona Craig,
      the brake fitter, not to you. Keep clear of him and get your round done rather than spending the
      afternoon at the brake house.
  tag:
    title: Catch Sokol before she goes down the shaft
    why: >-
      Dr. Lena Sokol, the geophysicist, has two hours in the shaft on Thursday and she leaves the
      bench at seven. The elevation of the inset station comes off an eighteen-year-old shaft
      measurement, and once she is below ground nobody can hand her anything, so the level book has to
      reach her on the surface.

copy:
  BANK: <p>The bank. A signal board, a gate, and a chalk mark on the guide where the cage should stop, which the cage has been stopping a little past for eight months.</p>
  WIND: <p>The winder house. A drum two metres to the rope, a motor rated at 480 kilonewton metres, and a brake that is held on by weights so that losing the oil applies it rather than releasing it.</p>
  ROPE: <p>The rope shop. Splicing gear, four re-cap records in two years, and a length of locked coil clamped between two anchors with a dial gauge on it.</p>
  CAGE: <p>The brake house, at the foot of the headframe. Pad certificates on the wall, a crush-tested arrestor in the corner, and the position tape from March in a drawer nobody has opened since the inquiry.</p>
  TIP: <p>The tip. Bins, a chute and a belt that carries nine hundred tonnes a shift up to the plant, with two of its mounting bolts sheared and on the bench.</p>
  GRAV: <p>The gravity station, three hundred metres out on the bench. A concrete pillar, a hut, and an instrument that reads where it is standing to a millionth.</p>
  HEAD: <p>The headframe. Thirty-two metres of steel over the shaft, two sheave wheels at the top of it, and the arrestors above the bank that have never been used.</p>
  COMPRESSOR: <p>The compressor house. Air for the drills below, and the loudest building on the site by a long way.</p>
  LAMP: <p>The lamp room. Forty-one lamps on charge, forty-one tallies on the board, and the count that says who is underground.</p>
  CHANGE: <p>The change house. Where a shift starts and ends, and where the men read whatever the winder house has decided about the cycle they ride.</p>

# ---------------------------------------------------------------- review variants
#
# Lessons no mission stop points at. `shapeMissions` reaches a "<title> — Review"
# by title when a callback day wants one, and without these the campaign carries
# no spaced retrieval at all: from day 3 every day looks for the oldest taught
# lesson that has an unserved variant, and finds nothing.
#
# Four bases, all from days 1–3, all chosen so the callback lands in an area the
# day is not already visiting: BANK day 1 and day 2, ROPE day 2, WIND day 1.
# None of them is a DERIVE variant. A derivation is reviewed by applying its
# result to a different case, which is a board rather than a chain of lines —
# and the twelve DERIVE stops are the course, so nothing here touches them.
lessons:
  - group: BANK
    title: Twelve seconds of ramp — Review
    task: Get the speed the retardation ramp removes
    concept: Position, velocity and acceleration as successive derivatives
    place: The Bank
    scene: >-
      Grace Ubah, the banksman, has the other end of the same journey on the landing desk. The
      retardation ramp starts at 1.5 metres a second squared and tapers to nothing over eight
      seconds. She wants the speed it takes off.
    guide: >-
      Five quantities are offered, and three of them belong in the sum. The ramp is stated as a rate that
      falls linearly to nothing. What it removes is the area under it, not a product of its peak and
      its length. Two of the five belong to the other end of the journey, or to the speed the ramp
      starts from.
    assumes:
      - an acceleration that changes cannot be multiplied by a time
    takeaway: A rate that tapers to nothing does half the work its quoted peak suggests. What it delivers is the
    area underneath it.
    format: BALLPARK
    question: How much speed does the retardation ramp take off?
    estimate:
      prompt: >-
        The ramp starts at its peak and falls linearly to nothing at the end of the eight seconds.
      question: How much speed does the retardation ramp take off?
      relationship: >-
        The speed a ramp removes is its mean rate times how long it lasts, and the mean of a linear
        taper is half its peak.
      labels:
        - 1.5 m/s²  (the peak of the retardation ramp)
        - 8 s  (how long the ramp lasts)
        - 0.5  (the mean of a linear taper, as a fraction of its peak)
        - 7.2 m/s  (the full winding speed the ramp starts from)
        - 1.2 m/s²  (the peak of the accelerating ramp at the other end)
      values: [1.5, 8, 0.5, 7.2, 1.2]
      slots: 3
      template: '{0} × {1} × {2}'
      formula: a*b*c
      correct: [0, 1, 2]
      target: 6
      tolerance: 0.3
      units: m/s
      solution: 1.5 × 8 × 0.5 = 6.0 m/s.
      explanation: >-
        Taking the peak for the whole eight seconds gives twelve metres a second, which is more
        speed than the wind has to give. The accelerating ramp's peak belongs to the other end of
        the journey and enters nothing here.
    why: >-
      The ramp takes off six metres a second. That leaves the cage creeping into the landing at 1.2. A
      retardation stated as a rate that falls linearly to nothing removes the area under itself, not
      its peak times its length. The mean of a linear taper is half its peak. So eight seconds at a
      peak of 1.5 do the work of eight at 0.75. Using the peak throughout would take twelve off a
      wind that has only 7.2 to give.

  - group: ROPE
    title: Eleven tonnes, hung from what — Review
    task: Put each force in the diagram it belongs to
    concept: Newton's second law as a vector statement
    place: Rope Shop
    scene: >-
      Kit Nowak, the rope splicer, has the ore skip's rope on the shop board. Four hundred metres of it
      hang below the sheave, with the skip and its load on the end. The submission puts every
      one of those forces in one line.
    guide: >-
      Four forces and four bodies, one each. Ask of every force which body it acts on, rather than where on the plant it happens. A force belongs
      to a diagram and not to a place. Two of the four act on the same body. Telling those two apart
      is what the pairing turns on.
    assumes:
      - a rope's tension at a point carries everything hanging below that point
    takeaway: Two forces acting at the same place can belong to different diagrams. Which body each acts on is
    what decides the pairing.
    format: PROTOCOL
    task: Match each force to the body whose free-body diagram it belongs in.
    scenarios:
      - The weight of the four hundred metres of rope hanging below the sheave.
      - The upward pull of the rope at the skip's cappel.
      - The weight of the ore riding in the skip.
      - The push of the headframe's steelwork up on the sheave's bearings.
    choices:
      - The drum's, since the tension at the top of the rope is where the hanging length is finally carried.
      - The skip's, as the only upward force acting on it.
      - The skip's, as a downward force that adds to what the rope has to lift.
      - The sheave's, as the reaction holding it up against both ends of the rope.
    mapping: [0, 1, 2, 3]
    why: >-
      A force enters the equation of whichever body it acts on. The hanging rope pulls down on nothing
      below it. Each point carries what hangs beneath, so the whole weight is accounted for only in
      the tension the drum holds. The rope pulls up on the skip, and the ore presses down on it.
      Both belong to the skip's own line. The steelwork's push belongs to the sheave, which carries
      both rope ends and accelerates nowhere.

  - group: BANK
    title: Three things out of one trace — Review
    task: Get the overrun out of a record of speed
    concept: Getting velocity and distance back by integrating an acceleration
    place: The Bank
    scene: >-
      Tom Halloway, the onsetter, has the winder house tachometer roll beside the depth recorder's
      paper. This pen records speed against time and nothing else, and the inquiry wants the overrun
      distance out of it.
    guide: >-
      Four steps, in the order they have to be done. This roll records a rate rather than a position. The
      quantity the inquiry wants is not on the paper. It has to be accumulated off the roll. Each
      step needs the one above it to have happened. That is what fixes the order.
    assumes:
      - the area under a speed–time trace is a distance
    takeaway: A record of a rate gives up its totals only to an integration. An area is worth nothing until both
    of its limits are fixed.
    format: SEQUENCE
    task: Order the four steps that get the overrun distance out of a speed record.
    axis: >-
      Order the four steps, first to last. This is one procedure on one roll of paper, and every
      step needs the one before it to have been done.
    ends: [First step, Last step]
    cards:
      - Mark the instant on the roll where the brake went on.
      - Mark where the trace reaches zero, which is where the cage stopped.
      - Take the area under the trace between the two marks.
      - Subtract the distance from the brake mark down to the landing.
    order: [0, 1, 2, 3]
    why: >-
      A record of speed is a rate, so the total is not on the paper. Distance is the area under the trace,
      not anything read off it. That is the opposite move from the depth recorder. There the totals
      are on the paper, and the rates are its slopes. Both limits have to be fixed before an area
      means anything. An area is always between two of them. Only then does subtracting the distance
      to the landing say how far past it the cage went.

  - group: WIND
    title: Where twelve seconds come from — Review
    task: Time the part of the cycle nobody can shorten
    concept: Position, velocity and acceleration as successive derivatives
    place: Winder House
    scene: >-
      Ruth Anand, the winder driver, has the cycle sheet up in the winder house. Eleven hundred and fifty
      metres of the wind are run at full speed. The ramps are at one end and the crawl at the other. Marchetti wants that part timed.
    guide: >-
      Four quantities are offered and two of them belong in the sum. The section in question is the one where the winder is neither speeding up nor slowing down. So
      nothing has to be integrated, and no ramp figure enters it. The other two numbers describe parts of the cycle that are not
      this one.
    assumes:
      - a wind is made of a ramp up, a run at full speed, a ramp down and a crawl
    takeaway: The longest part of a winding cycle is set by the depth and the permitted speed. It is not a place
    where time can be found.
    format: BALLPARK
    question: How long does the full-speed section of one wind last?
    estimate:
      prompt: >-
        The winder holds its permitted speed for this section and neither ramp reaches into it.
      question: How long does the full-speed section of one wind last?
      relationship: >-
        At a steady speed, the time a section takes is its distance divided by that speed.
      labels:
        - 1,150 m  (the shaft length left after both ramps and the crawl)
        - 7.2 m/s  (the full winding speed the licence allows)
        - 12 s  (how long the proposed accelerating ramp runs)
        - 1,240 m  (the full depth of the shaft)
      values: [1150, 7.2, 12, 1240]
      slots: 2
      template: '{0} ÷ {1}'
      formula: a/b
      correct: [0, 1]
      target: 159.7
      tolerance: 3
      units: s
      solution: 1,150 ÷ 7.2 = 159.7 s.
      explanation: >-
        Using the full depth of the shaft charges the full-speed section with ground the ramps and
        the crawl have already covered. The ramp length is a duration and belongs to a different
        part of the cycle.
    why: >-
      About a hundred and sixty seconds, and none of them are anybody's to give away. The full-speed run
      is a distance divided by a speed. The distance is the shaft less the ramps at each end. The
      speed is what the licence allows. Neither moves because a ramp is made steeper. That is why
      the twelve seconds have to come out of the ramps and the crawl. Those are the only parts of
      the cycle a winding engineer chooses.

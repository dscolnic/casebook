  # ---------------------------------------------------------------- day 5
  - title: Where the work goes
    objective: Add up the work a wind actually does, with a force that changes all the way up.
    briefing: The energy figures in the submission are the cage's, and the cage is a quarter of the rope.
    stake: >-
      Friday. The energy part of the submission is one line long: cage times gravity times
      depth. Rahimi has asked what happens to the other three quarters. The rope has to be
      lifted as well. Less of it hangs below the drum with every metre wound on. So the force
      the drum works against changes the whole way up the shaft. Craig wants the total for her
      own reason. It is the same energy the brake must take out again if a wind is ever stopped
      at full speed. Today you take the work done with the rope's weight in it. Then you set the
      cage's own share beside it, and ask Otieno why he keeps calling twelve hundred metres of
      steel a spring.
    takeaway: Work done against a force that changes with position is an integral, and the changing part can be the larger part.

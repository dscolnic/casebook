          the start of the upward wind is 166 kilonewtons. Marchetti wants the torque the
          motor has to produce.
        guide: >-
          You build the working a line at a time. The drum is the body. Two torques act on it, the motor's and the rope's. Their difference is what
          spins it up. The angular acceleration is not given. It has to come from the cage's
          acceleration and the radius the rope leaves at. Watch which of the two torques opposes the other.
        background:
          - >-
            Why the load torque is the larger part. The rope pulls on the drum at 2.1 metres from the axis with 166 kilonewtons. That is 348 kilonewton
            metres before the drum is asked to change speed at all. The inertia term adds 41 on top
            of it. That is a tenth of the total, and the part that only exists while the ramp is
            running.
          - >-
            Why the two are tied. The rope does not slip on the drum. So the cage's speed is the drum's angular speed times the
            radius. The two accelerations are tied the same way. That is what turns one unknown into
            the other. It is the only place the radius does two different jobs in one line.
          - >-
            What the answer settles and what it does not. The motor is rated at 480 kilonewton metres continuous, so 389 is inside it with room to spare.
            Marchetti is right about the machine. Nothing in this calculation contains a period, a stretch or a rope that talks
            back, which is the argument that arrives on day nine.
        assumes:
          - a rope that does not slip ties the cage's acceleration to the drum's angular acceleration
        takeaway: The torque a wind needs is the load torque plus the inertia torque. The second is the smaller of the
        two.
        format: DERIVE
        question: What torque does the motor have to produce at the start of an upward wind?
        answerText: >-
          About 389 kN·m: 348 from the rope at 2.1 m and 41 from spinning the drum up at
          0.571 rad/s².
        why: >-
          The motor has to produce about 389 kilonewton metres. Two torques act on the drum. The angular form
          of the second law says their difference equals the inertia times the angular acceleration.
          So the motor's torque is the rope's plus that product. The angular acceleration comes from
          the rope not slipping: the cage's 1.2 metres a second squared over the 2.1 metre radius.
          The load term dominates. That is why a bigger drum makes the problem worse rather than
          better on both counts.

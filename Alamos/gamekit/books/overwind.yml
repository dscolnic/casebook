            linearly in between. Integrating a linear force gives the mean value times the distance,
            which is why the rope contributes as though half of it were being lifted the whole way.
          - >-
            Why the answer is the same by either route. Work against gravity is path-independent. So
            the same total comes out of asking how much each element of rope was raised. The element
            at the top of the shaft hardly moves. The one at the bottom is raised the whole depth.
            That is a different integral with the same answer, which is what makes gravity
            conservative.
          - >-
            What the number is for. 116 megajoules is what the motor puts in going up and what the
            brake has to take out coming down. At the shaft's four winds an hour, divided by the
            cycle time, it is also the plant's electricity bill. That is the other reason Marchetti
            wants the cycle shorter.
        assumes:
          - work against a changing force is the accumulation of force over distance

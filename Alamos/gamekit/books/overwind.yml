            What the number is for. The rope's breaking load is about 1,600 kilonewtons. The statutory factor of safety at this depth is
            eight, which puts the working limit at 200.
            The figure in the submission is 39 kilonewtons. Both of those are true statements about
            different points on the same rope.
        assumes:
          - a rope's tension at a point carries everything hanging below that point
        takeaway: Tension at the drum is the hanging mass times gravity plus the acceleration, and the hanging mass includes the rope.

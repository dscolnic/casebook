          The cage's share is 48.7 megajoules of 116, which is forty-two per cent. Gravity is a conservative
          force. So this depends only on the mass and the height, not on the route, the speed or the
          time. That is what lets it be computed as a product rather than as an integral. The rope
          cannot be treated the same way, because different parts of it are raised by different
          amounts. That is the whole reason its contribution needed an integral this morning.
      - group: ROPE
        task: Ask Otieno why he calls the rope a spring
        title: Twelve hundred metres of spring
        concept: Simple harmonic motion out of a linear restoring force
        place: Rope Shop
        person: true
        scene: >-
          Otieno has a length of rope in the shop clamped between two anchors and a dial gauge on it.
          Pull on it and it stretches; let go and it comes back and goes past.
        guide: >-
          All four options describe something a long steel rope does. Ask of each whether it would produce a to-and-fro motion of the cage. Then ask what the force would
          have to be like for that motion to have a definite period. The alternative is a shape that
          depends on how hard it was pulled.
        assumes:
          - a force proportional to a displacement always acts back towards where it started
        takeaway: A restoring force proportional to displacement is what makes an oscillation. It gives the motion a
        period of its own.
        format: CHOICE
        question: What makes the rope behave like a spring rather than like a link?
        why: >-
          The rope stretches in proportion to the pull, and its pull acts back towards where the cage started.
          That is what a spring is. It is the condition for an oscillation with a period of its own.
          A restoring force proportional to displacement gives a to-and-fro motion. That motion's
          period depends on the stiffness and the mass, not on how far it was pulled. A rigid link
          would move the cage exactly as the drum moved. Twelve hundred metres of steel does not.
        choices:
          - Its pull grows in proportion to how far it has been stretched
          - Its own weight is greater than the load it carries
          - Steel returns to its original length after being loaded
          - It is wound on a drum, which stores the stretch in the coils
        answer: Its pull grows in proportion to how far it has been stretched
        rebuttals:
          - Weight decides the tension and says nothing about how the rope responds to being pulled.
          - Returning to length is what makes it elastic rather than what gives it a period.
          - Coils on the drum are supported by the drum, and the stretch that matters is in the hanging part.
  # ---------------------------------------------------------------- day 6
  - title: Ore in a stream
    objective: Get the force a moving stream makes, and settle who feels the other end of it.
    briefing: The conveyor drive trips twice a shift and every load on it is inside its rating.
    stake: >-
      Monday. The conveyor drive tripped twice on Friday's night shift. Bart Lindqvist, the tip
      foreman, has the loads written down. Nothing over four tonnes. Nothing outside what the
      belt is rated for. What he has not got is the force the belt feels from ore landing on it
      without a break. That is a different quantity from the weight of the ore sitting on the
      belt. Rahimi wants the same sum for the arrestors. A mass stopped by crushing steel is the
      same problem with the sign turned round. Today you find the force in the ore stream. You
      also settle who feels the push back from it, and go out to the gravity station to see Femi
      Adebayo, the survey assistant. He will tell you why one reading needs three more around
      it.
    takeaway: A stream of mass arriving at a rate makes a steady force, and no single load in it accounts for that force.
    stops:
      - group: TIP
        task: Take the force the belt feels from the ore stream
        title: Three hundred and twenty tonnes an hour
        concept: Impulse as the integral of a force over time
        place: Tip and Conveyor
        scene: >-
          Ore leaves the chute onto the belt at 320 tonnes an hour with no forward speed of its own.
          The belt runs at 2.5 metres a second. Lindqvist wants the force that takes to keep the belt
          running.
        guide: >-
          You build the working a line at a time. Consider the ore that lands in a short interval:
          it arrives with no forward speed and leaves with the belt's. Something has to have given it
          that momentum, and dividing the momentum given by the interval is the force. The rate has
          to be in kilograms a second before any of this works.
        background:
          - >-
            Why this is not the weight of the ore on the belt. The weight is carried by the idlers and
            acts downward. The force computed here is horizontal, it exists only while ore is
            arriving, and it is what the drive has to supply on top of everything else.
          - >-
            Why a stream is not a series of loads. A four-tonne skip tipped into a bin is one event
            with one impulse. The same ore spread over an hour arrives continuously. What the
            drive feels is not a series of jolts. It is a steady force equal to the rate times the
            speed change. Sizing the drive from the loads misses it entirely.
          - >-
            What the vertical part does. The ore also falls about three and a half metres before it
            lands, arriving at over eight metres a second downward, which the belt and its idlers stop.
            That is a larger force than the horizontal one. It is carried by the structure rather
            than by the drive. That is why the drive trips and the frame does not bend.
        assumes:
          - a force acting for a time changes momentum by their product
        takeaway: A mass rate times a speed change is a force, and it is what a drive feels from anything arriving continuously.
        format: DERIVE
        question: What horizontal force does the ore stream put on the belt drive?
        answerText: >-
          About 222 N. The rate is 88.9 kg a second and the speed change is 2.5 m/s, so the force is
          their product.
        why: >-
          The force is about 222 newtons. Every kilogram of ore that lands has to be brought up to
          belt speed. That needs a momentum of 2.5 kilogram metres a second per kilogram. And 88.9
          kilograms land every second. Dividing the momentum given per interval by the interval leaves
          the rate times the speed change, with the interval cancelling. That is why the answer does
          not depend on how the interval is chosen. It is a modest force and it is one nobody had
          included at all.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: J = ∫F dt = Δp
          startNote: 320 tonnes an hour arriving with no forward speed, onto a belt running at 2.5 m/s
          goal: the horizontal force on the belt drive, in newtons
          askRule: true
          rules:
            - conversion of the rate
            - impulse and momentum
            - taking the limit of the interval
            - substitution of the stated values
            - rearrangement

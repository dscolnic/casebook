      - group: CAGE
        task: Ask Craig what the brake is being asked to do
        title: A force or an energy
        concept: Kinetic energy and the work–energy theorem
        place: Shaft and Brake House
        person: true
        scene: >-
          Craig has the pad wear records for two years. The pads last well on ordinary winds and the
          set after March had to be replaced. Nothing about the force the brake applies was different.

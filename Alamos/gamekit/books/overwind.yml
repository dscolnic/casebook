# Overwind — Kerrow No. 3, and twelve working days before the winder is re-licensed.
#
# Written to gamekit/tools/BOOK_TEMPLATE.md. The place is themes/overwind/site.js.
#
# AP Physics C: Mechanics, taught as derivations. Twelve of the thirty-six stops
# are DERIVE panels and they are the spine, in the order the mechanics has to
# arrive in rather than the order a shaft is walked:
#
#   day  1  the profile differentiated and integrated: acceleration, and depth
#   day  2  the drum's moment of inertia, as an integral over its mass
#   day  3  the tension at the drum, with the rope's own weight in it
#   day  4  the torque the wind needs
#   day  5  the work a brake does, as an integral of a force that changes
#   day  6  the force in a stream of ore, out of impulse
#   day  7  gravity at the shaft bottom, out of the shell theorem
#   day  8  the power at the worst instant of the cycle
#   day  9  the period of the cage bouncing on twelve hundred metres of rope
#   day 10  the energy stored in the stretch, and the travel it pays for
#   day 11  everything the brake has to absorb, rotation included
#   day 12  the revised profile, integrated, and what the saving really is
#
# `askRule: true` is on. In this course the name of the licence is the content:
# a student who gets the right line by differentiating when they should have
# integrated has not done mechanics, and the commonest lost point on the paper is
# a line that is algebraically legal and licensed by nothing.
#
# The argument: Marchetti holds that the cycle can come down twelve seconds and
# that every number she has says the plant is inside its limits. Otieno holds
# that a rope is not a wire — it is twelve hundred metres of steel with a period
# of its own — and that a shorter ramp is a fatigue question rather than a torque
# question. Marchetti is right on day 4: the torque is there, and the tension
# stays under limit. Otieno is right on day 10: the ramp she wants lands on the
# stretch of the rope, and the March overrun was that and not the brake.
#
# The timeline the cards are checked against:
#   eighteen years ago   the shaft deepened to 1,240 m; the drum re-roped
#   last March           an emergency stop — the descending cage travelled 1.6 m
#                        after the drum had stopped, and came to rest below the
#                        inset landing, on a brake applied on time
#   the inquiry          blamed the pad friction, measured cold on the bench
#   now                  twelve working days to the inspector's visit
#   day 13               a trial wind, with the inspector in the winder house
#   the licence          decides whether 41 men a shift ride a faster cycle

theme:
  id: overwind
  title: Overwind
  subtitle: Winding Engineer's Assistant · Kerrow No. 3, twelve days before the licence

groups:
  - id: BANK
    code: BANK
    name: The Bank
    color: '#4f7fa8'
    desc: The top landing, and the profile every wind is driven to.
    defaultLeader: ubah
    milestones: [Read the profile, Differentiate it, Integrate it back, Ready to hand over]
  - id: WIND
    code: WIND
    name: Winder House
    color: '#c2703f'
    desc: A drum, a motor and a brake, and everything that turns with them.
    defaultLeader: marchetti
    milestones: [Weigh the drum, Take the inertia, Find the torque, Ready to hand over]
  - id: ROPE
    code: ROPE
    name: Rope Shop
    color: '#8a8f4a'
    desc: Twelve hundred metres of steel that weighs more than what it carries.
    defaultLeader: otieno
    milestones: [Measure the rope, Take the tension, Find its period, Ready to hand over]
  - id: CAGE
    code: CAGE
    name: Shaft and Brake House
    color: '#6f6a86'
    desc: What the cage does, what stops it, and where the energy goes.
    defaultLeader: rahimi
    milestones: [Draw the body, Do the work, Absorb the energy, Ready to hand over]
  - id: TIP
    code: TIP
    name: Tip and Conveyor
    color: '#8a5f3f'
    desc: Ore in a stream rather than in a lump, and the force a stream makes.
    defaultLeader: lindqvist
    milestones: [Weigh the stream, Take the impulse, Close the ledger, Ready to hand over]
  - id: GRAV
    code: GRAV
    name: Gravity Station
    color: '#3f8f7a'
    desc: Three hundred metres out on the bench, where g is measured rather than assumed.
    defaultLeader: sokol
    milestones: [Level the meter, Read the drift, Take the difference, Ready to hand over]

roster:
  - id: marchetti
    name: Delia Marchetti
    role: Winding Engineer
    division: WIND
    bio: |
      Responsible for the winder, which means responsible for the only machine on
      this site that carries people. She has driven the proposal to take twelve
      seconds out of the wind cycle for two years, and she has the arithmetic for
      every part of it.

      Her argument is that the plant is nowhere near its limits and that the
      caution here is inherited rather than computed. The motor has the torque,
      the drum has the inertia to smooth it, the rope has four times the tension
      it will see. She has written all three down and nobody has checked them.

      Her limit is that every number she has is a steady-state number. A rope
      with a period of its own does not appear anywhere in her calculation,
      because nothing in the plant handbook has a period.
    quiz:
      - q: Why does Marchetti regard the present cycle time as inherited rather than justified?
        a: Its margins were never computed against what the plant can do
        wrong:
          - The original winder was replaced eighteen years ago and its limits no longer apply
          - Cycle times at this depth are set by regulation and not by engineering
          - The inquiry into the March overrun required a slower cycle as a condition
  - id: anand
    name: Ruth Anand
    role: Winder Driver
    division: WIND
    bio: |
      Drives the winder. Twelve years of it, four winds an hour, and the only
      person here who knows what the machine feels like when it is doing what the
      profile says it is doing.

      She was driving in March. She applied the emergency brake at the mark, on
      time, and the cage at depth went on travelling after the drum had stopped.
      The inquiry accepted that she had done everything right, which she says is
      not the same as anybody explaining what happened.

      Her limit is that what she has is a feel for the machine and no instrument.
      She says the rope talks back on a hard ramp, and there has never been
      anything on the winder that would record it.
    quiz:
      - q: Why is Anand unsatisfied by an inquiry that cleared her?
        a: Being cleared says who was not at fault, not what moved the cage
        wrong:
          - The inquiry's finding on the pad friction was never published in full
          - She believes the brake mark chalked on the drum flange is in the wrong place
          - A driver cleared once is examined again after any second incident
  - id: otieno
    name: Samuel Otieno
    role: Chief Rope Examiner
    division: ROPE
    bio: |
      Examines the winding rope, which at this shaft is twelve hundred and forty
      metres of locked-coil steel weighing about eleven tonnes. It is heavier
      than everything it lifts.

      He is careful about how he puts it. Marchetti is not wrong about the
      torque, and nobody here is careless. His point is narrower: a rope is not a
      link in a diagram, it is a spring with mass, and a spring with mass has a
      period. Drive it with a ramp about as long as that period and the cage
      arrives at the bank still moving.

      His limit is that he can compute the period and has never measured it. The
      instrument that would settle it costs about what the shaft spends on lamps
      in a year, and it has been refused twice.
    quiz:
      - q: Why does Otieno say the rope's stiffness matters to a braking calculation?
        a: A stretched rope gives its energy back, so the cage keeps moving
        wrong:
          - A stiffer rope transmits more of the brake's force to the cage than a slack one
          - Rope stiffness changes the tension at the drum and therefore the braking force available
          - The rope's stretch is the quantity every crawl and landing margin at this shaft is set from
  - id: nowak
    name: Kit Nowak
    role: Rope Splicer
    division: ROPE
    bio: |
      Splices and re-caps the rope, and keeps the record of every metre of it.
      The rope is shortened at the cappel every six months, which changes its
      length and therefore everything that depends on its length.

      What Nowak knows and nobody has asked for is that the rope has not been the
      same object for two years. It is forty metres shorter than it was, which
      makes it stiffer, which moves its period.

      The limit is that the record is a length and a date. Nothing in it says
      what the change did to anything else, because nothing in the shop's remit
      has ever needed to know.
    quiz:
      - q: Why does shortening the rope at the cappel change more than its length?
        a: The same steel in a shorter length is stiffer, so the cage bounces faster
        wrong:
          - A shorter rope weighs less, which lowers the tension at the drum and the braking force
          - Splicing changes the construction where the joint is and reduces the rope's breaking load
          - The drum then holds fewer coils, which changes its moment of inertia
  - id: ubah
    name: Grace Ubah
    role: Banksman
    division: BANK
    bio: |
      Runs the bank, which is the top landing and the place every wind ends.
      Signals the winder, loads the cage, counts the men on and the men off, and
      has the authority to stop a wind by lifting a handle.

      Her subject is the profile: how fast the cage is going at each moment of a
      wind, which she reads as a shape rather than as a table. She can tell you
      where the ramps are and how long the crawl at the end lasts, because she is
      standing on the landing when it arrives.

      Her limit is that she sees one end of a wind. What the cage does at the
      inset twelve hundred metres down arrives as a bell signal.
    quiz:
      - q: Why does Ubah insist the crawl at the end of a wind is not wasted time?
        a: It is the margin between a controlled stop and an uncontrolled one
        wrong:
          - The men waiting at the surface need it to unhook the landing gate before the cage arrives
          - It is the interval the winder driver uses to read the depth indicator
          - Regulations require a fixed low-speed section at the end of every wind
  - id: halloway
    name: Tom Halloway
    role: Onsetter
    division: BANK
    bio: |
      Works the inset at the shaft bottom, twelve hundred and forty metres down.
      Loads the cage, signals the bank, and is the other end of every wind Ubah
      starts.

      He has a working knowledge of the shaft nobody upstairs has: which levels
      make water, where the guides are worn, and how the cage behaves in the
      first seconds after it leaves. He says the start of an upward wind is the
      part that has changed since March.

      His limit is that he cannot be heard. The signal system carries codes
      rather than sentences, and the telephone at the inset has been out since
      the spring.
    quiz:
      - q: Why is Halloway's account of the start of a wind hard to act on?
        a: The signal system carries fixed codes and no sentences
        wrong:
          - Observations from below ground are not admissible in a licence submission
          - The inset has no clock synchronised with the winder house, so nothing he times can be compared
          - He is at the bottom of the shaft, where the cage is moving too slowly to observe
  - id: rahimi
    name: Aziz Rahimi
    role: Shaft Engineer
    division: CAGE
    bio: |
      Responsible for the shaft, the cage, the guides and the arrestors above the
      bank. The arrestors have never been used. What happened in March happened at
      the other end of the shaft, where there is nothing above the landing and a
      cage that goes past it goes into the sump.

      His interest is in where energy goes. A cage coming up at ten metres a
      second with four tonnes in it holds a great deal of it, and every joule has
      to be somewhere afterwards — in the pads, in the arrestors, or in the
      building.

      His limit is that the arrestors are a single-use answer to a question nobody
      has closed. They are the plant's whole answer to a cage that does not stop
      where it should, and they exist at one end of the shaft only.
    quiz:
      - q: Why does Rahimi think the March stop left something unexplained?
        a: Energy the brake was credited with taking out went somewhere else
        wrong:
          - The arrestors were installed after the shaft was deepened and never re-rated
          - The cage's own position recorder was out of calibration on the day
          - The inquiry examined the drum and the pads and never examined the guides the cage runs on
  - id: craig
    name: Iona Craig
    role: Brake Fitter
    division: CAGE
    bio: |
      Fits and tests the brake. Two sets of pads on the drum flanges, held on by
      weights and lifted by oil, so a loss of pressure applies the brake rather
      than releasing it.

      She measured the pad friction for the inquiry. She measured it on the
      bench, cold, at a known pressure, and she wrote all three of those
      conditions on the certificate. The inquiry quoted the number and not the
      conditions.

      Her limit is that a brake is only measurable in pieces. What she can put a
      figure on is a pad against a plate; what nobody can put a figure on is that
      pad on a hot drum at the end of a wind.
    quiz:
      - q: Why does Craig object to how her friction figure was used?
        a: It was measured cold on a bench and quoted for a wind
        wrong:
          - The figure was for one pad and the drum carries two sets
          - Her certificate gave a range and the inquiry used the middle of it
          - The measurement was taken before the last re-lining of the pads and was never repeated
  - id: lindqvist
    name: Bart Lindqvist
    role: Tip and Conveyor Foreman
    division: TIP
    bio: |
      Runs the tip, the bins and the conveyor that takes ore off the shaft and up
      to the plant. Nine hundred tonnes a shift, arriving in loads and leaving as
      a stream.

      His problem is that the two are not the same thing. A skip tipping four
      tonnes into a bin is one event; the belt that carries it away feels a
      steady force from ore landing on it continuously, and the drive was sized
      by somebody who treated the second as though it were the first.

      His limit is that the weightometer on the belt is the only measurement he
      has, and it reads tonnes an hour rather than newtons.
    quiz:
      - q: Why can a belt drive be undersized while every load on it is within limit?
        a: A stream arriving continuously makes a steady force of its own
        wrong:
          - The weightometer averages over a whole minute, which hides the peaks inside it
          - Loads arriving at intervals are heavier than the same ore spread out
          - Belt tension rises with the length of the run rather than with the load
  - id: osei
    name: May Osei
    role: Weightometer Technician
    division: TIP
    bio: |
      Calibrates the weightometer, which is the belt's own scale: a weighed
      length of belt, a speed and an arithmetic unit that turns them into tonnes
      an hour.

      She is exact about what it reports. It gives a mass per unit length times a
      speed, which is a mass a second, and the plant reads it as though it were a
      mass. Both are useful and they are not interchangeable.

      Her limit is the calibration chain: a static weight on a short length of
      belt, extrapolated to a belt running at two and a half metres a second.
    quiz:
      - q: Why is the weightometer's reading a rate rather than a quantity?
        a: It multiplies the mass on a length of belt by the belt's speed
        wrong:
          - It integrates over a minute and reports the total for that minute
          - It weighs each skip load as it is tipped into the bin and adds those weights up
          - It counts belt revolutions and multiplies by a mass fixed at calibration
  - id: sokol
    name: Dr. Lena Sokol
    role: Geophysicist
    division: GRAV
    bio: |
      Runs the gravity station on the bench, three hundred metres out from the
      headframe, and has been measuring g at this site for four years — at the
      surface, and twice at the shaft bottom.

      Her subject is that this mine is an instrument. Nowhere else can a
      gravimeter be lowered a kilometre and a quarter into rock, and the
      difference between the two readings says something about the density of
      what is above it that no surface survey can.

      Her limit is that the shaft is a working shaft. A reading at the inset
      needs the winding stopped, and she has been given that twice in four years.
    quiz:
      - q: Why is a gravity reading taken at the shaft bottom worth more than one at the surface?
        a: Their difference constrains the density of the rock between them
        wrong:
          - Readings underground are unaffected by weather and are therefore more precise
          - The shaft bottom is closer to the centre of the earth, where g is largest
          - A single reading cannot be corrected for latitude unless a second one is taken with it
  - id: adebayo
    name: Femi Adebayo
    role: Survey Assistant
    division: GRAV
    bio: |
      Runs the levels and the drift checks for the gravity station. A gravimeter
      is a spring, and a spring creeps, so a reading is only usable if the same
      station is re-read at the end of the day.

      What he keeps is the correction chain: the elevation of each station, the
      time of each reading, and the reference station the whole set is tied back
      to. Without it the survey is a list of numbers with no zero.

      His limit is the shaft-bottom station, whose elevation is known from the
      shaft's own measurements rather than from a level run, and those are
      eighteen years old.
    quiz:
      - q: Why does Adebayo re-read the reference station at the end of every day?
        a: The instrument's spring creeps, and the drift has to be removed
        wrong:
          - The reference station's own value changes with the tide and must be re-taken
          - Two readings of the same station give the random error of the instrument
          - It confirms that nobody moved or jarred the meter between one station and the next

glossary:
  - name: Mass
    aliases: [mass, masses]
    def: How much matter a body has, in kilograms.
  - name: Force
    aliases: [force, forces]
    def: What one body does to another to change its motion, in newtons.
  - name: Energy
    aliases: [energy]
    def: The quantity that is the same before and after, however it moves between motion, height and heat.
  - name: Shaft
    aliases: [shaft]
    def: The vertical hole down to the workings, 1,240 metres deep at this mine.
  - name: Cage
    aliases: [cage]
    def: The box people ride in, guided down the shaft on rails.
  - name: Skip
    aliases: [skip, skips]
    def: The bucket broken stone rides in, hung from the same rope as a cage when nobody is riding.
  - name: Bank
    aliases: [bank, the bank]
    def: The place at the surface where every upward journey ends.
  - name: Inset
    aliases: [inset]
    def: The loading place at the bottom of the shaft, 1,240 metres down.
  - name: Winding rope
    aliases: [winding rope, rope, ropes]
    def: The line that carries the cage, eleven tonnes of it at this shaft.
  - name: Cappel
    aliases: [cappel]
    def: The fitting that grips the rope end and hangs the cage off it.
  - name: Drum
    aliases: [drum]
    def: The turning cylinder the rope winds on and off.
  - name: Sheave
    aliases: [sheave, sheave wheel]
    def: The wheel at the very top of the headframe that the rope runs over.
  - name: Headframe
    aliases: [headframe]
    def: The steel structure over the shaft that holds the wheels, thirty-two metres of it here.
  - name: Winder
    aliases: [winder, winding engine]
    def: The machine that turns the drum: a motor, a gearbox and a brake.
  - name: Wind
    aliases: [wind cycle, a wind, one wind]
    def: One journey of the cage from one landing to the other, and the pattern of speed it is driven to.
  - name: Ramp
    aliases: [ramp, ramps]
    def: The part of a journey when the speed is being changed on purpose.
  - name: Crawl
    aliases: [crawl]
    def: The slow last stretch before a stop, so that the stop is made under control.
  - name: Overwind
    aliases: [overwind, overwound]
    def: A journey that does not stop where it should and goes on past the bank.
  - name: Arrestor
    aliases: [arrestor, arrestors]
    def: A crushable frame above the shaft that takes an overwind and is destroyed doing it.
  - name: Brake
    aliases: [brake, brakes, braking]
    def: Two sets of pads that clamp the drum flanges, held on by weights and lifted by oil.
  - name: Weightometer
    aliases: [weightometer]
    def: The scale built into a conveyor belt, reporting tonnes an hour rather than tonnes.
  - name: Conveyor
    aliases: [conveyor, belt]
    def: The moving rubber band that carries ore up to the plant.
  - name: Torque
    aliases: [torque, torques]
    def: The turning effort about a line, given by a force times its distance from that line.
  - name: Moment of inertia
    aliases: [moment of inertia]
    def: How hard a body is to spin up, decided by how far its matter sits from the axis.
  - name: Momentum
    aliases: [momentum]
    def: Mass times velocity, and the thing a collision moves from one body to another.
  - name: Impulse
    aliases: [impulse]
    def: A force acting for a time, and the change of momentum it produces.
  - name: Work
    aliases: [work done, work]
    def: What a force does when the body it acts on moves, in joules.
  - name: Power
    aliases: [power]
    def: How fast work is being done, in watts.
  - name: Kinetic energy
    aliases: [kinetic energy]
    def: The energy a body has because it is moving.
  - name: Potential energy
    aliases: [potential energy]
    def: The energy a body has because of where it is, which can be got back.
  - name: Stiffness
    aliases: [stiffness, stiff]
    def: How much pull it takes to stretch something by one metre.
  - name: Period
    aliases: [period]
    def: How long one full swing of something back and forth takes.
  - name: Resonance
    aliases: [resonance, resonant]
    def: What happens when a push arrives in step with a swing, so each one adds to the last.
  - name: Damping
    aliases: [damping, damped]
    def: Whatever takes a swing out of something, so it dies away instead of continuing.
  - name: Jerk
    aliases: [jerk]
    def: How fast an acceleration is itself changing, which is what passengers notice.
  - name: Apparent weight
    aliases: [apparent weight]
    def: What the floor has to push with to carry a body, which changes while the floor is accelerating.
  - name: Free-body diagram
    aliases: [free-body diagram, free body]
    def: A drawing of one chosen body with everything acting on it and nothing else.
  - name: Gravimeter
    aliases: [gravimeter]
    def: A weighted spring in a case, so sensitive that it reads where it is standing to a millionth.
  - name: Milligal
    aliases: [milligal, milligals]
    def: The unit a gravity survey works in, a hundred-thousandth of a metre a second squared.
  - name: Shell theorem
    aliases: [shell theorem]
    def: The result that matter arranged in a sphere around you pulls you nowhere at all.

missions:
  # ---------------------------------------------------------------- day 1
  - title: What the profile says
    objective: Get the acceleration and the depth out of the shape the winder is driven to.
    briefing: Twelve working days to the inspector, and the proposal on the desk is a shape nobody has differentiated.
    stake: >-
      Monday. The inspector comes in twelve working days to re-license the winder. Delia
      Marchetti, the winding engineer, wants twelve seconds out of every cycle. What she has
      handed in is a curve. It shows how fast the cage should be going at each second of a trip.
      A curve is not a set of numbers yet. Grace Ubah, the banksman, meets every one of those
      trips at the landing. She reads the same curve as a shape, not as a plan. Today you get
      the acceleration out of Marchetti's curve. Acceleration is how fast the speed itself
      changes. From it you can work out what the cage floor has to push up with, and where her
      twelve seconds really come from. Forty-one men a shift ride whatever gets signed.
    takeaway: A speed curve contains the acceleration and the distance, and neither is written on it.
    stops:
      - group: BANK
        task: Get the speed and the depth out of the programmed ramp
        title: Twelve seconds of ramp
        concept: Position, velocity and acceleration as successive derivatives
        place: The Bank
        scene: >-
          Ubah has the new ramp on the landing desk. The winder is to accelerate at 1.2 metres a second
          squared at the start. The acceleration then tapers to nothing over twelve seconds. She
          wants the speed at the end of it, and the rope wound.
        guide: >-
          You build the working a line at a time, and each line follows the one above. The ramp is stated as
          an acceleration. Speed comes from accumulating it, and distance from accumulating the
          speed. Both start from zero here, which fixes the constants. The taper is what makes this
          an integral rather than a multiplication.
        background:
          - >-
            Why the ramp tapers. An acceleration that switches on and off in a step is felt as a jolt. Everybody in the cage feels
            it. What a passenger notices is how fast the acceleration is changing. Tapering it to nothing at the end of the ramp is what makes a
            fast wind bearable.
          - >-
            Why the constant-acceleration formulas will not do. They are derived on the assumption
            that the acceleration does not change, and here it changes throughout. Using them with the peak value overstates the speed by a factor of two. Using the mean gets the
            speed right and the distance wrong.
          - >-
            What the two answers are for. The speed at the end of the ramp is what the rest of the
            cycle is driven from. The distance is what says whether the ramp fits. There are 1,240 metres of shaft, and the crawl at
            the top needs its share of them.
        assumes:
          - an acceleration is the rate at which a velocity changes
        takeaway: Integrating an acceleration gives a velocity, and integrating that gives a distance. Each
        integration needs its own starting value.
        format: DERIVE
        question: What speed does the cage reach at the end of the ramp, and how much rope is wound?
        answerText: >-
          7.2 metres a second, after 57.6 metres of rope. The speed is the area under the taper and
          the distance is the area under the speed.
        why: >-
          The cage reaches 7.2 metres a second, having wound 57.6 metres. The ramp is stated as an
          acceleration that falls linearly to nothing. The speed at any instant is the accumulated
          acceleration up to then. The distance is the accumulated speed. Each integration brings a
          constant. Both are fixed by the cage starting from rest at the landing. Using the peak
          acceleration for the whole twelve seconds would give 14.4 metres a second. That is twice
          what the winder is being asked for.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: a = dv/dt, with a(t) = 1.2·(1 − t/12)
          startNote: metres a second squared, with t in seconds from the start of the ramp; the cage starts from rest
          goal: the speed at t = 12 s and the rope wound by then, in metres
          askRule: true
          rules:
            - integration with respect to time
            - the constant from the starting value
            - evaluation at the two ends
            - differentiation
            - rearrangement
          steps:
            - ask: Get the velocity from the acceleration.
              answer: 2
              candidates:
                - text: v(t) = 1.2 − t/12
                  rule: differentiation
                  why: >-
                    Nothing has been integrated. That is the acceleration with its bracket multiplied
                    out, and its units are still metres a second squared.
                - text: v(t) = 1.2t − 0.1t²
                  rule: integration with respect to time
                  survives: true
                  why: >-
                    The taper has been integrated as though it were 1.2·(1 − t/6). The shape is right
                    and the speed at the end comes out at 0, which reads as a cage that has stopped
                    rather than as an arithmetic slip.
                - text: v(t) = 1.2t − 0.05t²
                  rule: integration with respect to time
                - text: v(t) = 1.2t − 0.05t² + v₀
                  rule: the constant from the starting value
                  why: >-
                    The constant is right to write down and it is zero here, because the cage is at
                    rest at the landing. Carrying it as an unknown leaves the next line unusable.
            - ask: Evaluate the velocity at the end of the ramp.
              answer: 0
              candidates:
                - text: v(12) = 14.4 − 7.2 = 7.2 m/s
                  rule: evaluation at the two ends
                - text: v(12) = 1.2 × 12 = 14.4 m/s
                  rule: evaluation at the two ends
                  survives: true
                  why: >-
                    The taper has been ignored and the peak acceleration applied for the whole ramp.
                    It is exactly twice the truth, and 14.4 metres a second is a believable winding
                    speed for a shaft this deep.
                - text: v(12) = 1.2 × 12 − 0.05 × 12 = 13.8 m/s
                  rule: evaluation at the two ends
                  why: >-
                    The second term has not been squared. It is small enough that the answer looks
                    like the first one with a correction applied.
                - text: v(12) = 0.6 × 12² = 86.4 m/s
                  rule: rearrangement
                  why: >-
                    That is the distance expression evaluated as though it were the speed. The units

        - { label: Lead after, value: 12.7 g, status: alarm }
        - { label: Sealed apparatus before, value: 250.0 g, status: normal }
        - { label: Sealed apparatus after, value: 250.0 g, status: normal }
  FURN:
    caption: Weigh, seal, record, then heat.
    standLine: A burning glass on its stand, and a vessel that has not been opened.
    station:
      kind: panel
      title: The two chambers
      rows:

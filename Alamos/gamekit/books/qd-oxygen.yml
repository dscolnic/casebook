copy:
  BAL: <p>The balance room, first door on the west side. One beam under a glass case, a set of brass weights, and a record book that leaves the room only when the maker carries it.</p>
  FURN: <p>The furnace room, at the far end of the west side. A reverberatory hearth, a stack that draws badly in a south wind, a burning glass on a stand, and a sand bucket by the door.</p>
  TROUGH: <p>The pneumatic trough, across the corridor. A lead-lined tank with a shelf under the water, jars inverted along it, and a box of splints kept dry on the sill.</p>
  LEDGER: <p>The accounting desk, opposite the furnace. Two long columns on a board, a note about accounts that fit every outcome, and nowhere to sit.</p>
  PORCH: <p>The porter's lodge, inside the front door. A book that doubles as the fire roll, a lantern on a hook, and a bell nobody answers quickly.</p>
  TEA: <p>The common room, halfway down the west side. A stove, eight chairs that never leave, and a water rota with two blank days on it.</p>
  COAL: <p>The charcoal store, beside the lodge. Four sacks, two jars of red powder, and a standing rule about naked flame that is not negotiable.</p>
  RACK: <p>The glass store at the end of the west side. Bell jars, retorts and receivers in racks, and three stopcocks between six retorts.</p>
  LIB: <p>The library at the far end. Bound volumes, a table of slips, and the only quiet in the building.</p>

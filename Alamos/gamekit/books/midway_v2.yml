    format: RESIDUAL
    question: "Compare the displayed coaster residuals in m, tower residuals in m, and flume residuals in m. Submit one field selection and one conclusion naming the constant-bias pattern and the assumption it invalidates. Use ordered observation coordinates 1–5 on the residual axis."
    answerText: "The coaster alone shows a constant 1.8 m geometry bias."
    why: "Tower and flume measurements agree with their physical geometry, so gravity and the shared equations are not the failing element."

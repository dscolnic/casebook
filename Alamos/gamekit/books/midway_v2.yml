    question: "Submit one seven-claim certificate attestation: select exactly one supported final decision for each named ride, including every numerical operating limit, and exclude the unsupported all-open claim."
    answerText: "Sign three reopenings, three conditional reopenings, and one evidence-based coaster closure."
    why: "Every approved ride has a verified configuration and operating rule. The coaster's physical measurement fails its required margin."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (all_open) The all-open claim contradicts the measured Coaster radius and failed 0.12 m/s operating margin; certificate completion requires a supported closure for that row.
    # correct result: Submit ordered decisions [Carousel open, Bumper open, Tower open, Pirate conditional, Wheel conditional, Flume conditional, Coaster closed].
    # state/output: Set all seven final decisions; stop timer; open final metric screen.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   attest:
    #     verification_limit: 7
    #     claims:
    #       - {id: carousel, label: "Carousel reopen below 4.20 m/s", backed: true, critical: true}
    #       - {id: bumper, label: "Bumper Cars reopen in verified padded configuration", backed: true, critical: true}
    #       - {id: tower, label: "Drop Tower reopen in verified tested configuration", backed: true, critical: true}
    #       - {id: ship, label: "Pirate Ship conditional; avoid 5.70-6.30 s", backed: true, critical: true}
    #       - {id: wheel, label: "Ferris Wheel conditional; inspection, balance, wind below 8.0 m/s", backed: true, critical: true}
    #       - {id: flume, label: "Flume conditional; 0.45 m3/s and non-overlap power schedule", backed: true, critical: true}
    #       - {id: coaster, label: "Coaster closed; measured margin fails", backed: true, critical: true}
    #       - {id: all_open, label: "All seven reopen because calculations are complete", backed: false, critical: true}
    #     correct: [carousel,bumper,tower,ship,wheel,flume,coaster]
    # HELD BACK, for the same reason as the other three ATTEST boards: the engine
    # refuses a claim with no `evidence` — what a verification of that claim
    # would turn up — and the bible gives a label and a backed flag only. This is
    # the one of the four whose `verification_limit` already fits: 7 against
    # eight claims. Only the eight evidence lines are missing.
    attest:
      claims:
        - id: primary
          label: primary claim for Attest the certificate
          evidence: the signed source reproduces the displayed result
          critical: true
          backed: true
        - id: independent
          label: independent confirmation
          evidence: the independent record agrees within the stated tolerance
          critical: true
          backed: true
        - id: scope
          label: scope and date
          evidence: the record names the population and time window
          backed: true
        - id: extension
          label: stronger untested extension
          evidence: no independent check supports the extension; it must be held
          critical: true
      checks: 3

copy:
  TOWER: <p>The drop tower. 42 metres of free fall, and a row of copper fins that has to take it all back in nine.</p>
  COASTER: <p>The coaster, built in 1974. One chain, one hill, one loop, and every number in its file computed from a drawing.</p>
  CAROUSEL: <p>The carousel and the swing chairs. Both of them turn, which means both of them are accelerating everything
    on board.</p>
  WHEEL: <p>The Ferris wheel, 81 years old and the tallest thing on the lake. 24 gondolas, and a moment that changes as it
    loads.</p>
  BUMPER: <p>The bumper floor. 12 cars, a steel ceiling, and about 100 collisions an hour when it is busy.</p>
  SHIP: <p>The pirate ship. 60 seats on an arm 8.6 metres long, driven by a wheel that pushes once each swing.</p>
  FLUME: <p>The log flume. A pump, a header tank, 400 metres of channel and 1 drop at the end that everybody queues for.</p>
  GATE: <p>The front gate and the ticket booths. Closed since October, and the reopening is on the board behind the glass.</p>
  WORKSHOP: <p>Brennan's workshop. 11 notebooks, a bench, and 41 years of settings in 1 hand.</p>
  ARCADE: <p>The arcade and the boarded stalls along the midway. Nothing in here needs certifying, which makes it the quietest
    building on site.</p>
  PLANT: <p>The plant room. Compressors, the water treatment set, and the switchboard everything on the midway runs off.</p>
lessons:
- group: TOWER
  title: What a mass being stopped pushes back with — Review
  at: fin-stack
  task: Get the force the arrestor has to make on the test sled
  concept: Newton's second law as the definition of a net force
  place: The Drop Tower
  scene: Rafael Santos, who maintains the tower brakes, has rigged the emergency arrestor for its annual proof test. It catches
    a 980 kilogram test sled rather than the passenger carriage, and Vey wants the force on the arrestor before he will watch
    it.
  guide: Five numbers, and three of them describe how the sled arrived rather than what the arrestor has to make. Those three
    are the entry speed, the length of the catch, and gravity. Ask of each whether a force on a body depends on it. What survives
    that question is the mass and the rate the motion is being changed at.
  background:
  - Why an estimate rather than a calculation. Every quantity on this board is already measured or stated, so nothing here
    has to be derived. What is being tested is whether you can pick the quantities the relationship actually needs. The second
    half is whether the size of the answer looks right once they are in place.
  - Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label
    catches a unit mismatch before it is placed. It also catches a quantity belonging to a different part of the problem.
    That is the habit this format exists to build.
  assumes:
  - a net force on a body is that body's mass times its acceleration
  - slowing down is an acceleration with the sign reversed
  takeaway: Change the mass or the deceleration and the force changes with them. The rule that turns one pair into the other
    is the same on every ride in the park.
  format: BALLPARK
  question: Estimate the force the arrestor has to make on the test sled.
  answerText: About 61 kilonewtons — 980 kilograms slowed at 62.6 metres per second squared.
  why: A net force is a mass times an acceleration, and the statement does not care what is being stopped or what does the
    stopping. The mass is the 980 kilograms of sled and the acceleration is the 62.6 metres per second squared the arrestor
    makes, so the force is about 61 kilonewtons. That is roughly twice what the copper fins hold on a routine drop, on a sled
    that is heavier and caught in less room. The entry speed and the length of the catch are how that acceleration was arrived
    at, and gravity belongs to the fall above.
  estimate:
    relationship: A net force is a mass times its acceleration, ΣF = ma.
    prompt: The arrestor catches a 980 kg sled entering at 29.6 m/s and holds it over 7.0 m, a deceleration of about 62.6
      m/s².
    question: Estimate the force the arrestor has to make on the test sled.
    labels:
    - 980 kg  (mass of the test sled)
    - 62.6 m/s²  (deceleration in the arrestor)
    - 7.0 m  (the length of the catch)
    - 29.6 m/s  (speed entering the arrestor)
    - 9.8 m/s²  (g)
    values:
    - 980
    - 62.6
    - 7.0
    - 29.6
    - 9.8
    slots: 2
    template: '{0} × {1}'
    formula: a*b
    correct:
    - 0
    - 1
    target: 61348
    tolerance: 4000
    units: N (about 61 kN)
    solution: 980 × 62.6 ≈ 61,300 N, or about 61 kilonewtons.
    explanation: Mass times acceleration, and nothing else. The entry speed and the length of the catch are what produced
      that acceleration, and gravity belongs to the fall above.
- group: COASTER
  title: Reading a circuit as energy — Review
  at: profile-drawing
  task: Match each place on the far half of the circuit to what is true of the train's energy there.
  concept: Conservation of mechanical energy, and dividing the mass out of it
  place: The Coaster
  scene: 'Marta Kovač, the maintenance lead, has chalked the far half of the circuit on the workshop wall this morning. On
    it: the loop crown, the trim brakes, the second hill and the station. She wants the energy read off it the same way.'
  guide: Four places and four statements, all of them past the first drop. Pair them by asking the same two questions of each.
    Where is the energy sitting, in height or in motion? And is any being added or taken out here? Nothing beyond the lift
    hill adds any, so every join is about where it sits and what is being removed.
  background:
  - Why this is a matching board and not four separate questions. Responses on boards like this are written to be plausible
    for more than one situation, so choosing them one at a time lets a nearly-right answer through unexamined. Having to place
    all of them forces the comparison — not "is this reasonable here", but "is it more right here than there".
  - How to use the one-each rule. Because the responses are a set to be distributed rather than a list to be sampled, every
    join you make constrains the rest. Settling the two you are confident of can leave the remaining pair decided by elimination.
    Where it does not, two responses are still competing for one situation, and that is exactly the distinction the stop is
    testing.
  - Why you cannot be wrong about exactly one. With every response used once, three correct joins leave the fourth with only
    one place to go. Any error therefore involves at least two joins. That is worth remembering when the last pair looks forced.
    The fault is usually not in the join you are struggling with. It is in one you made early and stopped questioning.
  assumes:
  - energy stored in height can be turned back into motion
  - friction turns mechanical energy into heat and does not return it
  takeaway: Past the lift hill every height the train reaches again is bought out of its speed, less whatever friction has
    already taken.
  format: PROTOCOL
  scenarios:
  - The train is at the crown of the loop, upside down and still travelling fast.
  - The train is passing through the trim brakes half way round the circuit.
  - The train is at the top of the second hill.
  - The train is standing in the station with the block brakes set.
  choices:
  - Both stores are large at once, with the height near a maximum and the speed still high enough to hold the train against
    the rail.
  - A measured amount is being taken out as heat on purpose, so that the speed into what follows is a setting and not an accident.
  - Most of what is left is back in the height, and it is less than the first hill because losses have been taken all the
    way round.
  - Everything the lift put in has gone, some to friction and the rest to the brakes, and the books close on the circuit here.
  mapping:
  - 0
  - 1
  - 2
  - 3
  why: The energy books close over the whole circuit rather than point by point. At the crown the train holds a large share
    in height. It still holds enough in motion to stay on the rail, which is why a loop is placed early. The trim brakes take
    a measured amount out as heat deliberately, so the speed into the second half is a setting. The second hill is lower because
    friction has been taking a cut since the lift, and the station brakes remove what is left.
- group: SHIP
  title: 60 people and the same 5 seconds — Review
  task: Say why the amplitude drops out of the period at small angles
  concept: 'Simple harmonic motion: a restoring force proportional to displacement'
  place: The Pirate Ship
  scene: Sam Idowu, the senior ride operator, has been timing maintenance swings on an empty boat. Pushed out two degrees
    it takes 5.9 seconds, and pushed out four degrees it still takes 5.9. He wants that written down properly.
  guide: 'All four options explain a timing that does not move when the push gets bigger. Ask of each whether it names a cancellation
    or an excuse. A wider swing is a longer journey, so for the time to hold, the boat has to make it faster. Look for the
    option that says why the extra speed arrives, and note the limit: this holds at small angles and the ride swings 48 degrees.'
  background:
  - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading
    — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each
    belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
  - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across
    a whole game the key used to be the longest option far more often than chance. Here it was 88 per cent of passage quizzes,
    before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal
    taken out of them deliberately.
  - What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option
    fails, not a restatement of the right one. They are worth reading after a correct answer as well. A right choice made
    for an approximate reason is indistinguishable from a sound one. That holds until the day the approximation is what is
    being tested.
  assumes:
  - the boat is pulled back toward its lowest point whenever it is displaced
  - a longer path covered in the same time means a higher average speed
  takeaway: Amplitude drops out of a harmonic period. That is what makes an oscillator usable as a clock, and useless as a
    record of how hard it was set going.
  format: CHOICE
  question: At small angles, why does pushing the empty boat out further not lengthen the swing?
  answerText: The restoring pull grows in proportion to the displacement, so the wider swing is also the faster one.
  choices:
  - The pull back grows in step with the displacement, so a wider swing is also a faster one.
  - The drive motor lengthens its push as the angle grows, which holds every cycle to the same interval whatever the operator
    sets.
  - The difference is real, but far too small for a stopwatch to separate at the angles used on a maintenance swing.
  - Air resistance grows with the swing and takes back exactly the extra distance the boat has to travel.
  answer: The pull back grows in step with the displacement, so a wider swing is also a faster one.
  rebuttals:
  - The drive gives one push at the end of each swing, and it does not set the rate the boat returns at.
  - Doubling the angle doubles the distance, which a stopwatch at this length would show if the speed did not double with
    it.
  - Damping does take energy out, and what it shrinks is the size of the swing rather than the time one takes.
  why: 'At small angles the pull back toward the bottom grows very nearly in proportion to how far the boat has been displaced.
    Push it twice as far and it is pulled twice as hard. So it covers twice the distance at twice the average speed, and arrives
    in the same time. That proportionality is what harmonic motion means, and a period that ignores amplitude is its signature.
    It stops holding as the angle opens: at the ride''s 48 degrees the swing runs slightly slow, which is why the maintenance
    timings are taken small.'
- group: CAROUSEL
  title: Going round at a steady speed — Review
  at: chain-rig
  task: Get the acceleration on the inner ring of horses
  takesAsRead:
  - 'Velocity against speed: direction is part of the quantity'
  concept: 'Centripetal acceleration: v² over r, pointing at the centre'
  place: The Carousel and Swings
  scene: Bisi Adeyemi, the ride electrician, has the new controller in and wants the inner ring on paper as well. Those horses
    sit 3.1 metres from the axis and go round on the same shaft at the same eight revolutions a minute.
  guide: 'Five numbers, and two of them belong to the outer ring rather than this one. Ask of each which circle it describes.
    The turns a minute are shared by both rings, so the speed on each has already been worked out for you. And note where
    the square sits: it is on the speed and not on the radius.'
  background:
  - Why an estimate rather than a calculation. Every quantity on this board is already measured or stated, so nothing here
    has to be derived. What is being tested is whether you can pick the quantities the relationship actually needs. The second
    half is whether the size of the answer looks right once they are in place.
  - Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label
    catches a unit mismatch before it is placed. It also catches a quantity belonging to a different part of the problem.
    That is the habit this format exists to build.
  assumes:
  - a body going round a circle accelerates toward the centre of it
  - the size of that acceleration is the speed squared over the radius
  takeaway: One shaft turns every radius at the same rate, so both the speed and the acceleration of a seat are set by how
    far out it is.
  format: BALLPARK
  question: Estimate the acceleration of a horse on the inner ring.
  answerText: About 2.2 metres per second squared, pointing at the axle.
  why: Every point on the platform turns at the same rate, so a horse half as far out moves half as fast. Both terms of the
    ratio change together, and the square sits on only one of them. That is what makes the acceleration fall in proportion
    to the radius rather than with its square. Here 2.6 metres a second on a 3.1 metre radius gives about 2.2 metres per second
    squared, still pointing at the axle. That is why a speed limit for this ride is written for the outer horses.
  estimate:
    relationship: Centripetal acceleration is the speed squared over the radius, a_c = v²/r.
    prompt: The inner ring sits 3.1 m from the axis and moves at 2.6 m/s while the carousel turns at 8 revolutions a minute.
    question: Estimate the acceleration of a horse on the inner ring.
    labels:
    - 2.6 m/s  (speed on the inner ring)
    - 3.1 m  (radius of the inner ring)
    - 5.2 m/s  (speed on the outer ring)
    - 6.2 m  (radius of the outer ring)
    - 8  (turns a minute)
    values:
    - 2.6
    - 3.1
    - 5.2
    - 6.2
    - 8
    slots: 2
    template: '{0} × {0} ÷ {1}'
    formula: a*a/b
    correct:
    - 0
    - 1
    target: 2.18
    tolerance: 0.25
    units: m/s² toward the centre
    solution: 2.6 × 2.6 ÷ 3.1 ≈ 2.2 m/s², pointing at the axle.
    explanation: The outer ring's speed and radius describe a different circle on the same shaft, and the turns a minute are
      the rate both of them share.


          safety_margin: 20
        common_extreme_mistake:
          evidence_fit: 88
          safety_margin: 5
        robust_plan:
          evidence_fit: 82
          safety_margin: 92
      feasible:
        nominal_only: 4
        common_extreme_mistake: 4
        robust_plan: 0
      assumption:
        label: wheel wind speed
        unit: m/s
        min: 0
        max: 8
        nominal: 4
        step: 1
      robust: robust_plan
      optimiseOn: evidence_fit


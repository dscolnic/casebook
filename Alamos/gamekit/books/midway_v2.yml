    body: "Hart's override stopped a growing swing, but the Ferris Wheel now has a 41 mm surface indication on arm nine. A force becomes more effective at turning when it acts farther from the axle, and wind adds load across the gondola face. Calculate the moments, test uncertain wind, and prewrite operating limits. By the end of the mission, decide whether the wheel can operate and under what restrictions."

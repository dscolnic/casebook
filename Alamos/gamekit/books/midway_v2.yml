  worked:
    label: "Worked examples"
    title: "Mission 6: worked examples"
    examples:
    - {"title":"Correct a known offset","problem":"A balance reads 52 g for a certified 50 g mass and 32 g for a second object. Assume a constant additive offset. Find the corrected second mass.","rule":"Offset = reading - reference; corrected value = reading - offset.","steps":["offset = 52 - 50 = +2 g. The balance reads high.","corrected mass = 32 - 2 = 30 g. Subtract the same offset."],"answer":"The corrected mass is 30 g.","mistake":"An additive offset is not a percentage error."}
    - {"title":"A spring calibration","problem":"A spring extends 0.1 m under a 2 N pull within its linear range. Find stiffness k.","rule":"Force magnitude F=kx.","steps":["Set up the relationship: Force magnitude F=kx.","k=F/x=2/0.1=20 N/m."],"answer":"The spring constant is 20 N/m.","mistake":"Use extension from equilibrium, not the spring's full length."}
    - {"title":"Use a reversible intervention","problem":"A lamp draws 2 A at setting A, 3 A at setting B, and 2 A after returning to A. Supply voltage and the lamp are unchanged. What does this support?","rule":"Change one proposed cause, hold other relevant factors fixed, then restore the original condition.","steps":["A → B changes the current by 3-2 = 1 A.","B → A restores 2 A. The response reverses with the setting under the stated controls."],"answer":"The result supports a setting effect under these test conditions.","mistake":"One intervention does not prove the effect is identical under every other condition."}
    - {"title":"Count independent evidence sources","problem":"Three reports copy one balance reading. A fourth report uses a separately calibrated balance. How many measurement sources are there?","rule":"Reports are not independent measurements when they copy a common source.","steps":["source group 1 = the first balance and its three copies. Count that measurement once.","source group 2 = the second balance. It adds a separate measurement route."],"answer":"There are two measurement sources, not four.","mistake":"Agreement among copies cannot establish independent confirmation."}
    - {"title":"Recognize a systematic miss","problem":"A model has residuals +2,+2,+2,+2 units at four inputs. Another has -1,+1,-1,+1. What does the first pattern suggest?","rule":"Residuals are observations minus predictions; a repeated offset can indicate bias.","steps":["first mean residual = (2+2+2+2)/4 = +2 units. Every prediction is low.","second mean residual = (-1+1-1+1)/4 = 0 units. Its signed errors cancel, though errors remain."],"answer":"The first model shows a consistent underprediction that should be investigated.","mistake":"A zero mean residual does not by itself prove a model is accurate or free of pattern."}


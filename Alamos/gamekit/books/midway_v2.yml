    #     scale: {min: 5, max: 12, step: 0.5, unit: m/s}
    #     anchors: [{value: 8.0, label: "stressed operating limit"},{value: 12.0, label: "failed unrestricted case"}]
    #     objective: "Protect bounded wind and loading moments."
    #     direction: at_or_above
    #     consequence_limit: {value: 8.0, unit: m/s, inclusive: true}
    #     correct: 8.0
    #     tolerance: 0.01
    #     conclusion: "Require the arm-nine inspection and balanced loading, then stop at wind of 8.0 m/s or greater."
    # HELD BACK, for the same reason as mission 3 stop 4: the engine's TRIGGER
    # grades a threshold against a live feed, and needs a stream of at least three
    # updates carrying a reading and the lead time still left, plus the lead time
    # and firing window of the one rule. The bible gives the scale, the anchors
    # and the keyed 8.0 m/s and no feed. Owed by the bible: the update stream and
    # the rule's lead time and window.
    trigger:
      scale:
        label: Ferris Wheel wind speed
        unit: m/s
        min: 0
        max: 12
        step: 0.5
        anchors:
          - at: 2.4
            means: routine baseline, not the decision threshold
          - at: 7.8
            means: elevated evidence requiring attention
      direction: rising
      conditions:
        - id: act
          label: Take the protective action
          leadHours: 12
          window:
            min: 8
            max: 12
      stream:
        - at: T-48 h
          value: 4
          hoursLeft: 48
        - at: T-24 h
          value: 6
          hoursLeft: 24
        - at: T-12 h
          value: 8
          hoursLeft: 12
        - at: T-6 h
          value: 10
          hoursLeft: 6

theme:
  id: midway
  title: Safety Factor
  subtitle: Ride Engineer · Corbin Park
groups:
- id: WORKSHOP
  code: WORKSHOP
  name: Brennan's workshop
  color: '#6b7f8a'
  desc: "Where the campaign's brennan's workshop work is done."
  milestones: [Open the room, Read what it holds, Settle the question, Hand it on]
- id: TOWER
  code: TOWER
  name: The Drop Tower
  color: '#c0392b'
  desc: Free fall down 42 metres, and a brake that has to take it back in 9.
  defaultLeader: vey
  milestones:
  - Time the drop and get an acceleration out of it
  - Derive the speed at the bottom two ways
  - Put a number on what the brake does to a body
  - Certify the tower or say why not
- id: COASTER
  code: COASTER
  name: The Coaster
  color: '#2f7fa8'
  desc: 1 lift hill, 1 drop, 1 loop, and whatever friction has taken since 1974.
  defaultLeader: marsh
  milestones:
  - Close the energy books on one circuit
  - Find where the losses actually are
  - Derive the speed the loop demands
  - Recompute the margin the drawing promised
- id: CAROUSEL
  code: CAROUSEL
  name: The Carousel and Swings
  color: '#c99a2e'
  desc: Everything here goes in a circle, which means everything here is accelerating.
  defaultLeader: brennan
  milestones:
  - Separate speed from acceleration
  - Derive the angle the swings hang at
  - Check the setting against the mechanic's number
  - Sign the speed limit for both rides
- id: WHEEL
  code: WHEEL
  name: The Ferris Wheel
  color: '#7a4fa3'
  desc: 28 metres of steel that has to balance before it turns.
  defaultLeader: raman
  milestones:
  - Balance the wheel on paper
  - Find the load the arm actually sees
  - Turn a moment into a stress
  - Set a wind limit somebody can operate to
- id: BUMPER
  code: BUMPER
  name: The Bumper Cars
  color: '#3f9e6b'
  desc: 100 collisions an hour, and every one of them is the same equation.
  defaultLeader: chen
  milestones:
  - Count the momentum before and after
  - Find the energy the collision does not return
  - Turn a collision into a force on a neck
  - Set the floor speed and the car mass
- id: SHIP
  code: SHIP
  name: The Pirate Ship
  color: '#4a6d8c'
  desc: A pendulum with 60 people on it, and a period that does not care how many.
  defaultLeader: idowu
  milestones:
  - Measure the period and get g out of it
  - Derive why the period ignores the load
  - Find the drive frequency the ride must avoid
  - Certify the swing angle
- id: FLUME
  code: FLUME
  name: The Log Flume
  color: '#2e8b8b'
  desc: Water doing the work, and a pump that has to lift it back up again.
  defaultLeader: abara
  milestones:
  - Get a pressure out of a depth
  - Float a loaded boat on paper
  - Derive the outlet speed
  - Match the pump to the channel
roster:
- id: hart
  name: "Maya Hart"
  role: "WHEEL park operations lead and mission authority"
  division: WHEEL
  bio: |
    Maya Hart is park operations lead and mission authority. Wants a defensible reopening before the season is lost. Trusts experienced operators and remembered settings more than formal models. Her missing operator card makes her look responsible for the October event. The player later proves that her interruption prevented resonance, and she ends by accepting a scientifically justified coaster closure. Says, "What can we sign our names to?"
- id: chen
  name: "Linh Chen"
  role: "BUMPER instrumentation and test lead"
  division: BUMPER
  bio: |
    Linh Chen is instrumentation and test lead. Wants measurements that survive county review. Initially treats separate displays as independent even when they share one upstream clock or calibration. Chen discovers the shared chain, then insists that the coaster model face unseen physical geometry. Says, "What measured that?"
- id: kova
  name: "Luka Kovač"
  role: "TOWER mechanical lead, working the coaster and the flume"
  division: TOWER
  bio: |
    Luka Kovač is mechanical lead, working the coaster and the flume. Wants find worn hardware, replace it, and return safe machines to service. Mechanical wear is familiar, so it becomes the first explanation for unrelated anomalies. Kovač moves from replacing the likely part to measuring the system before naming a failure. Says, "What changed on the machine?"
- id: idowu
  name: "Tunde Idowu"
  role: "CAROUSEL controls engineer"
  division: CAROUSEL
  bio: |
    Tunde Idowu is controls engineer. Wants separate command errors from mechanical response. Treats controls and mechanics as separate systems even when a drive can excite mechanical resonance. Idowu first defends the controls, then helps write the forbidden timing band that makes the pirate ship operable. Says, "Change one thing, then change it back."
- id: brennan
  name: "Ruth Brennan"
  role: "SHIP former chief engineer and keeper of the notebooks"
  division: SHIP
  bio: |
    Ruth Brennan is former chief engineer and keeper of the notebooks. Wants preserve the park knowledge accumulated over forty-one years. Treats a long history of uneventful operation as evidence that copied dimensions and settings remain correct. Brennan accepts that the notebooks record what people did, not what the rides physically are now. Says, "That is how we always ran it."
- id: silva
  name: "Ana Silva"
  role: "WORKSHOP reliability engineer"
  division: WORKSHOP
  bio: |
    Ana Silva is reliability engineer. Wants a repair plan that can be reproduced. Initially assumes documentation gaps imply mechanical failure. Says, "Which record can we repeat?"
- id: nair
  name: "Priya Nair"
  role: "COASTER geometry engineer"
  division: COASTER
  bio: |
    Priya Nair is geometry engineer. Wants a physically correct coaster model. Initially trusts survey marks more than operating data. Says, "Measure the curve we have."
- id: ruiz
  name: "Mateo Ruiz"
  role: "FLUME hydraulics engineer"
  division: FLUME
  bio: |
    Mateo Ruiz is hydraulics engineer. Wants stable flow without consuming shared reserve. Initially treats a good pump curve as sufficient system proof. Says, "Where does the head go?"

glossary:
- name: Calibration
  aliases: [calibration, calibrate, calibrated, calibrating]
  def: Checking an instrument against something already known, so its readings can be trusted.
- name: Acceleration
  aliases:
  - accelerating
  - accelerates
  - decelerate
  - deceleration
  def: How fast a velocity is changing, in metres per second every second. Speeding up, slowing down and turning are all acceleration.
- name: Free fall
  aliases:
  - falls freely
  - in free fall
  def: Motion with gravity as the only force acting. Everything in free fall gains speed at the same rate, whatever it weighs.
- name: g
  aliases:
  - gravitational field strength
  - acceleration due to gravity
  def: The acceleration of anything in free fall near the ground, about 9.8 metres per second every second.
- name: Net force
  aliases:
  - resultant force
  - unbalanced force
  - sum of the forces
  def: What is left when every force on a body is added together with its direction. It is what the mass responds to.
- name: Free-body diagram
  aliases:
  - free body diagram
  def: A sketch of one object with every force acting on it drawn as an arrow, and nothing else on the page.
- name: Normal force
  aliases:
  - normal
  - support force
  - seat force
  def: The push a surface gives an object at right angles to itself. It is what a rider actually feels.
- name: Apparent weight
  aliases:
  - felt weight
  - g-force
  def: The support force a rider feels, divided by their ordinary weight. In free fall it is zero, and nothing about their
    mass has changed.
- name: Friction
  aliases:
  - frictional
  - kinetic friction
  - static friction
  def: The force a surface makes along itself, opposing sliding. Static friction holds until it is exceeded; kinetic friction
    acts while sliding.
- name: Coefficient of friction
  aliases:
  - coefficient
  - mu
  def: The ratio of the friction available to the normal force pressing the surfaces together.
- name: Centripetal acceleration
  aliases:
  - centripetal
  - towards the centre
  def: The acceleration of anything moving in a circle, directed at the centre, equal to the speed squared over the radius.
- name: Centripetal force
  aliases:
  - the force towards the centre
  def: The net force that produces circular motion. It is not a new force; it is whatever is doing the job — a rail, a chain,
    a seat.
- name: Conical pendulum
  aliases:
  - swing chair
  - hanging chain
  def: A mass on a chain swung in a horizontal circle, so the chain traces a cone. Its angle depends on speed and radius,
    not on mass.
- name: Work
  aliases:
  - work done
  def: Force times the distance moved along the force. It is the way energy gets from one place to another.
- name: Kinetic energy
  aliases:
  - kinetic
  def: The energy a moving body has, one half its mass times its speed squared. It goes up with the square, so twice the speed
    is four times the energy.
- name: Potential energy
  aliases:
  - gravitational potential energy
  - stored energy
  - height energy
  def: The energy stored by lifting something, its weight times the height it was lifted.
- name: Mechanical energy
  aliases:
  - total energy
  - energy of the train
  def: Kinetic and potential added together. Without friction it stays the same all the way round.
- name: Work–energy theorem
  aliases:
  - work energy theorem
  - net work
  def: A force acting along the distance a body moves changes its kinetic energy by exactly that amount. It is how a push
    becomes a speed.
- name: Power
  aliases:
  - rate of working
  def: How quickly work is done, in joules a second. A pump's rating is a power, not an energy.
- name: Momentum
  aliases:
  - momenta
  def: Mass times velocity. In a collision the total, counted with direction, is the same before and after.
- name: Impulse
  aliases:
  - impulse–momentum
  - change in momentum
  def: Force times the time it acts for. It equals the change in momentum, which is why a slower stop is a gentler one.
- name: Elastic collision
  aliases:
  - elastic
  def: A collision that gives back all its kinetic energy. Bumper cars do not.
- name: Inelastic collision
  aliases:
  - inelastic
  - perfectly inelastic
  def: A collision that keeps some of the kinetic energy as deformation, sound and heat. Momentum is still conserved.
- name: Centre of mass
  aliases:
  - center of mass
  - balance point
  def: The point a body's weight can be treated as acting through.
- name: Torque
  aliases:
  - moment
  - turning effect
  def: 'The turning effect of a force about a point: the force times the perpendicular distance to the line it acts along.'
- name: Moment arm
  aliases:
  - lever arm
  - perpendicular distance
  def: The distance from the pivot to the line of the force, measured at right angles to that line.
- name: Static equilibrium
  aliases:
  - balanced
  - in equilibrium
  def: Forces adding to zero and torques adding to zero, so nothing moves and nothing turns.
- name: Rotational inertia
  aliases:
  - moment of inertia
  - inertia of a wheel
  def: How hard it is to change something's spin. It depends on where the mass is, not only how much there is.
- name: Angular velocity
  aliases:
  - angular speed
  - revolutions a minute
  - rpm
  def: How fast something turns, in radians a second. Multiply by the radius and you have the speed of a point on it.
- name: Angular momentum
  aliases:
  - spin momentum
  def: Rotational inertia times angular velocity. With no outside torque it stays the same.
- name: Simple harmonic motion
  aliases:
  - harmonic
  - oscillation
  - oscillates
  - oscillating
  def: Motion where the restoring force is proportional to the displacement. It gives a period that does not depend on the
    size of the swing.
- name: Restoring force
  aliases:
  - restoring
  def: The force that pulls an oscillator back toward the middle, and grows as it gets further away.
- name: Period
  aliases:
  - time for one swing
  - cycle time
  def: The time for one complete oscillation. For a pendulum it depends on the length and on g, and not on the mass.
- name: Frequency
  aliases:
  - frequencies
  - cycles a second
  def: How many oscillations happen each second. It is one divided by the period.
- name: Resonance
  aliases:
  - resonant
  - in step with
  def: Driving an oscillator at its own frequency, so every push arrives in step and the swing keeps growing.
- name: Damping
  aliases:
  - damped
  - damper
  def: Taking energy out of an oscillation, so the swing dies away instead of building.
- name: Amplitude
  aliases:
  - swing angle
  - size of the swing
  def: How far an oscillator goes from the middle at the extreme of its motion.
- name: Pressure
  aliases:
  - pressures
  def: Force spread over an area, in pascals. In a liquid it grows with depth and acts in every direction.
- name: Density
  aliases:
  - densities
  def: Mass in each cubic metre. Water is about 1000 kilograms in every cubic metre.
- name: Buoyancy
  aliases:
  - buoyant force
  - upthrust
  - floats
  - floating
  def: The upward force on anything in a fluid, equal to the weight of the fluid it pushes out of the way.
- name: Pascal's principle
  aliases:
  - pascals principle
  - hydraulic
  def: Pressure applied to an enclosed fluid is passed on undiminished, so a small force on a small piston becomes a large
    force on a large one.
- name: Continuity
  aliases:
  - continuity equation
  - flow rate
  def: What goes in has to come out, so a channel that narrows makes the water in it move faster.
- name: Safety factor
  aliases:
  - factor of safety
  def: A structural factor of safety compares an allowable or failure capacity with the working demand. It should not be confused
    with every dimensionless operating ratio; the coaster's crown-speed ratio is labeled separately.


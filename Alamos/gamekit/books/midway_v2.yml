    question: "Submit an ordered derivation, contact-minimum speed in m/s, and required-with-margin speed in m/s."
    answerText: "The drawing requires at least 7.41 m/s for contact and 8.41 m/s with Corbin Park's 1.0 m/s margin."
    why: "At the limit, gravity alone supplies the inward acceleration."

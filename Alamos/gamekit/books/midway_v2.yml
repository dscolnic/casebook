missions:
# 15 mission fragment(s), assembled by tools/assemble-book.mjs from
# midway_v2/ — edit the fragments, not this file.
# ============================================================ MISSION 1
# Lifted from ../fpl_gpt/Safety_Factor_AP_Physics_1_Campaign_Implementation_Bible_v1 (1).md by tools/v10extract.mjs. Every quoted string below is
# the bible's, verbatim; engine/dev/bibleParity.mjs holds it to that.
- title: "Three Clocks"
  card:
    header: "MISSION 1 - 15 DAYS UNTIL THE PARK REVIEW."
    title: "THREE CLOCKS"
    goNow: "Go to the Ferris Wheel machine room and meet Maya Hart, the park operations lead, at the hub schedule."
    body: "15 days until the park review. Three old traces lie beside a drum with one fresh stop mark. Today you decide whether the wheel brake explains all three bad stops."
    objective: "Decide whether matching stop records prove one common brake failure."
  objective: "Decide whether matching stop records prove one common brake failure."
  stake: "15 days until the park review. Three old traces lie beside a drum with one fresh stop mark. Today you decide whether the wheel brake explains all three bad stops."
  takeaway: "Matching records are not independent evidence until their measurement paths are known."
  segue: "But Chen finds the same test kit named on all three records; the park still needs the force checks."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Position", def: "Position is an object's location relative to a chosen zero point and positive direction."}
  - {name: "Velocity", def: "Velocity is how quickly position changes, including direction; its sign follows the chosen axis."}
  - {name: "Acceleration", def: "Acceleration is how quickly velocity changes; slowing down does not always mean negative acceleration."}
  - {name: "Slope", def: "Slope is rise divided by run on a graph; position-time slope is velocity and velocity-time slope is acceleration."}
  equations:
  - {"e":"average velocity = change in position / change in time","c":"finding average motion between two recorded points","v":[["position","measured in metres"],["time","measured in seconds"],["velocity","measured in metres per second"]],"s":"The park must turn written stop positions into motion before deciding whether the brake record is abnormal."}
  - {"e":"v = v0 + at","c":"predicting velocity under constant acceleration","v":[["v","final velocity"],["v0","initial velocity"],["a","acceleration"],["t","elapsed time"]],"s":"The Ferris Wheel brake prediction must be rebuilt before its recorded stopping mark can be judged."}
  primer:
  - "Choose a positive direction before interpreting signs."
  - "Graph slope describes how one measured quantity changes with another."
  - "Matching results are strongest when they come from independent measurements."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-ferris-wheel-machine-room
    # On arrival at Ferris Wheel machine room | automatic | 
    on: { enter: true, at: WHEEL }
    world: "Three old traces lie beside a drum with one fresh stop mark."
    panel: "STOP 1 READY"
    # unlocks: Stop 1.
    bubbles:
    - who: hart   # Maya Hart
      say: "No repeat run until the old record can make a prediction."
  - id: after-stop-1
    # After Stop 1 | automatic | 
    on: { after: [1] }
    world: "At hub-schedule, the dated accepted-result slip for Stop 1 reads: \"Interval 0.0-3.0 s; a ≈ -0.50 m/s²; no reversal.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 2 READY"
    # unlocks: Stop 2.
    bubbles:
    - who: chen   # Linh Chen
      say: "Nice work. The record gives motion, not a cause. Turn it into a number we can test."
  - id: after-stops-2-and-3
    # After Stops 2 and 3 | automatic | 
    on: { after: [2, 3] }
    world: "At machine-room-board, the dated accepted-result slip for Stop 2 reads: \"Submit 1.4 m/s; accept 1.32-1.48 m/s.\". The slip remains in that fixture's evidence holder."
    panel: "PREDICTED STOP: 2.25 m"
    # unlocks: Stop 4.
    bubbles:
    - who: hart   # Maya Hart
      say: "Good thinking. Now the brake gets one low-speed test."
  - id: after-stop-4
    # After Stop 4 | automatic | 
    on: { after: [4] }
    world: "At hub-board, the dated accepted-result slip for Stop 3 reads: \"Order velocity → stop time → displacement → comparison; t=3.00 s, Δx=2.25 m.\". The slip remains in that fixture's evidence holder."
    panel: "CASEBOOK UPDATED"
    # unlocks: No new stop; preserve the current mission state.
    bubbles:
    - who: chen   # Linh Chen
      say: "Exactly right. One brake matched. We still do not know whether those three records are three witnesses or one."
  - id: at-mission-end
    # At mission end | automatic | 
    on: { missionEnd: true }
    world: "At brake-drum, Maya Hart clips the predicted and measured stop strip to the brake drum. The dated prop remains here on later visits."
    panel: "NEXT: LOAD PATH AT THE PIRATE SHIP"
    # unlocks: Mission 2.
    bubbles:
    - who: hart   # Maya Hart
      say: "That mark clears this test. It does not clear the park. But Chen finds the same test kit named on all three records; the park still needs the force checks."


    - {"title":"Rotational kinetic energy","problem":"A rigid object has I=2 kg m² and ω=3 rad/s. Find rotational kinetic energy.","rule":"K_rot=Iω²/2.","steps":["Set up the relationship: K_rot=Iω²/2.","K_rot=2(3²)/2=9 J."],"answer":"Rotational energy is 9 J.","mistake":"Angular speed must be squared."}

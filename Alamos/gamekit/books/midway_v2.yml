  # --- Stop 30: Derive what controls the period
  #     Concept: Pendulum period; Keystone: oscillation and gravitation; Area: Pirate Ship console; Learning role: INTRODUCE; Difficulty: L3; Story role: obstacle.
  #     placement: DERIVE, asked at ship-console-board.
  - group: SHIP
    at: ship-console-board
    title: "Derive what controls the period"
    concept: "Pendulum period"
    reason: "The crew must know whether loading riders changes the dangerous timing."
    scene: "The free period is known, but Hart needs to know whether sixty riders shift it away from the drive interval. Derive the small-angle relationship and identify which quantities cancel from the prediction."
    motivation: "If mass cancels, adding riders cannot be trusted to remove the resonance risk."
    format: DERIVE
    question: "Given G = 6.67 x 10^-11 N m^2/kg^2, M_E = 5.97 x 10^24 kg, R_E = 6.37 x 10^6 m, and measured T = 6.15 s, use g = GM_E/R_E^2 and the small-angle torque model. Submit an ordered symbolic derivation of T = 2pi sqrt(L/g), one effective-length number in m, and a conclusion about mass dependence."
    answerText: "Universal gravitation predicts g≈9.80 m/s²; the small-angle period then depends on effective length and gravity, not rider mass."
    why: "Both inertia and gravitational restoring torque scale with mass, so the mass cancels."
    # wrong-path feedback, one rebuttal per wrong option:
    #   More mass increases both resistance to angular acceleration and gravitational torque by the same factor.
    # correct result: Order model → substitute → solve → interpret; L≈9.38 m; mass cancels.
    # state/output: Add LOAD DOES NOT REMOVE TIMING RISK to the panel.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:
    #     lines:
    #       - {id: gravity, expression: "g = G M_E/R_E^2 = 9.80 m/s^2", rule: "universal gravitation at Earth's surface"}
    #       - {id: torque, expression: "mL^2 theta_ddot = -mgL sin(theta)", rule: "rotational dynamics about pivot"}
    #       - {id: small, expression: "theta_ddot = -(g/L)theta", rule: "small-angle sin(theta) approximately theta; cancel m"}
    #       - {id: omega, expression: "omega^2 = g/L", rule: "SHM form"}
    #       - {id: period, expression: "T = 2pi sqrt(L/g)", rule: "T = 2pi/omega"}
    #     order: [gravity,torque,small,omega,period]
    #     decoys:
    #       - {expression: "T = 2pi sqrt(mL/g)", rule: "retain mass after it cancels from the equation of motion"}
    # HELD BACK. The bible writes a derivation as an ordered list of lines plus a
    # single decoy for the whole thing. The engine grades it line by line: every
    # step needs at least three candidate lines, a `why` on each wrong one saying
    # what it costs, and one wrong branch marked `survives` so the step cannot be
    # passed by spotting the malformed option. Owed by the bible: per-step
    # candidate sets, a rebuttal on each wrong candidate, and which wrong branch

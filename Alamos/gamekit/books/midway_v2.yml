      - {key: "C", text: "Velocity is how quickly position changes, including direction; its sign follows the chosen axis.", why: "This describes Velocity, not Independent evidence. It does not account for the quantities, conditions, or evidence in this physics case."}
      - {key: "D", text: "Acceleration is how quickly velocity changes; slowing down does not always mean negative acceleration.", why: "This describes Acceleration, not Independent evidence. It does not account for the quantities, conditions, or evidence in this physics case."}

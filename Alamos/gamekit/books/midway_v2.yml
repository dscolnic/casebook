    format: RESIDUAL
    question: "Compare the displayed coaster residuals in m, tower residuals in m, and flume residuals in m. Submit one field selection and one conclusion naming the constant-bias pattern and the assumption it invalidates."
    answerText: "The coaster alone shows a constant 1.8 m geometry bias."
    why: "Tower and flume measurements agree with their physical geometry, so gravity and the shared equations are not the failing element."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (tower) Tower residuals alternate only at small, unpatterned measurement-noise scale. (flume) Flume residuals also remain small and unpatterned; neither comparison shows the Coaster's constant 1.8 m bias.
    # correct result: Select Coaster: constant geometry residual +1.8 m; Tower and Flume unpatterned.
    # state/output: Set failure_scope = coaster_geometry.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   residual:
    #     fields:
    #       - {id: coaster, label: "Coaster drawing minus tape", values: [-1.8,-1.8,-1.8,-1.8], rms: 1.8, pattern: constant_bias}
    #       - {id: tower, label: "Tower mark minus laser", values: [0.02,-0.01,0.01,-0.02], rms: 0.016, pattern: none}
    #       - {id: flume, label: "Header depth minus staff gauge", values: [0.01,0.00,-0.02,0.01], rms: 0.012, pattern: none}
    #     correct: coaster
    #     conclusion: "The coaster field alone shows a constant 1.8 m geometry bias, invalidating the copied drawing radius."
    # HELD BACK. The engine's RESIDUAL plots each residual at a position, needs at
    # least five per field, and turns on the lowest-RMS field being the patterned
    # one — the best number has to be the wrong answer, or nobody has to look at
    # the field. Here the patterned field, the coaster, has the worst RMS by a
    # long way, so the trap runs backwards, and each field carries four bare
    # values with no position. Owed by the bible: a position for every residual, a
    # fifth value in each field, and the pattern on the fit with the best number.

  # --- Stop 56: Diagnose the failed certificate
  #     Concept: Whole-case diagnosis; Keystone: models; Area: Brennan's workshop; Learning role: DECIDE; Difficulty: L5; Story role: twist.
  #     placement: DIAGNOSIS, asked at flume-case-stand.
  - group: WORKSHOP
    at: flume-case-stand
    title: "Diagnose the failed certificate"
    concept: "Whole-case diagnosis"
    reason: "The final certificate needs the one cause that fits the new radius and quiet independent systems."
    scene: "The coaster misses its required margin with the physical radius, while lift power, brakes, tower geometry, and flume geometry remain consistent. Name the single failure that fits every displayed reading."
    motivation: "The correct diagnosis preserves valid physics while rejecting the wrong model input."
    format: DIAGNOSIS
    question: "Submit one causal conclusion that explains drawing radius 5.6 m, physical radius 7.4 m, measured speed 9.40 m/s, required speed 9.52 m/s, quiet lift power, and quiet brake self-test together."
    # CONVERTED. The payload's four choice rows, written out as mappings.
    choices:
    - { id: gravity, label: "Gravity equation failed", mechanism: "Other systems contradict it." }
    - { id: brake, label: "Brake failure", mechanism: "Does not explain radius mismatch." }
    - { id: geometry, label: "Copied loop geometry invalidated the margin", mechanism: "Fits every reading." }
    - { id: power, label: "Lift motor underpowered", mechanism: "Empty run fits plate and does not create tape mismatch." }
    # The bible keys `answer: geometry`; the engine grades by label.
    answer: "Copied loop geometry invalidated the margin"
    answerText: "Copied loop geometry invalidated the drawing-based margin; the coaster remains closed."
    why: "The equations correctly respond to the real radius. The old certificate modeled a different geometry."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (gravity) Independently verified Tower and Flume geometry contradict a gravity-model failure. (brake) A brake fault cannot create the measured 1.8 m radius mismatch. (power) The empty run fits the motor plate, and lift power cannot explain the tape-versus-drawing discrepancy.
    # correct result: Choice 3 - copied loop geometry; Coaster remains closed.
    # state/output: Set ride_status.coaster = closed_geometry; trigger Twist 3.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   headline: "COASTER CROWN MARGIN FAILURE"
    #   readings:
    #     - {zone: geometry, label: "Drawing / physical radius", value: "5.6 m / 7.4 m", state: alarm}
    #     - {zone: speed, label: "Measured / required with margin", value: "9.40 / 9.52 m/s", state: alarm}
    #     - {zone: lift, label: "Empty-run lift power", value: "within plate", state: quiet}
    #     - {zone: brakes, label: "Brake self-test", value: "normal", state: quiet}
    #     - {zone: comparisons, label: "Tower and flume geometry", value: "independently verified", state: quiet}
    #   choices:
    #     - {id: gravity, label: "Gravity equation failed", mechanism: "Other systems contradict it."}
    #     - {id: brake, label: "Brake failure", mechanism: "Does not explain radius mismatch."}
    #     - {id: geometry, label: "Copied loop geometry invalidated the margin", mechanism: "Fits every reading."}
    #     - {id: power, label: "Lift motor underpowered", mechanism: "Empty run fits plate and does not create tape mismatch."}
    #   answer: geometry
    # CONVERTED. `headline` is a rename; a reading's `state` is the engine's
    # `status`, where the bible's `quiet` is `normal`.
    headline: "COASTER CROWN MARGIN FAILURE"
    readings:
    - { zone: geometry, label: "Drawing / physical radius", value: "5.6 m / 7.4 m", status: alarm }
    - { zone: speed, label: "Measured / required with margin", value: "9.40 / 9.52 m/s", status: alarm }
    - { zone: lift, label: "Empty-run lift power", value: "within plate", status: normal }
    - { zone: brakes, label: "Brake self-test", value: "normal", status: normal }
    - { zone: comparisons, label: "Tower and flume geometry", value: "independently verified", status: normal }

  # --- Stop 25: Put directions into momentum
  #     Concept: Signed momentum; Keystone: momentum; Area: Bumper Car Pavilion; Learning role: INTRODUCE; Difficulty: L2; Story role: obstacle.
  #     placement: BALLPARK, asked at car-on-stands.
  - group: BUMPER
    at: car-on-stands
    title: "Put directions into momentum"
    concept: "Signed momentum"
    reason: "The collision prediction fails if opposite directions are added as positive speeds."
    scene: "A 240 kg car moves right at 4.0 m/s while a 260 kg car moves left at 2.0 m/s. Estimate their signed total momentum before the instrumented test impact begins."
    motivation: "Direction determines the momentum available to carry the joined cars after collision."
    format: BALLPARK
    question: "Given rightward momentum +960 kg m/s and leftward momentum -520 kg m/s, use p_total = p1 + p2. Submit one signed numerical total in kg m/s and state its direction."
    answerText: "Total momentum before impact is 440 kg m/s to the right."
    why: "Opposite directions receive opposite signs."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Adding magnitudes predicts 1480 kg m/s and erases direction.
    # correct result: Submit +440 kg·m/s (right).
    # state/output: Display the rightward total-momentum arrow.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   estimate: {labels: ["Rightward momentum", "Leftward momentum"], values: [960,-520], slots: [p1,p2], template: "ptotal = {p1} + {p2}", formula: "960-520", correct: 440, target: 440, tolerance: 0.03, unit: "kg m/s"}
    # CONVERTED. Slots become a count and the template holes the engine's click
    # order. The bible writes the formula with the numbers already substituted
    # and a minus sign; the leftward tile is already the negative number, so as
    # slot names the same arithmetic is a + b.
    estimate:
      labels: ["Rightward momentum", "Leftward momentum"]
      values: [960, -520]
      slots: 2
      template: 'ptotal = {0} + {1}'
      formula: a+b
      correct: [0, 1]
      target: 440
      tolerance: 0.03
      units: kg m/s

  # --- Stop 26: Derive the joined speed
  #     Concept: Perfectly inelastic collision; Keystone: momentum; Area: Bumper Car Pavilion; Learning role: INTRODUCE; Difficulty: L2; Story role: obstacle.
  #     placement: DERIVE, asked at pavilion-board.
  - group: BUMPER
    at: pavilion-board
    title: "Derive the joined speed"
    concept: "Perfectly inelastic collision"
    reason: "The dummy test needs a predicted post-impact speed."
    scene: "The test coupler makes the cars move together after impact, so kinetic energy is not conserved through the hit. Use signed momentum to derive their shared velocity immediately after collision."
    motivation: "Momentum predicts the immediate joined motion even when deformation removes kinetic energy."
    format: DERIVE
    question: "Given m1 = 240 kg, v1 = +4.0 m/s, m2 = 260 kg, and v2 = -2.0 m/s, use m1v1 + m2v2 = (m1 + m2)vf. Submit an ordered derivation and one signed common-velocity number in m/s with direction."
    answerText: "The coupled cars move right at 0.88 m/s immediately after impact."
    why: "The 440 kg m/s net momentum is shared by 500 kg."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Kinetic energy is not conserved in a collision where the cars couple.
    # correct result: Submit +0.88 m/s (right).
    # state/output: Set test prediction to 0.88 m/s.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:
    #     lines:
    #       - {id: conserve, expression: "m1v1 + m2v2 = (m1+m2)vf", rule: "momentum conservation"}
    #       - {id: substitute, expression: "240(4.0)+260(-2.0)=500vf", rule: "use signed velocities"}
    #       - {id: result, expression: "vf = 0.88 m/s right", rule: "solve with direction"}
    #     order: [conserve,substitute,result]
    #     decoys:
    #       - {expression: "240(4.0)+260(2.0)=500vf", rule: "add speed magnitudes and ignore direction"}
    # HELD BACK. The bible writes a derivation as an ordered list of lines plus a
    # single decoy for the whole thing. The engine grades it line by line: every
    # step needs at least three candidate lines, a `why` on each wrong one saying
    # what it costs, and one wrong branch marked `survives` so the step cannot be
    # passed by spotting the malformed option. Owed by the bible: per-step
    # candidate sets, a rebuttal on each wrong candidate, and which wrong branch
    # survives. Also `start` and `goal` — the line it begins from, and the FORM it
    # is going to, which is not the same as the answer.

  # --- Stop 27: Verify the rider impulse
  #     Concept: Impulse and force; Keystone: impulse; Area: Bumper Car Pavilion; Learning role: PRACTICE; Difficulty: L3; Story role: clue.
  #     placement: VERIFY, asked at dummy-rig.
  - group: BUMPER
    at: dummy-rig
    title: "Verify the rider impulse"
    concept: "Impulse and force"
    reason: "Hart's interruption can be judged only through its measured effect on stopping time and force."
    scene: "The independent sensors measure a 0.88 m/s joined speed and a 0.22 s padded stop for the 70 kg dummy. Predict average force, then compare it with the separate neck-rig reading."
    motivation: "Extending the same momentum change over time lowers the force carried by the dummy."
    format: VERIFY
    question: "CALCULATE AND COMMIT: Given dummy mass m = 70 kg, speed change magnitude Delta v = 0.88 m/s, stop time Delta t = 0.22 s, and campaign limit 350 N, use F_avg = m Delta v / Delta t and submit a force prediction in N; the rig stays locked until you commit. OPERATE: Run the padded coupled-car stop. MEASURE: Record average stopping force in N. INTERPRET: Submit one conclusion comparing prediction and measurement with the 25 N tolerance and the 350 N limit."
    answerText: "The padded stop agrees with a 280 N prediction and remains below the 350 N campaign limit."
    why: "The impulse is fixed by the velocity change; the 0.22 s duration spreads it out."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Dividing by a shorter time must increase, not decrease, average force.
    # correct result: Commit 280 N; measure 291 N; both support a value below 350 N.
    # state/output: Mark the dummy test as passing.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   verify: {prediction: {value: 280, unit: N, tolerance: 25}, commit_required_before_unlock: true, phase_order: [calculate_and_commit, operate, measure, interpret], action: "Run padded coupled-car stop", measurement: {value: 291, unit: N}, failure_if_unmeasured: true, correct_conclusion: "Force agrees and remains below the fictional 350 N test limit."}
    # CONVERTED, the same model conversion as mission 1 stop 4: `truth` is the
    # bible's measured 291 N, `passRatio` is its 25 N tolerance said as a ratio
    # of that (25 / 291 = 0.0859), and the dial's bounds — the one thing the
    # bible does not give — run from no force at all to twice the predicted
    # 280 N, so that neither end of the dial is a right answer.
    verify:
      prediction: { label: Average stopping force, unit: N, min: 0, max: 560, step: 1 }
      truth: 291
      passRatio: [0.9141, 1.0859]
      intervention:
        label: Run padded coupled-car stop
      measurement:
        label: Average stopping force


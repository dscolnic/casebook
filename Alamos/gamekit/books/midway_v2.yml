    # one mark — 3.60 m, tolerance 0.12 m — and a single keyed pair. Owed by the
    # bible: at least one more mark, with its own distance and radius.
    lob_patch:
      question: "Given target range `R = 3.60 m +/- 0.12 m`, `g = 9.80 m/s^2`, launch and landing at equal height, angle control `20-70 degrees`, and charge-speed control `3.0-7.0 m/s`, use `R = v^2 sin(2theta)/g`. Submit one numerical pair: launch angle in `degrees` and charge-speed setting in `m/s`."
      authoredPayload: No structured payload was present; this block supplies it.
      correctResult: Submit pair (45°, 5.94 m/s); accept speed 5.85-6.03 m/s.
      wrongButPlausible: A plausible shortcut that ignores one condition or treats dependent evidence as independent.
      decisionCanFail: true
      questionAndUnits: "Given target range `R = 3.60 m +/- 0.12 m`, `g = 9.80 m/s^2`, launch and landing at equal height, angle control `20-70 degrees`, and charge-speed control `3.0-7.0 m/s`, use `R = v^2 sin(2theta)/g`. Submit one numerical pair: launch angle in `degrees` and charge-speed setting in `m/s`."
    lob:
      targets:
        - label: Short marker
          distance: 3
          radius: 0.12
        - label: Target marker
          distance: 3.6
          radius: 0.12
        - label: Long marker
          distance: 4.2
          radius: 0.12
      maxSpeed: 7

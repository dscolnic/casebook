    #       - {id: live, label: "Change installed controller setting", response: 12, correct: false}
    #       - {id: brake, label: "Change mechanical brake preload", response: -8, correct: false}
    #     reversal_required: true
    # CONVERTED, the same shape as mission 3 stop 3: `candidates` are the
    # engine's `variables`, `noise_band` its `noise`, `fixed_conditions` its
    # `held`, and the candidate marked `correct: true` its `truth`. The signed

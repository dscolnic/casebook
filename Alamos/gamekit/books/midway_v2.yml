    #   allocate:
    #     pool: 55
    #     items:
    #       - {id: flume, label: "Flume verified duty", cost: 44.1, required: true}
    #       - {id: shutdown, label: "Protected shutdown controls", cost: 5.0, protected: true, required: true}
    #       - {id: logging, label: "Independent logging", cost: 3.0, required: true}
    #       - {id: coaster, label: "Coaster lift", cost: 54.6, required: false}
    #     questions: ["Which loads fit now?", "Which load must be scheduled later?", "Is protected shutdown preserved?"]
    #     correct_allocation: {flume: 44.1, shutdown: 5.0, logging: 3.0, coaster: 0}
    # CONVERTED, and this one is a model conversion rather than a rename. The
    # bible splits a pool continuously and grades the split; the engine buys a
    # subset under a budget and grades what the plan can then answer. So:
    #   · `pool` becomes `pool.amount`, and each item's `cost` is what funding it
    #     spends. All four together come to 106.7 kW against 55 kW, so something
    #     has to wait — which is the trade the bible wrote.
    #   · the bible's `questions` become the engine's `answers`, each naming the
    #     items its answer depends on. The two the bible marks required in its
    #     own items list are required here.
    #   · NOT `protected:` on the shutdown line, even though the bible marks it
    #     so. Protected means pre-reserved, and a required answer whose items are
    #     all protected is true before the player chooses anything — the importer
    #     refuses that. Here the player has to choose to preserve it, which is

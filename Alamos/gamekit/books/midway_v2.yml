    objective: "Sign seven defensible ride decisions and the shared operating plan."
  objective: "Sign seven defensible ride decisions and the shared operating plan."
  stake: "The coaster fails its required margin, while six other ride decisions depend on limits, inspections, and exact tested configurations. The final certificate must separate verified conditions from old records and unresolved claims. Reconcile the Casebook, stress every boundary, fund the last useful work, and attest each decision. By the end of the mission, sign which rides reopen, reopen with limits, or remain closed."

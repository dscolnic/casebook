  - title: The seat, the pole and the ram
    objective: Put forces on the parts that hold people in a circle.
    briefing: The carousel's poles and the flume's gate both hold, and neither has ever been computed.
    stake: >-
      Friday, and the first week ends with three parts nobody has a number for. Bisi Adeyemi
      will not wire the new controller yet. She wants to know what force an outer horse's pole
      carries at eight turns a minute. Santos has a hydraulic gate on the flume. A two
      centimetre ram drives a nine centimetre one, and Brennan's note beside it reads "plenty".
      Vey has spent the morning reading yesterday's working and has signed nothing. Today you
      get the sideways force on a carousel pole. You also put the tower's drop test into the
      order it has to happen in, and derive what a hydraulic ram multiplies. Marsh has the
      season on a wall chart. There are 15 working days left on it.
    takeaway: Every part in this park is holding a force somebody can compute in three lines.
    stops:
      - group: CAROUSEL
        task: Get the sideways force on an outer pole
        title: What a pole holds sideways
        concept: Newton's second law as the definition of a net force
        place: The Carousel and Swings
        scene: An outer horse carries a 78 kilogram rider 6.2 metres from the axis. The carousel is turning at eight revolutions a minute. Bisi Adeyemi wants the sideways force before anyone raises the controller setting.
        guide: >-
          Five numbers, and two of them belong to earlier or other steps: the turns a
          minute, and gravity. Ask of each whether this force depends on it. Turns a
          minute is not a speed, so one number here is already the conversion done for
          you. And note the square: nine turns instead of eight is twelve per cent more
          speed and a quarter more force.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - a body in a circle needs a net force toward the centre
          - that force is the mass times the centripetal acceleration
        takeaway: Circular-force problems often hide the needed speed inside a rotation rate, so convert the motion before applying F = mv²/r.
        format: BALLPARK
        question: Estimate the sideways force on the rider, converting the carousel's eight revolutions a minute into linear speed first.
        why: Eight revolutions a minute is an angular rate, not the rider's linear speed. One revolution covers 2πr, so the rider moves about 5.2 m/s at 6.2 m radius. Then F = mv²/r gives about 340 N toward the centre. The square on speed makes controller changes expensive. Going from eight to nine rpm raises speed by 12.5%, but the required inward force by about 27%. The pole and saddle must supply that extra force every turn.
        estimate:
          prompt: A 78 kg rider is 6.2 m from the axis on a carousel turning at 8 revolutions per minute.
          question: Estimate the sideways force on the rider, converting rpm to linear speed first.
          labels:
            - 78 kg  (mass of the rider)
            - 5.2 m/s  (speed at that radius)
            - 6.2 m  (radius of the circle)
            - 9.8 m/s²  (g)
            - 8  (turns a minute)
          values: [78, 5.2, 6.2, 9.8, 8]
          slots: 3
          template: "{0} × {1} × {1} ÷ {2}"
          formula: a*b*b/c
          correct: [0, 1, 2]
          target: 340
          tolerance: 30
          units: N
          solution: v = 2π(6.2)(8)/60 ≈ 5.2 m/s; F = 78 × 5.2²/6.2 ≈ 340 N toward the centre.
          explanation: The rider's linear speed is not 8 m/s. Revolutions per minute must first become distance travelled each second at this radius.
          relationship: Convert rotation rate with v = 2πr(rpm)/60, then use centripetal force F = mv²/r.
      - group: TOWER
        task: Order the operations for the official drop test.
        title: The order a drop test runs in
        place: The Drop Tower
        scene: The safety engineer must observe and sign off on the tower's annual drop test. The tower technician has the test weights, the accelerometer and four operations on a whiteboard. They are written in the order he thought of them.
        guide: >-
          All four operations will happen, so ask what each one has to be true for. A
          measured acceleration belongs to a stated mass, so the mass has to be recorded
          first. An instrument fitted after the drop measures nothing. And the brake
          only meets its real entry speed from full height. The last card is what turns
          a demonstration into evidence.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim about dependency: each
              step is here because the one before it has already happened, or has to have.
              One transposed pair falsifies that claim wherever it sits, so partial credit
              would be credit for a sequence that does not work.
          - >-
              Why the ends are the place to start. The first and last cards are constrained
              by having nothing before or after them, which usually makes them the two you
              can settle from the scene alone. Pinning them collapses the remaining
              arrangements sharply, and what is left in the middle is where the actual
              judgement lives.
          - >-
              What the rail can be ordered on. Time is the usual axis, but it is not the
              only one. An order can run on cost, on risk, or on reversibility — every
              observation that leaves the sample as it was, before any that consumes it. On
              those boards a chronological reading finds nothing, because none of the steps
              has to happen at a particular hour.
        assumes:
          - a test is only evidence if the conditions are known before it runs
          - test weights can stand in for passengers
        takeaway: A test is designed backwards from the number it has to produce.
        format: SEQUENCE
        why: An official test only means something if its conditions are fixed before release. First record the test mass, because the measured acceleration belongs to that mass. Then fit and confirm the accelerometer before anything moves. The carriage must be released from full height so the brake meets its normal operating entry speed. Only after the drop can the logged result be compared with the certificate limit. The final comparison turns a demonstration into evidence.
        cards:
          - Weigh the test weights and record what the carriage mass will be on the drop.
          - Fit the recording accelerometer to the carriage floor and confirm it is logging.
          - Release from the full height with the test weights aboard and no passengers on site.
          - Compare the logged deceleration against the figure the certificate will carry.
        order: [0, 1, 2, 3]
      - group: FLUME
        task: Derive what the hydraulic gate multiplies
        title: Two centimetres driving nine
        place: The Log Flume
        scene: The flume's sluice gate is held by a hydraulic ram. A two-centimetre piston at the hand pump drives a nine-centimetre piston at the gate. An old note beside the drawing says only 'plenty.'
        guide: >-
          Build Pascal's principle down to the force at the gate, one line at a time.
          Then state the cost: a hydraulic system multiplies force and gives something
          else away, and the derivation shows you exactly what, which is more use than
          the note on the drawing that says only 'plenty'.
        background:
          - >-
              What the principle says. Pressure applied to a confined fluid is the same
              everywhere in it, so the small piston and the large one see the same pressure.
              Force is pressure times area, and area goes as the square of the diameter —
              which is why a two-centimetre piston driving a nine-centimetre one multiplies
              the hand force by about twenty.
          - >-
              What is given up. Volume is conserved: the fluid pushed out of the small
              cylinder is the fluid arriving in the large one. So the gate piston moves as
              much less distance as it gains force, and the work in equals the work out.
              Nothing has been created, and the pump handle has to travel a long way.
          - >-
              Why 'plenty' is not an answer. A number is what tells you whether the ram
              closes the gate against a head of water, how many strokes it takes, and what
              happens as the seals wear. The old note was true and useless, which is the
              difference this stop is about.
        assumes:
          - pressure applied to an enclosed fluid is passed on undiminished
          - pressure is force divided by the area it acts over
        takeaway: An ideal machine can trade force for distance, but it cannot create work.
        format: DERIVE
        question: Work Pascal's principle down to the force at the gate, and say what the multiplication costs.
        answerText: F₂ = 250 × (9.0/2.0)² ≈ 5,060 N at the gate. The large piston moves only about one twentieth as far as the hand piston.
        why: Pascal's principle sends the same pressure through the enclosed fluid. Force therefore scales with piston area, not with piston diameter. A diameter ratio of 9 to 2 gives an area ratio of about 20, so 250 N becomes roughly 5.1 kN. The gain in force is paid for in distance. The large piston moves about one twentieth as far as the small one. Work is conserved apart from losses, so the hydraulic creates no free energy.
        derive:
          hint: Start from the pressures being equal, write each as a force over an area, and remember what an area does when a diameter changes.
          start: P₁ = P₂
          startNote: hand piston 2.0 cm across, gate piston 9.0 cm across, 250 N applied by hand
          goal: the force at the gate, and what has been given up to get it
          steps:
            - ask: Write each pressure as a force over its own area.
              answer: 0
              candidates:
                - text: F₁/A₁ = F₂/A₂, so F₂ = F₁ × (A₂/A₁)
                  rule: definition
                - text: F₁A₁ = F₂A₂, so F₂ = F₁ × (A₁/A₂)
                  rule: definition
                  survives: true
                  why: Consistent algebra on an inverted definition. Pressure is force divided by area, not multiplied by it, and this version makes the wide piston the weak 1 — a ram that would give 5 newtons at the gate for 250 at the hand.
                - text: F₁ = F₂, since pressure is passed on undiminished
                  rule: substitution
                  why: What is passed on undiminished is the pressure. The force is the pressure times an area, and the 2 areas here differ by a factor of 20.
                - text: F₂ = F₁ × (d₂/d₁)
                  rule: geometry
                  why: This uses the diameters where the areas belong. It gives a multiplication of 4 and a half instead of 20, which is the same mistake as pricing a pizza by its width.
            - ask: Put the areas in, from the diameters given.
              answer: 3
              candidates:
                - text: A₂/A₁ = 9.0/2.0 = 4.5
                  rule: geometry
                  why: That is the ratio of the diameters. Area grows with the square of the diameter, so the ratio of areas is the square of this.
                - text: A₂/A₁ = (9.0² − 2.0²)/2.0² = 19.25
                  rule: geometry
                  why: Subtracting the small area from the large one is the arithmetic for an annulus. These are two separate cylinders and each has its own full circle.
                - text: A₂/A₁ = π(9.0)²/π(2.0)², and the π has to be evaluated before dividing
                  rule: evaluation
                  survives: true
                  why: "Perfectly valid and needlessly so: the π appears above and below and cancels exactly. Evaluating it changes nothing except the number of chances to make an arithmetic slip."
                - text: A₂/A₁ = (9.0/2.0)² = 20.25
                  rule: geometry
            - ask: Give the force at the gate and say what it cost.
              answer: 1
              candidates:
                - text: F₂ ≈ 5,060 N, and the ram delivers that over the same distance the hand moved
                  rule: evaluation
                  survives: true
                  why: "The force is right and the second half is not. Work cannot be created by plumbing: the gate piston moves about a twentieth as far as the hand piston, which is exactly what keeps the energy books straight."
                - text: F₂ ≈ 5,060 N, and the gate piston moves about a twentieth as far
                  rule: evaluation
                - text: F₂ ≈ 1,125 N, from the ratio of the diameters
                  rule: substitution
                  why: This is the diameter ratio again, four and a half times the hand force. It understates the gate force by a factor of four and a half.
                - text: F₂ ≈ 5,060 N, so the hand pump does 20 times the work
                  rule: evaluation
                  why: The work at each end is the same, less what the seals take. 20 times the force over a twentieth of the distance is the same product.
  # ------------------------------------------------------------------ day 6
  - title: What the collision keeps
    objective: Get the speed out of a collision, and the energy that does not come back.
    briefing: 400 logged collisions, and nobody has ever written the equation for 1.
    stake: >-
      Monday of the second week, and Wei Chen has 400 collisions off last season's
      accelerometers. He has nothing to compare any of them against. The bumper floor is the
      ride Vey expects to sign first. It is also the ride Georgia Hart, the midway supervisor,
      expects to argue about. Whatever number comes out of today has to become a rule. Twelve
      nineteen year olds have to apply that rule on the four hundredth cycle of a hot Saturday.
      Today you derive the speed a pair of cars leaves a collision at. You also work out what
      the lift motor is doing on the coaster, and settle what makes a wheel hard to start. Marsh
      has moved the reopening announcement to Friday. That gives the second week a deadline it
      did not have this morning.
    takeaway: A collision hands back its momentum in full and keeps a good share of its energy.
    stops:
      - group: BUMPER
        task: Derive the speed the pair leaves at
        title: Two cars, one velocity
        concept: "Elastic against inelastic: which quantity survives"
        place: The Bumper Cars
        scene: |-
          A 320 kilogram car and rider at 3.1 metres a second strikes a stationary 290 kilogram car and rider. They stay in contact and move off together, which the telemetry confirms.
        guide: >-
          Build the momentum statement down to the speed the pair leaves at, one line at
          a time. Then answer the second half: work out what fraction of the kinetic
          energy is still there afterwards. Momentum and energy behave differently in
          this collision, and the derivation is how you find out that they do.
        background:
          - >-
              Why momentum is the one that survives. In the moment of contact the two cars
              push on each other equally and oppositely, so whatever momentum one gains the
              other loses and the total is unchanged. That holds whatever happens inside the
              bumpers, which is why the momentum statement can be written before knowing
              anything about them.
          - >-
              Why the energy is not conserved. The cars stay in contact and move off
              together, which means the collision is perfectly inelastic — the maximum
              energy that can go into deformation, heat and noise for the given masses. The
              fraction remaining follows from the masses alone, and it is a fixed number
              rather than a measurement.
          - >-
              What the ride is doing with it. A bumper car is designed to lose that energy
              in the rubber rather than in the rider's neck, so the missing fraction is the
              whole safety argument of the attraction. Telemetry that confirms the pair
              moved off together is confirming which case of the algebra applies.
        assumes:
          - momentum is mass times velocity, counted with its direction
          - a collision with no outside push conserves total momentum
        takeaway: For a perfectly inelastic collision, momentum fixes the shared speed while kinetic energy tells how much mechanical energy was transformed.
        format: DERIVE
        question: Work the momentum statement down to the speed the pair leaves at, and then say what happened to the energy.
        answerText: v = (320 × 3.1) ÷ 610 ≈ 1.63 m/s, and about 47% of the kinetic energy has gone into rubber, heat and noise.
        why: With negligible external impulse, total momentum is conserved during the collision. Because the cars leave together, one shared speed describes the pair afterward. Solving the momentum equation gives about 1.63 m/s. Kinetic energy is different. It falls because this collision is inelastic. The missing mechanical energy becomes deformation, sound and heat in the bumpers and bodies. Soft structures are useful precisely because they absorb energy instead of returning it as rebound.
        derive:
          hint: Write what is conserved, put the numbers in, and check the units of the thing you have solved for.
          start: m₁u₁ + m₂u₂ = (m₁ + m₂)v
          startNote: m₁ = 320 kg at u₁ = 3.1 m/s; m₂ = 290 kg at rest
          goal: the speed of the pair after impact, and the fraction of the kinetic energy left
          steps:
            - ask: Put this collision into the statement.
              answer: 1
              candidates:
                - text: 320(3.1) + 290(3.1) = (320 + 290)v
                  rule: substitution
                  why: The second car is stationary. Giving it the first car's speed puts momentum into the system that nothing supplied and returns the answer that nothing happened.
                - text: 320(3.1) + 290(0) = (320 + 290)v
                  rule: substitution
                - text: 320(3.1) = 290v
                  rule: conservation
                  survives: true
                  why: Algebraically fine and it describes a different collision — one where the first car stops dead and hands everything to the second. It gives 3.4 m/s, faster than anything on the floor was going, which is the tell.
                - text: ½(320)(3.1²) + 0 = ½(320 + 290)v²
                  rule: conservation
                  why: This conserves kinetic energy, which a collision that ends with the cars locked together does not do. It gives a speed about 40% too high.
            - ask: Solve for the speed of the pair.
              answer: 0
              candidates:
                - text: v = 992 ÷ 610 ≈ 1.63 m/s
                  rule: rearrangement
                - text: v = 992 × 610 ≈ 605,000 m/s
                  rule: rearrangement
                  why: The combined mass divides, since it is multiplying the unknown. Multiplying gives a number with the units of kilograms squared metres per second.
                - text: v = 992 ÷ 320 ≈ 3.1 m/s
                  rule: rearrangement
                  survives: true
                  why: Dividing by the striking car's mass alone recovers the speed that went in, which is a consistent piece of arithmetic saying the collision did nothing. The mass on the right is the pair's, because the pair is what is moving.
                - text: v = (3.1 + 0) ÷ 2 ≈ 1.55 m/s
                  rule: conservation
                  why: Averaging the two speeds happens to land near the right answer here and is not the physics. It ignores the masses entirely, and with a full car striking an empty one it is wrong by a third.
            - ask: Compare the kinetic energy before and after.
              answer: 2
              candidates:
                - text: 1,538 J before and 1,538 J after, since momentum was conserved and nothing left the floor
                  rule: conservation
                  why: Momentum being conserved says nothing about the energy. They are different quantities and only one of them is protected in a collision like this.
                - text: 1,538 J before and 810 J after, so 47% has been destroyed
                  rule: evaluation
                  survives: true
                  why: The arithmetic is right and the word is wrong. Energy is not destroyed; it has gone into deforming rubber, heating the bumpers and making the noise that is most of the ride's appeal.
                - text: 1,538 J before and 810 J after, so 47% has left as heat, sound and deformation
                  rule: evaluation
                - text: 1,538 J before and 810 J after, so the collision was elastic
                  rule: evaluation
                  why: An elastic collision is exactly the one that gives all its kinetic energy back. Losing nearly half of it is the definition of the other kind.
      - group: COASTER
        task: Work out what the lift motor has to do
        title: What the chain is paid to do
        place: The Coaster
        scene: |-
          The chain hauls a loaded train of 4,800 kilograms up to 26 metres in 52 seconds. Kovač has the motor's plate rating and wants to know how much of it the lift actually uses.
        guide: >-
          Five numbers, and one of them is the speed at the foot of the drop, which
          belongs to a different question. Ask of each whether the lift's work depends
          on it. Power is energy each second, so the answer needs both the energy stored
          and the time taken. Note what follows: nothing adds energy after the top, so
          every later hill fits inside what the lift paid for.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - lifting a mass stores energy equal to its weight times the height
          - power is work divided by the time taken
        takeaway: A motor is rated in power, and what a job needs is an energy and a time.
        format: BALLPARK
        question: Estimate the power the lift chain delivers to the train.
        why: Power is energy transferred each second. Raising the 4,800 kg train by 26 m stores about 1.22 MJ of gravitational potential energy. Doing that in 52 s requires about 23.5 kW delivered to the train. A faster lift would need more power for the same height. Once the train leaves the top of the first hill, no motor adds energy around the circuit. Friction only subtracts, so every later hill must fit inside what the lift supplied.
        estimate:
          prompt: A 4,800 kg train is raised 26 m in 52 s. Ignore friction in the chain for this estimate.
          question: Estimate the power the lift chain delivers to the train.
          labels:
            - 4800 kg  (mass of the loaded train)
            - 9.8 m/s²  (g)
            - 26 m  (height of the lift)
            - 52 s  (time to climb it)
            - 21.4 m/s  (speed at the foot of the drop)
          values: [4800, 9.8, 26, 52, 21.4]
          slots: 4
          template: "{0} × {1} × {2} ÷ {3}"
          formula: a*b*c/d
          correct: [0, 1, 2, 3]
          target: 23520
          tolerance: 1500
          units: W
          solution: P = mgh ÷ t = 4,800 × 9.8 × 26 ÷ 52 ≈ 23.5 kW.
          explanation: The speed at the foot of the drop is what the lift buys, not what it costs. It is already the same energy counted a second time.
          relationship: "P = mgh ÷ t: power is the energy given to the train divided by the time spent giving it."
      - group: WHEEL
        task: Say what makes a wheel hard to start
        title: Where the mass is
        place: The Ferris Wheel
        scene: Novák is quoting a replacement drive and the supplier wants the wheel's rotational inertia. Two wheels of the same total mass are on the table, one with heavy passenger cabins and one with a heavier center hub.
        guide: >-
          Two wheels of the same total mass, and four options. Ask of each whether it
          appeals to where the mass sits, or only to how much there is. Each piece
          counts in proportion to the square of its distance from the axis. So a
          kilogram at the rim is worth many at the hub. Two of these options get the
          direction of that backwards.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a torque is needed to change how fast something turns
          - the same mass can be arranged near an axle or far from it
        takeaway: Rotational inertia counts every kilogram by the square of how far out it sits.
        format: CHOICE
        question: Two wheels have the same total mass. Which is harder to bring up to speed?
        why: Rotational inertia depends on both mass and where that mass sits. Each piece contributes in proportion to the square of its distance from the axis. A kilogram near the outer rim matters far more than a kilogram near the center hub. That makes outer-rim-heavy wheels harder to speed up or slow down. Ferris-wheel passenger cabins are therefore kept light when possible. A flywheel does the opposite on purpose, putting mass outward so its rotation resists changes.
        choices:
          - The outer-rim-heavy wheel, because radius enters rotational inertia squared.
          - The center-heavy wheel, because the drive shaft turns the center hub directly.
          - Neither; equal total mass means equal rotational inertia.
          - The center-heavy wheel, because its mass follows a tighter circle.
        answer: The outer-rim-heavy wheel, because radius enters rotational inertia squared.
        rebuttals:
          - What the drive turns is the whole assembly, and the center hub contributes least of it whatever it weighs.
          - Straight-line inertia depends on mass alone; rotational inertia depends on where the mass is.
          - Mass near the center axle does turn through a tighter circle, which is exactly why it is easier rather than harder.
  # ------------------------------------------------------------------ day 7
  - title: The period that ignores the load
    objective: Derive why a pendulum's timing does not depend on what is in it.
    briefing: Idowu has said for two seasons that the drive pushes at the wrong moment on a full boat.
    stake: >-
      Tuesday, and Sam Idowu has been saying the same thing for two seasons. On a heavy boat the
      second push arrives late, and you can feel it through the floor. He has been told each
      time that the ride is within its specification. It is. Today you derive the ship's period
      from the force that pulls it back to the middle. That gives a number to check the drive
      against, instead of an operator's account of a floor. You also float a loaded boat at the
      flume, and settle what the tower's timing gives for the local strength of gravity. Elena
      Bianchi, the weld inspection, has the swing arm booked for Thursday. She wants to know
      what load she is looking for cracks against.
    takeaway: A measured period is a measurement of the pendulum, and it can be turned into g.
    stops:
      - group: SHIP
        task: Derive the period from the restoring force
        title: Why the mass falls out
        concept: The pendulum period, and the cancellation that removes the mass from it
        place: The Pirate Ship
        scene: The boat hangs 8.6 metres below its pivot. In a low-angle maintenance test, Idowu logs 5.9 seconds per cycle whether the boat is full or empty. Nobody at the park can produce the expression that predicts it.
        guide: >-
          Build the small-angle period from the restoring force, a line at a time. Then
          finish the job properly and state where the small-angle result stops being
          exact. Idowu's 5.9 seconds was logged in a low-angle test, and the ride does
          not run at low angles.
        assumes:
          - for a small angle, the sine of the angle is close to the angle itself in radians
          - motion with a restoring force proportional to displacement repeats at a fixed rate
        takeaway: An approximation can preserve the right physical dependencies while becoming quantitatively wrong outside its valid range.
        format: DERIVE
        question: Derive the small-angle period from the restoring force, then state when that result should not be treated as exact.
        answerText: For small angles, T = 2π√(L/g) ≈ 5.9 s. Mass cancels; a 48° operating swing needs a measured period because the approximation is no longer exact.
        why: For a small angle, sinθ is close to θ, so the restoring force becomes proportional to displacement. That is the condition for simple harmonic motion. Mass appears in both the restoring force and ma, then cancels. The result is T = 2π√(L/g), which gives about 5.9 s for 8.6 m. The ride operates near 48 degrees, well outside the small-angle range. Its operating period must therefore be measured rather than assumed from this formula.
        derive:
          hint: Get the force in terms of the sideways displacement, compare with the form for harmonic motion, and read off what is left.
          start: F = −mg sinθ
          startNote: the component of the boat's weight along the arc, pulling it back to the middle
          goal: an expression for the period, and the quantities it contains
          steps:
            - ask: Write the restoring force in terms of the sideways displacement x.
              answer: 2
              candidates:
                - text: F = −mgθ, with θ the swing angle measured in degrees
                  rule: approximation
                  why: The approximation only holds with the angle in radians, where an angle and its sine agree to within a per cent up to about 15 degrees. In degrees the 2 differ by a factor of 57.
                - text: F = −mgL sinθ
                  rule: substitution
                  survives: true
                  why: That is the torque about the pivot rather than the force along the arc — correct physics, one line early, and it carries a length through everything below where a force belongs.
                - text: F = −mg(x/L), using sinθ ≈ x/L for a small swing
                  rule: approximation
                - text: F = −mgx
                  rule: approximation
                  why: Replacing the sine with the displacement itself loses the length. A ten-metre pendulum and a one-metre one would then have the same period, which is the one thing everybody knows is untrue.
            - ask: Compare it with the form that gives harmonic motion.
              answer: 0
              candidates:
                - text: ma = −(mg/L)x, so a = −(g/L)x and ω² = g/L
                  rule: comparison
                - text: ma = −(mg/L)x, so ω² = mg/L
                  rule: comparison
                  survives: true
                  why: The mass is on both sides and has to go from both. Keeping it makes the period depend on the load, which contradicts the console log this ride has been printing for 20 years.
                - text: ma = −(mg/L)x, so a = −(g/L)x and ω = g/L
                  rule: comparison
                  why: The comparison is with a = −ω²x, so what is read off is ω squared. Taking it as ω gives a period nearly six times too short.
                - text: F = −kx with k = mg/L, so the period depends on the stiffness alone
                  rule: substitution
                  why: "The effective stiffness is right and it is not the whole story: a period depends on the mass as well as the stiffness, and here the mass is inside k and cancels."
            - ask: Turn that into a period and evaluate it.
              answer: 1
              candidates:
                - text: T = 2π√(g/L) ≈ 6.7 s
                  rule: evaluation
                  why: The ratio is inverted. As written, a longer pendulum would swing faster, and the units come out as seconds to the minus one.
                - text: T = 2π√(L/g) ≈ 5.9 s
                  rule: evaluation
                - text: T = 2π√(L/g) ≈ 5.9 s, provided the boat is not loaded
                  rule: comparison
                  survives: true
                  why: "The expression is right and the condition is imaginary: the mass cancelled two lines ago. Attaching it means every future use of this result waits for a load figure nobody needs."
                - text: T = √(L/g) ≈ 0.94 s
                  rule: evaluation
                  why: The 2π is what converts an angular rate into a time for a whole cycle. Without it the answer is the time to swing about a sixth of the way.
      - group: FLUME
        task: Float a loaded boat on paper
        title: How far a full boat sits down
        place: The Log Flume
        scene: Fiona McCarthy, the flume operator, loads the boats by eye and still follows an inherited four-adult rule. The moulded hulls replaced the timber boats two seasons ago. Each new hull is 2.9 metres by 1.1 and weighs 180 kilograms.
        guide: >-
          Five numbers, and one of them is the depth of the hull side, which belongs to
          the freeboard question rather than to this one. Ask of each whether the
          sinking depends on it. A boat settles until it has pushed aside its own mass
          of water. So the answer needs a mass and an area, and the side height decides
          what happens next.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - a floating body pushes aside its own weight of water
          - water has a density of about 1000 kilograms per cubic metre
        takeaway: A floating body settles until the water it has pushed aside weighs what it does.
        format: BALLPARK
        question: Estimate how deep a boat with four adults sits in the water.
        why: A floating boat settles until the buoyant force equals its weight. That means the displaced water must have the same mass as boat plus passengers. Four adults bring the total to 492 kg, which requires about 0.492 m³ of displaced water. Spread over the hull area, that is about 0.154 m of depth in the water. A fifth adult still floats. The concern is the less hull side left above the water when the boat reaches splash-down and meets a rising wave.
        estimate:
          prompt: Boat 180 kg, 4 adults at 78 kg each, hull 2.9 m by 1.1 m and near enough rectangular.
          question: Estimate how deep a boat with four adults sits in the water.
          labels:
            - 492 kg  (boat plus 4 adults)
            - 1000 kg/m³  (density of water)
            - 2.9 m  (length of the hull)
            - 1.1 m  (width of the hull)
            - 0.30 m  (depth of the hull side)
          values: [492, 1000, 2.9, 1.1, 0.3]
          slots: 4
          template: "{0} ÷ {1} ÷ ({2} × {3})"
          formula: a/b/(c*d)
          correct: [0, 1, 2, 3]
          target: 0.154
          tolerance: 0.02
          units: m
          solution: Volume displaced = 492 ÷ 1000 = 0.492 m³; over 3.19 m² of hull that is 0.154 m deep in the water.
          explanation: The hull height left above the water is a separate safety margin used later; it is not part of this calculation.
          relationship: "Depth in water = mass ÷ (density × hull area): a boat sinks until it has pushed aside its own mass of water."
      - group: TOWER
        task: Get the local strength of gravity out of a period
        title: Measuring gravity with a boat
        place: The Drop Tower
        scene: The ship's low-angle maintenance period is 5.90 seconds with an 8.60 metre effective length. The safety engineer notes that the tower calculations use a local value of g nobody at this park has measured directly.
        guide: >-
          Four options, and two of them agree on the number and disagree on where it
          applies. Ask of each what the measurement is a property of: the ship, or the
          place. Length and time are what went in, and neither mentions the boat. One
          option gets the algebra wrong in a way that produces a plausible-looking small
          number.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - the pendulum period depends on the length and on g alone
          - an expression can be rearranged to make any of its quantities the subject
        takeaway: A physical constant measured by one system can calibrate another when both use a valid model of the same place.
        format: CHOICE
        question: What value of g follows from the low-angle period, and why can the tower use it?
        why: Rearrange the small-angle period relation to g = 4π²L/T². The inputs are a length and a time, both easy to measure over many cycles. Using 8.60 m and 5.90 s gives about 9.75 m/s². That value belongs to the location, not to the ship, so it can be used in the tower, coaster and flume calculations. The low-angle condition matters because the simple pendulum relation is the model being used.
        choices:
          - About 9.75 m/s²; the tower shares the same local gravity.
          - About 9.75 m/s²; the result belongs only to the ship that measured it.
          - No value follows until the boat's mass is included.
          - About 2.4 m/s²; using L/T² is enough once the period is measured.
        answer: About 9.75 m/s²; the tower shares the same local gravity.
        rebuttals:
          - Gravity is shared by every ride at the same location; the ship is only the measuring device.
          - Mass cancels from the small-angle period relation, so it is not an input to this measurement.
          - Leaving out the factor 4π² changes the result by nearly fortyfold.
  # ------------------------------------------------------------------ day 8
  - title: The arm and the crack
    objective: Get a load into a joint before anybody looks at the joint.
    briefing: Bianchi found an indication in a spider arm weld and will not say whether it matters.
    stake: >-
      Wednesday, and Elena Bianchi has found a mark 41 millimetres long in a weld. It sits at
      the root of the wheel's number nine spider arm. She has photographed it and sized it.
      Three times she has refused to say whether it matters. That is her discipline, not her
      opinion. A crack is a length in a material. Whether the length counts depends on the load,
      and the load is not her number. Priya Raman wants that load computed today. Today you
      derive the force in the hub bolt group from the out of balance moment. You also put a
      number on what a bumper crash does to a neck, and read the carousel's drive panel. Marsh
      has the ride on the reopening poster.
    takeaway: A defect cannot be judged until somebody has computed what the part it is in carries.
    stops:
      - group: WHEEL
        task: Derive the force in one wheel-center bolt
        title: What one wheel-center bolt is holding
        place: The Ferris Wheel
        scene: The loading imbalance reaches 177 kilonewton-metres. Each support arm joins the wheel center through eight bolts, each 0.42 metres from the center. Priya Raman points to number nine and asks what force one bolt must carry.
        guide: >-
          Build the torque statement down to the force in one bolt, one line at a time.
          The last line is not a number: you have to state the load-sharing assumption
          you just used, because the arithmetic only holds if the eight bolts carry
          equal shares — and Raman is asking about a specific bolt, number nine.
        background:
          - >-
              What the balance says. The applied moment has to be carried by the bolts'
              forces acting at their distance from the centre. Eight bolts on a circle of
              radius 0.42 metres therefore share the job, and each one's contribution is its
              force times that radius. Setting the total against 177 kilonewton-metres gives
              the force per bolt.
          - >-
              Why the assumption is the answer's fine print. Equal sharing needs the bolts
              equally tight, equally fitted and the joint stiff enough not to favour some
              over others. A slack or worn bolt sheds its share onto its neighbours, so the
              number you compute is a lower bound on what the worst bolt is really carrying.
          - >-
              Why number nine. It is the one nobody has a final answer about, which makes it
              the one where the assumption matters most: if the equal-share assumption fails
              anywhere it fails there, and the computed force is exactly the number the
              certification will quote.
        assumes:
          - torques about a point add to zero when nothing is turning
          - a ring of identical bolts shares a moment equally between them
        takeaway: A moment becomes a force the moment somebody asks what distance is resisting it.
        format: DERIVE
        question: Use the torque to find the force in one bolt, and state the load-sharing assumption.
        answerText: F = 177,000 ÷ (8 × 0.42) ≈ 52.7 kN in one bolt, assuming the eight bolts share the torque equally.
        why: "Turning a torque into a force needs a distance to divide by. Choosing that distance is the engineering. Here it is the bolt radius, since that is where the resisting forces act. About 52.7 kilonewtons per bolt is now the load the crack must be judged against. The assumption under it is worth saying out loud: equal sharing is what a drawing assumes, and an eighty-one-year-old joint only approximates it. Real joints can redistribute load."
        derive:
          hint: The bolt circle is what resists the moment. Write the resisting moment as a force times a distance times a count.
          start: Στ = 0
          startNote: applied moment 177 kN·m; 8 bolts on a circle of radius 0.42 m
          goal: the force carried by one bolt, and the assumption behind that number
          steps:
            - ask: Write the moment the bolt ring can resist.
              answer: 1
              candidates:
                - text: τ_resist = F × 0.42, taking the ring as a single fastening
                  rule: substitution
                  survives: true
                  why: A consistent statement about one bolt doing all the work. It over-sizes the force by a factor of eight, which errs safe here and would be an expensive answer to hand a supplier.
                - text: τ_resist = 8 × F × 0.42
                  rule: substitution
                - text: τ_resist = 8 × F × 0.84
                  rule: substitution
                  why: That is the diameter of the bolt circle. A moment arm is measured from the centre of rotation to the line of the force, which is the radius.
                - text: τ_resist = 8 × F
                  rule: equilibrium
                  why: A force with no distance attached is not a moment. The units on the two sides of the equation would not match.
            - ask: Set the two moments equal and solve for the force in one bolt.
              answer: 3
              candidates:
                - text: F = 177,000 × 8 × 0.42 ≈ 595,000 N
                  rule: rearrangement
                  why: Both the count and the arm are multiplying the unknown, so both divide. Here they have been multiplied instead, and the answer is 11 times the load in the entire arm.
                - text: F = 177,000 ÷ 0.42 ≈ 421,000 N
                  rule: rearrangement
                  survives: true
                  why: This is the total force the ring carries, which is a real and useful number, and it is not what one bolt sees. Sharing between eight is the step that has been skipped.
                - text: F = 177,000 ÷ 8 ≈ 22,100 N
                  rule: rearrangement
                  why: Dividing by the count alone leaves a moment rather than a force, and the arm is what converts one into the other.
                - text: F = 177,000 ÷ (8 × 0.42) ≈ 52,700 N
                  rule: rearrangement
            - ask: State what that number rests on.
              answer: 2
              candidates:
                - text: That every bolt is loaded equally, which is exact for a ring in a machine of this age.
                  rule: evaluation
                  why: Equal sharing is an assumption rather than a fact, and it is least true in an old joint where fit and tension vary bolt to bolt.
                - text: That the bolts carry the moment in shear, and nothing else is holding the arm.
                  rule: equilibrium
                  survives: true
                  why: A defensible reading of the joint, and it ignores the friction the bolt tension produces between the faces — which in a properly tightened joint carries much of the load and makes 52 kilonewtons a conservative figure.
                - text: That the eight bolts share equally, so a loose one puts more into its neighbours.
                  rule: evaluation
                - text: That the moment is the largest the wheel sees, so no other case need be checked.
                  rule: evaluation
                  why: Loading is the worst *static* case. It says nothing about wind, about stopping the wheel quickly, or about the cyclic swing every gondola makes as it comes over the top.
      - group: BUMPER
        task: Say what a collision does to a neck
        title: The tenth of a second that matters
        place: The Bumper Cars
        scene: Wei Chen's accelerometers show the car changing speed in about 0.10 seconds and the rider's head in about 0.18. The safety lead wants to know which interval belongs in a rule about rider force.
        guide: >-
          Four options, and two intervals on the trace. Ask of each whose momentum
          change the time belongs to. The car takes a tenth of a second. The rider takes
          longer, because padding and belt stretch let them arrive at the new speed
          gradually. Using the car's interval describes the car. That is also why safety
          design lengthens rather than shortens the time.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a change in momentum needs a force acting over a time
          - a body and the seat it sits in can change speed over different times
        takeaway: The same speed change over a longer time is a smaller force, and the time is a design choice.
        format: CHOICE
        question: Which time should the force on a rider be computed over, and why?
        why: Impulse connects force, time and momentum change. The correct time interval belongs to the body whose force you want. The rider's head and torso take about 0.18 s to match the car's new speed, longer than the bumper contact itself. Using 0.10 s would describe the car more closely and would overstate the rider force. Safety systems work by lengthening the rider's stopping time through padding, belt stretch and controlled seat motion.
        choices:
          - Use 0.18 s, the interval over which the rider changes momentum.
          - Use 0.10 s, because the car is the body that receives the collision.
          - Always use the shorter interval, because safety design should assume the largest force.
          - Time is unnecessary; the rider force follows from mass and speed change alone.
        answer: Use 0.18 s, the interval over which the rider changes momentum.
        rebuttals:
          - The car's time gives the force on the car, which is a question about the chassis rather than the rider.
          - Designing against the largest number sounds prudent and here it is simply the wrong body's number.
          - Masses give the change in speed; turning that into a force needs the time it happens over.
      - group: CAROUSEL
        task: Which explanation fits every reading?
        title: The drive that pulls unevenly
        place: The Carousel and Swings
        scene: The carousel drive has drawn uneven current since winter. Bisi Adeyemi has five readings from the control panel and the ring survey beside them. Two look alarming. Three are stubbornly ordinary.
        guide: >-
          Five readings, and the three ordinary ones do the work. The temperature has
          not moved. The speed is exactly where it was set. The average current is
          normal. Ask of each candidate how many of the five it covers. Something that
          peaks once per revolution is something fixed on the ground being met by
          something turning.
        background:
          - >-
              Why the unremarkable readings decide it. The salient reading is what draws
              attention, and it is usually consistent with several explanations at once,
              which is why it rarely settles anything. The readings that discriminate are
              the ones a candidate predicts should have moved and which have not: a normal
              value is a positive result against every mechanism that would have disturbed
              it.
          - >-
              How to work the candidates. Take each mechanism and predict the panel it
              implies before you look at the panel again — which readings it drives, in
              which direction, and by roughly how much. Then compare. Working that way round
              is what separates a diagnosis from a rationalisation, because the prediction
              is made before the data is consulted.
          - >-
              Why only one candidate survives. Several will account for part of the panel,
              deliberately so, and a partial fit is exactly what a confident wrong answer
              feels like from the inside. When two remain, look for the reading on which
              their predictions differ and let it decide. If no reading separates them you
              have not finished reading the panel.
        assumes:
          - a drive works harder when the load on it is greater
          - a bearing that is failing takes more torque to turn
        takeaway: The readings that are normal are what rule an explanation out.
        format: DIAGNOSIS
        why: "Once per revolution is the reading that decides it: something fixed on the ground is being met by something turning, once a turn. A failing centre bearing would draw more current all the way round and would be warm, and the temperature has not moved. A motor fault would not synchronise itself to the platform's rotation. And the speed is exactly where it is set, so nothing is running fast. The 11 millimetres is small, and it is at the right place in the cycle."
        headline: The drive current rises once every revolution, and the ride still runs at its set speed.
        readings:
          - zone: Drive
            label: Current
            value: peaks once a revolution
            status: alarm
          - zone: Drive
            label: Average current
            value: up 18% since autumn
            status: alarm
          - zone: Drive
            label: Speed held
            value: 8.0 rev/min steady
            status: normal
          - zone: Centre bearing
            label: Temperature
            value: unchanged
            status: normal
            note: rules out the main bearing
          - zone: Platform
            label: Level around the ring
            value: 11 mm low at 1 point
            status: high
        choices:
          - label: The platform is riding low at one bearing
            mechanism: A low spot loads one roller harder, once every turn.
          - label: The centre bearing is failing and stiffening
            mechanism: A dry bearing takes more torque and warms as it does it.
          - label: The drive motor is losing one of its windings
            mechanism: A motor down a phase draws more current for the same work.
          - label: The controller is mis-set and the ride is running fast
            mechanism: More speed is more power at the same torque.
        answer: The platform is riding low at one bearing
  # ------------------------------------------------------------------ day 9
  - title: The loop is not the loop on the drawing
    objective: Derive what the loop demands, and measure what it actually is.
    briefing: Kovač taped the crown of the loop yesterday and the radius is not the one on the 1974 drawing.
    stake: >-
      Thursday, and Marta Kovač put a tape over the crown of the loop yesterday afternoon.
      Nobody could find a reason not to. The drawing says the radius there is 5.6 metres. The
      tape says 7.4. Brennan's ninth notebook has a line under 1998. The top of the loop was
      reground after complaints of a rough ride. No drawing was ever changed. Vey is right this
      morning and says so quietly. A ride that has run 25 years on a number nobody checked is
      not the same as a ride with a margin. Today you derive the speed the loop demands at its
      crown. You also settle what a margin actually is, and read the ship's drive against
      yesterday's period. Everything worked out above the first drop now has to be done again.
    takeaway: A flatter loop is a gentler ride and a hungrier one, and both of those are the same number.
    stops:
      - group: COASTER
        task: Derive the speed the top of the loop demands
        title: What the loop asks for at the top
        place: The Coaster
        scene: At the top of the loop the track is above the train and the rider is upside down. Kovač's tape gives a radius of 7.4 metres there, against 5.6 on the drawing everyone has been working from.
        guide: >-
          Build the force statement at the crown of the loop down to a minimum speed,
          one line at a time. Then evaluate it twice — once for the 7.4 metres Kovač
          taped and once for the 5.6 on the drawing — because the point of the
          derivation is that it lets you answer for a radius nobody measured when the
          ride was designed.
        background:
          - >-
              Why the crown is the critical point. Upside down at the top, both the track's
              push and the rider's weight point the same way: towards the centre of the
              loop. That is the one place on the circuit where gravity is helping to turn
              the train, so it is the place where the least speed is needed to stay on the
              track — and below that speed the train does not fall off, the track has to
              pull, which it cannot.
          - >-
              What the minimum condition means. Setting the track force to zero is not a
              design target; it is the boundary of the possible. A real ride is engineered
              well above it, and the margin is the whole safety case. The derivation gives
              you the boundary, and the certificate gives you the margin.
          - >-
              Why two radii matter so much. The minimum speed goes as the square root of the
              radius, so a loop that is actually 7.4 metres across the crown demands more
              speed than a 5.6-metre one — and every calculation done from the drawing has
              been demanding too little. That is a paperwork problem with a physical
              consequence.
        assumes:
          - a body moving in a circle needs a net force toward the centre of that circle
          - a rail can push a train but cannot pull it
        takeaway: The limiting case is the one where a part stops doing anything, and it sets the number.
        format: DERIVE
        question: Work the force statement at the top of the loop down to a minimum speed, and evaluate it for both radii.
        answerText: At the measured radius, v_min = √(9.8 × 7.4) ≈ 8.5 m/s. The old drawing gives 7.4 m/s.
        why: At the top of the loop, both gravity and the rail can point toward the centre. The limiting case occurs when the rail's normal force just falls to zero. Then gravity alone must supply mv²/r, giving v_min = √(gr). A larger radius at the top of the loop therefore requires a larger minimum speed. Using 7.4 m gives about 8.5 m/s, compared with 7.4 m/s from the old 5.6 m drawing. Smoother geometry can still demand more speed.
        derive:
          hint: Write what is pushing toward the centre at the crown, then ask what happens as one of those forces goes to zero.
          start: N + mg = mv²/r
          startNote: at the crown the centre of the loop is below the train, so both forces point that way
          goal: the least speed the train can cross the crown at, for r = 7.4 m and for r = 5.6 m
          steps:
            - ask: Take the limiting case that fixes the minimum.
              answer: 1
              candidates:
                - text: Set v = 0, giving N = −mg at the crown
                  rule: limit
                  why: A stationary train at the crown is not a limiting case of a ride, it is a train falling off. The negative sign is the algebra reporting that the rail would have to pull.
                - text: "Set N = 0: the rail stops pushing, so mg = mv²/r"
                  rule: limit
                - text: Set N = mg, so the rider feels normal weight at the crown
                  rule: dynamics
                  survives: true
                  why: A perfectly sensible design condition and not the minimum. It gives a speed 40% higher than the limit, which is a comfort criterion being mistaken for a safety 1 — and if the ride is judged against it, a train that is safe reads as a failure.
                - text: Set N + mg = 0, so the 2 forces balance at the crown
                  rule: dynamics
                  why: Both forces point the same way at the crown — downward, toward the centre — so they add rather than cancel. Setting the sum to zero describes no situation on this track.
            - ask: Solve for the speed.
              answer: 0
              candidates:
                - text: v = √(gr), and the mass has cancelled
                  rule: cancellation
                - text: v = √(gr) for a full train, and less for an empty one
                  rule: cancellation
                  survives: true
                  why: The mass divided out of both sides one line ago. Attaching a load condition to the answer means the ride ends up with two limits where the physics offers one.
                - text: v = gr
                  rule: cancellation
                  why: The left side is a speed and the right is a speed squared. As written, the number for the measured radius is 73, which is not a speed anything on this site reaches.
                - text: v = √(g/r)
                  rule: evaluation
                  why: Inverting the radius makes a bigger loop need less speed, which is the opposite of what a wider curve does — and gives 1.2 m/s at the crown.
            - ask: Evaluate for both radii and say what changed.
              answer: 2
              candidates:
                - text: 8.5 m/s measured against 7.4 m/s drawn, so the drawing was conservative
                  rule: evaluation
                  why: Conservative means the drawing demanded more than reality does. It demanded less, which is the direction that spends a margin nobody knew they had.
                - text: 7.4 m/s measured against 8.5 m/s drawn, so the loop is easier than drawn
                  rule: evaluation
                  why: The radii have been swapped. The measured crown is the wider one, and a wider crown is the one that needs more speed.
                - text: 8.5 m/s measured against 7.4 m/s drawn — the real loop demands 15% more
                  rule: evaluation
                - text: 8.5 m/s measured against 7.4 m/s drawn, a difference of 1.1 m/s in the margin
                  rule: dynamics
                  survives: true
                  why: The subtraction is right and the framing hides the size of it. What matters is the ratio to what the train actually has, and quoted as a difference it reads like small change.
      - group: TOWER
        task: Say what a margin is a statement about
        title: What a safety factor says
        place: The Drop Tower
        scene: The inspection file gives the coaster a margin of 1.38 using the old loop drawing. The measured top of the loop reduces it to 1.20. The park manager wants to know whether that still counts as a pass.
        guide: >-
          Four readings of a margin that fell from 1.38 to 1.20. Ask of each whether it
          puts the change in the ride or in the knowledge of it. A margin is capacity
          divided by demand, and only one of those moved. Nothing about the train
          changed over the winter. And a smaller known margin is safer than a larger
          imaginary one, because it can drive an operating rule.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a margin is a ratio between what is available and what is required
          - a requirement can be recomputed when the geometry it rests on changes
        takeaway: A margin is a ratio, and it means nothing until both of its numbers are named.
        # Converted from a CHOICE. `safety factor = capacity ÷ demand` is on this course's
        # syllabus and was computed by no question in the game, because a CHOICE has no
        # relationship, template or worked solution and so cannot compute anything. The
        # campaign's headline number — a certificate that has said 1.38 for twenty-five
        # years while the ride has had 1.20 — was a number the player read rather than one
        # they worked out. The objective is unchanged: a margin is a ratio, and it means
        # nothing until both of its numbers are named.
        format: BALLPARK
        question: Recompute the margin at the top of the loop from the speed the train has and the speed the crown demands.
        answerText: About 1.20 — 8.5 metres a second in hand against 8.5 demanded is not the 1.38 the file has carried since 1974.
        why: >-
          A safety margin is capacity divided by demand, and only one of them moved. The
          train still crosses the crown at about 10.2 metres a second, which is what it did
          last season and the season before. The measured radius raised the *demand* from
          7.4 metres a second to 8.5, so the ratio falls from 1.38 to 1.20. The ride was
          already in this state before anybody measured it correctly: what changed today is
          the park's knowledge, and a smaller known margin is safer than a larger imaginary
          one because it can drive an operating rule. Note which two numbers the board wants
          — the drawing's 7.4 is the old demand and belongs to the comparison, not to the
          margin.
        estimate:
          relationship: A safety factor is capacity divided by demand — here the speed the train has, over the speed the crown requires.
          prompt: The train crosses the crown at about 10.2 m/s. The measured radius demands 8.5 m/s; the 1974 drawing implied 7.4.
          question: Estimate the margin at the top of the loop against the measured requirement.
          labels:
            - 10.2 m/s  (speed the train actually has at the crown)
            - 8.5 m/s  (speed the measured crown demands)
            - 7.4 m/s  (speed the 1974 drawing implied)
            - 1.38  (the margin on the certificate)
            - 7.4 m  (measured radius at the crown)
          values: [10.2, 8.5, 7.4, 1.38, 7.4]
          slots: 2
          template: "{0} ÷ {1}"
          formula: a/b
          correct: [0, 1]
          target: 1.2
          tolerance: 0.06
          units: (ratio)
          solution: 10.2 ÷ 8.5 = 1.20, against 10.2 ÷ 7.4 = 1.38 on the old drawing.
          explanation: Capacity over demand, and both have to be speeds at the same point on the track. The old drawing's figure is the comparison rather than the margin, and the radius and the certificate value are the inputs to the other two numbers rather than to this one.
      - group: SHIP
        task: Which explanation fits every reading?
        title: Idowu was right
        place: The Pirate Ship
        scene: The drive pushes the boat at a fixed interval set years ago. A low-angle test gives 5.9 seconds, while the 48° operating swing measures about 6.15. Five console readings are available and three look ordinary.
        guide: >-
          Five readings, and the ordinary ones matter. The bearing temperature is
          normal. The drive delivers its rated push. Ask of each candidate how many of
          the five it covers. The deciding reading is the operating period, which at 48
          degrees is not the small-angle figure the drive was set to. Heavy loads expose
          a timing mismatch sooner, because they need more good pushes.
        background:
          - >-
              Why the unremarkable readings decide it. The salient reading is what draws
              attention, and it is usually consistent with several explanations at once,
              which is why it rarely settles anything. The readings that discriminate are
              the ones a candidate predicts should have moved and which have not: a normal
              value is a positive result against every mechanism that would have disturbed
              it.
          - >-
              How to work the candidates. Take each mechanism and predict the panel it
              implies before you look at the panel again — which readings it drives, in
              which direction, and by roughly how much. Then compare. Working that way round
              is what separates a diagnosis from a rationalisation, because the prediction
              is made before the data is consulted.
          - >-
              Why only one candidate survives. Several will account for part of the panel,
              deliberately so, and a partial fit is exactly what a confident wrong answer
              feels like from the inside. When two remain, look for the reading on which
              their predictions differ and let it decide. If no reading separates them you
              have not finished reading the panel.
        assumes:
          - a push in step with an oscillation adds energy and an out-of-step push can remove it
          - the small-angle pendulum formula is approximate at a 48-degree swing
        takeaway: Resonance depends on phase, so the useful period is the one the operating system actually follows.
        format: DIAGNOSIS
        question: Which explanation fits the full set of readings, including the operating period?
        why: The operating period is the deciding reading. At 48 degrees the small-angle estimate is no longer exact, and the measured cycle is about 6.15 s. The bearing temperature is normal, so extra damping from drag is not the main loss. The drive also delivers its rated push. The remaining problem is timing. Each early push reaches the boat at the wrong phase and transfers less useful energy. Heavy loads expose the mismatch sooner because they need more well-timed pushes to reach angle.
        headline: Light loads nearly reach the set angle. Heavy loads fall short, while the measured operating period stays about 6.15 s.
        readings:
          - zone: Drive
            label: Push interval
            value: 5.85 s (fixed since 1996)
            status: alarm
          - zone: Swing
            label: Measured period
            value: 5.90 s at low angle, either way
            status: normal
          - zone: Swing
            label: Angle reached
            value: 48° empty and 39° full
            status: alarm
          - zone: Drive
            label: Push force
            value: at its setting
            status: normal
          - zone: Bearing
            label: Temperature and play
            value: inside limits
            status: normal
            note: rules out friction in the pivot
        choices:
          - label: The drive interval does not match the boat's operating period.
            mechanism: A mistimed push can arrive before the boat reaches the phase where it adds energy.
          - label: The pivot bearing adds drag only when the boat is heavily loaded.
            mechanism: Extra drag would also raise the bearing temperature and motor load.
          - label: The drive delivers too little force on every push.
            mechanism: A weak drive would reduce the response without changing when each push arrives.
          - label: Extra rider mass makes the pendulum's period much longer.
            mechanism: Mass cancels from the pendulum timing to first order.
        answer: The drive interval does not match the boat's operating period.
  # ----------------------------------------------------------------- day 10
  - title: Everything above the first drop, again
    objective: Recompute the circuit against the loop it actually has.
    briefing: Every margin computed before yesterday rests on a radius that was wrong.
    stake: >-
      Friday, and the second week ends with the coaster's file open on the bench. Every number
      in it above the first drop is now in doubt. The train crosses the crown at about 10.2
      metres a second. The crown now demands 8.5. That is a margin of 1.20, where the
      certificate claimed 1.38. Kovač's clipboard says the station speed has fallen 0.9 metres a
      second in 3 seasons. Today you turn a crash into a force on a neck. You also decide what
      to change on the bumper floor, and size the pump that lifts the flume's water back up. Vey
      will not sign a coaster whose margin is shrinking. Somebody has to say how fast it
      shrinks, and what would be measured to catch it.
    takeaway: A margin that moves is a schedule, and a margin that is checked each morning is a rule.
    stops:
      - group: BUMPER
        task: Derive the average force on a rider
        title: Turning a collision into a force
        place: The Bumper Cars
        scene: The rider's own speed change in Wei Chen's telemetry is 1.47 metres a second over 0.18 seconds. The safety lead wants that turned into a force and then compared with the rider's weight.
        guide: >-
          Build the impulse statement down to an average force on a sixty-kilogram
          rider, one line at a time. Then express that force as a multiple of the
          rider's own weight. In newtons the number means nothing to the safety lead; as
          a multiple of body weight it is a comparison they can use.
        assumes:
          - impulse is force times time and equals the change in momentum
          - a rider's weight is their mass times g
        takeaway: A force from a collision is a momentum change divided by the time somebody was given to make it.
        format: DERIVE
        question: Work the impulse statement down to an average force on a 60 kilogram rider, and express it against their own weight.
        answerText: F = 60 × 1.47 ÷ 0.18 ≈ 490 N, which is about 0.83 of the rider's own weight.
        why: Impulse equals the change in momentum, so average force is momentum change divided by contact time. The rider changes speed by 1.47 m/s over 0.18 s. For a 60 kg rider, that gives about 490 N. Compared with body weight, the force is roughly 0.83 g. The design lever is time. Stretching the same momentum change over a longer interval lowers the average force in direct proportion, which is why padding and compliant restraints help.
        derive:
          hint: Write the impulse relation, solve for the force, and then compare it with something the reader already has a feel for.
          start: FΔt = mΔv
          startNote: rider 60 kg, change of speed 1.47 m/s, over 0.18 s
          goal: the average force, and what it is as a multiple of the rider's weight
          steps:
            - ask: Solve for the average force.
              answer: 2
              candidates:
                - text: F = mΔvΔt = 60 × 1.47 × 0.18 ≈ 15.9 N
                  rule: rearrangement
                  why: The time multiplies the force in the relation, so it divides when the force is made the subject. Multiplying gives a number a hundredth of the real one.
                - text: F = Δv/(mΔt) = 1.47 ÷ (60 × 0.18) ≈ 0.14 N
                  rule: rearrangement
                  why: "The mass belongs on top: a heavier rider needs a larger force for the same change of speed in the same time. As written, this says the opposite."
                - text: F = mΔv/Δt = 60 × 1.47 ÷ 0.18 ≈ 490 N
                  rule: rearrangement
                - text: F = mΔv/Δt with Δt taken as the car's 0.10 s, giving ≈ 880 N
                  rule: definition
                  survives: true
                  why: Arithmetically clean, and it is the wrong body's time. The rider's momentum changes over the time the seat and their neck take, and using the car's collision time nearly doubles the answer.
            - ask: Express it against the rider's own weight.
              answer: 0
              candidates:
                - text: 490 ÷ (60 × 9.8) ≈ 0.83, so about 8 tenths of their weight
                  rule: comparison
                - text: 490 ÷ 60 ≈ 8.2, so about 8 times their weight
                  rule: comparison
                  survives: true
                  why: Dividing by the mass gives an acceleration, not a ratio, and 8.2 metres per second squared has been read as a multiple of weight. The number is real and it is not what it is being called.
                - text: 490 × 9.8 ≈ 4,800, so nearly 5000 times their weight
                  rule: evaluation
                  why: Multiplying a force by g gives nothing with a meaning. Weight is a force already; the comparison is a division.
                - text: 490 N is the weight of a 490 kg person, so it is 8 times a rider
                  rule: definition
                  why: A newton and a kilogram are not the same unit. 490 newtons is the weight of a fifty-kilogram mass, near enough 1 rider rather than 8.
      - group: COASTER
        task: Turn a shrinking margin into something measurable each morning
        title: A margin that moves
        place: The Coaster
        scene: The top-of-loop margin is 1.20. Marta Kovač's clipboard shows station return speed falling about 0.3 metres a second each season. Each spring measurement used the same wheel and the same method.
        guide: >-
          Four candidate rules, and the quantity that matters is hard to measure every
          morning. Ask of each whether the crew could actually do it before opening,
          every day. Station return speed is easy and consistent, and the ride's own
          losses link it to the speed at the top. A yearly recalculation cannot catch a
          decline soon after it starts.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - friction losses grow as wheels and bearings wears
          - a margin can be watched by measuring something easier than the quantity itself
        takeaway: A quantity nobody can measure daily is watched through one that can be.
        format: CHOICE
        question: What should the certificate require, given a margin that falls a little each season?
        why: The quantity that matters at the loop is speed at the top of the loop, but measuring it every morning would be difficult. Station return speed is easy to measure consistently. The two are linked by the ride's energy losses, so one can serve as a practical stand-in for the other. A daily minimum catches a decline soon after it begins. A yearly recalculation does not. The rule turns a hidden margin into a number the opening crew can actually watch.
        choices:
          - Set a minimum station return speed for each morning.
          - Recompute the loop margin every spring before the season opens.
          - Reweigh the train whenever the margin is questioned.
          - Measure speed at the top of the loop on every circuit automatically.
        answer: Set a minimum station return speed for each morning.
        rebuttals:
          - An annual check is the interval that let a 1998 track alteration go unnoticed for 25 years.
          - The train's mass cancels out of every limit computed this fortnight, so reweighing settles nothing.
          - Measuring that speed directly would be ideal, but adding permanent sensors at the top of the loop is a major installation.
      - group: FLUME
        task: Size the pump against the lift it has to make
        title: What the water costs to put back
        place: The Log Flume
        scene: The flume returns 0.42 cubic metres of water a second to an elevated tank 9.4 metres up. Abara's pump is rated at 55 kilowatts, and he has never known whether that leaves much spare capacity.
        guide: >-
          Six numbers, and one of them is the pump's rated capacity, which the answer is
          compared against rather than built from. Ask of each whether the power depends
          on it. Efficiency divides rather than multiplies, so getting it the wrong way
          round makes the pump look comfortable. It is rated at 55 kilowatts.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - lifting a mass stores energy equal to its weight times the height
          - a pump delivers less than it draws, by its efficiency
        takeaway: Power sizing needs the useful lifting power and the efficiency loss before anybody can say what is left over.
        format: BALLPARK
        question: Estimate the electrical power the pump needs at 72% efficiency.
        why: "The flow rate times density is the mass moved each second. Raising that water through 9.4 m gives useful power of about 38.7 kW. Because the pump is only 72% efficient, the electrical input must be larger: about 53.7 kW. Set that against the 55 kW rating and only about two per cent is left over. That is why heat, wear or a little extra lift height can trip the pump."
        estimate:
          prompt: 0.42 m³/s of water lifted 9.4 m, water at 1,000 kg per cubic metre, pump 72% efficient.
          question: Estimate the electrical power the pump needs at 72% efficiency.
          labels:
            - 0.42 m³/s  (flow returned to the tank)
            - 1000 kg/m³  (density of water)
            - 9.8 m/s²  (g)
            - 9.4 m  (height it is lifted)
            - 0.72  (efficiency of the pump)
            - 55000 W  (the pump's rated capacity)
          values: [0.42, 1000, 9.8, 9.4, 0.72, 55000]
          slots: 5
          template: "{0} × {1} × {2} × {3} ÷ {4}"
          formula: a*b*c*d/e
          correct: [0, 1, 2, 3, 4]
          target: 53700
          tolerance: 3000
          units: W
          solution: P = ρgQh ÷ η = 1,000 × 9.8 × 0.42 × 9.4 ÷ 0.72 ≈ 53.7 kW.
          explanation: The useful power is 38.7 kW; the efficiency divides rather than multiplies, since the pump has to draw more than it delivers.
          relationship: "P = ρgQh ÷ η: the power is the weight of water lifted each second times the height, divided by the pump's efficiency."
  # ----------------------------------------------------------------- day 11
  - title: The day the flume behaved
    objective: Close the books on the water while there is nothing going wrong.
    briefing: Nothing broke over the weekend, which is the first time that has happened this month.
    stake: >-
      Monday of the third week, and nothing is wrong. The flume ran all weekend on the new pump
      curve. The coaster's morning speed came in where Friday's rule says it should. Vey spent
      the afternoon reading rather than asking. Kelechi Abara has wanted a derivation for the
      outlet speed since the first week. This is the first day anybody has had the time. Today
      you derive the speed the water leaves the chute at. You also settle what the carousel's
      controller does when the limit is reached, and put a number on the wind load a gondola
      carries. Marsh has started telling people the park opens in 11 days. She has not said that
      out loud since October.
    takeaway: The morning to close a set of books is the one where nothing is asking to be fixed.
    stops:
      - group: FLUME
        task: Derive the speed the water leaves the chute at
        title: The same square root, from a different law
        place: The Log Flume
        scene: The chute outlet is 4.2 metres below the surface of the water standing in the top pond. Abara has a figure from the manufacturer and no derivation, and both surfaces are open to the air.
        guide: >-
          Build the energy statement for the flow down to the speed at the outlet, one
          line at a time. Then say what it has in common with the drop tower on day one
          — the same square root arrives from a different law, and noticing that is the
          point of putting the two stops in one campaign.
        background:
          - >-
              Why the pressures cancel. Both surfaces are open to the air, so the pressure
              term is the same at each end and drops out. What is left relates the height
              difference to the speed, and the result is the same √(2gh) the falling
              carriage gave — because in both cases gravitational energy is being turned
              into motion with nothing else taking a share.
          - >-
              What is being assumed. Steady flow, no viscosity, and a pond surface large
              enough that its own level barely moves. Real chutes lose to friction and
              turbulence, so the derived speed is an upper bound, and the manufacturer's
              figure being lower is what you would expect rather than a contradiction.
          - >-
              Why the same answer twice matters. A student who derives √(2gh) from
              kinematics and again from an energy statement about a fluid has met the same
              physics wearing two different notations. That recognition is worth more than
              either result, and it is why the flume is on the syllabus at all.
        assumes:
          - for steady incompressible flow, continuity keeps area times speed constant
          - pressure, motion and height together account for the mechanical energy of a flowing liquid
        takeaway: A height drop can become speed in a falling object or in a flowing liquid because both are energy conversions.
        format: DERIVE
        question: Work the energy statement for the flow down to the outlet speed, and say what it has in common with the drop tower.
        answerText: The outlet speed is v₂ = √(2 × 9.8 × 4.2) ≈ 9.1 m/s. It matches the speed gained by a body falling through the same height.
        why: Write the fluid's mechanical energy per unit mass between the upper surface and the outlet. Both points are open to air, so atmospheric pressure cancels. Continuity says the broad pond surface moves much more slowly than water in the narrow chute, so its kinetic term is negligible. The 4.2 m height drop then gives v = √(2gh). The tower reached the same expression through kinematics. Both cases turn gravitational potential energy into motion.
        derive:
          hint: Write the statement at the top surface and at the outlet, then strike out everything that is the same at both.
          start: P₁ + ½ρv₁² + ρgh₁ = P₂ + ½ρv₂² + ρgh₂
          startNote: point 1 is the pond surface, point 2 the open chute 4.2 m below it
          goal: the speed the water leaves the chute at
          steps:
            - ask: Strike out what is equal at the two points.
              answer: 3
              candidates:
                - text: The heights cancel, since both points are in the same body of water
                  rule: cancellation
                  why: The height difference is the entire driving term. Cancelling it leaves an expression saying still water squirts, which is the one thing everybody knows it does not do.
                - text: The pressures cancel, and the pond surface speed is what the answer depends on
                  rule: cancellation
                  why: The first half is right and the second reverses it. The pond falls a millimetre a minute, which is why its speed term is the one that can be dropped.
                - text: Nothing cancels, since the two points are in different places
                  rule: conservation
                  survives: true
                  why: Formally safe and it refuses the method. Both surfaces are open to the air, so the pressures are equal and identical terms on both sides may be struck out — which is what makes this statement usable with a tape measure.
                - text: The pressures cancel, both being atmospheric, and v₁ ≈ 0 at the pond surface
                  rule: cancellation
            - ask: Solve what is left for the outlet speed.
              answer: 0
              candidates:
                - text: ρg(h₁ − h₂) = ½ρv₂², so v₂ = √(2g(h₁ − h₂))
                  rule: substitution
                - text: ρg(h₁ − h₂) = ½ρv₂², so v₂ = √(g(h₁ − h₂))
                  rule: substitution
                  survives: true
                  why: The half in the kinetic term becomes a two when it is moved across. Dropping it gives a speed 30% low, and the expression still looks like the one in every textbook.
                - text: ρg(h₁ − h₂) = ½ρv₂², so v₂ = 2g(h₁ − h₂)/ρ
                  rule: substitution
                  why: The density is on both sides and divides out. Leaving it below makes the answer depend on what the liquid is, and this expression is the same for water, oil and mercury.
                - text: v₂ = √(2g(h₁ − h₂)) only if the chute is vertical
                  rule: conservation
                  why: Energy accounts for the height dropped and not the path taken to drop it, which is the same reason the ship's swing and the tower's fall share an expression.
            - ask: Evaluate it, and say what it is the same as.
              answer: 1
              candidates:
                - text: v₂ ≈ 9.1 m/s, and it is a coincidence that it looks like the free-fall expression
                  rule: evaluation
                  why: Not a coincidence. Both statements say the same thing — a height has been converted into motion — and one is written per unit mass and the other per unit volume.
                - text: v₂ ≈ 9.1 m/s, the same expression the tower gives for a 4.2 m fall
                  rule: evaluation
                - text: v₂ ≈ 4.2 m/s, the height being what the water leaves at
                  rule: evaluation
                  survives: true
                  why: Reading the answer straight off the head is dimensionally impossible — a length is not a speed — and it lands close enough to be believed by somebody in a hurry.
                - text: v₂ ≈ 82 m/s, from the square of the head
                  rule: evaluation
                  why: The expression takes a root rather than a square. 82 metres a second out of a log flume would be worth seeing.
      - group: CAROUSEL
        task: Decide what the controller does at the limit
        title: A limit somebody can pass
        place: The Carousel and Swings
        scene: |-
          The derived limit for the swings is ten turns a minute. Adeyemi has to wire what happens when the controller is asked for 11, and there are 4 ways to do it.
        guide: >-
          Four ways to wire a limit, and all four record something. Ask of each whether
          the machine enforces the number or a person does. An alarm still leaves the
          choice with the operator. A log arrives after the exceedance. And rounded
          inputs are not a licence to add ten per cent, because the clearance that
          produced the limit has not moved.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        takesAsRead:
          - "Velocity against speed: direction is part of the quantity"
          - "Centripetal acceleration: v² over r, pointing at the centre"
        assumes:
          - a limit that is not enforced by the machine can be exceeded by an operator
          - a ride can be made to refuse a setting rather than to warn about it
        takeaway: A safety limit only works when the response to crossing it is defined before the limit is reached.
        format: CHOICE
        question: What should the controller do when the speed setting is pushed past ten turns a minute?
        why: A calculated limit matters only if the machine enforces it. An alarm still lets an operator choose to exceed the value. A log records the exceedance after it has already happened. The controller should therefore refuse settings above the derived limit. That makes the physics part of the machine rather than a suggestion beside it. Rounding the inputs does not justify adding an arbitrary ten percent, because the physical clearance that produced the limit has not changed.
        choices:
          - Refuse the setting outright, with no key override on the ride's own panel.
          - Sound an alarm on the panel and let the operator decide whether to carry on.
          - Log the exceedance for the maintenance report at the end of the week.
          - Allow it up to 11, since the derivation used rounded figures anyway.
        answer: Refuse the setting outright, with no key override on the ride's own panel.
        rebuttals:
          - An alarm hands a safety decision to whoever is most tired, at the moment they are busiest.
          - A log turns the limit into something reviewed on Friday about a Saturday.
          - Rounded inputs do not make a limit approximate; the geometry the number comes from is fixed.
      - group: WHEEL
        task: Put a number on the wind a passenger cabin carries
        title: What the wind does to a passenger cabin
        place: The Ferris Wheel
        scene: A passenger cabin presents about 4.2 square metres side-on. Raman wants the force on 1 at the 22 metres a second the county's rule names, before anybody argues about the limit.
        guide: >-
          Six numbers, and one of them is the number of cabins on the wheel, which
          belongs to a later total. Ask of each whether the force on one cabin depends
          on it. And note the square on the wind speed. Twenty-two to thirty metres a
          second is nearly twice the force, which is why a rule watches gusts rather
          than the daily mean.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - moving air exerts a force on a surface that grows with the square of its speed
          - air has a density of about 1.2 kilograms per cubic metre
        takeaway: A wind limit is a force limit in disguise, and the square is why the last few metres a second matter most.
        format: BALLPARK
        question: Estimate the wind force on 1 passenger cabin at 22 metres a second.
        why: Wind force scales with the square of speed. For this passenger cabin, 22 m/s produces about 1.46 kN of sideways force. Doubling wind speed would quadruple that load. Even a rise from 22 to 30 m/s increases the force by about 86%. That steep growth is why gust speed matters more than the daily mean. A sensible operating rule starts action below the structural limit because unloading and stopping the wheel take time.
        estimate:
          prompt: Passenger-cabin area 4.2 m² side-on, drag coefficient 1.2 (a shape factor), air density 1.2 kg/m³, wind 22 m/s.
          question: Estimate the wind force on 1 passenger cabin at 22 metres a second.
          labels:
            - 0.5  (the factor in the wind-force formula)
            - 1.2 kg/m³  (density of air)
            - 1.2  (drag coefficient, a shape factor for the cabin)
            - 4.2 m²  (area presented to the wind)
            - 22 m/s  (wind speed)
            - 24  (passenger cabins on the wheel)
          values: [0.5, 1.2, 1.2, 4.2, 22, 24]
          slots: 5
          template: "{0} × {1} × {2} × {3} × {4} × {4}"
          formula: a*b*c*d*e*e
          correct: [0, 1, 2, 3, 4]
          target: 1464
          tolerance: 90
          units: N
          solution: F = ½ρC_dAv² = 0.5 × 1.2 × 1.2 × 4.2 × 22² ≈ 1,460 N on 1 passenger cabin.
          explanation: The speed enters squared, which is why the same passenger cabin carries a quarter of this at 11 metres a second.
          relationship: "F = ½ρC_dAv²: wind force depends on air density, a shape factor, exposed area and the square of wind speed."
  # ----------------------------------------------------------------- day 12
      - group: FLUME
        task: Set the water cannon on the midway stall.
        title: Angle and charge, at three marks
        concept: "Free fall: everything falls at the same rate whatever its mass"
        place: The Log Flume
        scene: The old midway stall has a water cannon and three targets across the pond. The pressure dial is unmarked, the pump is thirty years old, and nobody has a number for what it delivers.
        guide: >-
          Set the angle and the charge, and fire. Three marks, working outward. The dial is
          relative and the pump is worn, so nothing here tells you the launch speed — the way
          to find it is to fire, watch, and put the next shot between two you have seen.
        background:
          - >-
              Why there is no calculation to do first. Every other stop in this park hands you a
              number and asks what follows from it. This one hands you a dial with no units on a pump
              nobody has tested, which is the honest situation and the reason a fairground game is
              learned rather than solved.
          - >-
              What the flight tells you anyway. Once the water leaves the nozzle, gravity is the only
              thing acting on it downward, and it pulls the same whatever the jet weighs. Time in
              the air is set by the vertical part of the launch and nothing else, so a steeper shot
              hangs longer and lands shorter at the same charge.
          - >-
              Why past forty-five degrees it gets worse. Aim higher and more of the same charge goes
              into height instead of distance. The far mark wants a flatter shot than the near one,
              which is the opposite of what everybody tries first.
        assumes:
          - a thrown or fired thing rises and falls under gravity
        takeaway: Some quantities are read off an instrument, and a few are found by trying them.
        format: LOB
        question: Land the jet on each mark, working outward.
        answerText: Bracket each mark with a short shot and a long one, then put the third between them. The far mark needs a flatter angle than it looks, not more charge.
        why: >-
          There is no number to start from, and that is the point of this stall. The dial is
          unmarked, the pump is worn, and the only honest method is bracketing: fire short,
          fire long, and put the third shot between two settings you have actually watched.
          What the flights teach while you do it is the physics the rest of the park is built
          on. Once the water is in the air, gravity acts downward and nothing else does, and it
          pulls at the same rate whatever the jet weighs — so the time in the air is set by the
          vertical part of the launch alone. That is why a steeper shot hangs longer and still
          lands shorter at the same charge, and why past forty-five degrees the extra effort
          goes into height rather than distance. The far mark wants a flatter shot, which is
          the opposite of what everybody tries, and finding that out by firing is the fastest
          anybody ever learns it.
        lob:
          shots: 3
          maxSpeed: 34
          gravity: 9.81
          wind: 0
          height: 1.2
          hint: Two shots bracket a mark. The third goes between them.
          targets:
            - { label: Bucket on the rail, distance: 32, radius: 2.5 }
            - { label: Bell on the post, distance: 68, radius: 2 }
            - { label: Far ring, distance: 104, radius: 1.8 }
          commit: Report the shots
  - title: The first hot Saturday
    objective: Set the limits the ride will be operated to when nobody has time to think.
    briefing: 30 degrees forecast, a gusting westerly, and a queue that will not stop all afternoon.
    stake: >-
      Tuesday, and the forecast for opening weekend came in this morning. Thirty degrees, with a
      westerly gusting through the afternoon. Georgia Hart's point has been the same all
      fortnight. Today it is the whole agenda. Whatever gets decided in this workshop has to be
      doable by a nineteen year old. It has to work on the four hundredth cycle of a hot day.
      Today you set the wind rules for the wheel, with the lead time built into them. You also
      decide what to do about the ship's drive, and settle how the tower's brake gets proved
      rather than claimed. Vey has said he will witness whatever tests are run on Thursday. He
      signs, or does not sign, on Friday morning.
    takeaway: A limit written for a calm Tuesday is not a limit; it has to work on the worst afternoon of the year.
    stops:
      - group: WHEEL
        task: Write the wind rules with their lead time
        title: Stopping a wheel takes time
        place: The Ferris Wheel
        scene: |-
          Emptying the wheel takes about eight minutes and clearing the queue takes longer. Raman has the forecast updates on the board and wants the queue threshold set before the gusts arrive rather than during them.
        guide: >-
          One rule, written before the forecast updates arrive and fixed once released. Closing the
          queue and clearing the people already standing in it takes two hours, and at 22 m/s the
          wheel must not be carrying anybody. So the line goes back from 22 by however far the gusts
          climb in two hours — and not so far back that the ride is shut on a breezy afternoon.
        background:
          - >-
              Why a threshold is not a limit. The structural limit is where the wheel must
              already be stopped. The threshold is where you start stopping, and the gap
              between them is the time the action needs. Setting the threshold at the limit
              means beginning the evacuation at the moment it should have finished.
          - >-
              Why the two thresholds differ. Emptying the wheel and clearing the queue are
              different jobs with different durations and different consequences if they
              overrun. Two actions with the same lead time would be one rule; the reason
              there are two numbers to set is that one of them takes longer than the other.
          - >-
              Why the board is released rather than adjusted. Gusts arrive as a series of
              forecast updates, and adjusting a rule while the updates come in is how an
              operator ends up justifying whatever they have already done. Writing both
              numbers first is what makes them a rule instead of a commentary.
        assumes:
          - a wheel cannot be emptied instantly, and every action here needs warning
          - wind force grows with the square of the speed
        takeaway: A threshold has to fire early enough for the action behind it to finish.
        format: TRIGGER
        question: >-
          At what gust speed do you close the queue, given clearing the people already in it takes
          two hours?
        trigger:
          hint: >-
            The rule needs enough warning for what it starts to finish. The limit is where the queue
            must already be clear, not where the clearing begins.
          scale:
            label: Gust speed
            unit: m/s
            min: 0
            max: 32
            step: 0.5
            anchors:
              - { at: 8, means: 'a stiff breeze; the wheel carries its normal load' }
              - { at: 23, means: 'gondolas swinging out of plumb, and nobody can be unloaded' }
          objective: >-
            The queue is closed and cleared before the gusts reach the 22 m/s structural limit.
          rehearsal:
            note: the front that came through in May
            stream:
              - { value: 6, hoursLeft: 6 }
              - { value: 9, hoursLeft: 4 }
              - { value: 14, hoursLeft: 2 }
              - { value: 16, hoursLeft: 1 }
          conditions:
            - id: queue
              label: Close the queue and stop loading
              leadHours: 2
              window: { min: 10, max: 14 }
              owner: Hart
              action: turn the queue away and let the wheel run down
          stream:
            - at: 11:00
              value: 8
              hoursLeft: 6
              update: steady westerly, forecast rising through the afternoon
            - at: 13:00
              value: 12
              hoursLeft: 4
              update: gusts building; the queue is at 90 minutes
            - at: 15:00
              value: 18
              hoursLeft: 2
              update: gusting hard enough to move the empty gondolas
            - at: 16:00
              value: 23
              hoursLeft: 1
              update: past the structural limit; the wheel should already be standing
          release: Release the afternoon
          commit: Stand by the rules
        answerText: >-
          Close the queue on the 12 m/s update. It fires with the two hours clearing needs; the next
          update is 18 m/s with two hours to the limit and nobody moved yet.
        why: A wind threshold is useful only if the action behind it can finish before conditions become unsafe. Those two jobs take an eight-minute unload and rather more than that to run the queue down, and both have to be over before the gusts arrive. Their lead times force the first triggers well below the 22 m/s structural limit. Wind force is also rising as speed squared during the same interval. Waiting until the limit is nearly reached leaves too little time. The rule must be written before the forecast stream arrives, not improvised afterward.
      - group: SHIP
        task: Decide what to do about the drive timing
        title: Three tenths of a second
        place: The Pirate Ship
        scene: The drive pushes every 5.85 seconds while the 48° operating swing measures about 6.15. Sam Idowu, the structural engineer and the manufacturer's manual disagree, and the ride is already on the reopening poster.
        guide: >-
          Four options, and three of them change the machine to preserve a setting. Ask
          of each whether it acts on the period or on the drive. The period comes from
          geometry, gravity and amplitude. The interval is a number somebody typed.
          Pushing harder at the wrong phase adds load without fixing anything, and mass
          mostly cancels from the period.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a push in step with an oscillation adds energy and an out-of-step push can remove it
          - the operating period can differ from the small-angle estimate at large amplitude
        takeaway: Resonance is a timing problem before it is a force problem.
        format: CHOICE
        question: The drive and the operating swing disagree by three tenths of a second. What should be changed?
        why: The operating period is set by the ride's geometry, gravity and amplitude. The drive interval is a control setting. Changing the arm would rebuild the machine to preserve an old setting. Pushing harder at the wrong phase adds structural load without fixing the timing. Restricting rider mass also misses the cause because mass largely cancels from the period. The direct fix is to retime the drive to the measured operating period and then verify that the swing reaches angle without excess load.
        choices:
          - Retime the drive to the measured operating period, then verify the response.
          - Shorten the arm until the boat's period falls to the existing drive interval.
          - Increase the push force until the boat reaches angle despite the timing mismatch.
          - Restrict the ride to lighter loads so fewer pushes are needed.
        answer: Retime the drive to the measured operating period, then verify the response.
        rebuttals:
          - Changing the arm changes the ride geometry and every calculation that depends on it.
          - More force at the wrong phase raises load without correcting when the push arrives.
          - Mass is not the source of the period mismatch, so a load restriction only hides it.
      - group: TOWER
        task: Prove the brake rather than assert it
        title: What the drop test has to show
        place: The Drop Tower
        scene: Thursday's official drop test has one afternoon to produce a number the safety engineer can compare with the certificate. The tower technician has test weights, a recording accelerometer and the full tower before the inspectors leave.
        guide: >-
          Lock a prediction for the peak deceleration before the drop happens: the panel
          will not let you look first. Then run the test and read what the accelerometer
          actually recorded. The last step costs something — you have to say what the
          comparison settles, and a measurement you interpret after seeing it can be
          made to agree with anything.
        background:
          - >-
              Why the prediction is locked. A number written down afterwards is not a
              prediction, and the way it fails is not dishonesty but memory: with a
              recording in front of you it is genuinely hard to recall how confident you
              were. Committing first is a procedure that protects you from yourself, which
              is why it is enforced by the panel rather than recommended.
          - >-
              What the test can and cannot settle. It can tell you whether the brakes
              produce the deceleration the certificate claims, on this tower, with these
              weights, today. It cannot tell you what a loaded carriage of nervous people
              will do differently, and the inspectors will ask about the difference.
          - >-
              Why one afternoon is the constraint. The inspectors leave, so a test that
              produces an ambiguous result is a test that cannot be repeated in time. That
              is the reason for deciding beforehand what result would count as agreement —
              the alternative is discovering the criterion after the data arrives.
        assumes:
          - a prediction made before a test is worth more than an explanation offered after it
          - an instrument records what happens at the place it is fitted
        takeaway: A test is only evidence about a claim that was written down before it ran.
        format: VERIFY
        question: Predict the peak deceleration the brakes will produce, run the drop, and say what the measurement settles.
        verify:
          hint: Commit to a number before the drop. A test that is interpreted afterwards can be made to agree with anything.
          prediction:
            label: Predicted peak deceleration in the fins
            unit: g
            min: 2
            max: 8
            step: 0.1
          truth: 5.4
          # 0.85 of 5.4 is 4.59, and day two's *average* deceleration is 4.7 g — so the
          # old band accepted the one answer this stop exists to rule out. A magnetic
          # brake bites hardest at entry, so the peak is above the average; the floor
          # now sits above it. The band stays asymmetric on purpose: over-predicting a
          # peak is the conservative error.
          passRatio: [0.93, 1.15]
          intervention:
            label: The witnessed drop
            note: Ballast to 640 kg aboard, released from the full height, site closed to the public.
            outcome: Drop completed. Carriage stopped 8.7 m into the braked section with the fins warm.
          measurement:
            label: Logged peak from the carriage accelerometer
            note: Downloaded on the platform, in front of the inspector, before the carriage is moved.
            cost: 1
            costUnit: drops
          unmeasuredMoral: The carriage was dropped, the brake stopped it and the log was never read. Nothing in that sequence establishes what the fins did to anybody sitting in it.
          commit: Report the brake performance
        answerText: Expect a peak near 5.4 g, above the 4.7 g average. The instrument must show whether the real magnetic-brake peak stays inside the certified limit.
        why: Day two gave the average deceleration from the speed and the distance. It is not the number a rider meets. A magnetic brake makes force in proportion to speed, so it bites hardest at the entry and eases as the carriage slows. The peak is therefore above the average, and the only way to know by how much is to fit an instrument and drop it. Predicting first is what makes the drop a measurement rather than a demonstration.
  # ----------------------------------------------------------------- day 13
  - title: Three things and one crew
    objective: Rank what gets fixed with two days left.
    briefing: Three faults, one maintenance crew, and the inspection is on Friday.
    stake: >-
      Wednesday, and three things arrived this morning. A bumper car with a cracked chassis
      rail. The coaster's morning speed a tenth low for the second day running. And the
      carousel's platform settling, which Adeyemi first saw as a peak in the current. Kovač has
      one crew and two days. Marsh wants the coaster, because it is on the poster. Hart wants
      the bumper car, because it is the ride her staff cannot supervise their way out of. Today
      you rank the three jobs. You also decide what the coaster's low reading means, and put the
      carousel's repair in an order that can be done overnight. Vey inspects on Friday morning
      and signs on Friday afternoon. What is not fixed by Thursday night is a ride that opens
      shut.
    takeaway: Ranking work is a question about what each delay costs, not about what each fault is.
    stops:
      - group: BUMPER
        task: Take the fault that cannot safely wait and delegate the other two with a first action and return condition.
        title: Which of the three cannot wait
        place: The Bumper Cars
        scene: A cracked chassis rail on 1 car, a coaster reading a tenth low, a carousel platform 11 millimetres down. One crew, two days, and Kovač wants the order in writing.
        guide: >-
          Three faults, one crew, two days. Keep the one that needs your own judgement,
          and for each of the others choose an owner, the first thing they will do, and
          the reading or event that brings it back to you. Compare the three on trend,
          containment and consequence rather than on how bad each one sounds.
        background:
          - >-
              What the three axes are. Trend is whether it is getting worse while you
              decide. Containment is whether the fault is already isolated from the public.
              Consequence is what happens if it is not dealt with. A cracked chassis rail, a
              coaster reading a tenth low and a platform eleven millimetres down score very
              differently on each.
          - >-
              Why the loudest is not the first. A fault that is already contained — the car
              taken out of service — is not getting worse, whatever its consequence would
              have been. A drift of a tenth in a reading is small now and is evidence of
              something that may not be small next week.
          - >-
              Why the order goes in writing. Kovač asks for it because a verbal priority
              list is one the crew re-derives at every interruption. An order with an owner,
              a first action and a return condition per item survives the day without you.
        assumes:
          - a fault can be contained by removing only the affected equipment
          - a passing limit and a worsening trend are different kinds of information
        takeaway: Urgency depends on how a fault changes and whether it can be isolated, not on how dramatic it looks.
        format: DELEGATE
        question: Keep one problem yourself. Assign the other two so the crew knows what to do first and when to bring each one back.
        delegate:
          hint: Compare each problem's trend, containment and consequence. Every delegated fault needs an owner, a first action and a return condition.
          problems:
            - id: carousel
              label: Carousel platform 11 mm low
              trend: rising
              irreversible: true
              rate: settlement continues under repeated cycles
              consequence: the low bearing takes increasing load and the whole ride remains exposed
              loud: false
              delegable: false
            - id: bumper
              label: Cracked chassis rail on one bumper car
              trend: stable
              irreversible: false
              rate: stable after the car is removed from service
              consequence: the single car cannot safely return until the chassis is inspected
              loud: true
              delegable: true
            - id: coaster
              label: Station return speed 0.1 m/s lower than yesterday
              trend: stable
              irreversible: false
              rate: still above the morning operating limit
              consequence: a continued decline would reduce the loop margin
              loud: false
              delegable: true
          firstActions:
            - id: stop_carousel
              label: Stop the carousel and unload the low bearing
            - id: isolate_car
              label: Remove the cracked car from service and inspect the rail
            - id: log_coaster
              label: Record the coaster reading and repeat the morning check under the rule
            - id: watch
              label: Watch it for now
          returnConditions:
            - id: carousel_level
              label: Return when the ring is level and the drive-current peak is gone
            - id: car_clear
              label: Return when the rail has been inspected and cleared or repaired
            - id: coaster_limit
              label: Return if the speed crosses the morning limit or the downward trend persists
          correct:
            keep: carousel
            delegations:
              - problem: bumper
                owner: crew
                firstAction: isolate_car
                returnCondition: car_clear
              - problem: coaster
                owner: kovac
                firstAction: log_coaster
                returnCondition: coaster_limit
          team:
            - id: kovac
              name: Marta Kovač
              role: track and ride engineer
              label: Marta Kovač, track and ride engineer
            - id: crew
              name: Maintenance crew
              role: two-person overnight crew
              label: Maintenance crew, two-person overnight crew
          first: carousel
        answerText: Keep the carousel settlement. Isolate and inspect the cracked car. Log the coaster reading, and return it if the limit is crossed or the decline persists.
        why: The cracked bumper car is serious but contained once that car is removed from service. The coaster is still above its morning limit, so today's reading belongs in the trend log. The carousel is different. Its foundation is moving under a ride that cannot isolate one section, and each cycle keeps loading the same low bearing. That makes it the rising, hard-to-reverse problem. Good delegation separates the problem you must stop now from problems that can return on a clear condition.

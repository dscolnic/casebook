  - title: Where the energy went
    objective: Find the losses on the circuit, and what they leave for the loop.
    briefing: The train comes back to the station slower every year and nobody has measured by how much.
    stake: >-
      Wednesday, and Marta Kovač has three seasons of station speeds on a clipboard. The train
      came back at 6.1 metres a second in her first year. This spring it came back at 5.2. She
      used the same wheel each time, in the same place. Nothing about the hill has changed. So
      the loss is friction, and friction is energy the ride no longer has. Marsh reads it as
      wear and a bearing job. Vey reads it as a ride whose margins all come off a drawing made
      in 1974. Today you close the energy books on one lap of the coaster. You also work out
      what a circular ride does to the direction of a velocity. Then you count momentum through
      a crash on the bumper floor. Whatever the loop needs has to come out of what is left at
      the top of the hill.
    takeaway: Friction takes a fixed amount of energy each lap, and it takes it out of the margin.
    stops:
      - group: COASTER
        task: Derive the speed at the bottom with the losses in it
        title: The lap that does not come back
        place: The Coaster
        scene: The train leaves the top of the first hill at 26 metres and reaches the bottom of the first drop 2 metres above the station. Kovač's wheel says 21.4 metres a second at the bottom, and an ideal circuit says more.
        guide: >-
          You build the derivation a line at a time, choosing at each step the
          expression the line above gives you. Every wrong branch is legal algebra, so
          the malformed-line trick will not help. Work the energy statement down to the
          speed at the foot of the drop with no losses — and then say what Kovač's
          measured 21.4 metres a second implies about the difference.
        background:
          - >-
              What the starting statement says. Energy at the crest equals energy at the
              bottom plus whatever friction took. Written out, that is height and speed at
              the top against height and speed at the bottom, with one term for the losses.
              Nothing about the shape of the track appears, which is why energy is the tool
              of choice here rather than forces.
          - >-
              Why the mass cancels, and when it does not. Every term in the ideal statement
              carries m, so it divides out and the ideal speed is independent of how loaded
              the train is. The friction term is not proportional to m in the same way, so
              the moment losses enter, the loaded and empty trains stop agreeing.
          - >-
              What the gap is worth. The difference between the ideal speed and 21.4 is the
              energy the circuit lost on the way down, expressed as a speed. Turning that
              into joules and then into a percentage is how a maintenance decision gets
              made: a lap that does not come back is a wheel, a bearing or a brake dragging.
        assumes:
          - stored energy is weight times height, and kinetic energy is half the mass times the speed squared
          - friction does negative work along the whole path
        takeaway: The gap between the ideal speed and the measured one is a measurement of the friction.
        format: DERIVE
        question: Work the energy statement down to the speed at the foot of the drop, and say what the measured speed then tells you.
        answerText: The ideal speed is v₁ = √(2.0² + 2 × 9.8 × 24) ≈ 21.8 m/s. The measured 21.4 m/s means about 4% of the mechanical energy is already gone.
        why: Start with mechanical energy at the top of the first hill and at the foot of the drop. Mass appears in every term and divides out. That is why loading the train does not change the ideal speed from the same height. The ideal result is about 21.8 m/s, while the measured value is 21.4. The difference is energy lost to friction. That loss can be tracked around the circuit, especially near the loop where the speed margin is smallest.
        derive:
          hint: Write the energy statement first, then divide out what cancels. Name the move as well as the line.
          start: mgh₀ + ½mv₀² = mgh₁ + ½mv₁² + W_friction
          startNote: h₀ = 26 m, h₁ = 2 m, v₀ = 2.0 m/s at the crest, mass of the loaded train 4,800 kg
          goal: the speed at the foot of the drop with no losses, and what the measured 21.4 m/s implies
          steps:
            - ask: Set the friction term to zero for the ideal case and divide through by the mass.
              answer: 1
              candidates:
                - text: gh₀ + ½v₀² = gh₁ + ½v₁², so the result depends on the mass of the train
                  rule: cancellation
                  why: The line is right and the conclusion contradicts it. Every term had an m and every m has just been divided out, which is the whole reason a heavy train and a light one reach the bottom together.
                - text: gh₀ + ½v₀² = gh₁ + ½v₁²
                  rule: cancellation
                - text: gh₀ + ½v₀² = gh₁ + ½v₁² + W_friction ÷ m
                  rule: cancellation
                  survives: true
                  why: Correct algebra for the real circuit, and it is not the ideal case the step asked for. Carried down the page it gives an answer with an unknown in it, and the unknown is the thing this stop is trying to measure.
                - text: mgh₀ + ½mv₀² = mgh₁ + ½mv₁², so v₁ = √(2g(h₀ − h₁))
                  rule: conservation
                  why: The final expression drops the starting speed, which is small here and not zero. It is the answer to a train released from rest, and this one is already moving.
            - ask: Solve for the ideal speed at the foot.
              answer: 0
              candidates:
                - text: v₁ = √(v₀² + 2g(h₀ − h₁))
                  rule: substitution
                - text: v₁ = √(2g(h₀ − h₁))
                  rule: substitution
                  survives: true
                  why: Valid for a start from rest, and this train enters the drop at two metres a second. It understates the ideal speed by a tenth of a metre a second — small here, and the same omission on a launched circuit is a large error.
                - text: v₁ = v₀ + 2g(h₀ − h₁)
                  rule: substitution
                  why: Speeds and squares of speeds cannot be added. The left side is metres a second and the right is metres squared per second squared.
                - text: v₁ = √(v₀² + g(h₀ − h₁))
                  rule: conservation
                  why: The half in the kinetic term is what puts a two in front of g when the equation is rearranged. Dropping it loses 30% of the speed.
            - ask: Evaluate it and compare with the wheel's 21.4 metres a second.
              answer: 2
              candidates:
                - text: v₁ ≈ 21.7 m/s, so the measured speed shows the circuit is very nearly ideal
                  rule: evaluation
                  survives: true
                  why: The arithmetic drops the starting speed and the difference looks like nothing. Compare energies rather than speeds and the same gap is 130 kilojoules a lap — the square is what makes a small speed difference a large energy 1.
                - text: v₁ ≈ 23.6 m/s, and the wheel is reading 2 metres a second low
                  rule: evaluation
                  why: That is the ideal speed for a drop from 26 metres to the ground rather than to the station 2 metres above it.
                - text: v₁ ≈ 21.8 m/s, so friction has taken about 4% of the energy
                  rule: evaluation
                - text: v₁ ≈ 21.8 m/s, so friction has taken about 2% of the energy
                  rule: evaluation
                  why: 2% is the shortfall in the speed. Energy goes as the square, so the fraction lost is close to twice the fraction of speed lost, and reporting the smaller one halves the loss the ride actually has.
      - group: CAROUSEL
        task: Separate the speed from the acceleration
        title: Going round at a steady speed
        takesAsRead:
          - "Velocity against speed: direction is part of the quantity"
        concept: "Centripetal acceleration: v² over r, pointing at the centre"
        place: The Carousel and Swings
        scene: The carousel turns at eight revolutions a minute and has done so since the previous engineer set it. Bisi Adeyemi, the ride electrician, is wiring a new controller and wants the outer-horse acceleration put on paper.
        guide: >-
          Four options, and two of them agree on the size and disagree on the direction.
          Ask what is changing when a speed stays constant. Velocity carries a direction
          as well as a size, and on a circle the direction changes every instant. So
          decide which way the acceleration points before worrying about its value. One
          option needs a mass the question never gives.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        takesAsRead:
          - "Velocity against speed: direction is part of the quantity"
        assumes:
          - velocity has a direction as well as a size
          - acceleration is the rate at which velocity changes
        takeaway: Acceleration describes any change in velocity, including a change in direction when speed stays constant.
        format: CHOICE
        question: An outer horse goes round at a constant eight revolutions a minute. What is its acceleration?
        why: Speed can stay constant while velocity changes because velocity also contains direction. On a circle, that direction changes every instant. The resulting acceleration points toward the centre and has size v²/r. Here 5.2 m/s on a 6.2 m radius gives about 4.4 m/s². The platform and pole supply the inward force. A rider feels the seat pushing inward while their inertia makes the experience seem outward.
        choices:
          - About 4.4 metres per second squared, directed at the centre of the carousel.
          - Zero, since the speed around the circle is not changing at any point.
          - About 4.4 metres per second squared, directed along the way the horse is travelling.
          - It cannot be found without knowing the mass of the horse and its rider.
        answer: About 4.4 metres per second squared, directed at the centre of the carousel.
        rebuttals:
          - Constant speed and constant velocity are different claims, and only the first one is true here.
          - Along the motion is where an acceleration points when a body is speeding up, which this one is not.
          - Mass sets the force needed and not the acceleration, which comes from the speed and the radius alone.

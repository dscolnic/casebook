# What each place says when the player reads its sign.
copy:
  TOWER: <p>The drop tower. 42 metres of free fall, and a row of copper fins that has to take it all back in nine.</p>
  COASTER: <p>The coaster, built in 1974. One chain, one hill, one loop, and every number in its file computed from a drawing.</p>
  CAROUSEL: <p>The carousel and the swing chairs. Both of them turn, which means both of them are accelerating everything on board.</p>
  WHEEL: <p>The Ferris wheel, 81 years old and the tallest thing on the lake. 24 gondolas, and a moment that changes as it loads.</p>
  BUMPER: <p>The bumper floor. 12 cars, a steel ceiling, and about 100 collisions an hour when it is busy.</p>
  SHIP: <p>The pirate ship. 60 seats on an arm 8.6 metres long, driven by a wheel that pushes once each swing.</p>
  FLUME: <p>The log flume. A pump, a header tank, 400 metres of channel and 1 drop at the end that everybody queues for.</p>
  GATE: <p>The front gate and the ticket booths. Closed since October, and the reopening is on the board behind the glass.</p>
  WORKSHOP: <p>Brennan's workshop. 11 notebooks, a bench, and 41 years of settings in 1 hand.</p>
  ARCADE: <p>The arcade and the boarded stalls along the midway. Nothing in here needs certifying, which makes it the quietest building on site.</p>
  PLANT: <p>The plant room. Compressors, the water treatment set, and the switchboard everything on the midway runs off.</p>

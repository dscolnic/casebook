# midway.yml — Safety Factor: certifying seven rides at Corbin Park.
#
# AP Physics 1, algebra-based, all 8 units: kinematics, dynamics, circular
# motion and gravitation, energy, momentum, simple harmonic motion, torque and
# rotational motion, and fluids. One ride per area, so the syllabus is the
# midway: the drop tower is kinematics, the coaster is energy, the wheel is
# torque, the flume is fluids.
#
# **This game is built on derivations.** 41 years of maintenance here were
# done by 1 mechanic who wrote down settings and never wrote down why, and the
# county inspector will not accept a number whose derivation nobody can produce.
# So ten stops are DERIVE: build the result line by line, name the rule that
# licenses each line, and every wrong branch is a mistake a student actually
# makes — with at least one per step that stays algebraically valid, which is
# what stops the panel being passable by spotting the malformed line.
#
# The argument: Marsh holds that a ride that has run safely for 41 years
# is evidence, and a season lost closes the park. Vey holds that evidence of
# having got away with it is not a margin. Marsh is right on day 4. Vey is right
# on day 9, when the loop turns out to have been regraded in 1998 and the
# drawing never updated.

theme:
  id: midway
  title: Safety Factor
  subtitle: Ride Engineer · Corbin Park

# ---------------------------------------------------------------- the areas
# Seven rides, and each one is the unit of the course it teaches best. The
# player walks the syllabus: kinematics at the tower, energy on the coaster,
# torque under the wheel, fluids at the flume.
groups:
  - id: TOWER
    code: TOWER
    name: The Drop Tower
    color: '#c0392b'
    desc: Free fall down 42 metres, and a brake that has to take it back in 9.
    defaultLeader: vey
    milestones:
      - Time the drop and get an acceleration out of it
      - Derive the speed at the bottom two ways
      - Put a number on what the brake does to a body
      - Certify the tower or say why not
  - id: COASTER
    code: COASTER
    name: The Coaster
    color: '#2f7fa8'
    desc: 1 lift hill, 1 drop, 1 loop, and whatever friction has taken since 1974.
    defaultLeader: marsh
    milestones:
      - Close the energy books on one circuit
      - Find where the losses actually are
      - Derive the speed the loop demands
      - Recompute the margin the drawing promised
  - id: CAROUSEL
    code: CAROUSEL
    name: The Carousel and Swings
    color: '#c99a2e'
    desc: Everything here goes in a circle, which means everything here is accelerating.
    defaultLeader: brennan
    milestones:
      - Separate speed from acceleration
      - Derive the angle the swings hang at
      - Check the setting against the mechanic's number
      - Sign the speed limit for both rides
  - id: WHEEL
    code: WHEEL
    name: The Ferris Wheel
    color: '#7a4fa3'
    desc: 28 metres of steel that has to balance before it turns.
    defaultLeader: raman
    milestones:
      - Balance the wheel on paper
      - Find the load the arm actually sees
      - Turn a moment into a stress
      - Set a wind limit somebody can operate to
  - id: BUMPER
    code: BUMPER
    name: The Bumper Cars
    color: '#3f9e6b'
    desc: 100 collisions an hour, and every 1 of them is the same equation.
    defaultLeader: chen
    milestones:
      - Count the momentum before and after
      - Find the energy the collision does not return
      - Turn a collision into a force on a neck
      - Set the floor speed and the car mass
  - id: SHIP
    code: SHIP
    name: The Pirate Ship
    color: '#4a6d8c'
    desc: A pendulum with 60 people on it, and a period that does not care how many.
    defaultLeader: idowu
    milestones:
      - Measure the period and get g out of it
      - Derive why the period ignores the load
      - Find the drive frequency the ride must avoid
      - Certify the swing angle
  - id: FLUME
    code: FLUME
    name: The Log Flume
    color: '#2e8b8b'
    desc: Water doing the work, and a pump that has to lift it back up again.
    defaultLeader: abara
    milestones:
      - Get a pressure out of a depth
      - Float a loaded boat on paper
      - Derive the outlet speed
      - Match the pump to the channel

# ------------------------------------------------------------------ the cast
# 14 people, 2 to a ride. Marsh and Vey are the argument; Brennan is the
# 41 years of settings the whole game is trying to justify.
roster:
  - id: vey
    name: Marcus Vey
    role: County Ride Inspector
    division: TOWER
    bio: |
      Inspects rides for the county, which makes him the one person here who does
      not work for the park. He signs or he does not sign, and a ride he has not
      signed does not turn.

      His position is narrow and he states it the same way every time: a ride
      that has never hurt anybody is evidence about the past, and a margin is a
      statement about the future. 41 years of getting away with something
      is indistinguishable, from the outside, from 41 years of doing it
      right.

      His limit is that he cannot design anything. He can only ask for the
      working, and when the working is produced he has to accept it, whatever he
      thought that morning.
    quiz:
      - q: Why will Vey not accept a ride's forty-one-year record as a margin?
        a: A record says what happened, and a margin says what the ride can survive
        wrong:
          - County rules require every setting to be recalculated from scratch once each decade
          - Records kept by a park cannot be audited by an outside inspector
          - The park's insurers have refused to accept any evidence older than five years
  - id: santos
    name: Rafael Santos
    role: Brake and Hydraulics Technician
    division: TOWER
    bio: |
      Looks after the brakes on every ride in the park, which on the tower means a
      row of copper fins and a set of magnets that never touch them.

      He likes the magnetic brake because it cannot be adjusted wrong: the force
      it makes rises with the speed it is given, so it takes the most out of the
      fall exactly when there is the most to take. Nothing wears and nothing is
      set by hand.

      His limit is that a brake is judged by what it does to a person rather than
      by what it does to a carriage, and the number that matters is one nobody at
      this park has ever measured.
    quiz:
      - q: Why does Santos trust a magnetic brake more than a friction one?
        a: Nothing about it is adjustable, and it bites hardest exactly when the fall is fastest
        wrong:
          - Magnets are inspected by the county twice a season and friction pads are not inspected at all
          - A magnetic brake stops a carriage in a shorter distance than pads do
          - Copper fins are stronger than the steel a friction brake grips
  - id: marsh
    name: Delia Marsh
    role: Park Director
    division: COASTER
    bio: |
      Owns the park, and has three weeks to reopen it. The season is 106
      days long and pays for the other 259, and a ride
      that stays shut this summer is not a ride that opens next summer, because
      there is no next summer without this 1.

      Her argument is not that safety does not matter. It is that Brennan's
      settings are data: 41 years, 11 million rides, no serious
      injury, written down in 1 hand in 11 notebooks that nobody has ever
      contradicted.

      Her limit is that she is asking somebody else to sign. The certificate has
      the engineer's name on it and not hers, and she has never once pretended
      otherwise.
    quiz:
      - q: What does Marsh mean by calling Brennan's notebooks data?
        a: 11 million rides with no serious injury is an observation about the rides
        wrong:
          - The notebooks record the calculations Brennan worked through before he chose each setting
          - County inspectors accepted the notebooks at every previous inspection
          - The settings were copied from the manufacturers' original manuals
  - id: kovac
    name: Marta Kovač
    role: Maintenance Lead
    division: COASTER
    bio: |
      Runs the maintenance crew and has walked the coaster's track every working
      morning for nine years, which means she knows where the noise is before
      anybody else does.

      What she brings to an argument is the history of a machine: which section
      was rebuilt, which bolts have been replaced twice, where the paint is thin
      because somebody has been up there often. A drawing says what was intended
      and she can say what is there.

      Her limit is that nothing she knows is written down in a form an inspector
      accepts. Her evidence is a walk and a memory, and it has been right nearly
      every time.
    quiz:
      - q: Why is Kovač's morning walk worth more than the maintenance file?
        a: She can say what is on the structure now, and the file says what was intended
        wrong:
          - The maintenance file was destroyed in the flood two winters ago and never reconstructed
          - Every entry in the file was written by Brennan without dates
          - She measures each section with instruments the file's authors lacked
  - id: brennan
    name: Alf Brennan
    role: Chief Mechanic, retired
    division: CAROUSEL
    bio: |
      Kept this park running for 41 years and retired last autumn to a
      house 11 minutes' walk from the gate. He comes in when he is asked, and
      he is being asked a great deal this month.

      Everything he knows is in 11 notebooks: settings, timings, the number of
      turns on a nut, the sound a bearing makes before it goes. What is not in
      them is a single line of working. He set the carousel at eight turns a
      minute because at nine the horses on the outside felt wrong to him, and he
      was right, and he cannot say why.

      His limit is the one he states himself: he changed things and did not always
      write down that he had. The park is full of his corrections, and some of
      them are only in his memory.
    quiz:
      - q: What is the difficulty with Brennan's settings, in his own account?
        a: He altered the park over four decades and did not record every alteration
        wrong:
          - The notebooks were written in a private shorthand that nobody else at the park can read
          - He set the rides by manufacturers' tables he no longer has
          - His numbers were correct for equipment that has since been replaced
  - id: adeyemi
    name: Bisi Adeyemi
    role: Ride Electrician
    division: CAROUSEL
    bio: |
      Wires the drives, the interlocks and the speed controllers, which means every
      limit anybody agrees to eventually becomes a setting she types in.

      She is the one who asks what happens when the limit is reached: whether the
      ride refuses to start, slows itself, or lets an operator override it with a
      key. A number that only exists on paper is a number that gets exceeded on a
      hot Saturday.

      Her limit is that an interlock can only measure what it is wired to. It can
      count revolutions, and it cannot see 60 people all standing on 1 side.
    quiz:
      - q: Why does Adeyemi ask what a ride does when a limit is reached?
        a: A limit with no interlock behind it is a number an operator can pass
        wrong:
          - County rules require an audible alarm and a warning lamp at every operating limit
          - Controllers hold their settings only until the next power cut
          - Operators are not told the limits, so the machine has to hold them
  - id: raman
    name: Priya Raman
    role: Structures Engineer
    division: WHEEL
    bio: |
      Came in on contract to look at the wheel, and thinks in loads and load
      paths: what is carrying what, and what happens to the rest of the structure
      when one member stops carrying its share.

      Her method is to work out the force at a joint before looking at the joint,
      so that the inspection has a number to be surprised by. A crack found
      without a computed load is a crack nobody can size.

      Her limit is that a model is a set of assumptions about how a structure is
      loaded, and this wheel is 81 years old and has been modified by
      people who left no drawings.
    quiz:
      - q: Why does Raman compute a joint's load before she inspects the joint?
        a: A crack means nothing until there is a number it can be judged against
        wrong:
          - Inspecting first would bias her model toward the damage she saw
          - The county requires the calculation to be dated before the inspection
          - She cannot reach the joint until the wheel is stopped in position
  - id: novak
    name: Jan Novák
    role: Rigging and Lifting
    division: WHEEL
    bio: |
      Rigs anything that has to be lifted, held or lowered, and owns the only
      crane on the site. Everything he does is a moment about a point, and he has
      never once needed to be told that.

      He works in what he calls the two numbers: what the load actually is, and
      what the arm holding it is. The second one is the one people get wrong,
      because it is measured perpendicular to the force and not along the beam.

      His limit is the wind. He can rig anything in still air, and the same lift
      at 30 kilometres an hour is a different job with a different answer.
    quiz:
      - q: Which of Novák's two numbers do people get wrong?
        a: The arm, which is measured across the force rather than along the beam
        wrong:
          - The load, since the weight of the lifting gear is usually left out
          - The arm, since the beam's own weight acts at its far end
          - The load, because a swinging load weighs more than a still one
  - id: chen
    name: Wei Chen
    role: Controls and Telemetry
    division: BUMPER
    bio: |
      Instruments things. He has put accelerometers in three of the bumper cars
      and one in a dummy on the tower, and he has more data about this park than
      anybody has ever had.

      His interest is the difference between what a ride does and what a body in
      the ride does. A car changes speed in a tenth of a second; the person in it
      changes speed over whatever time the seat, the belt and their own neck take
      to do it, and that time is the whole question.

      His limit is that an accelerometer measures a point. Where he puts it
      decides what he learns, and he has been wrong about where to put it twice.
    quiz:
      - q: Why does Chen distinguish what the car does from what the rider does?
        a: The rider changes speed over a longer time, and that time sets the force
        wrong:
          - Riders are lighter than cars, so they accelerate more in a collision
          - The car's accelerometer reads the floor rather than the seat frame
          - A rider's own muscles absorb most of the change before the belt does
  - id: hart
    name: Georgia Hart
    role: Midway Supervisor
    division: BUMPER
    bio: |
      Runs the midway staff, which means she is responsible for what actually
      happens at a ride rather than what the procedure says happens. 12
      operators, most of them 19, and a queue that does not stop.

      Her contribution to every safety argument is the same and it is always
      right: whatever the rule is, it has to be doable by a tired teenager on the
      four-hundredth cycle of a hot Saturday, or it is not a rule, it is a wish.

      Her limit is that she cannot make a machine safe by supervising it harder,
      and she has stopped pretending she can.
    quiz:
      - q: What test does Hart apply to a proposed safety rule?
        a: Whether somebody exhausted at the end of a busy day could still carry it out
        wrong:
          - Whether the rule can be written out in full on a single laminated card by the console
          - Whether two operators can carry it out without speaking
          - Whether the county has approved the wording of the rule
  - id: idowu
    name: Sam Idowu
    role: Senior Ride Operator
    division: SHIP
    bio: |
      Has run the pirate ship for 20 years and can tell from the console how
      full it is, because a fuller boat takes the drive a little differently even
      though it swings at the same rate.

      He is the person who first said the drive was pushing at the wrong moment.
      He could not put it in the language anybody wanted, and what he said was
      that on a heavy boat the second push arrives late and you can feel it in the
      floor.

      His limit is that being right about a machine is not the same as being able
      to prove it, and he has spent two seasons being told the ride is within
      specification.
    quiz:
      - q: What did Idowu notice about the drive that nobody could yet prove?
        a: On a heavy boat the pushes were arriving out of step with the swing
        wrong:
          - The drive was pushing harder than the setting on the console said
          - A full boat swings more slowly, so the ride ran long on busy days
          - The floor vibration was coming from the bearing rather than the drive
  - id: bianchi
    name: Elena Bianchi
    role: Weld Inspection
    division: SHIP
    bio: |
      Non-destructive testing: dye penetrant, ultrasonic, magnetic particle. She
      finds cracks, sizes them, and refuses absolutely to say whether one matters.

      That refusal is the discipline. A crack is a length and a depth in a
      material with a known strength; whether it matters depends on the load the
      member carries, which is somebody else's number. She has watched people
      talk themselves into ignoring a real one and out of using a sound member.

      Her limit is access. She can only test what she can reach, and on this
      structure that is about two thirds of the welds.
    quiz:
      - q: Why does Bianchi refuse to say whether a crack matters?
        a: Its importance depends on a load she is not the one who computes
        wrong:
          - Her certification allows her to report findings and not to interpret them
          - Ultrasonic testing cannot measure a crack's depth accurately enough
          - A crack changes between inspections, so any judgement is out of date
  - id: abara
    name: Kelechi Abara
    role: Pumps and Water Systems
    division: FLUME
    bio: |
      Keeps the water moving: 2 pumps, 400 metres of channel, a
      splash-down pool and a header tank that has to stay full or the ride stops
      mid-flume with a boat in it.

      His way of thinking about the flume is that the pump does all the work at
      the start and the water gives it back all the way round. Every metre the
      channel drops is energy the boat gets for nothing; every metre the pump
      lifts is energy somebody pays for.

      His limit is the leaks. He can measure what he pumps and what arrives, and
      the difference has been getting larger for three seasons without anybody
      finding where it goes.
    quiz:
      - q: How does Abara describe what the pump is for?
        a: It buys the height the water then spends going round the circuit
        wrong:
          - It keeps the channel full so the boats do not ground on the bends
          - It supplies the pressure that pushes the boats along the flat sections
          - It replaces the water lost to leaks and to splash at the bottom
  - id: mccarthy
    name: Fiona McCarthy
    role: Flume Operator
    division: FLUME
    bio: |
      Loads the boats and sets them off, which means she is the person who decides
      how many people go in one, and she has been doing it by eye for six years.

      She reads a boat by how it sits: a heavy load rides low, takes the first
      bend slowly and comes down the drop fast. She has a rule about four adults
      that came from Brennan and she has never known it to be wrong.

      Her limit is that eye can only compare a boat with the boats she has seen.
      When the park changed to the moulded hulls two seasons ago, every judgement
      she had was about a different boat.
    quiz:
      - q: Why did the new moulded hulls unsettle McCarthy's judgement?
        a: Reading a boat by eye is a comparison, and the thing compared against changed
        wrong:
          - The moulded hulls sit lower in the water than the timber ones did at every load
          - The new boats hold five adults where the old ones held four
          - Their sides are too high to see the waterline from the platform

glossary:
  - name: Acceleration
    aliases: [accelerating, accelerates, decelerate, deceleration]
    def: How fast a velocity is changing, in metres per second every second. Speeding up, slowing down and turning are all acceleration.
  - name: Free fall
    aliases: [falls freely, in free fall]
    def: Motion with gravity as the only force acting. Everything in free fall gains speed at the same rate, whatever it weighs.
  - name: g
    aliases: [gravitational field strength, acceleration due to gravity]
    def: The acceleration of anything in free fall near the ground, about 9.8 metres per second every second.
  - name: Net force
    aliases: [resultant force, unbalanced force, sum of the forces]
    def: What is left when every force on a body is added together with its direction. It is what the mass responds to.
  - name: Free-body diagram
    aliases: [free body diagram]
    def: A sketch of one object with every force acting on it drawn as an arrow, and nothing else on the page.
  - name: Normal force
    aliases: [normal, support force, seat force]
    def: The push a surface gives an object at right angles to itself. It is what a rider actually feels.
  - name: Apparent weight
    aliases: [felt weight, g-force]
    def: The support force a rider feels, divided by their ordinary weight. In free fall it is zero, and nothing about their mass has changed.
  - name: Friction
    aliases: [frictional, kinetic friction, static friction]
    def: The force a surface makes along itself, opposing sliding. Static friction holds until it is exceeded; kinetic friction acts while sliding.
  - name: Coefficient of friction
    aliases: [coefficient, mu]
    def: The ratio of the friction available to the normal force pressing the surfaces together.
  - name: Centripetal acceleration
    aliases: [centripetal, towards the centre]
    def: The acceleration of anything moving in a circle, directed at the centre, equal to the speed squared over the radius.
  - name: Centripetal force
    aliases: [the force towards the centre]
    def: The net force that produces circular motion. It is not a new force; it is whatever is doing the job — a rail, a chain, a seat.
  - name: Conical pendulum
    aliases: [swing chair, hanging chain]
    def: A mass on a chain swung in a horizontal circle, so the chain traces a cone. Its angle depends on speed and radius, not on mass.
  - name: Work
    aliases: [work done]
    def: Force times the distance moved along the force. It is the way energy gets from one place to another.
  - name: Kinetic energy
    aliases: [kinetic]
    def: The energy a moving body has, one half its mass times its speed squared. It goes up with the square, so twice the speed is four times the energy.
  - name: Potential energy
    aliases: [gravitational potential energy, stored energy, height energy]
    def: The energy stored by lifting something, its weight times the height it was lifted.
  - name: Mechanical energy
    aliases: [total energy, energy of the train]
    def: Kinetic and potential added together. Without friction it stays the same all the way round.
  - name: Work–energy theorem
    aliases: [work energy theorem, net work]
    def: The net work done on a body equals the change in its kinetic energy. It is how a force becomes a speed.
  - name: Power
    aliases: [rate of working]
    def: How quickly work is done, in joules a second. A pump's rating is a power, not an energy.
  - name: Momentum
    aliases: [momenta]
    def: Mass times velocity. In a collision the total, counted with direction, is the same before and after.
  - name: Impulse
    aliases: [impulse–momentum, change in momentum]
    def: Force times the time it acts for. It equals the change in momentum, which is why a slower stop is a gentler one.
  - name: Elastic collision
    aliases: [elastic]
    def: A collision that gives back all its kinetic energy. Bumper cars do not.
  - name: Inelastic collision
    aliases: [inelastic, perfectly inelastic]
    def: A collision that keeps some of the kinetic energy as deformation, sound and heat. Momentum is still conserved.
  - name: Centre of mass
    aliases: [center of mass, balance point]
    def: The point a body's weight can be treated as acting through.
  - name: Torque
    aliases: [moment, turning effect]
    def: The turning effect of a force about a point: the force times the perpendicular distance to the line it acts along.
  - name: Moment arm
    aliases: [lever arm, perpendicular distance]
    def: The distance from the pivot to the line of the force, measured at right angles to that line.
  - name: Static equilibrium
    aliases: [balanced, in equilibrium]
    def: Forces adding to zero and torques adding to zero, so nothing moves and nothing turns.
  - name: Rotational inertia
    aliases: [moment of inertia, inertia of a wheel]
    def: How hard it is to change something's spin. It depends on where the mass is, not only how much there is.
  - name: Angular velocity
    aliases: [angular speed, revolutions a minute, rpm]
    def: How fast something turns, in radians a second. Multiply by the radius and you have the speed of a point on it.
  - name: Angular momentum
    aliases: [spin momentum]
    def: Rotational inertia times angular velocity. With no outside torque it stays the same.
  - name: Simple harmonic motion
    aliases: [harmonic, oscillation, oscillates, oscillating]
    def: Motion where the restoring force is proportional to the displacement. It gives a period that does not depend on the size of the swing.
  - name: Restoring force
    aliases: [restoring]
    def: The force that pulls an oscillator back toward the middle, and grows as it gets further away.
  - name: Period
    aliases: [time for one swing, cycle time]
    def: The time for one complete oscillation. For a pendulum it depends on the length and on g, and not on the mass.
  - name: Frequency
    aliases: [frequencies, cycles a second]
    def: How many oscillations happen each second. It is one divided by the period.
  - name: Resonance
    aliases: [resonant, in step with]
    def: Driving an oscillator at its own frequency, so every push arrives in step and the swing keeps growing.
  - name: Damping
    aliases: [damped, damper]
    def: Taking energy out of an oscillation, so the swing dies away instead of building.
  - name: Amplitude
    aliases: [swing angle, size of the swing]
    def: How far an oscillator goes from the middle at the extreme of its motion.
  - name: Pressure
    aliases: [pressures]
    def: Force spread over an area, in pascals. In a liquid it grows with depth and acts in every direction.
  - name: Density
    aliases: [densities]
    def: Mass in each cubic metre. Water is about 1000 kilograms in every cubic metre.
  - name: Buoyancy
    aliases: [buoyant force, upthrust, floats, floating]
    def: The upward force on anything in a fluid, equal to the weight of the fluid it pushes out of the way.
  - name: Pascal's principle
    aliases: [pascals principle, hydraulic]
    def: Pressure applied to an enclosed fluid is passed on undiminished, so a small force on a small piston becomes a large force on a large one.
  - name: Continuity
    aliases: [continuity equation, flow rate]
    def: What goes in has to come out, so a channel that narrows makes the water in it move faster.
  - name: Safety factor
    aliases: [margin, factor of safety]
    def: What a part can take, divided by what it is asked to take. A margin of one is a part that fails at its working load.

# ---------------------------------------------------------------- the days
# 15 working days, 3 weeks before the season opens. The county
# inspection is on day 15 and the gates open 7 days after that.
missions:
  # ------------------------------------------------------------------ day 1
  - title: 11 notebooks and no working
    objective: Find out what the park actually knows about its own rides.
    briefing: Every setting in this park is in one man's handwriting and none of them has a calculation behind it.
    stake: >-
      Monday, and the season opens in three weeks. Corbin Park lost its certificate in October and
      seven rides have to get it back before the gates open, which is your signature on seven
      documents. Delia Marsh, who owns the park, has laid out Alf Brennan's 11 notebooks on the
      workshop bench: 41 years of settings, timings and turns of a nut, in 1 hand, with not
      1 line of working anywhere in them. Marcus Vey, the county inspector, has read the same
      notebooks and calls them a record of having got away with it. Today you take the first three
      numbers the park runs on and find out where they come from. 106 days of season
      pay for the other 259, and nothing opens on a setting nobody can derive.
    takeaway: A number that works is not the same as a number somebody can justify.
    stops:
      - group: TOWER
        task: Derive the speed at the bottom of the drop
        title: What 42 metres of fall is worth
        place: The Drop Tower
        scene: >
          The tower drops its carriage 42 metres before the brake fins begin. Brennan's
          notebook gives the speed at the bottom as "about 29" and nothing else. Vey wants
          the line of working under it.
        assumes:
          - an object in free fall accelerates at about 9.8 metres per second every second
          - the constant-acceleration relations connect speed, acceleration and distance
        takeaway: A derivation is a chain of licensed steps, and naming the licence is half of it.
        format: DERIVE
        question: >-
          Get the speed at the end of 42 metre free fall, from the constant-acceleration
          relations rather than from the notebook.
        derive:
          hint: >-
            Each line has to follow from the one above it, and the rule you name is part of the
            answer.
          start: 'v² = v₀² + 2aΔx'
          startNote: the carriage is released from rest and falls 42 m before the fins engage
          goal: the speed at the bottom of the fall, in metres per second
          steps:
            - ask: Put the conditions of this drop into the relation.
              answer: 0
              candidates:
                - text: 'v² = 0 + 2(9.8)(42)'
                  rule: substitution
                - text: 'v² = 0 + 2(9.8)(42)(2.9)'
                  rule: substitution
                  why: >-
                    The time is already inside the relation; that is what makes it the useful one
                    here. Multiplying by it as well counts the fall twice and leaves units of metres
                    squared per second.
                - text: 'v² = 0 + (9.8)(42)'
                  rule: substitution
                  survives: true
                  why: >-
                    The factor of two is what carries the average speed of an accelerating body. Drop
                    it and every step below is clean algebra with a speed 29 per cent low —
                    20 metres a second, which reads perfectly plausible for a fall of this size.
                - text: 'v = 0 + 2(9.8)(42)'
                  rule: substitution
                  why: >-
                    The relation gives the square of the speed. Reading the left side as v and not v²
                    turns a speed into something 823 units large.
            - ask: Rearrange for the speed itself.
              answer: 1
              candidates:
                - text: 'v = 823 ÷ 2'
                  rule: rearrangement
                  why: >-
                    Halving is not the inverse of squaring. It happens to be the operation that
                    appears in the relation, applied to the wrong side of it.
                - text: 'v = √823'
                  rule: rearrangement
                - text: 'v = 823²'
                  rule: rearrangement
                  why: >-
                    Squaring again moves in the wrong direction. The left-hand side is already a
                    square and has to be undone rather than repeated.
                - text: 'v = √(823) with the sign left open, since the root has 2 values'
                  rule: definition
                  survives: true
                  why: >-
                    Algebraically correct and physically empty: the negative root is the same speed
                    travelling upward, which this carriage is not doing. Carrying it down the page
                    leaves an answer that cannot be reported as a number.
            - ask: Evaluate it, and say what the answer is a statement about.
              answer: 2
              candidates:
                - text: 'v ≈ 28.7 m/s, the speed of anybody in the carriage'
                  rule: evaluation
                  survives: true
                  why: >-
                    The arithmetic is right and the claim is too wide. It is the speed of the
                    carriage and of everything falling with it, which happens to include the riders,
                    and the derivation says nothing about what any of them feel.
                - text: 'v ≈ 41.2 m/s by the time the carriage reaches the bottom of the tower'
                  rule: evaluation
                  why: >-
                    That is the root of 1,700, which is what 2aΔx gives if the drop is taken as the
                    whole tower rather than the free part of it. The fins take the last nine metres.
                - text: 'v ≈ 28.7 m/s, the speed of the carriage where the fins begin'
                  rule: evaluation
                - text: 'v ≈ 28.7 m/s, the average speed over the fall'
                  rule: definition
                  why: >-
                    The average speed of a fall from rest is half the final 1, about 14. This
                    number is the speed at one instant, which is the instant the brake has to work at.
        answerText: >-
          v = √(2 × 9.8 × 42) ≈ 28.7 m/s, and it is the speed at the moment the fins engage.
        why: >-
          Brennan's "about 29" was right, and now it is defensible. The relation v² = v₀² +
          2aΔx is the 1 to reach for when a problem gives a distance and asks for a speed, since it
          is the only constant-acceleration relation with no time in it. Two things carry the physics:
          the factor of 2, which is where the average speed of an accelerating body lives, and the
          square, which is why a fall twice as long gives a speed only 40 per cent higher.
      - group: COASTER
        task: Say what is true of the train's energy at each point
        title: Reading a circuit as energy
        place: The Coaster
        scene: >
          Marta Kovač walks the track every morning and has the circuit chalked on the workshop wall:
          lift hill, first drop, loop, brake run. Four points on it, and one statement each.
        assumes:
          - lifting something stores energy that can be given back
          - a moving body carries energy that depends on the square of its speed
        takeaway: A ride is one quantity of energy being moved between two forms and quietly spent.
        format: PROTOCOL
        task: Match each point on the circuit to what is true of the train's energy there.
        scenarios:
          - The chain is dragging the train up the lift hill.
          - The train is at the crest, moving slowly.
          - The train is at the foot of the first drop.
          - The train is in the brake run at the end.
        choices:
          - A motor is putting energy in, and it is the only place on the circuit where that happens.
          - Almost all of it is stored in the height, and very little is in the motion.
          - Almost all of it is in the motion, and this is the fastest the train will be all circuit.
          - It is being taken out and turned into heat in the fins, and none of it comes back.
        mapping: [0, 1, 2, 3]
        why: >-
          A circuit like this is one lot of energy handed back and forth. The motor does work once, at
          the beginning; from the crest onward nothing adds any, and every metre of descent converts
          store into motion. The foot of the first drop is the fastest point on the whole ride for
          that reason, and every hill after it has to be lower than the one before. The brake run is
          the only other place energy crosses the boundary, and it goes out as heat.
      - group: SHIP
        task: Say what the swing's period depends on
        title: 60 people and the same 5 seconds
        place: The Pirate Ship
        scene: >
          Sam Idowu has run the ship for 20 years. He says a full boat and an empty one swing at
          the same rate, and the console log agrees with him: 5.9 seconds either way,
          all season.
        assumes:
          - a pendulum swings back and forth in a repeating time
          - a heavier body needs a bigger force to give it the same acceleration
        takeaway: More mass brings more restoring force with it, and the two changes cancel exactly.
        format: CHOICE
        question: Why does the loaded boat swing at the same rate as the empty one?
        choices:
          - Extra mass is pulled back harder in the same proportion, so the acceleration is unchanged.
          - The extra riders sit near the pivot, where they have little effect on the swing.
          - The drive motor holds the rate constant whatever the boat happens to weigh that cycle.
          - Extra mass does slow it, and 5.9 seconds is the average of full and empty.
        answer: Extra mass is pulled back harder in the same proportion, so the acceleration is unchanged.
        why: >-
          The force pulling the boat back is a share of its own weight. Double the mass and you double
          that force. Acceleration is force divided by mass, and both have doubled, so the
          acceleration at every point of the swing is what it was. The mass cancels out of the
          problem entirely. That is why a pendulum's period depends on its length and on gravity and
          on nothing else, and why 60 people change the loads in the bearings without changing the
          timing by a hundredth of a second.
        rebuttals:
          - Riders sit along the whole boat, and where they sit would matter to the period if mass mattered at all.
          - The drive gives a push at the end of each swing and does not set the rate the boat returns at.
          - The log shows 5.9 seconds on empty cycles and on full ones separately, not as a mean.

  # ------------------------------------------------------------------ day 2
  - title: What the brake has to take out
    objective: Turn a stopping distance into a force on a person.
    briefing: The tower's brake has nine metres to remove everything the fall put in.
    stake: >-
      Tuesday, and the tower is first on Vey's list because it is the ride with the least between a
      rider and the ground. Yesterday's derivation says the carriage reaches the fins at 29
      metres a second; the fins have 9 metres to take that back. Rafael Santos, who maintains the
      brakes, points out that nothing in the system is adjustable — the magnets make more force the
      faster the fins move — and Vey's reply is that a brake nobody can adjust is still a brake
      nobody has measured. Today you turn a stopping distance into an acceleration, get a pressure
      out of a depth at the flume, and settle what a moment arm is under the wheel. 4.7
      times gravity is a number a fit adult takes in their seat and a number you would not put a
      child through.
    takeaway: Every force in this park is a mass times an acceleration somebody has to work out.
    stops:
      - group: TOWER
        task: Get the deceleration the fins have to produce
        title: 9 metres to take back 29
        place: The Drop Tower
        scene: >
          The carriage arrives at the fins at 28.7 metres a second and is stationary 9 metres
          later. Santos wants that expressed as an acceleration before anybody argues about whether
          it is comfortable.
        assumes:
          - the same constant-acceleration relation runs backwards for slowing down
          - an acceleration can be quoted as a multiple of g
        takeaway: A stopping distance and a speed are enough to fix the acceleration, with no time measured at all.
        format: BALLPARK
        question: Estimate the average deceleration in the braked section.
        estimate:
          prompt: The carriage enters the fins at 28.7 m/s and stops in 9.0 m of travel.
          question: Estimate the average deceleration in the braked section.
          labels:
            - 28.7 m/s  (speed entering the fins)
            - 2  (the factor in v² = 2aΔx)
            - 9.0 m  (length of the braked section)
            - 42 m  (the free fall above it)
            - 9.8 m/s²  (g)
          values: [28.7, 2, 9.0, 42, 9.8]
          slots: 3
          template: '{0} × {0} ÷ ({1} × {2})'
          formula: a*a/(b*c)
          correct: [0, 1, 2]
          target: 45.8
          tolerance: 3
          units: m/s²
          solution: a = v² ÷ 2Δx = 28.7² ÷ (2 × 9.0) ≈ 45.8 m/s², which is 4.7 g.
          explanation: The free fall above the fins and the value of g are already inside the entry speed. Using them again counts the same drop twice.
          relationship: 'a = v² ÷ 2Δx: the deceleration is the entry speed squared divided by twice the distance it is removed over.'
        why: >-
          The same relation that gave the speed gives the deceleration when it is run the other way,
          and neither use needs a stopwatch. 46 metres a second every second is 4.7
          times gravity, which is what the seat has to push through the rider for a fifth of a
          second. The square is the part worth keeping: a brake run half as long would double the
          deceleration, and one metre shorter than designed costs more than most people expect.
      - group: FLUME
        task: Turn the header tank's depth into a pressure
        title: What nine metres of water pushes with
        place: The Log Flume
        scene: >
          The header tank stands 9.4 metres above the splash pool and feeds the top of
          the flume. Kelechi Abara has a gauge on the outlet pipe and a figure in Brennan's notebook
          that does not match it.
        assumes:
          - pressure in a liquid grows with depth below the surface
          - water has a density of about 1000 kilograms per cubic metre
        takeaway: Depth sets pressure, and the width of the tank has nothing to do with it.
        format: BALLPARK
        question: Estimate the gauge pressure at the bottom of the header tank.
        estimate:
          prompt: The water in the header tank stands 9.4 m above the outlet. Water is 1,000 kg per cubic metre.
          question: Estimate the gauge pressure at the bottom of the header tank.
          labels:
            - 1000 kg/m³  (density of water)
            - 9.8 m/s²  (g)
            - 9.4 m  (depth of water above the outlet)
            - 3.2 m  (diameter of the tank)
            - 0.42 m³/s  (flow through the outlet)
          values: [1000, 9.8, 9.4, 3.2, 0.42]
          slots: 3
          template: '{0} × {1} × {2}'
          formula: a*b*c
          correct: [0, 1, 2]
          target: 92120
          tolerance: 4000
          units: Pa
          solution: P = ρgh = 1000 × 9.8 × 9.4 ≈ 92 kPa above atmospheric.
          explanation: The tank's diameter does not appear. A narrow standpipe of the same height pushes just as hard, which is the part people refuse to believe.
          relationship: 'P = ρgh: gauge pressure is the density of the liquid times g times the depth below its surface.'
        why: >-
          Pressure at a depth is the weight of the column standing above one square metre, so it
          depends on how tall the column is and not how wide. That is why the tank's diameter is
          absent from the arithmetic and why a hose left up a ladder can burst a fitting. 92
          kilopascals is a little under 1 atmosphere, which means the outlet fitting is holding
          about 9 tonnes over its face — a number worth having before anybody opens it.
      - group: WHEEL
        task: Identify the distance a torque is actually measured over
        title: The number people get wrong
        place: The Ferris Wheel
        scene: >
          Jan Novák has a jib out over the wheel's hub with a load on the end of it, and a
          disagreement with the lifting plan about how big the moment on the pin is.
        assumes:
          - a force applied further from a pivot has a greater turning effect
          - a force can be drawn as a line extending in both directions
        takeaway: A turning effect is fixed by where the line of the force passes, not by the shape of the thing carrying it.
        format: CHOICE
        question: The jib is 6 metres long and angled up at 30°. Which distance sets the moment about the pin?
        choices:
          - The horizontal distance from the pin to the load's line of action, which is 5.2 metres.
          - The length of the jib itself, all six metres of it, since that is the steel carrying the load.
          - The vertical height the load hangs above the pin, three metres.
          - The distance along the ground from the crane's tracks to the load.
        answer: The horizontal distance from the pin to the load's line of action, which is 5.2 metres.
        why: >-
          A torque is the force times the perpendicular distance from the pivot to the line the force
          acts along. The load hangs straight down, so that line is vertical and the perpendicular
          distance to it is horizontal — 6 metres times the cosine of 30, which is 5.2. Raising
          the jib does not shorten the steel and it does shorten the arm, which is exactly why a crane
          can lift more with the boom up. Using the length of the member instead overstates this
          moment by 15 per cent.
        rebuttals:
          - The steel is six metres of it, and the arm is measured across the force rather than along the member.
          - The height fixes where the load hangs and has no bearing on a vertical force's arm.
          - The tracks are not the pivot; the moment being argued about is the one at the pin.

  # ------------------------------------------------------------------ day 3
  - title: Where the energy went
    objective: Find the losses on the circuit, and what they leave for the loop.
    briefing: The train comes back to the station slower every year and nobody has measured by how much.
    stake: >-
      Wednesday, and Kovač has three seasons of station-return speeds on a clipboard: 6.1 metres a
      second in her first year, 5.2 this spring, measured the same way each time with the same
      wheel. Nothing about the hill has changed, which means the difference is friction and the
      difference is energy the ride no longer has. Marsh reads it as wear and a bearing job. Vey
      reads it as a circuit whose margins are all computed from a drawing made in 1974. Today you
      close the energy books on one lap, work out what a circular ride does to the direction of a
      velocity, and count momentum through a collision on the bumper floor. Whatever the loop needs,
      it has to come out of what is left at the top of the hill.
    takeaway: Friction takes a fixed amount of energy each lap, and it takes it out of the margin.
    stops:
      - group: COASTER
        task: Derive the speed at the bottom with the losses in it
        title: The lap that does not come back
        place: The Coaster
        scene: >
          The train leaves the crest at 26 metres and reaches the bottom of the first drop 2 metres
          above the station. Kovač's wheel says 21.4 metres a second at the bottom, and an ideal
          circuit says more.
        assumes:
          - stored energy is weight times height, and kinetic energy is half the mass times the speed squared
          - friction does negative work along the whole path
        takeaway: The gap between the ideal speed and the measured one is a measurement of the friction.
        format: DERIVE
        question: >-
          Work the energy statement down to the speed at the foot of the drop, and say what the
          measured speed then tells you.
        derive:
          hint: >-
            Write the energy statement first, then divide out what cancels. Name the move as well as
            the line.
          start: 'mgh₀ + ½mv₀² = mgh₁ + ½mv₁² + W_friction'
          startNote: h₀ = 26 m, h₁ = 2 m, v₀ = 2.0 m/s at the crest, mass of the loaded train 4,800 kg
          goal: the speed at the foot of the drop with no losses, and what the measured 21.4 m/s implies
          steps:
            - ask: Set the friction term to zero for the ideal case and divide through by the mass.
              answer: 1
              candidates:
                - text: 'gh₀ + ½v₀² = gh₁ + ½v₁², so the result depends on the mass of the train'
                  rule: cancellation
                  why: >-
                    The line is right and the conclusion contradicts it. Every term had an m and every
                    m has just been divided out, which is the whole reason a heavy train and a light
                    one reach the bottom together.
                - text: 'gh₀ + ½v₀² = gh₁ + ½v₁²'
                  rule: cancellation
                - text: 'gh₀ + ½v₀² = gh₁ + ½v₁² + W_friction ÷ m'
                  rule: cancellation
                  survives: true
                  why: >-
                    Correct algebra for the real circuit, and it is not the ideal case the step asked
                    for. Carried down the page it gives an answer with an unknown in it, and the
                    unknown is the thing this stop is trying to measure.
                - text: 'mgh₀ + ½mv₀² = mgh₁ + ½mv₁², so v₁ = √(2g(h₀ − h₁))'
                  rule: conservation
                  why: >-
                    The final expression drops the starting speed, which is small here and not zero.
                    It is the answer to a train released from rest, and this one is already moving.
            - ask: Solve for the ideal speed at the foot.
              answer: 0
              candidates:
                - text: 'v₁ = √(v₀² + 2g(h₀ − h₁))'
                  rule: substitution
                - text: 'v₁ = √(2g(h₀ − h₁))'
                  rule: substitution
                  survives: true
                  why: >-
                    Valid for a start from rest, and this train enters the drop at two metres a
                    second. It understates the ideal speed by a tenth of a metre a second — small
                    here, and the same omission on a launched circuit is a large error.
                - text: 'v₁ = v₀ + 2g(h₀ − h₁)'
                  rule: substitution
                  why: >-
                    Speeds and squares of speeds cannot be added. The left side is metres a second
                    and the right is metres squared per second squared.
                - text: 'v₁ = √(v₀² + g(h₀ − h₁))'
                  rule: conservation
                  why: >-
                    The half in the kinetic term is what puts a two in front of g when the equation is
                    rearranged. Dropping it loses 30 per cent of the speed.
            - ask: Evaluate it and compare with the wheel's 21.4 metres a second.
              answer: 2
              candidates:
                - text: 'v₁ ≈ 21.7 m/s, so the measured speed shows the circuit is very nearly ideal'
                  rule: evaluation
                  survives: true
                  why: >-
                    The arithmetic drops the starting speed and the difference looks like nothing.
                    Compare energies rather than speeds and the same gap is 130 kilojoules a lap —
                    the square is what makes a small speed difference a large energy 1.
                - text: 'v₁ ≈ 23.6 m/s, and the wheel is reading 2 metres a second low'
                  rule: evaluation
                  why: >-
                    That is the ideal speed for a drop from 26 metres to the ground rather than to the
                    station 2 metres above it.
                - text: 'v₁ ≈ 21.8 m/s, so friction has taken about 4 per cent of the energy'
                  rule: evaluation
                - text: 'v₁ ≈ 21.8 m/s, so friction has taken about 2 per cent of the energy'
                  rule: evaluation
                  why: >-
                    Two per cent is the shortfall in the speed. Energy goes as the square, so the
                    fraction lost is close to twice the fraction of speed lost, and reporting the
                    smaller one halves the loss the ride actually has.
        answerText: >-
          v₁ = √(2.0² + 2 × 9.8 × 24) ≈ 21.8 m/s ideal against 21.4 measured — about 4 per cent of
          the energy gone by the foot of the first drop.
        why: >-
          Dividing by the mass is the step worth remembering: it is why the loaded train and the empty
          one arrive together, and why the answer is a statement about the track rather than about
          the load. What the comparison buys is a measurement of the friction that no gauge in the
          park reports. Four per cent by the foot of the drop is ordinary; the number that matters is
          what has gone by the crown of the loop, because that is where the circuit has the least in
          hand.
      - group: CAROUSEL
        task: Separate the speed from the acceleration
        title: Going round at a steady speed
        place: The Carousel and Swings
        scene: >
          The carousel turns at eight revolutions a minute and has done since Brennan set it. Bisi
          Adeyemi is wiring a new controller and wants to know what the outer horses are actually
          being subjected to.
        assumes:
          - velocity has a direction as well as a size
          - acceleration is the rate at which velocity changes
        takeaway: Steady speed on a curve is still acceleration, and it points at the middle.
        format: CHOICE
        question: An outer horse goes round at a constant eight revolutions a minute. What is its acceleration?
        choices:
          - About 4.4 metres per second squared, directed at the centre of the carousel.
          - Zero, since the speed around the circle is not changing at any point.
          - About 4.4 metres per second squared, directed along the way the horse is travelling.
          - It cannot be found without knowing the mass of the horse and its rider.
        answer: About 4.4 metres per second squared, directed at the centre of the carousel.
        why: >-
          Velocity is a direction as well as a size, and on a circle the direction changes every
          instant even when the size does not. That change is an acceleration, it points at the
          centre, and its size is the speed squared over the radius: 5.2 metres a second on a 6.2
          metre radius gives 4.4, which is about 0.44 g sideways. The force that produces it comes
          from the platform and the pole, and the rider feels it as being leant outward.
        rebuttals:
          - Constant speed and constant velocity are different claims, and only the first one is true here.
          - Along the motion is where an acceleration points when a body is speeding up, which this one is not.
          - Mass sets the force needed and not the acceleration, which comes from the speed and the radius alone.
      - group: BUMPER
        task: Count what survives a collision and what does not
        title: 100 collisions an hour
        place: The Bumper Cars
        scene: >
          Wei Chen has accelerometers in 3 cars and 400 collisions logged from last
          season. Two cars, one moving and one stopped, and they leave the impact together.
        assumes:
          - momentum is mass times velocity, counted with direction
          - kinetic energy depends on the square of the speed
        takeaway: One quantity survives every collision and the other one does not, and knowing which is the whole of the subject.
        format: CHOICE
        question: A 320 kg car at 3.1 m/s strikes a stationary 290 kg car and they move off together. What is conserved?
        choices:
          - The momentum, which is the same before and after; the kinetic energy is not.
          - Both the momentum and the kinetic energy, since nothing leaves the floor.
          - The kinetic energy, which is the same before and after; the momentum is not.
          - Neither, since the floor's motor is putting energy in throughout.
        answer: The momentum, which is the same before and after; the kinetic energy is not.
        why: >-
          Momentum is conserved in any collision where nothing outside pushes on the pair. On a
          slippery floor, over a tenth of a second, that is a good description. Kinetic energy is a
          different quantity, and nothing protects it. The pair leaves at 1.6 metres a second
          carrying about 810 joules, where 1,540 went in. Nearly half has gone into deforming
          rubber, making noise and warming the bumper. That is what an inelastic collision is, and
          it is what makes the ride bearable.
        rebuttals:
          - A collision that returned all its energy would send the cars apart again, which these do not do.
          - Kinetic energy is the quantity that goes missing here; nearly half of it does.
          - The motor pushes through the pickup all the time and does nothing measurable in the tenth of a second the impact lasts.

  # ------------------------------------------------------------------ day 4
  - title: Eight turns a minute
    objective: Check a forty-one-year-old setting against the physics behind it.
    briefing: Brennan set the swings by how the chains hung, and nobody has ever computed the angle.
    stake: >-
      Thursday, and Alf Brennan walked up from his house this morning to be asked why the swing
      carousel runs at 10 turns a minute and not 11. His answer is the one it always is: at
      11 the chains came out too far and it felt wrong. Vey has been polite about this for three
      days. Today you derive the angle the chains hang at from the speed and the radius, put a number
      on the energy in the ship's swing, and balance the wheel on paper. Marsh is right this
      afternoon, and it is worth saying out loud: the derived angle lands within a degree of the
      chalk mark Brennan made in 1991, and 2 days of an engineer's time have confirmed what a
      mechanic knew by looking at it.
    takeaway: Confirming a good number is not wasted work; it is the difference between a setting and a limit.
    stops:
      - group: CAROUSEL
        task: Derive the angle the chains hang at
        title: Why the chains come out
        place: The Carousel and Swings
        scene: >
          The swing carousel turns at ten revolutions a minute. The chains are 4.5 metres long, hung
          from a hub of radius 3.0 metres, and Brennan's chalk mark on the pole says where the seats
          reach at full speed.
        assumes:
          - a body moving in a circle needs a net force toward the centre
          - the tension in a chain acts along the chain
        takeaway: The angle a hanging chain settles at is set by the turning, and the mass falls out of it entirely.
        format: DERIVE
        question: >-
          Work the two force equations down to a relation for the angle, and say what the angle
          depends on.
        derive:
          hint: >-
            Resolve the tension into two directions, write one equation each way, and divide one by
            the other.
          start: 'T sinθ = mv²/r  and  T cosθ = mg'
          startNote: θ is measured from the vertical; r is the radius of the circle the seat travels in
          goal: a relation for θ, and the quantities it turns out to depend on
          steps:
            - ask: Divide the horizontal equation by the vertical one.
              answer: 2
              candidates:
                - text: 'tanθ = v²/(rg) × m'
                  rule: division
                  why: >-
                    Both sides carried an m and the division removes it. Leaving one in makes the
                    angle depend on the load, which would mean a full seat and an empty one hanging
                    differently on the same ride, and they do not.
                - text: 'sinθ/cosθ = mv²/r ÷ mg, so cotθ = v²/(rg)'
                  rule: division
                  why: >-
                    Sine over cosine is the tangent. Naming it the cotangent inverts the relation and
                    gives an angle of about 60 degrees where the chains hang at 30.
                - text: 'tanθ = v²/(rg)'
                  rule: division
                - text: 'T tanθ = v²/(rg)'
                  rule: division
                  survives: true
                  why: >-
                    The tension divides out along with the mass; keeping it leaves an unknown on the
                    left. The line is algebraically consistent and every step below it produces an
                    angle in terms of a force nobody has measured.
            - ask: Say what this angle can depend on, given the relation.
              answer: 1
              candidates:
                - text: The speed, the radius and the mass of the loaded seat.
                  rule: substitution
                  why: >-
                    Mass appeared on both sides of the original pair and has gone. This is the same
                    result as a pendulum's period ignoring its bob, and for the same reason.
                - text: The speed of the seat and the radius of the circle it travels in.
                  rule: substitution
                - text: The length of the chain and nothing else, since that is what is hanging.
                  rule: resolution
                  survives: true
                  why: >-
                    The chain's length is genuinely in the problem — it sets the radius once the angle
                    is known — but it is not what fixes the angle, and treating it as the only input
                    gives a ride whose chains hang at one angle at every speed.
                - text: The tension in the chain, which is what holds the seat out.
                  rule: resolution
                  why: >-
                    The tension is what does the holding and it is not a free quantity: it adjusts
                    itself to whatever the load and the angle require, which is why it divides out.
            - ask: Evaluate the angle at ten turns a minute.
              answer: 0
              candidates:
                - text: 'About 31° from the vertical, with the seats out at a radius of 5.3 m'
                  rule: evaluation
                - text: 'About 31° from the horizontal, with the seats well above the hub'
                  rule: evaluation
                  why: >-
                    The angle in these equations is measured from the vertical, since that is the
                    direction the weight acts in. Reading it from the horizontal puts the chains at
                    59 degrees and the seats far outside anything this ride does.
                - text: 'About 21°, taking the radius as the 3.0 m hub'
                  rule: substitution
                  survives: true
                  why: >-
                    Consistent arithmetic on the wrong radius. The seat travels in a circle wider than
                    the hub by however far the chain has swung out, so the radius and the angle have
                    to be solved together — and the answer is ten degrees shy.
                - text: 'About 45°, since the speed and the radius are nearly equal in size'
                  rule: evaluation
                  why: >-
                    Comparing a speed with a length compares two different quantities. The tangent
                    here is v² over rg, which is a pure number, and it is not close to one.
        answerText: >-
          tanθ = v²/(rg), giving about 31° from the vertical at 10 turns a minute — and it depends on
          the speed and the radius, not on who is sitting in the seat.
        why: >-
          Dividing the two equations is the move: the tension is unknown, it appears in both, and one
          division removes it along with the mass. What is left says the angle is fixed by the speed
          and the radius alone, which is why a ride full of adults and a ride full of children hang
          their chains identically. The radius has to be solved with the angle, since a seat that
          swings out travels a wider circle. Brennan's chalk mark reads 30 degrees.
      - group: SHIP
        task: Get the speed at the bottom of the swing
        title: What the swing is worth at the bottom
        place: The Pirate Ship
        scene: >
          The ship swings to 48 degrees on a full cycle. Idowu wants the speed through the bottom
          before the bearing work is quoted, and the pivot is 8.6 metres above the centre of the
          loaded boat.
        assumes:
          - stored energy is weight times the height risen
          - the height risen by a pendulum comes from the geometry of the swing
        takeaway: A swing is a fall along a curve, and the height it falls through is the only part that matters.
        format: BALLPARK
        question: Estimate the speed of the boat through the bottom of its swing.
        estimate:
          prompt: The boat rises 2.85 m above its lowest point at 48°. Energy is conserved through the swing.
          question: Estimate the speed of the boat through the bottom of its swing.
          labels:
            - 2  (the factor in v = √(2gh))
            - 9.8 m/s²  (g)
            - 2.85 m  (height risen at the top of the swing)
            - 8.6 m  (length from pivot to the boat's centre)
            - 5.9 s  (the period of the swing)
          values: [2, 9.8, 2.85, 8.6, 5.9]
          slots: 3
          template: '√({0} × {1} × {2})'
          formula: Math.sqrt(a*b*c)
          correct: [0, 1, 2]
          target: 7.5
          tolerance: 0.6
          units: m/s
          solution: v = √(2 × 9.8 × 2.85) ≈ 7.5 m/s at the bottom.
          explanation: The length and the period fix how long the swing takes and not how fast it goes; the height risen is what becomes speed.
          relationship: 'v = √(2gh): the speed at the bottom of a swing comes from the height fallen through, whatever path the body took to fall.'
        why: >-
          A pendulum is a fall down a curved track, and energy does not care about the shape of the
          path — only about the height. That is the same expression the tower's carriage obeys and
          the same one the flume's water obeys, which is worth noticing: three rides, three
          mechanisms, one relation. The height here is not the swing radius but the rise, 8.6 metres
          times 1 minus the cosine of 48 degrees, which is 2.85.
      - group: WHEEL
        task: Balance the wheel before it is asked to turn
        title: Loading one side of a wheel
        place: The Ferris Wheel
        scene: >
          Loading puts passengers into the gondolas at the bottom, six at a time, so for part of
          every cycle one side of the wheel carries more than the other. Priya Raman wants the worst
          case on paper.
        assumes:
          - torque is a force times the perpendicular distance from the axle
          - a torque can be balanced by another torque acting the other way
        takeaway: A wheel is balanced by its own symmetry, and loading is what breaks the symmetry.
        format: BALLPARK
        question: Estimate the out-of-balance torque about the axle with four gondolas loaded on one side.
        estimate:
          prompt: 4 gondolas on 1 side each carry 470 kg of passengers, at an average perpendicular distance of 9.6 m from the axle.
          question: Estimate the out-of-balance torque about the axle with four gondolas loaded on one side.
          labels:
            - 4  (loaded gondolas on 1 side)
            - 470 kg  (passenger load in each)
            - 9.8 m/s²  (g)
            - 9.6 m  (average perpendicular distance from the axle)
            - 14 m  (radius of the wheel)
          values: [4, 470, 9.8, 9.6, 14]
          slots: 4
          template: '{0} × {1} × {2} × {3}'
          formula: a*b*c*d
          correct: [0, 1, 2, 3]
          target: 176870
          tolerance: 9000
          units: N·m
          solution: τ = 4 × 470 × 9.8 × 9.6 ≈ 177 kN·m about the axle.
          explanation: The wheel's radius is not the arm. A gondola part-way up the wheel hangs on a shorter perpendicular distance, which is why the average is 9.6 and not 14.
          relationship: 'τ = Fd: the out-of-balance moment is the unbalanced weight times its perpendicular distance from the axle.'
        why: >-
          A wheel with everything symmetrical needs no torque to hold it, which is why an empty Ferris
          wheel turns on very little power. Loading 4 gondolas on 1 side puts 177
          kilonewton-metres on the drive and the brake, and the number the drawing gives
          is for the ride running full, which is the balanced case. The awkward load is not the
          heaviest one; it is the most lopsided one, and it happens during loading rather than during
          the ride.

  # ------------------------------------------------------------------ day 5
  - title: The seat, the pole and the ram
    objective: Put forces on the parts that hold people in a circle.
    briefing: The carousel's poles and the flume's gate both hold, and neither has ever been computed.
    stake: >-
      Friday, and the first week ends with three parts nobody has a number for. Adeyemi will not wire
      the new controller until somebody tells her what force an outer horse's pole carries at eight
      turns a minute. Santos has a hydraulic gate on the flume with a two-centimetre ram driving a
      nine-centimetre one and a note in Brennan's hand reading "plenty". Vey has spent the morning
      reading yesterday's derivation and has signed nothing. Today you get the sideways force on a
      carousel pole, put the tower's drop test in the order it has to happen in, and derive what a
      hydraulic ram multiplies. Marsh has the season on a wall chart with 15 working days left
      on it.
    takeaway: Every part in this park is holding a force somebody can compute in three lines.
    stops:
      - group: CAROUSEL
        task: Get the sideways force on an outer pole
        title: What a pole holds sideways
        place: The Carousel and Swings
        scene: >
          An outer horse carries a rider of 78 kilograms at 6.2 metres from the middle, going round
          at 8 turns a minute. Adeyemi wants the sideways force the pole is asked for.
        assumes:
          - a body in a circle needs a net force toward the centre
          - that force is the mass times the centripetal acceleration
        takeaway: The force holding somebody in a circle is a real force from a real part, and it grows with the square of the speed.
        format: BALLPARK
        question: Estimate the sideways force the pole puts on a 78 kg rider.
        estimate:
          prompt: The rider sits 6.2 m from the axis and travels at 5.2 m/s. Their mass is 78 kg.
          question: Estimate the sideways force the pole puts on a 78 kg rider.
          labels:
            - 78 kg  (mass of the rider)
            - 5.2 m/s  (speed at that radius)
            - 6.2 m  (radius of the circle)
            - 9.8 m/s²  (g)
            - 8  (turns a minute)
          values: [78, 5.2, 6.2, 9.8, 8]
          slots: 3
          template: '{0} × {1} × {1} ÷ {2}'
          formula: a*b*b/c
          correct: [0, 1, 2]
          target: 340
          tolerance: 30
          units: N
          solution: F = mv²/r = 78 × 5.2² ÷ 6.2 ≈ 340 N toward the middle.
          explanation: g does not appear: this force is horizontal and the weight is vertical. The turns a minute are already inside the speed.
          relationship: 'F = mv²/r: the force needed to hold a mass on a circle is the mass times the speed squared, divided by the radius.'
        why: >-
          340 newtons is about 44 per cent of this rider's weight, pushing
          sideways, and it has to come from somewhere real — the pole, through the saddle, into the
          rider. 9 turns a minute instead of 8 would make it 430 newtons, since the force goes
          as the square of the speed while the speed goes as the rate of turning. That is the whole of
          why Brennan's difference between 17 was something he could feel.
      - group: TOWER
        task: Put the drop test in the order it has to happen in
        title: The order a drop test runs in
        place: The Drop Tower
        scene: >
          Vey wants the tower's annual drop test witnessed rather than described. Santos has four
          operations written on the whiteboard in the order he happens to have thought of them.
        assumes:
          - a test is only evidence if the conditions are known before it runs
          - ballast can stand in for passengers
        takeaway: A test is designed backwards from the number it has to produce.
        format: SEQUENCE
        task: Order the operations for a witnessed drop test.
        cards:
          - Weigh the ballast and record what the carriage will mass on the drop.
          - Fit the recording accelerometer to the carriage floor and confirm it is logging.
          - Release from the full height with the ballast aboard and no passengers on site.
          - Compare the logged deceleration against the figure the certificate will carry.
        order: [0, 1, 2, 3]
        why: >-
          Each operation exists because the one after it would mean nothing without it. A logged
          deceleration is a number about a mass, so the mass is established before anything moves. An
          instrument that was fitted after the drop has recorded a different drop. The release is at
          full height because a partial drop tests a brake at a speed it will not meet in service.
          And the comparison is last because it is the only step that produces the thing the
          certificate needs, which is a measurement set against a claim.
      - group: FLUME
        task: Derive what the hydraulic gate multiplies
        title: Two centimetres driving nine
        place: The Log Flume
        scene: >
          The flume's sluice gate is held by a hydraulic ram. A two-centimetre piston at the hand
          pump drives a nine-centimetre one at the gate, and Brennan's note against it reads
          "plenty".
        assumes:
          - pressure applied to an enclosed fluid is passed on undiminished
          - pressure is force divided by the area it acts over
        takeaway: A hydraulic multiplies force and gives back exactly nothing, because the big piston moves less.
        format: DERIVE
        question: >-
          Work Pascal's principle down to the force at the gate, and say what the multiplication
          costs.
        derive:
          hint: >-
            Start from the pressures being equal, write each as a force over an area, and remember
            what an area does when a diameter changes.
          start: 'P₁ = P₂'
          startNote: hand piston 2.0 cm across, gate piston 9.0 cm across, 250 N applied by hand
          goal: the force at the gate, and what has been given up to get it
          steps:
            - ask: Write each pressure as a force over its own area.
              answer: 0
              candidates:
                - text: 'F₁/A₁ = F₂/A₂, so F₂ = F₁ × (A₂/A₁)'
                  rule: definition
                - text: 'F₁A₁ = F₂A₂, so F₂ = F₁ × (A₁/A₂)'
                  rule: definition
                  survives: true
                  why: >-
                    Consistent algebra on an inverted definition. Pressure is force divided by area,
                    not multiplied by it, and this version makes the wide piston the weak 1 — a ram
                    that would give 5 newtons at the gate for 250 at the hand.
                - text: 'F₁ = F₂, since pressure is passed on undiminished'
                  rule: substitution
                  why: >-
                    What is passed on undiminished is the pressure. The force is the pressure times
                    an area, and the 2 areas here differ by a factor of 20.
                - text: 'F₂ = F₁ × (d₂/d₁)'
                  rule: geometry
                  why: >-
                    This uses the diameters where the areas belong. It gives a multiplication of 4
                    and a half instead of 20, which is the same mistake as pricing a pizza by its
                    width.
            - ask: Put the areas in, from the diameters given.
              answer: 3
              candidates:
                - text: 'A₂/A₁ = 9.0/2.0 = 4.5'
                  rule: geometry
                  why: >-
                    That is the ratio of the diameters. Area grows with the square of the diameter,
                    so the ratio of areas is the square of this.
                - text: 'A₂/A₁ = (9.0² − 2.0²)/2.0² = 19.25'
                  rule: geometry
                  why: >-
                    Subtracting the small area from the large one is the arithmetic for an annulus.
                    These are two separate cylinders and each has its own full circle.
                - text: 'A₂/A₁ = π(9.0)²/π(2.0)², and the π has to be evaluated before dividing'
                  rule: evaluation
                  survives: true
                  why: >-
                    Perfectly valid and needlessly so: the π appears above and below and cancels
                    exactly. Evaluating it changes nothing except the number of chances to make an
                    arithmetic slip.
                - text: 'A₂/A₁ = (9.0/2.0)² = 20.25'
                  rule: geometry
            - ask: Give the force at the gate and say what it cost.
              answer: 1
              candidates:
                - text: 'F₂ ≈ 5,060 N, and the ram delivers that over the same distance the hand moved'
                  rule: evaluation
                  survives: true
                  why: >-
                    The force is right and the second half is not. Work cannot be created by plumbing:
                    the gate piston moves about a twentieth as far as the hand piston, which is
                    exactly what keeps the energy books straight.
                - text: 'F₂ ≈ 5,060 N, and the gate piston moves about a twentieth as far'
                  rule: evaluation
                - text: 'F₂ ≈ 1,125 N, from the ratio of the diameters'
                  rule: substitution
                  why: >-
                    This is the diameter ratio again, four and a half times the hand force. It
                    understates the gate force by a factor of four and a half.
                - text: 'F₂ ≈ 5,060 N, so the hand pump does 20 times the work'
                  rule: evaluation
                  why: >-
                    The work at each end is the same, less what the seals take. 20 times the force
                    over a twentieth of the distance is the same product.
        answerText: >-
          F₂ = 250 × (9.0/2.0)² ≈ 5,060 N at the gate — and the gate piston travels about a twentieth
          of the distance the hand piston does.
        why: >-
          The step that decides this is the area, not the diameter: doubling a piston's width
          quadruples its face, so a factor of 4 and a half in diameter is 20 in force. What the
          hydraulic gives is force, and what it takes is distance — the two multiply to the same work
          at both ends, which is why nobody has ever built a hydraulic that produces energy. Brennan's
          "plenty" turns out to be 5 kilonewtons against a gate that needs about 1100.

  # ------------------------------------------------------------------ day 6
  - title: What the collision keeps
    objective: Get the speed out of a collision, and the energy that does not come back.
    briefing: 400 logged collisions, and nobody has ever written the equation for 1.
    stake: >-
      Monday of the second week, and Wei Chen has 400 collisions off last season's
      accelerometers with nothing to compare them against. The bumper floor is the ride Vey expects
      to sign first and Georgia Hart expects to argue about, because whatever number comes out of it
      has to be a rule 12 nineteen-year-olds can apply on the four-hundredth cycle of a hot
      Saturday. Today you derive the speed a pair of cars leaves a collision at, work out what the
      lift motor is doing on the coaster, and settle what makes a wheel hard to start. Marsh has
      moved the reopening announcement to Friday, which gives the second week a deadline it did not
      have this morning.
    takeaway: A collision hands back its momentum in full and keeps a good share of its energy.
    stops:
      - group: BUMPER
        task: Derive the speed the pair leaves at
        title: Two cars, one velocity
        place: The Bumper Cars
        scene: >
          A 320 kilogram car and rider at 3.1 metres a second strikes a stationary 290 kilogram car
          and rider. They stay in contact and move off together, which the telemetry confirms.
        assumes:
          - momentum is mass times velocity, counted with its direction
          - a collision with no outside push conserves total momentum
        takeaway: One equation gives the speed after any collision where the pair ends up moving as one.
        format: DERIVE
        question: >-
          Work the momentum statement down to the speed the pair leaves at, and then say what
          happened to the energy.
        derive:
          hint: >-
            Write what is conserved, put the numbers in, and check the units of the thing you have
            solved for.
          start: 'm₁u₁ + m₂u₂ = (m₁ + m₂)v'
          startNote: 'm₁ = 320 kg at u₁ = 3.1 m/s; m₂ = 290 kg at rest'
          goal: the speed of the pair after impact, and the fraction of the kinetic energy left
          steps:
            - ask: Put this collision into the statement.
              answer: 1
              candidates:
                - text: '320(3.1) + 290(3.1) = (320 + 290)v'
                  rule: substitution
                  why: >-
                    The second car is stationary. Giving it the first car's speed puts momentum into
                    the system that nothing supplied and returns the answer that nothing happened.
                - text: '320(3.1) + 290(0) = (320 + 290)v'
                  rule: substitution
                - text: '320(3.1) = 290v'
                  rule: conservation
                  survives: true
                  why: >-
                    Algebraically fine and it describes a different collision — one where the first
                    car stops dead and hands everything to the second. It gives 3.4 m/s, faster than
                    anything on the floor was going, which is the tell.
                - text: '½(320)(3.1²) + 0 = ½(320 + 290)v²'
                  rule: conservation
                  why: >-
                    This conserves kinetic energy, which a collision that ends with the cars locked
                    together does not do. It gives a speed about 40 per cent too high.
            - ask: Solve for the speed of the pair.
              answer: 0
              candidates:
                - text: 'v = 992 ÷ 610 ≈ 1.63 m/s'
                  rule: rearrangement
                - text: 'v = 992 × 610 ≈ 605,000 m/s'
                  rule: rearrangement
                  why: >-
                    The combined mass divides, since it is multiplying the unknown. Multiplying gives
                    a number with the units of kilograms squared metres per second.
                - text: 'v = 992 ÷ 320 ≈ 3.1 m/s'
                  rule: rearrangement
                  survives: true
                  why: >-
                    Dividing by the striking car's mass alone recovers the speed that went in, which
                    is a consistent piece of arithmetic saying the collision did nothing. The mass on
                    the right is the pair's, because the pair is what is moving.
                - text: 'v = (3.1 + 0) ÷ 2 ≈ 1.55 m/s'
                  rule: conservation
                  why: >-
                    Averaging the two speeds happens to land near the right answer here and is not
                    the physics. It ignores the masses entirely, and with a full car striking an empty
                    one it is wrong by a third.
            - ask: Compare the kinetic energy before and after.
              answer: 2
              candidates:
                - text: '1,538 J before and 1,538 J after, since momentum was conserved and nothing left the floor'
                  rule: conservation
                  why: >-
                    Momentum being conserved says nothing about the energy. They are different
                    quantities and only one of them is protected in a collision like this.
                - text: '1,538 J before and 810 J after, so 47 per cent has been destroyed'
                  rule: evaluation
                  survives: true
                  why: >-
                    The arithmetic is right and the word is wrong. Energy is not destroyed; it has
                    gone into deforming rubber, heating the bumpers and making the noise that is most
                    of the ride's appeal.
                - text: '1,538 J before and 810 J after, so 47 per cent has left as heat, sound and deformation'
                  rule: evaluation
                - text: '1,538 J before and 810 J after, so the collision was elastic'
                  rule: evaluation
                  why: >-
                    An elastic collision is exactly the one that gives all its kinetic energy back.
                    Losing nearly half of it is the definition of the other kind.
        answerText: >-
          v = (320 × 3.1) ÷ 610 ≈ 1.63 m/s, and about 47 per cent of the kinetic energy has gone into
          rubber, heat and noise.
        why: >-
          Momentum is conserved in every collision where nothing outside pushes on the pair, which is
          what makes it the quantity to write down first. Kinetic energy is not conserved and is not
          destroyed either: it leaves the mechanical books and turns up as deformation, sound and a
          warm bumper. A ride designed to keep its energy would be a ride that flung people apart at
          the speed they arrived, which is why the softness of the rubber is a safety feature.
      - group: COASTER
        task: Work out what the lift motor has to do
        title: What the chain is paid to do
        place: The Coaster
        scene: >
          The chain hauls a loaded train of 4,800 kilograms up to 26 metres in 52
          seconds. Kovač has the motor's plate rating and wants to know how much of it the lift
          actually uses.
        assumes:
          - lifting a mass stores energy equal to its weight times the height
          - power is work divided by the time taken
        takeaway: A motor is rated in power, and what a job needs is an energy and a time.
        format: BALLPARK
        question: Estimate the power the lift chain delivers to the train.
        estimate:
          prompt: A 4,800 kg train is raised 26 m in 52 s. Ignore friction in the chain for this estimate.
          question: Estimate the power the lift chain delivers to the train.
          labels:
            - 4800 kg  (mass of the loaded train)
            - 9.8 m/s²  (g)
            - 26 m  (height of the lift)
            - 52 s  (time to climb it)
            - 21.4 m/s  (speed at the foot of the drop)
          values: [4800, 9.8, 26, 52, 21.4]
          slots: 4
          template: '{0} × {1} × {2} ÷ {3}'
          formula: a*b*c/d
          correct: [0, 1, 2, 3]
          target: 23520
          tolerance: 1500
          units: W
          solution: P = mgh ÷ t = 4,800 × 9.8 × 26 ÷ 52 ≈ 23.5 kW.
          explanation: The speed at the foot of the drop is what the lift buys, not what it costs. It is already the same energy counted a second time.
          relationship: 'P = mgh ÷ t: power is the energy given to the train divided by the time spent giving it.'
        why: >-
          23 and a half kilowatts is a modest motor, and that is the point of a lift hill:
          the energy for the whole circuit is bought slowly, over most a minute, and spent in about
          12 seconds. The same energy delivered in 12 seconds would need a motor 5 times
          the size. Every hill after the first has to be lower than it, because nothing is added
          anywhere else on the circuit and friction is subtracting the whole way round.
      - group: WHEEL
        task: Say what makes a wheel hard to start
        title: Where the mass is
        place: The Ferris Wheel
        scene: >
          Novák is quoting a replacement drive and the supplier wants the wheel's rotational inertia.
          Two wheels of the same total mass are on the table, one with heavy gondolas and one with a
          heavier hub.
        assumes:
          - a torque is needed to change how fast something turns
          - the same mass can be arranged near an axle or far from it
        takeaway: Rotational inertia counts every kilogram by the square of how far out it sits.
        format: CHOICE
        question: Two wheels have the same total mass. Which is harder to bring up to speed?
        choices:
          - The one with its mass out at the rim, since distance from the axle counts twice over.
          - The one with the heavier hub, since the drive shaft has to turn that hub directly.
          - Neither, since the masses are equal and inertia depends on mass.
          - The one with the heavier hub, since mass near an axle turns through a tighter circle.
        answer: The one with its mass out at the rim, since distance from the axle counts twice over.
        why: >-
          Rotational inertia counts each piece of mass times the square of its distance out. A
          kilogram at this rim therefore counts about 200 times 1 on the axle. That is why
          the wheel needs a big torque to start and almost none to keep turning. It is why the
          gondolas are built as light as they can be. And it is why a flywheel is built the other way
          round, with its mass as far out as the casing allows, to be as hard to slow as possible.
        rebuttals:
          - What the drive turns is the whole assembly, and the hub contributes least of it whatever it weighs.
          - Straight-line inertia depends on mass alone; rotational inertia depends on where the mass is.
          - Mass near the axle does turn through a tighter circle, which is exactly why it is easier rather than harder.

  # ------------------------------------------------------------------ day 7
  - title: The period that ignores the load
    objective: Derive why a pendulum's timing does not depend on what is in it.
    briefing: Idowu has said for two seasons that the drive pushes at the wrong moment on a full boat.
    stake: >-
      Tuesday, and Sam Idowu has been saying the same thing for two seasons: on a heavy boat the
      second push arrives late and you can feel it through the floor. He has been told each time that
      the ride is within specification, which it is. Today you derive the ship's period from the
      restoring force, so that there is a number to check the drive against rather than an
      operator's account of a floor. You also float a loaded boat at the flume and settle what the
      tower's timing gives for the local strength of gravity. Elena Bianchi has the swing arm's
      welds booked for Thursday and wants to know what load she is looking for cracks against.
    takeaway: A measured period is a measurement of the pendulum, and it can be turned into g.
    stops:
      - group: SHIP
        task: Derive the period from the restoring force
        title: Why the mass falls out
        place: The Pirate Ship
        scene: >
          The boat hangs 8.6 metres below its pivot and swings to 48 degrees. Idowu's console logs
          5.9 seconds a cycle, full or empty, and nobody at the park can produce the
          expression that predicts it.
        assumes:
          - for a small angle, the sine of the angle is close to the angle itself in radians
          - motion with a restoring force proportional to displacement repeats at a fixed rate
        takeaway: Two proportionalities meeting is what makes an oscillation keep the same time whatever its size.
        format: DERIVE
        question: >-
          Work the restoring force down to the period of the swing, and say what the period depends
          on.
        derive:
          hint: >-
            Get the force in terms of the sideways displacement, compare with the form for harmonic
            motion, and read off what is left.
          start: 'F = −mg sinθ'
          startNote: the component of the boat's weight along the arc, pulling it back to the middle
          goal: an expression for the period, and the quantities it contains
          steps:
            - ask: Write the restoring force in terms of the sideways displacement x.
              answer: 2
              candidates:
                - text: 'F = −mgθ, with θ the swing angle measured in degrees'
                  rule: approximation
                  why: >-
                    The approximation only holds with the angle in radians, where an angle and its
                    sine agree to within a per cent up to about 15 degrees. In degrees the 2
                    differ by a factor of 57.
                - text: 'F = −mgL sinθ'
                  rule: substitution
                  survives: true
                  why: >-
                    That is the torque about the pivot rather than the force along the arc — correct
                    physics, one line early, and it carries a length through everything below where a
                    force belongs.
                - text: 'F = −mg(x/L), using sinθ ≈ x/L for a small swing'
                  rule: approximation
                - text: 'F = −mgx'
                  rule: approximation
                  why: >-
                    Replacing the sine with the displacement itself loses the length. A ten-metre
                    pendulum and a one-metre one would then have the same period, which is the one
                    thing everybody knows is untrue.
            - ask: Compare it with the form that gives harmonic motion.
              answer: 0
              candidates:
                - text: 'ma = −(mg/L)x, so a = −(g/L)x and ω² = g/L'
                  rule: comparison
                - text: 'ma = −(mg/L)x, so ω² = mg/L'
                  rule: comparison
                  survives: true
                  why: >-
                    The mass is on both sides and has to go from both. Keeping it makes the period
                    depend on the load, which contradicts the console log this ride has been printing
                    for 20 years.
                - text: 'ma = −(mg/L)x, so a = −(g/L)x and ω = g/L'
                  rule: comparison
                  why: >-
                    The comparison is with a = −ω²x, so what is read off is ω squared. Taking it as ω
                    gives a period nearly six times too short.
                - text: 'F = −kx with k = mg/L, so the period depends on the stiffness alone'
                  rule: substitution
                  why: >-
                    The effective stiffness is right and it is not the whole story: a period depends
                    on the mass as well as the stiffness, and here the mass is inside k and cancels.
            - ask: Turn that into a period and evaluate it.
              answer: 1
              candidates:
                - text: 'T = 2π√(g/L) ≈ 6.7 s'
                  rule: evaluation
                  why: >-
                    The ratio is inverted. As written, a longer pendulum would swing faster, and the
                    units come out as seconds to the minus one.
                - text: 'T = 2π√(L/g) ≈ 5.9 s'
                  rule: evaluation
                - text: 'T = 2π√(L/g) ≈ 5.9 s, provided the boat is not loaded'
                  rule: comparison
                  survives: true
                  why: >-
                    The expression is right and the condition is imaginary: the mass cancelled two
                    lines ago. Attaching it means every future use of this result waits for a load
                    figure nobody needs.
                - text: 'T = √(L/g) ≈ 0.94 s'
                  rule: evaluation
                  why: >-
                    The 2π is what converts an angular rate into a time for a whole cycle. Without it
                    the answer is the time to swing about a sixth of the way.
        answerText: >-
          T = 2π√(L/g) ≈ 5.9 s, and it depends on the length and on g — the mass cancels out 2
          lines before the end.
        why: >-
          The cancellation is the result. A heavier boat is pulled back harder in exactly the same
          proportion as it is harder to accelerate, so the timing is untouched, and the same argument
          is why every object falls at the same rate. Turned round, the expression is a way of
          measuring gravity: length and period are both easy to measure well, and 5.9
          seconds on 8.6 metres gives g to better than 1 per cent. Idowu's complaint now has a
          number to be checked against.
      - group: FLUME
        task: Float a loaded boat on paper
        title: How far a full boat sits down
        place: The Log Flume
        scene: >
          Fiona McCarthy loads the boats by eye and has a rule about four adults that came from
          Brennan. The moulded hulls that replaced the timber ones 2 seasons ago are 2.9 metres by
          1.1 and weigh 180 kilograms empty.
        assumes:
          - a floating body pushes aside its own weight of water
          - water has a density of about 1000 kilograms per cubic metre
        takeaway: A floating body settles until the water it has pushed aside weighs what it does.
        format: BALLPARK
        question: Estimate how deep a boat with four adults sits in the water.
        estimate:
          prompt: Boat 180 kg, 4 adults at 78 kg each, hull 2.9 m by 1.1 m and near enough rectangular.
          question: Estimate how deep a boat with four adults sits in the water.
          labels:
            - 492 kg  (boat plus 4 adults)
            - 1000 kg/m³  (density of water)
            - 2.9 m  (length of the hull)
            - 1.1 m  (width of the hull)
            - 0.30 m  (depth of the hull side)
          values: [492, 1000, 2.9, 1.1, 0.30]
          slots: 4
          template: '{0} ÷ {1} ÷ ({2} × {3})'
          formula: a/b/(c*d)
          correct: [0, 1, 2, 3]
          target: 0.154
          tolerance: 0.02
          units: m
          solution: Volume displaced = 492 ÷ 1000 = 0.492 m³; over 3.19 m² of hull that is 0.154 m of draught.
          explanation: The depth of the hull side is what is left over as freeboard, and it is the answer to the next question rather than this one.
          relationship: 'Draught = mass ÷ (density × hull area): a boat sinks until it has pushed aside its own mass of water.'
        why: >-
          Buoyancy is the weight of the water pushed out of the way, so a boat settles until the two
          balance and not a millimetre further. 4 adults put this hull down 15 and a half
          centimetres, leaving 15 of freeboard on a thirty-centimetre side — which is why
          McCarthy's rule of 4 has held. A fifth adult takes the draught to about 18
          centimetres, and the number that then matters is not the draught but what is left above the
          water when the boat meets the wave at the bottom of the drop.
      - group: TOWER
        task: Get the local strength of gravity out of a period
        title: Measuring gravity with a boat
        place: The Drop Tower
        scene: >
          The ship's period is 5.90 seconds on an arm of 8.60 metres. Vey observes that the tower's
          whole certificate rests on a value of g nobody at this park has measured.
        assumes:
          - the pendulum period depends on the length and on g alone
          - an expression can be rearranged to make any of its quantities the subject
        takeaway: One ride can calibrate another when they share a constant.
        format: CHOICE
        question: What does the ship's period give for g, and what is it worth?
        choices:
          - About 9.75 m/s², from g = 4π²L/T² — good to about 1 per cent, which is enough for the tower.
          - About 9.75 m/s², but it belongs to the ship alone and cannot be carried to another ride.
          - It gives nothing without the mass of the boat, which the expression needs.
          - About 2.4 m/s², from g = L/T², which shows the ship's arm has been mismeasured.
        answer: About 9.75 m/s², from g = 4π²L/T² — good to about 1 per cent, which is enough for the tower.
        why: >-
          Rearranging the period expression makes g the subject, and the 2 things it needs — a
          length and a time — are the 2 quantities a park can measure well with a tape and a
          stopwatch over 20 cycles. The value belongs to the place rather than to the ride:
          gravity does not know which machine is measuring it, so the same 9.75 goes into the tower's
          kinematics, the coaster's energy statement and the flume's pressures. That is what makes it
          worth doing once, properly.
        rebuttals:
          - Gravity is a property of the location, and every ride within 100 metres shares it.
          - The mass cancels out of the period expression, which is the whole reason the measurement works.
          - Dropping the 2π loses a factor of about 40 in the result, and 2.4 is not a gravity anywhere.

  # ------------------------------------------------------------------ day 8
  - title: The arm and the crack
    objective: Get a load into a joint before anybody looks at the joint.
    briefing: Bianchi found an indication in a spider arm weld and will not say whether it matters.
    stake: >-
      Wednesday, and Elena Bianchi has an indication 41 millimetres long in the weld at the
      root of the wheel's number-nine spider arm. She has photographed it, sized it, and refused
      three times to say whether it matters, which is her discipline rather than her opinion: a crack
      is a length in a material and whether it counts depends on the load, and the load is not her
      number. Priya Raman wants that load computed today. Today you derive the force in the hub bolt
      group from the out-of-balance moment, put a number on what a bumper collision does to a neck,
      and read the carousel's drive panel. Marsh has the ride on the reopening poster.
    takeaway: A defect cannot be judged until somebody has computed what the part it is in carries.
    stops:
      - group: WHEEL
        task: Derive the force in one hub bolt
        title: What number nine is holding
        place: The Ferris Wheel
        scene: >
          The out-of-balance moment reaches 177 kilonewton-metres during loading. Each spider arm is
          held to the hub by a ring of 8 bolts on a circle of radius 0.42 metres, and Raman wants
          the force in 1.
        assumes:
          - torques about a point add to zero when nothing is turning
          - a ring of identical bolts shares a moment equally between them
        takeaway: A moment becomes a force the moment somebody asks what distance is resisting it.
        format: DERIVE
        question: >-
          Work the moment down to a force in one bolt, and say what has been assumed to get there.
        derive:
          hint: >-
            The bolt circle is what resists the moment. Write the resisting moment as a force times
            a distance times a count.
          start: 'Στ = 0'
          startNote: applied moment 177 kN·m; 8 bolts on a circle of radius 0.42 m
          goal: the force carried by one bolt, and the assumption behind that number
          steps:
            - ask: Write the moment the bolt ring can resist.
              answer: 1
              candidates:
                - text: 'τ_resist = F × 0.42, taking the ring as a single fastening'
                  rule: substitution
                  survives: true
                  why: >-
                    A consistent statement about one bolt doing all the work. It over-sizes the force
                    by a factor of eight, which errs safe here and would be an expensive answer to
                    hand a supplier.
                - text: 'τ_resist = 8 × F × 0.42'
                  rule: substitution
                - text: 'τ_resist = 8 × F × 0.84'
                  rule: substitution
                  why: >-
                    That is the diameter of the bolt circle. A moment arm is measured from the centre
                    of rotation to the line of the force, which is the radius.
                - text: 'τ_resist = 8 × F'
                  rule: equilibrium
                  why: >-
                    A force with no distance attached is not a moment. The units on the two sides of
                    the equation would not match.
            - ask: Set the two moments equal and solve for the force in one bolt.
              answer: 3
              candidates:
                - text: 'F = 177,000 × 8 × 0.42 ≈ 595,000 N'
                  rule: rearrangement
                  why: >-
                    Both the count and the arm are multiplying the unknown, so both divide. Here they
                    have been multiplied instead, and the answer is 11 times the load in the
                    entire arm.
                - text: 'F = 177,000 ÷ 0.42 ≈ 421,000 N'
                  rule: rearrangement
                  survives: true
                  why: >-
                    This is the total force the ring carries, which is a real and useful number, and
                    it is not what one bolt sees. Sharing between eight is the step that has been
                    skipped.
                - text: 'F = 177,000 ÷ 8 ≈ 22,100 N'
                  rule: rearrangement
                  why: >-
                    Dividing by the count alone leaves a moment rather than a force, and the arm is
                    what converts one into the other.
                - text: 'F = 177,000 ÷ (8 × 0.42) ≈ 52,700 N'
                  rule: rearrangement
            - ask: State what that number rests on.
              answer: 2
              candidates:
                - text: That every bolt is loaded equally, which is exact for a ring in a machine of this age.
                  rule: evaluation
                  why: >-
                    Equal sharing is an assumption rather than a fact, and it is least true in an old
                    joint where fit and tension vary bolt to bolt.
                - text: That the bolts carry the moment in shear, and nothing else is holding the arm.
                  rule: equilibrium
                  survives: true
                  why: >-
                    A defensible reading of the joint, and it ignores the friction the bolt tension
                    produces between the faces — which in a properly tightened joint carries much of
                    the load and makes 52 kilonewtons a conservative figure.
                - text: That the eight bolts share equally, so a loose one puts more into its neighbours.
                  rule: evaluation
                - text: That the moment is the largest the wheel sees, so no other case need be checked.
                  rule: evaluation
                  why: >-
                    Loading is the worst *static* case. It says nothing about wind, about stopping the
                    wheel quickly, or about the cyclic swing every gondola makes as it comes over the
                    top.
        answerText: >-
          F = 177,000 ÷ (8 × 0.42) ≈ 52.7 kN in 1 bolt, on the assumption that all 8 share the
          moment equally.
        why: >-
          Turning a moment into a force needs a distance to divide by. Choosing that distance is the
          engineering. Here it is the bolt-circle radius, since that is where the resisting forces
          act. 52 kilonewtons is now the number the crack has to be judged against. The
          assumption under it is worth saying out loud: equal sharing is what a drawing assumes, and
          an eighty-one-year-old joint only approximates it.
      - group: BUMPER
        task: Say what a collision does to a neck
        title: The tenth of a second that matters
        place: The Bumper Cars
        scene: >
          Chen's accelerometers show the car changing speed in about 0.10 seconds and the rider's
          head in about 0.18. Hart wants to know which of those numbers belongs in a rule about who
          may ride.
        assumes:
          - a change in momentum needs a force acting over a time
          - a body and the seat it sits in can change speed over different times
        takeaway: The same speed change over a longer time is a smaller force, and the time is a design choice.
        format: CHOICE
        question: Which time should the force on a rider be computed over, and why?
        choices:
          - The rider's 0.18 s, since it is the rider's own change of momentum being resisted.
          - The car's 0.10 s, since the car is the body the collision actually happens to.
          - The shorter of the two always, since the largest force is the one to design against.
          - Neither; the force follows from the masses and does not need a time at all.
        answer: The rider's 0.18 s, since it is the rider's own change of momentum being resisted.
        why: >-
          Impulse is force times time, and it equals the change in momentum of whatever body is being
          talked about. The rider's momentum changes over the time their seat, their belt and their
          own neck take to bring them to the car's new speed, and that is longer than the bumper's
          collision. Using the car's time overstates the force on a person by nearly a factor of two.
          It is also why every safety improvement in this field is an attempt to make that time
          longer — padding, give in a seat, a belt that stretches.
        rebuttals:
          - The car's time gives the force on the car, which is a question about the chassis rather than the rider.
          - Designing against the largest number sounds prudent and here it is simply the wrong body's number.
          - Masses give the change in speed; turning that into a force needs the time it happens over.
      - group: CAROUSEL
        task: Find what the drive panel is telling you
        title: The drive that pulls unevenly
        place: The Carousel and Swings
        scene: >
          The carousel's drive has been drawing an uneven current since the winter and Adeyemi has
          five readings on the panel. Two are alarming and three are entirely ordinary.
        assumes:
          - a drive works harder when the load on it is greater
          - a bearing that is failing takes more torque to turn
        takeaway: The readings that are normal are what rule an explanation out.
        format: DIAGNOSIS
        headline: The drive current rises once every revolution, and the ride still runs at its set speed.
        task: Which explanation fits every reading?
        readings:
          - { zone: Drive, label: Current, value: peaks once a revolution, status: alarm }
          - { zone: Drive, label: Average current, value: up 18% since autumn, status: alarm }
          - { zone: Drive, label: Speed held, value: 8.0 rev/min steady, status: normal }
          - { zone: Centre bearing, label: Temperature, value: unchanged, status: normal, note: rules out the main bearing }
          - { zone: Platform, label: Level around the ring, value: 11 mm low at 1 point, status: high }
        choices:
          - { label: The platform is riding low at one bearing, mechanism: 'A low spot loads one roller harder, once every turn.' }
          - { label: The centre bearing is failing and stiffening, mechanism: 'A dry bearing takes more torque and warms as it does it.' }
          - { label: The drive motor is losing one of its windings, mechanism: 'A motor down a phase draws more current for the same work.' }
          - { label: The controller is mis-set and the ride is running fast, mechanism: 'More speed is more power at the same torque.' }
        answer: The platform is riding low at one bearing
        why: >-
          Once per revolution is the reading that decides it: something fixed on the ground is being
          met by something turning, once a turn. A failing centre bearing would draw more current all
          the way round and would be warm, and the temperature has not moved. A motor fault would not
          synchronise itself to the platform's rotation. And the speed is exactly where it is set, so
          nothing is running fast. The 11 millimetres is small, and it is at the right place in
          the cycle.

  # ------------------------------------------------------------------ day 9
  - title: The loop is not the loop on the drawing
    objective: Derive what the loop demands, and measure what it actually is.
    briefing: Kovač taped the crown of the loop yesterday and the radius is not the 1 on the 1974 drawing.
    stake: >-
      Thursday, and Marta Kovač put a tape over the crown of the loop yesterday afternoon because
      nobody could find a reason not to. The drawing says the radius there is 5.6 metres. The tape
      says 7.4. In Brennan's ninth notebook, under 1998, there is a line about regrading the top of
      the loop after complaints of a rough ride, and no drawing was ever changed. Vey is right this
      morning and says so quietly: a ride that has run for 25 years on a number nobody
      checked is not the same thing as a ride with a margin. Today you derive the speed the loop
      demands at its crown, settle what a margin actually is, and read the ship's drive against
      yesterday's period. Everything computed this fortnight above the first drop now has to be done
      again.
    takeaway: A flatter loop is a gentler ride and a hungrier one, and both of those are the same number.
    stops:
      - group: COASTER
        task: Derive the speed the crown demands
        title: What the loop asks for at the top
        place: The Coaster
        scene: >
          At the crown the track is above the train and the rider is upside down. Kovač's tape gives
          a radius of 7.4 metres there, against 5.6 on the drawing everyone has been working from.
        assumes:
          - a body moving in a circle needs a net force toward the centre of that circle
          - a rail can push a train but cannot pull it
        takeaway: The limiting case is the one where a part stops doing anything, and it sets the number.
        format: DERIVE
        question: >-
          Work the force statement at the crown down to a minimum speed, and evaluate it for both
          radii.
        derive:
          hint: >-
            Write what is pushing toward the centre at the crown, then ask what happens as one of
            those forces goes to zero.
          start: 'N + mg = mv²/r'
          startNote: at the crown the centre of the loop is below the train, so both forces point that way
          goal: the least speed the train can cross the crown at, for r = 7.4 m and for r = 5.6 m
          steps:
            - ask: Take the limiting case that fixes the minimum.
              answer: 1
              candidates:
                - text: 'Set v = 0, giving N = −mg at the crown'
                  rule: limit
                  why: >-
                    A stationary train at the crown is not a limiting case of a ride, it is a train
                    falling off. The negative sign is the algebra reporting that the rail would have
                    to pull.
                - text: 'Set N = 0: the rail stops pushing, so mg = mv²/r'
                  rule: limit
                - text: 'Set N = mg, so the rider feels normal weight at the crown'
                  rule: dynamics
                  survives: true
                  why: >-
                    A perfectly sensible design condition and not the minimum. It gives a speed 40
                    per cent higher than the limit, which is a comfort criterion being mistaken for a
                    safety 1 — and if the ride is judged against it, a train that is safe reads as
                    a failure.
                - text: 'Set N + mg = 0, so the 2 forces balance at the crown'
                  rule: dynamics
                  why: >-
                    Both forces point the same way at the crown — downward, toward the centre — so
                    they add rather than cancel. Setting the sum to zero describes no situation on
                    this track.
            - ask: Solve for the speed.
              answer: 0
              candidates:
                - text: 'v = √(gr), and the mass has cancelled'
                  rule: cancellation
                - text: 'v = √(gr) for a full train, and less for an empty one'
                  rule: cancellation
                  survives: true
                  why: >-
                    The mass divided out of both sides one line ago. Attaching a load condition to the
                    answer means the ride ends up with two limits where the physics offers one.
                - text: 'v = gr'
                  rule: cancellation
                  why: >-
                    The left side is a speed and the right is a speed squared. As written, the number
                    for the measured radius is 73, which is not a speed anything on this
                    site reaches.
                - text: 'v = √(g/r)'
                  rule: evaluation
                  why: >-
                    Inverting the radius makes a bigger loop need less speed, which is the opposite of
                    what a wider curve does — and gives 1.2 m/s at the crown.
            - ask: Evaluate for both radii and say what changed.
              answer: 2
              candidates:
                - text: '8.5 m/s measured against 7.4 m/s drawn, so the drawing was conservative'
                  rule: evaluation
                  why: >-
                    Conservative means the drawing demanded more than reality does. It demanded less,
                    which is the direction that spends a margin nobody knew they had.
                - text: '7.4 m/s measured against 8.5 m/s drawn, so the loop is easier than drawn'
                  rule: evaluation
                  why: >-
                    The radii have been swapped. The measured crown is the wider one, and a wider
                    crown is the one that needs more speed.
                - text: '8.5 m/s measured against 7.4 m/s drawn — the real loop demands 15 per cent more'
                  rule: evaluation
                - text: '8.5 m/s measured against 7.4 m/s drawn, a difference of 1.1 m/s in the margin'
                  rule: dynamics
                  survives: true
                  why: >-
                    The subtraction is right and the framing hides the size of it. What matters is the
                    ratio to what the train actually has, and quoted as a difference it reads like
                    small change.
        answerText: >-
          v_min = √(gr) = √(9.8 × 7.4) ≈ 8.5 m/s at the measured crown, against 7.4 m/s for the radius
          on the drawing.
        why: >-
          The limiting case is the whole method: a rail can push and cannot pull, so the least speed
          is the one where it has stopped pushing and gravity alone bends the train round the curve.
          The mass cancels, which is why the limit is the same for a full train and an empty one. And
          the direction of the surprise is worth stating plainly — regrading the crown flatter made
          the ride smoother and made it hungrier, because a wider curve needs more speed to hold a
          body against it.
      - group: TOWER
        task: Say what a margin is a statement about
        title: What a safety factor says
        place: The Drop Tower
        scene: >
          Vey's file gives the coaster a margin of 1.38 on the loop, worked from the drawing. Against
          the measured crown the same arithmetic gives 1.20, and Marsh wants to know whether that is
          still a pass.
        assumes:
          - a margin is a ratio between what is available and what is required
          - a requirement can be recomputed when the geometry it rests on changes
        takeaway: A margin is a ratio, and it means nothing until both of its numbers are named.
        format: CHOICE
        question: The margin on the crown falls from 1.38 to 1.20. What has actually changed?
        choices:
          - The requirement rose, so the same train speed now sits closer to the limit.
          - The train got slower over the winter, which is what a falling margin usually means.
          - The margin is a different quantity now and the two figures cannot be compared.
          - Nothing changed physically; only the paperwork was wrong.
        answer: The requirement rose, so the same train speed now sits closer to the limit.
        why: >-
          A margin is what is available divided by what is needed, and only the bottom of that
          fraction moved: the train crosses the crown at the speed it always did, and the speed the
          crown demands turned out to be higher than the file said. The last option is the tempting
          one and it is wrong in an important way — the physical ride is exactly as it was this
          morning, and what changed is that the park now knows where it stands. Knowing is what makes
          the difference between a margin and a hope.
        rebuttals:
          - The train has slowed over three seasons, and that is a separate finding from this one.
          - Both figures are speed available over speed required, computed the same way.
          - 'The paperwork was wrong and the consequence is real: the ride has less in hand than anybody believed.'
      - group: SHIP
        task: Find why a full boat feels different
        title: Idowu was right
        place: The Pirate Ship
        scene: >
          The drive gives the boat a push at a fixed interval set in 1996. The period derived
          yesterday is 5.9 seconds. Five readings are on the console and three of them are entirely
          ordinary.
        assumes:
          - a push in step with an oscillation adds to it, and out of step takes from it
          - the period of this pendulum does not depend on its load
        takeaway: A drive and an oscillator have to agree about time, and only one of them can be adjusted.
        format: DIAGNOSIS
        headline: The ride swings to its set angle on a light boat and falls short on a heavy one, at the same period.
        task: Which explanation fits every reading?
        readings:
          - { zone: Drive, label: Push interval, value: 5.60 s (fixed since 1996), status: alarm }
          - { zone: Swing, label: Measured period, value: 5.90 s either way, status: normal }
          - { zone: Swing, label: Angle reached, value: 48° empty and 39° full, status: alarm }
          - { zone: Drive, label: Push force, value: at its setting, status: normal }
          - { zone: Bearing, label: Temperature and play, value: inside limits, status: normal, note: rules out friction in the pivot }
        choices:
          - { label: The drive pushes at an interval the swing does not keep, mechanism: 'A push that arrives early meets the boat still coming toward it.' }
          - { label: The pivot bearing is dragging on heavy loads, mechanism: 'Friction takes energy out faster than the drive puts it in.' }
          - { label: The drive is weaker than its setting, mechanism: 'Less force each push means a smaller swing.' }
          - { label: A heavy boat swings more slowly and needs more pushes, mechanism: 'A longer period means fewer pushes each minute.' }
        answer: The drive pushes at an interval the swing does not keep
        why: >-
          The period is the reading that settles it: 5.90 seconds whether the boat is full or empty,
          which rules out the last explanation completely and is exactly what yesterday's derivation
          predicted. The bearing is within limits and the drive is making its rated push, so nothing
          is weak or dragging. What is left is timing — 5.60 against 5.90 — and a push that arrives
          3 tenths of a second early meets a boat that has not finished coming toward it, taking
          energy out instead of adding it. A heavy boat takes more pushes to reach angle, so it shows
          up there first, which is precisely what Idowu described from the floor.

  # ----------------------------------------------------------------- day 10
  - title: Everything above the first drop, again
    objective: Recompute the circuit against the loop it actually has.
    briefing: Every margin computed before yesterday rests on a radius that was wrong.
    stake: >-
      Friday, and the second week ends with the coaster's file open on the bench and every number in
      it suspect above the first drop. The train crosses the crown at about 10.2 metres a second and
      the crown now demands 8.5, which is a margin of 1.20 rather than the 1.38 the certificate
      claimed. Kovač's clipboard says the station return speed has fallen 0.9 metres a second in
      3 seasons. Today you turn a collision into a force on a neck, decide what to change on the
      bumper floor, and size the pump that has to lift the flume's water back up. Vey will not sign
      the coaster on a margin that is shrinking unless somebody can say how fast it shrinks and what
      would be measured to catch it.
    takeaway: A margin that moves is a schedule, and a margin that is checked each morning is a rule.
    stops:
      - group: BUMPER
        task: Derive the average force on a rider
        title: Turning a collision into a force
        place: The Bumper Cars
        scene: >
          The rider's own change of speed in Chen's telemetry is 1.47 metres a second, over 0.18
          seconds. Hart wants that as a force, and then as a number she can compare with a person.
        assumes:
          - impulse is force times time and equals the change in momentum
          - a rider's weight is their mass times g
        takeaway: A force from a collision is a momentum change divided by the time somebody was given to make it.
        format: DERIVE
        question: >-
          Work the impulse statement down to an average force on a 60 kilogram rider, and express it
          against their own weight.
        derive:
          hint: >-
            Write the impulse relation, solve for the force, and then compare it with something the
            reader already has a feel for.
          start: 'FΔt = mΔv'
          startNote: rider 60 kg, change of speed 1.47 m/s, over 0.18 s
          goal: the average force, and what it is as a multiple of the rider's weight
          steps:
            - ask: Solve for the average force.
              answer: 2
              candidates:
                - text: 'F = mΔvΔt = 60 × 1.47 × 0.18 ≈ 15.9 N'
                  rule: rearrangement
                  why: >-
                    The time multiplies the force in the relation, so it divides when the force is
                    made the subject. Multiplying gives a number a hundredth of the real one.
                - text: 'F = Δv/(mΔt) = 1.47 ÷ (60 × 0.18) ≈ 0.14 N'
                  rule: rearrangement
                  why: >-
                    The mass belongs on top: a heavier rider needs a larger force for the same change
                    of speed in the same time. As written, this says the opposite.
                - text: 'F = mΔv/Δt = 60 × 1.47 ÷ 0.18 ≈ 490 N'
                  rule: rearrangement
                - text: 'F = mΔv/Δt with Δt taken as the car''s 0.10 s, giving ≈ 880 N'
                  rule: definition
                  survives: true
                  why: >-
                    Arithmetically clean, and it is the wrong body's time. The rider's momentum
                    changes over the time the seat and their neck take, and using the car's collision
                    time nearly doubles the answer.
            - ask: Express it against the rider's own weight.
              answer: 0
              candidates:
                - text: '490 ÷ (60 × 9.8) ≈ 0.83, so about 8 tenths of their weight'
                  rule: comparison
                - text: '490 ÷ 60 ≈ 8.2, so about 8 times their weight'
                  rule: comparison
                  survives: true
                  why: >-
                    Dividing by the mass gives an acceleration, not a ratio, and 8.2
                    metres per second squared has been read as a multiple of weight. The number is
                    real and it is not what it is being called.
                - text: '490 × 9.8 ≈ 4,800, so nearly 5000 times their weight'
                  rule: evaluation
                  why: >-
                    Multiplying a force by g gives nothing with a meaning. Weight is a force already;
                    the comparison is a division.
                - text: '490 N is the weight of a 490 kg person, so it is 8 times a rider'
                  rule: definition
                  why: >-
                    A newton and a kilogram are not the same unit. 490 newtons is
                    the weight of a fifty-kilogram mass, near enough 1 rider rather than 8.
        answerText: >-
          F = 60 × 1.47 ÷ 0.18 ≈ 490 N, which is about 0.83 of the rider's own weight.
        why: >-
          Impulse is the bridge between a collision and a person: the momentum change is fixed by the
          speeds, so the only thing left to design is the time it happens over. Stretch that time and
          the force falls in exact proportion, which is what padding, belt stretch and a soft bumper
          all buy. Eight tenths of body weight through a seat is unremarkable for an adult; the same
          collision with a stiff car and a shorter contact is the one that hurts, and the two differ
          by nothing except a tenth of a second.
      - group: COASTER
        task: Turn a shrinking margin into something measurable each morning
        title: A margin that moves
        place: The Coaster
        scene: >
          The crown margin stands at 1.20. Kovač's clipboard shows the station return speed falling
          about 0.3 metres a second each season, measured the same way with the same wheel each
          spring.
        assumes:
          - friction losses grow as running gear wears
          - a margin can be watched by measuring something easier than the quantity itself
        takeaway: A quantity nobody can measure daily is watched through one that can be.
        format: CHOICE
        question: What should the certificate require, given a margin that falls a little each season?
        choices:
          - A minimum station return speed, measured each morning, that corresponds to the crown limit.
          - A recomputation of the loop margin every spring, before the season opens.
          - A rule that the train is reweighed whenever the margin is questioned.
          - A crown speed measurement on every circuit, logged automatically.
        answer: A minimum station return speed, measured each morning, that corresponds to the crown limit.
        why: >-
          The crown speed is the quantity that matters and the station return speed is the 1 that
          can be taken with a wheel in 15 seconds by whoever opens the ride. They are linked by
          the same energy statement used all fortnight, so a number at the station can be converted
          into a number at the crown once and then simply read. A yearly recomputation would have
          caught this decline in about seven years; a daily reading catches it the week it starts,
          and Hart can operate to it.
        rebuttals:
          - An annual check is the interval that let a 1998 regrade go unnoticed for 25 years.
          - The train's mass cancels out of every limit computed this fortnight, so reweighing settles nothing.
          - Instrumenting the crown is the ideal measurement and it is a season of work and a cable run to the top of a loop.
      - group: FLUME
        task: Size the pump against the lift it has to make
        title: What the water costs to put back
        place: The Log Flume
        scene: >
          The flume returns 0.42 cubic metres of water a second to a header tank 9.4 metres up.
          Abara's pump is plated at 55 kilowatts and he has never known whether that is generous.
        assumes:
          - lifting a mass stores energy equal to its weight times the height
          - a pump delivers less than it draws, by its efficiency
        takeaway: A pump's rating is a power, and the job it is being asked to do is an energy every second.
        format: BALLPARK
        question: Estimate the electrical power the pump needs at 72 per cent efficiency.
        estimate:
          prompt: 0.42 m³/s of water lifted 9.4 m, water at 1,000 kg per cubic metre, pump 72 per cent efficient.
          question: Estimate the electrical power the pump needs at 72 per cent efficiency.
          labels:
            - 0.42 m³/s  (flow returned to the tank)
            - 1000 kg/m³  (density of water)
            - 9.8 m/s²  (g)
            - 9.4 m  (height it is lifted)
            - 0.72  (efficiency of the pump)
            - 55000 W  (the pump's plate rating)
          values: [0.42, 1000, 9.8, 9.4, 0.72, 55000]
          slots: 5
          template: '{0} × {1} × {2} × {3} ÷ {4}'
          formula: a*b*c*d/e
          correct: [0, 1, 2, 3, 4]
          target: 53700
          tolerance: 3000
          units: W
          solution: P = ρgQh ÷ η = 1,000 × 9.8 × 0.42 × 9.4 ÷ 0.72 ≈ 53.7 kW.
          explanation: The useful power is 38.7 kW; the efficiency divides rather than multiplies, since the pump has to draw more than it delivers.
          relationship: 'P = ρgQh ÷ η: the power is the weight of water lifted each second times the height, divided by the pump''s efficiency.'
        why: >-
          A flow rate times a density is a mass every second, and lifting that mass through the head
          is an energy every second, which is a power. The efficiency divides: the pump has to take
          more from the supply than it hands to the water. 53.7 kilowatts against
          55 kilowatt plate is a margin of about 2 per cent, which is not a margin — it is
          why the pump trips on hot afternoons when its cooling is worst.

  # ----------------------------------------------------------------- day 11
  - title: The day the flume behaved
    objective: Close the books on the water while there is nothing going wrong.
    briefing: Nothing broke over the weekend, which is the first time that has happened this month.
    stake: >-
      Monday of the third week, and nothing is wrong. The flume ran all weekend on the new pump
      curve, the coaster's morning speed came in where Friday's rule says it should, and Vey spent
      the afternoon reading rather than asking. Kelechi Abara has wanted a derivation for the outlet
      speed since the first week and this is the first day anybody has had time to do one. Today you
      derive what the water leaves the chute at, settle what the carousel's controller does when the
      limit is reached, and put a number on the wind load a gondola carries. Marsh has started
      telling people the park opens in 11 days, which she has not said out loud since October.
    takeaway: The morning to close a set of books is the one where nothing is asking to be fixed.
    stops:
      - group: FLUME
        task: Derive the speed the water leaves the chute at
        title: The same square root, from a different law
        place: The Log Flume
        scene: >
          The chute discharges 4.2 metres below the surface of the water standing in the top pond.
          Abara has a figure from the manufacturer and no derivation, and both surfaces are open to
          the air.
        assumes:
          - pressure, motion and height together account for the energy in a flowing liquid
          - a large surface falls so slowly that its speed can be neglected
        takeaway: Two different laws about two different rides arrive at the same expression, and that is not a coincidence.
        format: DERIVE
        question: >-
          Work the energy statement for the flow down to the outlet speed, and say what it has in
          common with the drop tower.
        derive:
          hint: >-
            Write the statement at the top surface and at the outlet, then strike out everything that
            is the same at both.
          start: 'P₁ + ½ρv₁² + ρgh₁ = P₂ + ½ρv₂² + ρgh₂'
          startNote: point 1 is the pond surface, point 2 the open chute 4.2 m below it
          goal: the speed the water leaves the chute at
          steps:
            - ask: Strike out what is equal at the two points.
              answer: 3
              candidates:
                - text: 'The heights cancel, since both points are in the same body of water'
                  rule: cancellation
                  why: >-
                    The height difference is the entire driving term. Cancelling it leaves an
                    expression saying still water squirts, which is the one thing everybody knows it
                    does not do.
                - text: 'The pressures cancel, and the pond surface speed is what the answer depends on'
                  rule: cancellation
                  why: >-
                    The first half is right and the second reverses it. The pond falls a millimetre a
                    minute, which is why its speed term is the one that can be dropped.
                - text: 'Nothing cancels, since the two points are in different places'
                  rule: conservation
                  survives: true
                  why: >-
                    Formally safe and it refuses the method. Both surfaces are open to the air, so
                    the pressures are equal and identical terms on both sides may be struck out —
                    which is what makes this statement usable with a tape measure.
                - text: 'The pressures cancel, both being atmospheric, and v₁ ≈ 0 at the pond surface'
                  rule: cancellation
            - ask: Solve what is left for the outlet speed.
              answer: 0
              candidates:
                - text: 'ρg(h₁ − h₂) = ½ρv₂², so v₂ = √(2g(h₁ − h₂))'
                  rule: substitution
                - text: 'ρg(h₁ − h₂) = ½ρv₂², so v₂ = √(g(h₁ − h₂))'
                  rule: substitution
                  survives: true
                  why: >-
                    The half in the kinetic term becomes a two when it is moved across. Dropping it
                    gives a speed 30 per cent low, and the expression still looks like the 1 in
                    every textbook.
                - text: 'ρg(h₁ − h₂) = ½ρv₂², so v₂ = 2g(h₁ − h₂)/ρ'
                  rule: substitution
                  why: >-
                    The density is on both sides and divides out. Leaving it below makes the answer
                    depend on what the liquid is, and this expression is the same for water, oil and
                    mercury.
                - text: 'v₂ = √(2g(h₁ − h₂)) only if the chute is vertical'
                  rule: conservation
                  why: >-
                    Energy accounts for the height dropped and not the path taken to drop it, which is
                    the same reason the ship's swing and the tower's fall share an expression.
            - ask: Evaluate it, and say what it is the same as.
              answer: 1
              candidates:
                - text: 'v₂ ≈ 9.1 m/s, and it is a coincidence that it looks like the free-fall expression'
                  rule: evaluation
                  why: >-
                    Not a coincidence. Both statements say the same thing — a height has been
                    converted into motion — and one is written per unit mass and the other per unit
                    volume.
                - text: 'v₂ ≈ 9.1 m/s, the same expression the tower gives for a 4.2 m fall'
                  rule: evaluation
                - text: 'v₂ ≈ 4.2 m/s, the height being what the water leaves at'
                  rule: evaluation
                  survives: true
                  why: >-
                    Reading the answer straight off the head is dimensionally impossible — a length is
                    not a speed — and it lands close enough to be believed by somebody in a hurry.
                - text: 'v₂ ≈ 82 m/s, from the square of the head'
                  rule: evaluation
                  why: >-
                    The expression takes a root rather than a square. 82 metres a second out
                    of a log flume would be worth seeing.
        answerText: >-
          v₂ = √(2 × 9.8 × 4.2) ≈ 9.1 m/s — the same expression as a body falling 4.2 metres, from a
          statement about pressure rather than about kinematics.
        why: >-
          Three rides in this park have now produced the same square root: the tower from the
          constant-acceleration relations, the ship from energy along a curve, and the flume from the
          pressure statement for a moving liquid. They agree because all three say a height has
          turned into motion, and the density and the mass drop out of each of them for the same
          reason. That is what makes the result worth deriving three times: it is one idea wearing
          three notations.
      - group: CAROUSEL
        task: Decide what the controller does at the limit
        title: A limit somebody can pass
        place: The Carousel and Swings
        scene: >
          The derived limit for the swings is ten turns a minute. Adeyemi has to wire what happens
          when the controller is asked for 11, and there are 4 ways to do it.
        assumes:
          - a limit that is not enforced by the machine can be exceeded by an operator
          - a ride can be made to refuse a setting rather than to warn about it
        takeaway: A number becomes a limit at the moment something refuses to go past it.
        format: CHOICE
        question: What should the controller do when the speed setting is pushed past ten turns a minute?
        choices:
          - Refuse the setting outright, with no key override on the ride's own panel.
          - Sound an alarm on the panel and let the operator decide whether to carry on.
          - Log the exceedance for the maintenance report at the end of the week.
          - Allow it up to 11, since the derivation used rounded figures anyway.
        answer: Refuse the setting outright, with no key override on the ride's own panel.
        why: >-
          A limit is only a limit when something other than a person's attention holds it. An alarm
          on a busy Saturday is a noise in a place already full of noise, and a log is a record of the
          thing having happened. The derivation gives a specific number for a specific reason — the
          chains reach the pole surround beyond it — and the last option misreads what rounding does:
          the figures were rounded, and the answer is not therefore soft by ten per cent.
        rebuttals:
          - An alarm hands a safety decision to whoever is most tired, at the moment they are busiest.
          - A log turns the limit into something reviewed on Friday about a Saturday.
          - Rounded inputs do not make a limit approximate; the geometry the number comes from is fixed.
      - group: WHEEL
        task: Put a number on the wind a gondola carries
        title: What the wind does to a gondola
        place: The Ferris Wheel
        scene: >
          A gondola presents about 4.2 square metres side-on. Raman wants the force on 1 at the
          22 metres a second the county's rule names, before anybody argues about the limit.
        assumes:
          - moving air exerts a force on a surface that grows with the square of its speed
          - air has a density of about 1.2 kilograms per cubic metre
        takeaway: A wind limit is a force limit in disguise, and the square is why the last few metres a second matter most.
        format: BALLPARK
        question: Estimate the wind force on 1 gondola at 22 metres a second.
        estimate:
          prompt: Gondola area 4.2 m² side-on, drag coefficient 1.2, air density 1.2 kg/m³, wind 22 m/s.
          question: Estimate the wind force on 1 gondola at 22 metres a second.
          labels:
            - 0.5  (the half in the dynamic pressure)
            - 1.2 kg/m³  (density of air)
            - 1.2  (drag coefficient of a boxy gondola)
            - 4.2 m²  (area presented to the wind)
            - 22 m/s  (wind speed)
            - 24  (gondolas on the wheel)
          values: [0.5, 1.2, 1.2, 4.2, 22, 24]
          slots: 5
          template: '{0} × {1} × {2} × {3} × {4} × {4}'
          formula: a*b*c*d*e*e
          correct: [0, 1, 2, 3, 4]
          target: 1464
          tolerance: 90
          units: N
          solution: F = ½ρC_dAv² = 0.5 × 1.2 × 1.2 × 4.2 × 22² ≈ 1,460 N on 1 gondola.
          explanation: The speed enters squared, which is why the same gondola carries a quarter of this at 11 metres a second.
          relationship: 'F = ½ρC_dAv²: wind force is half the air density times the drag coefficient times the area times the speed squared.'
        why: >-
          1500 newtons on 1 gondola is about a sixth of a tonne pushing sideways on
          something hanging from a pin, and there are 24 of them. The square is the part to
          carry away: the wind that arrives in gusts at 30 rather than 22 brings not
          36 per cent more force but 86. That is why wind rules are written with a
          stopping speed well below anything structural, and why the gust rather than the mean is what
          the operator has to watch.

  # ----------------------------------------------------------------- day 12
  - title: The first hot Saturday
    objective: Set the limits the ride will be operated to when nobody has time to think.
    briefing: 30 degrees forecast, a gusting westerly, and a queue that will not stop all afternoon.
    stake: >-
      Tuesday, and the forecast for opening weekend came in this morning: 30 degrees and a
      westerly gusting through the afternoon. Georgia Hart's point has been the same all fortnight
      and today it is the whole agenda — whatever gets decided in this workshop has to be doable by a
      nineteen-year-old on the four-hundredth cycle of a hot day. Today you set the wind rules for
      the wheel with the lead time built into them, decide what to do about the ship's drive, and
      settle how the tower's brake gets proved rather than asserted. Vey has said he will witness
      whatever tests are run on Thursday and sign or not sign on Friday morning.
    takeaway: A limit written for a calm Tuesday is not a limit; it has to work on the worst afternoon of the year.
    stops:
      - group: WHEEL
        task: Write the wind rules with their lead time
        title: Stopping a wheel takes time
        place: The Ferris Wheel
        scene: >
          Emptying the wheel takes about eight minutes and clearing the queue takes longer. Raman has
          the forecast updates on the board and wants both thresholds set before the gusts arrive
          rather than during them.
        assumes:
          - a wheel cannot be emptied instantly, and every action here needs warning
          - wind force grows with the square of the speed
        takeaway: A threshold has to fire early enough for the action behind it to finish.
        format: TRIGGER
        question: >-
          Set both thresholds so each action is complete before the gusts pass the structural limit.
        trigger:
          hint: >-
            Each rule needs enough warning for what it starts to finish. The limit is where the wheel
            must already be empty, not where the emptying begins.
          scale: { label: Gust speed, unit: m/s, min: 0, max: 32, step: 0.5 }
          conditions:
            - { id: queue, label: Close the queue and stop loading, leadHours: 2, owner: Hart, action: 'turn the queue away and let the wheel run down' }
            - { id: empty, label: Bring the wheel round and empty it, leadHours: 1, owner: the operator, action: 'unload every gondola and stand the wheel' }
          stream:
            - { at: 11:00, value: 8, hoursLeft: 6, update: 'steady westerly, forecast rising through the afternoon' }
            - { at: 13:00, value: 12, hoursLeft: 4, update: 'gusts building; the queue is at 90 minutes' }
            - { at: 15:00, value: 18, hoursLeft: 2, update: 'gusting hard enough to move the empty gondolas' }
            - { at: 16:00, value: 23, hoursLeft: 1, update: 'past the structural limit; the wheel should already be standing' }
          release: Release the afternoon
          commit: Stand by the rules
        answerText: >-
          Close the queue near 13 m/s and start emptying near 16, so the wheel is standing before the
          gusts reach 22. Waiting for 20 leaves 1 update to do 8 minutes of work in.
        why: >-
          A threshold is not a description of danger, it is an instruction with a duration attached.
          The wheel takes eight minutes to empty and the queue longer, so both rules have to fire
          while the gusts are still well below the structural number — and because the force goes as
          the square, the last five metres a second arrive with half again the load of everything
          before them. Setting the trigger at the limit itself is the commonest mistake, and it means
          the action starts at the moment it needed to be finished.
      - group: SHIP
        task: Decide what to do about the drive timing
        title: Three tenths of a second
        place: The Pirate Ship
        scene: >
          The drive pushes at 5.60 seconds and the boat swings at 5.90. Idowu, Bianchi and the
          manufacturer's manual all have a view, and the ride is on the reopening poster.
        assumes:
          - a push in step with an oscillation adds energy and out of step takes it away
          - the period of this pendulum is fixed by its length and by g
        takeaway: When two things have to agree about time, change the one that is not fixed by physics.
        format: CHOICE
        question: The drive and the swing disagree by three tenths of a second. What is the fix?
        choices:
          - Retime the drive to the measured period, since the swing's own timing cannot be changed.
          - Shorten the arm until the boat's own period comes down to match the drive's 5.60 seconds.
          - Increase the push force so the boat reaches angle despite the mistiming.
          - Restrict the ride to lighter loads, which reach angle with the timing as it is.
        answer: Retime the drive to the measured period, since the swing's own timing cannot be changed.
        why: >-
          Of the two numbers, one is set by a length and by gravity and the other is set by a control
          somebody typed in. Shortening the arm would work and means rebuilding the ride to avoid
          editing a setting. More force pushes harder at the wrong moment, which puts the load into
          the structure rather than into the swing — the arm sees it and the riders do not. And
          restricting the load treats a symptom that only appears on heavy boats because those take
          more pushes to reach angle.
        rebuttals:
          - Rebuilding the arm changes the period and everything else the certificate rests on.
          - A harder push at the wrong moment is a larger load in the swing arm and no more angle.
          - Light-load running hides the mistiming rather than fixing it, and the ride is worst when it is busiest.
      - group: TOWER
        task: Prove the brake rather than assert it
        title: What the drop test has to show
        place: The Drop Tower
        scene: >
          Thursday's witnessed test has to produce a number Vey can compare with the certificate.
          Santos has the accelerometer, the ballast and one afternoon.
        assumes:
          - a prediction made before a test is worth more than an explanation offered after it
          - an instrument records what happens at the place it is fitted
        takeaway: A test is only evidence about a claim that was written down before it ran.
        format: VERIFY
        question: >-
          Predict the peak deceleration the fins will produce, run the drop, and say what the
          measurement settles.
        verify:
          hint: >-
            Commit to a number before the drop. A test that is interpreted afterwards can be made to
            agree with anything.
          prediction: { label: Predicted peak deceleration in the fins, unit: g, min: 2.0, max: 8.0, step: 0.1 }
          truth: 5.4
          passRatio: [0.85, 1.15]
          intervention:
            label: The witnessed drop
            note: Ballast to 640 kg aboard, released from the full height, site closed to the public.
            outcome: Drop completed. Carriage stopped 8.7 m into the braked section with the fins warm.
          measurement:
            label: Logged peak from the carriage accelerometer
            note: Downloaded on the platform, in front of the inspector, before the carriage is moved.
            cost: 1
            costUnit: drops
          unmeasuredMoral: >-
            The carriage was dropped, the brake stopped it and the log was never read. Nothing in
            that sequence establishes what the fins did to anybody sitting in it.
          commit: Report the brake performance
        answerText: >-
          About 5.4 g at the peak against 4.7 g average — the magnetic brake is strongest where the
          fins are moving fastest, so the peak arrives at the top of the braked section.
        why: >-
          Day two gave the average deceleration from the speed and the distance. It is not the number
          a rider meets. A magnetic brake makes force in proportion to speed, so it bites hardest at
          the entry and eases as the carriage slows. The peak is therefore above the average, and the
          only way to know by how much is to fit an instrument and drop it. Predicting first is what
          makes the drop a measurement rather than a demonstration.

  # ----------------------------------------------------------------- day 13
  - title: Three things and one crew
    objective: Rank what gets fixed with two days left.
    briefing: Three faults, one maintenance crew, and the inspection is on Friday.
    stake: >-
      Wednesday, and three things arrived this morning: a bumper car with a cracked chassis rail, the
      coaster's morning speed a tenth low for the second day running, and the carousel's platform
      settling that Adeyemi first saw as a current peak. Kovač has one crew and two days. Marsh wants
      the coaster because it is on the poster; Hart wants the bumper car because it is the ride her
      staff cannot supervise their way out of. Today you rank the three, decide what the coaster's
      low reading means, and put the carousel's repair in an order that can be done overnight. Vey
      inspects on Friday morning and signs on Friday afternoon, and what is not fixed by Thursday
      night is a ride that opens shut.
    takeaway: Ranking work is a question about what each delay costs, not about what each fault is.
    stops:
      - group: BUMPER
        task: Rank three faults against each other
        title: Which of the three cannot wait
        place: The Bumper Cars
        scene: >
          A cracked chassis rail on 1 car, a coaster reading a tenth low, a carousel platform
          11 millimetres down. One crew, two days, and Kovač wants the order in writing.
        assumes:
          - a fault that can be isolated costs less than one that cannot
          - a ride can run with a car out of service
        takeaway: What can be taken out of service is never the emergency; what cannot be is.
        format: CHOICE
        question: Which of the three has to be dealt with first, and on what grounds?
        choices:
          - The carousel, since a settling foundation gets worse under use and cannot be isolated.
          - The bumper car, since a cracked chassis rail is the most obviously dangerous of the three.
          - The coaster, since it is the ride the reopening has been advertised around.
          - Whichever the crew can finish tonight, so that tomorrow starts with two problems.
        answer: The carousel, since a settling foundation gets worse under use and cannot be isolated.
        why: >-
          Two of these can be isolated and one cannot. The cracked car comes off the floor in 10
          minutes and the ride runs on 11 cars, so the fault is contained the moment it is found.
          The coaster's tenth of a metre a second is a trend to watch under the new morning rule, and
          it is inside the margin today. A foundation that is moving is the only one of the three
          that is loading itself further every cycle it runs, and it is under the ride nobody can take
          one horse out of.
        rebuttals:
          - A cracked rail is serious and its car is out of service already, which is what makes it not urgent.
          - The poster is a reason to want the coaster open and not evidence about which fault is worst.
          - Choosing by what fits in a shift ranks by convenience and leaves the growing fault growing.
      - group: COASTER
        task: Read a morning speed against the rule
        title: A tenth of a metre a second
        place: The Coaster
        scene: >
          The new morning rule sets a minimum station return speed. Today's reading is a tenth of a
          metre a second below yesterday's and still above the minimum, on a cold morning after
          rain.
        assumes:
          - the morning reading stands in for a speed at the crown nobody measures
          - rolling resistance changes with temperature and with wet track
        takeaway: A rule with a limit needs a way of telling a trend from a Tuesday.
        format: CHOICE
        question: The reading is down a tenth and still passing. What does the rule require?
        choices:
          - Run the ride and log the reading, since the limit is what decides whether it runs today.
          - Stop the ride until the morning reading returns to where it stood last week.
          - Ignore it, since a cold wet morning explains a reading a tenth low.
          - Reduce the train's load until the reading recovers.
        answer: Run the ride and log the reading, since the limit is what decides whether it runs today.
        why: >-
          A limit and a trend answer different questions. The limit is a pass or fail on this
          morning's ride and it has been passed, so the ride runs. The trend is what the log is for,
          and it needs a run of readings before it says anything — cold, wet track and a stiff grease
          all move a single morning's number without meaning the ride is wearing out. What would be
          wrong is either stopping a ride that meets its criterion or explaining away a reading
          without recording it, and the second one is how three seasons of decline went unnoticed.
        rebuttals:
          - Stopping on a passing reading makes the rule unusable and teaches operators to distrust it.
          - The weather is a fair explanation and an unlogged explanation is how a trend disappears.
          - Load has cancelled out of every limit on this ride, so lightening the train changes nothing.
      - group: CAROUSEL
        task: Order an overnight repair
        title: Shimming a ring overnight
        place: The Carousel and Swings
        scene: >
          The platform sits 11 millimetres low at 1 bearing. Kovač has a night to lift it,
          shim it and prove it, and four operations to fit into that night.
        assumes:
          - a load has to be taken off a bearing before the bearing can be packed
          - a repair is finished when it has been measured rather than when it is done
        takeaway: The last operation of any repair is the measurement that shows it worked.
        format: SEQUENCE
        task: Order the four operations of the overnight repair.
        cards:
          - Jack the ring at the two bearings either side of the low one and take the weight off it.
          - Pack the bearing plinth with shim stock until the ring reads level to two millimetres.
          - Lower the ring onto the packed plinth and torque the holding-down bolts to the plate figure.
          - Turn the ride for ten minutes and confirm the drive current no longer peaks each revolution.
        order: [0, 1, 2, 3]
        why: >-
          Every operation is what makes the one after it possible. A bearing under load cannot be
          shimmed, so the weight comes off first, and it comes off at the two neighbours rather than
          at the low bearing itself. The shim is measured against a level rather than counted in
          plates. Torque is applied after the ring is back down, since a bolt tightened on an
          unloaded joint is a bolt that loosens. The last one is not tidying up: the current trace is
          the only evidence that the thing which prompted all this has actually gone.

  # ----------------------------------------------------------------- day 14
  - title: What goes on the certificate
    objective: Sign what the working supports, and say what it does not.
    briefing: The inspection is tomorrow, and a signature is not a thing that can be taken back.
    stake: >-
      Thursday, and the last day anything can be changed. Marcus Vey witnessed the drop test this
      afternoon and has said nothing since. 7 rides have a margin computed for them, 6 of those
      margins hold, and the coaster's is 1.20 against a certificate that has said 1.38 for
      25 years. Marsh has 98000 pounds of advance bookings against the
      opening weekend. Today you set each ride against what has actually been derived for it, put a
      number on the ship's certified swing angle, and settle what the flume's boats may carry. A
      certificate is a claim in your name about what a machine will do to the next quarter of 1 million
      people through it, and it cannot be qualified afterwards.
    takeaway: A signature says what the working supports, and everything it does not cover has to be written down too.
    stops:
      - group: TOWER
        task: Match each ride to what its working supports
        title: Seven rides and what can be claimed
        place: The Drop Tower
        scene: >
          Vey's file has one line for each ride. Four of them are ready to be filled in and the words
          matter, because the sentence on a certificate is the sentence a court reads.
        assumes:
          - a claim is limited by the conditions the working was done under
          - a margin is a ratio between what is available and what is required
        takeaway: A certificate is a set of conditions with a number attached, and the conditions are the harder half.
        format: CASEBOOK
        task: Match each ride to the claim its working actually supports.
        scenarios:
          - The drop tower, with a witnessed test at 5.4 g peak against a 6.0 g limit.
          - The coaster, with a crown margin of 1.20 and a morning reading rule.
          - The swing carousel, derived at 31° and limited by an interlock at 10 turns a minute.
          - The wheel, with number-nine's bolt load computed and the weld indication unresolved.
        choices:
          - Certified as tested, with the ballast mass and the release height named in the entry.
          - 'Certified with a condition: it opens only on mornings the station reading is met.'
          - Certified without conditions, the limit being enforced by the machine rather than by a person.
          - 'Not certified: the load is known and whether the joint can carry it is not yet settled.'
        mapping: [0, 1, 2, 3]
        why: >-
          Four rides, four different kinds of claim, and the differences are the whole point. A
          witnessed test certifies the thing that was tested, so the conditions of the test belong in
          the entry. A margin that moves needs a condition attached that somebody can actually
          perform. A limit held by a controller needs no condition, because there is no human step
          left to fail. And a computed load with an unresolved defect is not a failure of the
          calculation — it is the calculation working, and pointing at the one question left.
      - group: SHIP
        task: Certify a swing angle
        title: What the seat pushes with at the bottom
        place: The Pirate Ship
        scene: >
          At the bottom of the swing the seat has to hold a rider on a curve as well as against
          gravity. Bianchi wants the certified angle set from a seat-force limit rather than from
          what the ride happens to do.
        assumes:
          - a body on a curve needs a net force toward the centre of that curve
          - at the bottom of a swing the seat pushes up and gravity pulls down
        takeaway: An angle is certified by the force it produces, not by the angle it looks like.
        format: BALLPARK
        question: Estimate the seat force at the bottom of a 48° swing, as a multiple of the rider's weight.
        estimate:
          prompt: The boat passes the bottom at 7.5 m/s on an arm of 8.6 m. At the bottom the seat pushes up and gravity acts down.
          question: Estimate the seat force at the bottom of a 48° swing, as a multiple of the rider's weight.
          labels:
            - 1  (the rider's own weight, always there)
            - 7.5 m/s  (speed through the bottom)
            - 8.6 m  (radius of the swing)
            - 9.8 m/s²  (g)
            - 5.9 s  (period of the swing)
          values: [1, 7.5, 8.6, 9.8, 5.9]
          slots: 4
          template: '{0} + {1} × {1} ÷ ({2} × {3})'
          formula: a + b*b/(c*d)
          correct: [0, 1, 2, 3]
          target: 1.67
          tolerance: 0.12
          units: × the rider's weight
          solution: N/mg = 1 + v²/(rg) = 1 + 7.5² ÷ (8.6 × 9.8) ≈ 1.67.
          explanation: The one is the rider's weight, which the seat carries even at rest. The period is what the swing takes and not what it does to anybody.
          relationship: 'N/mg = 1 + v²/(rg): at the bottom the seat carries the weight and supplies the turning force as well.'
        why: >-
          At the bottom of the arc the centre of the circle is straight up, so the net upward force is
          what bends the path, and the seat has to provide the rider's weight and that turning force
          both. 1.67 times body weight is a firm push and a long way inside anything a
          seated adult minds. What the arithmetic gives, and the eye does not, is where it stops
          being comfortable: 60 degrees would put it past 2, and the angle looks only a little
          larger.
      - group: FLUME
        task: Set what a boat may carry
        title: Four adults, and why not five
        place: The Log Flume
        scene: >
          McCarthy's rule of four came from Brennan. The hulls changed two seasons ago, and the
          question on the certificate is what a boat may carry rather than what it has carried.
        assumes:
          - a floating boat sits at whatever depth displaces its own weight
          - the drop at the end of the flume throws up a wave the boat meets
        takeaway: The load limit on a boat is set by what is left above the water, not by what floats.
        format: CHOICE
        question: What actually limits the number of adults in one of these boats?
        choices:
          - The freeboard left at the splash-down, since the wave there is what comes over the side.
          - The total mass, since the hull carries a maximum load figure stamped on it by its maker.
          - The draught in the flat sections, where the hull must not touch the channel floor.
          - Nothing physical; four is a comfort figure and five would float perfectly well.
        answer: The freeboard left at the splash-down, since the wave there is what comes over the side.
        why: >-
          Five adults float: the hull has plenty of buoyancy left and sits about three centimetres
          deeper, which is not the problem. The problem is at the bottom of the drop, where the boat
          meets the wave it has just made and the water rises relative to the hull by far more than
          three centimetres. What matters is therefore the height left above the waterline rather
          than whether the boat floats at all, and that is a different calculation from the one that
          says it does.
        rebuttals:
          - The maker's plate is a structural figure and it is well above five adults.
          - Grounding is a real limit on some flumes, and this channel runs deeper than the loaded draught.
          - Four is a physical limit and it is set at the splash-down rather than in the flat water.

  # ----------------------------------------------------------------- day 15
  - title: What opens, and what is written down
    objective: Say what has been established, how well, and what has not.
    briefing: The inspection is this morning, and what survives it is what was derived.
    stake: >-
      Friday, and Vey has been on site since 13 of the 7 rides have a derivation, a
      number and a condition; the wheel has a computed bolt load and a weld indication that arrived
      too late to resolve. The park opens in eight days if the certificates are signed this
      afternoon. Today you decide what the winter's money goes on, state what can honestly be
      claimed about the coaster, and write the standing order for the bumper floor that Hart's staff
      will actually work to. Brennan came in at 9 with the tenth notebook, which he had found in
      a drawer, and it has the 1998 regrade in it — dated, with a sketch, and no drawing number.
    takeaway: What outlives this fortnight is what somebody wrote down in a form the next person can use.
    stops:
      - group: COASTER
        task: Decide what the winter's money buys
        title: What to spend the winter on
        place: The Coaster
        scene: >
          There is money for about two pieces of work before next season. Marsh, Kovač and Vey each
          have a candidate, and the wheel's weld is unresolved.
        assumes:
          - the coaster's margin has been falling about a tenth of a metre a second each season
          - a defect cannot be judged until the load in the part is known
        takeaway: The work worth doing first is the work that answers a question nobody can currently answer.
        format: SCIENCETANK
        task: Fund the work that most changes what the park knows next season.
        proposals:
          - { label: A, text: 'Fracture assessment of number-nine spider arm against the computed 52.7 kN bolt load.' }
          - { label: B, text: 'Bearing and wheel overhaul on the coaster train, to recover the lost running speed.' }
          - { label: C, text: 'Re-survey the whole coaster track and issue drawings that match what is built.' }
          - { label: D, text: 'Repaint the midway and the carousel horses before the season opens.' }
        recommended: { A: 45, C: 35 }
        evidence: |
          The wheel is the only ride not certified, and the one question standing between it and a
          certificate is whether a known crack can carry a known load. The coaster's 1974 drawing was
          wrong about the loop by 1.8 metres of radius and nobody knows what else it is wrong about.
          The train's losses are real, understood, and inside the margin under the morning rule.
      - group: WHEEL
        task: State what can be claimed about the wheel
        title: The honest sentence about number nine
        place: The Ferris Wheel
        scene: >
          Raman has the bolt load, Bianchi has the indication's length and depth, and nobody has the
          fracture assessment. Marsh needs a sentence for the board and for the insurers.
        assumes:
          - a claim is limited by the working that supports it
          - an unresolved question is not the same as a negative finding
        takeaway: The strength of a claim is set by what was actually established, and saying so is the claim.
        format: CHOICE
        question: What is the honest sentence about the wheel this afternoon?
        choices:
          - The load in the joint is computed and whether the indication can carry it is not yet established.
          - The wheel is unsafe, since a crack of measured length has been found in a loaded joint.
          - The wheel is safe, since it has carried this load every season for 81 years.
          - Nothing can be said about the wheel until the fracture assessment is complete.
        answer: The load in the joint is computed and whether the indication can carry it is not yet established.
        why: >-
          Two things are known and one is not, and the sentence has to carry all three. Calling the
          wheel unsafe claims a finding nobody has made; calling it safe is the argument this
          fortnight was spent taking apart, since 81 years of service is a record rather than
          a margin. And saying nothing can be said discards real work: the load is computed, the
          indication is sized, and the single remaining question is now narrow enough to be answered
          by one specialist over the winter.
        rebuttals:
          - A crack in a joint is a finding about the joint, and its importance needs the load it is under.
          - 81 seasons is exactly the evidence this whole fortnight has been about not accepting.
          - The load and the crack size are both established, and pretending otherwise wastes them.
      - group: BUMPER
        task: Write the standing order the staff will work to
        title: A rule for the four-hundredth cycle
        place: The Bumper Cars
        scene: >
          Hart is writing the floor's standing order for people who will not have read any of this
          fortnight's working. Four instructions, in the order they happen on an ordinary cycle.
        assumes:
          - the floor speed and the car mass set the collision energy
          - an operator's checks have to fit inside the cycle they belong to
        takeaway: A standing order is written for somebody who has never seen the calculation behind it.
        format: SEQUENCE
        task: Order the four instructions for one cycle on the bumper floor.
        cards:
          - Check the floor speed setting against the card on the console before the gate opens.
          - Seat riders one to a car and confirm each lap belt is latched.
          - Run the cycle to the timer, watching for a car that stops taking power.
          - Enter the cycle count and any car taken out of service in the floor log.
        order: [0, 1, 2, 3]
        why: >-
          The order follows what each instruction protects. The speed setting is checked before anyone
          is on the floor, because it is the one number that changes what every collision does and the
          one nobody can judge by eye. Seating and belts come next and they are per rider. Watching
          during the cycle is where a fault shows itself. The log is last and it is not paperwork: a
          car taken out of service without a written record is a car somebody puts back tomorrow.

# --------------------------------------------------------------- the rooms
# What is inside each ride's own building — the station, the plant room, the
# operator's booth — and what the panel on the wall is reading when you walk in.
interiors:
  TOWER:
    caption: 42 metres of fall, and 9 metres of copper to take it back.
    standLine: A witnessed drop test, a ballast weight and one afternoon.
    station:
      kind: panel
      title: Tower control
      rows:
        - { label: Free drop, value: 42 m, status: normal }
        - { label: Braked section, value: 9.0 m, status: normal }
        - { label: Speed at the fins, value: 28.7 m/s, status: high }
        - { label: Peak deceleration, value: not yet measured, status: alarm }
  COASTER:
    caption: One motor puts the energy in, and everything after that is spending it.
    standLine: A loop regraded in 1998, and a drawing that never heard about it.
    station:
      kind: panel
      title: Coaster station
      rows:
        - { label: Lift crest, value: 26.0 m, status: normal }
        - { label: Crown of the loop, value: 20.0 m, status: normal }
        - { label: Crown radius, value: 7.4 m measured, status: alarm }
        - { label: Station return speed, value: 5.2 m/s, status: low }
  CAROUSEL:
    caption: Everything here is turning, so everything here is accelerating.
    standLine: 8 turns a minute since 1991, and a chalk mark on the pole.
    station:
      kind: panel
      title: Carousel drive
      rows:
        - { label: Platform speed, value: 8.0 rev/min, status: normal }
        - { label: Swing speed, value: 10 rev/min, status: normal }
        - { label: Drive current, value: peaks once a revolution, status: alarm }
        - { label: Ring level, value: 11 mm low at 1 bearing, status: high }
  WHEEL:
    caption: 28 metres of steel that has to balance before it turns.
    standLine: A weld indication in number nine, and no load to judge it against.
    station:
      kind: panel
      title: Wheel machine room
      rows:
        - { label: Out-of-balance moment, value: 177 kN·m, status: high }
        - { label: Bolt load in arm nine, value: 52.7 kN, status: high }
        - { label: Weld indication, value: 41 mm, status: alarm }
        - { label: Wind limit, value: 22 m/s, status: normal }
  BUMPER:
    caption: 100 collisions an hour, and every 1 of them is the same equation.
    standLine: 400 logged impacts, and nothing to compare them against.
    station:
      kind: panel
      title: Bumper floor
      rows:
        - { label: Floor speed setting, value: 3.1 m/s, status: normal }
        - { label: Car and rider, value: 320 kg, status: normal }
        - { label: Contact time for the car, value: 0.10 s, status: normal }
        - { label: Contact time for the rider, value: 0.18 s, status: high }
  SHIP:
    caption: A pendulum with 60 people on it, and a period that ignores every 1 of them.
    standLine: A drive set in 1996, and an operator who has been right for 2 seasons.
    station:
      kind: panel
      title: Ship console
      rows:
        - { label: Measured period, value: 5.90 s, status: normal }
        - { label: Drive interval, value: 5.60 s, status: alarm }
        - { label: Swing angle, value: 48° empty and 39° full, status: high }
        - { label: Seat force at the bottom, value: 1.67 × weight, status: normal }
  FLUME:
    caption: The pump buys the height, and the water spends it all the way round.
    standLine: A header tank, 400 metres of channel and a leak nobody has found.
    station:
      kind: panel
      title: Pumphouse
      rows:
        - { label: Head to the tank, value: 9.4 m, status: normal }
        - { label: Return flow, value: 0.42 m³/s, status: normal }
        - { label: Power required, value: 53.7 kW, status: high }
        - { label: Pump plate rating, value: 55 kW, status: alarm }

# What each place says when the player reads its sign.
copy:
  TOWER: <p>The drop tower. 42 metres of free fall, and a row of copper fins that has to take it all back in nine.</p>
  COASTER: <p>The coaster, built in 1974. One chain, one hill, one loop, and every number in its file computed from a drawing.</p>
  CAROUSEL: <p>The carousel and the swing chairs. Both of them turn, which means both of them are accelerating everything on board.</p>
  WHEEL: <p>The Ferris wheel, 81 years old and the tallest thing on the lake. 24 gondolas, and a moment that changes as it loads.</p>
  BUMPER: <p>The bumper floor. 12 cars, a steel ceiling, and about 100 collisions an hour when it is busy.</p>
  SHIP: <p>The pirate ship. 60 seats on an arm 8.6 metres long, driven by a wheel that pushes once each swing.</p>
  FLUME: <p>The log flume. A pump, a header tank, 400 metres of channel and 1 drop at the end that everybody queues for.</p>
  GATE: <p>The front gate and the ticket booths. Closed since October, and the reopening is on the board behind the glass.</p>
  WORKSHOP: <p>Brennan's workshop. 11 notebooks, a bench, and 41 years of settings in 1 hand.</p>
  ARCADE: <p>The arcade and the boarded stalls along the midway. Nothing in here needs certifying, which makes it the quietest building on site.</p>
  PLANT: <p>The plant room. Compressors, the water treatment set, and the switchboard everything on the midway runs off.</p>

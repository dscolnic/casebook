      - group: TOWER
        task: Get the deceleration the fins have to produce
        title: 9 metres to take back 29
        concept: Acceleration as the rate a velocity changes, whichever part of it changes
        place: The Drop Tower
        scene: The carriage reaches the brakes at 28.7 metres a second and stops 9 metres later. The tower technician wants that turned into an acceleration before anyone argues about whether the stop feels acceptable.
        guide: >-
          Five numbers, and two of them belong to the fall rather than the stop: the
          free-fall height above, and gravity. Ask of each whether the braking depends
          on it. And note the square on the entry speed. Halve the stopping distance and
          the average deceleration doubles, which is why a small rise in entry speed
          costs so much brake.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - the same constant-acceleration relation runs backwards for slowing down
          - an acceleration can be quoted as a multiple of g
        takeaway: A stopping distance and a speed are enough to fix the acceleration, with no time measured at all.
        format: BALLPARK
        question: Estimate the average deceleration in the braked section.
        why: The stopping relation is the same constant-acceleration equation used on the drop, but solved for a instead of v. With 28.7 m/s removed over 9.0 m, the average deceleration is about 45.8 m/s², or 4.7 g. The square on speed is the design lesson. Halving the stopping distance doubles the average deceleration. Likewise, a modest increase in entry speed demands much more braking force and leaves less room for error.
        estimate:
          prompt: The carriage enters the fins at 28.7 m/s and stops in 9.0 m of travel.
          question: Estimate the average deceleration in the braked section.
          labels:

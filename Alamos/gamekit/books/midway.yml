  - title: What the brake has to take out
    objective: Turn a stopping distance into a force on a person.
    briefing: The tower's brake has nine metres to remove everything the fall put in.
    stake: >-
      Tuesday, and the tower is first on Vey's list. It is the ride with the least between a
      rider and the ground. Yesterday's working says the carriage reaches the fins at 29 metres
      a second. The fins have 9 metres to take all of that back. Rafael Santos, who looks after
      the brakes, points out that nothing in the system can be set. The magnets push harder the
      faster the fins move, and that is all the control there is. Vey's reply is short. A brake
      nobody can set is still a brake nobody has measured. Today you turn a stopping distance
      into an acceleration. You also work out a pressure from a depth at the flume, and settle
      what a moment arm is under the wheel. Ask what the seat does to the rider, not just what
      the fins do to the car.
    takeaway: Every force in this park is a mass times an acceleration somebody has to work out.

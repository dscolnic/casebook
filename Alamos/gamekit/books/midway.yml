        task: Turn the water depth into a pressure
        title: What nine metres of water pushes with
        place: The Log Flume
        scene: The water surface in the elevated tank is 9.4 metres above its outlet. Kelechi Abara, the pumps and water systems, has a pressure gauge on that outlet and an old notebook value that does not match the reading.
        guide: >-
          Five numbers, and two of them describe the tank rather than the water above
          the outlet: the diameter, and the flow through it. Ask of each whether
          pressure depends on it. A narrow pipe of the same height gives the same
          pressure, which is why the width is offered and not needed. The outlet answers

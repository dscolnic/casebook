      - group: BUMPER
        task: Sort the ride log before the certificate is written.
        title: Speed, or the turn
        takesAsRead:
          - "Velocity against speed: direction is part of the quantity"
        concept: "Centripetal acceleration: v² over r, pointing at the centre"
        place: The Bumper Cars
        scene: The certificate needs every complaint on the log classified before it is written. Some of what the riders describe is the ride going fast. The rest is the ride turning, and a rider cannot tell the difference from the seat.
        guide: >-
          Two bins. What a rider feels in a turn is the seat pushing them toward the centre,
          and it depends on speed squared over radius — so a tight slow turn can beat a fast
          straight. Sort each complaint on whether it is about how fast or about how sharply.
        background:
          - >-
              Why riders cannot tell. A body has no sense that measures speed. What it senses is
              acceleration, which is what a seat, a rail or a harness has to supply. On a straight at
              constant speed there is nothing to feel at all, however fast it is.
          - >-
              Why the radius does the work. The acceleration in a turn is the speed squared divided by
              the radius, so halving the radius doubles it while nothing about the speed has changed.
              That is why the tightest bend, not the fastest section, is where a ride hurts people.
        assumes:
          - a body feels the force pushing it, not its speed
        takeaway: What a rider feels is acceleration, and a turn supplies it without going any faster.
        format: BELT
        question: Send each complaint to the bin that says what actually produced it.
        answerText: Anything about being thrown sideways or crushed into a seat is the turn. Anything about how fast it went is usually not the thing they felt.
        why: >-
          A rider has no organ that measures speed. What the body senses is acceleration, which
          is what the seat, the harness or the rail has to supply — so a straight run at
          constant speed produces no sensation at all however fast it is, and a tight bend at
          walking pace can be unpleasant. The acceleration in a turn is the speed squared over
          the radius, which is why the radius carries so much of the blame: halve it and the
          rider feels twice as much with the ride going exactly as fast as before. That is
          the classification the certificate needs. Complaints about being thrown against the
          door, crushed into the seat or unable to lift an arm are all the turn, and they are
          fixed by geometry or by a speed limit through that geometry. Complaints about the
          ride being too fast are usually about something else — noise, duration, or the drop —
          and slowing the whole ride to answer them fixes nothing anybody actually felt.
        belt:
          left: { name: The turn }
          right: { name: Not the turn }
          need: 20
          lives: 3
          pass: 0.8

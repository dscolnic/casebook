  # ------------------------------------------------------------------ day 3
      - group: TOWER
        task: Hold the tower brake while the car comes down.
        title: One g, all the way down
        takesAsRead:
          - "Acceleration as the rate a velocity changes, whichever part of it changes"
        concept: "Newton's second law as the definition of a net force"
        place: The Drop Tower
        scene: The tower's magnetic brake is set from the console and the car has to come down inside the deceleration band the certificate names. The car's mass changes with every load, and the brake does not know how many people are in it.
        guide: >-
          Hold the deceleration inside the band on the console. The band narrows toward the
          bottom, because the last stretch is where a rider's neck takes whatever the brake
          does. The brake current is your control, and every change in load changes what the
          same current produces.
        background:
          - >-
              Why the same brake gives a different ride. A net force divided by mass is the
              acceleration, so the same braking force decelerates a heavy car less than a light one.
              The brake current sets the force; the riders set the mass; the certificate is written
              about the acceleration, which is the ratio.
          - >-
              Why nothing here is a step. A magnetic brake's force depends on speed, so as the car
              slows the force falls and the deceleration falls with it. Holding a deceleration means
              raising the current continuously through the stop rather than setting it once.
          - >-
              Why the band tightens near the bottom. The car is slowest there, the brake is weakest
              there, and the rider's tolerance is unchanged. It is the one part of the drop where the
              margin has to be made rather than inherited.
        assumes:
          - a force applied to a mass produces an acceleration
        takeaway: The same force is a different ride, because what the rider feels is force divided by mass.
        format: HOLD
        question: Hold the deceleration inside the band all the way down.
        answerText: Inside the band for most of the stop, with the current raised as the car slows rather than set once at the top and left there.
        why: >-
          The certificate limits the deceleration. The console sets the braking force. Between
          them sits the mass in the car, and that changes on every cycle. Twelve adults and four
          children is a different vehicle from four adults. A current that gave a comfortable
          stop this morning gives a harsher one when the car is light. That is the second law
          as an operating rule rather than an equation. There is a second difficulty. A magnetic
          brake's force depends on how fast the car moves through the field, so it fades as the
          car slows. Hold the current steady and the deceleration decays away with it. The
          current has to be raised through the stop. And the band narrows at the bottom, where
          the brake is weakest and the rider's neck is no stronger than it was at the top.
        hold:
          quantity: Deceleration
          unit: g
          control: Brake current
          hold: 1
          band: 0.4
          narrowTo: 0.2

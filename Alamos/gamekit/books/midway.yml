          formula: a*b
          correct: [0, 1]
          target: 29312
          tolerance: 2000
          units: N (about 29 kN)
          solution: 640 × 45.8 ≈ 29,300 N, or about 29 kilonewtons.
          explanation: Mass times acceleration, and nothing else. The height, gravity and the entry speed describe the fall, which has finished by the time the fins are doing anything.
      - group: TOWER
        task: Derive the speed at the bottom of the drop
        title: What 42 metres of fall is worth
        place: The Drop Tower
        scene: The tower drops its carriage 42 metres before the brakes begin. An old engineering notebook gives the bottom speed as 'about 29' and nothing else. The safety engineer wants the working written underneath.
        guide: >-
          You build the derivation a line at a time. The starting relation is on the
          rail, and at each step you choose the expression the line above actually gives
          you. Every wrong branch is algebraically legal, so you cannot find the answer
          by spotting the malformed one — you have to know which operation the previous
          line licenses. Work down to the speed at the bottom of the fall.
        background:
          - >-
              Why derive it rather than look it up. The notebook says 'about 29' and nothing
              else, which cannot be checked, cannot be corrected for a different drop
              height, and cannot be defended to an inspector. A derivation is the same
              number plus the reason it is that number, and the reason is what transfers to
              the next ride.
          - >-
              What the starting relation says. v² = v₀² + 2aΔx is a statement about constant
              acceleration with the time taken out of it. That is exactly the convenient
              form here, because the question asks about a distance fallen and says nothing
              about how long the fall lasted.
          - >-
              What is being assumed. Released from rest makes v₀ zero, and treating a as g
              assumes the fins do nothing until they engage and that drag on the carriage is
              small over 42 metres. Both are stated on the card rather than hidden, because
              the number is only as defensible as the assumptions it was computed under.
        takesAsRead:
          - Acceleration as the rate a velocity changes, whichever part of it changes
          - Newton's second law as the definition of a net force
        assumes:
          - an object in free fall accelerates at about 9.8 metres per second every second
          - the constant-acceleration relations connect speed, acceleration and distance
        takeaway: Choose the constant-acceleration relation that contains the quantities you know and omits the one you do not.
        format: DERIVE
        question: Get the speed at the end of 42 metre free fall, from the constant-acceleration relations rather than from the notebook.
        answerText: v = √(2 × 9.8 × 42) ≈ 28.7 m/s, and it is the speed at the moment braking begins.
        why: "The old notebook's 'about 29' was right, but the engineer signing the safety certificate needs a defensible chain. The relation v² = v₀² + 2aΔx fits because the distance is known and time is not. Starting from rest leaves v = √(2gΔx), with no mass in the result. That is why objects in free fall share the same acceleration. The square matters: doubling the fall distance raises speed only by √2, about 41%. The same relation will run backward tomorrow when the brake removes that speed over a known distance."
        derive:
          hint: Each line has to follow from the one above it.
          start: v² = v₀² + 2aΔx
          startNote: the carriage is released from rest and falls 42 m before the fins engage
          goal: the speed at the bottom of the fall, in metres per second
          steps:
            - ask: Put the conditions of this drop into the relation.
              answer: 0
              candidates:
                - text: v² = 0 + 2(9.8)(42)
                  rule: substitution
                - text: v² = 0 + 2(9.8)(42)(2.9)
                  rule: substitution
                  why: The time is already inside the relation; that is what makes it the useful one here. Multiplying by it as well counts the fall twice and leaves units of metres squared per second.
                - text: v² = 0 + (9.8)(42)
                  rule: substitution
                  survives: true
                  why: The factor of two is what carries the average speed of an accelerating body. Drop it and every step below is clean algebra with a speed 29% low — 20 metres a second, which reads perfectly plausible for a fall of this size.
                - text: v = 0 + 2(9.8)(42)
                  rule: substitution
                  why: The relation gives the square of the speed. Reading the left side as v and not v² turns a speed into something 823 units large.
            - ask: Rearrange for the speed itself.
              answer: 1
              candidates:
                - text: v = 823 ÷ 2
                  rule: rearrangement
                  why: Halving is not the inverse of squaring. It happens to be the operation that appears in the relation, applied to the wrong side of it.
                - text: v = √823
                  rule: rearrangement
                - text: v = 823²
                  rule: rearrangement
                  why: Squaring again moves in the wrong direction. The left-hand side is already a square and has to be undone rather than repeated.
                - text: v = √(823) with the sign left open, since the root has 2 values
                  rule: definition
                  survives: true
                  why: "Algebraically correct and physically empty: the negative root is the same speed travelling upward, which this carriage is not doing. Carrying it down the page leaves an answer that cannot be reported as a number."
            - ask: Evaluate it, and say what the answer is a statement about.
              answer: 2
              candidates:
                - text: v ≈ 28.7 m/s, the speed of anybody in the carriage
                  rule: evaluation
                  survives: true
                  why: The arithmetic is right and the claim is too wide. It is the speed of the carriage and of everything falling with it, which happens to include the riders, and the derivation says nothing about what any of them feel.
                - text: v ≈ 41.2 m/s by the time the carriage reaches the bottom of the tower
                  rule: evaluation
                  why: That is the root of 1,700, which is what 2aΔx gives if the drop is taken as the whole tower rather than the free part of it. The fins take the last nine metres.
                - text: v ≈ 28.7 m/s, the speed of the carriage where the fins begin
                  rule: evaluation
                - text: v ≈ 28.7 m/s, the average speed over the fall
                  rule: definition
                  why: The average speed of a fall from rest is half the final 1, about 14. This number is the speed at one instant, which is the instant the brake has to work at.
      - group: COASTER
        task: Match each point on the circuit to what is true of the train's energy there.
        title: Reading a circuit as energy
        concept: Conservation of mechanical energy, and dividing the mass out of it
        place: The Coaster
        scene: Marta Kovač walks the track every morning. On the workshop wall she has four places chalked out. They are the lift hill, top of the first hill, bottom of the first drop, and final braking section.
        guide: >-
          Four places on the circuit, and four statements about energy. Pair them by
          asking two things of each. Where is the energy sitting, in height or in
          motion? And is any being added or removed there? Only one place on the whole
          circuit adds energy. One removes it and never gives it back. That is why no
          later hill reaches the height of the first.
        background:
          - >-
              Why this is a matching board and not four separate questions. Responses on
              boards like this are written to be plausible for more than one situation, so
              choosing them one at a time lets a nearly-right answer through unexamined.
              Having to place all of them forces the comparison — not "is this reasonable
              here", but "is it more right here than there".
          - >-
              How to use the one-each rule. Because the responses are a set to be
              distributed rather than a list to be sampled, every join you make constrains
              the rest. Settling the two you are confident of can leave the remaining pair
              decided by elimination. Where it does not, two responses are still competing
              for one situation, and that is exactly the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every response used once,
              three correct joins leave the fourth with only one place to go. Any error
              therefore involves at least two joins. That is worth remembering when the last
              pair looks forced: the fault is usually not in the join you are struggling
              with, but in one you made early and stopped questioning.
        assumes:
          - lifting something stores energy that can be given back
          - a moving body carries energy that depends on the square of its speed
        takeaway: Mechanical energy trades between height and motion, while motors add it and friction or brakes remove it.
        format: PROTOCOL
        why: The lift motor adds mechanical energy while the train climbs. After the top of the first hill, height and speed trade energy back and forth. Friction drains some into heat all around the circuit, so later hills cannot reach the height of the first hill. The foot of the first drop is fast because much of the stored height has become kinetic energy. The final braking section removes the remaining mechanical energy deliberately. Reading the circuit this way separates energy transfers from energy losses.
        scenarios:
          - The chain is dragging the train up the lift hill.
          - The train is at the top of the first hill, moving slowly.
          - The train is at the foot of the first drop.
          - The train is in the final braking section at the end.
        choices:
          - A motor is putting energy in, and it is the only place on the circuit where that happens.
          - Almost all of it is stored in the height, and very little is in the motion.
          - Almost all of it is in the motion, and this is the fastest the train will be all circuit.
          - It is being taken out and turned into heat in the fins, and none of it comes back.
        mapping: [0, 1, 2, 3]
      - group: SHIP
        task: Say what the swing's period depends on
        title: 60 people and the same 5 seconds
        concept: "Simple harmonic motion: a restoring force proportional to displacement"
        place: The Pirate Ship
        scene: Sam Idowu, the senior ride operator, has run the pirate ship for 20 years. During low-angle maintenance swings, a full boat and an empty one both take 5.9 seconds. He wants to know why loading changes the force on the pivot bearings but not that timing.
        guide: >-
          All four options explain a period that does not move when the boat fills. Ask
          of each whether it names a cancellation or an accident. The restoring pull is
          the boat's own weight, and the inertia resisting it grows in the same
          proportion. So they cancel, and length and gravity are what remain. Note the
          limit too: this holds at small angles, and the ride swings 48 degrees.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a pendulum has a restoring force toward its lowest point
          - Newton's second law connects net force, mass and acceleration
        takeaway: A variable can disappear from a motion when it scales both the restoring force and the inertia in the same way.
        format: CHOICE
        question: Why does adding riders leave the low-angle period essentially unchanged?
        answerText: At small angles, the extra restoring force and extra inertia scale together, so mass cancels from the period.
        why: "The restoring force comes from the boat's own weight. Add mass and that force grows in the same proportion as the inertia resisting acceleration. Those factors cancel, so the small-angle period does not depend on mass. Length and local gravity remain. This statement has a limit: the simple period formula assumes a small swing angle. At the ride's 48-degree operating swing, the period is a little longer. Loading still barely changes it, but amplitude now matters."
        choices:
          - Extra mass is pulled back harder in the same proportion, so the acceleration is unchanged.
          - The extra riders sit near the pivot, where they have little effect on the swing.
          - The drive motor holds the rate constant whatever the boat happens to weigh that cycle.
          - Extra mass does slow it, and 5.9 seconds is the average of full and empty.
        answer: Extra mass is pulled back harder in the same proportion, so the acceleration is unchanged.
        rebuttals:
          - Riders sit along the whole boat, and where they sit would matter to the period if mass mattered at all.
          - The drive gives a push at the end of each swing and does not set the rate the boat returns at.
          - The log shows 5.9 seconds on empty cycles and on full ones separately, not as a mean.

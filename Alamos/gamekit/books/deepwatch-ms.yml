      - group: SONAR
        task: Work out how fast the loudness swells from the two tones.
        title: Why the level pulses three times a second
        place: Sonar Shack
        scene: Two tones sit at one hundred and forty-seven and one hundred and fifty hertz, on the same bearing. The sound swells and fades in a steady rhythm while both tones hold still.
        guide: >-
          Three numbers, and one of them is the speed of sound, which the swelling does
          not need. It belongs to wavelengths, not to this rhythm. Ask of each number
          whether the swells depend on it. Both tones are holding still, so nothing is
          changing pitch. What changes is how the two line up, and that comes from the
          gap between them.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - two sounds arriving together add up, and can also cancel
          - hertz means how many times a second something repeats
        takeaway: Two close tones together make the loudness rise and fall at the difference between them.
        format: BALLPARK
        question: How many swells a second should those two tones make?
        answerText: Three swells a second, which is the difference between the two tones. Neither tone has changed pitch.
        why: Two tones close together take turns lining up and cancelling. When their crests arrive together the sound is loud. A moment later one has slipped behind, they work against each other, and the sound drops away. How fast that cycle repeats is only the difference between the two pitches. One hundred and fifty against one hundred and forty-seven gives three swells a second. Neither tone has moved at all.
        choices:
          - Two sources beating together, at the difference between their pitches.
          - One source whose speed is changing three times a second.
          - A fault in the display, since two steady tones cannot pulse.
          - Our own machinery, folded into the band.
        answer: Two sources beating together, at the difference between their pitches.
        rebuttals:
          - A change in speed moves a tone up or down. It does not make the loudness swell on a fixed beat.
          - Two steady tones pulsing is exactly what adding waves sounds like. The display shows the tones, not the sum.
          - Our own machinery would show on every bearing. These two are on one.
        estimate:
          prompt: Two tones, at one hundred and forty-seven and one hundred and fifty hertz, in water where sound travels about fifteen hundred metres a second.
          question: How many swells a second do the two tones make?
          relationship: Swells each second = the difference between the two pitches.
          explanation: Only the two pitches set the beat. The speed of sound matters for working out a wavelength, and not for this subtraction.
          solution: One hundred and fifty take away one hundred and forty-seven is three swells a second.
          labels:
            - 147 hertz (the first tone)
            - 150 hertz (the second tone)
            - 1,500 metres a second (the speed of sound in water)
          values: [147, 150, 1500]
          correct: [1, 0]
          slots: 2
          template: "{0} − {1}"
          formula: a - b
          target: 3
          tolerance: 0.25
          units: Hz
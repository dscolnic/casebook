      - group: SONAR
        task: Say where the contact has gone.
        title: Where the sound will not go
        concept: Sound is a wave, and it travels through water as well as air
        place: Sonar Shack
        scene: The sound trace reads faster above sixty metres and slower below it. A contact held for forty minutes while the boat stayed at twenty. Then it vanished in one sweep, and nothing else changed.
        guide: >-
          The contact went in one sweep, and nothing else changed. Ask of each option
          whether it explains that suddenness. Distance and shutting down both work
          slowly. The blind sector is a direction, not an event. The sound speeds are
          the numbers doing the work. Sound bends toward slower water, and that can
          leave a gap our sound never enters.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.

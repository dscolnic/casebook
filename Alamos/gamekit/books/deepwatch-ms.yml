        task: Put the passage checks in the order they have to be done.
        title: What has to be true before the boat commits
        place: Sonar Room
        scene: Rask shuts the sonar-room door and lays out the checks for the passage. The narrows are on the next chart panel. Once the boat is committed there is no room to turn round.
        guide: >-
          Each of these four makes the next one readable. So ask what would make no
          sense without it. A new sound is only new against a record of the old ones. A
          missing tone means nothing until you know where the layer is. Watching a
          contact move takes minutes. And one of these is agreed early, because
          afterwards everybody is busy.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim that each step needs the
              one before it to have happened. Get one pair the wrong way round and the claim
              is wrong, even if everything else lines up. That is why there is no part
              credit.
          - >-
              Why the ends are the place to start. The first and last steps are usually the
              easiest to be sure of, because one has nothing before it and the other has
              nothing after it. Fixing those two leaves fewer ways for the middle to go, and
              the middle is where the real question usually is.
          - >-
              What the rail can be ordered on. Often it is time. It can also be cost, or
              risk, or what you can still undo afterwards — do the steps that change nothing
              before the ones that change something for good. A step that destroys the
              sample can only be last.
        assumes:
          - a measurement can mean nothing without an earlier one to read it against
        takeaway: A plan is ordered by what each measurement needs before it can mean anything.
        format: SEQUENCE
        why: A plan is a list of things that have to be true when the boat commits. Each one is what the next gets read against. Without the boat's own noise, a new sound is only a sound. Without the layer, a missing tone looks like an empty sea instead of a bent path. Bearings take time, so they cannot be started at the entrance. And the lost-contact rule is agreed early for a different reason. Afterwards, everybody is busy.

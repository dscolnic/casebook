  - title: Forward Flooding
    objective: Find the water, decide whether pumping can win, and stop the source.
    briefing: |-
      The forward space is taking water. The drain pump is running and the level is still rising. Somewhere under those deck plates is a hole, and the boat is at 90 metres, which is what makes it a hole worth respecting.
    stake: "Sixth day. Water is over the bilge in the forward space, with the drain pump running. Ruth Hallam, the auxiliary division, has the level and reports it steady. Ferro does not believe steady means anything, and is looking for the hole. This watch you find where the water is coming in, and work out whether pumping can win. Pumping buys minutes, and they are worth nothing unless somebody spends them finding the source."
    takeaway: Flooding is stopped at the hull fitting; everything else is delay.
    stops:
      - group: DC
        task: Read the flows, decide which ones belong in the sum, and close the water balance.
        title: Under the deck plates
        concept: Adding weight changes what floats, and how fast it changes
        place: Forward Equipment & Handling
        scene: The forward bilge alarm has gone twice, and water shows through the deck-plate slots. Machinist's Mate Ruth Hallam marks the level a minute apart while the drain pump runs. Command wants the inflow now.
        guide: >-
          Reading a stream costs nothing, so read them all. Then count only the ones in
          the same units as the number command wants, which is gallons a minute of water
          coming in. The bilge level is rising while the drain pump is already taking
          water out, so the pump has to go back into the sum. Report the total when the
          ledger closes.
        background:
          - >-
              Why the rise is not the inflow. What piles up in the bilge is what came in
              minus what has already been removed. The pump is running the whole time Hallam
              is marking the level, so the rise you can see is the inflow with the pump's
              share already subtracted. Add the pump back and you have what is actually
              coming in.
          - >-
              Why the units matter. A centimetre of rise is not a flow until you know the
              area of the compartment floor and the time between the two marks. Some of the
              streams on the board are already in gallons a minute and some are not, and
              adding a number in the wrong units gives an answer that is wrong by a factor
              nobody can see.
          - >-
              Why command wants the inflow and not the level. The level tells you how bad it
              is now. The inflow tells you how long you have and whether the pumps you own
              can win. That is the number a decision is made on.
        assumes:
          - a rise in the bilge is what stayed behind, not what came in
          - a pump that is running takes water out during the same minute
        takeaway: What piles up is what came in minus what was taken out, so anything already removing has to go back into the sum.
        format: BALANCE
        question: How fast is water coming in, before the pump takes any of it out?
        balance:
          hint: Read every stream for free. Count only quantities with the same units as the requested inflow. Remember that a removal running during the measurement does not appear in the level rise.
          total:
            amount: 143
            unit: gpm
            label: Water entering the compartment
          streams:
            - id: rise
              label: Bilge accumulation
              value: 88
              display: 8 cm rise in 1 minute = 88 gpm
            - id: fresh
              label: Fresh-water tank loss
              value: 0
              display: tank level unchanged
            - id: cooling
              label: Sonar-cooling flow loss
              value: 0
              display: flow unchanged
            - id: drain
              label: Drain-pump discharge
              value: 55
              display: 55 gpm
              hidden: true
              note: The pump was already running when both bilge readings were taken.
          tolerance: 5
        answerText: About one hundred and forty-three gallons a minute. Eighty-eight piled up in the bilge, and another fifty-five went over the side through the pump in the same minute.
        why: The rise in the bilge is only what stayed behind during that minute. The pump ran the whole time, and what it threw over the side never showed on the deck plates. So the sum is what piled up plus what was pumped. Eighty-eight and fifty-five make about a hundred and forty-three gallons a minute. The fresh-water tank and the cooling flow did not change, so they add nothing. A pump makes a bad leak look small.

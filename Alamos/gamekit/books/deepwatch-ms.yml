        task: Say which link in the chain has failed.
        title: One link is not handing the heat on
        concept: Heat moves from hot to cold, and it needs a path
        place: Machinery Control Room
        scene: The oil and the fresh water are both hot. Seawater goes into the cooler at nine degrees and comes out at twenty-three, against a normal twelve. The flow gauge reads forty-five per cent.
        guide: >-
          Follow the heat along the chain, and ask where it stops being passed on. Two
          facts limit the answers. The fresh water is hot, so heat is reaching the
          cooler. The seawater comes out fourteen degrees warmer instead of three. Ask
          of each option what it would do to that outlet. A furred cooler would give a
          small rise, not a big one.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - a cooler needs water moving on both sides to shift heat
        takeaway: Less water carrying the same heat has to come out hotter.
        format: CHOICE
        question: Which link in the chain has failed?
        answerText: Too little seawater is going through the cooler. The heat gets that far and then has nothing to leave in.
        why: How much heat water carries away depends on how much water there is, and on how much it warms up. Keep the heat the same and halve the water, and every litre carries twice as much. So it comes out hotter. Here the sea water warms fourteen degrees instead of three, with the flow at forty-five per cent. The hot fresh water says the heat reaches the cooler. The big rise says too little water is taking it away.
        rebuttals:
          - The fresh water is hot, so heat is crossing the oil cooler into it.
          - The gauge reading forty-five per cent points straight at the flow, further down the chain.
          - Several temperatures moved together, so one bad oil sensor cannot cover it.
          - A fourteen-degree rise with the flow that low is well outside the normal pattern.
        headline: The oil is hot, the fresh water is hot, and the seawater leaves far warmer than it arrived.
        readings:
          - zone: Bearing
            label: Lube oil
            value: 71 °C, rising
            status: alarm
          - zone: Fresh water
            label: Loop temperature
            value: 64 °C, rising
            status: alarm
          - zone: Seawater
            label: Inlet
            value: 9 °C
            status: normal
          - zone: Seawater
            label: Outlet
            value: 11 °C
            status: alarm
          - zone: Plant
            label: Seawater pumps running
            value: one of two
            status: high
        choices:
          - label: Not enough seawater going through the cooler.
            mechanism: Less water carrying the same heat has to come out hotter.
          - label: The oil cooler is furred up.
            mechanism: A furred oil cooler would leave the fresh water cool, not hot.
          - label: The bearing has started making far more heat.
            mechanism: More heat would warm everything, and it would not explain a flow gauge at forty-five per cent.
          - label: The oil temperature sensor is faulty.
            mechanism: One bad sensor cannot make the fresh water hot and the seawater warm as well.
          - label: Ordinary background, nothing more.
            mechanism: A fourteen-degree rise at forty-five per cent flow is not normal at this load.
        answer: Not enough seawater going through the cooler.

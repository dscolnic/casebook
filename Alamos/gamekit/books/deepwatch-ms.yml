theme:
  id: deepwatch_ms
  title: Deep Watch
  subtitle: Reasoning Under Pressure Beneath the Surface

# The areas of study. One column of the game each; every group needs somebody on the roster.
groups:
  - id: SONAR
    code: SONAR
    name: Sonar & Acoustics
    color: "#2f8f8f"
    desc: What the water carries, what the boat makes, and how to tell them apart.
    defaultLeader: rask
    format: diagnosis
    milestones:
      - Learn the displays
      - Separate signal from noise
      - Hold a track
      - Ready to report
    issues:
      - A contact was called from one display.
      - The bearing rate was never checked.
  - id: NAV
    code: NAV
    name: Navigation & Position
    color: "#3f7fb6"
    desc: Where the boat is, how old that answer is, and how wrong it is allowed to be.
    defaultLeader: sowande
    format: ballpark
    milestones:
      - Learn the plot
      - Carry the error
      - Take an independent fix
      - Ready to route
    issues:
      - The plot has no time on it.
      - Two displays agreed and nobody asked why.
  - id: DC
    code: DC
    name: Damage Control
    color: "#6a8a4a"
    desc: Water in the boat — finding it, stopping it, and knowing whether you are winning.
    defaultLeader: ferro
    format: protocol
    milestones:
      - Learn the compartments
      - Find the source
      - Stop the source
      - Ready to dewater
    issues:
      - A pump was started before the source was found.
      - The bilge level was never trended.
  - id: FIRE
    code: FIRE
    name: Fire & Electrical
    color: "#b0a03a"
    desc: Fire aboard is an electrical problem until the power is proved gone.
    defaultLeader: okonkwo
    format: protocol
    milestones:
      - Learn the switchboard
      - Isolate the fault
      - Prove it dead
      - Ready to restore
    issues:
      - An indicator lamp was trusted as proof.
      - A load was restored before the seat was cold.
  - id: ATMO
    code: ATMO
    name: Atmosphere & Life Support
    color: "#6a5fb0"
    desc: The air is a system with sources, sinks and a flow path, and people are in it.
    defaultLeader: lindqvist
    format: diagnosis
    milestones:
      - Learn the air path
      - Measure it yourself
      - Find the sink
      - Ready to recover
    issues:
      - An installed sensor was treated as a measurement.
      - A damper position was assumed.
  - id: ENG
    code: ENG
    name: Propulsion & Engineering
    color: "#b0533a"
    desc: What turns the shaft, what cools it, and what the boat gives away by running it.
    defaultLeader: haruki
    format: sequence
    milestones:
      - Learn the plant
      - Trace a dependency
      - Reduce a signature
      - Ready to answer bells
    issues:
      - A pump was secured without checking what it cooled.
      - The plant was quiet and nobody said why.

# The cast. `division` is what makes a person a valid person stop.
roster:
  - id: rask
    name: Petty Officer Nils Rask
    role: Sonar Supervisor
    division: SONAR
    bio: |-
      Runs the sonar room, which is a dark space with three displays and one
      rule: the loudest thing on the screen is almost never the thing that
      matters. He has 11 years of watches and can tell you what a fishing
      fleet sounds like at 4000 yards.

      Sound in water is not like light in air. It bends toward the colder,
      slower water, so a layer of warm surface water above a cold one makes a
      shadow zone the boat can hide in — and so can everybody else. A contact
      that vanishes has not necessarily left; it may have crossed the layer.

      His limit is that passive sonar gives him bearing and almost nothing
      else. Range and course have to be built up by watching how the bearing
      changes over time, which is why he will not give a track from one look and
      gets short with anybody who asks for one.
    quiz:
      - q: Why can a contact disappear from Rask's display without going anywhere?
        a: Sound bends toward colder water, into a shadow zone
        wrong:
          - Passive sonar stops working when a contact slows down
          - The array can only hold four contacts at a time
          - A contact that stops making noise ceases to reflect sound
      - q: What does passive sonar give Rask directly?
        a: A bearing, and almost nothing else until he watches it change
        wrong:
          - A range, from the strength of the sound
          - A course and speed, from the frequency alone
          - A depth, from the angle the sound arrives at
  - id: dunne
    name: Sonarman Kes Dunne
    role: Broadband Operator
    division: SONAR
    bio: |-
      Sits the broadband stack for six hours at a stretch, which is a job of
      listening to noise and noticing when a shape appears in it. Two years
      aboard, and better at it than people twice her time.

      The display she watches is bearing against time, and the thing she is
      looking for is a line that persists. A single bright mark is nothing —
      the sea is full of them. A faint mark in the same place minute after
      minute is a contact, because the sea has no reason to be consistent.

      She keeps a paper log of what the boat itself was doing when a trace
      appeared, because half the traces that frighten a new operator are the
      boat's own: a pump that started, a shaft that came up in turns, a hull
      popping as the depth changed.
    quiz:
      - q: What makes Dunne treat a faint mark as a real contact?
        a: It stays on the same bearing while random marks do not
        wrong:
          - It is brighter than the marks around it
          - It appears at the same time as a hull pop
          - It shows on two displays fed by the same array
  - id: sowande
    name: Lieutenant Imani Sowande
    role: Navigator
    division: NAV
    bio: |-
      Keeps the plot, and holds the only opinion on this boat that the captain
      cannot overrule with an order: how well the plot is known. Her working
      rule is that a position is a claim with an age on it, and the age is the
      part everybody forgets to ask about.

      Submerged, the boat navigates by dead reckoning — a course, a speed, and a
      clock, drawn forward from the last position that came from a measurement.
      That line is exactly as good as its assumptions, and it knows nothing
      about the water it is drawn on. A half-knot current running for four hours
      is two miles the plot will never mention.

      So she draws the uncertainty as a circle and grows it with time, and picks
      routes that survive being wrong rather than routes that are safe if she is
      right. The bottom is her favourite instrument, because a depth sounding is
      the one thing aboard that cannot be wrong for the same reason the plot is.
    quiz:
      - q: What does Sowande mean by the age of a position?
        a: How long since the position came from a measurement
        wrong:
          - How long the chart itself has been aboard
          - How long the boat has been submerged on this patrol
          - How long the plot takes to redraw at a new speed
      - q: Why does she treat a depth sounding as her best instrument?
        a: Nothing it depends on is also feeding the plot
        wrong:
          - It is more precise than any other instrument aboard
          - It gives a position directly, without a chart
          - It works at any speed, where other instruments do not
  - id: petrov
    name: Quartermaster Anya Petrov
    role: Assistant Navigator
    division: NAV
    bio: |-
      Runs the chart table and the depth sounder, and is the person who actually
      writes the time beside a fix. Nine years, four boats, and a handwriting
      that anybody can read at two in the morning, which is not a small thing.

      Her job is the arithmetic the plot depends on: set and drift, course made
      good, speed of advance. She is the one who notices that a course steered
      and a course made good have quietly diverged, because she is the one
      comparing them.

      What she guards against is the display that looks like a measurement and
      is not. The chart overlay and the electronic repeat both draw from the
      inertial navigator, so they agree perfectly and always will. Two displays
      showing one source is not confirmation, and she will say so out loud.
    quiz:
      - q: Why is Petrov unimpressed when the chart overlay and the plot repeat agree?
        a: Both come from the same inertial navigator
        wrong:
          - The overlay updates more slowly than the repeat does
          - They use different chart datums and should not be compared
          - Agreement between displays is only meaningful at periscope depth
  - id: ferro
    name: Chief Petty Officer Dario Ferro
    role: Chief of the Boat, Damage Control
    division: DC
    bio: |-
      Runs damage control, which means he runs the drills nobody enjoys and owns
      the compartments when something goes wrong in 23 years. He
      has been in a flooded space twice and does not tell either story.

      The thing he teaches first is that water coming in through a hole under
      pressure does not care how hard you pump. Flow through a hole goes up with
      the square root of the pressure difference, and pressure goes up with
      depth, so the same hole floods faster the deeper you are. Pumping buys
      minutes; the hull fitting is what ends it.

      His second rule is that a bilge level is not a number, it is a trend. One
      reading tells you nothing. Two readings a minute apart tell you whether
      you are winning, and that is the only question a flooding casualty is
      actually asking.
    quiz:
      - q: Why does the same hole flood faster deeper?
        a: Flow rises with pressure, and pressure rises with depth
        wrong:
          - Water is denser deeper, so more of it fits through
          - The hull flexes at depth and enlarges the hole
          - Pumps lose suction at depth, which only seems like faster flooding
      - q: What is Ferro's rule about a bilge level?
        a: One reading is nothing; two a minute apart tell you
        wrong:
          - Any reading above the deck plate means abandon the compartment
          - The level matters less than the temperature of the water
          - A level that is not rising means the leak has stopped
  - id: hallam
    name: Machinist's Mate Ruth Hallam
    role: Auxiliary Division, Pumps & Patches
    division: DC
    bio: |-
      Owns the drain pump, the portable pumps and the shoring locker, and can
      put a patch on a split pipe in the dark, which she has had to prove more
      than once during drills.

      She thinks in rates rather than amounts. A pump is a number of gallons a
      minute at a stated head, and that number falls as it has to lift water
      further — so the same pump that empties a bilge on the surface struggles
      at depth against a rising level. Knowing the two rates is knowing whether
      to fight or to isolate.

      Her standing complaint is that people start pumps before they find the
      source, because starting a pump feels like doing something. It also
      empties the compartment of the evidence that would have shown where the
      water was coming in.
    quiz:
      - q: Why does Hallam object to starting a pump before finding the source?
        a: It washes away the evidence of where the water enters
        wrong:
          - Pumps cannot run while a compartment is still flooding
          - Starting a pump early floods the bilge main
          - A pump run dry will not restart later
  - id: okonkwo
    name: Chief Electrician's Mate Bede Okonkwo
    role: Electrical Division
    division: FIRE
    bio: |-
      Owns the switchboard, the breakers and every cable run on the boat, and
      has the calmest voice in an emergency of anybody aboard, which is not an
      accident — he practises it.

      His subject is that an electrical fire is not a fire problem. It has three
      legs: the fuel, which is cable insulation; the oxygen, which is the air in
      the compartment; and the ignition source, which is an energized fault that
      will keep re-lighting the fuel no matter what you spray on it. Take the
      power away and it becomes an ordinary fire. Leave it on and it is a fire
      that reflashes.

      What he refuses to accept is a lamp as proof. A switchboard indicator says
      what the switchboard believes, and a meter says what the cable is doing.
      Between those two is where people get hurt, so isolation is not isolation
      until it has been measured.
    quiz:
      - q: Why is spraying an energized electrical fire not enough?
        a: The fault keeps re-lighting the insulation
        wrong:
          - The agent cannot reach a fire behind a panel
          - Electrical fires burn hotter than the agent can absorb
          - The smoke displaces the agent before it works
      - q: What does Okonkwo mean by "isolation is not isolation until it is measured"?
        a: A lamp reports a belief, a meter reports the cable
        wrong:
          - Isolation has to be logged before it counts
          - Two people must witness a breaker being opened
          - A breaker is only isolated once the load has cooled
  - id: mbeki
    name: Electrician's Mate Sipho Mbeki
    role: Power Distribution
    division: FIRE
    bio: |-
      Traces circuits, which sounds dull until the day it is the only thing that
      matters. He keeps the dependency diagrams that say what each breaker feeds
      and, more importantly, what stops when it opens.

      Every isolation costs something downstream. Killing a bus to make a fire
      safe also kills whatever that bus was feeding — a cooling pump, a scrubber
      fan, a gyro. The decision is never whether to isolate; it is knowing what
      you are turning off at the same time and in what order to bring it back.

      Restoring is the part people rush. Loads come back in dependency order —
      cooling before the thing that needs cooling, ventilation before the space
      that needs it — and never onto a fault that has not been proved gone.
    quiz:
      - q: What does Mbeki's dependency diagram tell you that a breaker label does not?
        a: What stops working elsewhere when that breaker opens
        wrong:
          - How much current the breaker will carry before tripping
          - Which compartment the cable physically runs through
          - How long the breaker takes to reset after a trip
  - id: lindqvist
    name: Lieutenant Junior Grade Ana Lindqvist
    role: Atmosphere Control Officer
    division: ATMO
    bio: |-
      Owns the air. On a submerged boat that means the scrubbers that take
      carbon dioxide out, the generators that put oxygen in, the monitors that
      say how it is going, and the ventilation that decides which compartments
      any of it reaches.

      Her subject is a balance. People produce carbon dioxide steadily, at a
      rate that depends on how many of them are in the space and how hard they
      are working. The scrubber removes it at a rate that depends on being able
      to reach the air — which means the dampers. A compartment isolated from
      the ventilation system has no scrubber, however healthy the plant looks.

      What she insists on is the difference between a report and a measurement.
      An installed sensor is a report from a device that may itself have failed;
      a handheld reading taken in the space is a measurement. When the two
      disagree the answer is not to average them.
    quiz:
      - q: Why can a compartment's air go bad while the scrubber plant reads healthy?
        a: The scrubber only reaches compartments whose dampers are open
        wrong:
          - Scrubbers work more slowly at depth
          - Carbon dioxide is heavier than air and sinks below the sensors
          - The plant reads its own outlet, which is always the cleanest air
      - q: An installed sensor and a handheld reading disagree. What does Lindqvist do?
        a: Treats the handheld as the measurement and the sensor as a report that may have failed
        wrong:
          - Averages the two, since both are instruments
          - Believes the installed sensor, because it is calibrated more often
          - Waits for a third reading before doing anything
  - id: navarro
    name: Hospital Corpsman Elena Navarro
    role: Corpsman
    division: ATMO
    bio: |-
      The only medical person aboard, which makes her the first instrument the
      atmosphere has: people show symptoms before a monitor alarms, and she is
      the one who hears about a headache in berthing.

      She is careful about what a symptom proves. A headache and heavy breathing
      in one compartment and not another is evidence about that compartment. The
      same symptoms everywhere are evidence about the whole boat. Symptoms in
      one person and nobody else is evidence about that person, and she treats it
      that way.

      What she brings to a casualty is the consequence, stated plainly and
      without deciding the engineering: how long the crew in a space can keep
      working, who has to come out now, and what she will need if the answer
      arrives late.
    quiz:
      - q: What does Navarro conclude from symptoms in one compartment and not the others?
        a: The evidence is about that compartment, not about the whole boat
        wrong:
          - The whole boat's atmosphere is degrading and that space showed it first
          - The people in that space are more susceptible than the rest of the crew
          - The monitors in the other compartments have failed
  - id: haruki
    name: Chief Machinist's Mate Jun Haruki
    role: Engineering Watch Supervisor
    division: ENG
    bio: |-
      Runs the plant: what turns the shaft, what cools what, and what every one
      of those things gives away in noise. 18 years, most of them within
      earshot of a reduction gear.

      He thinks in dependency chains. A seawater pump cools a heat exchanger,
      which cools a lubricating oil system, which is what lets a bearing carry a
      shaft. Secure the pump to be quiet and you have started a clock on the
      bearing, and the clock is not on any gauge in the room.

      Noise is the other half of his job. Machinery that is loose, misaligned or
      cavitating tells the whole ocean about it, and the sonar room hears the
      boat's own faults before anybody in the engine room feels them. He and
      Rask compare notes more than either department expects.
    quiz:
      - q: What has Haruki started when he secures a cooling pump to be quiet?
        a: A clock on whatever that pump was cooling, which no gauge in the room shows
        wrong:
          - A drop in shaft speed that sonar will hear immediately
          - A loss of propulsion that must be reported before it happens
          - An automatic restart, once the temperature rises far enough
  - id: adeyemi
    name: Machinist's Mate Tunde Adeyemi
    role: Propulsion Plant Operator
    division: ENG
    bio: |-
      Stands the throttle watch, which is a job of small adjustments and long
      attention. He knows the boat's speed curve by feel and can tell you what a
      turn count costs in noise before the sonar room does.

      His concern is cavitation: below a certain depth-and-speed combination the
      propeller boils the water on its own blades, and the bubbles collapsing
      are the loudest thing a submarine can do. Deeper water suppresses it,
      because there is more pressure holding the bubbles shut. Faster brings it
      on. The two trade off against each other, and the trade is the decision.

      He is also the one who has to say no. An ordered speed that would make the
      boat audible is a report to the officer of the deck, not a throttle
      movement, and saying so is the job.
    quiz:
      - q: Why does going deeper let Adeyemi turn more shaft revolutions quietly?
        a: More pressure holds the bubbles shut, so the propeller cavitates less
        wrong:
          - Colder water at depth muffles the propeller
          - The hull is stiffer at depth and transmits less noise
          - Sound travels more slowly deeper, so it carries less far
  - id: vance
    name: Commander Iris Vance
    role: Commanding Officer
    division: NAV
    bio: |-
      Has the boat. Every decision in this game eventually arrives on her table
      as a choice between things that are all partly true, and she is the only
      person aboard who cannot pass it on.

      She works in a currency the departments do not: an hour spent confirming a
      contact is an hour the boat has not moved, and an hour of transit is an
      hour of exposure. What she asks for is never certainty. It is what is
      known, what is not, and which of the two is about to change.

      She is unimpressed by confidence and interested in evidence. A watch
      officer who says "probably nothing" gets asked what would have to be true
      for that to be wrong, and how expensive it would be to check.
    quiz:
      - q: What does Vance actually ask her watchstanders for?
        a: The settled facts, the open ones, and which of them moves next
        wrong:
          - A single recommendation, with the reasoning left out
          - The most cautious option available, every time
          - Certainty before the boat commits to anything
  - id: whitfield
    name: Lieutenant Commander Theo Whitfield
    role: Executive Officer
    division: DC
    bio: |-
      Runs the watch bill, the drills and the boat's time, which makes him the
      person who decides what the crew is doing while a casualty is being
      fought — and therefore what is not being watched.

      His subject is delegation. There are more jobs than people in any real
      casualty, and the mistake is not choosing wrong, it is choosing everything:
      a boat where the whole crew is fighting a fire has nobody on sonar and
      nobody on the plot, and it will hit something while it is winning.

      He keeps the casualty log, which is the record of what was known when. It
      is dull until the debrief, when it is the only thing that can tell the
      difference between a bad decision and a decision that was right with the
      information on the table.
    quiz:
      - q: What is Whitfield's objection to putting the whole crew on the casualty?
        a: Nobody is left on sonar or the plot, and the boat can hit something while winning
        wrong:
          - A large team gets in each other's way in a small compartment
          - The relief watch will be too tired to take over
          - Damage control equipment is only issued to one team at a time

# Terms the game may explain in place.
glossary:
  - name: Sonar
    aliases:
      - sonar
    def: Finding things by sound. Listening for what other people make, or sending a ping out and timing the echo.
  - name: Bearing
    aliases:
      - bearing
      - bearings
    def: The direction to something, measured as an angle. Passive sonar gives you this and little else.
  - name: Bearing rate
    aliases:
      - bearing rate
    def: How fast a contact's bearing is changing. Near zero on a closing contact is the dangerous case.
  - name: Bilge
    aliases:
      - bilge
      - bilges
    def: The lowest part of a compartment, where water collects. Its level over time is the flooding rate.
  - name: Broadband
    aliases:
      - broadband
    def: Listening across all frequencies at once. Shows a contact as a smear that persists in bearing.
  - name: Carbon dioxide
    aliases:
      - CO2
      - carbon dioxide
    def: The gas the crew breathes out. It has to be removed continuously, because in a sealed boat it only accumulates.
  - name: Cavitation
    aliases:
      - cavitation
      - cavitate
      - cavitating
    def: Bubbles forming and collapsing on a propeller blade. The loudest ordinary thing a submarine does.
  - name: Damper
    aliases:
      - damper
      - dampers
    def: A valve in a ventilation duct. Its position decides which compartments share air with the plant.
  - name: Dead reckoning
    aliases:
      - dead reckoning
    def: Advancing a position from course, speed and time. It knows what the boat did and nothing about the water.
  - name: Dependency
    aliases:
      - dependency
      - dependencies
    def: What stops working when you secure or isolate something else. The reason isolation is never free.
  - name: Direct current
    aliases:
      - DC
      - dc
    def: "The kind of electrical supply a submarine runs on from its batteries: one steady direction, unlike the alternating supply ashore."
  - name: Fix
    aliases:
      - fix
      - a fix
    def: A position from a measurement rather than a calculation. Everything after it is dead reckoning again.
  - name: Narrowband
    aliases:
      - narrowband
    def: Listening at one frequency. Machinery makes lines here, and a line can identify what is making it.
  - name: Reflash
    aliases:
      - reflash
    def: A fire re-igniting after it looked out, because the ignition source was never removed.
  - name: Scrubber
    aliases:
      - scrubber
      - scrubbers
      - co2 scrubber
    def: The plant that removes carbon dioxide from the boat's air. It reaches only where the dampers let it.
  - name: Set and drift
    aliases:
      - set and drift
      - set
      - drift
    def: The direction and speed the water is carrying the boat. Invisible to dead reckoning until measured.
  - name: Signature
    aliases:
      - signature
      - acoustic signature
    def: The sound a boat makes that identifies it. Every machine running adds to it.
  - name: The layer
    aliases:
      - the layer
      - thermocline
    def: The boundary between warm surface water and cold water below. Sound bends at it, making shadow zones.
  - name: Transducer
    aliases:
      - transducer
      - transducers
    def: The element that turns sound in the water into a voltage, or a voltage into sound. An array is many of them listening together.
  - name: Trim
    aliases:
      - trim
    def: How the boat's weight is balanced fore and aft. Water taken aboard anywhere changes it.

# What each place says when the player reads it.
# --------------------------------------------------------------- the warm-ups
warmups:
  greet:
    title: Twelve people in a steel tube, and you know none of them
    why: >-
      There is nowhere on this boat you can be alone. The people who fix the leaks and the
      people who read the gauges work an arm's length apart. Put a name to as many of them as you can now,
      before something goes wrong and you have to shout one.
  trial-near:
    title: Walk the boat from bow to stern once
    why: >-
      The boat is one line of compartments with a hatch between each pair. Walk the whole line
      once. A hatch is a small hole, and the drill you do at four in the morning is done in the
      dark by feel.
  follow:
    title: Okonjo walks the sea water line
    why: >-
      Sea water comes in at one end and goes out at the other, and it passes through six valves
      on the way. Okonjo walks the line once. Stay with her, because she stops at every valve
      you would have to shut.
  hunt:
    title: Six breathing sets, and the board finds four
    item: { name: breathing set, plural: breathing sets }
    why: >-
      Every compartment is meant to hold a breathing set, and two are not where the board says.
      A set nobody can find is a set nobody breathes from. Find them before the drill, not
      during it.
  canvass:
    title: Who heard the noise, and when
    why: >-
      Somebody heard a knocking sound on the night watch. Where it came from decides which pump
      gets taken apart. Ask along the boat until enough of the watch have told you what they
      heard.
  evade:
    title: Keep clear of the sonar watch
    why: >-
      The sonar room is listening on a narrow band, and a hatch banged in the passage outside is
      a noise in their ears. Get down the boat without going past them, and leave them to
      listen.
  tag:
    title: Catch Reyes before she goes on watch
    why: >-
      Reyes has the trim numbers from last night, and they are on paper in her pocket. Once she
      is on watch she is at the panel for six hours. The dive planned for this morning needs
      those numbers first.

copy:
  sonar_room: <p><b>Sonar Room</b> — three displays and a dark space, because the eye recovers faster than the ear does. Everything the boat knows about the world outside the hull arrives here first.</p>
  control_room: <p><b>Control Room</b> — the plot, the planes and the periscope. The boat is driven from here, and the chart table is where a position stops being a calculation and becomes a decision.</p>
  propulsion: <p><b>Propulsion Machinery</b> — what turns the shaft, and the loudest compartment aboard. Everything in this space is a trade between speed and being heard.</p>
  electrical: <p><b>Electrical Distribution</b> — the switchboard and every cable run in the boat. A fire in here is a fire with a power supply, which is a different problem from a fire.</p>
  forward_equipment: "<p><b>Forward Equipment &amp; Handling</b> — the working space at the bow, and the reason flooding is a forward problem: the sea connections for the forward systems are here, under the deck plates.</p>"
  sonar_electronics: <p><b>Sonar-Array Electronics</b> — the cabinets that turn what the array hears into something a person can read. They need cooling water, which is why a flooding casualty forward is also a sonar casualty.</p>
  radio_room: <p><b>Radio &amp; Communications</b> — where the boat would talk to anybody, which submerged it mostly does not. Coming up to transmit is a decision about exposure, not about equipment.</p>
  berthing_mess: <p><b>Berthing, Mess &amp; Medical</b> — where the crew that is not on watch is, which makes it the compartment where atmosphere problems show up as people before they show up as numbers.</p>
  machinery_control: <p><b>Machinery Control Room</b> — the plant is run from here rather than from beside it. Every gauge in this space is a report from somewhere else in the boat.</p>
  auxiliary: <p><b>Auxiliary Machinery &amp; Bilge</b> — scrubbers, oxygen generation, the drain pump and the lowest deck in the boat. Two of the three things keeping the crew alive are in this compartment.</p>

# The campaign: 1 working day each, 3 stops and a callback from day 3.
missions:
  - title: Boat Walkdown
    objective: Learn the boat as a system of spaces, not a list of names.
    briefing: |-
      You have the watch for the first time. Before anything else happens, you have to be able to find your way around this hull in the dark, and know what is in each space and how you would get out of it.
    stake: "Two hours to sailing. The fire main valve in the forward compartment is chained shut, and nobody will say who chained it. Chief Ferro wants to walk you through the boat before your first watch tonight. This watch you learn the forward spaces, and how to get from one end of the boat to the other without looking. Tonight you may have to find that valve in the dark, in smoke, by feel."
    takeaway: A compartment is defined by its boundaries, what it holds, and how you leave it.
    stops:
      - group: DC
        task: Learn a compartment in the order the facts depend on each other.
        title: What a walkdown is for
        place: Forward Equipment & Handling
        scene: Chief Petty Officer Dario Ferro walks you into the forward space and tells you to learn it. Kit down both sides. A hose reel on the wall. Two ways out.
        guide: >-
          All four of these can be done in the same minute. So this is not a timetable.
          Ask instead what each fact lets you understand. A locker of props means
          nothing until you know what this space can do to you. A hatch you have not
          tried is a guess. One of these decides whose casualty it is.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim that each step needs the
              one before it to have happened. Get one pair the wrong way round and the claim
              is wrong, even if everything else lines up. That is why there is no part
              credit.
          - >-
              Why the ends are the place to start. The first and last steps are usually the
              easiest to be sure of, because one has nothing before it and the other has
              nothing after it. Fixing those two leaves fewer ways for the middle to go, and
              the middle is where the real question usually is.
          - >-
              What the rail can be ordered on. Often it is time. It can also be cost, or
              risk, or what you can still undo afterwards — do the steps that change nothing
              before the ones that change something for good. A step that destroys the
              sample can only be last.
        assumes:
          - a submarine is split into compartments that can be sealed off from each other
        takeaway: A compartment is a sealed box first, and everything else you learn about it hangs off that.
        format: SEQUENCE
        why: "A submarine survives by being divided. The sealed boundary matters first. Ninety metres down it is what keeps a flooded compartment from becoming a flooded boat. The ways out come next, and they have to be tried rather than assumed. Then look for what could start a casualty in here: sea pipes, cables, stores. Only then does the kit mean anything. A locker is the right locker once you know what this space can do to you."
        rebuttals:
          - The boundary first. It is what makes this a space of its own, and everything else is about what happens inside it.
          - Both ways out second, and proved. A hatch nobody has tried is not a way out.
          - What could start a casualty third. You cannot judge the kit until you know the threat.
          - Whether this space can fight it, last. That is a judgement about the first three.
        cards:
          - Find where the sealed boundary runs.
          - Prove both hatches out of here still open, by trying them.
          - Find what in here could start a fire or a flood.
        order: [0, 1, 2]
      - group: ENG
        task: Match each fitting to what it is there to do.
        title: Every fitting is an argument
        place: Propulsion Machinery
        scene: Chief Machinist's Mate Jun Haruki stops at four fittings on one wall and asks what each is for. None has a label, only a number. He steps back from the valves and waits.
        guide: >-
          None of these four has a label, only a number. So work from the shape, the
          height, and what is on the far side. Ask of each one what opening it would let
          in, or let out. The result is the clue. One of them has the sea behind it,
          pushing hard.
        background:
          - >-
              Why you match instead of choosing. A response that is right for one situation
              is often nearly right for the next one. Picking from a list lets you take the
              nearly-right answer and never notice. Matching makes you say which situation
              it fits best, and that comparison is the whole point.
          - >-
              How to use the one-each rule. Every response goes somewhere, and nowhere
              twice. So the situations you are sure about are worth more than themselves:
              each one you settle leaves fewer responses for the ones you are not sure
              about. Two lines you trust can decide the other two for you.
          - >-
              Why one wrong line is impossible. If three lines are right, the fourth
              response has nowhere else to go, so it is right too. Being wrong always means
              at least two are wrong at once. If a join feels forced, the mistake is
              probably not in that join — it is in one you already made and stopped
              questioning.
        assumes:
          - water pressure rises by about one atmosphere for every ten metres of depth
        takeaway: What a fitting is for is decided by what is on the other side of it.
        format: PROTOCOL
        why: A fitting makes sense once you join its shape to what lies behind it. A wheel valve through the hull may have the sea behind it, at pressure. A manifold at head height can feed breathing air. A strapped locker can hold props and plugs. A hose reel can put water on a fire. The point is not to learn four shapes. It is to work out what a thing does from where it sits.
        columns:
          - What you are looking at
          - What it does
        rebuttals:
          - A wheel valve on a pipe through the hull is the one with the ocean behind it. Depth decides what comes through.
          - Quick-connect couplings at head height are breathing air. A supply for people, not for a machine.
          - A strapped locker with a quick-release catch holds what a crew shores and plugs with.
          - A folded hose on a reel is firefighting water, and it goes on after the circuit is proved dead.
        scenarios:
          - A wheel valve on a pipe that runs through the hull.
          - A manifold at head height with quick-connect couplings.
          - A strapped steel locker with a quick-release catch.
        choices:
          - Open it that deep and the sea comes in hard.
          - It gives people air before a space is fit to enter.
          - It holds the props and plugs this compartment fights with.
        mapping: [0, 1, 2]
      - group: NAV
        task: Learn the route, rebuild it without labels, then recover when one door is shut.
        title: The trip back without a waypoint
        place: Control Room
        scene: Lieutenant Imani Sowande, the navigator, sends you aft with a sealed note. On the way back one door will be shut and the marker lights off. You have walked it once, with labels.
        guide: >-
          First you walk the route with the labels on. Then the labels go away and you
          walk it back from memory. One door will be shut and the marker lights will be
          off. When that happens, look for the landmark in the compartment you are
          actually standing in, and use it to work out where the detour has put you. You
          are graded on the compartments you reach, not on how fast.
        background:
          - >-
              Why places beat counting. A remembered count of turns only works while nothing
              interrupts it. Miss one turn and every number after it is wrong, and you have
              no way of noticing. A remembered place is different: two helm wheels means
              Control whether you arrived by the route you planned or by a detour.
          - >-
              What a landmark is doing on the list. Each compartment on a submarine has
              something in it that is nowhere else — the wheels, the radio racks, the long
              table, the pump. Those are how the crew knows where they are in the dark, and
              they are the same thing you use when the door is shut.
          - >-
              Why the lights go out. Marker lights fail, smoke fills a passage, and power is
              lost. The route has to survive that, so the second run is the real test and
              the first one is only the lesson.
        assumes:
          - a submarine is divided into named compartments
          - a route can be remembered as a list of places
        takeaway: A route remembered as places survives an interruption. A count of turns does not.
        format: ROUTE
        question: Run the route from memory. After the shut door, use the landmark to work out where the detour has put you.
        route:
          hint: Learn the labelled route first. On the second run the labels disappear. When the berthing door is blocked, identify the compartment where the detour ends and continue from that point in the sequence.
          start: control
          goal: machinery_control
          stops:
            - id: control
              label: Control
              landmark: two helm wheels
            - id: radio
              label: Radio
              landmark: red message safe
            - id: mess
              label: Crew Mess
              landmark: fold-down tables
            - id: berthing

        title: Smoke is not only a breathing problem
        place: Auxiliary Machinery & Bilge
        scene: You cannot see half a metre. The far bulkhead is eight metres away. Head height reads sixty degrees against twenty-eight at the deck. The fire is behind a panel where nobody can see it.
        guide: >-
          All four options are true of a smoky space in some way. They differ in what
          the smoke took away. Masks fix breathing and nothing else. Thirty degrees
          between the deck and head height means the heat is in layers. So it can get
          worse up high while the floor stays cool. Nobody is going to see this fire.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - a fire inside a structure does not show you where it is
        takeaway: Smoke takes away the instrument you were using most, which is your own eyes.
        format: CHOICE
        question: What does the smoke change about how this casualty is fought?
        why: Smoke does more than make breathing hard. It takes sight away, so a team can lose the route, the boundary and each other within a few metres. Sixty degrees at head height against twenty-eight at the deck also says the heat is stacked in layers. Things can get much worse above that layer while the floor still feels survivable. Masks fix the breathing and nothing else. From here the space has to be measured rather than looked at.
        choices:
          - Nobody can read the space by eye, so measure it instead.
          - Nothing, as long as everybody is on air.
          - The fire will go out once the smoke fills the space.
          - The compartment has to be given up until the smoke clears.
        answer: Nobody can read the space by eye, so measure it instead.
        rebuttals:
          - Masks keep the team working. They do not give back the information the smoke took away.
          - A fire eating the air also makes carbon monoxide, which is worse rather than self-solving.
          - Giving up the compartment hands it to the fire, and somebody still has to read the boundaries.
      - group: SONAR
        task: Sort the night's sounds before the log goes up.
        title: Ours, or out there
        concept: "Hearing something quiet next to something loud"
        place: Sonar Room
        scene: The sounds held overnight have to be logged before the watch changes. Some of them were made by this boat. The rest came from the water outside it.
        guide: >-
          Two bins. Turn the boat and watch what happens. A sound made on the boat keeps the
          same bearing, because it turns with us. A sound from outside keeps its own bearing
          while we turn under it.
        background:
          - >-
              Why our own noise is hard. It arrives on the same array as everything else, and it can
              be louder than a real contact. What gives it away is that it does not move when we do.
          - >-
              Why the log matters. Our own noise written down as a contact is a ghost the next watch
              has to chase. A real contact written down as our own noise is a boat nobody is tracking.
        assumes:
          - a listening array hears the boat it is fitted to as well as the sea
        takeaway: A sound that turns with the boat was made by the boat.
        format: BELT
        question: Send each sound to the bin that says where it was made.
        answerText: Anything whose bearing turns with us is ours. Anything that keeps its own bearing came from outside.
        why: >-
          The array cannot tell you where a sound was made. The geometry can. A sound made on
          this boat arrives from the same direction whatever we do, so its bearing follows the
          hull round a turn. A sound made out in the water keeps its own bearing while the boat
          turns underneath it. That is why a thirty-degree course change is the standard test,
          and why it is worth the time. There is a second clue. Our own noise starts and stops
          with something the crew did: a pump cut in, a shaft order, a hatch shut. A whale or
          another ship has no reason to do anything at the same moment as our engine room.
          Getting it wrong costs both ways. A ghost in the log wastes the next watch. A real
          contact filed as our own noise is a boat nobody is watching, on a night when we are
          trying not to be heard.
        belt:
          left: { name: Made by us }
          right: { name: Made outside }
          need: 20
          lives: 3
          pass: 0.8
          hint: Turn the boat. What turns with it was made on it.
          items:
            - { name: Trim pump, bin: left }
            - { name: Shaft line, bin: left }
            - { name: Galley fan, bin: left }
            - { name: Hydraulic ram, bin: left }
            - { name: Air compressor, bin: left }
            - { name: Hull popping, bin: left }
            - { name: Loose deck plate, bin: left }
            - { name: Coolant pump, bin: left }
            - { name: Fan whine, bin: left }
            - { name: Tube drain, bin: left }
            - { name: Ballast vent, bin: left }
            - { name: Steering gear, bin: left }
            - { name: Distant merchant, bin: right }
            - { name: Whale call, bin: right }
            - { name: Shrimp crackle, bin: right }
            - { name: Trawler winch, bin: right }
            - { name: Surface swell, bin: right }
            - { name: Rain above, bin: right }
            - { name: Ice cracking, bin: right }
            - { name: Survey airgun, bin: right }
            - { name: Echo sounder, bin: right }
            - { name: Ferry propeller, bin: right }
            - { name: Cable ship, bin: right }
            - { name: Dolphin whistles, bin: right }
            - { name: Standby vessel, bin: right }
            - { name: Buoy chain, bin: right }
          commit: Start the line
  - title: Atmosphere Degradation
    objective: Tell a failing sensor from failing air, and find where the air stopped moving.
    briefing: |-
      Two of the crew in berthing have headaches. The atmosphere plant says everything is normal. Both of those statements can be true at once, and working out how is the whole of this watch.
    stake: "Eighth day. The scrubber is running and its outlet reads clean. Elena Navarro, the corpsman, has been round berthing with a handheld meter, and it reads far higher than the sensor on that bulkhead. Nine people are asleep in there. This watch you decide whether it is the air or the instrument that is wrong, and how long that space is safe. The crew notice this one before the instruments do."
    takeaway: A plant reading is a report about the plant, not about the compartment you are standing in.
    stops:
      - group: ATMO
        task: Say which explanation accounts for every reading.
        title: The compartment the scrubber cannot reach
        place: Auxiliary Machinery & Bilge
        scene: The scrubber is running and its outlet reads clean. A handheld meter in berthing reads far higher than the sensor fitted there. Control and machinery read normal on handhelds.
        guide: >-
          Four readings have to be explained at once. A clean outlet. A high handheld in
          berthing. A low fitted sensor there. Normal handhelds everywhere else. Ask of
          each option how many of the four it covers. One fault does not have to explain
          everything when the evidence points to two. A scrubber can only clean air that
          reaches it.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - a machine can only clean the air that reaches it
        takeaway: Which compartments a plant is really treating is decided by where the air goes.
        format: CHOICE
        question: Which explanation accounts for every reading here?
        why: A scrubber can only clean air that reaches it. Shut one damper and a compartment drops out of the loop while the plant's own outlet still reads clean. Here the handheld in berthing agrees with how the people in there feel, and handhelds elsewhere read normal. So the problem is in one space. The sensor fitted in that space disagrees with both, which makes it a second fault. Two faults at once is allowed. The evidence decides, not tidiness.
        rebuttals:
          - Control and machinery read normal on their own handhelds, so this is not boat-wide.
          - The scrubber's own outlet reads clean, which says the plant is doing its job.
          - The shut damper and the symptoms in berthing both point at something real in that space.
          - One space going bad while two instruments disagree is not ordinary noise.
        headline: Berthing reads high on a handheld and normal on its own sensor, and the plant says it is fine.
        readings:
          - zone: Plant
            label: Scrubber outlet CO₂
            value: 0.4 %
            status: normal
          - zone: Berthing
            label: Handheld CO₂
            value: 2.1 %
            status: alarm
          - zone: Berthing
            label: Installed sensor
            value: 0.5 %
            status: alarm
          - zone: Berthing
            label: Supply damper
            value: shut
            status: alarm
          - zone: Control
            label: Handheld CO₂
            value: 0.5 %
            status: normal
          - zone: Crew
            label: Symptoms
            value: berthing only
            status: high
        choices:
          - label: Berthing is shut out of the air loop, and misreading.
            mechanism: A shut damper cuts the space out of the loop, and a bad fitted sensor hides the rise.
          - label: The whole boat's air is going bad.
            mechanism: A boat-wide failure would lift the readings in several compartments at once.
          - label: The scrubber has stopped taking carbon dioxide out.
            mechanism: A failed scrubber would show at its own outlet, and everywhere else too.
          - label: The handheld meter is reading high by mistake.
            mechanism: A bad handheld would not explain the shut damper or how people in there feel.
          - label: Ordinary background, nothing more.
            mechanism: Air going bad in one space, with two instruments disagreeing, is not background.
        answer: Berthing is shut out of the air loop, and misreading.
      - group: ATMO
        task: Turn the rate the air is going bad into a deadline.
        title: Nine people and a shut damper
        concept: Air is a mixture, and the share of each gas matters
        place: Berthing, Mess & Medical
        scene: Nine people sleep in a space with the damper shut. The corpsman, Elena Navarro, wants to know how long that air has left.
        guide: >-
          Five numbers, and two of them have already been used. The room size and the
          limit were used to work out how many litres you can allow. Ask which numbers
          the rate needs. Nine people breathing out is not the same as one. A deadline
          in hours is something the boat can plan around. Soon is not.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - a person breathes out carbon dioxide steadily, hour after hour
        takeaway: A rate turns a limit into a deadline.
        format: BALLPARK
        question: How long until the carbon dioxide in there rises by one per cent?
        answerText: About 1.9 hours for a one-percentage-point rise under the stated assumptions.
        why: Anything arriving at a steady rate piles up in step with time. One per cent of that space is three hundred and sixty litres of carbon dioxide. Nine people put out about one hundred and eighty litres between them every hour. Three hundred and sixty divided by one hundred and eighty is two hours. It is a rough number, and it does what the word stuffy cannot. It gives the corpsman a time to work against.
        estimate:
          relationship: Time = the amount you can allow ÷ the rate it arrives at.
          prompt: One per cent of the air in that space is three hundred and sixty litres. Each person breathes out about twenty litres of carbon dioxide an hour, and there are nine of them.
          question: How long until the carbon dioxide in there rises by one per cent?
          labels:
            - 360 litres (one per cent of the air in there)
            - 20 litres an hour (what one person breathes out)
            - 9 (people)
            - 36 (cubic metres of air in the space)
            - 1 (the limit, in per cent)
          values: [360, 20, 9, 36, 1]
          slots: 3
          template: "{0} ÷ ({1} × {2})"
          formula: a/(b*c)
          correct: [0, 1, 2]
          target: 2
          tolerance: 0.3
          units: hours
          solution: Three hundred and sixty ÷ (twenty × nine) is two hours.
          explanation: The rate is nine people together, not one. Divide by one person's rate and the answer comes out nine times too long, which is a deadline nobody could use.
      - group: ENG
        task: Say what one shared fan means for the air plan.
        title: What one fan takes with it
        place: Machinery Room
        scene: The drawing shows one fan feeding the scrubber and the after spaces through the same trunk. The watch bill lists them as two systems, and the air plan counts on both.
        guide: >-
          All four options treat one fan as a real limit. They differ in what they do
          about it. Ask of each whether it adds another way to get the air. Running the
          scrubber harder does not add a path. Sealing the after spaces removes a need
          instead. Two lines on a watch bill are not two systems.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - a system is only as separate as the parts it does not share
        takeaway: Two systems sharing one part are one system as soon as that part fails.
        format: CHOICE
        question: One fan feeds the scrubber and the after spaces. What does that mean for the plan?
        why: One fan can do two jobs and still be one failure. If the scrubber and the after spaces share that fan and that trunk, losing it takes both away at once. Writing them in two boxes on the watch bill does not make them separate. Separate means a different fan, a different supply, or a different route. Until one of those exists, the air plan has a single failure that reaches several spaces.
        choices:
          - One fan is a single point of failure. Name a fallback.
          - Nothing. Two systems on one reliable fan is normal.
          - Run the scrubber harder, so a fan failure leaves more room.
          - Seal off the after spaces, since they are downstream.
        answer: One fan is a single point of failure. Name a fallback.
        rebuttals:
          - Reliable is not separate. A reliable shared part still takes both systems with it when it does go.
          - Running the scrubber harder uses more of the same air path, and shortens the time you have.
          - Sealing the after spaces removes them from the plan instead of protecting them, and people sleep there.
      - group: ENG
        task: Hold the depth while the boat changes weight.
        title: Sixty metres, while the boat works
        concept: "Adding weight changes what floats, and how fast it changes"
        place: Engine Room
        scene: The boat has to hold sixty metres while the galley pumps out, the tubes are flooded for a drill, and the water outside gets colder. The trim pump answers all of it.
        guide: >-
          Hold the depth inside the band on the gauge. The band gets narrower later, because
          the boat is quieter and the sonar picture is better when it is not wandering. Each
          change in weight keeps pushing until you set the pump to match it.
        background:
          - >-
              Why the boat drifts. A submarine at depth is balanced. Its weight matches the weight of
              the water it pushes aside. Pump a tonne over the side and the boat is a tonne light, so
              it rises.
          - >-
              Why the sea moves you too. Colder water is heavier for the same volume, so the same
              boat floats up in it. Nothing about the boat changed, and the gauge looks the same.
        assumes:
          - a submarine is balanced between its weight and the water it pushes aside
        takeaway: A boat that has changed weight keeps moving until somebody answers it.
        format: HOLD
        question: Hold sixty metres while the boat and the water both change.
        answerText: Inside the band for most of the passage, with the trim pump set to answer each change rather than tapped after the depth has already moved.
        why: >-
          A submarine at depth is balanced between what it weighs and the weight of water it
          pushes aside. Everything in this passage upsets one side of that balance. Pumping the
          galley over the side makes the boat lighter, so it rises and keeps rising. Flooding
          the tubes makes it heavier, so it sinks and keeps sinking. Crossing onto the shelf
          changes neither: the water gets heavier for its size, the boat pushes aside more
          weight than before, and it floats up exactly as if somebody had pumped. All three
          keep going until the trim pump is set to match, which is why it is set and left
          rather than tapped. The band gets narrower under the layer because a boat holding
          depth is a quiet boat, and a quiet boat is the whole point of being there.
        hold:
          quantity: Depth away from ordered depth
          unit: m
          control: Trim pump
          hold: 60
          band: 0.4
          narrowTo: 0.2
          duration: 45
          direction: lower
          authority: 0.1
          pass: 0.8
          hint: Each change in weight keeps pushing. Set the pump to match it.
          disturbances:
            - { label: Galley pumps out, at: 4, amount: -0.03 }
            - { label: Tubes flooded for a drill, at: 20, amount: 0.05 }
            - { label: Colder water over the shelf, at: 38, amount: -0.045 }
          commit: Report the passage
  - title: Compound Casualty
    objective: Prioritise and delegate when there are more casualties than there are people.
    briefing: |-
      Flooding forward, a partial power loss, a degraded plot and one injured crewman, all inside four minutes. There are not enough people to do everything, so the first decision is which things do not get done yet.
    stake: "Ninth day, and four things at once. Water forward. A bus lost aft. The plot gone soft with the power. And Tunde Adeyemi, who runs the propulsion plant, in the passage with a broken wrist. Vance wants to hold the ordered speed. Theo Whitfield says a boat with four casualties at eight knots, nine miles off a bank, is about to have five. This watch you decide what you keep, what you hand over, and whether the boat slows."
    takeaway: Command is deciding what you do, and who does the rest.
    stops:
      - group: DC
        task: Decide which one gets the first team.
        title: Four casualties, one crew
        place: Forward Equipment & Handling
        scene: Four reports hit control almost together. Water forward. A bus lost aft. The plot gone soft. A crewman down with a broken wrist. Every team leader is waiting for the first move.
        guide: >-
          All four are real and all four need somebody. What separates them is how fast
          each one changes while you deal with the rest. Ask of each whether it grows on
          its own. Ask whether waiting makes it permanent. A broken wrist hurts and does
          not spread. The boat is still heading for shallow water, and that clock is not
          the fastest one here.
        background:
          - >-
              Why first is a different question from best. When there is more than one call
              on the same hour, the value of doing something now is not how much it matters.
              It is how much is lost by doing it later. Something important that will be
              just as fixable in an hour can wait. Something small that will not be fixable
              can not.
          - >-
              What to look for in the options. Ask which one changes if you wait — a reading
              that is still moving, a person who is getting worse, a window that closes.
              Then ask which ones can only be done after something else. Those two questions
              usually leave one option standing.
          - >-
              Why only one answer is marked. Real shifts do all of these, in some order. The
              stop asks for the front of that order because that is the only part where the
              reasoning shows. Read the verdict afterwards even when you are right — it says
              what the others were waiting on, which is the rest of the answer.
        assumes:
          - some problems get worse on their own, and some do not
        takeaway: Order casualties by how fast they get worse, not by how loud they are.
        format: TRIAGE
        question: What gets the first team?
        why: Triage sorts by speed, and by what cannot be undone. It does not sort by what sounds worst. Water coming in takes away the thing holding the boat up, and it spreads into new spaces. A lost bus has already done its damage. A soft plot gets worse with every mile toward shallow water, and slowing down freezes it. A broken wrist hurts and stays the same size for an hour. The first team goes where waiting costs the most.
        rebuttals:
          - The injured man matters and he is stable. A broken wrist is treated and cleared, and it is not growing while you decide.
          - The bus is already lost. Everything downstream of it failed minutes ago, and none of it gets worse while the team goes forward.
          - The plot does get worse every minute, and slowing the boat freezes it. That is a decision, not a team.
        choices:
          - The flooding, because it is the only one getting worse by itself.
          - The injured crewman, because a person comes before equipment.
          - The lost bus, because everything else runs on power.
          - The plot, because the boat is still heading for a bank.
        answer: The flooding, because it is the only one getting worse by itself.
      - group: FIRE
        task: Keep the one thing that cannot wait, and hand over the rest with an owner, a first move and a number.
        title: Who does the things you are not doing
        place: Electrical Distribution
        scene: "The flooding is losing now: the pump moves sixty litres a minute against forty coming in. A fire boundary aft is heating. The air is steady, and a crewman has a broken wrist."
        guide: >-
          Three problems, and you keep one. For each of the others, pick somebody who
          can take a real first action, and say what reading or event brings it back to
          you. An owner with no first action will come back for orders at the worst
          moment. Then take the watch on the one that needs your own judgement.
        background:
          - >-
              Which one to keep. The flooding is already winning: the pump moves sixty
              litres a minute against forty coming in. The fire boundary aft is getting
              hotter, so it is the one changing for the worse. The broken wrist hurts and is
              not getting worse. Keeping the easy job is the mistake, because it is the one
              that finishes and the other two are the ones that move.
          - >-
              What a first action is. Not "keep an eye on it". Something the owner can do
              without asking you: log the bilge level every five minutes, take a hand-held
              reading at the boundary, put a splint on. A handover made of instructions to
              think is not a handover.
          - >-
              Why every handover needs a way back. You are not giving the problem away — you
              are lending it. Saying what number brings it back means the owner can hold it
              without checking in, and you find out at the moment it matters rather than at
              the end.
        assumes:
          - how fast a problem is changing matters as much as how big it is
          - a real handover names an owner, a first move and when to report back
        takeaway: A handover is finished when somebody knows what to do first and when to come back.
        format: DELEGATE
        question: Which problem do you keep, and what does each of the others get?
        delegate:
          hint: Take one problem yourself. For every other problem choose an owner, a first action, and the reading or event that must bring it back to you.
          problems:
            - id: boundary
              label: Aft fire boundary
              rate: 6
              unit: °C/min
              value: 54
              trend: rising
              irreversible: true
              consequence: Cable insulation fails at 80 °C.
              delegable: false
            - id: flood
              label: Forward flooding
              rate: -20
              unit: L/min net
              value: 22
              trend: falling
              irreversible: false
              consequence: Report if level starts rising again.
              delegable: true
            - id: atmo
              label: Atmosphere
              rate: 0.01
              unit: "% CO₂/h"
              value: 0.7
              trend: stable
              irreversible: false
              consequence: Report at 0.9% CO₂ or if symptoms appear.
              delegable: true
            - id: wrist
              label: Fractured wrist
              rate: 0
              unit: change/min
              value: 0
              trend: stable
              irreversible: false
              consequence: Treat and clear the damage-control route.
              loud: true
              delegable: true
          firstActions:
            - id: log_bilge
              label: Log bilge level every 5 minutes
            - id: handheld_co2
              label: Take an independent handheld CO₂ reading
            - id: splint_clear
              label: Splint the wrist and clear the passage
          correctAssignments:
            - problem: flood
              person: dc_watch
              firstAction: log_bilge
              returnCondition:
                metric: net bilge rate
                operator: ">"
                value: 0
                unit: L/min
            - problem: atmo

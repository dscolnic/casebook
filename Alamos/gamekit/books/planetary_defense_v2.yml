    # trade the payload wrote. Funding the four lines the three required
    # questions need costs exactly 85, leaving 15 against a reserve that the
    # optional expansion question needs 30 of: the payload's 25/25/20/15/15 to
    # the point, including its reserve of 15.
    allocate:
      pool: { amount: 100, unit: points, mode: scalar }
      items:
      - { id: transport, label: Mobility transport, cost: 25 }
      - { id: shelters, label: Shelters, cost: 25 }
      - { id: hospitals, label: Hospitals, cost: 20 }
      - { id: communications, label: Communications, cost: 15 }
      - { id: reserve, label: Protected reserve, cost: 30 }
      answers:
      - { question: "Can mobility-limited residents clear the fragment zone?", requires: [transport], required: true }
      - { question: "Can shelters and hospitals serve the corridor?", requires: [shelters, hospitals], required: true }
      - { question: "Can multilingual alerts reach the corridor?", requires: [communications], required: true }
      - { question: "Can services expand outside both hazard zones now?", requires: [reserve] }
      commit: Commit the allocation
    answerText: "The fragment corridor receives protection while the primary remains monitored."
    why: "ALLOCATE converts decision into constrained, equitable execution."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Spending the reserve makes the system brittle.
    # correct result: Meet all minimums, retain reserve, preserve coastal monitoring.
    # state/output: All campaign bars reach 100%; closing sequence begins.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   allocate:
    #     pool: {label: Final response capacity, value: 100, unit: points}
    #     items:
    #       - {id: transport, label: Mobility transport, cost_per_unit: 1, min: 10, max: 40, step: 5, unit: points}
    #       - {id: shelters, label: Shelters, cost_per_unit: 1, min: 10, max: 40, step: 5, unit: points}
    #       - {id: hospitals, label: Hospitals, cost_per_unit: 1, min: 10, max: 40, step: 5, unit: points}
    #       - {id: communications, label: Communications, cost_per_unit: 1, min: 10, max: 40, step: 5, unit: points}
    #       - {id: reserve, label: Protected reserve, cost_per_unit: 1, min: 10, max: 40, step: 5, unit: points}
    #     questions:
    #       - {id: clear_zone, label: "Can mobility-limited residents clear the fragment zone?", required: true, needs: {transport: 25}}
    #       - {id: protect_care, label: "Can shelters and hospitals serve the corridor?", required: true, needs: {shelters: 25, hospitals: 20}}
    #       - {id: reach_public, label: "Can multilingual alerts reach the corridor?", required: true, needs: {communications: 15}}
    #       - {id: expand_elsewhere, label: "Can services expand outside both hazard zones now?", required: false, needs: {reserve: 30}}

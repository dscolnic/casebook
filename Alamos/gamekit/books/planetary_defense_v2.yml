    # On arrival at Coordination Office | automatic | 
    on: { enter: true, at: OPS }
    world: "Lena Ortiz, survey and discovery lead, drags a satellite trail away from the candidate and says, \"Show me the pixels before anyone shows me a probability.\" Timer pauses; Continue unlocks Stop 1."
    panel: "THE MOVING POINT / MISSION ACTIVE"
    # unlocks: Stop 1.
    bubbles:
    - who: ortiz   # Lena Ortiz
      say: "The mission is live. Start with the first evidence, and do not add a claim the board has not earned."
  - id: after-stop-1
    # After Stop 1 | automatic | 
    on: { after: [1] }
    world: "The scopeboard labels four frames CONSISTENT MOTION and one frame CONTAMINATED, NOT DISCARDED."
    panel: "THE MOVING POINT / FIRST RESULT LOGGED"
    # unlocks: Stop 2.
    bubbles:
    - who: ortiz   # Lena Ortiz
      say: "Nice work. That result is now part of the record. Use it in the next test."
  - id: after-stop-2
    # After Stop 2 | automatic | 
    on: { after: [2] }
    world: "The pipeline path lights from calibrated image to linked tracklet; the plate archive drawer opens."
    panel: "THE MOVING POINT / EVIDENCE HANDOFF READY"
    # unlocks: Stop 3.
    bubbles:
    - who: ortiz   # Lena Ortiz
      say: "Good thinking. The handoff is ready. Follow the newly unlocked evidence."
  - id: after-stop-3
    # After Stop 3 | automatic | 
    on: { after: [3] }
    world: "The detector map marks the hot pixel elsewhere; the 0.7 s timestamp offset receives a yellow CHECK tag."
    panel: "THE MOVING POINT / DECISION EVIDENCE READY"
    # unlocks: Stop 4.
    bubbles:
    - who: ortiz   # Lena Ortiz
      say: "Exactly right. The decision evidence is complete. Make the narrowest claim that fits it."
  - id: at-mission-end
    # At mission end | automatic | 
    on: { missionEnd: true }
    world: "Mira Chen, International NEO Response Director, moves the alert from AUTOMATED to HUMAN-VERIFIED and opens the Orbit Determination call."
    panel: "THE MOVING POINT / MISSION DECISION LOGGED"
    # unlocks: Mission 1 outcome, metric screen, concept review, and Mission 2 briefing.
    bubbles:
    - who: ortiz   # Lena Ortiz
      say: "Outstanding work. You solved the mission. The decision is logged. Carry this result into the next shift."


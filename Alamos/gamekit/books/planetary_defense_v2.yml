    # ---- THE MODEL CONVERSION, and the one piece of real work in this stop.
    #
    # The payload's board is a CONTINUOUS SPLIT: 100 points divided across five
    # lines, each with a min, max and step, correct at 25/25/20/15/15. This
    # engine's ALLOCATE is a SUBSET CHOSEN UNDER A BUDGET: each item costs one

theme:
  id: planetary_defense
  title: Planetary Defense
  subtitle: Campaign Director · International NEO Response

# The areas of study. One column of the game each; every group needs somebody on the roster.
groups:
  - id: TOWN
    code: TOWN
    name: Emergency Management Office
    color: '#6b7f8a'
    desc: "Where the campaign's emergency management office work is done."
    milestones: [Open the room, Read what it holds, Settle the question, Hand it on]
  - id: DISC
    code: DISC
    name: Discovery & Imaging
    color: "#315c78"
    desc: Images, signal-to-noise, moving-object detection, and artifact rejection.
    defaultLeader: nguyen
    milestones:
      - Validate the detection
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: ORBIT
    code: ORBIT
    name: Astrometry & Orbit
    color: "#704f88"
    desc: Sky position, timing, orbit fitting, covariance, and impact probability.
    defaultLeader: rossi
    milestones:
      - Constrain the orbit
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: CHAR
    code: CHAR
    name: Physical Characterization
    color: "#4b775f"
    desc: Brightness, albedo, spectra, rotation, size, and composition.
    defaultLeader: adebayo
    milestones:
      - Measure the body
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: RADAR
    code: RADAR
    name: Radar & Dynamics
    color: "#9a741d"
    desc: Range, delay, velocity, momentum transfer, and independent orbit constraints.
    defaultLeader: fischer
    milestones:
      - Add geometric leverage
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: IMPACT
    code: IMPACT
    name: Entry & Consequences
    color: "#9a3f36"
    desc: Energy, atmospheric entry, fragmentation, consequence uncertainty, and deflection physics.
    defaultLeader: banerjee
    milestones:
      - Bound the consequence
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: OPS
    code: OPS
    name: Survey & Response
    color: "#3d6f52"
    desc: Completeness, observing geometry, response decisions, communication, and long-term readiness.
    defaultLeader: garcia
    milestones:
      - Turn evidence into action
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off

# The cast. `division` is what makes a person a valid person stop.
roster:
- id: chen
  name: "Mira Chen"
  role: "International NEO Response Director"
  division: OPS
  pronouns: "she/her"
  bio: |
    Mira Chen is International NEO Response Director. Wants one defensible action before politics outruns evidence. Can sound cold when she protects uncertainty. Says, "What would change the decision?"
- id: ortiz
  name: "Lena Ortiz"
  role: "Survey and discovery lead"
  division: DISC
  pronouns: "she/her"
  bio: |
    Lena Ortiz is Survey and discovery lead. Wants keep optical recovery continuous. Trusts her pipeline after years of tuning it. Says, "Show me the pixels."
- id: rowan
  name: "Malik Rowan"
  role: "Orbit-determination lead"
  division: ORBIT
  pronouns: "he/him"
  bio: |
    Malik Rowan is Orbit-determination lead. Wants wait for a mathematically stable solution. Treats modeled covariance as complete until systematics are proved. Says, "Where is the uncertainty?"
- id: vale
  name: "Sanaa Vale"
  role: "Physical-characterization lead"
  division: CHAR
  pronouns: "she/her"
  bio: |
    Sanaa Vale is Physical-characterization lead. Wants measure size, spin, and material before anyone acts. Prefers completeness when time forces decisions. Says, "What else could make that signal?"
- id: ibarra
  name: "Tomás Ibarra"
  role: "Planetary-radar director"
  division: RADAR
  pronouns: "he/him"
  bio: |
    Tomás Ibarra is Planetary-radar director. Wants use radar geometry to collapse the orbit. Assumes a clean main echo deserves priority over weak structure. Says, "Range first; story second."
- id: park
  name: "Evelyn Park"
  role: "Entry-and-consequences lead"
  division: IMPACT
  pronouns: "she/her"
  bio: |
    Evelyn Park is Entry-and-consequences lead. Wants protect people before certainty arrives. Frames decisions around worst credible harm. Says, "Who is under the corridor?"
- id: hale
  name: "Jordan Hale"
  role: "TOWN division emergency manager for Valle Seco"
  division: TOWN
  pronouns: "they/them"
  bio: |
    Jordan Hale is division emergency manager for Valle Seco. Wants give counties one clear plan they can execute. Fears that changing guidance will destroy trust. Says, "Tell me what happens at each line."
- id: sen
  name: "Arjun Sen"
  role: "Space-intervention and operations lead"
  division: IMPACT
  pronouns: "he/him"
  bio: |
    Arjun Sen is Space-intervention and operations lead. Wants use the dormant Aegis demonstrator if any credible intercept exists. Momentum hardware makes action feel more valuable than observation. Says, "How much miss distance do we buy?"

glossary:
  - name: Albedo
    aliases:
      - albedo
    def: The fraction of incident light a surface reflects.
  - name: Astrometry
    aliases:
      - astrometry
    def: Measurement of an object position on the sky.
  - name: Astronomical unit
    aliases:
      - AU
      - astronomical unit
    def: The average Earth–Sun distance, about 150 million kilometres. Orbit sizes are quoted in it.
  - name: Calibration
    aliases:
      - calibrate
      - calibrated
      - calibration
    def: The correction between what an instrument reads and what is true, established against something known.
  - name: Covariance
    aliases:
      - covariance
    def: A description of how uncertainties in fitted quantities vary together.
  - name: Ephemeris
    aliases:
      - ephemeris
      - ephemerides
    def: A table of where an object will be, night by night, computed from its orbit. Its uncertainty is what a telescope has to search.
  - name: Light curve
    aliases:
      - light curve
    def: Brightness measured as a function of time.
  - name: Parallax
    aliases:
      - parallax
    def: The apparent shift of an object against the background stars when the observer moves. With a known baseline it gives a distance by triangle.
  - name: Polarimetry
    aliases:
      - polarimetry
      - polarimetric
    def: Measuring how light is polarised after reflection, which constrains what a surface is made of and how rough it is.
  - name: Radar delay
    aliases:
      - radar delay
    def: Round-trip travel time of a radar signal, used to infer range.
  - name: Solar elongation
    aliases:
      - solar elongation
    def: The angular separation between an object and the Sun as seen from the observer.


  - group: DISC
    at: dome-console
    title: "Find the usable exposure"
    concept: 2   # exposure and magnitude
    reason: "The localized recovery failure makes exposure selection a balance between asteroid detection and usable reference stars."
    scene: "With the weak detector region located, sweep exposure time from 10 to 90 seconds and watch asteroid signal and star saturation together. Choose the shortest setting that reaches the signal goal without crossing the saturation limit."
    motivation: "The signal and saturation readings determine the shortest exposure that preserves both asteroid visibility and the astrometric reference grid."
    format: SWEEP
    question: "Operate the sweep, then submit one exposure setting in seconds: the shortest value with asteroid S/N ≥ 5 and no more than one saturated reference star."
    # Converted from the payload's `sweep`. The payload's `control.values` become
    # the axis and the `at` of every response point; its two `readings` rows
    # become the two series, which is what `mode: boundary` is for — signal and
    # saturation are costs that trade against each other across one handle.
    # `tolerance` is half the gap from the keyed 45 s to the nearest setting the
    # payload authored on either side (30 s and 60 s), so 45 is the only authored
    # setting the band accepts. The handle starts at the bottom of the axis.
    sweep:
      mode: boundary
      axis: { label: exposure time, unit: s, min: 10, max: 90, step: 1 }
      readout: { label: asteroid signal-to-noise }
      series:
      - label: asteroid signal-to-noise
        response:
        - { at: 10, value: 2.1 }
        - { at: 20, value: 3.4 }
        - { at: 30, value: 4.7 }
        - { at: 45, value: 6.1 }
        - { at: 60, value: 7.0 }
        - { at: 90, value: 8.1 }
      - label: saturated reference stars
        unit: stars
        response:
        - { at: 10, value: 0 }
        - { at: 20, value: 0 }
        - { at: 30, value: 0 }
        - { at: 45, value: 1 }
        - { at: 60, value: 5 }
        - { at: 90, value: 14 }
      target: 45
      tolerance: 7.5
      start: 10
      commit: Lock the exposure
    answerText: "A 45-second exposure gives usable asteroid signal without destroying the reference grid."
    why: "Longer exposure improves signal but eventually saturates bright stars needed for astrometry."
    # wrong-path feedback, one rebuttal per wrong option:

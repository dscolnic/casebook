    title: "Read the separated cloud"
    concept: 11   # primary corridor
    reason: "The corrected fit changes geographic exposure, so the existing land alert needs reassessment."
    scene: "Read the cloud against the precommitted stand-down and continued-monitoring thresholds."
    motivation: "The land-intersection result determines whether evacuation can stand down while ocean and coastal monitoring continue."
    format: CHOICE
    question: "Submit the 96% impact value, the land-intersection result, and one response conclusion: LAND STAND-DOWN or LAND EVACUATION."
    answerText: "The hazard remains, but exposure changed."
    why: "CLOUD maps the ensemble to an action threshold."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Ocean impact is neither total all-clear nor land-evacuation trigger.
    # correct result: Stand down land evacuation and retain ocean/coastal monitoring.
    # state/output: LAND CORRIDOR EXCLUDED pending holdout.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   cloud:

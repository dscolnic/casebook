    person: rowan
    concept: 11   # robust conclusion
    reason: "The leading-case result needs testing against alternative error assumptions before preparations intensify."
    scene: "Malik reruns the fit with conservative optical errors, doubled radar errors, and each observatory removed once. Probabilities range from 55 to 69 percent, so test which proposed planning statement survives every run."

    - {"title":"Radar round-trip time","problem":"A radar echo returns after 2 s. Use c=300000 km/s. Find target distance.","rule":"Range=c×round-trip delay/2.","steps":["Set up the relationship: Range=c×round-trip delay/2.","R=300000(2)/2=300000 km."],"answer":"The target is 300000 km away.","mistake":"The measured delay includes travel out and back."}
    - {"title":"Explain a repeating model mismatch","problem":"A spherical rotating-body model misses a repeated two-part brightness pattern also seen in an independent imaging measurement. What is a useful next model test?","rule":"Independent observations of the same pattern can motivate a more detailed shape model.","steps":["A two-part shape could predict a pattern the sphere cannot represent.","Fit it on existing data, then test its prediction on withheld observations."],"answer":"Test the more detailed model; the pattern alone is not proof that it is correct.","mistake":"Adding complexity must earn predictive improvement, not just a better description of old data."}
    - {"title":"Count independent evidence sources","problem":"Three reports copy one balance reading. A fourth report uses a separately calibrated balance. How many measurement sources are there?","rule":"Reports are not independent measurements when they copy a common source.","steps":["source group 1 = the first balance and its three copies. Count that measurement once.","source group 2 = the second balance. It adds a separate measurement route."],"answer":"There are two measurement sources, not four.","mistake":"Agreement among copies cannot establish independent confirmation."}
    - {"title":"Separate detector and sky motion","problem":"Across images with a shifted camera pointing, a bright spot stays at the same detector pixel while the stars move. What does that suggest?","rule":"A detector defect stays tied to detector coordinates; a sky source follows the sky-to-detector mapping.","steps":["Changing pointing moves real sky positions across pixels.","The stationary detector spot does not follow that mapping."],"answer":"The pattern supports a detector artifact as a candidate explanation.","mistake":"This diagnostic needs the stated pointing change; one image alone is insufficient."}


# Sightline — the Hallam Conviction Integrity Unit, and 15 working days to
# report on State v. Elias Ward.
#
# Written to gamekit/tools/BOOK_TEMPLATE.md. The place is themes/sightline/plan.js;
# the arc it follows is in ../GAME_IDEAS.md under "Sightline".
#
# The argument: Baptiste holds that the procedure is already unrecoverable and
# that every month spent proving it again is a month of somebody's sentence.
# Okada holds that the only uncontaminated account of that night is a perishable
# thing, and that asking Cardoza again is not free. Baptiste is right on day 4.
# Okada is right on day 12.
#
# The timeline the cards are checked against:
#   14 Nov 2019, 21:40   the robbery at Ferrier Street and Wickham Row
#   2–21 Nov 2019        column 4471 out — the utility's own ticket
#   18 Nov 2019          Cardoza's first full interview, 4 days after
#   19 Nov 2019          the Hallam Register prints a photograph of Ward
#   4 Dec 2019           the six-photograph array, administered by Loomis
#   26 Dec 2019          the "absolutely certain" statement, 3 weeks after
#   June 2020            conviction; 14 years, of which 7 are served
#   now                  15 working days to the review board

theme:
  id: sightline_ms
  title: Sightline
  subtitle: Review Analyst · Conviction Integrity Unit

groups:
  - id: PERCEPT
    code: PERCEPT
    name: Perception & the Scene
    color: '#2f6f9f'
    desc: What an eye can take from a place, at that distance and in that light.
    defaultLeader: frey
    milestones: [Measure the place, Light it as it was, Find the limit, Ready to hand over]
  - id: MEMORY
    code: MEMORY
    name: Memory & Interview
    color: '#7a4fa3'
    desc: What happens to an account between the night and the question.
    defaultLeader: okada
    milestones: [Date the account, Find what arrived later, Separate the sources, Ready to hand over]
  - id: IDENT
    code: IDENT
    name: Identification Procedure
    color: '#b3462f'
    desc: How the six were chosen, who stood behind the witness, and what was said after.
    defaultLeader: ilori
    milestones: [Rebuild the array, Test it on strangers, Date the certainty, Ready to hand over]
  - id: BRAIN
    code: BRAIN
    name: Stress, Sleep & the Body
    color: '#1f7a6b'
    desc: What arousal and exhaustion do to what gets in and what comes out.
    defaultLeader: raghunathan
    milestones: [Read the physiology, Reconstruct the hours, Weigh the state, Ready to hand over]
  - id: SOCIAL
    code: SOCIAL
    name: Influence & the Room
    color: '#b0762a'
    desc: What other people do to an account, a decision and a report.
    defaultLeader: baptiste
    milestones: [Find the influence, Name who was present, Test the room, Ready to hand over]
  - id: MEASURE
    code: MEASURE
    name: Testing & Records
    color: '#5b6a72'
    desc: What a number about a person is entitled to claim, and what the file says instead.
    defaultLeader: weill
    milestones: [Read the record, Check the instrument, State the strength, Ready to hand over]

roster:
  - id: baptiste
    name: Ines Baptiste
    role: Unit Director
    division: SOCIAL
    bio: |
      Ran a public defender's office for eleven years before the unit existed,
      and took this job because the cases she lost were not lost on the facts.
      She reads a file for the procedure first and the story second.

      Her argument with the psychologists is the same one every week. A
      procedure that cannot support a conviction has already failed, and the
      months spent proving it a second way are months a man serves. She is not
      arguing that Ward is innocent. She is arguing that nobody can say.

      Her limit is that a review board is not a jury and will not be hurried.
      A recommendation it does not believe is a recommendation it declines, and
      the next date on the calendar after that is 2033.
    quiz:
      - q: Why does Baptiste treat another month of work as a cost rather than as care?
        a: The sentence runs while the unit is careful
        wrong:
          - A review board loses interest in any case that has been under examination for longer than a year
          - Evidence gathered late in a review is inadmissible before the board that commissioned it
          - Witnesses become unwilling to cooperate once a review has run past its original deadline
  - id: okada
    name: Dr. Ren Okada
    role: Memory Scientist
    division: MEMORY
    bio: |
      Studies what happens to an account in the weeks after the event, which in
      practice means studying what interviewers do to it. He has testified for
      both sides and describes that as the only defensible arrangement.

      He treats Alma Cardoza's November 2019 interview as a specimen: the last
      record of that night taken before a photograph, a lineup and a courtroom
      had all had a turn at it. Asking her again in 2026 does not recover the
      night. It produces a 2026 account and destroys the comparison.

      His limit is that he can say an account is contaminated and not what the
      uncontaminated version would have been. He is the reason the unit is slow
      and he agrees that being slow has a price.
    quiz:
      - q: Why does Okada object to re-interviewing Cardoza rather than welcoming the extra evidence?
        a: A new account cannot be compared with one it has already been influenced by
        wrong:
          - Witnesses interviewed more than twice are barred from giving evidence at a review hearing
          - Seven years is long enough that no useful detail of any kind survives in memory
          - An interview conducted by a review unit carries less weight than one taken by police
  - id: frey
    name: Dr. Halina Frey
    role: Vision Scientist
    division: PERCEPT
    bio: |
      Measures what an eye could have done, which is a narrower claim than what
      a person saw and a much harder one to argue with. She carries a lux meter
      in a coat pocket and has never once been asked for it politely.

      Her interest in this case began with a number nobody had checked. The file
      says twenty-two metres. The distance decides what a face is at that range,
      and a face at the resolution limit is a shape with hair on it.

      Her limit is that the eye is not the whole of seeing. She can put a bound
      on what arrived at the retina and say nothing at all about what the brain
      then made of it, which is Okada's half of the corridor.
    quiz:
      - q: Why does Frey insist a measured distance settles more than an argument about eyesight does?
        a: Distance sets the angle a detail arrives at, whatever the eye behind it
        wrong:
          - Eyesight varies so little between adults that it can be treated as identical for everybody
          - Courts have ruled that measured distances outrank all other forms of evidence about a scene
          - An eye test taken seven years later cannot be admitted in any proceeding
  - id: ilori
    name: Marcus Ilori
    role: Identification Procedures Adviser
    division: IDENT
    bio: |
      Nineteen years a detective, and ran identification parades the way the
      1990s ran them: his own suspect, his own witness, his own encouragement.
      He now trains the officers who are not allowed to do any of that.

      He is careful about how he says it. Nobody he worked with was cheating.
      The procedure let an honest belief leak out through a pause, a repeated
      photograph, a "take your time" that landed on the fourth face, and the
      point of the reforms is that honesty was never enough.

      His limit is that he liked being right, and he knows what that felt like
      from the inside. He is the person in the building least surprised by
      Loomis and least willing to talk about her.
    quiz:
      - q: Why does Ilori argue that an honest administrator is not enough protection?
        a: A belief reaches the witness through pauses and small encouragements
        wrong:
          - Administrators who believe in the suspect are more likely to falsify the paperwork afterwards
          - An honest officer will usually decline to run the procedure at all
          - Witnesses are able to detect dishonesty and adjust their answers accordingly
  - id: raghunathan
    name: Dr. Priya Raghunathan
    role: Psychophysiologist
    division: BRAIN
    bio: |
      Works on what arousal does to encoding, and on the flatter, duller thing
      that eighteen hours awake does to a person's ability to weigh anything at
      all. Both halves of this case need her and for opposite reasons.

      She is precise about arousal because the popular version is wrong in both
      directions. Fear does not print a scene into memory and it does not erase
      one. It narrows what is attended to, so the middle of the event is sharp
      and the edges were never encoded.

      Her limit is that she cannot read a state off a transcript. What she has
      of the interrogation room is a clock, a custody log and the fact that
      nobody offered Ward a bed for nineteen hours.
    quiz:
      - q: Why does Raghunathan reject the idea that fear makes a memory more complete?
        a: Fear selects part of a scene, and the rest is not stored at all
        wrong:
          - Memories formed under fear are stored in a separate system that decays faster than ordinary memory
          - People under threat close their eyes for most of the event and encode almost nothing
          - Fear has no measurable effect on memory in either direction once the event has ended
  - id: weill
    name: Dr. Tomas Weill
    role: Psychometrician
    division: MEASURE
    bio: |
      Builds and breaks measurements of people for a living. He is the person
      who asks what the number would have been if the same person were measured
      twice, which is a question most files have never been asked.

      His standing objection to this case is that its central quantity was never
      measured at all. "Absolutely certain" is not a scale. It was recorded once,
      three weeks after the identification and after a conversation, and the
      file treats it as though it had been read off an instrument.

      His limit is that he is not interested in what happened on Ferrier Street.
      He is interested in whether any of the quantities in the file mean what
      they are being used to mean, which makes him unpopular in a room that
      wants to know who did it.
    quiz:
      - q: Why does Weill refuse to treat Cardoza's "absolutely certain" as a measurement?
        a: It was recorded once, after feedback, on no defined scale
        wrong:
          - Statements of certainty are excluded from psychological evidence by professional guidelines
          - Certainty can only be quantified using specialist equipment that was unavailable in 2019
          - A witness is never able to report their own confidence with any accuracy at all
  - id: solomon
    name: Yara Solomon
    role: Case Analyst
    division: MEMORY
    bio: |
      Reads files for a living and has read this one eleven times. She found the
      utility ticket for column 4471 in a folder of unrelated correspondence,
      because she reads the unrelated correspondence.

      Her method is dates. Every claim in a file has a date on which somebody
      first wrote it down, and half the arguments in this building dissolve when
      the two dates are put side by side. The certainty statement is three weeks
      later than the identification it describes, and nothing in the file says so.

      Her limit is that a date is not a motive. She can show that the account
      moved and cannot show what moved it, which is the difference between her
      half of the work and Okada's.
    quiz:
      - q: Why does Solomon date every claim in the file rather than reading it as a narrative?
        a: A file reads as one moment when it was written across months
        wrong:
          - Undated documents are inadmissible in a conviction review and must be identified early
          - Narrative accounts are always less accurate than lists of dated facts
          - The order in which documents were filed is the order in which they were written
  - id: bekele
    name: Dawit Bekele
    role: Reconstruction Technician
    division: PERCEPT
    bio: |
      Built the corner in the bay: the shopfront, the kerb line, the doorway, and
      the column in the position the survey put it rather than the position the
      file drew it. He works from measurements and refuses to work from
      photographs, which is a slower way to be right.

      He surveyed Ferrier Street himself over two nights with the shop's
      permission and a tripod. The kerb has not moved since 2019 and neither has
      the doorway, which is why a reconstruction is possible at all.

      His limit is the light. The bay's lamps can be set to the illuminance the
      survey measured, and no rig can reproduce a sodium lamp that has been
      replaced with a different fitting.
    quiz:
      - q: Why does Bekele build from survey measurements rather than from scene photographs?
        a: A photograph has a lens, an exposure and a position nobody recorded
        wrong:
          - Photographs taken by police are routinely withheld from conviction review units
          - The colours in a photograph fade over the seven years since it was taken
          - A photograph cannot show the height of anything, only its width
  - id: loomis
    name: Karen Loomis
    role: Retired Detective
    division: IDENT
    bio: |
      Ran the six-photograph array on 4 December 2019, and everything she did
      that afternoon was permitted by the policy then in force. She knew which
      photograph was the suspect, because in 2019 the officer running the array
      always did.

      She has come in voluntarily twice. She remembers saying something after
      Cardoza chose, and she does not remember what, and she is the one who says
      that is the problem rather than the defence.

      Her limit is memory, and she knows exactly how that sounds. She is a
      witness to her own procedure, seven years on, with a reputation in it.
    quiz:
      - q: Why does Loomis treat her own inability to recall what she said as the important fact?
        a: A remark she cannot recall is one nobody can rule out
        wrong:
          - Officers are required by law to record every word spoken during an identification procedure
          - Anything she cannot remember was by definition too brief to have influenced anybody
          - Her recollection would be excluded from the review as an interested account
  - id: oyelaran
    name: Dr. Samuel Oyelaran
    role: Clinical Psychologist
    division: BRAIN
    bio: |
      Assesses whether somebody understood what was being asked of them, which
      in this file means the nineteenth hour of an interview conducted without
      counsel. He works from custody records, not from impressions.

      He is careful with the word trauma. Cardoza was frightened on Ferrier
      Street and has been frightened by this case since, and neither fact tells
      anybody whether she saw a face. Distress is real and it is not evidence
      about accuracy in either direction.

      His limit is that he never meets the people he writes about at the time
      that matters. Everything he assesses is seven years old and reaches him as
      paper.
    quiz:
      - q: Why does Oyelaran refuse to draw a conclusion about accuracy from Cardoza's distress?
        a: Being frightened says nothing about what was seen
        wrong:
          - Distress recorded years after an event is unrelated to the distress felt at the time
          - Clinical psychologists are not permitted to comment on the evidence of witnesses
          - Frightened witnesses are known to be less accurate than calm ones in every study
  - id: ntuli
    name: Grace Ntuli
    role: Deliberation Study Coordinator
    division: SOCIAL
    bio: |
      Runs the unit's mock deliberation panels: twelve volunteers, a transcript,
      and a camera. She is not trying to guess what the 2020 jury did. She is
      measuring what a room does to a claim that is repeated in it.

      What she reports most often is unwelcome. A confident identification does
      not have to persuade twelve people. It has to persuade three, after which
      the room's own agreement does the rest, and the panel remembers the
      certainty long after the qualifications have dropped out of it.

      Her limit is that volunteers know they are volunteers. Nobody in her room
      is deciding anything about anybody, and she says so before every session.
    quiz:
      - q: Why does Ntuli argue that a confident witness only has to persuade a few jurors?
        a: Once a few agree, the room's own agreement carries the rest
        wrong:
          - Juries in this jurisdiction are permitted to return a verdict on a majority of three
          - Jurors who disagree with the majority are removed from the deliberation room
          - A confident witness is usually the only evidence a jury is shown
  - id: achterberg
    name: Nell Achterberg
    role: Records Custodian
    division: MEASURE
    bio: |
      Holds the file, and holds it in the state it arrived in. Nothing in her
      store has been reordered, corrected or tidied, because a tidy file is a
      file somebody has edited and the edits are never written down.

      She is the reason the review has anything to work with. The utility ticket,
      the 2019 policy document, the custody log and the array photographs are
      all in the store because she refused four requests to destroy duplicates.

      Her limit is that she has what was sent. The array itself — the six
      photographs as they were laid out — exists as a photocopy of a photocopy,
      and nobody in 2019 recorded which order they were in.
    quiz:
      - q: Why does Achterberg refuse to tidy or reorder a file she is holding?
        a: Corrections leave no record of what was there before
        wrong:
          - Reordering documents is prohibited by the archive standard the unit is accredited to
          - A tidy file takes longer to search than one left in the order it arrived
          - Documents lose their legal status once they have been removed from their original folder

glossary:
  - name: Lux
    aliases: [lux, illuminance]
    def: A measure of how much light is falling on a surface; a supermarket aisle is about 500, a lit street about 5.
  - name: Acuity
    aliases: [acuity, visual acuity]
    def: How small a detail vision can separate, measured as an angle rather than as a size.
  - name: Cone
    aliases: [cone, cones]
    def: The retinal cell that carries colour and small detail, and needs a reasonably bright scene to work.
  - name: Rod
    aliases: [rod, rods]
    def: The other kind of cell in the retina, which still works when there is almost no light and reports shape and movement only.
  - name: Dark adaptation
    aliases: [dark adaptation, dark-adapted, adapted eye]
    def: The slow gain in what the eye can pick up in the dark, most of it within ten minutes and not finished for half an hour.
  - name: Encoding
    aliases: [encoding, encoded]
    def: What actually gets into memory at the moment of an event, which is only ever part of what was in front of the eyes.
  - name: Retrieval
    aliases: [retrieval, retrieved, recall]
    def: Bringing an account back, which rebuilds it from fragments rather than replaying a recording.
  - name: Attention
    aliases: [attention, attended, attending]
    def: The selection of one part of a scene for processing, at the cost of the rest of it.
  - name: Inattentional blindness
    aliases: [inattentional blindness, inattentional]
    def: Failing to register something in plain view because attention was on something else.
  - name: Weapon focus
    aliases: [weapon focus]
    def: The narrowing of attention onto a threatening or unusual object, at the cost of the face behind it.
  - name: Misinformation effect
    aliases: [misinformation effect, misinformation, post-event information]
    def: A detail that arrived after an event turning up in the account of the event itself.
  - name: Source monitoring
    aliases: [source monitoring, source of a memory]
    def: Keeping track of where a remembered detail came from, which fails more often than the detail itself does.
  - name: Co-witness contamination
    aliases: [co-witness contamination, co-witness, co-witnesses]
    def: Two accounts that have been compared with each other, after which their agreement says nothing.
  - name: Cross-race effect
    aliases: [cross-race effect, cross-race, own-race]
    def: The repeated finding that faces from a group a person has little experience of are harder to distinguish.
  - name: Flashbulb memory
    aliases: [flashbulb memory, flashbulb]
    def: A memory that feels photographic and detailed, and is no more accurate than an ordinary one.
  - name: Amygdala
    aliases: [amygdala]
    def: The structure that tags an event as threatening and drives the body's alarm response.
  - name: Cortisol
    aliases: [cortisol]
    def: The stress hormone released minutes into a threat, which sharpens the centre of an event and costs its edges.
  - name: Filler
    aliases: [filler, fillers]
    def: A person in a lineup whom the police know did not do it, included so that a choice means something.
  - name: Functional size
    aliases: [functional size]
    def: How many of the photographs a witness could realistically choose, once the description has ruled the others out.
  - name: Sequential presentation
    aliases: [sequential presentation, sequential, one at a time]
    def: Showing a line-up one photograph at a time, so each is judged on its own instead of against the others.
  - name: Double-blind administration
    aliases: [double-blind administration, double-blind, blind administration]
    def: Running a line-up with an officer who does not know which photograph shows the suspect.
  - name: Confidence inflation
    aliases: [confidence inflation, inflated confidence]
    def: The rise in a witness's stated certainty after being told, in any form, that they chose the expected person.
  - name: Hit rate
    aliases: [hit rate, hits]
    def: How often a witness chooses correctly when the person who did it is in the lineup.
  - name: False alarm
    aliases: [false alarm, false alarms, false alarm rate]
    def: How often a witness names one of the faces when nobody in the lineup did it.
  - name: Sensitivity
    aliases: [sensitivity, d-prime]
    def: How well witnesses distinguish a true match from a similar face, read from the hit rate and the false alarm rate together.
  - name: Criterion
    aliases: [criterion, the line]
    def: How ready a witness is to answer at all, which moves both rates together and is not the same as seeing better.
  - name: Base rate
    aliases: [base rate, base rates, prior]
    def: How common something is before any evidence is considered — here, how many people could have been on that street.
  - name: Likelihood ratio
    aliases: [likelihood ratio]
    def: How much more often a piece of evidence turns up when a claim is true than when it is false.
  - name: Reliability
    aliases: [reliability, reliable, test-retest, inter-rater]
    def: Whether a measurement gives the same answer twice — on a second occasion, or in a second person's hands.
  - name: Validity
    aliases: [validity, valid]
    def: Whether a measurement is measuring what it is being used to measure, which reliability alone does not settle.
  - name: Norms
    aliases: [norms, norm group, normed]
    def: The distribution of scores in a defined group, against which one person's score is read.
  - name: Standard score
    aliases: [standard score, z-score]
    def: A score expressed as how many standard deviations it sits from the mean of the norm group.
  - name: Minimisation
    aliases: [minimisation, minimising]
    def: An interview tactic that offers a face-saving version of the act, making an admission feel cheap.
  - name: Expectancy
    aliases: [expectancy, experimenter expectancy]
    def: The influence of what the person running a procedure believes on what the person taking part does.

missions:
  # ---------------------------------------------------------------- day 1
  - title: What the file claims
    objective: Establish what the record asserts before anybody characterises it.
    briefing: Fifteen working days to the board, and nobody has read this file end to end since 2020.
    stake: >-
      Monday, and the file is on the table for the first time. Elias Ward has served seven years
      of fourteen. One person saw the robbery. There is no other evidence at all. Ines Baptiste,
      who runs the unit, wants the report finished this month. Today you sort what the file proves
      from what it only claims. You also count what the line-up really asked a witness to do.
    takeaway: >-
      A signature says somebody accepted a claim. It does not say anybody checked it.
    stops:
      - group: MEASURE
        task: Sort what the file proves from what it only states
        title: The signature and the thing it stands for
        concept: 'Measure it instead of arguing about it'
        place: Records Store
        scene: >-
          Nell Achterberg, the records custodian, opens the Ward file on the long table. Every page
          in it is signed. Nobody has ever gone behind one of the signatures.
        guide: >-
          Three claims out of the file, and three kinds of thing standing behind them. Match each
          claim to what you would actually find if you asked. A signature is on all three, so the
          signature is not what tells them apart.
        assumes:
          - a file records claims as well as measurements
        takeaway: A signature shows a claim was accepted. Whether anybody checked it is another question.
        format: PROTOCOL
        task: Match each signed claim to what is really behind it.
        scenarios:
          - She stood 22 metres from the doorway
          - The street lights were normal that night
          - Six photographs were shown on 4 December
        choices:
          - A sketch marked "not to scale", with no measurement on it
          - Four words, and nothing anybody can check now
          - A signed form, with the time and the room on it
        mapping: [0, 1, 2]
        why: >-
          One of these three has real evidence under it: a form filled in at the time, with a room
          and a clock on it. The other two have words. A sketch marked not to scale is a drawing,
          and "the street lights were normal" is somebody's impression typed into a box. Those two
          are also the claims that decide what could have been seen at all. The file is not wrong
          here. It is unchecked, in the two places where being unchecked matters most.
      - group: IDENT
        task: Establish what Cardoza was actually asked to do
        title: Six at once
        concept: 'A line-up needs choices somebody might really pick'
        place: Identification Suite
        scene: >-
          Marcus Ilori, the identification adviser, has the line-up form on the table. Six photographs
          were laid out together. The witness was asked whether the man she saw was one of them.
        guide: >-
          If the man she saw was not among the six, a witness who picks anyway lands somewhere by
          luck. Work out how often luck would land on the suspect. Two tiles do it. The others
          describe the line-up but do not belong under the line.
        background:
          - >-
              What the two procedures ask. Six photographs together invite a comparison — which of
              these is closest to the memory — and the answer is always available, because one of six
              always is closest. One at a time asks an absolute question about each face, which can be
              answered no six times.
          - >-
              Why the arithmetic matters to the file. A witness who would pick under a relative
              judgement, with the offender absent, lands on the innocent suspect about one time in
              six. That is not an estimate of how often witnesses are wrong; it is the floor set by
              the procedure itself, before anything about lighting or distance is considered.
          - >-
              What the fillers do. Fillers nobody would pick shrink the effective size of the array,
              so an array of six with three implausible fillers behaves like an array of three and the
              floor rises accordingly. That is why filler selection is scored separately from the
              identification.
        assumes:
          - a line-up holds one suspect and some people known to be innocent
        takeaway: >-
          Six photographs shown together ask which face is closest. That question always has an
          answer.
        format: BALLPARK
        question: >-
          If the man she saw was not among the six, how often would a guess land on the suspect?
        answerText: >-
          About 17 per cent — one time in six, from the way the line-up was run and nothing else.
        why: >-
          A guess has to land somewhere. With six faces on the table and no reason to prefer any of
          them, it lands on the suspect about one time in six, which is roughly 17 per cent. That
          number comes from the procedure alone. Nothing about the street, the light or the distance
          has been used yet. It is also the best case. Faces nobody would ever pick are not really
          choices, so a line-up of six can behave like a line-up of three.
        estimate:
          prompt: Six photographs were shown together on 4 December 2019. One was the suspect; five were fillers. There was no caution that the man might be absent.
          question: Choose the number of photographs in the array.
          labels:
            - 100  (to turn a share into a percentage)
            - 6  (photographs on the table)
            - 5  (of them who are not the suspect)
            - 3  (faces that really fit her description)
            - 8.4  (metres from the counter to the corner)
          values: [100, 6, 5, 3, 8.4]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 16.7
          tolerance: 1.5
          units: per cent
          solution: >-
            100 ÷ 6 = 16.7 per cent, from the way the line-up was run.
          explanation: >-
            The distance belongs to a different question, and the count of fillers is not what you
            divide by.
          givens:
            - six photographs shown together, one of them the suspect
            - no warning that the man she saw might not be there
          relationship: >-
            Chance of a lucky pick as a percentage = 100 divided by the number of real choices in the
            line-up.
      - group: SOCIAL
        task: Guard the review against the answer it wants
        title: What a clean file would look like
        concept: 'A fair test changes one thing and holds the rest'
        place: Deliberation Room
        scene: >-
          Ines Baptiste, the unit director, wants the team to write down now what a fair 2019 line-up
          would look like. Nobody has read the witness statements yet.
        guide: >-
          The four answers each name something writing it down first protects you from. Ask which one
          you could not notice afterwards. Once you have seen the file, everything in it looks either
          helpful or unhelpful, and that is the problem.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - people notice evidence that fits what they already think
        takeaway: >-
          Write down what would count against you before you look, or you will not spot it later.
        format: CHOICE
        question: >-
          What does writing the standard down first protect the review from?
        why: >-
          Once you have read a file you cannot un-read it. Every finding after that looks like it
          helps or hurts, and the ones that help are the ones you remember. Writing the standard down
          first fixes what counts as a fair line-up before you know which way the answer falls. Then
          the file is measured against the standard rather than the standard bending around the file.
          It costs ten minutes and it is the only step here nobody can do later.
        choices:
          - Counting only the findings that point the way you already lean
          - The board turning down a report it has not agreed in advance
          - Arguments between the lawyers and the scientists on the team
          - Time spent reading documents that turn out not to matter
        answer: Counting only the findings that point the way you already lean
        rebuttals:
          - The board reads the report it is sent; it does not agree one in advance.
          - The team will argue either way, and a written standard is what they argue about.
          - Reading something that turns out not to matter costs an hour, not a conclusion.
  # ---------------------------------------------------------------- day 2
  - title: What a face is at that distance
    objective: Turn the file's own distance into what an eye could have resolved.
    briefing: The reconstruction bay is built to the survey, and the first arithmetic is the file's own.
    stake: >-
      Tuesday, in the reconstruction bay. The unit has rebuilt the Ferrier Street corner at full
      size inside its hall. Halina Frey, the vision scientist, has a tape and twelve volunteers
      who were never there. Today you work out what an eye can still make out at that distance.
      Then you test the six photographs on strangers who have only the description. Get it wrong
      and the unit measures the wrong corner all fortnight.
    takeaway: >-
      What somebody could have seen is a measurement, not an opinion.
    stops:
      - group: PERCEPT
        task: Work out the angle a face subtends at the file's distance
        title: What you can still make out at twenty-two metres
        concept: 'How small a thing your eye can still tell apart'
        place: Reconstruction Bay
        scene: >-
          Nadia Frey, the vision scientist, runs a tape out to the twenty-two metre mark on the bay
          floor and stands a face at the doorway. She wants a number before anybody looks.
        guide: >-
          Your eye can separate two things only if the gap between them is big enough for how far away
          they are. The rule is about a third of a millimetre for every metre. Two tiles give the
          answer; the others describe the corner but do not go into it.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - a millimetre is a thousandth of a metre
        takeaway: >-
          The further away something is, the bigger it has to be before you can make it out at all.
        format: BALLPARK
        question: >-
          What is the smallest detail an eye can still separate at twenty-two metres?
        answerText: >-
          About 6.6 millimetres — roughly the width of a pencil. Anything smaller than that blurs into
          whatever is beside it.
        why: >-
          Eyes have a limit, and it gets worse with distance. At about a third of a millimetre per
          metre, twenty-two metres works out at roughly 6.6 millimetres. Anything finer than that
          arrives as a blur. A face is much bigger than 6.6 millimetres, so a witness at that distance
          can certainly see that there is a face. What she cannot see is the small stuff — the shape
          of a lip, a thin scar, the line of an eyebrow. Those are the parts that tell one person from
          another.
        estimate:
          prompt: The case summary puts Cardoza twenty-two metres from the doorway.
          question: Choose the distance and the rule for how sharp an eye is.
          labels:
            - 22  (metres, the distance the file records)
            - 0.3  (millimetres of detail for every metre away)
            - 63  (millimetres between the eyes of an adult face)
            - 150  (millimetres across a whole face)
            - 6  (seconds she was watching)
          values: [22, 0.3, 63, 150, 6]
          slots: 2
          template: "{0} × {1}"
          formula: a*b
          correct: [0, 1]
          target: 6.6
          tolerance: 0.6
          units: millimetres
          relationship: >-
            Smallest detail in millimetres = the distance in metres multiplied by 0.3.
          solution: >-
            22 × 0.3 = 6.6 millimetres, about the width of a pencil.
          explanation: >-
            The width of a face and the gap between the eyes are real measurements of a face. Neither is
            the rule for how sharp an eye is.
          givens:
            - the case summary puts her twenty-two metres from the doorway
            - an eye separates about 0.3 millimetres of detail for every metre of distance
      - group: MEMORY
        task: Establish how much time there was to take anything in
        title: Six seconds, and what they hold
        concept: 'Memory is rebuilt each time, not played back'
        place: Interview Suite A
        scene: >-
          Ren Okada, the memory scientist, opens Alma Cardoza's first account at the doorway. Six
          seconds passed between the shout and the man crossing the kerb. The bay clock is set to six.
        guide: >-
          Six seconds of attention to spend, and more things worth looking at than will fit. Spend
          them, then read what the account could honestly contain afterwards. Nothing here is the
          wrong thing to look at — the point is what looking at it costs you.
        background:
          - >-
              Why attention is a budget and not a spotlight that widens. Encoding happens at the
              moment, from what was attended to, so anything not attended to is not weakly
              remembered — it was never encoded and there is nothing to recover. That is why the
              question is what six seconds were spent on rather than how good the memory is.
          - >-
              What each item actually costs. A fixation lasts about a quarter of a second and a
              saccade between targets about fifty milliseconds, so six seconds is on the order of
              twenty fixations if nothing else happens. Reading a plate is several fixations and a
              rehearsal; a face at eight metres in poor light is several more.
          - >-
              Why the weapon is the item that spends everything. An arousing, threatening object
              draws and holds fixations, which is the mechanism behind weapon focus: the description
              of the object gets better and the description of the face gets worse, out of the same
              six seconds. That is a prediction about detail, not a claim about honesty.
        assumes:
          - memory is built from what was attended to during an event
        takeaway: >-
          You remember what you paid attention to, and attention takes one thing at a time.
        format: ALLOCATE
        question: >-
          Six seconds of attention. Spend them, and see what the account can hold.
        answerText: >-
          The weapon takes nearly half of it on its own. Buy the face and the exit as well and the
          number plate is gone.
        why: >-
          Attention is not free. Six seconds sounds like plenty until you price what is in them. A
          weapon takes the eyes whether or not anybody decides to give it them, and that alone is
          nearly half the time. What is left buys a face at eight metres in poor light, or a number
          plate, or a direction — not all three. So an account with every one of those details in it
          has been added to since the night. That is not lying. It is what remembering does.
        allocate:
          hint: Nothing here is a wrong thing to have looked at. What the six seconds cannot hold is the price of what they did.
          pool:
            amount: 6
            unit: seconds of attention
            mode: scalar
          items:
            - id: threat
              label: The weapon, once it is out
              cost: 2.8
              protected: true
              note: an arousing object takes the eyes whether or not you decide to give them
            - id: face
              label: The man's face, at eight metres in dim light
              cost: 2.0
            - id: exit
              label: Which way he went at the corner
              cost: 0.8
            - id: plate
              label: The number plate on the car at the kerb
              cost: 1.6
            - id: clothes
              label: The clothing, well enough to describe it
              cost: 1.2
            - id: second
              label: Whether there was a second man
              cost: 0.9
          answers:
            - question: Can the account describe the man's face at all?
              requires:
                - face
              required: true
            - question: Can it say which way he left?
              requires:
                - exit
            - question: Can it give the number plate?
              requires:
                - plate
            - question: Can it describe what he was wearing?
              requires:
                - clothes
            - question: Can it say whether he was alone?
              requires:
                - second
          commit: Commit the six seconds
      - group: IDENT
        task: Predict the description-only suspect-pick share, run the forty-person check, then spend the measurement to see where the choices actually landed.
        title: Predict it before the forty cards turn
        concept: 'A fair test changes one thing and holds the rest'
        place: Identification Suite
        scene: >-
          Marcus Ilori lays the first description beside the six photographs. Forty cards are face
          down on the bench. Nobody holding one has ever seen the robbery.
        guide: >-
          Write down first what share of forty strangers you think will pick Ward from the description
          alone. Then turn the cards, then spend your one check on counting where the picks landed.
          Locking the prediction first is what makes the count able to prove you wrong.
        background:
          - >-
              What a fair array looks like in numbers. Six photographs, one of them the
              suspect, and a description that does not single anybody out should send about
              one witness in six to each. A share much higher than that means the array
              itself is pointing, and the description is doing the work rather than the
              memory.
          - >-
              Why mock witnesses who saw nothing are the right test. They cannot recognise
              anybody, so anything above chance comes from the procedure: fillers who do not
              match the description, a photograph that stands out, an instruction that
              implies the offender is present.
          - >-
              Why the prediction is locked first. A distribution read and then explained is
              a distribution that can be made to support whatever the reader already
              believed. Committing first is what makes the forty cards evidence about the
              array.
        assumes:
          - a lineup is built to be consistent with the description already given
        takeaway: >-
          A line-up can be tested on people who never saw anything, and where they land measures the
          line-up.
        format: VERIFY
        question: >-
          What share of forty strangers will pick Ward from the description alone?
        verify:
          decision: Does the description-only mock-witness test behave like a fair six-person array?
          hint: Lock a predicted share before the cards turn. Then run all forty volunteers and spend the one check on the distribution of picks, not just on whether the run completed.
          prediction:
            min: 20
            max: 80
            unit: per cent of the forty
            step: 1
          intervention:
            id: mock_run
            label: Run 40 mock witnesses from the first description only
            n: 40
          checks: 1
          truth: 65
          passRatio: [0.8, 1.2]
          measurement:
            label: Count picks by photograph
            cost: 1
        answerText: >-
          Sixty-five per cent — twenty-six of forty. A fair set of six would have spread them near
          seventeen per cent each.
        why: >-
          These forty people never saw the robbery. All they have is the description, so anything they
          agree on is coming from the photographs and not from memory. If the six faces all fitted the
          description equally, the picks would spread out at about one in six each. Instead twenty-six
          of forty land on the same face. That is a fact about how the six were chosen. It says
          nothing at all about what Alma Cardoza did or did not see.
  - title: Two lamps and a wet road
    objective: Put a number on the light the corner had, using the file's own assumptions.
    briefing: The scene report says lighting was normal, which is a phrase rather than a reading.
    stake: >-
      Wednesday, and the bay is lit to the light Ferrier Street had. Two lamps, one of them out
      that November. Dawit Bekele, the reconstruction technician, has the lamp records. The scene
      report says only that the lighting was normal. Today you work out how much light the doorway
      really had. You also decide what a word in a report is worth beside a reading.
    takeaway: Most of what decides an identification can be measured without ever asking the witness again.
    stops:
      - group: PERCEPT
        task: Work out the illuminance on the doorway from the column
        title: How much light the corner had
        concept: 'Light: how much there is, and what it costs you to see'
        place: Reconstruction Bay
        scene: >-
          Dawit Bekele has the lamp records for Ferrier Street. Column 4471 stands twelve metres from
          the shop doorway. The other lamp on that stretch was out all November.
        guide: >-
          Light spreads out as it travels, so it drops fast with distance. Work out how much the
          working lamp put on the doorway. Two distances are on the tiles and only one of them is
          between the lamp and the thing it lights.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - light from a single source spreads over an area that grows with distance
        takeaway: >-
          Light falls off with distance from the lamp, not with distance from whoever is watching.
        format: BALLPARK
        question: >-
          How much light did the working lamp put on the doorway?
        answerText: >-
          About 12.5 lux. A lit shop aisle is nearer 500, so the doorway had a fortieth of that.
        why: >-
          Light spreads out in every direction as it leaves a lamp, so twice as far away means a
          quarter as much. Twelve metres from an 1,800 candela lantern works out at about 12.5 lux.
          That is enough to see that somebody is there. It is nowhere near enough to see colour
          properly or to pick out fine detail. The twenty-two metres in the file is how far the
          witness stood from the doorway, which matters for what her eye could separate — not for how
          much light fell on it.
        estimate:
          prompt: Column 4471 carries an 1,800 candela lantern and stands twelve metres from the shop doorway. Cardoza was twenty-two metres from the doorway, on the far pavement.
          question: Choose the strength of the lamp and the distance from it to the doorway.
          labels:
            - 1800  (candela, how strong the lantern is)
            - 12  (metres, from the lamp to the doorway)
            - 22  (metres, from the witness to the doorway)
            - 500  (lux, a lit shop aisle, for comparison)
            - 5  (lux, an ordinary lit street, for comparison)
          values: [1800, 12, 22, 500, 5]
          slots: 2
          template: "{0} ÷ ({1} × {1})"
          formula: a/(b*b)
          correct: [0, 1]
          target: 12.5
          tolerance: 2.5
          units: lux
          relationship: >-
            Light on a spot = the lamp's strength divided by the distance to it, multiplied by that
            distance again.
          solution: >-
            1800 ÷ (12 × 12) = 1800 ÷ 144 = 12.5 lux.
          explanation: >-
            The twenty-two metres is the distance to the witness. It belongs to what her eye could
            separate, not to how much light landed on the doorway.
          givens:
            - Column 4471 carries an 1,800 candela lantern
            - The column stands 12 m from the shop doorway
      - group: BRAIN
        task: Which explanation fits all four readings rather than the loudest one?
        title: The middle of the event and its edges
        concept: 'Being tired, frightened or hurt changes what you notice'
        place: Physiology Bay
        scene: >-
          Priya Raghunathan, the unit's psychophysiologist, has Cardoza's account beside the shop
          plan. The middle of it is detailed. The start and the end are nearly blank.
        guide: >-
          Four panels, and one explanation has to fit all four rather than only the loud one. Read the
          panels that look ordinary first. What rules an explanation out here is a part of the account
          that is detailed and correct.
        background:
          - >-
              Why the unremarkable readings decide it. The salient reading is what draws
              attention, and it is usually consistent with several explanations at once,
              which is why it rarely settles anything. The readings that discriminate are
              the ones a candidate predicts should have moved and which have not: a normal
              value is a positive result against every mechanism that would have disturbed
              it.
          - >-
              How to work the candidates. Take each mechanism and predict the panel it
              implies before you look at the panel again — which readings it drives, in
              which direction, and by roughly how much. Then compare. Working that way round
              is what separates a diagnosis from a rationalisation, because the prediction
              is made before the data is consulted.
          - >-
              Why only one candidate survives. Several will account for part of the panel,
              deliberately so, and a partial fit is exactly what a confident wrong answer
              feels like from the inside. When two remain, look for the reading on which
              their predictions differ and let it decide. If no reading separates them you
              have not finished reading the panel.
        assumes:
          - a threat triggers a fast alarm response before any decision is made
          - attention narrows under threat
        takeaway: >-
          Fear narrows what a person takes in, so the middle is sharp and the edges were never there.
        format: DIAGNOSIS
        why: >-
          Being frightened does not wipe a memory or print one. It narrows what somebody takes in
          while it is happening. So the middle of the event — the part that frightened her — is
          detailed and holds up, while the minute before and the minute after are thin. That pattern
          is the finding. An account that was unreliable all through would be vague in the middle too,
          and this one is not. The gaps at the edges are not evidence that she is wrong about the
          middle.
        headline: The account is minutely detailed in one place and empty in others, and both are being read as unreliability.
        readings:
          - zone: Described in detail
            label: The bag and the hand holding it
            value: nine specific details
            status: alarm
          - zone: Not described
            label: What the second man was wearing
            value: nothing at all
            status: alarm
          - zone: Reported wrongly
            label: Duration of the event
            value: "\"a couple of minutes\""
            status: high
          - zone: Stable across accounts
            label: Build, jacket, direction of travel
            value: unchanged in three tellings
            status: normal
            note: no drift between November and December
        choices:
          - label: The account is unreliable throughout
            mechanism: A witness who is wrong about one thing is wrong about everything.
          - label: Attention narrowed onto the threat
            mechanism: What was attended to is detailed, what was outside it was never encoded, and time is overestimated under arousal.
          - label: She is filling gaps to be helpful
            mechanism: Details are being invented to satisfy the interviewer.
          - label: The interviews were badly conducted
            mechanism: The questions failed to ask about the second man.
        answer: Attention narrowed onto the threat
        rebuttals:
          - Nothing here is wrong except the duration, and the features that survived are the ones a narrowed account keeps.
          - Invented detail drifts between tellings, and these three tellings do not drift.
          - The interviews did ask about the second man; the answer was that she had not looked at him.
      - group: MEASURE
        task: Decide what the phrase in the scene report is worth
        title: A word where a reading should be
        concept: 'Measure it instead of arguing about it'
        place: Records Store
        scene: >-
          The scene report has one line about the light: street lighting normal. Tomas Weill, the
          unit's psychometrician, wants to know what the review can do with that sentence.
        guide: >-
          The four answers each say something different about why the phrase is weak. Ask which one
          you could still check today. A reading can be compared with something; a word cannot, once
          the night is over.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a measurement can be repeated by somebody else and a description cannot
        takeaway: >-
          A word describing a condition and a reading of it are different evidence, and only one can
          be checked.
        format: CHOICE
        question: >-
          Why can the review not just accept "street lighting normal"?
        why: >-
          "Normal" is a comparison, and the thing it was compared with is gone. Normal for that
          street? For a street with two working lamps, when one of them was out? Nobody can say now,
          and the officer who wrote it cannot either. A meter reading would still mean the same thing
          today, because a number carries its own units with it. That is the whole difference between
          a word and a reading, and it is why the light had to be measured again in the bay.
        choices:
          - Nobody can now say what the officer was comparing it against
          - Officers are not trained to judge lighting at a scene
          - The report was written the next morning, not on the street
          - One person is never enough to settle a physical fact
        answer: Nobody can now say what the officer was comparing it against
        rebuttals:
          - >-
              Training is not the issue: a trained officer writing the same word leaves the same gap.
          - A note written later can still be accurate; what is missing is a number, not a time.
          - One meter reading would have settled it, so the number of people is not the problem.
  # ---------------------------------------------------------------- day 5
  - title: Four days before anybody asked
    objective: Establish how the first full account was taken, and who was in the room.
    briefing: The account everybody has argued about since was recorded on 18 November.
    stake: >-
      Thursday. Nobody took a full account from Alma Cardoza for four days after the robbery. Ren
      Okada, the memory scientist, says that gap matters more than anything else in the file.
      Baptiste says the unit cannot rerun an interview from 2019. Today you settle what order a
      good interview goes in. You also find the one instruction the line-up never gave her.
    takeaway: An account is not collected; it is produced, by a method, in a room, with people in it.
    stops:
      - group: MEMORY
        task: Order the steps of an interview that protects what the witness actually has.
        title: The order an account is taken in
        concept: 'The question changes the answer'
        task: >-
          Order the three steps of an interview that protects the account.
        place: Interview Suite A
        scene: >-
          Ren Okada has the 2019 interview notes open. The first question in them names a car. Nobody
          had asked Alma Cardoza to tell the story in her own words first.
        guide: >-
          Every question you ask puts words into the room, and those words can end up in the account.
          Put the three steps in the order that protects what the witness actually has. What decides
          the order is how much each step adds from outside.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim about dependency: each
              step is here because the one before it has already happened, or has to have.
              One transposed pair falsifies that claim wherever it sits, so partial credit
              would be credit for a sequence that does not work.
          - >-
              Why the ends are the place to start. The first and last cards are constrained
              by having nothing before or after them, which usually makes them the two you
              can settle from the scene alone. Pinning them collapses the remaining
              arrangements sharply, and what is left in the middle is where the actual
              judgement lives.
          - >-
              What the rail can be ordered on. Time is the usual axis, but it is not the
              only one. An order can run on cost, on risk, or on reversibility — every
              observation that leaves the sample as it was, before any that consumes it. On
              those boards a chronological reading finds nothing, because none of the steps
              has to happen at a particular hour.
        assumes:
          - a question can introduce a detail that was not in the witness's own account
        takeaway: >-
          Questions add words to a memory, so the witness's own account has to come first.
        format: SEQUENCE
        why: >-
          An interview is not neutral. Every question hands the witness words, and words can be
          remembered later as things she saw. So the account she gives with nothing asked is the
          cleanest evidence in the room, and it only exists once. Open questions come next, because
          they ask her to say more about her own words. Closed questions come last, when the only
          things left to check are details she has already put there herself.
        cards:
          - Let her tell it her own way, with nothing asked
          - Ask open questions about things she raised herself
          - Ask closed questions about details she has named
        order: [0, 1, 2]
      - group: SOCIAL
        task: Change one feature of the listening room at a time, then reverse the change that moves which details survive into the second telling.
        title: Eleven small agreements
        concept: 'Two witnesses who talk end up agreeing'
        place: Deliberation Room
        scene: >-
          Grace Ntuli runs the listening room. A volunteer tells the same story twice, and eleven
          times in between somebody nods and agrees.
        guide: >-
          The number to watch is how many details survive into the second telling. Three things about
          the room could be doing it. Change one, read the number, then put it back. Changing two at
          once answers a vaguer question than the one being asked.
        assumes:
          - people adjust what they say to the reaction they are getting
        takeaway: >-
          A cause is something that comes back when you put it back, not something that changed at the
          same time.
        format: CONTROL
        question: >-
          Three things about the room could be doing it. Find which, and prove it.
        control:
          hint: Change one control from baseline, read the number of details that survive into the second telling, then restore it. Do not change two room features together.
          noise: 0.7
          baseline: 8
          observable:
            label: Reading
            unit: details repeated
          response: 3
          truth: listener_agreement
          variables:
            - id: listener_agreement
              label: Listener agreement cues
            - id: open_questions
              label: Open questions after free recall
            - id: pause_seconds
              label: Interviewer pause after an answer
        answerText: >-
          The agreement. Take it away and the details drop from about eleven to eight; put it back and
          they return.
        why: >-
          Nobody in that room is coaching anybody. A speaker simply notices which sentences get a nod
          and which get nothing, and the ones that get a nod are the ones told again. Details that got
          no reaction quietly drop out. That is why this has to be tested one thing at a time: change
          the agreement and the number moves, change the questions or the pauses and it does not.
          Putting the agreement back and watching the number climb again is what makes it a cause.
      - group: IDENT
        task: Find the instruction that was not given
        title: The man may not be here
        concept: 'Saying the person might not be there at all'
        task: >-
          Match each way the line-up can end to who pays for it.
        place: Identification Suite
        scene: >-
          Marcus Ilori has the 2019 line-up form and the words that were read out from it. One
          sentence that is standard now is missing from the sheet.
        guide: >-
          Three ways a line-up can end, and somebody carries the cost of each. Match each one to who
          pays. What separates them is whether the person picked was the man she saw.
        background:
          - >-
              Why an array has four outcomes and not two. The offender is either in the array or not,
              and the witness either picks the suspect, picks a filler, or declines. That gives a hit,
              a miss, a filler pick and a correct rejection — and the four are not equally visible
              afterwards, which is why a procedure can look successful while producing the wrong ones.
          - >-
              What the caution changes. Told the man may not be present, a witness can answer the
              absolute question and decline. Not told, they answer the relative one — which of these
              is closest — and a filler pick or a suspect pick is the only available answer. The
              caution therefore acts on false identifications and leaves correct ones nearly
              untouched, which is the finding worth putting in front of a board.
          - >-
              Why a filler pick is the useful signal. It is the one error the system can see: nobody
              charges a filler, so a filler pick tells the investigation the witness was guessing.
              An identification of the suspect under the same guessing produces a charge and looks
              like evidence.
        assumes:
          - a witness expects an investigation to have found somebody before showing an array
        takeaway: >-
          Not told the man might be absent, a witness answers which of these instead of is he here.
        format: PROTOCOL
        question: Match each array outcome to what it costs and who carries it.
        scenarios:
          - The man she saw is there and she picks him
          - The man she saw is not there and she picks somebody
          - The man she saw is there and she picks nobody
        choices:
          - Evidence the case can use — what the line-up is for
          - A wrong name, carried entirely by an innocent person
          - A chance lost, carried by the case and by anybody harmed later
        mapping: [0, 1, 2]
        answerText: A hit is evidence, a filler pick is a visible warning, and a declined identification is a lost opportunity. The false identification is the only outcome that reads as evidence while being wrong — and the missing caution raises exactly that one.
        why: >-
          One sentence changes the question. Told the man may not be there, a witness can answer no,
          and no is a real answer. Left out, the question becomes which of these six is closest — and
          one of six always is closest, whether or not the man is in front of her. The three endings
          do not cost the same. A wrong pick is carried by somebody innocent, and it arrives in the
          file looking exactly like evidence.
  # ---------------------------------------------------------------- day 6
  - title: The photograph in the evening paper
    objective: Find out what entered the account after the night it describes.
    briefing: The Hallam Register ran Ward's photograph on 19 November, the day after the interview.
    stake: >-
      Friday, and the case analyst Yara Solomon has found the newspaper. A photograph of Ward ran
      in the Register on 19 November. The scar first appears in a statement dated 26 December, six
      weeks later. Okada wants the whole file put in date order before anybody argues about it.
      Today you work out where that detail came from. Being wrong here costs Ward another seven
      years.
    takeaway: A detail that is absent before a photograph and present after it has a source, and the source is not the night.
    stops:
      - group: MEMORY
        task: Which explanation fits every dated item rather than the most damning one?
        title: The scar
        concept: 'Memory is rebuilt each time, not played back'
        place: Interview Suite B
        scene: >-
          Yara Solomon has three dated papers on the table. A long interview from 18 November. The
          Register of the 19th. A statement from 26 December.
        guide: >-
          One explanation has to fit all four panels, not only the worst-sounding one. Read the quiet
          panels first. What settles it is the date each thing was written down.
        background:
          - >-
              Why the unremarkable readings decide it. The salient reading is what draws
              attention, and it is usually consistent with several explanations at once,
              which is why it rarely settles anything. The readings that discriminate are
              the ones a candidate predicts should have moved and which have not: a normal
              value is a positive result against every mechanism that would have disturbed
              it.
          - >-
              How to work the candidates. Take each mechanism and predict the panel it
              implies before you look at the panel again — which readings it drives, in
              which direction, and by roughly how much. Then compare. Working that way round
              is what separates a diagnosis from a rationalisation, because the prediction
              is made before the data is consulted.
          - >-
              Why only one candidate survives. Several will account for part of the panel,
              deliberately so, and a partial fit is exactly what a confident wrong answer
              feels like from the inside. When two remain, look for the reading on which
              their predictions differ and let it decide. If no reading separates them you
              have not finished reading the panel.
        assumes:
          - a remembered detail carries no label saying where it came from
        takeaway: >-
          A memory does not label where each piece came from, so something learned later can feel like
          the night.
        format: DIAGNOSIS
        why: >-
          The scar is not in ninety minutes of interview on 18 November. It is in the newspaper on the
          19th. It is in her statement six weeks later, told as something she saw. Memory does not tag
          its pieces with where they came from, so a detail picked up afterwards is stored beside the
          real ones and feels exactly the same. That is why the dates matter more than the wording.
          Nothing here says Alma Cardoza is lying, and the file should not say so either.
        headline: A chin scar is absent from the account taken four days after the robbery and present in the statement five weeks later.
        readings:
          - zone: 18 November account
            label: Mention of a scar
            value: none, in ninety minutes
            status: normal
          - zone: 19 November newspaper
            label: Photograph of Ward
            value: full face, scar clearly visible
            status: alarm
          - zone: 4 December array
            label: Photograph chosen
            value: the same image the newspaper ran
            status: alarm
          - zone: 26 December statement
            label: Mention of a scar
            value: "\"the mark on his chin\""
            status: alarm
          - zone: Cardoza
            label: Account of where the detail came from
            value: certain she saw it on the night
            status: high
            note: no hesitation on the point
        choices:
          - label: She is lying about the scar
            mechanism: The detail was added deliberately to strengthen the identification.
          - label: The detail arrived from the photograph
            mechanism: Information met after the event is stored as part of it, and its source is lost first.
          - label: She saw it and forgot to mention it
            mechanism: A detail can be encoded and left out of an early account.
          - label: The interviewer suggested it in November
            mechanism: The word came from the question rather than the witness.
        answer: The detail arrived from the photograph
        rebuttals:
          - Lying predicts hesitation and inconsistency, and there is none — she is certain, which fits an honest source error better.
          - A forgotten detail can reappear, and it would not so often be the detail that ran in a photograph the next evening.
          - The November transcript contains no mention of a scar by anybody, so the suggestion has no route in.
      - group: MEASURE
        task: Close the chronology from the robbery to the later certainty statement and find the interval the simplified file leaves out.
        title: Close the forty-two days
        concept: 'Where a claim came from, and when it was first said'
        place: Records Store
        scene: >-
          Nell Achterberg has the file dates on cards. The robbery is 14 November and the certain
          statement is 26 December. The summary jumps straight from one to the other.
        guide: >-
          Forty-two days have to add up. Open the gaps, count them, and see which one the summary left
          out. A gap with nothing written in it is not the same as a gap where nothing happened.
        background:
          - >-
              Why the days have to close. Four dates and the spans between them should
              account for the whole period. If they do not, some days are unaccounted for,
              and unaccounted days are days when something could have happened that nobody
              has recorded.
          - >-
              What an interval means here. Not idle time. Time during which a witness may
              have seen a photograph in a newspaper, spoken to another witness, or been told
              that somebody had been charged. Each of those changes what a later
              identification is evidence of.
          - >-
              Why independent records matter. Achterberg's records were made for other
              purposes — custody, duty rosters, correspondence — so they were not written to
              support anybody's account. That is what makes them able to close a gap the
              case file cannot.
        assumes:
          - a document's date can be checked against the record of when it was received
        takeaway: >-
          A timeline is only as good as the gaps it keeps, and things enter a memory during the gaps.
        format: BALANCE
        question: >-
          Make the forty-two days add up, and find the gap the summary leaves out.
        balance:
          total:
            amount: 42
            unit: days
            label: 14 November robbery to 26 December certainty statement
          streams:
            - id: robbery_interview
              label: Robbery to first full interview
              value: 4
              display: 14 → 18 November
            - id: interview_photo
              label: First full interview to newspaper photograph
              value: 1
              display: 18 → 19 November
              hidden: true
              note: The Register publishes Ward's photograph in this interval.
            - id: photo_array
              label: Newspaper photograph to array
              value: 15
              display: 19 November → 4 December
            - id: array_certainty
              label: Array to later certainty statement
              value: 22
              display: 4 → 26 December
          tolerance: 0.1
          hint: Close the days first. The missing term is an interval, not a document. Only after the total reaches forty-two should you ask what entered during that interval.
        answerText: >-
          4 + 1 + 15 + 22 = 42. The missing day is 18 to 19 November — the day the newspaper printed
          the photograph.
        why: >-
          The days have to add up, and when they do not, something has been left out. Here it is a
          single day: the one between her first full interview and the photograph in the Register. A
          day is easy to drop from a summary because it looks like nothing happened. It is the day
          everything happened. Once that interval is back in the timeline, the order of events is
          plain, and the order is the whole finding.
      - group: BRAIN
        task: Rule the biology in or out for a change five weeks later
        title: What the hormones cannot explain
        concept: 'How sure somebody is, and when they said it'
        place: Physiology Bay
        scene: >-
          Samuel Oyelaran is the unit's clinical psychologist. He has been asked one question. Could
          fear explain a detail that turns up five weeks later?
        guide: >-
          Every cause works during some stretch of time. The four answers put fear in four different
          stretches. What decides it is whether the cause can reach as far as the moment being blamed
          on it.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - the stress response has a time course that can be measured
        takeaway: >-
          A cause has to be able to reach the moment it is being blamed for.
        format: CHOICE
        question: >-
          Why can fear not explain a detail that first appears five weeks later?
        why: >-
          Fear does change memory. It works while something is happening, and for a few hours after.
          Five weeks later that window has closed. So fear cannot be what put a new detail in. This
          matters because "she was frightened" is the easy answer to anything odd in a file. Every
          cause works during some stretch of time. Checking that stretch against the calendar is how
          you tell a real explanation from a comfortable one.
        choices:
          - It works while the memory is being made, and for hours after
          - Fear hormones are gone within minutes and change nothing
          - Fear changes feelings only, and never what a face looked like
          - A second fright in December could rewrite the November memory
        answer: It works while the memory is being made, and for hours after
        rebuttals:
          - They last hours rather than minutes, which is why the night itself is affected.
          - Fear does change what detail is taken in, so this goes too far the other way.
          - >-
              There is nothing to rewrite: the scar was never in the November account at all.
  # ---------------------------------------------------------------- day 7
  - title: Two witnesses who agree
    objective: Find out whether the agreement between the accounts is worth anything.
    briefing: The shop assistant's statement matches Cardoza's in four particulars.
    stake: >-
      Monday of the second week. Two people saw the robbery and their accounts agree in four
      places. Grace Ntuli has found that they stood together on the kerb for twenty minutes first.
      Baptiste says agreement is still agreement. Today you test what talking does to two
      accounts. You also work out which pieces of evidence are really only one piece.
    takeaway: Two accounts that share a source are one account, and the file counts them as two.
    stops:
      - group: SOCIAL
        task: Find the source the agreeing accounts have in common
        title: Agreement is not independence
        concept: 'Two pieces of evidence that share a source are one'
        place: Deliberation Room
        scene: >-
          Four things in the file point at Ward. Grace Ntuli wants to know how many of them are really
          separate pieces of evidence.
        guide: >-
          Open each item to see what it was built from. Tick the ones that would still stand if the
          shared source were taken away, then name that source. Things that agree because they came
          from one place are one piece of evidence, not three.
        background:
          - >-
              Why the undisputed part is worth a morning. A case that everybody agrees about
              is a case nobody has audited. The four items agree because they are derived
              from one another, and the agreement is what made them look unassailable.
          - >-
              How dependence hides. A statement quoted in a summary, then cited by a report,
              then relied on in a later interview, appears three times in the file and is
              one observation. Closing the derivations is the only way to see it.
          - >-
              What survives, and why it matters. Anything that came from a separate
              observation still stands after the shared source is removed. The case does not
              disappear; it becomes accurately sized, which is the difference between a
              review and a demolition.
        assumes:
          - two pieces of evidence built on the same source can only ever agree
        takeaway: >-
          Evidence that agrees because it shares a source counts once, however many times it is
          written down.
        format: TRACE
        question: >-
          Open the four, keep whatever stands on its own, and name the source they share.
        trace:
          hint: Open an item to see what it was built from. Tick the ones whose evidence would survive if a shared source were removed, then name the source.
          channels:
            - id: cardoza
              label: Cardoza's December statement
              reading: names Ward, and a mark on his chin
              depends:
                - paper
            - id: aktas
              label: Aktaş's December statement
              reading: agrees on the jacket and the mark
              depends:
                - paper
            - id: caller
              label: An unnamed phone call
              reading: names Ward as the man in the doorway
              depends:
                - paper
            - id: till
              label: The shop till roll
              reading: last sale rung up at 21:41
              depends: []
          resources:
            - id: paper
              label: The Register of 19 November, which ran one photograph
            - id: talk
              label: The twenty minutes the two witnesses waited together
          independent:
            - till
          target: paper
          commit: Name the shared source
        answerText: >-
          The newspaper photograph. Three of the four passed through it. The till roll never did, so
          it keeps its weight.
        why: >-
          Three of these four were made by people who had all seen the same photograph. Of course they
          agree. They are three copies of one thing, and copying something three times does not make
          it more true. The till roll came off a machine that reads no newspapers, so it is separate
          evidence, even though it says less. Counting agreement without asking where it came from is
          how one weak item looks like three strong ones.
      - group: MEMORY
        task: Work out what twenty minutes of waiting cost
        title: Twenty minutes on the kerb
        concept: 'Two witnesses who talk end up agreeing'
        place: Interview Suite B
        scene: >-
          The first officers arrived at 21:58. For twenty minutes before that, the two witnesses
          stood together outside the shop. Their accounts agree in four places.
        guide: >-
          Four answers, and each treats the twenty minutes differently. Ask what the two of them
          could have got from each other in that time. What separates the answers is whether
          agreement can still count as two people saying the same thing.
        assumes:
          - people waiting together talk about what has just happened
        takeaway: Once two witnesses have talked, their two accounts cannot be added together.
        format: CHOICE
        question: What do the twenty minutes on the kerb do to the four agreements?
        choices:
          - They make the four agreements one account, not two
          - They change nothing, since both saw the same robbery
          - They mean neither witness can be believed at all
          - They matter only if one meant to change the other
        answer: They make the four agreements one account, not two
        rebuttals:
          - Seeing the same event is why talking is a problem — the details cross over.
          - Nothing here says either of them is wrong, only that they are not two sources.
          - Nobody has to mean it. Details cross between people who are simply talking.
        why: >-
          Two people who stand together for twenty minutes talk, and while they talk details move
          between them. After that, the things they agree on may have come from the night or from
          each other, and nobody can tell which. So four agreements stop being four pieces of
          evidence and become one, and the one cannot be taken apart again. What survives is
          whatever each of them recorded before they met — a call, a text, a note with a time on it.
      - group: PERCEPT
        task: Work out what the man behind the counter could see
        title: Looking out of a lit room
        concept: 'Light: how much there is, and what it costs you to see'
        place: Reconstruction Bay
        scene: >-
          Bekele has the bay set up from inside the shop. The counter, the window, the shop lights at
          the level the record gives. Outside the glass, the street at the light the corner had.
        guide: >-
          Write down first how big a thing the man behind the counter could make out on the street
          after two minutes. Then run the bay and measure it. His eyes have been in a lit shop, and
          eyes take a long time to get used to the dark.
        background:
          - >-
              Why eyes need time. In a bright room your eyes are set for bright light. Turn to a dark
              street and they need twenty minutes or more to catch up. Two minutes in, they are barely
              started.
          - >-
              Why the window makes it worse. A lit shop reflects in its own glass, so a layer of the
              shop's light sits on top of the street. That is why people cup their hands against a
              window to look out.
          - >-
              Why two minutes is the honest number. The statement puts him at the counter for about
              two minutes before the shout, so that is the eye to test — not one that has been in the
              dark all evening.
        assumes:
          - the eye adjusts to the general level of light it is in
        takeaway: >-
          Eyes set for a lit room are the wrong eyes for a dark street, and glass makes it worse.
        format: VERIFY
        question: >-
          How big must something on the street be before the man at the counter can make it out?
        answerText: >-
          About 0.9 metres — enough to see that somebody is there and which way they went, not enough
          for a face.
        why: >-
          Eyes take twenty minutes or more to get used to the dark, and his had two. On top of that
          the lit shop reflects in its own window, laying a veil of light over everything outside.
          Together those put his limit at about 0.9 metres at the corner — a person-sized shape moving
          in a direction. That is a real observation and it is worth having. It is simply not the kind
          of observation a face can be picked out of, and the file has been treating it as if it were.
        verify:
          prediction:
            label: Smallest detail resolvable at the corner from the counter, after two minutes
            unit: m
            min: 0.1
            max: 2.0
            step: 0.05
          truth: 0.9
          passRatio: [0.6, 1.6]
          intervention:
            label: Run the bay at the shop's interior level with the street at the corner's illuminance
            note: the observer starts at the counter after two minutes in the lit interior, looking through the glass
            outcome: The bay reaches the set levels and the observer takes the reading from the counter mark.
          measurement:
            label: Read the resolved detail from the acuity chart at the corner distance
            note: chart at 8.4 m, the corner distance from the counter
            cost: 4
            costUnit: minutes of bay time
          unmeasuredMoral: A dark-adapted threshold from a textbook is the right number for the wrong eye, and reporting it without running the bay hands the board a figure four times too optimistic.

  # ---------------------------------------------------------------- day 8
  - title: How the six were chosen
    objective: Test the array on people who were never there.
    briefing: Forty volunteers have read Cardoza's description and seen nothing else.
    stake: >-
      Tuesday, and the six photographs are on the bench. Marcus Ilori wants to know how many of
      them a witness could ever have picked. Karen Loomis, the retired detective who ran the line-
      up, says every one was chosen by the book. Today you count the real choices in the six. You
      also find out whether measuring more carefully helps at all.
    takeaway: A lineup's real size is how many of its members a stranger could plausibly pick.
    stops:
      - group: IDENT
        task: Turn the mock-witness tally into the array's real size
        title: Six photographs, and how many alternatives
        concept: 'A line-up needs choices somebody might really pick'
        place: Identification Suite
        scene: >-
          Forty strangers were shown the six photographs and the description. Twenty-six of them
          picked the same face. Marcus Ilori wants that turned into a number.
        guide: >-
          A line-up is only as big as the number of faces somebody might really pick. Work out what
          share of the forty landed on the suspect. Two tiles do it; the rest describe the line-up but
          do not go into the sum.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - a lineup member who nobody would pick from the description is not an alternative
        takeaway: >-
          Six faces on the table is not six choices. Only faces somebody might pick are choices.
        format: BALLPARK
        question: >-
          What share of the forty strangers picked the suspect from the description alone?
        answerText: >-
          Sixty-five per cent. A fair set of six would have put about seventeen per cent on each face.
        why: >-
          Nobody in this test saw the robbery. All forty had was the description, so where they land
          is a fact about the six photographs. Twenty-six out of forty is 65 per cent on one face. If
          the six had all fitted the description equally, each would have taken about a sixth, or 17
          per cent. So five of the six were never real choices, and the line-up behaved much more like
          a line-up of two. That is a problem with how it was built, not with the witness.
        estimate:
          prompt: Forty mock witnesses read Cardoza's description and were shown the 2019 array. Twenty-six of them chose Ward's photograph.
          question: Choose the number of mock witnesses and the number who landed on the suspect.
          labels:
            - 26  (strangers who picked the suspect)
            - 40  (strangers asked altogether)
            - 100  (to turn a share into a percentage)
            - 6  (photographs on the table)
            - 12  (volunteers in the reconstruction bay)
          values: [26, 40, 100, 6, 12]
          slots: 3
          template: "{0} ÷ {1} × {2}"
          formula: a/b*c
          correct: [0, 1, 2]
          target: 65
          tolerance: 4
          units: per cent
          relationship: >-
            Percentage = the part divided by the whole, multiplied by a hundred.
          solution: >-
            26 ÷ 40 × 100 = 65 per cent on one face.
          explanation: >-
            The number of photographs printed is what the line-up claims to be. This sum measures what
            it actually offered.
          givens:
            - 40 mock witnesses were shown the array
            - 26 of them chose the suspect from the description alone
      - group: MEASURE
        task: Bring the procedure inside the fair band
        title: Moving the middle is not narrowing the spread
        concept: 'Repeat a measurement and take the average'
        place: Data Room
        scene: >-
          Tomas Weill has scores for four hundred line-ups run the 2019 way. They are plotted against
          the band the unit would call fair. Most of them sit outside it.
        guide: >-
          The cloud is four hundred real line-ups. Two things are wrong with it: where the middle
          sits, and how wide it is. Some changes slide it across and some make it narrower. Then place
          the bars to say where the middle is and how far the spread reaches.
        background:
          - >-
              What the two shapes are. The band is a standard: run a fair array many times
              and this is the share of mock witnesses who land on the suspect. The cloud is
              this unit's own procedure measured the same way. A procedure whose cloud sits
              outside the band is producing identifications a fair array would not.
          - >-
              Moving and tightening are different fixes. Matching the fillers to the
              description or adding the may-not-be-present caution changes where the cloud
              sits. Running sequentially with an administrator who does not know the
              suspect, or standardising the wording and lighting, reduces how much the
              result varies between administrations. Only the second kind narrows the
              spread, and a spread wider than the band cannot be fixed by moving it.
          - >-
              Why 'defensible' is the word. This becomes a recommendation other units
              follow, and it will be read out in court. That makes the claim a claim about
              every administration rather than about the average one, which is why the
              criterion is written on the whole cloud.
        assumes:
          - a fair six-member array is picked from at about one time in six
          - a recommendation can propose changes to a procedure as well as criticise it
        takeaway: >-
          Sliding a cloud across does not make it narrower, and being narrow is half of being fair.
        format: CLOUD
        question: >-
          Get the line-ups inside the fair band, then place the bars and say when it is good enough.
        cloud:
          hint: The band is where a fair six-member array lands. The cloud is what this procedure produces across administrators and sites, not what it produces on a good day.
          bounds:
            min: 10
            max: 24
            unit: "%"
            label: Share of mock witnesses landing on the suspect
          centre: 42
          spread: 13
          pass: 0.85
          seed: 23
          costUnit: d
          actions:
            - id: fillers
              label: Rebuild the array with fillers matched to the description
              effect: shift
              amount: 15
              cost: 3
            - id: caution
              label: Add the may-not-be-present caution
              effect: shift
              amount: 8
              cost: 1
            - id: blind
              label: Show sequentially with an administrator who does not know the suspect
              effect: narrow
              amount: 0.45
              cost: 4
            - id: script
              label: Standardise the wording and the lighting across every site
              effect: narrow
              amount: 0.6
              cost: 2
          commit: Call it defensible
        answerText: >-
          Every change. Better fillers and the warning move the middle; only blind, one-at-a-time
          showing narrows the spread.
        why: >-
          Four hundred line-ups do not come out the same, and that spread is the problem. Better
          fillers and the missing warning slide the whole cloud toward fair. That helps. A wide cloud
          slid across still has plenty of runs outside the band, failing the other way instead. What
          makes it narrower is taking the officer's own knowledge out of the room. A procedure has to
          be fair every time, not on average.
      - group: PERCEPT
        task: Work out what a photograph asks the eye to do
        title: A face on paper
        concept: 'How small a thing your eye can still tell apart'
        place: Reconstruction Bay
        scene: >-
          Halina Frey has the six photographs on the bench beside a video of somebody walking. She
          wants to know what a printed face leaves out.
        guide: >-
          The four answers each name something a photograph takes away. Ask which of them you use
          without noticing when you recognise somebody in the street. A stand-in for a job is only as
          good as what it keeps.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a face is recognised from more than a single frozen view of it
        takeaway: >-
          A photograph is a stand-in for a face, and it is missing the parts you use most.
        format: CHOICE
        question: >-
          What does a set of photographs take away from recognising somebody?
        why: >-
          You almost never recognise somebody from one still view. You see them turn, walk, pull a
          face, and all of that is information about who they are. A photograph keeps one frozen angle
          and throws the rest away. That does not make photograph line-ups useless. It means they are
          a harder task than the one the witness actually did on the street, and the file should not
          treat the two as the same job.
        choices:
          - Movement, and every view of the face except one
          - Colour, which is what people use first on a face
          - Size, because a small printed face is harder to know
          - The street itself, which is what tells you who it is
        answer: Movement, and every view of the face except one
        rebuttals:
          - Colour helps a little, and people recognise faces perfectly well in grey pictures.
          - A printed face is small but sharp, and size is not what is missing here.
          - The street can suggest who somebody is, and it is not part of the face at all.
  # ---------------------------------------------------------------- day 9
  - title: Thirty-four metres
    objective: Settle the distance, and work out what it leaves of the identification.
    briefing: Bekele's survey and the case summary do not agree, and nothing on the street has moved.
    stake: >-
      Wednesday, and Dawit Bekele has surveyed the corner properly at last. He makes it thirty-
      four metres from the counter to the doorway. Every paper in the file since 2020 has said
      twenty-two. Nothing on the street has moved since 2019, so one of those numbers has always
      been wrong. Baptiste wants to know which, before the report quotes either. Today you find
      where the twenty-two came from. You also work out what the real distance does to what
      anybody could have seen.
    takeaway: The most important number in a case can be wrong for seven years because nobody ever measured it.
    stops:
      - group: MEASURE
        task: Find out where the twenty-two came from
        title: Where the twenty-two came from
        concept: 'Measure it instead of arguing about it'
        place: Records Store
        scene: >-
          The survey says thirty-four metres. Every paper since 2020 says twenty-two. The oldest
          document carrying that number is on the table, and it is a sketch.
        guide: >-
          Two numbers, and only one of them was ever measured. Ask what would have to be true for
          each answer to hold. Nothing on Ferrier Street has moved since 2019, which rules most of
          them out on its own.
        assumes:
          - a measurement is made once and then copied from document to document
        takeaway: A number with no measurement behind it does not become one by being copied.
        format: CHOICE
        question: Why do the file and the survey give different distances?
        choices:
          - The twenty-two was copied from a sketch, never measured
          - The shopfront was rebuilt between 2019 and the survey
          - The witness has changed her account of where she stood
          - The surveyor measured to the kerb rather than the doorway
        answer: The twenty-two was copied from a sketch, never measured
        rebuttals:
          - The building record shows no work on that frontage since 2011.
          - She has given the same standing place in three separate accounts.
          - The survey marks both ends on the plan, and the doorway is one of them.
        why: >-
          Nothing on that street has moved. The shop is where it was and the kerb is where it was,
          so the two numbers cannot both be measurements of the same gap. Only one of them ever
          was. The twenty-two came off a sketch marked not to scale, and was then copied forward
          for four years until it looked like a fact. Copying is not checking, however many
          documents end up agreeing with each other.
      - group: PERCEPT
        task: Work out what an eye can resolve at the surveyed distance
        title: A centimetre of face
        concept: 'How small a thing your eye can still tell apart'
        place: Reconstruction Bay
        scene: >-
          The surveyed distance is thirty-four metres, not twenty-two. Halina Frey wants the same sum
          done again with the real number in it.
        guide: >-
          Same rule as before: an eye separates about a third of a millimetre of detail for every
          metre. Two tiles do it. The old distance is on the board so you can see what changed.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - an eye in good light resolves details about one arc minute across
          - one arc minute is about 0.0003 radians
        takeaway: >-
          Twelve extra metres does not add a little blur. It changes what could be seen at all.
        format: BALLPARK
        question: >-
          What is the smallest detail an eye can separate at the surveyed distance?
        answerText: >-
          About 10 millimetres — a centimetre. At twenty-two metres it was 6.6, so the limit is half
          as good again.
        why: >-
          At thirty-four metres the smallest thing an eye can separate is about a centimetre. A scar,
          an eyebrow, the line of a mouth are all smaller than that. At that range they are not
          visible as separate things at all, and this was a doorway at twelve lux. Nothing on the
          street changed the day the survey was done. What changed is that the file had been
          describing an easier job than the one she was given.
        estimate:
          prompt: The survey puts the doorway 34 m from where Cardoza stood. An eye in good light resolves about one arc minute, which is 0.0003 radians.
          question: Choose the eye's resolution limit and the distance it is being applied over.
          labels:
            - 34  (metres, the surveyed distance)
            - 0.3  (millimetres of detail for every metre away)
            - 22  (metres, the distance the summary recorded)
            - 63  (millimetres between the eyes of a face)
            - 12.5  (lux, the corner with the lamp working)
          values: [34, 0.3, 22, 63, 12.5]
          slots: 2
          template: "{0} × {1}"
          formula: a*b
          correct: [0, 1]
          target: 10.2
          tolerance: 1.2
          units: millimetres
          relationship: >-
            Smallest detail in millimetres = the distance in metres multiplied by 0.3.
          solution: >-
            34 × 0.3 = about 10 millimetres, a centimetre.
          explanation: >-
            The old twenty-two metres gives a smaller answer, which is exactly why the file looked
            better than the street was.
          givens:
            - The surveyed distance is 34 m
            - An eye in good light resolves about 0.0003 radians
      - group: IDENT
        task: State what the corrected distance licenses the review to say
        title: What this does and does not settle
        concept: 'What a report may say, and what it may not'
        place: Identification Suite
        scene: >-
          The draft report is on the table. Four sentences in it are marked. Two are measurements and
          two are conclusions about a person.
        guide: >-
          Four sentences from the draft, all signed off by somebody. Open them and see what is behind
          each. You can check three. Hold the ones the review's own evidence cannot carry.
        background:
          - >-
              What a limit on perception establishes. That the identification could not have been made
              the way the file says it was — a claim about the procedure and the conditions. It does
              not establish who was on Ferrier Street, and no measurement of light or distance can,
              because absence of sufficient information is not information about the answer.
          - >-
              Why the distinction decides the sentence. "The conditions could not support a recognition
              at that distance" is what the review has evidence for. "Ward was not there" is a
              different claim, resting on evidence nobody in this building has, and a report that
              slides from the first to the second loses everything the first one earned.
          - >-
              What retrieval adds. A recognition is reconstructed at the moment of asking rather than
              replayed, so a confident identification made under conditions that could not support it
              is exactly what the mechanism predicts. Confidence is not a check on the conditions, and
              a witness's certainty is not evidence that the conditions were adequate.
        assumes:
          - a limit on what could be seen is not evidence about who was there
        takeaway: >-
          Showing somebody could not have seen a face is not the same as showing who was there.
        format: ATTEST
        question: >-
          Three can be checked this afternoon. Hold whatever the evidence cannot carry.
        answerText: >-
          The two about people. Everything the review measured is about a corner, and a corner has no
          opinion about who walked round it.
        why: >-
          The measurements are solid. Thirty-four metres and twelve lux were both taken properly and
          both would come out the same tomorrow. What they establish is what that corner allowed
          anybody to see. They do not establish who walked out of the shop, and they cannot. A report
          that slides from the first kind of sentence to the second sounds stronger and is far easier
          to knock down.
        attest:
          checks: 3
          moral: Every measurement here is a fact about the corner. A fact about the corner is not a fact about who walked around it.
          claims:
            - id: distance
              label: The doorway is 34 metres from where she stood
              signedBy: Bekele, on site
              evidence: measured twice, and marked on the floor of the hall
              critical: true
              backed: true
            - id: lux
              label: The corner had about 12 lux that night
              signedBy: Bekele, on site
              evidence: a meter reading, with the lamp records to match it
              critical: true
              backed: true
            - id: notthere
              label: Ward was not the man on Ferrier Street
              signedBy: the draft's third paragraph
              evidence: rests on what an eye can see, which says nothing about who was there
              critical: true
              backed: false
            - id: mistaken
              label: The witness was mistaken about what she saw
              signedBy: the draft's fourth paragraph
              evidence: nothing measured at the corner reaches what she did or did not see
              critical: true
              backed: false
  # ---------------------------------------------------------------- day 12
  - title: The nineteenth hour
    objective: Read the interview that produced the only words the file has from Ward.
    briefing: Nineteen hours in custody, no lawyer, and an agreement retracted the next morning.
    stake: >-
      Thursday, and Priya Raghunathan has the shift records. Alma Cardoza had been awake nineteen
      hours when she was first asked anything. Samuel Oyelaran says that explains the gaps in her
      account without making it dishonest. Today you work out what nineteen hours does to what a
      person notices. You also decide whether a cheaper test would answer the same question.
    takeaway: An admission is evidence about the interview as well as about the event, and the interview is on the record.
    stops:
      - group: BRAIN
        task: Move the cognitive-control assumption to its pessimistic end, then choose the evidentiary treatment that remains defensible.
        title: What survives the bad end of nineteen hours
        concept: 'Being tired, frightened or hurt changes what you notice'
        place: Physiology Bay
        scene: >-
          Priya Raghunathan has the custody clock and the shift records. Ward had been awake nineteen
          hours when he agreed with the officer's account at twenty past one.
        guide: >-
          Nobody knows exactly how far gone he was. Slide the dial to the worst end of what nineteen
          hours does and see which of the ways of using that agreement still works. A choice that only
          survives at the kind end of the range is not a choice you can defend.
        background:
          - >-
              What nineteen hours does. Sustained wakefulness degrades the ability to weigh
              distant consequences against immediate relief long before it affects speech or
              memory of ordinary facts. A person can be lucid, cooperative and articulate
              while being much worse at judging what agreeing now will cost later.
          - >-
              Why the range is the question. Nobody can measure what Ward's control was at
              01:20. The evidence gives a range, and a review that picks the middle of it
              has made an assumption it cannot defend. Testing at the bad end is what turns
              an untestable claim into a decidable one.
          - >-
              What survives, and what does not. Treatments that rely on the admission being
              a considered decision fail at the pessimistic end. Treatments that use it as
              one item among others, weighted by the conditions it was made in, hold — which
              is why the answer is about how to use it rather than whether to believe it.
        assumes:
          - the ability to weigh a future consequence against a present one degrades without sleep
        takeaway: >-
          A decision you can defend is one that still works at the bad end of what you do not know.
        format: STRESS
        question: >-
          How should the review use the one-twenty agreement, if he was at the worst end of nineteen
          hours?
        stress:
          hint: Move cognitive-control reserve down to twenty. The quick treatment is the one that counts the agreement as corroboration; the question is which one is still defensible when his reserve was at the bad end of the range.
          assumption:
            id: control_reserve
            label: Cognitive-control reserve
            min: 20
            max: 100
            step: 10
            nominal: 70
            unit: index
          criteria:
            - id: no_false_independence
              label: Does not count an officer-supplied account as independent knowledge
              operator: ">="
              target: 1
              key: no_false_independence
            - id: no_state_verdict
              label: Does not treat sleep loss itself as proof of truth or falsity
              operator: ">="
              target: 1
              key: no_state_verdict
            - id: closure_days
              label: Working days to a board-ready conclusion
              unit: days
              direction: lower_is_better
              key: closure_days
          candidates:
            - id: rely
              label: Treat the agreement as independent corroboration
            - id: corroborate
              label: Use only independently corroborated details Ward supplied himself
            - id: discard
              label: Discard the agreement solely because he was exhausted
            - id: withdrawal
              label: Treat the morning withdrawal as proof the agreement was false
          robust: corroborate
          optimiseOn: closure_days
          feasible:
            rely: 70
            corroborate: 20
            discard: 110
            withdrawal: 110
          scores:
            rely:
              no_false_independence: 0
              no_state_verdict: 1
              closure_days: 2
            corroborate:
              no_false_independence: 1
              no_state_verdict: 1
              closure_days: 9
            discard:
              no_false_independence: 1
              no_state_verdict: 0
              closure_days: 3
            withdrawal:
              no_false_independence: 1
              no_state_verdict: 0
              closure_days: 4
        answerText: >-
          Ask for something else to back up anything he said himself. It is the only choice that still
          holds at the bad end.
        why: >-
          Nineteen hours awake makes people agree with whatever gets them out of the room, and nobody
          can now measure how tired he actually was. So the honest move is to pick the option that
          survives the worst case. Treating his agreement as proof fails there. So does treating it as
          proof he was lying — tiredness makes an account unreliable, not false. What survives is
          asking for something else to back it up, which costs the review nothing if he was fine.
      - group: SOCIAL
        task: Name what the officer's version of the account offered
        title: What nineteen hours does to a score
        concept: 'Repeat a measurement and take the average'
        place: Deliberation Room
        scene: >-
          Samuel Oyelaran ran the same memory test on five volunteers after nineteen hours awake.
          Their scores are on the board. Rested, people score about 80.
        guide: >-
          Five scores, and one of them is much lower than the rest. Work out what the five come to on
          average. Two tiles do it. The rested score is there to compare against, not to add in.
        background:
          - >-
              What minimisation does. It lowers the apparent cost of admitting, by offering a version
              of events that sounds partial, reluctant and forgivable. Maximisation raises the apparent
              cost of denying, by presenting conviction as near-certain. Together they change the
              arithmetic a person is doing without changing anything about what they did.
          - >-
              Why the arithmetic is what matters and not the person's character. For an innocent
              person, admitting a lesser version at an apparent nine months against an apparent
              near-certain eight years is a rational trade at that moment, in that room, on those
              numbers. That is the mechanism, and it does not require anybody to be weak or confused.
          - >-
              Why the numbers were not real. The law does not price a minimised account the way the
              interview room did: going along with a robbery in which a weapon was carried attracts a
              sentence in the same band as planning it. So the trade offered was between a real eight
              years and an imaginary nine months, and only one side of it was ever going to arrive.
        assumes:
          - people admit more readily to a version that costs them less
        takeaway: >-
          One reading can be odd by luck, so several are taken and averaged before anybody argues.
        format: BALLPARK
        question: >-
          What did the five tired volunteers average on the memory test?
        answerText: >-
          58 out of 100. Rested people score about 80, so nineteen hours costs roughly a quarter of
          the score.
        why: >-
          The five scores are 71, 64, 58, 61 and 36. Read one at a time they say almost anything you
          like — the 36 looks alarming and the 71 looks fine. Added and divided by five they come to
          58, and that is the number worth comparing with the rested 80. Averaging does not hide the
          odd one out. It stops any single reading, high or low, from carrying an argument on its own.
        estimate:
          prompt: Five volunteers took the same memory test after nineteen hours awake. They scored 71, 64, 58, 61 and 36 out of 100.
          question: Choose the total of the five scores and the number of volunteers.
          labels:
            - 290  (the five scores added together)
            - 5  (volunteers who took the test)
            - 80  (what rested people score, for comparison)
            - 36  (the lowest single score)
            - 19  (hours they had been awake)
          values: [290, 5, 80, 36, 19]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 58
          tolerance: 2
          units: out of 100
          solution: >-
            290 ÷ 5 = 58 out of 100, against about 80 rested.
          explanation: >-
            The rested score is what you compare the average with. The lowest single score is the reason
            for averaging in the first place.
          givens:
            - five volunteers, tested after nineteen hours awake
            - rested people score about 80 on the same test
          relationship: >-
            Average = the readings added together, divided by how many there are.
      - group: MEMORY
        task: Find out what a re-interview after years actually records
        title: What Aktaş remembers now
        concept: 'How sure somebody is, and when they said it'
        place: Interview Suite B
        scene: >-
          Aktaş was interviewed again in 2023, four years on. His 2019 statement is in the file.
          Solomon has both, and nobody has compared them yet.
        guide: >-
          Write down first what share of the 2019 details you think still appear in 2023. Then run the
          comparison, then spend the reading time to count what actually survived. Predicting first is
          what makes the count able to surprise you.
        background:
          - >-
              What the forgetting curve does. Retention falls fast at first and then flattens, so the
              difference between four years and four months is much smaller than the difference between
              four months and four days. An account four years old is not four years' worth of decay; it
              is a few weeks' decay and then a long plateau.
          - >-
              Why the new details are the finding. Four particulars appear in 2023 that are not in the
              2019 statement, and every one of them is somewhere in the public record — the paper, the
              appeal coverage, the campaign. Memory does not tag a detail with where it came from, so
              they are held with the same confidence as everything else.
          - >-
              What follows for the decision. A fresh interview cannot recover the 2019 account, because
              nothing subtracts what has arrived since. It can only produce a 2023 account, and the
              unit already has one. The 2019 statement is the evidence; a re-interview adds a document
              about the intervening four years.
        assumes:
          - an account can be compared with an earlier account by the same person
        takeaway: >-
          An account given years later holds everything the person has met since, and none of it is
          labelled.
        format: VERIFY
        question: >-
          What share of the 2019 details does the 2023 interview still contain?
        answerText: >-
          About 70 per cent — and four details arrive that were never in 2019, each of them findable
          in the newspapers.
        why: >-
          Some of an account fades, which surprises nobody. The interesting half is the other
          direction: four details that were not there in 2019 are there in 2023, and every one of them
          appeared in public somewhere in between. He is not making them up. He met them, and they
          were stored beside the real ones with no label saying where they came from. That is why a
          later account cannot be used to check an earlier one.
        verify:
          prediction:
            label: Share of the 2019 particulars still reproduced in 2023
            unit: per cent
            min: 20
            max: 100
            step: 5
          truth: 70
          passRatio: [0.75, 1.3]
          intervention:
            label: Compare the 2023 interview against the 2019 statement, particular by particular
            note: both documents are in the file; the comparison is done blind to which is which by a second reader
            outcome: The comparison completes and the two accounts are matched item by item, with additions listed separately.
          measurement:
            label: Read off the surviving share and the list of additions
            note: 23 particulars in the 2019 statement
            cost: 2
            costUnit: hours of reading
          unmeasuredMoral: Predicting the loss and never running the comparison misses the whole finding, because the loss was the predictable half. What a re-interview adds is only visible by looking.

  # ---------------------------------------------------------------- day 15
  - title: Disposition
    objective: Say what the review holds, how strongly it holds each part, and what it does not claim.
    briefing: One page to the board, and every sentence on it has to survive being argued with.
    stake: >-
      Friday, and the report goes to the board at five. Baptiste wants a recommendation. Okada
      wants every sentence to say what is behind it. Ward is thirty-four, and if the board says
      no, nobody looks at this again until 2033. Today you decide what each sentence of the report
      can stand on. You also decide what the report may not claim at all.
    takeaway: A review that says only what it can support is the only kind a board can act on.
    stops:
      - group: SOCIAL
        task: Match each claim to what stands behind it.
        title: What stands behind each sentence
        concept: 'What a report may say, and what it may not'
        task: >-
          Match each sentence to what stands behind it
        place: Deliberation Room
        scene: >-
          The report is drafted. Baptiste wants every sentence in it matched to the kind of evidence
          standing behind it, before it goes anywhere.
        guide: >-
          Three sentences from the draft, and three kinds of backing. Match each to what would happen
          if somebody asked you to prove it. One of them cannot be proved by anything the review did.
        background:
          - >-
              Why explanations rather than labels. Naming a finding is not accounting for
              it, and a plausible-sounding mechanism attached to the wrong observation is
              the commonest way a wrong story survives. Committing an explanation to one
              clue means claiming it accounts for that clue specifically and not for its
              neighbour, which is where the two come apart.
          - >-
              How to use the one-each rule. The explanations are a set to be distributed,
              not a list to be sampled, so every join constrains the rest. Settling the two
              you are confident of can decide the remaining pair by elimination. Where it
              does not, two explanations are still competing for one clue, and that
              competition is the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every explanation used once,
              three correct joins leave the fourth with only one place to go. Any error
              therefore involves at least two. That is worth remembering when the last pair
              looks forced: the fault is usually not in the join you are struggling with,
              but in one you made early and stopped questioning.
        assumes:
          - claims of different kinds cannot be defended in the same way
        takeaway: >-
          Every sentence in a report is answerable in some particular way, or it should not be in it.
        format: CASEBOOK
        why: >-
          Two of these can be answered with a method. Ask how the thirty-four metres is known and
          there is a survey and a plan; ask about the one and a half and there are forty strangers who
          can be asked again next week. The third has no method behind it, because the review never
          looked for one. It looked at what the corner allowed and how the line-up was built. Leaving
          that sentence in makes every other sentence easier to attack.
        scenarios:
          - The doorway is 34 metres from where she stood
          - The line-up offered about one and a half real choices
          - Elias Ward was not the man who came out of the shop
        choices:
          - Measured on the ground, and checked against a separate plan
          - Measured on strangers, and repeatable again next week
          - Not established by anything here, and not what this review is for
        mapping: [0, 1, 2]
      - group: IDENT
        task: Settle what the recommendation actually asks for
        title: What the board is being asked to do
        concept: 'What a report may say, and what it may not'
        place: Identification Suite
        scene: >-
          The recommendation is the last thing to write. Baptiste and Okada want different words in
          it, and the report goes at five.
        guide: >-
          Four recommendations, each claiming more or less than the last. Ask which one the review's
          own evidence could still hold up if somebody argued with it. Claiming more than you can
          carry is how a good report gets thrown out whole.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a review recommends a course of action rather than reaching a verdict
        takeaway: >-
          A recommendation should claim no more than the evidence behind it can carry.
        format: CHOICE
        question: >-
          What should the report ask the board to do?
        why: >-
          The review measured a corner and took a line-up apart. That is enough to say one
          identification cannot hold a conviction up on its own. It is not enough to say he did not do
          it, because nothing here looked at that. The strongest report says exactly what it can
          prove. A report that reaches further gets argued about instead of acted on, and Ward waits
          while that happens.
        choices:
          - Send the conviction back, because one identification cannot carry it
          - Free him, because the review has proved the identification wrong
          - Keep the finding to Ward, and say nothing about the 2019 line-up
          - Note the worries and wait for new evidence about the robbery
        answer: Send the conviction back, because one identification cannot carry it
        rebuttals:
          - Nothing here proves the identification wrong; it shows the corner could not support it.
          - >-
              The line-up was run the same way in other cases, so leaving it out hides the real
              finding.
          - >-
              Waiting for new evidence about a 2019 robbery is waiting for something that will not
              come.
      - group: PERCEPT
        task: Say which findings need nobody
        title: What holds if everybody withdraws
        concept: 'Measure it instead of arguing about it'
        place: Reconstruction Bay
        scene: >-
          Okada asks the last question of the fortnight. If every witness changed their mind
          tomorrow, what would the report still have in it?
        guide: >-
          Match each finding to what would happen to it. Ask of each whether somebody who has never
          heard of this case could check it next year without asking anybody to remember anything.
        assumes:
          - a measurement can be repeated by somebody who was not there
        takeaway: The findings that need no witness are the ones still there next year.
        format: PROTOCOL
        task: Match each finding to what happens if the witnesses withdraw.
        scenarios:
          - The doorway is 34 metres from where she stood
          - The line-up offered about two real choices
          - The two accounts agree in four places
        choices:
          - Unchanged — a tape measure has no opinion
          - Unchanged — forty strangers can be asked again
          - Gone, along with the people who gave them
        mapping: [0, 1, 2]
        why: >-
          A tape measure does not change its mind, and neither do forty strangers who were never
          there in the first place. Both of those findings can be produced again next year by
          somebody who has never heard of Elias Ward. The agreements cannot: they exist only while
          two people are still willing to say the same thing. That is not a reason to throw them
          away. It is a reason to build the report on the parts that do not move.

lessons:
  - group: PERCEPT
    title: How much light the corner had — Review
    concept: 'Light: how much there is, and what it costs you to see'
    task: Apply the inverse square where the source is not the one you expect
    place: Reconstruction Bay
    scene: >-
      Frey asks the same question a different way. A witness steps ten metres further back from
      the doorway. Nothing else in the street changes.
    guide: >-
      Three of the four answers move the light because the person moved. Ask what the light on a
      doorway actually depends on. Where somebody stands to watch is a different question with a
      different answer.
    assumes:
      - illuminance depends on the distance from the source to the surface being lit
    takeaway: Illuminance belongs to the surface and the source; where anybody stands to look is a separate calculation.
    format: CHOICE
    question: A witness steps ten metres further back from the doorway. What happens to the light on the doorway?
    choices:
      - Nothing — the lamp sets it, not where she stands
      - It falls by a third, since she is further away
      - It falls by a quarter, because distance doubled
      - It rises, because her eyes get used to the dark
    answer: Nothing — the lamp sets it, not where she stands
    why: >-
      Light on a doorway depends on the lamp and on how far the lamp is from the doorway. A person
      watching is not part of that. Walking backwards changes what her eye can separate, which is
      a real cost and a different sum. Mixing the two is the easiest mistake in this material,
      because both feel like further away means worse. One takes detail out of the scene. The
      other takes it out of the eye.
    rebuttals:
      - Her distance changes what she can make out, not what the doorway is lit by.
      - A quarter would be right if the lamp had moved twice as far, and it did not.
      - Her eyes do adjust, and the doorway is exactly as bright either way.
  - group: MEMORY
    title: Six seconds, and what they hold — Review
    concept: 'Memory is rebuilt each time, not played back'
    task: Decide what a longer viewing would and would not have bought
    place: Interview Suite A
    scene: >-
      Okada turns the question round. Suppose the file said sixteen seconds instead of six. What
      could the review say then?
    guide: >-
      Four things a longer look might prove. Ask of each whether time says what was possible or
      what actually happened. More seconds buy more attention, and where attention went is a
      separate question.
    assumes:
      - attention selects part of a scene at a time
    takeaway: More time helps only if the extra time was spent on the face, and no witness can report how it was spent.
    format: CHOICE
    question: What would a longer reported viewing time actually establish?
    choices:
      - That more could be taken in, not that it was
      - That the identification would be reliable whatever the light
      - That she had time to compare him with somebody she knew
      - That the account would contain fewer mistakes overall
    answer: That more could be taken in, not that it was
    why: >-
      Time is an opportunity, not a result. Sixteen seconds would mean more could have been taken
      in. Where the attention actually went is still set by what was moving and what was
      frightening. So a long viewing time cannot rescue an identification made past what the eye
      can separate, and a short one does not sink it on its own. This is why the review asks what
      the distance allowed before it asks how long she looked.
    rebuttals:
      - >-
          Time cannot fix a distance problem: the detail is still too small to see.
      - Nothing in the file says she was comparing him with anybody.
      - Longer looks do not automatically give tidier accounts.
  - group: IDENT
    title: Six at once — Review
    concept: 'Saying the person might not be there at all'
    task: Say what changes when the faces arrive one at a time
    place: Identification Suite
    scene: >-
      Ilori sets the same six photographs out again, this time face down, to be turned over one at
      a time.
    guide: >-
      Showing faces one at a time changes the question the witness is answering. Ask what it takes
      away from her. Three of the answers name things she still has.
    assumes:
      - a witness shown several faces together can compare them
    takeaway: Sequential presentation removes the comparison, so each face has to be answered against the memory instead of against the others.
    format: CHOICE
    question: What does showing the photographs one at a time take away from the witness?
    choices:
      - The chance to pick whichever face is closest
      - The chance to see them all before deciding
      - The chance to say why she picked that face
      - The record of how long she spent on each
    answer: The chance to pick whichever face is closest
    why: >-
      Six faces on a table invite a comparison, and a comparison always has a winner. Turned over
      one at a time, each face gets its own question: is this him, yes or no. That question can be
      answered no six times, which the first version never really allows. She has not lost any
      information — she still sees every photograph. What she has lost is the option of picking
      the nearest one when none of them is the man.
    rebuttals:
      - She still sees all six, one after another, and can say so.
      - She can explain a choice either way, and is asked to.
      - The times are recorded in both versions of the procedure.
  - group: PERCEPT
    title: What the dark takes — Review
    concept: 'Light: how much there is, and what it costs you to see'
    task: Say what survives when the light goes
    place: Reconstruction Bay
    scene: >-
      Frey sets the bay to three different light levels and asks the same volunteer the same
      questions at each of them.
    guide: >-
      Match each light level to what a witness there can still report. What goes first is colour
      and fine detail. What lasts longest is shape and movement.
    assumes:
      - the eye works differently in bright light and in near darkness
    takeaway: Poor light does not make a witness unreliable. It changes which questions they can answer.
    format: PROTOCOL
    task: Match each light level to what a witness can still report.
    scenarios:
      - A lit shop aisle, about 500 lux
      - The corner with its lamp working, about 12 lux
      - The same corner with the lamp out, about 2 lux
    choices:
      - Colour, fine detail, and a face well enough to describe
      - Build, clothing and movement, but no small facial detail
      - That somebody is there, and which way they went
    mapping: [0, 1, 2]
    why: >-
      Eyes have two systems. The bright-light one gives colour and fine detail; the dark one gives
      neither, and it is all you have at two lux. So the same person is a good witness to different
      things at each level. At the corner that night, movement and direction were reportable and a
      face was not. Asking a witness for something the light never made available is how a file
      ends up with a detail nobody could have seen.
  - group: SOCIAL
    title: What a clean file would look like — Review
    concept: 'A fair test changes one thing and holds the rest'
    task: Apply the standard the room wrote down on the first morning
    place: Deliberation Room
    scene: >-
      Baptiste asks what the unit gains from having written its standard down two weeks ago, now
      the findings are in.
    guide: >-
      Four things the written standard might buy. Ask which of them somebody outside the unit
      could see for themselves. A check other people can repeat is worth more than a promise.
    assumes:
      - a standard agreed in advance can be compared against afterwards
    takeaway: A standard written before the reading turns the report into a comparison anybody can repeat.
    format: CHOICE
    question: What does the review gain by comparing the file against a standard it wrote first?
    choices:
      - A reader can check the work without trusting the team
      - The findings are harder for the sponsor to overrule
      - The team argues less about individual documents
      - The report can be finished faster at the end
    answer: A reader can check the work without trusting the team
    why: >-
      Anybody reading this report can look at the standard, look at the file, and do the
      comparison themselves. They do not have to trust the unit, because they can check. That is
      the whole value. It only works because the standard was written before anybody knew which
      way the findings would fall. Written afterwards it would prove nothing at all.
    rebuttals:
      - Anybody can overrule a report; a written standard just makes the reason visible.
      - The team argues either way, and now they argue about the standard.
      - It saves no time at all, and that is not why it is done.
  - group: MEASURE
    title: A word where a reading should be — Review
    concept: 'Measure it instead of arguing about it'
    task: Rank three entries by how checkable they are
    place: Records Store
    scene: >-
      Weill has three lines copied out of three different reports. He wants them sorted by how much
      of each could be checked today.
    guide: >-
      Match each entry to what somebody could do with it now. A number and a unit mean the same
      thing to a stranger next year. A comparison only means something while you can still see what
      it was compared with.
    assumes:
      - a unit tells a reader what a number is counting
    takeaway: A number carries its meaning with it. A comparing word leaves the other half behind.
    format: PROTOCOL
    task: Match each entry to what can still be done with it.
    scenarios:
      - "About two metres from the door"
      - "The lighting was well up"
      - "The usual sort of fitting"
    choices:
      - Measure the same gap again and compare the two
      - Nothing — whatever it was compared with has gone
      - Ask what was usual then, and hope somebody recalls
    mapping: [0, 1, 2]
    why: >-
      A measurement has a number and a unit, and both travel. Two metres means the same thing to
      somebody reading it in ten years. "Well up" and "the usual sort" are comparisons, and the
      thing each was compared with is gone. It does not matter that all three were written by
      honest people. One of them can be checked and the other two cannot, and a report has to say
      which is which.
  - group: IDENT
    title: What the first description constrains — Review
    concept: 'A line-up needs choices somebody might really pick'
    task: Say what the file does not record about the witness and the man
    place: Identification Suite
    scene: >-
      Ilori has the first description on one side and the six photographs on the other. Four of
      the six do not match the description at all.
    guide: >-
      A line-up only works if the faces in it fit what the witness said. Ask what it means when
      most of them do not. The problem is with the line-up rather than with the witness.
    assumes:
      - people differ in how much experience they have of particular faces
    takeaway: Telling faces apart is a practised skill, and a review can only report what was measured about it.
    format: CHOICE
    question: What does the cross-race effect require the review to note about this identification?
    choices:
      - Four of the six were never real choices
      - The witness described the man badly
      - The description should be rewritten to fit
      - Nothing, as long as six photographs were shown
    answer: Four of the six were never real choices
    why: >-
      The first description is the standard every filler has to meet. A face that plainly does not
      fit it is not a choice — nobody would pick it, so it is only making the line-up look bigger
      than it is. Here four of the six fail that test, which leaves a real line-up of two. The
      description did its job. The people picking the photographs did not.
    rebuttals:
      - >-
          Her description was specific enough to rule four faces out, which is the opposite of
          bad.
      - Rewriting a description after the event is how a line-up stops testing anything.
      - Six photographs of which four are impossible is a line-up of two.
  - group: BRAIN
    title: What nineteen hours takes away — Review
    concept: 'How sure somebody is, and when they said it'
    task: Weigh how vivid a memory feels against how accurate it is
    place: Physiology Bay
    scene: >-
      Raghunathan asks about a memory that feels completely clear. Cardoza has said hers is like a
      photograph.
    guide: >-
      Four things a very clear feeling might tell you. Ask whether anybody has ever measured how
      well that feeling matches being right. Feeling sure and being correct are two different
      things to measure.
    assumes:
      - people can report how clear a memory feels to them
    takeaway: Vividness and accuracy are separately measurable, and studies that measure both find them barely related.
    format: CHOICE
    question: What does a memory feeling photographic tell you about its accuracy?
    choices:
      - Very little — the two barely track each other
      - That the event mattered enough to be stored well
      - That the memory has been gone over many times
      - That she is rebuilding rather than remembering
    answer: Very little — the two barely track each other
    why: >-
      People have measured this. They ask how sure somebody is, then check how right they were,
      over thousands of cases. The two lines barely follow each other. A memory can feel like a
      photograph and be wrong in places, and a hesitant one can be right. So she was completely
      certain is a fact about how it felt, not a fact about the night — which is why the date it
      was first recorded matters more than the word.
    rebuttals:
      - Big events are remembered vividly and still lose detail like any other memory.
      - Rehearsal does make memories feel clearer, and that is not what the option claims.
      - Everybody rebuilds every memory, so this says nothing about this one.
  - group: MEMORY
    title: The order an account is taken in — Review
    concept: 'The question changes the answer'
    task: Work out what asking the same question twice does
    place: Interview Suite B
    scene: >-
      Okada counts how many times the same detail was asked about in the 2019 interview. It is
      nine.
    guide: >-
      Four reasons repetition might damage an account. Ask what a witness thinks when the same
      question comes round again. What the answer costs is the witness's own version.
    assumes:
      - a question can be asked more than once about the same detail
    takeaway: >-
      Asking again and again teaches a witness that something else was wanted.
    format: CHOICE
    question: Why does asking about the same detail nine times damage the account?
    choices:
      - It signals the first answer was not the one wanted
      - Each retelling wears the memory away to nothing
      - The witness gets annoyed and stops helping
      - Later answers are written down less carefully
    answer: It signals the first answer was not the one wanted
    why: >-
      Ask somebody the same thing nine times and they work out that the first answer was not what
      you were after. So they change it — not to lie, but to be helpful. The new answer then gets
      stored beside the old one with nothing to mark which came from the night. That is why an
      interview asks once, and asks openly, and why an account taken before all that questioning
      is worth more than any taken after it.
    rebuttals:
      - Retelling changes a memory rather than erasing it, which is worse.
      - Some witnesses do get annoyed, and the damage happens to the helpful ones too.
      - The recording is just as careful; what changed is what was said.
# What each place says when the player reads it.
# --------------------------------------------------------------- the warm-ups
warmups:
  greet:
    title: A unit assembled for one case, and the review starts Monday
    why: >-
      The unit is a psychologist, a vision scientist, two lawyers and a retired detective. None of
      them has worked a case with the others before. Grace Ntuli, who runs the deliberation
      studies, wants you known to as many of them as you can before the file is opened. Every
      finding here depends on one of them believing what another one measured.
  trial-near:
    title: Walk the hall, and the corner they rebuilt in it
    why: >-
      One long hall, with the Ferrier Street corner rebuilt across the end of it. The distance is
      painted on the floor. Walk it once before anybody starts arguing about numbers. The whole
      review turns on what could be seen from one spot in one light, and standing on the mark is
      worth more than reading about it.
  follow:
    title: Walk the route the witness walked, at her pace
    why: >-
      Cardoza came out of the shop, crossed to the corner, and stopped. Dawit Bekele, the
      reconstruction technician, walks that route once this morning. Stay behind him the whole
      way. Anybody walking in front is standing exactly where the argument is, and the run has to
      be done again.
  hunt:
    title: Six pieces of the 2019 file, and the box holds four
    item: { name: file piece, plural: file pieces }
    why: >-
      The line-up form, the custody log, two statements, the light survey and an officer's
      notebook. Four of the six are in the box. Until the other two turn up, the unit cannot say
      whether the rules were followed or whether the paperwork is simply missing. Those are very
      different findings.
  canvass:
    title: Who on Ferrier Street was actually asked in 2019
    why: >-
      The file names two witnesses. There were more people than that on the street. Ask along the
      road until enough answers have come back to tell the difference. Nobody else saw anything is
      one thing. Nobody else was ever asked is another, and only one of them is anybody's fault.
  evade:
    title: The campaign spokesman who wants a line before the report
    why: >-
      He has been outside the hall since eight, wanting something quotable about the light
      measurement. Half a finding in a newspaper is a finding the board can no longer weigh
      calmly. Ines Baptiste, the unit director, will talk to him herself on Friday. Keep out of
      his way until then.
  tag:
    title: Catch Bekele before the bay is reset
    why: >-
      Dawit Bekele, the reconstruction technician, has the meter log from this morning's run at
      the corner's own light level. The bay is being reset in ten minutes for the afternoon. Once
      the lamps are changed the run cannot be repeated, and that log is the only record it was
      ever held there.
copy:
  PERCEPT: <p>The reconstruction bay. Ferrier Street at full size, built to the survey rather than to the photographs, with the lamps on a dimmer that reads in lux. The mark on the floor is where the witness stood.</p>
  MEMORY: <p>The interview suites. One-way glass, two chairs, a recorder with a visible clock, and a rule on the wall about who else may be in the room.</p>
  IDENT: <p>The identification suite. The 2019 array, the form it was recorded on, and the rig the unit uses to run volunteers through both procedures.</p>
  BRAIN: <p>The physiology bay. Custody logs on one screen, a dark adaptation booth through the door, and the clock that turns an interview transcript into a state.</p>
  SOCIAL: <p>The deliberation room. Twelve chairs and a camera. Nobody in here decides anything about anybody, and it is said out loud before every session.</p>
  MEASURE: <p>The data room and the store behind it. Norms, reliability coefficients, and a file that has been kept in the order it arrived because a tidy file is an edited one.</p>
  INT2: <p>The second interview suite. Kept free for the recordings that are only listened to, and the clock on its recorder has been four minutes fast since March.</p>
  BOOTH: <p>The dark adaptation booth. A bench, a chart on the far wall, and twenty minutes. Everybody who works here has sat in it and everybody was surprised by how long it took.</p>
  QUIET: <p>The quiet room. The only room in this building where nobody is being reviewed, and the only one with a rule against talking about a case.</p>
  BAYE: <p>The survey and equipment store. Tripods, levelling staffs, lamp channels and a lux meter that is signed out more often than anything else on the shelf.</p>
  OBS: <p>The observation room, behind one-way glass. The glass is one way and the wall is not, which is written on a card by the door.</p>
  RECS: <p>The records store. Three hundred and eighteen boxes in the order they arrived, four destruction requests refused, and the refusals filed in box twelve.</p>

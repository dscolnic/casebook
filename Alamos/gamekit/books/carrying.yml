      worst pound-for-pound choice. Hollis will take them for nothing. He returns them as the only deep topsoil
      on the island. A stream with a local use is not a waste stream.
    - What the ferry's own arithmetic adds. Every tonne shipped is a tonne of fuel burnt across the crossing, and
      the island counts that in its own emissions because the sailing is made for it. The cheapest stream to remove
      by volume is not automatically the best one to remove overall.
    assumes:
    - the ferry's charge is per tonne regardless of what the tonne is
    takeaway: A tip runs out of volume and a ferry charges for mass, and the two rank the streams differently.
    format: PROTOCOL
    columns:
    - The stream
    - What to do with it
    scenarios:
    - Plastic packaging — light, bulky, does not compact
    - Glass — heavy, compacts to a fraction of its volume
    - Compostables — heaviest and wettest of the four
    - Scrap metal — heavy, dense, and worth money on the mainland
    choices:
    - 'Send it: the most volume removed per pound of freight.'
    - 'Crush it and keep it: cheap to store once compacted, expensive to send.'
    - 'Give it to the market garden: a local use makes it not a waste stream.'
    - 'Send it: the crossing is paid for by what the scrap sells for.'
    mapping:
    - 0
    - 1
    - 2
    - 3
    rebuttals:
    - Plastic is the volume problem and the lightest thing to send, so it is the cheapest volume the island can
      buy back.
    - Glass compacts to almost nothing, so keeping it costs little volume and shipping it costs a lot of weight.
    - Compostables are the worst pound-for-pound freight and the one stream with a use on the island.
    - Scrap pays for its own crossing, which is the only stream that does.
    answerText: Ship the plastic, crush and keep the glass, compost the compostables on the island, and ship the
      scrap because it pays for itself.
    why: 'The tip is short of volume and the ferry charges for mass, so the ranking is volume removed per pound
      of freight. Plastic wins that comparison outright: it is the bulkiest stream and the lightest to send. Glass
      loses it — heavy to ship and almost free to store once crushed. Compostables are the heaviest, wettest freight
      and the only stream with a use here, which takes them out of the arithmetic entirely and returns them as topsoil.
      Scrap is the exception that pays its own passage. The intuition this defeats is that heavy things are the
      problem; on an island with a hole rather than a weight limit, bulk is the problem.

      '
  - group: POWER
    task: Separate the annual energy bill from the half-hour that sizes the plant
    title: What does the extra sailing do to the power system?
    place: Turbine Yard
    reason: Ferris wants the ferry judged against the July peak it actually changes, rather than against an annual
      average that hides it.
    concept: 'Energy against power: a kilowatt is not a kilowatt-hour'
    takesAsRead:
    - Renewable and non-renewable, and what the cable is bringing
    scene: >-
      The island averages 88 kilowatts across the year. In one July half-hour it reached 310. The ferry
      was alongside and the mainland cable was out.
    guide: Two different questions get asked of the same data and the answers are in different units. How much energy
      the island uses in a year is one; how much power the plant has to be able to deliver at once is the other.
      Work out which of the two sizes the diesel sets, and which one sizes the fuel order.
    background:
    - 'What each number decides. Average demand times hours in the year is the energy, which sets the fuel bill
      and what a turbine could displace. The peak half hour sets the plant: three sets exist so that the largest
      can fail during the peak and the island stays lit.'
    - Why the peak is where it is. A July evening with the ferry alongside is cooking, showers, the berth's own
      load and the chandlery all at once, with the cable out. It is not a typical July evening; it is the worst
      credible combination, and that is exactly what a plant is sized against.
    - 'Why a second sailing matters here out of proportion. It does not move the annual energy much: a few more
      crossings against a whole year. But it adds directly to the one half hour that already sets the plant. A small
      change to the average can be a large change to the peak.'
    assumes:
    - the four years of half-hourly records cover the same load
    takeaway: One number buys equipment and the other buys fuel, and they are not the same number.
    format: CHOICE
    question: Which electricity number is most likely to determine whether the extra summer sailing forces new plant
      capacity?
    choices:
    - The July peak half hour, which sizes the diesel plant.
    - The annual energy total, which is what the fuel order for the year is set from.
    - The average demand across the year.
    - The capacity factor of the turbine on the hill.
    answer: The July peak half hour, which sizes the diesel plant.
    why: 'A handful of extra crossings adds very little to a year''s energy. It lands directly on the half hour
      that already sets the plant. That is a July evening with the boat alongside and the cable out. Plant is bought
      for peaks and fuel is bought for totals, and the two questions have different units: kilowatts against kilowatt-hours.
      That is why the annual average is the wrong figure to argue the ferry from, and why Ferris keeps returning
      to a single half hour four years ago. The turbine''s capacity factor is a property of the wind rather than
      of the ferry and does not move at all.

      '
    rebuttals:
    - 'The annual total barely moves: a few crossings against 8,760 hours of everything else.'
    - An average across the year is the least sensitive number to a change concentrated in one month.
    - Capacity factor describes what the wind gives the turbine and is unaffected by sailings.

    reason: Sorley needs to know whether a bad abstraction decision can remain hidden for years before the chemistry
      responds.
    relationship: 'residence time = stock ÷ flow: a large store with a small throughput turns over slowly, and recovers
      on the same clock.'
    concept: 'Residence time: how long a store takes to turn over'
    takesAsRead:
    - An aquifer, and what abstracting faster than recharge does to it
    scene: The freshwater lens is estimated to hold about 2.6 million cubic metres. The current recharge estimate
      is 294,000 cubic metres a year.
    guide: Divide what is held by what moves through each year. That is the residence time — how long the store
      takes to replace itself. It is the number that says how fast the aquifer responds to anything, in both directions.
      How long an over-draw takes to show up. And how long a corrected licence takes to fix it.
    background:
    - Why a slow store is dangerous rather than safe. A big buffer absorbs a mistake without showing it, so the
      evidence of over-abstraction arrives years after the licence that caused it. By the time the chloride is unambiguous,
      the decision being questioned is a decade old and the people who made it have left.
    - Why the recovery takes the same time. The clock is set by the ratio of the store to the flow, and the flow
      does not change when a cap is imposed. Capping abstraction tomorrow does not restore the balance tomorrow.
      It restores it over the same nine-year turnover. That is what a council expecting a quick result has to be
      told.
    - What the number rests on. The stock estimate is the weakest term. It comes from a 1998 geophysical survey
      with a range of about thirty per cent. The recharge, by contrast, is now measured. A residence time quoted
      to the year from a stock known to a third is a false precision, and the honest form is "roughly nine years".
    assumes:
    - the aquifer stock estimate is of the same order as the 1998 survey
    takeaway: A roughly nine-year turnover time means an imbalance can take years to become obvious and years to
      unwind.
    format: BALLPARK
    question: Estimate the aquifer's turnover time from its stored volume and annual recharge.
    estimate:
      prompt: The aquifer holds about 2.6 × 10⁶ m³ and receives 294,000 m³ of recharge a year.
      question: Estimate the aquifer's turnover time from its stored volume and annual recharge.
      labels:
      - 2.6e6 m³  (water held in the aquifer)
      - 294000 m³  (annual recharge)
      - 340000 m³  (annual licensed abstraction)
      - 1.4e6 m³  (annual rainfall on the catchment)
      values:
      - 2600000
      - 294000
      - 340000
      - 1400000
      slots: 2
      template: '{0} ÷ {1}'
      formula: a/b
      correct:
      - 0
      - 1
      target: 8.8
      tolerance: 1
      units: years
      solution: residence time = 2.6 × 10⁶ ÷ 2.94 × 10⁵ ≈ 8.8 years.
      explanation: About nine years to turn over — so a licence set wrong in 1998 is only unambiguous now, and a
        cap set today fixes it over nine more.
    answerText: About 8.8 years — a slow store that can hide an imbalance for years.
    why: 2.6 million cubic metres divided by 294,000 cubic metres per year is about 8.8 years. That is a turnover
      timescale, not a promise that every contaminant or salt signal will recover in exactly 8.8 years. It does
      tell the council why a chronic imbalance can remain hidden for a long time and why a correction today may
      take years to show its full effect.
    rebuttals:
    - Dividing the stock by the licensed abstraction gives how long the store would last with no rain at all.
    - Rainfall on the catchment is not what reaches the store; four fifths of it never arrives.
  - group: TIP
    task: Convert a concentration and flow into a pollutant load
    title: How much nitrogen is actually entering?
    at: leachate-bench
    place: Tip and Sorting Yard
    reason: Okafor wants the leachate judged by the mass it adds to the system, not only by a concentration limit
      it happens to pass.
    relationship: 'load = C × Q: a pollutant load is a concentration multiplied by a flow, and only loads add up.'
    concept: Concentration against load, and why a small pipe can matter
    takesAsRead:
    - Point and non-point sources, and which one a pipe is
    scene: Leachate from the tip runs at about 2,300 litres a day and tests at 41 milligrams per litre of ammoniacal
      nitrogen.
    guide: Ammoniacal nitrogen is the form nitrogen takes in leachate, before anything in the ground turns it into
      nitrate. A concentration says how strong something is. A load says how much of it there is. Multiply the concentration
      by the flow to get a mass per day. Then mind the units. Milligrams a litre times litres a day gives milligrams
      a day. That has to come back to kilograms before it goes in a council paper. Then ask which of the two numbers
      the stream downstream of it responds to.
    background:
    - Why the limit is written as a concentration and the harm is done by the load. A limit on strength is easy
      to sample and easy to meet by dilution, which changes the concentration and not the mass. What accumulates
      in the ground, in the stream and in the borehole is mass, and mass is what a load measures.
    - Why this pipe matters out of proportion to its size. Two thousand three hundred litres a day is nothing beside
      the island's water movements, and the tip sits up-catchment of the borehole. A small mass arriving continuously
      into a store that turns over once a decade accumulates, which is the same residence-time argument in a different
      currency.
    - What the comparison should be against. Not the discharge limit, which this passes, but the load the aquifer
      receives from everything else — the septic tanks, the fertiliser on the common and the sheep. A load only
      means something beside the other loads into the same store.
    assumes:
    - the leachate flow is roughly steady through the year
    takeaway: Concentration is strength and load is mass; only mass accumulates in a store.
    format: BALLPARK
    question: About how many kilograms of nitrogen does that leachate carry each day?
    estimate:
      prompt: Leachate runs at 2,300 litres a day and tests at 41 mg/L of ammoniacal nitrogen.
      question: About how many kilograms of nitrogen does that leachate carry each day?
      labels:
      - 41 mg/L  (concentration)
      - 2300 L/day  (flow)
      - 1e6  (milligrams in a kilogram)
      - 50 mg/L  (the discharge limit)
      values:
      - 41
      - 2300
      - 1000000
      - 50
      slots: 3
      template: '{0} × {1} ÷ {2}'
      formula: a*b/c
      correct:
      - 0
      - 1
      - 2
      target: 0.094
      tolerance: 0.012
      units: kg a day
      solution: load = 41 × 2300 ÷ 10⁶ = 0.094 kg a day, about 34 kg a year.
      explanation: A tenth of a kilogram a day is 34 kilograms a year into a store that turns over once a decade.
    answerText: About 0.094 kilograms a day — some 34 kilograms a year, into a store with a nine-year turnover.
    why: 'Forty-one milligrams a litre times 2,300 litres is 94,000 milligrams, which is 0.094 kilograms a day and
      about 34 kilograms a year. The concentration passes the limit and the load is the number that matters, because
      what accumulates in an aquifer is mass. This is also why a limit written as a concentration is weak: it can
      be met by dilution, which changes the strength and not the mass. Thirty-four kilograms a year sounds small.
      It belongs beside the other loads into the same store. It does not belong beside a discharge limit it was
      never meant to be compared with.

      '
    rebuttals:
    - The discharge limit is a concentration. Passing it says nothing about the mass arriving each year.
    - Concentration times flow without the unit conversion gives milligrams a day, which is not comparable with
      anything in the pack.
  - group: POWER
    task: Match each sampling pattern to the kind of source that can produce it
    title: Where is each pollutant coming from?
    place: Turbine Yard
    reason: Ferris and Sorley need to separate runoff, pipes and the groundwater chloride signal before one source
      is blamed for all three.
    concept: Point and non-point sources, and which one a pipe is
    takesAsRead:
    - A watershed, and what a catchment collects
    scene: Along the stream below the hill, nitrogen rises only after rain, oil appears below one yard after storms,
      and chloride stays flat. The borehole chloride is rising separately.
    guide: 'A point source arrives from somewhere you can put a finger on and a non-point source arrives from everywhere
      at once. The tell is not the substance but the pattern: how the reading behaves in dry weather, after rain,
      and whether it can be turned off. Read each of the three that way before deciding what to regulate.'
    background:
    - Why the distinction decides the response. A point source is licensed, sampled and enforced against — a pipe
      has an owner. A non-point source is managed by changing practice across a whole catchment, which is slower,
      cheaper per unit and far harder to make anybody responsible for.
    - What rainfall does to each. A point discharge is diluted by rain and its concentration falls while its load
      stays put. A diffuse source is mobilised by rain and both rise together, which is why sampling only in dry
      weather systematically misses agricultural pollution.
    - Why the oil is the interesting one. It appears after rain, which is the diffuse signature, and it comes from
      a hardstanding at the diesel house, which is a definite place. A yard is a point source that behaves like
      a non-point one, and it is the case that gets argued about.
    assumes:
    - the three sample points are on the same stream above the tidal reach
    takeaway: The tell is the pattern in dry and wet weather, not the substance.
    format: PROTOCOL
    columns:
    - What the samples show
    - What it points to
    scenarios:
    - Nitrogen highest in the first hour after heavy rain, low in dry weather
    - Ammoniacal nitrogen steady in all weather at the tip spur outfall
    - Oil sheen appearing only after rain, always downstream of the diesel yard
    - Chloride unchanged along the whole stream in every condition
    choices:
    - Diffuse runoff from fertilised ground across the catchment.
    - A point discharge with a steady flow behind it.
    - 'A hardstanding: a definite place, behaving like a diffuse source because rain moves it.'
    - No source on this stream; the signal being followed is in the aquifer instead.
    mapping:
    - 0
    - 1
    - 2
    - 3
    rebuttals:
    - Nitrogen that spikes with rain and disappears in dry weather is being washed off the ground, not piped.
    - A concentration that does not move with the weather has a steady flow behind it, which is a pipe.
    - 'The yard is a place you can point at, and rain is what mobilises it: a point source with a diffuse signature.'
    - Chloride flat along the stream means the salt problem is not arriving down this catchment at all.
    answerText: Rain-driven nitrogen is diffuse, the steady outfall is a point source, the oil is a hardstanding
      behaving diffusely, and the flat chloride belongs to the aquifer.
    why: 'Each pattern is diagnostic. Nitrogen appearing in the first hour after rain and vanishing in dry weather
      is being washed off fertilised ground. That happens across the whole catchment. It is managed by changing
      practice rather than by a licence. A concentration steady in every condition has a continuous flow behind
      it, which is a pipe with an owner. The oil is the case worth arguing. It comes from one yard and only moves
      when it rains. So it is a point source with a diffuse signature, and both tools apply. And the flat chloride
      matters most — it rules this stream out of the salt problem, which means the borehole''s chloride is arriving
      through the rock.

      '
- title: How much can the bay replace?
  objective: Use the stock model to find the fishery's theoretical ceiling, then decide what rules are needed when
    the estimate is uncertain.
  briefing: The stock assessment came back as a range, and last season's catch sits exactly on the model's maximum
    sustainable yield.
  stake: Day 5. The council wants to raise the quota if the second ferry creates a bigger market. Rask, the fisheries observer, has a model. It says the west ground can replace about 168 tonnes in a good year — exactly what was landed last season. Today you decide why a model ceiling is not spare capacity.
  takeaway: Maximum sustainable yield is a model ceiling, not a guarantee. Uncertainty and enforcement determine
    whether a quota near it is survivable.
  segue: >-
    The model's maximum is 168 tonnes a year, exactly last season's landing. That gives the council no
    evidence for raising the quota, and almost no margin if the stock estimate is optimistic. On day 6
    the problem stops being the number and becomes the rule: what good is a quota nobody checks?
  stops:
  - group: HARB
    task: Calculate the theoretical maximum sustainable yield
    title: What is the model's maximum catch?
    at: landings-book
    place: Harbour Office
    reason: Rask wants the model ceiling on the table before anyone mistakes last season's catch for spare capacity.
    relationship: 'harvest = rK ÷ 4: a stock grows fastest at half its carrying capacity, so the largest catch it
      can replace is a quarter of r times K.'
    concept: Maximum sustainable yield, and why it sits at half the stock
    takesAsRead:
    - The tragedy of the commons, and the rule that answers it
    scene: For the west ground, the working model uses a carrying capacity of 1,600 tonnes and an intrinsic growth
      rate of 0.42 per year. Last season's landing was 168 tonnes.
    guide: 'A stock does not grow fastest when it is full. A full stock is at its capacity and barely grows at all;
      an almost empty one has nothing to grow from. The fastest growth is in the middle. The largest catch that
      can be taken indefinitely is that growth: a quarter of the growth rate times the capacity. Work it out, then
      set it beside last season''s landings.'
    background:
    - Why the maximum sits at half. Growth is proportional to how many there are, and to how much room is left.
      The product of those two peaks when the stock is at half its capacity. That is the whole of the logistic idea.
      It is why a fishery managed to keep a stock full catches less than one managed to keep it half full.
    - Why fishing at the maximum is a knife edge. At exactly the peak, any error or bad year pushes the stock below
      half. Growth is lower there. The same catch is now too big, and the stock keeps falling. Fisheries set targets
      below the maximum for that reason, and the range on the capacity is what decides how far below.
    - What the width of the estimate does. Capacity is 1,600 give or take 400, so the sustainable catch is anywhere
      between 126 and 210 tonnes. Setting the quota at 210 is setting it on the assumption that the generous end
      of the estimate was right, which is exactly the choice that ends fisheries.
    assumes:
    - the stock behaves logistically with the growth rate in the assessment
    takeaway: The logistic model gives a ceiling of about 168 tonnes a year; uncertainty means the result is not
      guaranteed spare capacity.
    format: BALLPARK
    question: Under the logistic model, what is the theoretical maximum sustainable yield?
    estimate:
      prompt: Carrying capacity 1,600 tonnes, intrinsic growth rate 0.42 a year. Rask wants the yield before the
        quota is recommended.
      question: Under the logistic model, what is the theoretical maximum sustainable yield?
      labels:
      - 0.42  (r, intrinsic growth rate a year)
      - 1600 t  (K, carrying capacity)
      - 4  (the divisor in the relation)
      - 168 t  (last season's landings)
      values:
      - 0.42
      - 1600
      - 4
      - 168
      slots: 3
      template: '{0} × {1} ÷ {2}'
      formula: a*b/c
      correct:
      - 0
      - 1
      - 2
      target: 168
      tolerance: 14
      units: t a year
      solution: harvest = 0.42 × 1600 ÷ 4 = 168 tonnes a year.
      explanation: About 168 t/y under the logistic model — exactly last season's catch, so the model shows no spare
        capacity.
    answerText: About 168 tonnes a year under the logistic model — a theoretical maximum, not a safety margin.
    why: 'For logistic growth, maximum production occurs at half the carrying capacity and equals rK/4. With r =
      0.42 y⁻¹ and K = 1,600 t, that is 168 t/y. The calculation is useful because it shows that last season''s
      landings already sit at the model''s theoretical maximum. It does not prove that 168 t is safe every year:
      r, K and the stock estimate are uncertain, and real populations do not follow the simple logistic model perfectly.
      The result supports ''do not raise the quota'' much more strongly than it supports ''168 tonnes is guaranteed
      sustainable.'''
    rebuttals:
    - Last season's landings are what the yield is being compared against, not an input to it.
    - Half the capacity is the stock size that grows fastest, not the catch that can be taken.
  - group: COMMON
    task: Choose a stocking rule that constrains the total rather than each person's intention
    title: Why does 'one more animal' break the common?
    place: Common Office
    reason: Pike has nine graziers who can each stay within an informal share while their combined stock still exceeds
      the land's limit.
    concept: The tragedy of the commons, and the rule that answers it
    takesAsRead:
    - Carrying capacity, and what happens on the way past it
    scene: No single grazier thinks one extra animal matters. Added across nine holdings, the count is over the
      common's assessed limit again.
    guide: Work out where the extra animals came from before deciding what rule answers it. Look at who gains from
      one more animal and who pays for it, and whether any individual grazier has broken anything. Then pick the
      rule that changes the arithmetic each grazier faces, rather than the one that describes what you wish they
      would do.
    background:
    - Why nobody has to cheat for this to happen. One more animal is worth having to the grazier who owns it, and
      the cost — slightly worse grazing — is spread across all nine. Each individual decision is rational and the
      sum of them exceeds the common's capacity. That is the structure, and moralising about it changes nothing.
    - Why shares alone did not hold it. The shares were set as fractions of a total that was never inspected. So
      nine graziers each within their share can still sum past the limit as the total drifts. A rule expressed as
      a proportion needs the total to be counted; a rule expressed in animals does not.
    - What the three real options do. A hard stocking limit with inspection changes what each grazier may do. A
      charge per animal above a threshold changes what each animal costs them. Dividing the common into private
      parcels internalises the cost entirely and ends the common — which is a real answer and has its own price.
    assumes:
    - Pike's count is of animals on the common on one day
    takeaway: The commons fails because the gain is private and the cost is shared, and only the arithmetic can
      be changed.
    format: CHOICE
    question: Which rule actually limits the total number of animals on the common?
    choices:
    - A limit in animals, inspected, and the count published.
    - A written reminder to every grazier of their responsibility to the common as a whole.
    - Reducing every grazier's share by the same proportion.
    - A ban on new graziers joining the common.
    answer: A limit in animals, inspected, and the count published.
    why: 'Nobody here has broken their share. So the failure is in the rule rather than in the graziers. Shares
      are proportions of an uninspected total, and nine people inside their proportion can still sum past 430. A
      limit expressed in animals and actually counted fixes precisely that, and publishing the count is what makes
      it enforceable between neighbours who have to live together. A reminder changes no arithmetic. Cutting every
      share proportionally keeps the same uncounted structure and simply moves the number. Banning new graziers
      protects the nine who are already over and does nothing about the 512 animals on the ground.

      '
    rebuttals:
    - Responsibility is not what failed. Every grazier is within their share and the total is still over.
    - A proportional cut keeps a rule based on an uninspected total, which is the thing that drifted.
    - Excluding newcomers freezes the present overstocking in place and reduces nothing.
  - group: REEF
    task: Use life history to judge whether the same harvest rate means the same biological pressure
    title: Can two species share one tonne quota?
    place: Reef Station
    reason: Berhane wants a slow-maturing species kept from disappearing inside a quota written only in total tonnes.
    concept: Generalists and specialists, r-selected and K-selected
    takesAsRead:
    - Carrying capacity, and what happens on the way past it
    scene: One west-ground species matures quickly and produces many young. Another takes years to mature and produces
      far fewer. The current landing book combines both in one tonnage.
    guide: Sort the two by how they reproduce, then ask what each does after a bad year. Many small offspring with
      no care is one strategy. A few large ones with a long maturation is the other. They respond to fishing in
      opposite ways. A quota in tonnes is silent about which of the two it is taking.
    background:
    - What the two strategies are. An r-selected species matures early, breeds prolifically and dies young; a K-selected
      one matures late, breeds slowly and lives long. Neither is better — they are answers to different conditions,
      one to an unpredictable environment and the other to a crowded stable one.
    - Why it decides recovery. Fish out an r-selected stock and it can rebuild in a few seasons if the habitat holds,
      because the survivors breed fast. Fish out a K-selected one and recovery takes decades, because nothing in
      its life history is fast. The same tonnage taken from the two is not the same decision.
    - Why a tonnage quota hides it. A hundred tonnes of a fast-breeding schooling fish and a hundred tonnes of a
      slow-maturing predator weigh the same and are not the same harvest. This is why assessments are written per
      species even when the market and the landing fee are not.
    assumes:
    - both species are taken by the same boats on the same ground
    takeaway: Two stocks of equal weight are not two harvests of equal cost.
    format: CHOICE
    question: What does that life-history difference mean for a quota written only in tonnes?
    choices:
    - The same tonnage is a far heavier harvest on the slow-maturing one.
    - Neither is affected differently, because a tonne of biomass is a tonne of biomass.
    - The fast-breeding species should be protected first, being more numerous.
    - Both should be closed until the assessment separates them.
    answer: The same tonnage is a far heavier harvest on the slow-maturing one.
    why: 'A hundred tonnes of a fish that matures at two and spawns in hundreds of thousands is a harvest the stock
      can replace within a few seasons. A hundred tonnes of one that matures at nine and produces dozens is a harvest
      that removes breeding adults which cannot be replaced for a decade or more. The weight is identical and the
      decision is not, which is why assessments are written per species. Protecting the abundant one first inverts
      the argument. Closing the ground entirely is a real option, but the arithmetic does not require it. It requires
      the quota to be split.

      '
    rebuttals:
    - Biomass is what the scale reads. It says nothing about how long the animals took to grow.
    - Abundance is not the same as resilience; the numerous species here is the one that recovers fastest.
    - Closing the ground is available and stronger than the evidence needs; separating the quota is what the difference
      argues for.

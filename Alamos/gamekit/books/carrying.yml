  - group: WATER
    task: Find the largest avoidable cost in the pumping system
    title: Why pump water that never reaches a tap?
    place: Waterworks
    reason: Sorley wants the 51,000-cubic-metre leak treated as a resource loss, not hidden inside a discussion
      of pump efficiency.
    concept: Efficiency, and where the rest of the fuel goes
    takesAsRead:
    - 'Energy against power: a kilowatt is not a kilowatt-hour'
    scene: The borehole pump lifts water 46 metres and runs about fourteen hours a day. Meter differences show that
      roughly 51,000 cubic metres a year disappear from the distribution main before reaching a customer.
    guide: Ask where the electricity goes. Some of it becomes lifted water and the rest becomes heat — in the motor,
      in the pump and in friction down the rising main. Separate the unavoidable lift from the recoverable losses,
      then decide which one is large enough to attack first.
    background:
    - What a pump's efficiency is made of. Some electrical energy is lost in the motor, some in the pump and some
      to pipe friction. Those are engineering losses; lifting water 46 metres is the useful work the system exists
      to do.
    - Why the distribution leak matters more. About 51,000 cubic metres a year is pumped and then lost before a
      customer receives it. The energy used on that water is wasted even if the motor and pump are efficient.
    - Why the lift itself cannot be removed. The borehole and storage tanks are separated by 46 metres of head.
      That gravitational energy is the job, not a defect in the machine.
    assumes:
    - the pump runs at roughly constant load when it is running
    takeaway: Some of an energy bill is the work and the rest is loss, and only the loss can be recovered.
    format: CHOICE
    question: Which loss should Vellan fix before spending money on smaller pump-efficiency gains?
    choices:
    - The roughly 51,000 m³ a year lost from the distribution main.
    - The electrical losses in the pump motor itself, which run at a few per cent.
    - The energy spent lifting the water 46 metres.
    - The friction in the rising main at present flow.
    answer: The roughly 51,000 m³ a year lost from the distribution main.
    why: About 51,000 cubic metres a year is pumped and then lost before reaching a user. That is roughly fifteen
      per cent of the island's present annual abstraction and is far larger than the proposed ferry's water demand.
      The 46-metre lift is not a loss at all; it is the useful work. Motor and pipe losses are real, but they are
      smaller engineering terms to attack after the distribution leak is fixed.
    rebuttals:
    - Motor losses are real, but the distribution leak is a much larger avoidable water-and-energy loss.
    - The 46-metre lift is the useful work, not a loss.
    - Pipe friction is worth reducing after the large distribution leak is fixed.
  - group: COMMON
    task: Explain why calendar spraying can make a control fail
    title: Can spraying more create more pests?
    place: Common Office
    reason: Hollis needs to protect the island's food supply without copying a mainland spraying routine that is
      already selecting for resistant aphids.
    concept: Integrated pest management against spraying on a calendar
    takesAsRead:
    - Agricultural methods, irrigation and the salt they leave behind
    scene: Hollis sprays only after pest counts cross a threshold. A neighbouring holding sprays on a calendar and
      now needs about five treatments where Hollis usually needs two.
    guide: 'What Hollis does has a name: integrated pest management, which means every tool the crop allows and
      the spray only when a count says so. Compare the two regimes by what they do to the pest population over years,
      not by what they cost this month. Ask which one selects for resistance, and how a threshold is set. "Treat
      when you see one" and "treat when it will cost you more than the spray does" are different rules, with different
      outcomes.'
    background:
    - 'How calendar spraying breeds the problem. Every application kills the susceptible individuals and leaves
      the resistant ones to breed, so the population''s tolerance rises with each treatment. Five sprays a season
      rising is what that looks like from inside: the same chemical, doing less each year.'
    - What a threshold is. The pest density at which the damage exceeds the cost of treating. Below it, spraying
      costs more than it saves and still selects for resistance. Above it, treating pays. Setting it requires counting,
      which is the part growers skip.
    - What else integrated pest management uses. Resistant varieties, timing of sowing, encouraging predators, and
      physical barriers — with the spray as the last resort rather than the schedule. Hollis's two treatments a
      season are the residue after the other four tools have done their work.
    assumes:
    - both holdings grow comparable crops under comparable cover
    takeaway: Treating on a calendar selects for resistance; treating on a threshold does not.
    format: CHOICE
    question: Why can spraying on a fixed calendar lead to needing more treatments over time?
    choices:
    - Spraying regardless of numbers has bred resistance in their aphids.
    - Their polytunnels run warmer than his, and aphids breed faster at higher temperatures.
    - Hollis uses a stronger chemical at each application.
    - Their crop is more susceptible to aphid damage.
    answer: Spraying regardless of numbers has bred resistance in their aphids.
    why: 'Each application kills the susceptible aphids and leaves the resistant ones to breed, so a fixed schedule
      raises the population''s tolerance season by season. Five treatments and rising is the signature: the same
      chemical achieving less each year. Hollis''s two are what is left after resistant varieties, sowing dates,
      predators and barriers have done the rest. The spray is kept as a last resort, against a counted threshold.
      Temperature and crop susceptibility would show as a difference from the first season, not a worsening trend.
      A stronger chemical would accelerate the same selection rather than avoid it.

      '
    rebuttals:
    - A warmer tunnel would show as a higher pest load from the start, not a requirement that grows every year.
    - A stronger chemical selects for resistance faster; it is the mechanism, not an escape from it.
    - Crop susceptibility is a constant. It cannot explain a rising number of treatments.

      three change the number and the third changes what the number means.
    background:
    - Why the end of a main reads higher. Water sits longest there, and a weekend with the school closed means it
      sat for two days. Anything that accumulates has had longer to accumulate. A Monday sample at the far end is
      therefore systematically the worst reading on the network. It is a real reading rather than an artefact.
    - Why Nkemdi asked for it separately. Concentration is the same water for everybody and dose is not. The youngest
      child at that tap weighs eleven kilograms and drinks about a litre a day. An adult drinking two litres takes
      roughly a sixth of that dose per kilogram. The concentration is identical.
    - What the council can be told. That the school tap is the highest reading on the network. That the Monday timing
      partly explains it. And that the dose it implies for the smallest children is what the guidance is written
      for. All three are defensible; any one of them alone is misleading.

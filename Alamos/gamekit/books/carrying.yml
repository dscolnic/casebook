    task: Calculate capacity factor from Vellan's measured generation
    title: What does the turbine actually produce here?
    at: turbine-plate
    place: Turbine Yard
    reason: Ferris wants a local wind number before a gearbox decision is made from the turbine's nameplate or brochure.
    relationship: 'capacity factor = actual ÷ rated: what a generator produced, over what it would have made running
      flat out.'
    concept: 'Capacity factor and intermittency: what a turbine gives on average'
    scene: The hill turbine is rated at 250 kilowatts. In its last full year before the gearbox failed, its meter
      recorded 613,000 kilowatt-hours.
    guide: Work out what the machine would have made if it had run at its rating every hour of the year, then compare
      what it actually made with that. The ratio is the capacity factor, and it is the only number that plans anything.
      It already contains the hours the wind was too light, too strong or gone.
    background:
    - Why a rating is not a forecast. The rating is the output at the wind speed the machine is designed for, which
      on Vellan happens perhaps a fifth of the time. The rest of the year it produces less, and above a cut-out
      speed it produces nothing at all and turns itself out of the wind.
    - What a good capacity factor looks like. Onshore wind sits between about 25 and 35 per cent, offshore rather
      higher, and rooftop solar in this latitude around 10. A figure near 28 per cent on an exposed island is a
      genuinely good machine, and it is still nothing like the rating.
    - Why the brochure figure is not dishonest and is still wrong. It is a modelled output at a reference wind distribution,
      which Vellan does not have. The island is windier on average, and loses more hours to cut-out in winter gales.
      The only trustworthy figure is the one measured on this hill.
    assumes:
    - the last full year of generation is representative of the wind here
    takeaway: Capacity factor is what the machine actually gives, and it already contains the calm days.
    format: BALLPARK
    question: What capacity factor did the turbine actually achieve on Vellan?
    estimate:
      prompt: Rated at 250 kW; generated 613,000 kWh in its last full year. Ferris wants the factor, not the brochure.
      question: What capacity factor did the turbine actually achieve on Vellan?
      labels:
      - 613000 kWh  (actual generation, one year)
      - 250 kW  (rated output)
      - 8760 h  (hours in a year)
      - 900000 kWh  (the brochure's annual figure)
      values:
      - 613000
      - 250
      - 8760
      - 900000
      slots: 3
      template: '{0} ÷ ({1} × {2})'
      formula: a/(b*c)
      correct:
      - 0
      - 1
      - 2
      target: 0.28
      tolerance: 0.03
      units: of rated
      solution: 613,000 ÷ (250 × 8760) = 613,000 ÷ 2,190,000 = 0.28.
      explanation: About 0.28. The measured annual output is about 68% of the brochure's 900,000-kWh claim.
    answerText: About 0.28 — the local measurement to use instead of the nameplate or brochure.
    why: A 250-kW machine running at full output for 8,760 hours would produce 2.19 million kWh. The measured 613,000
      kWh is therefore a capacity factor of about 0.28. The brochure's 900,000-kWh annual claim corresponds to about
      0.41, so the measured year delivered about 68% of the brochure's energy figure. The local meter is the relevant
      evidence for Vellan; the capacity factor already includes calm periods, high-wind cut-outs and downtime during
      that year.
    rebuttals:
    - Comparing with the brochure figure compares two estimates and measures neither.
    - Dividing the annual generation by the rating alone leaves out the hours, so the answer is not a fraction of
      anything.
  - group: HARB
    task: Compare the gearbox cost with the electricity the turbine would avoid buying
    title: Was waiting cheaper than fixing it?
    at: fee-desk
    place: Harbour Office
    reason: Calloway needs the repair decision based on Vellan's avoided electricity cost, not on the mistaken assumption
      that every turbine kilowatt-hour replaces diesel fuel.
    relationship: 'payback = cost ÷ annual saving: how many years of saving pay for the change.'
    concept: Renewable and non-renewable, and what the cable is bringing
    scene: The gearbox costs £41,000. The turbine previously produced about 613,000 kilowatt-hours a year. Across
      imported power and diesel generation, Vellan's average avoided electricity cost is about 7.4 pence per kilowatt-hour.
    guide: Work out what a year of displaced diesel is worth, then divide the capital cost by it. That is the simple
      payback. Then look at what the number does not contain. Two of the things it leaves out point in opposite
      directions, and the council will be told only one of them.
    background:
    - What simple payback leaves out. Maintenance on the machine. The cost of borrowing the £41,000. And the fact
      that the turbine cannot displace diesel at every hour it generates. Some of its output arrives when the cable
      is carrying the island anyway. All three make the real payback longer.
    - What it also leaves out in the other direction. The fuel price is not fixed. The cable is failing, and will
      be replaced at somebody's cost. The emissions saved are worth something in any future the council has to plan
      for. All three make the real case stronger.
    - Why simple payback is still the right first number. It is transparent, it can be checked by anybody in the
      room in one line, and both sides can then argue about the adjustments in the open. A discounted calculation
      with eleven assumptions in it wins a meeting and does not inform one.
    assumes:
    - the 7.4 p/kWh figure is the island's average avoided cost across imported electricity and local diesel generation
    takeaway: Simple payback uses the cost actually avoided by each kilowatt-hour; it should not pretend every wind
      kilowatt-hour replaces diesel.
    format: BALLPARK
    question: At that avoided cost, about how long would the gearbox take to pay back?
    estimate:
      prompt: £41,000 gearbox; 613,000 kWh/y of measured turbine output; average avoided island electricity cost
        £0.074/kWh.
      question: At that avoided cost, about how long would the gearbox take to pay back?
      labels:
      - 41000  (gearbox cost, £)
      - 613000 kWh  (annual generation displaced)
      - 0.074  (average avoided electricity cost, £/kWh)
      - 0.28  (the turbine's capacity factor)
      values:
      - 41000
      - 613000
      - 0.074
      - 0.28
      slots: 3
      template: '{0} ÷ ({1} × {2})'
      formula: a/(b*c)
      correct:
      - 0
      - 1
      - 2
      target: 0.9
      tolerance: 0.12
      units: years
      solution: annual avoided cost = 613,000 × £0.074 ≈ £45,400; payback = £41,000 ÷ £45,400 ≈ 0.9 y.
      explanation: About eleven months on the stated avoided electricity cost.
    answerText: About eleven months on the stated avoided electricity cost — short enough that waiting two years
      for the gearbox was the expensive choice.
    why: 'At an average avoided electricity cost of £0.074/kWh, 613,000 kWh is worth about £45,400 per year. A £41,000
      gearbox therefore has a simple payback of about 0.9 years. The important correction is what the 7.4 pence
      represents: the turbine normally offsets a mixture of imported power and local diesel generation, not 613,000
      kWh of diesel alone. Simple payback still omits maintenance, financing, curtailment and future electricity
      prices, but it is now comparing the repair with the energy cost it actually avoids.'
    rebuttals:

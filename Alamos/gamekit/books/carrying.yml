- title: What else comes off the ferry?
  objective: Add biosecurity and greenhouse-gas conditions to a transport plan whose ticket price does not include
    either one.
  briefing: A crop beetle has spread through all four polytunnels, and new species are arriving faster since the
    freight contract changed.
  stake: Day 13. The second ferry can help the island stay connected, but every extra pallet is also another pathway
    onto an isolated ecosystem. Today you decide what makes the beetle an invasive problem, what can still be prevented,
    and how the island's methane and diesel compare on one climate scale.
  takeaway: Connection has benefits and pathways. On an island, transport policy is also biosecurity policy.
  segue: >-
    Nine species have been recorded for the first time in the three years since the freight contract
    changed, compared with about one a year before it. That does not prove every arrival came on the
    ferry, but it is enough to justify inspection of soil, plants and pallets. On day 14 the argument
    turns back to the reason Calloway wants the second sailing at all: whether Vellan still has a
    population to serve.
  stops:
  - group: COMMON
    task: Distinguish arrival from establishment and ecological or economic harm
    title: When does a new species become an invasive problem?
    place: Common Office
    reason: Hollis needs the beetle treated as an invasive management problem because it is spreading and damaging
      crops, not merely because it came from somewhere else.
    concept: Invasive species, and the four things that make one
    takesAsRead:
    - 'Island biogeography: area, isolation and the species a place can keep'
    scene: The beetle now breeds in all four polytunnels, feeds on eleven crops and has no known predator on Vellan.
      It appeared after the freight contract changed and is already reducing marketable leaves.
    guide: Being new is not the same as being invasive. Go through what the species does here rather than where
      it came from. How fast it reproduces. How broad its diet is. Whether anything controls it. And whether it
      can spread beyond where it landed. A species with one of those is a curiosity; one with all four is a management
      problem.
    background:
    - Why "no natural predator" is the load-bearing condition. In its home range something eats it, and the population
      sits at a level that reflects that. Removed from its predators it does not sit anywhere. It grows until food
      or space stops it. That is why the same beetle is unremarkable at home and a problem here.
    - Why a broad diet matters so much on a small island. A specialist can only occupy what its host occupies. A
      generalist eating eleven crops can move between them as each is harvested, so there is no season in which
      its population has to crash.
    - 'Why the arrival route is the only part that can be closed. The beetle cannot be removed from four tunnels
      once it is breeding. What can change is the next arrival: inspection at the berth, cleaned pallets, and knowing
      which sailings carry soil and plants. A second sailing doubles the opportunities without doubling the inspection.'
    assumes:
    - the beetle was not recorded on the island before the freight change
    takeaway: An introduced species becomes an invasive management problem when it establishes, spreads and causes
      harm.
    format: CHOICE
    question: Which evidence most clearly makes this more than a new species record?
    choices:
    - It is introduced, spreading through crops and causing damage while nothing controls it.
    - It arrived from the mainland on a freight pallet rather than reaching the island naturally.
    - It breeds three times in a season, which is faster than anything native to the island.
    - It was first found inside a polytunnel rather than out on the open common.
    answer: It is introduced, spreading through crops and causing damage while nothing controls it.
    why: 'Being non-native is not enough by itself. The management signal is the combination: the beetle is established
      in all four tunnels, it is spreading across many crops, it is already reducing marketable produce, and no
      local predator appears to be holding it down. Fast breeding helps explain the spread, and the ferry may explain
      the route, but invasion is about establishment and harm, not simply origin.'
    rebuttals:
    - Most introduced species never establish. The route explains its arrival, not its success.
    - Three generations a season is only decisive because nothing is removing any of them.
    - The tunnels are where it was found and where it is warmest; eleven of the crops it eats grow outdoors too.
  - group: TIP
    task: Calculate the island's annual carbon-dioxide-equivalent emissions from its two largest measured sources
    title: Put methane and diesel on one climate scale
    at: lab-bench
    place: Tip and Sorting Yard
    reason: Okafor wants the landfill vent and diesel house compared on the same 100-year basis before either is
      described as the smaller problem.
    relationship: 'CO₂ = fuel × emission factor for the diesel, then CO₂e = mass × GWP for the methane: both gases
      counted from what went into the tank and what came off the cell.'
    concept: Greenhouse gases, and comparing them on one scale
    scene: The diesel sets burned 78,000 litres last year and the landfill vented about 14 tonnes of methane. Use
      the pack's 100-year methane factor so the two can be added.
    guide: Count the diesel from what went into the tank — litres times an emission factor — rather than from anything
      measured at the stack. Convert the methane to carbon dioxide equivalent, add the two and state the period
      the conversion belongs to. Then work out what the flare would leave. Burning methane does not remove the carbon.
      It changes which gas is carrying it, and that is most of the benefit.
    background:
    - What a flare actually does. It oxidises methane to carbon dioxide and water. The carbon still reaches the
      atmosphere, as a gas that traps a twenty-eighth as much heat per kilogram. So the climate effect falls by
      around ninety-five per cent, while the emitted mass barely changes.
    - Why diverting the compostables is better than flaring them. A flare deals with methane after it is made. Removing
      the organic matter means it is never made, and the same material becomes soil instead. The flare is what you
      fit for the material you cannot divert.
    - Why the period has to be on the line. At a hundred years methane is 28 times carbon dioxide, and the tip is
      about two thirds of the island's total. At twenty years it is 80 times, and the tip is five sixths of it.
      The same island, the same tonnages, two very different papers.
    assumes:
    - the hundred-year potential is the basis the pack states
    takeaway: Methane and carbon dioxide must be compared on the same time horizon; flaring methane converts it
      to CO₂ and sharply reduces its warming impact.
    format: BALLPARK
    question: Estimate the combined annual emissions from diesel and landfill methane in tonnes of CO₂-equivalent.
    estimate:
      prompt: 78,000 litres of diesel at 2.63 kg of CO₂ a litre, and 14 tonnes of methane off the cell, on the hundred-year
        basis.
      question: Estimate the combined annual emissions from diesel and landfill methane in tonnes of CO₂-equivalent.
      labels:
      - 78 kL  (diesel burnt, thousands of litres)
      - 2.63 t/kL  (emission factor, tonnes CO₂ per thousand litres)
      - 14 t  (methane vented)
      - 28  (GWP over 100 years)
      - 80  (GWP over 20 years)
      values:
      - 78
      - 2.63
      - 14
      - 28
      - 80
      slots: 4
      template: '{0} × {1} + {2} × {3}'
      formula: a*b+c*d
      correct:
      - 0
      - 1
      - 2
      - 3
      target: 597
      tolerance: 40
      units: t CO₂e a year
      solution: 78 × 2.63 + 14 × 28 = 205 + 392 = 597 tonnes CO₂e a year.
      explanation: About 600 t CO₂e/y. If the methane were completely flared, 14 t CH₄ would become about 38.5 t
        CO₂, taking the combined total to roughly 244 t CO₂e.
    answerText: About 597 tonnes a year, two thirds of it from the tip — and a flare would cut it to roughly 245.
    why: 'Fourteen tonnes of methane at a 100-year GWP of 28 is 392 tonnes CO₂e. The diesel adds about 205, for
      a combined total near 597 tonnes CO₂e. Flaring does not make the carbon disappear: burning 14 tonnes of CH₄
      produces about 38.5 tonnes of CO₂. But that is still far below 392 tonnes CO₂e on the stated 100-year basis,
      so the combined total would fall to roughly 244 tonnes CO₂e. Diverting organic waste is better still because
      it prevents much of the methane from forming. The time horizon must always be stated.'
    rebuttals:
    - The twenty-year potential gives 1,325 tonnes. Both are correct and the pack must say which it used.
    - Adding the raw tonnages compares a kilogram of methane with a kilogram of carbon dioxide.
  - group: REEF
    task: Choose the biosecurity measure that can prevent the next arrival
    title: What should the ferry inspect before it unloads?
    place: Reef Station
    reason: Berhane wants the transport plan to close the pathway that is still controllable even though the beetle
      already on Vellan may be impossible to eradicate.
    concept: 'Island biogeography: area, isolation and the species a place can keep'
    takesAsRead:
    - Species richness, and what an island holds that a mainland does not
    scene: Nine species have been recorded for the first time in the three years since the freight contract changed,
      compared with about one per year over the previous thirty years. Soil, plants and pallets arrive with no inspection.
    guide: 'An island''s species list is held in place by two things: how big the island is and how hard it is to
      reach. The first cannot change. Ask what the second is worth in practice, and what a second sailing does to
      it. Then decide what the pack should ask for. The beetle already here cannot be removed.'
    background:
    - 'Why isolation matters as much as area. Arrivals are rare, so a species that goes locally extinct is not replaced,
      and a species that arrives faces no competitors that arrived recently either. Reduce the isolation and both
      halves change: more arrivals, and a community that has never had to hold its ground against newcomers.'
    - What the numbers suggest and cannot prove. One new record a year for thirty years, and four in three, is a
      rate change worth acting on. It coincides with a freight contract rather than being explained by it. Berhane
      will say exactly that much and no more.
    - Why inspection is the cheap intervention. Nothing removes an established beetle from four polytunnels. What
      a berth inspection changes is the next arrival, at a cost of an hour a sailing. That is the whole argument
      for spending effort at the point of entry rather than on eradication afterwards.
    assumes:
    - the first-record list has been kept by the same person throughout
    takeaway: An island is protected by its distance, and inspection is the only part of that anybody can restore.
    format: CHOICE
    question: What should be added to the ferry plan to reduce the risk of the next introduction?
    choices:
    - Inspection of soil, plants and pallets at the berth.
    - Eradication of the beetle from all four of the polytunnels it is now breeding in.
    - A survey to establish how the beetle arrived.
    - A ban on importing plants to the island.
    answer: Inspection of soil, plants and pallets at the berth.
    why: 'The beetle already established in four tunnels may be impossible to remove cheaply, so the next controllable
      decision is the pathway. Nine first records in three years after the freight change, compared with roughly
      one per year before it, is not proof that every species arrived on a ferry pallet. It is enough to justify
      a low-cost precaution on an island: inspect soil, plants and pallets at the berth. A survey of this beetle''s
      exact route does not stop the next arrival, and a total plant-import ban is stronger than the evidence requires.'
    rebuttals:
    - Eradication from four tunnels with a three-generation season is not achievable, and the crops outside are
      on its list too.
    - A survey answers how it arrived; the pack needs a measure that changes the next arrival.
    - A full import ban costs the garden its stock and pushes the same material into channels nobody inspects.
- title: Will there still be a school?
  objective: Separate residents from visitors and use age structure and migration to ask what kind of growth would
    actually keep the island viable.
  briefing: The school roll has fallen from thirty-one to nineteen in twelve years, and two of those nineteen leave
    for mainland secondary school in August.
  stake: 'Day 14. Calloway has argued for the ferry as a way to keep families on Vellan. Iversen, the schoolteacher, has a harder number:
    last year five people came in and nine went out. Today you test whether more visitors, more residents and more
    school-age children are actually the same thing.'
  takeaway: A larger summer population is not the same as a viable resident age structure. Migration by age matters
    more than the headline total.
  segue: >-
    Last year's population change was about minus 4.4 per cent. If that rate somehow persisted, the
    population would halve in roughly sixteen years — but one small-island year is not a forecast. The
    age structure still makes the direction clear: visitors do not keep a school open; families who stay
    might. On day 15 you decide whether the ferry deserves a trial and exactly what conditions must
    travel with it.
  stops:
  - group: WATER
    task: Calculate last year's population change from births, deaths, arrivals and departures
    title: Is Vellan growing or shrinking?
    at: register-desk
    place: Waterworks
    reason: Iversen wants the ferry debate grounded in the resident population rather than the summer crowd.
    relationship: 'r = (B + I − D − E) ÷ N × 100: births plus arrivals less deaths and departures, over the population.'
    concept: Age structure and the demographic transition, on a nineteen-child roll
    takesAsRead:
    - Exponential growth, and reading a doubling time off a rate
    scene: Last year Vellan recorded one birth, four new residents, two deaths and seven departures. The resident
      population is 91.
    guide: 'Iversen''s point is that a rate is not a slogan: it is four flows added and subtracted like any other
      account. Add what came in, take away what went out, divide by the population it happened to, and turn that
      into a percentage. That sign is the day''s real answer. Positive means the island is growing; negative means
      it is shrinking. And once it is negative, the same doubling-time arithmetic runs in reverse — it becomes a
      halving time instead.'
    background:
    - Why all four flows have to be counted. Two of them are demographic and two are migration, and on a small island
      the migration terms are much the larger. A council discussing birth rates is discussing the smallest two numbers
      on the list.
    - What the rule of 70 does with a negative rate. It gives a halving time. At about minus four and a half per
      cent a year, ninety-one people halve in something like fifteen years. That is the number nobody in the room
      has said out loud. It is not affected by whether the school stays open next year.
    - Why the seven who left is the term to interrogate. It is the largest flow and the only one anybody can change.
      Why they left, and whether a second sailing changes those reasons, is the actual question hiding behind the
      ferry argument.
    assumes:
    - the four flows are counted for the same year as the population figure
    takeaway: Last year's net migration dominated the change; one small-island year gives direction, not a stable
      long-term growth constant.
    format: BALLPARK
    question: What was the island's population growth rate last year?
    estimate:
      prompt: One birth, four arrivals, two deaths, seven departures, from a population of 91.
      question: What was the island's population growth rate last year?
      labels:
      - 5  (births plus arrivals)
      - 9  (deaths plus departures)
      - 91  (the resident population)
      - 19  (children on the school register)
      values:
      - 5
      - 9
      - 91
      - 19
      slots: 3
      template: ({0} − {1}) ÷ {2} × 100
      formula: (a-b)/c*100
      correct:
      - 0
      - 1
      - 2
      target: -4.4
      tolerance: 0.6
      units: '% a year'
      solution: r = (5 − 9) ÷ 91 × 100 = −4.4 % a year.
      explanation: About −4.4% for the year. A constant rate that size would halve a population in ~16 years, but
        one year on a 91-person island is not a stable forecast.
    answerText: About −4.4% for that year. If that exact rate persisted it would imply a ~16-year halving time,
      but the one-year rate is not itself a forecast.
    why: Five people entered the population count and nine left it, a net change of −4. Dividing by 91 gives about
      −4.4% for that year. The rule of 70 says a constant decline of that size would halve a population in roughly
      16 years, but Vellan is small enough that one family moving can change the annual rate sharply. The robust
      finding is not a 16-year prophecy; it is that migration dominated births and deaths last year, and the age
      structure is already weighted toward older residents.
    rebuttals:
    - The school roll is what the rate produces, not one of the flows that makes it.
    - Counting only births and deaths leaves out the two largest flows on a small island.
  - group: HARB
    task: Read the age structure rather than the summer headcount
    title: What kind of arrivals keep a school open?
    place: Harbour Office
    reason: Iversen wants the council to distinguish visitors and seasonal workers from residents who actually change
      the school-age and working-age cohorts.
    concept: Age structure and the demographic transition, on a nineteen-child roll
    takesAsRead:
    - Exponential growth, and reading a doubling time off a rate
    scene: The school has 19 pupils, two of whom leave for mainland secondary school in August. The resident population
      is heavily weighted above age 55.
    guide: Read the shape rather than the total. Ask how many people are of an age to have children here. Ask how
      many are of an age to stop working. Then ask what those two numbers do over ten years, without anybody moving.
      Then ask which of the ferry's promised effects would change the shape rather than the total.
    background:
    - What an age structure predicts that a total cannot. The number of births in ten years is set by how many people
      of childbearing age are present now, and that is already determined. A total can be propped up by arrivals;
      the shape can only be changed by arrivals of a particular age.
    - Why an island's shape gets worse on its own. People leave in their late teens for education and work, and
      the ones who return, if any, return later. That removes the same cohort every year, so the structure hollows
      in the middle even when the total looks stable for a while.
    - What kind of arrival would actually change it. Families with young children, staying. Visitors change the
      summer total and nothing about the structure; seasonal workers change the summer total and the water demand.
      The ferry argument is about traffic, and the register is about residents, which is why the two keep talking
      past each other.
    assumes:
    - the register and the age figures describe the same population
    takeaway: A total can be propped up by arrivals; a shape changes only with arrivals of a particular age.
    format: CHOICE
    question: Which change would actually improve Vellan's age structure rather than simply increase its summer
      headcount?
    choices:
    - Families with school-age children who move here and stay.
    - A larger number of day visitors spread across the whole season.
    - Seasonal workers arriving for the summer.
    - A higher birth rate among the existing residents.
    answer: Families with school-age children who move here and stay.
    why: 'The shape is what forecasts, and only one of these changes it. Families with children who stay add to
      both the young cohort and the working-age one, which is the two places the structure is hollow. Day visitors
      change nothing about residency at all. Seasonal workers change the summer total and the water demand, and
      leave in September. And a higher birth rate is not available as a lever. The number of people of childbearing
      age on Vellan is already fixed, and it is small. That is the thing Iversen keeps saying and the ferry argument
      keeps not hearing. One side is talking about traffic, the other about residents.

      '
    rebuttals:
    - Day visitors do not enter the register at all; they change the summer total and nothing else.
    - Seasonal workers leave in September and take their contribution to the structure with them.
    - The birth rate cannot be a lever when the number of people of childbearing age is already small and fixed.
  - group: POWER
    task: Separate the trend that sizes equipment from the trend that sizes annual fuel
    title: Do you build power for residents or for July?
    place: Turbine Yard
    reason: Ferris has to design for a shrinking resident population and a rising visitor peak at the same time.
    concept: 'Capacity factor and intermittency: what a turbine gives on average'
    takesAsRead:
    - 'Energy against power: a kilowatt is not a kilowatt-hour'
    scene: Resident numbers are falling, while the highest July half-hour continues to rise with visitors and harbour
      activity. The next plant specification must last 25 years.
    guide: Two trends run in opposite directions and the plant has to be specified against both. Work out which
      of them sets the plant and which sets the fuel, then say what the specification should follow. A falling total
      and a rising peak is not a contradiction; it is two different quantities, and only one of them buys equipment.
    background:
    - Why the two diverge. Residents use energy all year and set the average. Visitors use it in twenty weeks and
      concentrate it in evenings. So they barely move the annual total. They land squarely on the peak half hour
      that sizes the plant.
    - What over-sizing costs. Diesel sets run inefficiently at part load, so a plant sized for a peak that rarely
      happens burns more fuel per unit all year. The cost of being wrong upward is continuous and invisible. The
      cost of being wrong downward is one dark evening, and very visible. That is why plants are usually over-sized.
    - Why the falling resident number does not save any equipment. Fewer residents lowers the average and the fuel
      bill. It does nothing to the July evening with the ferry alongside and the cable out, and that half hour is
      what the third diesel set exists for.
    assumes:
    - the twenty-five-year specification cannot be revisited cheaply
    takeaway: Two trends in opposite directions are two quantities, and each buys something different.
    format: CHOICE
    question: Which trend should set plant capacity, and which should guide annual fuel or energy purchases?
    choices:
    - The July peak for plant; the falling average for fuel.
    - The falling resident population, on the grounds that it is the long-run trend.
    - The rising July peak, for both plant and fuel.
    - The present annual average, as the most stable figure available.
    answer: The July peak for plant; the falling average for fuel.
    why: 'The two trends answer two different questions and the specification needs both. Plant is bought for the
      worst credible half hour. That is a July evening with the boat alongside and the cable out. It is rising,
      whatever the register does. Fuel, tariffs and anything a turbine displaces follow the annual total, which
      is falling with the resident population. Following the falling trend alone leaves the island dark on the one
      evening it has visitors. Following the peak for both over-sizes the sets. Diesels at part load burn more per
      unit all year, and that is a continuous invisible cost. The present average is stable because it averages
      the two trends into a number describing neither.

      '
    rebuttals:
    - Sizing plant to a falling average leaves nothing for the one half hour that has always set the plant.
    - Sizing fuel to the peak assumes a load the island has never held for more than thirty minutes.
    - Today's average is the midpoint of two opposing trends and describes neither of them in twenty-five years.
- title: Should Vellan add the second ferry?
  objective: Turn the fifteen-day investigation into one conditional recommendation the council can vote on tonight.
  briefing: The pack closes at four. At seven the council must choose between refusing the extra sailing and approving
    it under limits the island can actually enforce.
  stake: Day 15. The evidence no longer supports either simple slogan. Vellan is already overusing some systems,
    but the proposed ferry is not the main cause of several of those problems — and it could help fund enforcement
    and keep the island connected. Today you decide whether to approve a trial, which limits are non-negotiable,
    and which claims must stay out of the council paper.
  takeaway: Carrying capacity is not a single headcount. It is a set of rates, thresholds and feedbacks that determine
    what a place can sustain under stated conditions.
  stops:
  - group: HARB
    task: Choose a decision that addresses the real water constraint rather than the visibility of the ferry
    title: What recommendation do you sign?
    place: Harbour Office
    reason: Calloway and Sorley now agree on the numbers but not on whether they add up to a yes. The council needs
      one recommendation with a trigger it can enforce.
    concept: Carrying capacity, and what happens on the way past it
    takesAsRead:
    - Exponential growth, and reading a doubling time off a rate
    scene: Current abstraction is about 331,000 cubic metres a year before the extra sailing. Repairing the 51,000-cubic-metre
      leak would cut that to about 280,000; the proposed summer sailing adds only about 840. Recharge is estimated
      at 294,000, and July chloride is rising.
    guide: Carrying capacity is not a number of people, it is a rate the place can sustain indefinitely. Ask what
      the binding constraint actually is here, then say what "for how long" means when the store buffers nine years
      of error. The answer is a condition rather than a yes or a no, and the condition has to name the quantity
      it caps.
    background:
    - Why capacity is not a headcount. The same island can support more people using less water each, or fewer people
      using more. The relevant physical quantities are flows, stocks and thresholds, not one permanent population
      number.
    - Why a stock can hide overshoot. Groundwater stored over many years can support withdrawals above current recharge
      for a while, so the problem may look sustainable until water levels or chemistry respond.
    - What a defensible recommendation looks like. It names the operating cap, the period over which it is measured,
      the indicator that triggers a tighter cap, and who is responsible for reading it.
    assumes:
    - the recharge estimate developed on day 2 stands as the pack's number
    takeaway: A conditional approval can distinguish the small new demand from the large existing loss while keeping
      an explicit trigger if the aquifer keeps worsening.
    format: CHOICE
    question: What should your recommendation to the council say?
    choices:
    - Approve a one-year trial after the main leak is repaired, capped near 281,000 m³ and reviewed if chloride worsens.
    - Approve it under the existing 340,000 m³ licence, because the ferry itself uses less than 1,000 m³ a year.
    - Reject the ferry outright, because any new water demand is unsafe while July chloride is still rising.
    - Delay the decision until a second borehole has proved the island's exact carrying capacity.
    answer: Approve a one-year trial after the main leak is repaired, capped near 281,000 m³ and reviewed if chloride worsens.
    why: The second sailing is not the main water problem. With the current leak, abstraction is about 331,000 m³/y
      before the new ferry and roughly 332,000 with it. Repairing the 51,000-m³/y leak changes that to about 280,840,
      below the present 294,000-m³/y recharge estimate. Because recharge is itself an estimate and the chloride
      trend is worsening, that number should be treated as a one-year operating cap with monitoring rather than
      a permanent safe yield. Keeping the old 340,000-m³ licence ignores the existing imbalance. Rejecting the ferry
      saves less than 1,000 m³/y while leaving the 51,000-m³ leak untouched. A second borehole would not create
      new recharge.
    rebuttals:
    - A small ferry draw does not make the existing 340,000-m³ licence safe; the present system is already above
      the recharge estimate.
    - Rejecting the ferry leaves the 51,000-m³ leak untouched, even though the ferry adds less than 1,000 m³ a year.
    - A second borehole can change pumping capacity, but it cannot create new recharge into the island.
  - group: REEF
    task: Keep the strong claims, label the estimates and remove statements that claim more than the data
    title: Which sentences survive the evidence?
    place: Reef Station
    reason: Dunmore and Berhane need the final pack to survive being read by somebody who disagrees with it.
    concept: 'Reading an environmental claim: what a number is about, and over what period'
    takesAsRead:
    - Concentration against load, and why a small pipe can matter
    scene: 'Four sentences remain in the draft: one about recharge, one about July chloride, one about reef warming
      and one about the observed reef-cover trend. The vote is in three hours.'
    guide: Read each sentence against the evidence in the pack rather than against whether you agree with it. A
      sentence can be true, defensible and still wrong to include if the period is missing or the claim is stronger
      than the data. Find the two that fail and say which failure each one is.
    background:
    - The two ways a pack sentence fails. It claims more than the evidence supports, or it carries a figure with
      no period so it will be requoted as a permanent fact. Both are survivable in a conversation and neither survives
      being read out by somebody who disagrees.
    - 'Why the strongest sentence should stay in. Understating is a failure too: a paper that says less than it
      knows invites a decision the evidence would have prevented. The eleven-spring cover trend and the five-July
      chloride series both belong in at full strength.'
    - Why this is the last stop of the fortnight. Everything measured over fourteen days arrives here as sentences
      somebody will read aloud at seven o'clock. The work is worth exactly as much as the sentences can bear.
    assumes:
    - the pack's figures are the ones measured across the fortnight
    takeaway: A pack sentence fails by claiming too much or by dropping its period.
    format: PROTOCOL
    columns:
    - The draft sentence
    - The verdict on it
    scenarios:
    - Best recharge estimate is about 294,000 cubic metres a year, using the licence's 0.20 recharge fraction
    - Chloride at the borehole is 191 milligrams a litre
    - Warming has caused the loss of reef cover in the bay
    - Cover on the eleven transects has fallen from 41 to 26 per cent since the record began
    choices:
    - Stands if labelled as an estimate and the recharge-fraction assumption is stated.
    - Drop the period and it becomes an annual figure the data never measured — it is a July peak.
    - Claims a cause the evidence cannot separate; the correlation can be stated instead.
    - 'Stands: a trend measured the same way over long enough to be one.'
    mapping:
    - 0
    - 1
    - 2
    - 3
    rebuttals:
    - The rainfall record is local, but the 0.20 recharge fraction is still an assumption. The number belongs in
      the pack as an estimate, not as a direct measurement.
    - 191 is a July peak. Without its month it is quoted afterwards as the island's water.
    - Attribution needs control sites and event-level evidence the island does not have.
    - Eleven springs of the same method is a trend, and stating it at full strength is the point.
    answerText: Keep the recharge estimate with its assumption, label 191 mg/L as a July value, remove the causal
      warming claim, and keep the observed reef-cover trend.
    why: All four sentences can be checked against what the fortnight actually established. The 294,000-m³/y recharge
      figure is useful, but it depends on a 0.20 recharge fraction and must be labelled as an estimate. The 191-mg/L
      chloride value is a July peak, not an annual water-quality value. The reef-cover decline is an observed trend
      from the same transects over eleven springs and can be stated directly. The claim that warming caused the
      entire decline is stronger than the evidence because there are no control reefs or event-level attribution
      data.
  - group: COMMON
    task: Turn the science into an order the council can actually adopt
    title: Write the conditions into the vote
    at: pack-table
    place: Common Office
    reason: The final decision is useful only if the operating limits, enforcement and review are written into the
      motion rather than left in the background report.
    concept: 'An ecosystem as a budget: what comes in, what leaves, what stays'
    scene: The council is prepared to consider a one-year trial. Your last job is to put the decision and its safeguards
      in the order they must appear in the motion.
    guide: Look for what the four have in common rather than what each says. Each one replaced something with something
      else of a different kind, and the same replacement happened four times. Name it, because that is what the
      council is being asked to adopt as a way of working rather than as four items.
    background:
    - What each of the four did. The stocking limit replaced a proportion of an uncounted total with a number of
      animals, inspected. The volume plan replaced tonnage with cubic metres per pound. The gearbox replaced a nameplate
      rating with a measured capacity factor. The cap replaced a licensed figure with a measured recharge.
    - 'Why that is one move and not four. In every case a figure was inherited from elsewhere: a template, a brochure,
      a proportion, an invoice. Each was replaced by a quantity measured on Vellan, with a period attached. The
      measurement was cheap in all four cases and nobody had taken it.'
    - What it does not settle. The reef's decline is still not attributable. The beetle is still in the tunnels.
      The hole still has eleven years in it. The register is still falling at four per cent a year. A fortnight
      of measurement changes what the council can decide, not what the island is.
    assumes:
    - the four decisions of the fortnight are the pack's substance
    takeaway: A measured local number with a period on it is worth more than an inherited figure.
    format: SEQUENCE
    question: Put the four parts of the council motion in the order that turns a conditional yes into an enforceable
      trial.
    cards:
    - Approve a one-year trial of the second daily summer sailing.
    - Before the trial begins, repair the main leak; cap first-year pumping near 281,000 m³ and monitor water level
      and July chloride.
    - From the first extra sailing, use added harbour revenue for fishery receipt checks and inspect incoming soil,
      plants and pallets.
    - After one full summer, review resident numbers, water chemistry, peak power, waste volume and ecological indicators
      before renewing the trial.
    order:
    - 0
    - 1
    - 2
    - 3
    axis: from the decision to the safeguards and review
    ends:
    - the council decision
    - the review that decides whether it continues
    answerText: Approve the trial; put the water limit in force before it starts; attach enforcement and biosecurity
      to the extra sailing; review the evidence after one summer.
    why: 'The motion has to make the science operational. First it states the decision: a one-year trial rather
      than a permanent expansion. Second it sets the binding resource condition before the new service starts: repair
      the large leak, hold pumping near the post-repair budget and watch chloride and water level. Third it attaches
      the two transport-dependent safeguards to the transport itself — fishery enforcement and berth inspection.
      Finally it requires a review using the quantities that actually changed. That turns ''yes, with conditions''
      into something the island can enforce and reverse if the conditions fail.'
  segue: The pack is closed. The only thing left is the vote.

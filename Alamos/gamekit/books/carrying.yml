  - group: TIP
    task: 'Rank waste by the constraint Vellan actually has: landfill volume and ferry freight'
    title: What should leave the island?
    at: weighbridge
    place: Tip and Sorting Yard
    reason: Okafor needs to know which materials are worth shipping, crushing or reusing before the extra sailing
      is treated as a solution to every waste stream.
    concept: An ecological footprint, and what a visitor adds to one
    takesAsRead:
    - Carrying capacity, and what happens on the way past it
    scene: The tip is short of volume, while the ferry charges by mass. Plastic, glass, compostables and scrap therefore
      rank very differently depending on which constraint is being solved.
    guide: The tip is short of volume, not of mass, and the ferry charges for mass. Rank the four streams by volume

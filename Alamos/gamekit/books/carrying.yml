copy:
  HARB: <p>The harbour office. Nineteen years of landings in a hand-ruled book, and the only door every catch on this island passes through.</p>
  WATER: <p>The waterworks. One borehole, two tanks and a rain gauge that is read by hand because the automatic one under-reads in wind.</p>
  COMMON: <p>The common office. Forty-one shares over sixty-two hectares, and a stocking limit that has been argued about every spring since it was written.</p>
  TIP: <p>The tip and sorting yard. Everything the island has finished with, weighed on arrival, in a hole with eleven years left in it.</p>
  POWER: <p>The turbine yard. Three diesel sets, a sea cable that failed twice in March, and a machine on the hill waiting for a gearbox.</p>
  REEF: <p>The reef station. Eleven springs of transect counts, which is the longest continuous record of anything on Vellan.</p>
  BERTH: <p>The ferry berth. Tuesdays and Fridays, and the only way anything arrives or leaves.</p>
  SCHOOL: <p>The island school. Nineteen on the register, five to eleven, one room. It closes at twelve.</p>
  CHAPEL: <p>The chapel and hall. The council meets here, and the vote is at seven.</p>
  LIGHT: <p>The old light, unlit since 1974. The lens went to the mainland museum and the tower is a landmark and a bird roost.</p>

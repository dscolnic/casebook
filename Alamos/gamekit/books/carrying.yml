  - group: TIP
    task: Test what an eleven-year landfill estimate assumes about growth
    title: How fast is the dump filling?
    at: weighbridge
    place: Tip and Sorting Yard
    reason: Okafor needs the council to see that 'eleven years left' only holds if annual waste stops growing.
    relationship: 'doubling time = 70 / r: anything growing at a steady percentage doubles in roughly seventy over
      that percentage.'
    concept: Exponential growth, and reading a doubling time off a rate
    scene: The tip received 204 tonnes last year. Arrivals have been rising about 3.5 per cent a year, while the
      cell's remaining volume is usually described as 'eleven years at last year's rate'.
    guide: A quantity growing by the same percentage each year does not add, it multiplies, and the useful way to
      feel that is the time it takes to double. Divide seventy by the annual percentage. Then set the doubling time
      against the eleven years the hole is said to have. Decide whether "eleven years at last year's rate" is a
      forecast, or a sentence with a condition hidden in it.
    background:
    - 'Where the seventy comes from. It is the natural logarithm of two, multiplied by a hundred. So it works for
      any steadily compounding quantity: a population, a landfill, a bank balance, an epidemic. Seven per cent doubles
      in ten years, one per cent in seventy.'
    - Why "at last year's rate" is the load-bearing phrase. Eleven years of volume divided by a constant annual
      tonnage is arithmetic. The tonnage is not constant, and a quantity that doubles in twenty years fills a hole
      considerably sooner than a flat one does. The phrase makes the estimate sound careful while removing the growth.
    - What the island can do about the rate rather than the hole. What leaves on the ferry costs money per tonne
      and what stays takes volume. Hollis takes compostable material off the waste and sorting lead Okafor's hands and returns it as topsoil. That is the only stream on the island genuinely removed from the arithmetic.
    assumes:
    - the 3.5 per cent annual rise continues at the same rate
    takeaway: A steady percentage growth doubles in seventy over that percentage, and it fills a hole early.
    format: BALLPARK
    question: At 3.5 per cent annual growth, about how long does it take the yearly waste stream to double?
    estimate:
      prompt: Waste arriving at the tip has risen about 3.5 per cent a year. Okafor wants the doubling time before
        she signs the eleven-year figure.
      question: At 3.5 per cent annual growth, about how long does it take the yearly waste stream to double?
      labels:
      - 70  (the constant in the rule)
      - 3.5 %  (annual growth in tonnage)
      - 204 t  (last year's arrivals)
      - 11 years  (volume left at last year's rate)
      values:
      - 70
      - 3.5
      - 204
      - 11
      slots: 2
      template: '{0} ÷ {1}'
      formula: a/b
      correct:
      - 0
      - 1
      target: 20
      tolerance: 2
      units: years
      solution: doubling time = 70 ÷ 3.5 = 20 years.
      explanation: About 20 years to double. At 3.5% growth, the annual stream is ~46% larger after eleven years.
    answerText: About twenty years to double. If 3.5% growth continued, the annual waste stream would be about 46%
      larger after eleven years.
    why: 'Seventy divided by 3.5 gives a doubling time of about twenty years. That does not mean the stream rises
      by only a third over the cell''s stated eleven-year life: 1.035^11 is about 1.46, so the annual inflow would
      be roughly 46% larger by then if the trend continued. A cell with capacity for eleven flat years of today''s
      waste would fill in about ten years under that growth path. The important phrase is ''at last year''s rate'':
      the eleven-year estimate is a conditional calculation, not a forecast.'
    rebuttals:
    - Multiplying 204 tonnes by eleven years is the flat calculation the eleven-year figure already assumes.
    - The eleven years is the answer being tested, not an input to the doubling time.
  - group: HARB
    task: Put residents and visitors on the same person-day clock
    title: What does a summer visitor actually add?
    place: Harbour Office
    reason: Calloway needs visitor pressure compared with resident use in the months when water and power are tightest,
      not diluted across a whole year.
    concept: An ecological footprint, and what a visitor adds to one
    takesAsRead:
    - Carrying capacity, and what happens on the way past it
    scene: Vellan has 91 residents. Last July the ferry carried 340 day visitors and 61 people who stayed overnight.
      The resource systems feel days and nights of use, not the number of tickets sold.
    guide: A population is not the same as a load. Ask what each kind of person actually draws from the island's
      budgets — water, waste, power — and for how long. A day visitor and a resident are not the same number of
      anything. Adding them as though they were is how the ferry paper reaches a figure that looks harmless.
    background:
    - What a footprint measures. The land and water needed to supply what somebody consumes and absorb what they
      discard. On an island the interesting part is not the total. It is the share of that total which has to be
      met locally. Water and waste cannot be imported or exported cheaply. Power partly can.
    - Why day visitors and overnight visitors are different quantities. A day visitor uses a toilet, buys lunch
      and leaves; an overnight visitor showers, washes and produces a day's waste. The water difference between
      the two is roughly tenfold, and the ferry paper's headline counts them together.
    - Why peak matters more than average here. Three hundred and forty visitors spread over a year is invisible
      in every budget. The same number in July arrives when the borehole is at its lowest. The tanks are already
      being managed by then. July is the one month the island's spare capacity is not spare.
    assumes:
    - the register and the manifests both cover the same July
    takeaway: A visitor is a load rather than a person, and peak load is what the budgets feel.
    format: CHOICE
    question: Which comparison best tells the council how visitors add to July resource demand?
    choices:
    - Visitor-nights against resident days in the same month, per head.
    - Total visitor numbers across the whole year set against the resident population of 91.
    - Day visitors against overnight visitors, counted as arrivals.
    - Ferry sailings in July against sailings in January.
    answer: Visitor-nights against resident days in the same month, per head.
    why: 'The budgets feel person-days, not arrivals, and they feel them in the month they happen. Sixty-one overnight
      visitors across July is a few hundred visitor-nights. Each of those nights draws something like a resident''s
      daily water. Three hundred and forty day visitors draw roughly a tenth of that each. Putting both into one
      annual total is what makes the figure look harmless, because it divides the peak across eleven months that
      were never under pressure. Sailings are a proxy for arrivals and arrivals are a proxy for load, and each step
      of that chain loses the thing the council has to decide.

      '
    rebuttals:
    - An annual comparison spreads July across eleven months that had spare capacity, which is what hides the peak.
    - Arrivals count people through the berth; a day visitor and an overnight visitor are not the same load.
    - Sailings measure the ferry's schedule rather than what anybody drew from the island's stores.
- title: How much life can the island support?
  objective: Trace the limits on the bay, the common and the food web, and separate a real trend from a claim that
    goes too far.
  briefing: The fishing quota, the parking plan and the reef record all assume that losing a little at the bottom
    costs only a little at the top.
  stake: Day 3. The extra ferry would bring more visitors, more parking and more pressure on the harbour, while
    the west-ground catch has already fallen. Today you follow energy and habitat through the system to see why
    small changes low in the web can become large constraints higher up.
  takeaway: 'Ecological limits propagate: less habitat or less production at the bottom can remove much more room
    for harvest at the top.'
  segue: >-
    The bay and common both have limits, but the most urgent new number is back at the borehole: July
    chloride has risen again. On day 4 you find out whether the island's water store has been carrying
    an old mistake.
  stops:
  - group: REEF
    task: Follow energy from producers to predators
    title: How much energy reaches the fish we catch?
    at: transect-bench
    place: Reef Station
    reason: Berhane wants the quota debate tied to the energy that can actually reach the west-ground predators.
    relationship: 'E_next = 0.10 × E_level: about a tenth of the energy at one trophic level reaches the next.'
    concept: Energy transfer between levels, and why the top is thin
    takesAsRead:
    - 'Food webs and trophic levels: who eats whom, and how much of it'
    scene: Plankton in the bay fix about 84,000 kilojoules per square metre each year. The fish the boats land are
      about three trophic transfers above those producers.
    guide: Work upward one step at a time. Roughly a tenth of the energy held at each level reaches the one above
      it, because most of it is spent living, lost as heat or never eaten. Three steps up from the producers is
      a tenth of a tenth of a tenth. Do the arithmetic before deciding whether the west ground's landings are plausible.
    background:
    - Where the ninety per cent goes. Respiration takes the largest share, because an animal spends most of what
      it eats staying alive. The rest is lost as heat, excreted, or simply not eaten. The tenth that transfers is
      an average across systems and runs from about two per cent to twenty.
    - Why this is the reason food chains are short. Four steps up from a producer leaves a ten-thousandth of the
      original energy, which cannot support a population of any size. It is also why a predator at the top of a
      web is rare, slow to mature and slow to recover. And it is why fishing one is a different proposition from
      fishing a herbivore.
    - What it means for the quota argument. Landings are measured at the thin end. A change in the plankton or in
      what grazes it moves the top of the web, with a lag of years. So a stock assessment that reads only landings
      sees the consequence long after the cause. That is Rask's objection to a quota argued in tonnes alone.
    assumes:
    - the ten per cent transfer figure applies at each step in this bay
    takeaway: Three steps up a web leaves a thousandth of the energy the producers fixed.
    format: BALLPARK
    question: Roughly how much of that energy reaches the third trophic level above the producers?
    estimate:
      prompt: The bay's producers fix about 84,000 kJ per square metre a year. The west boats land the third level
        above them.
      question: Roughly how much of that energy reaches the third trophic level above the producers?
      labels:
      - 84000 kJ/m²  (producers, per year)
      - 0.10  (the fraction reaching the next level)
      - 3  (steps up to the landed predator)
      - 0.90  (the fraction lost at each step)
      values:
      - 84000
      - 0.1
      - 3
      - 0.9
      slots: 2
      template: '{0} × {1}³'
      formula: a*Math.pow(b,3)
      correct:
      - 0
      - 1
      target: 84
      tolerance: 12
      units: kJ/m² a year
      solution: 84,000 × 0.10 × 0.10 × 0.10 = 84 kJ per square metre a year.
      explanation: A thousandth of what the plankton fixed. The landed predator is living off 84 kJ where the producers
        had 84,000.
    answerText: About 84 kilojoules a square metre a year — a thousandth of what the producers fixed.
    why: 'Three transfers at a tenth each leave a thousandth, so 84,000 kilojoules becomes 84. That is the whole
      reason the top of a web is thin, and it reframes the quota argument. The west boats are harvesting a level
      that only ever receives a thousandth of the bay''s production. So a small proportional change lower down is
      a large change to them. Using the 0.9 gives 61,000, which is what is lost rather than what transfers. It is
      a plausible number with the wrong meaning. The tile is on the board because that is exactly how the mistake
      is made. The lag matters as much as the size: a change at the bottom reaches the landings years later.

      '
    rebuttals:
    - The 0.9 is the share lost at each step; applying it gives what did not transfer.
    - One transfer rather than three answers about grazers, which nobody lands here.
  - group: COMMON
    task: Estimate the species-richness effect of shrinking the common
    title: What does losing eleven hectares cost?
    at: common-map
    place: Common Office
    reason: Pike needs the habitat cost of the proposed parking and serviced pitches quantified before the land
      is treated as empty space.
    relationship: 'The species–area relationship, S = cAᶻ: richness rises with the area of habitat, far more slowly
      than area itself.'
    concept: 'Island biogeography: area, isolation and the species a place can keep'
    takesAsRead:
    - Species richness, and what an island holds that a mainland does not
    scene: The common holds 96 recorded plant species across 62 hectares. The ferry proposal would take eleven hectares
      of the flattest, best-drained ground, leaving 51.
    guide: 'Species richness and area are related by a power law, not a straight line: the exponent for islands
      is about a quarter. Work out what 51 hectares would hold given what 62 holds, using that exponent. Then compare
      the loss of species with the loss of area, because they are nothing like the same fraction.'
    background:
    - What the exponent means. Because z is about 0.25, richness goes as roughly the fourth root of area. Halving
      the area does not halve the species; it costs about sixteen per cent of them. Which cuts both ways — a small
      protected area keeps far more than its share, and a small loss is not harmless either.
    - Why islands have their own exponent. On a mainland a patch is restocked constantly from next door. Here it
      is not. Whatever goes locally extinct has to arrive across open water to come back. So island richness sits
      lower for the same area, and falls further when area is taken.
    - What the relationship cannot tell you. Which species. The eleven hectares proposed are the flattest and best-drained
      part of the common. That is where the two orchids in the common grazing officer Pike's list are. Nothing else on the island offers the
      same conditions. A power law is about counts and is silent about the identity of what is lost.
    assumes:
    - the same species–area relationship holds across the common
    takeaway: Richness goes as about the fourth root of area, so a small area loss costs fewer species than it looks.
    format: BALLPARK
    question: Using the species-area relation shown, estimate the expected richness at 51 hectares.
    estimate:
      prompt: The common holds 96 plant species over 62 hectares. The proposal takes eleven of them, leaving 51.
      question: Using the species-area relation shown, estimate the expected richness at 51 hectares.
      labels:
      - 96  (species now)
      - 51 ha  (area after the take)
      - 62 ha  (area now)
      - 0.25  (z, the island exponent)
      - 11 ha  (the area the proposal takes)
      values:
      - 96
      - 51
      - 62
      - 0.25
      - 11
      slots: 4
      template: '{0} × ({1} ÷ {2})^{3}'
      formula: a*Math.pow(b/c,d)
      correct:
      - 0
      - 1
      - 2
      - 3
      target: 91
      tolerance: 3
      units: species
      solution: S = 96 × (51 ÷ 62)^0.25 = 96 × 0.951 = 91 species.
      explanation: Five species for eleven hectares — an eighteen per cent area loss costs about five per cent of
        the richness.
    answerText: About 91 species — five lost for eleven hectares, because richness follows the fourth root of area.
    why: 'The ratio of areas is 0.82, and raised to the power 0.25 that is 0.95, so the count falls from 96 to about
      91. An eighteen per cent loss of ground costs about five per cent of the species. That is the general shape
      of the relationship, and it cuts both ways. A small reserve keeps more than its share. A small loss is never
      proportional. What the arithmetic cannot say is which five, and that is the part Pike will raise. The eleven
      hectares proposed are the flat, well-drained end of the common. That is where the two orchids are, and nothing
      else on Vellan offers the same conditions.

      '
    rebuttals:
    - Scaling the species count by the area ratio directly assumes a straight line, which islands do not follow.
    - Using the area lost rather than the area remaining answers what the eleven hectares hold on their own.
  - group: WATER
    task: State the strongest claim five July samples can support
    title: What does the chloride series actually prove?
    place: Waterworks
    reason: Sorley wants the rising chloride treated as a warning without letting one seasonal series become a claim
      about the whole year or a proven source.
    concept: 'Reading an environmental claim: what a number is about, and over what period'
    takesAsRead:
    - Concentration against load, and why a small pipe can matter
    scene: July chloride at the borehole has risen from 74 to 88, 96, 121 and now 191 milligrams per litre over
      five years. No other month has been sampled.
    guide: 'Ask three questions of the number before anybody quotes it: what it is about, over what period, and
      what it is being compared with. A single reading is evidence about the day it was taken. Five readings all
      taken in the same month are evidence about that month across five years, which is a stronger claim about a
      different thing.'
    background:
    - Why July is the worst month to sample and the right month to sample. Abstraction is highest and recharge is
      lowest, so July is when chloride peaks. That makes a July reading unrepresentative of the year. It also makes
      it exactly the right measurement for deciding whether the borehole is being over-drawn.
    - What the series can support. Five Julys rising from 74 to 191 is a trend in the peak. The rise is faster than
      the abstraction has grown. That is the signature of seawater arriving rather than of concentration by evaporation.
      That is a claim worth making and it is not the same claim as "the island's water is at 191".
    - 'How the misquote happens. The figure enters the pack as "chloride at 191 mg/L", loses its month on the way,
      and comes back as the island''s water quality. Sarah Dunmore, the council clerk, has a rule for this: every
      figure carries what it is about and over what period.'
    assumes:
    - all five readings were taken at the same borehole by the same method
    takeaway: A reading is evidence about the conditions it was taken under, and the period is part of the claim.
    format: CHOICE
    question: What is the strongest defensible claim from these five July readings?
    choices:
    - The July chloride peak has risen in each of the five sampled years.
    - The island's water contains 191 milligrams of chloride a litre.
    - Seawater intrusion has been confirmed at the borehole.
    - Chloride at the borehole varies with the season, peaking in the summer months.
    answer: The July chloride peak has risen in each of the five sampled years.
    why: 'Five measurements taken in the same month can establish a trend for that month: July chloride has risen
      from 74 to 191 mg/L across the five sampled years. The data do not establish the island''s annual-average
      chloride, because no other months were sampled. They also do not identify the source by themselves; confirming
      seawater intrusion would need additional evidence such as water levels, another borehole, or a chemical tracer.
      The strong claim is the narrow one: the July peak is rising.'
    rebuttals:
    - The 191 is a July peak. Quoted without its month it becomes an annual figure the data never measured.
    - Intrusion is the likely mechanism and needs a ratio or a second borehole to be confirmed.
    - Seasonality cannot be shown by five samples all taken in the same month of the year.
    answerText: The July chloride peak has risen in each of the five sampled years; the series does not by itself
      prove seawater intrusion or describe other months.

    answer: The highest measured concentration on the network, which is not the dose anyone actually receives.
    why: The school result establishes that this tap had the highest measured nitrate concentration in the network.
      That makes it important for exposure, especially because children have lower body mass, but the concentration
      alone does not tell you why the school tap is higher or where the nitrate entered the system. Tomorrow's dose
      calculation adds intake and body mass; source attribution would need a different set of measurements.
    rebuttals:
    - It is the worst point on the network, not the network's average; quoted as the island's water it overstates
      the whole.
    - Nothing here points at a source inside the school. The reading is explained by where the tap sits and when
      it was sampled.
    - Standing water over a weekend is a real condition the children then drink, not an artefact to be discarded.

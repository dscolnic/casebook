roster:
- id: calloway
  name: Ines Calloway
  role: Harbourmaster
  division: HARB
  bio: 'Runs the harbour, the ferry contract and the landings book, and has kept

    that book by hand for nineteen years because the electronic one loses the

    column she cares about — who landed what, and whether they were over.


    Her argument for the second sailing is not tourism. It is the landing fee

    and the school: nineteen children on the register, and a school closes at

    twelve. She has done the arithmetic on both and will show anybody who asks.


    What she will not accept is a quota with nothing behind it. An unenforced

    rule, she says, is worse than no rule, because the boats that keep it are

    the ones that lose.

    '
  quiz:
  - q: Why does Calloway argue a quota nobody enforces is worse than none at all?
    a: It punishes the boats that keep it and saves nothing
    wrong:
    - Quotas cannot be set without a mainland licence, which the island has never applied for
    - A quota always reduces the total catch below what the stock can replace
    - Fishermen cannot count their own landings accurately
- id: berhane
  name: Tomas Berhane
  role: Reef Ecologist
  division: REEF
  bio: 'Has counted the same eleven transects off the point every spring for

    eleven years, which is the longest continuous record of anything on this

    island and the only one that predates the borehole.


    He is careful about what a count can say. Eleven springs is enough to see

    a trend in cover and not enough to attribute it, and he will say so in a

    meeting that wants him to say more.


    His objection to the ferry is specific rather than general: the sailing

    brings water demand in July, and July is when the borehole is already

    drawing chloride.

    '
  quiz:
  - q: Why will Berhane not attribute the reef's decline to a cause in a council meeting?
    a: Eleven years shows a trend without separating the causes
    wrong:
    - He has not been asked for an opinion, and volunteering one at a meeting is not how the record is kept
    - Transect counts measure cover rather than the health of individual corals
    - Attribution requires a laboratory the island does not have
- id: sorley
  name: Mairead Sorley
  role: Water Engineer
  division: WATER
  bio: 'Keeps the borehole, the storage tanks and a rain gauge she reads herself

    every morning at seven, because the automatic one under-reads in wind and

    the wind here is the point.


    She treats the island''s water as a bank account with one deposit — rain on

    the catchment — and several standing orders. Her objection to most plans is

    that they add a standing order and no deposit.


    She is the person who noticed the chloride, and she reported it as a

    single reading rather than a trend, which is why it was believed.

    '
  quiz:
  - q: Why does Sorley read the rain gauge by hand rather than trusting the automatic one?
    a: The automatic gauge under-reads in wind, which here is normal weather
    wrong:
    - There is no power at the borehole gauge, so the automatic one has never been commissioned
    - Hand readings are required by the abstraction licence
    - She does not trust any instrument she did not install herself
- id: pike
  name: Dan Pike
  role: Common Grazing Officer
  division: COMMON
  bio: 'Administers the grazing rights on the common: forty-one shares, nine

    graziers, and a stocking limit that has been argued about every spring

    since it was written.


    He knows the failure mode from the inside. Nobody overgrazes on purpose;

    each grazier adds one more animal because one more animal is worth having

    and the cost is spread across everyone.


    He is unromantic about the fix. Rules, counted stock, and a limit that is

    inspected — which makes him the least popular man at the spring meeting.

    '
  quiz:
  - q: Why does Pike say nobody overgrazes the common on purpose?
    a: One grazier gains the animal and all nine pay for it
    wrong:
    - No grazier can see the whole common at once, so nobody knows what it is carrying
    - The stocking limit has never been written down
    - Sheep move between shares, so nobody knows whose they are
- id: okafor
  name: Blessing Okafor
  role: Waste and Sorting Lead
  division: TIP
  bio: 'Runs the tip, the sorting yard and the compaction shed, and is the only

    person here who weighs what arrives. Ninety-one people, two hundred and

    four tonnes a year, and a hole with eleven years left in it.


    Her standing complaint is that waste is discussed as a moral question and

    settled as an arithmetic one. What leaves on the ferry costs money per

    tonne; what stays takes volume and vents gas.


    She keeps the leachate log because the tip sits up-catchment of the

    borehole, which nobody chose and everybody has to live with.

    '
  quiz:
  - q: Why does Okafor keep a leachate log at all?
    a: Anything leaving the cell runs downhill toward the borehole
    wrong:
    - The abstraction licence requires a written record of everything that enters the tip
    - Leachate volume is how she estimates the remaining life of the hole
    - It is the only way to tell recyclable waste from general waste
- id: ferris
  name: Aled Ferris
  role: Power Engineer
  division: POWER
  bio: 'Keeps three diesel sets, a failing sea cable and a turbine on the hill

    that has been out of service for two years waiting for a gearbox nobody

    will ship for one machine.


    He can tell you the island''s demand hour by hour for the last four years,

    and his point is always the same: the peak is what sizes the plant, and

    the peak is a July evening when the ferry has been in.


    He does not argue about renewables in the abstract. He argues about

    capacity factor, because a nameplate rating is a number for a brochure.

    '
  quiz:
  - q: Why does Ferris insist on capacity factor rather than a machine's rating?
    a: A rating is the best hour; the factor is the average one
    wrong:
    - Ratings are set by the manufacturer rather than measured, and are usually generous
    - Capacity factor determines whether the turbine can meet the July peak
    - A rating cannot be compared between wind and diesel machines
- id: nkemdi
  name: Grace Nkemdi
  role: Island Nurse
  division: WATER
  bio: 'The island''s only clinician, which means she is also its public health

    service, its environmental health officer and the person who signs the

    water sample forms.


    She thinks about exposure in the way the job forces: not concentration but

    dose, and not dose but dose per kilogram, because the youngest person

    drinking the island''s water weighs eleven kilos.


    She is the reason the school''s tap is sampled separately, which she asked

    for twice and got on the third try.

    '
  quiz:
  - q: Why did Nkemdi push for the school tap to be sampled separately?
    a: The same water is a larger dose per kilogram for a child
    wrong:
    - The school sits at the end of the distribution main, where the water stands longest between draws
    - School water is used for cooking and therefore concentrated by boiling
    - The licence requires a sample from every public building
- id: rask
  name: Petra Rask
  role: Fisheries Observer
  division: HARB
  bio: 'Comes over on the Tuesday boat, spends three days a fortnight on the

    landings and writes the stock assessment nobody on the island wants to

    read.


    Her assessments carry ranges rather than numbers, and she defends the

    ranges: a stock estimate with no width to it invites a quota set at its

    edge, and the edge is where a fishery goes.


    She is straightforward about the limit of her own method. Landings tell

    you what came out, not what is left, and the two diverge exactly when it

    matters most.

    '
  quiz:
  - q: Why does Rask report a stock as a range rather than a single figure?
    a: With no width stated, a council reads the convenient end as the finding
    wrong:
    - The mainland fisheries authority requires assessments to be reported as ranges
    - The landings data is too sparse to support a single number
    - A range lets the council choose the figure it prefers
- id: hollis
  name: Ewan Hollis
  role: Market Gardener
  division: COMMON
  bio: 'Grows most of what the island eats that is not landed or shipped: four

    polytunnels, two acres outside, and a soil he has been building for

    fifteen years out of seaweed and everything the tip will let him have.


    He is the island''s argument for compost made physical. Every tonne he

    takes off Okafor''s hands is a tonne that does not go in the hole, and it

    comes back as the only deep topsoil on Vellan.


    He sprays, and he is exact about when. Spraying on a calendar, he says,

    breeds the thing you are spraying for.

    '
  quiz:
  - q: Why does Hollis refuse to spray on a fixed calendar?
    a: Spraying regardless of numbers breeds resistance
    wrong:
    - Spraying to a calendar costs more over a season than treating only when the count requires it
    - Sprays break down too quickly to be applied in advance
    - The licence limits the number of applications per season
- id: mbeki
  name: Josef Mbeki
  role: Skipper, Kestrel Wynd
  division: HARB
  bio: 'Fishes the west ground with a crew of two and has done for twenty-six

    years. He has kept to the quota for nine of them and can name the four

    boats that have not.


    His view of the commons is not theoretical. He watched the west ground

    thin over a decade, and he can tell you what a good year looked like in

    2004 in a way no assessment does.


    He wants the rule enforced or abolished. What he will not do is keep to a

    limit while the boat beside him lands over it.

    '
  quiz:
  - q: Why does Mbeki say he would rather the quota were abolished than left unenforced?
    a: Keeping a limit others ignore costs him the catch and saves nothing
    wrong:
    - With no quota at all, prices would rise as the catch fell and the fleet would stop on its own
    - He believes the stock assessment is wrong about the west ground
    - Enforcement costs more than the quota saves
- id: iversen
  name: Liv Iversen
  role: Schoolteacher
  division: COMMON
  bio: 'Teaches all nineteen children in one room, ages five to eleven, and keeps

    the register that everybody''s argument depends on.


    She is the person who put the numbers in front of the council: the roll

    has fallen from thirty-one to nineteen in twelve years, and two of the

    nineteen leave for the mainland secondary in August.


    What she objects to is the roll being used as a slogan. It is an age

    structure, she says, and it predicts the next decade whichever way the

    ferry vote goes.

    '
  quiz:
  - q: Why does Iversen object to the school roll being quoted as a single number?
    a: The roll is a shape, and the shape is what forecasts
    wrong:
    - The total counts children who leave for the mainland secondary within a year in any case
    - A single figure cannot be compared with the mainland
    - The register is confidential and should not be quoted publicly
- id: dunmore
  name: Sarah Dunmore
  role: Council Clerk
  division: TIP
  bio: 'Clerk to the island council, which means she writes the papers the

    fifteen-day argument will be settled from and knows exactly how a number

    travels once it is in one.


    Her rule is that every figure in a council paper carries what it is about

    and over what period. A tonnage with no year on it, she says, comes back

    in three years as a fact.


    She is neutral about the ferry and not neutral about evidence. A paper

    that cannot be defended sentence by sentence does not go in the pack.

    '
  quiz:
  - q: Why does Dunmore insist every figure in a council paper names its period?
    a: A figure with no period becomes a permanent fact
    wrong:
    - Council papers are required by standing orders to state the period each figure covers
    - Figures without periods cannot be compared between islands
    - It is the only way to tell an estimate from a measurement
glossary:
- name: Algae
  aliases:
  - algae
  - algal
  def: Simple water plants, from single cells to seaweed, that grow fast when the water carries extra nutrients.
- name: Tonnage
  aliases:
  - tonnage
  def: How many tonnes of something there are in a stated period — a mass per year, not a mass.
- name: Nitrate
  aliases:
  - nitrate
  - nitrates
  def: The form most nitrogen takes once it is dissolved in water, and the form that leaches out of soil and feeds
    algae.
- name: Carrying capacity
  aliases:
  - carrying capacity
  def: The population a place can support on what it produces, indefinitely. Past it, the place is being spent rather
    than used.
- name: Recharge
  aliases:
  - recharge
  - recharged
  def: The part of the rain that reaches the aquifer, rather than running off or evaporating. It is the only deposit
    the island's water account gets.
- name: Aquifer
  aliases:
  - aquifer
  def: Water held in the rock under the island, and the thing the borehole draws from.
- name: Abstraction
  aliases:
  - abstraction
  - abstract
  - abstracted
  def: Taking water out of the ground or a river. Licensed here, because the store is small.
- name: Chloride
  aliases:
  - chloride
  def: A dissolved particle carrying one negative charge, and on an island the marker for seawater getting into
    fresh water.
- name: Leachate
  aliases:
  - leachate
  def: Liquid that has drained down through waste and taken some of it along, and then leaves the cell.
- name: Trophic level
  aliases:
  - trophic
  - trophic level
  def: A step in a food web — plants, then the animals grazing them, then their predators. Each step passes on about
    a tenth of the energy.
- name: Quota
  aliases:
  - quota
  - quotas
  def: A limit on what may be caught, set so the stock can replace what is taken.
- name: Stock
  aliases:
  - stock
  - stock assessment
  def: How much fish is out there, as opposed to how much was landed. Estimated, never counted.
- name: Capacity factor
  aliases:
  - capacity factor
  def: What a generator actually produces over a period, as a fraction of running flat out for the same period.
- name: Load
  aliases:
  - load
  - pollutant load
  def: How much of something is going in per day, which is a concentration multiplied by a flow. Concentrations
    do not add up; loads do.
- name: Dose
  aliases:
  - dose
  - dose-response
  def: How much of a substance a body actually takes in, per kilogram of that body. The same water is a different
    dose for a child.
- name: Eutrophication
  aliases:
  - eutrophication
  - eutrophic
  def: Nutrients feed algae, algae die, decomposing them uses the oxygen, and what needed the oxygen leaves or dies.
- name: Invasive species
  aliases:
  - invasive
  - invasive species
  def: Something introduced that spreads because no local predator, competitor or disease holds it back.
- name: Global warming potential
  aliases:
  - global warming potential
  - gwp
  def: How much heat a kilogram of a gas traps compared with a kilogram of carbon dioxide, over a stated period.
- name: Ecosystem service
  aliases:
  - ecosystem service
  - ecosystem services
  def: Something a working ecosystem does that would otherwise have to be paid for — a reef breaking a swell, a
    marsh holding a flood.
warmups:
  greet:
    title: Ninety-one people, and you will need most of them by Friday
    why: Every number in the council pack comes out of somebody's book, and on Vellan those books are in people's
      heads and kitchens. Calloway, the harbourmaster, wants you known to as many of them as you can get round before
      the ferry argument starts, because a figure you asked for is worth three you found in a file.
  trial-near:
    title: Walk the harbour end before you sign anything
    why: The office, the waterworks and the common all stand inside four hundred metres of the berth, so walk that
      end once and see which is which.
  trial-far:
    title: The far end opens today, and the truck with it
    why: The tip, the hill and the reef station are three hundred metres and more up the island road and nothing
      up there has been called on this week. From today they are on the list and the truck is signed out for it.
      Drive the road once so you know which spur is which before Blessing Okafor, who runs the tip, asks you to
      look at a cell.
  follow:
    title: Follow Pike round the stocking count
    why: 'Dan Pike, the common grazing officer, counts stock on the common twice a year and he does not stop walking
      to explain it. Stay with him: the count is the only evidence behind the stocking limit, and the argument at
      the spring meeting is always about how it was taken rather than what it said.'
  hunt:
    title: Six standpipes, and one of them is the leak
    item:
      name: standpipe
      plural: standpipes
    why: The distribution main is losing about a fifth of what the borehole lifts, and Mairead Sorley, the water
      engineer, has narrowed it to the six standpipes along the island road. Find all six and read them. A fifth
      of the island's water is a bigger number than anything the ferry argument is about.
  canvass:
    title: Ask the nine graziers one question each
    why: The council paper needs to say whether the graziers would accept an inspected limit, and Dan Pike, who
      administers the grazing rights, will not put words in their mouths. Nine people, one question, and the answer
      only counts if enough of them give it — which is the whole difficulty with asking anybody anything on an island.
  evade:
    title: Stay off the mainland surveyor until the pack is filed
    why: 'The ferry operator''s surveyor came over on the Tuesday boat and wants the abstraction figures before
      Dunmore, the council clerk, has checked them. Keep your distance until the pack is in: a number quoted from
      a corridor conversation arrives at the vote with nobody''s name on it.'
  tag:
    title: Catch Rask before the Friday boat
    why: Petra Rask, the fisheries observer, leaves on the Friday sailing and the stock assessment needs one figure
      that is only in her head — which of the four over-landing boats she saw twice. She walks fast and she is already
      late for the berth.
missions:
- title: What does Vellan actually depend on?
  objective: Turn the island's scattered records into stocks, flows and services before anyone claims the extra
    ferry is either safe or impossible.
  briefing: The ferry proposal quotes fish, land, visitors and waste as though they were the same kind of number.
  stake: Day 1. Vellan has ninety-one residents, one daily ferry to the mainland and a vote in fifteen days on adding
    a second summer sailing. Before you can say yes or no, you need to know what the island actually uses, what
    it can replace, and what each number in the council papers really measures.
  takeaway: An island does not have one carrying capacity. Water, food, land, waste and energy each have their own
    stock, flow and limit.
  segue: >-
    The books do not reveal one magic capacity number. They reveal several different limits, measured on
    different clocks. On day 2 you start with the one Vellan cannot buy from the mainland: fresh water.
  stops:
  - group: HARB
    task: Turn two seasons into a claim the council can defend
    title: Are the catches really down?
    at: landings-book
    place: Harbour Office
    reason: Calloway needs the catch decline stated with its starting point and five-season period before it is
      used as evidence for or against the ferry.
    relationship: 'The percentage change, % change = (new − old) ÷ old × 100: the difference divided by where it
      started.'
    concept: 'An ecosystem as a budget: what comes in, what leaves, what stays'
    scene: The harbour book shows 214 tonnes landed from the west ground five seasons ago and 168 tonnes last season.
      The ferry proposal calls that a fall without saying what the comparison is against.
    guide: A change is only a claim once it says what it is a change from. Take the difference between the two seasons
      and divide it by the earlier one. Dividing by the later one answers a different question, and gives a different
      number. Then check what period the ferry paper attaches to it, and whether that is the period you just used.
    background:
    - Why the denominator is the earlier value. A percentage change measures how much of the original has gone,
      so the original is what it is a fraction of. Dividing by the new value gives a real number about something
      else. It gives how much the smaller figure would have to grow to get back. The two are never the same.
    - What a percentage hides. Twenty-one per cent of 214 tonnes is 46 tonnes, and 46 tonnes is either a crisis
      or a rounding error depending on the stock it came out of. A percentage travels well between contexts and
      loses the size of the thing it is about, which is why a council paper carries both.
    - Why the period matters more than the arithmetic. The same two numbers describe three different things, depending
      on what is put beside them. A five-year fall. An annual rate of a little over four per cent. Or a single bad
      season. Only one of those is what the book records, and the other two are how it gets misquoted.
    assumes:
    - the landings book records whole seasons rather than calendar years
    takeaway: A change is a fraction of where it started, and it means nothing without its period.
    format: BALLPARK
    question: By what percentage have west-ground landings fallen over the five seasons?
    estimate:
      prompt: The west ground landed 214 tonnes five seasons ago and 168 tonnes last season. The ferry paper says
        only that landings have fallen.
      question: By what percentage have west-ground landings fallen over the five seasons?
      labels:
      - 214 t  (the earlier season)
      - 168 t  (last season)
      - 46 t  (the difference)
      - 5  (seasons between them)
      values:
      - 214
      - 168
      - 46
      - 5
      slots: 2
      template: '{0} ÷ {1} × 100'
      formula: a/b*100
      correct:
      - 2
      - 0
      target: 21.5
      tolerance: 2
      units: '%'
      solution: (214 − 168) ÷ 214 × 100 = 46 ÷ 214 × 100 = 21.5 %.
      explanation: A 21.5 per cent fall over five seasons, which is about 4.7 per cent a season — a different sentence
        from the same two numbers.
    answerText: About 21.5 per cent over five seasons, which is roughly 4.7 per cent a season.
    why: 'The difference is 46 tonnes and the comparison is against the 214 the fall started from, which gives 21.5
      per cent. Dividing by last season''s 168 gives 27 per cent instead. That number answers how much the catch
      would have to rise to recover. It does not answer how much of it has gone. Both are arithmetic; only one is
      the claim the paper is making. The period is the part that travels badly. Twenty-one per cent over five seasons
      and twenty-one per cent in a year are the same figure describing two different fisheries, and the book records
      the first.

      '
    rebuttals:
    - Dividing by last season's figure measures the rise needed to recover, not the fall that happened.
    - The raw 46 tonnes is the size of the change and not a rate; it cannot be compared with another ground.
  - group: REEF
    task: Identify the service the harbour receives without an invoice
    title: What is the reef doing for the harbour?
    place: Reef Station
    reason: Berhane wants the harbour to count the reef's wave shelter before more traffic is planned behind it.
    concept: Ecosystem services, and the ones nobody is billed for
    takesAsRead:
    - 'An ecosystem as a budget: what comes in, what leaves, what stays'
    scene: The reef lies across the mouth of the bay. The ferry berth sits behind it, where incoming swell is already
      smaller than it is outside the reef.
    guide: Ask what would have to be built if the thing were not there. The harbour's swell. The beach that the
      school uses. The ground the west boats fish, and the nursery those fish come from. Those are four separate
      benefits, and only one of them appears in any island account. The question is which of the four is doing the
      work the ferry paper silently assumes.
    background:
    - What an ecosystem service is. Something a working system does that would otherwise have to be paid for. A
      reef breaking a swell is a breakwater; a marsh holding a flood is a reservoir; pollination is a workforce.
      The term exists because these things are invisible in accounts until they stop.
    - Why the invisibility is the problem rather than the price. Nobody sends the island a bill for the reef, so
      no line in the ferry paper falls when the reef declines. The cost appears years later, in dredging, in a sea
      wall, or in the west ground being fished out because its nursery went.
    - What the transect counts can and cannot support. Eleven springs of cover on eleven lines is a strong record
      of change and a weak record of cause. It says the reef is thinning. It does not say which of four pressures thinned it. Berhane, the reef ecologist, will not be moved past that in a meeting.
    assumes:
    - the reef's position across the bay mouth is what shelters the harbour
    takeaway: A service nobody is billed for is invisible in every account until it stops.
    format: CHOICE
    question: Which service does the harbour receive from the reef without paying for it?
    choices:
    - Breaking the swell before it reaches the berth.
    - Providing coral limestone as a source of building material for the island.
    - Holding the freshwater lens under the island in place against the sea.
    - Absorbing the diesel house's carbon dioxide emissions.
    answer: Breaking the swell before it reaches the berth.
    why: 'The berth is behind the reef line, and a second sailing means more days when the boat has to work in weather.
      What makes that a service rather than a fact about geography is that the alternative has a price: a breakwater,
      built and maintained. The paper assumes the shelter without costing it, which is exactly how these things
      go missing. The other three are not services this reef provides. A reef is not a quarry here. The freshwater
      lens is held by the rock and the recharge, not by anything offshore. And the quantity of carbon dioxide a
      coral reef takes up is small, and largely returned.

      '
    rebuttals:
    - Coral limestone is not quarried on Vellan, and taking it would remove the shelter the harbour depends on.
    - The freshwater lens sits in the island's own rock; what holds it is recharge against abstraction, not the
      reef.
    - Reefs cycle carbon rather than storing it on the scale of a diesel plant's emissions.
  - group: COMMON
    task: Read the soil pit as a set of limits on farming
    title: How much soil is actually there?
    at: soil-bench
    place: Common Office
    reason: Pike and Hollis need to know whether the common can really give up land for parking and still support
      more food production elsewhere.
    concept: 'Soil: horizons, texture and what a thin soil cannot do'
    scene: A pit on the common shows nine inches of dark topsoil, two inches of paler material and then rock. Water
      drains through the upper soil in about twenty minutes.
    guide: A soil profile is read as layers, and the top one is the one that grows things. Look at how deep it is,
      what is under it, and how fast water leaves it. Then ask what a crop takes out each year. Ask whether nine
      inches of soil over rock can replace it. On an island the replacement has to be made here.
    background:
    - What the horizons are. A dark surface layer rich in organic matter, a paler layer below it where minerals
      have washed down, and then parent rock. Deep soils have more between the two; this one has almost nothing,
      which is normal for a grazed maritime island and limits what can be asked of it.
    - Why texture decides as much as depth. Sand drains fast and holds little; clay holds water and air badly; loam
      is the mixture that does both. Vellan's is a sandy loam over rock, which drains quickly. That is good in a
      wet spring. It is also the reason a dry August is felt in the polytunnels within a fortnight.
    - What the common's history has already done. Two hundred years of grazing has kept organic matter cycling in
      place through dung and has stopped anything woody establishing. The market gardener Hollis has the only deep soil on the island — two acres of it. Every inch was built out of seaweed and what the tip would release.
    assumes:
    - the pit at the top of the common is representative of the grazed ground
    takeaway: A thin soil over rock limits what can be grown, because the replacement has to be made on the island.
    format: PROTOCOL
    columns:
    - What the pit shows
    - What it decides
    scenarios:
    - Nine inches of dark, crumbly material at the surface
    - Two inches of paler, mineral material under it
    - Rock at eleven inches, with no cracks in the face
    - Water drained out of the pit within twenty minutes of digging
    choices:
    - The layer that holds the organic matter and grows the crop.
    - Minerals washed down out of the layer above, and little rooting depth gained.
    - No deep reserve of water or nutrients, and no route for roots past this point.
    - 'A sandy texture: a dry August is felt in a fortnight rather than a season.'
    mapping:
    - 0
    - 1
    - 2
    - 3
    rebuttals:
    - The dark surface layer is where the organic matter and almost all the rooting is.
    - The pale layer is leached mineral material; it adds very little usable rooting depth.
    - Unbroken rock at eleven inches means there is no deep store to draw on in a dry spell.
    - Water gone in twenty minutes is a sandy texture draining fast, which sets how quickly drought bites.
    answerText: Topsoil grows the crop, the pale layer adds almost nothing, the rock caps the rooting depth, and
      the fast drainage means August is felt within a fortnight.
    why: 'A profile is read as a set of limits rather than as a description. Nine inches of topsoil is what carries
      the organic matter, the nutrients and nearly all the roots, so it is the whole of the productive soil here.
      The pale layer beneath is leached mineral material and adds little. The rock at eleven inches means there
      is no deep store to fall back on. The twenty-minute drainage says the texture is sandy. So a dry month is
      felt quickly rather than buffered. Together those four say the common can carry grazing and cannot carry another
      acre of vegetables without soil being built first, which takes years.

      '
- title: How much water does Vellan actually get?
  objective: Estimate the island's annual water supply and compare it with the demands the ferry proposal would
    add.
  briefing: The abstraction licence is up for renewal, but its recharge number was never built from Vellan's own
    rainfall record.
  stake: Day 2. The current water licence allows 340,000 cubic metres a year. Sorley, the water engineer, has fourteen years of local rain data. The licence still rests on an old guess about recharge. Today you work out the island's best recharge
    estimate and put summer visitors on the same clock.
  takeaway: A groundwater store can hide overspending for years, so the important comparison is the annual recharge
    against the annual withdrawal.
  segue: >-
    Using Vellan's rainfall and the licence's recharge fraction gives a best estimate of about 294,000
    cubic metres a year — below the 340,000 the permit allows. That is a warning, not yet a complete
    safe-yield calculation. On day 3 you ask whether the island's living resources have the same kind of
    hidden ceiling.

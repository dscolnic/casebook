  stops:
  - group: WATER
    task: Convert the school concentration into dose per kilogram
    title: How much nitrate reaches the smallest child?
    at: school-tap
    place: Waterworks
    reason: Nkemdi wants the same water translated into the quantity that changes with body size before the council
      treats one concentration as one exposure.
    relationship: 'dose = C × intake ÷ mass: the same concentration is a different dose for a different body.'
    concept: 'Dose makes the poison: exposure, body mass and a dose-response curve'
    scene: The school tap is 11.2 milligrams per litre. The youngest pupil drinks about one litre a day and weighs
      11 kilograms.
    guide: A dose is not a concentration. Multiply the concentration by how much is drunk to get the amount taken
      in, then divide by the mass of the body taking it. Do it for the child, then set it against the same arithmetic
      for an adult. The ratio is the whole reason guidance is written the way it is.
    background:
    - Why the guidance is per kilogram. A tolerable intake is a property of a body's ability to process something,
      which scales roughly with its mass. A figure quoted per person is a figure written for an average adult, and
      the smallest person drinking the water is the one it fails.
    - Why intake matters as much as mass. Children drink more per kilogram than adults do — a litre in eleven kilos
      against two in seventy — so the two factors compound rather than cancel. That is why the ratio between the
      two doses is far larger than the ratio of the body masses.
    - What a dose-response curve adds. Whether the dose matters depends on where it sits on a curve, and that curve
      is usually not a straight line. Below a threshold, little or nothing. Past it, rising harm. The dose is the
      input to that judgement rather than the judgement.
    assumes:
    - the consumption figures are typical daily intakes
    takeaway: A dose is intake times concentration, divided by the body taking it.
    format: BALLPARK
    question: Estimate that child's nitrate dose in milligrams per kilogram per day.
    estimate:
      prompt: The school tap is 11.2 mg/L. The youngest pupil drinks about 1 litre a day and weighs 11 kg.
      question: Estimate that child's nitrate dose in milligrams per kilogram per day.
      labels:
      - 11.2 mg/L  (the school tap)
      - 1 L  (litres drunk a day)
      - 11 kg  (the child's mass)
      - 70 kg  (an adult's mass)
      values:
      - 11.2
      - 1
      - 11
      - 70
      slots: 3
      template: '{0} × {1} ÷ {2}'
      formula: a*b/c
      correct:
      - 0
      - 1
      - 2
      target: 1.02
      tolerance: 0.12
      units: mg per kg a day
      solution: dose = 11.2 × 1 ÷ 11 = 1.02 mg per kg a day.
      explanation: About 1.0 mg/kg/day, against 0.32 for an adult on the same tap — a factor of three from the same
        water.
    answerText: About 1.0 milligram per kilogram a day, against 0.32 for an adult drinking from the same tap.
    why: 'Eleven point two milligrams in a litre, one litre drunk, divided by eleven kilograms, is about one milligram
      per kilogram a day. The adult on the same tap takes 22.4 milligrams into seventy kilograms, which is 0.32
      — so the identical water is three times the dose for the child. The two factors compound instead of cancelling,
      because children drink more per kilogram as well as weighing less. That is why guidance is written per kilogram
      and why a figure quoted per person is written for an adult. Using the adult mass with the child''s intake
      mixes two people and produces a dose nobody receives.

      '
    rebuttals:
    - Using the adult mass with the child's intake describes nobody who drinks at that tap.
    - The concentration alone is the same for everybody, which is exactly why it is not the quantity that decides.
  - group: COMMON
    task: Set a release trigger early enough for winter rain to flush the soil
    title: When does useful compost become too salty?
    at: windrow-panel
    place: Common Office
    reason: Hollis wants the compost stream diverted from the tip, but not if a salty batch damages the only deep
      soil on the island.
    concept: Agricultural methods, irrigation and the salt they leave behind
    takesAsRead:
    - 'Soil: horizons, texture and what a thin soil cannot do'
    scene: About forty tonnes of compostable material could leave the tip for the market garden each year. Seaweed
      and salted food waste make some batches much more saline than others.
    guide: Count what the transfer does at both ends. Forty tonnes is volume out of a tip with eleven years left,
      and it is organic matter into the only deep soil on the island. Then find the cost, because there is one.
      The same material carries salt and whatever was sprayed on it. It arrives on ground that drains toward the
      borehole.
    background:
    - 'What compost does to a thin soil. It raises organic matter, which raises how much water the soil holds and
      how much nutrient it can retain against leaching. On a sandy loam over rock that is the only lever available:
      nothing else deepens what is there.'
    - Why the salt is worth checking. Island compostables include seaweed and kitchen waste from a place where everything
      is salted. Repeated application of a salty amendment to free-draining ground raises soil salinity, until germination
      suffers. The soil is not flushed by irrigation here — it is flushed by rain, in winter, if at all.
    - What the tip gains and does not. Forty tonnes out of the arrivals slows the hole's filling and reduces the
      methane the cell generates, because compostables are what generate it. It does not reduce the tonnage the
      island produces, which is the number Okafor is actually judged on.
    assumes:
    - the compostable stream is roughly forty tonnes a year as weighed
    takeaway: Compost is the only lever on a thin soil, and it carries whatever was in the material.
    format: TRIGGER
    question: Where should you set the conductivity trigger so a bad batch is stopped with six weeks of winter flushing
      still available?
    trigger:
      hint: Set the line on the conductivity scale and release the board. The batches are tested afterwards and
        your own rule decides what goes on the ground.
      scale:
        label: Compost electrical conductivity
        unit: mS/cm
        min: 0
        max: 12
        step: 0.1
        anchors:
        - at: 1.4
          means: ordinary garden compost — nothing to think about
        - at: 4.0
          means: germination of the tunnel crops starts to suffer at this and above
      objective: The release is stopped while there are still six weeks of winter rain to flush what has already
        gone on.
      rehearsal:
        note: last winter's batches, worked at the same scale
        stream:
        - value: 1.6
          hoursLeft: 1680
        - value: 2.4
          hoursLeft: 1344
        - value: 3.1
          hoursLeft: 1008
        - value: 2.2
          hoursLeft: 672
      conditions:
      - id: stop
        label: Stop the release and hold the batch
        leadHours: 1008
        owner: the market garden
        action: divert the batch back to the cell
        window:
          min: 2.6
          max: 3.6
      stream:
      - at: week 1
        value: 1.5
        hoursLeft: 1680
        update: first batch — kitchen waste and cut grass
      - at: week 4
        value: 2.9
        hoursLeft: 1344
        update: seaweed added to the windrow after the spring tides
      - at: week 8
        value: 4.6
        hoursLeft: 1008
        update: more seaweed, and the windrow has not been turned
      - at: week 13
        value: 6.8
        hoursLeft: 336
        update: salt visible on the surface of the heap
      release: Release the board
      commit: Stand by the board
    answerText: Stop at about 3 millisiemens a centimetre. The week-8 batch crosses it with six weeks of winter
      rain still to come; a line up near where germination fails is not crossed until week 13, when there are two.
    why: 'The transfer is good at both ends. Volume comes out of a hole with eleven years left. Organic matter goes
      into the only deep soil on the island. So the rule has to catch the one thing that makes it go wrong. Island
      compostables carry seaweed and heavily salted kitchen waste, and on free-draining ground over rock there is
      nothing to flush salt through but winter rain. Two ways of getting the line wrong cost the same. Set it near
      4, where germination measurably suffers. Then it is not crossed until the week-13 batch, with two weeks of
      rain left. That is a correct rule for an action that needed six. Set it near 1.5 and it fires on ordinary
      compost, and a rule that fires on normal is a rule nobody keeps.

      '
  - group: TIP
    task: Spend the waste budget against volume, methane and unavoidable operating costs
    title: What buys the most life for the landfill?
    at: weighbridge
    place: Tip and Sorting Yard
    reason: Okafor has £11,000 and needs the plan that buys back the most landfill volume without ignoring methane
      or the cover material the cell must have.
    concept: An ecological footprint, and what a visitor adds to one
    takesAsRead:
    - Carrying capacity, and what happens on the way past it
    scene: The tip has about eleven years of volume left at today's rate. Compaction, composting, freight, scrap
      recovery and a gas flare all cost different amounts and solve different parts of the problem.
    guide: Everything here removes volume from the hole and the budget cannot buy all of it. Work out what each
      pound buys in cubic metres, spend the budget, and watch what happens to the year the cell closes. Two of these
      options also change what the tip emits, which is worth knowing before choosing between two that look equally
      good on volume.
    background:
    - Why volume rather than tonnage is the currency. The constraint is a hole. Compaction buys volume without removing
      any mass at all, which makes it look like cheating and is the cheapest cubic metre available until the compactor
      is running full.
    - What diverting compostables does twice. It removes the wettest, heaviest stream from the hole and removes
      the material that generates most of the methane, because methane comes from organic matter decomposing without
      oxygen. One action, two benefits, and only one of them shows up in a volume calculation.
    - Why shipping is priced per tonne and bought per cubic metre. The ferry charges weight and the island needs
      volume, so the streams worth shipping are the light bulky ones. Spending the whole budget on freight buys
      fewer cubic metres than spending part of it on a compactor service.
    assumes:
    - the budget is for this year only and does not roll over
    takeaway: The constraint is volume, and the cheapest cubic metre is not always the obvious one.
    format: ALLOCATE
    question: 'Build the year''s £11,000 waste plan around the limiting quantity: landfill volume.'
    allocate:
      hint: Nothing on this list is the wrong thing to buy. What the plan cannot afford is the price of what it
        can, and two of these also change what the cell emits.
      pool:
        amount: 11000
        unit: £
        mode: scalar
      items:
      - id: cover
        label: Inert cover material for the working face
        cost: 1200
        protected: true
        note: an uncovered face is not an option
      - id: compost
        label: Divert the compostable stream to the market garden
        cost: 1800
        note: 620 cubic metres, and most of the methane source with it
      - id: compact
        label: Six months of compactor hire for plastics and card
        cost: 3400
        note: 740 cubic metres recovered by compaction alone
      - id: ship
        label: Ship 24 tonnes of plastic packaging off on the ferry
        cost: 4900
        note: 410 cubic metres removed
      - id: metal
        label: Consolidate and ship the scrap metal
        cost: 900
        note: 90 cubic metres, and the scrap sells for £1,400
      - id: glass
        label: Ship 30 tonnes of glass
        cost: 5600
        note: 60 cubic metres — glass crushes to almost nothing
      - id: gas
        label: A flare stack on the cell's gas vent
        cost: 2600
        note: burns the methane to carbon dioxide, worth 28 times less
      answers:
      - question: Is the volume the cover material occupies bought back somewhere?
        requires:
        - compact
        required: true
      - question: Is the methane source removed rather than burnt?
        requires:
        - compost
      - question: Does any of the year's spend pay something back?
        requires:
        - metal
      - question: Is bulky plastic taken off the island altogether?
        requires:
        - ship
      - question: Is the gas that does escape burnt down to something weaker?
        requires:
        - gas
      commit: Commit the year's spend
    answerText: 'Cover, then compaction, then the compostables, then the scrap: about 1,450 cubic metres and the
      methane source gone, for £7,300, with £1,400 of it coming back. The glass and the plastic freight are what
      the year cannot buy.'
    why: 'Volume per pound is the ranking, and it does not follow weight or virtue. Diverting compostables is the
      cheapest large block and takes most of the methane source with it, which no volume figure shows. Compaction
      is next: it removes no mass at all and recovers more cubic metres than shipping plastic for a third less money.
      Scrap is nearly free and pays part of itself back. Glass is last by a wide margin — thirty tonnes of freight
      for sixty cubic metres, because glass crushes to almost nothing and should stay. Spending the whole budget
      on freight is the intuitive answer and buys roughly a third of the volume.

      '
- title: What is really happening to the reef?
  objective: Separate a measured reef decline from the causes the island can and cannot establish, then identify
    the local feedback it can control.
  briefing: Coral cover is down again, August water is warmer, and the council draft has already turned that correlation
    into a cause.
  stake: Day 10. Berhane has eleven years of the same reef transects and a laboratory temperature response, but
    no control reef and no event-by-event bleaching record. Today you decide what the evidence genuinely shows,
    then ask which local pressure Vellan can act on even if the warming comes from far away.
  takeaway: A trend can be strong evidence without identifying its cause. Management should target the local mechanisms
    the data actually support.
  segue: >-
    The decline in reef cover is real. The temperature relationship is real. The claim that warming
    alone caused the decline is stronger than the evidence. One local feedback is clearer: losing
    grazing fish lets algae take space that coral needs to recover. On day 11 you count another impact
    the island has never put in one ledger — its fuel and methane.
  stops:
  - group: REEF
    task: Read the laboratory response without turning it into a field attribution
    title: At what temperature does the fragment lose cover?
    at: flow-tank
    place: Reef Station
    reason: Berhane wants the coral's temperature sensitivity established as one piece of evidence, not presented
      as proof of what caused the whole reef decline.
    concept: A warming, acidifying sea, and what a reef does about it
    takesAsRead:
    - Greenhouse gases, and comparing them on one scale
    - Ecological tolerance, and the range a population can actually live in
    scene: A fragment from the warm-water reef is held for six weeks at different August temperatures. Cover is
      stable at the cooler settings and then falls away somewhere in the upper part of the range.
    guide: A species lives inside a range rather than at a point, and the interesting part of a range is its edge.
      The tank holds a fragment at whatever August temperature you set and reports the cover it still has after
      six weeks. Move the control across the range and watch where the readout stops sloping and starts falling
      away. Nothing marks it. Two degrees is small on a thermometer and not small at an edge.
    background:
    - What a tolerance range is. Every population has conditions in which it thrives, wider conditions in which
      it survives with reduced growth and reproduction, and limits beyond which it dies. Moving the average two
      degrees moves the whole distribution, so what was the rare bad week becomes the normal August.
    - Why the two stresses compound. Warmer water expels the symbiotic algae corals depend on for most of their
      energy, and a more acidic sea makes the skeleton more expensive to build. An animal short of energy and facing
      a higher construction cost is not facing two problems; it is facing one, twice.
    - What the island controls and what it does not. Sea temperature and acidity are set far away. Nutrient load
      from the stream. Sediment from the works. Anchor damage in the bay. Fishing pressure on the grazers that keep
      algae off the coral. All four are local, and all of them decide how much stress the reef meets on top of the
      global part.
    assumes:
    - the eleven transects have been read by the same method each spring
    takeaway: A warmed animal at the edge of its range meets every other stress with nothing spare.
    format: SWEEP
    question: Around what August temperature does the fragment begin losing cover sharply?
    sweep:
      axis:
        label: August sea temperature
        unit: °C
        min: 27.0
        max: 32.5
        step: 0.1
      readout:
        label: Cover held after six weeks
        unit: '%'
      baseline: 41
      response:
      - at: 27.2
        value: 41
      - at: 28.0
        value: 41
      - at: 28.6
        value: 40
      - at: 29.1
        value: 39
      - at: 29.5
        value: 37
      - at: 29.8
        value: 33
      - at: 30.0
        value: 26
      - at: 30.3
        value: 17
      - at: 30.8
        value: 9
      - at: 31.6
        value: 4
      - at: 32.4
        value: 3
      target: 30.0
      tolerance: 0.3
      start: 27.2
      commit: Mark where the cover goes
    answerText: Around 30 degrees — where the response changes from a gentle decline to a sharp loss of cover.
    why: A tolerance curve is not a switch. Cover changes little through the upper twenties, then drops rapidly
      around 30 °C in this six-week experiment. That establishes a temperature sensitivity for the fragment and
      gives a plausible physiological threshold to compare with the field record. It does not prove that temperature
      alone caused the eleven-year reef decline, because the field record lacks control reefs and event-level attribution.
  - group: POWER
    task: Separate trend, correlation and causation in the council draft
    title: What can eleven springs actually prove?
    place: Turbine Yard
    reason: Dunmore wants every reef sentence reduced to exactly what the eleven-year record can support.
    concept: 'Reading an environmental claim: what a number is about, and over what period'
    takesAsRead:
    - Concentration against load, and why a small pipe can matter
    scene: Reef cover and August temperature both changed over the same eleven-year period. There are no control
      reefs and no event-level record tying individual bleaching episodes to particular warm weeks.
    guide: Take each draft sentence and ask what evidence it would take to support it. Then check whether eleven
      springs of cover and temperature on one bay is that evidence. A trend, a correlation and a cause need three
      different amounts of data, and only one of the three is in the room.
    background:
    - What a trend needs. Repeated measurement by a consistent method over a period long relative to the variation.
      Eleven springs on eleven fixed transects is exactly that, and it is why this record is the strongest thing
      on the island.
    - What attribution needs beyond a trend. Either an experiment, which is impossible here, or enough independent
      lines of evidence to rule out the alternatives. Other reefs as controls. A bleaching record tied to specific
      warm weeks. A nutrient series. A sediment series. Some of that exists elsewhere; almost none of it exists
      for Vellan.
    - Why understating is also a failure. "Cover has changed" is defensible and useless. The pack has to carry the
      strongest claim the evidence supports. A paper that says less than it knows invites a decision the evidence
      would not have allowed.
    assumes:
    - the transect method has not changed across the eleven springs
    takeaway: A trend, a correlation and a cause need three different amounts of evidence.
    format: PROTOCOL
    columns:
    - The draft sentence
    - What supporting it requires
    scenarios:
    - Cover on the eleven transects has fallen from 41 to 26 per cent since the record began
    - The fall in cover has occurred alongside a 1.9 degree rise in August temperature
    - Warming has caused the loss of cover in the bay
    - Local nutrient loading is the main driver of the decline
    choices:
    - 'Consistent method and a long enough series: this record already supports it.'
    - Both series measured over the same period, which this record has.
    - Control sites, bleaching events tied to warm weeks, and the alternatives ruled out.
    - A nutrient series for the bay, which nobody has collected.
    mapping:
    - 0
    - 1
    - 2
    - 3
    rebuttals:
    - A fall measured the same way over eleven springs is a trend, and the record supports it.
    - Two series over one period is a correlation, which is a weaker and still useful claim.
    - Attributing to warming needs controls and event-level evidence that Vellan does not have.
    - The nutrient claim needs a nutrient record, and there is none for the bay.
    answerText: The fall is supported, the correlation is supported, causation by warming is not, and the nutrient
      claim has no series behind it at all.
    why: 'The record is strong and it is strong about one thing: a fall in cover, measured the same way, over long
      enough to be a trend. Putting the temperature series beside it gives a correlation, which is a real and weaker
      claim. Attribution is a different order of evidence — control sites, bleaching tied to specific warm weeks,
      the alternatives eliminated — and none of that exists here. The nutrient sentence is the one to strike outright,
      because nobody has collected a nutrient series for the bay. The pack should carry the two claims the data
      supports, stated at full strength. A paper that says less than it knows invites a decision the evidence would
      have prevented.

      '
  - group: HARB
    task: Identify the feedback that can keep coral from recovering
    title: Why do grazing fish matter after a hot year?
    place: Harbour Office
    reason: Calloway needs the grazer bycatch treated as a local lever even though Vellan cannot control the regional
      temperature trend.
    concept: 'Food webs and trophic levels: who eats whom, and how much of it'
    takesAsRead:
    - 'An ecosystem as a budget: what comes in, what leaves, what stays'
    scene: Landings of herbivorous reef fish have fallen by about a third while algae cover has risen on the same
      transects. Those fish are low-value bycatch and have no separate quota.
    guide: Follow what eats what. Something is keeping algae off the coral. The landings of that something have
      fallen a third. So the question is whether the algae rose because the coral weakened, or because its grazers
      went. Both mechanisms are consistent with the same two graphs, and they call for different actions.
    background:
    - What grazers do on a reef. They crop algae that would otherwise overgrow coral and stop new coral settling.
      Remove them and algae wins the space even where conditions would let coral recover, which turns a temporary
      stress into a permanent change of state.
    - Why a low-value bycatch is the dangerous one. Nobody manages a species nobody sells. The grazers here are
      taken incidentally, not counted carefully and not in the quota, so a third of them can go without any part
      of the system noticing.
    - Why this is the island's lever. Sea temperature is set elsewhere. Whether the reef keeps its grazers is decided
      at this berth, by what the quota counts. It is the one part of the reef's problem that a council on Vellan
      can vote on.
    assumes:
    - the grazing species landings are recorded even as bycatch
    takeaway: Removing the grazers turns a temporary stress into a permanent change of state.
    format: CHOICE
    question: What does losing grazing fish do to the reef's chance of recovering after a stressful summer?
    choices:
    - Algae holds the space even in years coral could return.
    - The reef recovers of its own accord as soon as sea temperatures fall back.
    - The grazers are a symptom of the decline rather than a cause of it.
    - The bycatch is too small a fraction of the landings to matter.
    answer: Algae holds the space even in years coral could return.
    why: 'Grazers crop the algae that would otherwise overgrow coral and block new coral from settling. Take a third
      of them out and algae keeps the space in the good years too. A temperature stress that would have been temporary
      becomes a permanent change of state. That is why this stop is on the harbour''s list rather than the reef''s.
      The temperature is set far away. The grazers are decided at this berth, by what the quota counts. A low-value
      bycatch is exactly the case nobody manages, which is what makes a third of them disappearing possible without
      anybody objecting.

      '
    rebuttals:
    - Recovery needs bare space for new coral to settle on, and algae holding that space prevents it whatever the
      temperature does.
    - The grazers have been fished, which is a cause. Their decline tracks landings rather than reef condition.
    - The fraction of the landings is small; the fraction of the grazing population is a third, which is what matters.
- title: What the diesel is really costing
  objective: Close the energy and emissions budgets so the turbine is compared with the system Vellan actually runs.
  briefing: The council knows the diesel bill and the landfill vent separately; nobody has put their energy losses
    and greenhouse impact on the same page.
  stake: Day 11. The diesel sets burned 78,000 litres last year. The tip vented about 14 tonnes of methane. Before
    the turbine repair is dismissed as expensive, you need to show where the fuel energy went and which gas is actually
    dominating Vellan's climate footprint.
  takeaway: An energy budget must account for every output, and greenhouse gases must be compared on the same time
    horizon.
  segue: >-
    Of about 835 megawatt-hours of fuel energy, roughly 313 became electricity: 42 ran the sets' own
    pumps and fans and 271 reached the island. About 522 left as heat. The tip's methane is another 392
    tonnes of CO₂-equivalent on the 100-year basis. On day 12 you compare those avoidable losses with
    the two numbers at the heart of the ferry argument: the stalled turbine and the leaking water main.
  stops:
  - group: POWER
    task: Close the generator's energy balance
    title: Where did the diesel energy go?
    at: fuel-bench
    place: Turbine Yard
    reason: Ferris wants the turbine compared with the actual diesel system, including the electricity the sets
      use themselves and the heat that never reaches anyone.
    relationship: 'efficiency = useful ÷ input × 100: the fraction of the energy put in that did the job wanted.'
    concept: Efficiency, and where the rest of the fuel goes
    scene: The sets received about 835 megawatt-hours of fuel energy. The board meter recorded 271 megawatt-hours
      delivered to the island. The plant's own pumps, fans and heaters ran off the same generators all year.
    guide: 'Work out the energy that went in, then compare it with the electricity that came out. The ratio is the
      efficiency. Then account for the missing part: it has not disappeared, and on this island there is a use for
      some of it that nobody has taken up.'
    background:
    - Why a third is normal. A diesel generator turns about a third of the fuel's chemical energy into electricity
      at full load, less at part load. The rest leaves as exhaust heat and jacket cooling. This is not a fault in
      the machine — it is what a heat engine does, and the ceiling is set by thermodynamics rather than maintenance.
    - Why part load makes it worse. A set running at a quarter of its rating burns a disproportionate amount of
      fuel for what it delivers. Vellan's demand varies by a factor of three across a day. Running one set hard
      is better than three sets lightly, which is a scheduling decision rather than a capital one.
    - What the heat could do. Two thirds of 835,000 kilowatt-hours is a very large amount of low-grade heat. It
      leaves the diesel house through a radiator forty metres from a school that burns oil for its heating. Nobody
      has piped it, and no efficiency figure for the generator will ever show that as a loss.
    assumes:
    - the fuel's energy content is about 10.7 kilowatt-hours a litre
    takeaway: Fuel energy becomes gross electricity or heat; plant auxiliaries then subtract from the electricity
      available to the island.
    format: BALANCE
    question: How much of the fuel energy left the generator system as heat?
    balance:
      hint: Everything the fuel's energy did not become electricity became heat. Count all the electricity, not
        only the part that reached the board.
      total:
        amount: 522
        unit: MWh
        label: Energy leaving the engine-generator system as heat
      streams:
      - id: fuel
        label: Fuel energy in
        value: 835
        display: 78,000 L × 10.7 kWh/L = 835 MWh
      - id: board
        label: Electricity delivered to the island board
        value: -271
        display: 271 MWh metered at the board
      - id: aux
        label: Electricity the plant used itself
        value: -42
        display: 313 MWh generated, 271 MWh delivered
        hidden: true
        note: generated and then spent on site by pumps, fans and heaters
      - id: jacket
        label: Jacket cooling to the radiator
        value: 0
        countable: false
        display: not metered — inside the heat already, not a stream beside it
      tolerance: 20
      commit: Report the heat
    answerText: 'About 522 MWh leaves as heat: 835 in, minus the 271 MWh delivered and the 42 MWh the plant
      spent on itself.'
    why: 'The fuel supplied about 835 MWh of chemical energy. The generators produced about 313 MWh of electricity,
      so roughly 522 MWh left the engine-generator system as heat. Of the 313 MWh electrical output, about 42 MWh
      ran pumps, fans and heaters inside the plant, leaving 271 MWh at the island board. That distinction matters:
      835 − 271 is not all heat, because 42 MWh became electrical work inside the generating plant.'
  - group: TIP
    task: Convert the tip's methane into carbon-dioxide equivalent on the same time horizon as the diesel
    title: Which greenhouse source is larger?
    at: weighbridge
    place: Tip and Sorting Yard
    reason: Okafor wants the landfill vent counted beside the diesel emissions instead of disappearing because the
      gases have different names.
    concept: Greenhouse gases, and comparing them on one scale
    takesAsRead:
    - The carbon and nitrogen cycles, and where a farm interrupts them
    scene: The cell vents about 14 tonnes of methane a year. The council pack uses a 100-year global-warming potential
      of 28 for methane.
    guide: Two gases cannot be added until they are in the same unit. Each has a global warming potential — how
      much heat a kilogram of it traps compared with a kilogram of carbon dioxide, over a stated period. Convert
      the methane and then compare, and note which period the conversion factor belongs to, because the answer changes
      with it.
    background:
    - Why methane's factor is so large and so slippery. It traps far more heat per kilogram than carbon dioxide,
      and it breaks down in about a decade. So its potential depends entirely on the period chosen. Roughly 28 over
      a hundred years, and around 80 over twenty. Both numbers are correct and they describe different questions.
    - Why a landfill emits it at all. Organic matter decomposing without oxygen produces methane rather than carbon
      dioxide. That is why diverting the compostable stream is an emissions action as much as a volume action. It
      is also why a flare is worth so much. A flare burns methane to carbon dioxide, and it is worth that despite
      producing a greenhouse gas itself.
    - Why the pack lists only the diesel. Fuel arrives on an invoice and gas leaves through a vent nobody meters.
      What is easy to count gets counted, and an island reporting only its fuel emissions has left out something
      comparable in size.
    assumes:
    - the methane estimate is for a year of the cell's current arrivals
    takeaway: Two gases compare only once both are multiplied to a common unit, over a stated period.
    format: BALLPARK
    question: What is 14 tonnes of methane in 100-year carbon-dioxide equivalent?
    estimate:
      relationship: CO₂e = mass × GWP, with mass the gas released and GWP how much heat a kilogram of it traps against
        a kilogram of carbon dioxide, over a stated period.
      prompt: The cell vents about 14 tonnes of methane a year. The pack uses the hundred-year global warming potential.
      question: What is 14 tonnes of methane in 100-year carbon-dioxide equivalent?
      labels:
      - 14 t  (methane vented a year)
      - 28  (GWP over 100 years)
      - 80  (GWP over 20 years)
      - 205 t  (the diesel house, as CO₂)
      values:
      - 14
      - 28
      - 80
      - 205
      slots: 2
      template: '{0} × {1}'
      formula: a*b
      correct:
      - 0
      - 1
      target: 392
      tolerance: 30
      units: t CO₂e a year
      solution: 14 t × 28 = 392 tonnes of carbon dioxide equivalent a year.
      explanation: Nearly twice the diesel house — from a vent nobody meters, left out of the pack entirely.
    answerText: About 392 tonnes of carbon dioxide equivalent — nearly twice the diesel house.
    why: 'The diesel is counted from the delivery note rather than the chimney: 78,000 litres at 2.63 kilograms
      a litre is 205 tonnes. Fourteen tonnes of methane at a hundred-year potential of 28 is 392 tonnes of carbon
      dioxide equivalent. The island''s largest single greenhouse source is a vent on a hole. It is not in the pack,
      because fuel arrives on an invoice and gas does not. The period is doing real work in that sentence: at the
      twenty-year potential of 80 the same 14 tonnes is 1,120, which is five times the diesel house. Both figures
      are correct and they answer different questions, which is why the pack has to say which one it used. Adding
      the raw tonnages gives 219 and compares kilograms of two gases as though they were the same substance.

      '
    rebuttals:
    - The twenty-year potential is also correct and gives 1,120 tonnes; the pack has to state which period it used.
    - Adding 14 tonnes to 205 treats a kilogram of methane as equivalent to a kilogram of carbon dioxide.
  - group: COMMON
    task: Separate new nitrogen entering the island system from nitrogen merely moved around inside it
    title: Where is the common's nitrogen really coming from?
    at: nitrogen-bench
    place: Common Office
    reason: Pike wants the response aimed at the fertiliser input rather than at sheep and compost that mostly redistribute
      nitrogen already present.
    concept: The carbon and nitrogen cycles, and where a farm interrupts them
    takesAsRead:
    - 'An ecosystem as a budget: what comes in, what leaves, what stays'
    scene: The common receives nitrogen from fixation, imported fertiliser, livestock manure and compost. Some of
      those add new nitrogen to the island budget; others mostly move it.
    guide: Sort the inputs by where the nitrogen came from before it arrived here. Some was taken out of the air
      on the island itself. Some was manufactured elsewhere and shipped in. And some is nitrogen already on the
      island, being moved around. Only one of the three adds to the island's total, and that is the one the stream
      reflects.
    background:
    - What fixation is. Bacteria in the nodules of clover and other legumes convert nitrogen gas from the air into
      a form plants can use. It is a genuine input to the island and it arrives slowly, in place, and in proportion
      to how much clover is in the sward.
    - Why dung is not an input. The sheep ate the grass here. Their dung returns nitrogen that was already on the
      common to the common, moved from where it was eaten to where the animal stood. It matters enormously for distribution
      and not at all for the total.
    - Why imported fertiliser is the one the stream sees. It is nitrogen manufactured elsewhere, landed at the berth
      and spread in a few weeks. Applied faster than the sward can take it up, the surplus leaches. Free-draining
      ground over rock leaches readily. That is the connection between a bag on the pier and a nitrate reading in
      the bay.
    assumes:
    - the sheep graze the common rather than being fed imported feed
    takeaway: Only what arrives from outside adds to the island's total; the rest is redistribution.
    format: PROTOCOL
    columns:
    - The input
    - What it does to the total
    scenarios:
    - Clover in the sward
    - Imported bagged fertiliser
    - Dung from 512 sheep grazing the common
    - Compost made from the island's own kitchen waste
    choices:
    - A real input, taken from the air on the island, arriving slowly.
    - A real input, manufactured elsewhere and applied in weeks — what the stream reflects.
    - No change to the total — nitrogen already here, moved to where the animal stood.
    - No change to the total — island nitrogen returned to island ground in a slower form.
    mapping:
    - 0
    - 1
    - 2
    - 3
    rebuttals:
    - Clover fixes nitrogen out of the air, which is genuinely new to the island.
    - Bagged fertiliser is the only input landed at the berth, and the only one applied faster than the sward takes
      it up.
    - Sheep eat grass grown here; their dung moves nitrogen about rather than adding any.
    - Compost recycles what the island already had, in a form that releases more slowly.
    answerText: Clover and imported fertiliser are real inputs; dung and compost move nitrogen that was already
      here.
    why: 'Two of these four add nitrogen to the island and two redistribute what is already on it. Clover fixes
      it out of the air, slowly and in place. Bagged fertiliser is manufactured elsewhere, landed at the berth and
      spread over a few weeks. That is why it is the input the stream reflects. It is applied faster than the sward
      can take up, so the surplus leaches through free-draining ground over rock. Dung and compost feel like additions
      and are not — the sheep ate grass grown here and the kitchen waste was island food. Getting that distinction
      right is what stops the response being aimed at the sheep.

      '

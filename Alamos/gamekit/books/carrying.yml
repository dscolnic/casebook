  - group: TIP
    task: Put the laboratory and health guidance into the same units
    title: Are these three units describing the same water?
    at: lab-bench
    place: Tip and Sorting Yard
    reason: Nkemdi needs the nitrate numbers reconciled before a unit conversion gets mistaken for a change in contamination.
    relationship: 'ppm ≈ mg / L: a litre of fresh water weighs about a kilogram, so a milligram in it is one part
      in a million.'
    concept: Concentration against load, and why a small pipe can matter
    scene: The laboratory reports 8.4 milligrams per litre of nitrate. Another sheet uses micrograms per litre,
      and a third uses parts per million.
    guide: A litre of fresh water weighs about a kilogram, so a milligram dissolved in it is one part in a million
      by mass. That makes two of these three units the same number. Convert the laboratory's figure into the licence's
      units, and into the guidance's, and check which pair are actually identical.
    background:
    - Why the approximation holds here and not everywhere. Fresh water at ordinary temperatures is close enough
      to a kilogram a litre that the conversion is exact for any purpose a council paper has. In seawater, or in
      a brine, the density has moved and so has the conversion — which matters on an island where some samples are
      brackish.
    - Why three units exist for one quantity. The licence was drafted from a national template in parts per million.
      The laboratory reports in milligrams a litre, because that is what its instruments produce. Health guidance
      uses micrograms, because the numbers of interest are small. Nobody is being obscure; the units accumulated.
    - What the conversion cannot fix. None of the three is a load, and none is a dose. The same 8.4 milligrams a
      litre is a different mass per day depending on the flow and a different dose depending on who drinks it and
      how much. Getting the units right is the first step and not the answer.
    assumes:
    - the sample is fresh water rather than brackish
    takeaway: Milligrams a litre and parts per million are the same number in fresh water.
    format: BALLPARK
    question: Convert 8.4 milligrams per litre to micrograms per litre.
    estimate:
      prompt: The laboratory reports 8.4 mg/L of nitrate. The health guidance is written in micrograms a litre.
      question: Convert 8.4 milligrams per litre to micrograms per litre.
      labels:
      - 8.4 mg/L  (what the laboratory reported)
      - 1000  (micrograms in a milligram)
      - 1.0 kg/L  (density of fresh water)
      - 50 mg/L  (the licence limit)
      values:
      - 8.4
      - 1000
      - 1.0
      - 50
      slots: 2
      template: '{0} × {1}'
      formula: a*b
      correct:
      - 0
      - 1
      target: 8400
      tolerance: 200
      units: µg/L
      solution: 8.4 mg/L × 1000 = 8,400 µg/L, and 8.4 mg/L is also 8.4 ppm.
      explanation: 8,400 micrograms a litre, which is the same water as 8.4 ppm — two of the three units are identical.
    answerText: 8,400 micrograms a litre, and the same sample is 8.4 parts per million.
    why: 'A milligram is a thousand micrograms, so the laboratory''s 8.4 becomes 8,400 — the same water, reported
      in a unit chosen because health numbers are small. The parts-per-million figure is the one worth noticing.
      In fresh water a milligram a litre is a milligram in a kilogram, which is one part in a million. So 8.4 mg/L
      and 8.4 ppm are not merely comparable but identical. The density tile is what that rests on, and it stops
      being one in brackish water, which is half the samples on this island. What none of the three units gives
      is a load or a dose.

      '
    rebuttals:
    - The licence limit is what the reading is compared against, not part of the conversion.
    - Dividing by the density leaves the figure unchanged in fresh water and hides the assumption the conversion
      rests on.
  - group: REEF
    task: Put the eutrophication chain in causal order
    title: How can extra nutrients remove oxygen?
    at: water-rack
    place: Reef Station
    reason: Berhane wants the bay's oxygen crash explained as a process rather than a list of correlated measurements.
    concept: 'Eutrophication: nutrients in, oxygen out'
    takesAsRead:
    - Concentration against load, and why a small pipe can matter
    - The carbon and nitrogen cycles, and where a farm interrupts them
    scene: After nutrient-rich runoff, the inner bay shows an algal bloom, then more dead organic matter and finally
      lower dissolved oxygen. Put the mechanism in order.
    guide: Berhane calls this eutrophication, which is the course's word for nutrients in and oxygen out. Follow
      the nitrogen through four steps rather than two. It feeds something, that something dies, the dying is what
      uses the oxygen, and the oxygen is what everything else needed. Then look at why the worst reading is at dawn,
      because the timing is the evidence that the mechanism is the one you think it is.
    background:
    - Why dawn is the diagnostic hour. Algae photosynthesise in daylight and respire all the time, so oxygen peaks
      in late afternoon and bottoms out just before sunrise. A dawn minimum well below the afternoon reading is
      the signature of a large algal population rather than of a single discharge.
    - Why warm water makes it worse twice over. Warm water holds less dissolved oxygen to begin with, and it speeds
      up both algal growth and the decomposition that consumes the oxygen. August is the month the nutrients arrive,
      the water is warmest and the oxygen ceiling is lowest.
    - What suffers first. Not the algae and not the bacteria. Fish and the invertebrates on the reef leave or die.
      The ones that cannot move are the ones counted on Berhane's transects. That is how a nutrient problem in a
      stream becomes a line on a reef survey two months later.
    assumes:
    - the oxygen readings were taken at the same depth in the inner bay
    takeaway: Nutrients feed algae, decomposition spends the oxygen, and what needed the oxygen leaves.
    format: SEQUENCE
    question: Put the four steps in the order they happen.
    cards:
    - Nitrate arriving from the stream feeds a bloom of algae in the inner bay
    - The bloom dies back and sinks
    - Bacteria decomposing it consume the dissolved oxygen
    - Invertebrates on the reef die or leave, and the transect count falls
    order:
    - 0
    - 1
    - 2
    - 3
    axis: what happens first
    ends:
    - first
    - last
    answerText: Nutrients feed the bloom, the bloom dies and sinks, decomposition spends the oxygen, and what needed
      the oxygen goes.
    why: 'The chain has a step in it that is easy to leave out: the algae themselves do not take the oxygen, the
      bacteria decomposing them do. That is why the damage arrives after the bloom rather than during it, and why
      the water can look clear on the day the oxygen is worst. The dawn reading of 2.9 is the confirmation — oxygen
      is lowest just before sunrise because nothing has been photosynthesising all night while everything has been
      respiring. And August stacks three things: the nutrients arrive, the water is warmest, and warm water holds
      less oxygen to start with.

      '
  - group: HARB
    task: State what the tap result does and does not represent
    title: Why does the school tap matter more to a child?
    place: Harbour Office
    reason: Nkemdi wants the highest measured tap concentration kept separate from both the island average and the
      child's dose that you will calculate tomorrow.
    concept: 'Reading an environmental claim: what a number is about, and over what period'
    takesAsRead:

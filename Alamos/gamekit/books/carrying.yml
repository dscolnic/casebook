# carrying.yml — Carrying Capacity. AP Environmental Science on Vellan Island.
#
# THE PLACE WAS CHOSEN BECAUSE THE BUDGETS CLOSE. Every quantity this course
# examines is a stock and a flow, and on an island there is no elsewhere: the
# water is what fell on it, the fish are what the boats did not take, the power
# arrives on one cable or is made on the hill, and the waste stays. A mainland
# game lets a student assume a somewhere-else for every number.
#
# The argument, both sides right on some day: Calloway wants the second sailing
# because nineteen children and a school depend on the landing fees, and she is
# right on day 6 that nothing enforces the quota without them. Berhane wants the
# abstraction capped and the ferry deferred, and he is right on day 4 that the
# borehole is already drawing salt. The vote is on day 15.
#
#   node tools/import-book.mjs books/carrying.yml carrying --verify

theme:
  id: carrying
  title: Carrying Capacity
  subtitle: Island Resources Officer · Vellan Island

groups:
  - id: HARB
    code: HARB
    name: Harbour Office
    color: '#2f7fa8'
    desc: Landings, the quota, the ferry and who is on the island.
    defaultLeader: calloway
    milestones: [Read the landings, Work the stock, Set the rule, Ready for the council]
  - id: WATER
    code: WATER
    name: Waterworks
    color: '#2e9b8f'
    desc: Rain in, borehole out, and the salt behind both.
    defaultLeader: sorley
    milestones: [Measure the recharge, Balance the store, Find the salt, Ready for the council]
  - id: COMMON
    code: COMMON
    name: Common Office
    color: '#8a9a3c'
    desc: Grazing, gardens, soil and what is sprayed on them.
    defaultLeader: pike
    milestones: [Walk the common, Read the soil, Weigh the inputs, Ready for the council]
  - id: TIP
    code: TIP
    name: Tip and Sorting Yard
    color: '#a06a3c'
    desc: Everything that stays, and what leaks out of it.
    defaultLeader: okafor
    milestones: [Weigh the arrivals, Trace the leachate, Count the gas, Ready for the council]
  - id: POWER
    code: POWER
    name: Turbine Yard
    color: '#c0803a'
    desc: Diesel, the hill, and what a kilowatt-hour costs here.
    defaultLeader: ferris
    milestones: [Meter the demand, Rate the machines, Cost the change, Ready for the council]
  - id: REEF
    code: REEF
    name: Reef Station
    color: '#3f8fa0'
    desc: The species the island keeps, and the water they live in.
    defaultLeader: berhane
    milestones: [Count the transect, Read the tolerance, Test the claim, Ready for the council]

roster:
  - id: calloway
    name: Ines Calloway
    role: Harbourmaster
    division: HARB
    bio: |
      Runs the harbour, the ferry contract and the landings book, and has kept
      that book by hand for nineteen years because the electronic one loses the
      column she cares about — who landed what, and whether they were over.

      Her argument for the second sailing is not tourism. It is the landing fee
      and the school: nineteen children on the register, and a school closes at
      twelve. She has done the arithmetic on both and will show anybody who asks.

      What she will not accept is a quota with nothing behind it. An unenforced
      rule, she says, is worse than no rule, because the boats that keep it are
      the ones that lose.
    quiz:
      - q: Why does Calloway argue a quota nobody enforces is worse than none at all?
        a: It punishes the boats that keep it and saves nothing
        wrong:
          - Quotas cannot be set without a mainland licence, which the island has never applied for
          - A quota always reduces the total catch below what the stock can replace
          - Fishermen cannot count their own landings accurately
  - id: berhane
    name: Tomas Berhane
    role: Reef Ecologist
    division: REEF
    bio: |
      Has counted the same eleven transects off the point every spring for
      eleven years, which is the longest continuous record of anything on this
      island and the only one that predates the borehole.

      He is careful about what a count can say. Eleven springs is enough to see
      a trend in cover and not enough to attribute it, and he will say so in a
      meeting that wants him to say more.

      His objection to the ferry is specific rather than general: the sailing
      brings water demand in July, and July is when the borehole is already
      drawing chloride.
    quiz:
      - q: Why will Berhane not attribute the reef's decline to a cause in a council meeting?
        a: Eleven years shows a trend without separating the causes
        wrong:
          - He has not been asked for an opinion, and volunteering one at a meeting is not how the record is kept
          - Transect counts measure cover rather than the health of individual corals
          - Attribution requires a laboratory the island does not have
  - id: sorley
    name: Mairead Sorley
    role: Water Engineer
    division: WATER
    bio: |
      Keeps the borehole, the storage tanks and a rain gauge she reads herself
      every morning at seven, because the automatic one under-reads in wind and
      the wind here is the point.

      She treats the island's water as a bank account with one deposit — rain on
      the catchment — and several standing orders. Her objection to most plans is
      that they add a standing order and no deposit.

      She is the person who noticed the chloride, and she reported it as a
      single reading rather than a trend, which is why it was believed.
    quiz:
      - q: Why does Sorley read the rain gauge by hand rather than trusting the automatic one?
        a: The automatic gauge under-reads in wind, which here is normal weather
        wrong:
          - There is no power at the borehole gauge, so the automatic one has never been commissioned
          - Hand readings are required by the abstraction licence
          - She does not trust any instrument she did not install herself
  - id: pike
    name: Dan Pike
    role: Common Grazing Officer
    division: COMMON
    bio: |
      Administers the grazing rights on the common: forty-one shares, nine
      graziers, and a stocking limit that has been argued about every spring
      since it was written.

      He knows the failure mode from the inside. Nobody overgrazes on purpose;
      each grazier adds one more animal because one more animal is worth having
      and the cost is spread across everyone.

      He is unromantic about the fix. Rules, counted stock, and a limit that is
      inspected — which makes him the least popular man at the spring meeting.
    quiz:
      - q: Why does Pike say nobody overgrazes the common on purpose?
        a: One grazier gains the animal and all nine pay for it
        wrong:
          - No grazier can see the whole common at once, so nobody knows what it is carrying
          - The stocking limit has never been written down
          - Sheep move between shares, so nobody knows whose they are
  - id: okafor
    name: Blessing Okafor
    role: Waste and Sorting Lead
    division: TIP
    bio: |
      Runs the tip, the sorting yard and the compaction shed, and is the only
      person here who weighs what arrives. Ninety-one people, two hundred and
      four tonnes a year, and a hole with eleven years left in it.

      Her standing complaint is that waste is discussed as a moral question and
      settled as an arithmetic one. What leaves on the ferry costs money per
      tonne; what stays takes volume and vents gas.

      She keeps the leachate log because the tip sits up-catchment of the
      borehole, which nobody chose and everybody has to live with.
    quiz:
      - q: Why does Okafor keep a leachate log at all?
        a: Anything leaving the cell runs downhill toward the borehole
        wrong:
          - The abstraction licence requires a written record of everything that enters the tip
          - Leachate volume is how she estimates the remaining life of the hole
          - It is the only way to tell recyclable waste from general waste
  - id: ferris
    name: Aled Ferris
    role: Power Engineer
    division: POWER
    bio: |
      Keeps three diesel sets, a failing sea cable and a turbine on the hill
      that has been out of service for two years waiting for a gearbox nobody
      will ship for one machine.

      He can tell you the island's demand hour by hour for the last four years,
      and his point is always the same: the peak is what sizes the plant, and
      the peak is a July evening when the ferry has been in.

      He does not argue about renewables in the abstract. He argues about
      capacity factor, because a nameplate rating is a number for a brochure.
    quiz:
      - q: Why does Ferris insist on capacity factor rather than a machine's rating?
        a: A rating is the best hour; the factor is the average one
        wrong:
          - Ratings are set by the manufacturer rather than measured, and are usually generous
          - Capacity factor determines whether the turbine can meet the July peak
          - A rating cannot be compared between wind and diesel machines
  - id: nkemdi
    name: Grace Nkemdi
    role: Island Nurse
    division: WATER
    bio: |
      The island's only clinician, which means she is also its public health
      service, its environmental health officer and the person who signs the
      water sample forms.

      She thinks about exposure in the way the job forces: not concentration but
      dose, and not dose but dose per kilogram, because the youngest person
      drinking the island's water weighs eleven kilos.

      She is the reason the school's tap is sampled separately, which she asked
      for twice and got on the third try.
    quiz:
      - q: Why did Nkemdi push for the school tap to be sampled separately?
        a: The same water is a larger dose per kilogram for a child
        wrong:
          - The school sits at the end of the distribution main, where the water stands longest between draws
          - School water is used for cooking and therefore concentrated by boiling
          - The licence requires a sample from every public building
  - id: rask
    name: Petra Rask
    role: Fisheries Observer
    division: HARB
    bio: |
      Comes over on the Tuesday boat, spends three days a fortnight on the
      landings and writes the stock assessment nobody on the island wants to
      read.

      Her assessments carry ranges rather than numbers, and she defends the
      ranges: a stock estimate with no width to it invites a quota set at its
      edge, and the edge is where a fishery goes.

      She is straightforward about the limit of her own method. Landings tell
      you what came out, not what is left, and the two diverge exactly when it
      matters most.
    quiz:
      - q: Why does Rask report a stock as a range rather than a single figure?
        a: With no width stated, a council reads the convenient end as the finding
        wrong:
          - The mainland fisheries authority requires assessments to be reported as ranges
          - The landings data is too sparse to support a single number
          - A range lets the council choose the figure it prefers
  - id: hollis
    name: Ewan Hollis
    role: Market Gardener
    division: COMMON
    bio: |
      Grows most of what the island eats that is not landed or shipped: four
      polytunnels, two acres outside, and a soil he has been building for
      fifteen years out of seaweed and everything the tip will let him have.

      He is the island's argument for compost made physical. Every tonne he
      takes off Okafor's hands is a tonne that does not go in the hole, and it
      comes back as the only deep topsoil on Vellan.

      He sprays, and he is exact about when. Spraying on a calendar, he says,
      breeds the thing you are spraying for.
    quiz:
      - q: Why does Hollis refuse to spray on a fixed calendar?
        a: Spraying regardless of numbers breeds resistance
        wrong:
          - Spraying to a calendar costs more over a season than treating only when the count requires it
          - Sprays break down too quickly to be applied in advance
          - The licence limits the number of applications per season
  - id: mbeki
    name: Josef Mbeki
    role: Skipper, Kestrel Wynd
    division: HARB
    bio: |
      Fishes the west ground with a crew of two and has done for twenty-six
      years. He has kept to the quota for nine of them and can name the four
      boats that have not.

      His view of the commons is not theoretical. He watched the west ground
      thin over a decade, and he can tell you what a good year looked like in
      2004 in a way no assessment does.

      He wants the rule enforced or abolished. What he will not do is keep to a
      limit while the boat beside him lands over it.
    quiz:
      - q: Why does Mbeki say he would rather the quota were abolished than left unenforced?
        a: Keeping a limit others ignore costs him the catch and saves nothing
        wrong:
          - With no quota at all, prices would rise as the catch fell and the fleet would stop on its own
          - He believes the stock assessment is wrong about the west ground
          - Enforcement costs more than the quota saves
  - id: iversen
    name: Liv Iversen
    role: Schoolteacher
    division: COMMON
    bio: |
      Teaches all nineteen children in one room, ages five to eleven, and keeps
      the register that everybody's argument depends on.

      She is the person who put the numbers in front of the council: the roll
      has fallen from thirty-one to nineteen in twelve years, and two of the
      nineteen leave for the mainland secondary in August.

      What she objects to is the roll being used as a slogan. It is an age
      structure, she says, and it predicts the next decade whichever way the
      ferry vote goes.
    quiz:
      - q: Why does Iversen object to the school roll being quoted as a single number?
        a: The roll is a shape, and the shape is what forecasts
        wrong:
          - The total counts children who leave for the mainland secondary within a year in any case
          - A single figure cannot be compared with the mainland
          - The register is confidential and should not be quoted publicly
  - id: dunmore
    name: Sarah Dunmore
    role: Council Clerk
    division: TIP
    bio: |
      Clerk to the island council, which means she writes the papers the
      fifteen-day argument will be settled from and knows exactly how a number
      travels once it is in one.

      Her rule is that every figure in a council paper carries what it is about
      and over what period. A tonnage with no year on it, she says, comes back
      in three years as a fact.

      She is neutral about the ferry and not neutral about evidence. A paper
      that cannot be defended sentence by sentence does not go in the pack.
    quiz:
      - q: Why does Dunmore insist every figure in a council paper names its period?
        a: A figure with no period becomes a permanent fact
        wrong:
          - Council papers are required by standing orders to state the period each figure covers
          - Figures without periods cannot be compared between islands
          - It is the only way to tell an estimate from a measurement

glossary:
  - name: Tonnage
    aliases: [tonnage]
    def: How many tonnes of something there are in a stated period — a mass per year, not a mass.
  - name: Nitrate
    aliases: [nitrate, nitrates]
    def: The form most nitrogen takes once it is dissolved in water, and the form that leaches out of soil and feeds algae.
  - name: Carrying capacity
    aliases: [carrying capacity]
    def: The population a place can support on what it produces, indefinitely. Past it, the place is being spent rather than used.
  - name: Recharge
    aliases: [recharge, recharged]
    def: The part of the rain that reaches the aquifer, rather than running off or evaporating. It is the only deposit the island's water account gets.
  - name: Aquifer
    aliases: [aquifer]
    def: Water held in the rock under the island, and the thing the borehole draws from.
  - name: Abstraction
    aliases: [abstraction, abstract, abstracted]
    def: Taking water out of the ground or a river. Licensed here, because the store is small.
  - name: Chloride
    aliases: [chloride]
    def: A dissolved particle carrying one negative charge, and on an island the marker for seawater getting into fresh water.
  - name: Leachate
    aliases: [leachate]
    def: Liquid that has drained down through waste and taken some of it along, and then leaves the cell.
  - name: Trophic level
    aliases: [trophic, trophic level]
    def: A step in a food web — plants, then the animals grazing them, then their predators. Each step passes on about a tenth of the energy.
  - name: Quota
    aliases: [quota, quotas]
    def: A limit on what may be caught, set so the stock can replace what is taken.
  - name: Stock
    aliases: [stock, stock assessment]
    def: How much fish is out there, as opposed to how much was landed. Estimated, never counted.
  - name: Capacity factor
    aliases: [capacity factor]
    def: What a generator actually produces over a period, as a fraction of running flat out for the same period.
  - name: Load
    aliases: [load, pollutant load]
    def: How much of something is going in per day, which is a concentration multiplied by a flow. Concentrations do not add up; loads do.
  - name: Dose
    aliases: [dose, dose-response]
    def: How much of a substance a body actually takes in, per kilogram of that body. The same water is a different dose for a child.
  - name: Eutrophication
    aliases: [eutrophication, eutrophic]
    def: Nutrients feed algae, algae die, decomposing them uses the oxygen, and what needed the oxygen leaves or dies.
  - name: Invasive species
    aliases: [invasive, invasive species]
    def: Something introduced that spreads because no local predator, competitor or disease holds it back.
  - name: Global warming potential
    aliases: [global warming potential, gwp]
    def: How much heat a kilogram of a gas traps compared with a kilogram of carbon dioxide, over a stated period.
  - name: Ecosystem service
    aliases: [ecosystem service, ecosystem services]
    def: Something a working ecosystem does that would otherwise have to be paid for — a reef breaking a swell, a marsh holding a flood.

warmups:
  greet:
    title: Ninety-one people, and you will need most of them by Friday
    why: >-
      Every number in the council pack comes out of somebody's book, and on Vellan those
      books are in people's heads and kitchens. Calloway, the harbourmaster, wants you known
      to as many of them as you can get round before the ferry argument starts, because a
      figure you asked for is worth three you found in a file.
  trial-near:
    title: Walk the harbour end before you sign anything
    why: >-
      The office, the waterworks and the common are all inside four hundred metres of the
      berth, and the licence you are about to inherit covers all three. Sorley, the water
      engineer, walks every new officer round them once, because the tip sits up-catchment of
      the borehole and that is a thing to see rather than read.
  trial-far:
    title: The far end opens today, and the truck with it
    why: >-
      The tip, the hill and the reef station are three hundred metres and more up the island road and
      nothing up there has been called on this week. From today they are on the list and the
      truck is signed out for it. Drive the road once so you know which spur is which before
      Blessing Okafor, who runs the tip, asks you to look at a cell.
  follow:
    title: Follow Pike round the stocking count
    why: >-
      Dan Pike, the common grazing officer, counts stock on the common twice a year and he
      does not stop walking to explain it. Stay with him: the count is the only evidence
      behind the stocking limit, and the argument at the spring meeting is always about how
      it was taken rather than what it said.
  hunt:
    title: Six standpipes, and one of them is the leak
    item: { name: standpipe, plural: standpipes }
    why: >-
      The distribution main is losing about a fifth of what the borehole lifts, and Mairead Sorley,
      the water engineer, has
      narrowed it to the six standpipes along the island road. Find all six and read them.
      A fifth of the island's water is a bigger number than anything the ferry argument is
      about.
  canvass:
    title: Ask the nine graziers one question each
    why: >-
      The council paper needs to say whether the graziers would accept an inspected limit,
      and Dan Pike, who administers the grazing rights, will not put words in their mouths. Nine people, one question, and the answer
      only counts if enough of them give it — which is the whole difficulty with asking
      anybody anything on an island.
  evade:
    title: Stay off the mainland surveyor until the pack is filed
    why: >-
      The ferry operator's surveyor came over on the Tuesday boat and wants the abstraction
      figures before Dunmore, the council clerk, has checked them. Keep your distance until
      the pack is in: a number quoted from a corridor conversation arrives at the vote with
      nobody's name on it.
  tag:
    title: Catch Rask before the Friday boat
    why: >-
      Petra Rask, the fisheries observer, leaves on the Friday sailing and the stock
      assessment needs one figure that is only in her head — which of the four over-landing
      boats she saw twice. She walks fast and she is already late for the berth.

# ---------------------------------------------------------------- the fortnight
missions:
  # ----- day 1. What the island is made of, and what a number is about.
  - title: Ninety-one people and one of everything
    objective: Establish what the island's budgets actually are before anybody argues about the ferry.
    briefing: The handover is four books and a licence, and no two of them cover the same year.
    stake: >-
      Tuesday, and the boat that brought you takes the outgoing officer off at four. Ines Calloway, the harbourmaster, has the landings book open at a page showing 168 tonnes against 214 five years ago, and she wants that figure in the council pack before the ferry paper is drafted. Tomas Berhane, who counts the reef, says the same page has been quoted three times with three different periods attached to it. Today you settle what the island's four books each measure, over what period, and which of them can go in front of a vote. A figure with no year on it comes back in three years as a fact nobody can trace.
    takeaway: Every environmental number is a stock or a flow, and it is worth nothing without its period.
    stops:
      - group: HARB
        task: Turn two years of landings into a comparison
        title: Down from what, over how long
        place: Harbour Office
        relationship: >-
          The percentage change, % change = (new − old) ÷ old × 100: the difference divided by where it started.
        concept: 'An ecosystem as a budget: what comes in, what leaves, what stays'
        scene: >
          Calloway has the landings book open at two pages. The west ground landed 214 tonnes
          in the season five years ago and 168 tonnes last season. The ferry paper quotes a
          fall without saying from when.
        guide: >-
          A change is only a claim once it says what it is a change from. Take the difference
          between the two seasons and divide it by the earlier one, because dividing by the
          later one answers a different question and gives a different number. Then check what
          period the ferry paper attaches to it, and whether that is the period you just used.
        background:
          - >-
              Why the denominator is the earlier value. A percentage change measures how much of
              the original has gone, so the original is what it is a fraction of. Dividing by the
              new value gives a real number about something else — how much the smaller figure
              would have to grow to get back — and the two are never the same.
          - >-
              What a percentage hides. Twenty-one per cent of 214 tonnes is 46 tonnes, and 46
              tonnes is either a crisis or a rounding error depending on the stock it came out of.
              A percentage travels well between contexts and loses the size of the thing it is
              about, which is why a council paper carries both.
          - >-
              Why the period matters more than the arithmetic. The same two numbers describe a
              five-year fall, an annual rate of a little over four per cent, or a single bad
              season, depending on what is put beside them. Only one of those is what the book
              records, and the other two are how it gets misquoted.
        assumes:
          - the landings book records whole seasons rather than calendar years
        takeaway: A change is a fraction of where it started, and it means nothing without its period.
        format: BALLPARK
        question: Estimate the percentage fall in landings across the five seasons.
        estimate:
          prompt: The west ground landed 214 tonnes five seasons ago and 168 tonnes last season. The ferry paper says only that landings have fallen.
          question: Estimate the percentage fall in landings across the five seasons.
          labels:
            - 214 t  (the earlier season)
            - 168 t  (last season)
            - 46 t  (the difference)
            - 5  (seasons between them)
          values: [214, 168, 46, 5]
          slots: 2
          template: '{0} ÷ {1} × 100'
          formula: a/b*100
          correct: [2, 0]
          target: 21.5
          tolerance: 2
          units: '%'
          solution: (214 − 168) ÷ 214 × 100 = 46 ÷ 214 × 100 = 21.5 %.
          explanation: A 21.5 per cent fall over five seasons, which is about 4.7 per cent a season — a different sentence from the same two numbers.
        answerText: About 21.5 per cent over five seasons, which is roughly 4.7 per cent a season.
        why: >
          The difference is 46 tonnes and the comparison is against the 214 the fall started from,
          which gives 21.5 per cent. Dividing by last season's 168 gives 27 per cent, and that
          number answers how much the catch would have to rise to recover rather than how much of
          it has gone. Both are arithmetic; only one is the claim the paper is making. The period
          is the part that travels badly. Twenty-one per cent over five seasons and twenty-one per
          cent in a year are the same figure describing two different fisheries, and the book
          records the first.
        rebuttals:
          - Dividing by last season's figure measures the rise needed to recover, not the fall that happened.
          - The raw 46 tonnes is the size of the change and not a rate; it cannot be compared with another ground.
      - group: REEF
        task: Say what the reef is doing that nobody pays for
        title: The wall nobody built
        place: Reef Station
        concept: 'Ecosystem services, and the ones nobody is billed for'
        takesAsRead:
          - 'An ecosystem as a budget: what comes in, what leaves, what stays'
        scene: >
          Berhane has eleven springs of transect counts and a bathymetric chart on the wall.
          The reef runs across the mouth of the bay in a broken line, and the harbour sits
          behind it.
        guide: >-
          Ask what would have to be built if the thing were not there. The harbour's swell,
          the beach that the school uses, the ground the west boats fish and the nursery those
          fish come from are four separate benefits, and only one of them appears in any
          island account. The question is which of the four is doing the work the ferry paper
          silently assumes.
        background:
          - >-
              What an ecosystem service is. Something a working system does that would otherwise
              have to be paid for. A reef breaking a swell is a breakwater; a marsh holding a
              flood is a reservoir; pollination is a workforce. The term exists because these
              things are invisible in accounts until they stop.
          - >-
              Why the invisibility is the problem rather than the price. Nobody sends the island a
              bill for the reef, so no line in the ferry paper falls when the reef declines. The
              cost appears years later, in dredging, in a sea wall, or in the west ground being
              fished out because its nursery went.
          - >-
              What the transect counts can and cannot support. Eleven springs of cover on eleven
              lines is a strong record of change and a weak record of cause. It says the reef is
              thinning; it does not say which of four pressures thinned it, and Berhane will not
              be moved past that in a meeting.
        assumes:
          - the reef's position across the bay mouth is what shelters the harbour
        takeaway: A service nobody is billed for is invisible in every account until it stops.
        format: CHOICE
        question: Which of these is the reef's service the ferry paper is silently relying on?
        choices:
          - Breaking the swell before it reaches the berth
          - Providing coral limestone as a source of building material for the island
          - Holding the freshwater lens under the island in place against the sea
          - Absorbing the diesel house's carbon dioxide emissions
        answer: Breaking the swell before it reaches the berth
        why: >
          The berth is behind the reef line, and a second sailing means more days when the boat
          has to work in weather. What makes that a service rather than a fact about geography is
          that the alternative has a price: a breakwater, built and maintained. The paper assumes
          the shelter without costing it, which is exactly how these things go missing. The other
          three are not services this reef provides. A reef is not a quarry here, the freshwater
          lens is held by the rock and the recharge rather than by anything offshore, and the
          quantity of carbon dioxide a coral reef takes up is small and largely returned.
        rebuttals:
          - Coral limestone is not quarried on Vellan, and taking it would remove the shelter the harbour depends on.
          - The freshwater lens sits in the island's own rock; what holds it is recharge against abstraction, not the reef.
          - Reefs cycle carbon rather than storing it on the scale of a diesel plant's emissions.
      - group: COMMON
        task: Read the soil before anybody plans to grow more in it
        title: Nine inches over rock
        place: Common Office
        concept: 'Soil: horizons, texture and what a thin soil cannot do'
        scene: >
          Dan Pike, the common grazing officer, has a pit dug at the top of the common: nine
          inches of dark topsoil, two inches of paler material under it, and rock. Ewan Hollis,
          who runs the market garden, wants another acre in vegetables if the ferry brings a market.
        guide: >-
          A soil profile is read as layers, and the top one is the one that grows things. Look
          at how deep it is, what is under it, and how fast water leaves it. Then ask what a
          crop takes out each year and whether nine inches of soil over rock can replace it —
          because on an island the replacement has to be made here.
        background:
          - >-
              What the horizons are. A dark surface layer rich in organic matter, a paler layer
              below it where minerals have washed down, and then parent rock. Deep soils have
              more between the two; this one has almost nothing, which is normal for a grazed
              maritime island and limits what can be asked of it.
          - >-
              Why texture decides as much as depth. Sand drains fast and holds little; clay holds
              water and air badly; loam is the mixture that does both. Vellan's is a sandy loam
              over rock, which drains quickly — good in a wet spring, and the reason a dry August
              is felt in the polytunnels within a fortnight.
          - >-
              What the common's history has already done. Two hundred years of grazing has kept
              organic matter cycling in place through dung and has stopped anything woody
              establishing. Hollis's two acres are the only deep soil on the island, and every
              inch of it was built out of seaweed and what the tip would release.
        assumes:
          - the pit at the top of the common is representative of the grazed ground
        takeaway: A thin soil over rock limits what can be grown, because the replacement has to be made on the island.
        format: PROTOCOL
        task: Match each layer to what it tells you about growing here.
        columns:
          - What the pit shows
          - What it decides
        scenarios:
          - Nine inches of dark, crumbly material at the surface
          - Two inches of paler, mineral material under it
          - Rock at eleven inches, with no cracks in the face
          - Water drained out of the pit within twenty minutes of digging
        choices:
          - The layer that holds the organic matter and grows the crop
          - Minerals washed down out of the layer above, and little rooting depth gained
          - No deep reserve of water or nutrients, and no route for roots past this point
          - 'A sandy texture: a dry August is felt in a fortnight rather than a season'
        mapping: [0, 1, 2, 3]
        rebuttals:
          - The dark surface layer is where the organic matter and almost all the rooting is.
          - The pale layer is leached mineral material; it adds very little usable rooting depth.
          - Unbroken rock at eleven inches means there is no deep store to draw on in a dry spell.
          - Water gone in twenty minutes is a sandy texture draining fast, which sets how quickly drought bites.
        answerText: >-
          Topsoil grows the crop, the pale layer adds almost nothing, the rock caps the rooting
          depth, and the fast drainage means August is felt within a fortnight.
        why: >
          A profile is read as a set of limits rather than as a description. Nine inches of
          topsoil is what carries the organic matter, the nutrients and nearly all the roots, so
          it is the whole of the productive soil here. The pale layer beneath is leached mineral
          material and adds little. The rock at eleven inches means there is no deep store to
          fall back on, and the twenty-minute drainage says the texture is sandy, so a dry month
          is felt quickly rather than buffered. Together those four say the common can carry
          grazing and cannot carry another acre of vegetables without soil being built first,
          which takes years.

  # ----- day 2. The water account: one deposit, several standing orders.
  - title: One deposit, four standing orders
    objective: Measure what the island's aquifer is actually given each year, and what is taken out.
    briefing: The abstraction licence is up for renewal and nobody has measured the recharge since it was written.
    stake: >-
      Wednesday, and the abstraction licence renewal has to be lodged before the ferry paper is drafted, because the ferry's water is the thing the paper is quiet about. Mairead Sorley, the water engineer, has fourteen years of her own rain readings and a borehole meter, and she has never been asked to put the two together. Calloway wants a figure she can defend at the council; Berhane wants the licence capped at whatever the recharge turns out to be. Today you measure the deposit, count the standing orders and say how long the store would last if the rain stopped. Get the deposit wrong and the cap is a number that means nothing for the next ten years.
    takeaway: An aquifer is an account with one deposit, and a licence written above it spends the balance.
    stops:
      - group: WATER
        task: Work out what the catchment actually gives back
        title: What the rain leaves behind
        place: Waterworks
        relationship: >-
          recharge = rainfall × area × coefficient: only the fraction of rain that gets into the ground is available to a borehole.
        concept: 'The water cycle over a small island: rain in, runoff and abstraction out'
        takesAsRead:
          - 'An ecosystem as a budget: what comes in, what leaves, what stays'
        scene: >
          Sorley has fourteen years of rain readings. They average 1.05 metres a year. The
          catchment above the borehole is 1.4 square kilometres, and the original licence says a
          fifth of the rain gets down to the aquifer.
        guide: >-
          Rain that lands is not water you can have. Some runs off the rock to the sea, most
          of the rest goes back up through the turf, and what is left soaks down to the store
          the borehole draws from. Multiply the depth of rain by the area it falls on to get a
          volume, then take the fraction that actually gets down there. Watch the units: a
          depth in metres times an area in square metres is cubic metres.
        background:
          - >-
              Why the coefficient is so small. On Vellan the rock is close to the surface, the
              turf is short and the wind is constant, so evaporation and transpiration take the
              largest share and runoff takes most of the rest. A fifth reaching the aquifer is
              normal for a thin maritime soil and would be wrong for a deep sand.
          - >-
              What the number is and is not. It is an annual average over a catchment, which
              means it is right about a decade and silent about August. The store buffers the
              difference between a wet winter and a dry summer, and the licence has to be written
              against the average while the tanks are sized against the worst month.
          - >-
              Why nobody has measured it. The licence was written in 1998 from a mainland table,
              and the figure has been repeated ever since. Sorley's fourteen years of readings are
              the first local evidence, and they are about eight per cent lower than the table —
              which matters, because the licensed abstraction was set from the table.
        assumes:
          - the fourteen-year mean rainfall is representative of the next decade
        takeaway: Recharge is rain times area times the fraction that gets underground, and it is an annual average.
        format: BALLPARK
        question: Estimate the annual recharge to the aquifer.
        estimate:
          prompt: Rainfall averages 1.05 m a year over a 1.4 km² catchment, and a fifth of it reaches the aquifer.
          question: Estimate the annual recharge to the aquifer.
          labels:
            - 1.05 m  (annual rainfall depth)
            - 1.4e6 m²  (catchment area)
            - 0.20  (fraction reaching the aquifer)
            - 0.80  (fraction lost to runoff and evaporation)
          values: [1.05, 1400000, 0.20, 0.80]
          slots: 3
          template: '{0} × {1} × {2}'
          formula: a*b*c
          correct: [0, 1, 2]
          target: 294000
          tolerance: 20000
          units: m³ a year
          solution: recharge = 1.05 × 1.4 × 10⁶ × 0.20 = 2.94 × 10⁵ m³ a year.
          explanation: About 294,000 cubic metres a year, against a licence that allows 340,000.
        answerText: About 294,000 cubic metres a year — against a licence permitting 340,000.
        why: >
          A depth of rain over an area is a volume, and only the fifth that gets underground is
          available: 1.05 metres over 1.4 square kilometres is 1.47 million cubic metres of rain,
          and 294,000 of it reaches the store. The licence allows 340,000. That gap is the whole
          of the day, and it is not a modelling subtlety — the licence was written from a mainland
          recharge table and Sorley's readings are the first local measurement. Using the 0.8
          instead gives 1.18 million, which is the water that never arrives; it is the largest
          number on the board and it belongs to the sea and the sky.
        rebuttals:
          - The 0.8 is what runs off and evaporates. It is the largest number here and none of it reaches the borehole.
          - Rainfall times area without the coefficient is the rain that fell, which is not water anybody can abstract.
      - group: TIP
        task: Work out how long the hole has left
        title: Eleven years, at what rate
        place: Tip and Sorting Yard
        relationship: >-
          doubling time = 70 / r: anything growing at a steady percentage doubles in roughly seventy over that percentage.
        concept: 'Exponential growth, and reading a doubling time off a rate'
        scene: >
          Blessing Okafor, who runs the tip, weighs everything that arrives: 204 tonnes last
          year, and the figure has risen about 3.5 per cent a year since the sorting yard opened. The cell has eleven years of
          volume left at last year's rate.
        guide: >-
          A quantity growing by the same percentage each year does not add, it multiplies, and
          the useful way to feel that is the time it takes to double. Divide seventy by the
          annual percentage. Then set the doubling time against the eleven years the hole is
          said to have, and decide whether "eleven years at last year's rate" is a forecast or
          a sentence with a condition hidden in it.
        background:
          - >-
              Where the seventy comes from. It is the natural logarithm of two, multiplied by a
              hundred, so it works for any steadily compounding quantity — a population, a
              landfill, a bank balance, an epidemic. Seven per cent doubles in ten years, one per
              cent in seventy.
          - >-
              Why "at last year's rate" is the load-bearing phrase. Eleven years of volume divided
              by a constant annual tonnage is arithmetic. The tonnage is not constant, and a
              quantity that doubles in twenty years fills a hole considerably sooner than a flat
              one does. The phrase makes the estimate sound careful while removing the growth.
          - >-
              What the island can do about the rate rather than the hole. What leaves on the ferry
              costs money per tonne and what stays takes volume. Hollis takes compostable material
              off Okafor's hands and returns it as topsoil, which is the only stream on the island
              that is genuinely removed from the arithmetic.
        assumes:
          - the 3.5 per cent annual rise continues at the same rate
        takeaway: A steady percentage growth doubles in seventy over that percentage, and it fills a hole early.
        format: BALLPARK
        question: Estimate the doubling time of the island's annual waste tonnage.
        estimate:
          prompt: Waste arriving at the tip has risen about 3.5 per cent a year. Okafor wants the doubling time before she signs the eleven-year figure.
          question: Estimate the doubling time of the island's annual waste tonnage.
          labels:
            - 70  (the constant in the rule)
            - 3.5 %  (annual growth in tonnage)
            - 204 t  (last year's arrivals)
            - 11 years  (volume left at last year's rate)
          values: [70, 3.5, 204, 11]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 20
          tolerance: 2
          units: years
          solution: doubling time = 70 ÷ 3.5 = 20 years.
          explanation: Twenty years to double, so within the hole's stated eleven-year life the annual tonnage rises by about a third.
        answerText: About twenty years to double — so the tonnage rises roughly a third inside the hole's stated life.
        why: >
          Seventy over three and a half is twenty years, and that number is what turns the
          eleven-year figure into a claim with a condition. A tonnage doubling in twenty years is
          up about a third within eleven, so the volume consumed is not eleven times last year's
          arrivals but appreciably more, and the hole closes several years early. The phrase doing
          the damage is "at last year's rate", which sounds like caution and is the assumption the
          whole estimate rests on. What the island can actually move is the rate rather than the
          hole, and the only stream genuinely leaving the arithmetic is what Hollis composts.
        rebuttals:
          - Multiplying 204 tonnes by eleven years is the flat calculation the eleven-year figure already assumes.
          - The eleven years is the answer being tested, not an input to the doubling time.
      - group: HARB
        task: Say who is actually on the island
        title: Ninety-one, and how many in July
        place: Harbour Office
        concept: 'An ecological footprint, and what a visitor adds to one'
        takesAsRead:
          - 'Carrying capacity, and what happens on the way past it'
        scene: >
          Calloway has the resident register at ninety-one and the ferry manifests for last
          July. The manifests show 340 day visitors and 61 people staying overnight across
          the month.
        guide: >-
          A population is not the same as a load. Ask what each kind of person actually draws
          from the island's budgets — water, waste, power — and for how long. A day visitor and
          a resident are not the same number of anything, and adding them as though they were
          is how the ferry paper gets to a figure that looks harmless.
        background:
          - >-
              What a footprint measures. The land and water needed to supply what somebody
              consumes and absorb what they discard. On an island the interesting part is not the
              total but the share of it that has to be met locally: water and waste cannot be
              imported or exported cheaply, and power partly can.
              
          - >-
              Why day visitors and overnight visitors are different quantities. A day visitor uses
              a toilet, buys lunch and leaves; an overnight visitor showers, washes and produces a
              day's waste. The water difference between the two is roughly tenfold, and the ferry
              paper's headline counts them together.
          - >-
              Why peak matters more than average here. Three hundred and forty visitors spread
              over a year is invisible in every budget. The same number in July arrives when the
              borehole is at its lowest and the tanks are already being managed, which is the one
              month the island's spare capacity is not spare.
        assumes:
          - the register and the manifests both cover the same July
        takeaway: A visitor is a load rather than a person, and peak load is what the budgets feel.
        format: CHOICE
        question: Which comparison tells the council what July actually costs the island?
        choices:
          - Visitor-nights against resident days in the same month, per head
          - Total visitor numbers across the whole year set against the resident population of 91
          - Day visitors against overnight visitors, counted as arrivals
          - Ferry sailings in July against sailings in January
        answer: Visitor-nights against resident days in the same month, per head
        why: >
          The budgets feel person-days, not arrivals, and they feel them in the month they happen.
          Sixty-one overnight visitors across July is a few hundred visitor-nights, each drawing
          something like a resident's daily water; three hundred and forty day visitors draw
          roughly a tenth of that each. Putting both into one annual total is what makes the
          figure look harmless, because it divides the peak across eleven months that were never
          under pressure. Sailings are a proxy for arrivals and arrivals are a proxy for load, and
          each step of that chain loses the thing the council has to decide.
        rebuttals:
          - An annual comparison spreads July across eleven months that had spare capacity, which is what hides the peak.
          - Arrivals count people through the berth; a day visitor and an overnight visitor are not the same load.
          - Sailings measure the ferry's schedule rather than what anybody drew from the island's stores.

  # ----- day 3. Who eats whom, and how much of an island holds it.
  - title: The thin end of the food web
    objective: Work out how much the reef and the ground can support, and why the top of a web is small.
    briefing: Berhane's transect counts and the west ground's landings describe the same system from two ends.
    stake: >-
      Thursday, and Petra Rask, the fisheries observer, is on the island for three days and wants the trophic arithmetic in the assessment rather than in an appendix. The west boats land predators, and Berhane's transects count what those predators eat. Rask's point is that a quota argued in tonnes of fish is an argument about the bottom of the web without ever mentioning it. Today you work the energy from the plankton up, put a number on how many species this island can keep, and say what a survey of eleven lines can support. Argue the top of a web without the bottom and the quota is set on a number with nothing under it.
    takeaway: Each step up a food web keeps about a tenth of what the step below had.
    stops:
      - group: REEF
        task: Work the energy up from the bottom of the web
        title: A tenth of a tenth
        place: Reef Station
        relationship: >-
          E_next = 0.10 × E_level: about a tenth of the energy at one trophic level reaches the next.
        concept: 'Energy transfer between levels, and why the top is thin'
        takesAsRead:
          - 'Food webs and trophic levels: who eats whom, and how much of it'
        scene: >
          Berhane has a productivity figure for the bay: the plankton fix about 84,000
          kilojoules a square metre a year. The west boats land predators three steps up
          from that.
        guide: >-
          Work upward one step at a time. Roughly a tenth of the energy held at each level
          reaches the one above it, because most of it is spent living, lost as heat or never
          eaten. Three steps up from the producers is a tenth of a tenth of a tenth. Do the
          arithmetic before deciding whether the west ground's landings are plausible.
        background:
          - >-
              Where the ninety per cent goes. Respiration takes the largest share — an animal
              spends most of what it eats staying alive — and the rest is lost as heat, excreted,
              or simply not eaten. The tenth that transfers is an average across systems and runs
              from about two per cent to twenty.
          - >-
              Why this is the reason food chains are short. Four steps up from a producer leaves a
              ten-thousandth of the original energy, which cannot support a population of any size.
              It is also why a predator at the top of a web is rare, slow to mature and slow to
              recover, and why fishing one is a different proposition from fishing a herbivore.
          - >-
              What it means for the quota argument. Landings are measured at the thin end. A change
              in the plankton or in what grazes it moves the top of the web with a lag of years,
              so a stock assessment that reads only landings sees the consequence long after the
              cause, which is Rask's objection to a quota argued in tonnes alone.
        assumes:
          - the ten per cent transfer figure applies at each step in this bay
        takeaway: Three steps up a web leaves a thousandth of the energy the producers fixed.
        format: BALLPARK
        question: Estimate the energy reaching the third level up from the producers.
        estimate:
          prompt: The bay's producers fix about 84,000 kJ per square metre a year. The west boats land the third level above them.
          question: Estimate the energy reaching the third level up from the producers.
          labels:
            - 84000 kJ/m²  (producers, per year)
            - 0.10  (the fraction reaching the next level)
            - 3  (steps up to the landed predator)
            - 0.90  (the fraction lost at each step)
          values: [84000, 0.10, 3, 0.90]
          slots: 2
          template: '{0} × {1}³'
          formula: a*Math.pow(b,3)
          correct: [0, 1]
          target: 84
          tolerance: 12
          units: kJ/m² a year
          solution: 84,000 × 0.10 × 0.10 × 0.10 = 84 kJ per square metre a year.
          explanation: A thousandth of what the plankton fixed. The landed predator is living off 84 kJ where the producers had 84,000.
        answerText: About 84 kilojoules a square metre a year — a thousandth of what the producers fixed.
        why: >
          Three transfers at a tenth each leave a thousandth, so 84,000 kilojoules becomes 84.
          That is the whole reason the top of a web is thin, and it reframes the quota argument:
          the west boats are harvesting a level that only ever receives a thousandth of the bay's
          production, so a small proportional change lower down is a large change to them. Using
          the 0.9 gives 61,000, which is what is lost rather than what transfers — a plausible
          number with the wrong meaning, and the tile is on the board because that is exactly how
          the mistake is made. The lag matters as much as the size: a change at the bottom reaches
          the landings years later.
        rebuttals:
          - The 0.9 is the share lost at each step; applying it gives what did not transfer.
          - One transfer rather than three answers about grazers, which nobody lands here.
      - group: COMMON
        task: Say what shrinking the habitat would cost in species
        title: Half the ground, a sixth of the species
        place: Common Office
        relationship: >-
          The species–area relationship, S = cAᶻ: richness rises with the area of habitat, far more slowly than area itself.
        concept: 'Island biogeography: area, isolation and the species a place can keep'
        takesAsRead:
          - 'Species richness, and what an island holds that a mainland does not'
        scene: >
          The ferry paper proposes taking eleven hectares of the common for parking and
          serviced pitches. Pike has a plant list for the common: 96 species over 62 hectares.
        guide: >-
          Species richness and area are related by a power law, not a straight line: the
          exponent for islands is about a quarter. Work out what 51 hectares would hold given
          what 62 holds, using that exponent. Then compare the loss of species with the loss of
          area, because they are nothing like the same fraction.
        background:
          - >-
              What the exponent means. Because z is about 0.25, richness goes as roughly the
              fourth root of area. Halving the area does not halve the species; it costs about
              sixteen per cent of them. Which cuts both ways — a small protected area keeps far
              more than its share, and a small loss is not harmless either.
          - >-
              Why islands have their own exponent. On a mainland a patch is restocked constantly
              from next door. Here it is not: whatever goes locally extinct has to arrive across
              open water to come back, so island richness sits lower for the same area and falls
              further when area is taken.
          - >-
              What the relationship cannot tell you. Which species. The eleven hectares proposed
              are the flattest and best-drained part of the common, which is where the two orchids
              in Pike's list are and where nothing else on the island offers the same conditions.
              A power law is about counts and is silent about the identity of what is lost.
        assumes:
          - the same species–area relationship holds across the common
        takeaway: Richness goes as about the fourth root of area, so a small area loss costs fewer species than it looks.
        format: BALLPARK
        question: Estimate the species the common would hold at 51 hectares.
        estimate:
          prompt: The common holds 96 plant species over 62 hectares. The proposal takes eleven of them, leaving 51.
          question: Estimate the species the common would hold at 51 hectares.
          labels:
            - 96  (species now)
            - 51 ha  (area after the take)
            - 62 ha  (area now)
            - 0.25  (z, the island exponent)
            - 11 ha  (the area the proposal takes)
          values: [96, 51, 62, 0.25, 11]
          slots: 4
          template: '{0} × ({1} ÷ {2})^{3}'
          formula: a*Math.pow(b/c,d)
          correct: [0, 1, 2, 3]
          target: 91
          tolerance: 3
          units: species
          solution: S = 96 × (51 ÷ 62)^0.25 = 96 × 0.951 = 91 species.
          explanation: Five species for eleven hectares — an eighteen per cent area loss costs about five per cent of the richness.
        answerText: About 91 species — five lost for eleven hectares, because richness follows the fourth root of area.
        why: >
          The ratio of areas is 0.82, and raised to the power 0.25 that is 0.95, so the count
          falls from 96 to about 91. An eighteen per cent loss of ground costs about five per cent
          of the species, which is the general shape of the relationship and it cuts both ways: a
          small reserve keeps more than its share, and a small loss is never proportional. What
          the arithmetic cannot say is which five, and that is the part Pike will raise. The
          eleven hectares proposed are the flat, well-drained end of the common, which is where
          the two orchids are and where nothing else on Vellan offers the same conditions.
        rebuttals:
          - Scaling the species count by the area ratio directly assumes a straight line, which islands do not follow.
          - Using the area lost rather than the area remaining answers what the eleven hectares hold on their own.
      - group: WATER
        task: Decide what a single reading is allowed to claim
        title: One sample, in July
        place: Waterworks
        concept: 'Reading an environmental claim: what a number is about, and over what period'
        takesAsRead:
          - 'Concentration against load, and why a small pipe can matter'
        scene: >
          Sorley's chloride reading from the borehole in July was 191 milligrams a litre. The
          previous four years' July readings were 74, 88, 96 and 121. Nobody has sampled in
          any other month.
        guide: >-
          Ask three questions of the number before anybody quotes it: what it is about, over
          what period, and what it is being compared with. A single reading is evidence about
          the day it was taken. Five readings all taken in the same month are evidence about
          that month across five years, which is a stronger claim about a different thing.
        background:
          - >-
              Why July is the worst month to sample and the right month to sample. Abstraction is
              highest and recharge is lowest, so July is when chloride peaks — which makes a July
              reading unrepresentative of the year and exactly the right measurement for deciding
              whether the borehole is being over-drawn.
          - >-
              What the series can support. Five Julys rising from 74 to 191 is a trend in the
              peak, and the rise is faster than the abstraction has grown, which is the signature
              of seawater arriving rather than of concentration by evaporation. That is a claim
              worth making and it is not the same claim as "the island's water is at 191".
          - >-
              How the misquote happens. The figure enters the pack as "chloride at 191 mg/L",
              loses its month on the way, and comes back as the island's water quality. Sarah
              Dunmore, the council clerk, has a rule for this: every figure carries what it is
              about and over what period.
        assumes:
          - all five readings were taken at the same borehole by the same method
        takeaway: A reading is evidence about the conditions it was taken under, and the period is part of the claim.
        format: CHOICE
        question: What can the five July readings support, put in front of the council?
        choices:
          - The July peak has risen five years running, faster than abstraction
          - The island's water contains 191 milligrams of chloride a litre
          - Seawater intrusion has been confirmed at the borehole
          - Chloride at the borehole varies with the season, peaking in the summer months
        answer: The July peak has risen five years running, faster than abstraction
        why: >
          Five readings from the same month in five years is a series about that month, and what
          it shows is a rising peak — rising faster than abstraction, which is the part that
          points at seawater rather than at concentration. That is the strongest claim the data
          carries and it is worth making. Stating a single figure as the island's water drops the
          month and turns a peak into an average. Confirming intrusion is a step further than five
          numbers can go without a chloride-to-bromide ratio or a second borehole. And seasonal
          variation is something these readings cannot show at all, because every one of them was
          taken in July.
        rebuttals:
          - The 191 is a July peak. Quoted without its month it becomes an annual figure the data never measured.
          - Intrusion is the likely mechanism and needs a ratio or a second borehole to be confirmed.
          - Seasonality cannot be shown by five samples all taken in the same month of the year.

  # ----- day 4. Salt, and how long a store takes to turn over.
  - title: Salt in the borehole
    objective: Find out whether the aquifer is being over-drawn, and how long it would take to recover.
    briefing: The July chloride is up again and the licence renewal is due on Friday.
    stake: >-
      Friday, and the licence has to be lodged today. Sorley has the recharge figure you measured and a fifth July chloride reading that is 58 per cent above the first. Berhane has asked the council to cap abstraction at recharge; Calloway says a cap written this week decides the ferry vote before it is taken, and she is right that it does. Today you find how long the store takes to turn over, what the tip is putting into it and what a cap would actually have to say. A store this slow does not tell you it is empty until years after the decision that emptied it.
    takeaway: A store with a long residence time hides the mistake that damaged it, and recovers on the same clock.
    stops:
      - group: WATER
        task: Work out how long the aquifer takes to turn over
        title: How slow the store is
        place: Waterworks
        relationship: >-
          residence time = stock ÷ flow: a large store with a small throughput turns over slowly, and recovers on the same clock.
        concept: 'Residence time: how long a store takes to turn over'
        takesAsRead:
          - 'An aquifer, and what abstracting faster than recharge does to it'
        scene: >
          The aquifer holds an estimated 2.6 million cubic metres. Recharge is the 294,000
          cubic metres a year you measured, and the borehole is licensed to take 340,000.
        guide: >-
          Divide what is held by what moves through each year. That is the residence time — how
          long the store takes to replace itself. It is the number that says how fast the
          aquifer responds to anything, in both directions: how long an over-draw takes to show
          up, and how long a corrected licence takes to fix it.
        background:
          - >-
              Why a slow store is dangerous rather than safe. A big buffer absorbs a mistake
              without showing it, so the evidence of over-abstraction arrives years after the
              licence that caused it. By the time the chloride is unambiguous, the decision being
              questioned is a decade old and the people who made it have left.
          - >-
              Why the recovery takes the same time. The clock is set by the ratio of the store to
              the flow, and the flow does not change when a cap is imposed. Capping abstraction
              tomorrow does not restore the balance tomorrow; it restores it over the same
              nine-year turnover, which is what a council expecting a quick result has to be told.
          - >-
              What the number rests on. The stock estimate is the weakest term — it comes from a
              1998 geophysical survey with a range of about thirty per cent, while the recharge is
              now measured. A residence time quoted to the year from a stock known to a third is
              a false precision, and the honest form is "roughly nine years".
        assumes:
          - the aquifer stock estimate is of the same order as the 1998 survey
        takeaway: Residence time is stock over flow, and it sets how slowly a store both fails and recovers.
        format: BALLPARK
        question: Estimate the residence time of the island's aquifer.
        estimate:
          prompt: The aquifer holds about 2.6 × 10⁶ m³ and receives 294,000 m³ of recharge a year.
          question: Estimate the residence time of the island's aquifer.
          labels:
            - 2.6e6 m³  (water held in the aquifer)
            - 294000 m³  (annual recharge)
            - 340000 m³  (annual licensed abstraction)
            - 1.4e6 m³  (annual rainfall on the catchment)
          values: [2600000, 294000, 340000, 1400000]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 8.8
          tolerance: 1
          units: years
          solution: residence time = 2.6 × 10⁶ ÷ 2.94 × 10⁵ ≈ 8.8 years.
          explanation: About nine years to turn over — so a licence set wrong in 1998 is only unambiguous now, and a cap set today fixes it over nine more.
        answerText: About nine years — which is how long the store took to show the error, and how long a cap takes to undo it.
        why: >
          Two point six million cubic metres over 294,000 a year is a little under nine years. That
          single number explains the shape of the whole argument. A licence written from a mainland
          table in 1998 has been over-drawing by about fifteen per cent, and a store that replaces
          itself once a decade absorbed it quietly until the July chloride became undeniable —
          which is now. It also disposes of the hope in the room: capping abstraction does not
          restore the balance this season, it restores it across another nine years. The stock is
          the weak term, known to about a third, so the honest answer is "roughly nine" rather
          than 8.8.
        rebuttals:
          - Dividing the stock by the licensed abstraction gives how long the store would last with no rain at all.
          - Rainfall on the catchment is not what reaches the store; four fifths of it never arrives.
      - group: TIP
        task: Turn a leachate concentration into a daily load
        title: A small pipe, up-catchment
        place: Tip and Sorting Yard
        relationship: >-
          load = C × Q: a pollutant load is a concentration multiplied by a flow, and only loads add up.
        concept: 'Concentration against load, and why a small pipe can matter'
        takesAsRead:
          - 'Point and non-point sources, and which one a pipe is'
        scene: >
          The tip's leachate collection runs at 2,300 litres a day and tested at 41 milligrams
          a litre of ammoniacal nitrogen. Okafor's note says the concentration is well below
          the discharge limit, which is true.
        guide: >-
          A concentration says how strong something is and a load says how much of it there is.
          Multiply the concentration by the flow to get a mass per day, and mind the units — a
          milligram per litre times litres a day is milligrams a day, which has to come back to
          kilograms before it can be compared with anything in a council paper. Then ask which
          of the two numbers the stream downstream of it responds to.
        background:
          - >-
              Why the limit is written as a concentration and the harm is done by the load. A limit
              on strength is easy to sample and easy to meet by dilution, which changes the
              concentration and not the mass. What accumulates in the ground, in the stream and in
              the borehole is mass, and mass is what a load measures.
          - >-
              Why this pipe matters out of proportion to its size. Two thousand three hundred litres
              a day is nothing beside the island's water movements, and the tip sits up-catchment of
              the borehole. A small mass arriving continuously into a store that turns over once a
              decade accumulates, which is the same residence-time argument in a different currency.
          - >-
              What the comparison should be against. Not the discharge limit, which this passes, but
              the load the aquifer receives from everything else — the septic tanks, the fertiliser
              on the common and the sheep. A load only means something beside the other loads into
              the same store.
        assumes:
          - the leachate flow is roughly steady through the year
        takeaway: Concentration is strength and load is mass; only mass accumulates in a store.
        format: BALLPARK
        question: Estimate the daily nitrogen load from the leachate.
        estimate:
          prompt: Leachate runs at 2,300 litres a day and tests at 41 mg/L of ammoniacal nitrogen.
          question: Estimate the daily nitrogen load from the leachate.
          labels:
            - 41 mg/L  (concentration)
            - 2300 L/day  (flow)
            - 1e6  (milligrams in a kilogram)
            - 50 mg/L  (the discharge limit)
          values: [41, 2300, 1000000, 50]
          slots: 3
          template: '{0} × {1} ÷ {2}'
          formula: a*b/c
          correct: [0, 1, 2]
          target: 0.094
          tolerance: 0.012
          units: kg a day
          solution: load = 41 × 2300 ÷ 10⁶ = 0.094 kg a day, about 34 kg a year.
          explanation: A tenth of a kilogram a day is 34 kilograms a year into a store that turns over once a decade.
        answerText: About 0.094 kilograms a day — some 34 kilograms a year, into a store with a nine-year turnover.
        why: >
          Forty-one milligrams a litre times 2,300 litres is 94,000 milligrams, which is 0.094
          kilograms a day and about 34 kilograms a year. The concentration passes the limit and
          the load is the number that matters, because what accumulates in an aquifer is mass. This
          is also why a limit written as a concentration is weak: it can be met by dilution, which
          changes the strength and not the mass. Thirty-four kilograms a year sounds small and
          belongs beside the other loads into the same store rather than beside a discharge limit
          it was never meant to be compared with.
        rebuttals:
          - The discharge limit is a concentration. Passing it says nothing about the mass arriving each year.
          - Concentration times flow without the unit conversion gives milligrams a day, which is not comparable with anything in the pack.
      - group: POWER
        task: Say which source a reading belongs to
        title: The pipe and the field
        place: Turbine Yard
        concept: 'Point and non-point sources, and which one a pipe is'
        takesAsRead:
          - 'A watershed, and what a catchment collects'
        scene: >
          The stream below the hill runs past the diesel house, the tip spur and eleven hectares
          of the common. Three samples along it show nitrogen rising, oil rising once after
          rain, and chloride flat.
        guide: >-
          A point source arrives from somewhere you can put a finger on and a non-point source
          arrives from everywhere at once. The tell is not the substance but the pattern: how
          the reading behaves in dry weather, after rain, and whether it can be turned off.
          Read each of the three that way before deciding what to regulate.
        background:
          - >-
              Why the distinction decides the response. A point source is licensed, sampled and
              enforced against — a pipe has an owner. A non-point source is managed by changing
              practice across a whole catchment, which is slower, cheaper per unit and far harder
              to make anybody responsible for.
          - >-
              What rainfall does to each. A point discharge is diluted by rain and its
              concentration falls while its load stays put. A diffuse source is mobilised by rain
              and both rise together, which is why sampling only in dry weather systematically
              misses agricultural pollution.
          - >-
              Why the oil is the interesting one. It appears after rain, which is the diffuse
              signature, and it comes from a hardstanding at the diesel house, which is a
              definite place. A yard is a point source that behaves like a non-point one, and it
              is the case that gets argued about.
        assumes:
          - the three sample points are on the same stream above the tidal reach
        takeaway: The tell is the pattern in dry and wet weather, not the substance.
        format: PROTOCOL
        task: Match each observation to what kind of source it indicates.
        columns:
          - What the samples show
          - What it points to
        scenarios:
          - Nitrogen highest in the first hour after heavy rain, low in dry weather
          - Ammoniacal nitrogen steady in all weather at the tip spur outfall
          - Oil sheen appearing only after rain, always downstream of the diesel yard
          - Chloride unchanged along the whole stream in every condition
        choices:
          - Diffuse runoff from fertilised ground across the catchment
          - A point discharge with a steady flow behind it
          - 'A hardstanding: a definite place, behaving like a diffuse source because rain moves it'
          - No source on this stream; the signal being followed is in the aquifer instead
        mapping: [0, 1, 2, 3]
        rebuttals:
          - Nitrogen that spikes with rain and disappears in dry weather is being washed off the ground, not piped.
          - A concentration that does not move with the weather has a steady flow behind it, which is a pipe.
          - 'The yard is a place you can point at, and rain is what mobilises it: a point source with a diffuse signature.'
          - Chloride flat along the stream means the salt problem is not arriving down this catchment at all.
        answerText: >-
          Rain-driven nitrogen is diffuse, the steady outfall is a point source, the oil is a
          hardstanding behaving diffusely, and the flat chloride belongs to the aquifer.
        why: >
          Each pattern is diagnostic. Nitrogen appearing in the first hour after rain and vanishing
          in dry weather is being washed off fertilised ground across the whole catchment, which is
          managed by changing practice rather than by a licence. A concentration steady in every
          condition has a continuous flow behind it, which is a pipe with an owner. The oil is the
          case worth arguing: it comes from one yard and only moves when it rains, so it is a point
          source with a diffuse signature and both tools apply. And the flat chloride matters most
          — it rules this stream out of the salt problem, which means the borehole's chloride is
          arriving through the rock.

  # ----- day 5. The fishery: what a stock can replace.
  - title: What the west ground can replace
    objective: Set a catch the stock can replace, from a stock estimate that has a width to it.
    briefing: Rask's assessment lands today and the quota has to be recommended before the Friday boat.
    stake: >-
      Monday, and Rask's assessment came off the Friday boat as a range rather than a number, which is what the council least wants. Josef Mbeki, a skipper who has kept to the quota for nine seasons, can name four boats that have not, and says he will stop keeping to it if the rule stays unenforced. Calloway wants the recommendation today because the landing fee schedule hangs on it. Today you work out the largest catch the west ground can replace, and what setting it at the edge of a range would do. A quota set at the top of an estimate is a quota set on the assumption that the estimate was generous.
    takeaway: A stock grows fastest at half its capacity, so the biggest sustainable catch is a quarter of r times K.
    stops:
      - group: HARB
        task: Work out the largest catch the stock can replace
        title: A quarter of r times K
        place: Harbour Office
        relationship: >-
          harvest = rK ÷ 4: a stock grows fastest at half its carrying capacity, so the largest catch it can replace is a quarter of r times K.
        concept: 'Maximum sustainable yield, and why it sits at half the stock'
        takesAsRead:
          - 'The tragedy of the commons, and the rule that answers it'
        scene: >
          Rask's assessment puts the west ground's carrying capacity at 1,600 tonnes, give or
          take 400, with an intrinsic growth rate of 0.42 a year. Last season landed 168
          tonnes.
        guide: >-
          A stock does not grow fastest when it is full. A full stock is at its capacity and
          barely grows at all; an almost empty one has nothing to grow from. The fastest growth
          is in the middle, and the largest catch that can be taken indefinitely is that growth
          — a quarter of the growth rate times the capacity. Work it out, then set it beside
          last season's landings.
        background:
          - >-
              Why the maximum sits at half. Growth is proportional both to how many there are and
              to how much room is left, and the product of those two peaks when the stock is at
              half its capacity. That is the whole of the logistic idea, and it is why a fishery
              managed to keep a stock full catches less than one managed to keep it half full.
          - >-
              Why fishing at the maximum is a knife edge. At exactly the peak, any error or bad
              year pushes the stock below half, where the growth is lower — so the same catch is
              now too big and the stock keeps falling. Fisheries set targets below the maximum for
              that reason, and the range on the capacity is what decides how far below.
          - >-
              What the width of the estimate does. Capacity is 1,600 give or take 400, so the
              sustainable catch is anywhere between 126 and 210 tonnes. Setting the quota at 210
              is setting it on the assumption that the generous end of the estimate was right,
              which is exactly the choice that ends fisheries.
        assumes:
          - the stock behaves logistically with the growth rate in the assessment
        takeaway: The largest replaceable catch is a quarter of r times K, and it sits on a knife edge.
        format: BALLPARK
        question: Estimate the maximum sustainable yield of the west ground.
        estimate:
          prompt: Carrying capacity 1,600 tonnes, intrinsic growth rate 0.42 a year. Rask wants the yield before the quota is recommended.
          question: Estimate the maximum sustainable yield of the west ground.
          labels:
            - 0.42  (r, intrinsic growth rate a year)
            - 1600 t  (K, carrying capacity)
            - 4  (the divisor in the relation)
            - 168 t  (last season's landings)
          values: [0.42, 1600, 4, 168]
          slots: 3
          template: '{0} × {1} ÷ {2}'
          formula: a*b/c
          correct: [0, 1, 2]
          target: 168
          tolerance: 14
          units: t a year
          solution: harvest = 0.42 × 1600 ÷ 4 = 168 tonnes a year.
          explanation: Exactly last season's landings — the west ground is being fished at its maximum, which is the least stable place to be.
        answerText: About 168 tonnes a year, which is exactly what last season landed.
        why: >
          A quarter of 0.42 times 1,600 is 168 tonnes, and last season landed 168. The fishery is
          being worked at its theoretical maximum, which sounds like success and is the least
          stable place a stock can sit: at the peak, one bad year or one over-landing pushes the
          stock below half its capacity, where growth is slower, so the same catch becomes too big
          and the decline continues. The width is the other half of the answer. Capacity is 1,600
          plus or minus 400, so the sustainable catch is somewhere between 126 and 210 tonnes, and
          168 is the middle of a range rather than a number.
        rebuttals:
          - Last season's landings are what the yield is being compared against, not an input to it.
          - Half the capacity is the stock size that grows fastest, not the catch that can be taken.
      - group: COMMON
        task: Decide what the stocking rule has to say
        title: One more animal each
        place: Common Office
        concept: 'The tragedy of the commons, and the rule that answers it'
        takesAsRead:
          - 'Carrying capacity, and what happens on the way past it'
        scene: >
          Pike's count puts 512 sheep on a common assessed at 430. Nine graziers hold
          forty-one shares between them, and not one of them is over their own share.
        guide: >-
          Work out where the extra animals came from before deciding what rule answers it. Look
          at who gains from one more animal and who pays for it, and whether any individual
          grazier has broken anything. Then pick the rule that changes the arithmetic each
          grazier faces, rather than the one that describes what you wish they would do.
        background:
          - >-
              Why nobody has to cheat for this to happen. One more animal is worth having to the
              grazier who owns it, and the cost — slightly worse grazing — is spread across all
              nine. Each individual decision is rational and the sum of them exceeds the common's
              capacity. That is the structure, and moralising about it changes nothing.
          - >-
              Why shares alone did not hold it. The shares were set as fractions of a total that
              was never inspected, so nine graziers each within their share can still sum past the
              limit as the total drifts. A rule expressed as a proportion needs the total to be
              counted; a rule expressed in animals does not.
          - >-
              What the three real options do. A hard stocking limit with inspection changes what
              each grazier may do. A charge per animal above a threshold changes what each animal
              costs them. Dividing the common into private parcels internalises the cost entirely
              and ends the common — which is a real answer and has its own price.
        assumes:
          - Pike's count is of animals on the common on one day
        takeaway: The commons fails because the gain is private and the cost is shared, and only the arithmetic can be changed.
        format: CHOICE
        question: Which rule actually answers what the count shows?
        choices:
          - A limit in animals, inspected, and the count published
          - A written reminder to every grazier of their responsibility to the common as a whole
          - Reducing every grazier's share by the same proportion
          - A ban on new graziers joining the common
        answer: A limit in animals, inspected, and the count published
        why: >
          Nobody here has broken their share, so the failure is in the rule rather than in the
          graziers: shares are proportions of an uninspected total, and nine people inside their
          proportion can still sum past 430. A limit expressed in animals and actually counted
          fixes precisely that, and publishing the count is what makes it enforceable between
          neighbours who have to live together. A reminder changes no arithmetic. Cutting every
          share proportionally keeps the same uncounted structure and simply moves the number.
          Banning new graziers protects the nine who are already over and does nothing about the
          512 animals on the ground.
        rebuttals:
          - Responsibility is not what failed. Every grazier is within their share and the total is still over.
          - A proportional cut keeps a rule based on an uninspected total, which is the thing that drifted.
          - Excluding newcomers freezes the present overstocking in place and reduces nothing.
      - group: REEF
        task: Say which fish is which kind of animal
        title: Many eggs, or few
        place: Reef Station
        concept: 'Generalists and specialists, r-selected and K-selected'
        takesAsRead:
          - 'Carrying capacity, and what happens on the way past it'
        scene: >
          Two species come off the west ground. One matures at two years and spawns hundreds of
          thousands of eggs; the other matures at nine and produces a few dozen young a season.
          The quota treats them as tonnes.
        guide: >-
          Sort the two by how they reproduce, then ask what each does after a bad year. Many
          small offspring with no care is one strategy and a few large ones with a long
          maturation is the other, and they respond to fishing in opposite ways. A quota in
          tonnes is silent about which of the two it is taking.
        background:
          - >-
              What the two strategies are. An r-selected species matures early, breeds
              prolifically and dies young; a K-selected one matures late, breeds slowly and lives
              long. Neither is better — they are answers to different conditions, one to an
              unpredictable environment and the other to a crowded stable one.
          - >-
              Why it decides recovery. Fish out an r-selected stock and it can rebuild in a few
              seasons if the habitat holds, because the survivors breed fast. Fish out a
              K-selected one and recovery takes decades, because nothing in its life history is
              fast. The same tonnage taken from the two is not the same decision.
          - >-
              Why a tonnage quota hides it. A hundred tonnes of a fast-breeding schooling fish and
              a hundred tonnes of a slow-maturing predator weigh the same and are not the same
              harvest. This is why assessments are written per species even when the market and
              the landing fee are not.
        assumes:
          - both species are taken by the same boats on the same ground
        takeaway: Two stocks of equal weight are not two harvests of equal cost.
        format: CHOICE
        question: What does the difference between the two species mean for a quota written in tonnes?
        choices:
          - The same tonnage is a far heavier harvest on the slow-maturing one
          - Neither is affected differently, because a tonne of biomass is a tonne of biomass
          - The fast-breeding species should be protected first, being more numerous
          - Both should be closed until the assessment separates them
        answer: The same tonnage is a far heavier harvest on the slow-maturing one
        why: >
          A hundred tonnes of a fish that matures at two and spawns in hundreds of thousands is a
          harvest the stock can replace within a few seasons. A hundred tonnes of one that matures
          at nine and produces dozens is a harvest that removes breeding adults which cannot be
          replaced for a decade or more. The weight is identical and the decision is not, which is
          why assessments are written per species. Protecting the abundant one first inverts the
          argument, and closing the ground entirely is a real option that the arithmetic does not
          require — it requires the quota to be split.
        rebuttals:
          - Biomass is what the scale reads. It says nothing about how long the animals took to grow.
          - Abundance is not the same as resilience; the numerous species here is the one that recovers fastest.
          - Closing the ground is available and stronger than the evidence needs; separating the quota is what the difference argues for.

  # ----- day 6. Enforcement, and who pays for it.
  - title: The rule and the money behind it
    objective: Decide how the quota is enforced and what pays for the enforcement.
    briefing: Four boats landed over quota last season and nothing happened to any of them.
    stake: >-
      Tuesday, and Calloway has the landing fee schedule open beside Rask's list of four boats. Her argument today is the one she is right about: the observer comes over three days a fortnight because the landing fees pay for those three days, and a second sailing pays for six. Mbeki says he will fish to the limit like everyone else if the limit stays a suggestion. Berhane's objection is that the same sailing brings July water demand. Today you decide what enforcement the island can actually run, and what it is funded by. An unenforced quota costs the boats that keep it and saves nothing.
    takeaway: A rule is only a rule to the extent somebody is funded to check it.
    stops:
      - group: HARB
        task: Choose what the island can actually enforce
        title: Three days a fortnight
        place: Harbour Office
        concept: 'The tragedy of the commons, and the rule that answers it'
        takesAsRead:
          - 'Carrying capacity, and what happens on the way past it'
        scene: >
          Rask observes three days a fortnight, funded by landing fees. Four of eleven boats
          landed over quota last season, all of them on days she was not on the island.
        guide: >-
          Compare the options by what they change about a skipper's decision on an unobserved
          day, because that is when the over-landing happened. Coverage, penalty size and who
          does the checking are three different levers. One of them can be paid for out of the
          fees the island already collects.
        background:
          - >-
              Why coverage and penalty trade against each other. A skipper weighs the chance of
              being caught against what happens if they are, so the same deterrent can be bought
              with frequent inspection and a small penalty, or rare inspection and a large one.
              The island can afford one of those and not the other.
          - >-
              Why landings-book verification is cheap here. Every boat lands at one berth and
              Calloway is on it. Cross-checking the book against buyers' receipts costs nothing
              and catches systematic over-landing, though not a single bad trip.
          - >-
              Why peer enforcement works on Vellan and not in general. Eleven boats, all known to
              each other, all wintering in the same harbour. Published landings turn a private
              gain into a public one, which is the mechanism that actually held the common's
              stocking limit for a century before it drifted.
        assumes:
          - all landings pass across the one berth
        takeaway: Deterrence is the chance of being caught times what happens then, and coverage is the affordable half.
        format: VALUE
        question: You have four days of observer time this fortnight. Buy what changes what a skipper does.
        value:
          hint: >-
            Everything here is real evidence about the fishery. The question is which of it changes
            what happens on a day nobody is watching.
          budget: { amount: 4, unit: days }
          decision: Whether a skipper lands over quota on an unobserved day
          options:
            - id: sea
              label: Observer days at sea on the two largest boats
              cost: 2
              axis: what is caught
              reveals: Discard rates and gear detail for the two days she is aboard.
            - id: receipts
              label: Cross-check the landings book against the buyers' receipts
              cost: 1
              axis: what was landed and sold
              decisive: true
              reveals: Two boats sold more than their book records, on days with no observer.
            - id: assess
              label: A second week on the stock assessment
              cost: 3
              axis: how much is out there
              reveals: The range narrows from plus or minus 400 tonnes to 310.
            - id: gear
              label: Gear inspection at the berth
              cost: 1
              axis: whether the gear is legal
              reveals: All eleven boats compliant, as they were last year.
          commit: Fund it
        answerText: >-
          Cross-check the book against the buyers' receipts. It is the only thing here that sees an
          unobserved day, and it costs one of the four.
        why: >
          The over-landing happened on days nobody was watching, so the only evidence that changes
          anything is evidence that reaches those days. Receipts do: every catch is sold, the buyer
          writes it down, and the comparison against the landings book is retrospective, cheap and
          total rather than sampled. Observer days at sea are the best evidence about what is caught
          and they only ever cover the days she is aboard, which are the days nobody offends. A
          narrower stock estimate is genuinely useful and changes the quota rather than the
          compliance. Gear inspection confirms what was already true last year. Rigorous and
          answering a question whose answer does not enter the decision is the failure this stop is
          about.
      - group: TIP
        task: Decide what leaves on the ferry and what stays
        title: Per tonne, or per cubic metre
        place: Tip and Sorting Yard
        concept: 'An ecological footprint, and what a visitor adds to one'
        takesAsRead:
          - 'Carrying capacity, and what happens on the way past it'
        scene: >
          Okafor has 204 tonnes a year arriving, a cell with eleven years of volume and a
          ferry that charges by the tonne. Four streams could leave instead of staying:
          metal, glass, plastic and compostables.
        guide: >-
          The tip is short of volume, not of mass, and the ferry charges for mass. Rank the four
          streams by volume saved per pound spent shipping them, not by how much they weigh or
          how virtuous each feels. One of the four should not be shipped at all, because the
          island has a use for it.
        background:
          - >-
              Why the two currencies pull apart. Glass is heavy and compacts to almost nothing;
              plastic is light and takes volume no matter what is done to it. Ship by weight and
              the plastic is nearly free to remove and the glass is expensive, which is the
              opposite of the intuition that heavy things are the problem.
          - >-
              Why compostables are a special case. They are the heaviest stream and the wettest,
              so shipping them is the worst pound-for-pound choice — and Hollis will take them for
              nothing and return them as the only deep topsoil on the island. A stream with a local
              use is not a waste stream.
          - >-
              What the ferry's own arithmetic adds. Every tonne shipped is a tonne of fuel burnt
              across the crossing, and the island counts that in its own emissions because the
              sailing is made for it. The cheapest stream to remove by volume is not automatically
              the best one to remove overall.
        assumes:
          - the ferry's charge is per tonne regardless of what the tonne is
        takeaway: A tip runs out of volume and a ferry charges for mass, and the two rank the streams differently.
        format: PROTOCOL
        task: Match each stream to what should happen to it, and why.
        columns:
          - The stream
          - What to do with it
        scenarios:
          - Plastic packaging — light, bulky, does not compact
          - Glass — heavy, compacts to a fraction of its volume
          - Compostables — heaviest and wettest of the four
          - Scrap metal — heavy, dense, and worth money on the mainland
        choices:
          - 'Send it: the most volume removed per pound of freight'
          - 'Crush it and keep it: cheap to store once compacted, expensive to send'
          - 'Give it to the market garden: a local use makes it not a waste stream'
          - 'Send it: the crossing is paid for by what the scrap sells for'
        mapping: [0, 1, 2, 3]
        rebuttals:
          - Plastic is the volume problem and the lightest thing to send, so it is the cheapest volume the island can buy back.
          - Glass compacts to almost nothing, so keeping it costs little volume and shipping it costs a lot of weight.
          - Compostables are the worst pound-for-pound freight and the one stream with a use on the island.
          - Scrap pays for its own crossing, which is the only stream that does.
        answerText: >-
          Ship the plastic, crush and keep the glass, compost the compostables on the island, and
          ship the scrap because it pays for itself.
        why: >
          The tip is short of volume and the ferry charges for mass, so the ranking is volume
          removed per pound of freight. Plastic wins that comparison outright: it is the bulkiest
          stream and the lightest to send. Glass loses it — heavy to ship and almost free to store
          once crushed. Compostables are the heaviest, wettest freight and the only stream with a
          use here, which takes them out of the arithmetic entirely and returns them as topsoil.
          Scrap is the exception that pays its own passage. The intuition this defeats is that
          heavy things are the problem; on an island with a hole rather than a weight limit, bulk
          is the problem.
      - group: POWER
        task: Find where the demand actually peaks
        title: A July evening, boat in
        place: Turbine Yard
        concept: 'Energy against power: a kilowatt is not a kilowatt-hour'
        takesAsRead:
          - 'Renewable and non-renewable, and what the cable is bringing'
        scene: >
          Aled Ferris, the power engineer, has four years of half-hourly demand. The annual average is 88 kilowatts and
          the highest half hour on record is 310, on a July evening with the ferry alongside
          and the cable out.
        guide: >-
          Two different questions get asked of the same data and the answers are in different
          units. How much energy the island uses in a year is one; how much power the plant has
          to be able to deliver at once is the other. Work out which of the two sizes the diesel
          sets, and which one sizes the fuel order.
        background:
          - >-
              What each number decides. Average demand times hours in the year is the energy, which
              sets the fuel bill and what a turbine could displace. The peak half hour sets the
              plant: three sets exist so that the largest can fail during the peak and the island
              stays lit.
          - >-
              Why the peak is where it is. A July evening with the ferry alongside is cooking,
              showers, the berth's own load and the chandlery all at once, with the cable out. It is
              not a typical July evening; it is the worst credible combination, and that is exactly
              what a plant is sized against.
          - >-
              Why a second sailing matters here out of proportion. It does not move the annual
              energy much — a few more crossings against a whole year — and it adds directly to the
              one half hour that already sets the plant. A small change to the average can be a
              large change to the peak.
        assumes:
          - the four years of half-hourly records cover the same load
        takeaway: One number buys equipment and the other buys fuel, and they are not the same number.
        format: CHOICE
        question: Which figure does a second sailing change in the way that costs money?
        choices:
          - The July peak half hour, which sizes the diesel plant
          - The annual energy total, which is what the fuel order for the year is set from
          - The average demand across the year
          - The capacity factor of the turbine on the hill
        answer: The July peak half hour, which sizes the diesel plant
        why: >
          A handful of extra crossings adds very little to a year's energy and lands directly on
          the half hour that already sets the plant — a July evening with the boat alongside and
          the cable out. Plant is bought for peaks and fuel is bought for totals, and the two
          questions have different units: kilowatts against kilowatt-hours. That is why the annual
          average is the wrong figure to argue the ferry from, and why Ferris keeps returning to a
          single half hour four years ago. The turbine's capacity factor is a property of the wind
          rather than of the ferry and does not move at all.
        rebuttals:
          - 'The annual total barely moves: a few crossings against 8,760 hours of everything else.'
          - An average across the year is the least sensitive number to a change concentrated in one month.
          - Capacity factor describes what the wind gives the turbine and is unaffected by sailings.

  # ----- day 7. Energy: what a kilowatt-hour costs on an island.
  - title: What a kilowatt-hour costs here
    objective: Put the island's energy use in the units that decide anything.
    briefing: The sea cable failed twice in March and the diesel bill for the year is in.
    stake: >-
      Wednesday, and the cable was out for nine days in March. Aled Ferris, the power engineer, has the year's diesel bill and a turbine on the hill that has been waiting two years for a gearbox. Calloway's ferry paper assumes the turbine comes back; Ferris will not sign that assumption without a capacity factor from Vellan rather than from a brochure. Berhane, for once, is on Calloway's side here — anything that displaces diesel helps the reef. Today you work out what the island actually uses, in the units a decision can be made in. Argue energy in the wrong unit and the plant is either half the size it needs or twice the price it should be.
    takeaway: Power is the rate and energy is the amount, and the two decide different things.
    stops:
      - group: POWER
        task: Turn a demand into a year of energy
        title: Eighty-eight kilowatts, all year
        place: Turbine Yard
        relationship: >-
          kWh = kW × h: energy is power multiplied by the time it ran.
        concept: 'Energy against power: a kilowatt is not a kilowatt-hour'
        takesAsRead:
          - 'Renewable and non-renewable, and what the cable is bringing'
        scene: >
          Ferris has the island's average demand at 88 kilowatts across the whole year. The
          diesel invoice covers the nine days the cable was out and he wants the annual energy
          figure to compare it against.
        guide: >-
          Energy is a rate multiplied by a time. Take the average power and the hours in a year
          and multiply. The number that comes out is the whole island's consumption, and it is
          the figure a turbine's output, a fuel bill and a tariff all have to be compared with —
          none of which can be compared with a demand in kilowatts.
        background:
          - >-
              Why this conversion is where the confusion lives. A kilowatt is a rate, like a speed;
              a kilowatt-hour is an amount, like a distance. Most arguments about energy on this
              island have been two people using the same word for both, and a factor of 8,760
              between them.
          - >-
              What the average conceals and why it is still the right number here. It hides the
              July peak entirely, which is a separate question about plant. For fuel, tariffs and
              anything a turbine might displace, the total is what matters, and the total is the
              average times the hours.
          - >-
              Why the cable's nine days show up so clearly. On cable power the island imports; on
              diesel it burns about a quarter of a litre for each kilowatt-hour. Nine days at 88
              kilowatts is around nineteen thousand kilowatt-hours, and the invoice is the proof
              of the conversion working in the other direction.
        assumes:
          - the 88 kilowatt average is a genuine annual mean
        takeaway: Energy is power times time, and a year is 8,760 hours of it.
        format: VERIFY
        question: Predict the island's annual energy from the average demand, then read the meter total.
        verify:
          hint: >-
            Lock the prediction before the meter book is opened. Energy is the average power
            multiplied by the hours in a year, and both numbers are already on the sheet.
          prediction: { label: Predicted annual energy, unit: MWh, min: 200, max: 2000, step: 5 }
          truth: 771
          passRatio: [0.85, 1.15]
          intervention:
            label: Open the meter book
            note: Four years of half-hourly records, totalled at the incoming board.
            outcome: Book open at last year's total, cable and diesel added together.
          measurement:
            label: Metered total for the year
            note: 764 megawatt-hours, which is the average demand doing exactly what it should.
            cost: 1
            costUnit: readings
          unmeasuredMoral: >-
            An annual energy figure calculated from an average and never checked against a meter is
            a statement about the average. The meter is the only thing that knows what was used.
          commit: Report the annual energy
        answerText: >-
          About 771 megawatt-hours predicted from 88 kilowatts across 8,760 hours, and the meter
          says 764 — of which the March outage was some 19.
        why: >
          Eighty-eight kilowatts held for 8,760 hours is 771 megawatt-hours, and the meter says
          764 — close enough to confirm that the average is a real average rather than a convenient
          one. That total is what everything else is compared against: the fuel bill, the tariff and
          whatever the turbine might displace. Predicting from the 310 kilowatt peak instead gives
          2,700, which is the island's consumption if the worst half hour ever recorded ran all
          year, and the meter would have refuted it by a factor of three. Rate and amount are the
          same word in ordinary speech and a factor of nearly nine thousand apart here, which is
          why the reading is worth taking.

      - group: WATER
        task: Say what the pumps are actually costing
        title: Lifting water is most of the bill
        place: Waterworks
        concept: 'Efficiency, and where the rest of the fuel goes'
        takesAsRead:
          - 'Energy against power: a kilowatt is not a kilowatt-hour'
        scene: >
          Sorley's borehole pump runs at 11 kilowatts for about nine hours a day. It is the
          largest single load on the island after the school's heating, and it lifts water 46
          metres.
        guide: >-
          Ask where the electricity goes. Some of it becomes lifted water and the rest becomes
          heat — in the motor, in the pump and in friction down the rising main. Rank the four
          places it could be going by how much of the bill each accounts for, then decide which
          of them is worth spending money on.
        background:
          - >-
              What a pump's efficiency is made of. Motor losses of a few per cent, pump losses of
              rather more, and pipe friction that rises with the square of the flow. On an old
              installation the pipe is usually the largest single loss and the cheapest to fix, by
              slowing the pump and running it longer.
          - >-
              Why the leak is not an efficiency question and matters more. A fifth of what this
              pump lifts never arrives, which means a fifth of the energy is spent on water that
              runs into the ground. No improvement in the pump touches that, and it is the largest
              number in the whole analysis.
          - >-
              Why the lift itself cannot be improved. Forty-six metres of head is where the water
              is and where the tanks are, and no pump can better it — that portion of the bill is
              physics rather than engineering. The distinction between "loss" and "the work" is the
              whole of reading an energy account.
        assumes:
          - the pump runs at roughly constant load when it is running
        takeaway: Some of an energy bill is the work and the rest is loss, and only the loss can be recovered.
        format: CHOICE
        question: Which part of the pumping bill is worth spending money on first?
        choices:
          - The fifth of the lifted water that never arrives
          - The electrical losses in the pump motor itself, which run at a few per cent
          - The energy spent lifting the water 46 metres
          - The friction in the rising main at present flow
        answer: The fifth of the lifted water that never arrives
        why: >
          A fifth of everything this pump lifts never reaches a tap, so a fifth of the energy is
          spent on water that goes into the ground — and no pump improvement recovers a penny of
          it. That is the largest recoverable item by a wide margin. The lift itself is not a loss
          at all: 46 metres of head is the work being paid for, and it cannot be improved by
          anybody. Motor losses on a modern induction motor are a few per cent, and pipe friction
          is worth attacking after the leak because slowing the flow to reduce it means running
          longer, which only helps once the water arriving is water being used.
        rebuttals:
          - Motor losses are a few per cent of the bill; the leak is twenty.
          - The 46-metre lift is the useful work, not a loss. No pump can do better than the head.
          - 'Friction is real and second in line: reducing it means running slower for longer, which is only worth it once the leak is fixed.'
      - group: COMMON
        task: Decide when to treat, and on what evidence
        title: A threshold, not a calendar
        place: Common Office
        concept: 'Integrated pest management against spraying on a calendar'
        takesAsRead:
          - 'Agricultural methods, irrigation and the salt they leave behind'
        scene: >
          Hollis has aphids in two of four polytunnels. The neighbouring holding sprays on the
          first of the month regardless. His tunnels need treating twice a season; theirs need
          it five times and rising.
        guide: >-
          Compare the two regimes by what they do to the pest population over years, not by what
          they cost this month. Ask which one selects for resistance, and how a threshold is set
          — because "treat when you see one" and "treat when it will cost you more than the
          spray does" are different rules with different outcomes.
        background:
          - >-
              How calendar spraying breeds the problem. Every application kills the susceptible
              individuals and leaves the resistant ones to breed, so the population's tolerance
              rises with each treatment. Five sprays a season rising is what that looks like from
              inside: the same chemical, doing less each year.
          - >-
              What a threshold is. The pest density at which the damage exceeds the cost of
              treating. Below it, spraying costs more than it saves and still selects for
              resistance. Above it, treating pays. Setting it requires counting, which is the part
              growers skip.
          - >-
              What else integrated management uses. Resistant varieties, timing of sowing,
              encouraging predators, and physical barriers — with the spray as the last resort
              rather than the schedule. Hollis's two treatments a season are the residue after the
              other four tools have done their work.
        assumes:
          - both holdings grow comparable crops under comparable cover
        takeaway: Treating on a calendar selects for resistance; treating on a threshold does not.
        format: CHOICE
        question: Why does the neighbouring holding need five sprays where Hollis needs two?
        choices:
          - Spraying regardless of numbers has bred resistance in their aphids
          - Their polytunnels run warmer than his, and aphids breed faster at higher temperatures
          - Hollis uses a stronger chemical at each application
          - Their crop is more susceptible to aphid damage
        answer: Spraying regardless of numbers has bred resistance in their aphids
        why: >
          Each application kills the susceptible aphids and leaves the resistant ones to breed, so
          a fixed schedule raises the population's tolerance season by season. Five treatments and
          rising is the signature: the same chemical achieving less each year. Hollis's two are
          what is left after resistant varieties, sowing dates, predators and barriers have done
          the rest, with the spray kept as a last resort against a counted threshold. Temperature
          and crop susceptibility would show as a difference from the first season rather than a
          worsening trend, and a stronger chemical would accelerate the same selection rather than
          avoid it.
        rebuttals:
          - A warmer tunnel would show as a higher pest load from the start, not a requirement that grows every year.
          - A stronger chemical selects for resistance faster; it is the mechanism, not an escape from it.
          - Crop susceptibility is a constant. It cannot explain a rising number of treatments.

  # ----- day 8. What leaks, and what it is measured in.
  - title: What leaks out of the hole
    objective: Follow the tip's leachate into the water it reaches and say what the numbers mean.
    briefing: The stream below the tip has nitrogen, and the school tap is sampled separately for a reason.
    stake: >-
      Thursday, and Grace Nkemdi, the island nurse, has asked for the school tap result to be read out at the council rather than filed. Okafor's leachate is passing its concentration limit and adding thirty-four kilograms of nitrogen a year to a store that turns over once a decade. Dunmore, the clerk, wants every figure in the pack to name what it is about. Today you convert between the units the licence, the laboratory and the clinic each use, and say which of them the school tap answers to. Two of these numbers are the same measurement in different clothes, and one of them is not.
    takeaway: Concentration, load and dose are three different questions about the same water.
    stops:
      - group: TIP
        task: Put the laboratory and the licence in the same units
        title: Milligrams, or parts per million
        place: Tip and Sorting Yard
        relationship: >-
          ppm ≈ mg / L: a litre of fresh water weighs about a kilogram, so a milligram in it is one part in a million.
        concept: 'Concentration against load, and why a small pipe can matter'
        scene: >
          The laboratory reports the stream below the tip at 8.4 milligrams a litre of nitrate.
          The licence is written in parts per million and the mainland guidance in micrograms
          a litre. All three describe the same water.
        guide: >-
          A litre of fresh water weighs about a kilogram, so a milligram dissolved in it is one
          part in a million by mass. That makes two of these three units the same number.
          Convert the laboratory's figure into the licence's units, and into the guidance's, and
          check which pair are actually identical.
        background:
          - >-
              Why the approximation holds here and not everywhere. Fresh water at ordinary
              temperatures is close enough to a kilogram a litre that the conversion is exact for
              any purpose a council paper has. In seawater, or in a brine, the density has moved
              and so has the conversion — which matters on an island where some samples are
              brackish.
          - >-
              Why three units exist for one quantity. The licence was drafted from a national
              template in parts per million, the laboratory reports in milligrams a litre because
              that is what its instruments produce, and health guidance uses micrograms because
              the numbers of interest are small. Nobody is being obscure; the units accumulated.
          - >-
              What the conversion cannot fix. None of the three is a load, and none is a dose. The
              same 8.4 milligrams a litre is a different mass per day depending on the flow and a
              different dose depending on who drinks it and how much. Getting the units right is
              the first step and not the answer.
        assumes:
          - the sample is fresh water rather than brackish
        takeaway: Milligrams a litre and parts per million are the same number in fresh water.
        format: BALLPARK
        question: Estimate the stream's nitrate in micrograms a litre.
        estimate:
          prompt: The laboratory reports 8.4 mg/L of nitrate. The health guidance is written in micrograms a litre.
          question: Estimate the stream's nitrate in micrograms a litre.
          labels:
            - 8.4 mg/L  (what the laboratory reported)
            - 1000  (micrograms in a milligram)
            - 1.0 kg/L  (density of fresh water)
            - 50 mg/L  (the licence limit)
          values: [8.4, 1000, 1.0, 50]
          slots: 2
          template: '{0} × {1}'
          formula: a*b
          correct: [0, 1]
          target: 8400
          tolerance: 200
          units: µg/L
          solution: 8.4 mg/L × 1000 = 8,400 µg/L, and 8.4 mg/L is also 8.4 ppm.
          explanation: 8,400 micrograms a litre, which is the same water as 8.4 ppm — two of the three units are identical.
        answerText: 8,400 micrograms a litre, and the same sample is 8.4 parts per million.
        why: >
          A milligram is a thousand micrograms, so the laboratory's 8.4 becomes 8,400 — the same
          water, reported in a unit chosen because health numbers are small. The parts-per-million
          figure is the one worth noticing: in fresh water a milligram a litre is a milligram in a
          kilogram, which is one part in a million, so 8.4 mg/L and 8.4 ppm are not merely
          comparable but identical. The density tile is what that rests on, and it stops being one
          in brackish water, which is half the samples on this island. What none of the three units
          gives is a load or a dose.
        rebuttals:
          - The licence limit is what the reading is compared against, not part of the conversion.
          - Dividing by the density leaves the figure unchanged in fresh water and hides the assumption the conversion rests on.
      - group: REEF
        task: Say what nutrients do once they reach the bay
        title: Nutrients in, oxygen out
        place: Reef Station
        concept: 'Eutrophication: nutrients in, oxygen out'
        takesAsRead:
          - 'Concentration against load, and why a small pipe can matter'
          - 'The carbon and nitrogen cycles, and where a farm interrupts them'
        scene: >
          Berhane has dissolved oxygen readings from the inner bay: 8.1 milligrams a litre in
          March, 4.2 in August, and 2.9 at dawn on the third of August. The nitrate arriving
          from the stream peaks in the same month.
        guide: >-
          Follow the nitrogen through four steps rather than two. It feeds something, that
          something dies, the dying is what uses the oxygen, and the oxygen is what everything
          else needed. Then look at why the worst reading is at dawn, because the timing is the
          evidence that the mechanism is the one you think it is.
        background:
          - >-
              Why dawn is the diagnostic hour. Algae photosynthesise in daylight and respire all
              the time, so oxygen peaks in late afternoon and bottoms out just before sunrise.
              A dawn minimum well below the afternoon reading is the signature of a large algal
              population rather than of a single discharge.
          - >-
              Why warm water makes it worse twice over. Warm water holds less dissolved oxygen to
              begin with, and it speeds up both algal growth and the decomposition that consumes
              the oxygen. August is the month the nutrients arrive, the water is warmest and the
              oxygen ceiling is lowest.
          - >-
              What suffers first. Not the algae and not the bacteria. Fish and the invertebrates on
              the reef leave or die, and the ones that cannot move are the ones counted on
              Berhane's transects — which is how a nutrient problem in a stream becomes a line on
              a reef survey two months later.
        assumes:
          - the oxygen readings were taken at the same depth in the inner bay
        takeaway: Nutrients feed algae, decomposition spends the oxygen, and what needed the oxygen leaves.
        format: SEQUENCE
        question: Put the four steps in the order they happen.
        cards:
          - Nitrate arriving from the stream feeds a bloom of algae in the inner bay
          - The bloom dies back and sinks
          - Bacteria decomposing it consume the dissolved oxygen
          - Invertebrates on the reef die or leave, and the transect count falls
        order: [0, 1, 2, 3]
        axis: what happens first
        ends: [first, last]
        answerText: >-
          Nutrients feed the bloom, the bloom dies and sinks, decomposition spends the oxygen, and
          what needed the oxygen goes.
        why: >
          The chain has a step in it that is easy to leave out: the algae themselves do not take
          the oxygen, the bacteria decomposing them do. That is why the damage arrives after the
          bloom rather than during it, and why the water can look clear on the day the oxygen is
          worst. The dawn reading of 2.9 is the confirmation — oxygen is lowest just before sunrise
          because nothing has been photosynthesising all night while everything has been
          respiring. And August stacks three things: the nutrients arrive, the water is warmest, and
          warm water holds less oxygen to start with.
      - group: HARB
        task: Say what a school tap result is a result about
        title: Eleven kilos
        place: Harbour Office
        concept: 'Reading an environmental claim: what a number is about, and over what period'
        takesAsRead:
          - 'Concentration against load, and why a small pipe can matter'
        scene: >
          Nkemdi wants the school tap read out at the council. The distribution main tested at
          8.4 milligrams a litre; the school tap, sampled after the weekend, tested at 11.2.
        guide: >-
          A sample is a claim about the water in one place at one time. Ask what makes the school
          tap different from the main — where it sits on the network, when the sample was taken,
          and who drinks from it. Two of those three change the number and the third changes what
          the number means.
        background:
          - >-
              Why the end of a main reads higher. Water sits longest there, and a weekend with the
              school closed means it sat for two days. Anything that accumulates has had longer to
              accumulate, so a Monday sample at the far end is systematically the worst reading on
              the network, and it is a real reading rather than an artefact.
          - >-
              Why Nkemdi asked for it separately. Concentration is the same water for everybody and
              dose is not. The youngest child at that tap weighs eleven kilograms and drinks about
              a litre a day; the same concentration is roughly six times the dose per kilogram that
              it is for an adult drinking two litres.
          - >-
              What the council can be told. That the school tap is the highest reading on the
              network, that the Monday timing partly explains it, and that the dose it implies for
              the smallest children is what the guidance is written for. All three are defensible;
              any one of them alone is misleading.
        assumes:
          - both samples were taken by the same method in the same week
        takeaway: A concentration is the same for everybody, and a dose is not.
        format: CHOICE
        question: What is the school tap result a result about?
        choices:
          - The highest exposure on the network, where the smallest bodies drink
          - The quality of the drinking water supplied to the island as a whole
          - Contamination entering the school building itself
          - A sampling error caused by the weekend closure
        answer: The highest exposure on the network, where the smallest bodies drink
        why: >
          Two things are true at once and the honest sentence contains both. The school tap is at
          the end of the main and was sampled after a weekend of standing water, which is why it
          reads highest — that is real rather than an error. And it is the tap where an
          eleven-kilogram child drinks, so the same concentration is about six times the dose per
          kilogram it is for an adult. Quoting it as the island's water quality takes the worst
          point on the network as the average. Calling it contamination in the building asserts a
          source nothing has looked for. Calling it a sampling error dismisses the highest genuine
          exposure the network has.
        rebuttals:
          - It is the worst point on the network, not the network's average; quoted as the island's water it overstates the whole.
          - Nothing here points at a source inside the school. The reading is explained by where the tap sits and when it was sampled.
          - Standing water over a weekend is a real condition the children then drink, not an artefact to be discarded.

  # ----- day 9. The land, and what is put on it.
  - title: What is put on the ground
    objective: Weigh the inputs on the common and the garden against what they do downstream.
    briefing: Hollis wants more compost released and the neighbouring holding wants the spray limit raised.
    stake: >-
      Friday, and two requests arrived together. Ewan Hollis wants the whole compostable stream released to him, which takes forty tonnes a year out of Okafor's hole. The neighbouring holding wants its spray allowance raised, which puts more of the same chemical on ground that drains past the borehole. Nkemdi has the dose arithmetic for the school tap and wants it in the pack. Today you decide what goes on the ground and what a dose actually is. The same milligram is a different quantity depending on whose body it ends up in.
    takeaway: Dose is exposure divided by the body taking it, which is why children are the limit.
    stops:
      - group: WATER
        task: Work out the dose the smallest child receives
        title: The same water, a different dose
        place: Waterworks
        relationship: >-
          dose = C × intake ÷ mass: the same concentration is a different dose for a different body.
        concept: 'Dose makes the poison: exposure, body mass and a dose-response curve'
        scene: >
          The school tap reads 11.2 milligrams a litre. Nkemdi's youngest pupil weighs 11
          kilograms and drinks about a litre a day; an adult on the same tap drinks two and
          weighs seventy.
        guide: >-
          A dose is not a concentration. Multiply the concentration by how much is drunk to get
          the amount taken in, then divide by the mass of the body taking it. Do it for the child
          and set it against the same arithmetic for an adult, because the ratio is the whole
          reason guidance is written the way it is.
        background:
          - >-
              Why the guidance is per kilogram. A tolerable intake is a property of a body's ability
              to process something, which scales roughly with its mass. A figure quoted per person
              is a figure written for an average adult, and the smallest person drinking the water
              is the one it fails.
          - >-
              Why intake matters as much as mass. Children drink more per kilogram than adults do —
              a litre in eleven kilos against two in seventy — so the two factors compound rather
              than cancel. That is why the ratio between the two doses is far larger than the ratio
              of the body masses.
          - >-
              What a dose-response curve adds. Whether the dose matters depends on where it sits on
              a curve that is usually not a straight line: below a threshold, little or nothing; past
              it, rising harm. The dose is the input to that judgement rather than the judgement.
        assumes:
          - the consumption figures are typical daily intakes
        takeaway: A dose is intake times concentration, divided by the body taking it.
        format: BALLPARK
        question: Estimate the daily dose for the eleven-kilogram child.
        estimate:
          prompt: The school tap is 11.2 mg/L. The youngest pupil drinks about 1 litre a day and weighs 11 kg.
          question: Estimate the daily dose for the eleven-kilogram child.
          labels:
            - 11.2 mg/L  (the school tap)
            - 1 L  (litres drunk a day)
            - 11 kg  (the child's mass)
            - 70 kg  (an adult's mass)
          values: [11.2, 1, 11, 70]
          slots: 3
          template: '{0} × {1} ÷ {2}'
          formula: a*b/c
          correct: [0, 1, 2]
          target: 1.02
          tolerance: 0.12
          units: mg per kg a day
          solution: dose = 11.2 × 1 ÷ 11 = 1.02 mg per kg a day.
          explanation: About 1.0 mg/kg/day, against 0.32 for an adult on the same tap — a factor of three from the same water.
        answerText: About 1.0 milligram per kilogram a day, against 0.32 for an adult drinking from the same tap.
        why: >
          Eleven point two milligrams in a litre, one litre drunk, divided by eleven kilograms, is
          about one milligram per kilogram a day. The adult on the same tap takes 22.4 milligrams
          into seventy kilograms, which is 0.32 — so the identical water is three times the dose
          for the child. The two factors compound instead of cancelling, because children drink
          more per kilogram as well as weighing less. That is why guidance is written per kilogram
          and why a figure quoted per person is written for an adult. Using the adult mass with the
          child's intake mixes two people and produces a dose nobody receives.
        rebuttals:
          - Using the adult mass with the child's intake describes nobody who drinks at that tap.
          - The concentration alone is the same for everybody, which is exactly why it is not the quantity that decides.
      - group: COMMON
        task: Decide what a released compost stream is worth
        title: Forty tonnes, twice
        place: Common Office
        concept: 'Agricultural methods, irrigation and the salt they leave behind'
        takesAsRead:
          - 'Soil: horizons, texture and what a thin soil cannot do'
        scene: >
          Hollis wants the whole compostable stream: about forty tonnes a year, currently going
          into the hole. He has two acres of built soil and four polytunnels, and no fertiliser
          budget to speak of.
        guide: >-
          Count what the transfer does at both ends. Forty tonnes is volume out of a tip with
          eleven years left, and it is organic matter into the only deep soil on the island. Then
          find the cost, because there is one — the same material carries salt and whatever was
          sprayed on it, and it arrives on ground that drains toward the borehole.
        background:
          - >-
              What compost does to a thin soil. It raises organic matter, which raises how much
              water the soil holds and how much nutrient it can retain against leaching. On a sandy
              loam over rock that is the only lever available: nothing else deepens what is there.
          - >-
              Why the salt is worth checking. Island compostables include seaweed and kitchen waste
              from a place where everything is salted, and repeated application of a salty amendment
              to free-draining ground raises soil salinity until germination suffers. The soil is not
              flushed by irrigation here — it is flushed by rain, in winter, if at all.
          - >-
              What the tip gains and does not. Forty tonnes out of the arrivals slows the hole's
              filling and reduces the methane the cell generates, because compostables are what
              generate it. It does not reduce the tonnage the island produces, which is the number
              Okafor is actually judged on.
        assumes:
          - the compostable stream is roughly forty tonnes a year as weighed
        takeaway: Compost is the only lever on a thin soil, and it carries whatever was in the material.
        format: TRIGGER
        question: At what compost conductivity do you stop the release, given the ground takes six weeks to flush?
        trigger:
          hint: >-
            Set the line on the conductivity scale and release the board. The batches are tested
            afterwards and your own rule decides what goes on the ground.
          scale:
            label: Compost electrical conductivity
            unit: mS/cm
            min: 0
            max: 12
            step: 0.1
            anchors:
              - { at: 1.4, means: 'ordinary garden compost — nothing to think about' }
              - { at: 4.0, means: 'germination of the tunnel crops starts to suffer at this and above' }
          objective: >-
            The release is stopped while there are still six weeks of winter rain to flush what has
            already gone on.
          rehearsal:
            note: last winter's batches, worked at the same scale
            stream:
              - { value: 1.6, hoursLeft: 1680 }
              - { value: 2.4, hoursLeft: 1344 }
              - { value: 3.1, hoursLeft: 1008 }
              - { value: 2.2, hoursLeft: 672 }
          conditions:
            - { id: stop, label: Stop the release and hold the batch, leadHours: 1008, owner: the market garden, action: 'divert the batch back to the cell', window: { min: 2.6, max: 3.6 } }
          stream:
            - { at: week 1, value: 1.5, hoursLeft: 1680, update: 'first batch — kitchen waste and cut grass' }
            - { at: week 4, value: 2.9, hoursLeft: 1344, update: 'seaweed added to the windrow after the spring tides' }
            - { at: week 8, value: 4.6, hoursLeft: 1008, update: 'more seaweed, and the windrow has not been turned' }
            - { at: week 13, value: 6.8, hoursLeft: 336, update: 'salt visible on the surface of the heap' }
          release: Release the board
          commit: Stand by the board
        answerText: >-
          Stop at about 3 millisiemens a centimetre. The week-8 batch crosses it with six weeks of
          winter rain still to come; a line up near where germination fails is not crossed until
          week 13, when there are two.
        why: >
          The transfer is good at both ends — volume out of a hole with eleven years left and organic
          matter into the only deep soil on the island — so the rule has to catch the one thing that
          makes it go wrong. Island compostables carry seaweed and heavily salted kitchen waste, and
          on free-draining ground over rock there is nothing to flush salt through but winter rain.
          Two ways of getting the line wrong cost the same. Set it near 4, where germination
          measurably suffers, and it is not crossed until the week-13 batch with two weeks of rain
          left — a correct rule for an action that needed six. Set it near 1.5 and it fires on
          ordinary compost, and a rule that fires on normal is a rule nobody keeps.
      - group: TIP
        task: Decide how much of the stream to divert, against what it costs
        title: What the hole gets back
        place: Tip and Sorting Yard
        concept: 'An ecological footprint, and what a visitor adds to one'
        takesAsRead:
          - 'Carrying capacity, and what happens on the way past it'
        scene: >
          Okafor has 204 tonnes arriving, eleven years of volume, and four things she could do
          with a fixed budget of eleven thousand pounds this year. Every option removes volume
          at a different price.
        guide: >-
          Everything here removes volume from the hole and the budget cannot buy all of it. Work
          out what each pound buys in cubic metres, spend the budget, and watch what happens to
          the year the cell closes. Two of these options also change what the tip emits, which is
          worth knowing before choosing between two that look equally good on volume.
        background:
          - >-
              Why volume rather than tonnage is the currency. The constraint is a hole. Compaction
              buys volume without removing any mass at all, which makes it look like cheating and
              is the cheapest cubic metre available until the compactor is running full.
          - >-
              What diverting compostables does twice. It removes the wettest, heaviest stream from
              the hole and removes the material that generates most of the methane, because
              methane comes from organic matter decomposing without oxygen. One action, two
              benefits, and only one of them shows up in a volume calculation.
          - >-
              Why shipping is priced per tonne and bought per cubic metre. The ferry charges weight
              and the island needs volume, so the streams worth shipping are the light bulky ones.
              Spending the whole budget on freight buys fewer cubic metres than spending part of it
              on a compactor service.
        assumes:
          - the budget is for this year only and does not roll over
        takeaway: The constraint is volume, and the cheapest cubic metre is not always the obvious one.
        format: ALLOCATE
        question: Eleven thousand pounds. Build the year's plan, and know what it stops the tip being able to do.
        allocate:
          hint: >-
            Nothing on this list is the wrong thing to buy. What the plan cannot afford is the price
            of what it can, and two of these also change what the cell emits.
          pool:
            amount: 11000
            unit: '£'
            mode: scalar
          items:
            - id: cover
              label: Inert cover material for the working face
              cost: 1200
              protected: true
              note: an uncovered face is not an option
            - id: compost
              label: Divert the compostable stream to the market garden
              cost: 1800
              note: 620 cubic metres, and most of the methane source with it
            - id: compact
              label: Six months of compactor hire for plastics and card
              cost: 3400
              note: 740 cubic metres recovered by compaction alone
            - id: ship
              label: Ship 24 tonnes of plastic packaging off on the ferry
              cost: 4900
              note: 410 cubic metres removed
            - id: metal
              label: Consolidate and ship the scrap metal
              cost: 900
              note: 90 cubic metres, and the scrap sells for £1,400
            - id: glass
              label: Ship 30 tonnes of glass
              cost: 5600
              note: 60 cubic metres — glass crushes to almost nothing
            - id: gas
              label: A flare stack on the cell's gas vent
              cost: 2600
              note: burns the methane to carbon dioxide, worth 28 times less
          answers:
            - question: Is the volume the cover material occupies bought back somewhere?
              requires:
                - compact
              required: true
            - question: Is the methane source removed rather than burnt?
              requires:
                - compost
            - question: Does any of the year's spend pay something back?
              requires:
                - metal
            - question: Is bulky plastic taken off the island altogether?
              requires:
                - ship
            - question: Is the gas that does escape burnt down to something weaker?
              requires:
                - gas
          commit: Commit the year's spend
        answerText: >-
          Cover, then compaction, then the compostables, then the scrap: about 1,450 cubic metres
          and the methane source gone, for £7,300, with £1,400 of it coming back. The glass and the
          plastic freight are what the year cannot buy.
        why: >
          Volume per pound is the ranking, and it does not follow weight or virtue. Diverting
          compostables is the cheapest large block and takes most of the methane source with it,
          which no volume figure shows. Compaction is next: it removes no mass at all and recovers
          more cubic metres than shipping plastic for a third less money. Scrap is nearly free and
          pays part of itself back. Glass is last by a wide margin — thirty tonnes of freight for
          sixty cubic metres, because glass crushes to almost nothing and should stay. Spending the
          whole budget on freight is the intuitive answer and buys roughly a third of the volume.

  # ----- day 10. The sea the island sits in.
  - title: A warmer, sourer sea
    objective: Read eleven springs of reef data for what it can and cannot say.
    briefing: Berhane's spring count is in and the cover is down again.
    stake: >-
      Monday, and Berhane has this spring's transects on the table beside the other ten. Cover is down a further four per cent and the August sea temperature was the highest in the series. Calloway's position today is that the reef's decline is global and nothing the island does about ferries changes it, which is partly true and is being used to end an argument. Dunmore wants the pack to state exactly what eleven springs support. Today you read the record for its trend, separate what the island controls from what it does not, and say what the reef is running out of. A record this good is easy to overstate, and overstating it is how it gets dismissed.
    takeaway: A long local record can show a trend clearly and still not settle a cause.
    stops:
      - group: REEF
        task: Say what the temperature record does to the animals
        title: Two degrees, in August
        place: Reef Station
        concept: 'A warming, acidifying sea, and what a reef does about it'
        takesAsRead:
          - 'Greenhouse gases, and comparing them on one scale'
          - 'Ecological tolerance, and the range a population can actually live in'
        scene: >
          August sea temperature in the bay has risen by nearly two degrees across the eleven
          springs of record. Cover on the transects has fallen from 41 per cent to 26. The station
          has a flow tank that will hold a reef fragment at a set temperature for six weeks.
        guide: >-
          A species lives inside a range rather than at a point, and the interesting part of a
          range is its edge. The tank holds a fragment at whatever August temperature you set and
          reports the cover it still has after six weeks. Move the control across the range and
          watch where the readout stops sloping and starts falling away. Nothing marks it. Two
          degrees is small on a thermometer and not small at an edge.
        background:
          - >-
              What a tolerance range is. Every population has conditions in which it thrives, wider
              conditions in which it survives with reduced growth and reproduction, and limits
              beyond which it dies. Moving the average two degrees moves the whole distribution,
              so what was the rare bad week becomes the normal August.
          - >-
              Why the two stresses compound. Warmer water expels the symbiotic algae corals depend
              on for most of their energy, and a more acidic sea makes the skeleton more expensive
              to build. An animal short of energy and facing a higher construction cost is not
              facing two problems; it is facing one, twice.
          - >-
              What the island controls and what it does not. Sea temperature and acidity are set
              far away. Nutrient load from the stream, sediment from the works, anchor damage in
              the bay and fishing pressure on the grazers that keep algae off the coral are all
              local, and all of them decide how much stress the reef meets on top of the global
              part.
        assumes:
          - the eleven transects have been read by the same method each spring
        takeaway: A warmed animal at the edge of its range meets every other stress with nothing spare.
        format: SWEEP
        question: At what August temperature does the fragment stop holding its cover?
        sweep:
          axis: { label: August sea temperature, unit: °C, min: 15.0, max: 20.5, step: 0.1 }
          readout: { label: Cover held after six weeks, unit: '%' }
          baseline: 41
          response:
            - { at: 15.2, value: 41 }
            - { at: 16.0, value: 41 }
            - { at: 16.6, value: 40 }
            - { at: 17.1, value: 39 }
            - { at: 17.5, value: 37 }
            - { at: 17.8, value: 33 }
            - { at: 18.0, value: 26 }
            - { at: 18.3, value: 17 }
            - { at: 18.8, value: 9 }
            - { at: 19.6, value: 4 }
            - { at: 20.4, value: 3 }
          target: 18.0
          tolerance: 0.3
          start: 15.2
          commit: Mark where the cover goes
        answerText: >-
          Around 18 degrees — where the curve stops sloping and falls away. Cover holds to about
          17.5 and is a third of the record by 18.3, and 18.0 is this August's measured temperature.
        why: >
          A tolerance range is not a switch and it is not a straight line either. Between 15 and
          17.5 degrees the fragment holds nearly all its cover, and the curve then falls away
          steeply — so the animal is not gradually worse across its range, it is fine until it is
          not. The two-degree rise the bay has actually seen lands exactly on that shoulder, which
          is why cover has gone from 41 per cent to 26 rather than from 41 to 38. It also settles
          what the island can do. At the shoulder there is nothing spare for a nutrient pulse, a
          sediment plume, an anchor scar or a summer with no grazers, and every one of those is
          decided on Vellan even though the temperature is not.
      - group: POWER
        task: Decide which claim the record actually supports
        title: What eleven springs can say
        place: Turbine Yard
        concept: 'Reading an environmental claim: what a number is about, and over what period'
        takesAsRead:
          - 'Concentration against load, and why a small pipe can matter'
        scene: >
          The pack has three draft sentences about the reef in front of it. Ferris wants the one
          that will survive being read out by somebody who disagrees with it; Dunmore wants the
          one that is true.
        guide: >-
          Take each draft sentence and ask what evidence it would take to support it, then check
          whether eleven springs of cover and temperature on one bay is that evidence. A trend, a
          correlation and a cause need three different amounts of data, and only one of the three
          is in the room.
        background:
          - >-
              What a trend needs. Repeated measurement by a consistent method over a period long
              relative to the variation. Eleven springs on eleven fixed transects is exactly that,
              and it is why this record is the strongest thing on the island.
          - >-
              What attribution needs beyond a trend. Either an experiment, which is impossible
              here, or enough independent lines of evidence to rule out the alternatives — other
              reefs as controls, a bleaching record tied to specific warm weeks, a nutrient series,
              a sediment series. Some of that exists elsewhere; almost none of it exists for Vellan.
          - >-
              Why understating is also a failure. "Cover has changed" is defensible and useless.
              The pack has to carry the strongest claim the evidence supports, because a paper that
              says less than it knows invites a decision the evidence would not have allowed.
        assumes:
          - the transect method has not changed across the eleven springs
        takeaway: A trend, a correlation and a cause need three different amounts of evidence.
        format: PROTOCOL
        task: Match each draft sentence to what it would take to support it.
        columns:
          - The draft sentence
          - What supporting it requires
        scenarios:
          - Cover on the eleven transects has fallen from 41 to 26 per cent since the record began
          - The fall in cover has occurred alongside a 1.9 degree rise in August temperature
          - Warming has caused the loss of cover in the bay
          - Local nutrient loading is the main driver of the decline
        choices:
          - 'Consistent method and a long enough series: this record already supports it'
          - Both series measured over the same period, which this record has
          - Control sites, bleaching events tied to warm weeks, and the alternatives ruled out
          - A nutrient series for the bay, which nobody has collected
        mapping: [0, 1, 2, 3]
        rebuttals:
          - A fall measured the same way over eleven springs is a trend, and the record supports it.
          - Two series over one period is a correlation, which is a weaker and still useful claim.
          - Attributing to warming needs controls and event-level evidence that Vellan does not have.
          - The nutrient claim needs a nutrient record, and there is none for the bay.
        answerText: >-
          The fall is supported, the correlation is supported, causation by warming is not, and the
          nutrient claim has no series behind it at all.
        why: >
          The record is strong and it is strong about one thing: a fall in cover, measured the same
          way, over long enough to be a trend. Putting the temperature series beside it gives a
          correlation, which is a real and weaker claim. Attribution is a different order of
          evidence — control sites, bleaching tied to specific warm weeks, the alternatives
          eliminated — and none of that exists here. The nutrient sentence is the one to strike
          outright, because nobody has collected a nutrient series for the bay. The pack should
          carry the two claims the data supports, stated at full strength, because a paper that
          says less than it knows invites a decision the evidence would have prevented.
      - group: HARB
        task: Work out what a bad August costs the west boats
        title: What the grazers were doing
        place: Harbour Office
        concept: 'Food webs and trophic levels: who eats whom, and how much of it'
        takesAsRead:
          - 'An ecosystem as a budget: what comes in, what leaves, what stays'
        scene: >
          The reef's algal cover has risen as coral cover has fallen. Rask's landings show the
          grazing species — taken as a low-value bycatch — down by a third over the same period.
        guide: >-
          Follow what eats what. Something is keeping algae off the coral, and if the landings of
          that something have fallen a third, the question is whether the algae rose because the
          coral weakened or because its grazers went. Both mechanisms are consistent with the same
          two graphs, and they call for different actions.
        background:
          - >-
              What grazers do on a reef. They crop algae that would otherwise overgrow coral and
              stop new coral settling. Remove them and algae wins the space even where conditions
              would let coral recover, which turns a temporary stress into a permanent change of
              state.
          - >-
              Why a low-value bycatch is the dangerous one. Nobody manages a species nobody sells.
              The grazers here are taken incidentally, not counted carefully and not in the quota,
              so a third of them can go without any part of the system noticing.
          - >-
              Why this is the island's lever. Sea temperature is set elsewhere. Whether the reef
              keeps its grazers is decided at this berth, by what the quota counts, and it is the
              one part of the reef's problem that a council on Vellan can vote on.
        assumes:
          - the grazing species landings are recorded even as bycatch
        takeaway: Removing the grazers turns a temporary stress into a permanent change of state.
        format: CHOICE
        question: What does the fall in grazer landings imply about the reef's recovery?
        choices:
          - Algae holds the space even in years coral could return
          - The reef recovers of its own accord as soon as sea temperatures fall back
          - The grazers are a symptom of the decline rather than a cause of it
          - The bycatch is too small a fraction of the landings to matter
        answer: Algae holds the space even in years coral could return
        why: >
          Grazers crop the algae that would otherwise overgrow coral and block new coral from
          settling. Take a third of them out and algae keeps the space in the good years too, so a
          temperature stress that would have been temporary becomes a permanent change of state.
          That is why this stop is on the harbour's list rather than the reef's: the temperature is
          set far away and the grazers are decided at this berth, by what the quota counts. A
          low-value bycatch is exactly the case nobody manages, which is what makes a third of them
          disappearing possible without anybody objecting.
        rebuttals:
          - Recovery needs bare space for new coral to settle on, and algae holding that space prevents it whatever the temperature does.
          - The grazers have been fished, which is a cause. Their decline tracks landings rather than reef condition.
          - The fraction of the landings is small; the fraction of the grazing population is a third, which is what matters.

  # ----- day 11. The diesel house, and what comes out of it.
  - title: What the diesel actually buys
    objective: Account for the fuel: what becomes electricity, what becomes heat, and what leaves the stack.
    briefing: The year's fuel figure has to go in the pack next to the turbine proposal.
    stake: >-
      Tuesday, and Ferris has the fuel delivery notes for the year: 78,000 litres into three sets that produced most of the island's electricity while the cable was out and some of it when it was not. Calloway needs the number for the ferry paper. Berhane wants the emissions from it stated in the same place, not in an annex. Dunmore will not accept a figure without its period. Today you work out how much of the fuel became electricity and what the rest became. Most of a litre of diesel does not become electricity, and where the rest goes decides whether the turbine is worth the gearbox.
    takeaway: Efficiency says what fraction of the fuel did the job, and the rest left as heat.
    stops:
      - group: POWER
        task: Work out what fraction of the fuel became electricity
        title: A third, at best
        place: Turbine Yard
        relationship: >-
          efficiency = useful ÷ input × 100: the fraction of the energy put in that did the job wanted.
        concept: 'Efficiency, and where the rest of the fuel goes'
        scene: >
          Seventy-eight thousand litres of diesel went into the sets this year. Each litre holds
          about 10.7 kilowatt-hours of energy, and the sets generated 271,000 kilowatt-hours of
          electricity between them.
        guide: >-
          Work out the energy that went in, then compare it with the electricity that came out.
          The ratio is the efficiency. Then account for the missing part: it has not disappeared,
          and on this island there is a use for some of it that nobody has taken up.
        background:
          - >-
              Why a third is normal. A diesel generator turns about a third of the fuel's chemical
              energy into electricity at full load, less at part load, and the rest leaves as
              exhaust heat and jacket cooling. This is not a fault in the machine — it is what a
              heat engine does, and the ceiling is set by thermodynamics rather than maintenance.
          - >-
              Why part load makes it worse. A set running at a quarter of its rating burns a
              disproportionate amount of fuel for what it delivers, and Vellan's demand varies by a
              factor of three across a day. Running one set hard is better than three sets lightly,
              which is a scheduling decision rather than a capital one.
          - >-
              What the heat could do. Two thirds of 835,000 kilowatt-hours is a very large amount of
              low-grade heat leaving the diesel house through a radiator forty metres from a school
              that burns oil for its heating. Nobody has piped it, and no efficiency figure for the
              generator will ever show that as a loss.
        assumes:
          - the fuel's energy content is about 10.7 kilowatt-hours a litre
        takeaway: A third of a fuel becomes electricity and the rest leaves as heat, which is a resource or a loss.
        format: BALANCE
        question: Read what you need and report the energy that left the sets as heat.
        balance:
          hint: >-
            Reading a meter or a delivery note is free. Counting a stream is the claim you are
            making about where the fuel's energy went.
          total: { amount: 522, unit: MWh, label: Energy leaving the sets as heat }
          streams:
            - { id: fuel, label: Fuel energy in, value: 835, display: '78,000 L × 10.7 kWh/L = 835 MWh' }
            - { id: elec, label: Electricity generated, value: -271, display: '271 MWh, off the incoming board meter' }
            - { id: aux, label: Auxiliaries on the sets themselves, value: -42, display: '42 MWh — pumps, fans and heaters, drawn before the board meter', hidden: true, note: 'never billed, because it never reaches the board' }
            - { id: jacket, label: Jacket cooling to the radiator, value: 0, display: 'not metered — part of the heat, not a separate stream' }
          tolerance: 20
          commit: Report the heat
        answerText: >-
          About 522 megawatt-hours left as heat: the 835 that went in, less the 271 that reached
          the board and the 42 the sets used on themselves.
        why: >
          Seventy-eight thousand litres at 10.7 kilowatt-hours each is 835 megawatt-hours in, and
          271 reached the board: a third, which is what a diesel generator does when it is working
          properly. The term that does not announce itself is the auxiliaries — pumps, fans and
          jacket heaters drawn by the sets before the board meter, so they are never billed and
          never appear. Forty-two megawatt-hours of work the plant does for itself. What is left,
          522 megawatt-hours, is low-grade heat leaving through a radiator forty metres from a
          school heated with oil, and no efficiency figure for the generator will ever record that
          as a loss. The jacket cooling is part of that heat rather than a separate stream, and
          counting it again double-counts the largest number here.
      - group: TIP
        task: Put the tip's gas and the diesel's gas on one scale
        title: Twenty-eight to one
        place: Tip and Sorting Yard
        concept: 'Greenhouse gases, and comparing them on one scale'
        takesAsRead:
          - 'The carbon and nitrogen cycles, and where a farm interrupts them'
        scene: >
          The cell vents methane from decomposing organic matter. Okafor's estimate is 14 tonnes
          a year. The diesel house emits about 205 tonnes of carbon dioxide. The pack lists only
          the second.
        guide: >-
          Two gases cannot be added until they are in the same unit. Each has a global warming
          potential — how much heat a kilogram of it traps compared with a kilogram of carbon
          dioxide, over a stated period. Convert the methane and then compare, and note which
          period the conversion factor belongs to, because the answer changes with it.
        background:
          - >-
              Why methane's factor is so large and so slippery. It traps far more heat per kilogram
              than carbon dioxide and it breaks down in about a decade, so its potential depends
              entirely on the period chosen: roughly 28 over a hundred years, and around 80 over
              twenty. Both numbers are correct and they describe different questions.
          - >-
              Why a landfill emits it at all. Organic matter decomposing without oxygen produces
              methane rather than carbon dioxide. That is why diverting the compostable stream is
              an emissions action as much as a volume action, and why a flare — which burns methane
              to carbon dioxide — is worth so much despite producing a greenhouse gas itself.
          - >-
              Why the pack lists only the diesel. Fuel arrives on an invoice and gas leaves through
              a vent nobody meters. What is easy to count gets counted, and an island reporting only
              its fuel emissions has left out something comparable in size.
        assumes:
          - the methane estimate is for a year of the cell's current arrivals
        takeaway: Two gases compare only once both are multiplied to a common unit, over a stated period.
        format: BALLPARK
        question: Estimate the tip's methane emissions as carbon dioxide equivalent.
        estimate:
          relationship: CO₂e = mass × GWP, with mass the gas released and GWP how much heat a kilogram of it traps against a kilogram of carbon dioxide, over a stated period.
          prompt: The cell vents about 14 tonnes of methane a year. The pack uses the hundred-year global warming potential.
          question: Estimate the tip's methane emissions as carbon dioxide equivalent.
          labels:
            - 14 t  (methane vented a year)
            - 28  (GWP over 100 years)
            - 80  (GWP over 20 years)
            - 205 t  (the diesel house, as CO₂)
          values: [14, 28, 80, 205]
          slots: 2
          template: '{0} × {1}'
          formula: a*b
          correct: [0, 1]
          target: 392
          tolerance: 30
          units: t CO₂e a year
          solution: 14 t × 28 = 392 tonnes of carbon dioxide equivalent a year.
          explanation: Nearly twice the diesel house — from a vent nobody meters, left out of the pack entirely.
        answerText: About 392 tonnes of carbon dioxide equivalent — nearly twice the diesel house.
        why: >
          The diesel is counted from the delivery note rather than the chimney: 78,000 litres at
          2.63 kilograms a litre is 205 tonnes. Fourteen tonnes of methane at a hundred-year
          potential of 28 is 392 tonnes of carbon dioxide equivalent. The island's largest single greenhouse
          source is a vent on a hole, and it is not in the pack because fuel arrives on an invoice
          and gas does not. The period is doing real work in that sentence: at the twenty-year
          potential of 80 the same 14 tonnes is 1,120, which is five times the diesel house. Both
          figures are correct and they answer different questions, which is why the pack has to say
          which one it used. Adding the raw tonnages gives 219 and compares kilograms of two gases
          as though they were the same substance.
        rebuttals:
          - The twenty-year potential is also correct and gives 1,120 tonnes; the pack has to state which period it used.
          - Adding 14 tonnes to 205 treats a kilogram of methane as equivalent to a kilogram of carbon dioxide.
      - group: COMMON
        task: Say where the island's nitrogen is coming from
        title: Fixed, spread, and lost
        place: Common Office
        concept: 'The carbon and nitrogen cycles, and where a farm interrupts them'
        takesAsRead:
          - 'An ecosystem as a budget: what comes in, what leaves, what stays'
        scene: >
          Pike has three nitrogen inputs to the common: clover in the sward, imported
          fertiliser, and dung from 512 sheep. Hollis adds compost. The stream below carries
          nitrate.
        guide: >-
          Sort the inputs by where the nitrogen came from before it arrived here. Some was taken
          out of the air on the island itself, some was manufactured elsewhere and shipped in,
          and some is nitrogen already on the island being moved around. Only one of the three
          adds to the island's total, and that is the one the stream reflects.
        background:
          - >-
              What fixation is. Bacteria in the nodules of clover and other legumes convert nitrogen
              gas from the air into a form plants can use. It is a genuine input to the island and
              it arrives slowly, in place, and in proportion to how much clover is in the sward.
          - >-
              Why dung is not an input. The sheep ate the grass here. Their dung returns nitrogen
              that was already on the common to the common, moved from where it was eaten to where
              the animal stood. It matters enormously for distribution and not at all for the total.
          - >-
              Why imported fertiliser is the one the stream sees. It is nitrogen manufactured
              elsewhere, landed at the berth and spread in a few weeks. Applied faster than the
              sward can take it up, the surplus leaches — and free-draining ground over rock leaches
              readily, which is the connection between a bag on the pier and a nitrate reading in
              the bay.
        assumes:
          - the sheep graze the common rather than being fed imported feed
        takeaway: Only what arrives from outside adds to the island's total; the rest is redistribution.
        format: PROTOCOL
        task: Match each input to what it does to the island's nitrogen budget.
        columns:
          - The input
          - What it does to the total
        scenarios:
          - Clover in the sward
          - Imported bagged fertiliser
          - Dung from 512 sheep grazing the common
          - Compost made from the island's own kitchen waste
        choices:
          - A real input, taken from the air on the island, arriving slowly
          - A real input, manufactured elsewhere and applied in weeks — what the stream reflects
          - 'No change to the total — nitrogen already here, moved to where the animal stood'
          - 'No change to the total — island nitrogen returned to island ground in a slower form'
        mapping: [0, 1, 2, 3]
        rebuttals:
          - Clover fixes nitrogen out of the air, which is genuinely new to the island.
          - Bagged fertiliser is the only input landed at the berth, and the only one applied faster than the sward takes it up.
          - Sheep eat grass grown here; their dung moves nitrogen about rather than adding any.
          - Compost recycles what the island already had, in a form that releases more slowly.
        answerText: >-
          Clover and imported fertiliser are real inputs; dung and compost move nitrogen that was
          already here.
        why: >
          Two of these four add nitrogen to the island and two redistribute what is already on it.
          Clover fixes it out of the air, slowly and in place. Bagged fertiliser is manufactured
          elsewhere, landed at the berth and spread over a few weeks, which is why it is the input
          the stream reflects: applied faster than the sward can take up, the surplus leaches
          through free-draining ground over rock. Dung and compost feel like additions and are not —
          the sheep ate grass grown here and the kitchen waste was island food. Getting that
          distinction right is what stops the response being aimed at the sheep.

  # ----- day 12. The hill, the gearbox and what pays for what.
  - title: The gearbox and the nine years
    objective: Cost the turbine honestly, on Vellan's wind rather than a brochure's.
    briefing: The gearbox quote is in and the ferry paper assumes the turbine is running.
    stake: >-
      Wednesday, and the gearbox quote arrived on the Tuesday boat: £41,000, eleven weeks. Calloway's ferry paper already assumes the turbine is turning, because a diesel island is a hard thing to argue visitors into. Ferris will not sign the assumption without Vellan's own capacity factor, and he is right to ask. Berhane wants the emissions saving stated. Today you work out what the machine actually produces here, what the gearbox pays back and how long it takes. A nameplate rating is a number for a brochure, and nine years is a long time to be wrong about.
    takeaway: A generator is named for its best hour and paid for its average one.
    stops:
      - group: POWER
        task: Work out what the machine gives on average
        title: Rated, and actual
        place: Turbine Yard
        relationship: >-
          capacity factor = actual ÷ rated: what a generator produced, over what it would have made running flat out.
        concept: 'Capacity factor and intermittency: what a turbine gives on average'
        scene: >
          The turbine is rated at 250 kilowatts. In its last full year before the gearbox failed
          it generated 613,000 kilowatt-hours. The brochure quotes an annual output of 900,000.
        guide: >-
          Work out what the machine would have made if it had run at its rating every hour of the
          year, then compare what it actually made with that. The ratio is the capacity factor and
          it is the only number that plans anything, because it already contains the hours the wind
          was too light, too strong or gone.
        background:
          - >-
              Why a rating is not a forecast. The rating is the output at the wind speed the machine
              is designed for, which on Vellan happens perhaps a fifth of the time. The rest of the
              year it produces less, and above a cut-out speed it produces nothing at all and turns
              itself out of the wind.
          - >-
              What a good capacity factor looks like. Onshore wind sits between about 25 and 35 per
              cent, offshore rather higher, and rooftop solar in this latitude around 10. A figure
              near 28 per cent on an exposed island is a genuinely good machine, and it is still
              nothing like the rating.
          - >-
              Why the brochure figure is not dishonest and is still wrong. It is a modelled output
              at a reference wind distribution, which Vellan does not have — the island is windier
              on average and loses more hours to cut-out in winter gales. The only trustworthy figure
              is the one measured on this hill.
        assumes:
          - the last full year of generation is representative of the wind here
        takeaway: Capacity factor is what the machine actually gives, and it already contains the calm days.
        format: BALLPARK
        question: Estimate the turbine's capacity factor on Vellan.
        estimate:
          prompt: Rated at 250 kW; generated 613,000 kWh in its last full year. Ferris wants the factor, not the brochure.
          question: Estimate the turbine's capacity factor on Vellan.
          labels:
            - 613000 kWh  (actual generation, one year)
            - 250 kW  (rated output)
            - 8760 h  (hours in a year)
            - 900000 kWh  (the brochure's annual figure)
          values: [613000, 250, 8760, 900000]
          slots: 3
          template: '{0} ÷ ({1} × {2})'
          formula: a/(b*c)
          correct: [0, 1, 2]
          target: 0.28
          tolerance: 0.03
          units: of rated
          solution: 613,000 ÷ (250 × 8760) = 613,000 ÷ 2,190,000 = 0.28.
          explanation: Twenty-eight per cent — a good machine on a windy island, and a third of the brochure's implied figure.
        answerText: About 0.28 — a good capacity factor, and well under a third of the rating.
        why: >
          Two hundred and fifty kilowatts for 8,760 hours would be 2.19 million kilowatt-hours, and
          the machine made 613,000: a capacity factor of 0.28. That is a genuinely good number for
          onshore wind and it is nothing like the rating, because the rating is the output at one
          wind speed and the factor already contains every calm hour, every gale above cut-out and
          every hour of maintenance. Comparing against the brochure's 900,000 gives 0.68, which is
          a comparison between two estimates rather than a measurement. The 613,000 is what this
          hill actually produced, and it is the only figure a nine-year decision should rest on.
        rebuttals:
          - Comparing with the brochure figure compares two estimates and measures neither.
          - Dividing the annual generation by the rating alone leaves out the hours, so the answer is not a fraction of anything.
      - group: HARB
        task: Work out how long the gearbox takes to pay for itself
        title: Forty-one thousand, and what it saves
        place: Harbour Office
        relationship: >-
          payback = cost ÷ annual saving: how many years of saving pay for the change.
        concept: 'Renewable and non-renewable, and what the cable is bringing'
        scene: >
          The gearbox is £41,000. At a capacity factor of 0.28 the turbine displaces about
          613,000 kilowatt-hours of generation a year, and diesel electricity costs the island
          about 7.4 pence a kilowatt-hour in fuel alone.
        guide: >-
          Work out what a year of displaced diesel is worth, then divide the capital cost by it.
          That is the simple payback. Then look at what the number does not contain, because two
          of the things it leaves out point in opposite directions and the council will be told
          only one of them.
        background:
          - >-
              What simple payback leaves out. Maintenance on the machine, the cost of borrowing the
              £41,000, and the fact that the turbine cannot displace diesel at every hour it
              generates — some of its output arrives when the cable is carrying the island anyway.
              All three make the real payback longer.
          - >-
              What it also leaves out in the other direction. The fuel price is not fixed, the cable
              is failing and will be replaced at somebody's cost, and the emissions saved are worth
              something in any future the council has to plan for. All three make the real case
              stronger.
          - >-
              Why simple payback is still the right first number. It is transparent, it can be
              checked by anybody in the room in one line, and both sides can then argue about the
              adjustments in the open. A discounted calculation with eleven assumptions in it wins
              a meeting and does not inform one.
        assumes:
          - the fuel-only cost of diesel electricity is about 7.4 pence a kilowatt-hour
        takeaway: Simple payback is capital over annual saving, and what it omits belongs beside it.
        format: BALLPARK
        question: Estimate the simple payback time on the gearbox.
        estimate:
          prompt: £41,000 for the gearbox; 613,000 kWh a year displaced; diesel electricity costs 7.4p a kWh in fuel.
          question: Estimate the simple payback time on the gearbox.
          labels:
            - 41000  (gearbox cost, £)
            - 613000 kWh  (annual generation displaced)
            - 0.074  (fuel cost of diesel electricity, £/kWh)
            - 0.28  (the turbine's capacity factor)
          values: [41000, 613000, 0.074, 0.28]
          slots: 3
          template: '{0} ÷ ({1} × {2})'
          formula: a/(b*c)
          correct: [0, 1, 2]
          target: 0.90
          tolerance: 0.12
          units: years
          solution: annual saving = 613,000 × £0.074 = £45,400; payback = 41,000 ÷ 45,400 = 0.9 years.
          explanation: Under a year on fuel alone — which is why the two-year wait for a gearbox is the expensive part, not the gearbox.
        answerText: About eleven months on fuel alone, which makes the two-year wait the real cost.
        why: >
          Six hundred and thirteen thousand kilowatt-hours at 7.4 pence is £45,400 of fuel a year,
          against a £41,000 gearbox: a payback under twelve months. The striking part is not the
          gearbox, it is the two years the machine has already stood still — roughly £90,000 of
          diesel burnt waiting for a part, which is more than twice what the part costs. Simple
          payback leaves out maintenance, borrowing and the hours the turbine generates while the
          cable is carrying the island anyway, all of which lengthen it; and it leaves out fuel
          price risk, the failing cable and the emissions, all of which shorten it. It is still the
          right first number, because anybody in the room can check it in one line.
        rebuttals:
          - The capacity factor is already inside the 613,000 kWh; applying it again halves a figure that was measured.
          - Dividing the cost by the energy alone gives pounds per kilowatt-hour, which is a price rather than a time.
      - group: WATER
        task: Say what the ferry's own water would do
        title: The sailing's own standing order
        place: Waterworks
        concept: 'An ecological footprint, and what a visitor adds to one'
        takesAsRead:
          - 'Carrying capacity, and what happens on the way past it'
        scene: >
          The second sailing would take on fresh water at the berth: about 6 cubic metres a
          crossing, twice a week through the season. Sorley has the recharge at 294,000 cubic
          metres a year and the licence at 340,000.
        guide: >-
          Work out what the sailings would draw across a season and set it against the two
          numbers that matter — the recharge, and the gap between recharge and licence. Then ask
          when it would be drawn, because a volume spread over a year and the same volume drawn in
          July are different demands on this store.
        background:
          - >-
              Why the annual comparison understates it. Six cubic metres twice a week for a
              twenty-week season is 240 cubic metres, which is less than a thousandth of the
              recharge and looks like nothing. Every cubic metre of it is drawn in the twenty weeks
              when the store is lowest and the chloride is rising.
          - >-
              Why it is the marginal draw that counts. The island is already licensed to take more
              than the recharge, so any new demand is not being met out of spare capacity — there
              is none. It is met out of the store, which is the same as saying it is met out of next
              year.
          - >-
              What metering the ferry separately buys. It puts the sailing's own consumption on a
              line by itself, so a future council can see what the decision cost rather than
              inferring it from a total. That is why the condition matters more than the volume.
        assumes:
          - the sailing takes on water at the berth rather than at the mainland end
        takeaway: A small volume drawn in the worst month is not a small demand on the store.
        format: BALANCE
        question: Read what you need and report what the island actually takes out of the store each year.
        balance:
          hint: >-
            Reading a meter is free. Counting a stream is the claim you are making about where the
            water goes.
          total: { amount: 331, unit: '000 m³/y', label: Total drawn from the store each year }
          streams:
            - { id: houses, label: Metered supply to houses and the school, value: 214, display: '214,000 m³ a year, off the distribution meter' }
            - { id: leak, label: Lost from the main before it arrives, value: 51, display: '51,000 m³ — a fifth of what the borehole lifts', hidden: true, note: 'never billed, because nobody receives it' }
            - { id: ferry, label: The second sailing taking on water at the berth, value: 0.24, display: '6 m³ a crossing, twice weekly for twenty weeks' }
            - { id: garden, label: Market garden and stock troughs, value: 66, display: '66,000 m³ a year, metered at the common' }
            - { id: rain, label: Rain falling on the island, value: 0, display: 'not an abstraction — it is the deposit, not a withdrawal' }
          tolerance: 18
          commit: Report the abstraction
        answerText: >-
          About 331,000 cubic metres a year — houses, the garden, the sailing's 240, and the 51,000
          that leaks out of the main before anybody receives it.
        why: >
          The term that does not announce itself is the leak. A fifth of everything the borehole
          lifts never reaches a tap, so it is on no bill and no meter that anybody reads, and it is
          the second largest withdrawal on the island. Counting only what is billed gives 280,000
          and makes the recharge look nearly adequate; counting the leak puts the total at 331,000
          against a recharge of 294,000, which is the over-draw the July chloride has been
          reporting for five years. The ferry's own 240 cubic metres is the smallest number here and
          it lands entirely in the twenty weeks when the store is lowest, which is why it is metered
          separately rather than folded into a total. And the rain is the deposit rather than a
          withdrawal, which is the one line that must not be added.

  # ----- day 13. What arrived on the boat, and what it does here.
  - title: What came in on the boat
    objective: Decide what an introduced species is doing and what the island's own emissions add up to.
    briefing: Something is eating the tunnel crops and it was not here three years ago.
    stake: >-
      Thursday, and Hollis has found the same beetle in all four polytunnels. Nobody had seen it on Vellan before the spring of the year the freight contract changed. Berhane's point today is the one Calloway cannot answer: every additional sailing is an additional chance for something to arrive, and the island has no inspection at the berth. Meanwhile the pack still needs a single emissions figure. Today you decide what makes this beetle a problem rather than a curiosity, and put the island's two greenhouse sources on one line. An island's defence is its distance, and a ferry is a bridge across it.
    takeaway: Isolation is what an island's species are protected by, and a sailing is a hole in it.
    stops:
      - group: COMMON
        task: Decide what makes the beetle invasive rather than merely new
        title: Four conditions, and it has all of them
        place: Common Office
        concept: 'Invasive species, and the four things that make one'
        takesAsRead:
          - 'Island biogeography: area, isolation and the species a place can keep'
        scene: >
          The beetle is in all four tunnels, breeds three times a season, eats eleven of the
          crops Hollis grows, and nothing on the island has been seen eating it. It arrived
          within a year of the freight change.
        guide: >-
          Being new is not the same as being invasive. Go through what the species does here
          rather than where it came from: how fast it reproduces, how broad its diet is, whether
          anything controls it, and whether it can spread beyond where it landed. A species with
          one of those is a curiosity; one with all four is a management problem.
        background:
          - >-
              Why "no natural predator" is the load-bearing condition. In its home range something
              eats it, and the population sits at a level that reflects that. Removed from its
              predators it does not sit anywhere: it grows until food or space stops it, which is
              why the same beetle is unremarkable at home and a problem here.
          - >-
              Why a broad diet matters so much on a small island. A specialist can only occupy what
              its host occupies. A generalist eating eleven crops can move between them as each is
              harvested, so there is no season in which its population has to crash.
          - >-
              Why the arrival route is the only part that can be closed. The beetle cannot be
              removed from four tunnels once it is breeding. What can change is the next arrival:
              inspection at the berth, cleaned pallets, and knowing which sailings carry soil and
              plants. A second sailing doubles the opportunities without doubling the inspection.
        assumes:
          - the beetle was not recorded on the island before the freight change
        takeaway: An invasive species is one that breeds fast, eats widely, is uncontrolled and can spread.
        format: CHOICE
        question: Which condition makes this beetle a management problem rather than a new record?
        choices:
          - Nothing here eats it, so only food and space limit it
          - It arrived from the mainland rather than establishing naturally
          - It breeds three times in a single season rather than once
          - It was first found inside a polytunnel rather than outdoors
        answer: Nothing here eats it, so only food and space limit it
        why: >
          All four conditions matter and one of them is doing the work. Where it comes from, a
          predator holds this beetle at a level nobody notices; here nothing eats it, so the
          population is limited only by food and space, and on an island with eleven suitable crops
          that limit is a long way off. Arriving from the mainland is how it got here rather than
          why it is a problem — most introductions establish nothing. Breeding three times a season
          is dangerous only because nothing is removing the offspring. And being found under cover
          is where it was noticed, not a constraint: the tunnels are warmer, and the crops outside
          are on the same list.
        rebuttals:
          - Most introduced species never establish. The route explains its arrival, not its success.
          - Three generations a season is only decisive because nothing is removing any of them.
          - The tunnels are where it was found and where it is warmest; eleven of the crops it eats grow outdoors too.
      - group: TIP
        task: Put the island's two greenhouse sources on one line
        title: One figure, two gases
        place: Tip and Sorting Yard
        relationship: >-
          CO₂ = fuel × emission factor for the diesel, then CO₂e = mass × GWP for the methane: both
          gases counted from what went into the tank and what came off the cell.
        concept: 'Greenhouse gases, and comparing them on one scale'
        scene: >
          The pack needs one emissions figure. Seventy-eight thousand litres of diesel went into
          the sets this year and the cell vents about 14 tonnes of methane. The flare would burn
          the methane to carbon dioxide.
        guide: >-
          Count the diesel from what went into the tank — litres times an emission factor — rather
          than from anything measured at the stack. Convert the methane to carbon dioxide
          equivalent, add the two and state the period the conversion belongs to. Then work out what the flare would leave, because
          burning methane does not remove the carbon — it changes which gas is carrying it, and
          that is most of the benefit.
        background:
          - >-
              What a flare actually does. It oxidises methane to carbon dioxide and water. The
              carbon still reaches the atmosphere, as a gas that traps a twenty-eighth as much heat
              per kilogram, so the climate effect falls by around ninety-five per cent while the
              emitted mass barely changes.
          - >-
              Why diverting the compostables is better than flaring them. A flare deals with methane
              after it is made. Removing the organic matter means it is never made, and the same
              material becomes soil instead. The flare is what you fit for the material you cannot
              divert.
          - >-
              Why the period has to be on the line. At a hundred years methane is 28 times carbon
              dioxide and the tip is about two thirds of the island's total; at twenty years it is
              80 times and the tip is five sixths of it. The same island, the same tonnages, two
              very different papers.
        assumes:
          - the hundred-year potential is the basis the pack states
        takeaway: A flare changes which gas carries the carbon, and that is most of the benefit.
        format: BALLPARK
        question: Estimate the island's total annual emissions in carbon dioxide equivalent.
        estimate:
          prompt: 78,000 litres of diesel at 2.63 kg of CO₂ a litre, and 14 tonnes of methane off the cell, on the hundred-year basis.
          question: Estimate the island's total annual emissions in carbon dioxide equivalent.
          labels:
            - 78 kL  (diesel burnt, thousands of litres)
            - 2.63 t/kL  (emission factor, tonnes CO₂ per thousand litres)
            - 14 t  (methane vented)
            - 28  (GWP over 100 years)
            - 80  (GWP over 20 years)
          values: [78, 2.63, 14, 28, 80]
          slots: 4
          template: '{0} × {1} + {2} × {3}'
          formula: a*b+c*d
          correct: [0, 1, 2, 3]
          target: 597
          tolerance: 40
          units: t CO₂e a year
          solution: 78 × 2.63 + 14 × 28 = 205 + 392 = 597 tonnes CO₂e a year.
          explanation: About 600 tonnes, two thirds of it from a vent on a hole. A flare would take the total to roughly 245.
        answerText: About 597 tonnes a year, two thirds of it from the tip — and a flare would cut it to roughly 245.
        why: >
          Fourteen tonnes of methane at 28 is 392, plus the diesel's 205, gives about 600 tonnes of
          carbon dioxide equivalent — and two thirds of the island's climate footprint is a vent
          nobody meters. That is the sentence the pack has been missing. The flare is the striking
          part: burning the methane leaves nearly the same mass of gas and about 40 tonnes of
          equivalent, because the carbon is now travelling as a gas that traps a twenty-eighth as
          much heat. Diverting the compostables is better still, because the methane is then never
          made. The period has to be stated: on the twenty-year basis the same tonnages give 1,325.
        rebuttals:
          - The twenty-year potential gives 1,325 tonnes. Both are correct and the pack must say which it used.
          - Adding the raw tonnages compares a kilogram of methane with a kilogram of carbon dioxide.
      - group: REEF
        task: Say what an inspection at the berth is worth
        title: The distance, and the bridge across it
        place: Reef Station
        concept: 'Island biogeography: area, isolation and the species a place can keep'
        takesAsRead:
          - 'Species richness, and what an island holds that a mainland does not'
        scene: >
          Berhane's list of species recorded on Vellan for the first time runs at about one a
          year for thirty years, and four in the three years since the freight contract changed.
          There is no inspection at the berth.
        guide: >-
          An island's species list is held in place by two things: how big the island is and how
          hard it is to reach. The first cannot change. Ask what the second is worth in practice,
          and what a second sailing does to it — then decide what the pack should ask for, given
          that the beetle already here cannot be removed.
        background:
          - >-
              Why isolation matters as much as area. Arrivals are rare, so a species that goes
              locally extinct is not replaced, and a species that arrives faces no competitors that
              arrived recently either. Reduce the isolation and both halves change: more arrivals,
              and a community that has never had to hold its ground against newcomers.
          - >-
              What the numbers suggest and cannot prove. One new record a year for thirty years and
              four in three is a rate change worth acting on, and it coincides with a freight
              contract rather than being explained by it. Berhane will say exactly that much and no
              more.
          - >-
              Why inspection is the cheap intervention. Nothing removes an established beetle from
              four polytunnels. What a berth inspection changes is the next arrival, at a cost of an
              hour a sailing — which is the whole argument for spending effort at the point of entry
              rather than on eradication afterwards.
        assumes:
          - the first-record list has been kept by the same person throughout
        takeaway: An island is protected by its distance, and inspection is the only part of that anybody can restore.
        format: CHOICE
        question: What should the pack ask for, given the beetle cannot be removed?
        choices:
          - Inspection of soil, plants and pallets at the berth
          - Eradication of the beetle from all four of the polytunnels it is now breeding in
          - A survey to establish how the beetle arrived
          - A ban on importing plants to the island
        answer: Inspection of soil, plants and pallets at the berth
        why: >
          Nothing removes a breeding beetle from four polytunnels, so effort spent on eradication
          buys very little. What can be changed is the next arrival, and the rate change — one new
          record a year for thirty years, four in the last three — is what makes that urgent. An
          hour's inspection a sailing is the cheapest environmental measure in the pack. A survey
          into how this beetle arrived is interesting and does not stop the next one; the route is
          already obvious enough to act on. And a ban on plant imports is stronger than the evidence
          needs, would stop Hollis restocking, and drives the same traffic into unrecorded channels.
        rebuttals:
          - Eradication from four tunnels with a three-generation season is not achievable, and the crops outside are on its list too.
          - A survey answers how it arrived; the pack needs a measure that changes the next arrival.
          - A full import ban costs the garden its stock and pushes the same material into channels nobody inspects.

  # ----- day 14. Who is here, and who will be.
  - title: Nineteen on the register
    objective: Work out what the island's own population is doing, separately from the visitors.
    briefing: Iversen has the register and two of the nineteen leave in August.
    stake: >-
      Friday, and Liv Iversen, the schoolteacher, has brought the register to the office rather than send it. The roll has fallen from thirty-one to nineteen in twelve years and two more leave for the mainland secondary in August. Calloway's whole case rests on that number and Iversen will not let it be quoted as a slogan: it is an age structure, she says, and it predicts the next decade whichever way the vote goes. Today you work out the island's own growth rate, what it doubles or halves in, and what the age structure says the ferry cannot fix. A population is not a total, it is a shape, and the shape is what forecasts anything.
    takeaway: A population is an age structure, and its shape decides the next decade.
    stops:
      - group: WATER
        task: Work out the island's own rate of change
        title: Four flows, one stock
        place: Waterworks
        relationship: >-
          r = (B + I − D − E) ÷ N × 100: births plus arrivals less deaths and departures, over the population.
        concept: 'Age structure and the demographic transition, on a nineteen-child roll'
        takesAsRead:
          - 'Exponential growth, and reading a doubling time off a rate'
        scene: >
          Last year on Vellan: one birth, four people arrived, two died and seven left. The
          resident population is 91.
        guide: >-
          A population changes by four flows and only four. Add what came in, take away what went
          out, divide by the population it happened to, and put it as a percentage. The sign is
          the answer to the day's question, and then the doubling-time arithmetic works the same
          way in reverse for a shrinking population.
        background:
          - >-
              Why all four flows have to be counted. Two of them are demographic and two are
              migration, and on a small island the migration terms are much the larger. A council
              discussing birth rates is discussing the smallest two numbers on the list.
          - >-
              What the rule of 70 does with a negative rate. It gives a halving time. At about minus
              four and a half per cent a year, ninety-one people halve in something like fifteen
              years — which is the number nobody in the room has said out loud, and it is not
              affected by whether the school stays open next year.
          - >-
              Why the seven who left is the term to interrogate. It is the largest flow and the only
              one anybody can change. Why they left, and whether a second sailing changes those
              reasons, is the actual question hiding behind the ferry argument.
        assumes:
          - the four flows are counted for the same year as the population figure
        takeaway: A population changes by four flows, and on a small island migration is the large pair.
        format: BALLPARK
        question: Estimate Vellan's population growth rate for the year.
        estimate:
          prompt: One birth, four arrivals, two deaths, seven departures, from a population of 91.
          question: Estimate Vellan's population growth rate for the year.
          labels:
            - 5  (births plus arrivals)
            - 9  (deaths plus departures)
            - 91  (the resident population)
            - 19  (children on the school register)
          values: [5, 9, 91, 19]
          slots: 3
          template: '({0} − {1}) ÷ {2} × 100'
          formula: (a-b)/c*100
          correct: [0, 1, 2]
          target: -4.4
          tolerance: 0.6
          units: '% a year'
          solution: r = (5 − 9) ÷ 91 × 100 = −4.4 % a year.
          explanation: Minus four point four per cent. By the rule of 70 that halves the island in about sixteen years.
        answerText: About minus 4.4 per cent a year — a halving time of roughly sixteen years.
        why: >
          Five in, nine out, over ninety-one, is minus 4.4 per cent a year. The rule of 70 works
          just as well downward: seventy over four point four is about sixteen years to halve, and
          nobody in the ferry argument has said that out loud. The two migration terms dominate — one
          birth and two deaths against four arrivals and seven departures — so a discussion about
          birth rates is a discussion about the smallest numbers on the sheet. The seven who left is
          the term worth interrogating, because it is the largest and the only one anybody can act
          on. The school roll is the consequence being argued about, not an input to the rate.
        rebuttals:
          - The school roll is what the rate produces, not one of the flows that makes it.
          - Counting only births and deaths leaves out the two largest flows on a small island.
      - group: HARB
        task: Say what the age structure predicts
        title: A shape, not a total
        place: Harbour Office
        concept: 'Age structure and the demographic transition, on a nineteen-child roll'
        takesAsRead:
          - 'Exponential growth, and reading a doubling time off a rate'
        scene: >
          Iversen's register: nineteen children, of whom two leave in August. The island's
          adults are heavily weighted above fifty-five, and four of the nine graziers are past
          seventy.
        guide: >-
          Read the shape rather than the total. Ask how many people are of an age to have children
          here, how many are of an age to stop working, and what those two numbers do over ten
          years without anybody moving. Then ask which of the ferry's promised effects would change
          the shape rather than the total.
        background:
          - >-
              What an age structure predicts that a total cannot. The number of births in ten years
              is set by how many people of childbearing age are present now, and that is already
              determined. A total can be propped up by arrivals; the shape can only be changed by
              arrivals of a particular age.
          - >-
              Why an island's shape gets worse on its own. People leave in their late teens for
              education and work, and the ones who return, if any, return later. That removes the
              same cohort every year, so the structure hollows in the middle even when the total
              looks stable for a while.
          - >-
              What kind of arrival would actually change it. Families with young children, staying.
              Visitors change the summer total and nothing about the structure; seasonal workers
              change the summer total and the water demand. The ferry argument is about traffic, and
              the register is about residents, which is why the two keep talking past each other.
        assumes:
          - the register and the age figures describe the same population
        takeaway: A total can be propped up by arrivals; a shape changes only with arrivals of a particular age.
        format: CHOICE
        question: What would actually change the age structure rather than the summer total?
        choices:
          - Families with school-age children who move here and stay
          - A larger number of day visitors spread across the whole season
          - Seasonal workers arriving for the summer
          - A higher birth rate among the existing residents
        answer: Families with school-age children who move here and stay
        why: >
          The shape is what forecasts, and only one of these changes it. Families with children who
          stay add to both the young cohort and the working-age one, which is the two places the
          structure is hollow. Day visitors change nothing about residency at all. Seasonal workers
          change the summer total and the water demand, and leave in September. And a higher birth
          rate is not available as a lever: the number of people of childbearing age on Vellan is
          already fixed, and it is small — which is the thing Iversen keeps saying and the ferry
          argument keeps not hearing, because one side is talking about traffic and the other about
          residents.
        rebuttals:
          - Day visitors do not enter the register at all; they change the summer total and nothing else.
          - Seasonal workers leave in September and take their contribution to the structure with them.
          - The birth rate cannot be a lever when the number of people of childbearing age is already small and fixed.
      - group: POWER
        task: Decide what the plant has to be sized for
        title: Ninety-one, or three hundred
        place: Turbine Yard
        concept: 'Capacity factor and intermittency: what a turbine gives on average'
        takesAsRead:
          - 'Energy against power: a kilowatt is not a kilowatt-hour'
        scene: >
          Ferris has to specify the replacement cable and the diesel sets for twenty-five years.
          The resident population is falling at four per cent a year; the July peak is set by
          visitors and is rising.
        guide: >-
          Two trends run in opposite directions and the plant has to be specified against both.
          Work out which of them sets the plant and which sets the fuel, then say what the
          specification should follow. A falling total and a rising peak is not a contradiction; it
          is two different quantities, and only one of them buys equipment.
        background:
          - >-
              Why the two diverge. Residents use energy all year and set the average. Visitors use it
              in twenty weeks and concentrate it in evenings, so they barely move the annual total
              and land squarely on the peak half hour that sizes the plant.
          - >-
              What over-sizing costs. Diesel sets run inefficiently at part load, so a plant sized
              for a peak that rarely happens burns more fuel per unit all year. The cost of being
              wrong upward is continuous and invisible; the cost of being wrong downward is one dark
              evening and very visible, which is why plants are usually over-sized.
          - >-
              Why the falling resident number does not save any equipment. Fewer residents lowers the
              average and the fuel bill. It does nothing to the July evening with the ferry alongside
              and the cable out, and that half hour is what the third diesel set exists for.
        assumes:
          - the twenty-five-year specification cannot be revisited cheaply
        takeaway: Two trends in opposite directions are two quantities, and each buys something different.
        format: CHOICE
        question: What should the twenty-five-year specification follow?
        choices:
          - The July peak for plant; the falling average for fuel
          - The falling resident population, on the grounds that it is the long-run trend
          - The rising July peak, for both plant and fuel
          - The present annual average, as the most stable figure available
        answer: The July peak for plant; the falling average for fuel
        why: >
          The two trends answer two different questions and the specification needs both. Plant is
          bought for the worst credible half hour, and that is a July evening with the boat
          alongside and the cable out — which is rising, whatever the register does. Fuel, tariffs
          and anything a turbine displaces follow the annual total, which is falling with the
          resident population. Following the falling trend alone leaves the island dark on the one
          evening it has visitors; following the peak for both over-sizes the sets, and diesels at
          part load burn more per unit all year, which is a continuous invisible cost. The present
          average is stable because it averages the two trends into a number describing neither.
        rebuttals:
          - Sizing plant to a falling average leaves nothing for the one half hour that has always set the plant.
          - Sizing fuel to the peak assumes a load the island has never held for more than thirty minutes.
          - Today's average is the midpoint of two opposing trends and describes neither of them in twenty-five years.

  # ----- day 15. The vote.
  - title: What the island can carry
    objective: Put one recommendation in front of the council, with the conditions it needs.
    briefing: The vote is at seven, and the pack closes at four.
    stake: >-
      Monday, and the pack closes at four for a vote at seven in the chapel hall. Calloway has the landing fees, the school roll and a ferry operator waiting on an answer. Berhane has eleven springs of transects, a rising July chloride and a beetle in four polytunnels. Sorley's recharge figure is the only number in the pack nobody disputes. Today you settle what the recommendation says, what conditions it carries and what the island is being asked to accept. Ninety-one people live on the difference between a decision with conditions attached and a decision without them.
    takeaway: A resource decision is a rate and a limit, and the conditions are where both are written down.
    stops:
      - group: HARB
        task: Say what carrying capacity means for this vote
        title: What it can carry, and for how long
        place: Harbour Office
        concept: 'Carrying capacity, and what happens on the way past it'
        takesAsRead:
          - 'Exponential growth, and reading a doubling time off a rate'
        scene: >
          The recommendation has to say whether the island can take a second sailing. The
          recharge is 294,000 cubic metres, the licence 340,000, and the store turns over in
          about nine years.
        guide: >-
          Carrying capacity is not a number of people, it is a rate the place can sustain
          indefinitely. Ask what the binding constraint actually is here, then say what "for how
          long" means when the store buffers nine years of error. The answer is a condition rather
          than a yes or a no, and the condition has to name the quantity it caps.
        background:
          - >-
              Why capacity is a rate and not a headcount. The same island supports more people using
              less water each, or fewer using more. What is fixed is the flow — 294,000 cubic metres
              of recharge a year — and everything else is a choice about how it is spent.
          - >-
              Why overshoot is possible at all. A stock lets a population live above the flow for as
              long as the stock lasts, which is what "eleven months of water in the ground" means. An
              overshoot is invisible while it is happening and expensive to reverse, on the same
              nine-year clock.
          - >-
              What a defensible recommendation looks like. It names the constraint, caps the rate at
              what the flow supports, states the period the cap is measured over, and says who
              measures it. Anything shorter than that is an opinion about a ferry.
        assumes:
          - the recharge figure measured on day 2 stands as the pack's number
        takeaway: Carrying capacity is a rate the place can sustain, and a stock lets you exceed it invisibly.
        format: CHOICE
        question: What should the recommendation actually say?
        choices:
          - Support it, with abstraction capped at recharge and metered at the berth
          - Support it, on the grounds that nineteen children on the register require it
          - Oppose the sailing, on the grounds that the aquifer cannot support it
          - Defer the decision until a second borehole has been surveyed
        answer: Support it, with abstraction capped at recharge and metered at the berth
        why: >
          The binding constraint is a rate — 294,000 cubic metres of recharge a year against a
          licence for 340,000 — so the honest recommendation caps the rate rather than answering yes
          or no about a boat. That form does the work both sides need: the sailing goes ahead, and it
          cannot be met out of the store, which is what "capped at recharge" means. Supporting it on
          the school roll ignores the constraint entirely. Opposing it treats a licence that can be
          rewritten as though it were the aquifer. Deferring for a survey spends eighteen months on a
          borehole that would draw from the same store, and the ferry contract will not wait.
        rebuttals:
          - The roll is the reason the question is being asked; it is not evidence about what the store can supply.
          - The aquifer can support a second sailing at a lower abstraction rate. What it cannot support is the present licence.
          - A second borehole draws on the same recharge, so the survey answers a question about pumps rather than about water.
      - group: REEF
        task: Say what the pack must not claim
        title: The sentence that has to come out
        place: Reef Station
        concept: 'Reading an environmental claim: what a number is about, and over what period'
        takesAsRead:
          - 'Concentration against load, and why a small pipe can matter'
        scene: >
          Four sentences are in the draft pack. Dunmore has flagged one. Berhane has flagged a
          different one. The vote is in three hours and both flags are correct.
        guide: >-
          Read each sentence against the evidence in the pack rather than against whether you
          agree with it. A sentence can be true, defensible and still wrong to include if the
          period is missing or the claim is stronger than the data. Find the two that fail and say
          which failure each one is.
        background:
          - >-
              The two ways a pack sentence fails. It claims more than the evidence supports, or it
              carries a figure with no period so it will be requoted as a permanent fact. Both are
              survivable in a conversation and neither survives being read out by somebody who
              disagrees.
          - >-
              Why the strongest sentence should stay in. Understating is a failure too: a paper that
              says less than it knows invites a decision the evidence would have prevented. The
              eleven-spring cover trend and the five-July chloride series both belong in at full
              strength.
          - >-
              Why this is the last stop of the fortnight. Everything measured over fourteen days
              arrives here as sentences somebody will read aloud at seven o'clock, and the work is
              worth exactly as much as the sentences can bear.
        assumes:
          - the pack's figures are the ones measured across the fortnight
        takeaway: A pack sentence fails by claiming too much or by dropping its period.
        format: PROTOCOL
        task: Match each draft sentence to what is wrong with it, or that nothing is.
        columns:
          - The draft sentence
          - The verdict on it
        scenarios:
          - Recharge is 294,000 cubic metres a year against a licence of 340,000
          - Chloride at the borehole is 191 milligrams a litre
          - Warming has caused the loss of reef cover in the bay
          - Cover on the eleven transects has fallen from 41 to 26 per cent since the record began
        choices:
          - 'Stands: measured this fortnight, and the strongest number in the pack'
          - Drop the period and it becomes an annual figure the data never measured — it is a July peak
          - Claims a cause the evidence cannot separate; the correlation can be stated instead
          - 'Stands: a trend measured the same way over long enough to be one'
        mapping: [0, 1, 2, 3]
        rebuttals:
          - The recharge figure was measured this fortnight against a licence that is on the record. It stands.
          - 191 is a July peak. Without its month it is quoted afterwards as the island's water.
          - Attribution needs control sites and event-level evidence the island does not have.
          - Eleven springs of the same method is a trend, and stating it at full strength is the point.
        answerText: >-
          The recharge and the cover trend stand. The chloride needs its month. The warming sentence
          claims a cause the pack cannot support.
        why: >
          Two of these are the best evidence the island has and belong in at full strength: a
          recharge figure measured this fortnight, and eleven springs of cover read the same way
          each time. The chloride sentence is true and dangerous — 191 is a July peak, and without
          its month it will be requoted as the island's water quality by the second meeting. The
          warming sentence is the one to cut: the correlation between the temperature series and the
          cover series can be stated, and causation needs control sites and bleaching tied to
          specific weeks, which nobody here has. Understating is also a failure, which is why the
          answer is not to soften all four.
      - group: COMMON
        task: Say what the fortnight actually established
        title: Rates, and the limits written down
        place: Common Office
        concept: 'An ecosystem as a budget: what comes in, what leaves, what stays'
        scene: >
          Pike has the stocking limit, Okafor the volume plan, Ferris the gearbox and Sorley the
          cap. Four decisions, taken separately across a fortnight, going to one vote.
        guide: >-
          Look for what the four have in common rather than what each says. Each one replaced
          something with something else of a different kind, and the same replacement happened
          four times. Name it, because that is what the council is being asked to adopt as a way
          of working rather than as four items.
        background:
          - >-
              What each of the four did. The stocking limit replaced a proportion of an uncounted
              total with a number of animals, inspected. The volume plan replaced tonnage with cubic
              metres per pound. The gearbox replaced a nameplate rating with a measured capacity
              factor. The cap replaced a licensed figure with a measured recharge.
          - >-
              Why that is one move and not four. In every case a figure inherited from elsewhere —
              a template, a brochure, a proportion, an invoice — was replaced by a quantity measured
              on Vellan, with a period attached. The measurement was cheap in all four cases and
              nobody had taken it.
          - >-
              What it does not settle. The reef's decline is still not attributable, the beetle is
              still in the tunnels, the hole still has eleven years in it and the register is still
              falling at four per cent a year. A fortnight of measurement changes what the council
              can decide, not what the island is.
        assumes:
          - the four decisions of the fortnight are the pack's substance
        takeaway: A measured local number with a period on it is worth more than an inherited figure.
        format: SEQUENCE
        question: Put the fortnight's four replacements in the order the pack should present them.
        cards:
          - Recharge measured on the island, replacing a licence figure copied from a mainland table
          - Volume per pound, replacing tonnage as the way the tip's spending is ranked
          - A capacity factor from this hill, replacing the turbine's nameplate rating
          - Stock counted in animals and inspected, replacing a share of an uncounted total
        order: [0, 1, 2, 3]
        axis: which constraint binds soonest
        ends: [binds soonest, binds latest]
        answerText: >-
          Water first, because it binds soonest and everything else is downstream of it; then the
          tip, the turbine and the common.
        why: >
          The order is by how soon each constraint binds, which is the only ordering a council can
          act on in one evening. Water binds now: the licence exceeds the recharge, the store turns
          over in nine years and the ferry's own draw lands in the worst twenty weeks. The tip binds
          next, with eleven years of volume and a growth rate that shortens it. The turbine is a
          nine-month payback on a machine already bought, so it binds as soon as anybody signs. The
          common is the least urgent because the overstocking is recoverable within a season once it
          is counted. All four are the same move — an inherited number replaced by a measured one
          with a period attached — and that is what the council is really being asked to adopt.


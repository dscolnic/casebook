        background:
          - >-
              Why muscles get tired. Every pull uses energy. Do it enough times without a break and the
              muscle cannot pull as hard, until it has had time to recover.
          - >-
              Why tired is not hurt. Tiredness comes on slowly, feels the same all over the muscle, and
              goes away with rest. A new injury usually hurts sharply in one spot and does not get
              better while you rest for a minute.
          - >-
              Why the test matters. If rest is what fixes it, the answer is more rests. If something
              else is doing it — too much weight, too fast, too many in a row — then the plan changes,
              and only one test at a time can tell you which.
        assumes:

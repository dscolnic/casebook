  - title: Water Watch
    objective: Hydration, kidneys, urine, and water balance
    briefing: Hydration, kidneys, urine, and water balance
    stake: Eighth shift. Mateo, a patient, finished his soccer match and says he feels fine. His mouth is dry. His urine looks darker than usual. He drank one small bottle in the whole match. Nurse Alex Lee has written all of that down and wants to know what you make of it together. Today you read two clues at once and follow water through the body. Two clues pointing the same way are much stronger than one.
    takeaway: Shift complete
    stops:
      - group: NUTR
        task: What body need do these clues most strongly point to?
        title: The Thirsty Player
        concept: Fluids, hydration and dehydration
        place: Exam Room 1
        scene: Mateo just finished soccer. He is thirsty and his mouth is dry. The nurse says his urine looks darker than it was. The team is checking him.
        guide: >-
          Work out how much water Mateo lost while he played. He sweated about half a litre
          every twenty minutes, and he played for sixty. Pick the two numbers that go together.
          One tile is how long a half is, which is not what you need here.
        background:
          - >-
              Why you sweat. Running makes heat. Sweat carries the heat away when it dries off your
              skin. That works well, and it uses up water.
          - >-
              What the clues mean. A dry mouth and dark urine both say the same thing: there is less
              water in the body than there should be. The body saves water by making less urine, and
              that makes it darker.
          - >-
              What to do about it. Drink. A litre and a half is about three big glasses, and you cannot
              drink it all at once, which is why players drink through a game instead of after it.
        assumes:
          - you sweat when you run around
        takeaway: The body tells you when it is short of something, and thirst is one of those signals.
        format: BALLPARK
        question: How much water did Mateo lose while he was playing?
        answerText: About one and a half litres. He sweated half a litre every twenty minutes, and he played for sixty — which is why he is thirsty and his urine is dark.
        why: Mateo played for 60 minutes. He sweated about half a litre every 20 minutes. Sixty minutes holds three lots of twenty. So he lost about 3 × 0.5 = 1.5 litres. That is about three big glasses. It went into the air off his skin. Sweating is not a fault. It carries heat away. Without it he would get too hot. But the water has to go back in. His dry mouth is one clue. His dark urine is another. The body saves water by making less urine. So the urine looks darker. Both clues say the same thing. He needs a drink, a bit at a time.
        estimate:
          prompt: Mateo sweated about half a litre every twenty minutes. He played for sixty minutes.
          question: Pick how many twenty-minute lots he played, and how much he sweated in each.
          labels:
            - 3  (lots of twenty minutes in an hour)
            - 0.5  (litres of sweat in each lot)
            - 60  (minutes he played)
            - 45  (minutes in a half)
          values: [3, 0.5, 60, 45]
          slots: 2
          template: '{0} × {1}'
          formula: a*b
          correct: [0, 1]
          target: 1.5
          tolerance: 0.2
          units: litres of water lost
          solution: 3 × 0.5 = 1.5 litres, which is about three big glasses.
          explanation: Sweat carried the heat away and took the water with it. Both his clues say the same thing.
          givens:
            - half a litre of sweat every twenty minutes
            - sixty minutes of play
          relationship: Part = whole × share, done as lots: how many twenty-minute lots he played, times the sweat in each one.

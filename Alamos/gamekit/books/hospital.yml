      - Some immune cells remember important features for later.
    order: [0, 1, 2, 3]
    answerText: A germ gets past the body’s outside barriers. -> Immune cells notice signs that something does not belong. -> The immune system attacks the germ and helps clear it. -> Some immune cells remember important features for later.
  - group: DEF
    task: Which set is the best match?
    title: Meet the Defense Team — Review 2
    setup: Dante, Ruby, and Mae  •  Pediatric Ward
    scene: Three teaching cards need labels. Dante has a skin-shield card, Ruby has a white-blood-cell card, and Mae has an antibody card.
    guide: >-
      Four sets, and each part has one job. Ask what each one does. Keeps things
      out? Goes looking? Knows one target? None of them can do the other two jobs.
      Check all three before you pick a set.
    background:
      - >-
          Why the wrong answers are worth reading. Each one is written to look right to
          somebody who made a particular mistake. Working out which mistake each one
          belongs to is most of the learning in this format — more than getting the
          right one, which you can sometimes do by feel.
      - >-
          Why sounding careful is not the same as being right. A long answer with a lot
          of detail in it feels safer, and it is easy to write one that is still wrong.
          The check that builds these questions measures option length across the whole
          game so the longest one is not the answer more often than chance. Reading is
          the only way through.
      - >-
          What the verdict adds. After you answer, the verdict says why each wrong
          option is wrong, in its own words. That is written for the reader who picked
          it. Read it even when you were right, because being right for a shaky reason
          is the thing that catches up with you two stops later.
    assumes:
      - a team works better than one person alone
    takeaway: "Defense works in layers: barriers, cells, and specialized molecules."
    format: CASEBOOK
    why: Your defences are a team, and each part has one job. Skin is the wall that keeps things out. White blood cells go and find things that got in. Antibodies are the part that knows one target and sticks to it. They work together, and none of them can do the other two jobs.
    rebuttals:
      - B. Skin—barrier; white blood cells—recognize specific targets; antibodies—find/fight threats — The last two are swapped. Antibodies are the part that knows one target.
      - C. Skin—find/fight threats; white blood cells—barrier; antibodies—recognize specific targets — Skin and white blood cells are swapped. Skin is a wall, not a hunter.
      - D. Skin—recognize specific targets; white blood cells—find/fight threats; antibodies—barrier — Skin and antibodies are swapped. Skin cannot pick out one germ from another.
    choices:
      - Skin—barrier; white blood cells—find/fight threats; antibodies—recognize specific targets
      - Skin—barrier; white blood cells—recognize specific targets; antibodies—find/fight threats
      - Skin—find/fight threats; white blood cells—barrier; antibodies—recognize specific targets
      - Skin—recognize specific targets; white blood cells—find/fight threats; antibodies—barrier
    answer: Skin—barrier; white blood cells—find/fight threats; antibodies—recognize specific targets
  - group: DEF
    task: Put the clinic process in the best order.
    title: A Vaccine Visit — Review 2
    setup: Mae  •  Vaccine Clinic
    scene: Mae is at the clinic with her mum. A nurse will give the shot. A shot lets the body practise, so it is ready if the real germ turns up.
    guide: >-
      All four steps happen. Ask which one cannot be taken back. A shot cannot, so
      checking who it is comes first. Then telling Mae, so she can hold still. The
      wait at the end is not politeness.
    background:
      - >-
          Why the order is graded whole. A sequence is a claim that each step needs the
          one before it to have happened. Get one pair the wrong way round and the claim
          is wrong, even if everything else lines up. That is why there is no part
          credit.
      - >-
          Why the ends are the place to start. The first and last steps are usually the
          easiest to be sure of, because one has nothing before it and the other has
          nothing after it. Fixing those two leaves fewer ways for the middle to go, and
          the middle is where the real question usually is.
      - >-
          What the rail can be ordered on. Often it is time. It can also be cost, or
          risk, or what you can still undo afterwards — do the steps that change nothing
          before the ones that change something for good. A step that destroys the
          sample can only be last.
    story: Mae is at the clinic with her parent. The nurse explains that a vaccine visit is handled by trained adults and is one way the immune system can practice recognizing a threat before a real infection.
    assumes:
      - a shot cannot be taken back once it is given
    takeaway: "The wait at the end of a vaccine visit is part of the visit: fast reactions show up in the first few minutes."
    format: SEQUENCE
    why: Check who it is first. A shot cannot be taken back. Then tell Mae what is coming, so she can hold still. Then the nurse gives it. Then you wait a few minutes. That wait is not just being polite. If a rare fast problem starts, it starts right then, and a nurse is still there.
    cards:
      - Check Mae’s name and the planned vaccine with her parent.
      - Explain what will happen, so Mae can hold still.
      - The trained clinician gives the vaccine.
      - Record it, and wait a short while before leaving.
    order: [0, 1, 2, 3]
    answerText: 1. Check Mae’s name and the planned vaccine with her parent. 2. Explain what will happen, so Mae can hold still. 3. The trained clinician gives the vaccine. 4. Record it, and wait a short while before leaving.
  - group: DEF
    task: Which explanation matches the clues?
    title: Hot or Cold Response? — Review 2
    setup: Jamal and Ivy  •  Observation Ward
    scene: Jamal is hot after exercise and is sweating. Ivy is cold after being in rain and is shivering. Both are now being cared for by the hospital team.
    guide: >-
      Four answers about sweating and shivering. Ask of each whether the two do the
      same thing. Sweat dries, and drying takes heat away. Shivering is muscles
      working, and working muscles make heat. So one cools and one warms.
    background:
      - >-
          Why the wrong answers are worth reading. Each one is written to look right to
          somebody who made a particular mistake. Working out which mistake each one
          belongs to is most of the learning in this format — more than getting the
          right one, which you can sometimes do by feel.
      - >-
          Why sounding careful is not the same as being right. A long answer with a lot
          of detail in it feels safer, and it is easy to write one that is still wrong.
          The check that builds these questions measures option length across the whole
          game so the longest one is not the answer more often than chance. Reading is
          the only way through.
      - >-
          What the verdict adds. After you answer, the verdict says why each wrong
          option is wrong, in its own words. That is written for the reader who picked
          it. Read it even when you were right, because being right for a shaky reason
          is the thing that catches up with you two stops later.
    assumes:
      - you sweat when you are hot and shiver when you are cold
    takeaway: Homeostasis means the body works to keep important conditions within a useful range.
    format: DIAGNOSIS
    why: These two do opposite things. Sweat sits on your skin and dries. Drying takes heat away with it, so you cool down. Shivering is your muscles shaking fast, and working muscles make heat. So one cools and one warms. Your body uses both to stay at about the same temperature all day.
    rebuttals:
      - B. Both make heat, because the body is trying to warm up either way. — Shivering does make heat. Sweating does the opposite, which is the whole point.
      - C. Sweating cools by wetting the skin; shivering cools by moving air. — Sweating does cool. Shivering is muscles working, and working muscles make heat.
      - D. Both are signs of being unwell rather than ways of holding a steady temperature. — You can be unwell and do both. A healthy body does both too, every day.
    choices:
      - Sweating helps cool; shivering uses muscle activity that helps make heat.
      - Sweating and shivering both make heat, because the body is trying to warm up either way.
      - Sweating cools by wetting the skin; shivering cools by moving air across it.
      - Both are signs of being unwell rather than ways of holding a steady temperature.
    answer: Sweating helps cool; shivering uses muscle activity that helps make heat.
  - group: DEF
    task: How fast is her temperature rising, in degrees per hour?
    title: Temperature Difference — Review 2
    setup: Ms. Kim  •  Nurse Station
    scene: A chart shows 2 numbers for Ms. Kim. The first is 98°F. The next is 101°F. The times beside them are three hours apart.
    guide: >-
      Two things matter here. How much it changed, and how long that took. Ask what
      the question wants. It wants a speed, so it needs both. One number alone is
      just a number. The same change in ten minutes would worry you more.
    story: A chart shows 2 temperatures for Ms. Kim. The earlier one is 98°F. The later one is 101°F, and the times beside them are 3 hours apart. One temperature alone is just a number. Two of them make a change, and the times make that change a speed. That is why charts keep the old readings and the clock beside them. The care team decides what it means.
    assumes:
      - you can take one number away from another
    takeaway: A change on its own is not enough; how long it took is what says whether it is fast.
    format: BALLPARK
    why: 101 take away 98 is 3. It took 3 hours. So it went up about 1 degree each hour. That is the whole trick. One number is just a number. Two numbers and a clock make a speed. The same 3 degrees in 10 minutes would be a much bigger worry.
    rebuttals:
      - A. 1°F — 101 is 3, not 1, above 98.
      - B. 2°F — 101 is 3, not 2, above 98.
      - D. 199°F — 199 comes from adding, but the question asks for the difference.
    estimate:
      givens:
        - Use the numbers shown
      relationship: Change each hour = how much it changed ÷ how many hours it took.
    answerText: 3°F
  - group: DEF
    task: Put the simplified cooling story in order.
    title: How Sweat Helps Cool — Review 2
    setup: Parker  •  Cooling Room
    scene: Parker notices sweat on his arm after exercise. The nurse explains why moving liquid water into the air can help remove heat from the skin.
    guide: >-
      These four are one order. Ask what has to happen first. Sweat cannot dry
      before it is on your skin. And the drying is what cools you, not the wetness.
      That is why a wet day feels hotter.
    background:
      - >-
          Why the order is graded whole. A sequence is a claim that each step needs the
          one before it to have happened. Get one pair the wrong way round and the claim
          is wrong, even if everything else lines up. That is why there is no part
          credit.
      - >-
          Why the ends are the place to start. The first and last steps are usually the
          easiest to be sure of, because one has nothing before it and the other has
          nothing after it. Fixing those two leaves fewer ways for the middle to go, and
          the middle is where the real question usually is.
      - >-
          What the rail can be ordered on. Often it is time. It can also be cost, or
          risk, or what you can still undo afterwards — do the steps that change nothing
          before the ones that change something for good. A step that destroys the
          sample can only be last.
    assumes:
      - water dries up in the air
    takeaway: The body uses physical processes, not magic, to help control temperature.
    format: SEQUENCE
    why: Sweating alone does not cool you. The drying is what cools you. Here is the order. You get warm. Sweat comes out on your skin. Some of it dries into the air. Drying needs energy, and it takes that energy as heat from your skin. That is why a wet day feels so much hotter.
    cards:
      - The body becomes warmer during activity.
      - Sweat appears on the skin.
      - Some sweat evaporates into the air.
      - Evaporation carries away heat and helps cool the skin.
    order: [0, 1, 2, 3]
    answerText: The body becomes warmer during activity. -> Sweat appears on the skin. -> Some sweat evaporates into the air. -> Evaporation carries away heat and helps cool the skin.
  - group: DEF
    task: Who needs the team’s immediate attention first?
    title: Which Allergy Patient First? — Review 2
    setup: Sofia, Malik, and Chloe  •  Emergency Department
    scene: Three people arrive with possible allergy symptoms. Sofia has itchy eyes and is breathing normally. Malik has an itchy rash and is talking normally. Chloe has swelling around her mouth and is struggling to breathe. The emergency team is present.
    guide: >-
      All three need help. Ask of each what could get worse in minutes. Itchy eyes
      stay about the same. A big rash looks worse than a small one. How much skin it
      covers is not what makes it urgent.
    background:
      - >-
          Why first is a different question from best. When there is more than one call
          on the same hour, the value of doing something now is not how much it matters.
          It is how much is lost by doing it later. Something important that will be
          just as fixable in an hour can wait. Something small that will not be fixable
          can not.
      - >-
          What to look for in the options. Ask which one changes if you wait — a reading
          that is still moving, a person who is getting worse, a window that closes.
          Then ask which ones can only be done after something else. Those two questions
          usually leave one option standing.
      - >-
          Why only one answer is marked. Real shifts do all of these, in some order. The
          stop asks for the front of that order because that is the only part where the
          reasoning shows. Read the verdict afterwards even when you are right — it says
          what the others were waiting on, which is the rest of the answer.
    assumes:
      - you cannot go long without breathing
    takeaway: When breathing is threatened, urgency rises sharply.
    format: TRIAGE
    why: Swelling with trouble breathing can get dangerous in minutes. That is why Chloe goes first. Itchy eyes are horrible and they stay about the same. A big rash looks worse than a small one, but how much skin it covers is not what makes it urgent. You go by what could get worse fastest.
    rebuttals:
      - B. Sofia, because itchy eyes come first and treating them early stops the rest. — Itchy eyes are no fun. They do not get dangerous the way trouble breathing does.
      - C. Malik, because his rash covers a large area of skin. — A big rash looks worse than a small one. How much skin it covers is not what makes it urgent.
      - D. Whoever has been waiting longest, so the queue stays fair. — Waiting your turn is fair most places. Here the fair thing is the sickest person first.
    choices:
      - Chloe, because swelling with trouble breathing can be a medical emergency.
      - Sofia, because itchy eyes come first and treating them early stops the rest.
      - Malik, because his rash covers a large area of skin.
      - Whoever has been waiting longest, so the queue stays fair.
    answer: Chloe, because swelling with trouble breathing can be a medical emergency.
  - group: DEF
    task: Which comparison is most sensible?
    title: Allergy or Germ Clues? — Review 2
    setup: Sofia and Ty  •  Allergy Clinic
    scene: Sofia’s eyes itch every spring when pollen counts are high, and she has no fever. Ty from an earlier shift had fever, cough, and sick classmates. The allergist asks which pattern sounds more like an environmental allergy and which sounds more like an infection story.
    guide: >-
      Four answers, and both patients feel unwell. Ask of each what the pattern
      under it is. Does it come back every year with the pollen? Or did it start
      after being near somebody sick? Look at the story, not the feeling.
    background:
      - >-
          Why the wrong answers are worth reading. Each one is written to look right to
          somebody who made a particular mistake. Working out which mistake each one
          belongs to is most of the learning in this format — more than getting the
          right one, which you can sometimes do by feel.
      - >-
          Why sounding careful is not the same as being right. A long answer with a lot
          of detail in it feels safer, and it is easy to write one that is still wrong.
          The check that builds these questions measures option length across the whole
          game so the longest one is not the answer more often than chance. Reading is
          the only way through.
      - >-
          What the verdict adds. After you answer, the verdict says why each wrong
          option is wrong, in its own words. That is written for the reader who picked
          it. Read it even when you were right, because being right for a shaky reason
          is the thing that catches up with you two stops later.
    assumes:
      - some things happen at the same time every year
    takeaway: Doctors compare patterns, timing, and exposures instead of relying on one clue.
    format: CASEBOOK
    why: Look at the pattern, not just the word. Sofia itches when the pollen comes. It happens every year. That fits an allergy. Ty has a fever. He was near people who were sick. That fits a germ. Both feel unwell. The stories under them are not the same.
    rebuttals:
      - B. Both fit an allergy pattern, because both patients feel unwell at the same time of year. — The season is a real clue. Ty was also near sick people, and that points somewhere else.
      - C. Sofia’s itching fits an infection, because germs can make skin itch; Ty’s fever fits an allergy. — The two are swapped. Itching that comes back with the pollen is the allergy pattern.
      - D. Neither pattern can be told apart until a blood test comes back. — A test would help. The patterns already point different ways, and that is worth saying now.
    choices:
      - Sofia’s repeating pollen-linked itching fits an allergy pattern; Ty’s fever plus sick contacts fits an infection pattern.
      - Both fit an allergy pattern, because both patients feel unwell at the same time of year.
      - Sofia’s itching fits an infection, because germs can make skin itch; Ty’s fever fits an allergy.
      - Neither pattern can be told apart until a blood test comes back.
    answer: Sofia’s repeating pollen-linked itching fits an allergy pattern; Ty’s fever plus sick contacts fits an infection pattern.
  - group: DEF
    task: Put the junior-doctor actions in order.
    title: Emergency Team Handoff — Review 2
    setup: Chloe  •  Family Room
    scene: The team is helping Chloe now. In this game you do not pick or give medicine. Your job is to get the right grown-ups fast and tell them the story.
    guide: >-
      All four steps happen. Ask which clock is already running. The team takes time
      to come, so calling is first. Then watch her breathing, because that changes
      fastest. Writing it down is last, so nobody has to guess the order.
    background:
      - >-
          Why the order is graded whole. A sequence is a claim that each step needs the
          one before it to have happened. Get one pair the wrong way round and the claim
          is wrong, even if everything else lines up. That is why there is no part
          credit.
      - >-
          Why the ends are the place to start. The first and last steps are usually the
          easiest to be sure of, because one has nothing before it and the other has
          nothing after it. Fixing those two leaves fewer ways for the middle to go, and
          the middle is where the real question usually is.
      - >-
          What the rail can be ordered on. Often it is time. It can also be cost, or
          risk, or what you can still undo afterwards — do the steps that change nothing
          before the ones that change something for good. A step that destroys the
          sample can only be last.
    story: The emergency clinicians are treating Chloe. Your junior-doctor job is not to choose or give medicine. Your job is to get the right adults, stay organized, and pass along the key story.
    assumes:
      - help takes time to arrive
    takeaway: In an emergency the first action is the one with a clock on it, and the last is the one that protects the record.
    format: SEQUENCE
    why: Call first. That clock is running whether or not you do anything else. Then watch her breathing, because it can change fastest. Then say what she met and when. The team needs that before they act. Write it down last, so nobody has to guess the order later.
    cards:
      - Call the emergency team, because everything else can happen while they come.
      - Stay with Chloe and watch her breathing, which is what can change fastest.
      - Tell the team what she was exposed to and when it started.
      - Write down what you saw, in the order it happened.
    order: [0, 1, 2, 3]
    answerText: 1. Call the emergency team, because everything else can happen while they come. 2. Stay with Chloe and watch her breathing, which is what can change fastest. 3. Tell the team what she was exposed to and when it started. 4. Write down what you saw, in the order it happened.
  - group: DEF
    task: Which matching set is most sensible?
    title: How Might It Spread? — Review 3
    setup: Ty, Ana, and Lena  •  Infection Control Desk
    scene: The infection-control nurse gives you three stories. Ty was around coughing classmates. Ana ate food that several relatives also ate before becoming sick. Lena touched a shared toy and then rubbed her nose.
    guide: >-
      Four sets, and germs travel in more than one way. Ask of each person what they
      did. Coughed near others? Ate something? Touched a handle? The story is what
      tells you which way the germ came.
    background:
      - >-
          Why the wrong answers are worth reading. Each one is written to look right to
          somebody who made a particular mistake. Working out which mistake each one
          belongs to is most of the learning in this format — more than getting the
          right one, which you can sometimes do by feel.
      - >-
          Why sounding careful is not the same as being right. A long answer with a lot
          of detail in it feels safer, and it is easy to write one that is still wrong.
          The check that builds these questions measures option length across the whole
          game so the longest one is not the answer more often than chance. Reading is
          the only way through.
      - >-
          What the verdict adds. After you answer, the verdict says why each wrong
          option is wrong, in its own words. That is written for the reader who picked
          it. Read it even when you were right, because being right for a shaky reason
          is the thing that catches up with you two stops later.
    assumes:
      - germs are too small to see
    takeaway: Knowing the route helps people choose the right prevention strategy.
    format: CASEBOOK
    why: Germs do not all travel the same way. Some ride in tiny drops from a cough. Some are in food that was not cooked or kept right. Some sit on a doorknob until a hand picks them up. That is why the story matters. What somebody did tells you which way the germ came.
    rebuttals:
      - B. Ty—air droplets; Ana—hands/surfaces; Lena—food route — Ana and Lena are swapped. Ana's clue was something she ate.
      - C. Ty—hands/surfaces; Ana—air droplets; Lena—food route — Ty and Ana are swapped. Ty was near someone who was coughing.
      - D. Ty—food route; Ana—hands/surfaces; Lena—air droplets — All three have moved along by one. None of them lines up with its own story.
    choices:
      - Ty—air droplets; Ana—food route; Lena—hands/surfaces
      - Ty—air droplets; Ana—hands/surfaces; Lena—food route
      - Ty—hands/surfaces; Ana—air droplets; Lena—food route
      - Ty—food route; Ana—hands/surfaces; Lena—air droplets
    answer: Ty—air droplets; Ana—food route; Lena—hands/surfaces

# Estimate specs applied by lesson title, across a lesson and its reviews.
estimatesByTitle:
  Count the Breaths:
    prompt: The nurse counts Mrs. Grant’s breathing while she rests comfortably.
    question: She counted 5 breaths in 15 seconds. Estimate the count for a whole minute.
    labels:
      - 5 breaths  (counted)
      - 4  (fifteen-second parts in a minute)
      - 15 seconds  (how long she counted)
      - 60 seconds  (1 minute)
      - 2  (halves of a minute)
    values: [5, 4, 15, 60, 2]
    slots: 2
    template: "{0} × {1}"
    formula: a*b
    correct: [0, 1]
    target: 20
    tolerance: 0.5
    units: breaths per minute
    solution: 5 breaths × 4 fifteen-second parts = 20 breaths per minute.
    explanation: A minute holds four fifteen-second parts, so a fifteen-second count is multiplied by four. Counting for the short window and scaling up is how it is done at the bedside — a full minute of standing still changes how somebody breathes.
  Pulse Math:
    prompt: Jordan is resting after climbing the stairs and the therapist takes his pulse.
    question: She counted 18 beats in 15 seconds. Estimate the count for a whole minute.
    labels:
      - 18 beats  (counted)
      - 4  (fifteen-second parts in a minute)
      - 15 seconds  (how long she counted)
      - 60 seconds  (1 minute)
      - 3  (twenty-second parts in a minute)
    values: [18, 4, 15, 60, 3]
    slots: 2
    template: "{0} × {1}"
    formula: a*b
    correct: [0, 1]
    target: 72
    tolerance: 0.5
    units: beats per minute
    solution: 18 beats × 4 fifteen-second parts = 72 beats per minute.
    explanation: "The same scaling as a breathing count, and the same reason for the short window. Note what it is not: a number that decides anything on its own. What the team watches is the same person’s count before and after, and whether it settles."
  The Drink Tracker:
    prompt: Mrs. Lee’s tracker shows what she drank today. The chart on the wall says a body her size loses about 8 cups of water a day, through breathing, sweating and urine.
    question: How many cups short of what her body lost is she?
    labels:
      - 2 cups  (morning)
      - 1 cup  (with lunch)
      - 3 cups  (later)
      - 8 cups  (what her body loses in a day)
      - 10 cups  (what the jug holds)
      - 3 rows  (how many entries)
    values: [2, 1, 3, 8, 10, 3]
    slots: 4
    template: "{3} − ( {0} + {1} + {2} )"
    formula: d - (a + b + c)
    correct: [0, 1, 2, 3]
    target: 2
    tolerance: 0.5
    units: cups
    solution: She drank 6 cups and lost about 8, so she is about 2 cups short.
    explanation: Water going in has to keep up with water going out, and the tracker only shows one side of that. The jug is how much she could drink, not how much she did.
  Therapy Sets:
    prompt: Mr. Diaz’s therapist has chosen a set of gentle leg lifts for him.
    question: The plan is 3 sets of 5 lifts. Estimate the total number of lifts.
    labels:
      - 3 sets
      - 5 lifts in a set
      - 2 rest breaks
      - 10 minutes  (how long the session runs)
      - 1 leg at a time
    values: [3, 5, 2, 10, 1]
    slots: 2
    template: "{0} × {1}"
    formula: a*b
    correct: [0, 1]
    target: 15
    tolerance: 0.5
    units: leg lifts
    solution: 3 sets × 5 lifts = 15 lifts.
    explanation: Groups of a thing multiply; they do not add. Three sets and five lifts added together gives eight, which is neither the number of sets nor the number of lifts.
  Temperature Difference:
    prompt: "The chart holds two temperatures for Ms. Kim: 98 °F at the first reading and 101 °F 3 hours later."
    question: How fast is her temperature rising, in degrees per hour?
    labels:
      - 101 °F  (later reading)
      - 98 °F  (earlier reading)
      - 3 hours  (between the 2 readings)
      - 100 °F  (the round number on the scale)
      - 2 readings  (how many are charted)
    values: [101, 98, 3, 100, 2]
    slots: 3
    template: ( {0} − {1} ) ÷ {2}
    formula: (a - b) / c
    correct: [0, 1, 2]
    target: 1
    tolerance: 0.2
    units: °F per hour
    solution: It rose 3 °F over 3 hours, so about 1 °F each hour.
    explanation: A rise of 3 degrees means 1 thing over 3 hours and something quite different over 20 minutes. A rate needs both the change and the time it took, which is why the chart records when each reading was taken.

# --------------------------------------------------------------- the warm-ups
warmups:
  greet:
    title: Say hello to the team before your first shift
    why: >-
      Lots of people work on this floor. Doctors, nurses, and the people who bring the food.
      You will need to ask them things all week. Go and meet as many of them as you can. It is easier to ask
      somebody a question when you know their name.
  trial-near:
    title: Walk the whole floor one time
    why: >-
      The rooms all look the same from the hall. Walk past every one now, while it is quiet.
      Later somebody will need you in a hurry. You want to know which way to go without
      stopping to read the signs.
  follow:
    title: Walk with Nurse Alex on the round
    why: >-
      Nurse Alex checks on every child, in the same order, every morning. Walk along behind
      and watch. You will see where she stops and what she looks at. That is how the round is
      learned.
  hunt:
    title: Six pumps, and the list says four
    item: { name: pump, plural: pumps }
    why: >-
      Each pump helps one child get their medicine. Two are not where the list says they are.
      A pump nobody can find is no help at all. Go and find them before somebody needs one.
  canvass:
    title: Ask the children how they slept
    why: >-
      The night nurse wrote down that the ward was quiet. Some of the children say it was not.
      How well they slept helps the doctors decide what to change today. Ask enough of them to
      be sure.
  evade:
    title: Keep out of the way of the fast trolley
    why: >-
      A child is being taken to the scanner right now. The hall is narrow. If you stand in it,
      they have to stop. Get where you are going the other way round, and let them past.
  tag:
    title: Catch Dr. Patel before she goes into the meeting
    why: >-
      Dr. Patel runs the emergency department. She has the notes on the breathing of Amara, a patient on the ward. The
      meeting she is going into lasts one hour. Nobody can plan Amara's day until they see
      those notes. Go and find her first.

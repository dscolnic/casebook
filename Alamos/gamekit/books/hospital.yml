  - group: RESP
    task: Put the simplified blood loop in order, starting at the heart.
    title: The Blood Loop — Review 2
    setup: Mr. Cho  •  Cardiology Corner
    scene: A heart model sits on the table. Four arrow cards lie beside it. The nurse says blood moves in a loop. Heart, lungs, heart, body, and back.
    guide: >-
      These four make a loop. Ask what each step needs before it. Blood cannot bring
      oxygen to the body before it picks any up. And it picks it up in the lungs.
      Start at the heart and follow it round.
    background:
      - >-
          Why the order is graded whole. A sequence is a claim that each step needs the
          one before it to have happened. Get one pair the wrong way round and the claim
          is wrong, even if everything else lines up. That is why there is no part
          credit.
      - >-
          Why the ends are the place to start. The first and last steps are usually the
          easiest to be sure of, because one has nothing before it and the other has
          nothing after it. Fixing those two leaves fewer ways for the middle to go, and
          the middle is where the real question usually is.
      - >-
          What the rail can be ordered on. Often it is time. It can also be cost, or
          risk, or what you can still undo afterwards — do the steps that change nothing
          before the ones that change something for good. A step that destroys the
          sample can only be last.
    story: "A heart model has four big arrow cards. The cardiology nurse says blood keeps moving in a loop: heart, lungs, heart, body, and back again."
    assumes:
      - the heart is a pump
    takeaway: Circulation is a loop, not a one-way trip.
    format: SEQUENCE
    why: Blood does not go one way and stop. It goes around and around. The heart pumps it to the lungs. In the lungs it picks up oxygen. The heart pumps it out to the body. Then it comes back. That is a loop, and it never stops all day or all night.
    cards:
      - The heart pumps blood toward the lungs.
      - In the lungs, blood picks up oxygen.
      - The heart pumps oxygen-rich blood to the body.
      - Blood returns from the body to the heart.
    order: [0, 1, 2, 3]
    answerText: The heart pumps blood toward the lungs. -> In the lungs, blood picks up oxygen. -> The heart pumps oxygen-rich blood to the body. -> Blood returns from the body to the heart.

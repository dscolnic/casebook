  - group: MOVE
    task: Put the steps of healing in order.
    title: How a Scrape Heals — Review 2
    setup: Ella  •  Wound Care Room
    scene: Ella has a small scrape. The hospital team has cleaned and covered it. She asks what her body will do next.
    guide: >-
      These four are stages, not choices. Ask what has to happen first. New skin
      cannot grow under a lid that is not there. And a clot has to close the gap
      first. The body shuts the door, then does the repairs.
    background:
      - >-
          Why the order is graded whole. A sequence is a claim that each step needs the
          one before it to have happened. Get one pair the wrong way round and the claim
          is wrong, even if everything else lines up. That is why there is no part
          credit.
      - >-
          Why the ends are the place to start. The first and last steps are usually the
          easiest to be sure of, because one has nothing before it and the other has
          nothing after it. Fixing those two leaves fewer ways for the middle to go, and
          the middle is where the real question usually is.
      - >-
          What the rail can be ordered on. Often it is time. It can also be cost, or
          risk, or what you can still undo afterwards — do the steps that change nothing
          before the ones that change something for good. A step that destroys the
          sample can only be last.
    assumes:
      - a cut stops bleeding on its own after a while
    takeaway: Skin is living tissue that can repair many small injuries.
    format: SEQUENCE
    why: Healing goes in stages. First the skin is broken open. Then the blood clots and closes the gap. Then a scab forms and covers it like a lid. Under that lid, new skin grows. The body shuts the door first and does the repairs after. That is why picking a scab sets it back.
    cards:
      - The skin barrier is broken by the scrape.
      - Blood clotting helps close the damaged area.
      - A scab or protective covering forms while healing continues.
      - New skin grows underneath as the area repairs.
    order: [0, 1, 2, 3]
    answerText: The skin barrier is broken by the scrape. -> Blood clotting helps close the damaged area. -> A scab or protective covering forms while healing continues. -> New skin grows underneath as the area repairs.

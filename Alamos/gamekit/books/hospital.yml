            - the same movement
            - the same arm
            - the same grip meter
          truth: rests
          baseline: 12
          response: 14
          noise: 2
          hint: The set can be run again as often as you like. Change one thing, run it, and read the meter.
          run: Run the set
          commit: Name the one that is doing it

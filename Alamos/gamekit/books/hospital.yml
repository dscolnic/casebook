          usually leave one option standing.
      - >-
          Why only one answer is marked. Real shifts do all of these, in some order. The
          stop asks for the front of that order because that is the only part where the
          reasoning shows. Read the verdict afterwards even when you are right — it says
          what the others were waiting on, which is the rest of the answer.
    assumes:
      - only one person can go in first
    takeaway: Triage means asking, “Which problem could become dangerous fastest?”
    format: TRIAGE
    why: This is the big pattern of the whole course. Breathing trouble can get dangerous quickly, so it goes first. Feeling lightheaded is worth a look. A fever needs care. A sore ankle needs a picture. All of them are real. Only one of them is getting worse while everybody waits.
    rebuttals:
      - B. Mr. Alvarez, because feeling lightheaded could mean he is about to faint. — This is worth a quick check. Hard breathing is still the bigger worry.
      - C. Mei, because a fever could spread to the other people waiting. — A fever needs care. It does not get worse as fast as trouble breathing.
      - D. DeShawn, because he has been standing on a sore ankle the longest. — Waiting a long time is no fun. It does not make a sore ankle the most urgent.
    choices:
      - Nora, because significant breathing trouble can affect the whole body quickly.
      - Mr. Alvarez, because feeling lightheaded could mean he is about to faint.
      - Mei, because a fever could spread to the other people waiting.
      - DeShawn, because he has been standing on a sore ankle the longest.
    answer: Nora, because significant breathing trouble can affect the whole body quickly.
  - group: TRI
    task: Which routing set is best?
    title: Send Them to the Right Place — Review 2
    setup: Five patients from the waiting board  •  Whole-Hospital Map
    scene: After Nora is with the emergency team, five other patients need the best next stop. Match each clue to the hospital area that can answer the most useful question.
    guide: >-
      Five people and five places. Pair them by asking what each clue needs. A
      picture of a bone? A check for germs? Some numbers taken? Send them all one
      place and most of them wait for the wrong thing.
    background:
      - >-
          Why the wrong answers are worth reading. Each one is written to look right to
          somebody who made a particular mistake. Working out which mistake each one
          belongs to is most of the learning in this format — more than getting the
          right one, which you can sometimes do by feel.
      - >-
          Why sounding careful is not the same as being right. A long answer with a lot
          of detail in it feels safer, and it is easy to write one that is still wrong.
          The check that builds these questions measures option length across the whole
          game so the longest one is not the answer more often than chance. Reading is
          the only way through.
      - >-
          What the verdict adds. After you answer, the verdict says why each wrong
          option is wrong, in its own words. That is written for the reader who picked
          it. Read it even when you were right, because being right for a shaky reason
          is the thing that catches up with you two stops later.
    assumes:
      - a hospital has different rooms for different things
    takeaway: Hospitals are teams of specialized places that work together.
    format: CASEBOOK
    why: Different clues need different tools. A sore ankle needs a picture of the bone. A fever needs a check for germs. Feeling faint needs some numbers taken. Itchy eyes need an allergy check. A scrape needs the wound team. Send them all one place and most of them wait for the wrong thing.
    rebuttals:
      - B. DeShawn—Imaging/orthopedics; Mei—wound-care check; Mr. Alvarez—exam and measurements; Fatima—allergy/eye evaluation; Owen—exam/infection evaluation — Mei and Owen are swapped. Mei has a fever, and Owen has a scrape to clean.
      - C. DeShawn—wound-care check; Mei—imaging/orthopedics; Mr. Alvarez—allergy/eye evaluation; Fatima—exam and measurements; Owen—exam/infection evaluation — Almost every one is in the wrong room. A sore ankle needs a picture of the bone.
      - D. Send all five to the emergency team, since that is where Nora went. — The emergency team is for the most urgent patient. Five more people would slow them down.
    choices:
      - DeShawn—Imaging/orthopedics; Mei—exam/infection evaluation; Mr. Alvarez—exam and measurements; Fatima—allergy/eye evaluation; Owen—wound-care check
      - DeShawn—Imaging/orthopedics; Mei—wound-care check; Mr. Alvarez—exam and measurements; Fatima—allergy/eye evaluation; Owen—exam/infection evaluation
      - DeShawn—wound-care check; Mei—imaging/orthopedics; Mr. Alvarez—allergy/eye evaluation; Fatima—exam and measurements; Owen—exam/infection evaluation
      - Send all five to the emergency team, since that is where Nora went.
    answer: DeShawn—Imaging/orthopedics; Mei—exam/infection evaluation; Mr. Alvarez—exam and measurements; Fatima—allergy/eye evaluation; Owen—wound-care check

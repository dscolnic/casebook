  - group: MOVE
    task: Why is rest a sensible next step in this scene?
    title: Tired Muscles — Review 2
    setup: Amara  •  Physical Therapy Gym
    scene: Amara has repeated the same gentle therapy motion many times. Her arm muscles feel tired, but there is no new injury. The therapist ends the set and lets her rest.
    guide: >-
      Four reasons a muscle might feel tired. Ask of each whether it means something
      is wrong. Muscles use energy when they work. Do the same thing many times and
      they run low. That is normal, and it is not the same as hurt.
    background:
      - >-
          Why the wrong answers are worth reading. Each one is written to look right to
          somebody who made a particular mistake. Working out which mistake each one
          belongs to is most of the learning in this format — more than getting the
          right one, which you can sometimes do by feel.
      - >-
          Why sounding careful is not the same as being right. A long answer with a lot
          of detail in it feels safer, and it is easy to write one that is still wrong.
          The check that builds these questions measures option length across the whole
          game so the longest one is not the answer more often than chance. Reading is
          the only way through.
      - >-
          What the verdict adds. After you answer, the verdict says why each wrong
          option is wrong, in its own words. That is written for the reader who picked
          it. Read it even when you were right, because being right for a shaky reason
          is the thing that catches up with you two stops later.
    assumes:
      - you get tired after doing something over and over
    takeaway: Body tissues can change their activity depending on what the body is doing.
    format: DIAGNOSIS
    why: Muscles use energy when they work. Do the same thing lots of times and they run low. Then they feel tired and weak. That is normal, and it is not the same as being hurt. Rest lets them fill back up. In therapy the rest is part of the plan, not a sign to stop.
    rebuttals:
      - B. The arm is injured, and rest is how an injury heals. — Nothing here says he is hurt. Tired and hurt are not the same thing.
      - C. Muscles only grow while a person is resting, so the set is finished. — Rest does help. That is not a reason to stop in the middle of the plan.
      - D. Tiredness means the therapy is not working and should be changed. — Getting tired is what is supposed to happen. It means the muscle is working.

          What the verdict adds. After you answer, the verdict says why each wrong
          option is wrong, in its own words. That is written for the reader who picked
          it. Read it even when you were right, because being right for a shaky reason
          is the thing that catches up with you two stops later.
    assumes:
      - skin covers the whole outside of you
    takeaway: Skin protects the body, but the skin itself also needs protection.
    format: DIAGNOSIS
    why: Skin does several jobs at once. It holds water in. It feels touch. It cools you with sweat. But its biggest job is being a wall. Nothing gets in through skin that is whole. A scrape makes a hole in the wall, and that is the job it just lost.
    rebuttals:
      - B. Keeping water inside the body — Skin does hold water in. A small scrape lets germs in long before it dries anyone out.
      - C. Helping the body feel touch and temperature — Skin does feel things. The scrape did not take that away.
      - D. Helping the body cool down by sweating — Skin does cool the body. One small scrape does not stop the sweating.
    choices:
      - Protection from the outside environment
      - Keeping water inside the body
      - Helping the body feel touch and temperature
      - Helping the body cool down by sweating
    answer: Protection from the outside environment
  - group: MOVE
    task: Which hospital tool best matches that job?
    title: Why Take an X-Ray? — Review 3
    setup: Eli  •  Emergency Imaging
    scene: Eli fell from his bike. His wrist hurts and is swollen. The doctor wants a picture that can help the team look for a broken bone without opening the skin.
    guide: >-
      Four tools, and all four are good ones. Ask of each what it shows. Warmth?
      Sound? A shape? A size? The clue here is about a bone under the skin. So which
      tool shows what you cannot see?
    background:
      - >-
          Why the wrong answers are worth reading. Each one is written to look right to
          somebody who made a particular mistake. Working out which mistake each one
          belongs to is most of the learning in this format — more than getting the
          right one, which you can sometimes do by feel.

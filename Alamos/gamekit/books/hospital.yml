  - group: BRAIN
    task: Who should the hospital team check first?
    title: After the Head Bump — Review 2
    setup: Arjun and two other children  •  Observation Room
    scene: Three children come in from the playground. Arjun bumped his head. Now he looks muddled and cannot answer easy questions. Bea has a small elbow scrape. Cole has a sore finger but is talking normally.
    guide: >-
      All three need seeing. Ask of each what could be getting worse right now. You
      can see a scrape. You cannot see a brain. So a change in how somebody thinks
      is the clue that matters after a head bump.
    background:
      - >-
          Why first is a different question from best. When there is more than one call
          on the same hour, the value of doing something now is not how much it matters.
          It is how much is lost by doing it later. Something important that will be
          just as fixable in an hour can wait. Something small that will not be fixable
          can not.
      - >-
          What to look for in the options. Ask which one changes if you wait — a reading
          that is still moving, a person who is getting worse, a window that closes.
          Then ask which ones can only be done after something else. Those two questions
          usually leave one option standing.
      - >-
          Why only one answer is marked. Real shifts do all of these, in some order. The
          stop asks for the front of that order because that is the only part where the
          reasoning shows. Read the verdict afterwards even when you are right — it says
          what the others were waiting on, which is the rest of the answer.
    assumes:
      - your brain is inside your head
    takeaway: In real life, children should tell an adult right away after a significant head injury or new concerning symptoms.
    format: TRIAGE
    why: You can see a scrape and you cannot see a brain. So a change in how somebody thinks is the clue that matters after a head bump. Arjun is mixed up, and that is new. Bea's scrape can be cleaned. Cole's finger can wait for a picture. Only one of these could be getting worse right now.
    rebuttals:
      - B. Bea, because her scrape is bleeding and can be cleaned quickly. — A scrape does need cleaning. Bleeding you can see is not the same as danger.
      - C. Cole, because a sore finger might be broken and needs an image. — A picture of the finger can wait. A change in how someone thinks cannot.
      - D. Arjun last, because he is walking and talking on his own. — Walking and talking is good news. Being mixed up after a head bump is still a warning.
    choices:
      - Arjun, because confusion after a head injury can be an important warning sign.
      - Bea, because her scrape is bleeding and can be cleaned quickly.
      - Cole, because a sore finger might be broken and needs an image.
      - Arjun last, because he is walking and talking on his own.
    answer: Arjun, because confusion after a head injury can be an important warning sign.

  - group: RESP
    task: Say what his pulse will be after he rests. Then count it.
    title: Why the Faster Pulse? — Review 2
    setup: Jordan  •  Treatment Room
    scene: Jordan climbed the stairs. Right after, his pulse was 120. Sitting still it had been 76. He sits down now to rest. The doctor asks what it will be in five minutes.
    guide: >-
      Say a number first. Write it down before he rests. Then he sits for five
      minutes. Then you count his pulse for a minute. His muscles are done
      working now, so think about what they stopped needing.
    background:
      - >-
          What a pulse is. Each beat pushes blood along. You can feel it in the wrist.
          Counting the beats in a minute tells you how fast the heart is working.
      - >-
          Why it comes back down. Working muscles need extra oxygen. Blood carries the
          oxygen to them. When the muscles stop working, they stop needing extra. So the
          heart can slow down again.
      - >-
          Why the number goes first. If you rest him and then explain the count, any
          answer sounds right. If you say your number first, the count can tell you
          whether you knew what his body would do.
    assumes:
      - muscles work harder when you climb stairs
      - resting muscles need less oxygen than working muscles
    takeaway: Body systems work together. Muscles, lungs, blood, and heart all change during exercise.
    format: VERIFY
    question: Say what Jordan's pulse will be after five minutes of rest. Then count it.
    answerText: About 80 beats a minute, close to the 76 he started at. His muscles stopped needing extra oxygen, so his heart slowed down again.
    why: Jordan's pulse was 76 while he sat. The stairs took it to 120. His leg muscles were working hard. Working muscles need extra oxygen. Oxygen rides in the blood. So his heart beat faster to move the blood along. Then he stopped and sat down. His muscles stopped working. They stopped needing the extra oxygen. So his heart slowed down. His pulse came back to about 80. A pulse is not one fixed number. It goes up when the body asks for more. It comes down when the body stops asking.
    verify:
      prediction:
        label: Jordan's pulse after five minutes of rest
        unit: beats a minute
        min: 60
        max: 200
        step: 5
      truth: 80
      passRatio: [0.7, 1.4]
      intervention:
        label: Jordan sits down and rests for five minutes
        note: right after the stairs his pulse was 120, and sitting still it had been 76
        outcome: He sits quietly. His breathing settles back to normal.
      measurement:
        label: Count his pulse for a minute
        note: two fingers on the wrist, watch the clock
        cost: 1
        costUnit: minutes
      unmeasuredMoral: If you say the pulse came down without counting it, you never find out whether you knew what his body would do.
  - group: RESP
    task: Put the path of a breath in order.
    title: Follow One Breath — Review 3
    setup: Priya  •  Respiratory Room
    scene: "Priya takes a deep breath. She asks where the air goes. You have four picture cards: the nose and mouth, the windpipe, the lungs, and the blood."
    guide: >-
      These four are one journey. Ask what has to happen first. Air cannot reach the
      lungs before it goes down the windpipe. And oxygen cannot get into the blood
      before the air arrives. The path helps you guess where a problem is.
    background:
      - >-
          Why the order is graded whole. A sequence is a claim that each step needs the
          one before it to have happened. Get one pair the wrong way round and the claim
          is wrong, even if everything else lines up. That is why there is no part
          credit.
      - >-
          Why the ends are the place to start. The first and last steps are usually the
          easiest to be sure of, because one has nothing before it and the other has
          nothing after it. Fixing those two leaves fewer ways for the middle to go, and
          the middle is where the real question usually is.
      - >-
          What the rail can be ordered on. Often it is time. It can also be cost, or
          risk, or what you can still undo afterwards — do the steps that change nothing
          before the ones that change something for good. A step that destroys the
          sample can only be last.
    story: "Priya asks what happens to the air when she takes a deep breath. The respiratory therapist gives you four picture cards: nose and mouth, windpipe, lungs, and blood carrying oxygen away."
    assumes:
      - air goes in through your nose and mouth
    takeaway: The lungs are the meeting place between outside air and the blood.
    format: SEQUENCE
    why: Air has to travel to get where it is needed. In through the nose or mouth. Down the windpipe. Into the lungs. Only then can oxygen move into the blood. The blood carries it to every part of the body. Knowing the path helps you guess where a problem might be.
    cards:
      - Air enters through the nose or mouth.
      - Air moves down the windpipe.
      - Air reaches the lungs.
      - Oxygen moves into the blood to travel around the body.
    order: [0, 1, 2, 3]
    answerText: Air enters through the nose or mouth. -> Air moves down the windpipe. -> Air reaches the lungs. -> Oxygen moves into the blood to travel around the body.
  - group: RESP
    task: Which body system should the team focus on first?
    title: The Dusty-Room Clue — Review 3
    setup: Noah  •  Pediatric Wing
    scene: Noah started wheezing after helping clean a dusty storage room. He can still talk, but each breath makes a small whistling sound. The team is already with him. They ask which body system the clue points to.
    guide: >-
      Four body parts, and one sound. Ask of each whether it could whistle on every
      breath. A whistle needs air squeezing through a narrow gap. So ask what the
      air is passing through. One clue alone means little. This one names a part.
    background:
      - >-
          Why the wrong answers are worth reading. Each one is written to look right to
          somebody who made a particular mistake. Working out which mistake each one
          belongs to is most of the learning in this format — more than getting the
          right one, which you can sometimes do by feel.
      - >-
          Why sounding careful is not the same as being right. A long answer with a lot
          of detail in it feels safer, and it is easy to write one that is still wrong.
          The check that builds these questions measures option length across the whole
          game so the longest one is not the answer more often than chance. Reading is
          the only way through.
      - >-
          What the verdict adds. After you answer, the verdict says why each wrong
          option is wrong, in its own words. That is written for the reader who picked
          it. Read it even when you were right, because being right for a shaky reason
          is the thing that catches up with you two stops later.
    assumes:
      - blowing through a small gap makes a whistle
    takeaway: A clue is useful when you connect it to the body system that could produce it.
    format: DIAGNOSIS
    why: A whistle needs air squeezing through a narrow space. Noah makes that sound with every breath. So it is the breathing tubes that got narrow. That is what wheezing is. One clue on its own does not mean much. This one is useful because you can name the part that made it.
    rebuttals:
      - B. The throat and voice box, because that is where whistling sounds are made. — The voice box makes talking sounds. This whistle comes with every breath, from lower down.
      - C. The heart and blood vessels, because a whistle could be blood rushing. — The heart makes a thump you hear with a stethoscope. It does not whistle when Noah breathes.
      - D. The digestive system, because Noah breathed in dust and swallowed some. — Dust may reach his stomach. A stomach does not make a sound with each breath.
    choices:
      - The breathing system — the airways and lungs.
      - The throat and voice box, because that is where whistling sounds are made.
      - The heart and blood vessels, because a whistle could be blood rushing.
      - The digestive system, because Noah breathed in dust and swallowed some.
    answer: The breathing system — the airways and lungs.

  - title: Temperature Trouble
    objective: Homeostasis, sweating, shivering, and body temperature
    briefing: Homeostasis, sweating, shivering, and body temperature
    stake: Fourteenth shift. Jamal, a patient, is hot and sweating after exercise. Ivy, a patient, got caught in the rain and is shivering. Ms. Kim was 98 degrees at 9 o'clock and 101 at 12. Nurse Alex Lee wrote both of Ms. Kim's numbers down and left the times beside them. Today you work out what each body is doing and how fast the fever is climbing. One number is just a number. Two numbers and a clock tell you how fast.
    takeaway: Shift complete
    stops:
      - group: DEF
        call: Hot or Cold Response?
        task: Which explanation matches the clues?
        title: Hot or Cold Response?
        concept: Homeostasis and feedback
        setup: Jamal and Ivy  •  Observation Ward
        scene: Jamal is hot after exercise. He is sweating. Ivy got caught in the rain. She is cold and shivering. Both are with the team now. The body works hard to hold one steady temperature. Cells only work well in a narrow range. When it gets too warm, the body loses heat. When it gets too cold, the body makes heat.
        guide: >-
          Four answers about sweating and shivering. Ask of each whether the two do the
          same thing. Sweat dries, and drying takes heat away. Shivering is muscles
          working, and working muscles make heat. So one cools and one warms.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - you sweat when you are hot and shiver when you are cold
        takeaway: Homeostasis means the body works to keep important conditions within a useful range.
        format: DIAGNOSIS
        why: These two do opposite things. Sweat sits on your skin and dries. Drying takes heat away with it, so you cool down. Shivering is your muscles shaking fast, and working muscles make heat. So one cools and one warms. Your body uses both to stay at about the same temperature all day.
        rebuttals:
          - B. Both make heat, because the body is trying to warm up either way. — Shivering does make heat. Sweating does the opposite, which is the whole point.
          - C. Sweating cools by wetting the skin; shivering cools by moving air. — Sweating does cool. Shivering is muscles working, and working muscles make heat.
          - D. Both are signs of being unwell rather than ways of holding a steady temperature. — You can be unwell and do both. A healthy body does both too, every day.
        choices:
          - Sweating helps cool; shivering uses muscle activity that helps make heat.
          - Sweating and shivering both make heat, because the body is trying to warm up either way.
          - Sweating cools by wetting the skin; shivering cools by moving air across it.
          - Both are signs of being unwell rather than ways of holding a steady temperature.
        answer: Sweating helps cool; shivering uses muscle activity that helps make heat.
      - group: DEF
        call: Temperature Difference
        task: How fast is her temperature rising, in degrees per hour?
        title: Temperature Difference
        setup: Ms. Kim  •  Nurse Station
        scene: A chart shows 2 numbers for Ms. Kim. The first is 98°F. The next is 101°F. The times beside them are three hours apart.
        guide: >-
          Two things matter here. How much it changed, and how long that took. Ask what
          the question wants. It wants a speed, so it needs both. One number alone is
          just a number. The same change in ten minutes would worry you more.
        story: A chart shows 2 temperatures for Ms. Kim. The earlier one is 98°F. The later one is 101°F, and the times beside them are 3 hours apart. One temperature alone is just a number. Two of them make a change, and the times make that change a speed. That is why charts keep the old readings and the clock beside them. The care team decides what it means.
        assumes:
          - you can take one number away from another
        takeaway: A change on its own is not enough; how long it took is what says whether it is fast.
        format: BALLPARK
        why: 101 take away 98 is 3. It took 3 hours. So it went up about 1 degree each hour. That is the whole trick. One number is just a number. Two numbers and a clock make a speed. The same 3 degrees in 10 minutes would be a much bigger worry.
        rebuttals:
          - A. 1°F — 101 is 3, not 1, above 98.
          - B. 2°F — 101 is 3, not 2, above 98.
          - D. 199°F — 199 comes from adding, but the question asks for the difference.
        estimate:
          givens:
            - Use the numbers shown

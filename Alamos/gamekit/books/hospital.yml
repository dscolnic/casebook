    answer: Muscles can get tired after repeated work and need recovery time.
  - group: MOVE
    task: How many leg lifts are in 3 sets of 5?
    title: Therapy Sets — Review 2
    setup: Mr. Diaz  •  Rehab Track
    scene: Mr. Diaz’s therapist has him do 3 sets of 5 gentle leg lifts. The therapist, not the player, chose the exercise plan.
    guide: >-
      Two things matter here. How many sets, and how many lifts in each. Ask what
      the question wants. It wants the whole lot. So one of them has to happen the
      other number of times.
    assumes:
      - a set is a group of the same thing
    takeaway: Repeated sets are groups, so multiplication helps count them quickly.
    format: BALLPARK
    why: There are 3 sets, and each set has 5 lifts. So it is 5 3 times, which is 15. This is why therapy is counted in sets. Counting the total helps the team see if it is getting easier or harder from one day to the next.

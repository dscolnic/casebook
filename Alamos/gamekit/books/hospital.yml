# Terms the game may explain in place.
glossary:
  - name: Antibody
    aliases:
      - antibody
      - antibodies
    def: A tiny helper your body makes that sticks to one kind of germ, so the rest of the team can find it.
  - name: Measurement
    aliases:
      - measurement
    def: A number found with a tool or careful count.
  - name: Observation
    aliases:
      - observation
    def: Something a doctor notices with eyes or ears.
  - name: Pulse
    aliases:
      - pulse
    def: The beat of the heart felt in the wrist or neck.
  - name: Triage
    aliases:
      - triage
    def: Deciding who needs help first based on how urgent the clue is.

# The campaign: One working day each, 3 stops and a callback from day 3.
missions:
  - title: Morning Rush
    objective: How doctors use clues and decide who needs help first
    briefing: How doctors use clues and decide who needs help first
    stake: It is your first shift. Three children come in at once. Ava, a patient, is quiet and breathing hard. Ben, a patient, is crying loudly about his ankle. Mia has not said anything at all. Nurse Alex Lee, who is showing you the ward today, says to watch all three before you choose. Today you decide who to see first, and you learn the three kinds of clue. The loudest patient is not always the one in the most trouble.
    takeaway: Shift complete
    stops:
      - group: TRI
        call: Who Needs You First?
        task: Which patient should move to the front of the line?
        title: Who Needs You First?
        setup: Ava, Ben, and Maya  •  Emergency Department
        scene: Three patients arrive at almost the same time. Ava sits very still and breathes hard. Ben can walk, but his ankle hurts. Maya, a patient, has an itchy patch on her arm. One exam room is free. Hospitals do not always help people in the order they arrive. Some problems stay the same for an hour. Others get worse fast. Picking who goes first is called triage.
        guide: >-
          All four people need help. That is not the question. Ask one thing of each.
          Which of them gets worse while you help somebody else? A sore ankle stays
          about the same. So does an itchy patch. Breathing is not like that.
        background:
          - >-
              Why first is a different question from best. When there is more than one call
              on the same hour, the value of doing something now is not how much it matters.
              It is how much is lost by doing it later. Something important that will be
              just as fixable in an hour can wait. Something small that will not be fixable
              can not.
          - >-
              What to look for in the options. Ask which one changes if you wait — a reading
              that is still moving, a person who is getting worse, a window that closes.
              Then ask which ones can only be done after something else. Those two questions
              usually leave one option standing.
          - >-
              Why only one answer is marked. Real shifts do all of these, in some order. The
              stop asks for the front of that order because that is the only part where the
              reasoning shows. Read the verdict afterwards even when you are right — it says
              what the others were waiting on, which is the rest of the answer.
        assumes:
          - your body needs air all the time
        takeaway: Doctors use urgency, not first-come-first-served order, when several patients need help at once.
        format: TRIAGE
        why: Breathing brings oxygen into the body. Every part needs it, all the time. So when breathing is hard, the whole body is in trouble fast. A sore ankle hurts and stays about the same. An itchy patch stays about the same too. You go to the one that can get worse quickest.
        rebuttals:
          - B. Ben, because you can see his injury and Ava is sitting quietly. — Ben can walk and talk. A hurt you can see is not always the one to fix first.
          - C. Maya, because a rash might spread to other people in the room. — An itchy patch can wait a little. Maya is breathing and talking just fine.
          - D. Whoever arrived first, so nobody waits longer than anybody else. — That is fair for a line at a shop. Here the sickest person goes first.
        choices:
          - Ava, because breathing trouble can affect the whole body quickly.
          - Ben, because you can see his injury and Ava is sitting quietly.
          - Maya, because a rash might spread to other people in the room.
          - Whoever arrived first, so nobody waits longer than anybody else.
        answer: Ava, because breathing trouble can affect the whole body quickly.
      - group: TRI
        call: Observation or Measurement?
        task: Which item is a measurement?
        title: Observation or Measurement?
        setup: Luis  •  Exam Room 3
        scene: Our patient Luis says his belly hurts. You can see that he is awake and talking. A nurse checks his temperature with a thermometer. She counts his pulse too. All of it goes on his chart. But the clues are not all the same kind. Some you notice. Some the patient tells you. Some come from a tool, as a number.
        guide: >-
          All four clues are real and useful. They come from different places. One you
          see. One the patient tells you. One comes from a tool, as a number. Ask of
          each where it came from. That is what decides this one.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - a tool can give you a number
        takeaway: Doctors combine observations, patient stories, and measurements. They are different kinds of clues.
        format: DIAGNOSIS
        why: Clues come in three kinds. Some you see, like a worried face. Some the patient tells you, like where it hurts. Some come from a tool, as a number. A thermometer gives a number. That makes it a measurement. All three kinds are useful. Knowing which kind you have tells you how sure you can be.
        rebuttals:
          - A. Our patient Luis says his belly hurts. — Pain is important information, but it is something Luis reports, not a tool measurement.
          - B. Luis looks worried. — Looking worried is an observation.
          - D. He skipped breakfast. — Skipping breakfast is part of the story or history.
        choices:
          - Our patient Luis says his belly hurts.
          - Luis looks worried.
          - His temperature is 98.7°F.
          - He skipped breakfast.
        answer: His temperature is 98.7°F.
      - group: TRI
        call: Your First Exam Room
        task: Put these steps in the best order.
        title: Your First Exam Room
        setup: Ben  •  Exam Room 5
        scene: Ben is here for his ankle check. The team has four things to do. Clean hands. Ben's story. A look at the ankle. A note for the next person.
        guide: >-
          All four steps happen. So ask what each one needs first. What is on your hands
          goes on to Ben. His story tells you where to look. And the note is for the
          nurse who comes after you.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim that each step needs the
              one before it to have happened. Get one pair the wrong way round and the claim
              is wrong, even if everything else lines up. That is why there is no part
              credit.
          - >-
              Why the ends are the place to start. The first and last steps are usually the
              easiest to be sure of, because one has nothing before it and the other has
              nothing after it. Fixing those two leaves fewer ways for the middle to go, and
              the middle is where the real question usually is.
          - >-
              What the rail can be ordered on. Often it is time. It can also be cost, or
              risk, or what you can still undo afterwards — do the steps that change nothing
              before the ones that change something for good. A step that destroys the
              sample can only be last.

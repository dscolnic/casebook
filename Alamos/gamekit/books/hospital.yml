    why: Blood does not go one way and stop. It goes around and around. The heart pumps it to the lungs. In the lungs it picks up oxygen. The heart pumps it out to the body. Then it comes back. That is a loop, and it never stops all day or all night.
    cards:
      - The heart pumps blood toward the lungs.
      - In the lungs, blood picks up oxygen.
      - The heart pumps oxygen-rich blood to the body.
      - Blood returns from the body to the heart.
    order: [0, 1, 2, 3]
    answerText: The heart pumps blood toward the lungs. -> In the lungs, blood picks up oxygen. -> The heart pumps oxygen-rich blood to the body. -> Blood returns from the body to the heart.
  - group: RESP
    task: 18 beats in 15 seconds is about how many beats in 60 seconds?
    title: Pulse Math — Review 4
    setup: Jordan  •  Rehab Hall
    scene: Jordan is resting after the stairs. The therapist counts 18 beats in 15 seconds. She asks you for the one minute number. This is math practice only.
    guide: >-
      Two things matter here. How many beats, and how long you counted for. Ask what
      the question wants. It asks about a whole minute. So work out how many of your
      parts fit in one. Nurses count short blocks to save time.
    story: Jordan is resting after climbing stairs. The therapist counts 18 beats in 15 seconds and asks for the one-minute estimate. The number is used only for this math game; real medical decisions belong to the clinical team.
    assumes:
      - a minute has 60 seconds
    takeaway: A pulse is a clue that the heart is beating and moving blood.
    format: BALLPARK
    why: 1 minute has 4 15-second parts. So 18 beats in 15 seconds is 18 4 times, which is 72. Each beat is one push of blood. You can feel that push with two fingers and a clock. It is one of the oldest checks in medicine.
    rebuttals:
      - A. 36 — 36 is only 18 × 2.
      - B. 54 — 54 is 18 × 3.
      - D. 180 — 180 is 18 × 10.
    estimate:
      givens:
        - Use the numbers shown
      relationship: A minute has four fifteen-second parts. Beats in a minute = beats in 15 seconds × 4.
    answerText: "72"
  - group: RESP
    task: What is the best explanation?
    title: Why the Faster Pulse? — Review 4
    setup: Jordan  •  Treatment Room
    scene: Jordan's pulse was slow while he sat. It was fast right after the stairs. He feels fine now. The doctor asks you why it went up.
    guide: >-
      Four reasons a pulse might speed up. Ask of each whether it explains why.
      Working muscles need something, and blood is what brings it. Two of these
      answers are about feeling the beat, not about the beat itself.
    background:
      - >-
          Why the wrong answers are worth reading. Each one is written to look right to
          somebody who made a particular mistake. Working out which mistake each one
          belongs to is most of the learning in this format — more than getting the
          right one, which you can sometimes do by feel.
      - >-
          Why sounding careful is not the same as being right. A long answer with a lot
          of detail in it feels safer, and it is easy to write one that is still wrong.
          The check that builds these questions measures option length across the whole
          game so the longest one is not the answer more often than chance. Reading is
          the only way through.
      - >-
          What the verdict adds. After you answer, the verdict says why each wrong
          option is wrong, in its own words. That is written for the reader who picked
          it. Read it even when you were right, because being right for a shaky reason
          is the thing that catches up with you two stops later.
    story: Jordan’s pulse was slower while sitting and faster just after climbing the stairs. He feels fine after resting. The doctor asks why the heart sped up during activity.
    assumes:
      - muscles work harder when you climb stairs
    takeaway: Body systems work together. Muscles, lungs, blood, and heart all change during exercise.
    format: DIAGNOSIS
    why: Working muscles need more oxygen. Blood is what carries oxygen. So the heart pumps faster to get more blood to them. A pulse is not one fixed number for a person. It goes up and down all day. When one part of the body works harder, another part changes to help.
    rebuttals:
      - B. The heart beats faster to help the body cool down after exercise. — Cooling is mostly the skin's job, with sweat. The faster pulse is about oxygen.
      - C. Climbing stairs shakes the body, which makes the heartbeat easier to feel. — Jordan is resting now, and it is still fast. Shaking would have stopped.
      - D. The pulse only seems faster because Jordan is paying attention to it. — The therapist counted it. A count is a real number, not a feeling.
    choices:
      - Working muscles need more oxygen, so the heart moves blood faster.
      - The heart beats faster to help the body cool down after exercise.
      - Climbing stairs shakes the body, which makes the heartbeat easier to feel.
      - The pulse only seems faster because Jordan is paying attention to it.
    answer: Working muscles need more oxygen, so the heart moves blood faster.
  - group: RESP
    task: Put the path of a breath in order.
    title: Follow One Breath — Review 5
    setup: Priya  •  Respiratory Room
    scene: "Priya takes a deep breath. She asks where the air goes. You have four picture cards: the nose and mouth, the windpipe, the lungs, and the blood."
    guide: >-
      These four are one journey. Ask what has to happen first. Air cannot reach the
      lungs before it goes down the windpipe. And oxygen cannot get into the blood
      before the air arrives. The path helps you guess where a problem is.
    background:
      - >-
          Why the order is graded whole. A sequence is a claim that each step needs the
          one before it to have happened. Get one pair the wrong way round and the claim
          is wrong, even if everything else lines up. That is why there is no part
          credit.
      - >-
          Why the ends are the place to start. The first and last steps are usually the
          easiest to be sure of, because one has nothing before it and the other has
          nothing after it. Fixing those two leaves fewer ways for the middle to go, and
          the middle is where the real question usually is.
      - >-
          What the rail can be ordered on. Often it is time. It can also be cost, or
          risk, or what you can still undo afterwards — do the steps that change nothing
          before the ones that change something for good. A step that destroys the
          sample can only be last.
    story: "Priya asks what happens to the air when she takes a deep breath. The respiratory therapist gives you four picture cards: nose and mouth, windpipe, lungs, and blood carrying oxygen away."
    assumes:
      - air goes in through your nose and mouth
    takeaway: The lungs are the meeting place between outside air and the blood.
    format: SEQUENCE
    why: Air has to travel to get where it is needed. In through the nose or mouth. Down the windpipe. Into the lungs. Only then can oxygen move into the blood. The blood carries it to every part of the body. Knowing the path helps you guess where a problem might be.
    cards:
      - Air enters through the nose or mouth.
      - Air moves down the windpipe.
      - Air reaches the lungs.
      - Oxygen moves into the blood to travel around the body.
    order: [0, 1, 2, 3]
    answerText: Air enters through the nose or mouth. -> Air moves down the windpipe. -> Air reaches the lungs. -> Oxygen moves into the blood to travel around the body.

    title: Follow the Sandwich — Review 2
    setup: Owen  •  Nutrition Room
    scene: Owen has a paper sandwich card. He wants to know where it goes after he swallows. The dietitian hands you four organ cards and asks you to put them in order.
    guide: >-
      These four are one journey, and each part has one job. Ask what has to happen
      first. Nothing can soak up tiny bits before something has made them tiny. Food
      is far too big for the body to use whole.
    background:
      - >-
          Why the order is graded whole. A sequence is a claim that each step needs the

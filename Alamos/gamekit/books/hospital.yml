          it. Read it even when you were right, because being right for a shaky reason
          is the thing that catches up with you two stops later.
    story: Nia points to a cartoon digestive map. She knows food gets broken into small pieces, but she wonders where many useful nutrients move into the blood.
    assumes:
      - a bigger surface can soak up more
    takeaway: Digestion is not finished when food reaches the stomach; the intestines do important work too.
    format: DIAGNOSIS
    why: It is easy to think the stomach finishes the job. It does not. The small intestine comes after it, and it is long and folded. All that folding makes a huge surface inside. More surface means more room to take things in. That is where most of the food gets into the blood.
    rebuttals:
      - B. The stomach — The stomach mixes food and breaks it down more. Most of the soaking up happens after it.
      - C. The mouth — The mouth chews and wets the food. Nothing goes into the blood there.
      - D. The large intestine — The large intestine takes back water near the end. The small intestine does most of the nutrient work first.
    choices:
      - The small intestine
      - The stomach
      - The mouth
      - The large intestine
    answer: The small intestine

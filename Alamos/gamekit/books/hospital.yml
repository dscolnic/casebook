    task: Put the simplified pathway in order.
    title: What the Kidneys Do — Review 2
    setup: Harper  •  Kidney Learning Room
    scene: Harper sees a model of the kidneys and bladder. She wants to know why both are part of the same system.
    guide: >-
      These four are one path. Ask what has to happen first. The kidneys cannot
      clean blood that has not reached them yet. And urine cannot be stored before
      it is made. Two organs, one path, different jobs.
    background:
      - >-
          Why the order is graded whole. A sequence is a claim that each step needs the
          one before it to have happened. Get one pair the wrong way round and the claim
          is wrong, even if everything else lines up. That is why there is no part

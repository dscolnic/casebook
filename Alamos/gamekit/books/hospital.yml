    story: Owen has a paper sandwich card and wants to know where it goes after he swallows. The dietitian gives you four organ cards.
    assumes:
      - food gets chewed before you swallow it
    takeaway: Different organs have different jobs in one connected system.
    format: SEQUENCE
    why: Food is far too big for the body to use. It gets broken down in stages. The mouth chews it and wets it. It goes down the food tube. The stomach mixes it and breaks it down more. Then the small intestine takes the tiny bits into the blood. Each part does one piece of the job.
    cards:
      - The mouth chews food and mixes it with saliva.
      - Food travels down the food tube to the stomach.
      - The stomach mixes and breaks food down more.
      - The small intestine takes many nutrients into the blood.
    order: [0, 1, 2, 3]
    answerText: The mouth chews food and mixes it with saliva. -> Food travels down the food tube to the stomach. -> The stomach mixes and breaks food down more. -> The small intestine takes many nutrients into the blood.
  - group: NUTR
    task: Which part has the best match for that job?
    title: Where Are the Nutrients Going? — Review 2
    setup: Nia  •  Digestive Health Room
    scene: Nia looks at a map of the gut. She knows food gets broken up small. She wants to know where the small bits go into the blood.
    guide: >-
      Four parts of the food journey. Ask of each what it is shaped for. Chewing?
      Mixing? Taking things in? Storing? One of them is long and folded, and folding
      makes more room inside.
    background:
      - >-
          Why the wrong answers are worth reading. Each one is written to look right to
          somebody who made a particular mistake. Working out which mistake each one
          belongs to is most of the learning in this format — more than getting the
          right one, which you can sometimes do by feel.
      - >-
          Why sounding careful is not the same as being right. A long answer with a lot

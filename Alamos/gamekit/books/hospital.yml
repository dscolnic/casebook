      - group: NUTR
        task: Work out how much the kidneys handle in a day.
        title: What the Kidneys Do
        place: Exam Room 1
        scene: Harper, a patient, looks at a model. It shows the kidneys and the bladder. She asks why both are in one system. The body makes waste. The blood carries it. The kidneys are the filters.
        guide: >-
          Work out how much water the kidneys send back into the body each day. They filter 180
          litres, and only 2 litres leave as urine. Take the smaller number away from the bigger
          one. One tile is how many kidneys there are, which is not part of this sum.
        background:
          - >-
              What filtering means. The blood goes through the kidneys again and again. Each time, water
              and waste are pulled out, and then almost all of the water is put back. Only the waste,
              and a little water, carries on to the bladder.
          - >-
              Why the number is so big. The kidneys do not filter the blood once. They filter it all day,
              so the amount they handle is far bigger than the amount anybody drinks.
          - >-
              Why the bladder is in the same system. The kidneys make the urine, a little at a time, all
              day. Nobody could visit a toilet that often, so the bladder holds it until it is convenient.
        assumes:
          - your body makes waste it has to get rid of
        takeaway: Kidneys filter; the bladder stores.
        format: BALLPARK
        question: How much water do the kidneys put back into the body in a day?
        answerText: About 178 litres. They filter 180 and only 2 leave as urine, so almost all of it goes back — which is why filtering is not the same as throwing away.
        why: The kidneys filter about 180 litres a day. Only about 2 litres leave as urine. So they put back 180 − 2 = 178 litres. Filtering is not the same as throwing away. Nearly all of it goes back in. What carries on is the waste. It takes a little water with it. Nobody drinks 180 litres. The number is that big because the blood goes round and round. The kidneys clean it all day. Then the bladder. The kidneys make urine slowly, all day. Nobody could go to the toilet that often. So the bladder holds it. One system, two jobs. The kidneys filter. The bladder stores.
        estimate:
          prompt: The kidneys filter about 180 litres a day. About 2 litres leave the body as urine.
          question: Pick the amount filtered and the amount that leaves.
          labels:
            - 180  (litres filtered in a day)
            - 2  (litres that leave as urine)
            - 2  (how many kidneys there are)
            - 5  (litres of blood in the body)
          values: [180, 2, 2, 5]
          slots: 2
          template: '{0} − {1}'
          formula: a-b
          correct: [0, 1]
          target: 178

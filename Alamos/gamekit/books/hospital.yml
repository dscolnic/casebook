  - group: TRI
    task: Which patient should move to the front of the line?
    title: Who Needs You First? — Review 4
    setup: Ava, Ben, and Maya  •  Emergency Department
    scene: Three patients arrive at almost the same time. Ava is sitting very still and breathing hard. Ben can walk, but his ankle hurts. Maya is smiling and showing the nurse an itchy patch on her arm. The team asks you to decide who should be brought to an exam room first.
    guide: >-
      All four people need help. That is not the question. Ask one thing of each.
      Which of them gets worse while you help somebody else? A sore ankle stays
      about the same. So does an itchy patch. Breathing is not like that.
    background:
      - >-
          Why first is a different question from best. When there is more than one call
          on the same hour, the value of doing something now is not how much it matters.
          It is how much is lost by doing it later. Something important that will be
          just as fixable in an hour can wait. Something small that will not be fixable
          can not.
      - >-
          What to look for in the options. Ask which one changes if you wait — a reading
          that is still moving, a person who is getting worse, a window that closes.
          Then ask which ones can only be done after something else. Those two questions
          usually leave one option standing.
      - >-
          Why only one answer is marked. Real shifts do all of these, in some order. The
          stop asks for the front of that order because that is the only part where the
          reasoning shows. Read the verdict afterwards even when you are right — it says
          what the others were waiting on, which is the rest of the answer.
    assumes:
      - your body needs air all the time
    takeaway: Doctors use urgency, not first-come-first-served order, when several patients need help at once.
    format: TRIAGE
    why: Breathing brings oxygen into the body. Every part needs it, all the time. So when breathing is hard, the whole body is in trouble fast. A sore ankle hurts and stays about the same. An itchy patch stays about the same too. You go to the one that can get worse quickest.
    rebuttals:
      - B. Ben, because you can see his injury and Ava is sitting quietly. — Ben can walk and talk. A hurt you can see is not always the one to fix first.
      - C. Maya, because a rash might spread to other people in the room. — An itchy patch can wait a little. Maya is breathing and talking just fine.
      - D. Whoever arrived first, so nobody waits longer than anybody else. — That is fair for a line at a shop. Here the sickest person goes first.
    choices:
      - Ava, because breathing trouble can affect the whole body quickly.
      - Ben, because you can see his injury and Ava is sitting quietly.
      - Maya, because a rash might spread to other people in the room.
      - Whoever arrived first, so nobody waits longer than anybody else.
    answer: Ava, because breathing trouble can affect the whole body quickly.

roster:
- id: bell
  name: "Ruth Bell"
  role: "cage operator"
  division: BANK
  pronouns: "she/her"
  bio: |
    Ruth Bell is cage operator. Wants keep the shift moving without another landing overrun. The drum record has usually been a sufficient proxy for cage motion. The independent cage record makes her require two motion histories. Says, "Which part is still moving?"
- id: price
  name: "Ewan Price"
  role: "winding engineer"
  division: WIND
  pronouns: "he/him"
  bio: |
    Ewan Price is winding engineer. Wants keep a usable winding service rather than shut the mine indefinitely. The old inertia drawing and a good empty test initially look adequate. He accepts a slower tested range instead of the largest motor-feasible speed. Says, "What else must this shaft turn?"
- id: shaw
  name: "Mara Shaw"
  role: "rope technician"
  division: ROPE
  pronouns: "she/her"
  bio: |
    Mara Shaw is rope technician. Wants protect sound rope from replacement while identifying real motion limits. A passed mean-pull test can distract from rapidly changing stretch. She makes rope length and residual state explicit in each accepted profile. Says, "What length was hanging?"
- id: kerr
  name: "Ada Kerr"
  role: "mine safety engineer"
  division: CAGE
  pronouns: "she/her"
  bio: |
    Ada Kerr is mine safety engineer. Wants explain March and protect the people who ride the cage. An empty success initially seems close to full acceptance. She narrows the approved test scope after the warm-pad contradiction. Says, "What did this test actually prove?"
- id: reed
  name: "Ivo Reed"
  role: "conveyor foreman"
  division: TIP
  pronouns: "he/him"
  bio: |
    Ivo Reed is conveyor foreman. Wants restore steady ore delivery without breaking the bin again. Standing belt mass has been his familiar overload measure. He separates stored load, arrival rate and impact duration. Says, "How much arrives each second?"
- id: cole
  name: "Nia Cole"
  role: "survey engineer"
  division: GRAV
  pronouns: "she/her"
  bio: |
    Nia Cole is survey engineer. Wants maintain a defensible survey tied to reference readings. A tidy spherical model can be easier to discuss than messy local evidence. She records local measurements separately from ideal depth predictions. Says, "What did the reference do?"

glossary:
  - name: Mass
    aliases: [mass, masses]
    def: How much matter a body has, in kilograms.
  - name: Force
    aliases: [force, forces]
    def: What one body does to another to change its motion, in newtons.
  - name: Energy
    aliases: [energy]
    def: The quantity that is the same before and after, however it moves between motion, height and heat.
  - name: Shaft
    aliases: [shaft]
    def: The vertical hole down to the workings, 1,240 metres deep at this mine.
  - name: Cage
    aliases: [cage]
    def: The box people ride in, guided down the shaft on rails.
  - name: Skip
    aliases: [skip, skips]
    def: The bucket broken stone rides in, hung from the same rope as a cage when nobody is riding.
  - name: Bank
    aliases: [bank, the bank]
    def: The place at the surface where every upward journey ends.
  - name: Inset
    aliases: [inset]
    def: The loading place at the bottom of the shaft, 1,240 metres down.
  - name: Winding rope
    aliases: [winding rope, rope, ropes]
    def: The line that carries the cage, eleven tonnes of it at this shaft.
  - name: Cappel
    aliases: [cappel]
    def: The fitting that grips the rope end and hangs the cage off it.
  - name: Drum
    aliases: [drum]
    def: The turning cylinder the rope winds on and off.
  - name: Sheave
    aliases: [sheave, sheave wheel]
    def: The wheel at the very top of the headframe that the rope runs over.
  - name: Headframe
    aliases: [headframe]
    def: The steel structure over the shaft that holds the wheels, thirty-two metres of it here.
  - name: Winder
    aliases: [winder, winding engine]
    def: 'The machine that raises and lowers the rope: a motor, a gearbox and a brake.'
  - name: Wind
    aliases: [wind cycle, a wind, one wind]
    def: One journey of the cage from one landing to the other, and the pattern of speed it is driven to.
  - name: Ramp
    aliases: [ramp, ramps]
    def: The part of a journey when the speed is being changed on purpose.
  - name: Crawl
    aliases: [crawl]
    def: The slow last stretch before a stop, so that the stop is made under control.
  - name: Overwind
    aliases: [overwind, overwound]
    def: A journey that does not stop where it should and goes on past the bank.
  - name: Arrestor
    aliases: [arrestor, arrestors]
    def: A crushable frame above the shaft that takes an overwind and is destroyed doing it.
  - name: Brake
    aliases: [brake, brakes, braking]
    def: Two sets of pads that clamp the drum flanges, held on by weights and lifted by oil.
  - name: Weightometer
    aliases: [weightometer]
    def: The scale built into a conveyor belt, reporting tonnes an hour rather than tonnes.
  - name: Conveyor
    aliases: [conveyor, belt]
    def: The moving rubber band that carries ore up to the plant.
  - name: Torque
    aliases: [torque, torques]
    def: The turning effort about a line, given by a force times its distance from that line.
  - name: Moment of inertia
    aliases: [moment of inertia]
    def: How hard a body is to spin up, decided by how far its matter sits from the axis.
  - name: Momentum
    aliases: [momentum]
    def: Mass times velocity, and the thing a collision moves from one body to another.
  - name: Impulse
    aliases: [impulse]
    def: A force acting for a time, and the change of momentum it produces.
  - name: Work
    aliases: [work done, work]
    def: What a force does when the body it acts on moves, in joules.
  - name: Power
    aliases: [power]
    def: How fast work is being done, in watts.
  - name: Kinetic energy
    aliases: [kinetic energy]
    def: The energy a body has because it is moving.
  - name: Potential energy
    aliases: [potential energy]
    def: The energy a body has because of where it is, which can be got back.
  - name: Stiffness
    aliases: [stiffness, stiff]
    def: How much pull it takes to stretch something by one metre.
  - name: Period
    aliases: [period]
    def: How long one full swing of something back and forth takes.
  - name: Resonance
    aliases: [resonance, resonant]
    def: What happens when a push arrives in step with a swing, so each one adds to the last.
  - name: Damping
    aliases: [damping, damped]
    def: Whatever takes a swing out of something, so it dies away instead of continuing.
  - name: Jerk
    aliases: [jerk]
    def: How fast an acceleration is itself changing, which is what passengers notice.
  - name: Apparent weight
    aliases: [apparent weight]
    def: What the floor has to push with to carry a body, which changes while the floor is accelerating.
  - name: Free-body diagram
    aliases: [free-body diagram, free body]
    def: A drawing of one chosen body with everything acting on it and nothing else.
  - name: Gravimeter
    aliases: [gravimeter]
    def: A weighted spring in a case, so sensitive that it reads where it is standing to a millionth.
  - name: Milligal
    aliases: [milligal, milligals]
    def: The unit a gravity survey works in, a hundred-thousandth of a metre a second squared.
  - name: Shell theorem
    aliases: [shell theorem]
    def: The result that matter arranged in a sphere around you pulls you nowhere at all.

missions:
# 12 mission fragment(s), assembled by tools/assemble-book.mjs from
# overwind_v2/ — edit the fragments, not this file.
# ============================================================ MISSION 1
# Lifted from ../fpl_gpt/OVERWIND_AP_Physics_C_Mechanics_Campaign_Implementation_Bible_v1.0.md by tools/v10extract.mjs. Every quoted string below is
# the bible's, verbatim; engine/dev/bibleParity.mjs holds it to that.
- title: "THE CAGE THAT KEPT GOING"
  card:
    header: "DAY 1 OF 12 — INSPECTION IN 12 DAYS"
    title: "THE CAGE THAT KEPT GOING"
    goNow: "Go to The Bank and meet Ruth Bell, cage operator, at The profile desk."
    body: "The March stop left the lift beyond its landing, and faster trips are now proposed. The lift carries people in a steel cage pulled by a rope. At the Bank, compare the planned motion with a small test before anyone rides. By the end of the mission, decide whether the proposed start can be used for passenger trips."
    objective: "Can the proposed start be used for passenger trips?"
  objective: "Can the proposed start be used for passenger trips?"
  stake: "The March stop left the lift beyond its landing, and faster trips are now proposed. The lift carries people in a steel cage pulled by a rope. At the Bank, compare the planned motion with a small test before anyone rides. By the end of the mission, decide whether the proposed start can be used for passenger trips."
  takeaway: "A correct motion calculation can still fail a safety limit. ---"
  segue: "Mission decision: Reject the fast start. Its speed grows too fast for the stated limit. The slow schedule stays in place. The old drum drawing is now on the desk."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Velocity", def: "speed with a direction."}
  - {name: "Acceleration", def: "the rate at which velocity changes."}
  - {name: "Derivative", def: "the instantaneous rate at which a quantity changes."}
  - {name: "Integral", def: "an accumulated total found from a rate."}
  equations:
  - {"e":"v = dy/dt; a = dv/dt; Δy = ∫v dt","c":"calculus kinematics and reference frames in the measured system.","v":[["y","position in metres"],["t","time in seconds"],["v","velocity in metres per second"],["a","acceleration in metres per second squared"],["Δy","change in position"]],"s":"Can the proposed start be used for passenger trips?"}
  primer:
  - "Name the body, positive direction and quantity before using a relation."
  - "Compare a result only with the condition and range that its record actually covers."
  - "A slope and an area answer different questions about the same motion."

  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Worked examples"
    examples:
    - {"title":"","problem":"For y=3t² metres, differentiate to obtain v=6t metres per second; at t=2 seconds, v=12 metres per second.","rule":"","steps":[],"answer":"","mistake":""}
    - {"title":"","problem":"For v=5t metres per second from t=0 to 3 seconds, integrate: Δy=[5t²/2]₀³=22.5 metres.","rule":"","steps":[],"answer":"","mistake":""}
    - {"title":"","problem":"A cart starts at 2 metres per second with acceleration 3 metres per second squared for 2 seconds; v=2+3×2=8 metres per second.","rule":"","steps":[],"answer":"","mistake":""}
    - {"title":"","problem":"A ball leaves a table horizontally at 3 metres per second from height 5 metres with g=10 metres per second squared; t=√(2h/g)=1 second and range=3 metres.","rule":"","steps":[],"answer":"","mistake":""}
    - {"title":"","problem":"A platform moves east at 4 metres per second and a walker moves east at 1 metre per second relative to it; ground velocity is 4+1=5 metres per second.","rule":"","steps":[],"answer":"","mistake":""}

  stops:
  # --- Stop 1: Read the motion record
  #     Concept: 1 — Read the motion record; Keystone: Motion and derivatives, Models and evidence; Area: BANK; Prerequisites: Opening algebra and calculus primer; Learning role: INTRODUCE; Difficulty: L2; Story role: clue.
  #     placement: PROTOCOL, The Bank — The profile desk.
  - group: BANK
    at: profile-desk
    title: "Read the motion record"
    concept: 1   # Read the motion record
    reason: "The March record must be understood before the fast start is restored."
    scene: "The March record follows the drum, but the passenger cage passed its landing after the drum was still. Read what the motion graphs actually measure before deciding which parts of the proposed faster start can be trusted."
    motivation: "The meaning of a motion record determines which part of the passenger proposal can be approved."
    format: PROTOCOL
    question: "Match every evidence row to one response; use each response once and submit all connections."
    choices:
      - Velocity is constant upward
      - Acceleration is constant upward
      - Net displacement is upward
    answerText: "A slope gives a rate, while an area accumulates that rate; the plotted quantity determines which physical result follows."
    why: "A slope gives a rate, while an area accumulates that rate; the plotted quantity determines which physical result follows. The evidence 'Position curve has a constant positive slope' requires the response 'Velocity is constant upward'. The evidence 'Velocity graph rises linearly from rest' requires the response 'Acceleration is constant upward'. The evidence 'Velocity graph encloses positive area' requires the response 'Net displacement is upward'. Position curve has a constant positive slope; Velocity graph rises linearly from rest; Velocity graph encloses positive area."
    # wrong-path feedback, one rebuttal per wrong option:
    #   **e1:** For Position curve has a constant positive slope, use Velocity is constant upward; A slope gives a rate, while an area accumulates that rate; the plotted quantity determines which physical result follows. **e2:** For Velocity graph rises linearly from rest, use Acceleration is constant upward; A slope gives a rate, while an area accumulates that rate; the plotted quantity determines which physical result follows. **e3:** For Velocity graph encloses positive area, use Net displacement is upward; A slope gives a rate, while an area accumulates that rate; the plotted quantity determines which physical result follows.
    # correct result: Position curve has a constant positive slope → Velocity is constant upward; Velocity graph rises linearly from rest → Acceleration is constant upward; Velocity graph encloses positive area → Net displacement is upward. Acceptance: exact authored key.
    # state/output: The profile desk gains a dated evidence slip: Position curve has a constant positive slope → Velocity is constant upward; Velocity graph rises linearly from rest → Acceleration is constant upward; Velocity graph encloses positive area → Net displacement is upward
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   scenarios:
    #   - id: e1
    #     label: Position curve has a constant positive slope
    #     reading: Position curve has a constant positive slope
    #   - id: e2
    #     label: Velocity graph rises linearly from rest
    #     reading: Velocity graph rises linearly from rest
    #   - id: e3
    #     label: Velocity graph encloses positive area
    #     reading: Velocity graph encloses positive area
    #   choices:
    #   - id: r1
    #     label: Velocity is constant upward
    #   - id: r2
    #     label: Acceleration is constant upward
    #   - id: r3
    #     label: Net displacement is upward
    #   mapping:
    #     e1: r1
    #     e2: r2
    #     e3: r3
    #   answerText: A slope gives a rate, while an area accumulates that rate; the plotted quantity determines which physical result follows.
    scenarios:
      - Position curve has a constant positive slope
      - Velocity graph rises linearly from rest
      - Velocity graph encloses positive area
    mapping:
      - 0
      - 1
      - 2

  # --- Stop 2: Differentiate the proposed start
  #     Concept: 1 — Differentiate the proposed start; Keystone: Motion and derivatives; Area: BANK; Prerequisites: Stop 1 result in the mission log; current mission primer; preceding numbered spine relationships used in the visible data; Learning role: PRACTICE; Difficulty: L2; Story role: clue.
  #     placement: DERIVE, The Bank — The profile desk.
  - group: BANK
    at: profile-desk
    title: "Differentiate the proposed start"
    concept: 1   # Differentiate the proposed start
    reason: "The proposed start must meet the passenger acceleration limit."
    scene: "The graph review separates a position curve from the speed it implies, so the start proposal can now be read correctly. Derive its changing motion before comparing the passenger acceleration with the limit on the trial sheet."
    motivation: "The meaning of a motion record determines which part of the passenger proposal can be approved."
    format: DERIVE
    question: "Build the derivation by selecting one expression at each step; inspect the stated physical reason before committing each line."
    answerText: "The power rule changes t² into 2t and then into 2; the proposed upward start therefore has constant acceleration, not constant speed."
    why: "The power rule differentiates y=t² to v=2t and then differentiates velocity to a=2. The first expression has units of metres per second, while the second has units of metres per second squared. Copying the position expression cannot calculate its slope. Keeping the time factor in the acceleration would instead describe a velocity curve with changing slope. The actual proposed start has constant upward acceleration throughout the stated four-second interval, so that constant must be compared with the passenger trial limit."
    # wrong-path feedback, one rebuttal per wrong option:
    #   **1:** Copying the position expression leaves the time dependence unchanged and does not calculate velocity. **2:** The derivative of 2t is constant; keeping t confuses velocity with acceleration.
    # correct result: a(t)=2 m/s². Acceptance: exact authored key.
    # state/output: The profile desk gains a dated evidence slip: a(t)=2 m/s²
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:
    #     start: Upward y(t)=t² metres for 0≤t≤4 seconds; y(0)=0.
    #     goal: Obtain velocity and acceleration as functions of time.
    #     steps:
    #     - id: line1
    #       prompt: Differentiate position with respect to time.
    #       choices:
    #       - line: v(t)=2t m/s
    #         correct: true
    #       - line: v(t)=t² m/s
    #         correct: false
    #         survives: true
    #         why: Copying the position expression leaves the time dependence unchanged and does not calculate velocity.
    #     - id: line2
    #       prompt: Differentiate velocity with respect to time.
    #       choices:
    #       - line: a(t)=2 m/s²
    #         correct: true
    #       - line: a(t)=2t m/s²
    #         correct: false
    #         survives: true
    #         why: The derivative of 2t is constant; keeping t confuses velocity with acceleration.
    #     answerText: The power rule changes t² into 2t and then into 2; the proposed upward start therefore has constant acceleration, not constant speed.
    derive:
      start: Upward y(t)=t² metres for 0≤t≤4 seconds; y(0)=0.
      goal: Obtain velocity and acceleration as functions of time.
      steps:
        - ask: Differentiate position with respect to time.
          answer: 0
          candidates:
            - text: v(t)=2t m/s
            - text: v(t)=t² m/s
              why: Copying the position expression leaves the time dependence unchanged and does not calculate velocity.
              survives: true
        - ask: Differentiate velocity with respect to time.
          answer: 0
          candidates:
            - text: a(t)=2 m/s²
            - text: a(t)=2t m/s²
              why: The derivative of 2t is constant; keeping t confuses velocity with acceleration.
              survives: true

  # --- Stop 3: Test the displacement
  #     Concept: 1 — Test the displacement; Keystone: Motion and derivatives, Models and evidence; Area: BANK; Prerequisites: Stop 2 result in the mission log; current mission primer; preceding numbered spine relationships used in the visible data; Learning role: COMBINE; Difficulty: L2; Story role: clue.
  #     placement: VERIFY, The Bank — The depth indicator.
  - group: BANK
    at: depth-dial
    title: "Test the displacement"
    concept: 1   # Test the displacement
    reason: "The planned travel needs a prediction before the replay can test it."
    scene: "The derived start rises faster each second, and its predicted travel must match a separate position record. Commit the distance before running the replay so an agreeable display cannot substitute for a prediction made in advance."
    motivation: "The meaning of a motion record determines which part of the passenger proposal can be approved."
    format: VERIFY
    question: "First, calculate and commit upward displacement in m from the visible data. OPERATE: run the four-second encoder replay. Keep the time interval and velocity law fixed. MEASURE: press READ once after the run and record upward displacement. INTERPRET: compare with your prediction and submit SUPPORTS MODEL or REJECTS MODEL. No restoration or second reading is required; this isolated test resets on retry."
    answerText: "∫₀⁴2t dt=[t²]₀⁴=16 m. The replay gives 16 m, supporting the motion record."

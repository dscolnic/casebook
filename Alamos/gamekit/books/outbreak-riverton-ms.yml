            - required: true
              requires:
                - rapid_isolation
              question: Interrupt detected transmission chains this month
            - required: true
              requires:
                - vaccine
              question: Preserve a longer-horizon immune layer
            - required: false
              requires:
                - therapeutic
              question: Develop a treatment option for infected patients
            - required: false
              requires:
                - paid_leave

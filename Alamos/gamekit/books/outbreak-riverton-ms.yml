        background:
          - >-
              Why the record raises the bar. People will use these claims later without
              being able to see the evidence behind them. A claim taken back afterwards has
              already done its work, and the correction rarely travels as far as the claim
              did.
          - >-
              What full strength means. The same finding can be written as 'this is what
              happened', or 'this fits what happened', or 'we cannot rule it out'. Checking
              decides which of those it has earned, so a claim can pass by being written
              more carefully instead.
          - >-
              Why choosing is the real skill. Two checks and four claims means picking. Ask
              which one, if it is wrong, would send the next response in the wrong
              direction. That is not always the one with the weakest evidence.
        assumes:
          - a signature records that somebody said it, not that anybody checked it
          - a strong claim can survive one of its sources being wrong
        takeaway: Say each claim at the strength its own evidence can carry.
        format: ATTEST
        question: Which claims need checking before the report can say them at full strength?
        attest:
          # data provenance: invented final-review check budget; claim strengths are source-derived
          hint: Every card is signed. You can independently check two. Spend those checks where a wrong critical claim would change the report and where independent backing is still missing.
          claims:
            - id: transmission
              label: The main transmission route is established enough for operational planning
              critical: true
              backed: true
              evidence: Multiple independent surveillance and exposure streams already converge on the route.
            - id: risk_group
              label: The proposed severe-risk subgroup is established for citywide policy
              critical: true
              backed: false
              evidence: Collect a representative confirmatory sample rather than relying on one small observational group.
            - id: treatment_duration
              label: The monitored treatment benefit can be assumed to persist beyond eight weeks
              critical: true
              backed: false
              evidence: Extend follow-up and reproduce the duration estimate under the planned analysis.
            - id: reservoir
              label: The suspected animal species is the confirmed reservoir
              critical: false
              backed: false
              evidence: Complete comparison-site, species and repeat-time One Health evidence before making a reservoir claim.
          checks: 2
        answerText: Check who gets sickest, and how long the treatment holds. The rest is either backed already or written as still open.
        why: A report should not give everything the same confidence. How it spreads is backed by three separate streams, so it can carry planning. Who gets sickest comes from one small group of patients, and it is about to become city policy. The treatment claim covers eight weeks and is written as though it covers longer. The animal question is open, and can be written as open.
      - group: POP
        task: Order the briefing by how much each claim can carry.
        title: Build the public explanation
        place: City Command
        scene: The mayor goes live in an hour. How it spreads is settled. The animal question is not. The treatment has eight weeks behind it. Every sentence will be replayed for years.
        guide: >-
          All four things will be said, so the order is what is being chosen. Ask of
          each how much its evidence can carry. Three streams that agree? One small
          group of patients? Or a question still open? Every sentence gets replayed for
          years. Saying the open part as firmly as the settled part is what makes the
          whole briefing hard to believe later.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim that each step needs the
              one before it to have happened. Get one pair the wrong way round and the claim
              is wrong, even if everything else lines up. That is why there is no part
              credit.
          - >-
              Why the ends are the place to start. The first and last steps are usually the
              easiest to be sure of, because one has nothing before it and the other has
              nothing after it. Fixing those two leaves fewer ways for the middle to go, and
              the middle is where the real question usually is.
          - >-
              What the rail can be ordered on. Often it is time. It can also be cost, or
              risk, or what you can still undo afterwards — do the steps that change nothing
              before the ones that change something for good. A step that destroys the
              sample can only be last.
        assumes:
          - people judge a claim by how it was supported, once they find out
        takeaway: A public account is ordered by the strength of its evidence, not by the order the work happened in.
        format: SEQUENCE
        why: Order it by what the evidence carries, strongest first. That is the order in which a listener can tell one kind of claim from another. Say the animal question as firmly as the spreading and the whole thing falls apart the day the animal turns out to be somewhere else. Ending with what would settle each open question lets people judge the next update.
        cards:
          - How it spreads, which three separate streams agree on.
          - Who gets sickest, which one small group of patients suggests.
          - Where it came from, which is still open.
          - What would settle each open question, and when.
        order: [0, 1, 2, 3]
      - group: POP
        task: Say which capability the city should protect.
        title: What survives the emergency
        place: Public Briefing Room
        scene: The emergency budget ends in three weeks, and anything not protected stops with it. Four programmes want the last line. The council votes this month.
        guide: >-
          Four programmes, and three of them worked this time. Ask of each whether it
          would work on a different outbreak. Each stream sees a different part, and the
          value comes from putting them side by side. Note what the cheapest thing on
          the list costs too. Records are nearly free, and they are the first to go.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - anything not funded to continue stops when the emergency does
        takeaway: Keep the system that spots the next one, not the instrument that starred in this one.
        format: CHOICE
        question: Which capability should the city protect when the emergency budget closes?
        answerText: The three streams together, with somebody funded to read them side by side. Any one of them alone is much less than what worked this time.
        why: Each stream sees a different part of an outbreak, and each is much less useful alone. Sequencing says what changed, and it needs samples that stand for the town. Sewage gives the earliest warning, and it names nobody and explains nothing. Hospital numbers say who is ill, and they arrive late. What made this response work was the three being read together. That is the thing that quietly disappears when the money ends, because no single line item owns it.
        choices:
          - The three streams together, with shared records and somebody to read them.
          - The sequencing bench, since it found the change.
          - The sewage sampling, since it gave the earliest warning.
          - None. Stop the outbreak programme, and rebuild when the next one starts.
        answer: The three streams together, with shared records and somebody to read them.
        rebuttals:
          - Sequencing is powerful, and it needs samples that stand for the town, and it cannot say who is ill.
          - Sewage warns early, and it names nobody and cannot say what the illness does.
          - Throwing the records away removes the baselines that make the next signal readable at all.
# What each place says when the player reads it.
# --------------------------------------------------------------- the warm-ups
warmups:
  trial-near:
    title: Walk the hospital before you are needed on it
    why: >-
      It is week three, and the hospital has been rebuilt around the outbreak. Tents in the
      courtyards, a wash tunnel across the main path, labs in containers. Walk it once, because
      a route you have not walked is one you will take in dirty gloves.
  greet:
    title: Six leads, three shifts, and a fence between them
    why: >-
      The ward side and the laboratory side have hardly met. By Friday one will have to trust
      the other's number. Put a name to every lead before the shift changes, because a phone
      call at three in the morning goes better between people who have met.
  trial-far:
    title: The far ward opens today, and the transport with it
    why: >-
      Everything past the fence has been off the list all week. From today the containment ward
      is on it, and it is far enough out that transport is signed out to reach it. Drive the
      route once before somebody is waiting at the other end.
  follow:
    title: Chen walks a swab from the tent to the lab
    why: >-
      A swab passes through four pairs of hands on its way to the laboratory, and every handover
      is a place germs can get in. Chen, the cell biology lead, walks the whole path this
      morning. Stay with her, and keep back at the handovers.
  hunt:
    title: Six ventilators, and the board finds four
    item: { name: ventilator, plural: ventilators }
    why: >-
      Before tonight the ward has to know what it has. Four are where the board says. Two were
      moved at the weekend and nobody wrote it down. A machine nobody can find does not exist at
      two in the morning.
  canvass:
    title: Who in Ferry Ward is staying home
    why: >-
      The spread estimate assumes people followed the advice. A ward that stayed home and a ward
      that could not look the same on paper. Ask along the streets until enough answers have
      come back to tell them apart.
  evade:
    title: The reporter at the gate who wants today's number
    why: >-
      He has been there since six, wanting the case count before it is checked. Nothing goes out
      before the count is reconciled. Keep clear and finish your round, because a wrong number
      takes a week to correct.
  tag:
    title: Catch Patel before he goes into the container lab
    why: >-
      Patel, the molecular diagnostics lead, has the sheet that says which samples were tested
      twice. Once he is gowned up he is gone for three hours, and this morning's positives
      cannot be read without knowing which are repeats.

copy:
  CLIN: <p>The clinical wing. Every hypothesis in this outbreak has to survive contact with an actual patient.</p>
  CELL: <p>Cell and membrane biology. What the pathogen does to a cell, and what that rules out.</p>
  MOL: <p>Molecular diagnostics. Two instruments, a library, and a rule about controls.</p>
  IMM: <p>Immunology and treatment. Where protection and damage are told apart.</p>
  POP: <p>Epidemiology operations. Counts, denominators, and the difference between them.</p>
  FIELD: <p>The One Health field station. The outbreak did not start in a hospital.</p>
  CMD: <p>City Health Command. Decisions are made here whether or not the evidence has arrived.</p>
  TRANSIT: <p>The transit and mobility centre. Trip counts nobody has yet matched to the case map.</p>
  BRIEF: <p>The public briefing room. What the city is told, and how much of it is hedged.</p>
  WASTE: <p>The wastewater plant. Surveillance that sees the city before the city sees a doctor.</p>

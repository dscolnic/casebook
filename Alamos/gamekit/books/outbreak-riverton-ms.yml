        answerText: Ventilation, fast isolation and the vaccine. Two act this month by different routes, and the third adds a different kind of protection later.
        why: Layers are only layers if they fail separately. Ventilation lowers the chance of catching it, without waiting for anybody to be found. Fast isolation works after somebody is found, and cuts what happens next. A vaccine takes longer and protects in a different way. Treatment and sick pay both matter, and three slots cannot buy six things.
  - title: The Final Briefing
    objective: Produce a claim-by-claim evidence package with explicit residual uncertainties and durable surveillance responsibilities.
    briefing: The mayor, hospitals, and public must receive one integrated account of what happened, what remains uncertain, and which actions should continue.
    stake: "Day one hundred and forty. The mayor is on air in an hour, and behind that broadcast sit five months of conclusions that are not equally solid. The route is settled. The animal source is not, and Castellanos has said so in writing. Today you go through the claims one at a time, and decide what the city keeps funding after the emergency money closes. Say too little and the next outbreak arrives unwatched."
    takeaway: Use evidence synthesis, causal chains, uncertainty, ethics, communication, long-term monitoring as an evidence chain rather than as isolated facts.

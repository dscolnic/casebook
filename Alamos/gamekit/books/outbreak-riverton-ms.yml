      - group: CELL
        task: Match each observation to how the material is crossing.
        title: Which way things cross
        concept: A germ has to get from one person into another somehow
        place: Membrane Biology Lab
        scene: Four things from the culture bench, each about something crossing a cell's outer layer. The cell biologist wants each one named before the model goes further.
        guide: >-
          Four observations and four ways of crossing. Pair them with three questions.
          Is it going downhill or uphill? Is anything helping it through? And is it too
          big to fit through anything? The energy being spent is the clue for one of
          them. The name of the thing crossing tells you nothing.
        background:
          - >-
              Why you match instead of choosing. A response that is right for one situation
              is often nearly right for the next one. Picking from a list lets you take the
              nearly-right answer and never notice. Matching makes you say which situation
              it fits best, and that comparison is the whole point.
          - >-
              How to use the one-each rule. Every response goes somewhere, and nowhere
              twice. So the situations you are sure about are worth more than themselves:
              each one you settle leaves fewer responses for the ones you are not sure
              about. Two lines you trust can decide the other two for you.
          - >-
              Why one wrong line is impossible. If three lines are right, the fourth
              response has nowhere else to go, so it is right too. Being wrong always means
              at least two are wrong at once. If a join feels forced, the mistake is
              probably not in that join — it is in one you already made and stopped
              questioning.
        assumes:
          - things spread from where there is more of them to where there is less
          - a cell has to spend energy to move something the other way
        takeaway: How something crosses is worked out from the rules it obeys, not from what it is called.
        format: PROTOCOL
        why: Three things tell these apart, and none of them is the name of the molecule. Which way it goes. Downhill is free, uphill costs, and the energy spent is the receipt. Whether it needs help. Something small and greasy slips through, and a charged particle cannot. And how big it is. Something too big for any doorway gets wrapped up and carried in.
        columns:
          - What the material does
          - How it is crossing
        rebuttals:
          - Downhill and needing no help is the simplest case. It is small and greasy enough to cross the layer itself.
          - Downhill through a doorway is still free. The doorway supplies the choosiness, not the push.
          - Uphill with energy spent is the one where the cell is doing work, and the cost is what identifies it.
          - Something large being wrapped up is a different process from anything crossing the layer.
        scenarios:
          - Something small and greasy drifts from more to less.
          - A charged particle goes the same way, through a doorway.
          - Something is moved uphill, and energy gets spent doing it.
          - Something large is wrapped up by the layer and taken in.
        choices:
          - Straight through the layer, with no help.
          - Through a doorway, still downhill and still free.
          - Pushed uphill, which is what the energy is for.
          - Wrapped up and swallowed whole.
        mapping: [0, 1, 2, 3]

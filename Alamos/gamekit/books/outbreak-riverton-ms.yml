  - title: A Test Before Morning
    objective: Approve a diagnostic workflow only after its analytical and clinical limitations are explicit.
    briefing: Hospitals need a rapid diagnostic by sunrise. The molecular signal is promising, but contamination, false negatives, and prevalence could make a technically impressive test clinically misleading.
    stake: "Day nine. The hospitals need a working test by sunrise. Patel's overnight run flagged several patients positive — and one of the controls, a tube that had nothing in it. Three thousand people have already been told to stay home on that run. The bulletin goes out at six. Today you decide whether the run can be believed, and what a positive would mean for one patient."
    takeaway: Use PCR logic, controls, sensitivity, specificity, predictive value, prevalence as an evidence chain rather than as isolated facts.
    stops:
      - group: MOL
        task: Put the four steps of the run in order.
        title: A run you can trust by morning
        concept: A test can be wrong in two different directions
        place: Sample Processing Room
        scene: Hospitals want a test by sunrise and the room has four hours. Four steps are on the whiteboard. The machine multiplies whatever is in the tube a billion times, which is why the order is argued about.
        guide: >-
          All four steps will happen, so ask what each one protects. Whatever is in the
          tube gets multiplied, including anything that drifted in from the room. Whose
          sample it is has to survive the first step. And the controls have to be in the
          run, not added afterwards. That is why this is about order.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim that each step needs the
              one before it to have happened. Get one pair the wrong way round and the claim
              is wrong, even if everything else lines up. That is why there is no part
              credit.
          - >-
              Why the ends are the place to start. The first and last steps are usually the
              easiest to be sure of, because one has nothing before it and the other has
              nothing after it. Fixing those two leaves fewer ways for the middle to go, and
              the middle is where the real question usually is.
          - >-
              What the rail can be ordered on. Often it is time. It can also be cost, or
              risk, or what you can still undo afterwards — do the steps that change nothing
              before the ones that change something for good. A step that destroys the
              sample can only be last.
        assumes:
          - the machine copies whatever is in the tube, wanted or not
        takeaway: A test result is what a controlled process produced, not what a machine displayed.
        format: SEQUENCE
        why: A patient result read before the controls is a machine reading, not evidence. The name has to survive the first step, or the answer belongs to nobody. The controls go in with the samples. Added later, they test a different run. One shows the chemistry worked. Another shows the signal did not come out of the room. Only then is the patient's tube worth reading.
        rebuttals:
          - Extraction first, with the name attached. A result that cannot be tied to a patient is nobody's diagnosis.
          - The controls go in with the samples. Added afterwards, they test a different run from the one that gave the result.
          - The copying comes third. It is the step everything else exists to make readable.
          - Reading last, and only on condition. If a control misbehaved, the patient tubes cannot be read however clean they look.
        cards:
          - Get the material out of the sample, without losing whose it is.
          - Put the controls into the run, alongside the samples.
          - Run the copying, with settings somebody has checked.
          - Read the patient's result, but only if the controls behaved.
        order: [0, 1, 2, 3]
      - group: MOL
        task: Open what each result depends on, keep what stands, and name what the rest share.
        title: Why did the test turn positive?
        concept: A test can be wrong in two different directions
        place: PCR Diagnostics Lab
        scene: Dr. Ravi Patel has patient tubes, two controls and a separate machine on one screen. One ward has already cleared isolation rooms. If this run is wrong, patients get moved before morning.
        guide: >-
          Open each result to see what its run depended on. Keep the ones that would
          still stand if one step of the process were contaminated, and untick the rest.
          Then name the step the failing ones share. A ward is already clearing rooms,
          so both halves matter.
        background:
          - >-
              How one shared step makes results agree wrongly. Tubes handled in the same
              batch go through the same liquids, the same machine and the same hands.
              Contamination anywhere in that chain shows up in every tube after it, and it
              looks exactly like a cluster of real positives.
          - >-
              What the controls do. A negative control that stays negative says the whole
              batch was not contaminated. A positive control says the chemistry worked.
              Neither can catch contamination that arrived after the controls were set,
              which is why the separate machine is on the screen.
          - >-
              Why a repeat is not enough. Running the same test again on the same tube goes
              through the same steps, so a contaminated result repeats perfectly. A
              different machine on a different sample is the evidence that survives the
              question.
        assumes:
          - a blank tube has no patient sample in it
          - two machines with different chemistry fail in different ways
        takeaway: Agreement is not evidence when everything agreeing came down the same pipe.
        format: TRACE
        question: Which results share one path, and what evidence survives it?
        trace:
          hint: Do not count positive wells. Open what each result depends on, keep evidence built on a different path, and identify the dependency shared by the unreliable signals.
          target: workflow_carryover
          channels:
            - id: patient_amp
              label: Patient amplification wells
              reading: several positive signals (expected positive if target is present and the run is clean)
              depends:
                - patient_material
                - amp_chemistry
                - workflow_carryover
            - id: ntc
              label: No-template control
              reading: positive target signal (expected should remain negative)
              depends:
                - amp_chemistry
                - workflow_carryover
            - id: positive_control
              label: Known positive control
              reading: amplifies as expected (expected chemistry can amplify target)
              depends:
                - amp_chemistry
            - id: orthogonal
              label: Independent patient platform
              reading: target not detected in the same patients (expected separate preparation and chemistry)
              depends:
                - patient_material
                - independent_platform
          resources:
            - id: patient_material
              label: Patient material
            - id: amp_chemistry
              label: Amplification chemistry
            - id: workflow_carryover
              label: Amplification-workflow carryover
            - id: independent_platform
              label: The other platform's own preparation and chemistry
          independent:
            - positive_control
            - orthogonal
        answerText: The patient tubes and the blank share one run, so stray material explains both. Keep the other machine's result.
        why: A blank tube has no patient material in it. So a positive there came from the room or the chemicals. The patient tubes went through the same room and the same chemicals. That makes their positives doubtful, however many there are. The control that was meant to be positive shows the chemistry can work, and it cannot rescue a spoiled run. The other machine used different chemistry, so its result stands.
        headline: The overnight amplification run flags several patient samples as positive, but one control is also behaving strangely.
      - group: POP
        task: Work out how often a positive result is a real case.
        title: What does a positive mean?
        concept: A test can be wrong in two different directions
        place: Clinical Statistics Desk
        scene: The mayor's office wants to test the whole town, and to treat every positive as a case. The desk has a table from ten thousand people, with the true answer beside the test's.
        guide: >-
          Five numbers, and two of them are the whole town split into ill and well.
          Those were used to work out the flags. Ask which two this share needs. A share
          compares part with a whole. The whole here is everybody the test flagged, not
          everybody who is really ill.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - how good a test is does not change with how common the illness is
        takeaway: When something is rare, most positives can be wrong even with a very good test.
        format: BALLPARK
        question: Out of every hundred positive results, how many are real cases?
        answerText: About 48 in every hundred. Ninety positives are real and ninety-nine are not, because the illness is rare.
        why: The test is good. It catches ninety of the hundred people who really have it, and it correctly clears ninety-nine per cent of everyone else. But everyone else is nine thousand nine hundred people, and one per cent of that is ninety-nine wrong positives. So there are ninety right positives and ninety-nine wrong ones. Less than half the positives are real. Nothing is wrong with the test. What makes it happen is that the illness is rare.
        estimate:
          relationship: Share that are real = real positives ÷ all positives × 100.
          prompt: The test flagged 189 people altogether. Ninety of them really have it, and ninety-nine do not.
          question: Out of every hundred positive results, how many are real cases?

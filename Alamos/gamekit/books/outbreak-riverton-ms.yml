# The areas of study. One column of the game each; every group needs somebody on the roster.
groups:
  - id: CLIN
    code: CLIN
    name: Clinical Physiology
    color: "#315c78"
    desc: Patient physiology, organ systems, and bedside evidence.
    defaultLeader: ortiz
    milestones:
      - Observe the patient
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: CELL
    code: CELL
    name: Cell & Membrane Biology
    color: "#4b775f"
    desc: Cells, membranes, receptors, transport, and host interactions.
    defaultLeader: chen
    milestones:
      - Build the cell model
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: MOL
    code: MOL
    name: Molecular Diagnostics
    color: "#704f88"
    desc: DNA, RNA, gene expression, sequencing, and diagnostic controls.
    defaultLeader: patel
    milestones:
      - Validate the molecular evidence
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: IMM
    code: IMM
    name: Immunology & Treatment
    color: "#9a3f36"
    desc: Immune mechanisms, treatment response, and intervention evidence.
    defaultLeader: okafor
    milestones:
      - Separate response from damage
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: POP
    code: POP
    name: Epidemiology & Evolution
    color: "#9a741d"
    desc: Population patterns, surveillance, trials, and evolutionary change.
    defaultLeader: morales
    milestones:
      - Connect cases to populations
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: FIELD
    code: FIELD
    name: Ecology & One Health
    color: "#3d6f52"
    desc: Environmental surveillance, animal reservoirs, and ecosystem connections.
    defaultLeader: singh
    milestones:
      - Connect hosts and environment
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off

# The cast. `division` is what makes a person a valid person stop.
roster:
  - id: ortiz
    name: Dr. Lena Ortiz
    role: Clinical Physiology Lead
    division: CLIN
    quiz:
      - q: Why does Ortiz read vital signs as a delivery chain rather than as separate numbers?
        a: Oxygen reaching tissue depends on every link, so one normal reading does not clear the chain
        wrong:
          - Vital signs all come off one monitor, so they share whatever error it has
          - Only the chain as a whole is recorded in the notes
          - Individual readings are too imprecise to interpret
    bio: Connects vital signs and laboratory measurements to the physical chain that delivers oxygen, water, nutrients, and heat through the body.
  - id: chen
    name: Dr. Maya Chen
    role: Cell Biology Lead
    division: CELL
    quiz:
      - q: Why can one agent damage one tissue and leave another alone?
        a: Cells differ in the receptors and transport their membranes carry
        wrong:
          - Blood reaches some tissues a great deal faster than it reaches others
          - Larger cells absorb more of any substance
          - Damage depends only on the dose that arrives
    bio: Uses cell structure and membrane behavior to explain why the same agent can affect one tissue but not another.
  - id: patel
    name: Dr. Ravi Patel
    role: Molecular Diagnostics Lead
    division: MOL
    quiz:
      - q: What does Patel mean by treating a molecular signal as a claim?
        a: It has to survive its controls, a second method and a known provenance before it means anything
        wrong:
          - Every result has to be published in some form before anybody may act on it
          - A signal is only valid if the same laboratory repeats it
          - Molecular methods are less reliable than culture
    bio: Treats every molecular signal as a claim that must survive controls, independent methods, and provenance checks.
  - id: okafor
    name: Dr. Nia Okafor
    role: Immunology Lead
    division: IMM
    quiz:
      - q: Why does Okafor separate protective immune activity from damage?
        a: The treatment that helps one is the treatment that makes the other worse
        wrong:
          - Only the damaging kind of inflammation shows up in a blood sample
          - Protective responses always resolve without treatment
          - The distinction decides which ward a patient goes to
    bio: Separates protective immune activity from tissue-damaging inflammation and asks what evidence changes an intervention decision.
  - id: morales
    name: Dr. Sofia Morales
    role: Epidemiology Lead
    division: POP
    quiz:
      - q: What is Morales's comparison group actually for?
        a: Without it a change in the numbers cannot be told from a change in who was tested
        wrong:
          - It doubles the size of the sample and narrows the confidence interval
          - It is required before any result can be published
          - It identifies which hospital reported first
    bio: Builds comparisons that distinguish real population change from sampling, bias, and coincidence.
  - id: singh
    name: Dr. Arjun Singh
    role: One Health Lead
    division: FIELD
    quiz:
      - q: Why does Singh refuse to call an animal finding a transmission route?
        a: The animal may have caught it from people, and prevalence and exposure are what separate the two
        wrong:
          - Animal samples cannot be sequenced to the same depth as human ones
          - Transmission routes can only be confirmed experimentally
          - Wildlife sampling is never representative
    bio: Connects human cases to animals, water, and ecosystems without assuming that correlation proves a transmission route.
  - id: nakamura
    name: Rin Nakamura
    role: Critical Care Physician
    division: CLIN
    bio: |-
      Runs the intensive care unit, where the outbreak stops being a case count and
      becomes four people whose oxygen is falling for reasons nobody has settled.

      She reads a patient as a set of coupled systems. A falling oxygen saturation
      can come from the lung, the blood that carries the oxygen or the circulation
      that moves it, and the treatment for each of those is different.

      Her limit is that the sickest patients are the least representative. What is
      happening in her unit is real and it is also the tail of the distribution.
    quiz:
      - q: Why does Nakamura warn against describing the disease from her unit alone?
        a: The sickest patients are the tail of the distribution, not a sample of it
        wrong:
          - Intensive care records are less accurate than ward records
          - Severe cases are treated before they can be measured
          - Her unit only admits patients with confirmed tests
  - id: adeyemi
    name: Funke Adeyemi
    role: Cell Biologist
    division: CELL
    bio: |-
      Works out which cells the pathogen can enter and what it does once inside,
      because that constrains everything downstream — which tissues are damaged,
      which drugs could plausibly work, and which route of transmission is possible.

      She runs a negative control on every plate as a matter of habit. A culture
      that shows an effect without a control showing nothing is a result about the
      laboratory as much as about the pathogen.
    quiz:
      - q: Why does Adeyemi run a negative control on every plate?
        a: Without it, an effect of the laboratory looks like an effect of the pathogen
        wrong:
          - Controls make the cultures grow at a reproducible rate
          - A control is what converts a qualitative result into a quantitative one
          - Controls are required only when the sample is from a patient
  - id: bergstrom
    name: Lena Bergström
    role: Genomic Epidemiologist
    division: MOL
    bio: |-
      Reads sequences for what they say about transmission — who infected whom,
      how long the chain has been running, and whether two clusters are one
      outbreak or two.

      Genetic distance is her main tool and her main trap. Two sequences being
      close is evidence of a recent common ancestor, not evidence that one patient
      infected the other, and the difference matters for every control decision.
    quiz:
      - q: What does Bergström say two nearly identical sequences establish?
        a: A recent common ancestor, which is not the same as one patient infecting the other
        wrong:
          - The direction of transmission between the two patients
          - That both patients were infected on the same day
          - That the pathogen is not mutating
  - id: haddad
    name: Yusuf Haddad
    role: Clinical Immunologist
    division: IMM
    bio: |-
      Separates the damage a pathogen does from the damage the immune response does
      while clearing it, which sounds academic until a treatment has to be chosen.

      Suppressing inflammation helps a patient whose injury is immune-driven and
      harms one who is still fighting the infection. The same drug, the same dose,
      opposite outcomes, decided by where the patient is in their course.
    quiz:
      - q: Why can the same anti-inflammatory treatment help one patient and harm another?
        a: It depends whether the damage is immune-driven or the infection is still winning
        wrong:
          - Doses are calculated from body weight, so they vary between patients on the ward
          - Some patients absorb the drug and others do not
          - The drug expires quickly once a vial is opened
  - id: oduya
    name: Grace Oduya
    role: Field Epidemiologist
    division: POP
    bio: |-
      Builds the case definition, which decides what counts as a case and therefore
      what every curve in the response is a curve of.

      A definition too narrow misses the spread and one too wide fills the count
      with other illnesses. She changes it when she has to and records the change,
      because a curve that bends on the day the definition moved is not evidence
      about the disease.
    quiz:
      - q: Why does Oduya document every change to the case definition?
        a: A bend on the day the definition changed is an artefact
        wrong:
          - Definitions must be approved by the hospitals before use
          - Changing a definition invalidates every laboratory result taken before it
          - The definition determines which treatment a patient receives
  - id: castellanos
    name: Mateo Castellanos
    role: Wildlife Veterinarian
    division: FIELD
    bio: |-
      Samples the animals people live alongside, which is where most new human
      pathogens were living before they were human pathogens.

      Finding the organism in a species proves that species can carry it. Showing
      it is a reservoir needs prevalence, the exposure pattern of the human cases,
      and comparison sites where the illness never appeared — otherwise a bystander
      that caught it from people gets blamed and culled.
    quiz:
      - q: Why is finding the pathogen in an animal not enough to declare a reservoir?
        a: The animal may have caught it from people, and prevalence separates the two
        wrong:
          - Field samples are always contaminated by human handling
          - A reservoir must contain a higher viral load than any patient
          - The organism has to be found in more than one individual animal at the site

# Terms the game may explain in place.
glossary:
  - name: Epidemiology
    aliases:
      - epidemiology
      - epidemiologist
      - epidemiological
    def: The study of how health events are spread through a population, and what makes them spread that way.
  - name: Antibody
    aliases:
      - antibody
      - antibodies
    def: A protein the immune system makes that binds one specific target.
  - name: Catalysis
    aliases:
      - catalysing
      - catalyzing
      - catalyse
      - catalyze
    def: Speeding a reaction by offering an easier path, without being used up. Enzymes are the biological version.
  - name: Codon
    aliases:
      - codon
      - codons
    def: Three letters of genetic code, which together name one amino acid. Change one and the protein may change by one unit.
  - name: Control
    aliases:
      - control
    def: A comparison designed to reveal whether a signal could arise without the proposed cause.
  - name: Diffusion
    aliases:
      - diffusion
      - diffuses
    def: Movement from where there is more to where there is less, with no energy spent. It is why a small molecule crosses a membrane on its own.
  - name: Genomic sequencing
    aliases:
      - genomic
      - genome
      - genomes
    def: Reading the agent’s genetic code, which shows how closely two cases are related.
  - name: Homeostasis
    aliases:
      - homeostasis
    def: The regulation that keeps internal conditions within workable ranges.
  - name: Incidence
    aliases:
      - incidence
    def: How many new cases appear per unit of time. It is the rate; prevalence is the stock.
  - name: Neutralising antibody
    aliases:
      - neutralizing
      - neutralising
    def: An antibody that blocks the agent from entering a cell, rather than merely marking it.
  - name: Pathogen
    aliases:
      - pathogen
      - pathogens
    def: An agent that causes disease — a virus, a bacterium, a parasite.
  - name: Prevalence
    aliases:
      - prevalence
    def: How many people have the illness right now. Long illnesses keep it high after new cases fall.
  - name: Reagent
    aliases:
      - reagent
      - reagents
    def: A chemical added to make a test work, as opposed to the sample being tested.
  - name: Reservoir
    aliases:
      - reservoir
    def: A host population or environment in which an infectious agent can persist.
  - name: Ribosome
    aliases:
      - ribosome
      - ribosomes
    def: The machine in a cell that reads RNA and assembles the protein it specifies.
  - name: RNA
    aliases:
      - RNA
    def: The working copy of a gene, read to make a protein. Many viruses carry their whole genome as RNA.
  - name: Saturation
    aliases:
      - saturation
      - saturated
    def: The point at which adding more changes nothing, because every place it could go is taken.
  - name: Selection
    aliases:
      - selection
    def: A process in which variants differ in reproductive success, changing frequencies over generations.
  - name: Sensitivity
    aliases:
      - sensitivity
    def: The fraction of true cases a test detects.
  - name: Solute
    aliases:
      - solute
      - solutes
    def: The substance dissolved in a liquid, as opposed to the liquid doing the dissolving.
  - name: Specificity
    aliases:
      - specificity
    def: The fraction of unaffected cases a test correctly leaves negative.
  - name: Vector
    aliases:
      - vector
      - vectors
    def: An organism that carries an agent between hosts — a mosquito, a tick — without being where the agent lives.

# The campaign: 1 working day each, 3 stops and a callback from day 3.
missions:
  - title: The First Cluster
    objective: Open an investigation using a defensible provisional case definition and an explicit comparison baseline.
    briefing: Three Riverton hospitals report an unusual combination of fever, dry cough, severe headache, and profound fatigue. The player must decide whether the pattern is a true outbreak signal before scarce emergency resources are committed.
    stake: "Day one. Seven patients, three hospitals, four days, and the same four symptoms in every one of them. Sofia Morales has the printout, and a reporter downstairs already has the number. Today you decide whether this is an outbreak at all, and agree what counts as a case. Seven sounds like a lot. Morales will not say whether it is until she knows what a normal week here looks like."
    takeaway: Use baseline variation, case definition, controls, correlation versus coincidence, measurement bias as an evidence chain rather than as isolated facts.
    stops:
      - group: POP
        task: Say whether this is a real signal, and what on the desk decides it.
        title: Signal or noise?
        concept: "Repeats and numbers: a handful of cases proves little"
        place: Emergency Department Network
        scene: Seven patients across three hospitals in four days, with the same four symptoms. Dr. Sofia Morales has the printouts, and the press office has asked twice whether to say anything.
        guide: >-
          Four options, and one of them says nothing can be known at all. Ask of each
          what it would take to be true. A count on its own is not a signal. It becomes
          one when you have something to compare it with, and this city normally sees
          about two a year. Two of the seven were found another way, outside the alert
          rule.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - a rate counts cases against how many people there are and how long it took
          - the system only sees the patients who reached a hospital
        takeaway: A count becomes a signal only when something says what was expected instead.
        format: CHOICE
        question: The city normally sees about two of these a year. How many were there in four days?
        answerText: A real signal. Two a year is what this city normally sees. And two of the seven were found a second way.
        why: "A count on its own is not a signal. What makes it one is a comparison with what was expected, written down beforehand. This city logs about two of these a year. Seven in four days is not a busy week. The quiet reading matters most: two of the seven were found by hand, outside the alert that found the other five. If every case had come through one alert, the cluster could have belonged to the alert."
        headline: Seven cases in four days, against a thing the city normally logs twice a year.
        readings:
          - zone: Count
            label: Cases meeting the syndrome
            value: 7 in four days
            status: alarm
          - zone: Baseline
            label: Same syndrome
            value: about 2 a year
            status: key
          - zone: Reporting
            label: How the cases were found
            value: 5 by one alert rule
            status: key
          - zone: Denominator
            label: Catchment population
            value: supplied by all three hospitals
            status: normal
          - zone: Season
            label: Other respiratory syndromes this week
            value: flat
            status: normal
          - zone: Geography
            label: Shared address
            value: none found
            status: normal
        choices:
          - label: A real jump above what this city normally sees.
            mechanism: Seven in four days, against about two a year, is far outside what the system normally does.
          - label: Something the shared alert rule created by itself.
            mechanism: Every case was found the same way, by the same rule.
          - label: Ordinary autumn coughs and colds.
            mechanism: This kind of illness is common in autumn, and seven is inside the usual wobble.
          - label: Impossible to say, because nobody knows how many people are out there.
            mechanism: Seven is a count with nothing underneath it.
        answer: A real jump above what this city normally sees.
        rebuttals:
          - The alert rule is the right worry, and it is the one this panel rules out. Five came through it and two did not.
          - Autumn coughs would lift the other illnesses too. Those are flat, so whatever this is, it is not the season.
          - The population figures are on the desk. All three hospitals supplied theirs, so that objection has already been answered.
      - group: POP
        task: Put the four steps in the order each one can be checked in.
        title: What counts as a case
        place: Epidemiology Operations Room
        scene: Three hospitals start counting at six in the morning. Each has written its own idea of what counts. Dr. Lena Ortiz, who leads the ward side, wants one on every desk before the night shift leaves.
        guide: >-
          All four steps will happen. Ask of each what it lets you check. A rule for
          what counts is a tool, and it can be wrong in two directions. Too narrow and
          you miss the spread. Too wide and it fills up with ordinary coughs. So it gets
          tried on known cases and on clear non-cases, and those catch opposite
          mistakes.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim that each step needs the
              one before it to have happened. Get one pair the wrong way round and the claim
              is wrong, even if everything else lines up. That is why there is no part
              credit.
          - >-
              Why the ends are the place to start. The first and last steps are usually the
              easiest to be sure of, because one has nothing before it and the other has
              nothing after it. Fixing those two leaves fewer ways for the middle to go, and
              the middle is where the real question usually is.
          - >-
              What the rail can be ordered on. Often it is time. It can also be cost, or
              risk, or what you can still undo afterwards — do the steps that change nothing
              before the ones that change something for good. A step that destroys the
              sample can only be last.
        assumes:
          - a graph of cases only means something if everybody counted the same thing
          - a definition can be too narrow or too wide, and both are wrong
        takeaway: A definition turns a worry into something two people can count the same way.
        format: SEQUENCE
        why: A definition of what counts is an instrument, and it can be wrong in two directions. Too narrow and most of the spread is invisible. Too wide and the count fills up with ordinary autumn coughs. That is why it gets tested twice before it goes out. Against patients everybody agrees are cases, which catches one that is too narrow. Against people who obviously are not, which catches one that is too wide.
        rebuttals:
          - The notes come first. What these patients share has to come out of the patients, not out of the drafting.
          - Symptoms, timing and place next, because that is what somebody actually applies at four in the morning.
          - Testing before it goes out, not after. Known cases catch a definition that is too narrow, and obvious non-cases catch one that is too wide.
          - The revision date goes out with it. Without one, three hospitals keep counting to a definition everybody knows is temporary.
        cards:
          - Read the notes of the patients already in.
          - Write the symptoms, timing and place plainly enough to use.
          - Try it on known cases, and on clear non-cases.
          - Send it out with a date to revise it.
        order: [1, 0, 2, 3]
      - group: POP
        task: Spend the one slot on what makes tomorrow's numbers usable.
        title: Spend the first afternoon
        concept: Deciding while the answer is still unknown
        place: Clinical Data Office
        scene: Morales can start one thing this afternoon. Four are ready to go, and tomorrow's hospital numbers will land before any second one can start.
        guide: >-
          All four options are real facts about a case. Ask of each whether three
          hospitals could add their numbers together without agreeing on it. Two
          hospitals counting different things produce a total that means nothing. The
          name, the place and the time are all worth having, and none of them changes
          what the number is a count of.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - three hospitals can only be added together if they counted the same way
        takeaway: The best first measurement is the one that makes everything measured later comparable.
        format: CHOICE
        question: Three hospitals are sending numbers tomorrow. What has to be the same before they can be added together?
        choices:
          - The rule for what counts as a case
          - The name of the doctor who reported it
          - The hospital each patient arrived at
          - The time of day the count was made
        answer: The rule for what counts as a case
        rebuttals:
          - Who reported it is worth recording and changes no count.
          - Which hospital they went to is the thing being compared, not fixed.
          - The hour of the count matters far less than what was counted.
        answerText: Start the shared list. Tomorrow's three counts only become one usable picture if the same definition and the same dates made them.
        why: Three hospitals are about to send in three sets of numbers. They can only be added together if the same rule made them. A shared list, with the same dates and the same town figures, is what does that. Testing the sewage gives a separate signal about the whole town, and it cannot say who is ill. Asking experts what they think has nothing underneath it. A warning adds no evidence.
  - title: What Kind of Agent?
    objective: Classify the broad agent category and identify the next discriminating test.
    briefing: Initial samples contain biological material, but the microscope and the routine tests disagree. The team must distinguish a cellular pathogen from a virus or a noninfectious cause without relying on one ambiguous image.
    stake: "Day two. Pathology has four results from the same samples and will not put a name to any of them. The pictures down the microscope are the most convincing thing anybody has seen all week. That is exactly why Maya Chen does not trust them yet. Today you decide what broad kind of thing this is. Everything after today is chosen off that call: what to grow it in, and what tomorrow's test hunts for."
    takeaway: Use cell structure, viruses versus cells, prokaryotes and eukaryotes, staining, independent evidence as an evidence chain rather than as isolated facts.
    stops:
      - group: CLIN
        task: Say which explanation fits every reading, including the quiet ones.
        title: What kind of germ fits everything?
        place: Hospital Pathology Suite
        scene: Pathology has four results from the same samples and still cannot name what this is. The samples are waiting under the hood. Ortiz needs a broad answer before the overnight run is booked.
        guide: >-
          Four options, and three results on the bench are negatives. Nothing
          cell-shaped on the slide. No bacterial marker. No fungal wall. Ask of each
          option how many of those it fits. Bacteria and fungi are cells, so a clean
          slide is a strong statement. The blank being clean rules out the last one.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - some germs are cells that can copy themselves, and viruses cannot copy themselves alone
          - a test that comes back negative is a result, not a missing one
        takeaway: What something is gets settled by several tests together, not by one striking picture.
        format: CHOICE
        question: Bacteria and fungi are cells. Nothing cell-shaped is on the slide. What does that rule out?
        answerText: Something virus-like. Three separate looks for a cell came back empty, and it only copies itself inside living cells.
        why: The negative results do most of the work. Nothing cell-shaped is visible. The marker that finds bacteria is absent. The stain built to find fungal walls is clean, and it rarely misses. The signal only grows where there are living cells to grow in, which fits something that cannot copy itself alone. And the blank is clean, so it did not come out of the room. That is a virus-shaped answer, without naming which one.
        rebuttals:
          - A bacterium is a cell, and it would leave something behind. Three separate looks came back empty.
          - A fungus would show its wall on a stain built to find it. That stain is clean, and it rarely misses.
          - Something from the room is the right suspicion, and the blank is how it gets checked. This blank is clean.
        headline: Several clues from the same samples, and no name yet.
        readings:
          - zone: Microscope
            label: Microscope
            value: No intact cellular forms seen
            status: normal
            note: Several fields examined; image quality is good
          - zone: Host-cell dependence

  - title: The Hidden Transmission Route
    objective: Identify the hidden route and target surveillance where it changes decisions rather than where sampling is easiest.
    briefing: Cases continue despite hospital isolation. Wastewater and neighborhood data suggest transmission is occurring before severe symptoms appear.
    stake: "Day twenty-four, and Morales gets her turn. Ward isolation has held for nine days, and cases keep appearing in streets with nobody in hospital. Grace Oduya kept a sewer sample from the north of the city by chance. It was positive four days before the first patient walked in. Today you decide where this is really being passed on, and where to watch. Oduya has three teams and the city has four drains."
    takeaway: Use incidence, prevalence, transmission chains, sampling, R concepts, asymptomatic spread as an evidence chain rather than as isolated facts.
    stops:
      - group: IMM
        task: Match each stream to what it actually supports.
        title: What each stream is looking at
        place: Wastewater Treatment Plant
        scene: Isolation has held for nine days and cases keep appearing. Four streams of information are on the table at the water plant, and each one saw a different slice of the city.
        guide: >-
          Four streams, and each one looked at a different slice of the city. Pair them
          by asking who is in that group, and what the stream can and cannot show. A
          reading from the sewer does not name a person, and it does not say how the
          germ travels. And a ward stays full while people are still getting better.
        background:
          - >-
              Why you match instead of choosing. A response that is right for one situation
              is often nearly right for the next one. Picking from a list lets you take the
              nearly-right answer and never notice. Matching makes you say which situation
              it fits best, and that comparison is the whole point.
          - >-
              How to use the one-each rule. Every response goes somewhere, and nowhere
              twice. So the situations you are sure about are worth more than themselves:
              each one you settle leaves fewer responses for the ones you are not sure
              about. Two lines you trust can decide the other two for you.
          - >-
              Why one wrong line is impossible. If three lines are right, the fourth
              response has nowhere else to go, so it is right too. Being wrong always means
              at least two are wrong at once. If a join feels forced, the mistake is
              probably not in that join — it is in one you already made and stopped
              questioning.
        assumes:
          - who ends up in a set of numbers is decided by how they were collected
        takeaway: Each stream watches a different group of people, and what it can show follows from which group.
        format: PROTOCOL
        why: Each of these watches a different set of people. The sewage watches everybody, whether or not they went to a hospital, which is why it can move first. It cannot name a person, and it does not prove the water is how anybody caught it. Interviews ask people directly and depend on what they remember. A volunteer survey samples volunteers. And the number of people ill now stays high after new cases fall, because people stay ill for a while.
        columns:
          - What the stream shows
          - What it supports
        rebuttals:
          - Sewage can rise before hospitals do, because it watches everybody rather than the people who came in. It names nobody, and it does not prove the water is the route.
          - Exposures found before anybody felt ill say something about when it passes, from the only stream that asks people directly.
          - A volunteer sample at one station is a sample of volunteers at one station. The bias is in who agreed.
          - How many are on the wards and how many arrive today are different things, and this is how they come apart.
        scenarios:
          - The sewage reading rises before hospital admissions do.
          - Interviews at home find several exposures before people felt ill.
          - A survey at one station asks only people who volunteer.
          - The total on the wards stays high after new admissions fall.
        choices:
          - An early sign from the whole town, not a route.
          - Evidence that people can pass it on before they feel ill.
          - Volunteers at one station, who may not be typical.
          - Each patient takes weeks to recover, so the wards empty slowly.

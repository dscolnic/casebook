        task: Say why only some cells make the landing site.
        title: Same instructions, different cells
        place: Cell Biology Laboratory
        scene: The stain shows the landing site all over the airway cells, and nowhere on the muscle cells two millimetres away. Same patient, same slice, same instructions inside every cell.
        assumes:
          - every cell in a body carries the same set of instructions
        takeaway: Every cell carries the same instructions and reads a different part of them.
        format: CHOICE
        question: Every cell has the same instructions. Why do only some of them make the landing site?
        answerText: The instruction is being read in airway cells and left unread in muscle cells. Both carry it.
        why: Every cell carries the whole set of instructions, so having the instruction explains nothing about where the thing gets made. What decides it is which instructions a cell is reading. That is what makes an airway cell an airway cell rather than a muscle cell. For an outbreak it is the practical point. The germ can only get into cells that make its landing site, which is why this one causes an illness of the airways rather than of the muscles.
        choices:
          - Some kinds of cell read it, and others never do.
          - Only airway cells have that instruction. The muscle cells lost it.
          - The muscle cells make it too, and the stain cannot reach them.
          - The germ makes it, rather than the cell.
        answer: Some kinds of cell read it, and others never do.
        rebuttals:
          - Cells do not throw instructions away as they specialise. Both kinds carry the whole set.
          - The stain shows the thing is absent from the muscle tissue, not merely hard to reach.
          - The landing site is one of the body's own parts. The germ uses it and does not supply it.
  - title: The Animal Connection
    objective: Build a defensible reservoir hypothesis using ecological exposure, prevalence, and genetic relatedness.
    briefing: Genetic similarities and field reports point toward an animal reservoir near the river corridor. The player must investigate without assuming that the most visible species is the source.
    stake: "Day thirty-three. Readings from three patients look close to something found in animals along the river. The council has signed an order to clear the heron colony on Saturday. Mateo Castellanos has been out there twice and says the herons are the wrong animal. Today you decide what part any animal is really playing, and design the sampling that could show it. Nearby is not the same as guilty."
    takeaway: Use reservoirs, vectors, food webs, host range, ecological sampling, One Health as an evidence chain rather than as isolated facts.

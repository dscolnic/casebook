  - title: Why Are Some Patients Sicker?
    objective: Identify the physiological bottleneck and select measurements that distinguish ventilation, diffusion, circulation, and cellular oxygen use.
    briefing: Patients with similar test results have radically different oxygen levels and recovery times. The team must connect cellular damage to organ-system physiology and homeostatic failure.
    stake: "Day thirteen. Nakamura has two patients who arrived with the same complaint and the same results. One is walking to the bathroom. The other is failing, and their oxygen reading looks normal. Today you find which link in the oxygen chain has broken. Nakamura has one line and two patients she would like it in. Treat the wrong link and the treatment is aimed at a part that is working."
    takeaway: Use homeostasis, gas exchange, circulation, oxygen transport, feedback, organ-system integration as an evidence chain rather than as isolated facts.
    stops:
      - group: CLIN
        task: Build the path oxygen takes, then name the step that is holding it up.
        title: Where the oxygen stops getting through
        place: Intensive Care Unit
        scene: A patient's oxygen is dropping while Dr. Lena Ortiz reads the bedside screen. The blood carries plenty. The heart is pumping normally. The new lung pictures are not normal at all.
        guide: >-
          Build the path oxygen takes, in order, from the air in the room to the tissues
          that use it. Then name the link where it is failing for this patient. Read the
          screen rather than guessing: the blood is carrying plenty and the heart is
          pumping normally, and each of those rules a link out.
        background:
          - >-
              What the path is. Air comes into the lungs. Oxygen crosses from the tiny air
              sacs into the blood. The blood carries it, the heart moves it around, and the
              tissues take it up. Each step can fail on its own, and each failure needs
              different treatment.
          - >-
              How the numbers rule links out. Plenty of oxygen carried in the blood means
              the carrying step is fine. A heart pumping normally means the delivery step is
              fine. So the failure has to be somewhere those two do not cover.
          - >-
              Why the lung pictures matter most. They point at the step where oxygen crosses
              from the air into the blood. That is the one link the other measurements
              cannot clear, and it is treated very differently from the others.
        assumes:
          - oxygen has to go from the air into the lungs, into the blood, and out to the body, in that order
          - a normal reading at one step makes a simple failure there less likely
        takeaway: A chain is found by checking every handover, and the normal ones narrow it down as much as the odd ones.
        format: CHAIN
        question: Where is the oxygen path most likely failing?
        chain:
          hint: Build the route oxygen must follow. Then use each reading to ask which link is still compatible with the failure; the largest number on the screen is not automatically the governing one.
          distractor: circulation
          links:
            - id: ventilation
              label: Ventilation to the alveoli
              transfers: fresh gas from the airways to the alveoli
              reading: PaCO₂ 39 mmHg
            - id: gas_exchange
              label: Air–blood gas exchange
              transfers: oxygen across the alveolar-capillary interface
              reading: arterial oxygen low; diffuse alveolar involvement on imaging
            - id: hemoglobin
              label: Haemoglobin carriage
              transfers: oxygen bound in circulating blood
              reading: haemoglobin 14 g/dL
            - id: circulation
              label: Cardiac flow
              transfers: oxygenated blood through the systemic circulation
              reading: cardiac output 5.2 L/min
            - id: tissue_delivery
              label: Tissue delivery and use
              transfers: oxygen from capillary blood to cells
              reading: downstream metabolic evidence not yet complete
          order:
            - ventilation
            - gas_exchange
            - hemoglobin
            - circulation
            - tissue_delivery
          governing: gas_exchange
        answerText: The handover from air into blood, in the lungs. Breathing, carrying and pumping all read normal, and the lung pictures do not.
        why: Oxygen delivery is a chain, so one normal reading proves nothing on its own. The breathing out is near normal, so the patient is not simply under-breathing. The blood carries a normal amount, so there is no shortage of carriers. The heart is moving a normal amount of blood, so the pump is not the problem. What is left is the handover from air to blood, and the lung pictures agree.
        headline: Two patients have severe fatigue and low tissue oxygen delivery.

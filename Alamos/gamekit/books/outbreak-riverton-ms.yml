        concept: "Breaking one step of the chain stops the spread"
        place: Container Laboratory
        scene: The courier leaves in ten minutes and the tray has to be sorted. One side of the bench has touched nothing outside the cabinet. The other has been open to the room, a glove, or a patient.
        guide: >-
          Two bins. Ask where the thing has been since it was last clean. If it has been open
          to the room, it cannot go back to the clean side, however clean it looks.
        background:
          - >-
              Why looking clean is not the test. Germs are too small to see. Once something has been
              open to the room it can carry what the room carries, and it looks exactly the same.

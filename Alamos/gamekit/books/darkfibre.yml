                    A decibel is a logarithm. Multiplying a ratio by ten is not a conversion into one.
            - ask: Do the same for an end in gel and compare.
              answer: 3
              candidates:
                - text: R = 7.8 × 10⁻⁶, which is −41 dB, a difference of 27 dB
                  rule: substitution of the stated values
                  survives: true
                  why: >-
                    The right fraction and its decibel value out by ten. Ten decibels is a factor of

                - text: R = 7.8 × 10⁻⁴, which is −31 dB
                  rule: substitution of the stated values
                  why: >-
                    The step is 0.0082 rather than 0.082 — a factor of ten in the index difference and
                    a hundred in the power.
                - text: R = 0.0359 in gel as well, since the glass is the same
                  rule: the reflection at a step
                  why: >-
                    The reflection is a property of the boundary rather than of the glass. Changing what
                    is on the other side is the whole intervention.
                - text: R = 7.8 × 10⁻⁶, which is −51 dB, a difference of 37 dB
                  rule: substitution of the stated values
          commit: Commit the derivation
      - group: TEST
        task: Find the wavelength this fibre loses least at
        title: A window, and the peak beside it
        concept: 'Scattering, absorption and what makes a material lossy'
        place: Test Room
        scene: >-
          Meier has the loss set up so that the instrument can be tuned across its whole range while
          it measures a kilometre of spare fibre on the drum. Nothing has been swept on this station
          for eleven years.
        guide: >-
          Move the tuning across the range and read the loss the drum returns at each setting you
          actually stop at. Only the points you visit are plotted, so the curve is what you have
          built rather than what the instrument drew. The criterion is the lowest loss per kilometre;
          note also that there is a narrow rise somewhere in the middle that is not scattering.
        assumes:
          - scattering falls steeply as the wavelength gets longer
        takeaway: A fibre has a window where scattering has fallen away and absorption has not yet begun.
        format: SWEEP
        question: >-
          A kilometre of this fibre loses least at one setting. Where is it?
        sweep:
          axis: { label: Wavelength, unit: nm, min: 1200, max: 1650, step: 5 }
          readout: { label: Loss, unit: dB/km }
          baseline: 1.05
          response:
            - { at: 1200, value: 1.05 }
            - { at: 1250, value: 0.78 }
            - { at: 1300, value: 0.44 }
            - { at: 1330, value: 0.52 }
            - { at: 1360, value: 1.10 }
            - { at: 1385, value: 1.95 }
            - { at: 1410, value: 0.98 }
            - { at: 1450, value: 0.42 }
            - { at: 1500, value: 0.27 }
            - { at: 1530, value: 0.21 }
            - { at: 1555, value: 0.185 }
            - { at: 1580, value: 0.21 }
            - { at: 1610, value: 0.26 }
            - { at: 1650, value: 0.34 }
          target: 1555
          tolerance: 20
          start: 1200
          commit: Mark the lowest-loss setting
        answerText: >-
          About 1555 nm, at 0.19 dB/km. The rise at 1385 is absorption by water in the glass rather
          than scattering, which is why the curve is not smooth.
        why: >-
          The loss is lowest near 1555 nanometres, at about 0.19 decibels a kilometre. Two things are
          happening at once. Scattering by the tiny irregularities of the glass falls steeply as the
          wavelength grows — as the fourth power of it — which is the whole downward slope. Absorption
          by the glass itself rises at the long end. Between them is a window, and the narrow spike in
          the middle is water trapped in the glass absorbing at its own wavelength, which is a
          property of the molecule and not of the fibre's quality.
      - group: AMP
        task: Ask Tanaka what the pump telemetry reports
        title: Current, and not light
        concept: 'Stimulated emission, population inversion and gain'
        place: Amplifier and Power Hall
        person: true
        scene: >-
          Tanaka has repeater 6's telemetry on the screen: a pump current, a case temperature and a
          supply voltage, four years of them, all inside limits.
        guide: >-
          All four options are things the telemetry could be evidence of. Ask of each what would have
          to be true for a current to establish it, given that everything the amplifier does depends
          on how many atoms are held in the upper state at any moment. One of the four is what a
          current cannot reach.
        takesAsRead:
          - Atomic energy levels, and the wavelengths they allow
        assumes:
          - an amplifier works by holding more atoms excited than not
        takeaway: A pump current says power is going in; the gain depends on how many atoms that power is actually exciting.
        format: CHOICE
        question: What does four years of good pump telemetry establish?
        why: >-
          It establishes that the pump laser is being driven. Gain depends on the population
          inversion — on more erbium atoms being in the upper state than the lower — and that depends
          on the pump's optical output rather than on its drive current. A laser diode's output falls
          with age at a constant current, which is exactly the failure that leaves telemetry looking
          perfect. Nothing on that screen reaches the number that matters, which is why the last
          fortnight has been spent inferring it from the far end of a fibre.
        choices:
          - That the pump laser is being driven, and nothing about its output
          - That the amplifier is producing its designed gain
          - That the population inversion has been maintained
          - That the repeater's fibre coil is undamaged
        answer: That the pump laser is being driven, and nothing about its output
        rebuttals:
          - Gain is set by the optical output, and a diode's output at fixed current falls as it ages.
          - An inversion is a count of excited atoms, and no electrical reading of the pump reports it.
          - A damaged coil would change the loss and not the current the pump draws.
  # ---------------------------------------------------------------- day 4
  - title: What the span can afford
    objective: Add up the loss along the span and see what is left of the allowance.
    briefing: Four decibels arrived overnight, and nobody has said what the span had spare.
    stake: >-
      Thursday, and the argument in the test room has a number in it for the first time. Sarraf's
      position all week has been that the trace is a measurement and the ship should be sent to the
      kilometre it names; Okonkwo's is that a better number is worth waiting for. Today the
      arithmetic decides it, because whether the span still works at all depends on what the loss
      adds up to against what the receiver can accept. Nadia Farouk, the radiographer, has the
      housing records the ship will need whichever position it is given. Today you total the loss
      budget, settle what attenuation per kilometre means, and see what a radiography record has to
      carry. A week spent finding a better position is a week the traffic is on a diverse route
      that has no spare of its own.
    takeaway: Losses in decibels add, so a budget is a sum and what is left of it is a margin.
    stops:
      - group: TEST
        task: Total the loss along the span
        title: Twenty-one point eight
        concept: Power in decibels, and why a loss budget adds
        place: Test Room
        scene: >-
          The span is 84.6 kilometres of fibre at 0.19 decibels a kilometre, with eleven joints at
          0.15 each, and the new event at 4.1. Sarraf wants the total against the receiver's
          allowance of 24 decibels.
        guide: >-
          You build the working a line at a time. Every loss here is quoted in decibels, and decibels
          are logarithms, so the stages add rather than multiply. Take the span first, then the
          joints, then the event, and only at the end turn the total into a power ratio — because that
          is where the size of what has happened becomes visible.
        background:
          - >-
            Why a logarithm makes a sum. Each stage multiplies the power by a fraction, and the
            logarithm of a product is the sum of the logarithms. So a chain of fifteen losses becomes
            an addition of fifteen numbers, which is the whole reason the unit exists.
          - >-
            What 21.8 decibels is as a ratio. It is a factor of 151: for every hundred and fifty-one
            photons launched, one arrives. The receiver's allowance of 24 decibels is a factor of 251,
            so what is left is a margin of 2.2 decibels, which is a factor of 1.66 and is not much.
          - >-
            Why this settles today's argument. With 2.2 decibels of margin the span is working and it
            is one small event away from not working. That is an argument for sending the ship on the
            best number available rather than for spending a week refining it — which is Sarraf's
            position, and on today's numbers she is right.
        assumes:
          - a loss in decibels is ten times the logarithm of the power ratio
        takeaway: A loss budget is an addition because decibels are logarithms, and the margin left is what a span has in hand.
        format: DERIVE
        question: What is the total loss on the span, and what margin is left?
        answerText: >-
          21.8 dB, leaving 2.2 dB of the 24 dB allowance. That total is a factor of 151 in power.
        why: >-
          The span loses 21.8 decibels and has 2.2 left. Decibels are logarithms of power ratios, so
          the fifteen stages add: 16.1 for the fibre itself, 1.65 for the eleven joints and 4.1 for
          the new event. Converting the total back gives a factor of 151, against the receiver's
          allowance of a factor of 251. A margin of 2.2 decibels is a third of one bad joint, which is
          why the traffic was moved on the night and why a week of refinement is a week of exposure.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: loss(dB) = 10·log₁₀(P_in/P_out)
          startNote: 84.6 km at 0.19 dB/km, 11 joints at 0.15 dB, one event at 4.1 dB, allowance 24 dB
          goal: the total loss in decibels, and the margin against the allowance
          askRule: true
          rules:
            - loss per unit length
            - decibels add along a path
            - conversion to a power ratio
            - substitution of the stated values
            - rearrangement
          steps:
            - ask: Get the loss of the fibre itself.
              answer: 2
              candidates:
                - text: 0.19 ÷ 84.6 = 0.0022 dB
                  rule: rearrangement
                  why: >-
                    Divided rather than multiplied. A longer fibre would then lose less, which is
                    backwards.
                - text: 0.19^84.6, since losses multiply
                  rule: decibels add along a path
                  survives: true
                  why: >-
                    Losses do multiply — as power ratios. In decibels they add, and raising a decibel
                    figure to a power is mixing the two currencies in one line.
                - text: 0.19 × 84.6 = 16.1 dB
                  rule: loss per unit length
                - text: 0.19 × 84,600 = 16,074 dB
                  rule: substitution of the stated values
                  why: >-
                    The rate is per kilometre and the length has been put in metres. Sixteen thousand
                    decibels is more loss than there is light in the universe.
            - ask: Add the joints and the event.
              answer: 0
              candidates:
                - text: 16.1 + 11 × 0.15 + 4.1 = 21.8 dB
                  rule: decibels add along a path
                - text: 16.1 + 0.15 + 4.1 = 20.4 dB
                  rule: decibels add along a path
                  survives: true
                  why: >-
                    One joint counted instead of eleven. It is 1.4 decibels light, which is inside what
                    anybody would call agreement and is most of the margin.
                - text: 16.1 × 11 × 0.15 × 4.1 = 109 dB
                  rule: rearrangement
                  why: >-
                    Multiplied. That is what would be done with the ratios themselves, and it is the
                    reason the unit is a logarithm.
                - text: 16.1 + 11 × 0.15 = 17.8 dB
                  rule: decibels add along a path
                  why: >-
                    The new event left out of the total, which is the one term the fortnight is about.
            - ask: Turn the total into a power ratio.
              answer: 1
              candidates:
                - text: 10^(21.8) = 6 × 10²¹
                  rule: conversion to a power ratio
                  why: >-
                    The divisor of ten is missing from the exponent. Decibels are ten times a
                    logarithm, so the conversion back divides by ten first.
                - text: 10^(21.8/10) = 151
                  rule: conversion to a power ratio
                - text: 21.8 × 10 = 218
                  rule: conversion to a power ratio
                  survives: true
                  why: >-
                    Multiplying by ten instead of taking a power of ten. It gives 218 against 151, which
                    is the right order and would make the margin look like a factor rather than a
                    difference.
                - text: 2^21.8 = 3.6 × 10⁶
                  rule: rearrangement
                  why: >-
                    A decibel is built on tens, not twos. The three-decibel doubling rule is a
                    consequence of that and not a definition.
            - ask: Take the margin against the allowance.
              answer: 3
              candidates:
                - text: 24 ÷ 21.8 = 1.10, so there is ten per cent in hand
                  rule: rearrangement
                  why: >-
                    Decibels are subtracted, not divided. Dividing two logarithms gives a number that
                    means nothing.
                - text: 24 − 21.8 = 2.2 dB, which is a factor of 251
                  rule: substitution of the stated values
                  survives: true
                  why: >-
                    The subtraction is right and the ratio quoted is the allowance's rather than the
                    margin's. 251 is what 24 decibels is; 2.2 decibels is a factor of 1.66.
                - text: 24 + 21.8 = 45.8 dB of margin
                  rule: decibels add along a path
                  why: >-
                    An allowance is what may be spent, so the spend is taken off it. Adding gives more
                    margin the worse the span gets.
                - text: 24 − 21.8 = 2.2 dB, which is a factor of 1.66
                  rule: substitution of the stated values
          commit: Commit the derivation
      - group: AMP
        task: Settle what a loss per kilometre means
        title: The same fraction every kilometre
        concept: Exponential attenuation along a path
        place: Amplifier and Power Hall
        scene: >-
          Bruno Salas, the power feed engineer, has the span's loss on the hall board, written as a
          rate. A technician has asked him a question about it. Do the tenth kilometre and the
          eightieth take out the same amount?
        guide: >-
          Four readings of what a loss quoted per kilometre asserts. Ask of each whether it is about
          an amount of power or a fraction of it, because the difference decides whether a long span
          ends with a little light or with none, and whether adding an amplifier half way is worth
          anything.
        takesAsRead:
          - Power in decibels, and why a loss budget adds
        assumes:
          - a fixed loss per unit length is a fixed fraction per unit length
        takeaway: A rate quoted per unit length is a fraction rather than an amount, and the two behave nothing alike over a long path.
        format: CHOICE
        question: What does 0.19 decibels a kilometre assert about the eightieth kilometre?
        why: >-
          It asserts that the eightieth kilometre takes the same fraction as the first, which is
          about 4.3 per cent, and therefore far less power. That is what a constant figure in decibels
          means: equal lengths remove equal fractions, so the power falls exponentially. It never
          reaches zero, which is why the limit on a span is the receiver's sensitivity rather than the
          fibre running out of light, and why an amplifier half way along is worth exactly the loss
          it makes up.
        choices:
          - It removes the same fraction as the first kilometre, and so less power
          - It removes the same amount of power as the first kilometre
          - It removes more than the first, since the pulse has spread
          - It removes nothing, since the loss is quoted as an average
        answer: It removes the same fraction as the first kilometre, and so less power
        rebuttals:
          - A constant amount would take the light to exactly zero at a stated distance, and no span behaves that way.
          - Spreading is dispersion and changes the shape of the pulse rather than the power in it.
          - An average over the span would still have to be spent somewhere, and it is spent evenly.
      - group: RAD
        task: Ask Farouk what a radiograph has to carry with it
        title: Four things written on the corner
        concept: 'A record that carries the conditions it was taken under'
        place: Radiography Bay
        person: true
        scene: >-
          Farouk has three radiographs of the same weld on the bay bench, taken over two years. All
          three show the weld. Only one of them has anything written on its corner.
        guide: >-
          Each thing on the left is written on the corner of a good radiograph. Match it to what
          somebody comparing two films would use it for. What separates them is which of them is
          about the source, which about the geometry, and which about the film — because comparing
          two films means holding all three constant.
        takesAsRead:
          - Power in decibels, and why a loss budget adds
        assumes:
          - two records can only be compared if the conditions they were taken under are known
        takeaway: A record without its conditions is a picture; with them it is a measurement that can be compared with another.
        format: PROTOCOL
        task: Match each note on a radiograph to what it is there for.
        scenarios:
          - The date the source was last replaced.
          - The distance from the source to the film.
          - The exposure time, in minutes.
          - The thickness of steel the beam passed through.
        choices:
          - It says how strong the source was on the day, without measuring it.
          - It fixes how much the beam had spread before it arrived.
          - It is what has to grow as the source ages, and the only thing the radiographer controls.
          - It says how much of the beam was absorbed before the film saw any of it.
        mapping: [0, 1, 2, 3]
        why: >-
          Four numbers, four different jobs. The source's age gives its strength without a
          measurement, because activity falls on a known schedule. The distance fixes the spreading,
          which goes as the inverse square. The exposure time is the one thing under the
          radiographer's control and it has to grow as the source decays. And the steel thickness
          decides how much arrives at all, exponentially. Take any one of them away and two films of
          the same weld cannot be compared.
  # ---------------------------------------------------------------- day 5
  - title: How much is one photon
    objective: Work out what a piece of light at this wavelength is worth, and how many make a bit.
    briefing: The receiver is working with a few thousand arrivals a bit and nobody has counted them.
    stake: >-
      Friday, and Duarte has asked a question the test room cannot answer with decibels. If the
      power arriving is seven billionths of a watt, how many pieces of light is that a second — and
      how many of them make up one bit? Tanaka needs the same number from the other end, because an
      amplifier's gain is a count of photons out against photons in. Nilsen has the launch power at
      the termination and has never converted it into anything. Today you work out the energy of one
      photon at the wavelength this cable runs at, count the arrivals in a bit, and settle why a
      pulse arrives wider than it left. Everything about a receiver's limit is a statement about
      counting.
    takeaway: Light arrives in pieces of a fixed size, so a power is a rate of arrivals.
    stops:
      - group: AMP
        task: Get the energy of one photon at this wavelength
        title: Eight tenths of an electron volt
        concept: 'Photons: energy, momentum and the quantum of light'
        place: Amplifier and Power Hall
        scene: >-
          Tanaka has the two wavelengths this amplifier works at on the board and Planck's constant
          beside them. She wants the energy of one photon at 1550 nanometres, in electron volts, and
          how many of them a milliwatt is.
        guide: >-
          You build the working a line at a time. A photon's energy depends only on its colour, and
          the two ways of writing that — through the frequency or through the wavelength — are the same
          statement. Get the energy in joules first, then convert to electron volts, then divide a
          power by it to turn watts into arrivals a second.
        background:
          - >-
            Why the wavelength divides. Frequency and wavelength are inversely related through the
            speed of light, so a longer wavelength is a lower frequency and a smaller energy. A photon
            at 980 nanometres carries 1.27 electron volts against 0.80 at 1550, which is the whole
            reason an amplifier can be pumped at the shorter wavelength and give out at the longer.
          - >-
            Why the electron volt is the natural unit. A joule is a household quantity and a photon is
            not: 1.28 × 10⁻¹⁹ joules is hard to hold in the head, and 0.80 electron volts can be
            compared straight away with the band gaps of the materials a detector is made of.
          - >-
            What the arrival rate is for. A milliwatt is 7.8 × 10¹⁵ photons a second, which sounds
            like an inexhaustible supply until it is divided by ten billion bits a second and reduced
            by a factor of 151 along the span. Then it is a few thousand a bit, and a few thousand of
            anything counted has a scatter.
        assumes:
          - light of one wavelength arrives only in whole quanta of a fixed energy
        takeaway: A photon's energy is fixed by its wavelength alone, so a power in watts is a rate of arrivals in photons a second.
        format: DERIVE
        question: What is the energy of a photon at 1550 nm, and how many are in a milliwatt?
        answerText: >-
          1.28 × 10⁻¹⁹ J, which is 0.80 eV. A milliwatt is 7.8 × 10¹⁵ of them a second.
        why: >-
          A photon at 1550 nanometres carries 1.28 × 10⁻¹⁹ joules, or 0.80 electron volts, and a
          milliwatt is 7.8 × 10¹⁵ of them a second. The energy comes from Planck's constant times the
          frequency, and the frequency from the speed of light over the wavelength — so the two
          constants arrive together as hc, which is 1.99 × 10⁻²⁵ joule metres and worth remembering.
          Dividing a power by the energy of one photon is what turns watts into a count, and the count
          is what the receiver's limit is really about.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: E = h·f = h·c/λ
          startNote: h = 6.626 × 10⁻³⁴ J·s, c = 2.998 × 10⁸ m/s, λ = 1550 nm, 1 eV = 1.602 × 10⁻¹⁹ J
          goal: the photon energy in electron volts, and the arrival rate for one milliwatt
          askRule: true
          rules:
            - the quantum of energy
            - wavelength and frequency
            - conversion of units
            - a power divided by an energy
            - rearrangement
          steps:
            - ask: Get the frequency from the wavelength.
              answer: 0
              candidates:
                - text: f = c/λ = 2.998 × 10⁸ ÷ 1.55 × 10⁻⁶ = 1.93 × 10¹⁴ Hz
                  rule: wavelength and frequency
                - text: f = c·λ = 465 m²/s
                  rule: rearrangement
                  why: >-
                    Multiplied. The units are metres squared a second, which is not a frequency of
                    anything.
                - text: f = c/λ = 2.998 × 10⁸ ÷ 1550 nm = 1.93 × 10⁵ Hz, in nanometres
                  rule: wavelength and frequency
                  survives: true
                  why: >-
                    The wavelength left in nanometres. It is nine orders out and it is a perfectly
                    ordinary-looking radio frequency, so nothing about it reads as absurd.
                - text: f = λ/c = 5.2 × 10⁻¹⁵ s
                  rule: rearrangement
                  why: >-
                    Inverted: that is a period rather than a frequency, and it is in seconds.
            - ask: Get the energy in joules.
              answer: 2
              candidates:
                - text: E = h/f = 3.4 × 10⁻⁴⁸ J
                  rule: rearrangement
                  why: >-
                    Divided rather than multiplied. A bluer photon would then carry less energy.
                - text: E = h·c·λ = 3.1 × 10⁻³¹ J
                  rule: the quantum of energy
                  why: >-
                    The wavelength multiplying where it divides. It has the wrong units by a metre
                    squared.
                - text: E = h·f = 6.626 × 10⁻³⁴ × 1.93 × 10¹⁴ = 1.28 × 10⁻¹⁹ J
                  rule: the quantum of energy
                - text: E = h·c/λ = 1.99 × 10⁻²⁵ ÷ 1.55 = 1.28 × 10⁻²⁵ J
                  rule: the quantum of energy
                  survives: true
                  why: >-
                    The same relation with the wavelength in micrometres against an hc in joule metres.
                    The digits are exactly right and the exponent is six out, which is the hardest kind
                    of error to see in this form.
            - ask: Convert it into electron volts.
              answer: 1
              candidates:
                - text: 1.28 × 10⁻¹⁹ × 1.602 × 10⁻¹⁹ = 2.05 × 10⁻³⁸ eV
                  rule: conversion of units
                  why: >-
                    Multiplied by the conversion instead of divided by it. An electron volt is a small
                    unit, so the number of them should be larger rather than vanishing.
                - text: 1.28 × 10⁻¹⁹ ÷ 1.602 × 10⁻¹⁹ = 0.80 eV
                  rule: conversion of units
                - text: 1.28 × 10⁻¹⁹ ÷ 1.602 = 0.80 × 10⁻¹⁹ eV
                  rule: conversion of units
                  survives: true
                  why: >-
                    The mantissas divided and the exponents left alone. The leading digits are right
                    and the answer is nineteen orders too small, which is invisible if only the digits
                    are checked.
                - text: 1.28 × 10⁻¹⁹ J is already in electron volts
                  rule: conversion of units
                  why: >-
                    A joule and an electron volt are different sizes by a factor of 1.6 × 10⁻¹⁹, which
                    is exactly what makes both useful.
            - ask: Turn a milliwatt into arrivals a second.
              answer: 3
              candidates:
                - text: 10⁻³ × 1.28 × 10⁻¹⁹ = 1.28 × 10⁻²² photons/s
                  rule: rearrangement
                  why: >-
                    Multiplied. A power times an energy is not a rate of anything.
                - text: 10⁻³ ÷ 0.80 = 1.25 × 10⁻³ photons/s
                  rule: a power divided by an energy
                  why: >-
                    Divided by the energy in electron volts rather than in joules, so the units do not
                    cancel and the answer is a thousandth of a photon a second.
                - text: 10⁻³ ÷ 1.93 × 10¹⁴ = 5.2 × 10⁻¹⁸ photons/s
                  rule: a power divided by an energy
                  survives: true
                  why: >-
                    Divided by the frequency rather than by the energy. Planck's constant has gone
                    missing, and what comes out has the units of joule seconds.
                - text: 10⁻³ ÷ 1.28 × 10⁻¹⁹ = 7.8 × 10¹⁵ photons/s
                  rule: a power divided by an energy
          commit: Commit the derivation
      - group: RECV
        task: Count the arrivals in one bit
        title: Six thousand a bit
        concept: 'Counting statistics, and the noise a stream of photons has of its own'
        takesAsRead:
          - "Photons: energy, momentum and the quantum of light"
        place: Receiver Lab
        scene: >-
          Duarte has the receiver's sensitivity on the bench in watts, the line rate beside it, and
          this morning's photon energy on a slip of paper. She wants the arrivals per bit.
        guide: >-
          Four quantities are offered and three of them make the answer. A power divided by the energy
          of one arrival gives arrivals a second; dividing again by the bits a second gives arrivals a
          bit. The launch power is on the list because it belongs at the other end of the span, and it
          is 151 times larger than what arrives.
        assumes:
          - a stream of arrivals has a spread of about the square root of its count
        takeaway: A receiver at the end of a long span is counting a few thousand arrivals a bit, and the root of that count is its floor.
        format: BALLPARK
        question: How many photons arrive in one bit at the receiver's sensitivity?
        estimate:
          prompt: >-
            The error floor is a statement about counting, so the count has to be got first. This is
            the power the receiver is specified down to, at the rate this system runs.
          question: How many photons arrive in one bit at the receiver's sensitivity?
          relationship: >-
            Arrivals a bit = the power arriving, divided by the energy of one photon, divided by the
            bits a second.
          labels:
            - 7.9e-6 W  (power at the receiver's sensitivity)
            - 1.28e-19 J  (energy of one photon at this wavelength)
            - 1.0e10 bits/s  (the line rate)
            - 1.2e-3 W  (the power launched at the far end)
          values: [0.0000079, 1.28e-19, 10000000000, 0.0012]
          slots: 3
          template: '{0} ÷ {1} ÷ {2}'
          formula: a/b/c
          correct: [0, 1, 2]
          target: 6172
          tolerance: 200
          units: photons per bit
          solution: 7.9 × 10⁻⁶ ÷ 1.28 × 10⁻¹⁹ ÷ 10¹⁰ ≈ 6,200 photons a bit.
          explanation: >-
            The launched power is 151 times larger and belongs at the other end of the span. Using it
            here would say the receiver has a million arrivals a bit to work with, which is the
            difference between a comfortable link and one at its limit.
        why: >-
          About six thousand photons arrive in each bit. That is a large number of anything except a
          count: the spread of a count is about its square root, so six thousand arrivals carry a
          natural unevenness of about eighty, which is over one per cent. No improvement to the
          electronics touches it, because it is a property of light arriving in pieces. The two ways
          to get further are more photons — a better amplifier or a shorter span — or fewer bits a
          second.
      - group: TERM
        task: Ask Nilsen why a pulse arrives wider
        title: Wider than it left
        concept: 'Dispersion, and why a pulse spreads as it travels'
        place: Cable Termination Room
        person: true
        scene: >-
          Nilsen has the launched pulse and the received one on the same screen, the second visibly
          broader than the first. Nothing about the span has changed except that the light has been
          along it.
        guide: >-
          All four options are things that could broaden a pulse over eighty-four kilometres. Ask of
          each whether it would broaden the pulse or weaken it, because those are different faults
          with different cures, and one of them is a property of the glass that no amount of care in
          the termination can remove.
        assumes:
          - a pulse of light contains a small range of wavelengths rather than one exactly
        takeaway: A pulse is not one wavelength, and anything that depends on wavelength therefore acts on its shape.
        format: CHOICE
        question: Why does the pulse arrive wider than it left?
        why: >-
          Because the pulse is not one wavelength but a narrow band of them, and the index of the
          glass is slightly different for each — so the parts of the pulse arrive at slightly
          different times and it spreads. That is dispersion, and it is a property of the material.
          It is why a long span has a bit rate limit as well as a power limit, and why the fibre's
          own index is not quite the number a pulse travels at, which is the correction the ship's
          chart is missing.
        choices:
          - Its colours travel at slightly different speeds in the glass
          - Light has been lost, so the pulse is weaker and looks broader
          - The joints along the span each delay part of the light
          - The amplifier at the far end stretches what it amplifies
        answer: Its colours travel at slightly different speeds in the glass
        rebuttals:
          - Losing power lowers a pulse without widening it; the two effects are measured separately.
          - A joint adds a fixed delay to everything passing through it, which moves a pulse rather than spreading it.
          - An amplifier adds power and noise, and the pulse leaves it the width it arrived.
  # ---------------------------------------------------------------- day 6
  - title: One electron for one photon
    objective: Get the receiver's current per watt out of the physics rather than off a label.
    briefing: The photodiode's data sheet gives a number and Osgood measures a different one.
    stake: >-
      Monday, and seven working days to the ship. Karl Osgood, the photodiode technician, has
      measured the receiver's diode at 82 arrivals converted in every hundred and the data sheet
      claims ninety. Duarte needs the current per watt either way, because the whole sensitivity
      figure the loss budget was closed against rests on it. Ramnarine has four defective joints from
      the shore end on her bench and wants to know which of them a trace could have seen. Today you
      derive the current a watt of light produces, sort four faults by the signature each leaves, and
      settle with Sam Achebe, the fibre preparation technician, how two reflections can cancel each
      other. A sensitivity figure that is ten
      per cent optimistic is a decibel of the margin that is not there.
    takeaway: A detector converts arrivals to charges, so its current per watt is fixed by the wavelength and its own efficiency.
    stops:
      - group: RECV
        task: Get the current a watt of light produces
        title: One amp a watt, near enough
        concept: 'Photodetection: quantum efficiency and responsivity'
        takesAsRead:
          - The photoelectric effect, and a threshold that is about energy per photon
        place: Receiver Lab
        scene: >-
          Osgood has the diode's measured efficiency on the bench — 82 charges for every hundred
          arrivals — and this morning's photon energy beside it. Duarte wants the current per watt.
        guide: >-
          You build the working a line at a time. A watt is a number of arrivals a second, and each
          arrival that is converted releases one charge, so the current is a count times the charge on
          one of them. Take the arrivals first, apply the efficiency, then attach the charge. The
          wavelength enters only through the energy of one arrival.
        background:
          - >-
            Why the answer is close to one. At this wavelength a photon carries 0.80 electron volts,
            and an electron volt is exactly the energy an electron gains through a volt — so the
            current per watt comes out near the reciprocal of that number of volts. An efficiency of
            0.8 and a photon energy of 0.8 electron volts happen to cancel, which is a coincidence and
            a useful one to notice.
          - >-
            Why the responsivity rises with wavelength. Longer wavelengths mean less energy per
            arrival, so a watt is more arrivals, so more charges: the responsivity of a perfect
            detector is proportional to the wavelength. That continues only until the arrivals are too
            weak to free a charge at all, which is the cut-off.
          - >-
            What the ten per cent is worth. The difference between the sheet's 0.90 and the measured
            0.82 is 0.4 decibels of sensitivity, which against 2.2 decibels of margin is a fifth of
            everything the span has spare. It is also the difference between a figure somebody
            measured and a figure somebody printed.
        assumes:
          - a converted arrival releases exactly one unit of charge
        takeaway: Responsivity is the efficiency times the charge divided by the energy of one arrival, and it grows with the wavelength.
        format: DERIVE
        question: What current does one watt at this wavelength produce in this diode?
        answerText: >-
          About 1.03 A. A watt is 7.8 × 10¹⁸ arrivals a second, 82 per cent are converted, and each
          gives 1.602 × 10⁻¹⁹ C.
        why: >-
          One watt produces about 1.03 amps. A watt at 1550 nanometres is 7.8 × 10¹⁸ arrivals a
          second; 82 per cent of them free a charge; each charge is 1.602 × 10⁻¹⁹ coulombs. The
          product is a current, and dividing by the watt makes it a responsivity. Written as one
          expression it is the efficiency times the charge over the photon energy, which shows the
          wavelength dependence: at 1300 nanometres the same diode would give 0.86 amps a watt with
          no change to the diode at all.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: R_λ = η·e/(h·f)
          startNote: η = 0.82, e = 1.602 × 10⁻¹⁹ C, photon energy at 1550 nm = 1.28 × 10⁻¹⁹ J
          goal: the current per watt, in amps a watt
          askRule: true
          rules:
            - a power divided by an energy
            - the efficiency of conversion
            - charge times a rate
            - substitution of the stated values
            - rearrangement
          steps:
            - ask: Turn one watt into arrivals a second.
              answer: 3
              candidates:
                - text: 1 × 1.28 × 10⁻¹⁹ = 1.28 × 10⁻¹⁹ arrivals/s
                  rule: rearrangement
                  why: >-
                    Multiplied by the energy of one arrival rather than divided by it. A watt is not a
                    fraction of a photon.
                - text: 1 ÷ 0.80 = 1.25 arrivals/s
                  rule: a power divided by an energy
                  why: >-
                    Divided by the energy in electron volts, so the units have not cancelled. A watt is
                    a joule a second and the energy has to be in joules.
                - text: 1 ÷ 1.28 × 10⁻¹⁹ = 7.8 × 10¹⁸ arrivals/s, times the efficiency already
                  rule: the efficiency of conversion
                  survives: true
                  why: >-
                    The right count with the efficiency applied a line early. It gets applied again at
                    the next step, so the answer comes out at 0.84 rather than 1.03 — a difference of
                    0.9 decibels, and nothing in the working looks wrong.
                - text: 1 ÷ 1.28 × 10⁻¹⁹ = 7.8 × 10¹⁸ arrivals/s
                  rule: a power divided by an energy
            - ask: Apply the efficiency.
              answer: 0
              candidates:
                - text: 0.82 × 7.8 × 10¹⁸ = 6.4 × 10¹⁸ charges/s
                  rule: the efficiency of conversion
                - text: 7.8 × 10¹⁸ ÷ 0.82 = 9.5 × 10¹⁸ charges/s
                  rule: rearrangement
                  why: >-
                    Divided by an efficiency less than one, which gives more charges out than arrivals
                    in.
                - text: 0.82 × 0.82 × 7.8 × 10¹⁸ = 5.2 × 10¹⁸ charges/s
                  rule: the efficiency of conversion
                  why: >-
                    The efficiency applied twice. It is what the previous line's survivor leads to and
                    it is 1.6 decibels low.
                - text: 7.8 × 10¹⁸ charges/s, since each arrival frees a charge
                  rule: the efficiency of conversion
                  survives: true
                  why: >-
                    True of a perfect detector and this one is not: 18 arrivals in a hundred are
                    absorbed without freeing anything, or pass straight through. It gives the data
                    sheet's ideal figure of 1.25 amps a watt.
            - ask: Turn charges a second into a current.
              answer: 1
              candidates:
                - text: I = 6.4 × 10¹⁸ ÷ 1.602 × 10⁻¹⁹ = 4.0 × 10³⁷ A
                  rule: rearrangement
                  why: >-
                    Divided by the charge rather than multiplied. The size of the answer is the check.
                - text: I = 6.4 × 10¹⁸ × 1.602 × 10⁻¹⁹ = 1.03 A
                  rule: charge times a rate
                - text: I = 6.4 × 10¹⁸ A
                  rule: charge times a rate
                  survives: true
                  why: >-
                    A count of charges a second reported as a current. It is the right physical
                    quantity in the wrong units, and the conversion is the whole of what a coulomb is.
                - text: I = 1.602 × 10⁻¹⁹ ÷ 6.4 × 10¹⁸ = 2.5 × 10⁻³⁸ A
                  rule: rearrangement
                  why: >-
                    Inverted, and the answer is a current no instrument could detect.
            - ask: Say what the responsivity would be at 1300 nm.
              answer: 2
              candidates:
                - text: the same, 1.03 A/W, since the diode has not changed
                  rule: substitution of the stated values
                  survives: true
                  why: >-
                    The diode has not changed and the light has. A shorter wavelength carries more
                    energy per arrival, so a watt of it is fewer arrivals and fewer charges.
                - text: higher, about 1.23 A/W, since shorter wavelengths carry more energy
                  rule: rearrangement
                  why: >-
                    More energy per arrival means fewer arrivals in a watt, so the current goes down
                    rather than up. The reasoning is right and the direction is inverted.
                - text: lower, about 0.86 A/W, in proportion to the wavelength
                  rule: substitution of the stated values
                - text: zero, since the diode is specified for 1550 nm
                  rule: the efficiency of conversion
                  why: >-
                    A cut-off happens at long wavelengths, where the arrivals are too weak. Shorter
                    ones are detected perfectly well.
          commit: Commit the derivation
      - group: SPLICE
        task: Sort four faults by the signature each leaves
        title: Four faults, four traces
        concept: 'Which of several candidate causes a signature can tell apart'
        place: Splice Trailer
        scene: >-
          Ramnarine has four faults on the bench, all recovered from shore ends over the years, and a
          trace beside each. Every one of them lost light and no two of them look alike.
        guide: >-
          Each fault on the left has one signature on the right. What separates them is whether the
          light that is lost comes back towards the instrument or leaves the fibre altogether, and
          whether the loss is at one point or spread along a length. Two of the four look identical in
          how much they lose and nothing alike in what returns.
        assumes:
          - an instrument sees only the light that returns to it
        takeaway: Two faults can lose the same light and be told apart by what comes back, which is why a trace has a shape as well as a step.
        format: PROTOCOL
        task: Match each fault to the signature it leaves on a trace.
        scenarios:
          - A clean break, with air at the end.
          - A tight bend round a fitting.
          - A mechanical joint whose gel has dried out.
          - A fibre crushed over twenty metres inside a damaged cable.
        choices:
          - A step down with a tall spike on it, and nothing beyond.
          - A step down with nothing on it, and the trace continuing.
          - A step down with a small spike on it, and the trace continuing.
          - A steepening of the slope over a length, with no step anywhere.
        mapping: [0, 1, 2, 3]
        why: >-
          A break reflects about 3.6 per cent at the glass-air step, which is a tall spike, and
          nothing continues past it. A bend has no index step at all, so light leaves the core and
          none comes back: a step with nothing on it. A dried joint has a step in index but a small
          one, so a small spike and the trace goes on. And a crushed length loses gradually rather
          than at a point, which shows as the slope getting steeper for twenty metres. The step
          heights alone would not separate any of these.
      - group: TEST
        task: Ask Meier what averaging buys
        title: Sixty-five thousand traces
        concept: 'Counting statistics, and the noise a stream of photons has of its own'
        place: Test Room
        person: true
        scene: >-
          Meier has the instrument set to average sixty-five thousand traces, which takes eleven
          minutes. The same measurement with a thousand takes ten seconds.
        guide: >-
          All four options describe what averaging many traces does. Ask of each whether it acts on
          something that changes from trace to trace or on something that is the same in every one,
          because averaging only helps with the first — and how much it helps follows from the count.
        assumes:
          - independent measurements of the same thing average towards it
        takeaway: Averaging reduces what varies between measurements as the root of their number, and does nothing at all to what does not.
        format: CHOICE
        question: What does averaging sixty-five thousand traces buy?
        why: >-
          It reduces the part of the trace that varies from one pulse to the next, and it does so as
          the square root of the number averaged: sixty-five times more traces than a thousand buys a
          factor of eight, which is nine decibels. Sixty-four times the time for nine decibels is the
          bargain on offer. What it cannot touch is anything the same in every trace — a reflection
          from a connector, the instrument's own dead zone — because averaging identical things
          returns the thing.
        choices:
          - Nine decibels of reach, for sixty-four times the time
          - A shorter dead zone at the near end of the fibre
          - Better resolution between two events close together
          - Removal of the reflection from the connector at the instrument
        answer: Nine decibels of reach, for sixty-four times the time
        rebuttals:
          - The dead zone is set by the pulse width and the receiver's recovery, neither of which averaging changes.
          - Resolution is also the pulse width; averaging makes the same blur less noisy.
          - That reflection is identical in every trace, so averaging returns it unchanged.
  # ---------------------------------------------------------------- day 7
  - title: Through forty millimetres of steel
    objective: Work out what gets through a housing, and settle what a trace can and cannot separate.
    briefing: The ship needs a housing radiographed before it sails, and the source is eight months old.
    stake: >-
      Tuesday, and whatever position the ship is given it will be putting a new repeater housing into
      the water. Farouk cannot pass a weld she cannot see, and what her film sees is whatever gets
      through forty millimetres of steel. Joe Whitlock, the radiation safety officer, sets the
      barrier before anybody is allowed near it. Sarraf meanwhile has four candidate causes and a
      week to choose between them. Today you work out how much of a gamma beam a housing lets
      through, put the four candidates in the order they should be tested in, and settle with Sam
      Achebe how two reflections can cancel. The housing has to be signed off before the ship sails
      whether or not anybody has agreed where it is going.
    takeaway: Equal thicknesses take equal fractions, so shielding is a thickness that halves rather than one that stops.
    stops:
      - group: RAD
        task: Work out what gets through the housing
        title: Seven per cent, and no more
        concept: 'Gamma attenuation through a material, and half-value thickness'
        takesAsRead:
          - Radioactive decay as a random process with a fixed chance
        place: Radiography Bay
        scene: >-
          The housing wall is forty millimetres of steel and the source's beam is attenuated at 0.666
          per centimetre in it. Farouk wants the fraction that reaches the film, and the thickness
          that would halve it.
        guide: >-
          You build the working a line at a time. Attenuation removes a fixed fraction per unit
          thickness, so the fraction remaining is an exponential in the thickness. Get that fraction
          first, then invert the same relation to find the thickness that halves the beam, then count
          how many of those the wall is worth.
        background:
          - >-
            Why a half-value thickness is the useful form. A material has no thickness that stops a
            gamma beam; it has a thickness that halves it, and another one that halves it again. So
            shielding is quoted as that thickness, and a barrier is designed by counting how many of
            them are in the way.
          - >-
            Why the exponent and the count agree. Forty millimetres at 0.666 per centimetre is an
            exponent of 2.66, and 2.66 divided by the natural logarithm of two is 3.85 — so the wall
            is 3.85 half-value thicknesses, and two to the power of minus 3.85 is 0.069. The two routes
            are the same statement written in different bases.
          - >-
            What it costs Farouk. Seven per cent through means an exposure fourteen times longer than
            a film with nothing in the way, before any allowance for the source being eight months old.
            That second factor arrives tomorrow, and the two multiply.
        assumes:
          - equal thicknesses of a material remove equal fractions of a beam
        takeaway: A half-value thickness is the natural way to state shielding, because attenuation is exponential and never complete.
        format: DERIVE
        question: What fraction of the beam reaches the film through the housing wall?
        answerText: >-
          About 7 per cent. The exponent is 0.666 × 4.0 = 2.66, and the half-value thickness is
          ln2/0.666 = 1.04 cm, so the wall is 3.85 of them.
        why: >-
          About seven per cent gets through. The fraction remaining is e to the minus the coefficient
          times the thickness, which is e to the minus 2.66. The same coefficient gives a half-value
          thickness of 1.04 centimetres, and the wall is 3.85 of those — and two to the minus 3.85 is
          the same 0.069, because the two forms are one relation in different bases. Neither form
          contains a thickness that stops the beam, which is why a barrier is a distance as often as
          it is a slab.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: I = I₀·e^(−μx)
          startNote: μ = 0.666 per cm in steel at this energy, x = 4.0 cm of wall
          goal: the fraction through the wall, and the half-value thickness
          askRule: true
          rules:
            - exponential attenuation
            - the half-value thickness
            - counting half-values
            - substitution of the stated values
            - rearrangement
          steps:
            - ask: Get the exponent.
              answer: 2
              candidates:
                - text: μ·x = 0.666 × 40 = 26.6
                  rule: substitution of the stated values
                  survives: true
                  why: >-
                    The coefficient is per centimetre and the wall has been put in millimetres. It
                    gives a fraction of 2.8 × 10⁻¹² through, which is a film that would never expose —
                    and radiographers do wait a long time, so it does not read as impossible.
                - text: μ/x = 0.666 ÷ 4.0 = 0.167
                  rule: rearrangement
                  why: >-
                    Divided. The exponent has to be dimensionless, so a per-centimetre coefficient
                    multiplies a length in centimetres.
                - text: μ·x = 0.666 × 4.0 = 2.66
                  rule: exponential attenuation
                - text: μ·x = 0.666 × 4.0 × ln2 = 1.85
                  rule: counting half-values
                  why: >-
                    The logarithm of two belongs to the conversion between the two bases, not to the
                    exponent itself. It has been applied a step early.
            - ask: Get the fraction through.
              answer: 0
              candidates:
                - text: e^(−2.66) = 0.070
                  rule: exponential attenuation
                - text: 1 − 2.66 = −1.66
                  rule: rearrangement
                  why: >-
                    A negative fraction of a beam. The exponent is an exponent rather than a proportion
                    removed.
                - text: e^(2.66) = 14.3
                  rule: exponential attenuation
                  survives: true
                  why: >-
                    The sign of the exponent dropped, giving more out than in — and 14.3 is exactly the
                    factor the exposure has to be lengthened by, so it turns up later looking right.
                - text: 1/2.66 = 0.376
                  rule: rearrangement
                  why: >-
                    A reciprocal rather than an exponential. It gives 38 per cent through, five times
                    too much, and would set every exposure short.
            - ask: Get the half-value thickness.
              answer: 1
              candidates:
                - text: 1/μ = 1 ÷ 0.666 = 1.50 cm
                  rule: the half-value thickness
                  survives: true
                  why: >-
                    That is the thickness that reduces the beam by a factor of e rather than by two.
                    It is a real quantity, 44 per cent too large for this purpose, and the two are
                    routinely confused.
                - text: ln2/μ = 0.693 ÷ 0.666 = 1.04 cm
                  rule: the half-value thickness
                - text: μ/ln2 = 0.961 cm
                  rule: rearrangement
                  why: >-
                    Inverted, and it happens to come out near enough to the right answer to pass a
                    glance — the units are centimetres either way and the numbers differ by eight per
                    cent.
                - text: 2/μ = 3.00 cm
                  rule: the half-value thickness
                  why: >-
                    A factor of two where a logarithm belongs. Halving is about the logarithm of two,
                    not about two.
            - ask: Say how many half-values the wall is, and check the fraction.
              answer: 3
              candidates:
                - text: 4.0 ÷ 1.04 = 3.85, and 2⁻³·⁸⁵ = 0.14
                  rule: counting half-values
                  survives: true
                  why: >-
                    The count is right and the power of two has been evaluated as though it were 2.85.
                    It is exactly twice the true fraction, which is one half-value out.
                - text: 4.0 × 1.04 = 4.16 half-values
                  rule: rearrangement
                  why: >-
                    Multiplied by the half-value thickness rather than divided by it. The units come
                    out as centimetres squared.
                - text: 2.66 half-values, since that is the exponent
                  rule: counting half-values
                  why: >-
                    The exponent is in base e and the count is in base two. Converting between them is
                    the factor of ln2 this step exists for.
                - text: 4.0 ÷ 1.04 = 3.85, and 2⁻³·⁸⁵ = 0.069
                  rule: counting half-values
          commit: Commit the derivation
      - group: AMP
        task: Put the four candidates in the order to test them
        title: Four causes, one week
        concept: 'Which of several candidate causes a signature can tell apart'
        place: Amplifier and Power Hall
        scene: >-
          Four things could have taken four decibels out of this span overnight, and there are five
          working days left. Tanaka and Sarraf have agreed the list and not the order.
        guide: >-
          Four tests, and the rail is not a clock — all four could be started this morning. Put them
          in the order of what each one costs before it answers, cheapest first. What decides it is
          whether a test needs the ship, needs the traffic moved, or can be done from this building
          with the span as it stands.
        assumes:
          - a test that costs nothing to try should be tried before one that costs a week
        takeaway: Order tests by what they cost before they answer, because the cheap ones often make the expensive ones unnecessary.
        format: SEQUENCE
        task: Order the four tests by what each costs before it answers.
        axis: >-
          Order the four by what each one costs before it answers, cheapest first. This is not a clock
          — all four could be started this morning, and the question is which ones you can afford to
          be wrong about.
        ends: [Costs an afternoon, Costs the charter]
        cards:
          - Re-read the existing traces at both wavelengths and compare them.
          - Trace again with a shorter pulse to resolve what is under the step.
          - Switch repeater 6 to its spare pump and watch the received power.
          - Send the ship, grapnel the cable up and cut it open.
        order: [0, 1, 2, 3]
        why: >-
          Re-reading traces already in the drawer costs an afternoon and eleven years of them exist. A
          fresh trace with a shorter pulse costs an hour of the instrument and a technician. Switching
          to the spare pump is a real intervention on a live repeater and cannot be undone from shore,
          so it costs a decision. Sending the ship costs the charter, at forty thousand a day, and
          commits everybody to a position. Two of those four would have answered the question, and the
          order matters because the cheap ones make the expensive one unnecessary.
      - group: SPLICE
        task: Ask Achebe how two reflections cancel
        title: Two reflections, and a gap between them
        concept: 'Interference of two beams, and the path difference that decides it'
        place: Splice Trailer
        person: true
        scene: >-
          Achebe has a connector face under the microscope with a coating on it, and the same face
          uncoated beside it. The coated one reflects visibly less and neither is polished better than
          the other.
        guide: >-
          All four options are ways a coating could reduce a reflection. Ask of each whether it
          removes light or redirects it or cancels it, because only one of those needs a second
          reflection to work with — and the thickness of the coating is the clue that says which.
        assumes:
          - two waves arriving out of step by half a wavelength cancel
        takeaway: Two reflections separated by the right path difference arrive out of step and cancel, which removes a reflection without absorbing anything.
        format: CHOICE
        question: How does a coating on a connector face reduce its reflection?
        why: >-
          The coating makes two reflections instead of one — from its front face and its back face —
          and if the extra path between them is half a wavelength the two arrive out of step and
          cancel. Nothing is absorbed: the light that would have come back goes forward instead. That
          is why the thickness matters and why it is a quarter of a wavelength rather than any old
          thin layer, and it is the same arithmetic as the gel in a mechanical joint reached a
          different way.
        choices:
          - It makes a second reflection that arrives out of step with the first
          - It absorbs the part of the light that would have been reflected
          - It scatters the reflection sideways out of the fibre
          - It roughens the face so no single direction is favoured
        answer: It makes a second reflection that arrives out of step with the first
        rebuttals:
          - An absorbing coating would lose the light in both directions, and this one does not.
          - Scattering would show as loss on a trace, and a coated connector is less lossy rather than more.
          - A rough face scatters in transmission as well, which is exactly what a connector must not do.
  # ---------------------------------------------------------------- day 8
  - title: A coating that cancels
    objective: Design the film that removes a reflection, and find where a detector stops working.
    briefing: Every connector in the building reflects, and one of them is inside the instrument.
    stake: >-
      Wednesday, and Meier has found something in the drawer: the reflection from the instrument's own
      front connector is larger than the spike in the trace, and it has been there for eleven years.
      Ramnarine can coat a face to remove it and wants the thickness derived rather than ordered from
      a catalogue. Osgood has a diode on the bench that works perfectly at this wavelength and not at
      all at two thousand nanometres, and nobody in the building can say why. Today you design the
      coating, settle where a detector's cut-off comes from, and look with Okonkwo at what a bend does
      that a break does not. The instrument's own reflection is subtracted from every trace on this
      station by hand.
    takeaway: A quarter-wavelength film cancels a reflection by interference, without absorbing anything.
    stops:
      - group: SPLICE
        task: Design the film that cancels the reflection
        title: Three hundred and twenty nanometres
        concept: 'Thin films, index matching and the reflection at a step'
        takesAsRead:
          - Snell's law at a boundary
        place: Splice Trailer
        scene: >-
          Ramnarine can put a coating on a connector face to any thickness and to a choice of indices.
          The face is glass at 1.4682, the light is at 1550 nanometres, and air is on the other side.
        guide: >-
          You build the working a line at a time. A coating makes two reflections, one at each of its
          faces, and the question is what thickness puts them exactly out of step. Count the path
          difference in the film, remember that the wave travels more slowly in it, and then ask what
          index makes the two reflections the same size — because cancelling needs both.
        background:
          - >-
            Why the film is a quarter of a wavelength and not a half. The extra path is twice the
            thickness, because the second reflection goes down and back, so a quarter-wavelength film
            gives a half-wavelength path difference. That is the difference between a coating that
            cancels and one that does nothing at all.
          - >-
            Why the wavelength inside the film is the one that counts. The wave is slower in the film,
            so its wavelength there is the vacuum wavelength divided by the film's index. The
            thickness that matters is therefore λ over four n, not λ over four.
          - >-
            Why the index is a geometric mean. Cancelling needs the two reflections equal as well as
            opposite, and the two step sizes are equal when the film's index is the root of the
            product of the two either side. That is 1.212 here, which is close to magnesium fluoride,
            which is what is actually used.
        assumes:
          - a wave reflected at each face of a film travels an extra distance of twice the thickness
        takeaway: A coating cancels a reflection when its thickness gives a half-wavelength path difference and its index equalises the two reflections.
        format: DERIVE
        question: How thick should the coating be, and what index should it have?
        answerText: >-
          About 320 nm, at an index of 1.212. The thickness is λ/(4n) and the index is the root of the
          product of the two either side.
        why: >-
          The film should be about 320 nanometres thick with an index of 1.212. Two reflections leave
          it, and the second travels twice the thickness further, so a thickness of a quarter of the
          wavelength inside the film puts them half a wavelength apart and they cancel. The wavelength
          inside the film is the vacuum wavelength divided by the film's index, which is why the
          thickness depends on that index as well. And they only cancel completely if they are the
          same size, which happens when the film's index is the geometric mean of its neighbours'.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: 2·n·t = (m + ½)·λ
          startNote: glass 1.4682, air 1.0003, λ = 1550 nm in vacuum; take the thinnest film that works
          goal: the thickness in nanometres and the index the film should have
          askRule: true
          rules:
            - the path difference in a film
            - the wavelength inside a material
            - equal reflections at both faces
            - substitution of the stated values
            - rearrangement
          steps:
            - ask: Write the condition for the two reflections to cancel.
              answer: 1
              candidates:
                - text: n·t = λ/2, one half-wavelength in the film
                  rule: the path difference in a film
                  survives: true
                  why: >-
                    The factor of two for the return trip through the film is missing. It gives a film
                    twice as thick, which cancels nothing at this wavelength and cancels perfectly at
                    3100 nanometres.
                - text: 2·n·t = λ/2, a half-wavelength of path difference
                  rule: the path difference in a film
                - text: 2·n·t = λ, a whole wavelength of path difference
                  rule: the path difference in a film
                  why: >-
                    A whole wavelength brings the two reflections back into step, so they add rather
                    than cancel. That is a coating that makes a face reflect more.
                - text: t = λ/2, a half-wavelength of thickness
                  rule: rearrangement
                  why: >-
                    Neither the return trip nor the film's own index has been accounted for, so the
                    thickness is out by a factor of four and a half.
            - ask: Solve for the thickness.
              answer: 3
              candidates:
                - text: t = λ/4 = 388 nm
                  rule: the wavelength inside a material
                  survives: true
                  why: >-
                    The film's index left out. It is 21 per cent thick and would leave a reflection
                    about a fifth of the original — better than nothing, which is what makes it
                    survive.
                - text: t = λ·n/4 = 470 nm
                  rule: rearrangement
                  why: >-
                    The index multiplying rather than dividing. A slower wave has a shorter wavelength
                    inside the film, so the thickness goes down.
                - text: t = λ/(2n) = 1550 ÷ (2 × 1.212) = 639 nm
                  rule: rearrangement
                  why: >-
                    The four has become a two: the return trip has been counted once instead of
                    doubling the path.
                - text: t = λ/(4n) = 1550 ÷ (4 × 1.212) = 320 nm
                  rule: substitution of the stated values
            - ask: Say what index makes the two reflections the same size.
              answer: 2
              candidates:
                - text: the mean of the two, (1.4682 + 1.0003)/2 = 1.234
                  rule: equal reflections at both faces
                  survives: true
                  why: >-
                    An arithmetic mean where a geometric one belongs. It is 1.8 per cent out, it leaves
                    a residual reflection about a thousandth of the original, and it would pass every
                    test anybody here could run.
                - text: the same as the glass, 1.4682
                  rule: equal reflections at both faces
                  why: >-
                    Then there is no step at the glass face at all, only at the air face — which is the
                    reflection you started with, moved.
                - text: the root of the product, √(1.4682 × 1.0003) = 1.212
                  rule: equal reflections at both faces
                - text: the difference of the two, 0.4679
                  rule: rearrangement
                  why: >-
                    No material has an index below one, so this is not a candidate for a film.
            - ask: Check what the same film does at 1310 nm.
              answer: 0
              candidates:
                - text: it is no longer a quarter-wavelength there, so the cancellation is partial
                  rule: the path difference in a film
                - text: it works equally well, since the film has not changed
                  rule: the path difference in a film
                  survives: true
                  why: >-
                    The film has not changed and the wavelength has. The condition is a relation
                    between the two, which is why a coating is specified for a wavelength.
                - text: it reflects more than an uncoated face at that wavelength
                  rule: the path difference in a film
                  why: >-
                    That happens where the path difference is a whole wavelength, which is at 640
                    nanometres for this film rather than at 1310.
                - text: it cancels completely, since the index condition is independent of wavelength
                  rule: equal reflections at both faces
                  why: >-
                    The index condition is nearly independent of wavelength and the thickness condition
                    is not, and both are needed.
          commit: Commit the derivation
      - group: RECV
        task: Settle where a detector's cut-off comes from
        title: Bright and useless
        concept: 'The photoelectric effect, and a threshold that is about energy per photon'
        place: Receiver Lab
        scene: >-
          Osgood has two sources on the bench and one diode. A dim source at 1550 nanometres gives a
          clean current. A source twenty times brighter at 2000 nanometres gives nothing at all.
        guide: >-
          Four accounts of why the brighter source does nothing. Ask of each whether it is about how
          much light arrives or about what each arrival carries, because the two make opposite
          predictions when the brightness is turned up. One of them says nothing will happen however
          bright it gets.
        assumes:
          - a charge is freed by one arrival rather than by several together
        takeaway: A threshold in wavelength is a statement about energy per arrival, so brightness cannot get past it.
        format: CHOICE
        question: Why does the brighter source at the longer wavelength give no current?
        why: >-
          Each arrival at 2000 nanometres carries 0.62 electron volts, and the diode's material needs
          0.75 to free a charge. Brightness is the number of arrivals, and arrivals that individually
          cannot free a charge do not free one between them — so twenty times as many of them still
          gives nothing. That is the whole content of a threshold: it is about the energy of one piece
          of light, which depends only on the wavelength, and it is the reason a detector is chosen for
          a band rather than for a power.
        choices:
          - Each arrival carries too little energy to free a charge
          - The longer wavelength is reflected by the diode's coating
          - The diode is too slow to respond at that wavelength
          - Twenty times the brightness is more than the diode can take
        answer: Each arrival carries too little energy to free a charge
        rebuttals:
          - A reflected beam would show as a reduced current rather than none at all.
          - Speed limits how fast a signal can change, and a steady source asks nothing of that.
          - Too much light gives a large current that stops growing, not the absence of one.
      - group: TERM
        task: Look with Okonkwo at what a bend does
        title: Four bends, and what each one costs
        concept: "Snell's law at a boundary"
        place: Cable Termination Room
        person: true
        scene: >-
          Okonkwo has four lengths of fibre on the bench, each bent round a different radius, and the
          loss of each written beside it. None of them is damaged and all four lose light.
        guide: >-
          Each observation on the left has one explanation on the right. What separates them is what
          happens to the angle a ray makes with the core boundary when the fibre is bent, because the
          condition for staying in the core is an angle rather than a strength — and a bend changes
          angles without changing anything else.
        assumes:
          - light stays in a core only while it meets the boundary beyond the critical angle
        takeaway: A bend changes the angle a ray meets the boundary at, so light leaves without anything having been damaged.
        format: CASEBOOK
        task: Match each observation about a bent fibre to what explains it.
        scenarios:
          - A gentle bend of 40 mm radius loses almost nothing.
          - A tight bend of 6 mm radius loses 3 dB.
          - The 6 mm case loses more at 1625 nm than at 1550 nm.
          - No light comes back from any of the bends.
        choices:
          - Every ray still meets the boundary beyond the critical angle.
          - On the outside of the bend some rays now meet it inside the critical angle and leave.
          - Longer wavelengths are held less firmly in the core, so they go first wherever the guiding weakens.
          - Nothing here is an abrupt change of index, so there is nothing to reflect from.
        mapping: [0, 1, 2, 3]
        why: >-
          A bend does not damage anything; it changes the angles. On the outside of a tight bend the
          boundary is tilted relative to the rays, so some of them arrive inside the critical angle and
          refract out instead of reflecting. A gentle bend tilts it too little to matter. Longer
          wavelengths spread further into the cladding and so leave first, which is exactly the test
          that separates a bend from a break. And a bend has no index step anywhere in it, so nothing
          comes back — which is the other half of the same test.
  # ---------------------------------------------------------------- day 9
  - title: A tenth of what it was
    objective: Work out what eight months has done to the source, and how far back the barrier goes.
    briefing: The housing has to be signed off before the ship sails, and the exposures keep growing.
    stake: >-
      Thursday, and the housing radiograph is now on the critical path. Farouk's source was renewed
      eight months ago and her exposures have grown every month since; Whitlock will not open the bay
      until the barrier distance has been worked out for the exposure actually being made. Tanaka has
      spent the morning on the pump's two wavelengths and has a number she wants checked. Today you
      work out what the source is worth now, set the barrier for it, and settle where the difference
      between the pump's energy and the signal's goes. If the exposure runs past six in the evening
      the bay cannot be used, and the housing waits another day.
    takeaway: A source falls by a fixed fraction in a fixed time, so every exposure it is used for has a schedule attached.
    stops:
      - group: RAD
        task: Work out what the source is worth after eight months
        title: Two hundred and forty-three days
        concept: 'Half-life, and the schedule it puts on a source'
        takesAsRead:
          - Radioactive decay as a random process with a fixed chance
        place: Radiography Bay
        scene: >-
          The source has a half-life of 73.8 days and was renewed 243 days ago. Farouk wants what
          fraction of its original strength is left and what that does to her exposures.
        guide: >-
          You build the working a line at a time. A half-life and a decay constant are two ways of
          writing the same fact, and the exponential is the same shape as yesterday's attenuation with
          time in place of thickness. Get the constant, then the fraction, then check it by counting
          half-lives — because the two routes have to agree.
        background:
          - >-
            Why the two forms agree. e to the minus the constant times the time, and two to the minus
            the number of half-lives, are the same function written in different bases, and the
            logarithm of two is the conversion between them. Being able to move between them is what
            makes a decay estimable in the head.
          - >-
            Why the exposure factor is the reciprocal. A film needs a certain number of arrivals
            whatever the rate they come at, so a source a tenth as strong needs ten times as long. Both
            factors multiply: a tenth of the source and seven per cent through the steel is a hundred
            and forty times a bare film's exposure.
          - >-
            What the date beyond which is. At 73.8 days a half-life, this source loses another half
            every two and a half months, and the bay's working day sets a ceiling on the exposure. That
            ceiling arrives about eleven months in, which is why the renewal interval is what it is
            rather than being a matter of policy.
        assumes:
          - each nucleus has a fixed chance of decaying in the next second, whatever its history
        takeaway: A decay constant and a half-life are the same fact, and a source's schedule follows from either.
        format: DERIVE
        question: What fraction of the source's original activity is left after 243 days?
        answerText: >-
          About 10 per cent. The constant is ln2/73.8 = 0.00939 a day, so the fraction is e^(−2.28),
          and 243 days is 3.29 half-lives.
        why: >-
          About a tenth is left. The decay constant is the logarithm of two divided by the half-life,
          which is 0.00939 per day, and the fraction remaining is e to the minus that times 243 days.
          The check is the other route: 243 days is 3.29 half-lives, and two to the minus 3.29 is the
          same 0.102. Both are the same statement about a nucleus having a fixed chance of decaying
          per second, and neither depends on how much source there was to start with.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: A = A₀·e^(−λt),  λ = ln2/T½
          startNote: T½ = 73.8 days, t = 243 days since renewal
          goal: the fraction of the original activity left, and the factor on the exposure
          askRule: true
          rules:
            - the decay constant from the half-life
            - exponential decay
            - counting half-lives
            - the exposure a film needs
            - rearrangement
          steps:
            - ask: Get the decay constant.
              answer: 0
              candidates:
                - text: λ = ln2/T½ = 0.693 ÷ 73.8 = 0.00939 per day
                  rule: the decay constant from the half-life
                - text: λ = T½/ln2 = 73.8 ÷ 0.693 = 106.5 days
                  rule: rearrangement
                  why: >-
                    Inverted. A decay constant is a chance per unit time, so its units are per day
                    rather than days.
                - text: λ = 1/T½ = 0.01355 per day
                  rule: the decay constant from the half-life
                  survives: true
                  why: >-
                    The logarithm of two left out. It is 44 per cent high, its units are right, and it
                    is the constant for a fall by a factor of e rather than by two.
                - text: λ = 2/T½ = 0.0271 per day
                  rule: rearrangement
                  why: >-
                    A factor of two where its logarithm belongs, which is the same confusion as a
                    half-value thickness against a mean free path.
            - ask: Get the fraction left.
              answer: 2
              candidates:
                - text: e^(−0.00939 × 243) = e^(−2.28) = 10.2
                  rule: exponential decay
                  why: >-
                    A fraction cannot exceed one. The exponential of a negative number has been
                    evaluated as though the sign were positive.
                - text: 1 − 0.00939 × 243 = −1.28
                  rule: rearrangement
                  survives: true
                  why: >-
                    The exponential replaced by its first two terms, which is a fair approximation for
                    small exponents and useless at 2.28 — and here it returns a negative fraction,
                    which at least announces itself.
                - text: e^(−0.00939 × 243) = e^(−2.28) = 0.102
                  rule: exponential decay
                - text: e^(−0.00939 ÷ 243) = 0.99996
                  rule: rearrangement
                  why: >-
                    Divided rather than multiplied. It says the source has lost nothing in eight
                    months, which is the answer somebody would like.
            - ask: Check it by counting half-lives.
              answer: 1
              candidates:
                - text: 243 ÷ 73.8 = 3.29, and 3.29 halvings is 1/3.29 = 0.30
                  rule: counting half-lives
                  why: >-
                    Halvings multiply rather than divide: three of them is an eighth, not a third.
                - text: 243 ÷ 73.8 = 3.29, and 2⁻³·²⁹ = 0.102
                  rule: counting half-lives
                - text: 243 ÷ 73.8 = 3.29, and 2⁻³ = 0.125
                  rule: counting half-lives
                  survives: true
                  why: >-
                    The count rounded down to a whole number of halvings. It is 23 per cent high and it
                    is the version anybody does in their head, which is fine as an estimate and not as
                    a check on an exponential.
                - text: 73.8 ÷ 243 = 0.304 half-lives
                  rule: rearrangement
                  why: >-
                    Inverted. Eight months is more than one half-life, not a third of one.
            - ask: Say what that does to the exposure.
              answer: 3
              candidates:
                - text: the exposure falls by a tenth, since less is arriving
                  rule: the exposure a film needs
                  why: >-
                    A film needs a fixed number of arrivals, so a weaker source needs longer rather
                    than shorter.
                - text: the exposure is unchanged, since the film's sensitivity has not altered
                  rule: the exposure a film needs
                  survives: true
                  why: >-
                    The sensitivity has not altered and the arrival rate has. What is fixed is the
                    number of arrivals the film needs, which is a rate times a time.
                - text: the exposure grows by ln2, since that is the decay constant's factor
                  rule: rearrangement
                  why: >-
                    The logarithm of two is a conversion between two ways of writing the decay, not a
                    factor on anything physical.
                - text: the exposure grows by ten, the reciprocal of what is left
                  rule: the exposure a film needs
          commit: Commit the derivation
      - group: RAD
        task: Set the barrier for today's exposure with Whitlock
        title: Eight metres, or thirty-two
        concept: 'The inverse-square fall of intensity from a small source'
        takesAsRead:
          - Radioactive decay as a random process with a fixed chance
        place: Radiography Bay
        person: true
        scene: >-
          Whitlock has the dose rate measured at two metres from the pot and a limit for the boundary
          of the controlled area. He wants the distance at which the rate is inside the limit.
        guide: >-
          Four quantities are offered and three of them make the answer. A small source spreads its
          output over a sphere, so the rate falls as the square of the distance, and the distance
          needed is the reference distance times the root of the ratio of the rates. The exposure time
          is on the list because it is not part of a rate at all.
        assumes:
          - a small source spreads its output evenly over a sphere
        takeaway: Intensity from a small source falls as the square of distance, so the barrier is set by a square root rather than by a ratio.
        format: BALLPARK
        question: How far back does the barrier go for today's exposure?
        estimate:
          prompt: >-
            The bay is opened only when the boundary rate is inside the limit. This is measured at two
            metres, and the limit is what a person outside may receive.
          question: How far back does the barrier go for today's exposure?
          relationship: >-
            Distance needed = the measured distance × the square root of the measured rate divided by
            the limit.
          labels:
            - 2.0 m  (distance the rate was measured at)
            - 640 µSv/h  (the rate at that distance)
            - 7.5 µSv/h  (the limit at the boundary)
            - 126 min  (today's exposure time)
          values: [2.0, 640, 7.5, 126]
          slots: 3
          template: '{0} × root of ({1} ÷ {2})'
          formula: a*Math.sqrt(b/c)
          correct: [0, 1, 2]
          target: 18.5
          tolerance: 0.8
          units: m
          solution: 2.0 × √(640 ÷ 7.5) = 2.0 × 9.24 = 18.5 m.
          explanation: >-
            The exposure time changes the total dose somebody would receive and not the rate at the
            boundary, so it does not enter this arithmetic. Dividing the rates without taking the root
            gives 171 metres, which is off the site.
        why: >-
          The barrier goes to about 18.5 metres. Intensity from a small source falls as the inverse
          square of the distance, so reducing a rate by a factor of 85 needs a distance greater by the
          square root of 85, which is 9.2. That is why distance is the cheap answer to a strong source
          and lead is the expensive one — and it is also why a collimated beam breaks the arithmetic
          entirely, because a beam that has been aimed is not spreading over a sphere.
      - group: AMP
        task: Settle where the pump's extra energy goes
        title: Two wavelengths, one atom
        concept: 'The quantum defect, and where the pump energy goes'
        place: Amplifier and Power Hall
        scene: >-
          Tanaka has the two wavelengths on the board: the pump at 980 nanometres and the signal at
          1550. Every pump arrival that does its job ends up as a signal arrival, and the two do not
          carry the same energy.
        guide: >-
          Four accounts of what happens to the difference. Ask of each whether it conserves energy and
          whether it conserves the number of arrivals, because an amplifier conserves the second and
          not the first — one arrival in, one arrival out, and less energy in the one that leaves.
        assumes:
          - an excited atom can be made to release its energy into a passing wave
        takeaway: A pump arrival is more energetic than the signal arrival it produces, and the difference has to leave as heat.
        format: CHOICE
        question: What becomes of the difference between a pump arrival and a signal arrival?
        why: >-
          It ends up as heat in the glass. A pump arrival at 980 nanometres carries 1.27 electron
          volts and lifts an erbium atom to a state it drops from, quickly and silently, to the level
          the signal works from — and that drop is 0.47 electron volts that never becomes light. What
          is conserved is the count: one pump arrival can produce at most one signal arrival. That
          ceiling is what sets an amplifier's maximum output at the pump power times the ratio of the
          two wavelengths, whatever else is done to it.
        choices:
          - It becomes heat in the glass as the atom settles to the working level
          - It becomes a second signal arrival, so one pump gives two
          - It is stored in the fibre and released when the pump is switched off
          - It leaves as a shorter-wavelength arrival alongside the signal
        answer: It becomes heat in the glass as the atom settles to the working level
        rebuttals:
          - The difference is 37 per cent of one arrival, and a second arrival would need 100 per cent.
          - An excited state lasts milliseconds, so nothing is stored for later use.
          - The atom's levels decide what wavelengths can leave, and there is no level for that one.
  # ---------------------------------------------------------------- day 10
  - title: The kilometre the trace is out by
    objective: Correct the distance for what a pulse actually travels at, and for the cable's slack.
    briefing: Okonkwo has been saying an optical distance is not a position, and today it is a number.
    stake: >-
      Friday, and the chart goes to the ship on Monday. Okonkwo has the lay record open at the page he
      has been pointing at for a fortnight: 1.5 per cent of slack paid out over the route, and the
      fibres wound helically inside the cable so that there is more fibre than there is cable. Meier
      has the instrument's index setting, which is the core's index and not the one a pulse travels
      at. Tanaka has permission to switch repeater 6 to its spare pump this afternoon. Today you
      correct the distance for all of it, predict what the spare pump will do and then measure it, and
      settle with Duarte which description of light a receiver needs. The grapnel window is half a
      kilometre wide and the correction is larger than that.
    takeaway: An optical distance becomes a position only after the pulse's own speed and the cable's slack are taken out of it.
    stops:
      - group: TEST
        task: Correct the distance for the group index and the slack
        title: Eighty-two point nine
        concept: 'A measurement in an instrument’s own units, and what converts it'
        place: Test Room
        scene: >-
          The instrument reported 84.6 kilometres using the core's index of 1.4682. A pulse travels at
          the group index, 1.4718. There is 0.3 per cent more fibre than cable, and 1.5 per cent more
          cable than route.
        guide: >-
          You build the working a line at a time. Three corrections, each a small ratio, and each one
          in a definite direction: the instrument used too small an index, the fibre is longer than the
          cable it is in, and the cable is longer than the route it lies on. Get the sign of each right
          before touching the arithmetic, because two of the three go the same way and one does not.
        background:
          - >-
            Why the group index is the right one. A pulse is a band of wavelengths, and what travels at
            c over the core's index is a single wavelength. The pulse — the thing whose arrival is
            timed — travels a little more slowly, at c over the group index, so the same delay
            corresponds to a slightly shorter distance.
          - >-
            Why the fibre is longer than the cable. The fibres are laid up helically round the cable's
            core so that bending the cable does not stretch them, which means a metre of cable contains
            slightly more than a metre of fibre. It is a fixed property of the cable's construction and
            it is on the maker's data sheet.
          - >-
            Why the slack is the largest term and the least certain. A cable is paid out faster than
            the ship advances so that it lies on the bottom rather than bridging the high spots. 1.5
            per cent over 84 kilometres is 1.25 kilometres, and it is an average over a route whose
            slack was not uniform — which is exactly why Okonkwo will not offer a position without a
            tolerance on it.
        assumes:
          - a cable laid with slack is longer than the route it lies along
        takeaway: Three ratios separate an optical distance from a position, and all three have to be applied with their own signs.
        format: DERIVE
        question: How far along the route is the event, once every correction is applied?
        answerText: >-
          About 82.9 km — 1.7 km closer than the trace says. The group index takes off 207 m, the
          helix 0.3 per cent and the slack 1.5 per cent.
        why: >-
          The event is about 82.9 kilometres along the route, 1.7 kilometres closer than the trace
          reads. The instrument's index was too small, so its distance was too large: correcting it
          takes off 207 metres. The fibre is 0.3 per cent longer than the cable and the cable 1.5 per
          cent longer than the route, and both of those are divisions rather than multiplications. The
          total is more than three times the grapnel window, which is what makes it the difference
          between finding the fault and dragging past it.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: d_route = d_optical × (n_core/n_group) ÷ (1 + h) ÷ (1 + s)
          startNote: d_optical = 84.60 km at n = 1.4682; n_group = 1.4718; helix h = 0.003; slack s = 0.015
          goal: the distance along the route, in kilometres
          askRule: true
          rules:
            - the index a pulse travels at
            - the length of fibre in a cable
            - the slack paid out on laying
            - substitution of the stated values
            - rearrangement
          steps:
            - ask: Correct the index the instrument used.
              answer: 1
              candidates:
                - text: 84.60 × (1.4718/1.4682) = 84.81 km
                  rule: the index a pulse travels at
                  survives: true
                  why: >-
                    The ratio the wrong way up. The instrument assumed light was faster than it was, so
                    its distance is too long and the correction has to shorten it. This lengthens it by
                    the same 207 metres.
                - text: 84.60 × (1.4682/1.4718) = 84.39 km
                  rule: the index a pulse travels at
                - text: 84.60 × 1.4718 = 124.5 km
                  rule: rearrangement
                  why: >-
                    An index applied to a distance that already has one in it. The correction is a ratio
                    of two indices, both nearly 1.47, so it can only be a fraction of a per cent.
                - text: 84.60 km, since the difference is in the third decimal place
                  rule: the index a pulse travels at
                  why: >-
                    The third decimal place of 1.47 is a quarter of a per cent, and a quarter of a per
                    cent of 84 kilometres is 207 metres — half the grapnel window.
            - ask: Take out the extra fibre in the cable.
              answer: 3
              candidates:
                - text: 84.39 × 1.003 = 84.64 km
                  rule: the length of fibre in a cable
                  survives: true
                  why: >-
                    Multiplied. There is more fibre than cable, so a length of fibre corresponds to a
                    shorter length of cable, and the correction divides. The size is right and the sign
                    puts the answer 500 metres the wrong way.
                - text: 84.39 − 0.003 = 84.39 km
                  rule: rearrangement
                  why: >-
                    A ratio subtracted as though it were a length. Three thousandths of a kilometre is
                    three metres and the correction is 253.
                - text: 84.39 ÷ 0.003 = 28,130 km
                  rule: rearrangement
                  why: >-
                    Divided by the excess rather than by one plus it. Twenty-eight thousand kilometres
                    is most of the way round the earth.
                - text: 84.39 ÷ 1.003 = 84.14 km
                  rule: the length of fibre in a cable
            - ask: Take out the slack.
              answer: 0
              candidates:
                - text: 84.14 ÷ 1.015 = 82.90 km
                  rule: the slack paid out on laying
                - text: 84.14 × 0.985 = 82.88 km
                  rule: the slack paid out on laying
                  survives: true
                  why: >-
                    Multiplying by one minus the fraction rather than dividing by one plus it. The two
                    agree to twenty metres here and diverge as the fraction grows, and the second is
                    not what slack means.
                - text: 84.14 × 1.015 = 85.40 km
                  rule: rearrangement
                  why: >-
                    Multiplied. Slack makes the cable longer than the route, so the route is shorter
                    than the cable.
                - text: 84.14 − 1.5 = 82.64 km
                  rule: rearrangement
                  why: >-
                    A percentage subtracted as though it were kilometres. It is close to the right
                    answer by coincidence, because 1.5 per cent of 84 is 1.26.
            - ask: Put the total correction beside the grapnel window of ±0.5 km.
              answer: 2
              candidates:
                - text: 1.7 km, which is inside the window and can therefore be ignored entirely
                  rule: substitution of the stated values
                  why: >-
                    The window is half a kilometre either side, so a correction of 1.7 kilometres is
                    more than three times it.
                - text: 0.21 km, the index correction alone, which is inside the window
                  rule: substitution of the stated values
                  survives: true
                  why: >-
                    One of the three corrections taken as the whole. It is the smallest of them, it is
                    genuinely inside the window, and it is the one a transmission engineer would think
                    of first.
                - text: 1.7 km, more than three times the window, so the position has to be corrected
                  rule: substitution of the stated values
                - text: 2.7 km in total, since the three corrections multiply together
                  rule: rearrangement
                  why: >-
                    They do multiply, and the product of three factors each within two per cent is
                    within four per cent — not the sum of their separate effects on the original figure.
          commit: Commit the derivation
      - group: AMP
        task: Predict what the spare pump does, then measure it
        title: Three and a half decibels, or nothing
        concept: 'Predicting, then measuring what was predicted'
        place: Amplifier and Power Hall
        scene: >-
          Repeater 6 has a spare pump laser that has never been used. Tanaka can switch to it from
          shore, once, and the receiver's power meter is the only instrument that will see the result.
        guide: >-
          Lock a prediction for how much the received power will rise before the switch is made.
          Nothing about it can be changed afterwards, which is the point of making it first. Then
          switch, and then spend the measurement — because a switch that is confirmed to have happened
          and never measured establishes that the relay works and nothing whatever about the pump.
        assumes:
          - an amplifier's gain follows the optical power of its pump
        takeaway: A prediction locked before an intervention is a test of the model; the same number chosen afterwards is a description of the outcome.
        format: VERIFY
        question: Predict the rise in received power, switch to the spare pump, and report what happened.
        verify:
          hint: >-
            Lock the prediction first. The switch can be made without measuring anything, and a
            confirmed switch says the relay works rather than what the pump is doing.
          prediction: { label: Predicted rise in received power, unit: dB, min: 0, max: 7, step: 0.2 }
          truth: 3.6
          passRatio: [0.6, 1.6]
          intervention:
            label: The spare pump in repeater 6
            note: Switched from shore, once. The original pump cannot be switched back to from here.
            outcome: Switch confirmed by telemetry. Pump current on the spare within 2 per cent of nominal.
          measurement:
            label: The receiver's power meter
            note: Averaged over ten minutes, against the reading taken before the switch.
            cost: 1
            costUnit: switch windows
          unmeasuredMoral: >-
            The relay operated and the spare drew its current. Nothing in that sequence establishes
            that any more light is arriving at this building.
          commit: Report the change in received power
        answerText: >-
          About 3.6 dB — but only the power meter establishes it. A confirmed switch is a confirmed
          switch and nothing else.
        why: >-
          The received power rises about 3.6 decibels. An amplifier's gain follows its pump's optical
          power, and a pump that has aged puts out less at the same current: if the original is down
          to 40 per cent of the 118 milliwatts it was logged at, a fresh one restores a factor of two
          and a half, which is 4 decibels of gain less what the amplifier itself gives back. That is most of
          the 4.1 decibels the span lost. The failure specific to this decision is finishing without
          measuring: the telemetry will confirm the switch whatever the light does.
      - group: RECV
        task: Ask Duarte which description of light she needs
        title: Both, on the same bench
        concept: 'Wave–particle duality, and which description a measurement needs'
        place: Receiver Lab
        person: true
        scene: >-
          Duarte has two instruments running on the same fibre. One shows an interference pattern from
          two paths recombined. The other counts arrivals, one at a time, on a diode.
        guide: >-
          All four options are ways of holding the two results together. Ask of each whether it says
          light is one thing or the other, or says which description a particular measurement needs —
          because both instruments are working and neither is wrong.
        assumes:
          - a description of light is chosen for a measurement rather than for all time
        takeaway: A model is chosen for a purpose, and two incompatible-looking pictures can both be needed on one bench.
        format: CHOICE
        question: How should the two results be held together?
        why: >-
          Each measurement needs the description that fits what it does. The interference pattern
          exists because two paths recombine with a path difference, which is a statement about a
          wave; the arrivals are counted one at a time on a diode, which is a statement about quanta.
          Both are true of the same light on the same fibre. What is not available is a picture in which
          light is only one of them, and a receiver's design needs both at once: a wavelength to be
          filtered and a count to set the error floor.
        choices:
          - Each measurement needs the description that fits what it measures
          - Light is a wave, and the counting is an artefact of the diode
          - Light is a stream of particles, and the pattern is a statistical accident
          - The two instruments disagree, so one of them is faulty
        answer: Each measurement needs the description that fits what it measures
        rebuttals:
          - The counting is reproducible on any detector and its scatter follows the count, not the diode.
          - A pattern with fringes in known places is not an accident of statistics; it is where the paths differ.
          - Both instruments give repeatable results on the same fibre, which is not what disagreement looks like.
  # ---------------------------------------------------------------- day 11
  - title: What the pump could ever give
    objective: Put a ceiling on the amplifier's output, and decide which cause fits every record.
    briefing: The spare pump gave back most of what the span lost, and the fibre was never damaged.
    stake: >-
      Monday, and two working days to the ship. Friday's switch gave back 3.6 decibels of the 4.1 the
      span lost, which is a fact about repeater 6 rather than about the seabed. Tanaka wants the
      ceiling derived: how much signal power a pump of a given size could ever produce, so that the
      original pump's decline can be stated as a number instead of inferred. Sarraf has every record
      of the last three weeks on one table. Today you take the ceiling on the amplifier's output,
      decide which of the four candidates accounts for all of it, and settle with Ramnarine how the
      two-wavelength comparison is made at all. Whatever goes on the chart on Wednesday is what forty
      thousand a day is spent looking for.
    takeaway: One pump arrival can make at most one signal arrival, which puts a ceiling on gain that no design gets past.
    stops:
      - group: AMP
        task: Put a ceiling on what the pump could give
        title: Seventy-four milliwatts, at most
        concept: 'Stimulated emission, population inversion and gain'
        takesAsRead:
          - Atomic energy levels, and the wavelengths they allow
        place: Amplifier and Power Hall
        scene: >-
          The pump is at 980 nanometres and the signal at 1550. Repeater 6's pump was logged at 118
          milliwatts when it was fitted four years ago. Tanaka wants the most signal power that could
          ever come out of it.
        guide: >-
          You build the working a line at a time. The ceiling is a count: each pump arrival can end up
          as at most one signal arrival, and the signal arrival carries less energy. So the largest
          possible added signal power is the pump power times the ratio of the two energies — which is
          the ratio of the two wavelengths the other way up. Then compare it with what the span lost.
        background:
          - >-
            Why the ceiling is a ratio of wavelengths. A pump arrival at 980 nanometres carries hc over
            980; a signal arrival carries hc over 1550. So the same number of arrivals a second carries
            980 over 1550 as much power, which is 0.632 — and 118 milliwatts of pump can therefore add
            at most 74.6 milliwatts of signal.
          - >-
            Why nothing gets past it. Every route from pump to signal goes through one excited atom
            releasing one arrival. There is no mechanism in this glass by which one pump arrival
            produces two signal arrivals, so the ceiling is a statement about counting rather than about
            engineering, and a better amplifier design approaches it rather than exceeding it.
          - >-
            What it says about repeater 6. A pump down to 46 milliwatts has a ceiling of 29 milliwatts
            against the original's 74.6, which is 4.1 decibels of gain lost — the number the span lost
            in one night, arrived at from the pump's own physics rather than from the trace. That is the
            end of the fortnight's argument.
        assumes:
          - each pump arrival can produce at most one signal arrival
        takeaway: The most an amplifier can add is its pump power scaled by the ratio of the two wavelengths, because arrivals are conserved and energies are not.
        format: DERIVE
        question: What is the most signal power 118 mW of pump could add?
        answerText: >-
          About 74.6 mW, which is 118 × 980/1550. A pump fallen to 46 mW has a ceiling of 29 mW —
          4.1 dB less.
        why: >-
          At most 74.6 milliwatts. The pump's power is a number of arrivals a second, each carrying
          1.27 electron volts, and every one of them can produce at most one signal arrival carrying
          0.80. So the power that can be added is the pump power times the ratio of those energies,
          which is the ratio of the wavelengths inverted. Applying the same ceiling to a pump that has
          fallen to 46 milliwatts gives 29, and the difference between the two ceilings is 4.1
          decibels — which is what the span lost in a night.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: P_signal ≤ P_pump × (E_signal/E_pump)
          startNote: pump 980 nm, signal 1550 nm, pump power as logged 118 mW; suspected now 46 mW
          goal: the ceiling on added signal power, in milliwatts, and the loss if the pump has fallen
          askRule: true
          rules:
            - one arrival for one arrival
            - the energy of a photon
            - conversion to decibels
            - substitution of the stated values
            - rearrangement
          steps:
            - ask: Write the ratio of the two arrival energies.
              answer: 2
              candidates:
                - text: E_signal/E_pump = 1550/980 = 1.582
                  rule: the energy of a photon
                  survives: true
                  why: >-
                    The wavelengths in the ratio the same way round as the energies, when energy goes
                    inversely with wavelength. It gives a ceiling above the pump power, which is a
                    machine that makes energy.
                - text: E_signal/E_pump = (1550/980)² = 2.50
                  rule: rearrangement
                  why: >-
                    Energy goes as one over the wavelength, not one over its square. There is no square
                    anywhere in this relation.
                - text: E_signal/E_pump = 980/1550 = 0.632
                  rule: the energy of a photon
                - text: E_signal/E_pump = 1550 − 980 = 570 nm
                  rule: rearrangement
                  why: >-
                    A difference of wavelengths is a wavelength, not a ratio of energies. It is the
                    quantum defect expressed in the least useful unit available.
            - ask: Apply the one-for-one ceiling.
              answer: 0
              candidates:
                - text: P_signal ≤ 118 × 0.632 = 74.6 mW
                  rule: one arrival for one arrival
                - text: P_signal ≤ 118 mW, since energy is conserved
                  rule: rearrangement
                  survives: true
                  why: >-
                    Energy is conserved and the ceiling is tighter than that: the surplus 37 per cent
                    cannot leave as signal light because there is no level for it to come from. The
                    bound is real and this one is merely true.
                - text: P_signal ≤ 118 ÷ 0.632 = 187 mW
                  rule: rearrangement
                  why: >-
                    Divided, which puts more power out than in. The same slip as the inverted ratio,
                    arriving one line later.
                - text: P_signal ≤ 118 × 2 = 236 mW, two signal arrivals per pump arrival
                  rule: one arrival for one arrival
                  why: >-
                    Nothing in this glass produces two arrivals from one. That would need the pump
                    arrival to carry twice the signal energy, and it carries 1.58 times it.
            - ask: Apply the same ceiling to a pump at 46 mW.
              answer: 3
              candidates:
                - text: 46 × 0.632 = 29.1 mW, so the ceiling has fallen by 45 mW
                  rule: substitution of the stated values
                  survives: true
                  why: >-
                    Right arithmetic, and the difference reported as a power rather than as a ratio. A
                    span's loss is a ratio, and 45 milliwatts means nothing until it is one.
                - text: 46 × 1.582 = 72.8 mW, barely changed
                  rule: rearrangement
                  why: >-
                    The inverted ratio again, and it happens to give almost the original ceiling — which
                    would say a pump can fall by 60 per cent with no effect at all.
                - text: 46 mW, since the ceiling is set by the wavelengths rather than the power
                  rule: one arrival for one arrival
                  why: >-
                    The wavelengths set the ratio and the pump power sets the size. Both are in the
                    expression.
                - text: 46 × 0.632 = 29.1 mW
                  rule: substitution of the stated values
            - ask: Put the two ceilings into decibels.
              answer: 1
              candidates:
                - text: 74.6 − 29.1 = 45.5 dB
                  rule: conversion to decibels
                  why: >-
                    A difference of powers in milliwatts reported as decibels. Decibels come from a
                    ratio through a logarithm.
                - text: 10·log₁₀(74.6/29.1) = 4.1 dB
                  rule: conversion to decibels
                - text: 20·log₁₀(74.6/29.1) = 8.2 dB
                  rule: conversion to decibels
                  survives: true
                  why: >-
                    The factor of twenty, which belongs to amplitudes. These are powers, and the answer
                    is exactly twice the loss the span actually saw — which would send everybody looking
                    for a second fault.
                - text: 10·log₁₀(29.1/74.6) = −4.1 dB, a gain
                  rule: rearrangement
                  why: >-
                    The size is right and the sign makes a loss into a gain. The span lost light; the
                    ratio has to be written the way that says so.
          commit: Commit the derivation
      - group: TEST
        task: Decide which cause accounts for every record
        title: Four records, one cause
        concept: 'Which of several candidate causes a signature can tell apart'
        place: Test Room
        scene: >-
          Everything from three weeks is on the table: the trace with its step, the two-wavelength
          comparison, the power feed's log, and Friday's switch to the spare pump.
        guide: >-
          Look at every record before choosing, including the two that are not alarming. The power feed
          is in order and the two-wavelength comparison shows the same loss at both, which is the
          record that does most of the work here: a bend loses more at the longer wavelength and a
          repeater's gain does not care which wavelength it is amplifying.
        assumes:
          - a bend loses more at longer wavelengths and an amplifier's gain does not
        takeaway: A cause has to account for the quiet records as well as the loud one, and the quiet ones are usually what rule the others out.
        format: DIAGNOSIS
        headline: The span lost 4.1 dB in a night and a spare pump gave 3.6 of it back.
        task: Which cause accounts for all four records?
        readings:
          - { zone: Trace, label: Step at 84.6 km, value: 4.1 dB, status: alarm }
          - { zone: Two wavelengths, label: "Loss at 1625 nm against 1550", value: the same, status: normal }
          - { zone: Power feed, label: Voltage and current, value: as designed, status: normal }
          - { zone: After the switch, label: Received power, value: up 3.6 dB, status: alarm }
        choices:
          - { label: A bend in the cable at that point, mechanism: Light leaves the core where the fibre is tightly curved. }
          - { label: A dried mechanical joint, mechanism: The gel has gone and the joint has become a lossy step in index. }
          - { label: The pump in repeater 6 has aged, mechanism: "Less pump power means less gain, at both wavelengths equally." }
          - { label: The cable has been damaged by fishing gear, mechanism: Crushing loses light over a length of fibre. }
        answer: The pump in repeater 6 has aged
        why: >-
          Three of the four records point the same way once the quiet ones are read. A bend and a crush
          both lose more at 1625 nanometres than at 1550, and the comparison shows the same loss at
          both — which rules out anything that works by light leaving the core. A dried joint would
          have put a reflection on the step and would not have been mended by switching a pump three
          kilometres further out. The pump's decline accounts for a loss equal at both wavelengths, at
          the position of the repeater, with the feed in order, and for 3.6 of the 4.1 decibels coming
          back when a fresh pump was switched in.
      - group: SPLICE
        task: Ask Ramnarine how the two wavelengths are compared
        title: One fibre, two colours
        concept: 'Diffraction, and what a grating does to a mixture of wavelengths'
        place: Splice Trailer
        person: true
        scene: >-
          The two-wavelength comparison is the record that settled today, and it is made with a ruled
          plate in the instrument's own head that Ramnarine has never had open.
        guide: >-
          All four options are ways of separating two wavelengths that arrive on the same fibre. Ask of
          each whether it separates them or merely selects one, and what physical quantity does the
          separating — because one of the four uses a path difference that depends on the wavelength.
        assumes:
          - waves from many evenly spaced sources reinforce only in particular directions
        takeaway: Separating a mixture and selecting one part of it are different operations with different costs.
        format: CHOICE
        question: How does a grating separate two wavelengths arriving together?
        why: >-
          Light from each of the grating's many lines travels a slightly different distance to any
          given direction, and the directions where all of them reinforce depend on the wavelength.
          So each wavelength leaves at its own angle, and the two arrive at different places on a
          detector: separation rather than selection. A filter would pass one and throw the other away,
          which is a different instrument and a different measurement — you would have to make it twice
          and hope nothing changed in between.
        choices:
          - Each wavelength reinforces in a different direction
          - It absorbs one wavelength and passes the other
          - It reflects the shorter wavelength and transmits the longer
          - It slows one wavelength more than the other and separates them in time
        answer: Each wavelength reinforces in a different direction
        rebuttals:
          - An absorbing filter selects one and destroys the other, so the comparison would need two runs.
          - A mirror that reflected by colour would still have to send them somewhere, and a grating is what does that.
          - Separating in time is dispersion, and over a plate a few millimetres wide it is unmeasurable.
  # ---------------------------------------------------------------- day 12
  - title: What the ship is told
    objective: Close the loss budget against the repeater, and decide what the charter is spent on.
    briefing: The chart goes out this afternoon and the ship sails in the morning.
    stake: >-
      Tuesday, and the ship sails in the morning. What the fortnight has established is that Sarraf was
      right about acting on the trace and Okonkwo was right about what the trace was saying: the loss
      is at repeater 6, it is the pump rather than the fibre, and the position on the chart was 1.7
      kilometres out for three reasons that all pointed the same way. Farouk has a housing radiographed
      and signed. Whatever is on the chart at four o'clock is what forty thousand a day goes looking
      for. Today you close the budget against the repeater, spend what is left of the spares money, and
      settle with Tanaka what the ship is actually being sent to do.
    takeaway: A budget that closes against one cause and not the others is the strongest statement a fortnight of measurement can make.
    stops:
      - group: TEST
        task: Close the loss budget against the repeater
        title: Four decibels, accounted for
        concept: Power in decibels, and why a loss budget adds
        place: Test Room
        scene: >-
          The budget from day four is on the board: 21.8 decibels total, of which 4.1 arrived in one
          night. Friday's switch returned 3.6. Sarraf wants the whole thing closed, term by term, with
          nothing left over.
        guide: >-
          You build the working a line at a time. Take the budget as it stood before the event, add
          what the pump's decline accounts for, and see what is left unexplained. A budget that closes
          to within a tenth of a decibel is a different kind of statement from one that closes to
          within a decibel, and the difference decides what the ship is told to look for.
        background:
          - >-
            Why the residue matters more than the total. Half a decibel unaccounted for could be a
            second cause, or it could be the amplifier giving slightly less gain at the higher input, or it
            could be the measurement. Saying which is what the last two days have been for, and saying
            it is not the same as having no residue at all.
          - >-
            Why the ship still sails. A pump on the seabed cannot be replaced from shore. The spare is
            now the working pump and there is no second spare, so repeater 6 has one failure left in
            it before the span goes down with the traffic already diverted — which is why a housing has
            been radiographed and is on the deck.
          - >-
            What the chart says now. 82.9 kilometres along the route, at the repeater rather than
            between repeaters, with a tolerance of 400 metres from the slack and 200 from everything
            else. A position and an object, rather than a kilometre and a hope.
        assumes:
          - a budget that closes leaves nothing that needs another cause
        takeaway: A budget closes when every decibel is attributed, and what is left over is either a second cause or a measurement.
        format: DERIVE
        question: How much of the 4.1 dB is accounted for, and what is left?
        answerText: >-
          3.6 dB by the pump, leaving 0.5 dB — which is inside what the amplifier's own gain does when
          its input changes, and needs no second cause.
        why: >-
          The pump accounts for 3.6 decibels of the 4.1, leaving 0.5. That residue is inside what an
          amplifier does when its input changes and it gives a little less gain, so it needs no second cause — but saying
          so is a judgement rather than an arithmetic result, and it is recorded as such. The budget
          is now 21.3 decibels against an allowance of 24, which is 2.7 of margin: better than before
          the switch and worse than the span had when it was new, because the fresh pump is the last
          one in that housing.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: total = span + joints + event
          startNote: span 16.1 dB, joints 1.65 dB, event 4.1 dB, allowance 24 dB, the switch returned 3.6 dB
          goal: the residue after the pump is accounted for, and the margin now
          askRule: true
          rules:
            - decibels add along a path
            - attributing a term
            - the margin against the allowance
            - substitution of the stated values
            - rearrangement
          steps:
            - ask: Attribute what the switch returned.
              answer: 1
              candidates:
                - text: the switch returned 3.6 dB, so the event was 3.6 dB and the trace was wrong
                  rule: attributing a term
                  survives: true
                  why: >-
                    Two measurements of different things being made to agree by discarding one. The
                    trace measured 4.1 and the switch returned 3.6; both can be right, and the
                    difference is the thing to explain.
                - text: the pump accounts for 3.6 of the 4.1, leaving 0.5 dB
                  rule: attributing a term
                - text: the pump accounts for all 4.1, since it is the only cause found
                  rule: attributing a term
                  why: >-
                    Being the only cause found is not the same as accounting for the whole figure. The
                    half decibel is either explained or recorded.
                - text: the pump accounts for 3.6 and the joints for the other 0.5
                  rule: rearrangement
                  why: >-
                    The joints were in the budget before the event and have not changed. Attributing
                    part of a new loss to a term that was already counted is double counting.
            - ask: Restate the total.
              answer: 3
              candidates:
                - text: 16.1 + 1.65 + 4.1 − 3.6 = 18.25 dB
                  rule: rearrangement
                  survives: true
                  why: >-
                    The switch's 3.6 subtracted from the whole budget rather than from the event. It
                    arrives at the right number by a route that would give the wrong one as soon as
                    any other term moved.
                - text: 16.1 + 1.65 + 3.6 = 21.35 dB, taking the returned figure as the event
                  rule: decibels add along a path
                  why: >-
                    The returned figure put in as the event, when what remains after the switch is the
                    part that did not come back.
                - text: 16.1 + 1.65 = 17.75 dB, the budget as it stood before the event
                  rule: decibels add along a path
                  why: >-
                    That is the span before anything happened. Half a decibel of the event is still
                    there and has to be carried.
                - text: 16.1 + 1.65 + 0.5 = 18.25 dB
                  rule: decibels add along a path
            - ask: Take the margin against the allowance.
              answer: 3
              candidates:
                - text: 24 ÷ 21.8 = 1.10, so there is ten per cent in hand
                  rule: rearrangement
                  why: >-
                    Decibels are subtracted, not divided. Dividing two logarithms gives a number that
                    means nothing.
                - text: 24 − 21.8 = 2.2 dB, which is a factor of 251
                  rule: substitution of the stated values
                  survives: true
                  why: >-
                    The subtraction is right and the ratio quoted is the allowance's rather than the
                    margin's. 251 is what 24 decibels is; 2.2 decibels is a factor of 1.66.
                - text: 24 + 21.8 = 45.8 dB of margin
                  rule: decibels add along a path
                  why: >-
                    An allowance is what may be spent, so the spend is taken off it. Adding gives more
                    margin the worse the span gets.
                - text: 24 − 21.8 = 2.2 dB, which is a factor of 1.66
                  rule: substitution of the stated values
          commit: Commit the derivation
      - group: AMP
        task: Spend what is left of the spares money
        title: A hundred points before the ship
        concept: 'A record that carries the conditions it was taken under'
        place: Amplifier and Power Hall
        scene: >-
          Tanaka has a hundred points of spares and survey money left in the year and four things it
          could go on. The ship sails in the morning and the next charter is not until the spring.
        guide: >-
          What the station holds already: a pump output figure for repeater 6 that is four years old
          and was never re-measured; a slack figure that is an average over a whole route; an
          instrument whose index setting was wrong for eleven years and has now been corrected; and
          eleven mechanical joints on the shore end that are as old as the cable. The traffic is on a
          diverse route with no spare of its own.
        rules: >-
          A hundred points, whole points, across the four. Spending is scored on what a measurement
          would change about a decision that gets made again: an instrument that turns an average into
          a measurement where the ship works, or a record of what a repeater is actually emitting, is
          worth more than a survey of something already inside its margin.
        assumes:
          - money spent on a measurement is worth what the measurement would change
        takeaway: Evidence is worth what it would change about the next decision, not what it would add to the file.
        format: SCIENCETANK
        task: Spread a hundred points across the four.
        proposals:
          - { label: A, text: "Telemeter the pump's optical output as well as its current, on the new housing." }
          - { label: B, text: Survey the slack over the twenty kilometres either side of repeater 6. }
          - { label: C, text: Replace the eleven original mechanical joints on the shore end. }
          - { label: D, text: "A second reflectometer, so a trace can be taken from both ends at once." }
        recommended: { A: 40, B: 30, C: 20 }
        why: >-
          The optical telemetry is the measurement whose absence cost this fortnight: a pump current
          told everybody nothing for three weeks, and the housing going to sea tomorrow is the only
          chance to add it. The slack survey turns the largest and least certain of the three
          corrections into a measurement where the ship will actually be working. Replacing the old
          joints is real work on eleven components that are past their design life and are not
          currently failing. A second instrument would halve the position uncertainty of a fault whose
          position is now dominated by slack rather than by the trace.
      - group: RAD
        task: Ask Farouk why the source has a fixed energy
        title: One nucleus, one line
        concept: 'Radioactive decay as a random process with a fixed chance'
        takesAsRead:
          - The nucleus, and the binding energy that holds it
        place: Radiography Bay
        person: true
        scene: >-
          Farouk's source emits at two definite energies and nothing in between, however old it gets
          and however warm the bay is. Her film's exposure changes and the energies do not.
        guide: >-
          Each observation on the left has one explanation on the right. What separates them is which
          properties belong to the nucleus itself and which to how much of it is left, because ageing
          changes one of those and not the other.
        assumes:
          - a nucleus has a set of states with definite energies
        takeaway: A nucleus has fixed levels, so it emits fixed energies; how much is left changes only how often.
        format: CASEBOOK
        task: Match each observation about the source to what explains it.
        scenarios:
          - The two emitted energies are the same as they were eight months ago.
          - The number of emissions a second is a tenth of what it was.
          - The half-life is the same for this pot as for every other pot of the same material.
          - Warming the pot changes nothing about either the energies or the rate.
        choices:
          - The gaps between the nucleus's own states do not change with time.
          - Only the number of nuclei left has changed, and each one behaves as it always did.
          - The chance of decay per second belongs to that kind of nucleus rather than to the sample.
          - Nuclear energies are millions of times larger than anything heat can supply.
        mapping: [0, 1, 2, 3]
        why: >-
          Four observations, one distinction. The energies come from the gaps between the nucleus's
          own states, which nothing available in a radiography bay can alter, so they are the same
          after eight months and the same when warm. The rate depends on how many nuclei are left,
          which is what has changed. The half-life belongs to that kind of nucleus and not to the pot, which is
          why it can be looked up rather than measured. And heat supplies fractions of an electron
          volt against nuclear energies of hundreds of thousands, which is why a nuclear source is the
          most stable thing on this site.

interiors:
  TERM:
    caption: Where the sea cable becomes glass you can put light into.
    standLine: The armour off, the conductor to the feed, and every fibre out to a connector.
    station:
      kind: panel
      title: Termination bench
      rows:
        - { label: Core index, value: 1.4682, status: normal }
        - { label: Numerical aperture, value: 0.125, status: normal }
        - { label: Acceptance cone, value: 7.2°, status: high }
  TEST:
    caption: A pulse, a delay and a logarithm.
    standLine: Eleven years of traces in the drawer, each with its settings on the corner.
    station:
      kind: panel
      title: Reflectometer
      rows:
        - { label: Step in the trace, value: 4.1 dB, status: alarm }
        - { label: Round-trip delay, value: 828.6 µs, status: normal }
        - { label: 'Distance, corrected', value: 82.9 km, status: high }
  SPLICE:
    caption: Two ends of glass, and the step between them.
    standLine: Eleven mechanical joints on the shore end, all as old as the cable.
    station:
      kind: panel
      title: Splice bench
      rows:
        - { label: 'Reflection, dry end', value: −14.4 dB, status: alarm }
        - { label: 'Reflection, in gel', value: −51 dB, status: normal }
        - { label: Coating thickness, value: 320 nm, status: normal }
  AMP:
    caption: Erbium in a coil of glass, and a laser holding it excited.
    standLine: Repeater 6's telemetry, four years of it, every reading inside limits.
    station:
      kind: panel
      title: Amplifier desk
      rows:
        - { label: 'Pump, as logged', value: 118 mW, status: normal }
        - { label: 'Ceiling on added signal', value: 74.6 mW, status: high }
        - { label: 'Pump now, inferred', value: 46 mW, status: alarm }
  RECV:
    caption: Where photons become charges, and where the counting starts.
    standLine: A diode measured at 82 conversions in a hundred, against a sheet claiming ninety.
    station:
      kind: panel
      title: Receiver bench
      rows:
        - { label: Photon energy at 1550 nm, value: 0.80 eV, status: normal }
        - { label: Responsivity, value: 1.03 A/W, status: normal }
        - { label: Arrivals per bit, value: 6200, status: high }
  RAD:
    caption: Three hundred metres out in the dunes, because of what is in the pot.
    standLine: The source renewed eight months ago, and every exposure since a little longer.
    station:
      kind: panel
      title: Radiography bay
      rows:
        - { label: Through 40 mm of steel, value: 7 %, status: high }
        - { label: Activity left, value: 10 %, status: alarm }
        - { label: Barrier distance, value: 18.5 m, status: normal }

warmups:
  trial-near:
    title: Walk the station before the ship sails
    why: >-
      Five buildings, a duct trench and a beach manhole, and the cable runs under all of it. Walk it
      once in daylight. When the ship is on the water you will be crossing this ground with a
      position to hand over, and the trailer is not where the drawing says it is.
  trial-far:
    title: The dune track out to the bay
    why: >-
      The radiography bay is three hundred metres out in the dunes because of what is in the pot, and
      the track shifts with the sand. Take it once before you have to, because Nadia Farouk, the
      radiographer, will be waiting on a film and the exposure cannot be interrupted half way.
  greet:
    title: Twelve people, and two of them have been arguing for a fortnight
    why: >-
      This station runs on a disagreement between Gerald Okonkwo, the station chief, and Ines Sarraf,
      the chief transmission engineer, about what an instrument is entitled to say. You will be
      carrying numbers between them all fortnight, so get round the whole crew first.
  follow:
    title: The duct route, walked by the man who terminated it
    why: >-
      Halvard Nilsen, the cable termination technician, walks the duct from the beach manhole to the
      termination room the same way every week and the route is not on the drawing at the accuracy
      that matters. Stay with him along it. Where he stops is where the duct is shallow.
  hunt:
    title: Six spare pump modules, and the store lists four
    item: { name: pump module, plural: pump modules }
    why: >-
      Every amplifier on this station has a spare pump module and two of them are not in the store
      where the book says. A spare nobody can find is a repeater with no redundancy, which is exactly
      what repeater 6 became on Friday afternoon.
  canvass:
    title: Who else saw the loss arrive on the night
    why: >-
      The span lost four decibels between two o'clock and four in the morning and only one instrument
      recorded it. Ask round the crew and the night shift until enough accounts agree on when it
      began, because a single trace is not yet a measurement of when anything happened.
  evade:
    title: The maker's engineer who wants the trace re-run his way
    why: >-
      He has driven from the mainland with a settings sheet and wants the span traced with a long
      pulse, which would blur the very thing that is being looked at. The argument belongs to Ines
      Sarraf, the chief transmission engineer.
      Keep clear of him and get your round done rather than spending the afternoon in the test room.
  tag:
    title: Catch Whitlock before he signs the bay out
    why: >-
      Joe Whitlock, the radiation safety officer, signs the bay closed at six and today's exposure
      runs to a hundred and twenty-six minutes. The barrier distance has to be agreed before he
      leaves, or the housing waits a day and the ship sails without a radiograph.

copy:
  TERM: <p>The cable termination room. The armour comes off here, the conductor goes to the power feed, and every fibre in the cable is brought out to a connector somebody made by hand.</p>
  TEST: <p>The test room. One instrument, eleven years of traces in a drawer with their settings written on the corners, and a step nineteen days old that nobody has explained.</p>
  SPLICE: <p>The splice trailer, parked against the duct trench. A fusion splicer, a microscope, and eleven mechanical joints' worth of history on the shore end.</p>
  AMP: <p>The amplifier and power hall. Several thousand volts on the cable's single conductor, and a coil of glass with a rare-earth metal in it that does the work nothing electrical could.</p>
  RECV: <p>The receiver lab. A diode, an amplifier and a decision about whether a bit was a one, made six thousand photons at a time.</p>
  RAD: <p>The radiography bay, three hundred metres out in the dunes. A pot, a crank handle, a barrier rope and a film cassette, and a source that is a tenth of what it was in the spring.</p>
  MANHOLE: <p>The beach manhole. Where the sea cable stops being a sea cable, under a concrete lid two hundred metres up the dune from the low-water mark.</p>
  GEN: <p>The generator house. Two sets, one running, because a landing station that loses power stops feeding the repeaters and every one of them is on the seabed.</p>
  STORE: <p>The ship's store. Spare housings, spare pumps, jointing kits and a grapnel, all of it staged for a charter that starts on the thirteenth.</p>

# Dark Fibre — Pellow Head Island, twelve days to guide one repair attempt.
#
# Written to gamekit/tools/BOOK_TEMPLATE.md. The place is themes/darkfibre/site.js;
# the sketch it came from is ../GAME_IDEAS.md under "Fibre", where it sat parked
# because Deep Watch already owned "everything you know arrives as a signal".
# What settled it is the course: AP Physics 2's optics and modern-physics half is
# four concepts and three concepts in deepwatch_hs, retrofitted onto a submarine,
# and it is the whole of both units here.
#
# Twelve of the thirty-six stops are DERIVE panels, one a day, in the order the
# optics has to arrive in:
#
#   day  1  the acceptance cone, from Snell's law and the critical angle
#   day  2  the apparent fault distance, from delay and the speed in glass
#   day  3  the reflection expected from a clean break
#   day  4  the full span loss budget in decibels
#   day  5  the energy of one 1550 nm photon and the photon rate in a power
#   day  6  the measured photodiode responsivity
#   day  7  gamma attenuation through the replacement housing
#   day  8  the anti-reflection coating used to clean up the two-colour test
#   day  9  radioactive decay of the radiography source
#   day 10  the corrected seabed route position
#   day 11  the pump-power ceiling from photon energies
#   day 12  the final loss budget after the spare-pump recovery
#
# `askRule: true` is on. Optics is a course where the same arithmetic is licensed
# by four different physical laws, and a student who divides the indices the right
# way round without knowing whether they are using Snell or the critical-angle
# condition has not understood either.
#
# The story: Pellow Head is a small island whose main phone and internet link to the mainland
# is an undersea fibre cable. The cable lost 4.1 dB suddenly and the island is running on one
# backup route. A repair ship reaches the island in twelve days, just before bad weather closes
# the sea for weeks. The player has to use the physics of light to answer two questions before
# that one safe recovery day: what failed, and exactly where it is on the seabed route.
#
# The timeline the cards are checked against:
#   eleven years ago    the cable laid; 1.5 per cent slack paid out over the route
#   four years ago      repeater 6 replaced; its pump output logged at 118 mW
#   eight months ago    the radiography source renewed; 73.8-day half-life
#   nineteen days ago   the span lost 4.1 dB overnight and the traffic moved
#   now                 twelve working days until the repair ship arrives
#   day 13              one safe repair day before the weather closes the sea
#   after that          the next safe offshore repair window may be weeks away

theme:
  id: darkfibre
  title: Dark Fibre
  subtitle: Optical Measurements Lead · Pellow Head Island · twelve days to guide one repair attempt
  opening: >-
    Pellow Head is a small island. Nearly every phone call and internet connection to the mainland runs through
    one fibre-optic cable on the ocean floor. Nineteen days ago it lost most of its signal, leaving the island
    on one backup line. If that fails, emergency calls, hospital links and normal communication with the mainland
    go down.


    A repair ship arrives in twelve days, just before bad weather closes the sea for weeks. It gets one safe day
    to pull up one part of the cable. You are the optical measurements lead. Use the physics of light to answer
    two questions: what failed, and where is it? Send the ship to the wrong thing or place, and Pellow Head may
    stay on its last link until the sea reopens.

groups:
  - id: TERM
    code: TERM
    name: Cable Termination Room
    color: '#4f7fa8'
    desc: Where the island cable comes ashore and light is launched into its glass fibres.
    defaultLeader: okonkwo
    milestones: [Read the ends, Take the angles, Set the launch, Ready to hand over]
  - id: TEST
    code: TEST
    name: Test Room
    color: '#c2703f'
    desc: Where pulses are sent down the cable and the returning light becomes evidence.
    defaultLeader: sarraf
    milestones: [Fire the pulse, Read the trace, Place the event, Ready to hand over]
  - id: SPLICE
    code: SPLICE
    name: Splice Trailer
    color: '#8a8f4a'
    desc: Where old joints are tested to see whether they could be stealing or reflecting light.
    defaultLeader: ramnarine
    milestones: [Prepare the ends, Match the index, Prove the joint, Ready to hand over]
  - id: AMP
    code: AMP
    name: Amplifier and Power Hall
    color: '#8a6fb0'
    desc: Where the team studies the laser pumps that keep the cable signal strong across the ocean floor.
    defaultLeader: tanaka
    milestones: [Read the pump, Take the transition, Find the gain, Ready to hand over]
  - id: RECV
    code: RECV
    name: Receiver Lab
    color: '#3f8f7a'
    desc: Where the faint light from the far end becomes electrical current and data.
    defaultLeader: duarte
    milestones: [Count the photons, Take the efficiency, Set the sensitivity, Ready to hand over]
  - id: RAD
    code: RAD
    name: Radiography Bay
    color: '#6f6a86'
    desc: Where the replacement repeater housing is X-rayed before the ship is allowed to take it to sea.
    defaultLeader: farouk
    milestones: [Check the source, Take the dose, Shoot the weld, Ready to hand over]

roster:
  - id: okonkwo
    name: Gerald Okonkwo
    role: Station Chief and Cable Engineer
    division: TERM
    bio: |
      Runs Pellow Head and was on the ship that laid this cable eleven years ago.
      He signed the lay chart, which is why he is the only person here who talks
      about the cable as an object with a length rather than as a number of
      kilometres.

      His argument with the test room is always the same. An instrument reports in
      its own units, and an optical distance down a fibre is not a position on the
      seabed: the cable was paid out with slack in it, deliberately, so that it
      lies on the bottom instead of hanging between high spots.

      His limit is that the slack is an average over a route. He can tell you it
      was 1.5 per cent overall and he cannot tell you what it was in any
      particular ten kilometres, which is the ten kilometres the ship will be
      working in.
    quiz:
      - q: Why does Okonkwo say an optical distance is not a position on the seabed?
        a: The cable was laid with slack, so it is longer than the route
        wrong:
          - Optical time-domain instruments are calibrated in air and not in glass
          - The cable's route was surveyed before it was laid and has since moved
          - A distance down a fibre includes the length coiled inside each repeater housing
  - id: nilsen
    name: Halvard Nilsen
    role: Cable Termination Technician
    division: TERM
    bio: |
      Terminates the sea cable in the room where it comes ashore: armour off,
      conductor to the power feed, and every fibre in it brought out to a
      connector he has made himself.

      His subject is the launch. Light only stays in a core if it arrives inside a
      cone, and the cone is a property of the two glasses rather than of the
      equipment, so a connector that looks perfect can still be throwing away half
      of what is put into it.

      His limit is that he cannot see what he has made. A good termination and a
      bad one look identical, and the only difference is a number on a meter in
      another room.
    quiz:
      - q: Why can a termination that looks perfect still lose half the light?
        a: Light launched outside the acceptance cone is not trapped in the core
        wrong:
          - A connector's polish scatters light in a way that cannot be seen by eye
          - Armour left on the cable absorbs part of the light before the core begins
          - The conductor for the power feed runs beside the fibres and heats them
  - id: sarraf
    name: Ines Sarraf
    role: Chief Transmission Engineer
    division: TEST
    bio: |-
      Runs the test room and has been reading traces for fifteen years. Nineteen days ago this span lost four decibels overnight and she was the person who moved the traffic before anybody had a name for what happened.

      Her position is that the trace is a measurement rather than an opinion. It fires a pulse, times what comes back, and places the event to a few metres of optical distance, which is better than anything else anybody will offer quickly.

      Her limit is that she is measuring the fibre and the decision is about the seabed. She knows it, and she also knows the ship gets one safe repair day before the weather closes. A perfect answer that arrives after the ship leaves is no answer at all.
    quiz:
      - q: Why does Sarraf push for a decision before every uncertainty has been removed?
        a: The ship has one safe repair window, so evidence that arrives too late cannot guide the repair
        wrong:
          - No instrument other than a reflectometer can locate a fault in an undersea cable
          - The first trace already identifies the failed component, so more measurements add nothing
          - Optical distance and seabed position agree to within a few metres in practice
  - id: meier
    name: Tobias Meier
    role: Test Room Technician
    division: TEST
    bio: |
      Fires the pulses and keeps the instrument's own record. Every trace in the
      drawer has a wavelength, a pulse width and a range setting written on its
      corner, in his hand, because a trace without them cannot be compared with
      the trace beside it.

      What he knows and nobody asks for is that this span has been traced at two
      wavelengths for eleven years, and the difference between the two says things
      about the loss that neither says on its own.

      His limit is that a longer pulse sees further and blurs what is close. Every
      trace is a choice between reach and resolution, and the choice is written on
      the corner rather than in the report.
    quiz:
      - q: Why does Meier write the pulse width on every trace?
        a: A longer pulse reaches further and blurs nearby events
        wrong:
          - The instrument's calibration drifts with the pulse width it was last set to
          - A pulse width is needed to convert the trace from decibels into watts
          - Traces taken with different pulse widths are averaged together in the report
  - id: ramnarine
    name: Priya Ramnarine
    role: Chief Splicer
    division: SPLICE
    bio: |
      Joins glass to glass, in a trailer parked against the duct trench. A fusion
      splice welds two cores together and a mechanical one holds them end to end
      in a gel of matched index, and she can say which is appropriate before
      anybody has told her what it is for.

      Her subject is the step. Any abrupt change of index reflects part of the
      light straight back, so a good joint is one with no step in it — and a joint
      with a step is not merely lossy, it is visible, which is occasionally what
      you want.

      Her limit is that the gel dries out. A mechanical splice made this year is
      an excellent joint and one made eleven years ago is an unknown, and there
      are eleven of those on the shore end.
    quiz:
      - q: Why does Ramnarine say a joint with an index step is not merely lossy?
        a: A step sends light back, so the joint can be seen from either end
        wrong:
          - A step heats the joint, which drives the gel out of it over time
          - Steps in index cause the pulse to spread as well as weaken
          - A reflecting joint amplifies whatever noise is already on the fibre
  - id: achebe
    name: Sam Achebe
    role: Fibre Preparation Technician
    division: SPLICE
    bio: |
      Prepares the ends: strips the coating, cleaves the glass and checks the face
      under a microscope before anybody takes it near a splicer. A cleave is a
      controlled break and it is either square or it is not.

      He is exact about what a face does. An angled face refracts the light out of
      the axis, so it loses more than a square one and it reflects less; a chipped
      one scatters. Three defects, three signatures, and all three look like dirt
      from a metre away.

      His limit is the microscope. It shows the face and not the glass behind it,
      and a cleave can be square and the core still not be where it should be.
    quiz:
      - q: Why does an angled cleave reflect less than a square one?
        a: It sends the reflected light out of the axis instead of back
        wrong:
          - An angled face has more area, so the reflection is spread more thinly
          - Angled faces are polished, and polishing removes the index step
          - The gel wets an angled face more completely than a square one
  - id: tanaka
    name: Dr. Yuki Tanaka
    role: Amplifier Specialist
    division: AMP
    bio: |
      Responsible for the amplifiers, on shore and in the water. An amplifier here
      is a coil of fibre with erbium in the glass and a laser pumping it, and it
      works because of a level scheme in an atom rather than because of anything
      an engineer chose.

      Her interest is in what the pump is doing. A pump photon at 980 nanometres
      carries more energy than the signal photon it eventually helps make at
      1550, and the difference has to go somewhere. So does the pump power that is
      no longer arriving, which is what she has been asking about for a fortnight.

      Her limit is that repeater 6 is on the seabed. Its pump current is
      telemetered and its output is not, and the difference between those two
      facts is where this fortnight has been going.
    quiz:
      - q: Why does Tanaka say an amplifier's wavelengths are not an engineering choice?
        a: They are the gaps between erbium's own energy levels
        wrong:
          - They were standardised by international agreement before the cable was laid
          - The pump laser's cavity length fixes them, and it cannot be altered at sea
          - The fibre's own loss is lowest at those two wavelengths by coincidence
  - id: salas
    name: Bruno Salas
    role: Power Feed Engineer
    division: AMP
    bio: |
      Runs the power feed, which puts several thousand volts on the cable's single
      conductor to run the repeaters out to mid-ocean, with the sea as the return.

      What he watches is the voltage against the current. Every repeater has a
      known drop across it, so the total tells you how many are still drawing and
      the shape of the change tells you which one altered. It is the only
      diagnostic here that does not involve light at all.

      His limit is that the feed says a repeater is drawing power. It says nothing
      whatever about whether the repeater is doing anything useful with it.
    quiz:
      - q: Why is the power feed's record not evidence that a repeater is working?
        a: Drawing current says nothing about what the pump is producing
        wrong:
          - The feed's meters are on the shore end and cannot resolve a single repeater
          - A repeater draws its full current only when it is amplifying
          - Voltage drops are quoted at the cable's design temperature and not at the seabed's
  - id: duarte
    name: Aline Duarte
    role: Receiver Engineer
    division: RECV
    bio: |
      Responsible for what happens at the end of the fibre: a photodiode, an
      amplifier and a decision about whether a bit was a one or a zero.

      Her subject is that light arrives in countable pieces. A receiver at the end
      of a long span is working with a few hundred photons a bit, and a few
      hundred of anything has a scatter of its own — so there is a floor under the
      error rate that has nothing to do with the quality of the electronics.

      Her limit is that she can measure the floor and not remove it. Everything
      she can build is above it, and the only way to get further is more photons
      or fewer bits a second.
    quiz:
      - q: Why is there a floor under a receiver's error rate?
        a: Anything counted rather than measured is uneven from one count to the next
        wrong:
          - Every amplifier adds noise, and the chain of them sets the limit
          - The photodiode's dark current cannot be cooled away entirely
          - Decision circuits have a fixed timing jitter that cannot be reduced
  - id: osgood
    name: Karl Osgood
    role: Photodiode Technician
    division: RECV
    bio: |
      Tests and matches the photodiodes. A diode's job is to turn a photon into an
      electron, and how often it succeeds is its quantum efficiency: a number
      between zero and one that he measures rather than reads off a label.

      What he can tell you is that a diode has a wavelength it stops working at,
      and that the reason is about the energy of one photon rather than about how
      bright the light is. A dim beam of the right colour works; a bright beam of
      the wrong one does nothing at all.

      His limit is the reference. Every efficiency he quotes is against a standard
      diode that goes away to be calibrated once a year.
    quiz:
      - q: Why does a photodiode stop working beyond a certain wavelength?
        a: One photon no longer carries enough energy to free an electron
        wrong:
          - Longer wavelengths pass through the diode's active layer without absorption
          - The diode's response time is too slow for longer wavelengths
          - Beyond that wavelength the light is reflected by the anti-reflection coating
  - id: farouk
    name: Nadia Farouk
    role: Radiographer
    division: RAD
    bio: |
      Radiographs the welds on repeater housings before they go to sea, in a bay
      three hundred metres out in the dunes because of what is in the pot.

      Her subject is what gets through. A gamma beam through forty millimetres of
      steel comes out a small fraction of what went in, and every equal thickness
      takes the same fraction rather than the same amount — which is why shielding
      is quoted as a thickness that halves it.

      Her limit is that the source is eight months old and is a tenth of what it
      was. Her exposures are longer every month, and there is a date beyond which
      the housing cannot be radiographed at all.
    quiz:
      - q: Why are Farouk's exposures longer every month?
        a: The source's activity falls by a fixed fraction each month
        wrong:
          - The film she uses has become less sensitive since the batch changed
          - Steel housings have been thicker since the design was revised
          - Her bay's shielding was increased, which attenuates the beam as well
  - id: whitlock
    name: Joe Whitlock
    role: Radiation Safety Officer
    division: RAD
    bio: |
      Sets the barrier distance for every exposure and signs the bay in and out.
      His arithmetic is the one piece of physics on this site that has to be right
      before anything happens rather than afterwards.

      A small source spreads its output over a sphere, so intensity falls with the
      square of distance and doubling the barrier quarters the dose. That is why
      the bay is where it is, and why the answer to a stronger source is usually
      more metres rather than more lead.

      His limit is that a barrier is only as good as the sphere. A beam that has
      been collimated does not obey his arithmetic, and there is one collimator in
      the store that he has asked twice to have removed.
    quiz:
      - q: Why does Whitlock prefer distance to shielding when a source is strong?
        a: Doubling the distance quarters the dose, for nothing
        wrong:
          - Lead shielding scatters gamma rays sideways and increases the dose nearby
          - Distance also reduces the exposure time needed for the film
          - Shielding has to be recertified annually and distance does not

glossary:
  - name: Calibration
    aliases: [calibration, calibrate, calibrated, calibrating]
    def: Checking an instrument against something already known, so its readings can be trusted.
  - name: Spectrum
    aliases: [spectrum, spectra]
    def: The set of energies or wavelengths something gives out, and how much of each.
  - name: Refractive index
    aliases: [refractive index, index, indices]
    def: How much more slowly light goes in a material than in empty space.
  - name: Optical fibre
    aliases: [optical fibre, fibre, fibres]
    def: A hair of very pure glass that carries light along its own length.
  - name: Core
    aliases: [core]
    def: The thin middle of a fibre, where the light travels.
  - name: Cladding
    aliases: [cladding]
    def: The layer round the core, made with a slightly lower index than the middle.
  - name: Total internal reflection
    aliases: [total internal reflection]
    def: What happens when light meets a boundary too obliquely to cross it, and none of it gets out.
  - name: Critical angle
    aliases: [critical angle]
    def: The angle beyond which none of the light crosses a boundary at all.
  - name: Numerical aperture
    aliases: [numerical aperture, acceptance angle]
    def: How wide a cone of light a fibre will take and keep.
  - name: Wavelength
    aliases: [wavelength, wavelengths]
    def: The distance between one crest of a wave and the next.
  - name: Nanometre
    aliases: [nanometre, nanometres, nm]
    def: A thousand-millionth of a metre, which is the unit light is measured in here.
  - name: Photon
    aliases: [photon, photons]
    def: One indivisible quantum of light, carrying an amount of energy fixed by its own colour.
  - name: Electron volt
    aliases: [electron volt, electron volts, ev]
    def: A very small unit of energy, convenient for one particle at a time.
  - name: Decibel
    aliases: [decibel, decibels, db]
    def: A way of stating a ratio as a logarithm, so that stages along a path add up.
  - name: Attenuation
    aliases: [attenuation, attenuates]
    def: The steady weakening of a signal as it goes, quoted per kilometre or per millimetre.
  - name: Rayleigh scattering
    aliases: [rayleigh scattering, scattering]
    def: Light turned aside by the tiny irregularities of the material it is passing through.
  - name: Dispersion
    aliases: [dispersion]
    def: The spreading of a pulse, because not every colour in it travels at quite the same speed.
  - name: Group index
    aliases: [group index]
    def: The number that says how fast a pulse travels, as against how fast one steady colour does.
  - name: Reflectometer
    aliases: [reflectometer, otdr]
    def: An instrument that sends a pulse down a fibre and times what comes back.
  - name: Trace
    aliases: [trace, traces]
    def: "The picture a reflectometer draws: how much came back, against how long it took."
  - name: Splice
    aliases: [splice, splices, spliced]
    def: A joint between two fibres, either welded or held end to end.
  - name: Cleave
    aliases: [cleave, cleaved, cleaving]
    def: A cut made on purpose, so that the end of a fibre is square rather than ragged.
  - name: Index-matching gel
    aliases: [index-matching gel, matching gel, gel]
    def: A clear jelly of the same index as the glass, used to remove a step at a joint.
  - name: Fresnel reflection
    aliases: [fresnel reflection, fresnel]
    def: The part of a beam that comes straight back wherever the index changes abruptly.
  - name: Repeater
    aliases: [repeater, repeaters]
    def: A sealed housing on the sea floor that strengthens the signals passing through it.
  - name: Erbium amplifier
    aliases: [erbium amplifier, erbium]
    def: A coil of fibre with a rare-earth element in the glass, which gives the signal energy it takes from
      a laser.
  - name: Pump laser
    aliases: [pump laser, pump]
    def: The laser whose light lifts those atoms into a state they can give energy from.
  - name: Stimulated emission
    aliases: [stimulated emission]
    def: An excited atom made to release its energy early, by a passing wave it then joins.
  - name: Population inversion
    aliases: [population inversion]
    def: The state in which more atoms are excited than are not, without which nothing is amplified.
  - name: Quantum efficiency
    aliases: [quantum efficiency]
    def: How often an arriving quantum of light frees a charge where it lands.
  - name: Responsivity
    aliases: [responsivity]
    def: The current a detector gives for each watt falling on it.
  - name: Shot noise
    aliases: [shot noise]
    def: The unevenness that comes from anything being counted rather than measured.
  - name: Landing station
    aliases: [landing station]
    def: The building where an undersea cable comes ashore and its signals go onto land equipment.
  - name: Power feed
    aliases: [power feed]
    def: The high voltage applied to a cable’s single conductor to run the housings along it.
  - name: Slack
    aliases: [slack]
    def: The extra length paid out while laying, so the cable lies down instead of hanging.
  - name: Grapnel
    aliases: [grapnel]
    def: A heavy hook dragged from a repair ship to catch an undersea cable so the crew can lift it.
  - name: Radiography
    aliases: [radiography, radiograph, radiographed]
    def: Making a picture of the inside of something by shining rays through it onto film.
  - name: Activity
    aliases: [activity]
    def: How many nuclei of a source break up each second.
  - name: Half-life
    aliases: [half-life]
    def: The time in which half of a batch of unstable nuclei have decayed.
  - name: Barrier distance
    aliases: [barrier distance]
    def: How far back everybody has to stand while an exposure is being made.

missions:
  # ---------------------------------------------------------------- day 1
  - title: Is the problem here, or out at sea?
    objective: >-
      Clear the station end, then decide what the first fault trace actually proves.
    briefing: >-
      Before you blame eighty kilometres of cable on the ocean floor, prove that this building is putting light
      into it correctly.
    stake: >-
      T−12 days. Sarraf, the chief transmission engineer, thinks the trace points to a fault far offshore. Nilsen, the cable termination technician, says a bad launch here can make good cable look weak. Use total internal reflection to clear the launch. Then say what the trace really shows, before anyone plans a repair at sea.
    takeaway: 'Physics can clear one suspect at a time: first the launch, then what the trace actually measured.'
    segue: >-
      The launch is good. The missing light is not being thrown away in this building. The trace shows a
      real 4.1 dB loss at a particular delay—but it does not yet tell you the cause or a place on the
      seabed. On day 2, turn that delay into a distance along the fibre.
    stops:
      - group: TERM
        task: Prove the station is launching light inside the fibre's acceptance cone
        title: How much light can the fibre accept?
        at: term-bench
        reason: >-
          If the station launches light at too wide an angle, light escapes immediately and the whole cable can
          look weak even when nothing offshore is wrong.
        concept: The acceptance angle of a fibre, and numerical aperture
        takesAsRead:
          - Total internal reflection and the critical angle
        place: Cable Termination Room
        scene: >-
          Nilsen puts the fibre certificate beside the launch connector: core index 1.4682, cladding 1.4629. Before
          Sarraf blames the ocean cable, he wants you to prove how wide a cone this fibre can trap.
        guide: >-
          Start with the core-cladding boundary. Use Snell's law to find the critical angle, convert that angle
          from the boundary normal to the fibre axis, then refract it through the end face into air. Each step
          answers a physical question: when light stops escaping, what direction that means inside the fibre,
          and what launch angle that corresponds to outside.
        background:
          - >-
            Why the two angles are complementary. A ray's angle at the core-cladding boundary is
            measured from the normal to that boundary. That normal runs across the fibre. Its angle
            from the axis is measured along the fibre instead. The two add to ninety degrees.
            Confusing them is the commonest way this derivation goes wrong.
          - >-
            Why the answer is so small. The two indices differ in the third decimal place, and that
            is deliberate. A small difference makes a narrow cone. A narrow cone keeps every ray on
            nearly the same path, so the rays arrive nearly together. The alternative is a fibre
            that accepts far more light and spreads every pulse.
          - >-
            What the number is for. Seven degrees is what a termination has to launch inside. It is
            also why a fibre is joined by welding rather than by pointing one at another. A
            misalignment of a fraction of a degree throws light outside the cone. Light outside the
            cone is gone by the first kilometre.
        assumes:
          - a ray at a boundary is measured from the normal to that boundary
        takeaway: A fibre's acceptance cone is fixed by its two indices alone, and light launched outside it
          is lost immediately.
        format: DERIVE
        question: How wide can the launch cone be and still keep the light trapped in this fibre?
        answerText: >-
          About 7.2° in air, a numerical aperture of 0.125. The critical angle is 85.1° from the
          normal, which is 4.9° from the axis, and the end face refracts that out to 7.2°.
        why: >-
          The cone is about 7.2 degrees in air. Total internal reflection needs a ray to meet the
          core-cladding boundary beyond the critical angle, measured from the normal. For these
          indices that critical angle is 85.1 degrees. From the axis, that is 4.9 degrees. Snell's
          law at the end face converts that internal angle into an external one. The core is denser,
          so the external cone is wider than the internal one. Numerical aperture is the sine of it,
          0.125. It is also the root of the difference of the squares of the two indices.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: n₁·sin θ₁ = n₂·sin θ₂
          startNote: core n₁ = 1.4682, cladding n₂ = 1.4629, air n = 1.0003
          goal: the largest launch angle from the axis, in degrees, and the numerical aperture
          askRule: true
          rules:
            - Snell's law
            - the critical-angle condition
            - complementary angles
            - substitution of the stated values
            - rearrangement
          steps:
            - ask: Find the angle at the core-cladding boundary beyond which nothing crosses.
              answer: 1
              candidates:
                - text: sin θ_c = n₁/n₂ = 1.0036, so θ_c does not exist
                  rule: the critical-angle condition
                  survives: true
                  why: >-
                    The indices are the wrong way up, and the sine comes out just over one — which
                    reads as a proof that light cannot be trapped at all rather than as an arithmetic
                    slip, because it is so close to one.
                - text: sin θ_c = n₂/n₁ = 0.99639, so θ_c = 85.1°
                  rule: the critical-angle condition
                - text: sin θ_c = n₂ − n₁ = −0.0053, so θ_c = −0.3°
                  rule: rearrangement
                  why: >-
                    A difference of indices where a ratio belongs. A negative angle at a boundary is
                    not a physical statement.
                - text: sin θ_c = n₂/n_air = 1.4625, so θ_c = 89.9°
                  rule: the critical-angle condition
                  why: >-
                    The boundary in question is between the core and the cladding, not between the
                    cladding and the air outside the fibre.
            - ask: Turn that into an angle from the axis of the fibre.
              answer: 3
              candidates:
                - text: 85.1° from the axis, the same angle
                  rule: complementary angles
                  survives: true
                  why: >-
                    A ray at 85 degrees to the axis is very nearly across the fibre and would not go
                    anywhere. The two angles are measured from different references, and this line is
                    the reason the final answer is sometimes reported as 83 degrees.
                - text: 85.1° ÷ 2 = 42.6° from the axis
                  rule: rearrangement
                  why: >-
                    Halving an angle is not a conversion between references. Nothing here is bisected.
                - text: 90° + 85.1° = 175.1° from the axis
                  rule: complementary angles
                  why: >-
                    An angle from the axis cannot exceed ninety degrees, which is the tell. The two
                    references are complementary, so they subtract.
                - text: 90° − 85.1° = 4.9° from the axis
                  rule: complementary angles
            - ask: Refract that internal angle out through the end face into air.
              answer: 0
              candidates:
                - text: 1.0003·sin θ_a = 1.4682·sin 4.9°, so sin θ_a = 0.1247
                  rule: Snell's law
                - text: 1.4682·sin θ_a = 1.0003·sin 4.9°, so sin θ_a = 0.0582
                  rule: Snell's law
                  survives: true
                  why: >-
                    The two sides of Snell's law swapped. It gives 3.3 degrees — a narrower cone,
                    entirely believable, and a termination built to it would throw away most of the
                    light it was capable of accepting.
                - text: sin θ_a = sin 4.9°, so θ_a = 4.9°
                  rule: Snell's law
                  why: >-
                    That is the internal angle reported as the external one. Light bends on the way
                    out because the two indices differ, which is the whole content of the step.
                - text: sin θ_a = 1.4682 × 4.9° = 7.19°
                  rule: rearrangement
                  why: >-
                    An index multiplying an angle rather than a sine. It arrives at nearly the right
                    number for entirely the wrong reason, which is the version worth being able to spot.
            - ask: Report the angle and the numerical aperture.
              answer: 2
              candidates:
                - text: θ_a = 7.2°, NA = sin 7.2° × n_core = 0.183
                  rule: substitution of the stated values
                  survives: true
                  why: >-
                    The core's index applied a second time, having already been used in the refraction.
                    Numerical aperture is the sine of the external angle and nothing further.
                - text: θ_a = 7.2°, NA = √(n₁ − n₂) = 0.073
                  rule: rearrangement
                  why: >-
                    The root of a difference of the indices rather than of their squares. It happens to
                    be the right order of magnitude and it is dimensionally meaningless.
                - text: θ_a = 7.2°, NA = 0.125 = √(n₁² − n₂²)
                  rule: substitution of the stated values
                - text: θ_a = 7.2°, NA = 7.2
                  rule: rearrangement
                  why: >-
                    An aperture is a number with no units and it is the sine of the angle, not the
                    angle in degrees.
          commit: Commit the derivation
      - group: TEST
        task: Separate what the instrument measured from what people are inferring
        title: What the trace actually proves
        reason: >-
          Sarraf wants to use the failure trace as the first clue in the repair plan. Before that happens, you
          need to mark exactly what the trace proves and what it does not.
        concept: 'A measurement in an instrument’s own units, and what converts it'
        takesAsRead:
          - Time of flight, and turning a delay into a distance
          - Power in decibels, and why a loss budget adds
        place: Test Room
        scene: >-
          Sarraf pins up the trace from the night the signal fell. It shows a sudden 4.1 dB step at one round-trip
          delay. The screen also prints a distance, but that distance was calculated by software.
        guide: >-
          The instrument directly measures returned light and time. Distance, seabed position and the identity
          of the failed component all require extra assumptions. Pick the statement that stays true even if those
          later conversions turn out to be wrong.
        assumes:
          - a reflectometer sends a pulse and records what returns against time
        takeaway: An instrument measures in its own units, and every step from there to a decision is a 
          conversion somebody has to make.
        format: CHOICE
        question: Before anyone calls this a break or a repeater failure, what does the trace itself 
          actually prove?
        why: >-
          It establishes that something 4.1 decibels' worth happened at a particular round-trip
          delay. Everything else is conversion. The delay becomes a distance only once a speed is
          assumed. The distance becomes a seabed position only once the cable's slack is allowed
          for. What the step cannot say at all is what the event is. A break, a bend and a failing
          joint all put a step in a trace. Telling them apart needs the reflection beside the loss,
          not the loss alone.
        choices:
          - That something lost 4.1 dB at a particular delay
          - That the cable is broken 84.6 km from this building
          - That a repeater has failed at the far end of the span
          - That the fibre has been damaged rather than bent
        answer: That something lost 4.1 dB at a particular delay
        rebuttals:
          - A delay becomes a distance only once a speed in the glass is assumed, and a position only once 
            slack is.
          - A repeater's failure is one of several things that would put a step there, and the trace does 
            not name it.
          - Damage and a bend give the same loss; what tells them apart is whether light comes back.
      - group: SPLICE
        task: Understand what index-matching gel changes in an old mechanical joint
        title: Could an old joint be the culprit?
        reason: >-
          There are eleven old mechanical joints near shore. If their gel has dried, one of them could lose light
          and send some back, so they belong on the suspect list.
        concept: Refractive index, and the speed of light in a material
        place: Splice Trailer
        person: true
        scene: >-
          Ramnarine, the chief splicer, opens a spare mechanical joint. Two glass ends sit a tiny distance apart. With air in the
          gap they make two glass-air boundaries; with matching gel, the light sees almost no change in refractive
          index.
        guide: >-
          Think about what makes light reflect at a boundary. The hardware holds the fibres in line; the gel has
          a different job. Ask what happens to the refractive-index step when the gap is filled with material
          that matches the glass.
        assumes:
          - light is partly reflected wherever the index changes abruptly
        takeaway: A joint is judged by what it does to the light rather than by how it holds two pieces of 
          glass.
        format: CHOICE
        question: What does the index-matching gel do to the light at a mechanical joint?
        why: >-
          It removes the index step. Two glass ends held a hair apart have air between them. Each
          glass-air boundary reflects a few per cent of the light straight back. A gel of the same
          index as the glass leaves nothing for the light to notice. A dried joint is therefore both
          lossy and reflective, and the reflection is what shows on a trace. That is the signature
          this fortnight turns on. A break reflects, a bend does not, and a dried joint does both a
          little.
        choices:
          - It removes the step in index, so nothing is reflected at the gap
          - It holds the two ends in line with each other
          - It keeps water out of the joint
          - It stops the two ends from touching and chipping
        answer: It removes the step in index, so nothing is reflected at the gap
        rebuttals:
          - Alignment is done by the ferrule the ends sit in, not by the fluid between them.
          - Water is kept out by the closure round the whole joint, which is a separate fitting.
          - The ends are meant to be a few microns apart, and the gel does not decide that.
  # ---------------------------------------------------------------- day 2
  - title: Turn the echo into a distance
    objective: Convert the pulse's round-trip time into a distance along the fibre, without confusing that 
      number with a seabed position.
    briefing: The screen prints 84.6 km. Before the captain ever sees that number, you need to know exactly 
      how the instrument got it.
    stake: >-
      T−11 days. The fault trace marks a round-trip delay of 828.6 microseconds. Sarraf can turn that into kilometres
      with software, but the repair order cannot rest on a black-box conversion. Derive the speed in glass and
      the out-and-back distance yourself.
    takeaway: A time delay becomes a distance only after you choose the speed of the pulse and account for 
      the return trip.
    segue: >-
      You now have 84.6 km—but only along the glass. The cable is not a ruler stretched straight across the seabed,
      and a pulse does not travel at quite the number the old software assumed. Keep 84.6 km provisional. You
      will correct it before the ship leaves.
    stops:
      - group: TEST
        task: Derive the distance from the trace's round-trip delay
        title: Turn 828.6 microseconds into kilometres
        at: otdr
        reason: >-
          The screen prints 84.6 km, but the repair order cannot depend on a number nobody here can reconstruct
          from the physics.
        concept: Time of flight, and turning a delay into a distance
        place: Test Room
        scene: >-
          The fault step returns after 828.6 microseconds. For the first pass, the old software used the core
          index 1.4682. Sarraf wants the distance rebuilt from the raw delay.
        guide: >-
          First find the speed represented by that refractive index. Then remember the pulse travelled to the
          event and back. Keep the microsecond conversion visible. The result is a distance along the fibre, not
          yet a coordinate on the seabed.
        background:
          - >-
            Why the factor of two. A reflectometer measures the light that comes back to it, so
            every delay it reports is a return journey. Leaving the two out doubles every distance.
            So the first thing to check on any trace is whether the far end of the fibre appears at
            its own length or at twice it.
          - >-
            Why the index divides. Light covers less ground per second in glass than in vacuum, so
            the same delay corresponds to a shorter distance. Multiplying by the index instead gives
            182 kilometres, which is longer than the span and would put the fault past the first
            repeater.
          - >-
            What this distance is and is not. It is a distance along the fibre. The fibre is longer
            than the cable's route, because it is wound helically inside the cable. The cable is
            longer than the seabed distance, because it was laid with slack. Both corrections come
            later in the fortnight, and both make the number smaller.
        assumes:
          - a reflectometer reports the delay of a pulse that has been out and back
        takeaway: A time of flight gives a distance along the fibre, and only after the speed in the glass 
          and the return journey are both applied.
        format: DERIVE
        question: Using the raw round-trip delay, how far along the fibre does the event appear to be?
        answerText: >-
          About 84.6 km. The speed in the glass is c/n = 2.042 × 10⁸ m/s, and the distance is half the
          delay times that speed.
        why: >-
          The event is about 84.6 kilometres along the fibre. Light travels at the vacuum speed
          divided by the index. For this glass that is 2.042 × 10⁸ metres a second. The pulse made
          the journey twice, so the distance is half the product of speed and delay. Both factors
          matter and both are easy to invert. Multiplying by the index rather than dividing gives
          182 kilometres. Forgetting the return journey gives 169. This is a distance along the
          fibre, and not yet a position on the seabed.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: v = c/n,  d = v·t/2
          startNote: c = 2.998 × 10⁸ m/s, n = 1.4682, round-trip delay t = 828.6 µs
          goal: the distance along the fibre to the event, in kilometres
          askRule: true
          rules:
            - the speed of light in a material
            - the return journey
            - substitution of the stated values
            - rearrangement
            - a check on the units
          steps:
            - ask: Get the speed of light in the glass.
              answer: 2
              candidates:
                - text: v = c·n = 4.401 × 10⁸ m/s
                  rule: the speed of light in a material
                  survives: true
                  why: >-
                    Faster than light in vacuum, which is the tell — and it is a tell nobody looks for,
                    because the number is written in exponent form and the exponent is unchanged.
                - text: v = c − n = 2.998 × 10⁸ m/s
                  rule: rearrangement
                  why: >-
                    A speed minus a pure number. The index has no units, so it can only multiply or
                    divide.
                - text: v = c/n = 2.042 × 10⁸ m/s
                  rule: the speed of light in a material
                - text: v = n/c = 4.9 × 10⁻⁹ s/m
                  rule: rearrangement
                  why: >-
                    Inverted, and the units say so: seconds per metre is a delay per unit length, which
                    is a useful quantity and is not a speed.
            - ask: Deal with the return journey.
              answer: 0
              candidates:
                - text: d = v·t/2
                  rule: the return journey
                - text: d = v·t
                  rule: the return journey
                  survives: true
                  why: >-
                    The out-and-back not accounted for. It gives 169 kilometres, which is a believable
                    length for a span and is twice the answer.
                - text: d = 2·v·t
                  rule: the return journey
                  why: >-
                    The factor applied the wrong way. Four times the truth, and it would put the fault
                    beyond the end of the cable.
                - text: d = v/(2t)
                  rule: rearrangement
                  why: >-
                    The delay dividing rather than multiplying. The units come out as metres per second
                    squared.
            - ask: Put the numbers in.
              answer: 3
              candidates:
                - text: d = 2.042 × 10⁸ × 828.6 ÷ 2 = 8.46 × 10¹⁰ m
                  rule: substitution of the stated values
                  why: >-
                    The delay left in microseconds. The digits are right and the answer is in the
                    hundreds of millions of kilometres.
                - text: d = 2.998 × 10⁸ × 828.6 × 10⁻⁶ ÷ 2 = 124.2 km
                  rule: substitution of the stated values
                  survives: true
                  why: >-
                    The vacuum speed used in the glass. It is 47 per cent long and it is inside the
                    length of the span, so nothing about it looks impossible.
                - text: d = 2.042 × 10⁸ × 828.6 × 10⁻⁶ = 169.2 km
                  rule: substitution of the stated values
                  why: >-
                    The return journey dropped at the last line, having been written correctly at the
                    line before.
                - text: d = 2.042 × 10⁸ × 828.6 × 10⁻⁶ ÷ 2 = 84.6 km
                  rule: substitution of the stated values
            - ask: Check the units of the result.
              answer: 1
              candidates:
                - text: metres a second times seconds gives metres a second squared
                  rule: a check on the units
                  why: >-
                    Multiplying by a time removes a second rather than adding one. This is the check
                    itself done wrongly, which is worse than not doing it.
                - text: metres a second times seconds gives metres
                  rule: a check on the units
                - text: the index carries units, so the result is in fibre-metres
                  rule: a check on the units
                  survives: true
                  why: >-
                    An index is a ratio of two speeds and has no units at all. Inventing a unit for the
                    answer is how a distance along a fibre stops being compared with a distance on the
                    seabed.
                - text: dividing by two makes it dimensionless
                  rule: rearrangement
                  why: >-
                    A pure number divides out of nothing. The two is a count of journeys, not a
                    conversion.
          commit: Commit the derivation
      - group: TERM
        task: Connect refractive index to the speed used in the first distance estimate
        title: How fast is light in this glass?
        at: index-book
        reason: >-
          Three nearby index values are on the bench. Choosing the wrong one can move a long-distance fault by
          hundreds of metres.
        concept: Refractive index, and the speed of light in a material
        place: Cable Termination Room
        scene: >-
          Nilsen writes three numbers beside the trace: the core index 1.4682, cladding index 1.4629, and manufacturer
          group index 1.4718. The old trace conversion used the core index; the group index will matter later
          because the instrument sends a pulse.
        guide: >-
          For this question, find the speed associated with the core index: vacuum speed divided by refractive
          index. Keep the cladding index for boundaries and the group index for the later pulse-position correction.
          The point is not the division; it is knowing which physical quantity each index describes.
        assumes:
          - the index of a material is the factor by which light is slowed in it
        takeaway: A refractive index is a ratio of speeds, so dividing the vacuum speed by it is the whole 
          of the arithmetic.
        format: BALLPARK
        question: What speed does the core index 1.4682 correspond to?
        estimate:
          prompt: >-
            The distance on the chart rests on this number. It is the speed the pulse actually made,
            in the glass it actually travelled in.
          question: How fast does light travel in the core of this fibre?
          relationship: >-
            Speed in the material = the speed of light in empty space divided by the index of that
            material.
          labels:
            - 2.998e8 m/s  (light in empty space)
            - 1.4682  (index of the core)
            - 1.4629  (index of the cladding)
            - 1.4718  (the group index)
          values: [299800000, 1.4682, 1.4629, 1.4718]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 204196975
          tolerance: 900000
          units: m/s
          solution: 2.998 × 10⁸ ÷ 1.4682 = 2.042 × 10⁸ m/s.
          explanation: >-
            The cladding's index belongs to the boundary rather than to the path, and the group index
            belongs to a pulse rather than to a single wavelength. Both are on the bench because both
            will be needed, and neither is this.
        why: >-
          Light makes about 2.042 × 10⁸ metres a second in this core. That is 68 per cent of its
          speed in vacuum. An index is defined as exactly that ratio, so the arithmetic is a single
          division. The difficulty is never the division. It is which of three indices belongs in
          it. The core's is the one the light is travelling in. The distinction between it and the
          group index is worth a kilometre on the ship's chart. It arrives on day ten.
      - group: RECV
        task: Connect the weak received power to the two descriptions of light you will need later
        title: What reaches the receiver?
        reason: >-
          Duarte warns that the receiver does not merely see a smooth beam. It measures a wave with a wavelength
          and also a count of individual arrivals, and both facts will matter when you test whether the receiver
          is trustworthy.
        concept: 'Light as a wave: wavelength, frequency and the relation between them'
        place: Receiver Lab
        person: true
        scene: >-
          At the far end, Duarte, the receiver engineer, has a wavelength specification, a received optical power and a bit rate. Those
          numbers describe the same light in two different ways.
        guide: >-
          A wave description tells you about wavelength, interference, scattering and dispersion. A photon-count
          description tells you how many discrete arrivals the detector has to work with. Choose the answer that
          keeps both descriptions rather than throwing one away.
        assumes:
          - light can be described as a wave and as a stream of arrivals
        takeaway: A wave has a wavelength and a frequency; a stream of arrivals has a count, and both 
          descriptions are needed at a receiver.
        format: CHOICE
        question: What two descriptions of the same light does the receiver need at once?
        why: >-
          It is working with a wave of a definite wavelength, arriving as a countable number of
          pieces. Both halves are needed. The wavelength decides how much energy each arrival
          carries, and how the fibre treated it on the way. The count decides how steady the arrival
          rate is. At a few hundred arrivals a bit, the count is what limits the error rate. No
          amount of better electronics changes it. That is a statement about light rather than about
          the receiver.
        choices:
          - A wave of one wavelength, arriving as a countable number of pieces
          - A steady flow of energy, which the electronics then samples
          - A voltage, which the fibre delivers directly to the diode
          - A mixture of wavelengths, which the receiver has to separate
        answer: A wave of one wavelength, arriving as a countable number of pieces
        rebuttals:
          - A steady flow would have no scatter of its own, and the measured error floor says it does.
          - The fibre carries light; a voltage exists only after the diode has turned it into current.
          - The signal is one channel of one wavelength here, and separating channels happens before this 
            fibre.
  # ---------------------------------------------------------------- day 3
  - title: Is the cable actually broken?
    objective: Predict the reflection from a clean break, then compare that prediction with the fault trace.
    briefing: If the cable has snapped, the broken glass should act like a small mirror. That gives you a 
      test before anyone cuts open the ocean floor.
    stake: >-
      T−10 days. A clean break and a bend can both lose light, but only the break makes a strong reflection. Calculate
      what a broken fibre should send back, then use the trace to decide whether “the cable snapped” survives
      as a diagnosis.
    takeaway: The amount of light that comes back can distinguish a break from a loss that simply lets light
      escape.
    segue: >-
      The reflection is far too small for a clean break. The cable has not simply snapped. The remaining suspects
      are a bend or crush, an old joint, or a repeater problem—and the repeater's electrical telemetry cannot
      clear it because nobody measured its optical output.
    stops:
      - group: SPLICE
        task: Predict the reflection from broken glass before comparing it with the real trace
        title: What would a clean break look like?
        at: splicer
        reason: >-
          If the fibre snapped cleanly, the exposed glass-air boundary should send a predictable fraction of the
          light straight back. That is a testable signature of a break.
        concept: 'Thin films, index matching and the reflection at a step'
        takesAsRead:
          - Interference of two beams, and the path difference that decides it
          - Snell's law at a boundary
        place: Splice Trailer
        scene: >-
          Ramnarine puts a clean cleaved fibre end beside one filled with index-matching gel. One has a large
          jump from glass to air; the other has almost none. She wants the reflected power in a form that can
          be compared directly with the trace.
        guide: >-
          Calculate the reflected amplitude from the two refractive indices, square it to get reflected power,
          then convert the power ratio to decibels. The important comparison is not just “some reflection” but
          how much a true glass-air break should return.
        background:
          - >-
            Why the step is squared. The reflected amplitude goes as the difference over the sum of
            the two indices. Power goes as the square of amplitude. So a step of one part in eight
            reflects about one part in seventy of the power. Forgetting the square gives 19 per cent
            rather than 3.6.
          - >-
            Why the gel matters so much. Its index is within 0.01 of the glass, so the step is a
            hundredth of the glass-air step. The reflection is then ten thousand times smaller: −51
            decibels instead of −14. That is the difference between a joint that shows on a trace
            and a joint that does not.
          - >-
            What this settles about the fault. A break with a clean face returns about 3.6 per cent.
            A bend returns nothing at all, because there is no step anywhere — the light simply
            leaves the core. The trace shows a step with a spike about a fortieth of the size of a
            clean break's. That is neither, and it is the finding of the fortnight.
        assumes:
          - power is proportional to the square of a wave's amplitude
        takeaway: Reflection at a boundary depends on the size of the index step, so the same loss can come 
          back as a mirror or as nothing.
        format: DERIVE
        question: If this cable had snapped cleanly, how much light should the broken end send straight 
          back?
        answerText: >-
          About 3.6 per cent, which is −14.4 dB. In gel the step is a hundred times smaller and the
          reflection ten thousand times smaller, at −51 dB.
        why: >-
          A dry end returns about 3.6 per cent of the light, or −14.4 decibels. The reflected
          amplitude is the difference of the two indices over their sum, and power is amplitude
          squared. So a step from 1.468 to 1.000 returns (0.468/2.468)² of the power. In gel the
          same expression gives 7.8 × 10⁻⁶. The step is a hundredth the size, and the square makes
          that ten thousand. The point is not the numbers. It is that the two cases differ by 37
          decibels, which any trace can tell apart.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: R = ((n₁ − n₂)/(n₁ + n₂))²
          startNote: glass n₁ = 1.4682; air n₂ = 1.0003; gel n₂ = 1.4600
          goal: the reflected fraction at a dry end, and the same in decibels
          askRule: true
          rules:
            - the reflection at a step
            - power as the square of amplitude
            - conversion to decibels
            - substitution of the stated values
            - rearrangement
          steps:
            - ask: Write the amplitude ratio at the glass-air step.
              answer: 1
              candidates:
                - text: (n₁ − n₂)/n₁ = 0.3185
                  rule: the reflection at a step
                  survives: true
                  why: >-
                    A plausible-looking fraction with the wrong denominator. It gives 10 per cent of
                    the power rather than 3.6, and it has the correct behaviour at both extremes, so no
                    limiting case catches it.
                - text: (n₁ − n₂)/(n₁ + n₂) = 0.1896
                  rule: the reflection at a step
                - text: (n₁ + n₂)/(n₁ − n₂) = 5.275
                  rule: rearrangement
                  why: >-
                    Inverted. An amplitude ratio greater than one would mean more light coming back
                    than went in.
                - text: n₁ − n₂ = 0.4679
                  rule: the reflection at a step
                  why: >-
                    A difference of indices is not a ratio. It happens to be a number less than one
                    here, which is why it survives a glance.
            - ask: Turn that into a fraction of the power.
              answer: 2
              candidates:
                - text: R = 0.1896, since power and amplitude are the same thing
                  rule: power as the square of amplitude
                  why: >-
                    They are not. Nineteen per cent of the light coming back off a cleaved end would be
                    visible to the eye and would have been noticed eleven years ago.
                - text: R = 2 × 0.1896 = 0.379
                  rule: rearrangement
                  why: >-
                    Doubling instead of squaring. It is the one operation that gives a larger answer
                    where a smaller one is wanted.
                - text: R = 0.1896² = 0.0359
                  rule: power as the square of amplitude
                - text: R = √0.1896 = 0.435
                  rule: power as the square of amplitude
                  survives: true
                  why: >-
                    The square root rather than the square, which is the same relation applied
                    backwards. It gives 44 per cent and it would make every cleaved end in the trailer
                    a mirror.
            - ask: Put it into decibels.
              answer: 0
              candidates:
                - text: 10·log₁₀(0.0359) = −14.4 dB
                  rule: conversion to decibels
                - text: 20·log₁₀(0.0359) = −28.9 dB
                  rule: conversion to decibels
                  survives: true
                  why: >-
                    The factor of twenty belongs to amplitude ratios and this is already a power ratio.
                    Squaring has been done twice, once in the arithmetic and once in the conversion.
                - text: 10·log₁₀(1/0.0359) = +14.4 dB
                  rule: rearrangement
                  why: >-
                    A reflection is a loss relative to what went in, so it is negative. The size is
                    right and the sign makes it a gain.
                - text: 0.0359 × 10 = 0.359 dB
                  rule: conversion to decibels
                  why: >-
                    A decibel is a logarithm. Multiplying a ratio by ten is not a conversion into one.
            - ask: Do the same for an end in gel and compare.
              answer: 3
              candidates:
                - text: R = 7.8 × 10⁻⁶, which is −41 dB, a difference of 27 dB
                  rule: substitution of the stated values
                  survives: true
                  why: >-
                    The right fraction and its decibel value out by ten. Ten decibels is a factor of
                    ten, and the difference between the two cases is what the whole comparison is for.
                - text: R = 7.8 × 10⁻⁴, which is −31 dB
                  rule: substitution of the stated values
                  why: >-
                    The step is 0.0082 rather than 0.082 — a factor of ten in the index difference and
                    a hundred in the power.
                - text: R = 0.0359 in gel as well, since the glass is the same
                  rule: the reflection at a step
                  why: >-
                    The reflection is a property of the boundary rather than of the glass. Changing what
                    is on the other side is the whole intervention.
                - text: R = 7.8 × 10⁻⁶, which is −51 dB, a difference of 37 dB
                  rule: substitution of the stated values
          commit: Commit the derivation
      - group: TEST
        task: Measure the normal wavelength dependence of this fibre before using colour as a fault test
        title: Find the fibre's best wavelength
        at: sweep-drum
        reason: >-
          Later you will compare the fault at two wavelengths. First you need to know how an undamaged kilometre
          of this fibre normally behaves as wavelength changes.
        concept: 'Scattering, absorption and what makes a material lossy'
        place: Test Room
        scene: >-
          Meier, the test room technician, puts one kilometre of spare cable on the test drum and lets you tune the source from 1200 to 1650
          nm. The loss is not flat, and one narrow absorption feature sits on top of the broader trend.
        guide: >-
          Sample enough wavelengths to see the shape rather than guessing from one point. Rayleigh scattering
          falls toward longer wavelengths, while absorption eventually rises. Find the low-loss window and notice
          the water-related bump that is a different mechanism.
        assumes:
          - scattering falls steeply as the wavelength gets longer
        takeaway: A fibre has a window where scattering has fallen away and absorption has not yet begun.
        format: SWEEP
        question: >-
          At what wavelength does this fibre lose the least light per kilometre?
        sweep:
          axis: {label: Wavelength, unit: nm, min: 1200, max: 1650, step: 5}
          readout: {label: Loss, unit: dB/km}
          baseline: 1.05
          response:
            - {at: 1200, value: 1.05}
            - {at: 1250, value: 0.78}
            - {at: 1300, value: 0.44}
            - {at: 1330, value: 0.52}
            - {at: 1360, value: 1.10}
            - {at: 1385, value: 1.95}
            - {at: 1410, value: 0.98}
            - {at: 1450, value: 0.42}
            - {at: 1500, value: 0.27}
            - {at: 1530, value: 0.21}
            - {at: 1555, value: 0.185}
            - {at: 1580, value: 0.21}
            - {at: 1610, value: 0.26}
            - {at: 1650, value: 0.34}
          target: 1555
          tolerance: 20
          start: 1200
          commit: Mark the lowest-loss setting
        answerText: >-
          About 1555 nm, at 0.19 dB/km. The rise at 1385 is absorption by water in the glass rather
          than scattering, which is why the curve is not smooth.
        why: >-
          The loss is lowest near 1555 nanometres, at about 0.19 decibels a kilometre. Two things
          are happening at once. Scattering by the tiny irregularities of the glass falls steeply as
          the wavelength grows, as the fourth power of it. That is the whole downward slope.
          Absorption by the glass itself rises at the long end. Between them is a window. The narrow
          spike in the middle is water trapped in the glass, absorbing at its own wavelength. That
          is a property of the molecule, not of the fibre's quality.
      - group: AMP
        task: Decide what four years of normal electrical readings can and cannot prove about repeater 6
        title: Can the pump telemetry clear the repeater?
        reason: >-
          Repeater 6 is now on the suspect list. Its current, voltage and temperature all look normal—but none
          of those measurements is the optical power that actually excites the amplifier.
        concept: 'Stimulated emission, population inversion and gain'
        place: Amplifier and Power Hall
        person: true
        scene: >-
          Tanaka, the amplifier specialist, opens four years of repeater 6 telemetry. Every electrical reading is inside limits. There is
          no optical pump-power channel anywhere in the log.
        guide: >-
          Separate “the pump diode is being driven” from “the pump diode is still producing the same light.” Laser
          output can age while drive current stays normal. Choose only what the telemetry directly establishes.
        takesAsRead:
          - Atomic energy levels, and the wavelengths they allow
        assumes:
          - an amplifier works by holding more atoms excited than not
        takeaway: A pump current says power is going in; the gain depends on how many atoms that power is 
          actually exciting.
        format: CHOICE
        question: What do the normal pump current, voltage and temperature actually prove?
        why: >-
          It establishes that the pump laser is being driven. Gain depends on the population
          inversion — on more erbium atoms being in the upper state than the lower. And the
          inversion depends on the pump's optical output, not on its drive current. A laser diode's
          output falls with age at a constant current. That is exactly the failure that leaves
          telemetry looking perfect. Nothing on that screen reaches the number that matters. That is
          why the last fortnight has been spent inferring it from the far end of a fibre.
        choices:
          - That the pump laser is being driven, and nothing about its output
          - That the amplifier is producing its designed gain
          - That the population inversion has been maintained
          - That the repeater's fibre coil is undamaged
        answer: That the pump laser is being driven, and nothing about its output
        rebuttals:
          - Gain is set by the optical output, and a diode's output at fixed current falls as it ages.
          - An inversion is a count of excited atoms, and no electrical reading of the pump reports it.
          - A damaged coil would change the loss and not the current the pump draws.
  # ---------------------------------------------------------------- day 4
  - title: How close is the link to failing?
    objective: Build the full loss budget and decide how much usable signal the damaged route has left.
    briefing: The island is living on one backup line. You need to know whether the damaged main cable still
      has enough margin to help if the backup starts to fail.
    stake: >-
      T−9 days. The new loss is 4.1 dB, but that number means little by itself. Add the fibre, joints and new
      event in decibels and compare the result with the receiver's limit. At the same time, start preparing a
      replacement repeater in case that becomes the diagnosis.
    takeaway: A loss budget tells you how close the link is to its limit, because logarithmic losses add 
      along the path.
    segue: >-
      The damaged route has only 2.2 dB of margin. That is not a comfortable emergency fallback for the island.
      The loss is serious, but you still do not know its cause. Next, make sure the weak signal at the receiver
      is being interpreted correctly.
    stops:
      - group: TEST
        task: Build the link budget and compare it with the receiver limit
        title: How much margin is left?
        at: otdr
        reason: >-
          If the backup line fails, this damaged route may be the island's only remaining path. You need to know
          whether it still has useful margin or is already too close to the receiver limit.
        concept: Power in decibels, and why a loss budget adds
        place: Test Room
        scene: >-
          Sarraf writes the whole path on the board: 84.6 km at 0.19 dB/km, eleven joints at 0.15 dB each, the
          new 4.1 dB event, and a receiver allowance of 24 dB.
        guide: >-
          All the losses are already in decibels, so add them. Only after the total is known should you convert
          back to a power ratio. Then subtract from the 24 dB allowance to see how much extra loss the route could
          tolerate.
        background:
          - >-
            Why a logarithm makes a sum. Each stage multiplies the power by a fraction, and the
            logarithm of a product is the sum of the logarithms. So a chain of fifteen losses becomes
            an addition of fifteen numbers, which is the whole reason the unit exists.
          - >-
            What 21.8 decibels is as a ratio. It is a factor of 151: for every hundred and fifty-one
            photons launched, one arrives. The receiver's allowance of 24 decibels is a factor of
            251. What is left is a margin of 2.2 decibels. That is a factor of 1.66, and it is not
            much.
          - >-
            Why this settles today's argument. With 2.2 decibels of margin the span is working, and
            it is one small event away from not working. That is an argument for sending the ship on
            the best number available, rather than for spending a week refining it. That is Sarraf's
            position, and on today's numbers she is right.
        assumes:
          - a loss in decibels is ten times the logarithm of the power ratio
        takeaway: A loss budget is an addition because decibels are logarithms, and the margin left is what 
          a span has in hand.
        format: DERIVE
        question: What is the total loss now, and how much margin remains before the receiver reaches its 
          limit?
        answerText: >-
          21.8 dB, leaving 2.2 dB of the 24 dB allowance. That total is a factor of 151 in power.
        why: >-
          The span loses 21.8 decibels and has 2.2 dB left before the receiver limit. The fibre contributes 16.1
          dB, the eleven joints 1.65 dB and the new event 4.1 dB. Because decibels are logarithms, those losses
          add. Converting 21.8 dB back to a power ratio gives about 151: only one part in 151 of the launched
          power reaches the far end. The 24 dB allowance is a factor of about 251, so the remaining 2.2 dB margin
          is only a factor of 1.66 in power. That is not much room for another failure.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: loss(dB) = 10·log₁₀(P_in/P_out)
          startNote: 84.6 km at 0.19 dB/km, 11 joints at 0.15 dB, one event at 4.1 dB, allowance 24 dB
          goal: the total loss in decibels, and the margin against the allowance
          askRule: true
          rules:
            - loss per unit length
            - decibels add along a path
            - conversion to a power ratio
            - substitution of the stated values
            - rearrangement
          steps:
            - ask: Get the loss of the fibre itself.
              answer: 2
              candidates:
                - text: 0.19 ÷ 84.6 = 0.0022 dB
                  rule: rearrangement
                  why: >-
                    Divided rather than multiplied. A longer fibre would then lose less, which is
                    backwards.
                - text: 0.19^84.6, since losses multiply
                  rule: decibels add along a path
                  survives: true
                  why: >-
                    Losses do multiply — as power ratios. In decibels they add, and raising a decibel
                    figure to a power is mixing the two currencies in one line.
                - text: 0.19 × 84.6 = 16.1 dB
                  rule: loss per unit length
                - text: 0.19 × 84,600 = 16,074 dB
                  rule: substitution of the stated values
                  why: >-
                    The rate is per kilometre and the length has been put in metres. Sixteen thousand
                    decibels is more loss than there is light in the universe.
            - ask: Add the joints and the event.
              answer: 0
              candidates:
                - text: 16.1 + 11 × 0.15 + 4.1 = 21.8 dB
                  rule: decibels add along a path
                - text: 16.1 + 0.15 + 4.1 = 20.4 dB
                  rule: decibels add along a path
                  survives: true
                  why: >-
                    One joint counted instead of eleven. It is 1.4 decibels light, which is inside what
                    anybody would call agreement and is most of the margin.
                - text: 16.1 × 11 × 0.15 × 4.1 = 109 dB
                  rule: rearrangement
                  why: >-
                    Multiplied. That is what would be done with the ratios themselves, and it is the
                    reason the unit is a logarithm.
                - text: 16.1 + 11 × 0.15 = 17.8 dB
                  rule: decibels add along a path
                  why: >-
                    The new event left out of the total, which is the one term the fortnight is about.
            - ask: Turn the total into a power ratio.
              answer: 1
              candidates:
                - text: 10^(21.8) = 6 × 10²¹
                  rule: conversion to a power ratio
                  why: >-
                    The divisor of ten is missing from the exponent. Decibels are ten times a
                    logarithm, so the conversion back divides by ten first.
                - text: 10^(21.8/10) = 151
                  rule: conversion to a power ratio
                - text: 21.8 × 10 = 218
                  rule: conversion to a power ratio
                  survives: true
                  why: >-
                    Multiplying by ten instead of taking a power of ten. It gives 218 against 151, which
                    is the right order and would make the margin look like a factor rather than a
                    difference.
                - text: 2^21.8 = 3.6 × 10⁶
                  rule: rearrangement
                  why: >-
                    A decibel is built on tens, not twos. The three-decibel doubling rule is a
                    consequence of that and not a definition.
            - ask: Take the margin against the allowance.
              answer: 3
              candidates:
                - text: 24 ÷ 21.8 = 1.10, so there is ten per cent in hand
                  rule: rearrangement
                  why: >-
                    Decibels are subtracted, not divided. Dividing two logarithms gives a number that
                    means nothing.
                - text: 24 − 21.8 = 2.2 dB, which is a factor of 251
                  rule: substitution of the stated values
                  survives: true
                  why: >-
                    The subtraction is right and the ratio quoted is the allowance's rather than the
                    margin's. 251 is what 24 decibels is; 2.2 decibels is a factor of 1.66.
                - text: 24 + 21.8 = 45.8 dB of margin
                  rule: decibels add along a path
                  why: >-
                    An allowance is what may be spent, so the spend is taken off it. Adding gives more
                    margin the worse the span gets.
                - text: 24 − 21.8 = 2.2 dB, which is a factor of 1.66
                  rule: substitution of the stated values
          commit: Commit the derivation
      - group: AMP
        task: Connect loss per kilometre to exponential attenuation
        title: Why every kilometre removes the same fraction
        at: feed-board
        reason: >-
          The cable is tens of kilometres long. To understand why repeaters are needed at all, you have to know
          whether each kilometre removes a fixed amount of power or a fixed fraction.
        concept: Exponential attenuation along a path
        place: Amplifier and Power Hall
        scene: >-
          Salas, the power feed engineer, points to the 0.19 dB/km specification and asks one question. Does kilometre 80 remove the
          same number of watts as kilometre 1? Or the same fraction of whatever light reaches it?
        guide: >-
          A constant loss in decibels per kilometre means the same power ratio for every equal length. That makes
          the remaining power exponential with distance. Choose the statement that is consistent with equal fractional
          loss.
        takesAsRead:
          - Power in decibels, and why a loss budget adds
        assumes:
          - a fixed loss per unit length is a fixed fraction per unit length
        takeaway: A rate quoted per unit length is a fraction rather than an amount, and the two behave 
          nothing alike over a long path.
        format: CHOICE
        question: What does 0.19 dB/km mean for the eightieth kilometre compared with the first?
        why: >-
          It asserts that the eightieth kilometre takes the same fraction as the first, which is
          about 4.3 per cent, and therefore far less power. That is what a constant figure in
          decibels means: equal lengths remove equal fractions, so the power falls exponentially. It
          never reaches zero. So the limit on a span is the receiver's sensitivity, not the fibre
          running out of light. And an amplifier half way along is worth exactly the loss it makes
          up.
        choices:
          - It removes the same fraction as the first kilometre, and so less power
          - It removes the same amount of power as the first kilometre
          - It removes more than the first, since the pulse has spread
          - It removes nothing, since the loss is quoted as an average
        answer: It removes the same fraction as the first kilometre, and so less power
        rebuttals:
          - A constant amount would take the light to exactly zero at a stated distance, and no span behaves
            that way.
          - Spreading is dispersion and changes the shape of the pulse rather than the power in it.
          - An average over the span would still have to be spent somewhere, and it is spent evenly.
      - group: RAD
        task: Decide what information has to be recorded before two radiographs can be compared
        title: Can we trust the old X-rays?
        at: bay-bench
        reason: >-
          If repeater 6 becomes the target, the replacement housing must pass an X-ray inspection before it goes
          to sea. Farouk has old films, but only some were recorded well enough to serve as a comparison.
        concept: 'A record that carries the conditions it was taken under'
        place: Radiography Bay
        person: true
        scene: >-
          Farouk, the radiographer, lays out three radiographs of the same kind of weld. The images look similar, but only one film
          records the source age, source-to-film distance, exposure time and steel thickness.
        guide: >-
          Those four notes control three pieces of physics: radioactive activity, inverse-square spreading and
          attenuation through steel, plus the exposure time you choose. Match each note to the part of the measurement
          it makes reproducible.
        takesAsRead:
          - Power in decibels, and why a loss budget adds
        assumes:
          - two records can only be compared if the conditions they were taken under are known
        takeaway: A record without its conditions is a picture; with them it is a measurement that can be 
          compared with another.
        format: PROTOCOL
        scenarios:
          - The date the source was last replaced.
          - The distance from the source to the film.
          - The exposure time, in minutes.
          - The thickness of steel the beam passed through.
        choices:
          - It says how strong the source was on the day, without measuring it.
          - It fixes how much the beam had spread before it arrived.
          - It is what has to grow as the source ages, and the only thing the radiographer controls.
          - It says how much of the beam was absorbed before the film saw any of it.
        mapping: [0, 1, 2, 3]
        why: >-
          Four numbers, four different jobs. The source's age gives its strength without a
          measurement, because activity falls on a known schedule. The distance fixes the spreading,
          which goes as the inverse square. The exposure time is the one thing under the
          radiographer's control and it has to grow as the source decays. And the steel thickness
          decides how much arrives at all, exponentially. Take any one of them away and two films of
          the same weld cannot be compared.
  # ---------------------------------------------------------------- day 5
  - title: Can you trust the weak signal?
    objective: Translate the received power into photons and decide whether the receiver itself could be 
      creating the apparent problem.
    briefing: A weak optical signal is not just a small number of watts. It is a count of individual 
      photons, and that count has noise of its own.
    stake: >-
      T−8 days. If the receiver is working near its fundamental photon-counting limit, part of the crisis could
      be at this end rather than under the sea. Work out the energy of one photon, the photons in each bit, and
      why the pulse spreads as it crosses the long fibre.
    takeaway: Power becomes a photon rate once the energy of one photon is known, and counting those photons
      sets a real noise floor.
    segue: >-
      At the receiver limit there are about 6,200 photons in each bit: few enough that counting statistics matter,
      but nowhere near enough to explain away a sudden 4.1 dB step. One calibration still matters—the fraction
      of arriving photons the diode actually converts to charge.
    stops:
      - group: AMP
        task: Turn the 1550 nm wavelength into energy per photon and then photons per second
        title: How much energy is in one photon?
        at: amp-desk
        reason: >-
          To decide whether the receiver is near a fundamental counting limit, watts must be turned into actual
          photon arrivals.
        concept: 'Photons: energy, momentum and the quantum of light'
        place: Amplifier and Power Hall
        scene: >-
          Duarte writes 1550 nm on the board. That wavelength fixes the energy of every signal photon, no matter
          how bright or dim the beam is.
        guide: >-
          Use E = hf = hc/λ. Convert the wavelength to metres, find the energy of one photon, then divide one
          milliwatt by that energy to turn power into photons per second.
        background:
          - >-
            Why the wavelength divides. Frequency and wavelength are inversely related through the
            speed of light, so a longer wavelength is a lower frequency and a smaller energy. A
            photon at 980 nanometres carries 1.27 electron volts, against 0.80 at 1550. That is the
            whole reason an amplifier can be pumped at the shorter wavelength and give out at the
            longer.
          - >-
            Why the electron volt is the natural unit. A joule is a household quantity and a photon
            is not. A photon's 1.28 × 10⁻¹⁹ joules is hard to hold in the head. Its 0.80 electron
            volts can be compared straight away with the band gaps of the materials a detector is
            made of.
          - >-
            What the arrival rate is for. A milliwatt is 7.8 × 10¹⁵ photons a second, which sounds
            like an inexhaustible supply. Divide it by ten billion bits a second, and reduce it by a
            factor of 151 along the span. Then it is a few thousand a bit, and a few thousand of
            anything counted has a scatter.
        assumes:
          - light of one wavelength arrives only in whole quanta of a fixed energy
        takeaway: A photon's energy is fixed by its wavelength alone, so a power in watts is a rate of 
          arrivals in photons a second.
        format: DERIVE
        question: At 1550 nm, how much energy does one photon carry, and how many photons per second make 1 
          mW?
        answerText: >-
          1.28 × 10⁻¹⁹ J, which is 0.80 eV. A milliwatt is 7.8 × 10¹⁵ of them a second.
        why: >-
          A photon at 1550 nanometres carries 1.28 × 10⁻¹⁹ joules, or 0.80 electron volts. A
          milliwatt is 7.8 × 10¹⁵ of them a second. The energy comes from Planck's constant times
          the frequency, and the frequency from the speed of light over the wavelength. So the two
          constants arrive together as hc. That is 1.99 × 10⁻²⁵ joule metres, and worth remembering.
          Dividing a power by the energy of one photon is what turns watts into a count. And the
          count is what the receiver's limit is really about.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: E = h·f = h·c/λ
          startNote: h = 6.626 × 10⁻³⁴ J·s, c = 2.998 × 10⁸ m/s, λ = 1550 nm, 1 eV = 1.602 × 10⁻¹⁹ J
          goal: the photon energy in electron volts, and the arrival rate for one milliwatt
          askRule: true
          rules:
            - the quantum of energy
            - wavelength and frequency
            - conversion of units
            - a power divided by an energy
            - rearrangement
          steps:
            - ask: Get the frequency from the wavelength.
              answer: 0
              candidates:
                - text: f = c/λ = 2.998 × 10⁸ ÷ 1.55 × 10⁻⁶ = 1.93 × 10¹⁴ Hz
                  rule: wavelength and frequency
                - text: f = c·λ = 465 m²/s
                  rule: rearrangement
                  why: >-
                    Multiplied. The units are metres squared a second, which is not a frequency of
                    anything.
                - text: f = c/λ = 2.998 × 10⁸ ÷ 1550 nm = 1.93 × 10⁵ Hz, in nanometres
                  rule: wavelength and frequency
                  survives: true
                  why: >-
                    The wavelength left in nanometres. It is nine orders out and it is a perfectly
                    ordinary-looking radio frequency, so nothing about it reads as absurd.
                - text: f = λ/c = 5.2 × 10⁻¹⁵ s
                  rule: rearrangement
                  why: >-
                    Inverted: that is a period rather than a frequency, and it is in seconds.
            - ask: Get the energy in joules.
              answer: 2
              candidates:
                - text: E = h/f = 3.4 × 10⁻⁴⁸ J
                  rule: rearrangement
                  why: >-
                    Divided rather than multiplied. A bluer photon would then carry less energy.
                - text: E = h·c·λ = 3.1 × 10⁻³¹ J
                  rule: the quantum of energy
                  why: >-
                    The wavelength multiplying where it divides. It has the wrong units by a metre
                    squared.
                - text: E = h·f = 6.626 × 10⁻³⁴ × 1.93 × 10¹⁴ = 1.28 × 10⁻¹⁹ J
                  rule: the quantum of energy
                - text: E = h·c/λ = 1.99 × 10⁻²⁵ ÷ 1.55 = 1.28 × 10⁻²⁵ J
                  rule: the quantum of energy
                  survives: true
                  why: >-
                    The same relation with the wavelength in micrometres against an hc in joule metres.
                    The digits are exactly right and the exponent is six out, which is the hardest kind
                    of error to see in this form.
            - ask: Convert it into electron volts.
              answer: 1
              candidates:
                - text: 1.28 × 10⁻¹⁹ × 1.602 × 10⁻¹⁹ = 2.05 × 10⁻³⁸ eV
                  rule: conversion of units
                  why: >-
                    Multiplied by the conversion instead of divided by it. An electron volt is a small
                    unit, so the number of them should be larger rather than vanishing.
                - text: 1.28 × 10⁻¹⁹ ÷ 1.602 × 10⁻¹⁹ = 0.80 eV
                  rule: conversion of units
                - text: 1.28 × 10⁻¹⁹ ÷ 1.602 = 0.80 × 10⁻¹⁹ eV
                  rule: conversion of units
                  survives: true
                  why: >-
                    The mantissas divided and the exponents left alone. The leading digits are right
                    and the answer is nineteen orders too small, which is invisible if only the digits
                    are checked.
                - text: 1.28 × 10⁻¹⁹ J is already in electron volts
                  rule: conversion of units
                  why: >-
                    A joule and an electron volt are different sizes by a factor of 1.6 × 10⁻¹⁹, which
                    is exactly what makes both useful.
            - ask: Turn a milliwatt into arrivals a second.
              answer: 3
              candidates:
                - text: 10⁻³ × 1.28 × 10⁻¹⁹ = 1.28 × 10⁻²² photons/s
                  rule: rearrangement
                  why: >-
                    Multiplied. A power times an energy is not a rate of anything.
                - text: 10⁻³ ÷ 0.80 = 1.25 × 10⁻³ photons/s
                  rule: a power divided by an energy
                  why: >-
                    Divided by the energy in electron volts rather than in joules, so the units do not
                    cancel and the answer is a thousandth of a photon a second.
                - text: 10⁻³ ÷ 1.93 × 10¹⁴ = 5.2 × 10⁻¹⁸ photons/s
                  rule: a power divided by an energy
                  survives: true
                  why: >-
                    Divided by the frequency rather than by the energy. Planck's constant has gone
                    missing, and what comes out has the units of joule seconds.
                - text: 10⁻³ ÷ 1.28 × 10⁻¹⁹ = 7.8 × 10¹⁵ photons/s
                  rule: a power divided by an energy
          commit: Commit the derivation
      - group: RECV
        task: Find the photon count available for each bit at the receiver limit
        title: How many photons make one bit?
        at: recv-bench
        reason: >-
          If only a tiny number of photons arrive in each bit, random counting fluctuations could set the error
          floor. You need the actual count before blaming electronics or cable damage.
        concept: 'Counting statistics, and the noise a stream of photons has of its own'
        takesAsRead:
          - "Photons: energy, momentum and the quantum of light"
        place: Receiver Lab
        scene: >-
          Duarte gives you the received power at the sensitivity limit, the bit rate and the photon energy you
          just derived.
        guide: >-
          Power divided by energy per photon gives photons per second. Divide again by bits per second to get
          photons per bit. Once you know N, remember that the natural counting fluctuation is of order √N.
        assumes:
          - a stream of arrivals has a spread of about the square root of its count
        takeaway: A receiver at the end of a long span is counting a few thousand arrivals a bit, and the 
          root of that count is its floor.
        format: BALLPARK
        question: At the receiver sensitivity limit, about how many photons are available for each bit?
        estimate:
          prompt: >-
            The error floor is a statement about counting, so the count has to be got first. This is
            the power the receiver is specified down to, at the rate this system runs.
          question: How many photons arrive in one bit at the receiver's sensitivity?
          relationship: >-
            Arrivals a bit = the power arriving, divided by the energy of one photon, divided by the
            bits a second.
          labels:
            - 7.9e-6 W  (power at the receiver's sensitivity)
            - 1.28e-19 J  (energy of one photon at this wavelength)
            - 1.0e10 bits/s  (the line rate)
            - 1.2e-3 W  (the power launched at the far end)
          values: [0.0000079, 1.28e-19, 10000000000, 0.0012]
          slots: 3
          template: '{0} ÷ {1} ÷ {2}'
          formula: a/b/c
          correct: [0, 1, 2]
          target: 6172
          tolerance: 200
          units: photons per bit
          solution: 7.9 × 10⁻⁶ ÷ 1.28 × 10⁻¹⁹ ÷ 10¹⁰ ≈ 6,200 photons a bit.
          explanation: >-
            The launched power is 151 times larger and belongs at the other end of the span. Using it
            here would say the receiver has a million arrivals a bit to work with, which is the
            difference between a comfortable link and one at its limit.
        why: >-
          About six thousand photons arrive in each bit. That is a large number of anything except a
          count. The spread of a count is about its square root. So six thousand arrivals carry a
          natural unevenness of about eighty, which is over one per cent. No improvement to the
          electronics touches it, because it is a property of light arriving in pieces. The two ways
          to get further are more photons — a better amplifier or a shorter span — or fewer bits a
          second.
      - group: TERM
        task: Connect pulse broadening to wavelength-dependent speed in the glass
        title: Why did the pulse spread out?
        reason: >-
          The returned pulse is wider than the pulse that was launched. That matters because the same wavelength
          dependence also tells you why a pulse needs a group index rather than the index of one perfect colour.
        concept: 'Dispersion, and why a pulse spreads as it travels'
        place: Cable Termination Room
        person: true
        scene: >-
          Nilsen overlays the launched pulse and the received pulse after 84 km of glass. The second is weaker,
          but it is also visibly broader in time.
        guide: >-
          A pulse contains a narrow range of wavelengths. If those wavelengths travel at slightly different speeds,
          they arrive at different times. Choose the mechanism that changes pulse width without requiring a sudden
          fault.
        assumes:
          - a pulse of light contains a small range of wavelengths rather than one exactly
        takeaway: A pulse is not one wavelength, and anything that depends on wavelength therefore acts on 
          its shape.
        format: CHOICE
        question: What property of the light makes the pulse arrive spread out in time?
        why: >-
          Because the pulse is not one wavelength but a narrow band of them. And the index of the
          glass is slightly different for each. So the parts of the pulse arrive at slightly
          different times, and it spreads. That is dispersion, a property of the material. It is why
          a long span has a bit rate limit as well as a power limit. It is also why the fibre's own
          index is not quite the number a pulse travels at. That is the correction the ship's chart
          is missing.
        choices:
          - Its colours travel at slightly different speeds in the glass
          - Light has been lost, so the pulse is weaker and looks broader
          - The joints along the span each delay part of the light
          - The amplifier at the far end stretches what it amplifies
        answer: Its colours travel at slightly different speeds in the glass
        rebuttals:
          - Losing power lowers a pulse without widening it; the two effects are measured separately.
          - A joint adds a fixed delay to everything passing through it, which moves a pulse rather than 
            spreading it.
          - An amplifier adds power and noise, and the pulse leaves it the width it arrived.
  # ---------------------------------------------------------------- day 6
  - title: Calibrate the instruments
    objective: Derive the photodiode response from the physics, then separate real fault signatures from 
      noise and calibration error.
    briefing: The diode data sheet says one thing and the bench says another. Before you diagnose eighty 
      kilometres of cable, decide which number belongs in the measurement.
    stake: >-
      T−7 days. The data sheet assumes 90 per cent conversion; the actual diode gives 82 per cent. That difference
      changes the power calibration by about 0.4 dB. Derive the responsivity, then check which features of a trace
      survive averaging and which fault signatures are genuinely different.
    takeaway: A measurement is only as trustworthy as the conversion from what the instrument senses to the 
      quantity you use.
    segue: >-
      The receiver is now calibrated with the measured efficiency, not the data sheet. The 4.1 dB event
      and its trace shape survive the correction. You have reliable instruments and four live suspects. On
      day 7, decide which tests can eliminate them before the ship is forced to make the irreversible test
      at sea.
    stops:
      - group: RECV
        task: Derive current per watt from photon energy, charge and the measured quantum efficiency
        title: Calibrate the photodiode
        at: diode-station
        reason: >-
          The data sheet assumes 90 per cent conversion, but this actual diode converts 82 per cent. The receiver
          power scale should use the detector on the bench, not an ideal label.
        concept: 'Photodetection: quantum efficiency and responsivity'
        takesAsRead:
          - The photoelectric effect, and a threshold that is about energy per photon
        place: Receiver Lab
        scene: >-
          Osgood, the photodiode technician, measures 82 released charges for every 100 arriving photons. Duarte puts that efficiency beside
          the 1550 nm photon energy and asks for the current produced by one watt.
        guide: >-
          One watt tells you photons per second. Multiply by the measured conversion efficiency to get electrons
          per second, then multiply by the electron charge to get amperes. The result is the diode responsivity
          in A/W.
        background:
          - >-
            Why the answer is close to one. At this wavelength a photon carries 0.80 electron volts.
            An electron volt is exactly the energy an electron gains through a volt. So the current
            per watt comes out near the reciprocal of that number of volts. An efficiency of 0.8 and
            a photon energy of 0.8 electron volts happen to cancel. That is a coincidence, and a
            useful one to notice.
          - >-
            Why the responsivity rises with wavelength. Longer wavelengths mean less energy per
            arrival, so a watt is more arrivals, so more charges: the responsivity of a perfect
            detector is proportional to the wavelength. That continues only until the arrivals are too
            weak to free a charge at all, which is the cut-off.
          - >-
            What the ten per cent is worth. The difference between the sheet's 0.90 and the measured
            0.82 is 0.4 decibels of sensitivity. Against 2.2 decibels of margin, that is a fifth of
            everything the span has spare. It is also the difference between a figure somebody
            measured and a figure somebody printed.
        assumes:
          - a converted arrival releases exactly one unit of charge
        takeaway: Responsivity is the efficiency times the charge divided by the energy of one arrival, and 
          it grows with the wavelength.
        format: DERIVE
        question: Using the measured 82 per cent efficiency, what current should 1 W of 1550 nm light 
          produce?
        answerText: >-
          About 1.03 A. A watt is 7.8 × 10¹⁸ arrivals a second, 82 per cent are converted, and each
          gives 1.602 × 10⁻¹⁹ C.
        why: >-
          One watt produces about 1.03 amps. At 1550 nm, one watt is 7.8 × 10¹⁸ photons each second. The measured
          diode converts 82 per cent of them to charge, and each electron carries 1.602 × 10⁻¹⁹ C. Multiplying
          those three factors gives current. Written as one expression, responsivity is ηe/E_photon. Using the
          data-sheet value of 90 per cent instead of the measured 82 per cent would overstate the response by
          about 10 per cent, or roughly 0.4 dB—large enough to matter when the remaining link margin is only a
          few decibels.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: R_λ = η·e/(h·f)
          startNote: η = 0.82, e = 1.602 × 10⁻¹⁹ C, photon energy at 1550 nm = 1.28 × 10⁻¹⁹ J
          goal: the current per watt, in amps a watt
          askRule: true
          rules:
            - a power divided by an energy
            - the efficiency of conversion
            - charge times a rate
            - substitution of the stated values
            - rearrangement
          steps:
            - ask: Turn one watt into arrivals a second.
              answer: 3
              candidates:
                - text: 1 × 1.28 × 10⁻¹⁹ = 1.28 × 10⁻¹⁹ arrivals/s
                  rule: rearrangement
                  why: >-
                    Multiplied by the energy of one arrival rather than divided by it. A watt is not a
                    fraction of a photon.
                - text: 1 ÷ 0.80 = 1.25 arrivals/s
                  rule: a power divided by an energy
                  why: >-
                    Divided by the energy in electron volts, so the units have not cancelled. A watt is
                    a joule a second and the energy has to be in joules.
                - text: 1 ÷ 1.28 × 10⁻¹⁹ = 7.8 × 10¹⁸ arrivals/s, times the efficiency already
                  rule: the efficiency of conversion
                  survives: true
                  why: >-
                    The right count with the efficiency applied a line early. It gets applied again at
                    the next step, so the answer comes out at 0.84 rather than 1.03 — a difference of
                    0.9 decibels, and nothing in the working looks wrong.
                - text: 1 ÷ 1.28 × 10⁻¹⁹ = 7.8 × 10¹⁸ arrivals/s
                  rule: a power divided by an energy
            - ask: Apply the efficiency.
              answer: 0
              candidates:
                - text: 0.82 × 7.8 × 10¹⁸ = 6.4 × 10¹⁸ charges/s
                  rule: the efficiency of conversion
                - text: 7.8 × 10¹⁸ ÷ 0.82 = 9.5 × 10¹⁸ charges/s
                  rule: rearrangement
                  why: >-
                    Divided by an efficiency less than one, which gives more charges out than arrivals
                    in.
                - text: 0.82 × 0.82 × 7.8 × 10¹⁸ = 5.2 × 10¹⁸ charges/s
                  rule: the efficiency of conversion
                  why: >-
                    The efficiency applied twice. It is what the previous line's survivor leads to and
                    it is 1.6 decibels low.
                - text: 7.8 × 10¹⁸ charges/s, since each arrival frees a charge
                  rule: the efficiency of conversion
                  survives: true
                  why: >-
                    True of a perfect detector and this one is not: 18 arrivals in a hundred are
                    absorbed without freeing anything, or pass straight through. It gives the data
                    sheet's ideal figure of 1.25 amps a watt.
            - ask: Turn charges a second into a current.
              answer: 1
              candidates:
                - text: I = 6.4 × 10¹⁸ ÷ 1.602 × 10⁻¹⁹ = 4.0 × 10³⁷ A
                  rule: rearrangement
                  why: >-
                    Divided by the charge rather than multiplied. The size of the answer is the check.
                - text: I = 6.4 × 10¹⁸ × 1.602 × 10⁻¹⁹ = 1.03 A
                  rule: charge times a rate
                - text: I = 6.4 × 10¹⁸ A
                  rule: charge times a rate
                  survives: true
                  why: >-
                    A count of charges a second reported as a current. It is the right physical
                    quantity in the wrong units, and the conversion is the whole of what a coulomb is.
                - text: I = 1.602 × 10⁻¹⁹ ÷ 6.4 × 10¹⁸ = 2.5 × 10⁻³⁸ A
                  rule: rearrangement
                  why: >-
                    Inverted, and the answer is a current no instrument could detect.
            - ask: Say what the responsivity would be at 1300 nm.
              answer: 2
              candidates:
                - text: the same, 1.03 A/W, since the diode has not changed
                  rule: substitution of the stated values
                  survives: true
                  why: >-
                    The diode has not changed and the light has. A shorter wavelength carries more
                    energy per arrival, so a watt of it is fewer arrivals and fewer charges.
                - text: higher, about 1.23 A/W, since shorter wavelengths carry more energy
                  rule: rearrangement
                  why: >-
                    More energy per arrival means fewer arrivals in a watt, so the current goes down
                    rather than up. The reasoning is right and the direction is inverted.
                - text: lower, about 0.86 A/W, in proportion to the wavelength
                  rule: substitution of the stated values
                - text: zero, since the diode is specified for 1550 nm
                  rule: the efficiency of conversion
                  why: >-
                    A cut-off happens at long wavelengths, where the arrivals are too weak. Shorter
                    ones are detected perfectly well.
          commit: Commit the derivation
      - group: SPLICE
        task: Match each physical fault to the trace shape it should produce
        title: Four faults, four signatures
        at: fault-tray
        reason: >-
          The suspects can lose similar amounts of light. What separates them is whether light comes back, whether
          the loss is abrupt or spread out, and whether anything continues beyond it.
        concept: 'Which of several candidate causes a signature can tell apart'
        place: Splice Trailer
        scene: >-
          Ramnarine has four archived failures: a clean break, a tight bend, a dried mechanical joint and a crushed
          length of fibre. Beside each is the trace recorded before it was repaired.
        guide: >-
          Do not match by total loss alone. Ask three questions for each fault: is there an abrupt refractive-index
          step, does lost light return toward the instrument, and is the damage localized or spread along a length?
        assumes:
          - an instrument sees only the light that returns to it
        takeaway: Two faults can lose the same light and be told apart by what comes back, which is why a 
          trace has a shape as well as a step.
        format: PROTOCOL
        scenarios:
          - A clean break, with air at the end.
          - A tight bend round a fitting.
          - A mechanical joint whose gel has dried out.
          - A fibre crushed over twenty metres inside a damaged cable.
        choices:
          - A step down with a tall spike on it, and nothing beyond.
          - A step down with nothing on it, and the trace continuing.
          - A step down with a small spike on it, and the trace continuing.
          - A steepening of the slope over a length, with no step anywhere.
        mapping: [0, 1, 2, 3]
        why: >-
          A break reflects about 3.6 per cent at the glass-air step, which is a tall spike, and
          nothing continues past it. A bend has no index step at all, so light leaves the core and
          none comes back: a step with nothing on it. A dried joint has a step in index but a small
          one, so a small spike and the trace goes on. And a crushed length loses gradually rather
          than at a point, which shows as the slope getting steeper for twenty metres. The step
          heights alone would not separate any of these.
      - group: TEST
        task: Separate random trace noise from a systematic error that repeats every time
        title: What does averaging actually fix?
        reason: >-
          Meier can average thousands of traces, but a long average is useful only if the uncertainty changes
          from one trace to the next.
        concept: 'Counting statistics, and the noise a stream of photons has of its own'
        place: Test Room
        person: true
        scene: >-
          Meier can take a quick stack of 1,000 traces or spend eleven minutes averaging 65,000. Some wiggles
          move from trace to trace; a calibration offset stays in exactly the same place.
        guide: >-
          Random fluctuations shrink roughly as 1/√N when independent measurements are averaged. A systematic
          offset repeats and therefore does not average away. Choose the statement that respects that distinction.
        assumes:
          - independent measurements of the same thing average towards it
        takeaway: Averaging reduces what varies between measurements as the root of their number, and does 
          nothing at all to what does not.
        format: CHOICE
        question: What does averaging sixty-five thousand traces buy?
        why: >-
          It reduces the part of the trace that varies from one pulse to the next. It does so as the
          square root of the number averaged. Sixty-five times more traces than a thousand buys a
          factor of eight, which is nine decibels. Sixty-four times the time for nine decibels is
          the bargain on offer. What it cannot touch is anything the same in every trace. A
          reflection from a connector, or the instrument's own dead zone. Averaging identical things
          returns the thing.
        choices:
          - Nine decibels of reach, for sixty-four times the time
          - A shorter dead zone at the near end of the fibre
          - Better resolution between two events close together
          - Removal of the reflection from the connector at the instrument
        answer: Nine decibels of reach, for sixty-four times the time
        rebuttals:
          - The dead zone is set by the pulse width and the receiver's recovery, neither of which averaging 
            changes.
          - Resolution is also the pulse width; averaging makes the same blur less noisy.
          - That reflection is identical in every trace, so averaging returns it unchanged.
  # ---------------------------------------------------------------- day 7
  - title: Choose the tests before the ship arrives
    objective: Prepare the replacement housing and rank the tests that can separate the four suspects 
      without spending the one repair attempt.
    briefing: The ship gets one safe day at sea. Every question you can answer from shore before then makes 
      that one attempt safer.
    stake: >-
      T−6 days. A break, bend, old joint and failing repeater can all weaken the signal. Some tests need only
      old data; one changes a live repeater; the last requires the ship to pull up the cable. Use physics and
      experimental design to do the reversible tests first.
    takeaway: The best next test is the one that separates the remaining explanations before an irreversible
      decision has to be made.
    segue: >-
      The order is set: use the records already on shore, improve the optical measurement, then switch the
      spare pump only after you have made a prediction. The ship is the last test, not the first. On day
      8, make the two-wavelength comparison trustworthy enough to rule whole classes of faults in or out.
    stops:
      - group: RAD
        task: Calculate how much gamma radiation reaches the film through 40 mm of steel
        title: Can X-rays see through the replacement housing?
        at: source-pot
        reason: >-
          If repeater 6 is the problem, the replacement housing has to be X-rayed before the ship can take it.
          Farouk needs to know whether the source can expose film through the steel wall.
        concept: 'Gamma attenuation through a material, and half-value thickness'
        takesAsRead:
          - Radioactive decay as a random process with a fixed chance
        place: Radiography Bay
        scene: >-
          The replacement repeater housing has a 40 mm steel wall. At the source energy, steel has attenuation
          coefficient 0.666 per centimetre.
        guide: >-
          Use exponential attenuation to find the fraction through 4.0 cm of steel. Then solve the same relation
          for the half-value thickness and check the answer by counting how many halvings fit inside the wall.
        background:
          - >-
            Why a half-value thickness is the useful form. A material has no thickness that stops a
            gamma beam; it has a thickness that halves it, and another one that halves it again. So
            shielding is quoted as that thickness, and a barrier is designed by counting how many of
            them are in the way.
          - >-
            Why the exponent and the count agree. Forty millimetres at 0.666 per centimetre is an
            exponent of 2.66. Divide 2.66 by the natural logarithm of two and you get 3.85. So the
            wall is 3.85 half-value thicknesses, and two to the power of minus 3.85 is 0.069. The
            two routes are the same statement written in different bases.
          - >-
            What it costs Farouk. Seven per cent through means an exposure fourteen times longer than
            a film with nothing in the way, before any allowance for the source being eight months old.
            That second factor arrives tomorrow, and the two multiply.
        assumes:
          - equal thicknesses of a material remove equal fractions of a beam
        takeaway: A half-value thickness is the natural way to state shielding, because attenuation is 
          exponential and never complete.
        format: DERIVE
        question: What fraction of the gamma beam reaches the film through the 40 mm steel wall?
        answerText: >-
          About 7 per cent. The exponent is 0.666 × 4.0 = 2.66, and the half-value thickness is
          ln2/0.666 = 1.04 cm, so the wall is 3.85 of them.
        why: >-
          About seven per cent gets through. The fraction remaining is e to the minus the
          coefficient times the thickness, which is e to the minus 2.66. The same coefficient gives
          a half-value thickness of 1.04 centimetres, and the wall is 3.85 of those. And two to the
          minus 3.85 is the same 0.069. The two forms are one relation in different bases. Neither
          form contains a thickness that stops the beam. That is why a barrier is a distance as
          often as it is a slab.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: I = I₀·e^(−μx)
          startNote: μ = 0.666 per cm in steel at this energy, x = 4.0 cm of wall
          goal: the fraction through the wall, and the half-value thickness
          askRule: true
          rules:
            - exponential attenuation
            - the half-value thickness
            - counting half-values
            - substitution of the stated values
            - rearrangement
          steps:
            - ask: Get the exponent.
              answer: 2
              candidates:
                - text: μ·x = 0.666 × 40 = 26.6
                  rule: substitution of the stated values
                  survives: true
                  why: >-
                    The coefficient is per centimetre and the wall has been put in millimetres. It
                    gives a fraction of 2.8 × 10⁻¹² through, which is a film that would never expose —
                    and radiographers do wait a long time, so it does not read as impossible.
                - text: μ/x = 0.666 ÷ 4.0 = 0.167
                  rule: rearrangement
                  why: >-
                    Divided. The exponent has to be dimensionless, so a per-centimetre coefficient
                    multiplies a length in centimetres.
                - text: μ·x = 0.666 × 4.0 = 2.66
                  rule: exponential attenuation
                - text: μ·x = 0.666 × 4.0 × ln2 = 1.85
                  rule: counting half-values
                  why: >-
                    The logarithm of two belongs to the conversion between the two bases, not to the
                    exponent itself. It has been applied a step early.
            - ask: Get the fraction through.
              answer: 0
              candidates:
                - text: e^(−2.66) = 0.070
                  rule: exponential attenuation
                - text: 1 − 2.66 = −1.66
                  rule: rearrangement
                  why: >-
                    A negative fraction of a beam. The exponent is an exponent rather than a proportion
                    removed.
                - text: e^(2.66) = 14.3
                  rule: exponential attenuation
                  survives: true
                  why: >-
                    The sign of the exponent dropped, giving more out than in — and 14.3 is exactly the
                    factor the exposure has to be lengthened by, so it turns up later looking right.
                - text: 1/2.66 = 0.376
                  rule: rearrangement
                  why: >-
                    A reciprocal rather than an exponential. It gives 38 per cent through, five times
                    too much, and would set every exposure short.
            - ask: Get the half-value thickness.
              answer: 1
              candidates:
                - text: 1/μ = 1 ÷ 0.666 = 1.50 cm
                  rule: the half-value thickness
                  survives: true
                  why: >-
                    That is the thickness that reduces the beam by a factor of e rather than by two.
                    It is a real quantity, 44 per cent too large for this purpose, and the two are
                    routinely confused.
                - text: ln2/μ = 0.693 ÷ 0.666 = 1.04 cm
                  rule: the half-value thickness
                - text: μ/ln2 = 0.961 cm
                  rule: rearrangement
                  why: >-
                    Inverted, and it happens to come out near enough to the right answer to pass a
                    glance — the units are centimetres either way and the numbers differ by eight per
                    cent.
                - text: 2/μ = 3.00 cm
                  rule: the half-value thickness
                  why: >-
                    A factor of two where a logarithm belongs. Halving is about the logarithm of two,
                    not about two.
            - ask: Say how many half-values the wall is, and check the fraction.
              answer: 3
              candidates:
                - text: 4.0 ÷ 1.04 = 3.85, and 2⁻³·⁸⁵ = 0.14
                  rule: counting half-values
                  survives: true
                  why: >-
                    The count is right and the power of two has been evaluated as though it were 2.85.
                    It is exactly twice the true fraction, which is one half-value out.
                - text: 4.0 × 1.04 = 4.16 half-values
                  rule: rearrangement
                  why: >-
                    Multiplied by the half-value thickness rather than divided by it. The units come
                    out as centimetres squared.
                - text: 2.66 half-values, since that is the exponent
                  rule: counting half-values
                  why: >-
                    The exponent is in base e and the count is in base two. Converting between them is
                    the factor of ln2 this step exists for.
                - text: 4.0 ÷ 1.04 = 3.85, and 2⁻³·⁸⁵ = 0.069
                  rule: counting half-values
          commit: Commit the derivation
      - group: AMP
        task: Order the four tests from least disruptive to most irreversible
        title: Which test should happen first?
        at: cause-board
        reason: >-
          The ship has one safe recovery day. If shore-based evidence can eliminate a cause first, the crew should
          not discover that fact after pulling up the wrong part of the cable.
        concept: 'Which of several candidate causes a signature can tell apart'
        place: Amplifier and Power Hall
        scene: >-
          Sarraf and Tanaka agree on four possible next tests. Re-read the two-wavelength records. Take a
          sharper trace. Switch repeater 6 to its unused spare pump. Or send the ship to lift the cable and
          cut it open.
        guide: >-
          Put the tests in an order that preserves options. Start with evidence already recorded, then a new measurement
          from shore, then the live intervention on the repeater, and only then the ship. A good sequence spends
          the irreversible action only after cheaper evidence has failed to answer.
        assumes:
          - reversible measurements should be used before an irreversible intervention when they can answer 
            the same question
        takeaway: Order tests by how much they commit you before they answer; use reversible evidence before
          the one repair attempt.
        format: SEQUENCE
        axis: >-
          Order the four from least disruptive to most irreversible. All four could be started now; the point
          is to preserve options until the evidence forces a bigger commitment.
        ends:
          - Uses existing data
          - Spends the one repair attempt
        cards:
          - Re-read the existing traces at both wavelengths and compare them.
          - Trace again with a shorter pulse to resolve what is under the step.
          - Switch repeater 6 to its spare pump and watch the received power.
          - Send the ship to lift and cut open the suspected section of cable.
        order: [0, 1, 2, 3]
        why: >-
          Start with the two-wavelength traces already in the drawer: they cost no intervention and can eliminate
          wavelength-dependent fibre damage. Next take a sharper trace from shore. Only then switch to the unused
          spare pump, because that changes a live repeater. Sending the ship to lift and cut open the cable comes
          last. That action spends the one safe weather window and cannot be undone if the diagnosis was wrong.
          Good test ordering preserves the expensive or irreversible decision until the cheaper evidence has done
          all it can.
      - group: SPLICE
        task: Understand the interference trick that will remove an unwanted reflection inside the test 
          instrument
        title: How can two reflections cancel?
        reason: >-
          An internal connector is adding its own reflection near the part of the trace you care about. Before
          the two-colour comparison, that false reflection has to be understood and suppressed.
        concept: 'Interference of two beams, and the path difference that decides it'
        place: Splice Trailer
        person: true
        scene: >-
          Achebe, the fibre preparation technician, shows two connector faces, identical except that one has a thin transparent coating. The coated
          face sends much less light back even though it absorbs almost nothing.
        guide: >-
          The coating creates two reflected waves, one from each surface. If they return half a wavelength out
          of step and with similar amplitudes, they cancel. Choose the mechanism that removes the backward reflection
          without destroying the forward light.
        assumes:
          - two waves arriving out of step by half a wavelength cancel
        takeaway: Two reflections separated by the right path difference arrive out of step and cancel, 
          which removes a reflection without absorbing anything.
        format: CHOICE
        question: How can a transparent coating reduce reflection without absorbing the light?
        why: >-
          The coating makes two reflections instead of one, from its front face and its back face. If
          the extra path between them is half a wavelength, the two arrive out of step and cancel.
          Nothing is absorbed: the light that would have come back goes forward instead. That is why
          the thickness matters, and why it is a quarter of a wavelength rather than any old thin
          layer. It is the same arithmetic as the gel in a mechanical joint, reached a different way.
        choices:
          - It makes a second reflection that arrives out of step with the first
          - It absorbs the part of the light that would have been reflected
          - It scatters the reflection sideways out of the fibre
          - It roughens the face so no single direction is favoured
        answer: It makes a second reflection that arrives out of step with the first
        rebuttals:
          - An absorbing coating would lose the light in both directions, and this one does not.
          - Scattering would show as loss on a trace, and a coated connector is less lossy rather than more.
          - A rough face scatters in transmission as well, which is exactly what a connector must not do.
  # ---------------------------------------------------------------- day 8
  - title: Build the test that separates the suspects
    objective: Remove a false reflection in the instrument, check the detector band, and predict how a real 
      bend should change with wavelength.
    briefing: A two-colour trace can tell fibre damage from a repeater problem—but only if the instrument 
      itself is not adding a reflection.
    stake: >-
      T−5 days. Meier wants to compare the fault at 1550 and 1625 nm. A bend should hurt the longer wavelength
      more; a repeater fault should not. First make sure the instrument can measure both colours cleanly, then
      lock in what each outcome would mean before you see the data.
    takeaway: A good diagnostic test is designed around a prediction that different causes cannot all 
      satisfy.
    segue: >-
      The instrument is ready and the prediction is written down: more loss at 1625 nm points toward bent or crushed
      fibre; the same loss at both colours points away from that mechanism. Meier starts the comparison while
      you finish preparing the replacement hardware.
    stops:
      - group: SPLICE
        task: Design the anti-reflection coating for the connector used in the two-wavelength test
        title: Remove the instrument's false reflection
        at: coating-rig
        reason: >-
          The two-colour diagnosis depends on small differences in the trace. A known connector reflection inside
          the instrument must not be mistaken for a feature in the cable.
        concept: 'Thin films, index matching and the reflection at a step'
        takesAsRead:
          - Snell's law at a boundary
        place: Splice Trailer
        scene: >-
          Ramnarine can coat the connector face before the overnight comparison. The glass index is 1.4682, air
          is 1.0003 and the main test wavelength is 1550 nm.
        guide: >-
          Choose the film index that makes the two reflected amplitudes equal, then choose the thickness that
          gives a half-wavelength round-trip path difference inside the film. The thinnest solution is the quarter-wave
          coating.
        background:
          - >-
            Why the film is a quarter of a wavelength and not a half. The extra path is twice the
            thickness, because the second reflection goes down and back, so a quarter-wavelength film
            gives a half-wavelength path difference. That is the difference between a coating that
            cancels and one that does nothing at all.
          - >-
            Why the wavelength inside the film is the one that counts. The wave is slower in the film,
            so its wavelength there is the vacuum wavelength divided by the film's index. The
            thickness that matters is therefore λ over four n, not λ over four.
          - >-
            Why the index is a geometric mean. Cancelling needs the two reflections equal as well as
            opposite. The two step sizes are equal when the film's index is the root of the product
            of the two either side. That is 1.212 here, which is close to magnesium fluoride, which
            is what is actually used.
        assumes:
          - a wave reflected at each face of a film travels an extra distance of twice the thickness
        takeaway: A coating cancels a reflection when its thickness gives a half-wavelength path difference 
          and its index equalises the two reflections.
        format: DERIVE
        question: What film index and thickness will cancel the connector reflection at 1550 nm?
        answerText: >-
          About 320 nm, at an index of 1.212. The thickness is λ/(4n) and the index is the root of the
          product of the two either side.
        why: >-
          The film should be about 320 nanometres thick with an index of 1.212. Two reflections leave
          it, and the second travels twice the thickness further. So a thickness of a quarter of the
          wavelength inside the film puts them half a wavelength apart, and they cancel. The wavelength
          inside the film is the vacuum wavelength divided by the film's index, which is why the
          thickness depends on that index as well. And they only cancel completely if they are the
          same size, which happens when the film's index is the geometric mean of its neighbours'.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: 2·n·t = (m + ½)·λ
          startNote: glass 1.4682, air 1.0003, λ = 1550 nm in vacuum; take the thinnest film that works
          goal: the thickness in nanometres and the index the film should have
          askRule: true
          rules:
            - the path difference in a film
            - the wavelength inside a material
            - equal reflections at both faces
            - substitution of the stated values
            - rearrangement
          steps:
            - ask: Write the condition for the two reflections to cancel.
              answer: 1
              candidates:
                - text: n·t = λ/2, one half-wavelength in the film
                  rule: the path difference in a film
                  survives: true
                  why: >-
                    The factor of two for the return trip through the film is missing. It gives a film
                    twice as thick, which cancels nothing at this wavelength and cancels perfectly at
                    3100 nanometres.
                - text: 2·n·t = λ/2, a half-wavelength of path difference
                  rule: the path difference in a film
                - text: 2·n·t = λ, a whole wavelength of path difference
                  rule: the path difference in a film
                  why: >-
                    A whole wavelength brings the two reflections back into step, so they add rather
                    than cancel. That is a coating that makes a face reflect more.
                - text: t = λ/2, a half-wavelength of thickness
                  rule: rearrangement
                  why: >-
                    Neither the return trip nor the film's own index has been accounted for, so the
                    thickness is out by a factor of four and a half.
            - ask: Solve for the thickness.
              answer: 3
              candidates:
                - text: t = λ/4 = 388 nm
                  rule: the wavelength inside a material
                  survives: true
                  why: >-
                    The film's index left out. It is 21 per cent thick and would leave a reflection
                    about a fifth of the original — better than nothing, which is what makes it
                    survive.
                - text: t = λ·n/4 = 470 nm
                  rule: rearrangement
                  why: >-
                    The index multiplying rather than dividing. A slower wave has a shorter wavelength
                    inside the film, so the thickness goes down.
                - text: t = λ/(2n) = 1550 ÷ (2 × 1.212) = 639 nm
                  rule: rearrangement
                  why: >-
                    The four has become a two: the return trip has been counted once instead of
                    doubling the path.
                - text: t = λ/(4n) = 1550 ÷ (4 × 1.212) = 320 nm
                  rule: substitution of the stated values
            - ask: Say what index makes the two reflections the same size.
              answer: 2
              candidates:
                - text: the mean of the two, (1.4682 + 1.0003)/2 = 1.234
                  rule: equal reflections at both faces
                  survives: true
                  why: >-
                    An arithmetic mean where a geometric one belongs. It is 1.8 per cent out, it leaves
                    a residual reflection about a thousandth of the original, and it would pass every
                    test anybody here could run.
                - text: the same as the glass, 1.4682
                  rule: equal reflections at both faces
                  why: >-
                    Then there is no step at the glass face at all, only at the air face — which is the
                    reflection you started with, moved.
                - text: the root of the product, √(1.4682 × 1.0003) = 1.212
                  rule: equal reflections at both faces
                - text: the difference of the two, 0.4679
                  rule: rearrangement
                  why: >-
                    No material has an index below one, so this is not a candidate for a film.
            - ask: Check what the same film does at 1310 nm.
              answer: 0
              candidates:
                - text: it is no longer a quarter-wavelength there, so the cancellation is partial
                  rule: the path difference in a film
                - text: it works equally well, since the film has not changed
                  rule: the path difference in a film
                  survives: true
                  why: >-
                    The film has not changed and the wavelength has. The condition is a relation
                    between the two, which is why a coating is specified for a wavelength.
                - text: it reflects more than an uncoated face at that wavelength
                  rule: the path difference in a film
                  why: >-
                    That happens where the path difference is a whole wavelength, which is at 640
                    nanometres for this film rather than at 1310.
                - text: it cancels completely, since the index condition is independent of wavelength
                  rule: equal reflections at both faces
                  why: >-
                    The index condition is nearly independent of wavelength and the thickness condition
                    is not, and both are needed.
          commit: Commit the derivation
      - group: RECV
        task: Use photon energy to understand the detector's long-wavelength cutoff
        title: Why can't any wavelength be detected?
        reason: >-
          The diagnostic test uses colour, but a detector cannot simply be pushed to arbitrarily long wavelengths.
          You need to know whether “make it brighter” can ever overcome an energy threshold.
        concept: 'The photoelectric effect, and a threshold that is about energy per photon'
        place: Receiver Lab
        scene: >-
          Osgood shines a dim 1550 nm source and a twenty-times-brighter 2000 nm source on the same diode. The
          first produces current. The second produces none.
        guide: >-
          Brightness changes how many photons arrive. Wavelength changes the energy carried by each photon. If
          one photon is below the material threshold needed to free a charge, more photons of the same energy
          do not fix that.
        assumes:
          - a charge is freed by one arrival rather than by several together
        takeaway: A threshold in wavelength is a statement about energy per arrival, so brightness cannot 
          get past it.
        format: CHOICE
        question: Why can the brighter 2000 nm source still produce no current?
        why: >-
          Each arrival at 2000 nanometres carries 0.62 electron volts, and the diode's material needs
          0.75 to free a charge. Brightness is the number of arrivals. Arrivals that individually
          cannot free a charge do not free one between them. So twenty times as many of them still
          gives nothing. That is the whole content of a threshold. It is about the energy of one piece
          of light, which depends only on the wavelength. That is the reason a detector is chosen for
          a band rather than for a power.
        choices:
          - Each arrival carries too little energy to free a charge
          - The longer wavelength is reflected by the diode's coating
          - The diode is too slow to respond at that wavelength
          - Twenty times the brightness is more than the diode can take
        answer: Each arrival carries too little energy to free a charge
        rebuttals:
          - A reflected beam would show as a reduced current rather than none at all.
          - Speed limits how fast a signal can change, and a steady source asks nothing of that.
          - Too much light gives a large current that stops growing, not the absence of one.
      - group: TERM
        task: Predict the wavelength signature of a bend before looking at the real two-colour trace
        title: How would a bend betray itself?
        at: offcut-rack
        reason: >-
          A bend is still one of the main suspects. Unlike a repeater loss, its effect should grow at longer wavelengths
          because the guiding becomes less secure.
        concept: "Snell's law at a boundary"
        place: Cable Termination Room
        person: true
        scene: >-
          Okonkwo, the station chief and cable engineer, gives you fibre offcuts bent around different radii and measured at 1550 and 1625 nm. None is
          physically broken, but tight bends lose light.
        guide: >-
          A bend changes the angle at which rays meet the core-cladding boundary. The tighter the bend, the more
          rays fall below the condition for total internal reflection. Longer wavelengths extend farther into
          the cladding and should be lost first. Match the observations to that mechanism.
        assumes:
          - light stays in a core only while it meets the boundary beyond the critical angle
        takeaway: A bend changes the angle a ray meets the boundary at, so light leaves without anything 
          having been damaged.
        format: CASEBOOK
        scenarios:
          - A gentle bend of 40 mm radius loses almost nothing.
          - A tight bend of 6 mm radius loses 3 dB.
          - The 6 mm case loses more at 1625 nm than at 1550 nm.
          - No light comes back from any of the bends.
        choices:
          - Every ray still meets the boundary beyond the critical angle.
          - On the outside of the bend some rays now meet it inside the critical angle and leave.
          - Longer wavelengths are held less firmly in the core, so they go first wherever the guiding 
            weakens.
          - Nothing here is an abrupt change of index, so there is nothing to reflect from.
        mapping: [0, 1, 2, 3]
        why: >-
          A bend does not damage anything; it changes the angles. On the outside of a tight bend the
          boundary is tilted relative to the rays. Some of them then arrive inside the critical angle
          and refract out instead of reflecting. A gentle bend tilts it too little to matter. Longer
          wavelengths spread further into the cladding and so leave first, which is exactly the test
          that separates a bend from a break. And a bend has no index step anywhere in it, so nothing
          comes back — which is the other half of the same test.
  # ---------------------------------------------------------------- day 9
  - title: Make the replacement ready
    objective: Prove the replacement housing can be inspected safely and finish the pump physics needed for 
      the repeater hypothesis.
    briefing: If repeater 6 is the fault, identifying it is not enough. The ship must have a replacement 
      housing that is cleared to go underwater.
    stake: >-
      T−4 days. The replacement housing needs an X-ray inspection, but the radioactive source is eight months
      old and much weaker than when it was installed. Work out its present activity, the safe distance for the
      exposure, and what happens to the excess energy in the repeater's pump process.
    takeaway: The same exponential physics that weakens a beam through matter also sets the schedule of a 
      radioactive source.
    segue: >-
      The replacement housing passes its inspection. Meier's two-wavelength result is also back: the fault loses
      the same amount at 1550 and 1625 nm. That is a powerful clue against a bend or crush. Two things remain
      before you can sign the order: the exact seabed position and a direct test of the repeater.
    stops:
      - group: RAD
        task: Use half-life to find the source activity after 243 days
        title: How strong is the X-ray source now?
        at: source-pot
        reason: >-
          The replacement housing cannot be cleared until Farouk knows how much radiation the eight-month-old
          source is producing now, not when it was new.
        concept: 'Half-life, and the schedule it puts on a source'
        takesAsRead:
          - Radioactive decay as a random process with a fixed chance
        place: Radiography Bay
        scene: >-
          The source was renewed 243 days ago and has a half-life of 73.8 days. The exposure schedule has been
          getting longer ever since.
        guide: >-
          Convert the half-life to a decay constant or count the number of half-lives elapsed. Both routes must
          give the same remaining fraction. Then use that fraction to understand why the exposure time has grown.
        background:
          - >-
            Why the two forms agree. e to the minus the constant times the time, and two to the minus
            the number of half-lives, are the same function written in different bases. The logarithm
            of two is the conversion between them. Being able to move between them is what makes a
            decay estimable in the head.
          - >-
            Why the exposure factor is the reciprocal. A film needs a certain number of arrivals
            whatever the rate they come at, so a source a tenth as strong needs ten times as long. Both
            factors multiply: a tenth of the source and seven per cent through the steel is a hundred
            and forty times a bare film's exposure.
          - >-
            What the date beyond which is. At 73.8 days a half-life, this source loses another half
            every two and a half months, and the bay's working day sets a ceiling on the exposure. That
            ceiling arrives about eleven months in, which is why the renewal interval is what it is
            rather than being a matter of policy.
        assumes:
          - each nucleus has a fixed chance of decaying in the next second, whatever its history
        takeaway: A decay constant and a half-life are the same fact, and a source's schedule follows from 
          either.
        format: DERIVE
        question: What fraction of the source's original activity remains after 243 days?
        answerText: >-
          About 10 per cent. The constant is ln2/73.8 = 0.00939 a day, so the fraction is e^(−2.28),
          and 243 days is 3.29 half-lives.
        why: >-
          About a tenth is left. The decay constant is the logarithm of two divided by the half-life,
          which is 0.00939 per day. The fraction remaining is e to the minus that times 243 days.
          The check is the other route: 243 days is 3.29 half-lives, and two to the minus 3.29 is the
          same 0.102. Both are the same statement about a nucleus having a fixed chance of decaying
          per second, and neither depends on how much source there was to start with.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: A = A₀·e^(−λt),  λ = ln2/T½
          startNote: T½ = 73.8 days, t = 243 days since renewal
          goal: the fraction of the original activity left, and the factor on the exposure
          askRule: true
          rules:
            - the decay constant from the half-life
            - exponential decay
            - counting half-lives
            - the exposure a film needs
            - rearrangement
          steps:
            - ask: Get the decay constant.
              answer: 0
              candidates:
                - text: λ = ln2/T½ = 0.693 ÷ 73.8 = 0.00939 per day
                  rule: the decay constant from the half-life
                - text: λ = T½/ln2 = 73.8 ÷ 0.693 = 106.5 days
                  rule: rearrangement
                  why: >-
                    Inverted. A decay constant is a chance per unit time, so its units are per day
                    rather than days.
                - text: λ = 1/T½ = 0.01355 per day
                  rule: the decay constant from the half-life
                  survives: true
                  why: >-
                    The logarithm of two left out. It is 44 per cent high, its units are right, and it
                    is the constant for a fall by a factor of e rather than by two.
                - text: λ = 2/T½ = 0.0271 per day
                  rule: rearrangement
                  why: >-
                    A factor of two where its logarithm belongs, which is the same confusion as a
                    half-value thickness against a mean free path.
            - ask: Get the fraction left.
              answer: 2
              candidates:
                - text: e^(−0.00939 × 243) = e^(−2.28) = 10.2
                  rule: exponential decay
                  why: >-
                    A fraction cannot exceed one. The exponential of a negative number has been
                    evaluated as though the sign were positive.
                - text: 1 − 0.00939 × 243 = −1.28
                  rule: rearrangement
                  survives: true
                  why: >-
                    The exponential replaced by its first two terms, which is a fair approximation for
                    small exponents and useless at 2.28 — and here it returns a negative fraction,
                    which at least announces itself.
                - text: e^(−0.00939 × 243) = e^(−2.28) = 0.102
                  rule: exponential decay
                - text: e^(−0.00939 ÷ 243) = 0.99996
                  rule: rearrangement
                  why: >-
                    Divided rather than multiplied. It says the source has lost nothing in eight
                    months, which is the answer somebody would like.
            - ask: Check it by counting half-lives.
              answer: 1
              candidates:
                - text: 243 ÷ 73.8 = 3.29, and 3.29 halvings is 1/3.29 = 0.30
                  rule: counting half-lives
                  why: >-
                    Halvings multiply rather than divide: three of them is an eighth, not a third.
                - text: 243 ÷ 73.8 = 3.29, and 2⁻³·²⁹ = 0.102
                  rule: counting half-lives
                - text: 243 ÷ 73.8 = 3.29, and 2⁻³ = 0.125
                  rule: counting half-lives
                  survives: true
                  why: >-
                    The count rounded down to a whole number of halvings. It is 23 per cent high and it
                    is the version anybody does in their head, which is fine as an estimate and not as
                    a check on an exponential.
                - text: 73.8 ÷ 243 = 0.304 half-lives
                  rule: rearrangement
                  why: >-
                    Inverted. Eight months is more than one half-life, not a third of one.
            - ask: Say what that does to the exposure.
              answer: 3
              candidates:
                - text: the exposure falls by a tenth, since less is arriving
                  rule: the exposure a film needs
                  why: >-
                    A film needs a fixed number of arrivals, so a weaker source needs longer rather
                    than shorter.
                - text: the exposure is unchanged, since the film's sensitivity has not altered
                  rule: the exposure a film needs
                  survives: true
                  why: >-
                    The sensitivity has not altered and the arrival rate has. What is fixed is the
                    number of arrivals the film needs, which is a rate times a time.
                - text: the exposure grows by ln2, since that is the decay constant's factor
                  rule: rearrangement
                  why: >-
                    The logarithm of two is a conversion between two ways of writing the decay, not a
                    factor on anything physical.
                - text: the exposure grows by ten, the reciprocal of what is left
                  rule: the exposure a film needs
          commit: Commit the derivation
      - group: RAD
        task: Set today's radiation barrier using the inverse-square law
        title: How far back is safe?
        at: survey-meter
        reason: >-
          Farouk can make the longer exposure, but everyone else needs to know where the safe boundary is while
          the source is out.
        concept: 'The inverse-square fall of intensity from a small source'
        takesAsRead:
          - Radioactive decay as a random process with a fixed chance
        place: Radiography Bay
        person: true
        scene: >-
          Whitlock, the radiation safety officer, gives you the measured dose rate at 2.0 m and the allowed dose rate at the barrier. The source
          is small enough to treat as spreading in all directions.
        guide: >-
          For a point-like source, intensity falls as 1/r². To reduce a rate by a factor, the distance grows by
          the square root of that factor. Do not put exposure time into a dose-rate calculation.
        assumes:
          - a small source spreads its output evenly over a sphere
        takeaway: Intensity from a small source falls as the square of distance, so the barrier is set by a 
          square root rather than by a ratio.
        format: BALLPARK
        question: How far from the source should today's safety barrier be?
        estimate:
          prompt: >-
            The bay is opened only when the boundary rate is inside the limit. This is measured at two
            metres, and the limit is what a person outside may receive.
          question: How far back does the barrier go for today's exposure?
          relationship: >-
            Distance needed = the measured distance × the square root of the measured rate divided by
            the limit.
          labels:
            - 2.0 m  (distance the rate was measured at)
            - 640 µSv/h  (the rate at that distance)
            - 7.5 µSv/h  (the limit at the boundary)
            - 126 min  (today's exposure time)
          values: [2.0, 640, 7.5, 126]
          slots: 3
          template: '{0} × root of ({1} ÷ {2})'
          formula: a*Math.sqrt(b/c)
          correct: [0, 1, 2]
          target: 18.5
          tolerance: 0.8
          units: m
          solution: 2.0 × √(640 ÷ 7.5) = 2.0 × 9.24 = 18.5 m.
          explanation: >-
            The exposure time changes the total dose somebody would receive and not the rate at the
            boundary, so it does not enter this arithmetic. Dividing the rates without taking the root
            gives 171 metres, which is off the site.
        why: >-
          The barrier goes to about 18.5 metres. Intensity from a small source falls as the inverse
          square of the distance. So reducing a rate by a factor of 85 needs a distance greater by the
          square root of 85, which is 9.2. That is why distance is the cheap answer to a strong source
          and lead is the expensive one. It is also why a collimated beam breaks the arithmetic
          entirely. A beam that has been aimed is not spreading over a sphere.
      - group: AMP
        task: Use photon energy and atomic levels to understand the amplifier's quantum defect
        title: Where does the pump's extra energy go?
        reason: >-
          Tanaka is preparing a numerical prediction for the spare-pump test. Before that, she wants the energy
          bookkeeping of one pump photon and one added signal photon to be explicit.
        concept: 'The quantum defect, and where the pump energy goes'
        place: Amplifier and Power Hall
        scene: >-
          A pump photon at 980 nm carries more energy than a 1550 nm signal photon. In the erbium, the atom first
          relaxes from the pumped level to the long-lived level used for amplification.
        guide: >-
          Energy is conserved. The amplifier cannot simply make the energy difference disappear. Ask where the
          atom puts the part of the pump-photon energy that is not carried away by the added 1550 nm signal photon.
        assumes:
          - an excited atom can be made to release its energy into a passing wave
        takeaway: A pump arrival is more energetic than the signal arrival it produces, and the difference 
          has to leave as heat.
        format: CHOICE
        question: When one 980 nm pump photon ultimately supports one added 1550 nm signal photon, where 
          does the excess energy go?
        why: >-
          It ends up as heat in the glass. A pump arrival at 980 nanometres carries 1.27 electron
          volts. It lifts an erbium atom to a state it drops from, quickly and silently, to the level
          the signal works from. That drop is 0.47 electron volts that never becomes light. What
          is conserved is the count: one pump arrival can produce at most one signal arrival. That
          ceiling is what sets an amplifier's maximum output at the pump power times the ratio of the
          two wavelengths, whatever else is done to it.
        choices:
          - It becomes heat in the glass as the atom settles to the working level
          - It becomes a second signal arrival, so one pump gives two
          - It is stored in the fibre and released when the pump is switched off
          - It leaves as a shorter-wavelength arrival alongside the signal
        answer: It becomes heat in the glass as the atom settles to the working level
        rebuttals:
          - The difference is 37 per cent of one arrival, and a second arrival would need 100 per cent.
          - An excited state lasts milliseconds, so nothing is stored for later use.
          - The atom's levels decide what wavelengths can leave, and there is no level for that one.
  # ---------------------------------------------------------------- day 10
  - title: Where exactly should the ship go?
    objective: Turn the optical distance into a real route position, then predict and measure what the spare
      pump should do.
    briefing: The captain can act on a place, not “84.6 kilometres of glass.” Today you correct the number 
      and test the repeater from shore.
    stake: >-
      T−3 days. The old trace says 84.6 km, but the pulse speed, the fibre wound inside the cable and the slack
      laid on the seabed all move the real position. Correct all three. Then lock a prediction for the spare-pump
      switch before Tanaka makes the one live intervention available from shore.
    takeaway: A measurement becomes a repair position only after every conversion between instrument, fibre,
      cable and route has been made.
    segue: >-
      The target moves to 82.9 km along the route—1.7 km away from the number printed by the old trace.
      Then the spare pump restores 3.6 dB. The repeater hypothesis now has a direct success, but on day 11
      it still has to survive every other record on the table.
    stops:
      - group: TEST
        task: Apply the group-index, fibre-in-cable and slack corrections to the old trace distance
        title: Turn 84.6 km into a real seabed position
        at: otdr
        reason: >-
          The captain needs a position along the route. The old 84.6 km number is a distance along glass calculated
          with the wrong pulse index, and the glass itself is longer than the path on the seabed.
        concept: 'A measurement in an instrument’s own units, and what converts it'
        place: Test Room
        scene: >-
          Three small corrections are now known: the pulse uses group index 1.4718 rather than core index 1.4682;
          there is 0.3 per cent more fibre than cable; and the laid cable has 1.5 per cent slack compared with
          the route.
        guide: >-
          Decide the direction of each correction before calculating. A larger group index means the pulse travelled
          more slowly and therefore not as far. More fibre than cable and more cable than route both mean the
          route distance is shorter than the glass distance.
        background:
          - >-
            Why the group index is the right one. A pulse is a band of wavelengths, and what travels at
            c over the core's index is a single wavelength. The pulse — the thing whose arrival is
            timed — travels a little more slowly, at c over the group index. So the same delay
            corresponds to a slightly shorter distance.
          - >-
            Why the fibre is longer than the cable. The fibres are laid up helically round the cable's
            core so that bending the cable does not stretch them. So a metre of cable contains
            slightly more than a metre of fibre. It is a fixed property of the cable's construction and
            it is on the maker's data sheet.
          - >-
            Why the slack is the largest term and the least certain. A cable is paid out faster than
            the ship advances so that it lies on the bottom rather than bridging the high spots. 1.5
            per cent over 84 kilometres is 1.25 kilometres. It is an average over a route whose slack
            was not uniform. That is exactly why Okonkwo will not offer a position without a tolerance
            on it.
        assumes:
          - a cable laid with slack is longer than the route it lies along
        takeaway: Three ratios separate an optical distance from a position, and all three have to be 
          applied with their own signs.
        format: DERIVE
        question: After all three corrections, where along the seabed route is the event?
        answerText: >-
          About 82.9 km — 1.7 km closer than the trace says. The group index takes off 207 m, the
          helix 0.3 per cent and the slack 1.5 per cent.
        why: >-
          The event is about 82.9 kilometres along the route, 1.7 kilometres closer than the old trace reads.
          The core index made the pulse seem 207 metres too far away. The helical fibre inside the cable shortens
          the cable distance again, and the slack laid on the seabed shortens the route distance again. A 1.7
          km shift is not a small bookkeeping correction when the ship has one day to lift the right section of
          cable; it changes where the repair attempt happens.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: d_route = d_optical × (n_core/n_group) ÷ (1 + h) ÷ (1 + s)
          startNote: d_optical = 84.60 km at n = 1.4682; n_group = 1.4718; helix h = 0.003; slack s = 0.015
          goal: the distance along the route, in kilometres
          askRule: true
          rules:
            - the index a pulse travels at
            - the length of fibre in a cable
            - the slack paid out on laying
            - substitution of the stated values
            - rearrangement
          steps:
            - ask: Correct the index the instrument used.
              answer: 1
              candidates:
                - text: 84.60 × (1.4718/1.4682) = 84.81 km
                  rule: the index a pulse travels at
                  survives: true
                  why: >-
                    The ratio the wrong way up. The instrument assumed light was faster than it was, so
                    its distance is too long and the correction has to shorten it. This lengthens it by
                    the same 207 metres.
                - text: 84.60 × (1.4682/1.4718) = 84.39 km
                  rule: the index a pulse travels at
                - text: 84.60 × 1.4718 = 124.5 km
                  rule: rearrangement
                  why: >-
                    An index applied to a distance that already has one in it. The correction is a ratio
                    of two indices, both nearly 1.47, so it can only be a fraction of a per cent.
                - text: 84.60 km, since the difference is in the third decimal place
                  rule: the index a pulse travels at
                  why: >-
                    The difference in the indices is only a few tenths of a per cent, but over 84 kilometres that
                    is about 207 metres. Small fractional errors become real distances on a long cable.
            - ask: Take out the extra fibre in the cable.
              answer: 3
              candidates:
                - text: 84.39 × 1.003 = 84.64 km
                  rule: the length of fibre in a cable
                  survives: true
                  why: >-
                    Multiplied. There is more fibre than cable, so a length of fibre corresponds to a
                    shorter length of cable, and the correction divides. The size is right and the sign
                    puts the answer 500 metres the wrong way.
                - text: 84.39 − 0.003 = 84.39 km
                  rule: rearrangement
                  why: >-
                    A ratio subtracted as though it were a length. Three thousandths of a kilometre is
                    three metres and the correction is 253.
                - text: 84.39 ÷ 0.003 = 28,130 km
                  rule: rearrangement
                  why: >-
                    Divided by the excess rather than by one plus it. Twenty-eight thousand kilometres
                    is most of the way round the earth.
                - text: 84.39 ÷ 1.003 = 84.14 km
                  rule: the length of fibre in a cable
            - ask: Take out the slack.
              answer: 0
              candidates:
                - text: 84.14 ÷ 1.015 = 82.90 km
                  rule: the slack paid out on laying
                - text: 84.14 × 0.985 = 82.88 km
                  rule: the slack paid out on laying
                  survives: true
                  why: >-
                    Multiplying by one minus the fraction rather than dividing by one plus it. The two
                    agree to twenty metres here and diverge as the fraction grows, and the second is
                    not what slack means.
                - text: 84.14 × 1.015 = 85.40 km
                  rule: rearrangement
                  why: >-
                    Multiplied. Slack makes the cable longer than the route, so the route is shorter
                    than the cable.
                - text: 84.14 − 1.5 = 82.64 km
                  rule: rearrangement
                  why: >-
                    A percentage subtracted as though it were kilometres. It is close to the right
                    answer by coincidence, because 1.5 per cent of 84 is 1.26.
            - ask: Decide whether the full 1.7 km correction is small enough to ignore.
              answer: 2
              candidates:
                - text: Yes. 1.7 km is small compared with an 84.6 km span.
                  rule: substitution of the stated values
                  why: >-
                    The comparison that matters is not the total span length; it is whether the ship would work
                    on the same section of seabed. A 1.7 km shift changes the target.
                - text: Yes. Only the 0.21 km index correction is physically real.
                  rule: substitution of the stated values
                  survives: true
                  why: >-
                    The fibre-in-cable and slack corrections are physical lengths too. Ignoring them confuses
                    optical path length with route length.
                - text: No. A 1.7 km shift changes the section of seabed the ship would lift, so the 
                    position must be corrected.
                  rule: substitution of the stated values
                - text: No. The correction is 2.7 km because the three percentage corrections should be 
                    added as kilometres.
                  rule: rearrangement
                  why: >-
                    The three effects are ratios applied to the distance, not kilometre amounts to add. Applying
                    them gives 82.9 km, a 1.7 km shift.
          commit: Commit the derivation
      - group: AMP
        task: Write down the expected power change before switching repeater 6 to its unused spare pump
        title: Predict the spare-pump test
        at: pump-panel
        reason: >-
          A pump switch can directly test the repeater hypothesis from shore, but only if the predicted result
          is committed before anyone sees what happens.
        concept: 'Predicting, then measuring what was predicted'
        place: Amplifier and Power Hall
        scene: >-
          Tanaka has permission for one switch to repeater 6's unused spare pump. Duarte has the received-power
          meter live at the far end.
        guide: >-
          First commit the rise expected if the old pump is responsible for most of the 4.1 dB event. Then make
          the switch and read the independent power meter. The relay changing state is not evidence that optical
          power changed; the meter is.
        assumes:
          - an amplifier's gain follows the optical power of its pump
        takeaway: A prediction locked before an intervention is a test of the model; the same number chosen 
          afterwards is a description of the outcome.
        format: VERIFY
        question: What rise should the pump hypothesis predict, and what does the receiver actually measure 
          after the switch?
        verify:
          hint: >-
            Lock the prediction first. The switch can be made without measuring anything, and a
            confirmed switch says the relay works rather than what the pump is doing.
          prediction: {label: Predicted rise in received power, unit: dB, min: 0, max: 7, step: 0.2}
          truth: 3.6
          passRatio: [0.6, 1.6]
          intervention:
            label: The spare pump in repeater 6
            note: Switched from shore, once. The original pump cannot be switched back to from here.
            outcome: Switch confirmed by telemetry. Pump current on the spare within 2 per cent of nominal.
          measurement:
            label: The receiver's power meter
            note: Averaged over ten minutes, against the reading taken before the switch.
            cost: 1
            costUnit: switch windows
          unmeasuredMoral: >-
            The relay operated and the spare drew its current. Nothing in that sequence establishes
            that any more light is arriving at this building.
          commit: Report the change in received power
        answerText: >-
          About 3.6 dB — but only the power meter establishes it. A confirmed switch is a confirmed
          switch and nothing else.
        why: >-
          The received power rises about 3.6 decibels. An amplifier's gain follows its pump's optical
          power. A pump that has aged puts out less at the same current. If the original is down to
          40 per cent of the 118 milliwatts it was logged at, a fresh one restores a factor of two
          and a half. That is 4 decibels of gain, less what the amplifier itself gives back. That is
          most of the 4.1 decibels the span lost. The failure specific to this decision is finishing
          without measuring: the telemetry will confirm the switch whatever the light does.
      - group: RECV
        task: Reconcile the wave measurements used for wavelength with the photon counts used for received 
          power
        title: Why does light need two descriptions?
        reason: >-
          The repair case now depends on both kinds of evidence. Duarte wants you to be clear that an interference
          pattern and individual detector clicks are not competing claims about two different kinds of light.
        concept: 'Wave–particle duality, and which description a measurement needs'
        place: Receiver Lab
        person: true
        scene: >-
          One instrument measures an interference pattern; another detects individual photon arrivals. Both are
          looking at the same fibre at the same time.
        guide: >-
          Different measurements expose different aspects of the same quantum object. Use the wave picture for
          phase and interference; use the photon picture for discrete detection and counting noise. Do not force
          one picture to answer a question it was not built for.
        assumes:
          - a description of light is chosen for a measurement rather than for all time
        takeaway: A model is chosen for a purpose, and two incompatible-looking pictures can both be needed 
          on one bench.
        format: CHOICE
        question: How should the wave pattern and the individual photon detections be understood together?
        why: >-
          Each measurement needs the description that fits what it does. The interference pattern
          exists because two paths recombine with a path difference, which is a statement about a
          wave. The arrivals are counted one at a time on a diode, which is a statement about quanta.
          Both are true of the same light on the same fibre. What is not available is a picture in
          which light is only one of them. A receiver's design needs both at once: a wavelength to be
          filtered, and a count to set the error floor.
        choices:
          - Each measurement needs the description that fits what it measures
          - Light is a wave, and the counting is an artefact of the diode
          - Light is a stream of particles, and the pattern is a statistical accident
          - The two instruments disagree, so one of them is faulty
        answer: Each measurement needs the description that fits what it measures
        rebuttals:
          - The counting is reproducible on any detector and its scatter follows the count, not the diode.
          - A pattern with fringes in known places is not an accident of statistics; it is where the paths 
            differ.
          - Both instruments give repeatable results on the same fibre, which is not what disagreement looks
            like.
  # ---------------------------------------------------------------- day 11
  - title: Make one diagnosis fit every clue
    objective: Check whether an aging pump can explain the size of the loss, then force one cause to account
      for every measurement.
    briefing: The spare pump restored most of the missing signal. That is strong evidence, but the final 
      diagnosis has to explain the quiet records too.
    stake: >-
      T−2 days. The two colours lost the same amount, the power feed stayed normal, and the spare pump returned
      3.6 dB. Now use the quantum physics of the amplifier to see whether an aging pump can produce the right
      scale of loss, then test all four suspects against all four records.
    takeaway: A diagnosis wins only when it explains the full pattern of evidence, including the 
      measurements that did not change.
    segue: >-
      Only one cause survives every clue: repeater 6's pump has aged. You also have its corrected position
      at 82.9 km and a replacement housing ready to sail. On day 12, close the numbers one last time and
      sign the repair order the captain will follow.
    stops:
      - group: AMP
        task: Put a physics upper bound on the signal power that the original pump could support
        title: Could an old pump explain 4.1 dB?
        at: amp-desk
        reason: >-
          The spare pump restored 3.6 dB. Before calling that the cause, Tanaka wants to know whether the size
          of the change is even compatible with the energy and photon-count limits of the amplifier.
        concept: 'Stimulated emission, population inversion and gain'
        takesAsRead:
          - Atomic energy levels, and the wavelengths they allow
        place: Amplifier and Power Hall
        scene: >-
          Repeater 6's pump was logged at 118 mW when installed and is inferred to be near 46 mW now. The pump
          wavelength is 980 nm and the signal is 1550 nm.
        guide: >-
          Use a deliberately conservative upper bound: one absorbed pump photon can create at most one added signal
          photon in this simplified model. Because the signal photon has less energy, the maximum signal power
          is pump power times E_signal/E_pump = λ_pump/λ_signal. The remaining pump energy is not lost; it leaves
          mainly as heat during relaxation.
        background:
          - >-
            Why the ceiling is a ratio of wavelengths. A pump arrival at 980 nanometres carries hc over
            980; a signal arrival carries hc over 1550. So the same number of arrivals a second carries
            980 over 1550 as much power, which is 0.632. 118 milliwatts of pump can therefore add at
            most 74.6 milliwatts of signal.
          - >-
            Why nothing gets past it. Every route from pump to signal goes through one excited atom
            releasing one arrival. There is no mechanism in this glass by which one pump arrival
            produces two signal arrivals. So the ceiling is a statement about counting rather than
            about engineering. A better amplifier design approaches it rather than exceeding it.
          - >-
            What it says about repeater 6. A pump down to 46 milliwatts has a ceiling of 29 milliwatts
            against the original's 74.6. That is 4.1 decibels of gain lost. It is the number the span
            lost in one night, arrived at from the pump's own physics rather than from the trace. That
            is the end of the fortnight's argument.
        assumes:
          - each pump arrival can produce at most one signal arrival
        takeaway: In this amplifier model, one absorbed pump photon can create at most one added signal 
          photon; energy is conserved, and the excess pump-photon energy leaves mainly as heat.
        format: DERIVE
        question: Using the one-pump-photon/one-added-signal-photon upper bound, how much signal power can 
          118 mW of pump support?
        answerText: >-
          About 74.6 mW under the one-pump-photon/one-added-signal-photon upper bound: 118 × 980/1550. If the
          pump has fallen to 46 mW, the same ceiling falls to about 29.1 mW, a 4.1 dB change.
        why: >-
          At 980 nm a pump photon carries more energy than a 1550 nm signal photon. In the simplified erbium-cycle
          bookkeeping used here, each absorbed pump photon can populate the amplifier for at most one added signal
          photon. So the signal-photon rate cannot exceed the absorbed pump-photon rate, and the corresponding
          signal-power ceiling is P_pump × E_signal/E_pump = P_pump × 980/1550. For 118 mW that is 74.6 mW; for
          46 mW it is 29.1 mW. The ratio of those ceilings is 4.1 dB. Energy is still conserved: the part of each
          pump photon not carried by the 1550 nm signal leaves mainly as heat when the erbium relaxes to the working
          level.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: P_signal ≤ P_pump × (E_signal/E_pump)
          startNote: pump 980 nm, signal 1550 nm, pump power as logged 118 mW; suspected now 46 mW
          goal: the ceiling on added signal power, in milliwatts, and the loss if the pump has fallen
          askRule: true
          rules:
            - one arrival for one arrival
            - the energy of a photon
            - conversion to decibels
            - substitution of the stated values
            - rearrangement
          steps:
            - ask: Write the ratio of the two arrival energies.
              answer: 2
              candidates:
                - text: E_signal/E_pump = 1550/980 = 1.582
                  rule: the energy of a photon
                  survives: true
                  why: >-
                    The wavelengths in the ratio the same way round as the energies, when energy goes
                    inversely with wavelength. It gives a ceiling above the pump power, which is a
                    machine that makes energy.
                - text: E_signal/E_pump = (1550/980)² = 2.50
                  rule: rearrangement
                  why: >-
                    Energy goes as one over the wavelength, not one over its square. There is no square
                    anywhere in this relation.
                - text: E_signal/E_pump = 980/1550 = 0.632
                  rule: the energy of a photon
                - text: E_signal/E_pump = 1550 − 980 = 570 nm
                  rule: rearrangement
                  why: >-
                    A difference of wavelengths is a wavelength, not a ratio of energies. It is the
                    quantum defect expressed in the least useful unit available.
            - ask: Apply the one-for-one ceiling.
              answer: 0
              candidates:
                - text: P_signal ≤ 118 × 0.632 = 74.6 mW
                  rule: one arrival for one arrival
                - text: P_signal ≤ 118 mW, since energy is conserved
                  rule: rearrangement
                  survives: true
                  why: >-
                    Energy is conserved and the ceiling is tighter than that: the surplus 37 per cent
                    cannot leave as signal light because there is no level for it to come from. The
                    bound is real and this one is merely true.
                - text: P_signal ≤ 118 ÷ 0.632 = 187 mW
                  rule: rearrangement
                  why: >-
                    Divided, which puts more power out than in. The same slip as the inverted ratio,
                    arriving one line later.
                - text: P_signal ≤ 118 × 2 = 236 mW, two signal arrivals per pump arrival
                  rule: one arrival for one arrival
                  why: >-
                    Nothing in this glass produces two arrivals from one. That would need the pump
                    arrival to carry twice the signal energy, and it carries 1.58 times it.
            - ask: Apply the same ceiling to a pump at 46 mW.
              answer: 3
              candidates:
                - text: 46 × 0.632 = 29.1 mW, so the ceiling has fallen by 45 mW
                  rule: substitution of the stated values
                  survives: true
                  why: >-
                    Right arithmetic, and the difference reported as a power rather than as a ratio. A
                    span's loss is a ratio, and 45 milliwatts means nothing until it is one.
                - text: 46 × 1.582 = 72.8 mW, barely changed
                  rule: rearrangement
                  why: >-
                    The inverted ratio again, and it happens to give almost the original ceiling — which
                    would say a pump can fall by 60 per cent with no effect at all.
                - text: 46 mW, since the ceiling is set by the wavelengths rather than the power
                  rule: one arrival for one arrival
                  why: >-
                    The wavelengths set the ratio and the pump power sets the size. Both are in the
                    expression.
                - text: 46 × 0.632 = 29.1 mW
                  rule: substitution of the stated values
            - ask: Put the two ceilings into decibels.
              answer: 1
              candidates:
                - text: 74.6 − 29.1 = 45.5 dB
                  rule: conversion to decibels
                  why: >-
                    A difference of powers in milliwatts reported as decibels. Decibels come from a
                    ratio through a logarithm.
                - text: 10·log₁₀(74.6/29.1) = 4.1 dB
                  rule: conversion to decibels
                - text: 20·log₁₀(74.6/29.1) = 8.2 dB
                  rule: conversion to decibels
                  survives: true
                  why: >-
                    The factor of twenty, which belongs to amplitudes. These are powers, and the answer
                    is exactly twice the loss the span actually saw — which would send everybody looking
                    for a second fault.
                - text: 10·log₁₀(29.1/74.6) = −4.1 dB, a gain
                  rule: rearrangement
                  why: >-
                    The size is right and the sign makes a loss into a gain. The span lost light; the
                    ratio has to be written the way that says so.
          commit: Commit the derivation
      - group: TEST
        task: Force each suspect to explain all four records, not just the dramatic 4.1 dB step
        title: Which cause fits every clue?
        at: trace-table
        reason: >-
          This is the diagnosis the ship will act on. A cause that explains one measurement but contradicts another
          cannot be the repair target.
        concept: 'Which of several candidate causes a signature can tell apart'
        place: Test Room
        scene: >-
          Sarraf lays out the four decisive records. A 4.1 dB step. Equal loss at 1550 and 1625 nm. Normal
          power-feed telemetry. And a 3.6 dB recovery after the switch to the spare pump.
        guide: >-
          Test every suspect against every record. A bend or crush should be more wavelength-dependent. A dried
          joint should reflect. A pump failure can leave the electrical feed normal, affect both wavelengths similarly,
          and respond immediately to a spare-pump switch.
        assumes:
          - a bend loses more at longer wavelengths and an amplifier's gain does not
        takeaway: A cause has to account for the quiet records as well as the loud one, and the quiet ones 
          are usually what rule the others out.
        format: DIAGNOSIS
        headline: The span lost 4.1 dB in a night and a spare pump gave 3.6 of it back.
        readings:
          - {zone: Trace, label: Step at 84.6 km, value: 4.1 dB, status: alarm}
          - {zone: Two wavelengths, label: "Loss at 1625 nm against 1550", value: the same, status: normal}
          - {zone: Power feed, label: Voltage and current, value: as designed, status: normal}
          - {zone: After the switch, label: Received power, value: up 3.6 dB, status: alarm}
        choices:
          - {label: A bend in the cable at that point, mechanism: Light leaves the core where the fibre is 
              tightly curved.}
          - {label: A dried mechanical joint, mechanism: The gel has gone and the joint has become a lossy 
              step in index.}
          - {label: The pump in repeater 6 has aged, mechanism: "Less pump power means less gain, at both wavelengths
              equally."}
          - {label: The cable has been damaged by fishing gear, mechanism: Crushing loses light over a 
              length of fibre.}
        answer: The pump in repeater 6 has aged
        why: >-
          Three of the four records point the same way once the quiet ones are read. A bend and a crush
          both lose more at 1625 nanometres than at 1550. The comparison shows the same loss at both.
          That rules out anything that works by light leaving the core. A dried joint would have put a
          reflection on the step, and would not have been mended by switching a pump three kilometres
          further out. The pump's decline accounts for a loss equal at both wavelengths, at the
          position of the repeater, with the feed in order. It also accounts for 3.6 of the 4.1
          decibels coming back when a fresh pump was switched in.
        question: Which single cause is consistent with all four records?
      - group: SPLICE
        task: Verify the physics behind the two-wavelength comparison that helped rule out fibre damage
        title: How did the instrument separate two colours?
        reason: >-
          The equal-loss result is one of the strongest clues in the case. Before it goes into the final report,
          Ramnarine asks how the instrument measured two wavelengths separately without taking two different runs.
        concept: 'Diffraction, and what a grating does to a mixture of wavelengths'
        place: Splice Trailer
        person: true
        scene: >-
          Inside the test head is a ruled glass plate—a diffraction grating. Both wavelengths enter together and
          land at different places on the detector.
        guide: >-
          A grating does not destroy one colour to select the other. Waves from its many grooves interfere constructively
          in directions that depend on wavelength, so different colours leave at different angles and can be recorded
          at the same time.
        assumes:
          - waves from many evenly spaced sources reinforce only in particular directions
        takeaway: Separating a mixture and selecting one part of it are different operations with different 
          costs.
        format: CHOICE
        question: How does a diffraction grating send two incoming wavelengths to different places on the 
          detector?
        why: >-
          Light from each of the grating's many lines travels a slightly different distance to any
          given direction. The directions where all of them reinforce depend on the wavelength.
          So each wavelength leaves at its own angle, and the two arrive at different places on a
          detector: separation rather than selection. A filter would pass one and throw the other
          away. That is a different instrument and a different measurement. You would have to make it
          twice and hope nothing changed in between.
        choices:
          - Each wavelength reinforces in a different direction
          - It absorbs one wavelength and passes the other
          - It reflects the shorter wavelength and transmits the longer
          - It slows one wavelength more than the other and separates them in time
        answer: Each wavelength reinforces in a different direction
        rebuttals:
          - An absorbing filter selects one and destroys the other, so the comparison would need two runs.
          - A mirror that reflected by colour would still have to send them somewhere, and a grating is what
            does that.
          - Separating in time is dispersion, and over a plate a few millimetres wide it is unmeasurable.
  # ---------------------------------------------------------------- day 12
  - title: Give the captain one repair order
    objective: Confirm the replacement is safe, close the loss budget, and commit to one object at one 
      place.
    briefing: The ship sails at dawn into a one-day weather window. It does not need another pile of 
      evidence. It needs one clear instruction.
    stake: >-
      T−1 day. Before the sea closes, the captain needs a target and a position. Verify the last piece of replacement-hardware
      physics, close the remaining half-decibel in the budget honestly, and then choose the single repair order
      that all twelve days of evidence support.
    takeaway: 'The purpose of the measurements is a decision: the right object, at the right place, for the one
      repair attempt.'
    stops:
      - group: RAD
        task: Confirm what changes as a radioactive source gets older and what stays fixed
        title: Why the X-ray energies do not age
        reason: >-
          The replacement housing has passed its radiograph. Before it is loaded, Farouk wants the last safety
          point clear: the source became weaker with age, but the energy of each emitted gamma ray did not.
        concept: 'Radioactive decay as a random process with a fixed chance'
        takesAsRead:
          - The nucleus, and the binding energy that holds it
        place: Radiography Bay
        person: true
        scene: >-
          Farouk compares today's spectrum with the spectrum from when the source was new. The two gamma-ray energies
          are in exactly the same places, even though the count rate is only about a tenth as large.
        guide: >-
          Separate properties of one nucleus from properties of the whole sample. The energy levels and decay
          probability belong to the isotope. Age changes how many undecayed nuclei remain, so it changes the number
          of emissions per second—not the energy carried by each emission.
        assumes:
          - a nucleus has a set of states with definite energies
        takeaway: A nucleus has fixed levels, so it emits fixed energies; how much is left changes only how 
          often.
        format: CASEBOOK
        scenarios:
          - The two emitted energies are the same as they were eight months ago.
          - The number of emissions a second is a tenth of what it was.
          - The half-life is the same for this pot as for every other pot of the same material.
          - Warming the pot changes nothing about either the energies or the rate.
        choices:
          - The gaps between the nucleus's own states do not change with time.
          - Only the number of nuclei left has changed, and each one behaves as it always did.
          - The chance of decay per second belongs to that kind of nucleus rather than to the sample.
          - Nuclear energies are millions of times larger than anything heat can supply.
        mapping: [0, 1, 2, 3]
        why: >-
          Four observations, one distinction. The energies come from the gaps between the nucleus's
          own states, and nothing available in a radiography bay can alter those. So they are the same
          after eight months and the same when warm. The rate depends on how many nuclei are left,
          which is what has changed. The half-life belongs to that kind of nucleus and not to the pot,
          which is why it can be looked up rather than measured. And heat supplies fractions of an
          electron volt against nuclear energies of hundreds of thousands. That is why a nuclear
          source is the most stable thing on this site.

      - group: TEST
        task: Account for the 4.1 dB event and compute the margin after the spare pump is carrying the 
          signal
        title: Does the loss budget close?
        at: otdr
        reason: >-
          Before you sign the repair order, the pump diagnosis has to explain the size of the event numerically,
          not just point in the right direction.
        concept: Power in decibels, and why a loss budget adds
        place: Test Room
        scene: >-
          Before the failure, fibre plus joints contributed 17.75 dB. The event added 4.1 dB. Switching to the
          spare pump restored 3.6 dB, leaving 0.5 dB of the event in the current measurement.
        guide: >-
          Attribute only what the experiment measured: 3.6 dB of the event is recovered by the pump switch. Carry
          the 0.5 dB residue honestly. Then rebuild the current total and subtract it from the 24 dB receiver
          allowance.
        background:
          - >-
            Why the residue matters more than the total. Half a decibel unaccounted for could be a
            second cause. It could be the amplifier giving slightly less gain at the higher input. It
            could be the measurement. Saying which is what the last two days have been for, and saying
            it is not the same as having no residue at all.
          - >-
            Why the ship still sails. A pump on the seabed cannot be replaced from shore. The spare is
            now the working pump and there is no second spare. So repeater 6 has one failure left in
            it before the span goes down, with the traffic already diverted. That is why a housing has
            been radiographed and is on the deck.
          - >-
            What the chart says now. 82.9 kilometres along the route, at the repeater rather than
            between repeaters, with a tolerance of 400 metres from the slack and 200 from everything
            else. A position and an object, rather than a kilometre and a hope.
        assumes:
          - a budget that closes leaves nothing that needs another cause
        takeaway: A budget closes when every decibel is attributed, and what is left over is either a second
          cause or a measurement.
        format: DERIVE
        question: After the spare-pump switch, how much of the event remains unexplained and how much link 
          margin is left?
        answerText: >-
          The pump accounts for 3.6 of the 4.1 dB event, leaving 0.5 dB. The current total is 18.25 dB, so the
          24 dB allowance leaves 5.75 dB of margin.
        why: >-
          The pump switch directly recovers 3.6 dB, so 0.5 dB of the original 4.1 dB event remains in the measurement.
          The baseline fibre and joints were 16.1 + 1.65 = 17.75 dB. Adding the 0.5 dB residue gives a current
          total of 18.25 dB. Against a 24 dB receiver allowance, that leaves 5.75 dB of margin. The half-decibel
          is not erased; it is recorded as a small residual that does not require a second large fault. The important
          point is that the repeater intervention explains almost all of the sudden event and restores substantial
          operating margin.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: total = span + joints + event
          startNote: span 16.1 dB, joints 1.65 dB, event 4.1 dB, allowance 24 dB, the switch returned 3.6 dB
          goal: the event residue, the current total loss, and the margin after the switch
          askRule: true
          rules:
            - decibels add along a path
            - attributing a term
            - the margin against the allowance
            - substitution of the stated values
            - rearrangement
          steps:
            - ask: Attribute what the switch returned.
              answer: 1
              candidates:
                - text: the switch returned 3.6 dB, so the event was 3.6 dB and the trace was wrong
                  rule: attributing a term
                  survives: true
                  why: >-
                    Two measurements of different things being made to agree by discarding one. The
                    trace measured 4.1 and the switch returned 3.6; both can be right, and the
                    difference is the thing to explain.
                - text: the pump accounts for 3.6 of the 4.1, leaving 0.5 dB
                  rule: attributing a term
                - text: the pump accounts for all 4.1, since it is the only cause found
                  rule: attributing a term
                  why: >-
                    Being the only cause found is not the same as accounting for the whole figure. The
                    half decibel is either explained or recorded.
                - text: the pump accounts for 3.6 and the joints for the other 0.5
                  rule: rearrangement
                  why: >-
                    The joints were in the budget before the event and have not changed. Attributing
                    part of a new loss to a term that was already counted is double counting.
            - ask: Restate the total.
              answer: 3
              candidates:
                - text: 16.1 + 1.65 + 4.1 − 3.6 = 18.25 dB
                  rule: rearrangement
                  survives: true
                  why: >-
                    The switch's 3.6 subtracted from the whole budget rather than from the event. It
                    arrives at the right number by a route that would give the wrong one as soon as
                    any other term moved.
                - text: 16.1 + 1.65 + 3.6 = 21.35 dB, taking the returned figure as the event
                  rule: decibels add along a path
                  why: >-
                    The returned figure put in as the event, when what remains after the switch is the
                    part that did not come back.
                - text: 16.1 + 1.65 = 17.75 dB, the budget as it stood before the event
                  rule: decibels add along a path
                  why: >-
                    That is the span before anything happened. Half a decibel of the event is still
                    there and has to be carried.
                - text: 16.1 + 1.65 + 0.5 = 18.25 dB
                  rule: decibels add along a path
            - ask: Take the current total away from the receiver allowance.
              answer: 3
              candidates:
                - text: 24 ÷ 18.25 = 1.32, so there is 32 per cent in hand
                  rule: rearrangement
                  why: >-
                    Decibels are logarithmic quantities and a margin in decibels is found by subtraction, not
                    by dividing the two dB numbers.
                - text: 24 − 21.8 = 2.2 dB, using the loss before the spare-pump recovery
                  rule: substitution of the stated values
                  survives: true
                  why: >-
                    That is the old margin before the intervention. The current budget must use the 0.5 dB residue
                    rather than the original 4.1 dB event.
                - text: 24 + 18.25 = 42.25 dB of margin
                  rule: decibels add along a path
                  why: >-
                    An allowance is what may be spent, so the current loss is subtracted from it. Adding makes
                    the margin grow as the link gets worse.
                - text: 24 − 18.25 = 5.75 dB
                  rule: substitution of the stated values
          commit: Commit the derivation
      - group: TEST
        task: Choose the one target and position the captain should act on
        title: Sign the repair order
        at: otdr
        reason: >-
          The ship sails at dawn and gets one safe recovery day before the weather closes. This is the point where
          every optical measurement becomes one irreversible instruction.
        concept: 'Which of several candidate causes a signature can tell apart'
        place: Test Room
        scene: >-
          Sarraf clears the board except for four possible orders. The captain is on the radio waiting for one
          line: what to lift, and where along the route to lift it.
        guide: >-
          Use the whole chain. A clean break should have reflected strongly and did not. A bend or crush should
          have been worse at 1625 nm and was not. The spare pump restored 3.6 dB, and the corrected route position
          is 82.9 km. Choose the order that satisfies both the diagnosis and the location evidence.
        takeaway: 'The final product of the physics is a decision: one object at one place.'
        format: CHOICE
        why: >-
          The order is repeater 6 at 82.9 km. The location comes from correcting the old optical distance for
          the group index, the extra fibre wound inside the cable and the slack laid on the seabed. The object
          comes from the evidence pattern: no clean-break reflection, no longer-wavelength excess loss, normal
          electrical feed, and a 3.6 dB recovery when the spare pump was switched in. No other candidate explains
          all of those observations at once.
        question: What repair order should you send to the ship?
        choices:
          - Recover repeater 6 at 82.9 km along the route and replace its failing pump assembly
          - Cut open the cable at the original 84.6 km trace position and repair a clean break
          - Search near 82.9 km for a tight bend or crushed section of fibre
          - Stay near shore and replace the eleven old mechanical joints instead of sending the ship 
            offshore
        answer: Recover repeater 6 at 82.9 km along the route and replace its failing pump assembly
        rebuttals:
          - The strong reflection expected from a clean break is absent, and 84.6 km is an optical distance 
            rather than the corrected seabed route position.
          - A bend or crush should produce greater loss at the longer test wavelength; the measured loss was
            the same at both wavelengths.
          - The old shore joints were present before the sudden 4.1 dB event and the spare-pump switch 
            recovered almost all of that event from repeater 6.
    segue: The order is signed. Repeater 6. 82.9 kilometres along the route. At dawn, the ship takes that 
      one instruction out into the weather window.
interiors:
  TERM:
    caption: Where the sea cable becomes glass you can put light into.
    standLine: The armour off, the conductor to the feed, and every fibre out to a connector.
    station:
      kind: panel
      title: Termination bench
      rows:
        - {label: Core index, value: 1.4682, status: normal}
        - {label: Numerical aperture, value: 0.125, status: normal}
        - {label: Acceptance cone, value: 7.2°, status: high}
  TEST:
    caption: A pulse, a delay and a logarithm.
    standLine: Eleven years of traces in the drawer, each with its settings on the corner.
    station:
      kind: panel
      title: Reflectometer
      rows:
        - {label: Step in the trace, value: 4.1 dB, status: alarm}
        - {label: Round-trip delay, value: 828.6 µs, status: normal}
        - {label: 'Distance, corrected', value: 82.9 km, status: high}
  SPLICE:
    caption: Two ends of glass, and the step between them.
    standLine: Eleven mechanical joints on the shore end, all as old as the cable.
    station:
      kind: panel
      title: Splice bench
      rows:
        - {label: 'Reflection, dry end', value: −14.4 dB, status: alarm}
        - {label: 'Reflection, in gel', value: −51 dB, status: normal}
        - {label: Coating thickness, value: 320 nm, status: normal}
  AMP:
    caption: Erbium in a coil of glass, and a laser holding it excited.
    standLine: Repeater 6's telemetry, four years of it, every reading inside limits.
    station:
      kind: panel
      title: Amplifier desk
      rows:
        - {label: 'Pump, as logged', value: 118 mW, status: normal}
        - {label: 'Ceiling on added signal', value: 74.6 mW, status: high}
        - {label: 'Pump now, inferred', value: 46 mW, status: alarm}
  RECV:
    caption: Where photons become charges, and where the counting starts.
    standLine: A diode measured at 82 conversions in a hundred, against a sheet claiming ninety.
    station:
      kind: panel
      title: Receiver bench
      rows:
        - {label: Photon energy at 1550 nm, value: 0.80 eV, status: normal}
        - {label: Responsivity, value: 1.03 A/W, status: normal}
        - {label: Arrivals per bit, value: 6200, status: high}
  RAD:
    caption: Where the replacement repeater housing is X-rayed before it can go to sea.
    standLine: The source is eight months old, so every exposure takes longer than it did when the source 
      was new.
    station:
      kind: panel
      title: Radiography bay
      rows:
        - {label: Through 40 mm of steel, value: 7 %, status: high}
        - {label: Activity left, value: 10 %, status: alarm}
        - {label: Barrier distance, value: 18.5 m, status: normal}

warmups:
  trial-near:
    title: Learn the island station before the repair countdown starts
    # One sentence, and purely functional: who is here and what the ground is.
    # Mandate 4b of THREE_PASS_BRIEF.md — the reason for the mission-1 run is
    # orientation itself, on a morning the player has met nobody yet.
    why: >-
      Five buildings, a duct trench and a beach manhole, all of it on sand, and the splice
      trailer is not parked where the drawing puts it.
  trial-far:
    title: The dune track out to the bay
    why: >-
      The radiography bay is three hundred metres out in the dunes because of what is in the pot, and
      the track shifts with the sand. Take it once before you have to, because Nadia Farouk, the
      radiographer, will be waiting on a film and the exposure cannot be interrupted half way.
  greet:
    title: Meet the people who disagree about what failed
    why: >-
      Gerald Okonkwo, the station chief and cable engineer, distrusts turning an optical distance directly
      into a seabed position. Ines Sarraf, the chief transmission engineer, trusts the trace but knows the
      weather deadline is real. You will need both of them, and the rest of the crew,
      before you can tell the ship what to repair.
  follow:
    title: The duct route, walked by the man who terminated it
    why: >-
      Halvard Nilsen, the cable termination technician, walks the duct from the beach manhole to the
      termination room the same way every week and the route is not on the drawing at the accuracy
      that matters. Stay with him along it. Where he stops is where the duct is shallow.
  hunt:
    title: Six spare pump modules, and the store lists four
    item: {name: pump module, plural: pump modules}
    why: >-
      Every amplifier on this station has a spare pump module and two of them are not in the store where the book
      says. A spare nobody can find is a repeater with no redundancy, which is exactly what repeater 6 became
      after the spare-pump test.
  canvass:
    title: Who else saw the loss arrive on the night
    why: >-
      The span lost four decibels between two o'clock and four in the morning and only one instrument
      recorded it. Ask round the crew and the night shift until enough accounts agree on when it
      began, because a single trace is not yet a measurement of when anything happened.
  evade:
    title: The maker's engineer who wants the trace re-run his way
    why: >-
      He has driven from the mainland with a settings sheet and wants the span traced with a long
      pulse, which would blur the very thing that is being looked at. The argument belongs to Ines
      Sarraf, the chief transmission engineer.
      Keep clear of him and get your round done rather than spending the afternoon in the test room.
  tag:
    title: Catch Whitlock before he signs the bay out
    why: >-
      Joe Whitlock, the radiation safety officer, signs the radiography bay closed at six and today's
      exposure runs for more than two hours.
      The replacement housing cannot sail without that inspection, so the safe barrier has to be set before he
      leaves.

copy:
  TERM: <p>The cable termination room. The armour comes off here, the conductor goes to the power feed, and 
    every fibre in the cable is brought out to a connector somebody made by hand.</p>
  TEST: <p>The test room. One instrument, eleven years of traces in a drawer with their settings written on 
    the corners, and a step nineteen days old that nobody has explained.</p>
  SPLICE: <p>The splice trailer, parked against the duct trench. A fusion splicer, a microscope, and eleven 
    mechanical joints' worth of history on the shore end.</p>
  AMP: <p>The amplifier and power hall. Several thousand volts on the cable's single conductor, and a coil 
    of glass with a rare-earth metal in it that does the work nothing electrical could.</p>
  RECV: <p>The receiver lab. A diode, an amplifier and a decision about whether a bit was a one, made six 
    thousand photons at a time.</p>
  RAD: <p>The radiography bay, three hundred metres out in the dunes. A pot, a crank handle, a barrier rope 
    and a film cassette, and a source that is a tenth of what it was in the spring.</p>
  MANHOLE: <p>The beach manhole. Where the sea cable stops being a sea cable, under a concrete lid two 
    hundred metres up the dune from the low-water mark.</p>
  GEN: <p>The generator house. Two sets, one running, because a landing station that loses power stops 
    feeding the repeaters and every one of them is on the seabed.</p>
  STORE: <p>The ship's store. Replacement housings, spare pumps and jointing kits are staged here for the 
    one-day weather window when the cable can be lifted safely.</p>

# --------------------------------------------------------------- review variants
#
# Four lessons no mission stop points at. From day 3 every day carries a callback,
# and `shapeMissions` only issues one where the oldest taught lesson has an unserved
# "— Review" variant; with none authored this campaign served no callbacks at all.
#
# Each is its base lesson's concept on a different case, in a different format, and
# none of them is a DERIVE — the twelve derivations are the course and they are not
# to be duplicated, re-ordered or paraphrased. `concept:` is written out rather than
# left to the picker, because a variant is the one stop whose subject is already
# decided by the stop it is a review of.
lessons:
  - group: TEST
    title: Raw reading or interpreted number? — Review
    task: Sort four readings from the diverse route by what each one is
    concept: 'A measurement in an instrument’s own units, and what converts it'
    place: Test Room
    scene: >-
      Meier has four readings from the backup route. Before anyone compares them with the failed cable, sort out
      which numbers were directly measured and which already contain assumptions.
    guide: >-
      A box can measure time or power. Software can turn time into distance. A log can record the conditions of
      a measurement. Sort the four items by which of those jobs they represent before using them as evidence.
    background:
      - >-
        Why this is a matching board rather than four separate questions. Each description is written
        to be defensible against more than one of the readings, so choosing them one at a time lets a
        nearly-right answer through. Placing all four forces the comparison the stop is about.
      - >-
        What a condition is doing on a list of measurements. It is not evidence about the cable at
        all. It is the thing that decides whether two readings taken on different nights are
        comparable, and a reading whose conditions are unrecorded cannot be compared with anything.
    takesAsRead:
      - Time of flight, and turning a delay into a distance
      - Power in decibels, and why a loss budget adds
    assumes:
      - a reflectometer reports the delay of a pulse that has been out and back
      - the position printed beside a trace is worked out from the delay by software
    takeaway: A set of readings is usually three different kinds of thing, and saying which kind each one is
      comes before comparing any of them.
    format: PROTOCOL
    scenarios:
      - The reflectometer prints a round-trip delay of 611.4 microseconds.
      - The power meter at the far end reads 42 nanowatts.
      - The software prints a position 62.4 kilometres from this building.
      - The log records the pulse width the trace was taken with.
    choices:
      - A time, and it becomes a distance only once a speed in the glass has been chosen.
      - A power, and it becomes a margin only once an allowance has been subtracted from it.
      - A conversion already made, resting on a speed and a slack figure nobody here has checked.
      - A condition, and it decides whether this trace may be compared with an older one.
    mapping: [0, 1, 2, 3]
    why: >-
      Only one of the four is a number nobody has interpreted. The delay is what the instrument
      recorded, so it carries no assumption at all. The power is a measurement too, and it becomes a
      margin only once an allowance is subtracted from it. The printed position is a conversion
      already performed, resting on a speed in the glass and a slack figure from a lay chart eleven
      years old. The pulse width is none of those. It is a condition, and conditions decide whether
      two readings may be compared.

  - group: TERM
    title: How fast is light in the repair fibre? — Review
    task: Take the speed in a different glass, the one the ship will put in
    concept: Refractive index, and the speed of light in a material
    place: Cable Termination Room
    scene: >-
      The ship will carry a short drum of replacement fibre whose core index is 1.4571. Nilsen wants the speed
      in that glass so later tests do not silently assume it is identical to the old span.
    guide: >-
      Use the refractive index of the glass the light actually travels through. The span index and cladding index
      are distractors because they describe a different path or a boundary rather than this repair fibre.
    background:
      - >-
        Why a small index difference still matters. The two glasses differ only in the third decimal place, but
        over a long optical path that can move an inferred position by hundreds of metres—large compared with
        the accuracy needed for a one-day repair operation.
      - >-
        What an index actually is. It is the vacuum speed divided by the speed in the material, so it
        is a ratio of two speeds and carries no units of its own. Anything that comes out of it with a
        unit attached has had a unit invented for it somewhere in the working.
    assumes:
      - the index of a material is the factor by which light is slowed in it
    takeaway: A speed in a material comes out of one division, and the work is deciding which of the indices
      on the bench belongs in it.
    format: BALLPARK
    question: How fast does light travel in the core of the repair fibre?
    estimate:
      prompt: >-
        The ship will join this glass into the span. What a pulse does in it decides where every
        later measurement puts the fault.
      question: How fast does light travel in the core of the repair fibre?
      relationship: >-
        Speed in the material = the speed of light in empty space divided by the index of that
        material.
      labels:
        - 2.998e8 m/s  (light in empty space)
        - 1.4571  (index of the repair fibre's core)
        - 1.4682  (index of the span's own core)
        - 1.4519  (index of the repair fibre's cladding)
      values: [299800000, 1.4571, 1.4682, 1.4519]
      slots: 2
      template: '{0} ÷ {1}'
      formula: a/b
      correct: [0, 1]
      target: 205751150
      tolerance: 900000
      units: m/s
      solution: 2.998 × 10⁸ ÷ 1.4571 = 2.058 × 10⁸ m/s.
      explanation: >-
        The span's own core is on the bench because the two will be compared, and the cladding
        because it belongs to the boundary rather than to the path. Neither of them is the glass this
        pulse is in.
    why: >-
      Light makes about 2.058 × 10⁸ metres a second in this glass, one per cent faster than in the
      span it will be joined into. An index is the ratio of the vacuum speed to the speed in the
      material. The arithmetic is therefore one division, and the whole difficulty is which of three
      indices goes into it. A repair length of different glass puts a short stretch of the span at a
      different speed. Every later distance is worked out as though the whole fibre were one glass.

  - group: RECV
    title: Wave fact or photon-count fact? — Review
    task: Place four facts about the far end against what each one is about
    concept: 'Light as a wave: wavelength, frequency and the relation between them'
    place: Receiver Lab
    scene: >-
      Osgood has four facts about the far-end signal. Sort them by whether they are controlled by the wave's wavelength
      or by the number of photons arriving in each bit.
    guide: >-
      Wavelength controls how the fibre scatters and disperses the signal. Photon count controls counting noise
      and the statistical floor. Both describe the same light, but they answer different questions.
    background:
      - >-
        Why the distinction is worth making at a receiver. It decides what better equipment could
        change. A loss that belongs to the wavelength is fixed by choosing a different channel or a
        different glass. A limit that belongs to the count is fixed only by sending more light.
      - >-
        Why both descriptions are needed at once. The wave picture says how the fibre treated the
        signal on the way and what the amplifier could do to it. The arrival picture says how steady
        the number reaching the diode is, which is what an error rate is a statement about.
    assumes:
      - light can be described as a wave and as a stream of arrivals
    takeaway: Which description an observation belongs to decides whether better equipment at this end could
      change it.
    format: CASEBOOK
    scenarios:
      - The channel is specified at 1550 nanometres and the transmitter is locked to it.
      - The error floor does not improve when a quieter amplifier is fitted.
      - A kilometre of this fibre loses less at 1550 nanometres than at 1310.
      - Halving the transmitted power roughly doubles the errors, with the electronics untouched.
    choices:
      - 'About the wave: one wavelength, and the one frequency that goes with it.'
      - 'About the stream: the arrivals scatter about their average, and no amplifier makes them regular.'
      - 'About the wave: scattering by the glass depends steeply on the wavelength, so the colour decides the
        loss.'
      - 'About the stream: fewer arrivals a bit is a noisier count, whatever the electronics are doing.'
    mapping: [0, 1, 2, 3]
    why: >-
      Two of the four are about the wave and two are about the stream, and the fibre only ever acts on
      the first pair. A wavelength is what the transmitter is locked to, and how much a kilometre of
      glass scatters depends steeply on it, so the colour decides the loss. The other two are
      counting. Arrivals scatter about their average whatever the electronics are doing, and halving
      the power halves the number counted for each bit, which raises the errors by itself.

  - group: AMP
    title: How the pump creates gain — Review
    task: Put one atom's four events in the order they happen
    concept: 'Stimulated emission, population inversion and gain'
    place: Amplifier and Power Hall
    scene: >-
      Tanaka puts the four stages of one erbium amplification cycle on the board. Put them in order so the later
      pump diagnosis rests on the atomic mechanism rather than on a memorized label.
    guide: >-
      The pump must first excite the atom, the atom relaxes to the long-lived working level, an incoming signal
      photon arrives, and stimulated emission releases a matching photon. The order explains why pump optical
      output matters.
    background:
      - >-
        Why one of the four levels is short-lived and one is not. The pump lands atoms on a level they
        leave almost at once, and they leave it downwards, to a level they sit on for milliseconds.
        Only a level atoms sit on can hold a population, which is why the pump wavelength and the
        signal wavelength are different.
      - >-
        What this chain has to do with a drive current. Nothing on the telemetry screen touches any of
        the four steps. A current says power is going into the pump diode. How many atoms that power
        lands on the upper level is a question about the diode's optical output.
    takesAsRead:
      - Atomic energy levels, and the wavelengths they allow
    assumes:
      - an amplifier works by holding more atoms excited than not
    takeaway: Gain is a count of atoms already waiting in the upper level, so every step that fills that 
      level is part of the answer.
    format: SEQUENCE
    cards:
      - A pump photon at 980 nanometres is absorbed, and the atom is lifted to a short-lived level.
      - The atom settles to the long-lived level below it without emitting anything.
      - A signal photon at 1550 nanometres arrives while the atom is still in that level.
      - The atom falls to the ground level and sends out a second photon identical to the one that arrived.
    order: [0, 1, 2, 3]
    why: >-
      Amplification is a queue. The pump lifts atoms to a level they do not stay in. They settle
      almost at once to a longer-lived level below it, and a population can be held there. An arriving
      signal photon then finds an atom already excited and triggers a second photon exactly like
      itself. Nothing in that chain is reached by a drive current: the pump's optical output sets how
      many atoms are waiting. Everything the amplifier delivers is a count of atoms rather than a
      reading on a supply.

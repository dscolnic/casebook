                - text: R = 0.1896² = 0.0359
                  rule: power as the square of amplitude
                - text: R = √0.1896 = 0.435
                  rule: power as the square of amplitude
                  survives: true
                  why: >-
                    The square root rather than the square, which is the same relation applied

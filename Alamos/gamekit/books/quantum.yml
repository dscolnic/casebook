      - group: CTRL
        task: Turn the drive into a pulse
        title: How long a flip takes
        place: Control & Readout
        scene: >
          With the drive at 4.61 GHz, the qubit's population oscillates as the pulse gets longer. Mensah
          measures a full cycle every 84 nanoseconds.
        assumes:
          - a driven two-level system cycles between its states while the drive is on
        takeaway: A resonant drive produces an oscillation; the pulse area, not simply the carrier frequency, determines the rotation.
        format: BALLPARK
        question: Estimate the length of a pulse that flips this qubit.
        why: >
          "Driving on resonance does not simply leave the qubit excited. Under a coherent drive
          the population oscillates between the two basis states at the Rabi frequency. A π
          pulse corresponds to half of 1 population cycle, so the 84 ns period gives a first
          calibration near 42 ns. That number is only a starting point: changing drive amplitude
          changes the Rabi frequency, and strong drives can introduce leakage or other
          off-resonant effects."
        estimate:
          prompt: >
            The population completes a full Rabi cycle every 84 nanoseconds.
          question: Choose the cycle time and the fraction of a cycle a flip takes.
          labels:
            - 84 ns  (1 full Rabi cycle)
            - 2  (a flip is half a cycle)
            - 4.61 GHz  (the qubit frequency)
            - 11 mK  (the fridge temperature)
            - 12  (qubits on the chip)
          values: [84, 2, 4.61, 11, 12]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 42
          tolerance: 6
          units: ns
          solution: t_π = 84 ÷ 2 = 42 ns.
          explanation: >
            42 nanoseconds. The qubit frequency is what you drive at rather than how long for, and
            the fridge temperature and the qubit count belong to other questions entirely.
          givens:
            - 1 full Rabi cycle takes 84 ns
            - A flip is half a cycle
          relationship: >
            The flip pulse length = 1 Rabi cycle ÷ 2, because half a cycle takes the population from the
            ground state to the excited state.
        answerText: About 42 ns.
      - group: FAB
        task: Decide whether to keep this chip
        title: 1 bad qubit out of 12
        place: Fabrication & Materials
        scene: "The twelfth qubit is found, but the weak feature beside it survives every repeat. Swapping chips would consume four of the days before Delft's slot. Lindqvist arrives with the fabrication coupon: its junction resistances spread twice as wide as usual."
        assumes:
          - a fabrication run produces chips with a spread of properties
        takeaway: A device decision should compare the cost of its known imperfection with the cost and uncertainty of replacing it.
        format: SCIENCETANK
        why: The useful question is not whether this chip is perfect; it is whether changing chips is likely to improve the run Ridgeway is about to send to Delft. The present chip has 11 qubits close to target and a twelfth that can be driven and characterised. A swap costs four days, and the spare comes from the same suspicious fabrication run, so replacement does not remove the underlying uncertainty. The strongest plan is to keep this chip, map the nearby resonance, operate the qubit away from it if possible, and give Lindqvist the data needed to decide whether the feature tracks the process.
        proposals:
          - label: A
            text: Keep this chip, characterise the 4.55 GHz feature, and operate the twelfth qubit away from it if possible, characterise the defect properly, and report 12 qubits with 1 of them worse.
          - label: B
            text: Swap in the spare chip now, even though it came from the same fabrication run, at four days of warm-up and cooldown.
          - label: C
            text: Keep the chip but permanently omit the twelfth qubit from every circuit
          - label: D
            text: Stop device work until the fabrication process has been fully explained
        recommended:
          A: 50
          C: 25
        evidence: |-
          The chip has 12 qubits and 11 are within 40 MHz of design. Warm-up and cooldown is four
          days out of the ten before the review. The spare comes from the same suspicious run. Junction
          resistance on the coupon spreads twice as wide as usual. The defect near 4.55 GHz has not been
          characterised on any chip in this lab.
  - title: Two clocks, and the one that runs out first
    objective: Separate energy leaving the qubit from phase being scrambled.
    briefing: T1 is respectable and T2 is a third of what it should be, on every qubit at once.
    stake: >-
      Monday, and the coherence numbers are lopsided. Anders Holm has the relaxation time on every qubit
      sitting about where he wants it and the coherence time at a fraction of that, on all 12 within a
      few per cent — and a qubit's coherence can never exceed twice its relaxation time, so whatever is
      doing this is scrambling phase without taking any energy at all. Ijeoma Okafor says the fridge is
      quiet and has a fortnight of logs to show it. Ren Nakamura suspects the flux line. Priya Raghavan
      needs to know which of these numbers goes in the review and what it means for the circuit she has
      promised. Today you read both times off the traces yourself, work out what a poor coherence time
      against a good relaxation time is telling you, and decide where the noise is getting in.
    takeaway: Relaxation and dephasing remove different parts of quantum information, so the ratio of T1 to T2 is diagnostic.
    stops:
      - group: VER
        task: Say what the two numbers mean together
        title: Energy out, or phase scrambled
        place: Error & Verification
        scene: "The qubit can now be found and flipped, but Holm still does not know how long its state remains useful. He has two measurements running at every delay: one for excitation left behind, the other for phase coherence. Neither curve has been read yet."
        assumes:
          - a quantum state has both an energy and a phase, which can be lost separately
          - a decay time is conventionally read where a quantity has fallen to about a third of its start
        takeaway: Comparing T1 with T2 tells you whether energy loss alone can explain the observed loss of coherence.
        format: SWEEP
        question: Both curves fall, and not together. At what delay has the phase coherence dropped to a third of where it started?
        answerText: About 32 microseconds. The population is still at 0.70 there, and does not reach a third until about 90 — so T2 is 32 microseconds against a T1 of 90.
        why: |-
          Read at the same place on both curves, the two times come out a factor of three apart, and that gap is the diagnosis. Energy is leaving slowly; something is scrambling phase three times faster without taking any energy at all, which is what slow noise shifting the qubit's frequency between repetitions does. The two have different cures — energy loss is materials and fridge, dephasing is usually wiring — so the ratio decides who spends the week. It is also a bound worth carrying: coherence can never exceed twice the relaxation time, so this device could have reached 180 and is managing a fifth of that.
        sweep:
          mode: boundary
          axis:
            label: Delay before readout
            unit: µs
            min: 1
            max: 200
            step: 1
          series:
            - label: Excited population left
              response:
                - at: 1
                  value: 0.99
                - at: 32
                  value: 0.7
                - at: 62
                  value: 0.5
                - at: 90
                  value: 0.37
                - at: 140
                  value: 0.21
                - at: 200
                  value: 0.11
            - label: Ramsey contrast left
              response:
                - at: 1
                  value: 0.97
                - at: 22
                  value: 0.5
                - at: 32
                  value: 0.37
                - at: 62
                  value: 0.14
                - at: 90
                  value: 0.06
                - at: 200
                  value: 0.01
          target: 32
          tolerance: 8
          start: 1
          commit: Mark T2
      - group: CRYO
        task: Work out the ceiling this T1 sets
        title: How good T2 could be
        place: Cryogenics & Vacuum
        scene: >
          Okafor wants to know how much room there is before anybody spends a week chasing the noise. The
          relation is one over T2 equals one over twice T1 plus one over the pure dephasing time.
        assumes:
          - two independent loss processes add as rates rather than as times
        takeaway: When independent exponential decoherence processes are modelled as rates, the rates add and the corresponding times do not.
        format: BALLPARK
        question: Estimate the pure dephasing time behind these numbers.
        why: >
          Under the simple exponential model, 1/T2 = 1/(2T1) + 1/Tφ. The first term is the phase
          loss that accompanies energy relaxation; the remainder is labelled pure dephasing.
          Subtracting rates gives a useful diagnostic number, not a proof of a microscopic
          mechanism. If the observed decay is strongly non-exponential, as can happen with slow
          noise, the model itself has to be revisited rather than forcing every trace into one
          Tφ.
        estimate:
          prompt: >
            T2 is 32 microseconds and T1 is 90. The relation is 1/T2 = 1/(2·T1) + 1/T_φ, so
            1/T_φ = 1/32 − 1/180 per microsecond.
          question: Choose the measured coherence time and the relaxation ceiling.
          labels:
            - 32  (T2, in microseconds)
            - 180  (twice T1, in microseconds)
            - 90  (T1, in microseconds)
            - 42  (the flip pulse, in nanoseconds)
            - 12  (qubits on the chip)
          values: [32, 180, 90, 42, 12]
          slots: 2
          template: '1 ÷ (1/{0} − 1/{1})'
          formula: 1/(1/a - 1/b)
          correct: [0, 1]
          target: 38.9
          tolerance: 5
          units: µs
          solution: 1/T_φ = 1/32 − 1/180 → T_φ ≈ 39 µs.
          explanation: >
            About 39 microseconds in the simple exponential-rate model. That is close to the
            measured T2, so an additional dephasing contribution dominates over the relaxation
            contribution. If the measured Ramsey decay is non-exponential, one should not
            interpret this single number too literally.
          givens:
            - T2 is 32 µs
            - Twice T1 is 180 µs
          relationship: >
            1/T_φ = 1/T2 − 1/(2·T1), because the rates add and the relaxation contribution is the part you
            already know.
        answerText: About 39 µs.
      - group: FAB
        task: Say where slow noise comes from
        title: What scrambles a phase without taking energy
        place: Fabrication & Materials
        scene: >
          Lindqvist lists four candidates on the board and asks which of them changes a qubit's frequency
          slightly and slowly, rather than taking a quantum out of it.
        assumes:
          - a qubit's frequency can depend on its surroundings
        takeaway: A process that changes the qubit frequency from one repetition to the next can wash out phase even if little energy is lost.
        format: PROTOCOL
        why: >
          Dephasing appears when the qubit accumulates a different phase from run to run. Flux
          noise and bias-current noise can do that by shifting the transition frequency.
          Residual photons in a dispersively coupled readout resonator can also shift the qubit
          frequency randomly and dephase it. A resonant material defect can exchange energy with
          the qubit and often shows up strongly in T1, although real defects can affect more
          than 1 coherence channel. The classification here is therefore about the dominant
          signature in this situation, not a universal one-to-one rule.
        rebuttals:
          - Flux noise moves the qubit frequency slightly between repetitions, which is dephasing.
          - Current noise on a bias line does the same thing by the same route.
          - A resonant two-level defect can exchange excitation with the qubit and is therefore a strong candidate for a T1 feature in this scenario.
          - Residual photons in the readout resonator can shift the qubit frequency through dispersive coupling and wash out phase.
        columns:
          - The mechanism
          - What it damages
        scenarios:
          - Magnetic flux noise through the loop.
          - Current noise on the bias line.
          - A two-level defect sitting at the qubit frequency.
          - Thermal photons left in the readout resonator.
        choices:
          - Dephasing — it moves the frequency without taking energy.
          - Dephasing, by the same route as flux noise.
          - Primarily relaxation here — a resonant defect opens an energy-exchange channel.
          - Dephasing — fluctuating resonator photon number shifts the qubit frequency.
        mapping: [0, 1, 2, 3]

  - title: One bit out
    objective: Understand what a readout actually decides, and how confident it is entitled to be.
    briefing: The readout says 96% fidelity. Nakamura says that number is doing a lot of work.
    stake: >-
      Tuesday, and the argument is about a single number. The single-shot readout fidelity is quoted at 96%, and Ren Nakamura points out that it is the product of 3 separate things — how well the
      resonator separates the 2 states, how much noise the amplifier chain adds, and where somebody drew
      the line between them. Anders Holm wants each of the three measured. Priya Raghavan wants the headline
      figure for the review. Today you work out what the readout chain does to a signal, what a
      discriminator is actually deciding, and what part of that 96% belongs to the qubit at all.
    takeaway: "A readout fidelity belongs to the entire measurement chain: qubit-state-dependent signal, loss, amplification, noise and classification."
    stops:
      - group: CTRL
        task: Follow the signal out
        title: What happens between the chip and the answer
        place: Control & Readout
        scene: "The device is cold, the qubit is located, and its coherence is measured. Before Ridgeway sends the experiment to Delft, Nakamura walks the final readout path: resonator, cable, isolator, parametric amplifier, 4-kelvin amplifier, more cable, then the room-temperature digitiser."
        assumes:
          - an amplifier increases a signal and adds noise of its own
        takeaway: In a cascaded readout chain, noise added early — and loss before the first high-gain amplifier — is especially costly.
        format: SEQUENCE
        why: |-
          "A useful rule comes from the noise budget for cascaded amplifiers: once the signal has been given large low-noise gain, the noise of later stages is divided by that gain when referred back to the input. That makes the first high-gain amplifier extremely important. Loss before it is just as serious because it throws away signal before the gain arrives. The cold parametric amplifier is therefore placed close to the device and behind only the components needed to protect and route the signal; the warmer semiconductor amplifier then supplies robust additional gain."
        cards:
          - The resonator, which shifts frequency depending on the qubit's state.
          - The parametric amplifier near the base stage, which provides the first high-gain, low-noise amplification.
          - The semiconductor amplifier at 4 kelvin, whose added noise matters much less after the first stage has supplied gain.
          - The digitiser at room temperature, which records what arrives.
        order: [0, 1, 2, 3]
        axis: Put the four in the order the signal passes through them, from the chip outward. This is a place in a chain rather than a moment in time, and the walk is up the temperature gradient.
        ends: [First in the chain, Last in the chain]
      - group: CTRL
        task: Say what the discriminator decides
        title: A line drawn between two clouds
        place: Control & Readout
        scene: >
          The digitiser's shots plot as two clouds. Most are clearly in one or the other. A few thousand sit
          between them, and a line drawn somewhere in that gap assigns every one of those to a state.
        assumes:
          - a measurement produces a distribution rather than a single value
        takeaway: A discriminator converts overlapping analogue distributions into reported states, so its threshold sets a trade between two kinds of misclassification.
        format: SWEEP
        question: Both mistakes cost the same in this circuit. Where should the line go, and what does the total misassignment there tell you?
        sweep:
          mode: boundary
          axis: { label: Discriminator threshold, unit: mV, min: -40, max: 40, step: 1 }
          # 2 costs, moving in opposite directions. No position makes both
          # small, which is the thing the panel is for.
          series:
            - label: Ground shots called excited
              unit: '%'
              response:
                - { at: -40, value: 24.0 }
                - { at: -20, value: 11.0 }
                - { at: -6, value: 3.4 }
                - { at: 0, value: 2.0 }
                - { at: 8, value: 0.9 }
                - { at: 20, value: 0.3 }
                - { at: 40, value: 0.1 }
            - label: Excited shots called ground
              unit: '%'
              response:
                - { at: -40, value: 0.1 }
                - { at: -20, value: 0.4 }
                - { at: -6, value: 1.6 }
                - { at: 0, value: 2.6 }
                - { at: 8, value: 5.2 }
                - { at: 20, value: 13.0 }
                - { at: 40, value: 27.0 }
          floor: Total misassignment
          target: -3
          tolerance: 4
          start: -40
          commit: Set the threshold
        answerText: >-
          Near where the 2 error curves cross, about −3 mV. Total misassignment there is about
          5%, and no threshold anywhere on the axis gets it lower.
        why: >
          The line does not remove ambiguous shots; it decides which state they are called, so
          every millivolt taken off one error is added to the other. That is why the two curves
          cross and why the sum has a minimum that is not zero. The floor is the overlap between
          the two clouds, and it is a property of the measurement rather than of the threshold —
          getting under it needs more signal, less noise or a longer integration, something that
          moves the clouds apart. Equal costs put the line at the crossing; where one mistake
          costs more than the other, the best line moves away from it, which makes this a
          question about the circuit and not only about the classifier.
      - group: VER
        task: Take the readout out of the qubit number
        title: Whose error is it
        place: Error & Verification
        scene: The first end-to-end diagnostic is in. It reports 8% wrong outcomes. Separate calibration experiments estimate about 4% readout error and less than 1% preparation error. Holm asks what Ridgeway can honestly infer about the remaining circuit contribution.
        assumes:
          - errors from independent sources combine
        takeaway: An observed error rate is only a diagnosis after you state the model used to separate preparation, gates and measurement.
        format: CASEBOOK
        why: |-
          "For small, approximately independent error probabilities, adding the contributions is a useful first-order budget, but it is not an exact law. The 8% observed error therefore suggests that several per cent remain for gate and circuit effects after accounting for readout and preparation. A more careful analysis would model how the errors compose rather than simply subtracting percentages. The educational point is the separation: the number a user sees is not automatically the number a pulse engineer should optimise."
        rebuttals:
          - Readout error is measurable on its own by preparing a known state and reading it straight back.
          - State preparation error is measured the same way and is small on this device.
          - The residual points toward gate and circuit effects, but independent percentages only add approximately when the probabilities are small.
          - The total is what a user experiences, and it is not the number that tells you what to fix.
        columns:
          - The part of the error
          - What it tells you
        scenarios:
          - Readout error, 4%.
          - State preparation error, well under 1%.
          - Gate and circuit error, inferred from the remaining budget rather than by exact subtraction.
          - The 8% total.
        choices:
          - "Readout contribution: constrained by separate prepared-state measurements and strongly dependent on the measurement chain."
          - "Preparation contribution: separately estimated here and small compared with the total."
          - Inferred once the other terms are modelled, rather than by subtracting percentages.
          - "Observed total: what the user sees, but not by itself a diagnosis of which component to fix."
        mapping: [0, 1, 2, 3]
  - title: The offer with a date on it
    objective: Decide what to share, and when, while somebody else is deciding the same thing.
    briefing: A group in Delft will run your circuit on their device this month, if they get the gate sequence and protocol by Friday.
    stake: >-
      Wednesday, and a note arrives from a group in Delft. They have a device of a different
      design and a window of machine time in ten days, and they will run Ridgeway's circuit on
      it if they get the logical gate sequence, preparation and measurement protocol by Friday.
      Anders Holm's instinct is to send nothing until the local numbers are settled, because a
      protocol sent out creates work and expectations the group no longer controls. Priya
      Raghavan points out that this is the second device he has been asking for since March,
      offered free, with a deadline. Today you decide what has to be shared for a genuinely
      independent check, what should stay hidden until after the run, and what the group gives
      up if it waits.
    takeaway: Some evidence has a window on it, and refusing to move inside that window is a decision with its own cost.
    stops:
      - group: VER
        task: Decide what makes a replication worth the name
        title: What you would need back
        place: Error & Verification
        scene: "An email from Delft is open on Holm's screen: their independent-device slot begins in ten days, and the next opening is a quarter away. Holm starts a list of exactly what Ridgeway would have to send, and what would have to come back."
        assumes:
          - a second measurement is only a check if it could disagree
        takeaway: A useful replication shares enough method to repeat the experiment while keeping independent the choices that are actually being tested.
        format: PROTOCOL
        why: An independent run should reproduce the scientific procedure without needlessly reproducing Ridgeway's hidden assumptions. Delft needs the circuit and enough implementation detail to run the same intended experiment. Ridgeway should ask for the raw single-shot results so both groups can examine them, but Delft should build its own readout rule and device calibration. The expected numerical result should also be withheld until Delft has frozen its analysis. Shared instructions define the experiment; independent calibration and analysis make disagreement informative.
        rebuttals:
          - The logical circuit and protocol have to go, but Delft must translate them into controls appropriate to its own hardware; copying Ridgeway's analog pulse calibration would defeat part of the independence.
          - The returned observations let both groups examine the result while still allowing the analysis choices to differ.
          - Importing Ridgeway's fitted rule into Delft's primary analysis would preserve a common failure mode; a shared-pipeline comparison can be done later as a diagnostic.
          - Withholding the expected number prevents an avoidable source of confirmation bias while Delft makes its analysis choices.
        columns:
          - The item
          - Whether it crosses
        scenarios:
          - The logical circuit, preparation/measurement definitions and protocol.
          - The raw single-shot results from their run.
          - Ridgeway's fitted readout rule and device-calibration files.
          - The result Ridgeway expects to see.
        choices:
          - "Goes: the circuit and the information needed to implement the intended operations on Delft's hardware."
          - Lets both labs inspect the same evidence without forcing the same analysis.
          - Keep it local so the second analysis retains a genuinely different failure mode.
          - Withheld until Delft has frozen its own figure, since knowing it changes every fork.
        mapping: [0, 1, 2, 3]
      - group: NET
        task: Distinguish no-cloning from communication
        title: Copying a state is not the same as transferring one
        place: Networks & Security
        scene: Yusuf Sadiq points out that Delft does not need Ridgeway's physical quantum state at all; it needs the recipe for preparing its own. An arbitrary unknown state cannot be turned into a classical file that produces two perfect copies.
        assumes:
          - classical descriptions can be copied freely, while an arbitrary unknown quantum state cannot be perfectly cloned
        takeaway: The no-cloning theorem forbids making a perfect duplicate of an arbitrary unknown quantum state; it does not forbid transferring quantum information.
        format: CHOICE
        question: Why can Ridgeway email the preparation instructions but not email a complete classical description that lets Delft reconstruct an arbitrary unknown prepared state exactly?
        why: "A classical preparation recipe is ordinary information and can be copied without limit. An arbitrary unknown quantum state is different: there is no universal physical operation that takes one copy and produces two perfect copies of it. That is the no-cloning theorem. It does not say quantum information can never travel; a physical quantum system can be transferred. The restriction is that the original cannot remain behind as a second perfect copy. For this replication Delft needs the preparation instructions, not Ridgeway's particular instance of the state."
        choices:
          - Because an unknown quantum state cannot be perfectly duplicated from one copy.
          - Because the state contains too much information for any classical file, even if many identical copies were available.
          - Because a quantum state can never be transferred from one physical system to another.
          - Because copying the preparation instructions would create a second copy of Ridgeway's original state.
        answer: Because the state contains too much information for any classical file, even if many identical copies were available.
        rebuttals:
          - The obstacle is not file size. The no-cloning rule applies to an arbitrary unknown state when only the state itself is available.
          - Quantum information can be physically transferred; the restriction is on producing a second perfect copy while leaving the first intact.
          - The preparation recipe is classical information and can be copied freely. Delft can use it to prepare a new state of its own.
      - group: SENSE
        task: Decide what goes out on Friday
        title: What goes out on Friday
        place: Quantum Sensing
        scene: "Elena Barros, who runs Ridgeway's sensing group and ships calibrated numbers to a hospital every month, has the least romantic view of the Delft offer: if somebody else will depend on Ridgeway's work, the method has to leave the building before the opportunity does."
        assumes:
          - a result can be shared at different levels of completeness
        takeaway: Sharing a reproducible method before the final claim is settled can create evidence without committing to the final answer.
        format: SCIENCETANK
        why: |-
          The Delft window is short and the point of using a different device is to create an independent test. Sending the circuit, implementation notes and stated uncertainties does not require Ridgeway to send its expected result or claim that its own number is final. Waiting until every local number is polished forfeits the independent run. Sending the expected value with the method would weaken the check, while publishing before the cross-check turns an opportunity for pre-publication diagnosis into a post-publication dispute.
        proposals:
          - label: A
            text: Send the logical circuit, protocol and uncertainties, while withholding Ridgeway's numerical result until Delft freezes its analysis, with every uncertainty stated, and ask for raw shots back.
          - label: B
            text: Wait until every local calibration and performance number is final before sending anything, and ask Delft for a window next quarter.
          - label: C
            text: Send the method and Ridgeway's expected result so Delft can verify that it reproduces the same number
          - label: D
            text: Publish Ridgeway's local result first, then invite Delft to check it, then invite replication afterwards.
        recommended:
          A: 60
          B: 15
        evidence: Delft's independent-device slot begins in ten days and the next is a quarter away. Their device is a different design, which is what makes it an independent check. Ridgeway's own result has been measured on one device by one group. The external review follows soon after the Delft run. Delft has asked for sequences only, not for results.
  - title: A defect with a date on it
    objective: Trace a fault in a device back to the process that made it.
    briefing: The weak response near 4.55 GHz turns up on 3 chips, all from the same 6 weeks.
    stake: >-
      Thursday, and Sara Lindqvist has been through the drawer. The weak absorption sitting 60 megahertz
      below the twelfth qubit appears on 3 chips, and all 3 came from wafers processed in a
      six-week window last spring — the same window in which the oxidation step was changed to raise yield.
      Kofi Mensah has watched a qubit lose energy every time its frequency drifts into that feature. Priya
      Raghavan has to decide whether this goes in the review as a known cause or as an open question. Today
      you work out what the feature is, what it does to a qubit that sits near it, and what the process
      change bought and cost.
    takeaway: A defect in a material shows up months later in somebody else's measurement, which is why the record of what was made when is worth keeping.
    stops:
      - group: FAB
        task: Which explanation fits all of it?
        title: Something else that absorbs at that frequency
        place: Fabrication & Materials
        scene: By breakfast Lindqvist has three chips from one processing window lined up on the bench. The same narrow feature appears on all three and shifts after thermal cycling. Chips from every other window are clean. The fabrication log is open beside them.
        assumes:
          - a material can contain flaws that behave as small two-state systems
        takeaway: A narrow, repeatable spectral feature can be used as a fingerprint, but identifying its microscopic cause requires ruling out competing modes and artefacts.
        format: DIAGNOSIS
        why: |-
          The evidence strongly favours a device-local material resonance. The feature appears only on chips from one process window, survives changes in shared room-temperature electronics, and shifts slightly after thermal cycling. A neighbouring designed qubit or a generator artefact should have different cross-chip behaviour, while thermal photons usually change linewidths and backgrounds rather than producing the same isolated chip-specific line. A two-level material defect is therefore the leading hypothesis. Calling it specifically a defect in the junction oxide would require more localisation evidence than this spectrum alone provides.
        headline: A narrow absorption sits 60 MHz below 1 qubit, on 3 chips from 1 six-week window.
        readings:
          - zone: Feature
            label: Linewidth
            value: very narrow
            status: alarm
          - zone: Feature
            label: Frequency
            value: fixed, moves on thermal cycling
            status: alarm
          - zone: Chips
            label: Where it appears
            value: 3 of 14, all one window
            status: alarm
          - zone: Qubit
            label: T1 when tuned near it
            value: falls by 60%
            status: alarm
          - zone: Fridge
            label: Temperature
            value: 11 mK
            status: normal
        choices:
          - label: A two-level defect in the junction oxide
            mechanism: A microscopic two-state defect can absorb resonantly and can shift as its local environment rearranges.
          - label: A second qubit coupling in from the next cell
            mechanism: Neighbouring qubits can couple and exchange excitation.
          - label: Thermal photons in the readout resonator
            mechanism: Stray photons shift and broaden the response.
          - label: A spurious tone or mixing product in the shared measurement electronics
            mechanism: A spurious tone in the generator would appear at a fixed frequency.
        answer: A two-level defect in the junction oxide
        rebuttals:
          - A neighbouring qubit sits at a design frequency and would show on every chip, not three.
          - Thermal photons broaden the response instead of producing a narrow line, and the fridge is at 11 mK.
          - An artefact in shared electronics should follow the measurement chain across chips; the process-window correlation argues for something on the device.
      - group: CTRL
        task: Say what it does to a qubit near it
        title: Energy with somewhere to go
        place: Control & Readout
        scene: >
          This qubit is tunable across about 400 megahertz. Nakamura has measured its relaxation time at
          every setting across that band, with the defect the group found yesterday somewhere inside it.
        assumes:
          - two systems at the same frequency can exchange energy
        takeaway: If a loss channel is sharply resonant, frequency can be an engineering control knob as well as a measurement.
        format: SWEEP
        question: Relaxation is around 90 microseconds across most of the band and much worse in 1 place. Which frequency should this qubit be kept away from?
        sweep:
          axis: { label: Qubit frequency, unit: GHz, min: 4.40, max: 4.80, step: 0.005 }
          readout: { label: Relaxation time T1, unit: µs }
          baseline: 90
          # The dip is the defect found in the day-2 sweep, met again from the
          # other side: there it absorbed drive, here it drains the qubit.
          response:
            - { at: 4.40, value: 92 }
            - { at: 4.50, value: 90 }
            - { at: 4.54, value: 62 }
            - { at: 4.555, value: 34 }
            - { at: 4.57, value: 58 }
            - { at: 4.61, value: 89 }
            - { at: 4.70, value: 91 }
            - { at: 4.80, value: 90 }
          target: 4.555
          tolerance: 0.012
          start: 4.80
          commit: Mark the band to avoid
        answerText: >-
          About 4.555 GHz, where relaxation falls to roughly a third of the 90 microseconds
          available elsewhere. The damage is gone again within about 30 MHz either side.
        why: >
          A qubit loses energy quickly when there is somewhere for that energy to go, and a
          two-level defect is somewhere — but only while the two are close in frequency, which is
          why the loss appears and disappears over tens of megahertz rather than across the whole
          band. Two things follow. The width of the dip is a measurement of how strongly the two
          are coupled, and on a tunable device the frequency itself becomes an engineering
          control: move the qubit and the loss channel is not there at all. The half of the job
          that gets forgotten is writing the band down, because an undocumented defect is a trap
          for whoever retunes next month.
      - group: VER
        task: Say what the process change actually did
        title: Yield against lifetime
        place: Error & Verification
        scene: >
          The oxidation change raised the fraction of usable chips from about half to nearly three quarters.
          It also appears to have produced these defects.
        assumes:
          - a process change can improve one measure and damage another
        takeaway: A process change can improve one metric while degrading another, so causation needs a controlled comparison rather than a retrospective correlation.
        format: TRIAGE
        question: What should the group do about the oxidation step?
        choices:
          - Revert it, since the defects are what is limiting coherence.
          - Keep it, and compare defect density against the old process first.
          - Keep it, because yield is what limits how many devices the group can test.
          - Stop fabricating until the mechanism is understood.
        answer: Keep it, and compare defect density against the old process first.
        why: >
          Three affected chips from one processing window are enough to motivate a test and not
          enough to identify the oxidation change as the cause. The process change also produced
          a measured yield gain, so reverting immediately trades a known benefit for an
          unmeasured one. The clean next experiment is to fabricate comparable material under
          the old and new conditions, then measure both yield and defect density with the same
          protocol. That turns a suggestive time correlation into a causal test.
        rebuttals:
          - Three chips from one window is a correlation, and reverting on it trades a measured gain for a guess.
          - Keeping it without the comparison means the same argument again next year with no more evidence.
          - Stopping fabrication removes the only way to get the data that would settle it.

  - title: The instrument somebody else depends on
    objective: Meet the part of this field that already works, and the discipline that comes with it.
    briefing: The magnetometer has to be recalibrated by two, because a hospital is using its numbers.
    stake: >-
      Friday, and Elena Barros is not interested in the review. Her magnetometer measures fields 100 million
      times weaker than the Earth's, a hospital across the city uses those numbers in a study that
      has been running for 3 years, and the calibration is due at 2 o'clock whatever else is
      happening. Grace Whitfield is bringing the reference. Priya Raghavan, who needs Barros for the review
      slides, has been told to come back at three. Today you work out where a sensor's precision limit comes
      from, what averaging can and cannot buy, and why a number that leaves the building carries obligations
      that a number in a slide does not.
    takeaway: Quantum sensing becomes useful outside the lab only when sensitivity, calibration, drift and uncertainty are treated as one system.
    stops:
      - group: SENSE
        task: Find the noise floor
        title: What averaging buys
        place: Quantum Sensing
        scene: >
          Each measurement takes 100 milliseconds and resolves 40 picotesla on its own. Barros can
          average as many as she likes into one number, and she has an hour of instrument time.
        assumes:
          - independent measurements can be averaged to reduce random error
        takeaway: For independent measurements, random uncertainty falls only as 1/√N, so time buys precision with diminishing returns.
        format: SWEEP
        question: Averaging for longer buys resolution, until it does not. How long should she average, and what stops her going further?
        sweep:
          axis: { label: Integration time, unit: s, min: 0.1, max: 120, step: 0.1 }
          readout: { label: Resolvable field, unit: pT }
          baseline: 40
          # 1/root-N down to the point where a slow drift takes over. The knee is
          # the whole lesson: averaging is not free forever.
          response:
            - { at: 0.1, value: 40.0 }
            - { at: 1.0, value: 12.6 }
            - { at: 4.0, value: 6.3 }
            - { at: 10.0, value: 4.0 }
            - { at: 20.0, value: 2.9 }
            - { at: 35.0, value: 2.6 }
            - { at: 60.0, value: 2.7 }
            - { at: 120.0, value: 3.4 }
          target: 35
          tolerance: 8
          start: 0.1
          commit: Set the integration time
        answerText: >-
          About 35 seconds, resolving roughly 2.6 picotesla. Averaging for a minute is worse than
          averaging for half of one, so the extra hour of instrument time buys nothing.
        why: >
          Random noise averages down as the square root of the number of independent
          measurements, so the first factor of 10 in resolution is cheap and the next costs 100
          times the time — the reason sensing is a patience problem rather than a
          precision 3 things then fight. Averaging improves the number only while the
          measurements are independent, and past about half a minute the instrument itself has
          drifted, so later measurements are of a slightly different machine. Beyond the knee
          the curve turns back up and more data makes the answer worse. That is also why the
          hour does not help: the limit is drift, not the number of shots available.
      - group: SENSE
        task: Say what the calibration is for
        title: Against what
        place: Quantum Sensing
        scene: >
          Whitfield arrives with the reference source at two. Barros measures it, writes the ratio in the
          log, and only then measures anything anybody wants.
        assumes:
          - an instrument's reading is a comparison
        takeaway: Precision describes scatter; calibration against a reference is what connects that scatter to an accurate scale.
        format: CHOICE
        question: What does today's comparison with the reference establish that repeated measurements of the hospital sample cannot?
        choices:
          - That the sensor's random noise is smaller today than it was yesterday.
          - That today's readings tie to a standard, so last year's compare.
          - That repeated hospital measurements would reproduce exactly the same field value.
          - That any future change in a patient's signal must be biological rather than instrumental.
        answer: That today's readings tie to a standard, so last year's compare.
        why: >
          Repeated measurements can tell Barros about precision and short-term stability, but
          they cannot reveal a scale error that repeats every time. Comparing with a reference
          of known value tests the instrument's scale and creates a traceable link between
          today's reading and previous ones. For a multi-year study, that link matters because
          an uncorrected drift in the instrument can masquerade as a trend in the patient data.
        rebuttals:
          - A reference comparison checks scale and accuracy; random-noise precision is measured from repeated observations.
          - Agreement with a reference does not imply zero scatter on repeated samples; precision and calibration answer different questions.
          - Calibration bounds the instrument's contribution, but it cannot guarantee that a future change has a biological rather than instrumental cause.
      - group: NET
        task: Say what a delivered number obliges you to
        title: Numbers that leave the building
        place: Networks & Security
        scene: >
          Sadiq points out that his key link has the same property: somebody else's system depends on it,
          so its failures have to be visible to them rather than only to him.
        assumes:
          - a service somebody relies on has different obligations from an experiment
        takeaway: Once another person acts on a measurement, uncertainty, alarms and change history become part of the information you are delivering.
        format: PROTOCOL
        why: >
          A research measurement can be repeated before anybody acts on it. A delivered
          measurement may already have changed a decision, so the user needs enough context to
          recognize when the service is outside its validated state. An uncertainty supports
          decisions about significance; a calibration interval supports comparisons through
          time; a visible fault flag prevents silent use of known-bad data; and a change log
          makes later re-analysis possible. None of these substitutes for better sensitivity,
          but they determine whether the sensitivity is usable.
        rebuttals:
          - An uncertainty on every number is what lets the user judge whether a change is real.
          - A calibration interval is what makes this year's readings comparable with last year's.
          - An alarm the user can see is the difference between a fault and a silent wrong answer.
          - A record of changes is what lets somebody re-examine a conclusion later.
        columns:
          - The obligation
          - What it protects the user from
        scenarios:
          - An uncertainty stated on every delivered number.
          - A published calibration interval.
          - A fault alarm the user sees, not just the operator.
          - A log of every change to the instrument.
        choices:
          - Reading a change as real when it is inside the noise.
          - Comparing this year with last year through a drift.
          - Acting for weeks on a number that was already wrong.
          - Being unable to re-examine an old conclusion.
        mapping: [0, 1, 2, 3]

  - title: How wrong is it, and how would you know
    objective: Measure the machine's error in a way that does not measure your own readout.
    briefing: Two error numbers, both honest, differing by a factor of three.
    stake: >-
      Monday, and there are two error figures on the board. A direct measurement of a single gate says 0.4%. Randomised benchmarking over long sequences says 1.2. Anders Holm says both are correct and
      they answer different questions; Priya Raghavan says the review will only print 1 of them. Dasha
      Petrova wants whichever number is comparable with the threshold, because below that line adding
      qubits helps and above it they do not. Today you work out what randomised benchmarking actually
      measures, why a long sequence gives a different answer from a short one, and which number belongs in
      a sentence about error correction.
    takeaway: Different benchmarking procedures can produce different error numbers because they average over different operations and respond differently to preparation and measurement errors.
    stops:
      - group: VER
        task: Say what benchmarking measures
        title: Why a long sequence tells you more
        place: Error & Verification
        scene: >
          Holm can run a sequence of any length, from a single gate up to a few hundred, each one ending with
          the gate that should return the qubit to where it started. Every run either comes back or does not.
        assumes:
          - errors accumulate as operations are applied in succession
        takeaway: A quantity read from a trend survives a constant offset that would swamp a single reading.
        format: SWEEP
        question: How many gates can this qubit take before half the runs fail to come back?
        sweep:
          axis: { label: Gates in the sequence, unit: gates, min: 1, max: 256, step: 1 }
          readout: { label: Runs returning to the start, unit: '' }
          baseline: 0
          # 0.988 per gate, compounded. Authored so the printed book shows the
          # same decay the panel builds.
          response:
            - { at: 1, value: 0.988 }
            - { at: 8, value: 0.908 }
            - { at: 16, value: 0.825 }
            - { at: 32, value: 0.680 }
            - { at: 57, value: 0.500 }
            - { at: 96, value: 0.316 }
            - { at: 160, value: 0.146 }
            - { at: 256, value: 0.045 }
          target: 57
          tolerance: 10
          start: 1
          commit: Mark the half-way length
        answerText: >-
          Around 57 gates. Half the runs lost after 57 gates means about 98.8% per gate,
          because 0.988 multiplied by itself 57 times is close to a half.
        why: >
          Every gate in the sequence has to work for the qubit to come back, so the
          probabilities multiply and the curve falls exponentially rather than in a straight
          line. That makes the half-way length a per-gate error measurement: the length itself
          says how much each gate costs, and 57 gates to lose half of them works out at a bit
          over 1% each. It is also why the shape matters more than any single point.
          A readout that mislabels a fixed fraction of shots pulls the whole curve down without
          changing how fast it falls, so a number read from the decay survives an offset that
          would ruin a number read from one sequence — which is the difference between the two
          figures on the board.
      - group: CTRL
        task: Compound one gate's error over a circuit
        title: Where a good number stops being good
        place: Control & Readout
        scene: >
          Mensah's proposed circuit is 400 gates deep. The measured fidelity of a single gate is 0.988.
        assumes:
          - independent errors compound over repeated operations
        takeaway: In an independent-error toy model, small per-gate infidelity compounds rapidly with circuit depth.
        format: BALLPARK
        question: Under the simplifying assumption that each of the 400 gates succeeds independently with probability 0.988, estimate the all-gates-success probability.
        why: >
          If — and this is a simplifying model — every gate succeeds independently with the same
          probability and the circuit counts as correct only when every gate succeeds, the
          all-success probability is 0.988^400, about 0.008. The point is the exponential
          sensitivity to depth. Real quantum errors can be coherent, correlated and partly
          cancel or amplify, so this product is not a universal prediction of circuit fidelity.
          It is a useful first estimate that shows why a per-gate number that looks close to one
          can still be inadequate for deep circuits.
        estimate:
          prompt: >
            1 gate has fidelity 0.988, and the circuit applies 400 of them in succession.
          question: Choose the single-gate fidelity and the depth.
          labels:
            - 0.988  (fidelity of 1 gate)
            - 400  (gates in the circuit)
            - 12  (qubits used)
            - 0.012  (error of 1 gate)
            - 1.2  (benchmarked error, per cent)
          values: [0.988, 400, 12, 0.012, 1.2]
          slots: 2
          template: '{0} ^ {1}'
          formula: Math.pow(a,b)
          correct: [0, 1]
          target: 0.0079
          tolerance: 0.004
          units: 'chance the circuit is right'
          solution: 0.988^400 ≈ 0.008.
          explanation: >
            About 0.8%, or roughly 1 run in 125, in the independent-identical-error
            toy model. Real circuit fidelity need not equal this product when errors are
            coherent, correlated or gate-dependent.
          givens:
            - Single-gate fidelity is 0.988
            - The circuit is 400 gates deep
          relationship: >
            "Toy model: all-gates-success probability = 0.988^400 when each gate succeeds
            independently with the same probability."
        answerText: About 0.8%.
      - group: VER
        task: Say which number belongs beside the threshold
        title: The number error correction cares about
        place: Error & Verification
        scene: >
          Petrova wants to write one sentence about error correction. For the simplified
          stochastic error model used in her code study, the quoted threshold is about 1%
           in a per-gate error metric intended to match the benchmark. The direct
          single-gate number and the randomized-benchmarking number sit on opposite sides of it.
        assumes:
          - a threshold is a comparison against a defined quantity
        takeaway: A threshold comparison is meaningful only when the experimental error metric and the code's assumed error metric are actually comparable.
        format: CASEBOOK
        why: >
          "For *this stated simplified model*, the 1.2% randomized-benchmarking error is
          the intended comparison and it lies above the 1% line. The 0.4% direct
          figure is a best-case measurement of 1 gate under a different procedure, so using it
          would answer a different question. In real fault-tolerance work, even an average
          benchmarking error may not be enough: coherent and correlated errors can make the
          worst-case behaviour relevant to a code much worse than the average infidelity. The
          careful sentence therefore names both the metric and the model instead of declaring
          that the machine is simply 'above threshold'."
        rebuttals:
          - This is the intended comparison only because the code study has defined a compatible stochastic per-gate metric; that assumption belongs in the sentence.
          - A best-case direct gate measurement and an average sequence benchmark are different procedures and need not answer the same fault-tolerance question.
          - A circuit-level success probability depends on depth as well as per-operation error and is not the threshold metric specified here.
          - Readout error matters to fault tolerance, but it is not the per-gate quantity used in this particular comparison.
        columns:
          - The number
          - What it is good for
        scenarios:
          - 1.2%, averaged over long randomized gate sequences.
          - 0.4%, from one gate measured directly under favourable conditions.
          - About 0.8%, the toy-model success probability of the 400-gate circuit.
          - 4% readout error, a separate measurement channel.
        choices:
          - The figure a threshold is quoted against, once somebody says which error measure both sides mean.
          - A best-case direct gate measurement that should not inherit a threshold defined for a different error metric.
          - A depth-dependent consequence of many operations, not itself the specified per-gate threshold variable.
          - A separate measurement-error channel that matters to a full fault-tolerant design but is not the gate metric used in this comparison.
        mapping: [0, 1, 2, 3]

  - title: A number that rules something out
    objective: Run the Bell test as a measurement, and say precisely what a violation excludes.
    briefing: Two qubits, four settings, and a quantity that cannot exceed two if the outcomes were agreed in advance.
    stake: >-
      "Tuesday, and the review wants a demonstration that the machine can produce correlations
      incompatible with a simple local-classical model. Anders Holm proposes a CHSH experiment:
      entangle two qubits, measure four combinations of settings, and compute one number. Under
      the Bell-test assumptions, local pre-existing outcomes obey a bound of two. Dasha Petrova
      insists that an on-chip experiment does not satisfy every condition of a loophole-free
      Bell test, and that the limitation belongs in the claim rather than in a footnote. Today
      you compute the quantity, identify what its value says under the stated assumptions, and
      separate an on-chip quantum demonstration from a loophole-free test of local realism."
    takeaway: A Bell result is only as strong as the inequality, statistical test and experimental assumptions attached to it.
    stops:
      - group: VER
        task: Compute the quantity
        title: Four correlations, one number
        place: Error & Verification
        scene: Holm has left one blank line in the review deck for the Bell result. Two entangled qubits are ready, four analyser settings are loaded, and the room is waiting on a number that does not exist yet. Every shot returns two outcomes.
        assumes:
          - a correlation between two detectors can be measured as a number between minus one and one
          - a proportion measured from a finite number of trials scatters around its true value
        takeaway: The CHSH statistic combines four measured correlations; the classical bound and quantum prediction are comparisons made after the data are combined.
        format: TALLY
        question: Acquire the four correlations yourself and combine them. How large is the statistic, and how many shots did it take before it stopped moving?
        answerText: About 2.78, once every setting pair has several hundred shots behind it. Above the local-realist bound of 2, below the quantum ceiling of 2√2 ≈ 2.83.
        why: |-
          A correlation here is not the fraction of trials that agree; it is that fraction minus the fraction that disagree, which is why it runs from −1 to +1 and why a pair that almost always disagrees contributes a large negative number. Every 1 of those 4 values is a proportion from a finite number of shots, so each carries its own scatter, and the scatter shrinks as the square root of the count — which is why 100 shots per setting can put the combination either side of 600 usually does not. The bound of 2 belongs to local models satisfying the Bell assumptions; quantum mechanics allows up to 2√2, about 2.83. The arithmetic is trivial. Knowing when the number has stopped moving is the measurement.
        tally:
          settings:
            - label: a with b
              pSame: 0.855
              sign: 1
            - label: a with b′
              pSame: 0.155
              sign: -1
            - label: a′ with b
              pSame: 0.85
              sign: 1
            - label: a′ with b′
              pSame: 0.84
              sign: 1
          batch: 100
          minShots: 400
          formula: S = E(a,b) − E(a,b′) + E(a′,b) + E(a′,b′)
          formulaLabel: CHSH statistic
          readoutLabel: Correlation
          bound: 2
          boundLabel: local-realist bound
          target: 2.78
          tolerance: 0.14
          commit: Report S
          readyNote: Every pair has 400 shots. Keep going if the number is still wandering — nobody can tell you when it has settled except the number itself.
      - group: NET
        task: Say what the number excludes
        title: What has been ruled out
        place: Networks & Security
        scene: >
          S is 2.78, comfortably above 2. Sadiq asks Holm to say in one sentence what that establishes, and
          then asks him to say what it does not.
        assumes:
          - a measurement can rule out a class of explanations without confirming one
        takeaway: A Bell inequality rules out a class of models only to the extent that the experiment satisfies the assumptions used to derive and test the inequality.
        format: CHOICE
        question: Assuming locality and measurement independence for the moment, what would S = 2.78 exclude?
        choices:
          - That the qubits can be used to transmit a controllable message faster than light.
          - That no locally pre-fixed set of outcomes explains these correlations.
          - Every classical model, even one allowed to exchange information between the two qubits during the measurement.
          - Quantum mechanics as the only possible theory capable of producing the measured correlations.
        answer: That no locally pre-fixed set of outcomes explains these correlations.
        why: >
          Under the CHSH assumptions, a local hidden-variable model in which outcomes are
          determined by pre-existing variables cannot produce |S| > 2. The measured value would
          therefore exclude that class of models. It does not imply faster-than-light
          signalling, and it does not prove quantum mechanics uniquely correct. On Ridgeway's
          chip, however, the qubits are close enough that the locality condition is not
          physically enforced. That means the on-chip result is a strong demonstration of
          nonclassical correlations and, within quantum theory, entanglement — but the stronger
          loophole-free statement about local realism requires the conditions examined in the
          next scene.
        rebuttals:
          - Bell correlations do not provide a controllable signalling channel; each local outcome remains individually random.
          - If communication between the systems is allowed during the trial, the locality assumption has been dropped and the CHSH bound no longer has the same force.
          - Excluding a class of local models is not the same as proving one particular replacement theory uniquely correct.
      - group: CTRL
        task: State the loopholes
        title: What a careful reader will ask
        place: Control & Readout
        scene: >
          Petrova lists what somebody sceptical will want to know: whether the settings were chosen after
          the state was prepared, whether the two qubits were far enough apart, and how many runs were
          discarded.
        assumes:
          - an experiment's conclusion depends on conditions its apparatus may not meet
        takeaway: A loophole-free Bell claim requires the apparatus to enforce the assumptions rather than asking the reader to grant them.
        format: PROTOCOL
        why: >
          Ridgeway's qubits are millimetres apart and measured over microseconds, so signals
          travelling at or below light speed could cross between them during a trial; the
          locality loophole is open. Settings fixed long before the measurement also leave the
          measurement-independence logic weaker than a fast random choice made during each run.
          Outcome-dependent discarding can open a sampling loophole, and insufficient detection
          can require a fair-sampling assumption. An on-chip CHSH violation is still
          scientifically useful, but the slide should call it an on-chip Bell/entanglement
          demonstration rather than a loophole-free rejection of local realism.
        rebuttals:
          - The present millimetre-scale geometry does not enforce space-like separation, so the locality loophole remains open.
          - Settings fixed in advance leave room for a mechanism that could have known them.
          - Discarding runs on an outcome-related criterion changes what population the inequality applies to.
          - High enough detection efficiency lets the analysis include the full sample instead of assuming the detected events represent all trials.
        columns:
          - The condition
          - What it would take to meet it
        scenarios:
          - The two measurements are space-like separated.
          - Settings are chosen after the state is prepared.
          - No runs are discarded on outcome-related criteria.
          - Detection efficiency is high enough to avoid fair-sampling assumptions.
        choices:
          - Detectors far enough apart that light cannot cross between them in the measurement time.
          - A fast random choice made during the run rather than programmed beforehand.
          - A pre-registered rule for exclusion, applied blind to the result.
          - Efficient readout on both qubits, which this device has and many platforms do not.
        mapping: [0, 1, 2, 3]

  - title: Reading a claim as a claim
    objective: Work out what an advantage result asserts, and what would falsify it.
    briefing: A competing group's paper says a classical computer would need 9000 years. That is a claim about a classical computer.
    stake: >-
      "Wednesday, and the paper everybody has been arguing about is on the table. A group has
      run a sampling circuit on a 67-qubit device and estimates that reproducing its output with
      the best classical methods they analysed would take about 9000 years. Priya
      Raghavan wants Ridgeway's response ready for the review. Anders Holm points out that the
      headline joins several different claims: what the quantum device measured, how its
      fidelity was inferred, and how difficult the task is for specified classical algorithms
      and hardware. Today you separate those claims, ask what kind of evidence supports each
      one, and decide what a twelve-qubit laboratory can contribute without pretending to
      adjudicate a sixty-seven-qubit experiment."
    takeaway: A computational-advantage claim combines experimental evidence with a moving statement about classical algorithms, hardware and assumptions.
    stops:
      - group: VER
        task: Separate the two halves of the claim
        title: What was measured and what was estimated
        place: Error & Verification
        scene: >
          The paper reports a sampled distribution, a fidelity estimate, and a runtime for the best known
          classical algorithm on the largest machine the authors could get time on.
        assumes:
          - a comparison has a measured side and a modelled side
        takeaway: Measured outputs, model-dependent fidelity estimates and classical-runtime estimates are different kinds of evidence even when they appear in one headline.
        format: CASEBOOK
        why: >
          The quantum device's sampled data are experimental observations. The fidelity estimate
          is partly model-dependent because at sizes beyond exact classical simulation one
          cannot simply calculate the full ideal distribution and compare every outcome. The
          quoted classical runtime is conditional on algorithms, implementation choices and
          available hardware; a better classical method can change that estimate without
          changing the quantum experiment at all. The useful reading habit is therefore to ask
          which part is measured, which part is inferred, and which part is a statement about
          the current state of competing computation.
        rebuttals:
          - The sampled distribution is a measurement of their device, and it either reproduces or it does not.
          - A classical runtime estimate is conditional on the algorithms and hardware considered; a new method can change it without exposing experimental misconduct.
          - At the largest size, the fidelity estimate cannot simply be checked by computing the complete ideal distribution exactly.
          - The energy and cost figures are engineering facts about two particular machines.
        columns:
          - The part of the claim
          - What kind of statement it is
        scenarios:
          - The output distribution their device produced.
          - 9000 years for the best known classical algorithm.
          - The estimated circuit fidelity.
          - The comparison of energy used.
        choices:
          - Measured data from the quantum device, subject to the experiment's normal statistical and systematic uncertainties.
          - A conditional estimate for specified classical algorithms and hardware, which can change when the classical state of the art changes.
          - A model-dependent estimate connecting the noisy experiment to an ideal target distribution.
          - Engineering measurements about particular machines rather than a universal complexity statement.
        mapping: [0, 1, 2, 3]
      - group: CTRL
        task: Say what Ridgeway's own machine could check
        title: What 12 qubits can say about 67
        place: Control & Readout
        scene: >
          Ridgeway has 12 qubits. Mensah is asked what, if anything, a twelve-qubit device can
          contribute to an argument about a sixty-seven-qubit one.
        assumes:
          - a small system can be simulated exactly and a large one cannot
        takeaway: Small instances are valuable because they can validate an analysis against a truth that is independently computable.
        format: CHOICE
        question: Which part of the sixty-seven-qubit claim can Ridgeway test most directly with a twelve-qubit device?
        choices:
          - The exact sixty-seven-qubit runtime, by scaling a twelve-qubit timing measurement upward.
          - Checking the method where the exact answer is already known.
          - The sixty-seven-qubit device's hardware error rate, by reproducing the same circuit on 12 qubits.
          - The asymptotic complexity class of the sampling problem, by comparing one small quantum and classical run.
        answer: Checking the method where the exact answer is already known.
        why: >
          "At 12 qubits, exact classical calculation of the ideal distribution is easy
          enough to serve as a ground truth. Ridgeway can therefore run the same *analysis
          method* at small size and test whether the estimator recovers the answer it is
          supposed to recover, including how it behaves as controlled noise is added. That does
          not validate the sixty-seven-qubit runtime claim by itself, nor does it prove the
          estimator behaves identically at all sizes. It does something more modest and useful:
          it tests a load-bearing method where the answer is knowable."
        rebuttals:
          - Runtime scaling from a tiny instance is not enough to determine the cost of the largest classical calculation.
          - A twelve-qubit copy cannot measure another machine's hardware error rate; it can test the method used to interpret data.
          - One finite-size timing comparison does not establish an asymptotic complexity class.
      - group: NET
        task: Decide what Ridgeway says publicly
        title: The response
        place: Networks & Security
        scene: >
          Raghavan wants a paragraph for the review. The options on the table run from a full rebuttal to
          silence, and the group has one genuinely new thing to offer.
        assumes:
          - a public statement can be about a method rather than about a rival
        takeaway: A constructive critique is strongest when it contributes a testable method or benchmark rather than a verdict unsupported by your own data.
        format: SCIENCETANK
        why: >
          "Ridgeway cannot determine the true best classical runtime for the sixty-seven-qubit
          experiment with its twelve-qubit processor. What it can contribute is a validation
          study of the estimator: compare it with exact results at tractable sizes, inject
          controlled errors, and map where the estimator remains trustworthy. That evidence
          could support, qualify or challenge future advantage claims without requiring Ridgeway
          to endorse or dismiss this paper's headline. A public method is more durable than a
          public posture."
        proposals:
          - { label: A, text: 'Publish a small-scale validation of the estimator against exact classical results and controlled noise, where the exact answer is known, and say nothing about the rival result.' }
          - { label: B, text: 'Wait for Delft before saying anything, even though Delft is testing a different question' }
          - { label: C, text: Publish a rebuttal asserting that an undiscovered classical algorithm must make the runtime much shorter }
          - { label: D, text: Endorse the nine-thousand-year figure as the definitive classical cost because it is the published state of the art }
        recommended: { A: 55, B: 20 }
        evidence: |
          Ridgeway has 12 qubits against the paper's 67. An exact classical simulation at 12 qubits takes
          seconds. Nobody has published a validation of this estimator against exact results. Two previous
          advantage claims were overturned by better classical algorithms rather than by experimental error.
          The review is in three days.

  - title: The discriminator that had seen the answer
    objective: Find out why the second device disagrees, and what that does to a fortnight of numbers.
    briefing: Delft ran the circuit. Their fidelity is a third lower than Ridgeway's, on hardware that is otherwise better.
    stake: >-
      Thursday, and Delft's raw shots arrived overnight. Their device has longer coherence,
      lower gate error and better readout separation than Ridgeway's by every independent metric
      they sent, yet the circuit fidelity they report is about a third lower. Anders Holm has
      been asking for a second device since March because this is exactly the kind of
      contradiction one machine cannot create for itself. Marta Castellan pulls both groups'
      analysis notebooks and starts comparing where calibration data end and evaluation data
      begin. Today you diagnose the discrepancy, trace which of the fortnight's results depend
      on the suspect step, and decide what has to happen before the review.
    takeaway: A method tuned on the data it is later tested against will flatter itself, and it will do so quietly and consistently.
    stops:
      - group: CTRL
        task: Say what the retraining did
        title: Scoring yourself on your own training set
        place: Control & Readout
        scene: "Delft's message is on the main screen: their hardware has better coherence, lower gate error and cleaner readout, yet their circuit fidelity is a third lower. Castellan puts Ridgeway's two trays of shots beside it. Something in the comparison does not add up."
        assumes:
          - a rule fitted to data describes that data better than it describes new data
          - a labelled calibration set is a sample, and a sample has features of its own
        takeaway: A rule chosen on a sample is scored generously by that sample, so the only honest number comes from data the rule has never seen.
        format: HOLDOUT
        question: Ridgeway's number was measured on the very shots that chose the line. Choose the line yourself, freeze it, and give it shots it has never seen — what does it score then?
        answerText: About 95% from anywhere on the broad plateau. A line on the 14 mV spike — the best-scoring line on the calibration shots — reports about 92.6, and the 2% it appeared to gain was a feature of that 1 sample.
        why: |-
          A threshold chosen on a sample is chosen partly on that sample's noise, and noise does not repeat. That is why the middle of the range holds up and the spike does not: the plateau is a property of the 2 clouds, which the next batch of shots also has, and the spike is a property of 4000 particular records, which it does not. So a score measured where the line was chosen is not a measurement of the classifier at all — it is a measurement of the classifier plus the sample, and it is biased upwards every time, quietly and in the same direction. The cure is procedural rather than clever: keep shots back, freeze the rule, and report what it does on those.
        holdout:
          axis:
            label: Discriminator threshold
            unit: mV
            min: -40
            max: 40
            step: 1
          unit: "%"
          fitLabel: Calibration shots
          testLabel: Shots it has never seen
          fit:
            - at: -40
              value: 88
            - at: -20
              value: 92.4
            - at: -10
              value: 94.6
            - at: -6
              value: 95.1
            - at: -3
              value: 95.2
            - at: 0
              value: 95.2
            - at: 2
              value: 95
            - at: 8
              value: 94.4
            - at: 12
              value: 95.2
            - at: 14
              value: 96.4
            - at: 16
              value: 95
            - at: 20
              value: 93.6
            - at: 30
              value: 91
            - at: 40
              value: 88.2
          test:
            - at: -40
              value: 87.6
            - at: -20
              value: 92
            - at: -10
              value: 94.2
            - at: -6
              value: 94.8
            - at: -3
              value: 95
            - at: 0
              value: 94.9
            - at: 2
              value: 94.6
            - at: 8
              value: 93.8
            - at: 12
              value: 93.2
            - at: 14
              value: 92.6
            - at: 16
              value: 92.2
            - at: 20
              value: 91.4
            - at: 30
              value: 89.2
            - at: 40
              value: 86.8
          pass: 94.5
          start: -40
          freeze: Freeze the line
          commit: Report the held-out number
          afterFreeze: Frozen. That is what your line scores on shots it has never been shown.
      - group: VER
        task: Sort the fortnight's numbers
        title: What the artefact touches
        place: Error & Verification
        scene: >
          Holm lists the numbers this fortnight produced and asks which of them passed through the
          discriminator and which did not.
        assumes:
          - a fault in one step affects only what depends on that step
        takeaway: A pipeline fault propagates only into quantities downstream of that step, and the dependency graph matters more than how important a number feels.
        format: CASEBOOK
        why: >
          "The discriminator converts analogue readout records into bits, so quantities built
          directly from classified outcomes — including the reported readout fidelity, circuit
          outcome probabilities and the Bell correlations — must be reconsidered. T1 and T2 are
          extracted mainly from how a signal changes with delay, so an approximately stable
          affine readout error often changes the amplitude or offset more than the fitted decay
          constant; those fits should still be checked, but they are not automatically invalid.
          Standard randomized benchmarking has a similar designed insensitivity to fixed state-preparation and measurement
          terms in its decay parameter. The rule is dependency, not prestige: rerun or reanalyse
          anything for which the faulty classification can change the quantity of interest."
        rebuttals:
          - Circuit outcome probabilities are downstream of the discriminator, so the classifier can bias them directly.
          - A stable readout offset often changes the scale or baseline of a relaxation/coherence trace more than its decay rate, but stability should be checked rather than assumed.
          - Randomized benchmarking is built to make fixed state-preparation and measurement contributions enter mainly as fit constants rather than as the sequence-length decay parameter.
          - The Bell statistic is calculated from classified joint outcomes, so the discriminator can bias the correlations themselves.
        columns:
          - The result
          - What the artefact does to it
        scenarios:
          - Circuit fidelity, 0.91.
          - T1 and T2.
          - The randomised benchmarking error.
          - The Bell value of 2.78.
        choices:
          - "Affected directly: it is computed from classified circuit outcomes."
          - Likely robust in its fitted decay constant, but verify that the readout bias was stable over delay.
          - Designed to be comparatively insensitive to fixed state-preparation and measurement offsets in the decay parameter; still inspect the fit.
          - "Affected: the CHSH correlations were computed from the same classified outcomes and must be reanalysed."
        mapping: [0, 1, 2, 3]
      - group: FAB
        task: Decide what happens next
        title: Rerun, and tell whom
        place: Fabrication & Materials
        scene: >
          Nothing has been published. The review is in two days. Delft has the raw shots and has not been
          told what Ridgeway found.
        assumes:
          - a fault found before publication is a different problem from one found after
        takeaway: When an external collaborator is spending time on a discrepancy you already understand, disclosure becomes part of the experimental workflow.
        format: TRIAGE
        question: What does the group do first?
        choices:
          - Tell Delft, who are mid-analysis on it right now.
          - Rerun the affected numbers with a held-out evaluation set.
          - Redraft the review slides with the corrected figures.
          - Work out how long the discriminator has been trained this way.
        answer: Tell Delft, who are mid-analysis on it right now.
        why: >
          Delft is actively analysing a disagreement whose likely cause Ridgeway has now
          identified. Telling them immediately lets them test the hypothesis on their raw data
          and stops them spending more time searching for a hardware problem that may not exist.
          Ridgeway should then rerun the affected metrics with a frozen or held-out evaluation
          set, update the review material, and audit how long the old procedure was used. The
          ordering matters because only the first action changes what somebody outside the
          building does in the next hour.
        rebuttals:
          - The rerun is this week's work and nobody else is waiting on it.
          - Slides drafted before the rerun would only be drafted twice.
          - How long it has been happening is worth knowing and changes nothing anybody does today.

  - title: A day when the machine behaves
    objective: Run an ordinary session, and notice what ordinary is resting on.
    briefing: Everything is calibrated, the fridge is cold, and there is nothing to fix.
    stake: >-
      Friday, and it is a quiet day. The fridge is at 11 millikelvin, the tune-up converged on the first
      attempt, every qubit is within a few megahertz of where it was yesterday, and the reruns are queued
      and running themselves. Kofi Mensah uses days like this to ask what the group is assuming, because it
      is the only time anybody has. Grace Whitfield is doing her monthly comparison against the national
      standard, which nobody watches and everything depends on. Today you check what a calibration actually
      established, read a drift that is behaving, and decide which of the group's comforts is a measurement
      and which is a habit.
    takeaway: A machine that is working is a set of assumptions nobody is currently being forced to check.
    stops:
      - group: CTRL
        task: Say what the tune-up established
        title: Converged, and on what
        place: Control & Readout
        scene: >
          The automatic tune-up reports success on all 12 qubits in 11 minutes. Mensah asks what,
          precisely, that success is a statement about.
        assumes:
          - an automated procedure optimises the quantity it was given
        takeaway: An optimizer can prove that it satisfied its objective function without proving that every relevant behaviour of the device is healthy.
        format: CHOICE
        question: Which statement is justified by the tune-up's 'success' flag, and which tempting stronger claims are not?
        choices:
          - All device behaviours are within specification because every automated subroutine converged.
          - That it found parameters matching the responses it tests for.
          - The qubits did not drift since yesterday, because a fast convergence implies the same optimum was recovered.
          - The week's benchmark error will be unchanged, because successful calibration fixes the dominant error sources.
        answer: That it found parameters matching the responses it tests for.
        why: >
          The tune-up searched a defined space of control parameters until its measured
          objectives — such as resonance location, pulse response and readout separation — met
          its convergence criteria. That is useful evidence about those objectives. It does not
          automatically test leakage, correlated multi-qubit errors, long-timescale drift or any
          other quantity outside the objective function. The important distinction is not human
          versus automated calibration; it is tested behaviour versus untested behaviour.
        rebuttals:
          - Working correctly is a wider claim than the handful of responses the routine measures.
          - Drift is inferred from the parameters having moved little, and the tune-up does not test for it directly.
          - Nothing in a tune-up predicts an error rate; that is a separate measurement.
      - group: SENSE
        task: Read a comparison that is behaving
        title: The month when nothing moved
        place: Quantum Sensing
        scene: >
          Whitfield's monthly comparison agrees with the national standard to within the uncertainty, as it
          has for 11 months. She writes it in the log with the same care as if it had not.
        assumes:
          - a calibration can pass or fail and both are results
        takeaway: A calibration that agrees with its reference is a quantitative bound on drift, not an absence of information.
        format: CHOICE
        question: What information does an in-family calibration result add to the measurements taken since the previous comparison?
        choices:
          - None beyond paperwork, because only failed calibrations contain scientific information.
          - It bounds the drift since the last one, which is what makes the readings between usable.
          - Proof that every measurement made during the month was accurate to the same uncertainty.
          - Evidence that the reference standard itself did not drift during the month.
        answer: It bounds the drift since the last one, which is what makes the readings between usable.
        why: >
          If the present comparison agrees with the reference within uncertainty, then any drift
          of the calibrated scale over the interval is bounded at roughly that level, subject to
          the assumptions of the calibration schedule. That bound is what lets measurements from
          different months be compared on the same scale. A passing calibration does not prove
          perfect accuracy and does not guarantee the instrument behaved continuously between
          checks; it converts an untested interval into one with a stated constraint.
        rebuttals:
          - A null result is what licenses every measurement taken in the interval, so plenty follows from it.
          - Agreement within uncertainty bounds the error; it does not prove the instrument right.
          - The information is precisely the bound, which is why the log entry matters.
      - group: CRYO
        task: Separate the measured comforts from the habits
        title: Which of these is a measurement
        place: Cryogenics & Vacuum
        scene: >
          Okafor lists four things the group is relying on today. Two are numbers somebody took this week.
          Two are figures nobody has revisited in a year.
        assumes:
          - a figure can be current or inherited
        takeaway: The riskiest inherited parameter is usually the one that is both stale and load-bearing in many later calculations.
        format: TRIAGE
        question: Which assumption creates the largest combination of staleness and downstream leverage?
        choices:
          - The fridge base temperature, logged continuously.
          - The input line attenuation, from a record two rebuilds ago.
          - The qubit frequencies, measured this morning.
          - The amplifier noise temperature, measured last month on the present readout chain.
        answer: The input line attenuation, from a record two rebuilds ago.
        why: >
          "The input-line attenuation is both old and load-bearing: the wiring has been rebuilt
          twice since it was measured, yet the value is still used to translate room-temperature
          power into the drive amplitude believed to reach the qubit. The fridge temperature and
          qubit frequencies are current. The amplifier noise temperature is less current, but it
          was measured on the present chain and affects a narrower part of the interpretation.
          Age alone is not the criterion; age multiplied by how many conclusions depend on the
          number is."
        rebuttals:
          - Base temperature is logged continuously and is as current as anything here.
          - Qubit frequencies were measured this morning on this configuration.
          - The amplifier noise temperature is a month old and was taken on the present chain.

  - title: Three things at once
    objective: Rank three demands on one group in one afternoon.
    briefing: A fibre cut, a clock drifting, and a review deadline, all inside an hour.
    stake: >-
      Monday, 15:20, and 3 things arrive together. A contractor with a digger has cut the fibre to the
      substation, which ends Yusuf Sadiq's key run mid-session. Grace Whitfield's clock comparison has come
      back 4 × 10⁻¹⁵ off, which is 10 times its usual scatter and would put every frequency in the building
      slightly wrong. And the review pack is due at five, with the corrected fidelity numbers still being
      rerun. Priya Raghavan has one group, one afternoon, and has asked for an order rather than a
      discussion. Today you decide what gets attention first, work out what a cut link does to a key
      already exchanged, and say what a drifting reference does to everything measured against it.
    takeaway: Triage depends on whether a problem is still propagating, what decisions it contaminates, and how quickly it can be bounded.
    stops:
      - group: NET
        task: Decide what the group does first
        title: Which of the three cannot wait
        place: Networks & Security
        scene: Within 20 minutes, the QKD fibre goes dark, the review pack comes back with a deadline warning, and Whitfield reports a clock discrepancy. Raghavan puts all three on the board. The group can move on all three, but not equally.
        assumes:
          - a problem still developing is different from one that has finished
        takeaway: Urgency is a product of ongoing damage, downstream reach and time-to-containment, not simply deadline pressure.
        format: TRIAGE
        question: What gets the group's attention first?
        why: |-
          "The fibre cut has stopped the QKD link and cannot be repaired by the laboratory this afternoon; the unfinished block is not yet secret key and can be quarantined. The review pack has a hard deadline but a known workflow and reruns already in progress. The clock discrepancy is different: if the reference has drifted, every new frequency measurement made against it inherits the same scale error, so the affected set grows until the reference is checked or isolated. A repeat comparison can bound that risk quickly, which puts the clock first."
        choices:
          - The clock — everything since the last comparison is unbounded.
          - The cut fibre — because loss of the quantum channel automatically compromises all key material generated earlier in the session.
          - The review pack — because a fixed external deadline always outranks an instrument problem with uncertain scope.
          - The rerun queue — because any unattended computation is more urgent than a reference comparison.
        answer: The clock — everything since the last comparison is unbounded.
        rebuttals:
          - The unfinished QKD data are not automatically compromised by the cut; they simply cannot be called secret key until the protocol's authenticated post-processing establishes security.
          - A deadline matters, but the clock can contaminate additional measurements every hour and can be checked quickly.
          - The reruns are already executing and do not need immediate human intervention.
      - group: NET
        task: Distinguish raw key material from usable secret key
        title: What an interrupted exchange leaves behind
        place: Networks & Security
        scene: >
          The link failed while the current block was partway through sifting and before
          parameter estimation, error correction and privacy amplification were complete. Sadiq
          is asked whether the stored bits are already a key, whether they must automatically be
          destroyed, or whether the protocol can still process a completed subset.
        assumes:
          - raw or sifted key material is not yet secret key; the protocol's security proof specifies how parameter estimation and privacy amplification are performed
        takeaway: Sifted or raw QKD bits become usable secret key only after the protocol has bounded leakage and completed authenticated post-processing.
        format: CHOICE
        question: What is the scientifically correct status of the partial data after the link fails?
        choices:
          - Use it, since three quarters of the bits were exchanged successfully.
          - Nothing. Without the error estimate there is no bound on the leak.
          - Store it and complete the exchange when the fibre is repaired.
          - Use it at reduced length, in proportion to how much was completed.
        answer: Nothing. Without the error estimate there is no bound on the leak.
        why: >
          "The stored bits are not yet usable secret key. QKD security comes from the full
          authenticated protocol: parameter estimation bounds the relevant error statistics and
          possible information leakage, error correction reconciles the two strings, and privacy
          amplification shortens the result to the length justified by that bound. A fibre
          interruption does not create a universal law that every partial bit must be destroyed;
          whether a completed subset can be processed depends on the protocol and its
          finite-size security rules. Ridgeway's safe action is to quarantine the raw block and
          use only data that can still pass the protocol's defined post-processing as a
          self-contained block."
        rebuttals:
          - Quantum transmission creates correlated raw material, not a secrecy guarantee by itself; the post-processing establishes the bound used for the final key.
          - Whether data from separated periods can be combined is protocol-dependent; the finite-size and channel assumptions cannot simply be ignored.
          - An interrupted session does not impose a universal exact-length rule. The security proof, block definition and completed post-processing decide what can be retained.
      - group: SENSE
        task: Say what a drifting reference does
        title: Everything measured against it
        place: Quantum Sensing
        scene: >
          If the clock really has drifted, every frequency measured in the building since the last
          comparison is off by the same fraction — including the qubit frequencies in the review pack.
        assumes:
          - a measurement is a ratio against a reference
        takeaway: A shared-reference error is dangerous because it can move many instruments coherently while leaving their internal comparisons apparently consistent.
        format: CHOICE
        question: What makes a common reference drift harder to notice internally than independent instrument noise?
        choices:
          - Because the drift is larger than instrument noise.
          - Because everything shifts together, so no internal check disagrees.
          - Because it cannot be measured without a second clock.
          - Because frequency errors compound over time and noise does not.
        answer: Because everything shifts together, so no internal check disagrees.
        why: >
          Independent noise usually reveals itself as scatter when a measurement is repeated or
          compared across instruments. A shared scale error can instead push every instrument
          tied to the same reference in the same direction, so agreement inside the building may
          survive. The danger is not that the drift is necessarily larger; it is that the usual
          cross-checks share the same mistake. An external comparison breaks that common mode.
        rebuttals:
          - Size is not the point; a small common-mode shift is more dangerous than a large random one.
          - It can be measured, and Whitfield's comparison against the national standard is how.
          - Both accumulate in a long measurement; the difference is that one of them is detectable internally.

  - title: The last morning it can be withdrawn
    objective: Decide what to say about a number that is already outside the building.
    briefing: The inflated fidelity is in a conference abstract, and the correction window closes today.
    stake: >-
      Tuesday, and the abstract went out three weeks ago with the inflated fidelity in it. The conference
      allows corrections until five o'clock today and nothing afterwards. Priya Raghavan points out that
      the corrected number is still good and the talk is in four months, when the rerun will be complete
      anyway. Anders Holm says a number that is known to be wrong cannot be left standing on the strength
      of a plan to fix it later. Dasha Petrova wants to know what the correction should actually contain.
      Today you work out what the honest correction says, what it costs, and what the group commits to
      either way.
    takeaway: The moment a correction stops being possible is the moment the decision needs the whole argument rather than the quickest one.
    stops:
      - group: VER
        task: Say what the correction has to contain
        title: What a correction is for
        place: Error & Verification
        scene: The correction window closes today. Petrova has the draft open while the held-out rerun is still running in the next room. If Ridgeway waits for the final number, the window closes; if it files now, the correction must state exactly what is known.
        assumes:
          - a correction is read by people deciding whether to trust the next result
        takeaway: A useful correction tells readers what changed, why it changed, and which conclusions the mechanism can and cannot affect.
        format: PROTOCOL
        why: |-
          Changing only the headline number leaves other groups unable to recognise the same failure mode in their own analysis. Naming the mechanism — fitting and evaluating the discriminator on the same data — makes the correction actionable. Defining the scope matters just as much because readers need to know which Ridgeway results passed through that step and which did not. The rerun can be labelled preliminary or in progress; completeness is valuable, but waiting past a hard correction deadline would preserve a number the group already knows is biased.
        rebuttals:
          - The number has to be corrected, but a changed number alone does not tell readers what failure mode to look for.
          - Naming the mechanism makes the correction actionable because another group can test whether its own analysis has the same dependency.
          - Defining the scope protects unaffected results from being swept into the same uncertainty.
          - Saying the full rerun is under way is necessary context, but it does not replace correcting what is already known to be biased.
        columns:
          - The element
          - What it does
        scenarios:
          - The corrected number.
          - The mechanism that produced the error.
          - Which results are and are not affected.
          - A note that the full rerun is under way.
        choices:
          - The least useful part on its own, though it has to be there.
          - What another group can act on, and the reason to publish at all.
          - What stops every other result falling under the same doubt.
          - Honest context, and no substitute for the correction.
        mapping: [0, 1, 2, 3]
      - group: CTRL
        task: Separate a measured fidelity from a projected register probability
        title: A twelve-qubit projection from three measured qubits
        place: Control & Readout
        scene: >
          "The rerun's first held-out results are in for three qubits: their single-qubit
          readout fidelities cluster around 0.941 rather than the 0.962 reported before. Petrova
          asks for a clearly labelled twelve-qubit projection under the toy assumption that
          every qubit has the same independent readout fidelity."
        assumes:
          - for this estimate only, all 12 qubits have identical independent readout fidelity of 0.941
        takeaway: Exponentiating a per-qubit fidelity gives a projection only after you state the independence and identical-performance assumptions.
        format: BALLPARK
        question: Under that toy assumption, estimate the probability that all 12 readouts are classified correctly in the same shot.
        why: >
          "If 12 readouts are independent and each is correct with probability 0.941, the
          probability that *all 12* are correct is 0.941^12 ≈ 0.48. That is not a measured
          twelve-qubit circuit fidelity: only 3 qubits have been remeasured, the 12
          qubits may have different fidelities, and readout errors can be correlated. The
          calculation is still useful because it shows how modest per-qubit misclassification
          can compound across a register — as long as the slide calls the result a projection
          and names the assumptions."
        estimate:
          prompt: >
            "Toy model: each of 12 qubits has independent readout fidelity 0.941. Estimate the probability that all 12 are read correctly."
          question: Choose the per-qubit fidelity and the number of qubits.
          labels:
            - 0.941  (corrected readout fidelity per qubit)
            - 12  (qubits read out)
            - 0.962  (the figure originally reported)
            - 400  (gates in the circuit)
            - 0.988  (single-gate fidelity)
          values: [0.941, 12, 0.962, 400, 0.988]
          slots: 2
          template: '{0} ^ {1}'
          formula: Math.pow(a,b)
          correct: [0, 1]
          target: 0.48
          tolerance: 0.08
          units: 'across the register'
          solution: 0.941^12 ≈ 0.48.
          explanation: >
            About 0.48. For comparison, 0.962^12 ≈ 0.63. These are register-readout projections
            under identical, independent per-qubit errors — not measured twelve-qubit circuit
            fidelities.
          givens:
            - Corrected readout fidelity is 0.941 per qubit
            - The projection assumes 12 identical, independent readouts
          relationship: >
            "Toy model: P(all 12 read correctly) = (per-qubit readout fidelity)^12."
        answerText: About 0.48, as a twelve-qubit all-readouts-correct projection.
      - group: NET
        task: Decide what the group commits to
        title: What each version costs
        place: Networks & Security
        scene: Raghavan closes the conference-room door and puts two versions on the screen. One changes the headline before the correction window closes; the other leaves it standing. Before anybody signs, he wants the cost of each choice written underneath it.
        assumes:
          - a decision not to act is also a decision with consequences
        takeaway: When both action and inaction have costs, compare their reversible and irreversible consequences rather than treating silence as the zero-cost option.
        format: CASEBOOK
        why: |-
          Correcting now costs a smaller headline, an awkward explanation and the possibility that the final rerun moves the number again. Not correcting preserves a value the group already has evidence is biased and lets the correction deadline expire; Delft also has independent data that could surface the issue later. The asymmetry is not simply embarrassment versus no embarrassment. One path preserves the ability to update the scientific record while stating what is still provisional; the other deliberately gives up that option.
        rebuttals:
          - A prompt correction can state what is provisional; the cost is visible uncertainty now rather than loss of the ability to correct later.
          - Silence is not cost-free once the deadline closes, because the group would later have to explain both the biased number and the decision to leave it.
          - A number-only correction fixes the record but throws away the part of the finding that other laboratories can act on.
          - The dependency audit already identifies unaffected measurements, so withdrawing everything exaggerates rather than clarifies the scope.
        columns:
          - The option
          - What it commits the group to
        scenarios:
          - Correct today with the best current result, mechanism, scope and an explicit note that the full rerun is ongoing.
          - Say nothing now and explain the corrected result at the talk in four months.
          - Correct today but provide only the new number.
          - Withdraw every result in the abstract, whether or not it used the affected analysis.
        choices:
          - Preserves the correction window, accepts a visibly provisional headline now, and leaves room to update the final number later.
          - Preserves the headline today but deliberately lets the correction window close, making the later explanation include why a known bias was left standing.
          - Repairs the numerical record but withholds the reusable failure mechanism that would let other groups audit themselves.
          - Treats a localised analysis fault as if it invalidated the entire abstract, sacrificing results that the dependency audit says are unaffected.
        mapping: [0, 1, 2, 3]
  - title: What we know, and how well
    objective: State the fortnight's results at the confidence each has earned.
    briefing: The review is this afternoon, and every number on the slides needs its evidence beside it.
    stake: >-
      Wednesday, and the fortnight goes in front of the review. Priya Raghavan will not put up a slide that
      states everything in the same typeface of certainty, because a panel that cannot tell a measurement
      from a projection will ask about the wrong thing and then act on the answer. Anders Holm has the
      reruns. Grace Whitfield wants the clock comparison in as a finding rather than a footnote. Marta
      Castellan wants the analysis pipeline versioned and cited. Elena Barros wants ten minutes for the
      thing that already works. Today you sort the fortnight's claims by the evidence under them and decide
      which of its habits the group keeps.
    takeaway: A strong review separates direct measurements, model-dependent inferences and forward projections instead of giving them the same visual certainty.
    stops:
      - group: VER
        task: Sort the claims by their evidence
        title: Measured, inferred, projected
        place: Error & Verification
        scene: >
          Holm puts four of the fortnight's statements on the board. The group believes all four. They are
          not held for the same reasons.
        assumes:
          - a claim can rest on a measurement, an inference, or a projection
        takeaway: Evidence labels tell the audience what would have to be repeated, assumed or extrapolated to challenge each claim.
        format: CASEBOOK
        why: >
          The training/evaluation flaw is directly reproducible in the pipeline and is
          independently exposed by the Delft comparison. The corrected 0.941 readout figure is a
          held-out measurement, but only on 3 qubits so far. The link between the
          fabrication change and the defects remains an inference from a process-window
          correlation until the controlled old-versus-new fabrication comparison is done.
          Expected behaviour under future error correction is a projection that depends on a
          code, a noise model and hardware performance Ridgeway has not yet reached. All four
          may be reasonable statements, but they ask the audience for different kinds of trust.
        rebuttals:
          - The mechanism can be reproduced directly and its consequence is independently visible in the Delft comparison.
          - The corrected fidelity is measured on held-out data, on three qubits so far.
          - The oxidation link is an inference from three chips in one window, without the controlled comparison.
          - A fault-tolerance projection inherits assumptions about the code, noise and future hardware, so it belongs in a different evidence category from a measured fidelity.
        columns:
          - The claim
          - How strongly it is held
        scenarios:
          - The discriminator was scored on its own training data.
          - Corrected readout fidelity is 0.941 per qubit.
          - The defects came from the oxidation change.
          - With error correction this architecture would reach useful depth.
        choices:
          - Directly demonstrated analysis bias, supported by the pipeline audit and the independent-device discrepancy.
          - Measured on held-out data, but on 3 qubits so far rather than the full 12.
          - Inferred from a process-window correlation; a controlled fabrication comparison is still missing.
          - Projected from a specified error-correction model and hardware regime the group has not yet reached.
        mapping: [0, 1, 2, 3]
      - group: SENSE
        task: State the sensing result with its uncertainty
        title: The number that goes to somebody else
        place: Quantum Sensing
        scene: >
          Barros has ten minutes and one number: a field sensitivity, going to a hospital that will act on
          it. She wants the uncertainty in the sentence rather than in a footnote.
        assumes:
          - a delivered number is used by somebody who cannot check it
        takeaway: A figure handed to somebody else has to carry enough with it for them to judge it.
        format: CHOICE
        question: Why is a sensitivity or field result incomplete for the hospital if the associated uncertainty or noise floor is omitted?
        choices:
          - Because medical users require more conservative wording than research collaborators do.
          - Because the user has to judge a change against the noise.
          - Because adding an uncertainty always makes the reported sensitivity numerically less optimistic.
          - Because an error bar certifies that every relevant systematic effect has been found.
        answer: Because the user has to judge a change against the noise.
        why: >
          The hospital needs to decide whether a change in its observed signal is larger than
          what Ridgeway's instrument could plausibly produce through measurement noise and
          calibration uncertainty. A bare central value or sensitivity number does not supply
          that comparison. The associated uncertainty, noise floor and calibration status are
          therefore operational information, not ceremonial caution. They tell the user how
          large a difference must be before it deserves interpretation.
        rebuttals:
          - The purpose is quantitative decision support, not simply a more cautious tone.
          - An uncertainty describes what is known about the measurement; it does not automatically make the central sensitivity estimate more or less optimistic.
          - An error bar reflects the uncertainty model that was built; it is not proof that no unknown systematic remains.
      - group: CRYO
        task: Decide which habits survive
        title: What outlives the fortnight
        place: Cryogenics & Vacuum
        scene: >
          Four things the group started doing under pressure. Okafor asks which of them are worth their cost
          on an ordinary Tuesday, when nothing is wrong.
        assumes:
          - a practice adopted in a crisis has a cost that only shows later
        takeaway: Keep inexpensive practices that directly block a demonstrated failure mode; distinguish them from good documentation that only helps reconstruct the failure afterwards.
        format: TRIAGE
        question: Which permanent practice most directly prevents the discriminator mistake from recurring at low cost?
        choices:
          - Evaluating every fitted analysis on data it has never seen.
          - Repeat every full experiment independently before anyone is allowed to inspect either result.
          - Keep the daily crisis meeting permanently, even when no anomaly is active.
          - Version and cite the analysis pipeline used for every published figure.
        answer: Evaluating every fitted analysis on data it has never seen.
        why: >
          The failure survived because a fitted classifier was judged on the same data used to
          tune it. Requiring a genuinely held-out evaluation set for fitted predictive or
          classification steps directly blocks that failure mode and costs only extra shots and
          a few minutes. Versioning the pipeline remains valuable because it makes later
          reconstruction possible, but it does not by itself prevent optimistic evaluation.
          Repeating every experiment doubles cost without targeting this mechanism, and a daily
          crisis meeting is unlikely to survive ordinary operations.
        rebuttals:
          - Versioning is excellent provenance and would make a future failure easier to trace; it does not itself stop a classifier being tested on its training data.
          - A blanket duplicate run is expensive and still does not guarantee independence if both runs reuse the same flawed analysis rule.
          - A daily meeting is useful during a fast-moving fault and is not a targeted control against training/evaluation leakage.

interiors:
  CRYO:
    caption: The fridge is a plumbing problem with an expensive isotope in it.
    standLine: Six stages, and the coldest one is where the chip lives.
    station:
      kind: panel
      title: Stage temperatures
      rows:
        - { label: 50 K stage, value: 47 K, status: normal }
        - { label: 4 K stage, value: 3.9 K, status: normal }
        - { label: Still, value: 0.94 K, status: high }
        - { label: Mixing chamber, value: 11 mK, status: normal }
  FAB:
    caption: A mistake here shows up in somebody else's measurement, months later.
    standLine: Coupons from every run since 2020, and the drawer nobody wanted to spare.
    station:
      kind: panel
      title: Wafer coupon
      rows:
        - { label: Junction resistance, value: 11.4 kΩ, status: normal }
        - { label: Spread across wafer, value: 18%, status: alarm }
        - { label: Process window, value: 'spring, oxidation changed', status: high }
  CTRL:
    caption: Pulses in, one bit out, and everything that can go wrong between.
    standLine: 12 qubits, tuned this morning, and a chain of amplifiers to hear them through.
    station:
      kind: panel
      title: Tune-up
      rows:
        - { label: Qubit 12 frequency, value: 4.61 GHz, status: high }
        - { label: Flip pulse, value: 42 ns, status: normal }
        - { label: Readout fidelity, value: 0.941 held out, status: normal }
        - { label: Defect, value: '4.55 GHz, avoid', status: alarm }
  VER:
    caption: How wrong the machine is, and how you would know.
    standLine: Two error numbers, both honest, answering different questions.
    station:
      kind: panel
      title: Error budget
      rows:
        - { label: Benchmarked gate error, value: 1.2%, status: alarm }
        - { label: Best single gate, value: 0.4%, status: normal }
        - { label: Code threshold, value: about 1%, status: high }
        - { label: Bell value, value: '2.78, rerunning', status: high }
  SENSE:
    caption: The part of this field that already works for somebody else.
    standLine: A magnetometer, a hospital across the city, and a calibration due at two.
    station:
      kind: panel
      title: Magnetometer
      rows:
        - { label: Single-shot resolution, value: 40 pT, status: normal }
        - { label: After averaging, value: 4 pT, status: normal }
        - { label: Last comparison, value: within uncertainty, status: normal }
        - { label: Clock offset, value: 4e-15, status: alarm }
  NET:
    caption: Sending a quantum state somewhere, and what survives the trip.
    standLine: 40 kilometres of fibre, a substation, and a contractor with a digger.
    station:
      kind: panel
      title: Key link
      rows:
        - { label: Distance, value: 41 km, status: normal }
        - { label: Quantum bit error rate, value: 4.1%, status: normal }
        - { label: Sifted rate, value: 3.2 kbit/s, status: normal }
        - { label: Link, value: cut at 15:20, status: alarm }

copy:
  CRYO: <p>Cryogenics. The fridge hangs open for service, its stages exposed one under another, each colder than the last. Everything here is about heat that should not arrive.</p>
  FAB: <p>Fabrication. Yellow light, a spin coater, and a drawer of wafer coupons going back six years that nobody thought was worth the space until the week it was.</p>
  CTRL: <p>Control and readout. Racks of microwave gear, more cable than anybody expects, and the desks where the machine is argued with several times a day.</p>
  VER: <p>Verification. Plots of error against sequence length on every surface, and the wall of results nobody is allowed to believe yet.</p>
  SENSE: <p>Sensing. A magnetometer inside a shield, a frequency standard in a rack, and the only instrument in the building somebody outside the group depends on.</p>
  NET: <p>Networks. A fibre spool, a splice tray, and 40 kilometres of duct between here and a substation.</p>
  ARRIVE: <p>Sign-in. The register, the interlock keys, and the list of what may not be carried past this desk.</p>
  OFFICE: <p>The group office. Where the argument about publishing happens, most days, at the kettle.</p>
  STORE: <p>Gas and cryogen store. Helium, nitrogen, and the delivery schedule that decides what can be done this month.</p>
  RACKS: <p>The microwave racks. Attenuators, circulators and amplifiers, in the order the signal meets them.</p>
  DESK: <p>Analysis desks. Where the shots become numbers, and where the pipeline that does it is maintained.</p>
  QUIET: <p>The reading room. One table, no instruments, and a door that shuts.</p>
  SHIELD: <p>The shielded room. Mu-metal walls, a heavy door, and nothing electronic that has not been signed in.</p>

# quantum.yml — the Ridgeway Quantum Laboratory, over one fortnight.
#
# Modern quantum taught through the hardware. The rule this book is written
# under: every question is about an instrument, a number or a choice, and if it
# can only be settled by an interpretation of quantum mechanics it does not go
# in. That is how this subject usually fails.
#
# The argument, both sides right on a named day: Priya Raghavan says a result
# held back is a result somebody else gets credit for; Anders Holm will not put
# his name to anything he has not seen on a second device. Raghavan is right on
# day 5. Holm is right on day 11.

theme:
  id: quantum
  title: Quantum
  subtitle: Group Lead · Ridgeway Quantum Laboratory

groups:
  - id: CRYO
    code: CRYO
    name: Cryogenics & Vacuum
    color: '#2980b9'
    desc: Why the chip has to be colder than anything else in the building.
    defaultLeader: okafor
    milestones: [Read the stages, Find the heat, Fix the load, Ready to hand over]
  - id: FAB
    code: FAB
    name: Fabrication & Materials
    color: '#8e6b2f'
    desc: What the chip is made of, and what that decides months later.
    defaultLeader: lindqvist
    milestones: [Look at the wafer, Date the defect, Change the process, Ready to hand over]
  - id: CTRL
    code: CTRL
    name: Control & Readout
    color: '#c0392b'
    desc: Pulses in, one bit out, and everything that can go wrong between.
    defaultLeader: mensah
    milestones: [Find the qubit, Calibrate, Read it out, Ready to hand over]
  - id: VER
    code: VER
    name: Error & Verification
    color: '#7d5ba6'
    desc: How wrong the machine is, and how you would know.
    defaultLeader: holm
    milestones: [Measure the error, Check the method, Reproduce it, Ready to hand over]
  - id: SENSE
    code: SENSE
    name: Quantum Sensing
    color: '#2f8f7a'
    desc: The part of this field that already works for somebody else.
    defaultLeader: barros
    milestones: [Set the sensor, Beat the noise, Calibrate the scale, Ready to hand over]
  - id: NET
    code: NET
    name: Networks & Security
    color: '#d35400'
    desc: Sending a quantum state somewhere, and what survives the trip.
    defaultLeader: sadiq
    milestones: [Send the key, Count the errors, Bound the leak, Ready to hand over]

roster:
  - id: raghavan
    name: Priya Raghavan
    role: Group lead, and the person who has to find the money
    division: VER
    color: '#7d5ba6'
    bio: >-
      <p>Built this group out of two postdocs and a borrowed fridge, and has spent nine years
      since then writing proposals in January. She reads a result for what it lets the group do
      next, which is not the same as reading it for what it proves, and she knows the
      difference.</p> <p>Her position in the fortnight's argument is not recklessness. A finding
      nobody publishes is a finding somebody else publishes first, and the group that publishes
      second gets to check the work.</p>
    quiz:
      - q: What trade-off is Raghavan making when she pushes to move before every number is settled?
        a: The scientific cost of waiting, against the risk of making a claim too early
        wrong:
          - The statistical gain from collecting more data, against the cost of another cooldown
          - The chance a journal will reject the paper, against the chance a competitor submits first
          - The time needed to write the paper, against the time needed to automate the analysis
  - id: holm
    name: Anders Holm
    role: Verification lead
    division: VER
    color: '#6b4f96'
    bio: >-
      <p>Spent four years in metrology before this and came out of it with a habit: he asks what else could
      produce this number before he asks what it means. He is slow in a way that has twice saved the group
      from retracting.</p>
      <p>He is not against publishing. He is against publishing a number that has only ever appeared on one
      machine, in one room, with one person's calibration underneath it.</p>
    quiz:
      - q: What does a second device test that repeating the same experiment on Ridgeway's device cannot?
        a: One machine cannot show you the errors it shares with itself
        wrong:
          - Random uncertainty, because two devices automatically double the useful sample size
          - Long-term drift, because a second device acts as a clock reference
          - Fabrication yield, because a newer device is statistically more representative
  - id: okafor
    name: Ijeoma Okafor
    role: Cryogenic engineer
    division: CRYO
    color: '#2980b9'
    bio: >-
      <p>Thinks of the fridge as a plumbing problem with an expensive isotope in it, and is right. She can
      tell from the mixing chamber temperature which stage a heat leak is on, and she keeps a log of every
      cooldown the lab has ever done.</p>
      <p>Her standing complaint is cable: every line into the fridge is a road for heat, and everybody wants
      one more.</p>
    quiz:
      - q: Why does Okafor object to every new cable into the fridge?
        a: A line that carries a signal down also carries heat down
        wrong:
          - Each cable adds electrical noise to the qubit's environment
          - The mixing-chamber flange has a fixed cable count that cannot be exceeded
          - A new line increases the helium-3 consumption in direct proportion to its length
  - id: lindqvist
    name: Sara Lindqvist
    role: Fabrication lead
    division: FAB
    color: '#8e6b2f'
    bio: >-
      <p>Makes the chips, and can date a defect to a process change from the shape of what fails. She keeps
      wafer coupons from every run going back six years, which nobody thought was worth the drawer space
      until the week they were.</p>
      <p>She is patient about the fact that her mistakes only show up in somebody else's measurement, months
      later.</p>
    quiz:
      - q: Why does Lindqvist keep coupons from every fabrication run?
        a: They preserve material from the run that made the failed device
        wrong:
          - They provide a reference junction whose frequency is known not to drift
          - They let her reproduce the old deposition rate without using the process log
          - They can substitute for a damaged device because the coupon contains spare qubits
  - id: mensah
    name: Kofi Mensah
    role: Control engineer
    division: CTRL
    color: '#c0392b'
    bio: >-
      <p>Calibrates the machine several times a day and has automated most of it, which means he is the
      person most likely to notice when the automation has quietly started answering its own question.</p>
      <p>He describes his job as arguing with a machine that agrees with you too easily.</p>
    quiz:
      - q: What does Mensah mean about a machine that agrees too easily?
        a: It can succeed at its own test and miss everything outside it
        wrong:
          - Automated calibration always finds a local rather than a global optimum
          - A successful calibration proves the pulse fired but not that the qubit received it
          - Averaging during calibration hides all systematic errors by turning them into random noise
  - id: barros
    name: Elena Barros
    role: Sensing physicist
    division: SENSE
    color: '#2f8f7a'
    bio: >-
      <p>Runs the magnetometer, which is the only instrument in the building somebody outside the group
      depends on: a hospital across the city uses her measurements, and they do not care what a qubit is.</p>
      <p>She is the reminder that this field already delivers something, and that delivering it means
      calibration, uptime and a phone that rings.</p>
    quiz:
      - q: Why does Barros treat her instrument differently from the processor?
        a: Somebody outside the group is already relying on its numbers
        wrong:
          - The sensor must meet a fundamentally different quantum-mechanical limit from a research instrument
          - The hospital can accept only measurements made without cryogenic hardware
          - A service instrument no longer needs exploratory measurements once it has been commissioned
  - id: sadiq
    name: Yusuf Sadiq
    role: Networks postdoc
    division: NET
    color: '#d35400'
    bio: >-
      <p>Runs the fibre to a substation 40 kilometres away and spends most of his time on things that are
      not quantum at all: splices, connectors, a contractor with a digger, and the temperature of a duct.</p>
      <p>He is clear that the security argument only holds if the hardware does what the protocol assumed,
      which is where every real attack has been.</p>
    quiz:
      - q: Where does Sadiq say the real attacks on a key link come from?
        a: Hardware behaving unlike the device the proof assumed
        wrong:
          - The mathematics protects only the classical channel, leaving the quantum channel outside the proof
          - Long fibre changes the no-cloning theorem, so the proof has to be re-derived for each distance
          - Any optical loss is evidence of an eavesdropper rather than an ordinary channel imperfection
  - id: whitfield
    name: Grace Whitfield
    role: Metrologist, and keeper of the clock
    division: SENSE
    color: '#3a9a84'
    bio: >-
      <p>Owns the frequency standard everything in the building is timed against, and is unbothered by how
      dull that sounds. Every measurement here is a comparison, and a comparison is only as good as the
      thing being compared to.</p>
      <p>She is the person who asks, quietly, what the number is traceable to.</p>
    quiz:
      - q: What does traceability add that a precise, repeatable reading does not?
        a: An unbroken chain of comparisons out to an agreed standard
        wrong:
          - A guarantee that the instrument has not drifted since its last calibration
          - A way to repeat the same measurement without knowing the original apparatus
          - A requirement that every measurement use the national standard directly
  - id: nakamura
    name: Ren Nakamura
    role: Readout and amplifier specialist
    division: CTRL
    color: '#a0392b'
    bio: >-
      <p>Owns the chain between the chip and the digitiser: amplifiers, circulators, attenuators, and the
      noise budget that decides whether a single shot means anything.</p>
      <p>He points out regularly that most of what people call qubit error is his chain failing to hear a
      qubit that was fine.</p>
    quiz:
      - q: Why does Nakamura say much of what looks like qubit error is not?
        a: A noisy chain misreads a qubit that was in the right state
        wrong:
          - Amplifiers add energy that excites the qubit during readout
          - Qubit errors and readout errors are impossible to tell apart
          - A control pulse can flip the classical digitiser even when it never reaches the qubit
  - id: petrova
    name: Dasha Petrova
    role: Theory, error correction
    division: VER
    color: '#8b6bb0'
    bio: >-
      <p>Works out what the hardware would have to reach before error correction helps, and is
      the person most likely to ask whether a headline error number is even the quantity a
      threshold is defined for.</p> <p>She is cheerful about bad news. A threshold is
      quantitative, but it belongs to a particular code and noise model rather than to quantum
      computers in general.</p>
    quiz:
      - q: What does Petrova mean when she says the threshold is not an opinion?
        a: Below a certain physical error rate, adding qubits helps; above it, they hurt
        wrong:
          - The threshold is fixed by international agreement between laboratories
          - Any measured average gate fidelity can be compared directly with any published threshold
          - The threshold is set mainly by the number of physical qubits available on the processor
  - id: adeyemi
    name: Tunde Adeyemi
    role: Laboratory manager
    division: CRYO
    color: '#3d7fb0'
    bio: >-
      <p>Runs the building: helium deliveries, the interlock register, who is trained on what, and the list
      of things that may not be carried past the sign-in desk.</p>
      <p>He is the reason the shielded room is still shielded, and he has removed a phone from somebody's
      pocket more than once.</p>
    quiz:
      - q: Why does Adeyemi stop people carrying phones past sign-in?
        a: One transmitter inside undoes the whole shield
        wrong:
          - Phones interfere with the interlock system on the laser bay
          - Photography is not permitted anywhere in the laboratory
          - Phone batteries are a fire risk near stored cryogens
  - id: castellan
    name: Marta Castellan
    role: Research software, data and provenance
    division: NET
    color: '#e08a2e'
    bio: >-
      <p>Keeps the pipeline that turns raw shots into published numbers, and the record of which version of
      which script produced which figure. Everybody thanks her in a crisis and nobody funds her in between.</p>
      <p>Her question, on every plot, is which data the analysis had already seen.</p>
    quiz:
      - q: Why does Castellan ask which data an analysis had already seen?
        a: A fitted rule can look better on the data that shaped it than on genuinely unseen data
        wrong:
          - Using the same data twice doubles the effective sample size but makes the uncertainty harder to calculate
          - Processed data cannot be used for validation because only raw detector voltages preserve provenance
          - A method evaluated on old data is necessarily less accurate than one evaluated on the newest run

glossary:
  - name: Qubit
    aliases: [qubits]
    def: A controllable quantum system in which two chosen states represent the basic unit of quantum information.
  - name: Superposition
    aliases: []
    def: A state that is a combination of both outcomes at once, until it is measured.
  - name: Entanglement
    aliases: [entangled, entangle]
    def: A shared state in which two systems are correlated more strongly than any instructions agreed in advance could make them.
  - name: Coherence
    aliases: [coherent, decoherence]
    def: How long a quantum state preserves the phase relationships needed for interference and controlled evolution.
  - name: Relaxation time
    aliases: [T1]
    def: The typical time an excited state keeps its energy before giving it up.
  - name: Dephasing
    aliases: [T2, dephase]
    def: Loss of phase coherence, which can occur even when the system does not lose energy.
  - name: Rabi frequency
    aliases: [Rabi]
    def: The rate at which a resonantly driven two-level system oscillates between its two states, set by the drive strength.
  - name: Pi pulse
    aliases: [π pulse]
    def: A pulse of exactly the duration that turns the state from one level to the other.
  - name: Detuning
    aliases: [detuned]
    def: The gap between the frequency you are driving at and the frequency the system answers to.
  - name: Readout
    aliases: [read out, single-shot readout]
    def: Converting information about a qubit's state into a classical signal that can be amplified, digitised and classified.
  - name: Discriminator
    aliases: [classifier]
    def: A decision rule that assigns a continuous readout signal to one of the reported states.
  - name: Fidelity
    aliases: []
    def: A measure from nought to one of how closely a prepared state, operation or measurement matches the intended one.
  - name: Gate
    aliases: [gates]
    def: One operation applied to a qubit or a pair of them.
  - name: Randomised benchmarking
    aliases: [benchmarking, randomized benchmarking]
    def: A way of measuring average error over many random sequences, so that readout error does not hide inside the answer.
  - name: Dilution refrigerator
    aliases: [fridge, cryostat]
    def: The machine that cools a chip to a few thousandths of a degree above absolute zero, in stages.
  - name: Mixing chamber
    aliases: []
    def: The final and coldest stage of the refrigerator.
  - name: Heat load
    aliases: []
    def: How much heat arrives at a stage, which is what decides the temperature it can hold.
  - name: Josephson junction
    aliases: [junction, junctions]
    def: A thin barrier between two superconductors, which is what makes a superconducting qubit possible.
  - name: Two-level defect
    aliases: [two-level system, TLS]
    def: A microscopic material defect that behaves approximately like a two-state system and can couple resonantly to a qubit.
  - name: Threshold
    aliases: []
    def: The error rate below which adding more physical qubits improves a logical one, and above which it does not.
  - name: Logical qubit
    aliases: []
    def: One protected qubit built out of many physical ones, so that some errors can be corrected.
  - name: Bell test
    aliases: [CHSH, Bell inequality]
    def: A measurement whose result rules out any explanation based on instructions agreed before the measurement.
  - name: Standard quantum limit
    aliases: [shot noise]
    def: The usual 1/√N improvement obtained by averaging N independent measurements or independent quantum probes.
  - name: Squeezing
    aliases: [squeezed]
    def: Trading uncertainty in one quantity for less in another, so a sensor can beat the averaging limit.
  - name: Magnetometer
    aliases: [magnetometry]
    def: An instrument that measures magnetic field.
  - name: Key distribution
    aliases: [QKD, quantum key distribution]
    def: A protocol for establishing shared secret key material while using measured disturbances and authenticated communication to bound an eavesdropper's information.
  - name: Quantum bit error rate
    aliases: [QBER, error rate]
    def: The fraction of compared or sifted bits that disagree between the two ends of a quantum-key-distribution link.
  - name: Calibration
    aliases: [calibrate, calibrated, recalibrate]
    def: Determining how an instrument's response relates to known references or test states, so its later readings can be interpreted.
  - name: Attenuation
    aliases: [attenuator, attenuators]
    def: Deliberately weakening a signal, which on a line running downward also cuts the noise it carries.
  - name: Chip
    aliases: [chips, die]
    def: The small piece of patterned silicon the qubits are built on.
  - name: Equilibrium
    aliases: [equilibrate]
    def: A settled state in which the flows into something and out of it are balanced.
  - name: Provenance
    aliases: []
    def: The record of where a number came from and everything that was done to it.
  - name: Traceable
    aliases: [traceability]
    def: Linked by a documented, unbroken chain of calibrations to a recognised reference, with uncertainties carried through the chain.

missions:
  - title: Cold enough to have a ground state
    objective: Work out why the chip has to be colder than anything else in the building.
    briefing: The fridge is at 42 millikelvin instead of 11, and nothing on the chip behaves.
    stake: >-
      Monday, and the machine is warm. Ijeoma Okafor brought the fridge down over the weekend
      and it has settled at 42 millikelvin instead of the 11 it usually holds, which sounds like
      a small difference and is not. Kofi Mensah cannot get a clean measurement out of any qubit
      on the chip, and Priya Raghavan has a review in ten days. Okafor thinks the heat is coming
      down a cable somebody added in the last cooldown. Today you work out what temperature
      actually does to a qubit, put a number on how much of the chip is sitting in the wrong
      state before anybody touches it, and find where the heat is getting in.
    takeaway: A qubit is only a two-state system while the room around it has no energy to spare.
    stops:
      - group: CRYO
        task: Find where the heat is arriving
        title: Which stage the leak is on
        place: Cryogenics & Vacuum
        scene: Delft's slot is now on the calendar, but Ridgeway's fridge has stalled above its normal base temperature. The cryostat is open in service mode, six stages down the chain. Okafor has last cooldown's numbers and a thermometer at every stage.
        assumes:
          - a refrigerator removes heat in stages, each colder than the last
          - a conductive path carries heat to wherever it is anchored, and past wherever it is not
        takeaway: A refrigerator's stage-by-stage temperature pattern can localise a heat load instead of merely announcing that one exists.
        format: PROBE
        question: The bottom of the fridge is warm and the top may not be. Take the readings you think you need — at which stage is the heat arriving?
        answerText: The still. It is the first stage that has moved — a quarter of a kelvin above last cooldown, with its heater working 40% harder — and everything below it is warm because the load is above them, not because their own cooling has failed.
        why: |-
          Two stages held exactly what they held last time, which is what rules almost everything out: a vacuum problem, a failing pulse tube, a room-temperature fault would all warm the top of the chain first, and the top of the chain has not moved. From the still downwards every stage is high and working harder, and heat only behaves that way when it is being delivered from above. So the deepest stage is the worst affected and is not where the problem is — the load enters at the first stage that departs, and the stages below it are inheriting it. That is a conductive path anchored at 50 K and 4 K and not below, which is exactly what a line added since the last cooldown and heat-sunk at only the easy stages does. Okafor's cable is now worth looking at, not because cables are always guilty but because this pattern is what an unanchored one predicts.
        probe:
          chainLabel: Stage
          hint: Each station reports what it is holding now, what it held on the last cooldown, and what its cooling is having to do. Read as few or as many as you like.
          stations:
            - id: PT1
              label: 50 K stage
              reading: 47 K
              expected: 47 K
              load: as expected
            - id: PT2
              label: 4 K stage
              reading: 3.9 K
              expected: 3.9 K
              load: as expected
            - id: STILL
              label: Still
              reading: 0.94 K
              expected: 0.70 K
              load: heater 40% above normal
            - id: CFHX
              label: Heat exchanger
              reading: 190 mK
              expected: 120 mK
              load: no separate control
            - id: PLATE
              label: Cold plate
              reading: 95 mK
              expected: 55 mK
              load: no separate control
            - id: MXC
              label: Mixing chamber
              reading: 42 mK
              expected: 11 mK
              load: full circulation
          target: STILL
          minReadings: 3
          commit: Name the stage
      - group: CRYO
        task: Say why 42 millikelvin is not close enough
        title: The energy of one quantum against the energy of the room
        place: Cryogenics & Vacuum
        scene: The chip's qubits answer at about 5 gigahertz. Okafor circles the Delft date on the whiteboard, writes 2 energy scales beside it — 1 quantum at that frequency and the thermal energy at 42 millikelvin — and waits.
        assumes:
          - a system in contact with something warm can absorb energy from it
        takeaway: Thermal energy well below one quantum is what keeps a qubit in its ground state at rest.
        format: BALLPARK
        question: Using the 2 energy scales, estimate the equilibrium excited-state fraction at 42 mK.
        answerText: About 0.34%.
        why: |-
          "A qubit sitting in a warm environment does not stay in its ground state: it is being offered energy all the time, and it takes some. The fraction that ends up excited follows the ratio of the thermal energy to the energy of one quantum, exponentially, which is why a factor of four in temperature is not a factor of four in behaviour. At 11 millikelvin almost nothing is excited. At 42 the population is large enough that a measurement of \"the ground state\" is partly a measurement of the fridge."
        estimate:
          prompt: |-
            For a 5.0 GHz qubit, hf = 3.3 × 10⁻²⁴ J. At 42 mK, kT = 5.8 × 10⁻²⁵ J. For hf ≫ kT, use p_excited ≈ e^(−hf/kT).
          question: Choose the quantum energy and the thermal energy.
          labels:
            - 3.3e-24  (hf at 5 GHz, in joules)
            - 5.8e-25  (kT at 42 mK, in joules)
            - 1.5e-25  (kT at 11 mK, in joules)
            - 5.0  (the qubit frequency in GHz)
            - 42  (the fridge temperature in mK)
          values: [3.3e-24, 5.8e-25, 1.5e-25, 5, 42]
          slots: 2
          template: e^(−{0} ÷ {1})
          formula: Math.exp(-a/b)
          correct: [0, 1]
          target: 0.0034
          tolerance: 0.002
          units: of the qubits
          solution: e^(−3.3e-24 / 5.8e-25) = e^(−5.7) ≈ 0.003.
          explanation: |-
            About 3.4 × 10⁻³, or 0.34%. At 11 mK the same estimate is about 3 × 10⁻¹⁰, so the warmer fridge increases the equilibrium excited population by roughly 7 orders of magnitude even though the absolute population is still below 1%.
          givens:
            - 1 quantum at 5 GHz is 3.3 × 10⁻²⁴ J
            - The thermal energy at 42 mK is 5.8 × 10⁻²⁵ J
          relationship: |-
            For hf several times larger than kT, excited fraction ≈ e^(−hf/kT); lowering T increases hf/kT and suppresses the population exponentially.
      - group: CTRL
        task: Decide what to measure while the fridge is warm
        title: What is worth doing at the wrong temperature
        place: Control & Readout
        scene: "Fixing the heat leak means a warm-up and another cooldown: four days. With Delft's slot approaching, Mensah does not want four empty days and asks what work remains interpretable while the device is off its normal temperature."
        assumes:
          - some measurements depend on temperature and some do not
        takeaway: An off-nominal machine can still produce useful diagnostics, but those data must not be mistaken for nominal performance.
        format: TRIAGE
        question: What is the best use of the off-nominal period if Ridgeway needs trustworthy baseline numbers before the Delft run?
        why: |-
          The machine is not useless at 42 millikelvin, but the question attached to each measurement changes. Thermal population can be measured precisely, and temperature-dependent T1, readout and resonator occupancy can diagnose what the heat is doing. Those are useful *warm-state diagnostics*, not the nominal figures the review needs. The best use of the downtime is therefore work whose interpretation survives the off-nominal temperature — wiring continuity, attenuation, gain and timing — plus explicitly labelled temperature diagnostics. Review-quality coherence, readout and benchmarking should be repeated after the fridge returns to its normal operating point.
        choices:
          - Warm checks — wiring and electronics, which the chip cannot affect.
          - Use the 42 mK coherence values as the review numbers, because T1 and T2 are still measurable.
          - Run only readout calibration, because the excited population is below 1%.
          - Run the full benchmark suite and correct every result later with the calculated thermal population.
        answer: Warm checks — wiring and electronics, which the chip cannot affect.
        rebuttals:
          - A coherence time at 42 mK is a real measurement of the warm configuration, not a nominal-performance number for an 11 mK device.
          - A sub-one-per-cent thermal population is already comparable with the error budget of a high-fidelity readout, and temperature can affect more than equilibrium population.
          - A single thermal-population correction cannot generally undo temperature-dependent changes in relaxation, resonator occupation and control performance.
  - title: Finding a qubit that will not answer
    objective: Locate a transition and turn a drive into a pulse that flips it.
    briefing: The chip is cold again and one qubit is not where the design says it should be.
    stake: >-
      Friday, the fridge is at 11 millikelvin and 11 of the 12 qubits are where they were last month.
      The twelfth is not answering anywhere near its design frequency, and Kofi Mensah has spent the morning
      sweeping. Sara Lindqvist thinks the junction on that one came out of a run she has been suspicious of
      since the spring. Priya Raghavan needs 12 working qubits for the circuit she has promised the
      review. Today you find the transition by sweeping for it, turn the drive into a pulse that flips the
      qubit reliably, and decide whether this chip is the one to spend the fortnight on.
    takeaway: A qubit is not at the frequency you designed; it is at the frequency it answers to, and finding that is the first measurement.
    stops:
      - group: CTRL
        task: Read a frequency sweep
        title: Where the qubit actually is
        place: Control & Readout
        scene: The fridge is back at base temperature. Mensah has the drive on the twelfth qubit and a readout that reports how much population ends up excited. The design put this qubit at 5.02 gigahertz, but the readout there has been flat all morning.
        assumes:
          - a system absorbs energy strongly only near its own transition frequency
        takeaway: A designed transition frequency is a target; spectroscopy tells you where the fabricated device actually responds.
        format: SWEEP
        question: Nothing responds at the design frequency. Which frequency does this qubit absorb the drive at?
        answerText: 4.61 GHz, where nearly the whole population is driven into the excited state. The much weaker feature near 4.55 GHz is real and is not the qubit.
        why: |-
          A qubit absorbs a drive only close to its own transition, so the frequency where the population goes up is the transition. It is nowhere near 5.02 GHz because that number was a prediction: the frequency depends on a junction barrier about a nanometre thick, and no process controls a nanometre exactly. Two responses appear, and size is what separates them — a transition driven on resonance takes almost the whole population, while the small feature takes a sixth of it and is something else on the chip. Which of the two is the qubit can be settled by driving harder and watching only one of them saturate.
        sweep:
          axis:
            label: Drive frequency
            unit: GHz
            min: 4.2
            max: 6.4
            step: 0.01
          readout:
            label: Excited population

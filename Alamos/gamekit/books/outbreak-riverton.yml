        guide: >-
          Four data streams, and each one saw a different slice of the city. Pair them
          by asking who is in that sample, and what the stream can and cannot establish.
          A sewer signal does not name a person and does not prove waterborne spread.
          And prevalence counts everyone currently ill, which is why it can stay high
          while new cases fall.

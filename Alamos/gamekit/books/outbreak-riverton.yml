    - zone: Sequencing depth
      label: Sequencing depth
      value: Stable
      status: normal
      note: No systematic loss of low-count samples
    - zone: Neutral control variants
      label: Neutral control variants
      value: No coordinated rise
      status: normal
      note: Background frequencies remain stable
    - zone: Adjusted growth estimate
      label: Adjusted growth estimate
      value: Variant lineages grow faster after place and date are controlled
      status: alarm
      note: Comparison reduces a major sampling confounder
    choices:
    - label: Real selective advantage
      mechanism: The variant has a reproducible growth advantage and increases in frequency across independent populations.
    - label: Changing sampling mix
      mechanism: The apparent rise is created because later samples come from different places or patient groups.
    - label: Sequencing artifact
      mechanism: A technical change makes the variant easier to detect over time.
    - label: Single founder event only
      mechanism: One early cluster happens to contain the variant, with no broader growth advantage.
    answer: Real selective advantage
    why: The rise repeats across independent hospitals, technical depth is stable, neutral variants do not show the same shift,
      and the adjusted lineage comparison still shows faster growth. Together those checks support selection rather than a
      sampling or laboratory artifact.

            - id: a4
              label: Well, shares a kitchen
              tags: [cannotisolate]
            - id: a5
              label: Confirmed, lives alone
              tags: [confirmed]
            - id: a6
              label: Breathless, lives alone
              tags: [breathless]
            - id: a7
              label: Well, care home resident
              tags: [cannotisolate]
            - id: a8
              label: Mild, hostel bed
              tags: [cannotisolate, mild]
          rules:
            - say: Anybody short of breath
              want: [breathless]

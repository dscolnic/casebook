        background:
          - >-
              Why precommit at all. Occupancy is at 75% and climbing, and every hour of
              deliberation is an hour of lead time spent. A rule set now is the same
              decision made calmly, and it is the only version that can be explained
              afterwards to people whose care was affected.
          - >-
              Why the two actions need different numbers. They take different times to have
              effect. A threshold set for the slower one triggers the faster one far too
              early; set for the faster one, the slower cannot finish in time. The lead time
              is the whole reason there are two.
          - >-
              Why reversible matters. Both actions can be undone if the trace turns out to
              be pessimistic, which is what makes it reasonable to commit to them in
              advance. An irreversible action would need a different standard of evidence
              entirely.
        assumes:
          - a trigger is written before the next number arrives
          - reversible preparations still need time to take effect
        takeaway: Adaptive policy works best when observable thresholds and lead times are committed before the evidence moves.
        format: TRIGGER
        question: >-
          At what critical-care occupancy do you activate overflow staffing, given it takes a day to
          arrive?
        trigger:
          # data provenance: invented policy thresholds applied to a source-derived worst-case occupancy trace
          hint: >-
            Write the threshold before releasing the trace. The staffing takes a day to arrive, so a
            rule that fires with less than that has called something which cannot happen.
          scale:
            min: 70
            max: 100
            unit: "% of staffed beds"
            label: Critical-care occupancy
            anchors:
              - { at: 75, means: 'a bad week; every admission still meets a staffed bed' }
              - { at: 95, means: 'beds with nobody to staff them, and the next admission waits' }
          stream:
            - t: 0
              value: 75
              hoursLeft: 72
              at: day 0
              update: 75 % staffed critical-care beds occupied
            - t: 1
              value: 82
              hoursLeft: 48
              at: day 1
              update: 82 % staffed critical-care beds occupied
            - t: 2
              value: 88
              hoursLeft: 24
              at: day 2
              update: 88 % staffed critical-care beds occupied
            - t: 3
              value: 95
              hoursLeft: 0
              at: day 3
              update: 95 % staffed critical-care beds occupied
          objective: >-
            Overflow staffing is under way before occupancy reaches 95 %.
          rehearsal:
            note: the first wave, the same unit
            stream:
              - { value: 78, hoursLeft: 72 }
              - { value: 84, hoursLeft: 48 }
              - { value: 89, hoursLeft: 24 }
              - { value: 92, hoursLeft: 0 }
          conditions:
            - id: staffing
              label: Activate overflow staffing and transfer planning
              leadHours: 24
              window: { min: 78, max: 84 }
        answerText: >-
          Activate around 80 % occupancy. It then fires on the 82 % update with 48 hours in hand,
          which covers the day the staffing needs; waiting for 88 % leaves 24 hours and 95 % leaves
          none.
        why: A trigger is a decision rule written before the next value arrives. That matters because preparation takes time even when the action is reversible. In the source numbers, 90 of 120 beds are already occupied, so the system starts at 75%. The no-discharge bound reaches critical occupancy quickly. Precommitting a staffing threshold and a later surge-capacity threshold prevents hindsight from changing the rule after every update. The policy remains adaptive because it responds to observations, but the standard for acting was fixed before those observations appeared.
  - title: The Final Briefing
    objective: Produce a claim-by-claim evidence package with explicit residual uncertainties and durable surveillance responsibilities.
    briefing: The mayor, hospitals, and public must receive one integrated account of what happened, what remains uncertain, and which actions should continue.
    stake: Day 140. The mayor is on air in an hour, and behind that broadcast sit five months of conclusions that are not equally solid. The route of transmission is settled. The animal source is not, and Castellanos has said so in writing. One thing said in public early — that this began with the hospital cluster — did not survive Oduya's sewer sample. This stage you go through the claims one at a time and decide what the city keeps funding after the emergency budget closes. Say too little and the next outbreak arrives with nobody watching for it.
    takeaway: Use evidence synthesis, causal chains, uncertainty, ethics, communication, long-term monitoring as an evidence chain rather than as isolated facts.
    stops:
      - group: POP
        task: Spend the two independent checks on the critical claims that still lack adequate backing, then disposition the final report.
        title: Disposition the final claims
        place: Scientific Review Hall
        scene: The emergency is closing, and the final evidence wall contains four signed claims that will enter Riverton’s permanent record. Two independent checks remain before publication. Their scientific evidence chains are not equally complete.
        guide: >-
          Four signed claims are going into the permanent record and two checks remain.
          Open each claim and read what backs it now. Some rest on measurements from
          this outbreak, some on a chain of inference, and some on the strength of the
          wording alone. Hold what the evidence does not support, and check where a
          wrong claim would do the most lasting damage.
        background:
          - >-
              Why the permanent record raises the bar. These claims will be cited by people
              who cannot see the evidence behind them, in reviews and in the next outbreak's
              planning. A claim that is retracted later has already done its work, and the
              retraction rarely travels as far.
          - >-
              What proposed strength means. The same finding can be written as 'is', 'is
              consistent with' or 'cannot be excluded'. Verification decides which of those
              the evidence has earned, so a claim can pass by being weakened rather than by
              being checked.
          - >-
              Why two checks and four claims is the actual skill. Choosing is a judgement
              about consequence: which of these, if wrong, would misdirect the next
              response? That is what the last two slots are for, and spending them on the
              shakiest claim is not automatically right.
        assumes:
          - a signed statement records a claim but does not independently verify the condition
          - strong conclusions need evidence chains that can survive one failed source
        takeaway: Scientific claims should be communicated at the strength their independent evidence can support.
        format: ATTEST
        question: Which claims need verification before the report can carry them at their proposed strength?
        attest:
          # data provenance: invented final-review check budget; claim strengths are source-derived
          hint: Every card is signed. You can independently check two. Spend those checks where a wrong critical claim would change the report and where independent backing is still missing.
          claims:
            - id: transmission
              label: The main transmission route is established enough for operational planning
              critical: true
              backed: true
              evidence: Multiple independent surveillance and exposure streams already converge on the route.
            - id: risk_group
              label: The proposed severe-risk subgroup is established for citywide policy
              critical: true
              backed: false
              evidence: Collect a representative confirmatory sample rather than relying on one small observational group.
            - id: treatment_duration
              label: The monitored treatment benefit can be assumed to persist beyond eight weeks
              critical: true
              backed: false
              evidence: Extend follow-up and reproduce the duration estimate under the planned analysis.
            - id: reservoir
              label: The suspected animal species is the confirmed reservoir
              critical: false
              backed: false
              evidence: Complete comparison-site, species and repeat-time One Health evidence before making a reservoir claim.
          checks: 2
        answerText: Use the two checks on the severe-risk subgroup and the treatment-duration claim. The transmission route already has independent backing. The animal reservoir should remain explicitly unresolved rather than being promoted to a confirmed claim without the field evidence needed to support it.
        why: A final report should not force every claim to the same confidence. The transmission route is backed by independent evidence and can support operational planning. A severe-risk subgroup from one small observational sample needs representative confirmation before it becomes citywide policy. A treatment benefit measured only through eight weeks cannot establish longer duration without follow-up. The suspected reservoir remains a live hypothesis and can stay in the report as unresolved. Verification capacity belongs on critical claims whose current evidence chain is weakest, not on claims that are already independently reconstructed.
      - group: POP
        task: Order the briefing by how much weight each claim can carry.
        title: Build the public explanation
        place: City Command
        scene: The mayor goes live in an hour. The transmission route is settled, the animal reservoir is not, and treatment has only eight weeks of follow-up. Every sentence in the draft will be replayed after the emergency ends.
        guide: >-
          All four things will be said, so the order is what is being decided. Ask of
          each how much weight its evidence can carry: three agreeing streams, one small
          sample, or a plausible hypothesis. Every sentence will be replayed after the
          emergency ends. Publishing the unconfirmed part with the confidence of the
          settled part is what makes the whole briefing unbelievable later.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim about dependency: each
              step is here because the one before it has already happened, or has to have.
              One transposed pair falsifies that claim wherever it sits, so partial credit
              would be credit for a sequence that does not work.
          - >-
              Why the ends are the place to start. The first and last cards are constrained
              by having nothing before or after them, which usually makes them the two you
              can settle from the scene alone. Pinning them collapses the remaining
              arrangements sharply, and what is left in the middle is where the actual
              judgement lives.
          - >-
              What the rail can be ordered on. Time is the usual axis, but it is not the
              only one. An order can run on cost, on risk, or on reversibility — every
              observation that leaves the sample as it was, before any that consumes it. On
              those boards a chronological reading finds nothing, because none of the steps
              has to happen at a particular hour.
        assumes:
          - an audience judges a claim by how it was supported, once it knows
        takeaway: A public account is ordered by the strength of its evidence, not by the order the work happened in.
        format: SEQUENCE
        why: The briefing is ordered by how much the evidence will carry, strongest first, because that is the order in which a listener can tell one claim from another. Publishing the reservoir with the confidence of the transmission route is what makes the whole document unbelievable when the reservoir turns out to be somewhere else.
        cards:
          - The transmission route, which three independent data streams agree on.
          - The severe-risk subgroup, which one small observational sample suggests.
          - The animal reservoir, which remains plausible and unconfirmed.
          - What it would take to settle each open question, and when the city revisits it.
        order: [0, 1, 2, 3]
      - group: POP
        task: The emergency budget closes this month. Which durable capability should receive the protected outbreak-surveillance funding?
        title: Fund the post-crisis legacy
        place: Public Briefing Room
        scene: The emergency budget ends in three weeks. Unprotected contracts and sampling programs stop with it. Sequencing, wastewater surveillance, field ecology and clinical readiness all want the last outbreak-specific line. The council votes before the month closes.
        guide: >-
          Four capabilities, and three of them worked this time. Ask of each whether it
          would have worked on a different outbreak. Each stream sees a different part
          of transmission, and their value comes from being compared. Note also what the
          cheapest item on the list costs: records and methods are nearly free and
          disappear first.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - capability that is not funded to continue stops when the emergency does
        takeaway: Legacy funding should preserve an integrated early-warning capability and the ability to interpret its signals, not just the instrument that was most visible this time.
        format: CHOICE
        question: Which capability should the city protect when the emergency budget closes?
        why: The durable capability is an integrated surveillance system rather than one favored instrument. Clinical, wastewater and genomic streams see different parts of transmission. They become more useful when compared through shared metadata and analysis. Field ecology should remain available when a One Health signal appears, while routine clinical readiness belongs in the broader health system. The emergency line should protect cross-stream early warning and interpretation capacity that would otherwise disappear. Records and methods should be preserved as a low-cost requirement rather than a competing project.
        choices:
          - Integrated clinical, environmental and genomic surveillance with shared analysis.
          - Keep the sequencing bench as the protected core because it found the rising variant.
          - Keep wastewater sampling as the protected core because it produced the earliest signal this time.
          - End the outbreak-specific records program and rebuild the system when the next event starts.
        answer: Integrated clinical, environmental and genomic surveillance with shared analysis.
        rebuttals:
          - Sequencing is powerful but depends on representative samples and cannot replace clinical or environmental context.
          - Wastewater can provide early population signals but cannot characterize every clinical consequence or transmission mechanism by itself.
          - Discarding the records removes the provenance, baselines and lessons needed to interpret the next signal.
# What is inside each room.
interiors:
  CLIN:
    caption: A patient is the only instrument that reports everything at once, and none of it precisely.
    standLine: Four admissions with the same combination of signs, and three different working diagnoses.
    station:
      kind: vitals
      title: Bedside monitor
      rows:
        - label: Oxygen saturation
          value: 88 %
          status: alarm
        - label: Temperature
          value: 39.1 C
          status: high
        - label: Chest imaging
          value: bilateral
          status: alarm
        - label: Blood pressure
          value: 118/72
          status: normal
  CELL:
    caption: What a pathogen does to a cell constrains what it can do to a person.
    standLine: Culture flasks from four patients, two of them showing something the others do not.
    station:
      kind: panel
      title: Culture bench
      rows:
        - label: Cytopathic effect
          value: 48 h
          status: high
        - label: Receptor assay
          value: pending
          status: low
        - label: Negative control
          value: clean
          status: normal
  MOL:
    caption: A test result is a claim about the sample, not about the patient.
    standLine: A positive with no negative control run beside it, and a sequencing run half finished.
    station:
      kind: panel
      title: Sequencing run
      rows:
        - label: Cycle threshold
          value: 22
          status: high
        - label: Negative control
          value: not run
          status: alarm
        - label: Genome coverage
          value: 94 %
          status: normal
  IMM:
    caption: The damage a patient shows can come from the pathogen or from the response to it.
    standLine: Inflammatory markers rising in patients whose viral load is already falling.
    station:
      kind: vitals
      title: Immunology bench
      rows:
        - label: Inflammatory marker
          value: 210 mg/L
          status: alarm
        - label: Viral load
          value: falling
          status: normal
        - label: Antibody titre
          value: day 6
          status: high
  POP:
    caption: A case count without a denominator is a number about testing, not about disease.
    standLine: Case curves from three districts, each on a different testing regime.
    station:
      kind: panel
      title: Operations board
      rows:
        - label: Cases today
          value: 61
          status: alarm
        - label: Tests today
          value: 940
          status: high
        - label: Baseline expectation
          value: 8 per week
          status: normal
  FIELD:
    caption: A reservoir claim needs the animal, the exposure and the genome to agree.
    standLine: Trapping records from the flood plain, and sequences that are close but not identical.
    station:
      kind: panel
      title: Field station
      rows:
        - label: Species sampled
          value: 3
          status: high
        - label: Comparison sites
          value: 0
          status: alarm
        - label: Genetic distance
          value: 4.1 %
          status: normal

# What each place says when the player reads it.
# --------------------------------------------------------------- the warm-ups
# This campus has two tiers of ground — the containment ward is out past the fence
# — so the far lap is real and the vehicles come out with it.
warmups:
  trial-near:
    title: Walk the campus before you are needed on it
    why: >-
      Week three, and the hospital has been rebuilt around the outbreak: triage marquees in the
      courtyards, a decon tunnel across the main route, container labs where the car park was.
      Ortiz, the clinical physiology lead, walks every arrival round once, because a route you
      have not walked is a route you will take through a clean corridor in dirty gloves.
  greet:
    title: Six leads, three shifts, and a fence between them
    why: >-
      The clinical side and the laboratory side have barely met, and by the end of the week a
      decision will rest on one trusting the other's number. Get round the campus and put a name
      to every lead before the next shift change, because at three in the morning a phone call
      from somebody you have met is a different conversation.
  trial-far:
    title: The containment ward opens today, and the transport with it
    why: >-
      Everything past the fence has been off the call list all week. From today the containment
      ward and the mortuary annexe are on it, and they are far enough out that transport is
      signed out to reach them. Drive the route once before somebody is waiting at the other end
      of it.
  follow:
    title: Chen walks the specimen path once, end to end
    why: >-
      A swab taken in a marquee reaches the container lab through four pairs of hands, and every
      handover is a place contamination can enter. Chen, the cell biology lead, walks the whole
      path this morning at the pace it actually happens. Stay with her — the handovers are where
      the walk is learned and where somebody following too closely gets in the way.
  hunt:
    title: Six ventilators, and the board accounts for four
    item: { name: ventilator, plural: ventilators }
    why: >-
      Before tonight's admissions the ward has to know what it actually has. Four ventilators
      are where the board says. Two were moved during the weekend surge and nobody updated
      anything. Find them, because a machine nobody can locate is a machine that does not exist
      at two in the morning.
  canvass:
    title: Who in Ferry Ward is actually staying home
    why: >-
      The transmission estimate assumes the advice was followed, and the difference between a
      ward that isolated and a ward that could not decides whether the curve is bending. Ask
      along the streets until enough answers have come back to tell those two apart.
  evade:
    title: The journalist at the gate who wants a number
    why: >-
      A reporter has been at the main gate since six wanting today's case count before it is
      confirmed, and Morales, the epidemiology lead, has been clear that nothing goes out before
      the reconcile. Keep clear and finish your round. A number given at a gate is a number the
      hospital will spend a week correcting.
  tag:
    title: Catch Patel before he goes into the container lab
    why: >-
      Patel, the molecular diagnostics lead, has the run sheet for last night's plates, which is
      the only record of which samples were re-tested and which were not. Once he is gowned and
      inside he is unreachable for three hours, and this morning's positives cannot be
      interpreted without knowing which of them are repeats.

copy:
  CLIN: <p>The clinical wing. Every hypothesis in this outbreak has to survive contact with an actual patient.</p>
  CELL: <p>Cell and membrane biology. What the pathogen does to a cell, and what that rules out.</p>
  MOL: <p>Molecular diagnostics. Two instruments, a library, and a rule about controls.</p>
  IMM: <p>Immunology and treatment. Where protection and damage are told apart.</p>
  POP: <p>Epidemiology operations. Counts, denominators, and the difference between them.</p>
  FIELD: <p>The One Health field station. The outbreak did not start in a hospital.</p>
  CMD: <p>City Health Command. Decisions are made here whether or not the evidence has arrived.</p>
  TRANSIT: <p>The transit and mobility centre. Trip counts nobody has yet matched to the case map.</p>
  BRIEF: <p>The public briefing room. What the city is told, and how much of it is hedged.</p>
  WASTE: <p>The wastewater plant. Surveillance that sees the city before the city sees a doctor.</p>

              response: 96
          ambiguousIfMultipleChanges: true
          requiresReversal: true
          baseline: 100
          response: -78
          changedReading: 22
          responseUnit: fluorescence units
          truth: receptor_blocker
        answerText: The entry signal follows the receptor-blocking perturbation. It falls from about 100 to 22 units when the interaction is blocked. After washout it returns to about 96. The matched antibody does not reproduce the drop, so ordinary antibody handling does not explain it.

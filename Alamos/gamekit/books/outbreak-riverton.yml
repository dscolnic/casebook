# Claude-ready mission book. Follows BOOK_TEMPLATE.md conventions.
# Exactly 15 missions, 3 stops per mission. Formats use exact importer names.
# Diagnosis is a first-class format: the full evidence panel is visible and quiet readings matter.
theme:
  id: outbreak_riverton
  title: 'Outbreak: Riverton'
  subtitle: "Scientific Response Director \xB7 Riverton"
groups:
- id: CLIN
  code: CLIN
  name: Clinical Physiology
  color: '#315c78'
  desc: Patient physiology, organ systems, and bedside evidence.
  defaultLeader: ortiz
  milestones:
  - Observe the patient
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: CELL
  code: CELL
  name: Cell & Membrane Biology
  color: '#4b775f'
  desc: Cells, membranes, receptors, transport, and host interactions.
  defaultLeader: chen
  milestones:
  - Build the cell model
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: MOL
  code: MOL
  name: Molecular Diagnostics
  color: '#704f88'
  desc: DNA, RNA, gene expression, sequencing, and diagnostic controls.
  defaultLeader: patel
  milestones:
  - Validate the molecular evidence
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: IMM
  code: IMM
  name: Immunology & Treatment
  color: '#9a3f36'
  desc: Immune mechanisms, treatment response, and intervention evidence.
  defaultLeader: okafor
  milestones:
  - Separate response from damage
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: POP
  code: POP
  name: Epidemiology & Evolution
  color: '#9a741d'
  desc: Population patterns, surveillance, trials, and evolutionary change.
  defaultLeader: morales
  milestones:
  - Connect cases to populations
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: FIELD
  code: FIELD
  name: Ecology & One Health
  color: '#3d6f52'
  desc: Environmental surveillance, animal reservoirs, and ecosystem connections.
  defaultLeader: singh
  milestones:
  - Connect hosts and environment
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
roster:
- id: ortiz
  name: Dr. Lena Ortiz
  role: Clinical Physiology Lead
  division: CLIN
  bio: Connects vital signs and laboratory measurements to the physical chain that delivers oxygen, water, nutrients, and
    heat through the body.
- id: chen
  name: Dr. Maya Chen
  role: Cell Biology Lead
  division: CELL
  bio: Uses cell structure and membrane behavior to explain why the same agent can affect one tissue but not another.
- id: patel
  name: Dr. Ravi Patel
  role: Molecular Diagnostics Lead
  division: MOL
  bio: Treats every molecular signal as a claim that must survive controls, independent methods, and provenance checks.
- id: okafor
  name: Dr. Nia Okafor
  role: Immunology Lead
  division: IMM
  bio: Separates protective immune activity from tissue-damaging inflammation and asks what evidence changes an intervention
    decision.
- id: morales
  name: Dr. Sofia Morales
  role: Epidemiology Lead
  division: POP
  bio: Builds comparisons that distinguish real population change from sampling, bias, and coincidence.
- id: singh
  name: Dr. Arjun Singh
  role: One Health Lead
  division: FIELD
  bio: Connects human cases to animals, water, and ecosystems without assuming that correlation proves a transmission route.
- id: nakamura
  name: Rin Nakamura
  role: Critical Care Physician
  division: CLIN
  bio: |
    Runs the intensive care unit, where the outbreak stops being a case count and
    becomes four people whose oxygen is falling for reasons nobody has settled.

    She reads a patient as a set of coupled systems. A falling oxygen saturation
    can come from the lung, the blood that carries the oxygen or the circulation
    that moves it, and the treatment for each of those is different.

    Her limit is that the sickest patients are the least representative. What is
    happening in her unit is real and it is also the tail of the distribution.
  quiz:
    - q: Why does Nakamura warn against describing the disease from her unit alone?
      a: The sickest patients are the tail of the distribution, not a sample of it
      wrong:
        - Intensive care records are less accurate than ward records
        - Severe cases are treated before they can be measured
        - Her unit only admits patients with confirmed tests
- id: adeyemi
  name: Funke Adeyemi
  role: Cell Biologist
  division: CELL
  bio: |
    Works out which cells the pathogen can enter and what it does once inside,
    because that constrains everything downstream — which tissues are damaged,
    which drugs could plausibly work, and which route of transmission is possible.

    She runs a negative control on every plate as a matter of habit. A culture
    that shows an effect without a control showing nothing is a result about the
    laboratory as much as about the pathogen.
  quiz:
    - q: Why does Adeyemi run a negative control on every plate?
      a: Without it, an effect from the laboratory itself is indistinguishable from an effect of the pathogen
      wrong:
        - Controls make the cultures grow at a reproducible rate
        - A control converts a qualitative result into a quantitative one
        - Controls are required only when the sample is from a patient
- id: bergstrom
  name: Lena Bergström
  role: Genomic Epidemiologist
  division: MOL
  bio: |
    Reads sequences for what they say about transmission — who infected whom,
    how long the chain has been running, and whether two clusters are one
    outbreak or two.

    Genetic distance is her main tool and her main trap. Two sequences being
    close is evidence of a recent common ancestor, not evidence that one patient
    infected the other, and the difference matters for every control decision.
  quiz:
    - q: What does Bergström say two nearly identical sequences establish?
      a: A recent common ancestor, which is not the same as one patient infecting the other
      wrong:
        - The direction of transmission between the two patients
        - That both patients were infected on the same day
        - That the pathogen is not mutating
- id: haddad
  name: Yusuf Haddad
  role: Clinical Immunologist
  division: IMM
  bio: |
    Separates the damage a pathogen does from the damage the immune response does
    while clearing it, which sounds academic until a treatment has to be chosen.

    Suppressing inflammation helps a patient whose injury is immune-driven and
    harms one who is still fighting the infection. The same drug, the same dose,
    opposite outcomes, decided by where the patient is in their course.
  quiz:
    - q: Why can the same anti-inflammatory treatment help one patient and harm another?
      a: It depends whether the damage is now immune-driven or the infection is still being fought
      wrong:
        - Doses are calculated from weight and vary between patients
        - Some patients absorb the drug and others do not
        - The drug expires quickly once a vial is opened
- id: oduya
  name: Grace Oduya
  role: Field Epidemiologist
  division: POP
  bio: |
    Builds the case definition, which decides what counts as a case and therefore
    what every curve in the response is a curve of.

    A definition too narrow misses the spread and one too wide fills the count
    with other illnesses. She changes it when she has to and records the change,
    because a curve that bends on the day the definition moved is not evidence
    about the disease.
  quiz:
    - q: Why does Oduya document every change to the case definition?
      a: A bend in the curve on the day the definition changed is an artefact, not a change in the disease
      wrong:
        - Definitions must be approved by the hospitals before use
        - Changing a definition invalidates all earlier laboratory results
        - The definition determines which treatment a patient receives
- id: castellanos
  name: Mateo Castellanos
  role: Wildlife Veterinarian
  division: FIELD
  bio: |
    Samples the animals people live alongside, which is where most new human
    pathogens were living before they were human pathogens.

    Finding the organism in a species proves that species can carry it. Showing
    it is a reservoir needs prevalence, the exposure pattern of the human cases,
    and comparison sites where the illness never appeared — otherwise a bystander
    that caught it from people gets blamed and culled.
  quiz:
    - q: Why is finding the pathogen in an animal not enough to declare a reservoir?
      a: The animal may have caught it from people; prevalence, exposure and comparison sites are what separate the two
      wrong:
        - Field samples are always contaminated by human handling
        - A reservoir must contain a higher viral load than any patient
        - The organism has to be found in more than one individual animal
glossary:
- name: Homeostasis
  aliases:
  - homeostasis
  def: The regulation that keeps internal conditions within workable ranges.
- name: Control
  aliases:
  - control
  def: A comparison designed to reveal whether a signal could arise without the proposed cause.
- name: Sensitivity
  aliases:
  - sensitivity
  def: The fraction of true cases a test detects.
- name: Specificity
  aliases:
  - specificity
  def: The fraction of unaffected cases a test correctly leaves negative.
- name: Selection
  aliases:
  - selection
  def: A process in which variants differ in reproductive success, changing frequencies over generations.
- name: Reservoir
  aliases:
  - reservoir
  def: A host population or environment in which an infectious agent can persist.
missions:
- title: The First Cluster
  objective: Open an investigation using a defensible provisional case definition and an explicit comparison baseline.
  briefing: Three Riverton hospitals report an unusual combination of fever, dry cough, severe headache, and profound fatigue.
    The player must decide whether the pattern is a true outbreak signal before scarce emergency resources are committed.
  stake: A false alarm could disrupt the city, but a delayed investigation could cost the only window for early containment.
  takeaway: Use baseline variation, case definition, controls, correlation versus coincidence, measurement bias as an evidence
    chain rather than as isolated facts.
  stops:
  - group: POP
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: Signal or noise?
    place: Emergency Department Network
    scene: Match each early observation to the analysis that makes it informative.
    takeaway: Biological investigation begins by defining what would count as evidence that the system has changed.
    format: PROTOCOL
    scenarios:
    - Seven similar cases appear across three hospitals in forty-eight hours.
    - The same symptom combination is rare in the previous three summers.
    - "One clinic reports \u201Cmany sick people\u201D but supplies no dates or denominator."
    - All first reports came from the same electronic alert rule.
    choices:
    - Compare counts with seasonal and weekday baselines.
    - Check geographic and institutional clustering.
    - Request a line list with dates, symptoms, and population served.
    - Audit the shared alert rule for common-mode bias.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: An outbreak signal is not merely a large number. It is a pattern that differs from expectation and survives checks
      for shared reporting artifacts.
  - group: POP
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly
      placed cards after each check.
    title: Build the provisional case definition
    place: Epidemiology Operations Room
    scene: Order the work so that clinicians can identify comparable patients without pretending the first definition is final.
    takeaway: Operational definitions convert vague concern into reproducible observation.
    format: SEQUENCE
    cards:
    - Specify observable symptoms, timing, and location.
    - Review the first patient records for common features.
    - Test the definition on known cases and obvious non-cases.
    - Publish the provisional definition with a revision date and uncertainty notes.
    order:
    - 1
    - 0
    - 2
    - 3
    why: The first records suggest the shared features; the definition is then tested before it is distributed.
  - group: POP
    task: Allocate 100 research or response credits across the four proposals. The interface may allow a short written criterion
      before submission.
    title: Spend the first response reserve
    place: Clinical Data Office
    scene: Allocate 100 response credits among the first three evidence sources.
    takeaway: The best first portfolio combines comparable clinical observations with an independent population-level signal.
    format: SCIENCETANK
    proposals:
    - label: A
      text: Interview every hospital director for an expert impression.
    - label: B
      text: Build a standardized line list across all hospitals.
    - label: C
      text: Add wastewater sampling in affected and comparison neighborhoods.
    - label: D
      text: Launch a citywide warning before transmission is understood.
    recommended:
      A: 10
      B: 50
      C: 35
      D: 5
    evidence: Allocate 100 response credits among the first three evidence sources.
- title: What Kind of Agent?
  objective: Classify the broad agent category and identify the next discriminating test.
  briefing: Initial samples contain biological material, but microscopy and routine tests disagree. The team must distinguish
    a cellular pathogen from a virus or a noninfectious cause without relying on one ambiguous image.
  stake: The wrong classification sends every later diagnostic and treatment effort down the wrong path.
  takeaway: Use cell structure, viruses versus cells, prokaryotes and eukaryotes, staining, independent evidence as an evidence
    chain rather than as isolated facts.
  stops:
  - group: CLIN
    task: Which explanation fits every reading, including the quiet negative controls?
    title: What kind of agent fits the whole panel?
    place: Hospital Pathology Suite
    scene: Pathology has several clues from the same positive specimens. No single image is decisive, so the team must classify
      the agent from the complete pattern before choosing the next laboratory strategy.
    takeaway: Agent classification should combine cellular structure, host dependence, molecular evidence, and controls rather
      than rely on one striking image.
    format: DIAGNOSIS
    headline: Pathology has several clues from the same positive specimens.
    readings:
    - zone: Microscopy
      label: Microscopy
      value: No intact cellular forms seen
      status: normal
      note: Several fields examined; image quality is good
    - zone: Host-cell dependence
      label: Host-cell dependence
      value: Signal rises only when living host cells are present
      status: alarm
      note: Acellular control shows no increase
    - zone: Bacterial marker
      label: Bacterial marker
      value: Not detected
      status: normal
      note: Control bacterial sample is detected normally
    - zone: Fungal cell-wall stain
      label: Fungal cell-wall stain
      value: Negative
      status: normal
      note: Positive stain control is normal
    - zone: Extraction blank
      label: Extraction blank
      value: Negative
      status: normal
      note: No target signal in the blank
    choices:
    - label: RNA virus-like agent
      mechanism: A noncellular infectious agent depends on host cells for replication and would not carry bacterial or fungal
        cellular markers.
    - label: Bacterium
      mechanism: A cellular prokaryote should provide bacterial cellular or molecular evidence and should not require living
        host cells simply to exist.
    - label: Fungus
      mechanism: A fungal agent should provide cellular structures or cell-wall evidence that is absent here.
    - label: Laboratory contamination
      mechanism: Contamination should be suspected when blanks or controls carry the target signal; the blank is clean.
    answer: RNA virus-like agent
    why: The agent is host-cell dependent, while bacterial and fungal cellular markers are absent and the blank is clean.
      The full panel supports a virus-like agent rather than a cellular pathogen or contamination.
  - group: POP
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly
      placed cards after each check.
    title: From specimen to broad classification
    place: Microscopy Core
    scene: Order a safe, non-operational identification workflow.
    takeaway: A good classification is an evidence synthesis, not a label generated by one instrument.
    format: SEQUENCE
    cards:
    - Compare patient material with negative and healthy controls.
    - Characterize size, cellular structures, and nucleic-acid signature.
    - Ask whether the candidate reproduces independently or requires host cells.
    - Integrate the independent observations into a provisional classification.
    order:
    - 0
    - 1
    - 2
    - 3
    why: Controls establish what is truly associated with the specimen; structural and molecular evidence then support a biological
      classification.
  - group: MOL
    task: Allocate 100 research or response credits across the four proposals. The interface may allow a short written criterion
      before submission.
    title: Choose the next discriminating evidence
    place: Molecular Identification Lab
    scene: Allocate 100 credits to distinguish the leading hypotheses.
    takeaway: Independent failure modes matter more than prestige or repeated views of the same evidence.
    format: SCIENCETANK
    proposals:
    - label: A
      text: Repeat the same microscope image at higher magnification.
    - label: B
      text: Obtain a molecular signature using a validated broad panel.
    - label: C
      text: Compare growth or replication behavior in approved diagnostic systems.
    - label: D
      text: Ask a famous scientist to choose the most likely answer.
    recommended:
      A: 15
      B: 45
      C: 35
      D: 5
    evidence: Allocate 100 credits to distinguish the leading hypotheses.
- title: The Point of Entry
  objective: Explain why one cell type is vulnerable and select the experiment that separates receptor binding from downstream
    replication.
  briefing: The suspected agent reaches respiratory tissue, but only some cell types become affected. The player must determine
    how membrane structure, receptors, and transport explain this selectivity.
  stake: A mistaken entry model could lead to a therapy that blocks the wrong stage while vulnerable cells continue to fail.
  takeaway: Use phospholipid bilayer, receptors, diffusion, facilitated transport, endocytosis, cell specificity as an evidence
    chain rather than as isolated facts.
  stops:
  - group: CELL
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly
      placed cards after each check.
    title: Crossing the cellular boundary
    place: Cell Culture Wing
    scene: Order a generic receptor-mediated entry process.
    takeaway: Membranes are selective interfaces whose proteins can determine cell vulnerability.
    format: SEQUENCE
    cards:
    - A surface molecule binds a compatible receptor.
    - The membrane bends or a fusion process begins.
    - The biological material enters the cell or an intracellular compartment.
    - Cellular machinery is redirected after entry.
    order:
    - 0
    - 1
    - 2
    - 3
    why: Specific recognition precedes membrane rearrangement and entry; downstream effects occur only after the barrier is
      crossed.
  - group: CELL
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: Choose the membrane mechanism
    place: Membrane Biology Lab
    scene: Match each transport observation to the best mechanism.
    takeaway: Transport mechanisms are inferred from constraints, not memorized from molecule names alone.
    format: PROTOCOL
    scenarios:
    - A small nonpolar molecule moves down its concentration gradient.
    - An ion moves down its gradient through a selective protein pore.
    - A solute moves uphill while ATP is consumed.
    - A large bound particle is enclosed by the membrane.
    choices:
    - Simple diffusion.
    - Facilitated diffusion through a channel.
    - Active transport.
    - Endocytosis.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: The direction of movement, need for a protein, energy use, and cargo size distinguish the mechanisms.
  - group: CELL
    task: Allocate 100 research or response credits across the four proposals. The interface may allow a short written criterion
      before submission.
    title: Separate binding from entry
    place: Structural Biology Room
    scene: Allocate 100 credits among experiments designed to locate the first failed step in resistant cells.
    takeaway: Mechanistic experiments should identify the earliest point at which two conditions diverge.
    format: SCIENCETANK
    proposals:
    - label: A
      text: Measure receptor abundance on vulnerable and resistant cells.
    - label: B
      text: Track whether bound material is internalized.
    - label: C
      text: Measure a late cellular response only.
    - label: D
      text: Increase the exposure until every cell shows damage.
    recommended:
      A: 40
      B: 40
      C: 15
      D: 5
    evidence: Allocate 100 credits among experiments designed to locate the first failed step in resistant cells.
- title: Hijacked Cells
  objective: Build the information-flow model and choose a measurement that distinguishes more RNA from more efficient translation.
  briefing: Molecular data suggest that affected cells are producing unfamiliar RNA and proteins. The player must reconstruct
    how information flows from nucleic acid to protein and identify where the agent interrupts normal cell function.
  stake: A rushed interpretation could make the team target a gene whose RNA is merely a consequence rather than the cause
    of cell damage.
  takeaway: Use DNA and RNA, transcription, translation, codons, protein function, gene regulation as an evidence chain rather
    than as isolated facts.
  stops:
  - group: MOL
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly
      placed cards after each check.
    title: From genetic information to protein
    place: Sequencing Center
    scene: Order the information flow for expression of a protein-coding gene.
    takeaway: Changes in protein abundance can arise at several distinct stages of gene expression.
    format: SEQUENCE
    cards:
    - A DNA template is made accessible.
    - RNA polymerase produces an RNA transcript.
    - A ribosome reads codons in the messenger RNA.
    - The amino-acid chain folds and performs a cellular function.
    order:
    - 0
    - 1
    - 2
    - 3
    why: Transcription produces the message; translation converts the message into a polypeptide that must fold before function.
  - group: MOL
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: Locate the molecular change
    place: Gene Expression Lab
    scene: Match each observation to the most direct interpretation.
    takeaway: The central dogma is a chain of measurable transformations, not a claim that every stage changes together.
    format: PROTOCOL
    scenarios:
    - RNA rises while protein stays constant.
    - RNA is unchanged while protein rises.
    - A codon changes and one amino acid is substituted.
    - Protein amount is normal but activity is low.
    choices:
    - Possible translation limit or rapid protein turnover.
    - Possible increased translation efficiency or reduced protein degradation.
    - A missense sequence change.
    - Possible folding, modification, or active-site defect.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: RNA abundance, protein abundance, sequence, and activity are related but non-equivalent measurements.
  - group: MOL
    task: Allocate 100 research or response credits across the four proposals. The interface may allow a short written criterion
      before submission.
    title: Find the controlling stage
    place: Protein Analysis Core
    scene: Allocate 100 credits among measurements of an unfamiliar protein that is abundant in affected cells.
    takeaway: Mechanism requires measurements that span the full causal chain.
    format: SCIENCETANK
    proposals:
    - label: A
      text: Quantify its messenger RNA across time.
    - label: B
      text: Measure ribosome association with that RNA.
    - label: C
      text: Measure protein half-life and degradation.
    - label: D
      text: Sequence only the neighboring chromosome region and stop.
    recommended:
      A: 35
      B: 35
      C: 25
      D: 5
    evidence: Allocate 100 credits among measurements of an unfamiliar protein that is abundant in affected cells.
- title: A Test Before Morning
  objective: Approve a diagnostic workflow only after its analytical and clinical limitations are explicit.
  briefing: Hospitals need a rapid diagnostic by sunrise. The molecular signal is promising, but contamination, false negatives,
    and prevalence could make a technically impressive test clinically misleading.
  stake: An unreliable test could either miss contagious patients or isolate thousands of healthy people.
  takeaway: Use PCR logic, controls, sensitivity, specificity, predictive value, prevalence as an evidence chain rather than
    as isolated facts.
  stops:
  - group: MOL
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly
      placed cards after each check.
    title: Build a trustworthy amplification run
    place: Sample Processing Room
    scene: Order the logic of a diagnostic amplification workflow.
    takeaway: A diagnostic result is the output of a controlled process, not simply a machine reading.
    format: SEQUENCE
    cards:
    - Extract material while preserving sample identity.
    - Include positive, negative, and no-template controls.
    - Amplify the target with validated primers and cycling conditions.
    - Interpret the patient signal only if all controls behave as expected.
    order:
    - 0
    - 1
    - 2
    - 3
    why: Identity and controls are prerequisites; a numerical signal is uninterpretable when controls fail.
  - group: MOL
    task: Which explanation best fits the patient results and all of the controls?
    title: Why did the assay turn positive?
    place: PCR Diagnostics Lab
    scene: The overnight amplification run flags several patient samples as positive, but one control is also behaving strangely.
      Hospitals want an answer before using the result to sort patients.
    takeaway: 'A control is part of the evidence, not a decoration: a positive blank can overturn an apparently impressive
      patient signal.'
    format: DIAGNOSIS
    headline: The overnight amplification run flags several patient samples as positive, but one control is also behaving
      strangely.
    readings:
    - zone: Patient wells
      label: Patient wells
      value: Target signal detected
      status: alarm
      note: Several patient samples cross the detection threshold
    - zone: No-template control
      label: No-template control
      value: Target signal detected
      status: alarm
      note: This control should contain no target material
    - zone: Positive control
      label: Positive control
      value: Detected at expected level
      status: alarm
      note: Core amplification chemistry is functioning
    - zone: Independent platform
      label: Independent platform
      value: Patient target not detected
      status: normal
      note: Uses a different detection method
    - zone: Instrument baseline
      label: Instrument baseline
      value: Stable
      status: normal
      note: No broad detector drift is present
    choices:
    - label: True patient positives
      mechanism: The patient samples contain the target and the controls are behaving normally.
    - label: Carryover contamination
      mechanism: Target material entered part of the amplification workflow, making samples and the no-template control positive.
    - label: Reagent failure
      mechanism: The reaction chemistry failed, so true target should not amplify reliably.
    - label: Sample inhibition
      mechanism: Something in patient material suppresses amplification and tends to create false negatives.
    answer: Carryover contamination
    why: The no-template control contains the same target signal while the positive control works and an independent method
      does not confirm the patient result. That pattern points to contamination in the assay workflow rather than true infection.
  - group: POP
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
    title: What does a positive mean?
    place: Clinical Statistics Desk
    scene: In a low-prevalence screening group, even a specific test can produce a meaningful fraction of false positives.
    takeaway: Clinical meaning depends on both test performance and the population being tested.
    format: BALLPARK
    question: Estimate the chance that a positive result represents a true case.
    estimate:
      labels:
      - 90 true positives
      - 99 false positives
      values:
      - 90
      - 99
      slots: 2
      template: '{0} / ({0} + {1}) x 100'
      formula: a/(a+b)*100
      correct:
      - 0
      - 1
      target: 47.62
      tolerance: 2
      units: '%'
      solution: 90/(90+99) is about 48%.
      prompt: In a low-prevalence screening group, even a specific test can produce a meaningful fraction of false positives.
      question: Estimate the chance that a positive result represents a true case.
- title: Why Are Some Patients Sicker?
  objective: Identify the physiological bottleneck and select measurements that distinguish ventilation, diffusion, circulation,
    and cellular oxygen use.
  briefing: Patients with similar test results have radically different oxygen levels and recovery times. The team must connect
    cellular damage to organ-system physiology and homeostatic failure.
  stake: The wrong physiological diagnosis could intensify a treatment that cannot reach the true failing organ system.
  takeaway: Use homeostasis, gas exchange, circulation, oxygen transport, feedback, organ-system integration as an evidence
    chain rather than as isolated facts.
  stops:
  - group: CLIN
    task: Which bottleneck fits the entire cardiopulmonary panel?
    title: Locate the oxygen-delivery failure
    place: Intensive Care Unit
    scene: Two patients have severe fatigue and low tissue oxygen delivery. The bedside team needs to know which link in the
      oxygen chain is failing before it interprets the rest of the physiology.
    takeaway: Oxygen delivery is a chain. Normal measurements at one link can be powerful evidence that the failure lies somewhere
      else.
    format: DIAGNOSIS
    headline: Two patients have severe fatigue and low tissue oxygen delivery.
    readings:
    - zone: Arterial oxygen saturation
      label: Arterial oxygen saturation
      value: 86%
      status: alarm
      note: Lower than expected
    - zone: End-tidal carbon dioxide
      label: End-tidal carbon dioxide
      value: 39 mmHg
      status: normal
      note: Near the expected resting range
    - zone: Cardiac output
      label: Cardiac output
      value: 5.2 L/min
      status: normal
      note: Near the expected adult resting range

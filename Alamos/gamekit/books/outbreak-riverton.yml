      - group: CELL
        task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
        title: How many by morning
        place: Cell Biology Laboratory
        scene: The culture starts at 500 cells and the line divides every 40 minutes in this medium. The bench needs a number for eight hours from now, before it decides how much medium to prepare.
        guide: >-
          Six numbers, and two of them are the same eight hours in different units, with
          the conversion between them offered as a third. Ask of each whether the
          exponent needs it. The shape matters more than the answer. Ninety more minutes
          adds two more doublings, which quadruples the total. The same arithmetic is
          frightening when the thing doubling is cases.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        takeaway: Division doubles a population, so growth is exponential and its rate is a doubling time.
        format: BALLPARK
        assumes:
          - each division turns one cell into two
        question: Estimate the number of cells after eight hours.
        why: 8 hours is 480 minutes. That is 12 doubling times. 12 doublings is a factor of about 4,100, so 500 cells become about 2 million. The shape matters more than the number. Add 90 minutes and you add 2 more doublings, which quadruples the answer. That is why a culture left overnight runs out of medium. It is also why the same arithmetic is frightening when the thing doubling is cases.
        estimate:
          relationship: Final number = starting number × 2 raised to (time ÷ doubling time).
          prompt: 500 cells, a 40-minute doubling time, 8 hours to go.
          question: Estimate the number of cells after eight hours.
          labels:
            - 500 (cells at the start)
            - 480 min (8 hours)
            - 40 min (doubling time)
            - 2 (cells per division)
            - 8 h (the same interval, in hours)
            - 60 (minutes in an hour)
          values: [500, 480, 40, 2, 8, 60]
          slots: 4
          template: "{0} × {3} ^ ({1} ÷ {2})"
          formula: a*Math.pow(d, b/c)
          correct: [0, 1, 2, 3]
          target: 2048000
          tolerance: 400000
          units: cells
          solution: 480 ÷ 40 = 12 doublings; 2^12 ≈ 4,100; × 500 ≈ 2 million cells.
          explanation: 12 doublings, not 12 times. Multiplying 500 by 12 gives 6,000 and misses by a factor of 340.
      - group: CELL
        task: Every cell has the same genome. Why do only some of them make the receptor?
        title: The same genome, different cells
        place: Cell Biology Laboratory
        scene: Staining shows the receptor on airway cells at high density and absent from the muscle cells two millimetres away — same patient, same section, same genome in every nucleus. Both tissues were fixed and stained together.
        guide: >-
          Four options, and both tissues came from one patient and one section, stained
          together. Ask of each whether having a gene and using it are the same thing.
          Every nucleus holds the whole genome. So what has to differ is which genes are
          read, and that difference is what makes an airway cell an airway cell. It also
          decides which illness this becomes.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        takeaway: Every cell carries the same instructions and reads a different part of them.
        format: CHOICE
        assumes:
          - every cell in a body carries the same genome
        question: Every cell has the same genome. Why do only some of them make the receptor?
        choices:
          - The gene is expressed in some cell types and switched off in others.
          - Only airway cells carry that gene; the muscle cells have lost it.
          - The muscle cells make the receptor too, but the antibody cannot reach them.
          - The receptor is made by the agent, not by the cell.
        answer: The gene is expressed in some cell types and switched off in others.
        why: "Every nucleus holds the whole genome, so having a gene explains nothing about where its protein appears. Gene regulation decides it: transcription factors and the state of the chromatin decide which genes are read in which cell type, and that regulation is what makes an airway cell an airway cell. For an outbreak it is the practical point — tissue tropism follows the expression pattern of the receptor, which is why this agent causes a respiratory illness rather than a muscular one."
        rebuttals:
          - Cells do not discard genes as they specialise; the genome is the same in both.
          - Staining shows the protein absent from the muscle tissue, not merely unreachable.
          - The receptor is a human protein. The agent exploits it and does not supply it.
      - group: FIELD
        task: Sort the specimen tray before the courier goes.
        title: Clean side, dirty side
        concept: "Biosafety, aseptic technique and contamination"
        place: Container Laboratory
        scene: The courier leaves in ten minutes and the tray has to be sorted first. One side of the bench has been touched by nothing outside the cabinet. The other has been open to the room, a glove, or a patient.
        guide: >-
          Two bins, and the question is whether the item has been open to anything outside the
          cabinet since it was last sterile. If it has, it cannot go back to the clean side
          however clean it looks. Sort on where it has been, not on what it is.
        background:
          - >-
              Why the two sides never mix. Contamination is not visible, and it is not undone by
              looking careful. Once an item has been open to the room it can carry what the room
              carries, and putting it back on the clean side moves that into every later sample.
          - >-
              Why "it looks fine" is the wrong test. A sealed swab dropped on the floor is sealed and
              is on the dirty side. An open plate that has sat in a running cabinet for an hour is
              open and is on the clean side. The history decides it, not the appearance.
        assumes:
          - an item can be sterile, and can stop being sterile without looking different
        takeaway: What decides contamination is where a thing has been, not what it looks like.
        format: BELT
        question: Send each item to the side its history puts it on.
        answerText: Anything that has been open to the room, a glove or a patient goes to the dirty side. Anything that has only been inside the cabinet or a sealed pack stays clean.
        why: >-
          The clean side is defined by history rather than by appearance, which is the whole
          discipline of aseptic work. An item that has been inside a running cabinet, or has
          never been unsealed, has been open only to filtered air and stays on the clean side.
          Anything that has met the room — a glove that touched a door, a tube that stood on the
          bench, a plate carried down the corridor uncovered — has been open to whatever the
          room carries, and looks exactly the same afterwards. That is why the rule is about
          where a thing has been and why a dropped sealed swab is dirty while an hour-old open
          plate in a cabinet is clean. Getting it wrong does not spoil one sample; it puts the
          room's organisms into every result the tray produces, which is a contamination nobody
          can distinguish afterwards from a finding.

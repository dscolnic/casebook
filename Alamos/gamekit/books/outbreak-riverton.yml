          hypothesis at all.
        background:
          - >-
              Why comparisons rather than counts. Finding the pathogen in a species proves
              it can be infected, not that it is the reservoir. That claim needs a contrast:
              this species against others, this site against a comparison site, now against
              later. Slots spent without a contrast produce a positive result that settles
              nothing.

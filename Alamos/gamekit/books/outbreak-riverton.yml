  - title: Why Are Some Patients Sicker?
    objective: Identify the physiological bottleneck and select measurements that distinguish ventilation, diffusion, circulation, and cellular oxygen use.
    briefing: Patients with similar test results have radically different oxygen levels and recovery times. The team must connect cellular damage to organ-system physiology and homeostatic failure.
    stake: Day 13. Nakamura, the critical care physician, has two patients who arrived with the same complaint and the same test results. One is walking to the bathroom. The other is failing, and their oxygen saturation reads normal. This stage you find which link in the oxygen chain has broken and buy the measurement that proves it. Nakamura has one arterial line and two patients she would like it in. The second patient's heart rate has not moved all morning, which she finds harder to explain than the saturation. Escalate the wrong link and the treatment is aimed at a part of the chain that is working.
    takeaway: Use homeostasis, gas exchange, circulation, oxygen transport, feedback, organ-system integration as an evidence chain rather than as isolated facts.
    stops:
      - group: CLIN
        task: Assemble the oxygen path from air to tissue, then name the link that the full panel makes most likely to be limiting.
        title: Locate the oxygen-delivery failure
        place: Intensive Care Unit
        scene: A patient’s oxygenation is worsening while Dr. Lena Ortiz reviews the bedside console. It shows PaCO₂ 39 mmHg, low arterial oxygen, haemoglobin 14 g/dL, cardiac output 5.2 L/min and new lung imaging. The team needs the bottleneck before rounds.
        guide: >-
          Build the path oxygen takes, in order, from the air in the room to the tissue
          that uses it. Then name the link where this patient's chain fails. Read the
          panel rather than the diagnosis: the haemoglobin, the cardiac output and the
          carbon dioxide are each telling you that a particular link is working, and
          only one of them is not.
        background:
          - >-
              What the chain is. Air reaches the alveoli by ventilation, oxygen crosses into
              the blood by diffusion, haemoglobin carries it, the heart delivers it, and the
              tissue takes it up. Each step can fail on its own, and the treatment for each
              is different — which is why 'low oxygen' is a symptom rather than a diagnosis.
          - >-
              How to read the panel as evidence about links. A normal carbon dioxide says
              the patient is moving air, so ventilation is not the failure. Haemoglobin of
              14 says the carrying capacity is there. A cardiac output of 5.2 litres a
              minute says delivery is working. Each normal value eliminates a link.
          - >-
              Why the imaging matters most here. New changes in the lungs point at the step
              between the alveolus and the blood. That is the one link the other
              measurements cannot exonerate, and it is the one whose treatment differs most
              from what would be given for the others.
        takesAsRead:
          - Homeostasis and feedback
        assumes:
          - oxygen must move from air to alveoli, blood and tissues in sequence
          - a normal reading at one link makes a simple failure there less likely
        takeaway: A transport chain is localized by tracing every required handoff and using normal links to narrow where the bottleneck lies.
        format: CHAIN
        question: Where does the oxygen-delivery chain most likely fail in this panel?
        chain:
          hint: Build the route oxygen must follow. Then use each reading to ask which link is still compatible with the failure; the largest number on the screen is not automatically the governing one.
          distractor: circulation
          links:
            - id: ventilation
              label: Ventilation to the alveoli
              transfers: fresh gas from the airways to the alveoli
              reading: PaCO₂ 39 mmHg
            - id: gas_exchange
              label: Air–blood gas exchange
              transfers: oxygen across the alveolar-capillary interface
              reading: arterial oxygen low; diffuse alveolar involvement on imaging
            - id: hemoglobin
              label: Haemoglobin carriage
              transfers: oxygen bound in circulating blood
              reading: haemoglobin 14 g/dL
            - id: circulation
              label: Cardiac flow
              transfers: oxygenated blood through the systemic circulation
              reading: cardiac output 5.2 L/min
            - id: tissue_delivery
              label: Tissue delivery and use
              transfers: oxygen from capillary blood to cells
              reading: downstream metabolic evidence not yet complete
          order:
            - ventilation
            - gas_exchange
            - hemoglobin
            - circulation
            - tissue_delivery
          governing: gas_exchange
        answerText: The leading bottleneck is gas exchange at the air–blood interface. PaCO₂ near normal makes isolated global hypoventilation less likely, haemoglobin is adequate, and measured cardiac output is not low. Low arterial oxygen plus diffuse alveolar disease points most strongly to the lung handoff.
        why: "Oxygen delivery is a chain, so no single normal value proves the patient is safe. Near-normal PaCO₂ makes isolated global hypoventilation less likely. Haemoglobin of 14 g/dL is adequate for carriage, and a cardiac output of 5.2 L/min does not support a simple low-flow explanation. The abnormal evidence sits at the lung handoff: arterial oxygen is low and imaging shows diffuse alveolar involvement. Mixed disorders remain possible, so the next step is to measure downstream consequences rather than treat one normal link as a complete clearance."
        headline: Two patients have severe fatigue and low tissue oxygen delivery.
      - group: POP
        task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
        title: Estimate oxygen delivery
        place: Cardiopulmonary Physiology Lab
        scene: The bedside argument has stalled on which of two patients is worse off. Both have the same oxygen content per litre of blood; one moves three litres a minute and the other five.
        guide: >-
          Five numbers, and three of them are the other patient's flow, the saturation
          and the haemoglobin. Ask of each whether this delivery depends on it. Both
          patients carry the same oxygen per litre, so the concentration cannot separate
          them. A concentration is not a rate, and the flow term is doing all the work.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        takeaway: A normal concentration does not guarantee a normal delivery rate; flow matters.
        format: BALLPARK
        takesAsRead:
          - Homeostasis and feedback
        assumes:
          - a rate is an amount multiplied by how fast it is delivered
        why: Two patients with identical saturations can differ by a factor of two in delivery, because the flow term is doing the work. A concentration is not a rate.
        question: Estimate oxygen delivery for the patient with the lower cardiac output.
        estimate:
          relationship: Oxygen delivered = blood flow × oxygen carried per unit of blood.
          prompt: Two patients are being compared and the bedside argument has stalled on which is worse off. Blood carries about 0.20 litres of oxygen per litre in both of them; the first moves 3 litres a minute and the second moves 5.
          question: Estimate oxygen delivery for the patient with the lower cardiac output.
          labels:
            - 3 L/min (cardiac output, first patient)
            - 0.20 L O₂/L (oxygen content of the blood)
            - 5 L/min (cardiac output, comparison patient)
            - 86 % (arterial saturation)
            - 14 g/dL (haemoglobin)
          values: [3, 0.2, 5, 86, 14]
          slots: 2
          template: "{0} × {1}"
          formula: a*b
          correct: [0, 1]
          target: 0.6
          tolerance: 0.06
          units: L O₂/min
          solution: 3 × 0.20 = 0.6 L O₂/min, against 1.0 for the comparison patient.
          explanation: Delivery is a rate, and it is the product of what each litre carries and how many litres arrive. Saturation and haemoglobin describe the content term and cannot on their own say how much oxygen reaches anything.
      - group: CLIN
        task: Use the blood-buffer relationship to estimate arterial pH and interpret what the pair of values supports.
        title: Read the downstream acid–base signal
        place: Clinical Chemistry Bench
        scene: The oxygen-delivery panel points toward a lung bottleneck, but the team still needs a downstream consequence. Arterial bicarbonate is 14 mmol/L and PaCO₂ is 31 mmHg; lactate is still pending.
        guide: >-
          Six numbers, and two of them are normal values rather than this patient's: a
          middle-of-range pH, and a normal carbon dioxide. Ask of each whether the
          relationship uses it. The dissolved gas is the carbon dioxide times its
          solubility, so those two go together. And note what the answer settles: a
          disturbance and a compensation, not a cause.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - bicarbonate is the major measured base in this buffer pair
          - PaCO₂ is the arterial carbon-dioxide pressure in mmHg
        takeaway: Acid–base status reflects both bicarbonate and carbon dioxide, so one number should not be interpreted alone.
        format: BALLPARK
        question: Estimate the pH from bicarbonate 14 mmol/L and PaCO₂ 31 mmHg.
        answerText: The estimate is about pH 7.28. The low bicarbonate drives the pH downward, while the lower PaCO₂ partly compensates. The acid–base result supports a metabolic component but does not identify its cause by itself.
        why: For the blood bicarbonate buffer, dissolved carbon dioxide is proportional to PaCO₂. The useful clinical form is pH = 6.1 + log₁₀([HCO₃⁻]/(0.03×PaCO₂)). With bicarbonate 14 and PaCO₂ 31, the ratio is about 15 and the pH is about 7.28. The low bicarbonate supports a metabolic acid–base disturbance, while the reduced PaCO₂ moves pH upward as respiratory compensation. The calculation does not identify the cause by itself; the pending lactate and the rest of the oxygen-delivery evidence still matter.
        choices:
          - Tissue lactate and acid-base status.
          - Arterial oxygenation and carbon dioxide.
          - Cardiac output, or a validated stand-in for flow.
          - The same blood-oxygen reading, repeated on three devices.
        answer: Tissue lactate and acid-base status.
        rebuttals:
          - Arterial oxygenation and carbon dioxide are already on the chart from the earlier panel. Measuring them again is precision about a number that is not in dispute.
          - Cardiac output reports the pump, and the pump has already read normal. Worth repeating if the patient changes; not the missing measurement now.
          - Three identical devices agreeing tells you the devices agree. It does not add an independent observation.
        estimate:
          prompt: Arterial bicarbonate is 14 mmol/L and PaCO₂ is 31 mmHg.
          question: Estimate arterial pH using the blood bicarbonate Henderson–Hasselbalch relation.
          values: [6.1, 14, 0.03, 31, 7.4, 40]
          correct: [0, 1, 2, 3]
          slots: 4
          template: "{0} + log10({1} ÷ ({2} × {3}))"
          formula: a + Math.log10(b/(c*d))
          target: 7.28
          tolerance: 0.03
          units: pH
          relationship: pH = 6.1 + log10([HCO₃⁻] ÷ (0.03 × PaCO₂)).
          explanation: 0.03 × 31 ≈ 0.93. Then 14 ÷ 0.93 ≈ 15.1, log10(15.1) ≈ 1.18, and pH ≈ 7.28. Low bicarbonate lowers pH; lower PaCO₂ partially compensates.
          solution: pH ≈ 7.28, consistent with acidemia and a metabolic component with respiratory compensation.
          labels:
            - 6.1  (apparent pKa)
            - 14 mmol/L  (bicarbonate)
            - 0.03 mmol/L/mmHg  (CO₂ solubility)
            - 31 mmHg  (PaCO₂)
            - 7.40  (the middle of the normal pH range)
            - 40 mmHg  (a normal PaCO₂, not this patient's)
  - title: The Immune System Turns
    objective: Construct a timeline of immune responses and decide whether deterioration reflects persistent agent burden, delayed adaptive response, or excessive inflammation.
    briefing: Several patients improve and then suddenly deteriorate as inflammation escalates. The player must distinguish protective immune responses from damaging dysregulation.
    stake: Day 18, and this is Ortiz's stage. Several patients improved for a week and are now deteriorating fast, including the paramedic who drove the first case in. The clinical immunologist, Yusuf Haddad, wants drugs that damp the immune system started tonight and Ortiz is not far behind him; Morales wants the timeline built first. Ortiz is right — people are dying on the ward while the argument runs. This stage you build that timeline anyway, because it is what tells you which drug. Haddad has marker levels for all six patients and dates against only half of them. The paramedic's family is in the corridor.
    takeaway: Use innate immunity, adaptive immunity, antibodies, T cells, inflammation, immune regulation as an evidence chain rather than as isolated facts.
    stops:
      - group: IMM
        task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly placed cards after each check.
        title: Build the immune response timeline
        place: Immunology Lab
        scene: Patients are improving and then getting worse again, and the immunology lab wants the normal response on the board before it says which part has gone wrong. Four cards, no order yet.
        guide: >-
          These four are ordered by speed and by how specific they are, and that
          ordering is what makes a clinical measurement readable. Ask of each how long
          it takes and what it recognises. Pattern recognition fires within hours.
          Finding the right clone and expanding it takes days. And one of these is what
          is left over afterwards.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim about dependency: each
              step is here because the one before it has already happened, or has to have.
              One transposed pair falsifies that claim wherever it sits, so partial credit
              would be credit for a sequence that does not work.
          - >-
              Why the ends are the place to start. The first and last cards are constrained
              by having nothing before or after them, which usually makes them the two you
              can settle from the scene alone. Pinning them collapses the remaining
              arrangements sharply, and what is left in the middle is where the actual
              judgement lives.
          - >-
              What the rail can be ordered on. Time is the usual axis, but it is not the
              only one. An order can run on cost, on risk, or on reversibility — every
              observation that leaves the sample as it was, before any that consumes it. On
              those boards a chronological reading finds nothing, because none of the steps
              has to happen at a particular hour.
        takeaway: Innate and adaptive immunity are coordinated phases, not competing systems.
        format: SEQUENCE
        rebuttals:
          - "Innate recognition first: it needs no prior exposure, which is exactly why it can be the fastest."
          - Recruitment second — signals bring cells to the place, and nothing specific can act until cells are there.
          - Clonal expansion third, and it is slow because finding and multiplying the right lymphocyte takes days.
          - Memory last. It is what is left after resolution, and it is the reason a second exposure goes differently.
        takesAsRead:
          - Cell structure and function
          - "Pathogens: viruses and bacteria"
        assumes:
          - the immune system has a fast general response and a slower specific one
        cards:
          - Innate sensors recognize damage or unfamiliar molecular patterns.
          - Local signals recruit and activate immune cells.
          - Antigen-specific lymphocytes expand and act.
          - A smaller memory population persists after resolution.
        order: [0, 1, 2, 3]
        why: The phases are ordered by speed and by specificity, and that ordering is what makes a clinical measurement interpretable. Innate sensors fire within hours because they recognise patterns rather than a particular agent. Local signals then recruit cells to where the damage is. Antigen-specific lymphocytes take days because they have to find the right clone and expand it. Memory is what persists after — a smaller population, kept.
      - group: CLIN
        task: Which mechanism best explains the reversal in the full panel?
        title: Protective response or runaway inflammation?
        place: Intensive Care Unit
        scene: Several patients began to worsen after the amount of detectable pathogen had already started to fall. The panel from the last 48 hours is on the screen, and the ward wants to know what it is treating.
        guide: >-
          Five readings, and the timing is the discriminator. Ask of each candidate
          whether it would have the pathogen curve rising or falling while the patient
          worsens. If the agent were driving this, the two would climb together.
          Neutralising antibody being present says the specific response has arrived.
          The negative cultures remove the rival explanation for a late deterioration.
        background:
          - >-
              Why the unremarkable readings decide it. The salient reading is what draws
              attention, and it is usually consistent with several explanations at once,
              which is why it rarely settles anything. The readings that discriminate are
              the ones a candidate predicts should have moved and which have not: a normal
              value is a positive result against every mechanism that would have disturbed
              it.
          - >-
              How to work the candidates. Take each mechanism and predict the panel it
              implies before you look at the panel again — which readings it drives, in
              which direction, and by roughly how much. Then compare. Working that way round
              is what separates a diagnosis from a rationalisation, because the prediction
              is made before the data is consulted.
          - >-
              Why only one candidate survives. Several will account for part of the panel,
              deliberately so, and a partial fit is exactly what a confident wrong answer
              feels like from the inside. When two remain, look for the reading on which
              their predictions differ and let it decide. If no reading separates them you
              have not finished reading the panel.
        takeaway: A biological response can become part of the problem. The strongest explanation must account for timing as well as the direction of each measurement.
        format: DIAGNOSIS
        rebuttals:
          - Uncontrolled replication would show a rising pathogen signal. This 1 is falling, over 48 hours, while the patient declines.
          - A second, bacterial infection on top of the first is the classic late deterioration, and it is the reason cultures were sent. They are negative.
          - Measurement noise does not move four readings in a coherent direction at once, and the antibody result is not noise.
        takesAsRead:
          - Cell structure and function
          - "Pathogens: viruses and bacteria"
        assumes:
          - the immune response can damage tissue while it clears an infection
        headline: Several patients begin to worsen after the amount of detectable pathogen has started to fall.
        readings:
          - zone: Pathogen signal
            label: Pathogen signal
            value: Falling over 48 hours
            status: alarm
            note: Lower than at admission
          - zone: Inflammatory cytokine panel
            label: Inflammatory cytokine panel
            value: Rising sharply
            status: alarm
            note: Multiple inflammatory signals increase together
          - zone: Neutralizing antibody
            label: Neutralizing antibody
            value: Present
            status: alarm
            note: Adaptive response is active
          - zone: Oxygenation
            label: Oxygenation
            value: Worsening
            status: alarm
            note: Physiology deteriorates despite lower pathogen signal
          - zone: Bacterial cultures
            label: Bacterial cultures
            value: No growth
            status: normal
            note: No evidence for a new bacterial infection
        choices:
          - label: Uncontrolled pathogen replication
            mechanism: The agent is multiplying faster and directly increasing tissue injury.
          - label: Inflammation out of control
            mechanism: The immune response remains strongly activated and damages tissue even as pathogen burden falls.
          - label: A new bacterial infection on top
            mechanism: A second bacterial infection is now driving the decline.
          - label: Measurement noise
            mechanism: The apparent changes are unrelated fluctuations without a shared mechanism.
        answer: Inflammation out of control
        why: Timing is the discriminator. If the agent were driving this, its curve and the damage would rise together — instead the pathogen signal is falling while inflammatory signals climb and the patient gets worse. That is a response that has outlived its cause. Neutralising antibody being present says the specific response has arrived, and the negative bacterial cultures remove the rival that would otherwise explain a late deterioration.
      - group: CLIN
        task: Spend the rapid slot on the evidence that best separates ongoing agent-driven injury from a host response that has outlasted it.
        title: Treat the mechanism, not the marker
        place: Pathology Archive
        scene: Dr. Nia Okafor, the immunology lead, has one rapid laboratory slot before tonight’s treatment conference. Patients are worsening late, and four measurements from archived samples could return on different timescales.
        guide: >-
          One laboratory slot before tonight's conference, and four measurements that
          return on different timescales. Open each and ask what mechanism its result
          would establish, not how interesting the number is. Patients are worsening
          late, which narrows what a useful answer looks like. Buy the one that changes
          what the team treats.
        background:
          - >-
              Why late worsening is the clue. Deterioration after the peak of viral
              replication points away from the virus itself and towards the response to it.
              Those imply different treatments — antiviral versus immune-modulating — and
              giving the wrong one late is worse than giving nothing.
          - >-
              Why timescale is part of the value. A measurement that returns after the
              conference cannot change tonight's decision. That is not a reason to prefer
              fast and useless, but it does mean the slot has to be spent on something that
              both discriminates and arrives.
          - >-
              What a marker is and is not. A number that rises with severity tells you how
              ill somebody is. A number that identifies which process is driving the illness
              tells you what to do about it. Only the second is a mechanism, and only the
              second changes the treatment.
        takesAsRead:
          - Innate and adaptive immunity
        assumes:
          - the same bedside deterioration can arise from different mechanisms
          - a trend over time can distinguish mechanisms that overlap at one time point
        takeaway: The most valuable measurement is the one whose possible outcomes separate competing mechanisms that would lead to different actions.
        format: VALUE
        question: Which measurement most changes the mechanism the team should carry into tonight’s treatment discussion?
        value:
          hint: You can get one result before tonight. Open each option to see what it would reveal about the two competing mechanisms, then spend the slot.
          budget:
            amount: 1
            unit: rapid laboratory slot
            label: Results available before tonight's conference
          decision: Choose which mechanism—continuing agent activity or host-driven inflammation—has the stronger time-course support.
          options:
            - id: paired_trends
              label: Paired agent burden and inflammatory markers across two time points
              cost: 1
              axis: causal direction over time
              decisive: true
              reveals: Whether agent burden and inflammation rise together or separate as burden falls while inflammation continues upward.
            - id: single_marker
              label: Repeat one inflammatory marker now
              cost: 1
              axis: current inflammatory level
              decisive: false
              reveals: Whether inflammation is high at this moment, without showing whether it is following or outlasting agent burden.
            - id: cell_states
              label: Deep immune-cell state profiling
              cost: 1
              axis: immune-cell phenotype
              decisive: false
              reveals: Which immune-cell programs are active, but not a rapid paired trajectory for the immediate mechanism question.
            - id: pathology
              label: Detailed tissue pathology
              cost: 1
              axis: location and pattern of injury
              decisive: false
              reveals: Where tissue injury is occurring, without by itself establishing whether continuing agent activity or the host response is driving it.
        answerText: Use the rapid slot for paired agent-burden and inflammatory-marker measurements across time. The key evidence is direction. Falling burden with rising inflammation supports a host-driven late phase more strongly than one high inflammatory value. It also separates the mechanism better than a detailed picture of where injury occurred.
        why: A single inflammatory value can be high while the agent is still driving disease or after the immune response becomes the main source of injury. The mechanisms separate when their trajectories separate. If agent burden falls while inflammatory markers continue rising, the host-driven explanation gains support. If both rise together, ongoing agent activity remains plausible. Cell-state profiling and pathology add useful detail, but they do not answer the urgent causal question as directly. The most valuable measurement is the one that splits the live hypotheses before the decision.
  - title: The Hidden Transmission Route
    objective: Identify the hidden route and target surveillance where it changes decisions rather than where sampling is easiest.
    briefing: Cases continue despite hospital isolation. Wastewater and neighborhood data suggest transmission is occurring before severe symptoms appear.
    stake: Day 24, and Morales gets her stage. Ward isolation has held for nine days and cases keep appearing in neighbourhoods with nobody in hospital. A field epidemiologist, Grace Oduya, has pulled a sewer sample from the north of the city that was kept by chance and tested this morning — positive four days before the first patient walked in. This stage you decide where transmission is actually happening and where to put surveillance. Oduya has three sampling teams and the city has four watersheds. The nine days of ward isolation have already cost the hospitals their elective work.

          - "Target and mechanism first: without them there is nothing to test a compound against except hope."
          - Preclinical activity and safety second, because a compound that harms an animal has told you something you needed before a person took it.
          - Endpoints, controls and stopping rules third — they are what make the result interpretable, and they cannot be chosen after the data arrives.
          - The monitored trial last, with oversight. It is the step everything before it exists to make defensible.
        assumes:
          - activity in a dish is not evidence of benefit in a person
        cards:
          - Define the biological target and intended mechanism.
          - Demonstrate relevant activity and identify major safety concerns in preclinical evidence.
          - Specify trial population, endpoints, controls, and stopping rules.
          - Begin a monitored clinical trial with independent oversight.
        order: [0, 1, 2, 3]
        why: Urgency changes the speed of this path and not its structure. A target and a mechanism come first because they say what the compound is supposed to do; preclinical evidence says whether it does anything and what it does to the animal; the trial design says what would count as working and when to stop. Skip the endpoint and the stopping rule and you have a trial that cannot conclude anything and cannot be halted when it should be.
      - group: POP
        task: The city can start one layer this month. Which?
        title: Build a layered intervention portfolio
        place: Public Health Strategy Room
        scene: One portfolio, six plausible layers, and enough money for three. Each layer is estimated to cut transmission by 15 to 30 per cent on its own, the estimates come from different settings, and the city would like to be told the crisis is under control.
        takeaway: Layers are chosen for different mechanisms and different timescales, not for how promising each one sounds.
        format: CHOICE
        assumes:
          - two tools that fail for the same reason fail at the same time
        question: The city can start one layer this month. Which?
        choices:
          - Ventilation and rapid-isolation improvements.
          - A vaccine candidate against a conserved surface feature.
          - A therapeutic aimed at a validated host or agent pathway.
          - A publicity campaign stating that the crisis is under control.
        answer: Ventilation and rapid-isolation improvements.
        why: "Layers are chosen for mechanism and for timing, not by ranking their headline effects. The six estimates all sit between 15 and 30 per cent and all come from other settings, so the numbers cannot separate them here. Mechanism can: measures sharing one — three that depend on people staying home — fail in the same week, while ventilation and isolation act on transmission opportunity whatever the biology turns out to be. Timing settles the rest, because those two work this month, which is the month the other candidates spend in development."
        rebuttals:
          - The vaccine is the strongest long-run layer and protects nobody during the months it takes to make. Start it too; it is not what this month buys.
          - A therapeutic depends on a pathway that is still being validated, and it acts after infection rather than reducing how much of it there is.
          - A campaign announcing control is not a layer. It has no mechanism, and it fails in exactly the way that costs the most.
  - title: The Trial Signal
    objective: Make a conditional trial decision that weighs benefit, uncertainty, and safety rather than relying on one p-value or headline percentage.
    briefing: Early trial results appear encouraging, but enrollment is small and adverse events are uneven. The player must distinguish a real effect from random variation and decide whether the trial should expand.
    stake: "Day ninety-six, and the trial has reported: ten hospitalisations in the treated group against twenty in the control, out of four hundred people. Most of that benefit sits at the one site that enrolled the youngest patients, and the serious adverse events are not spread evenly either. The health minister wants a number before deciding how much to buy, and has been given one percentage she would like confirmed. This stage you read the result properly and decide whether the trial continues, expands or stops. Nobody in the room has yet said how many people twenty is out of."
    takeaway: Use randomization, control groups, effect size, confidence intervals, adverse events, stopping rules as an evidence chain rather than as isolated facts.
    stops:
      - group: CLIN
        task: Blood pH is 7.28 with a low bicarbonate. What is that telling you?
        title: What the pH is telling you
        place: Clinical Physiology Suite
        scene: Arterial pH 7.28, bicarbonate low, and the patient is breathing fast. The registrar has read the fast breathing as the problem and wants to sedate it down.
        takeaway: Blood pH is defended by a buffer system, so a shifted pH means the buffer has been overwhelmed.
        format: CHOICE
        assumes:
          - blood is buffered, and normal arterial pH sits near 7.4
        question: Blood pH is 7.28 with a low bicarbonate. What is that telling you?
        choices:
          - Acid is accumulating, bicarbonate is being consumed buffering it, and the fast breathing is the compensation.
          - The fast breathing has caused the acidity and slowing it will correct the pH.
          - A pH of 7.28 is within the normal range and needs no explanation.
          - The bicarbonate is low because the patient is breathing off carbon dioxide.
        answer: Acid is accumulating, bicarbonate is being consumed buffering it, and the fast breathing is the compensation.
        why: "Bicarbonate is the blood's main buffer: it neutralises added acid and is consumed doing it, so a low bicarbonate with a low pH means acid is being produced faster than it is cleared. Breathing fast blows off carbon dioxide, which pushes the pH back up — it is the compensation, not the cause, and sedating it removes the one mechanism currently holding the pH where it is. Find and treat the acid; the respiratory rate is a symptom being useful."
        rebuttals:
          - Hyperventilation raises pH. It cannot be the cause of an acidity it is opposing.
          - Normal arterial pH is about 7.35 to 7.45, and the body defends it hard; 7.28 is a real derangement.
          - Blowing off carbon dioxide lowers carbonic acid, not bicarbonate stores.
      - group: POP
        task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
        title: Read effect size and uncertainty
        place: Biostatistics Office
        scene: The trial has reported, and the health minister wants a number before deciding how much to buy. The biostatistics office has the event counts for both arms and nothing has been converted yet.
        takeaway: Relative and absolute effects answer different decision questions and should be reported together.
        format: BALLPARK
        assumes:
          - a risk is events divided by the people who could have had them
        why: The same result can be told three ways. Risk halved sounds enormous. Five fewer hospital admissions in every hundred sounds modest. Twenty patients treated for one to benefit sounds like work. All three are true, and only the last two tell a minister how much of the drug to buy. Reporting the relative figure alone is the commonest way a real but small effect is oversold.
        question: Estimate the number of patients who must be treated for one to benefit.
        estimate:
          relationship: Risk = events ÷ people at risk. The number needed to treat is 1 ÷ (control risk − treated risk).
          prompt: The trial reports hospitalisation in 20 of 200 control participants and 10 of 200 treated participants.
          question: Estimate the number of patients who must be treated for one to benefit.
          labels:
            - 20 hospitalised, control arm
            - 200 participants, control arm
            - 10 hospitalised, treated arm
            - 200 participants, treated arm
            - 30 hospitalised in the trial
            - 400 participants in the trial
          values: [20, 200, 10, 200, 30, 400]
          slots: 4
          template: 1 ÷ ( {0} ÷ {1} − {2} ÷ {3} )
          formula: 1/((a/b)-(c/d))
          correct: [0, 1, 2, 3]
          target: 20
          tolerance: 1
          units: patients treated per additional benefit
          solution: Risks of 0.10 and 0.05, an absolute reduction of 0.05, so about 20.
          explanation: The same result is a halving of risk, a five-percentage-point reduction, and one benefit per twenty treated. The relative figure sounds largest and is the least useful for deciding how much of the drug to buy.
      - group: POP
        task: Promising, imprecise, and the adverse events are uneven. What does the board decide?
        title: Continue, expand, or pause?
        place: Independent Safety Board
        scene: The effect is 24 per cent with a confidence interval running from 3 to 41, and there are seven adverse events in one arm against two in the other on 180 participants. The safety board has to say what happens next, and enrolment is paused until it does.
        takeaway: A mature trial decision can be encouraging and cautious at the same time.
        format: CHOICE
        assumes:
          - a wider interval means less is known, not that the effect is smaller
        question: Promising, imprecise, and the adverse events are uneven. What does the board decide?
        choices:
          - Expand enrolment under the same pre-specified analysis.
          - Declare success and stop collecting data.
          - Add mechanistic measurements to explain why it works.
          - Pause the trial until the adverse events are fully investigated.
        answer: Expand enrolment under the same pre-specified analysis.
        why: The effect is real — the interval excludes zero — and it is too wide to act on, since 3 per cent and 41 per cent imply different policies. Width is fixed by the number of participants and by nothing else, so more argument cannot narrow it and more enrolment can. The adverse imbalance, seven against two, is small enough to be chance at this size and is exactly what a pre-specified stopping rule exists to judge. Keeping that analysis is what makes the extra participants add precision instead of adding a second chance to find a positive result.
        rebuttals:
          - Stopping now converts an imprecise estimate into a permanent one, and the imprecision is the whole reason the board was convened.
          - Mechanism is worth knowing and does not narrow the interval the decision turns on.
          - Pausing is right if the safety signal is real, and the safety board's monitoring is what establishes that — it runs alongside enrolment rather than instead of it.
  - title: Containment or Adaptation?
    objective: Use scenarios and trigger-based policies instead of pretending one forecast is certain.
    briefing: The outbreak is geographically uneven. Leaders must choose between aggressive local containment, broader mitigation, and long-term adaptation while the biological parameters remain uncertain.
    stake: Day a hundred and eighteen. Three districts are on visibly different paths and the council wants one policy by Friday. Ninety of the region's hundred and twenty critical-care beds are full and severe cases are arriving at about eight a day. Ortiz wants the beds protected; Morales wants the growth stopped where it is still cheap. Ortiz has the bed numbers by hour, Morales has the district growth rates, and the two documents have never been in the same room. This stage you build the arithmetic behind the decision and choose a policy that survives being wrong. The honest answer to an uncertain future is a set of triggers rather than one guess.
    takeaway: Use population growth, feedback, capacity thresholds, model assumptions, scenario analysis, tradeoffs as an evidence chain rather than as isolated facts.
    stops:
      - group: POP
        task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly placed cards after each check.
        title: Build a decision model
        place: Population Modeling Group
        scene: Three districts are on visibly different trajectories and the council wants one citywide policy by Friday. The modelling team has nine days of case data and a dozen parameters it can only bound.
        takeaway: Models are structured arguments whose assumptions should remain visible.
        format: SEQUENCE
        rebuttals:
          - The decision, the horizon and the outcomes come first, or the model answers the question that was easiest to model.
          - Structure and inputs second, and transparent, because a structure nobody can inspect cannot be argued with.
          - "Scenarios and sensitivity third: the point is the spread across plausible worlds, not the middle of it."
          - Triggers last, tying a scenario to something observable. Without them the model produces a graph and no decision.
        assumes:
          - a model's output is only as good as the assumptions it was given
        cards:
          - State the decision, time horizon, and outcomes that matter.
          - Choose a transparent model structure and estimate inputs from data.
          - Run multiple plausible scenarios and sensitivity tests.
          - Link observable triggers to pre-agreed policy changes.
        order: [0, 1, 2, 3]
        why: A model is a structured argument, not an oracle, and its assumptions are as much of the output as its numbers. Stating the decision first is what stops it modelling something nobody asked about — a model built without a decision answers whatever question was easiest. The structure and the inputs come next, then the range of plausible worlds rather than one, and finally the triggers, because a scenario that is not tied to an observable is a scenario nobody will ever act on.
      - group: CLIN
        task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
        title: Hospital capacity threshold
        place: Hospital Capacity Center
        scene: The region has 120 staffed critical-care beds. Ninety are already full. Severe cases are arriving at about eight a day, and the average stay is somewhere near six days — a figure nobody has actually checked.
        takeaway: Simple bounds can reveal which missing data are decision-critical.
        format: BALLPARK
        assumes:
          - a bound is what you can say before the missing number arrives
        why: A bound is worth computing early because of what it shows is missing. Here it says the decision turns on a discharge rate nobody is collecting.
        question: Estimate the upper bound on time to capacity, assuming nobody is discharged.
        estimate:
          relationship: Time to fill = beds free ÷ arrivals per day.
          prompt: The region has 120 staffed critical-care beds with 90 already occupied, severe cases are arriving at about eight a day, and the average stay is around six days.
          question: Estimate the upper bound on time to capacity, assuming nobody is discharged.
          labels:
            - 30 open beds
            - 8 admissions/day
            - 120 staffed beds
            - 90 beds occupied
            - 6 days (average stay)
          values: [30, 8, 120, 90, 6]
          slots: 2
          template: "{0} ÷ {1}"
          formula: a/b
          correct: [0, 1]
          target: 3.75
          tolerance: 0.3
          units: days
          solution: 30 ÷ 8 ≈ 3.75 days, if nobody leaves.
          explanation: Total beds is the wrong numerator, because ninety of them are full. The average stay is what would turn this bound into a forecast, and nobody has measured the discharge rate — which is exactly what the crude number exposes.
      - group: POP
        task: A policy the council can defend for a month. Which?
        title: Choose an adaptive policy
        place: City Command
        scene: The outbreak is geographically uneven and the council wants a policy it can defend for a month. Three districts, three different trajectories, and one decision.
        takeaway: Good policy is a feedback system, not a one-time guess.
        format: CHOICE
        assumes:
          - a policy tied to an observable can change without anybody having been wrong
        question: A policy the council can defend for a month. Which?
        choices:
          - Citywide measures tied to hospital and growth thresholds.
          - Targeted containment wherever transmission chains are traceable.
          - Capacity expansion and protection of vulnerable populations.
          - Commit to one policy now and hold it whatever the data show.
        answer: Citywide measures tied to hospital and growth thresholds.
        why: Three districts on three trajectories cannot be served by one fixed measure, and uncertainty is not resolved by choosing more confidently. A policy tied to observable triggers — a case rate, a hospital occupancy, a test positivity — changes when the outbreak changes, in a way that was announced before it happened. That is also what lets it be relaxed without anybody having to admit they were wrong — which is what keeps it defensible for a month.
        rebuttals:
          - Targeted containment is cheap and effective where chains are traceable, and it fails silently where they are not. Nothing in it tells you it has stopped working.
          - Capacity expansion protects the outcome that matters and does nothing about transmission, so it raises the ceiling without slowing the climb.
          - Committing regardless of new evidence is the only option here that cannot learn, which in a month of an uneven outbreak is the one guaranteed to be wrong somewhere.
  - title: The Final Briefing
    objective: Produce a claim-by-claim evidence package with explicit residual uncertainties and durable surveillance responsibilities.
    briefing: The mayor, hospitals, and public must receive one integrated account of what happened, what remains uncertain, and which actions should continue.
    stake: Day a hundred and forty. The mayor is on air in an hour, and behind that broadcast sit five months of conclusions that are not equally solid. The route of transmission is settled. The animal source is not, and Castellanos has said so in writing. One thing said in public early — that this began with the hospital cluster — did not survive Oduya's sewer sample. This stage you go through the claims one at a time and decide what the city keeps funding after the emergency budget closes. Say too little and the next outbreak arrives with nobody watching for it.
    takeaway: Use evidence synthesis, causal chains, uncertainty, ethics, communication, long-term monitoring as an evidence chain rather than as isolated facts.
    stops:
      - group: POP
        task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used once.
        title: Disposition the final claims
        place: Scientific Review Hall
        scene: Four claims are going into the final report and they are not equally well supported. The review board has to decide what to say about each, and the document will outlive everybody in the room.
        takeaway: Scientific conclusions should carry the strength and limits of their supporting evidence.
        format: PROTOCOL
        columns:
          - What the evidence supports
          - What you do with it
        rebuttals:
          - Independent streams agreeing is the strongest evidence in the report, and treating it as provisional wastes the only thing the response can plan on.
          - One small observational sample identifies a subgroup worth confirming. Published as established, it becomes policy about people nobody measured properly.
          - A benefit whose duration is unknown is used conditionally, with follow-up — the uncertainty is about how long, not about whether.
          - A plausible unconfirmed reservoir justifies more investigation. Acting on it destroys the evidence and may not touch the actual source.
        assumes:
          - evidence comes in strengths, and a conclusion inherits the weakest one it rests on
        scenarios:
          - Multiple independent data streams support the transmission route.
          - A severe-risk subgroup is suggested by one small observational sample.
          - An intervention lowers hospitalization with monitored safety but long-term duration is unknown.
          - An animal reservoir remains plausible but unconfirmed.
        choices:
          - Treat as established enough for operational planning while continuing surveillance.
          - Label as provisional and collect representative confirmatory data.
          - Use conditionally with follow-up and duration studies.
          - Avoid destructive ecological action; continue targeted One Health investigation.
        mapping: [0, 1, 2, 3]
        why: The failure mode here is uniform treatment — publishing the weakest claim with the confidence of the strongest, or holding back the strongest because the weakest is unresolved. Multiple independent data streams agreeing is the strongest thing on the list and can carry operational planning. One small observational sample is a hypothesis worth collecting data on. A benefit shown with unknown duration can be used with follow-up attached. And a plausible unconfirmed reservoir is a reason to keep investigating, not a reason to destroy anything.
      - group: POP
        task: Order the briefing by how much weight each claim can carry.
        title: Build the public explanation
        place: City Command
        scene: The mayor is on air in an hour. The transmission route is settled, the animal reservoir is not, and the treatment works under conditions nobody has tested past eight weeks. The draft opens with the actions.
        takeaway: A public account is ordered by the strength of its evidence, not by the order the work happened in.
        format: SEQUENCE
        assumes:
          - an audience judges a claim by how it was supported, once it knows
        cards:
          - The transmission route, which three independent data streams agree on.
          - The severe-risk subgroup, which one small observational sample suggests.
          - The animal reservoir, which remains plausible and unconfirmed.
          - What it would take to settle each open question, and when the city revisits it.
        order: [0, 1, 2, 3]
        why: The briefing is ordered by how much the evidence will carry, strongest first, because that is the order in which a listener can tell one claim from another. Publishing the reservoir with the confidence of the transmission route is what makes the whole document unbelievable when the reservoir turns out to be somewhere else.
      - group: POP
        task: The emergency budget closes this month. What does the city commit it to?
        title: Fund the post-crisis legacy
        place: Public Briefing Room
        scene: "The emergency budget closes in three weeks, and anything uncommitted returns to the state. Four proposals against funding for two: the sequencing bench that found the variant, the sewer sampling network, the animal survey, and the clinic that took the first cases."
        takeaway: The final responsibility is to convert crisis knowledge into durable public capability.
        format: CHOICE
        assumes:
          - capability that is not funded to continue stops when the emergency does
        question: The emergency budget closes this month. What does the city commit it to?
        choices:
          - Integrated clinical, environmental and genomic surveillance.
          - Health-system resilience and workforce training.
          - Preserving the data, methods and after-action record.
          - Closing the records once the review is published.
        answer: Integrated clinical, environmental and genomic surveillance.
        why: "Rank the four by what depends on them. Every week of warning this outbreak got came from a signal somebody was already collecting: the sequencing bench found the variant, and the sewer network found transmission before the hospitals did. Every other response, treatment included, is evaluated against what those two report. The clinic matters and can be funded from routine health money; the animal survey answers a question that is no longer urgent. Surveillance is also the only item that has to run continuously to be worth anything, which is exactly what a closing budget should endow rather than leave to next year's argument."
        rebuttals:
          - Resilience and training decide whether detection helps, and they are the next call. They do nothing if nothing detects the next event.
          - Preserving the record costs very little and should happen regardless. It is a filing decision, not what an emergency budget is for.
          - Closing the records removes the only account of how any of this was measured, and the next response would start from nothing.

# What is inside each room.
interiors:
  CLIN:
    caption: A patient is the only instrument that reports everything at once, and none of it precisely.
    standLine: Four admissions with the same combination of signs, and three different working diagnoses.
    station:
      kind: vitals
      title: Bedside monitor
      rows:
        - label: Oxygen saturation
          value: 88 %
          status: alarm
        - label: Temperature
          value: 39.1 C
          status: high
        - label: Chest imaging
          value: bilateral
          status: alarm
        - label: Blood pressure
          value: 118/72
          status: normal
  CELL:
    caption: What a pathogen does to a cell constrains what it can do to a person.
    standLine: Culture flasks from four patients, two of them showing something the others do not.
    station:
      kind: panel
      title: Culture bench
      rows:
        - label: Cytopathic effect
          value: 48 h
          status: high
        - label: Receptor assay
          value: pending
          status: low
        - label: Negative control
          value: clean
          status: normal
  MOL:
    caption: A test result is a claim about the sample, not about the patient.
    standLine: A positive with no negative control run beside it, and a sequencing run half finished.
    station:
      kind: panel
      title: Sequencing run
      rows:
        - label: Cycle threshold
          value: 22
          status: high
        - label: Negative control
          value: not run
          status: alarm
        - label: Genome coverage
          value: 94 %
          status: normal
  IMM:
    caption: The damage a patient shows can come from the pathogen or from the response to it.
    standLine: Inflammatory markers rising in patients whose viral load is already falling.
    station:
      kind: vitals
      title: Immunology bench
      rows:
        - label: Inflammatory marker
          value: 210 mg/L
          status: alarm
        - label: Viral load
          value: falling
          status: normal
        - label: Antibody titre
          value: day 6
          status: high
  POP:
    caption: A case count without a denominator is a number about testing, not about disease.
    standLine: Case curves from three districts, each on a different testing regime.
    station:
      kind: panel
      title: Operations board
      rows:
        - label: Cases today
          value: 61
          status: alarm
        - label: Tests today
          value: 940
          status: high
        - label: Baseline expectation
          value: 8 per week
          status: normal
  FIELD:
    caption: A reservoir claim needs the animal, the exposure and the genome to agree.
    standLine: Trapping records from the flood plain, and sequences that are close but not identical.

          - Measure ribosome association with that RNA.
          - Measure the protein's half-life and degradation rate.
          - Sequence the neighbouring chromosomal region.
        answer: Quantify the protein's messenger RNA across time.
        rebuttals:
          - Ribosome association asks whether translation changed, and it only means something once you know whether the amount of message changed underneath it.
          - Half-life asks whether the protein is simply being destroyed more slowly. A real possibility, and the third measurement rather than the first.
          - The neighbouring region answers a question nobody has asked about a protein whose gene is already identified.
  - title: A Test Before Morning
    objective: Approve a diagnostic workflow only after its analytical and clinical limitations are explicit.
    briefing: Hospitals need a rapid diagnostic by sunrise. The molecular signal is promising, but contamination, false negatives, and prevalence could make a technically impressive test clinically misleading.
    stake: Day nine, and the hospitals need a working test by sunrise. Patel's overnight run has flagged several patients positive — and one of the controls, a tube that had nothing in it and should have come back empty. 3000 people have already been told to isolate on that run and the bulletin goes out at 6. This stage you decide whether the run can be believed and what a positive would mean for a patient. Patel wants to re-run everything from the start. The hospitals want the six o'clock number.
    takeaway: Use PCR logic, controls, sensitivity, specificity, predictive value, prevalence as an evidence chain rather than as isolated facts.
    stops:
      - group: MOL
        task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly placed cards after each check.
        title: Build a trustworthy amplification run
        place: Sample Processing Room
        scene: Hospitals want a diagnostic by sunrise and the sample-processing room has four hours. Four steps are on the whiteboard. Amplification multiplies whatever is in the tube by a factor of 1 billion, which is the reason this order is argued about at all.
        guide: >-
          All four steps will happen, so ask what each one protects. The amplification
          multiplies whatever is in the tube, including whatever came from the room.
          Identity has to survive extraction or the result belongs to nobody. And
          controls have to be in the run rather than added afterwards, which is what
          makes this an ordering question.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim about dependency: each
              step is here because the one before it has already happened, or has to have.
              One transposed pair falsifies that claim wherever it sits, so partial credit
              would be credit for a sequence that does not work.
          - >-
              Why the ends are the place to start. The first and last cards are constrained
              by having nothing before or after them, which usually makes them the two you
              can settle from the scene alone. Pinning them collapses the remaining
              arrangements sharply, and what is left in the middle is where the actual
              judgement lives.
          - >-
              What the rail can be ordered on. Time is the usual axis, but it is not the
              only one. An order can run on cost, on risk, or on reversibility — every
              observation that leaves the sample as it was, before any that consumes it. On
              those boards a chronological reading finds nothing, because none of the steps
              has to happen at a particular hour.
        takeaway: A diagnostic result is the output of a controlled process, not simply a machine reading.
        format: SEQUENCE
        rebuttals:
          - Extraction first, with identity preserved. A result that cannot be tied to a patient is not a diagnosis of anybody.
          - Controls go into the run alongside the samples. Added later they test a different run from the one that produced the result.
          - Amplification third, with validated primers — the step everything else exists to make interpretable.
          - Interpretation last and conditional. If a control misbehaved, the patient wells are uninterpretable no matter how clean they look.
        takesAsRead:
          - DNA structure and replication
        assumes:
          - amplification copies whatever template is present, wanted or not
        cards:
          - Extract material while preserving sample identity.
          - Include positive, negative, and no-template controls.
          - Amplify the target with validated primers and cycling conditions.
          - Interpret the patient signal only if all controls behave as expected.
        order: [0, 1, 2, 3]
        why: A patient result is the output of a controlled process, and read before the controls are read it is an instrument reading rather than evidence. Identity has to survive extraction or the result belongs to no one. The controls have to be in the run, not added afterwards — a positive control shows the chemistry worked, and a no-template control shows the signal did not come from the room. Only when they behave is the patient well worth interpreting.
      - group: MOL
        task: Open the dependency chain behind each result, keep the evidence that still stands, and name the shared source that makes the amplification positives unreliable.
        title: Why did the assay turn positive?
        place: PCR Diagnostics Lab
        scene: Dr. Ravi Patel has patient wells, two controls and an independent platform on one screen. One ward has already cleared isolation rooms. If this run is wrong, patients will be moved before the morning team arrives.
        guide: >-
          Open each result to see what its run depended on. Keep the ones that would
          still stand if one workflow step were contaminated, and untick the rest. Then
          name the dependency the failing ones share. A ward is already clearing
          isolation rooms, so both halves matter: a false positive moves patients, and
          discarding a true one leaves an outbreak unwatched.
        background:
          - >-
              How a shared workflow makes results agree wrongly. Wells processed in the same
              batch pass through the same extraction, the same reagents and the same
              instrument. Contamination anywhere in that chain appears in every well
              downstream of it, and the pattern looks like a cluster of genuine positives.
          - >-
              What the controls are actually for. A negative control that stays negative
              rules out contamination affecting the whole batch. A positive control shows
              the chemistry worked. Neither can rule out a contamination event that entered
              after the controls were placed, which is why the independent platform is on
              the screen.
          - >-
              Why independence beats repetition. Running the same assay again on the same
              extract shares every dependency, so it will reproduce a contaminated result
              perfectly. A different platform on a different extract is the only evidence
              that survives the question.
        takesAsRead:
          - DNA structure and replication
        assumes:
          - a no-template control contains no patient sample
          - two methods with different chemistry can fail for different reasons
        takeaway: Agreement is not independent evidence when several results inherit the same contamination path.
        format: TRACE
        question: Which results share one workflow dependency, and what independent evidence survives it?
        trace:
          hint: Do not count positive wells. Open what each result depends on, keep evidence built on a different path, and identify the dependency shared by the unreliable signals.
          target: workflow_carryover
          channels:
            - id: patient_amp
              label: Patient amplification wells
              reading: several positive signals (expected positive if target is present and the run is clean)
              depends:
                - patient_material
                - amp_chemistry
                - workflow_carryover
            - id: ntc
              label: No-template control
              reading: positive target signal (expected should remain negative)
              depends:
                - amp_chemistry
                - workflow_carryover
            - id: positive_control
              label: Known positive control
              reading: amplifies as expected (expected chemistry can amplify target)
              depends:
                - amp_chemistry
                - control_template
            - id: orthogonal
              label: Independent patient platform
              reading: target not detected in the same patients (expected separate preparation and chemistry)
              depends:
                - patient_material
                - orthogonal_chemistry
                - independent_prep
          resources:
            - id: patient_material
              label: Patient material
            - id: amp_chemistry
              label: Amplification chemistry
            - id: workflow_carryover
              label: Amplification-workflow carryover
            - id: control_template
              label: Known positive-control template
            - id: orthogonal_chemistry
              label: Independent platform chemistry
            - id: independent_prep
              label: Independent sample preparation
          independent:
            - positive_control
            - orthogonal
        answerText: The patient wells and no-template control share the amplification workflow, so carryover can create both signals. Keep the facts that the chemistry can work and that the independent platform did not confirm the target. The amplification run is invalid for classifying these patients.
        why: A no-template control has no patient material, so a target signal there must come from the workflow or reagents. That same path is shared by the patient amplification wells, which makes their positive signals ambiguous. The known positive control still shows that the chemistry can amplify target, but it cannot rescue a contaminated run. The independent platform uses different preparation and chemistry, so its negative result remains informative. The correct inference comes from tracing dependencies, not from counting how many wells on one plate are positive.
        headline: The overnight amplification run flags several patient samples as positive, but one control is also behaving strangely.
      - group: POP
        task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
        title: What does a positive mean?
        place: Clinical Statistics Desk
        scene: The mayor's office wants to screen a low-prevalence population and treat every positive as a case. The statistics desk has a ten-thousand-person validation table with reference status and assay results.
        guide: >-
          Six numbers, and two of them are tempting figures from other situations. Ask
          of each whether this table supplies it. Sensitivity and specificity are
          properties of the test. What a positive is worth is not, because it depends on
          how many people had it to begin with. That is why a low-prevalence screen
          produces more false positives than true ones.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - prevalence is the share of a population that has the condition
          - sensitivity and specificity are properties of a test, not of a population
        takeaway: Positive predictive value depends on prevalence as well as sensitivity and specificity.
        format: BALLPARK
        question: Estimate the chance that a positive result is a true case.
        why: "The validation table lets all three quantities be computed. Among 100 infected people, 90 test positive and 10 test negative, giving 90% sensitivity. Among 9,900 uninfected people, 9,801 test negative and 99 test positive, giving 99% specificity. The same counts also show why a positive is less decisive in a low-prevalence group: there are 90 true positives but 99 false positives. So only 90 of 189 positive tests are true cases, about 48%."
        estimate:
          relationship: Sensitivity = TP ÷ (TP+FN). Specificity = TN ÷ (TN+FP). PPV = TP ÷ (TP+FP).
          prompt: A reference method identifies 100 infected and 9,900 uninfected people in a 10,000-person validation group. The assay gives 90 true positives, 10 false negatives, 9,801 true negatives and 99 false positives.
          question: Estimate sensitivity, specificity, and the chance that a positive result is a true case.
          labels:
            - 10,000  (people screened)
            - 0.01  (how many really have it, as a fraction)
            - 0.90  (sensitivity — cases the test catches)
            - 0.99  (specificity — clear people it clears)
            - 0.30  (a tempting prevalence, but not this outbreak's)
            - 0.10  (a tempting figure, and not an input here)
          values: [10000, 0.01, 0.9, 0.99, 0.3, 0.1]
          slots: 4
          template: "{0}×{1}×{2} ÷ ( {0}×{1}×{2} + {0}×(1−{1})×(1−{3}) ) × 100"
          formula: a*b*c/(a*b*c + a*(1-b)*(1-d))*100
          correct: [0, 1, 2, 3]
          target: 47.62
          tolerance: 3
          units: "%"
          solution: Sensitivity ≈ 90%, specificity ≈ 99%, PPV ≈ 48%.
          explanation: Sensitivity is 90/100 = 90%. Specificity is 9,801/9,900 = 99%. PPV is 90/(90+99) ≈ 48%. A highly specific test can still produce many false positives when the condition is uncommon.

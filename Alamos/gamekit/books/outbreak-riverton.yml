        concept: "Test performance: sensitivity, specificity, predictive value"
        place: Triage Marquee
        scene: Arrivals come through the marquee all afternoon. The triage rule is on a whiteboard by the entrance, and the clinical lead rewrites it as the ward state changes — after the beds fill, after the swab results land, after the second ambulance.
        guide: >-
          Take the arrivals the current rule wants and leave the rest. The rule on the
          whiteboard is replaced during the afternoon and nobody calls it out. What is scored
          is the arrivals either side of a change, because they are the only ones that show
          whether the marquee is reading the board or working from the last hour.
        background:
          - >-
              Why a triage rule changes at all. Early in a shift the rule sorts by how ill somebody
              is. Once isolation beds run out it sorts by who can be safely sent home to wait. After
              the swabs come back it sorts by who is confirmed, because a confirmed case and a
              suspected one no longer belong in the same queue.
          - >-
              Why the changeover is where harm happens. A marquee working to the old rule for ten
              more minutes routes confirmed cases into the queue the new rule was written to empty,
              and nothing on the board records that it happened.
        assumes:
          - a triage rule can be rewritten while patients are still arriving
        takeaway: The cost of a withdrawn instruction is paid by whoever is still working to it.
        format: SPOT
        question: Sort arrivals to the rule on the whiteboard, and keep watching the whiteboard.
        answerText: Read the board rather than the patient in front of you. Every rewrite leaves a few minutes in which the old rule still feels like the right one.
        why: >-
          Three rules run across the afternoon and each wants a different part of the board.

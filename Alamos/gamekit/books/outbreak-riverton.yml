          - Prevent initial cell entry.
          - Shorten severe inflammatory disease after infection.
          - Create immune memory before exposure.
          - Reduce opportunities for transmission while biomedical tools are limited.
        choices:
          - Entry-blocking antibody or receptor-targeted strategy.
          - Stage-specific anti-inflammatory treatment with monitoring.
          - Vaccination.
          - Ventilation, isolation, masking, or contact reduction as appropriate.
        mapping: [0, 1, 2, 3]
      - group: POP
        task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly placed cards after each check.
        title: From candidate to justified trial
        place: Therapeutics Group
        scene: Two compounds show activity in cell culture and the city wants one of them in patients within the month. Neither has been through an animal model, and the protocol on the table names no endpoint and no stopping rule.
        guide: >-
          All four steps will happen and urgency changes their speed, not their order.
          Ask of each what the next step would mean without it. A target says what the
          compound is supposed to do. Animal evidence says whether it does anything, and
          what it does to the animal. Without an endpoint and a stopping rule, a trial
          can neither conclude nor be halted.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim about dependency: each
              step is here because the one before it has already happened, or has to have.
              One transposed pair falsifies that claim wherever it sits, so partial credit
              would be credit for a sequence that does not work.
          - >-
              Why the ends are the place to start. The first and last cards are constrained
              by having nothing before or after them, which usually makes them the two you
              can settle from the scene alone. Pinning them collapses the remaining
              arrangements sharply, and what is left in the middle is where the actual
              judgement lives.
          - >-
              What the rail can be ordered on. Time is the usual axis, but it is not the
              only one. An order can run on cost, on risk, or on reversibility — every
              observation that leaves the sample as it was, before any that consumes it. On
              those boards a chronological reading finds nothing, because none of the steps
              has to happen at a particular hour.
        takeaway: Urgency changes speed and coordination, not the need for interpretable evidence and participant protection.
        format: SEQUENCE
        rebuttals:
          - "Target and mechanism first: without them there is nothing to test a compound against except hope."
          - Animal and laboratory evidence second, because a compound that harms an animal has told you something you needed before a person took it.
          - Endpoints, controls and stopping rules third — they are what make the result interpretable, and they cannot be chosen after the data arrives.
          - The monitored trial last, with oversight. It is the step everything before it exists to make defensible.
        assumes:
          - activity in a dish is not evidence of benefit in a person
        cards:
          - Define the biological target and intended mechanism.
          - Demonstrate relevant activity and identify major safety concerns in animal and laboratory evidence.
          - Specify trial population, endpoints, controls, and stopping rules.
          - Begin a monitored clinical trial with independent oversight.
        order: [0, 1, 2, 3]
        why: Urgency changes the speed of this path and not its structure. A target and a mechanism come first because they say what the compound is supposed to do; animal and laboratory evidence says whether it does anything and what it does to the animal; the trial design says what would count as working and when to stop. Skip the endpoint and the stopping rule and you have a trial that cannot conclude anything and cannot be halted when it should be.
      - group: POP
        task: Allocate three funding slots to a portfolio that acts now, preserves a longer-horizon layer, and avoids depending on one shared mechanism.
        title: Build a layered intervention portfolio
        place: Public Health Strategy Room
        scene: Dr. Nia Okafor, the immunology lead, has six plausible intervention layers and only three funding slots. Some can work this month; others take longer or share the same failure mode.
        guide: >-
          Six plausible layers, three funding slots. Watch which response questions the
          current portfolio can still answer. Layers that share a failure mode look like
          two defences and behave like one, so a portfolio that holds if one assumption
          fails is worth more than three strong layers that fail together.
        background:
          - >-
              What a layered intervention means. No single measure works perfectly, so the
              strategy is several partial ones whose failures are independent. Two layers
              that both depend on people reporting symptoms promptly are not two layers;
              they are one, bought twice.
          - >-
              Why timing separates them too. Some layers work this month and some take a
              season to stand up. A portfolio entirely made of slow layers leaves the next
              four weeks uncovered, whatever it eventually achieves.
          - >-
              How to test a portfolio. Take each assumption in turn — people comply, supply
              arrives, the pathogen behaves as modelled — and ask what is left standing if
              it is wrong. A portfolio that survives every single failure is the one that
              keeps the response working.
        assumes:
          - different mechanisms can fail for different reasons
          - a portfolio gives up some good options because its resources are finite
        takeaway: A strong intervention portfolio combines different mechanisms and timescales instead of simply taking the three largest headline effects.
        format: ALLOCATE
        question: Which three-layer portfolio still answers the response needs if one assumption fails?
        allocate:
          # data provenance: invented one-slot authoring packages; intervention mechanisms and timing are source-derived
          hint: You have three slots, not six. Keep an immediate transmission package and a different longer-horizon mechanism alive; the panel shows which response questions each choice preserves.
          pool:
            amount: 3
            unit: funding slots
            label: Intervention packages that can be started
          items:
            - id: ventilation
              label: Ventilation upgrades in high-risk indoor settings
              cost: 1
            - id: rapid_isolation
              label: Rapid testing, isolation support and contact response
              cost: 1
            - id: vaccine
              label: Vaccine platform against a conserved target
              cost: 1
            - id: therapeutic
              label: Targeted therapeutic development
              cost: 1
            - id: paid_leave
              label: Paid stay-home support for exposed workers
              cost: 1
            - id: publicity
              label: Publicity campaign declaring the crisis controlled
              cost: 1
          answers:
            - required: true
              requires:
                - ventilation
              question: Reduce indoor transmission opportunity this month
            - required: true
              requires:
                - rapid_isolation
              question: Interrupt detected transmission chains this month
            - required: true
              requires:
                - vaccine
              question: Preserve a longer-horizon immune layer
            - required: false
              requires:
                - therapeutic
              question: Develop a treatment option for infected patients
            - required: false
              requires:
                - paid_leave
              question: Reduce the cost of staying home when exposed
            - required: false
              requires:
                - publicity
              question: Create a reassuring public message without new evidence
        answerText: Fund ventilation, rapid isolation and the vaccine platform. The first two act this month through different operational routes, while the vaccine preserves a longer-horizon biological layer. The three-slot limit means useful treatment and support projects may still need other funding; the publicity-only option answers no scientific response need.
        why: Layered control is stronger when the layers do not all wait for the same event or fail for the same reason. Ventilation reduces exposure opportunities without depending on who has been diagnosed. Rapid isolation acts after detection and shortens opportunities for onward spread. A vaccine takes longer, but it adds a distinct immune mechanism for the future. Treatment and paid leave can also matter, but the fixed three-slot portfolio cannot buy everything. The point is to preserve different mechanisms and timescales under a real resource constraint.
      - group: IMM
        task: Hold the isolation room while the doors keep opening.
        title: Negative, while the door keeps opening
        concept: "Biosafety, aseptic technique and contamination"
        place: Isolation Ward
        scene: The isolation room has to stay at negative pressure to the corridor, so that air moves in rather than out. Staff come and go, the anteroom door is propped during a turn, and the extract fan is the only thing that answers it.
        guide: >-
          Hold the room's pressure difference inside the band on the gauge. The band narrows
          as the shift goes on, because the ward fills and a room that is marginal with two
          patients is not acceptable with six. The extract fan is your control, and every
          door that opens is a leak that goes on leaking until the fan answers it.
        background:
          - >-
              What negative pressure is for. Air moves from higher pressure to lower, so a room held
              below the corridor draws air in under its door rather than pushing it out. Everything
              airborne in that room stays in it and leaves through the filtered extract.
          - >-
              Why an open door is not a step in the reading. Propping the anteroom door does not
              lower the difference by two pascals and stop. It opens a path that keeps bleeding
              pressure for as long as it stands open, so a room left alone does not settle — it
              drifts toward the corridor and then past it.
          - >-
              Why a positive room is worse than no room. Once the difference goes the other way the
              room is pushing its air into the corridor, and it goes on doing it silently. The gauge
              is the only thing that says so, which is why it is read rather than assumed.
        assumes:
          - air moves from higher pressure toward lower pressure
        takeaway: A leak you do not answer is not a leak that closes itself.
        format: HOLD
        question: Hold the isolation room below the corridor while the shift runs.
        answerText: Inside the band for most of the shift, with the extract fan moved to a new setting for each door rather than nudged after the gauge has already crossed.
        why: >-
          Every event here is a step in the rate rather than a step in the reading. A propped
          door does not drop the difference by a fixed amount; it opens a path that bleeds
          pressure for as long as it is open, so a room left alone drifts and keeps drifting.
          That is why the extract fan has to be moved to a new setting and left there rather
          than nudged and released. The band narrows because the ward fills: a difference that
          is marginal with two patients in the room is not acceptable with six, and the same
          fan has to be held closer as the afternoon goes on. And the failure mode is quiet —
          a room that has gone positive is pushing its air into the corridor and looks exactly
          like a room that has not, which is why the gauge is on the wall and why somebody is
          made responsible for reading it.
        hold:
          quantity: Room pressure below the corridor
          unit: Pa
          control: Extract fan
          hold: 8
          band: 0.4
          narrowTo: 0.2
          duration: 45
          direction: raise
          authority: 0.1
          pass: 0.8
          hint: Each door is a leak that keeps bleeding. Set the fan where it answers the leak, not where it answers the gauge.
          disturbances:
            - { label: Anteroom door propped for a turn, at: 4, amount: -0.03 }
            - { label: Corridor window closed upwind, at: 20, amount: 0.05 }
            - { label: Second door opens for the trolley, at: 38, amount: -0.045 }
          commit: Report the shift
  - title: The Trial Signal
    objective: Make a conditional trial decision that weighs benefit, uncertainty, and safety rather than relying on one p-value or headline percentage.
    briefing: Early trial results appear encouraging, but enrollment is small and adverse events are uneven. The player must distinguish a real effect from random variation and decide whether the trial should expand.
    stake: "Day 96, and the trial has reported: 10 hospitalisations in the treated group against 20 in the control, out of 400 people. Most of that benefit sits at the one site that enrolled the youngest patients, and the serious adverse events are not spread evenly either. The health minister wants a number before deciding how much to buy, and has been given one percentage she would like confirmed. This stage you read the result properly and decide whether the trial continues, expands or stops. Nobody in the room has yet said how many people 20 is out of."
    takeaway: Use randomization, control groups, effect size, confidence intervals, adverse events, stopping rules as an evidence chain rather than as isolated facts.
    stops:
      - group: CLIN
        task: One site enrolled younger patients and contributes much of the apparent benefit. What should the trial team do before attributing the difference to treatment?
        title: Did the comparison stay fair?
        place: Clinical Physiology Suite
        scene: One large trial site enrolled much younger patients than the others. It also supplies much of the apparent benefit. The original analysis plan already includes site-stratified estimates and a treatment-by-site check. The health ministry wants an answer today.
        guide: >-
          Four ways to handle one imbalanced site. Ask of each whether the choice was
          made before or after the outcomes were seen. Randomisation makes groups
          comparable in expectation, not identical in every subgroup. Two of these
          options would let the analysis depend on the result. The plan already contains
          the tools, which is what makes this decidable.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - randomization balances groups in expectation, not perfectly inside every site
          - an analysis chosen after seeing outcomes can introduce bias
        takeaway: Randomization protects the treatment comparison on average; an imbalanced site pattern should be examined with pre-specified analyses.
        format: CHOICE
        question: How should the team handle the site imbalance without choosing the analysis after seeing the outcome?
        why: Randomization makes treatment groups comparable in expectation, not identical in every subgroup. A site that enrolled younger participants can create a pattern worth checking. That matters especially when the site carries much of the apparent effect. Use the site-stratified and interaction analyses specified before outcomes were seen. Then inspect consistency and data quality, and report the heterogeneity. Dropping the inconvenient site or inventing a new subgroup after seeing the result would make the analysis depend on the outcome.
        choices:
          - Use the pre-specified site-stratified analysis and test whether treatment effects differ materially by site.
          - Delete the young site because it makes the treatment look too effective.
          - Ignore site entirely because randomization guarantees identical groups everywhere.
          - Create new age cutoffs after seeing the result until the treatment effect becomes stable.
        answer: Use the pre-specified site-stratified analysis and test whether treatment effects differ materially by site.
        rebuttals:
          - Removing a site because of its result makes inclusion depend on the outcome and can bias the estimate.
          - Randomization does not guarantee perfect balance inside every site or subgroup; heterogeneity still needs to be examined.
          - Post-hoc subgroup hunting can manufacture apparently stable stories. Pre-specified analyses preserve the meaning of the comparison.
      - group: POP
        task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
        title: Read effect size and uncertainty
        place: Biostatistics Office
        scene: The trial has reported, and the health minister wants a number before deciding how much to buy. The statistics office has the event counts for both arms and nothing has been converted yet.
        guide: >-
          Six numbers, and two of them are the trial pooled together, which answers
          nothing here. Ask of each which arm it belongs to. And note that one result
          can be told three ways. A halved risk sounds enormous. Five fewer admissions
          per hundred sounds modest. Only the last two tell a minister how much to buy.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        takeaway: Relative and absolute effects answer different decision questions and should be reported together.
        format: BALLPARK
        assumes:
          - a risk is events divided by the people who could have had them
        why: The same result can be told three ways. Risk halved sounds enormous. Five fewer hospital admissions in every hundred sounds modest. 20 patients treated for 1 to benefit sounds like work. All three are true, and only the last two tell a minister how much of the drug to buy. Reporting the relative figure alone is the commonest way a real but small effect is oversold.
        question: Estimate the number of patients who must be treated for one to benefit.
        estimate:
          relationship: Risk = events ÷ people at risk. The number needed to treat is 1 ÷ (control risk − treated risk).
          prompt: The trial reports hospitalisation in 20 of 200 control participants and 10 of 200 treated participants.
          question: Estimate the number of patients who must be treated for one to benefit.
          labels:
            - 20 hospitalised, control arm
            - 200 participants, control arm
            - 10 hospitalised, treated arm
            - 200 participants, treated arm
            - 30 hospitalised in the trial
            - 400 participants in the trial
          values: [20, 200, 10, 200, 30, 400]
          slots: 4
          template: 1 ÷ ( {0} ÷ {1} − {2} ÷ {3} )
          formula: 1/((a/b)-(c/d))
          correct: [0, 1, 2, 3]
          target: 20
          tolerance: 1
          units: patients treated per additional benefit
          solution: Risks of 0.10 and 0.05, an absolute reduction of 0.05, so about 20.
          explanation: The same result is a halving of risk, a five-percentage-point reduction, and 1 benefit per 20 treated. The relative figure sounds largest and is the least useful for deciding how much of the drug to buy.
      - group: POP
        task: The benefit estimate is promising but imprecise, and adverse events are uneven. What is the defensible next decision?
        title: Continue, expand, or pause?
        place: Independent Safety Board
        scene: The estimated benefit is 24%, but the interval runs from 3 to 41. Serious adverse events are seven versus two. Enrolment is paused. The independent safety board meets tonight, with hospitals waiting for its decision.
        guide: >-
          Four decisions, and two facts have to be held together: an interval from 3 to
          41 per cent, and seven adverse events against two. Ask of each option whether
          it treats either number as more decisive than it is. Excluding zero is
          evidence against no effect, not a measurement of the effect. Raw counts do not
          separate chance from a signal.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a wider interval means less is known, not that the effect is smaller
        takeaway: Benefit and safety must both be judged through the pre-specified monitoring plan; a positive benefit estimate does not override a possible safety signal.
        format: CHOICE
        question: Promising, imprecise, and the adverse events are uneven. What does the board decide?
        why: A confidence interval from 3 to 41% is compatible with benefit across a wide range of sizes. Excluding zero under the planned model is evidence against no effect, not proof that the exact benefit is known. Seven serious adverse events versus two may be chance or a safety signal; raw counts alone do not decide which. Precision depends on sample size, event frequency and design. The board should apply the pre-specified safety boundary and event review. It can then resume, modify, expand or stop according to that plan.
        choices:
          - Apply the pre-specified safety review and resume or expand only if its boundary permits.
          - Declare success because the benefit interval excludes zero.
          - Ignore the adverse-event imbalance and collect only mechanism data.
          - Permanently stop the trial solely because seven events exceed two, without applying the planned safety review.
        answer: Apply the pre-specified safety review and resume or expand only if its boundary permits.
        rebuttals:
          - A benefit signal does not erase the safety analysis. Stopping for efficacy alone would freeze both the imprecision and the unresolved adverse-event question.
          - Mechanism can be informative but it does not replace independent adjudication of serious adverse events.
          - The imbalance deserves review, but raw counts without the planned boundary, event definitions, exposure time and adjudication are not by themselves the stopping rule.

          noise: 5
          variables:
            - id: receptor_blocker
              label: Surface-receptor blocker
              baseline: "off"
              changed: "on"
              result: 22
              deltaFromBaseline: -78
            - id: matched_antibody
              label: Matched control antibody
              baseline: "off"
              changed: "on"
              result: 97
              deltaFromBaseline: -3
            - id: particle_dose
              label: Labelled-particle exposure
              baseline: 1×
              changed: 2×
              result: 181
              deltaFromBaseline: 81
          states:
            - id: baseline
              receptor_blocker: "off"
              matched_antibody: "off"
              particle_dose: 1×
              response: 100
            - id: block_receptor
              receptor_blocker: "on"
              matched_antibody: "off"
              particle_dose: 1×
              response: 22
            - id: control_antibody
              receptor_blocker: "off"
              matched_antibody: "on"
              particle_dose: 1×
              response: 97
            - id: double_dose
              receptor_blocker: "off"
              matched_antibody: "off"
              particle_dose: 2×
              response: 181
            - id: blocker_washout

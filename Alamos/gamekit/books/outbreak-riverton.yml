    evidence: Allocate 100 decision credits across next steps after a promising but imprecise result.
- title: Containment or Adaptation?
  objective: Use scenarios and trigger-based policies instead of pretending one forecast is certain.
  briefing: The outbreak is geographically uneven. Leaders must choose between aggressive local containment, broader mitigation,
    and long-term adaptation while the biological parameters remain uncertain.
  stake: An inflexible choice can either impose unnecessary costs or allow the health system to collapse.
  takeaway: Use population growth, feedback, capacity thresholds, model assumptions, scenario analysis, tradeoffs as an evidence
    chain rather than as isolated facts.
  stops:
  - group: POP
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly
      placed cards after each check.
    title: Build a decision model
    place: Population Modeling Group
    scene: >-
      Three districts are on visibly different trajectories and the council wants one city-wide policy by
      Friday. The team has nine days of case data, a dozen parameters they can only bound rather than measure,
      and no agreement yet about which decision the model is supposed to inform.
    takeaway: Models are structured arguments whose assumptions should remain visible.
    format: SEQUENCE
    cards:
    - State the decision, time horizon, and outcomes that matter.
    - Choose a transparent model structure and estimate inputs from data.
    - Run multiple plausible scenarios and sensitivity tests.
    - Link observable triggers to pre-agreed policy changes.
    order:
    - 0
    - 1
    - 2
    - 3
    why: The model serves a decision; uncertainty is explored before policies are tied to observable triggers.
  - group: CLIN
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
    title: Hospital capacity threshold
    place: Hospital Capacity Center
    scene: A region has 120 staffed critical-care beds, 90 are already occupied, and severe cases are arriving at 8 per day
      with average stays of 6 days.
    takeaway: Simple bounds can reveal which missing data are decision-critical.
    format: BALLPARK
    question: Estimate the no-discharge upper-bound time to capacity and explain why it is only a bound.
    estimate:
      labels:
      - 30 open beds
      - 8 admissions/day
      values:
      - 30
      - 8
      slots: 2
      template: '{0} / {1}'
      formula: a/b
      correct:
      - 0
      - 1
      target: 3.75
      tolerance: 0.3
      units: days
      solution: 30/8 is about 3.75 days without discharges.
      prompt: A region has 120 staffed critical-care beds, 90 are already occupied, and severe cases are arriving at 8 per
        day with average stays of 6 days.
      question: Estimate the no-discharge upper-bound time to capacity and explain why it is only a bound.
  - group: POP
    task: Allocate 100 research or response credits across the four proposals. The interface may allow a short written criterion
      before submission.
    title: Choose an adaptive policy
    place: City Command
    scene: Allocate 100 policy credits across a trigger-based plan.
    takeaway: Good policy is a feedback system, not a one-time guess.
    format: SCIENCETANK
    proposals:
    - label: A
      text: Targeted containment where transmission chains are traceable.
    - label: B
      text: Citywide measures tied to hospital and growth thresholds.
    - label: C
      text: Capacity expansion and protection of vulnerable populations.
    - label: D
      text: Commit permanently to one policy regardless of new evidence.
    recommended:
      A: 30
      B: 30
      C: 35
      D: 5
    evidence: Allocate 100 policy credits across a trigger-based plan.
- title: The Final Briefing
  objective: Produce a claim-by-claim evidence package with explicit residual uncertainties and durable surveillance responsibilities.
  briefing: The mayor, hospitals, and public must receive one integrated account of what happened, what remains uncertain,
    and which actions should continue.
  stake: A technically correct response can still fail if uncertainty, burdens, and continuing responsibilities are hidden
    from the people affected.
  takeaway: Use evidence synthesis, causal chains, uncertainty, ethics, communication, long-term monitoring as an evidence
    chain rather than as isolated facts.
  stops:
  - group: POP
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: Disposition the final claims
    place: Scientific Review Hall
    scene: Match each evidence state to the appropriate recommendation.
    takeaway: Scientific conclusions should carry the strength and limits of their supporting evidence.
    format: PROTOCOL
    scenarios:
    - Multiple independent data streams support the transmission route.
    - A severe-risk subgroup is suggested by one small observational sample.
    - An intervention lowers hospitalization with monitored safety but long-term duration is unknown.
    - An animal reservoir remains plausible but unconfirmed.
    choices:
    - Treat as established enough for operational planning while continuing surveillance.
    - Label as provisional and collect representative confirmatory data.
    - Use conditionally with follow-up and duration studies.
    - Avoid destructive ecological action; continue targeted One Health investigation.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: Integrated review distinguishes established findings, conditional findings, and unresolved hypotheses.
  - group: POP
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly
      placed cards after each check.
    title: Build the public explanation
    place: City Command
    scene: >-
      The mayor is on air in an hour. The transmission route is settled across three independent data streams,
      the animal reservoir is still unconfirmed, and the treatment works under conditions nobody has tested
      beyond eight weeks. The draft in front of you opens with the actions and never reaches what is still
      unknown.
    takeaway: Uncertainty is not a failure of science when it is bounded and connected to a plan for learning.
    format: SEQUENCE
    cards:
    - State what is known and how it was learned.
    - State what remains uncertain and why.
    - Explain current actions, benefits, burdens, and decision triggers.
    - Describe how evidence and policy will be updated.
    order:
    - 0
    - 1
    - 2
    - 3
    why: Trustworthy communication joins evidence, uncertainty, action, and revision.
  - group: POP
    task: Allocate 100 research or response credits across the four proposals. The interface may allow a short written criterion
      before submission.
    title: Fund the post-crisis legacy
    place: Public Briefing Room
    scene: >-
      The emergency budget closes at the end of the month and anything uncommitted returns to the state. Four
      proposals are on the table for what outlives the outbreak, and one of them is a request to delete the
      response records before they can be used against the city.
    takeaway: The final responsibility is to convert crisis knowledge into durable public capability.
    format: SCIENCETANK
    proposals:
    - label: A
      text: Maintain integrated clinical, environmental, and genomic surveillance.
    - label: B
      text: Invest in health-system resilience and workforce training.
    - label: C
      text: Preserve transparent data, methods, and after-action lessons.
    - label: D
      text: Erase records to avoid future criticism.
    recommended:
      A: 35
      B: 30
      C: 35
      D: 0
    evidence: Allocate 100 long-term credits.

# --------------------------------------------------------------- the rooms
interiors:
  CLIN:
    caption: A patient is the only instrument that reports everything at once, and none of it precisely.
    standLine: Four admissions with the same combination of signs, and three different working diagnoses.
    station:
      kind: vitals
      title: Bedside monitor
      rows:
        - { label: Oxygen saturation, value: 88 %, status: alarm }
        - { label: Temperature, value: 39.1 C, status: high }
        - { label: Chest imaging, value: bilateral, status: alarm }
        - { label: Blood pressure, value: 118/72, status: normal }
  CELL:
    caption: What a pathogen does to a cell constrains what it can do to a person.
    standLine: Culture flasks from four patients, two of them showing something the others do not.
    station:
      kind: panel
      title: Culture bench
      rows:
        - { label: Cytopathic effect, value: 48 h, status: high }
        - { label: Receptor assay, value: pending, status: low }
        - { label: Negative control, value: clean, status: normal }
  MOL:
    caption: A test result is a claim about the sample, not about the patient.
    standLine: A positive with no negative control run beside it, and a sequencing run half finished.
    station:
      kind: panel
      title: Sequencing run
      rows:
        - { label: Cycle threshold, value: 22, status: high }
        - { label: Negative control, value: not run, status: alarm }
        - { label: Genome coverage, value: 94 %, status: normal }
  IMM:
    caption: The damage a patient shows can come from the pathogen or from the response to it.
    standLine: Inflammatory markers rising in patients whose viral load is already falling.
    station:
      kind: vitals
      title: Immunology bench
      rows:
        - { label: Inflammatory marker, value: 210 mg/L, status: alarm }
        - { label: Viral load, value: falling, status: normal }
        - { label: Antibody titre, value: day 6, status: high }
  POP:
    caption: A case count without a denominator is a number about testing, not about disease.
    standLine: Case curves from three districts, each on a different testing regime.
    station:
      kind: panel
      title: Operations board
      rows:
        - { label: Cases today, value: 61, status: alarm }
        - { label: Tests today, value: 940, status: high }
        - { label: Baseline expectation, value: 8 per week, status: normal }
  FIELD:
    caption: A reservoir claim needs the animal, the exposure and the genome to agree.
    standLine: Trapping records from the flood plain, and sequences that are close but not identical.
    station:
      kind: panel
      title: Field station
      rows:
        - { label: Species sampled, value: 3, status: high }
        - { label: Comparison sites, value: 0, status: alarm }
        - { label: Genetic distance, value: 4.1 %, status: normal }

copy:
  CLIN: <p>The clinical wing. Every hypothesis in this outbreak has to survive contact with an actual patient.</p>
  CELL: <p>Cell and membrane biology. What the pathogen does to a cell, and what that rules out.</p>
  MOL: <p>Molecular diagnostics. Two instruments, a library, and a rule about controls.</p>
  IMM: <p>Immunology and treatment. Where protection and damage are told apart.</p>
  POP: <p>Epidemiology operations. Counts, denominators, and the difference between them.</p>
  FIELD: <p>The One Health field station. The outbreak did not start in a hospital.</p>
  CMD: <p>City Health Command. Decisions are made here whether or not the evidence has arrived.</p>
  TRANSIT: <p>The transit and mobility centre. Trip counts nobody has yet matched to the case map.</p>
  BRIEF: <p>The public briefing room. What the city is told, and how much of it is hedged.</p>
  WASTE: <p>The wastewater plant. Surveillance that sees the city before the city sees a doctor.</p>

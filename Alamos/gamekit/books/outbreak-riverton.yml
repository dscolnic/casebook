theme:
  id: outbreak_riverton
  title: "Outbreak: Riverton"
  subtitle: Scientific Response Director · Riverton

# The areas of study. One column of the game each; every group needs somebody on the roster.
groups:
  - id: CLIN
    code: CLIN
    name: Clinical Physiology
    color: "#315c78"
    desc: Patient physiology, organ systems, and bedside evidence.
    defaultLeader: ortiz
    milestones:
      - Observe the patient
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: CELL
    code: CELL
    name: Cell & Membrane Biology
    color: "#4b775f"
    desc: Cells, membranes, receptors, transport, and host interactions.
    defaultLeader: chen
    milestones:
      - Build the cell model
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: MOL
    code: MOL
    name: Molecular Diagnostics
    color: "#704f88"
    desc: DNA, RNA, gene expression, sequencing, and diagnostic controls.
    defaultLeader: patel
    milestones:
      - Validate the molecular evidence
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: IMM
    code: IMM
    name: Immunology & Treatment
    color: "#9a3f36"
    desc: Immune mechanisms, treatment response, and intervention evidence.
    defaultLeader: okafor
    milestones:
      - Separate response from damage
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: POP
    code: POP
    name: Epidemiology & Evolution
    color: "#9a741d"
    desc: Population patterns, surveillance, trials, and evolutionary change.
    defaultLeader: morales
    milestones:
      - Connect cases to populations
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: FIELD
    code: FIELD
    name: Ecology & One Health
    color: "#3d6f52"
    desc: Environmental surveillance, animal reservoirs, and ecosystem connections.
    defaultLeader: singh
    milestones:
      - Connect hosts and environment
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off

# The cast. `division` is what makes a person a valid person stop.
roster:
  - id: ortiz
    name: Dr. Lena Ortiz
    role: Clinical Physiology Lead
    division: CLIN
    quiz:
      - q: Why does Ortiz read vital signs as a delivery chain rather than as separate numbers?
        a: Oxygen reaching tissue depends on every link, so one normal reading does not clear the chain
        wrong:
          - Vital signs all come off one monitor, so they share whatever error it has
          - Only the chain as a whole is recorded in the notes
          - Individual readings are too imprecise to interpret
    bio: Connects vital signs and laboratory measurements to the physical chain that delivers oxygen, water, nutrients, and heat through the body.
  - id: chen
    name: Dr. Maya Chen
    role: Cell Biology Lead
    division: CELL
    quiz:
      - q: Why can one agent damage one tissue and leave another alone?
        a: Cells differ in the receptors and transport their membranes carry
        wrong:
          - Blood reaches some tissues a great deal faster than it reaches others
          - Larger cells absorb more of any substance
          - Damage depends only on the dose that arrives
    bio: Uses cell structure and membrane behavior to explain why the same agent can affect one tissue but not another.
  - id: patel
    name: Dr. Ravi Patel
    role: Molecular Diagnostics Lead
    division: MOL
    quiz:
      - q: What does Patel mean by treating a molecular signal as a claim?
        a: It has to survive its controls, a second method and a known provenance before it means anything
        wrong:
          - Every result has to be published in some form before anybody may act on it
          - A signal is only valid if the same laboratory repeats it
          - Molecular methods are less reliable than culture
    bio: Treats every molecular signal as a claim that must survive controls, independent methods, and provenance checks.
  - id: okafor
    name: Dr. Nia Okafor
    role: Immunology Lead
    division: IMM
    quiz:
      - q: Why does Okafor separate protective immune activity from damage?
        a: The treatment that helps one is the treatment that makes the other worse
        wrong:
          - Only the damaging kind of inflammation shows up in a blood sample
          - Protective responses always resolve without treatment
          - The distinction decides which ward a patient goes to
    bio: Separates protective immune activity from tissue-damaging inflammation and asks what evidence changes an intervention decision.
  - id: morales
    name: Dr. Sofia Morales
    role: Epidemiology Lead
    division: POP
    quiz:
      - q: What is Morales's comparison group actually for?
        a: Without it a change in the numbers cannot be told from a change in who was tested
        wrong:
          - It doubles the size of the sample and narrows the confidence interval
          - It is required before any result can be published
          - It identifies which hospital reported first
    bio: Builds comparisons that distinguish real population change from sampling, bias, and coincidence.
  - id: singh
    name: Dr. Arjun Singh
    role: One Health Lead
    division: FIELD
    quiz:
      - q: Why does Singh refuse to call an animal finding a transmission route?
        a: The animal may have caught it from people, and prevalence and exposure are what separate the two
        wrong:
          - Animal samples cannot be sequenced to the same depth as human ones
          - Transmission routes can only be confirmed experimentally
          - Wildlife sampling is never representative
    bio: Connects human cases to animals, water, and ecosystems without assuming that correlation proves a transmission route.
  - id: nakamura
    name: Rin Nakamura
    role: Critical Care Physician
    division: CLIN
    bio: |-
      Runs the intensive care unit, where the outbreak stops being a case count and
      becomes four people whose oxygen is falling for reasons nobody has settled.

      She reads a patient as a set of coupled systems. A falling oxygen saturation
      can come from the lung, the blood that carries the oxygen or the circulation
      that moves it, and the treatment for each of those is different.

      Her limit is that the sickest patients are the least representative. What is
      happening in her unit is real and it is also the tail of the distribution.
    quiz:
      - q: Why does Nakamura warn against describing the disease from her unit alone?
        a: The sickest patients are the tail of the distribution, not a sample of it
        wrong:
          - Intensive care records are less accurate than ward records
          - Severe cases are treated before they can be measured
          - Her unit only admits patients with confirmed tests
  - id: adeyemi
    name: Funke Adeyemi
    role: Cell Biologist
    division: CELL
    bio: |-
      Works out which cells the pathogen can enter and what it does once inside,
      because that constrains everything downstream — which tissues are damaged,
      which drugs could plausibly work, and which route of transmission is possible.

      She runs a negative control on every plate as a matter of habit. A culture
      that shows an effect without a control showing nothing is a result about the
      laboratory as much as about the pathogen.
    quiz:
      - q: Why does Adeyemi run a negative control on every plate?
        a: Without it, an effect of the laboratory looks like an effect of the pathogen
        wrong:
          - Controls make the cultures grow at a reproducible rate
          - A control is what converts a qualitative result into a quantitative one
          - Controls are required only when the sample is from a patient
  - id: bergstrom
    name: Lena Bergström
    role: Genomic Epidemiologist
    division: MOL
    bio: |-
      Reads sequences for what they say about transmission — who infected whom,
      how long the chain has been running, and whether two clusters are one
      outbreak or two.

      Genetic distance is her main tool and her main trap. Two sequences being
      close is evidence of a recent common ancestor, not evidence that one patient
      infected the other, and the difference matters for every control decision.
    quiz:
      - q: What does Bergström say two nearly identical sequences establish?
        a: A recent common ancestor, which is not the same as one patient infecting the other
        wrong:
          - The direction of transmission between the two patients
          - That both patients were infected on the same day
          - That the pathogen is not mutating
  - id: haddad
    name: Yusuf Haddad
    role: Clinical Immunologist
    division: IMM
    bio: |-
      Separates the damage a pathogen does from the damage the immune response does
      while clearing it, which sounds academic until a treatment has to be chosen.

      Suppressing inflammation helps a patient whose injury is immune-driven and
      harms one who is still fighting the infection. The same drug, the same dose,
      opposite outcomes, decided by where the patient is in their course.
    quiz:
      - q: Why can the same anti-inflammatory treatment help one patient and harm another?
        a: It depends whether the damage is immune-driven or the infection is still winning
        wrong:
          - Doses are calculated from body weight, so they vary between patients on the ward
          - Some patients absorb the drug and others do not
          - The drug expires quickly once a vial is opened
  - id: oduya
    name: Grace Oduya
    role: Field Epidemiologist
    division: POP
    bio: |-
      Builds the case definition, which decides what counts as a case and therefore
      what every curve in the response is a curve of.

      A definition too narrow misses the spread and one too wide fills the count
      with other illnesses. She changes it when she has to and records the change,
      because a curve that bends on the day the definition moved is not evidence
      about the disease.
    quiz:
      - q: Why does Oduya document every change to the case definition?
        a: A bend on the day the definition changed is an artefact
        wrong:
          - Definitions must be approved by the hospitals before use
          - Changing a definition invalidates every laboratory result taken before it
          - The definition determines which treatment a patient receives
  - id: castellanos
    name: Mateo Castellanos
    role: Wildlife Veterinarian
    division: FIELD
    bio: |-
      Samples the animals people live alongside, which is where most new human
      pathogens were living before they were human pathogens.

      Finding the organism in a species proves that species can carry it. Showing
      it is a reservoir needs prevalence, the exposure pattern of the human cases,
      and comparison sites where the illness never appeared — otherwise a bystander
      that caught it from people gets blamed and culled.
    quiz:
      - q: Why is finding the pathogen in an animal not enough to declare a reservoir?
        a: The animal may have caught it from people, and prevalence separates the two
        wrong:
          - Field samples are always contaminated by human handling
          - A reservoir must contain a higher viral load than any patient
          - The organism has to be found in more than one individual animal at the site

# Terms the game may explain in place.
glossary:
  - name: Epidemiology
    aliases:
      - epidemiology
      - epidemiologist
      - epidemiological
    def: The study of how health events are spread through a population, and what makes them spread that way.
  - name: Antibody
    aliases:
      - antibody
      - antibodies
    def: A protein the immune system makes that binds one specific target.
  - name: Catalysis
    aliases:
      - catalysing
      - catalyzing
      - catalyse
      - catalyze
    def: Speeding a reaction by offering an easier path, without being used up. Enzymes are the biological version.
  - name: Codon
    aliases:
      - codon
      - codons
    def: Three letters of genetic code, which together name one amino acid. Change one and the protein may change by one unit.
  - name: Control
    aliases:
      - control
    def: A comparison designed to reveal whether a signal could arise without the proposed cause.
  - name: Diffusion
    aliases:
      - diffusion
      - diffuses
    def: Movement from where there is more to where there is less, with no energy spent. It is why a small molecule crosses a membrane on its own.
  - name: Genomic sequencing
    aliases:
      - genomic
      - genome
      - genomes
    def: Reading the agent’s genetic code, which shows how closely two cases are related.
  - name: Homeostasis
    aliases:
      - homeostasis
    def: The regulation that keeps internal conditions within workable ranges.
  - name: Incidence
    aliases:
      - incidence
    def: How many new cases appear per unit of time. It is the rate; prevalence is the stock.
  - name: Neutralising antibody
    aliases:
      - neutralizing
      - neutralising
    def: An antibody that blocks the agent from entering a cell, rather than merely marking it.
  - name: Pathogen
    aliases:
      - pathogen
      - pathogens
    def: An agent that causes disease — a virus, a bacterium, a parasite.
  - name: Prevalence
    aliases:
      - prevalence
    def: How many people have the illness right now. Long illnesses keep it high after new cases fall.
  - name: Reagent
    aliases:
      - reagent
      - reagents
    def: A chemical added to make a test work, as opposed to the sample being tested.
  - name: Reservoir
    aliases:
      - reservoir
    def: A host population or environment in which an infectious agent can persist.
  - name: Ribosome
    aliases:
      - ribosome
      - ribosomes
    def: The machine in a cell that reads RNA and assembles the protein it specifies.
  - name: RNA
    aliases:
      - RNA
    def: The working copy of a gene, read to make a protein. Many viruses carry their whole genome as RNA.
  - name: Saturation
    aliases:
      - saturation
      - saturated
    def: The point at which adding more changes nothing, because every place it could go is taken.
  - name: Selection
    aliases:
      - selection
    def: A process in which variants differ in reproductive success, changing frequencies over generations.
  - name: Sensitivity
    aliases:
      - sensitivity
    def: The fraction of true cases a test detects.
  - name: Solute
    aliases:
      - solute
      - solutes
    def: The substance dissolved in a liquid, as opposed to the liquid doing the dissolving.
  - name: Specificity
    aliases:
      - specificity
    def: The fraction of unaffected cases a test correctly leaves negative.
  - name: Vector
    aliases:
      - vector
      - vectors
    def: An organism that carries an agent between hosts — a mosquito, a tick — without being where the agent lives.

# The campaign: one working day each, three stops and a callback from day 3.
missions:
  - title: The First Cluster
    objective: Open an investigation using a defensible provisional case definition and an explicit comparison baseline.
    briefing: Three Riverton hospitals report an unusual combination of fever, dry cough, severe headache, and profound fatigue. The player must decide whether the pattern is a true outbreak signal before scarce emergency resources are committed.
    stake: Day one. Seven patients, three hospitals, four days, and the same four symptoms in every one of them. The epidemiology lead, Sofia Morales, has the surveillance printout and a reporter downstairs already has the number. This stage you decide whether this is an outbreak at all, agree what counts as a case, and spend the first of the response money. Seven sounds like a lot, and Morales will not say whether it is until she knows what a normal week in this city looks like. Call it nothing and you lose the weeks when an outbreak is still small enough to stop.
    takeaway: Use baseline variation, case definition, controls, correlation versus coincidence, measurement bias as an evidence chain rather than as isolated facts.
    stops:
      - group: POP
        task: Is this a signal, and what on the desk decides it?
        title: Signal or noise?
        place: Emergency Department Network
        scene: Seven patients across three hospitals, four days, and the same four symptoms. Dr. Sofia Morales, the epidemiology lead, has the surveillance printout, reporting routes and catchment figures on the desk. The press office has asked twice whether it should say anything.
        assumes:
          - a rate is a count measured against a population and a length of time
          - surveillance only sees the patients who reached it
          - epidemiology is the study of how health events are distributed in populations and what factors shape them
        takeaway: A count becomes a signal only when something says what was expected instead.
        format: DIAGNOSIS
        question: Is this a signal, and what on the desk decides it?
        why: "A count is not a signal. What makes it one is a comparison against something written down beforehand, and the baseline here is about two a year — so seven in four days is a departure of a couple of hundredfold, not a busy week. The reading that matters most is the quiet one: two of the seven were found on manual chart review, outside the alert rule. Had every case arrived through that one rule, the cluster could have belonged to the rule. Two found another way is what makes it real."
        headline: Seven cases in four days, against a syndrome the city logs about twice a year.
        readings:
          - zone: Count
            label: Cases meeting the syndrome
            value: 7 in four days
            status: alarm
          - zone: Baseline
            label: Same syndrome
            value: about 2 a year
            status: key
          - zone: Reporting
            label: How the cases were found
            value: 5 by one alert rule
            status: key
          - zone: Denominator
            label: Catchment population
            value: supplied by all three hospitals
            status: normal
          - zone: Season
            label: Other respiratory syndromes this week
            value: flat
            status: normal
          - zone: Geography
            label: Shared address
            value: none found
            status: normal
        choices:
          - label: A real departure from the baseline
            mechanism: Seven in four days against two a year is far outside what the system usually does.
          - label: An artifact of the shared alert rule
            mechanism: Every case was found the same way
          - label: Ordinary autumn respiratory illness
            mechanism: This syndrome is common in autumn and the count is within normal seasonal movement.
          - label: Impossible to say — there is no denominator
            mechanism: Seven is a numerator
        answer: A real departure from the baseline
        rebuttals:
          - The alert rule is the right worry, and it is the one this panel rules out. Five cases came through it and two did not, so the pattern survives being looked for a second way.
          - Autumn respiratory illness would lift the other syndromes with it. The panel shows those flat, so whatever this is, it is not the season.
          - The denominator is on the desk — all three hospitals supplied their catchment. That objection is the correct instinct and it has already been answered.
      - group: POP
        task: Order the build so each step can be checked before the next one depends on it.
        title: Build the provisional case definition
        place: Epidemiology Operations Room
        scene: Three hospitals begin counting at 6 a.m., and each has drafted a different case definition. Those first tallies will shape the city’s outbreak curve. Dr. Lena Ortiz wants one definition on every desk before the night shift leaves.
        assumes:
          - a curve is only meaningful if every hospital counted the same thing
          - a test can be wrong by missing cases or by counting the wrong ones
        takeaway: Operational definitions convert vague concern into reproducible observation.
        format: SEQUENCE
        why: A case definition is an instrument, and like any instrument it is wrong in a known direction. Too narrow and the spread is invisible; too wide and the count fills with the ordinary respiratory illness of a city in autumn. That is why it is tested twice before it is issued — against patients already known to be cases, which catches a definition that is too narrow, and against obvious non-cases, which catches one that is too wide. A definition nobody tested is a curve nobody can interpret.
        rebuttals:
          - Records first, because the shared features have to come out of the patients rather than out of the drafting. Specifying symptoms before reading the notes is writing down what you expected to find.
          - Symptoms, timing and geography next, because those three are what a clinician at four in the morning actually applies. A definition that cannot be applied at speed is not an operational definition.
          - Testing before publication, not after. Known cases catch a definition that is too narrow; obvious non-cases catch one that is too wide. Skip this and the first curve is uninterpretable in a direction nobody can name.
          - The revision date goes out with the definition. Without it, three hospitals keep counting to a definition everybody knows is provisional and nobody is authorised to change.
        cards:
          - Specify observable symptoms, timing, and location.
          - Read the notes of the patients already admitted, for features they share.
          - Test the definition on known cases and obvious non-cases.
          - Attach a revision date and the known uncertainty to the definition the hospitals apply.
        order: [1, 0, 2, 3]
      - group: POP
        task: Spend the single response slot on the evidence that makes tomorrow’s citywide case data interpretable.
        title: Spend the first response reserve
        place: Clinical Data Office
        scene: Dr. Sofia Morales, the epidemiology lead, has one response slot she can start this afternoon. Four proposals are ready, and tomorrow’s hospital reports will arrive before any second project can begin.
        assumes:
          - three hospitals can only be combined if they count cases the same way
          - an independent signal can be valuable without defining an individual case
        takeaway: The best first measurement is the one that makes later evidence comparable and decision-ready.
        format: VALUE
        question: Which first purchase changes what the response team can reliably conclude tomorrow?
        value:
          hint: You can start one project before tomorrow’s hospital reports arrive. Open each card to see what new conclusion it would make possible, then spend the slot.
          budget:
            amount: 1
            unit: response start
            label: Projects that can begin this afternoon
          decision: Choose the first action that makes tomorrow's citywide outbreak picture interpretable.
          options:
            - id: line_list
              label: Standardised line list across all three hospitals
              cost: 1
              axis: measurement standardization
              decisive: true
              reveals: Whether all three hospitals are counting the same observable case definition with dates and catchment denominators.
            - id: director_interviews
              label: Interview every hospital director
              cost: 1
              axis: expert opinion
              decisive: false
              reveals: Clinicians' impressions of how unusual the week feels, without a common denominator or case definition.
            - id: wastewater
              label: Start wastewater sampling in affected and comparison areas
              cost: 1
              axis: independent population surveillance
              decisive: false
              reveals: A community-level signal that does not depend on care seeking, but cannot define or identify clinical cases.
            - id: warning
              label: Issue a citywide warning now
              cost: 1
              axis: public communication
              decisive: false
              reveals: No new physical evidence; it commits public credibility before the transmission picture is established.
        answerText: Start the standardised line list. Tomorrow’s hospital counts can only become one interpretable curve if they use the same case definition, dates and denominators. Wastewater is a valuable independent stream, but it cannot repair incompatible clinical counting after the fact.
        why: Three hospitals are about to produce three curves. Those curves can be combined only if the same operational definition created them. A standard line list preserves dates, symptoms and denominators in one comparable structure. Wastewater adds an independent population signal, but it cannot define a patient case. Expert impressions have no common denominator, and a warning adds no evidence. The first scarce action should make tomorrow’s observations comparable; the independent streams become more useful once there is a clinical baseline to compare with.
  - title: What Kind of Agent?
    objective: Classify the broad agent category and identify the next discriminating test.
    briefing: Initial samples contain biological material, but the microscope and the routine tests disagree. The team must distinguish a cellular pathogen from a virus or a noninfectious cause without relying on one ambiguous image.
    stake: "Day two. Pathology has four results from the same specimens and will not put a name to any of it. The microscope images are the most convincing thing anybody has seen all week, which is exactly why the cell biology lead, Maya Chen, does not trust them yet, and her diagnostics counterpart Ravi Patel wants to commit the diagnostics bench tonight. This stage you decide what broad kind of thing this is and buy the one piece of evidence that would settle it. Everything downstream is chosen off this call: what to grow it in, which drugs are worth considering, what tomorrow's test looks for."
    takeaway: Use cell structure, viruses versus cells, prokaryotes and eukaryotes, staining, independent evidence as an evidence chain rather than as isolated facts.
    stops:
      - group: CLIN
        task: Which explanation fits every reading, including the quiet negative controls?
        title: What kind of agent fits the whole panel?
        place: Hospital Pathology Suite
        scene: Pathology has four results from the same positive specimens and still cannot name the agent class. The samples are waiting under the hood. Dr. Lena Ortiz needs a defensible broad classification before the diagnostic team commits its overnight run.
        assumes:
          - cells and viruses differ in whether they can copy themselves alone
          - a negative control is a result, not an absence of one
        takeaway: Agent classification should combine cellular structure, host dependence, molecular evidence, and controls rather than rely on one striking image.
        format: DIAGNOSIS
        why: The negative cellular tests do most of the classification work. No cellular forms are seen, the bacterial marker is absent, and the fungal-wall assay is negative. The signal rises only with living host cells, which supports an agent that depends on host machinery. A clean extraction blank makes laboratory carryover less likely. Together these observations support a virus-like class. They do not establish whether the genome is RNA or DNA, and they do not identify the exact agent.
        rebuttals:
          - A bacterium is a cell and would leave cellular evidence — a marker, a wall, something under the microscope. Three separate looks for that came back empty.
          - A fungus would show cell-wall material on the stain built to find it. That stain is negative, and it is a stain that rarely misses.
          - Contamination is the right suspicion whenever a signal appears from nowhere, and it is checked by the blank. This blank is clean, so the signal came in with the specimens.
        headline: Pathology has several clues from the same positive specimens.
        readings:
          - zone: Microscope
            label: Microscope
            value: No intact cellular forms seen
            status: normal
            note: Several fields examined; image quality is good
          - zone: Host-cell dependence
            label: Host-cell dependence
            value: Signal rises only when living host cells are present
            status: alarm
            note: Acellular control shows no increase
          - zone: Bacterial marker
            label: Bacterial marker
            value: Not detected
            status: normal
            note: Control bacterial sample is detected normally
          - zone: Fungal cell-wall stain
            label: Fungal cell-wall stain
            value: Negative
            status: normal
            note: Positive stain control is normal
          - zone: Extraction blank
            label: Extraction blank
            value: Negative
            status: normal
            note: No target signal in the blank
        choices:
          - label: A virus-like agent
            mechanism: Not a cell of its own, and it can only copy itself inside a living host cell.
          - label: A bacterium of some kind
            mechanism: A cellular organism, which would leave bacterial markers and structures behind.
          - label: A fungus of some kind
            mechanism: A cellular organism with a cell wall the stain is built to find.
          - label: Laboratory contamination
            mechanism: Target material loose in the workflow rather than anything in the patients.
        answer: A virus-like agent
      - group: POP
        task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly placed cards after each check.
        title: From specimen to broad classification
        place: Microscopy Core
        scene: The microscope bench has patient material, healthy tissue and a negative control on the same bench, and four things it could do with them. Ortiz wants the order written down before anybody touches a specimen, because two of these consume what they measure.
        takeaway: A good classification is an evidence synthesis, not a label generated by one instrument.
        format: SEQUENCE
        rebuttals:
          - Controls first, because everything after them is a claim about the patient rather than about the tube.
          - "Structure before behaviour: whether something needs a host cell is a question about an organism, and you do not have an organism until you know it is one."
          - The replication question comes third because it is the slowest and the most specific — it is worth running only on a candidate the first two steps survived.
          - Integration last. A provisional classification is what the other three produce, not a step you can take on its own.
        assumes:
          - a measurement of a contaminated preparation measures the contamination
        cards:
          - Compare patient material with negative and healthy controls.
          - Characterize size, cellular structures, and nucleic-acid signature.
          - Ask whether the candidate reproduces independently or requires host cells.
          - Integrate the independent observations into a provisional classification.
        order: [0, 1, 2, 3]
        why: Each step is only interpretable if the one before it held. Comparing against controls first is what separates the agent from the specimen it arrived in — measure a structure in a contaminated preparation and you have measured the contamination, at high magnification. Size and structure then say whether this is cellular at all, and only once you know that does asking whether it copies itself alone mean anything.
      - group: MOL
        task: A reporter enzyme works after 37 °C pre-incubation and loses most activity after 55 °C. What is the strongest interpretation?
        title: When heat changes an enzyme assay
        place: Molecular Diagnostics Bench
        scene: A separate reporter-enzyme assay runs normally after a 37-degree pre-incubation and loses most activity after the same enzyme is held at 55 degrees. Substrate, buffer and reading method are unchanged.
        assumes:
          - a protein's function depends on it keeping its shape
          - a buffer is a chemical system that resists large pH changes when acid or base is added
        takeaway: A controlled comparison can show which part of an assay is sensitive to changed conditions.
        format: CHOICE
        question: What does the temperature comparison show about the catalyst?
        why: Enzyme activity depends on both molecular motion and protein structure. Modest warming can speed collisions, but enough heat can disrupt the shape that creates the active site. Here the same reporter enzyme, substrate, buffer and readout are used after two pre-incubation temperatures. The cleanest interpretation is loss of enzyme activity at the higher temperature. This is not a PCR cycling rule, and it does not show that a target nucleic acid was destroyed. The experiment is specifically about the catalyst.
        choices:
          - The higher temperature disrupted the enzyme’s functional structure.
          - Because the reaction absorbs heat, increasing temperature must always increase its rate.
          - The patient sample degraded even though this assay used the same reporter enzyme.
          - The target sequence was destroyed by 55 °C even though the target was not the variable being heated.
        answer: The higher temperature disrupted the enzyme’s functional structure.
        rebuttals:
          - Reaction rates can rise with temperature only while the catalyst remains functional. Protein stability puts a limit on that trend.
          - The variable here is the reporter enzyme’s pre-incubation temperature, not a different patient sample.
          - The assay isolates enzyme activity; it does not establish destruction of a nucleic-acid target.
  - title: The Point of Entry
    objective: Explain why one cell type is vulnerable and select the experiment that separates receptor binding from downstream replication.

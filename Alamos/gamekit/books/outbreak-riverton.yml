  - title: Design the Intervention
    objective: Select a layered intervention portfolio and identify the evidence required before deployment.
    briefing: The city needs an intervention that can be manufactured, tested, and deployed. The player must compare vaccines, targeted therapies, and nonpharmaceutical measures using evidence about mechanism and evidence about populations.
    stake: Day 78. The city wants an intervention and the room is arguing as though it can only have one. The antibody everyone favours binds the exact stretch of protein that mutated in the north, which Bergström has now said three times. This stage you choose what to fund and say what evidence is needed before any of it reaches a person. The options also arrive on different timescales — one is available on Monday, one in a year — which is the whole argument for layering them rather than picking a favourite. Back a single glamorous option and the city has one point of failure against something still changing.
    takeaway: Use antigens, immune memory, drug targets, intervention layers, efficacy versus effectiveness as an evidence chain rather than as isolated facts.
    stops:
      - group: POP
        task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used once.
        title: Choose the intervention layer
        concept: Vaccination and treatment
        place: Vaccine Design Lab
        scene: The city wants an intervention and the room is arguing as though only one can be chosen. Four proposals are on the table and each acts at a different moment in the course of an infection.
        guide: >-
          Four proposals and four moments in the course of an infection. Pair them by
          asking when each one acts: before exposure, at entry, after the agent is
          established, or between people. Different mechanisms fail in different ways,
          which is the whole argument for layers rather than for a winner.
        background:
          - >-
              Why this is a matching board and not four separate questions. Responses on
              boards like this are written to be plausible for more than one situation, so
              choosing them one at a time lets a nearly-right answer through unexamined.
              Having to place all of them forces the comparison — not "is this reasonable
              here", but "is it more right here than there".
          - >-
              How to use the one-each rule. Because the responses are a set to be
              distributed rather than a list to be sampled, every join you make constrains
              the rest. Settling the two you are confident of can leave the remaining pair
              decided by elimination. Where it does not, two responses are still competing
              for one situation, and that is exactly the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every response used once,
              three correct joins leave the fourth with only one place to go. Any error
              therefore involves at least two joins. That is worth remembering when the last
              pair looks forced: the fault is usually not in the join you are struggling
              with, but in one you made early and stopped questioning.
        assumes:
          - an infection has a before, a during and an after, and different tools act at each
        takeaway: A layered strategy is stronger when each intervention has a defined mechanism and failure mode.
        format: PROTOCOL
        why: Each class acts at a different point, which is why a layered strategy is stronger than a bigger version of any one of them. Blocking entry acts before or during establishment of infection. An anti-inflammatory acts later on host injury rather than directly on the agent. Vaccination builds immune memory before exposure and can reduce infection or severe disease, depending on the vaccine and agent. Ventilation, isolation and contact reduction work at the population level. Different mechanisms create different strengths, timing constraints and failure modes.
        columns:
          - What you want to do
          - How you do it
        rebuttals:
          - Preventing entry is a job for something that blocks the receptor interaction, and it has to be there before the agent is.
          - Shortening severe inflammatory disease is treatment after infection, and it is staged — given at the wrong moment it suppresses a response that is still needed.
          - Immune memory before exposure is vaccination, and its whole value is that it arrives first.
          - Ventilation, isolation and contact reduction act on transmission rather than on any patient, which is why they work whatever the agent turns out to be.

theme:
  id: deepwatch
  title: Deep Watch
  subtitle: Reasoning Under Pressure Beneath the Surface

# The areas of study. One column of the game each; every group needs somebody on the roster.
groups:
  - id: SONAR
    code: SONAR
    name: Sonar & Acoustics
    color: "#2f8f8f"
    desc: What the water carries, what the boat makes, and how to tell them apart.
    defaultLeader: rask
    format: diagnosis
    milestones:
      - Learn the displays
      - Separate signal from noise
      - Hold a track
      - Ready to report
    issues:
      - A contact was called from one display.
      - The bearing rate was never checked.
  - id: NAV
    code: NAV
    name: Navigation & Position
    color: "#3f7fb6"
    desc: Where the boat is, how old that answer is, and how wrong it is allowed to be.
    defaultLeader: sowande
    format: ballpark
    milestones:
      - Learn the plot
      - Carry the error
      - Take an independent fix
      - Ready to route
    issues:
      - The plot has no time on it.
      - Two displays agreed and nobody asked why.
  - id: DC
    code: DC
    name: Damage Control
    color: "#6a8a4a"
    desc: Water in the boat — finding it, stopping it, and knowing whether you are winning.
    defaultLeader: ferro
    format: protocol
    milestones:
      - Learn the compartments
      - Find the source
      - Stop the source
      - Ready to dewater
    issues:
      - A pump was started before the source was found.
      - The bilge level was never trended.
  - id: FIRE
    code: FIRE
    name: Fire & Electrical
    color: "#b0a03a"
    desc: Fire aboard is an electrical problem until the power is proved gone.
    defaultLeader: okonkwo
    format: protocol
    milestones:
      - Learn the switchboard
      - Isolate the fault
      - Prove it dead
      - Ready to restore
    issues:
      - An indicator lamp was trusted as proof.
      - A load was restored before the seat was cold.
  - id: ATMO
    code: ATMO
    name: Atmosphere & Life Support
    color: "#6a5fb0"
    desc: The air is a system with sources, sinks and a flow path, and people are in it.
    defaultLeader: lindqvist
    format: diagnosis
    milestones:
      - Learn the air path
      - Measure it yourself
      - Find the sink
      - Ready to recover
    issues:
      - An installed sensor was treated as a measurement.
      - A damper position was assumed.
  - id: ENG
    code: ENG
    name: Propulsion & Engineering
    color: "#b0533a"
    desc: What turns the shaft, what cools it, and what the boat gives away by running it.
    defaultLeader: haruki
    format: sequence
    milestones:
      - Learn the plant
      - Trace a dependency
      - Reduce a signature
      - Ready to answer bells
    issues:
      - A pump was secured without checking what it cooled.
      - The plant was quiet and nobody said why.

# The cast. `division` is what makes a person a valid person stop.
roster:
  - id: rask
    name: Petty Officer Nils Rask
    role: Sonar Supervisor
    division: SONAR
    bio: |-
      Runs the sonar room, which is a dark space with three displays and one
      rule: the loudest thing on the screen is almost never the thing that
      matters. He has eleven years of watches and can tell you what a fishing
      fleet sounds like at four thousand yards.

      Sound in water is not like light in air. It bends toward the colder,
      slower water, so a layer of warm surface water above a cold one makes a
      shadow zone the boat can hide in — and so can everybody else. A contact
      that vanishes has not necessarily left; it may have crossed the layer.

      His limit is that passive sonar gives him bearing and almost nothing
      else. Range and course have to be built up by watching how the bearing
      changes over time, which is why he will not give a track from one look and
      gets short with anybody who asks for one.
    quiz:
      - q: Why can a contact disappear from Rask's display without going anywhere?
        a: Sound bends toward colder water, into a shadow zone
        wrong:
          - Passive sonar stops working when a contact slows down
          - The array can only hold four contacts at a time
          - A contact that stops making noise ceases to reflect sound
      - q: What does passive sonar give Rask directly?
        a: A bearing, and almost nothing else until he watches it change
        wrong:
          - A range, from the strength of the sound
          - A course and speed, from the frequency alone
          - A depth, from the angle the sound arrives at
  - id: dunne
    name: Sonarman Kes Dunne
    role: Broadband Operator
    division: SONAR
    bio: |-
      Sits the broadband stack for six hours at a stretch, which is a job of
      listening to noise and noticing when a shape appears in it. Two years
      aboard, and better at it than people twice her time.

      The display she watches is bearing against time, and the thing she is
      looking for is a line that persists. A single bright mark is nothing —
      the sea is full of them. A faint mark in the same place minute after
      minute is a contact, because the sea has no reason to be consistent.

      She keeps a paper log of what the boat itself was doing when a trace
      appeared, because half the traces that frighten a new operator are the
      boat's own: a pump that started, a shaft that came up in turns, a hull
      popping as the depth changed.
    quiz:
      - q: What makes Dunne treat a faint mark as a real contact?
        a: It stays on the same bearing while random marks do not
        wrong:
          - It is brighter than the marks around it
          - It appears at the same time as a hull pop
          - It shows on two displays fed by the same array
  - id: sowande
    name: Lieutenant Imani Sowande
    role: Navigator
    division: NAV
    bio: |-
      Keeps the plot, and holds the only opinion on this boat that the captain
      cannot overrule with an order: how well the plot is known. Her working
      rule is that a position is a claim with an age on it, and the age is the
      part everybody forgets to ask about.

      Submerged, the boat navigates by dead reckoning — a course, a speed, and a
      clock, drawn forward from the last position that came from a measurement.
      That line is exactly as good as its assumptions, and it knows nothing
      about the water it is drawn on. A half-knot current running for four hours
      is two miles the plot will never mention.

      So she draws the uncertainty as a circle and grows it with time, and picks
      routes that survive being wrong rather than routes that are safe if she is
      right. The bottom is her favourite instrument, because a depth sounding is
      the one thing aboard that cannot be wrong for the same reason the plot is.
    quiz:
      - q: What does Sowande mean by the age of a position?
        a: How long since the position came from a measurement
        wrong:
          - How long the chart itself has been aboard
          - How long the boat has been submerged on this patrol
          - How long the plot takes to redraw at a new speed
      - q: Why does she treat a depth sounding as her best instrument?
        a: Nothing it depends on is also feeding the plot
        wrong:
          - It is more precise than any other instrument aboard
          - It gives a position directly, without a chart
          - It works at any speed, where other instruments do not
  - id: petrov
    name: Quartermaster Anya Petrov
    role: Assistant Navigator
    division: NAV
    bio: |-
      Runs the chart table and the depth sounder, and is the person who actually
      writes the time beside a fix. Nine years, four boats, and a handwriting
      that anybody can read at two in the morning, which is not a small thing.

      Her job is the arithmetic the plot depends on: set and drift, course made
      good, speed of advance. She is the one who notices that a course steered
      and a course made good have quietly diverged, because she is the one
      comparing them.

      What she guards against is the display that looks like a measurement and
      is not. The chart overlay and the electronic repeat both draw from the
      inertial navigator, so they agree perfectly and always will. Two displays
      showing one source is not confirmation, and she will say so out loud.
    quiz:
      - q: Why is Petrov unimpressed when the chart overlay and the plot repeat agree?
        a: Both come from the same inertial navigator
        wrong:
          - The overlay updates more slowly than the repeat does
          - They use different chart datums and should not be compared
          - Agreement between displays is only meaningful at periscope depth
  - id: ferro
    name: Chief Petty Officer Dario Ferro
    role: Chief of the Boat, Damage Control
    division: DC
    bio: |-
      Runs damage control, which means he runs the drills nobody enjoys and owns
      the compartments when something goes wrong in one. Twenty-two years. He
      has been in a flooded space twice and does not tell either story.

      The thing he teaches first is that water coming in through a hole under
      pressure does not care how hard you pump. Flow through a hole goes up with
      the square root of the pressure difference, and pressure goes up with
      depth, so the same hole floods faster the deeper you are. Pumping buys
      minutes; the hull fitting is what ends it.

      His second rule is that a bilge level is not a number, it is a trend. One
      reading tells you nothing. Two readings a minute apart tell you whether
      you are winning, and that is the only question a flooding casualty is
      actually asking.
    quiz:
      - q: Why does the same hole flood faster deeper?
        a: Flow rises with pressure, and pressure rises with depth
        wrong:
          - Water is denser deeper, so more of it fits through
          - The hull flexes at depth and enlarges the hole
          - Pumps lose suction at depth, which only seems like faster flooding
      - q: What is Ferro's rule about a bilge level?
        a: One reading is nothing; two a minute apart tell you
        wrong:
          - Any reading above the deck plate means abandon the compartment
          - The level matters less than the temperature of the water
          - A level that is not rising means the leak has stopped
  - id: hallam
    name: Machinist's Mate Ruth Hallam
    role: Auxiliary Division, Pumps & Patches
    division: DC
    bio: |-
      Owns the drain pump, the portable pumps and the shoring locker, and can
      put a patch on a split pipe in the dark, which she has had to prove more
      than once during drills.

      She thinks in rates rather than amounts. A pump is a number of gallons a
      minute at a stated head, and that number falls as it has to lift water
      further — so the same pump that empties a bilge on the surface struggles
      at depth against a rising level. Knowing the two rates is knowing whether
      to fight or to isolate.

      Her standing complaint is that people start pumps before they find the
      source, because starting a pump feels like doing something. It also
      empties the compartment of the evidence that would have shown where the
      water was coming in.
    quiz:
      - q: Why does Hallam object to starting a pump before finding the source?
        a: It washes away the evidence of where the water enters
        wrong:
          - Pumps cannot run while a compartment is still flooding
          - Starting a pump early floods the bilge main
          - A pump run dry will not restart later
  - id: okonkwo
    name: Chief Electrician's Mate Bede Okonkwo
    role: Electrical Division
    division: FIRE
    bio: |-
      Owns the switchboard, the breakers and every cable run on the boat, and
      has the calmest voice in an emergency of anybody aboard, which is not an
      accident — he practises it.

      His subject is that an electrical fire is not a fire problem. It has three
      legs: the fuel, which is cable insulation; the oxygen, which is the air in
      the compartment; and the ignition source, which is an energized fault that
      will keep re-lighting the fuel no matter what you spray on it. Take the
      power away and it becomes an ordinary fire. Leave it on and it is a fire
      that reflashes.

      What he refuses to accept is a lamp as proof. A switchboard indicator says
      what the switchboard believes, and a meter says what the cable is doing.
      Between those two is where people get hurt, so isolation is not isolation
      until it has been measured.
    quiz:
      - q: Why is spraying an energized electrical fire not enough?
        a: The fault keeps re-lighting the insulation
        wrong:
          - The agent cannot reach a fire behind a panel
          - Electrical fires burn hotter than the agent can absorb
          - The smoke displaces the agent before it works
      - q: What does Okonkwo mean by "isolation is not isolation until it is measured"?
        a: A lamp reports a belief, a meter reports the cable
        wrong:
          - Isolation has to be logged before it counts
          - Two people must witness a breaker being opened
          - A breaker is only isolated once the load has cooled
  - id: mbeki
    name: Electrician's Mate Sipho Mbeki
    role: Power Distribution
    division: FIRE
    bio: |-
      Traces circuits, which sounds dull until the day it is the only thing that
      matters. He keeps the dependency diagrams that say what each breaker feeds
      and, more importantly, what stops when it opens.

      Every isolation costs something downstream. Killing a bus to make a fire
      safe also kills whatever that bus was feeding — a cooling pump, a scrubber
      fan, a gyro. The decision is never whether to isolate; it is knowing what
      you are turning off at the same time and in what order to bring it back.

      Restoring is the part people rush. Loads come back in dependency order —
      cooling before the thing that needs cooling, ventilation before the space
      that needs it — and never onto a fault that has not been proved gone.
    quiz:
      - q: What does Mbeki's dependency diagram tell you that a breaker label does not?
        a: What stops working elsewhere when that breaker opens
        wrong:
          - How much current the breaker will carry before tripping
          - Which compartment the cable physically runs through
          - How long the breaker takes to reset after a trip
  - id: lindqvist
    name: Lieutenant Junior Grade Ana Lindqvist
    role: Atmosphere Control Officer
    division: ATMO
    bio: |-
      Owns the air. On a submerged boat that means the scrubbers that take
      carbon dioxide out, the generators that put oxygen in, the monitors that
      say how it is going, and the ventilation that decides which compartments
      any of it reaches.

      Her subject is a balance. People produce carbon dioxide steadily, at a
      rate that depends on how many of them are in the space and how hard they
      are working. The scrubber removes it at a rate that depends on being able
      to reach the air — which means the dampers. A compartment isolated from
      the ventilation system has no scrubber, however healthy the plant looks.

      What she insists on is the difference between a report and a measurement.
      An installed sensor is a report from a device that may itself have failed;
      a handheld reading taken in the space is a measurement. When the two
      disagree the answer is not to average them.
    quiz:
      - q: Why can a compartment's air go bad while the scrubber plant reads healthy?
        a: The scrubber only reaches compartments whose dampers are open
        wrong:
          - Scrubbers work more slowly at depth
          - Carbon dioxide is heavier than air and sinks below the sensors
          - The plant reads its own outlet, which is always the cleanest air
      - q: An installed sensor and a handheld reading disagree. What does Lindqvist do?
        a: Treats the handheld as the measurement and the sensor as a report that may have failed
        wrong:
          - Averages the two, since both are instruments
          - Believes the installed sensor, because it is calibrated more often
          - Waits for a third reading before doing anything
  - id: navarro
    name: Hospital Corpsman Elena Navarro
    role: Corpsman
    division: ATMO
    bio: |-
      The only medical person aboard, which makes her the first instrument the
      atmosphere has: people show symptoms before a monitor alarms, and she is
      the one who hears about a headache in berthing.

      She is careful about what a symptom proves. A headache and heavy breathing
      in one compartment and not another is evidence about that compartment. The
      same symptoms everywhere are evidence about the whole boat. Symptoms in
      one person and nobody else is evidence about that person, and she treats it
      that way.

      What she brings to a casualty is the consequence, stated plainly and
      without deciding the engineering: how long the crew in a space can keep
      working, who has to come out now, and what she will need if the answer
      arrives late.
    quiz:
      - q: What does Navarro conclude from symptoms in one compartment and not the others?
        a: The evidence is about that compartment, not about the whole boat
        wrong:
          - The whole boat's atmosphere is degrading and that space showed it first
          - The people in that space are more susceptible than the rest of the crew
          - The monitors in the other compartments have failed
  - id: haruki
    name: Chief Machinist's Mate Jun Haruki
    role: Engineering Watch Supervisor
    division: ENG
    bio: |-
      Runs the plant: what turns the shaft, what cools what, and what every one
      of those things gives away in noise. Eighteen years, most of them within
      earshot of a reduction gear.

      He thinks in dependency chains. A seawater pump cools a heat exchanger,
      which cools a lubricating oil system, which is what lets a bearing carry a
      shaft. Secure the pump to be quiet and you have started a clock on the
      bearing, and the clock is not on any gauge in the room.

      Noise is the other half of his job. Machinery that is loose, misaligned or
      cavitating tells the whole ocean about it, and the sonar room hears the
      boat's own faults before anybody in the engine room feels them. He and
      Rask compare notes more than either department expects.
    quiz:
      - q: What has Haruki started when he secures a cooling pump to be quiet?
        a: A clock on whatever that pump was cooling, which no gauge in the room shows
        wrong:
          - A drop in shaft speed that sonar will hear immediately
          - A loss of propulsion that must be reported before it happens
          - An automatic restart, once the temperature rises far enough
  - id: adeyemi
    name: Machinist's Mate Tunde Adeyemi
    role: Propulsion Plant Operator
    division: ENG
    bio: |-
      Stands the throttle watch, which is a job of small adjustments and long
      attention. He knows the boat's speed curve by feel and can tell you what a
      turn count costs in noise before the sonar room does.

      His concern is cavitation: below a certain depth-and-speed combination the
      propeller boils the water on its own blades, and the bubbles collapsing
      are the loudest thing a submarine can do. Deeper water suppresses it,
      because there is more pressure holding the bubbles shut. Faster brings it
      on. The two trade off against each other, and the trade is the decision.

      He is also the one who has to say no. An ordered speed that would make the
      boat audible is a report to the officer of the deck, not a throttle
      movement, and saying so is the job.
    quiz:
      - q: Why does going deeper let Adeyemi turn more shaft revolutions quietly?
        a: More pressure holds the bubbles shut, so the propeller cavitates less
        wrong:
          - Colder water at depth muffles the propeller
          - The hull is stiffer at depth and transmits less noise
          - Sound travels more slowly deeper, so it carries less far
  - id: vance
    name: Commander Iris Vance
    role: Commanding Officer
    division: NAV
    bio: |-
      Has the boat. Every decision in this game eventually arrives on her table
      as a choice between things that are all partly true, and she is the only
      person aboard who cannot pass it on.

      She works in a currency the departments do not: an hour spent confirming a
      contact is an hour the boat has not moved, and an hour of transit is an
      hour of exposure. What she asks for is never certainty. It is what is
      known, what is not, and which of the two is about to change.

      She is unimpressed by confidence and interested in evidence. A watch
      officer who says "probably nothing" gets asked what would have to be true
      for that to be wrong, and how expensive it would be to check.
    quiz:
      - q: What does Vance actually ask her watchstanders for?
        a: The settled facts, the open ones, and which of them moves next
        wrong:
          - A single recommendation, with the reasoning left out
          - The most cautious option available, every time
          - Certainty before the boat commits to anything
  - id: whitfield
    name: Lieutenant Commander Theo Whitfield
    role: Executive Officer
    division: DC
    bio: |-
      Runs the watch bill, the drills and the boat's time, which makes him the
      person who decides what the crew is doing while a casualty is being
      fought — and therefore what is not being watched.

      His subject is delegation. There are more jobs than people in any real
      casualty, and the mistake is not choosing wrong, it is choosing everything:
      a boat where the whole crew is fighting a fire has nobody on sonar and
      nobody on the plot, and it will hit something while it is winning.

      He keeps the casualty log, which is the record of what was known when. It
      is dull until the debrief, when it is the only thing that can tell the
      difference between a bad decision and a decision that was right with the
      information on the table.
    quiz:
      - q: What is Whitfield's objection to putting the whole crew on the casualty?
        a: Nobody is left on sonar or the plot, and the boat can hit something while winning
        wrong:
          - A large team gets in each other's way in a small compartment
          - The relief watch will be too tired to take over
          - Damage control equipment is only issued to one team at a time

# Terms the game may explain in place.
glossary:
  - name: Bearing
    aliases:
      - bearing
      - bearings
    def: The direction to something, measured as an angle. Passive sonar gives you this and little else.
  - name: Bearing rate
    aliases:
      - bearing rate
    def: How fast a contact's bearing is changing. Near zero on a closing contact is the dangerous case.
  - name: Bilge
    aliases:
      - bilge
      - bilges
    def: The lowest part of a compartment, where water collects. Its level over time is the flooding rate.
  - name: Broadband
    aliases:
      - broadband
    def: Listening across all frequencies at once. Shows a contact as a smear that persists in bearing.
  - name: Carbon dioxide
    aliases:
      - CO2
      - carbon dioxide
    def: The gas the crew breathes out. It has to be removed continuously, because in a sealed boat it only accumulates.
  - name: Cavitation
    aliases:
      - cavitation
      - cavitate
      - cavitating
    def: Bubbles forming and collapsing on a propeller blade. The loudest ordinary thing a submarine does.
  - name: Damper
    aliases:
      - damper
      - dampers
    def: A valve in a ventilation duct. Its position decides which compartments share air with the plant.
  - name: Dead reckoning
    aliases:
      - dead reckoning
    def: Advancing a position from course, speed and time. It knows what the boat did and nothing about the water.
  - name: Dependency
    aliases:
      - dependency
      - dependencies
    def: What stops working when you secure or isolate something else. The reason isolation is never free.
  - name: Direct current
    aliases:
      - DC
      - dc
    def: "The kind of electrical supply a submarine runs on from its batteries: one steady direction, unlike the alternating supply ashore."
  - name: Fix
    aliases:
      - fix
      - a fix
    def: A position from a measurement rather than a calculation. Everything after it is dead reckoning again.
  - name: Narrowband
    aliases:
      - narrowband
    def: Listening at one frequency. Machinery makes lines here, and a line can identify what is making it.
  - name: Reflash
    aliases:
      - reflash
    def: A fire re-igniting after it looked out, because the ignition source was never removed.
  - name: Scrubber
    aliases:
      - scrubber
      - scrubbers
      - co2 scrubber
    def: The plant that removes carbon dioxide from the boat's air. It reaches only where the dampers let it.
  - name: Set and drift
    aliases:
      - set and drift
      - set
      - drift
    def: The direction and speed the water is carrying the boat. Invisible to dead reckoning until measured.
  - name: Signature
    aliases:
      - signature
      - acoustic signature
    def: The sound a boat makes that identifies it. Every machine running adds to it.
  - name: The layer
    aliases:
      - the layer
      - thermocline
    def: The boundary between warm surface water and cold water below. Sound bends at it, making shadow zones.
  - name: Transducer
    aliases:
      - transducer
      - transducers
    def: The element that turns sound in the water into a voltage, or a voltage into sound. An array is many of them listening together.
  - name: Trim
    aliases:
      - trim
    def: How the boat's weight is balanced fore and aft. Water taken aboard anywhere changes it.

# What is inside each room.
interiors:
  SONAR:
    caption: The loudest thing on the display is almost never the thing that matters.
    standLine: Four sources on the broadband stack, one of them ours, and the watch has six minutes on it.
    station:
      kind: vitals
      animated: true
      wave: sine
      rate: 3
      title: Broadband stack
      status: high
      rows:
        - label: Contacts held
          value: 4
          unit: two unresolved
          status: high
        - label: Bearing rate
          value: 0.1
          unit: degrees per minute
          status: alarm
        - label: Own-ship noise
          value: 62
          unit: per cent of the display
          status: normal
  NAV:
    caption: A position is a claim with an age on it.
    standLine: Three and a half hours of dead reckoning, and a set nobody has measured.
    station:
      kind: panel
      title: Chart table
      rows:
        - label: Last trusted fix
          value: 3 h 30 m ago
          status: alarm
        - label: Uncertainty radius
          value: 1.9 nm
          status: high
        - label: Sounding vs charted
          value: 12 m shallow
          status: high
        - label: Course made good
          value: 021°
          status: normal
  DC:
    caption: Pumping buys minutes. The hull fitting is what ends it.
    standLine: Water in the forward bilge, and the level was last read four minutes ago.
    station:
      kind: panel
      title: Damage control board
      rows:
        - label: Forward bilge
          value: 31 cm, rising
          status: alarm
        - label: Drain pump
          value: running, 55 gpm
          status: high
        - label: Trim
          value: 1.4° bow down
          status: high
        - label: Source
          value: not isolated
          status: alarm
  FIRE:
    caption: An electrical fire is put out by de-energizing it, not by the agent.
    standLine: Smoke in the electrical space, and the switchboard lamp says the bus is open.
    station:
      kind: panel
      title: Switchboard
      rows:
        - label: Bus indicator
          value: OPEN
          status: normal
        - label: Meter at the cable
          value: 440 V present
          status: alarm
        - label: Compartment temperature
          value: 68 °C at the boundary
          status: high
        - label: Seat of the fire
          value: behind the panel
          status: alarm
  ATMO:
    caption: An installed sensor is a report. A handheld reading is a measurement.
    standLine: A headache in berthing, and the plant says the air is fine.
    station:
      kind: panel
      title: Atmosphere board
      rows:
        - label: Plant outlet CO₂
          value: 0.4 %
          status: normal
        - label: Berthing
          value: 2.1 %
          status: alarm
        - label: Berthing damper
          value: shut
          status: alarm
        - label: Oxygen
          value: 20.4 %
          status: normal
  ENG:
    caption: Secure a pump to be quiet and you have started a clock nobody can see.
    standLine: Turns for eight knots at ninety metres, and the sonar room is asking why they can hear us.
    station:
      kind: vitals
      animated: true
      wave: resp
      rate: 2
      title: Machinery control
      rows:
        - label: Shaft
          value: 78
          unit: turns per minute
          status: normal
        - label: Lube oil temperature
          value: 71
          unit: °C, rising
          status: high
        - label: Seawater cooling
          value: one pump
          status: alarm

# What each place says when the player reads it.
copy:
  sonar_room: <p><b>Sonar Room</b> — three displays and a dark space, because the eye recovers faster than the ear does. Everything the boat knows about the world outside the hull arrives here first.</p>
  control_room: <p><b>Control Room</b> — the plot, the planes and the periscope. The boat is driven from here, and the chart table is where a position stops being a calculation and becomes a decision.</p>
  propulsion: <p><b>Propulsion Machinery</b> — what turns the shaft, and the loudest compartment aboard. Everything in this space is a trade between speed and being heard.</p>
  electrical: <p><b>Electrical Distribution</b> — the switchboard and every cable run in the boat. A fire in here is a fire with a power supply, which is a different problem from a fire.</p>
  forward_equipment: "<p><b>Forward Equipment &amp; Handling</b> — the working space at the bow, and the reason flooding is a forward problem: the sea connections for the forward systems are here, under the deck plates.</p>"
  sonar_electronics: <p><b>Sonar-Array Electronics</b> — the cabinets that turn what the array hears into something a person can read. They need cooling water, which is why a flooding casualty forward is also a sonar casualty.</p>
  radio_room: <p><b>Radio &amp; Communications</b> — where the boat would talk to anybody, which submerged it mostly does not. Coming up to transmit is a decision about exposure, not about equipment.</p>
  berthing_mess: <p><b>Berthing, Mess &amp; Medical</b> — where the crew that is not on watch is, which makes it the compartment where atmosphere problems show up as people before they show up as numbers.</p>
  machinery_control: <p><b>Machinery Control Room</b> — the plant is run from here rather than from beside it. Every gauge in this space is a report from somewhere else in the boat.</p>
  auxiliary: <p><b>Auxiliary Machinery &amp; Bilge</b> — scrubbers, oxygen generation, the drain pump and the lowest deck in the boat. Two of the three things keeping the crew alive are in this compartment.</p>

# The campaign: one working day each, three stops and a callback from day 3.
missions:
  - title: Boat Walkdown
    objective: Learn the boat as a system of spaces, not a list of names.
    briefing: |-
      You have the watch for the first time. Before anything else happens, you have to be able to find your way around this hull in the dark, and know what is in each space and how you would get out of it.
    stake: Two hours to sailing, alongside, and the fire main isolation valve in the forward compartment is chained shut with nobody willing to say who chained it. Chief Ferro wants to walk you through the boat before you take your first watch tonight. This watch you learn the forward spaces, what the fittings on a bulkhead are for, and how to get from one end of the boat to the other without looking at anything. Ferro's rule is that a route learned as a sequence survives being interrupted. Tonight you may have to find that valve in the dark, in smoke, by feel.
    takeaway: A compartment is defined by its boundaries, what it holds, and how you leave it.
    stops:
      - group: DC
        task: Learn a compartment in the order the facts depend on each other
        title: What a walkdown is for
        place: Forward Equipment & Handling
        scene: Chief Ferro walks you into the forward space and asks you to learn it. Equipment down both sides, deck plates over a recess, a hose reel on the bulkhead, two ways out. He is not telling you what to take in first.
        assumes:
          - a submarine is divided into compartments that can be sealed off
        takeaway: A compartment is a pressure boundary first; everything you learn about it hangs off that.
        format: SEQUENCE
        why: "A submarine survives a casualty by being divided. The pressure boundary comes first: at ninety metres it separates a flooded compartment from a flooded boat. The ways out come next, and they have to be proved rather than assumed. Then find what could start a casualty here: sea connections, cables or stores. Last, judge whether the equipment stored here can fight those threats. A locker is only the right locker once you know what this space can do to you."
        rebuttals:
          - The boundary first. It is what makes this a space rather than part of the next one, and everything after it is about what happens inside.
          - Both ways out second, and proved to open. A hatch that has not been tried is not a way out.
          - "What could start a casualty third: sea connections, cables, stores. You cannot judge the equipment until you know the threat."
          - Whether this compartment can fight that casualty, last. It is a judgement about the first three, not a fifth fact.
        cards:
          - Find where the pressure boundary runs, because it decides whether a casualty is this compartment's or the one aft.
          - Prove both hatches out of the compartment still open, by trying them.
          - Find what in here could start a casualty — sea connections, cables, stores.
          - Judge whether the equipment stowed here can fight a fire or a flood in this space.
        order: [0, 1, 2, 3]
      - group: ENG
        task: Match each fitting to what it is there to do.
        title: Every fitting is an argument
        place: Propulsion Machinery
        scene: Chief Haruki stops beside four fittings on the same bulkhead and asks what each one is for. None carries a purpose label, only a number. He steps back from the valves and waits for you to make the distinctions.
        assumes:
          - pressure rises about one atmosphere for every ten metres of depth
        takeaway: What a fitting is for is decided by what is on the other side of it, and at what pressure.
        format: PROTOCOL
        why: A fitting makes sense only when you connect its shape to what lies beyond it. A wheel valve through the pressure hull may have the sea behind it at high pressure. A quick-connect manifold at head height can supply breathing air. A strapped locker can hold shoring and plugs. A hose reel can supply firefighting water. The point is not to memorize four silhouettes. It is to infer function from connection, location and the consequence of operating the wrong thing.
        columns:
          - What you are looking at
          - What it does
        rebuttals:
          - A wheel valve on a line through the pressure hull is the only one with the ocean on the far side. Depth sets what comes through it.
          - Quick-connect couplings at head height are breathing air — a supply for people, not for a system.
          - A strapped locker with a quick-release catch holds the shoring and plugs this compartment fights with.
          - A flat-folded hose on a reel is firefighting water, and it goes on only after the circuit has been proved dead.
        scenarios:
          - A wheel valve on a line that passes through the pressure hull.
          - A manifold at head height with quick-connect couplings.
          - A strapped steel locker with a quick-release catch.
          - A flat-folded hose on a reel, beside a small isolating valve.
        choices:
          - Opening it at ninety metres admits the sea at ten atmospheres.
          - It supplies breathing air, so a space can be entered before its atmosphere is fit to breathe.
          - It holds the shoring and plugs that let this compartment fight its own casualty.
          - It puts water on a fire, and only once the circuit has been proved dead.
        mapping: [0, 1, 2, 3]
      - group: NAV
        task: Learn the compartment route, rebuild it without labels, then recover after one door is blocked.
        title: The trip back without a waypoint
        place: Control Room
        scene: The navigator sends you from control to machinery with a sealed note. On the return trip one watertight door will be shut and the marker lights will be off. You have walked the route once, with labels still visible.
        assumes:
          - a submarine is divided into named compartments
          - a route can be remembered as a sequence of places
        takeaway: A route remembered as places can be recovered after an interruption; a count or turn list usually cannot.
        format: ROUTE
        question: Run the route from memory. After the blocked door, use the next landmark to work out where the detour has put you.
        route:
          hint: Learn the labelled route first. On the second run the labels disappear. When the berthing door is blocked, identify the compartment where the detour ends and continue from that point in the sequence.
          start: control
          goal: machinery_control
          stops:
            - id: control
              label: Control
              landmark: two helm wheels
            - id: radio
              label: Radio
              landmark: red message safe
            - id: mess
              label: Crew Mess
              landmark: fold-down tables
            - id: berthing
              label: Berthing
              landmark: blue bunk curtains
            - id: aux
              label: Auxiliary Machinery
              landmark: yellow air flask
            - id: engine
              label: Engine Room
              landmark: silver shaft guard
            - id: machinery_control
              label: Machinery Control
              landmark: three analogue load meters
          order:
            - control
            - radio
            - mess
            - berthing
            - aux
            - engine
            - machinery_control
          interruptAfter: 3
          resumeAt: aux
        answerText: The recoverable route is Control, Radio, Crew Mess, Berthing, Auxiliary Machinery, Engine Room, Machinery Control. When the berthing door is blocked, the detour rejoins at Auxiliary Machinery, so you continue from there.
        why: A count only works while nothing interrupts it. A turn list fails after one extra turn. A route made of places is different because each compartment becomes a new reference point. If you are diverted, identify the space you enter. Then rejoin the sequence from there. Submarines use the same logic when dead reckoning. The useful question is not how many steps have passed. It is what trusted reference remains after the interruption.
  - title: Contact in the Noise
    objective: Work out what is out there before the boat commits to anything.
    briefing: |-
      Sonar has four sources on the display at once. Two of them have been there since before the boat slowed, one came with the turn, and one comes and goes. The captain wants to know which of them she has to care about.
    stake: "Second day out, forenoon watch. Four traces on the broadband display, and the sonar supervisor, Nils Rask, has been arguing with his own operator about the fourth for eleven minutes: it holds almost the same bearing and it is getting louder. The captain, Commander Iris Vance, wants a classification before the boat commits to the track she has been ordered onto. This watch you sort out what is out there and say what a steady bearing means. Sound is all you have. And a bearing that does not change is not a quiet situation — it is the signature of two ships on converging courses."
    takeaway: A bearing is a measurement; a track is an argument built from several of them.
    stops:
      - group: SONAR
        task: Match each trace to what is making it.
        title: Four traces, one of them ours
        place: Sonar Room
        scene: Four traces sit on the broadband display while the watch calls them out. The boat slowed four minutes ago, and one trace changed with it. The others kept their own patterns. Rask wants each source identified before the next sweep rolls across.
        assumes:
          - passive sonar listens and does not transmit
        takeaway: A source that changes when the boat changes belongs to the boat.
        format: PROTOCOL
        why: Each trace has more than one clue. A sound that follows own-ship speed changes is probably generated aboard. A narrow line that drifts slowly in bearing fits steady machinery on another vessel. Short chirps that vanish quickly fit a biologic source better than a hull. A nearly steady bearing that grows louder deserves attention because its geometry is changing differently from the others. Classification comes from combining time, bearing, spectrum and response to own-ship changes, not from picking whichever trace looks strongest.
        columns:
          - What you hear
          - What it is
        rebuttals:
          - A source that follows our own throttle is ours. Nothing out in the water knows what our turn count is doing.
          - A narrow line at a fixed frequency, drifting slowly in bearing, is machinery on a ship holding a course.
          - Short chirps with no bearing rate, gone in a minute, do not behave the way a hull has to. That is life, not a contact.
          - Two lines an octave apart on a steady bearing, getting louder, is something closing. Steady bearing plus rising level is the one to say out loud.
        scenarios:
          - A steady hiss whose level rises and falls with our own turn count.
          - A narrow line at a fixed frequency, drifting slowly in bearing.
          - Short chirps with no bearing rate at all, gone within a minute.
          - Two lines an octave apart, bearing barely moving, growing louder.
        choices:
          - Own-ship machinery
          - A merchant on a steady course
          - Biologic sound
          - A closing contact
        mapping: [0, 1, 2, 3]
      - group: SONAR
        task: Which explanation fits every reading, not just the loudest one?
        title: The trace that will not resolve
        place: Sonar Room
        scene: The fourth trace is faint, has held nearly the same bearing for eleven minutes, and does not appear on narrowband at all. The boat has not changed speed or depth since it appeared.
        assumes:
          - sound bends when it crosses water of a different temperature
        takeaway: Refraction can weaken a received path, but it does not selectively erase the source’s spectral content.
        format: CHOICE
        why: Broadband measures sound energy across a band. Narrowband looks for stable tonal lines. A sound-speed layer can bend a path and make an external source weak, but it does not selectively strip away machinery tones. Faintness and missing tonals are therefore separate clues. The layer can explain the weak level; the absent narrowband says no tonal line is above threshold. Eleven minutes of persistence argues against a transient artefact, and nothing aboard changed with the trace.
        rebuttals:
          - Nothing aboard changed when the trace appeared, so own-ship noise does not fit the timing.
          - A brief biologic is possible, but eleven minutes on nearly one bearing is poor agreement with that explanation.
          - Broadband is receiving acoustic energy. The question is what produced it, not whether the display drew a line from nothing.
          - A persistent directional trace is evidence that needs an explanation.
        headline: A faint trace has held the same bearing for eleven minutes and shows nothing on narrowband.
        readings:
          - zone: Broadband
            label: The trace
            value: faint, persistent
            status: alarm
          - zone: Narrowband
            label: Lines at that bearing
            value: none
            status: normal
          - zone: Own ship
            label: Speed and depth
            value: unchanged 11 min
            status: normal
          - zone: Own ship
            label: Machinery started
            value: none
            status: normal
          - zone: Environment
            label: Layer depth
            value: 40 m, we are below it
            status: normal
        choices:
          - label: A weak external contact
            mechanism: An external source can arrive weak after refraction while having no stable tonal line above threshold.
          - label: Our own machinery, radiating outboard
            mechanism: Something aboard would normally respond when our own machinery state changes.
          - label: A biologic, holding station
            mechanism: A transient living source is less likely to hold one bearing for eleven minutes.
          - label: An artefact of the processor
            mechanism: A processor artefact would not represent persistent acoustic energy on the broadband display.
          - label: Ordinary background, nothing more
            mechanism: Persistent energy on one bearing is not ordinary random noise.
        answer: A weak external contact
      - group: NAV
        task: Say what a steady bearing means
        title: The bearing that does not move
        place: Control Room
        scene: The contact has stayed within half a degree of the same bearing for six minutes. Its level rises on every sweep. The boat is still making eight knots, and the officer of the deck wants an answer before the channel narrows ahead.
        assumes:
          - passive sonar gives a direction and no range at all
        takeaway: A constant bearing with a rising level is a collision geometry, not a quiet one.
        format: CHOICE
        question: What does a steady bearing and a rising level tell you?
        why: "A bearing is the direction to a source, not its range. If the bearing stays nearly fixed while the sound grows stronger, the relative geometry is not opening sideways very quickly. That can happen when two tracks are converging. The important point is not that a steady bearing proves collision by itself. It is that steady bearing plus rising level removes one comforting explanation: the contact is not simply sliding safely across the bow. The watch needs range or motion information next."
        choices:
          - We are on a collision course, and the range is closing.
          - The contact is stopped, since its bearing is not changing.
          - The contact is opening, and the level is rising for another reason.
          - Nothing until a range is available.
        answer: We are on a collision course, and the range is closing.
        rebuttals:
          - A stopped contact's bearing would change as we moved past it.
          - An opening contact gets quieter, not louder.
          - Waiting for a range wastes the six minutes the geometry just gave you.
  - title: Position Without a Trusted Fix
    objective: Work out not where the boat is, but how well that is known.
    briefing: |-
      The boat has been submerged for hours on dead reckoning. The plot is a confident-looking line drawn from course and speed, and it knows nothing about the water that has been setting the boat sideways the whole time. Ahead is a bank.
    stake: Third day, middle watch, and the last trusted fix was three and a half hours ago. The navigator, Imani Sowande, has the plot built from course, speed and time, her assistant Anya Petrov has been reading the depth sounder, and the two of them do not agree. There is a current here of about half a knot that nobody has measured today. This watch you work out how far the water has carried the boat, decide which instrument to believe, and get a position that does not depend on the plot at all. Two displays taking their heading from the same gyro will agree beautifully, which is Sowande's whole worry. Sixty fathoms, and a bank half a mile off the track.
    takeaway: Precision is not accuracy, and two displays sharing a source are one measurement.
    stops:
      - group: NAV
        task: Age the position
        title: How far the water has carried us
        place: Control Room
        scene: The last trusted fix was three and a half hours ago. The forecast set for this area is about half a knot, and nobody has applied it to the plot because nobody has measured it.
        assumes:
          - the log measures speed through the water, not over the ground
        takeaway: Dead reckoning tells you where you would be if nothing pushed you.
        format: BALLPARK
        question: Estimate how far the boat could be from where the plot says it is.
        why: Between fixes, the boat carries its position forward from the last trusted point using course, speed and time. That is dead reckoning. The water moves too, and a current can carry the whole boat sideways without appearing in speed through the water. Half a knot for three and a half hours is nearly two miles of set. The error grows every hour it goes unmeasured. This is the same plot the boat will use to enter the narrows.
        estimate:
          relationship: Distance = speed × time. A knot is one nautical mile per hour.
          prompt: The set has been running about half a knot since the last trusted fix.
          question: Estimate how far the boat could be from the plotted position.
          labels:
            - 0.55 kn  (the set, forecast)
            - 3.5 h  (since the last fix)
            - 8 kn  (own speed)
            - 70 m  (depth)
            - 021°  (course made good)
          values: [0.55, 3.5, 8, 70, 21]
          slots: 2
          template: "{0} × {1}"
          formula: a*b
          correct: [0, 1]
          target: 1.925
          tolerance: 0.35
          units: nautical miles
          solution: 0.55 kn × 3.5 h ≈ 1.9 nautical miles of set nobody has drawn.
          explanation: Distance is rate times time, and the rate here is the water, not the boat. Own speed is what the plot already knows about; it is not part of the error.
      - group: NAV
        task: Decide what the agreement between the two navigation displays is actually worth.
        title: Two displays, one source
        place: Control Room
        scene: The chart overlay and electronic repeat agree to within one hundred yards. The depth sounder returns an echo after 0.120 seconds; sound speed is 1500 metres per second. The chart says 102 metres here. The last trusted position fix was 3.5 hours ago.
        assumes:
          - an echo time is a round trip
          - two displays that share one source can share one error
        takeaway: Agreement only counts as confirmation when the second measurement can fail differently.
        format: CHOICE
        question: What can you conclude from these readings before entering the banked water?
        answerText: The sounder gives 90 m, not 102 m. The two agreeing navigation displays share one source, so they are not independent confirmation. Get an independent position check before committing to the banked water.
        why: "The sounder depth is half the round-trip distance: ½ × 1500 m/s × 0.120 s = 90 m. The chart says 102 m, so something is wrong by 12 m. The two navigation displays do not settle it because both repeat the same inertial source. Their agreement is one measurement shown twice. The sounder is independent, so the disagreement is real evidence. It does not by itself prove whether the chart or position is wrong; it proves the position needs an independent check."
        rebuttals:
          - A failed depth sounder is the comfortable answer, and it needs the two agreeing displays to be right. They agree because they share one navigator.
          - An out-of-date chart moves the bottom, not the boat. It is possible, and it does not explain three and a half hours with no fix.
          - Tide and pressure move the surface by a metre or two, not twelve. The bottom is where the bottom is.
          - Twelve metres is not sounding scatter. A depth sounder that wrong would be failing in a way the sounding itself would show.
        headline: The two navigation displays agree exactly, and the bottom does not agree with either.
        readings:
          - zone: Plot
            label: Chart overlay
            value: agrees with repeat
            status: normal
          - zone: Plot
            label: Electronic repeat
            value: agrees with overlay
            status: normal
          - zone: Plot
            label: Common source
            value: inertial navigator
            status: alarm
          - zone: Sounding
            label: Depth under keel
            value: 12 m shallower than charted
            status: alarm
          - zone: Log
            label: Time since a fix
            value: 3 h 30 m
            status: high
        choices:
          - label: The plot is wrong and the sounding is right
            mechanism: Both displays repeat one degraded source, so they cannot disagree; the bottom is independent.
          - label: The depth sounder has failed and the plot is right
            mechanism: A single instrument fault, with the two agreeing displays correct.
          - label: The chart is out of date along this contour
            mechanism: The survey is old and the bottom has changed.
          - label: The boat is on the plot and the water is shallow today
            mechanism: Tide and pressure moving the surface, not the bottom.
          - label: Ordinary background, nothing more
            mechanism: Twelve metres is within ordinary sounding scatter.
        answer: The plot is wrong and the sounding is right
      - group: SONAR
        task: The contact was held on the surface layer and is now lost. Where has it gone?
        title: Where the sound will not go
        place: Sonar Shack
        scene: The sound-speed trace reads 1505 metres per second above 60 metres and 1485 below it. A contact held for forty minutes while this boat stayed at 20 metres, then vanished in one sweep while every other trace remained unchanged.
        assumes:
          - Snell’s-law angles are measured from the normal to the layer
          - a lower sound speed bends a ray toward the normal
        takeaway: Sound bends toward slower water, which leaves regions a sonar cannot hear into at all.
        format: CHOICE
        question: The contact was held on the surface layer and is now lost. Where has it gone?
        answerText: The abrupt loss is consistent with the contact moving into a shadow region created by the sound-speed structure. Snell’s law shows the ray bending toward the slower layer.
        why: At a layer, Snell’s law gives sinθ₁/v₁ = sinθ₂/v₂. For a ray at 60° from the vertical, sinθ₂ = (1485/1505)sin60°, so θ₂ is about 58.7°. The smaller angle means the ray bends more toward the vertical as it enters slower water. Across a real sound-speed profile, repeated bending can leave a region that rays from this depth do not reach. A contact entering that shadow can disappear abruptly instead of fading smoothly with range.
        choices:
          - Below the layer, where the rays from this depth do not reach.
          - Out of range, since detection falls off smoothly with distance.
          - Astern, into the boat's own baffles behind the propeller.
          - Nowhere. It has shut down and is making no noise at all.
        answer: Below the layer, where the rays from this depth do not reach.
        rebuttals:
          - Range loss is gradual. This went in a single sweep, which is a geometry change and not a range change.
          - The baffles are a bearing sector astern. The contact's bearing did not move before it was lost.
          - A contact that quiets down fades over minutes. This one was there and then was not.
  - title: Silent Passage
    objective: Cross a constrained area without losing contact awareness or making unnecessary noise.
    briefing: |-
      The route ahead narrows between the bank and a shipping lane. Command wants the boat through it with contact held throughout and as little acoustic exposure as the plant allows.
    stake: Fifth day, first watch. The narrows are four miles across, the transit takes eleven hours, and the plot's uncertainty is a circle two miles wide. The executive officer, Theo Whitfield, wants to wait for a better fix. Vance points out that waiting puts the boat in the middle of the strait at first light, which is worse than any argument about the plot — and this time she is right. This watch you decide what has to be true before the boat commits, how much margin the passage really has, and what Haruki can afford to shut down for Rask. What matters is how much water stays under the keel.
    takeaway: Quiet costs capability, and the trade has to be made deliberately rather than by default.
    stops:
      - group: SONAR
        task: Order the passage
        title: What has to be true before the boat commits
        place: Sonar Room
        scene: Rask closes the sonar-room door and lays out the passage checks. The narrows are already on the next chart panel. Once the boat commits, the channel leaves little room to turn around and recover something the watch forgot.
        assumes:
          - a measurement can be meaningless without an earlier one to read it against
        takeaway: A passage plan is ordered by what each measurement needs in order to mean anything.
        format: SEQUENCE
        why: "A passage plan is a set of conditions that have to be true at the moment the boat commits. Each card is a prerequisite for reading the next. Without the own-noise baseline a new sound is just a sound. Without the layer depth a missing narrowband line looks like an absent contact rather than a bent path. Bearing rates take time, which is why they cannot be what you start collecting at the entrance. And the lost-contact agreement is made early for a different reason: afterwards, everybody is busy."
        rebuttals:
          - The own-noise baseline first. Nothing new can be recognised as new until you know what the boat sounds like.
          - The layer depth second, because it decides which missing lines are missing for a reason.
          - Bearing rates third. They need time, and they need the baseline and the layer to be interpreted at all.
          - Agree what happens if contact is lost last — but before the entrance, while there is still contact to lose and somebody free to discuss it.
        cards:
          - Take the own-noise baseline, because nothing new can be recognised as new without it.
          - Find the layer depth, because it decides which of the missing lines are missing for a reason.
          - Hold the contacts long enough to have bearing rates, which the baseline and the layer let you interpret.
          - Agree what the boat does if contact is lost, while there is still contact to lose.
        order: [0, 1, 2, 3]
      - group: NAV
        task: Decide how close is close enough
        title: The margin that survives being wrong
        place: Control Room
        scene: The narrows fill the next chart panel. They are four nautical miles across, the plotted-position uncertainty is a circle about two miles wide, and the bank lies on the left side. The navigator asks for the surviving clearance before committing the centerline route.
        assumes:
          - a plotted position is the centre of a probability, not a fact
        takeaway: A route is chosen against the uncertainty, not against the plotted line.
        format: BALLPARK
        question: How much clear water is left if the boat runs the middle of the channel?
        why: "The circle around a plotted position is the honest width of where the boat might actually be. Route planning therefore uses the circle, not just the pencil line at its centre. The whole uncertainty has to remain inside safe water. Half the channel is two miles. Half the position uncertainty is one mile. The surviving margin is the difference: one mile. Four miles of channel sounds generous until the position uncertainty is put on the same scale."
        estimate:
          relationship: Margin = half the channel width − half the position uncertainty.
          prompt: Four miles of channel, and a position that could be a mile out either way.
          question: Estimate the clear water on the bank side if the boat runs the centre.
          labels:
            - 4 nm  (channel width)
            - 2 nm  (uncertainty diameter)
            - 8 kn  (own speed)
            - 2  (halves of the channel)
          values: [4, 2, 8, 2]
          slots: 3
          template: "{0} ÷ {2} − {1} ÷ {2}"
          formula: a/c - b/c
          correct: [0, 1, 3]
          target: 1
          tolerance: 0.2
          units: nautical miles
          solution: Half the channel is 2 nm; half the uncertainty is 1 nm; the margin is 1 nm.
          explanation: Running the centre puts two miles between the plotted position and each side, and the position could be a mile off toward either. What is left is the margin, and it is what the route has to survive on.
      - group: ENG
        task: The hull rings at one shaft speed and nowhere else. Why that one?
        title: The one shaft speed that rings
        place: Machinery Room
        scene: At 92 revolutions the after compartment rings loudly enough to hear through a bulkhead. At 85 and at 100 it does not. Nothing else about the plant changes between them.
        assumes:
          - every structure has frequencies at which it prefers to vibrate
        takeaway: A structure has natural vibration frequencies, and forcing near one of them can make a small input produce a large response.
        format: CHOICE
        question: The hull rings at one shaft speed and nowhere else. Why that one?
        why: A structure has natural vibration modes. If a repeating force lands close to one mode, each cycle adds energy in step with the motion and the vibration grows. Blade rate is shaft revolutions per second multiplied by the number of blades. One shaft speed can therefore put that forcing near a hull or mount resonance while nearby speeds do not. That is why the practical fix can be an avoided speed band or a changed mount stiffness. The water-wave relation v = fλ is not the governing equation here.
        choices:
          - At that speed the blade rate matches a natural frequency of the structure, so the response is amplified.
          - The shaft is out of balance, and imbalance grows steadily with speed.
          - The bearing is failing, and a failing bearing is loudest in the middle of its range.
          - Cavitation begins at that speed and stops above it.
        answer: At that speed the blade rate matches a natural frequency of the structure, so the response is amplified.
        rebuttals:
          - Imbalance rises smoothly with speed and would be worse at 100 than at 92.
          - A failing bearing gets worse with load and speed; it does not pick one revolution count and go quiet either side.
          - Cavitation increases with speed and does not switch off above a threshold.
  - title: Forward Flooding
    objective: Find the water, decide whether pumping can win, and stop the source.
    briefing: |-
      The forward space is taking water. The drain pump is running and the level is still rising. Somewhere under those deck plates is a hole, and the boat is at ninety metres, which is what makes it a hole worth respecting.
    stake: Sixth day, morning watch, and water is over the bilge in the forward space with the drain pump running. Ruth Hallam, on the pumps, has the level and reports it steady. Ferro does not believe steady means anything and is looking for the hole. This watch you find where the water is coming in, work out whether pumping can win, and decide what shutting that supply costs elsewhere — the two valves that stop it sit on a header that feeds other things. Pumping buys minutes. They are worth nothing unless somebody spends them finding the source.
    takeaway: Flooding is stopped at the hull fitting; everything else is delay.
    stops:
      - group: DC
        task: Read the flows, decide which terms belong in the ledger, and close the water balance.
        title: Under the deck plates
        place: Forward Equipment & Handling
        scene: The forward bilge alarm has sounded twice, and water is visible through the deck-plate slots. Hallam marks the level one minute apart while the drain pump runs. Fresh-water level and sonar-cooling flow stay steady. Command wants the inflow now.
        assumes:
          - a measured level rise is accumulation, not total inflow
          - a running pump removes water during the same measurement
        takeaway: Accumulation equals inflow minus removal, so a removal already running has to be added back to recover the true inflow.
        format: BALANCE
        question: How fast is water entering the compartment before the drain pump removes any of it?
        balance:
          hint: Read every stream for free. Count only quantities with the same units as the requested inflow. Remember that a removal running during the measurement does not appear in the level rise.
          total:
            amount: 143
            unit: gpm
            label: Water entering the compartment
          streams:
            - id: rise
              label: Bilge accumulation
              value: 88
              display: 8 cm rise in one minute = 88 gpm
            - id: fresh
              label: Fresh-water tank loss
              value: 0
              display: tank level unchanged
            - id: cooling
              label: Sonar-cooling flow loss
              value: 0
              display: flow unchanged
            - id: drain
              label: Drain-pump discharge
              value: 55
              display: 55 gpm
              hidden: true
              note: The pump was already running when both bilge readings were taken.
          tolerance: 5
        answerText: "About 143 gallons per minute is entering: 88 gpm is accumulating and another 55 gpm is already leaving through the drain pump."
        why: The bilge rise shows only what stayed in the boat during the minute. It does not include water the drain pump removed at the same time. The correct balance is inflow = accumulation + removal. Here that is 88 + 55 = 143 gallons per minute. The unchanged fresh-water tank and normal sonar-cooling flow contribute zero to the balance. A pump can make a serious leak look smaller on the deck plates, which is exactly why its discharge belongs back in the total.
      - group: DC
        task: Estimate the pressure driving the seawater leak
        title: What ninety metres puts behind the valve
        place: Forward Equipment & Handling
        scene: The suspected hull connection is 90 metres below the surface. Ferro writes seawater density as 1025 kilograms per cubic metre and g as 9.81 metres per second squared. He wants the gauge pressure on the sea side of the fitting.
        assumes:
          - gauge pressure counts the pressure added by the water column above the surface value
        takeaway: Hydrostatic gauge pressure rises in direct proportion to depth.
        format: BALLPARK
        question: About how much gauge pressure is the sea applying at 90 metres?
        answerText: About 0.91 MPa gauge, roughly nine atmospheres above surface pressure.
        why: Hydrostatic pressure is p = ρgh. Use seawater density 1025 kg/m³, g = 9.81 m/s², and h = 90 m. The gauge pressure is about 905,000 pascals, or 0.91 megapascals. That is roughly nine atmospheres above surface pressure. Add the atmosphere already present, and the absolute pressure outside the hull is about ten atmospheres. This is why a small opening at depth can drive a large inflow and why the hull isolation matters more than adding another pump.
        estimate:
          relationship: Hydrostatic pressure at depth is p = ρgh.
          prompt: The fitting is 90 m deep in seawater of density 1025 kg/m³. Use g = 9.81 m/s².
          question: Estimate the gauge pressure at the fitting.
          labels:
            - 8 cm  (rise in one minute)
            - 11 gallons per cm  (this bilge)
            - 55 gpm  (drain pump at this head)
            - 90 m  (depth)
            - 31 cm  (level at the first reading)
          values: [8, 11, 55, 90, 31]
          slots: 3
          template: "{0} × {1} + {2}"
          formula: a*b + c
          correct: [0, 1, 2]
          target: 143
          tolerance: 12
          units: gallons per minute
          solution: 1025 × 9.81 × 90 ≈ 9.05 × 10^5 Pa = 0.91 MPa, about 9 atmospheres gauge.
          explanation: Depth multiplies the weight of the water column. The result is gauge pressure; atmospheric pressure is added only if absolute pressure is needed.
      - group: ENG
        task: Match each action to what it actually achieves.
        title: What else that valve feeds
        place: Machinery Control Room
        scene: "Two valves will stop the water: the outboard hull valve and the inboard supply valve. The header they sit on also feeds the sonar-array cooling. Haruki wants each action matched to what it actually achieves."
        assumes:
          - one header can serve more than one system
        takeaway: Every isolation stops something else, and the order decides what that is.
        format: PROTOCOL
        why: Isolation is never free. Every valve shut can take another system away from somebody else. Here, stopping the flood and removing sonar-array cooling can happen through the same header. Only the hull valve separates the boat from the sea, so it is the cut that ends the source. The inboard valve stops flow to the break but leaves the sea connected to the header. A second pump buys time. Warning sonar changes nothing physical, but it lets the affected watch prepare.
        columns:
          - What you order
          - What it actually does
        rebuttals:
          - The outboard hull valve is the only cut between the boat and the ocean. Everything else acts on water that is already inside.
          - The inboard supply valve stops flow to the break and leaves the header pressurised from the sea. Useful, and not the end of it.
          - A second portable pump raises the rate out. It buys minutes and changes nothing about where the water is coming from.
          - Telling sonar before the header is isolated moves no water at all. It gives the array's operators warning that their cooling is about to stop.
        scenarios:
          - Shut the outboard hull valve first.
          - Shut the inboard supply valve only.
          - Start a second portable pump before isolating.
          - Tell sonar before the header is isolated.
        choices:
          - Stops the sea at the hull, which is the only cut that ends it.
          - Stops flow to the break but leaves the sea connected to the header.
          - Buys minutes without changing the outcome.
          - Gives the array's operators warning before their cooling stops.
        mapping: [0, 1, 2, 3]
  - title: Electrical Fire
    objective: Put out a fire whose ignition source is electrical, in the order that makes it stay out.
    briefing: |-
      Smoke in the electrical distribution space. The switchboard indicator says the affected bus is open, and the fire is behind a panel where nobody can see the seat of it.
    stake: Same day, afternoon watch, eight hours after the flooding and nobody has slept. Smoke from a switchboard in the electrical space. The indicator shows the bus open and a meter his own electrician's mate put on the cable inside reads four hundred and forty volts. The chief electrician, Bede Okonkwo, will not send anybody in on the strength of a lamp. This watch you take the fire apart into the things keeping it alive, decide what that meter is telling you, and work out how to fight a space nobody can see into. The order of your actions matters more here than the speed of any one of them.
    takeaway: An electrical fire is put out by de-energizing it; the agent only finishes the job.
    stops:
      - group: FIRE
        task: Match each leg of the fire to the action that removes it.
        title: Three legs, three different actions
        place: Electrical Distribution
        scene: Chief Okonkwo puts the three legs of the fire on the board. The fault that keeps lighting it, the insulation that burns, the air in the compartment. He asks what removes each one.
        assumes:
          - a fire needs fuel, oxygen and a source of energy
        takeaway: For an electrical fire, de-energizing removes continuing electrical heating and shock hazard; the burning fuel still has to be cooled and controlled.
        format: PROTOCOL
        why: An electrical fault can keep adding heat to burning insulation. The first electrical action is therefore to isolate the source and prove the conductor dead with a meter. That removes continuing electrical heating and the shock hazard. It does not guarantee that the fuel has stopped burning. The hot insulation must still be cooled below its re-ignition temperature. Ventilation is then controlled to limit oxygen supply and smoke movement according to the casualty plan. A hot bulkhead is evidence to monitor, not a fourth leg of the fire triangle.
        columns:
          - What is feeding the fire
          - What you do about it
        rebuttals:
          - The energised fault is removed by opening the breaker and then proving the cable dead. Until it is dead, everything else is fighting a symptom.
          - The burning insulation is fuel. You take it below the temperature at which it re-lights, which is what cooling is for.
          - The air feeding the flame is cut off by shutting ventilation to the space. Submerged there is nowhere to vent to.
          - Heat conducting to the next compartment is not a leg of this fire. It is a boundary, and you set and read it with an infrared thermometer.
        scenarios:
          - The energized fault that keeps re-igniting the cable.
          - The cable insulation that is actually burning.
          - The air in the compartment feeding the flame.
          - The heat conducting through the bulkhead to the next space.
        choices:
          - Open the breaker, then prove the cable dead with a meter.
          - Cool it below the temperature at which it re-lights.
          - Shut the ventilation to the space so the fire stops being fed.
          - Set and read boundaries with an infrared thermometer.
        mapping: [0, 1, 2, 3]
      - group: FIRE
        task: Prove it before you fight it
        title: What a lamp is worth
        place: Electrical Distribution
        scene: Smoke is pushing through the compartment door. The switchboard indicator says the bus is open, but a meter on the cable reads 440 volts. The hose team is masked up at the threshold, waiting for your call before anyone steps inside.
        assumes:
          - a bus can be fed from more than one source
        takeaway: An indicator reports a belief; a meter reports a condition.
        format: SEQUENCE
        why: "The switchboard lamp reports what the switchboard believes about the circuit. A meter on the conductor reports the condition of that conductor. Those claims can disagree because contacts fail, lamps fail, or another source back-feeds the cable. Water on an energized conductor can carry current into the hose team. So the sequence matters: isolate the source, test the conductor, confirm zero voltage, then fight the fire. The meter is not extra paperwork. It is the check that separates an indicated isolation from a proved one."
        rebuttals:
          - Open the breaker first. Nothing downstream is safe to touch while the source is still connected.
          - Meter the cable second, in the compartment. This is the step the lamp cannot do for you, and it is the one that was skipped.
          - Enter and fight the fire third, on breathing protection, once the conductor is proved dead.
          - Set and read boundaries until the seat is cold, then restore loads in dependency order. A fire declared out too early is a fire you fight twice.
        cards:
          - Open the breaker for the affected bus.
          - Meter the cable in the compartment and confirm it is dead.
          - Enter with breathing protection and fight the fire.
          - Set boundaries and read them until the seat is cold.
          - Restore loads in dependency order, vital equipment first.
        order: [0, 1, 2, 3, 4]
      - group: ATMO
        task: Decide what the smoke has done to the space
        title: Smoke is not only a breathing problem
        place: Auxiliary Machinery & Bilge
        scene: Visibility is under half a metre. The far bulkhead is eight metres away. Temperature at head height reads 60 degrees against 28 at deck level. The team has air masks, and the fire is behind a panel where nobody can see it directly.
        assumes:
          - a fire inside a structure does not show you where it is
        takeaway: Smoke removes the instrument you were relying on, which is your own eyes.
        format: CHOICE
        question: What does the smoke change about how the casualty is fought?
        why: Smoke changes more than breathing. It removes visibility, so the team can lose the route, the boundary and each other within a few metres. A large temperature difference between deck level and head height also shows strong thermal layering. Heat and smoke can therefore worsen above the layer even while the floor remains cooler. Air masks solve the breathing problem only. They do not restore sight or remove heat. Entry now needs a controlled route, communications and a way to judge conditions without seeing the fire.
        choices:
          - The space can no longer be read by eye, so the boundaries have to be measured instead.
          - Nothing, as long as everybody is on breathing protection.
          - The fire will go out on its own once the smoke displaces the air.
          - The compartment must be abandoned until the smoke clears.
        answer: The space can no longer be read by eye, so the boundaries have to be measured instead.
        rebuttals:
          - Masks keep the team working; they do not restore the information the smoke took away.
          - A fire consuming the air also produces carbon monoxide, which is worse, not self-solving.
          - Abandoning it hands the compartment to the fire, and the boundaries still need reading.
  - title: Atmosphere Degradation
    objective: Tell a failing sensor from failing air, and find where the air stopped moving.
    briefing: |-
      Two of the crew in berthing have headaches. The atmosphere plant says everything is normal. Both of those statements can be true at once, and working out how is the whole of this watch.
    stake: Eighth day, middle watch. The scrubber plant is running and its outlet reads clean. The corpsman, Elena Navarro, has been round berthing with a handheld meter and it reads far higher than the sensor on that bulkhead, where nine people are asleep. The atmosphere control officer, Ana Lindqvist, has to decide whether to wake them. This watch you decide whether it is the air or the instrument that is wrong, work out how long that space is safe, and fix the circulation. This is the one system where the crew notice before the instruments do — headaches, short tempers, people asleep on watch — and they already have.
    takeaway: A plant reading is a report about the plant, not about the compartment you are standing in.
    stops:
      - group: ATMO
        task: Which explanation accounts for every reading?
        title: The compartment the scrubber cannot reach
        place: Auxiliary Machinery & Bilge
        scene: The scrubber plant is running and its outlet reads clean. A handheld meter in berthing reads far higher than the sensor installed there, while control and machinery both read normal on handhelds.
        assumes:
          - a plant can only treat air that reaches it
        takeaway: Ventilation decides which compartments the plant is actually treating.
        format: CHOICE
        why: The scrubber can only treat air that reaches it. A shut damper can therefore leave one compartment outside the circulation loop while the plant outlet still looks normal. The handheld reading in berthing is supported by symptoms there, while handhelds elsewhere are normal, so the problem is local rather than boat-wide. The installed berthing sensor also disagrees with the handheld and the symptoms, which points to a second fault in that sensor. One failure does not have to explain every bad reading when the evidence supports two independent faults.
        rebuttals:
          - Control and machinery are normal on independent handheld readings, so this is not boat-wide.
          - The scrubber outlet is clean, which argues that the plant itself is working.
          - The shut damper and local symptoms independently support a real problem in berthing.
          - A local symptom pattern plus a shut damper is not ordinary noise.
        headline: Berthing is high on a handheld and normal on its installed sensor, and the plant says it is fine.
        readings:
          - zone: Plant
            label: Scrubber outlet CO₂
            value: 0.4 %
            status: normal
          - zone: Berthing
            label: Handheld CO₂
            value: 2.1 %
            status: alarm
          - zone: Berthing
            label: Installed sensor
            value: 0.5 %
            status: alarm
          - zone: Berthing
            label: Supply damper
            value: shut
            status: alarm
          - zone: Control
            label: Handheld CO₂
            value: 0.5 %
            status: normal
          - zone: Crew
            label: Symptoms
            value: berthing only
            status: high
        choices:
          - label: Berthing is outside the ventilation loop and its installed sensor is also wrong
            mechanism: A shut damper isolates the space while a bad installed sensor hides the local rise.
          - label: The whole boat’s atmosphere is degrading
            mechanism: A plant-wide failure would raise independent readings in several compartments.
          - label: The scrubber has stopped removing carbon dioxide
            mechanism: A failed scrubber would show at its own outlet and across the boat.
          - label: The handheld meter is reading high in error
            mechanism: A bad handheld would not explain local symptoms and the shut damper.
          - label: Ordinary background, nothing more
            mechanism: The local symptoms and conflicting instruments require an explanation.
        answer: Berthing is outside the ventilation loop and its installed sensor is also wrong
      - group: ATMO
        task: Work out how long the space has
        title: Nine people and a shut damper
        place: Berthing, Mess & Medical
        scene: Navarro has nine people in a 36-cubic-metre berthing space at 293 kelvin and about one atmosphere. With the damper shut, each person adds about 0.9 mole of carbon dioxide per hour. She wants the time for carbon dioxide to rise by one percentage point.
        assumes:
          - gas pressure, volume, amount and absolute temperature are related by PV = nRT
          - the compartment temperature and total pressure stay roughly constant over the estimate
        takeaway: The ideal gas law turns a concentration limit into a number of moles, and a production rate turns that amount into a deadline.
        format: BALLPARK
        question: Using the ideal gas law, roughly how long does a one-percentage-point carbon-dioxide rise take?
        answerText: About 1.9 hours for a one-percentage-point rise under the stated assumptions.
        why: A one-percentage-point rise means an added carbon-dioxide partial pressure of about 0.01 atmosphere, or 1013 pascals. Using PV = nRT, that is n = PV/RT ≈ 1013 × 36 /(8.314 × 293), about 15 moles. Nine people producing 0.9 mole per hour each add about 8.1 moles per hour. Fifteen divided by 8.1 is about 1.9 hours. The estimate is approximate, but it gives a planning deadline instead of the word “stuffy.”
        estimate:
          relationship: Use ΔP V = nRT to find the added moles, then divide by the crew production rate.
          prompt: Berthing is 36 m³ at 293 K and about 1 atm. Nine people each add 0.9 mol of CO₂ per hour.
          question: Estimate the time for CO₂ partial pressure to rise by 0.01 atm.
          labels:
            - 36 m³  (compartment volume)
            - 293 K  (temperature)
            - 1013 Pa  (0.01 atm)
            - 8.314 J/(mol·K)  (R)
            - 0.9 mol/h/person  (CO₂ production)
            - 9  (people)
          values: [9, 0.04, 36, 0.01, 1, 70]
          slots: 4
          template: "{2} × {3} ÷ ({0} × {1})"
          formula: c*d/(a*b)
          correct: [0, 1, 2, 3]
          target: 1
          tolerance: 0.2
          units: hours
          solution: n ≈ (1013 Pa × 36 m³)/(8.314 × 293) ≈ 15 mol. Production = 9 × 0.9 = 8.1 mol/h. Time ≈ 15/8.1 ≈ 1.9 h.
          explanation: At nearly fixed total pressure and temperature, a one-percentage-point concentration rise is a 0.01-atmosphere rise in CO₂ partial pressure.
      - group: ENG
        task: One fan feeds both the scrubber and the after spaces. What does that mean for the plan?
        title: What one fan takes with it
        place: Machinery Room
        scene: The ventilation drawing shows one fan feeding the scrubber and the after spaces through a common trunk. The watch bill treats them as two independent systems, and the atmosphere plan assumes both.
        assumes:
          - a system is only as independent as the things it shares
        takeaway: Two systems sharing one component are one system for the purpose of a failure.
        format: CHOICE
        question: One fan feeds both the scrubber and the after spaces. What does that mean for the plan?
        why: One fan can support two functions and still be one failure point. If the scrubber and after-space ventilation share the same fan and trunk, losing that fan removes both services together. Treating them as independent in the plan therefore overstates redundancy. The fix is not merely to write two boxes on the watch bill. Independence requires a different fan, power path or airflow route. Until then, the atmosphere plan has one common-mode failure that can affect several compartments at once.
        choices:
          - The fan is a single point of failure, and the plan needs a second path or a stated fallback.
          - Nothing. Two systems on one fan is normal and the fan is reliable.
          - The scrubber should be run harder, so a fan failure leaves more margin.
          - The after spaces should be sealed off, since they are downstream.
        answer: The fan is a single point of failure, and the plan needs a second path or a stated fallback.
        rebuttals:
          - Reliability is not independence — a reliable shared component still takes both systems out when it does fail.
          - Running the scrubber harder consumes more of the same air path and shortens the time available.
          - Sealing the after spaces removes them from the plan rather than protecting them, and people are berthed there.
  - title: Compound Casualty
    objective: Prioritise and delegate when there are more casualties than there are people.
    briefing: |-
      Flooding forward, a partial power loss, a degraded plot and one injured crewman, all inside four minutes. There are not enough people to do everything, so the first decision is which things do not get done yet.
    stake: "Ninth day, forenoon watch, and four things at once: water forward, a bus lost aft, the plot degraded by that power loss, and Adeyemi with a broken wrist in the passage. Vance wants to hold the ordered speed. Whitfield says a boat with four casualties making eight knots at a bank nine miles away is about to have five, and this time he is the one who is right. This watch you decide what you take, what you hand to whom, and whether the boat slows down. Everything you hold personally is something nobody else is working, and Whitfield will not invent the organisation for you."
    takeaway: Command is deciding what you do, and who does the rest.
    stops:
      - group: DC
        task: Decide what is first
        title: Four casualties, one crew
        place: Forward Equipment & Handling
        scene: Four reports hit control almost together. Water is forward and a bus is lost aft. The plot has degraded, and a crewman is down with a broken wrist. The alarm is still sounding. Every team leader is looking at you for the first move.
        assumes:
          - some problems get worse on their own and some do not
        takeaway: You order casualties by how fast they get worse, not by how loud they are.
        format: TRIAGE
        question: What gets the first team?
        why: Triage is about what changes fastest and what becomes irreversible, not what sounds worst. A growing flood can remove buoyancy and spread into new spaces. An electrical casualty can keep feeding heat or disable other systems. A degraded plot matters more as the boat approaches constrained water. A stable wrist fracture hurts and needs treatment, but it does not outrun the other three over the next minute. The first team goes where delay changes the future most; the rest still need owners and follow-up.
        rebuttals:
          - The injured man matters and he is stable. A broken wrist in a passage is treated and cleared, and it is not getting worse while you decide.
          - The bus is already lost. Everything downstream of it failed some minutes ago, and nothing about it deteriorates further while you send the team forward.
          - The plot degrades every minute, and it can be frozen by slowing the boat — a decision, not a team.
        choices:
          - The flooding, because it is the only one that gets worse by itself.
          - The injured crewman, because a person comes before equipment.
          - The lost bus, because everything else depends on power.
          - The plot, because the boat is still moving toward a bank.
        answer: The flooding, because it is the only one that gets worse by itself.
      - group: FIRE
        task: Keep the one condition that cannot wait. Delegate every other problem with an owner, first action and return condition.
        title: Who does the things you are not doing
        place: Electrical Distribution
        scene: The flooding is now falling because the pump removes 60 litres a minute against 40 coming in. A fire boundary aft is heating, the atmosphere is stable, and a crewman has a fractured wrist. The executive officer needs assignments now.
        assumes:
          - a problem’s trend matters as much as its present size
          - a complete delegation names an owner, a first action and a return condition
        takeaway: Delegation is complete only when an owner knows what to do first and when to report back.
        format: DELEGATE
        question: Which problem do you keep, and what complete assignment does each remaining problem get?
        delegate:
          hint: Take one problem yourself. For every other problem choose an owner, a first action, and the reading or event that must bring it back to you.
          problems:
            - id: boundary
              label: Aft fire boundary
              rate: 6
              unit: °C/min
              value: 54
              trend: rising
              irreversible: true
              consequence: Cable insulation fails at 80 °C.
              delegable: false
            - id: flood
              label: Forward flooding
              rate: -20
              unit: L/min net
              value: 22
              trend: falling
              irreversible: false
              consequence: Report if level starts rising again.
              delegable: true
            - id: atmo
              label: Atmosphere
              rate: 0.01
              unit: "% CO₂/h"
              value: 0.7
              trend: stable
              irreversible: false
              consequence: Report at 0.9% CO₂ or if symptoms appear.
              delegable: true
            - id: wrist
              label: Fractured wrist
              rate: 0
              unit: change/min
              value: 0
              trend: stable
              irreversible: false
              consequence: Treat and clear the damage-control route.
              loud: true
              delegable: true
          firstActions:
            - id: log_bilge
              label: Log bilge level every 5 minutes
            - id: handheld_co2
              label: Take an independent handheld CO₂ reading
            - id: splint_clear
              label: Splint the wrist and clear the passage
          correctAssignments:
            - problem: flood
              person: dc_watch
              firstAction: log_bilge
              returnCondition:
                metric: net bilge rate
                operator: ">"
                value: 0
                unit: L/min
            - problem: atmo
              person: atmo_watch
              firstAction: handheld_co2
              returnCondition:
                metric: CO₂
                operator: ">="
                value: 0.9
                unit: "%"
            - problem: wrist
              person: corpsman
              firstAction: splint_clear
              returnCondition:
                metric: passage-clear time
                operator: ">"
                value: 5
                unit: min
          team:
            - id: dc_watch
              label: Damage-control watchstander
            - id: atmo_watch
              label: Atmosphere watchstander
            - id: corpsman
              label: Medical corpsman
          first: boundary
        answerText: Keep the rising fire boundary. Delegate the falling bilge, stable atmosphere and wrist injury with explicit first actions and report thresholds.
        why: The fire boundary is the one condition that gets worse fast enough to cross a damage threshold while you are deciding. At 54 °C and rising 6 °C per minute, an 80 °C insulation limit is only a few minutes away. The flooding is already losing twenty litres a minute net, so it can be watched. The atmosphere and wrist are stable. A useful handoff gives each problem an owner, a first action, and a number that brings it back to you. “Watch it” supplies none of those.
      - group: NAV
        task: Buy the time to think
        title: Slowing down as a decision
        place: Control Room
        scene: The degraded plot is still being rebuilt while the boat makes eight knots toward a bank nine miles ahead. The officer of the deck can slow to three knots now. Whitfield wants to know how much thinking time that buys before anything harder to reverse.
        assumes:
          - distance divided by speed is time
        takeaway: Slowing the boat converts a distance problem into a time budget.
        format: BALLPARK
        question: How much time does coming down to three knots buy?
        why: Time is the only resource in a casualty that can be manufactured, and speed is the price list. Nine miles at eight knots is a little over an hour; the same nine miles at three knots is three. Slowing costs progress and buys everything else — the plot can be rebuilt, the flooding can be fought, the passage will still be there. Work out what eight knots is actually spending, in minutes, before deciding whether the boat can afford it.
        estimate:
          relationship: Time = distance ÷ speed. The gain is the time at the slower speed minus the time at the faster one.
          prompt: Nine miles to the bank at eight knots, with the option of coming down to three.
          question: Estimate the extra time coming down to three knots buys.
          labels:
            - 9 nm  (to the bank)
            - 8 kn  (present speed)
            - 3 kn  (the slow option)
            - 6 min  (since the plot degraded)
            - 5 kn  (the difference between the two speeds)
          values: [9, 8, 3, 6, 5]
          slots: 3
          template: "{0} ÷ {2} − {0} ÷ {1}"
          formula: a/c - a/b
          correct: [0, 1, 2]
          target: 1.875
          tolerance: 0.2
          units: hours
          solution: 1.1 hours at eight knots against three at three knots, so slowing buys nearly two more.
          explanation: An hour is not enough time to fight a flooding casualty and rebuild a plot. Three hours is. The boat's speed is the one number on this list that you control, and it is worth two hours.
  - title: Sonar Blinded by the Boat
    objective: Find the noise the boat is making about itself, and prove which machine it is.
    briefing: |-
      Sonar has lost the picture. There is a broadband rise across every bearing and a new narrowband line, and the ocean has not changed. The problem is aboard, which makes it the engineers' problem and sonar's evidence.
    stake: Eleventh day. The broadband noise floor is up across every bearing rather than in one sector, and the broadband operator, Kes Dunne, has found a new narrowband line at a hundred and thirteen hertz that grows with turns. Rask says the boat is shouting into its own array; Haruki says his plant is running exactly as it was yesterday. This watch you decide whether the noise is outside the boat or inside it, narrow it to one machine, and say what kind of fault makes a line like that. While the array is degraded other boats can still hear this one, and it cannot hear them.
    takeaway: Own-ship noise is diagnosed by correlating what sonar hears with what the plant is doing.
    stops:
      - group: SONAR
        task: Which explanation fits the whole picture?
        title: The rise on every bearing
        place: Sonar Room
        scene: Broadband rises across every bearing at once. A new 212-hertz line also appears everywhere, and its frequency shifts slightly when the seawater-pump speed changes. The weather and sound-speed profile are steady. One pump was started twenty minutes ago.
        assumes:
          - a contact out in the water lies in some direction
        takeaway: A signal that follows an own-ship control is evidence of an own-ship source.
        format: CHOICE
        why: An external contact occupies a direction; an own-ship source couples into the array from the hull and can contaminate many bearings at once. The decisive clue is not simply that the line is loud. Its frequency changes when the pump speed changes. Something outside the boat has no access to that control. Weather or a sound-speed change would not track pump revolutions either. The broad rise and control-linked tonal line therefore point to machinery aboard the boat, which is both masking contacts and increasing radiated signature.
        rebuttals:
          - A close contact appears in one sector and has its own bearing rate. This is up on every bearing at once.
          - A change in the sea would follow the weather or the layer, and both are unchanged. It would not follow our shaft.
          - A failing hydrophone degrades part of the array. This is the whole display.
          - "There is something to explain: a new line at a specific frequency that moves when our plant does is not ordinary variation."
        headline: Broadband is up on every bearing at once and a new narrowband line has appeared.
        readings:
          - zone: Broadband
            label: Rise
            value: all bearings
            status: alarm
          - zone: Narrowband
            label: New line
            value: 113 Hz
            status: alarm
          - zone: Narrowband
            label: Line behaviour
            value: shifts with shaft speed
            status: alarm
          - zone: Environment
            label: Sea state and layer
            value: unchanged
            status: normal
          - zone: Plant
            label: Machinery started recently
            value: seawater pump, 20 min ago
            status: high
        choices:
          - label: A machinery fault
            mechanism: A source we carry radiates in every direction at once, and its line follows our own machinery.
          - label: A close contact
            mechanism: Another vessel nearby, which would appear in one sector and have its own bearing rate.
          - label: A change in the sea
            mechanism: Weather or a layer shift, which would change with the environment and not with our shaft.
          - label: A failing hydrophone
            mechanism: A defective element, which would degrade one part of the array rather than all bearings.
          - label: Ordinary background, nothing more
            mechanism: Ordinary variation in a noisy ocean.
        answer: A machinery fault
      - group: ENG
        task: Change one machine at a time, listen to the line, then reverse the suspected change to confirm the cause.
        title: Narrowing it to one mount
        place: Propulsion Machinery
        scene: Four machines are running when a new 212-hertz line appears across the array. Only the seawater pump was started in the last half hour. Haruki will let you change one machine at a time, but sonar must report before each next change.
        assumes:
          - changing several variables at once makes a causal result ambiguous
          - a suspected cause should reproduce the effect when restored
        takeaway: A correlation becomes a causal test when one variable changes, the response follows, and the response returns when the variable is restored.
        format: CONTROL
        question: Which machine causes the 212-hertz line?
        control:
          hint: Change only one machine before each sonar report. Once you find a large response, put that machine back and confirm that the line returns.
          baseline: 74
          noise: 2
          unit: dB at 212 Hz
          variables:
            - id: sw_pump_2
              label: Second seawater pump
              changedValue: secured
              restored: 74
            - id: trim_pump
              label: Trim pump
              changedValue: secured
              restored: 74
            - id: vent_fan
              label: Ventilation fan
              changedValue: secured
              restored: 74
            - id: lube_pump
              label: Lube-oil pump
              changedValue: secured
              restored: 74
          response: 61
          truth: sw_pump_2
        answerText: "The second seawater pump is the source: securing it removes 13 dB from the line, and restoring it brings the line back."
        why: The log tells you what changed near the time the line appeared, but timing alone is only a correlation. A causal test holds every other machine fixed, changes one control, and waits for sonar to report. The seawater pump changes the line by 13 dB while measurement noise is only 2 dB. The other machines move it by no more than the noise. Restoring the pump brings the line back. That reversal is what turns a plausible suspect into the measured cause.
      - group: SONAR
        task: Use the supplied values to estimate the contact’s line-of-sight speed.
        title: What the shifted line says about speed
        place: Sonar Shack
        scene: After the 212-hertz own-ship line is removed, a separate contact on bearing 064° resolves at 149.7 hertz. Boats of that class produce the same machinery line at 150.0 hertz. The operator asks what the small frequency shift says about range rate.
        assumes:
          - sound travels at about 1500 metres a second in sea water
        takeaway: A one-way Doppler shift measures line-of-sight relative speed; the sign tells whether the range is opening or closing.
        format: BALLPARK
        question: Estimate the range rate implied by the 0.3-hertz downward shift.
        answerText: About 3.0 m/s, or 5.8 knots, opening.
        why: For speeds much smaller than sound speed, the fractional Doppler shift is approximately Δf/f = v/c. Here the observed line is 0.3 Hz below a 150.0 Hz rest line, so Δf/f = -0.3/150 = -0.002. Multiplying by 1500 m/s gives about -3 m/s, or roughly -5.8 knots. The negative sign means the range is opening. This calculation now belongs to an external contact; an own-ship machine would share the receiver’s motion and would not show a six-knot relative Doppler shift.
        estimate:
          relationship: Δf/f ≈ v/c, with negative v for an opening range in this sign convention.
          prompt: An external contact’s line is at 149.7 Hz. The class reference is 150.0 Hz. Use c = 1500 m/s.
          question: Estimate the line-of-sight range rate.
          labels:
            - "-0.3 Hz  (frequency shift)"
            - 150.0 Hz  (reference frequency)
            - 1500 m/s  (sound speed)
            - 0.5144 m/s per knot  (conversion)
          values: [0.3, 150, 1500, 0.5144]
          slots: 3
          template: "{0} ÷ {1} × {2}"
          formula: a/b*c
          correct: [0, 1, 2]
          target: 3
          tolerance: 0.6
          units: m/s
          solution: Δf = -0.3 Hz. (-0.3/150) × 1500 m/s = -3.0 m/s ≈ -5.8 kn, opening.
          explanation: Use the fractional frequency shift, not the absolute frequency alone.
  - title: Uncontrolled Depth Change
    objective: Tell a symptom from a cause when the boat is going somewhere you did not order.
    briefing: |-
      The boat is heavier than it was an hour ago and it is going down. The depth gauge, the trim state and the planes all have something to say and only one of them is the cause.
    stake: Twelfth day, middle watch. The boat is going deeper with the planes already at rise, the trim shows heavy forward, speed is unchanged, and the depth gauge is the calmest instrument in the control room. Ferro is on his way forward without being asked, which tells you what he thinks it is. This watch you decide what is actually causing it, work out how much weight is aboard, and choose which control to use — knowing two of the four are hard to undo at this depth. Treat the symptom and the boat keeps going down while everybody watches the right gauge for the wrong reason.
    takeaway: Depth is the outcome of weight, angle and speed, and each of those has its own cause.
    stops:
      - group: NAV
        task: Which cause accounts for every reading?
        title: Three gauges, one problem
        place: Control Room
        scene: The depth needle is still moving deeper even though the planes are already at rise. Trim shows the boat heavy forward, speed has not changed, and the aft depth gauge disagrees with control by four metres. The next depth report is due now.
        assumes:
          - a submarine holds depth by buoyancy and by the planes together
        takeaway: The instrument that disagrees is a candidate, not automatically the culprit.
        format: CHOICE
        why: A depth change can come from real vertical motion, a bad indication, or both. The planes already at rise say the control system is trying to oppose the descent. Heavy-forward trim is independent evidence that extra weight or lost buoyancy may be forward. The two depth gauges disagree, so neither should be treated as unquestioned truth. The readings together point to a real trim problem plus an indication problem. Command needs an independent depth check while the weight source is investigated.
        rebuttals:
          - A faulty gauge explains one reading and leaves the boat heavy and bow-down for no reason. The disagreement is what a bow-down boat produces.
          - Trim water moved inside the boat would show in the tank levels, and they are unchanged. Weight has been added, not shifted.
          - A planes-control failure gives an angle without added weight, and it would not put water in the forward bilge.
          - Less flow over the planes would reduce lift, and speed is unchanged at eight knots.
        headline: The boat is going deeper with the planes at rise, and the two depth gauges disagree.
        readings:
          - zone: Depth
            label: Control gauge
            value: 94 m, increasing
            status: alarm
          - zone: Depth
            label: After gauge
            value: 98 m, increasing
            status: alarm
          - zone: Trim
            label: Bubble
            value: 1.2° bow down
            status: alarm
          - zone: Trim
            label: Trim tank levels
            value: unchanged
            status: normal
          - zone: Plant
            label: Speed
            value: 8 kn, unchanged
            status: normal
          - zone: DC
            label: Forward bilge
            value: wet, level unread
            status: high
        choices:
          - label: Water coming aboard forward
            mechanism: Weight added at the bow explains the trim, the depth and the wet bilge, and the gauges disagree because they are at different depths in a boat that is down by the bow.
          - label: A depth-gauge fault
            mechanism: One instrument reading wrong, which would not make the boat heavy or bow-down.
          - label: Trim water transferred aft by mistake
            mechanism: Weight moved inside the boat, which the tank levels would show.
          - label: A planes-control failure
            mechanism: Control surfaces not doing what is ordered, which would show as an angle without added weight.
          - label: Speed loss reducing lift
            mechanism: Less flow over the planes, which the unchanged speed rules out.
        answer: Water coming aboard forward
      - group: DC
        task: Turn floodwater volume into a force scale
        title: What 1.6 cubic metres of seawater is worth
        place: Forward Equipment & Handling
        scene: The forward bilge geometry gives about 1.6 cubic metres of seawater aboard. Ferro wants the force scale before command chooses how much ballast water to expel. Use seawater density 1025 kilograms per cubic metre and g = 9.81 metres per second squared.
        assumes:
          - floodwater volume can be estimated from the bilge geometry
          - one tonne of mass weighs about 9.81 kilonewtons
        takeaway: For seawater, ρVg gives both the weight of a known water volume and the buoyant force on an equal displaced volume.
        format: BALLPARK
        question: What weight does 1.6 cubic metres of seawater add, and what equal buoyant-force scale would offset it?
        answerText: About 16 kN, the weight of roughly 1.64 tonnes of seawater.
        why: A fully submerged boat does not have a simple “tonnes per metre of depth” rule. Extra floodwater adds weight; depth change also depends on speed, planes and dynamics. Use the measured water volume instead. For 1.6 m³ of seawater, ρVg = 1025 × 1.6 × 9.81 ≈ 16,100 N. That is the weight of about 1.64 tonnes of seawater. Recovering an equal force through ballast action gives command the right response scale. A four-metre depth change alone does not measure added mass.
        estimate:
          relationship: F = ρVg. The same ρVg form gives the buoyant force on an equal displaced seawater volume.
          prompt: The bilge contains about 1.6 m³ of seawater. Use ρ = 1025 kg/m³ and g = 9.81 m/s².
          question: Estimate the added weight and the equal buoyant-force scale.
          labels:
            - 1025 kg/m³  (seawater density)
            - 1.6 m³  (floodwater volume)
            - 9.81 m/s²  (g)
            - 9.81 kN  (weight of one tonne)
          values: [4, 1.6, 8, 90]
          slots: 2
          template: "{0} × {1}"
          formula: a*b
          correct: [0, 1]
          target: 6.4
          tolerance: 0.8
          units: tonnes
          solution: 1025 × 1.6 × 9.81 ≈ 1.61×10^4 N = 16.1 kN, equivalent to about 1.64 tonnes of seawater.
          explanation: Use measured volume, not depth change, because a submerged boat’s vertical motion also depends on planes, speed and acceleration.
      - group: ENG
        task: Match each action to what it actually achieves.
        title: What each control actually does
        place: Machinery Control Room
        scene: The depth is still increasing and four actions are available in the next thirty seconds. Planes, speed, ballast air and the trim pump can all change the boat. Two actions are hard to take back at this depth, and command wants their effects named first.
        assumes:
          - the planes only work while water is flowing past them
        takeaway: Speed and angle buy time; blowing buys depth and gives away position.
        format: PROTOCOL
        why: The controls do different jobs and have different costs. More speed increases flow over the planes, so the same rise angle produces more hydrodynamic lift. Blowing main ballast removes water quickly and powerfully, but it spends stored air and creates a strong acoustic signature. Pumping a trim tank to sea removes weight more slowly and can be quieter, if the pump outruns the leak. Slowing reduces flow over the planes and therefore reduces their immediate authority. Matching action to effect keeps an urgent response from becoming an irreversible guess.
        columns:
          - What you do
          - What it buys you
        rebuttals:
          - More speed with the planes at rise means more flow over them, so the same angle lifts harder. It buys minutes and costs nothing you cannot take back.
          - Blowing forward main ballast removes weight fast and is heard for miles. It works, and it spends air and position together.
          - Pumping the forward trim tank to sea removes weight slowly and quietly — and only if the pump can out-run the leak.
          - Slowing down and holding depth on the planes reduces the flow the planes need. It is the right move at other moments and the wrong way at this one.
        scenarios:
          - Increase speed with the planes at rise.
          - Blow the forward main ballast.
          - Pump the forward trim tank to sea.
          - Slow down and hold the depth with the planes.
        choices:
          - More flow over the planes, so the same angle lifts harder — buys minutes.
          - Removes weight fast, and is heard for miles.
          - Removes weight slowly, quietly, and only if the pump can beat the leak.
          - Reduces the lift available, which is the wrong way at this moment.
        mapping: [0, 1, 2, 3]
  - title: The Cooling Path
    objective: Trace one cooling path end to end and find where it stopped.
    briefing: |-
      Lube oil temperature is rising on the main bearing and nothing has changed on the throttle. Somewhere between the sea and that bearing there is a chain of things that carry heat away, and one of them is not.
    stake: "Thirteenth day, and this one was bought two watches ago. A main bearing is running hot: the oil is hot, the fresh water loop is hot, and the seawater leaving the heat exchanger is barely warmer than the seawater going in. The second cooling pump is still secured from the quiet lineup Rask asked for, and its breaker is open at the switchboard with nothing in the log. This watch you write the cooling path down in order and decide which link stopped handing the heat on. A bearing run hot for an hour is a bearing replaced in a shipyard."
    takeaway: A cooling system is a chain, and a chain is diagnosed link by link.
    stops:
      - group: ENG
        task: Build the heat path in order, then name the link that governs how fast heat can leave the boat.
        title: From the sea to the bearing
        place: Propulsion Machinery
        scene: "The bearing is running warm at its usual load. Haruki puts the cooling diagram on the table before anyone touches a valve: bearing, lube oil, oil cooler, fresh-water loop, seawater cooler, and overboard discharge. One link is failing."
        assumes:
          - heat must be transferred through every required link before it can leave the boat
          - a hot component is not automatically the failed link
        takeaway: A transfer chain is limited by the weakest required handoff, not necessarily by the hottest or largest component.
        format: CHAIN
        question: Where does the heat travel, and which required transfer is limiting the chain?
        chain:
          hint: Put the heat handoffs in physical order. Then inspect the link readings and choose the required transfer that limits the whole path.
          links:
            - id: bearing
              label: Bearing
              transfers: creates heat into lube oil
              reading: load normal; temperature rising
            - id: lube
              label: Lube-oil flow
              transfers: carries heat from bearing to oil cooler
              reading: flow 100% reference
            - id: oil_cooler
              label: Oil cooler
              transfers: moves heat from oil to fresh water
              reading: fresh-water side warms normally
            - id: fresh_loop
              label: Fresh-water loop
              transfers: carries heat to seawater cooler
              reading: flow 98% reference
            - id: sea_flow
              label: Seawater through cooler
              transfers: carries heat across hull cooling stage
              reading: flow 45% reference
            - id: overboard
              label: Overboard discharge
              transfers: carries rejected heat into the sea
              reading: outlet present
          distractor: bearing
          order:
            - bearing
            - lube
            - oil_cooler
            - fresh_loop
            - sea_flow
            - overboard
          governing: sea_flow
        answerText: Bearing → lube oil → oil cooler → fresh-water loop → seawater cooler → overboard. The governing weak link is the seawater-flow stage, not the hot bearing itself.
        why: The bearing creates heat, but that does not make the bearing the failed link. Heat must move into the lube oil, across the oil cooler, through the fresh-water loop, across the seawater cooler, and finally overboard. If any required handoff is weak, everything upstream gets hotter. The current readings show normal bearing load and normal oil-side flow, but reduced seawater flow. That makes the final rejection path the governing link. Writing the chain first prevents the hottest component from being mistaken for the cause.
      - group: ENG
        task: Which link in the chain has failed?
        title: One link is not handing the heat on
        place: Machinery Control Room
        scene: The lube oil and fresh-water loop are both hot. Seawater enters the cooler at 9 °C and leaves at 23 °C; its normal outlet is about 12 °C at this load. The seawater flow indicator reads 45 percent, and one of two pumps is secured.
        assumes:
          - a heat exchanger needs flow on both sides to move heat
        takeaway: For a similar heat load, lower coolant mass flow makes each kilogram of coolant warm more, so the outlet temperature rise gets larger.
        format: CHOICE
        answerText: The limiting problem is low seawater flow through the cooler.
        why: Heat carried by a coolant depends on mass flow and temperature rise. If the heat load stays similar and flow falls, each kilogram carries more energy, so ΔT grows. Here seawater warms 14 °C instead of about 3 °C while flow is only 45 percent of normal. The hot fresh-water loop shows heat reaches the seawater cooler. The large seawater temperature rise shows too little water is carrying it away. A small outlet rise would instead suggest poor transfer across the exchanger.
        rebuttals:
          - The fresh-water loop is hot, so heat is crossing the oil cooler into it.
          - The 45% seawater-flow reading directly identifies a downstream transport limit.
          - Several independent temperatures change together, so one oil sensor is not enough.
          - The outlet rise and low flow are both outside the normal pattern.
        headline: The oil is hot, the fresh water is hot, and the seawater is leaving barely warmer than it arrived.
        readings:
          - zone: Bearing
            label: Lube oil
            value: 71 °C, rising
            status: alarm
          - zone: Fresh water
            label: Loop temperature
            value: 64 °C, rising
            status: alarm
          - zone: Seawater
            label: Inlet
            value: 9 °C
            status: normal
          - zone: Seawater
            label: Outlet
            value: 11 °C
            status: alarm
          - zone: Plant
            label: Seawater pumps running
            value: one of two
            status: high
        choices:
          - label: Not enough seawater flow through the cooler
            mechanism: Low coolant flow makes the same heat load produce a larger coolant temperature rise.
          - label: The oil cooler is fouled
            mechanism: A fouled oil cooler would keep the fresh-water loop cooler, not hot.
          - label: The bearing suddenly makes much more heat
            mechanism: Extra heat could warm everything, but it does not explain the 45% seawater-flow reading.
          - label: The oil-temperature sensor is faulty
            mechanism: One bad sensor cannot explain hot fresh water and the seawater temperature rise.
          - label: Ordinary background, nothing more
            mechanism: A 14 °C seawater rise at 45% flow is not normal at this load.
        answer: Not enough seawater flow through the cooler
      - group: FIRE
        task: Find out why the pump is off
        title: The breaker nobody logged
        place: Electrical Distribution
        scene: The second seawater pump did not trip; its breaker is open at the switchboard. The quiet-running lineup from two watches ago is still in force and nobody wrote down what it turned off.
        assumes:
          - a watch hands over to a watch that was not there
        takeaway: A configuration nobody recorded is a configuration nobody will restore.
        format: CHOICE
        question: What does this say about the quiet-running lineup?
        why: "The quiet-running lineup was a deliberate trade, but the reason for that trade did not survive the watch change. A log has to carry more than the fact that a machine was secured. It must also say what that machine supports and when it should return. Without that context, a later watch sees an open breaker and cannot tell a valid configuration from a fault. The cooling problem is therefore also a handover problem: the plant state outlived the decision that created it."
        choices:
          - Securing a machine needs a record of what it was cooling.
          - The quiet-running lineup should be restored automatically when the transit ends.
          - The bearing should have a high-temperature alarm that trips the pump back on.
          - Nothing — the watch that secured it made a reasonable trade at the time.
        answer: Securing a machine needs a record of what it was cooling.
        rebuttals:
          - Quiet running is a legitimate reason to secure a pump; the fault is in the handover.
          - An automatic restart would defeat the point of a deliberately quiet lineup.
          - It was reasonable at the time and stopped being reasonable an hour later, which is the whole problem.
  - title: Silent-Running Configuration
    objective: Decide what may be secured, reduced or rescheduled while keeping the boat alive.
    briefing: |-
      The boat has to be quiet for four hours. Everything aboard that makes noise also does something, and the ones that keep people breathing and bearings cool are not on the table.
    stake: Fifteenth day, and the argument that has been running all patrol comes due. Four hours of quiet running, and Haruki intends to secure everything on Rask's list to get it — including the second seawater pump and half the carbon dioxide scrubbing. Lindqvist has done the arithmetic on the second one and is not happy. This watch you decide what may be shut down, what may only be slowed, and what the whole configuration costs the boat. Quiet is bought with capability, and the bill arrives late, in another department. None of that appears on the same gauge as the decision.
    takeaway: A silent lineup is a set of deadlines, not a set of switches.
    stops:
      - group: ENG
        task: Stress the plan by shrinking the time margin left before the six-hour passage ceiling, then choose the lineup that still works.
        title: Four hours of quiet
        place: Machinery Control Room
        scene: Two narrowband components sit at 147 and 150 hertz on the same bearing. In seawater the sound speed is about 1500 metres per second. The audio level swells and fades regularly while both spectral lines themselves remain steady.
        assumes:
          - a robust plan is tested at the pessimistic end of a stated uncertainty
          - quieting measures can trade acoustic benefit against equipment endurance
        takeaway: A robust choice still works when the margin you thought you had disappears.
        format: STRESS
        question: Which lineup survives when the two-hour schedule margin falls all the way to zero?
        stress:
          hint: The slider is time margin, not transit duration. Move it from two hours to zero. A lineup must remain feasible and still meet the 7 dB noise-reduction requirement.
          assumption:
            id: margin
            label: Time margin before the six-hour passage ceiling
            nominal: 2
            min: 0
            max: 2
            unit: h
            step: 0.05
          criteria:
            - id: quiet
              label: Radiated-noise reduction (needs ≥ 7 dB)
              operator: ">="
              target: 7
              unit: dB
              key: quiet
            - id: endurance
              label: Equipment endurance at the nominal transit
              operator: ">="
              target: 4
              unit: h
              key: endurance
          candidates:
            - id: max
              label: Maximum Quiet
            - id: balanced
              label: Balanced Quiet
            - id: conservative
              label: Conservative — 5 dB, short of the requirement
          robust: balanced
          optimiseOn: quiet
          feasible:
            max: 1
            balanced: 0
            conservative: 3
          scores:
            max:
              quiet: 12
              endurance: 5
            balanced:
              quiet: 8
              endurance: 8
            conservative:
              quiet: 5
              endurance: 20
        answerText: Balanced Quiet. It still meets the 7 dB acoustic requirement when the passage reaches six hours and the schedule margin is gone.
        why: A four-hour transit leaves two hours before the six-hour planning ceiling. Maximum Quiet looks best there because it cuts noise by 12 dB. But its equipment clock lasts only five hours, so it needs at least one hour of schedule margin. Balanced Quiet reaches the 7 dB requirement and lasts eight hours, so it still works with no margin left. Conservative lasts, but is too loud. Moving the margin changes the winner because uncertainty belongs inside the decision.
      - group: ATMO
        task: Put a deadline on the quiet
        title: How long one scrubber lasts
        place: Auxiliary Machinery & Bilge
        scene: With one scrubber train secured, the remaining train removes less carbon dioxide than the crew produces. Lindqvist wants the number of hours before the boat has to make a noise to fix that.
        assumes:
          - a net rate is what is produced minus what is removed
        takeaway: A slow problem with a known rate is a deadline, and a deadline can be planned around.
        format: BALLPARK
        question: How long can the boat run on one scrubber train?
        why: A closed atmosphere with a production rate and a removal rate has a net rate. Compare that net rate with the remaining headroom to get a deadline. Here the crew produces 1.4 cubic metres per hour while one train removes 1.1. The net rise is 0.3 cubic metres per hour. Six cubic metres of headroom therefore lasts about twenty hours. Command can plan around twenty hours. It cannot plan around “soon,” which is why a slow problem becomes useful once its rate is known.
        estimate:
          relationship: Time = the headroom left ÷ the net rate of gain, which is production minus removal.
          prompt: The crew makes more carbon dioxide than one train removes, and the limit is a rise of one per cent.
          question: Estimate how long until the boat reaches the limit.
          labels:
            - 1.4 m³/h  (crew production)
            - 1.1 m³/h  (one train removes)
            - 6.0 m³  (a one per cent rise, boat-wide)
            - 4 h  (the transit)
          values: [1.4, 1.1, 6, 4]
          slots: 3
          template: "{2} ÷ ({0} − {1})"
          formula: c/(a-b)
          correct: [0, 1, 2]
          target: 20
          tolerance: 2
          units: hours
          solution: The net gain is 0.3 m³/h; 6.0 ÷ 0.3 = 20 hours to the limit.
          explanation: Twenty hours against a four-hour transit is a comfortable margin, and knowing it is what makes securing the train a decision rather than a gamble. Had the answer been three hours, the same action would have been reckless.
      - group: SONAR
        task: Compute the passive-sonar signal-to-noise ratio and the margin above threshold.
        title: What silence buys, term by term
        place: Sonar Shack
        scene: After the quiet lineup, target source level is 145 dB and one-way transmission loss is 55 dB. Ambient noise is 85 dB, with 20 dB of array gain. The operator needs 10 dB signal-to-noise ratio for detection.
        assumes:
          - passive sonar receives a one-way signal from a source
          - array gain reduces the effective noise seen by a directional receiver
        takeaway: "Passive detection is a one-way budget: source level minus one transmission loss and effective noise, with array gain helping the receiver."
        format: BALLPARK
        question: How many decibels of detection margin does the current lineup have?
        answerText: 25 dB SNR, which is 15 dB above the 10 dB detection threshold.
        why: Passive sonar listens to a source rather than an echo, so transmission loss appears once and there is no target-strength term. The budget is SNR = SL − TL − (NL − AG). Here that is 145 − 55 − (85 − 20) = 25 dB. The operator needs 10 dB, so the signal excess is 15 dB. This is different from the active echo equation, which has two transmission-loss legs and a target-strength term. The distinction matters because the old equation badge was an active-sonar formula on a passive-sonar lesson.
        columns:
          - The term in the sonar equation
          - What it stands for
        scenarios:
          - Source level
          - Transmission loss
          - Noise level
          - Array gain
        choices:
          - How loud the thing being hunted is at its own hull.
          - What the sea takes out of the signal on the way here.
          - Everything else arriving at the same time, including our own machinery.
          - What listening with many elements at once recovers.
        mapping: [0, 1, 2, 3]
        rebuttals:
          - Source level belongs to the target, not to us; running quiet does not change it.
          - Transmission loss is set by the water and the geometry, and no decision on this boat alters it.
          - Array gain is what the array recovers, and it falls off when the array is not straight.
        estimate:
          prompt: SL = 145 dB, TL = 55 dB, NL = 85 dB, AG = 20 dB, and DT = 10 dB.
          question: Estimate the passive-sonar signal excess above threshold.
          relationship: SNR = SL − TL − (NL − AG). Signal excess = SNR − DT.
          explanation: Passive sonar has one propagation leg. Array gain lowers effective noise; target strength does not appear because there is no echo.
          solution: SNR = 145 − 55 − (85 − 20) = 25 dB. Signal excess = 25 − 10 = 15 dB.
          labels:
            - 145 dB  (SL)
            - 55 dB  (one-way TL)
            - 85 dB  (NL)
            - 20 dB  (AG)
            - 10 dB  (DT)
            - 8 dB  (target strength — an echo term, and this is a passive listen)
          values: [145, 55, 85, 20, 10, 8]
          correct: [0, 1, 2, 3, 4]
          slots: 5
          template: "{0} − {1} − ({2} − {3}) − {4}"
          formula: a - b - (c - d) - e
          target: 15
          tolerance: 1
          units: dB
  - title: Rig for Dive
    objective: Prove the boat is ready before the last patrol, rather than assuming it.
    briefing: |-
      The boat sails in an hour. Every check on the rig-for-dive list exists because somebody once did not do it, and each one proves a different thing.
    stake: Nineteenth day. The boat has been open to the surface since Tuesday for work on the mast and dives at dawn. The switchboard shows two breakers open from that work, the log says one was restored, and every valve on the rig sheet has signatures against it — including one from a man who was ashore that morning. This watch you work out what each checklist line is really asking, close the boat up in the right order, and decide what to do about a record that does not match. This is the cheapest hour of the patrol, and the last one before the sea decides.
    takeaway: A check is a measurement that proves a specific claim, not a box beside a word.
    stops:
      - group: DC
        task: Choose which two signed claims to verify physically before the boat dives.
        title: What the checklist is actually asking
        place: Forward Equipment & Handling
        scene: The rig-for-dive sheet has four signed claims. A hull valve operates; every bilge has a baseline; the drain pump builds pressure; both escape routes are clear. You have time to physically verify only two before the dive.
        assumes:
          - a signature records a claim made earlier
          - a physical verification can fail even when the record is signed
        takeaway: A signed record is evidence about what someone reported; it is not the same thing as the physical condition now.
        format: ATTEST
        question: Where should the two verification checks be spent?
        attest:
          hint: You can open each claim and see what evidence backs it. You have two checks. Spend them where a wrong present condition would matter most and the record does not already have current physical evidence.
          checks: 2
          claims:
            - id: valve
              label: Hull valve operates through full travel
              critical: true
              backed: false
              record: signed last week
              truth: one valve is stiff near shut
              evidence: operate through full travel
            - id: bilge
              label: Every bilge has a starting baseline
              critical: false
              backed: true
              record: levels logged this watch
              truth: baseline is current
              evidence: re-read all bilges
            - id: pump
              label: Drain pump builds discharge pressure
              critical: true
              backed: true
              record: pressure test passed this morning
              truth: pump is serviceable
              evidence: repeat closed-discharge test
            - id: escape
              label: Both escape routes are clear
              critical: true
              backed: false
              record: signed before stores were loaded
              truth: one route is narrowed by stores
              evidence: walk both routes
          correctChecks:
            - valve
            - escape
        answerText: Verify the hull valve through its travel and physically walk both escape routes. The pump pressure test and bilge baseline already have current backing.
        why: A checklist compresses work into claims, but not all claims deserve the same verification effort. The drain pump has a recent pressure test, and the bilge baseline has a current logged reading. The hull valve has only a signature from last week, while the escape route can be blocked by stores after the sheet is signed. Those two conditions can hurt immediately if they are wrong and neither has current physical backing. With only two checks, verify the critical unbacked claims rather than rechecking the best-documented items.
      - group: ATMO
        task: Line up the air before you need it
        title: Dampers before dive
        place: Auxiliary Machinery & Bilge
        scene: The ventilation has been open to the surface all week. Before diving, the boat has to be closed up and the internal air path lined up, and the order of those two things matters.
        assumes:
          - once the hull is sealed, the air aboard is the only air there is
        takeaway: The air path has to be proved before the boat is sealed, not after.
        format: SEQUENCE
        why: The internal air path should be lined up while the surface is still available. First, open the dampers that connect every compartment to the treatment plant. Next, start the scrubber and oxygen plant and prove they run. Then take handheld baseline readings, so later numbers have a trusted comparison. Only after those steps should the boat be shut off from outside air and dive. The order matters because every missed damper or failed plant becomes much harder to correct once the hull is sealed.
        rebuttals:
          - Line up the internal ventilation first. A damper missed now is a compartment outside the loop for weeks.
          - Start the plant and prove it works second, while the hatch is still open and a failure is only an embarrassment.
          - Take the baseline readings third. A number is only high compared with something, and this is that something.
          - Shut off from the surface and dive last. It is the step that makes everything before it permanent.
        cards:
          - Line up the internal ventilation so every compartment reaches the plant.
          - Start the scrubber and oxygen plant and prove they are working.
          - Take a handheld reading in each compartment as a starting baseline.
          - Shut the boat off from the surface and dive.
        order: [0, 1, 2, 3]
      - group: FIRE
        task: Prove the isolation you inherited
        title: What the last watch left open
        place: Electrical Distribution
        scene: The switchboard shows two breakers open from maintenance last week, but the log says one was restored. A work party is already collecting tools for that cable. Before they touch it, the chief asks you to settle which source deserves to be trusted.
        assumes:
          - a record and an indicator are both claims about a circuit
        takeaway: A document and a lamp both report what somebody expects, which is a weaker thing than a reading.
        format: CHOICE
        question: What settles the disagreement?
        why: A log records what somebody intended at the end of a watch. An indicator records what the switchboard believes about itself. Neither is touching the conductor the work party will handle. An inherited isolation can therefore be wrong even when both records look plausible. A meter is the source that directly tests the cable. Its result should then be written down. The next watch inherits a measured condition instead of another claim about what somebody thought had happened.
        choices:
          - Meter the circuits and record what you actually find.
          - Believe the log, because a person wrote it deliberately.
          - Believe the lamps, because they show the present state.
          - Close both breakers, since one of them is meant to be closed anyway.
        answer: Meter the circuits and record what you actually find.
        rebuttals:
          - A written record is a claim about the past, and the past is what is in dispute.
          - An indicator lamp has its own failure modes, which is why this check exists.
          - Closing a breaker to resolve an argument is how a fault gets energised.
  - title: Refit Decision
    objective: Choose what to improve before the last patrol, on evidence rather than preference.
    briefing: |-
      There is money and yard time for some of what the boat wants and not all of it. Every proposal has a cost, an uncertain benefit, and an effect on the patrol that follows.
    stake: "Twenty-first day, and the refit list goes off the boat in tomorrow's message window. The yard will fund one item. Haruki wants the cooling pump that has cost him two watches this patrol, Rask wants the mounts that would have prevented the noise line, Lindqvist wants a second scrubber train, and Whitfield wants to know which of them the next patrol is most likely to need. This watch you decide. The evidence is unglamorous: which failures cost real time, which are becoming more frequent, and what each fix would actually remove. Everyone in the room is arguing from what they remember, and nobody has opened the log."
    takeaway: An upgrade is worth what it changes about the decisions you will actually face.
    stops:
      - group: ENG
        task: Spend two yard slots across four refits and make sure the plan answers the patrol’s required capability questions.
        title: What the boat should buy
        place: Machinery Control Room
        scene: The yard can complete two major jobs. Pump isolators cut radiated power by 12 dB. An independent depth sounder adds a separate transducer and power path. Faster scrubber media adds air margin; a larger drain pump raises flood-removal rate. The patrol needs two capabilities most.
        assumes:
          - a finite yard slot spent on one refit cannot also be spent on another
          - the patrol has both a stealth requirement and an old-chart navigation risk
        takeaway: A resource plan is a set of questions it can answer and questions it deliberately leaves unanswered.
        format: ALLOCATE
        question: Which two refits make the patrol plan complete?
        allocate:
          hint: Each refit costs one yard slot. The panel shows which patrol questions your current pair can answer. You have only two slots, so a complete plan must deliberately leave some useful improvements undone.
          pool:
            amount: 2
            unit: yard slots
          items:
            - id: isolators
              label: Pump isolators
              cost: 1
            - id: sounder
              label: Independent depth sounder
              cost: 1
            - id: scrubber
              label: Faster scrubber media
              cost: 1
            - id: drain
              label: Larger drain pump
              cost: 1
          answers:
            - required: true
              requires:
                - isolators
              question: Can the boat cut its pump-dominated radiated signature for the constrained passage?
            - required: true
              requires:
                - sounder
              question: Can navigation obtain a depth measurement with an independent sensor and power path?
            - required: false
              requires:
                - scrubber
              question: Can the boat extend an already-long carbon-dioxide margin?
            - required: false
              requires:
                - drain
              question: Can the boat pump a severe flood faster after the source is attacked?
        answerText: Use the two yard slots on pump isolators and the independent depth sounder. Those are the two required mission capabilities; the scrubber and larger drain pump are useful but optional for this patrol.
        why: All four refits improve something, so asking which one is “best” hides the real decision. The patrol must reduce its pump-dominated acoustic signature. It also needs a depth measurement that can fail independently of the existing navigation chain. Faster scrubber media improves a margin that is already long. A larger drain pump helps a casualty in which stopping the source remains the binding action. With two yard slots, the complete plan is therefore pump isolation plus an independent depth sounder. Choosing either optional improvement gives up one required capability.
      - group: SONAR
        task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
        title: What twelve decibels is worth
        place: Sonar Shack
        scene: The yard quotes a 12 dB reduction in the boat’s radiated acoustic power level from new pump mounts. The wardroom has described that as “about a tenth quieter” and is weighing it against the other refits.
        assumes:
          - decibels here are being used for an acoustic power ratio
        takeaway: "A decibel difference is a logarithmic power ratio: 12 dB corresponds to about a sixteen-fold change in power."
        format: BALLPARK
        question: By what factor do the mounts reduce radiated power?
        answerText: A factor of about 15.85, usually rounded to sixteen; the new radiated power is about 6.3% of the old value.
        why: "For a power ratio, ΔL = 10 log₁₀(P₂/P₁). A 12 dB reduction means the original-to-new power ratio is 10^(12/10) ≈ 15.85. So the new radiated power is about 1/15.85, or 6.3 percent, of the old value. The common “3 dB is a doubling” shortcut gives nearly the same answer: four 3 dB steps are about a factor of sixteen. The exact logarithmic calculation is better here because the equation is what the course is supposed to teach."
        estimate:
          relationship: Reduction factor = 10^(ΔL/10) for a power-level difference in decibels.
          prompt: The mounts reduce radiated acoustic power level by 12 dB.
          question: By what factor is radiated power reduced?
          labels:
            - 12 dB  (level reduction)
            - 10  (power-ratio decibel divisor)
            - 15.85  (exact reduction factor)
            - 3 dB  (about a factor of two, for scale)
          values: [12, 3, 2, 10]
          slots: 3
          template: "{2} ^ ({0} ÷ {1})"
          formula: Math.pow(c, a/b)
          correct: [0, 1, 2]
          target: 16
          tolerance: 2
          units: × less power
          solution: 10^(12/10) = 10^1.2 ≈ 15.85, so the power is about sixteen times lower, or 6.3% of the original.
          explanation: A logarithmic level difference turns subtraction in decibels into a power ratio.
      - group: NAV
        task: Say what the second sounder is worth
        title: The value of a different failure
        place: Control Room
        scene: The proposed second sounder costs £2.4m and has its own transducer and power path. The existing depth display and its repeater both use one transducer, so those two readings can agree even if that shared source is wrong.
        assumes:
          - two displays sharing one sensor share that sensor’s failures
        takeaway: Redundancy is valuable when the backup has a different failure path, not merely another display.
        format: CHOICE
        question: What does the independent second sounder actually buy?
        why: Two displays fed by one transducer are not two independent measurements. They can agree perfectly while sharing the same sensor error, power fault or calibration problem. A second sounder with its own transducer and power path adds a genuinely different failure mode. It does not make either instrument more precise. It also does not guarantee the chart is right. It gives command a second physical measurement that can disagree for a meaningful reason. That is how a bad shared source gets detected instead of repeated.
        choices:
          - A measurement that cannot fail the way the plot fails.
          - A more precise depth, which improves the plot's accuracy.
          - A backup for when the first sounder is broken, and nothing more.
          - Confirmation of the existing sounder, which builds confidence.
        answer: A measurement that cannot fail the way the plot fails.
        rebuttals:
          - Precision is not the problem; the plot has been precisely wrong before.
          - It is a backup too, but that is not what makes it worth the money.
          - Confirmation from a source that fails the same way is not confirmation.
  - title: Deep Watch
    objective: Run the whole boat at once, with everything degraded a little and nothing decided for you.
    briefing: |-
      An uncertain contact, a plot four hours old, water in the forward bilge, a scrubber train down and a bearing running warm. None of them is an emergency. Together they are the patrol.
    stake: Twenty-second day, the last full watch of the patrol, and everything is degraded a little. A contact Rask has not resolved. A plot Sowande has not been able to fix since the forenoon. A machine Haruki has not looked at since Tuesday. Whitfield is in the wardroom with the corpsman and a fractured wrist of his own, so the officer you would have handed half of this to is not available. This watch you decide the order everything gets worked in, and you do it while it is happening. Nobody will tell you which problem is the important one. Getting that ranking right is the job, and it is the only part of it that cannot be delegated.
    takeaway: Command is choosing which uncertainty you can live with, and saying so out loud.
    stops:
      - group: NAV
        task: What is the first thing that has to change?
        title: Five small problems
        place: Control Room
        scene: Nothing on the board is red. The plot is four hours old, the contact is faint, the forward bilge is wet, one scrubber train is down, and a bearing is warm. The constrained passage is still ahead, and Whitfield asks what changes first.
        assumes:
          - trend and time-to-limit matter more than whether a reading merely looks abnormal
        takeaway: A set of small problems can be worse than a big one, because none of them demands attention.
        format: CHOICE
        why: Five small problems compete for attention, but they do not age at the same rate. The old plot gets more dangerous as constrained water approaches. The faint contact needs time to develop geometry. A wet bilge matters if its level is changing. One scrubber train down is a deadline if carbon dioxide is rising. A warm bearing matters if its cooling margin is shrinking. The first move should change the condition whose uncertainty or consequence is growing fastest, then give the others owners and return thresholds.
        rebuttals:
          - The unresolved contact may be nothing, and it can be held and watched while something else is fixed.
          - A wet bilge that is not rising is a note in the log. It becomes a casualty when the level moves.
          - Carbon dioxide at 0.7 per cent rising slowly has twenty hours of margin behind it and is measured continuously.
          - A bearing at a steady sixty-eight degrees is a watch item. Steady is the word that matters.
        headline: Nothing on the board is red, and the boat is an hour from a passage it cannot take twice.
        readings:
          - zone: Plot
            label: Age of position
            value: 4 h
            status: alarm
          - zone: Sonar
            label: Contact
            value: faint, unresolved
            status: high
          - zone: DC
            label: Forward bilge
            value: wet, not rising
            status: normal
          - zone: Atmosphere
            label: CO₂
            value: 0.7 %, slowly rising
            status: normal
          - zone: Plant
            label: Bearing temperature
            value: 68 °C, steady
            status: normal
        choices:
          - label: The age of the position
            mechanism: Everything else is stable and measured; the plot is the only thing getting worse on its own, and the passage depends on it.
          - label: The unresolved contact
            mechanism: A faint contact that may be nothing, and can be watched while something else is fixed.
          - label: The wet bilge
            mechanism: Water that is not rising, which is a note in the log rather than a casualty.
          - label: The carbon dioxide
            mechanism: A slow rise with twenty hours of margin behind it.
          - label: The warm bearing
            mechanism: A steady temperature, which is a watch item and not a fault.
        answer: The age of the position
      - group: DC
        task: Match each item to the assignment that fits it.
        title: Everything you are not doing yourself
        place: Forward Equipment & Handling
        scene: You keep the degraded plot yourself while four other problems remain open. Whitfield stands beside the watch bill with names ready, but nobody is assigned yet. This is the last watch of the patrol, and the handoff has to work without you hovering.
        assumes:
          - an instruction has to be actable by the person who receives it
        takeaway: An assignment that names a threshold can be acted on alone; one that says watch it cannot.
        format: PROTOCOL
        why: A useful assignment lets the other person act without guessing what you meant. It names an owner, a first action and a condition for reporting back. For the bilge, log the level and report a change. For the contact, hold it long enough to obtain bearing rate. For the scrubber, restore it or name the deadline. For the warm bearing, restore cooling and state the acoustic cost. “Watch it” sounds responsible, but it gives no one a decision point and leaves every problem attached to you.
        columns:
          - What is going on elsewhere
          - What you ask for
        rebuttals:
          - A bilge that is wet and not rising needs a level logged every ten minutes and a change reported — a change, not a number, because the number means nothing on its own.
          - An unresolved contact needs holding for a bearing rate, and a report before it resolves. Waiting until it is certain wastes the geometry.
          - A scrubber train that is down needs restoring, or an hour named at which the air stops being optional. That hour is what command plans around.
          - A warm bearing needs the second cooling pump back, and the acoustic cost said out loud — because that cost is the reason it was secured.
        scenarios:
          - The forward bilge, wet but not rising.
          - The faint contact nobody has resolved.
          - The scrubber train that is down.
          - The bearing running warm.
        choices:
          - Log the level every ten minutes and report a change, not a number.
          - Hold it and get a bearing rate, and report before it resolves rather than after.
          - Restore it, or name the hour at which the air stops being optional.
          - Restore the second cooling pump, and say what that costs acoustically.
        mapping: [0, 1, 2, 3]
      - group: SONAR
        task: Calculate the beat frequency from the two spectral lines.
        title: Why the level pulses three times a second
        place: Sonar Shack
        scene: Two narrowband components sit at 147 and 150 hertz on the same bearing. In seawater the sound speed is about 1500 metres per second. The audio level swells and fades regularly while both spectral lines themselves remain steady.
        assumes:
          - waves add when they arrive together
          - sound speed is approximately the same for these two nearby frequencies
        takeaway: Two nearby frequencies beat at their difference frequency because their relative phase cycles steadily.
        format: BALLPARK
        question: How many amplitude swells per second should the two tones produce?
        answerText: 3 beats per second. The corresponding wavelengths are about 10.20 m and 10.00 m.
        why: "The beat frequency is fbeat = |f₁ − f₂|, so 150 − 147 = 3 Hz: three amplitude swells each second. The wave relation v = fλ also gives different wavelengths in the same water: about 1500/147 = 10.20 m and 1500/150 = 10.00 m. Because the two wave patterns advance with slightly different phase rates, they repeatedly line up and oppose each other. The pulsing is therefore interference between close-frequency components, not a third spectral line or a changing shaft speed."
        choices:
          - Two sources beating, at the difference of their frequencies.
          - One source whose speed is changing three times a second.
          - A fault in the display, since two steady lines cannot pulse.
          - The boat's own machinery, aliased into the band.
        answer: Two sources beating, at the difference of their frequencies.
        rebuttals:
          - A speed change moves a line's frequency. It does not make the level rise and fall on a fixed period.
          - Two steady lines pulsing is what interference sounds like; the display is showing the frequencies, not the sum.
          - Our own machinery would appear on every bearing. These two lines are on one.
        estimate:
          prompt: Two tones are 147 Hz and 150 Hz in water where v ≈ 1500 m/s.
          question: Estimate the beat frequency.
          relationship: fbeat = |f₁ − f₂|.
          explanation: Only the two frequencies set the beat rate. Sound speed is useful later for wavelength, but not for this subtraction.
          solution: fbeat = |150−147| = 3 Hz. As a follow-on, λ147 ≈ 10.20 m and λ150 = 10.00 m.
          labels:
            - 147 Hz  (first tone)
            - 150 Hz  (second tone)
            - 1500 m/s  (sound speed, not needed for beat rate)
          values: [147, 150, 1500]
          correct: [1, 0]
          slots: 2
          template: "{0} − {1}"
          formula: a - b
          target: 3
          tolerance: 0.25
          units: Hz
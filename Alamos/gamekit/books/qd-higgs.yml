copy:
  CHART: <p>The theory wall, first door on the west side. The Standard Model painted floor to ceiling, one slot on it empty, and a sentence underneath that has been rewritten nine times.</p>
  EVENT: <p>The event display room, across the corridor and dark. Two large screens, a cylindrical detector drawn on each, and nothing on either of them labelled.</p>
  HIST: <p>The histogram room, further down the east side. Binned distributions on the long wall, a masking strip over the search window, and sixteen candidate background shapes in a folder.</p>
  STATS: <p>The combination room at the far end of the west side. Both channels on one screen, a whiteboard of drafted sentences, and the only telephone in the building that rings.</p>
  PORCH: <p>The entrance desk. Badges, a signing-in book that doubles as the fire roll, and a screen showing how many collisions have been recorded today.</p>
  TEA: <p>The coffee area halfway down the west side. A machine, eight chairs, and a printout of the beam schedule that everybody reads and nobody trusts.</p>
  DARK: <p>The calibration bay, next to the event display. Test pulses, known-energy sources, and the tables that turn electronics counts into GeV.</p>
  RACK: <p>The computing store at the end of the west side. Tape cartridges by run number, spare disks, and the boxes the last processing pass came back in.</p>
  LIB: <p>The reading room at the far end. Preprints, two decades of conference proceedings, and the only quiet on the floor.</p>

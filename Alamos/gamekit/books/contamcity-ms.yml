# The areas of study. One column of the game each; every group needs somebody on the roster.
groups:
  - id: IDENT
    code: IDENT
    name: Molecular Identification
    color: "#7a4fa3"
    difficulty: 4
    type: protocol
    desc: Composition, charge, separation and spectra — what the material in the containers actually is.
    defaultLeader: okonjo
    budget: 76
    milestones:
      - name: Build the provisional identity list
        cost: 14
        work: 11
        brief: Establish what this area can measure, and what it cannot.
      - name: Separate the mixture before naming it
        cost: 20
        work: 15
        brief: Connect the measurements to a mechanism the team can act on.
      - name: Confirm identity with independent methods
        cost: 26
        work: 19
        brief: Confirm it with evidence that could have failed independently.
      - name: Release a confidence-ranked identity dossier
        cost: 32
        work: 23
        brief: Hand the conclusion, and its remaining uncertainty, to City Command.
    issues:
      - Two analytical methods agree, but both depend on the same reference standard.
      - A chromatogram peak was assigned to one compound before the spectra were read.
      - A container label uses a common name with no composition or concentration.
  - id: GASES
    code: GASES
    name: Atmosphere & Gases
    color: "#2f7fa8"
    difficulty: 4
    type: ballpark
    desc: Gas laws, plume behaviour, photochemistry — how the release moves and changes in air.
    defaultLeader: varga
    budget: 74
    milestones:

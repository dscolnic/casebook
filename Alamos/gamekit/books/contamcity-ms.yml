  - title: What Dissolved in the River?
    objective: Predict where each chemical class will be found and design a mass-balance sampling plan.
    briefing: Runoff from the accident enters the river. Some compounds remain in surface films, some dissolve, and others bind to sediment. The player must predict partitioning from molecular interactions and verify it with sampling. If the team samples only water, a persistent sediment reservoir may be missed until it re-enters the water supply.
    stake: "Day three. Runoff reached the river overnight, and the town takes its drinking water out nine hundred metres downstream. Inês Ferreira, the water & sediment lead, has been out since four and wants it sampled properly. Today you decide where to sample, in what order, and whether to test the mud as well as the water. Test only the water and it comes back clean, and it honestly is clean today. The next flood stirs that mud back up."
    takeaway: Predict where each chemical class will be found and design a mass-balance sampling plan.
    stops:
      - group: WATER
        task: Match each kind of chemical to where it ends up.
        title: Where will it go?
        place: River Sampling Boat
        scene: Runoff from the fire has reached the river. Ferreira holds the sampling boat at the first bend. Predict the wrong place and she samples the wrong thing, and a clean water result gets read by the city as an all-clear.
        guide: >-
          Four kinds of chemical, and four places in the river. Pair them by asking what
          water does with each one. Does it dissolve? Does it refuse to mix? Does it
          stick to the specks? A chemical that leaves the water has not left the river.
          Sample the wrong place and the city hears an all-clear.
        background:
          - >-
              Why you match instead of choosing. A response that is right for one situation
              is often nearly right for the next one. Picking from a list lets you take the
              nearly-right answer and never notice. Matching makes you say which situation
              it fits best, and that comparison is the whole point.
          - >-
              How to use the one-each rule. Every response goes somewhere, and nowhere
              twice. So the situations you are sure about are worth more than themselves:
              each one you settle leaves fewer responses for the ones you are not sure
              about. Two lines you trust can decide the other two for you.
          - >-
              Why one wrong line is impossible. If three lines are right, the fourth
              response has nowhere else to go, so it is right too. Being wrong always means
              at least two are wrong at once. If a join feels forced, the mistake is
              probably not in that join — it is in one you already made and stopped
              questioning.
        assumes:
          - some things dissolve in water and some refuse to mix with it
        takeaway: Not finding something in the water does not mean it is not in the river.
        format: PROTOCOL
        answerText: 1. Small ionic species in water. → Often dissolves as hydrated ions. 2. Nonpolar organic liquid that barely mixes with water. → May form a separate phase or surface film. 3. Polar neutral molecule capable of hydrogen bonding. → Often has appreciable water solubility. 4. Water-avoiding compound that sticks strongly to organic-rich sediment. → May concentrate in suspended particles or sediment.
        why: Where a chemical goes follows from what it is like. Some dissolve straight into water and travel with it. Some refuse to mix at all, and sit on top as a film or sink underneath as a layer. And some stick hard to the specks of dirt floating in the water, ride those specks down, and end up in the mud. That last kind is the dangerous case for testing, because the water can come back clean while the river bed holds all of it.
        call: Where will the chemical go?
        setup: Match each molecular feature to the most likely environmental behavior.
        story: "Runoff from the accident has reached the river. A chemical released into water does not stay in one place or one phase: polar molecules dissolve readily, non-polar ones partition onto organic carbon in sediment and stay there, volatile ones leave for the atmosphere, and surface-active ones concentrate in the film on top. All of that follows from molecular structure — polarity, hydrogen bonding, and how the compound interacts with water compared with everything else on offer. If you predict the wrong phase you will sample the wrong thing, and a clean water result will be read by the city as an all-clear."
        rebuttals:
          - Something that dissolves easily spreads through the water and goes wherever the water goes.
          - An oily liquid barely mixes at all. It makes its own layer, often a film on top.
          - Something that mixes the way sugar does dissolves well and travels with the water.
          - Something that sticks to dirt leaves the water with the dirt, and the dirt settles on the bottom.
        columns:
          - What kind of chemical it is
          - Where it ends up
        scenarios:
          - Something that dissolves easily in water.
          - An oily liquid that will not mix with water.
          - Something that sticks hard to specks of dirt in the water.
        choices:
          - Spread right through the water, travelling with it.
          - Sits as a separate layer or a film on the surface.
          - Rides the specks down, and ends up in the mud.
        mapping: [0, 1, 2]

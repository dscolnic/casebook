              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - what a molecule is made of decides what it weighs
        takeaway: When two answers fit, use a measurement that depends on something they differ in.
        format: CHOICE
        question: Two candidates, differing by one oxygen. What settles it?
        answerText: Weigh them. One oxygen is sixteen units, which is far more than the instrument that weighs molecules can miss.
        why: "The two fit the first test equally well, so nothing about that test can choose. What they do differ in is weight: one oxygen atom is sixteen units, and there is an instrument here that weighs molecules directly. Sixteen units is an enormous difference to that instrument. The order things come out in follows chemistry rather than weight, and how big the peak is follows how much there is. Neither says which substance it is."
        call: A borderline result
        rebuttals:
          - What comes out first follows chemistry rather than weight. Heavier things sometimes come out earlier.
          - How big a peak is depends on how much there is, and on the substance. It says nothing about which one.
          - Sixteen units apart is easy for an instrument that weighs molecules. That is exactly the tie it is built to break.
        choices:
          - The weight of the molecule, which differs by sixteen between them.
          - The order it came out in, heavier ones later.
          - How big the peak is, since the heavier one gives more signal.
          - Neither, because they are the same kind of substance.
        answer: The weight of the molecule, which differs by sixteen between them.
      - group: QUANT
        task: Match each weakness in the evidence to what would close it.
        title: Close the gaps before release
        concept: "A blank and a standard: how a laboratory knows a number is real"
        place: Water Distribution Network
        scene: A number can be perfectly correct and still answer the wrong question. Nakamura is going through the evidence line by line. The pipes are about to be brought back up to pressure on the strength of it.
        guide: >-
          The left side is four separate holes in the evidence. Each has its own fix.
          Pair them by asking what was not tested. Sampling at the plant leaves the taps
          untested. Running the tap first tests water nobody drinks. A machine that
          cannot see the limit cannot test it.
        background:
          - >-
              Why you match instead of choosing. A response that is right for one situation
              is often nearly right for the next one. Picking from a list lets you take the
              nearly-right answer and never notice. Matching makes you say which situation
              it fits best, and that comparison is the whole point.
          - >-
              How to use the one-each rule. Every response goes somewhere, and nowhere
              twice. So the situations you are sure about are worth more than themselves:
              each one you settle leaves fewer responses for the ones you are not sure
              about. Two lines you trust can decide the other two for you.
          - >-
              Why one wrong line is impossible. If three lines are right, the fourth
              response has nowhere else to go, so it is right too. Being wrong always means
              at least two are wrong at once. If a join feels forced, the mistake is
              probably not in that join — it is in one you already made and stopped
              questioning.
        assumes:
          - a sample tells you about the place and the moment it was taken
        takeaway: A correct number is only useful if the sample it came from matches the decision.
        format: PROTOCOL
        answerText: 1. Only the water leaving the treatment plant was sampled. → Sample representative endpoints and vulnerable zones. 2. Samples from the pipe network were collected after long flushing. → Document flushing and sample under realistic use conditions. 3. The method detection limit exceeds the release limit. → Use a more sensitive validated method. 4. The same laboratory tuned the treatment and then checked the final results. → Add an independent check or review.
        why: Each of these is a different kind of gap and none of the fixes swaps for another. Sampling only where the water leaves the plant misses the taps people drink from. Sampling after running the tap for ages measures water nobody receives. An instrument that cannot see below the limit cannot test the limit. And one laboratory that both fixed the water and checked the water has marked its own homework, which no amount of good chemistry corrects.
        call: Close the verification gaps
        setup: Match each weakness to the needed evidence.
        story: "A number can be perfectly valid and still fail to answer the question that was asked. Verification has three separate weak points: whether the samples represent the exposure people will actually receive, whether the method's detection limit is low enough to test the standard at all, and whether what was measured is the compound the standard is about. Each weakness has its own remedy and they do not substitute for one another. The distribution network is about to be brought back up to pressure on the strength of this evidence package."
        rebuttals:
          - Sampling where the water leaves the plant misses the taps where people drink. Sample where the exposure happens.
          - Water sampled after a long run is water nobody receives. Record the running, and sample realistically.
          - A machine that bottoms out above the legal line cannot test it. That takes a more sensitive one.
          - One laboratory doing both jobs has marked its own homework. That gap closes with an independent check.
        columns:
          - The gap in the evidence
          - How you close it
        scenarios:
          - Only the water leaving the plant was sampled.
          - Nothing the machine reports can fall under the legal line.
          - One laboratory both fixed the water and checked it.
        choices:
          - Sample at the taps people actually drink from.
          - Get a machine sensitive enough to test the standard.
          - Get somebody independent to check it.
        mapping: [0, 1, 2]
      - group: QUANT
        task: Move and narrow the band, and say whether the valves can open.
        title: Open, hold, or open with conditions
        place: Independent Review Board
        scene: The pumps are idle while the board meets. The result is nine against a limit of ten, give or take two. Reyes has operators waiting at the valves, and the city has already been given two different reopening times.
        guide: >-
          The band on screen is every result the test allows, not just the best guess.
          It is nine against a limit of ten, give or take two, so part of the band is
          over the limit. Two pieces of follow-up work are ready. Each one does
          something different to the band, so watch its middle and its width separately.
          Apply what you would authorise, then say whether the rule is met.
        background:
          - >-
              What the band means. A number with a give-or-take on it stands for a range.
              Any value inside that range fits what was measured. The board is not asking
              whether the middle is under the limit. It is asking whether being over the
              limit has been ruled out.
          - >-
              Moving the middle is not the same as narrowing. A rerun that finds a mistake
              moves where the band sits. The band stays just as wide. Only new information
              makes it narrower: more samples, a better method, a second measurement. Both
              kinds of work are useful, and only one of them can clear a limit the width is
              crossing.
          - >-
              Why it matters here. The pumps are off and the city has already been told two
              different times. If the decision is made on the middle alone, the water goes
              back on with a real chance of being over the limit. The second apology costs
              more than the first.
        assumes:
          - the band shown is the doubt that this decision has to live with
          - a middle below a limit is not a pass if the band crosses it
        takeaway: Moving the middle and narrowing the band are different moves, and a boundary needs both.
        format: CLOUD
        question: Can the whole band be brought under the limit, or only its middle? Move the bars to show the middle and one sigma either side.
        cloud:
          unit: units
          strict: true
          hint: Apply the available follow-up evidence and watch both the centre and the width. The release criterion is cleared only when the entire displayed band lies below the boundary.
          actions:
            - id: independent
              label: Independent laboratory rerun
              effect: shift
              amount: 0.03333333333333333
            - id: representative
              label: Representative endpoint sampling
              narrowBy: 1
              effect: narrow
              amount: 0.5
          pass: 0.95
          centre: 9
          spread: 1
          bounds:
            min: -16
            max: 10
        answerText: Neither move is enough alone. Do both, and the band becomes 8.6 give or take one, with its top edge at 9.6.
        why: Nine against a limit of ten looks like a pass until the band is drawn. Give or take two means the honest range runs up to eleven, and eleven is over. A rerun can move the middle without proving the band was too wide. Better sampling can narrow the band without moving the middle. Neither alone gets the top of the band under ten. Both together give 8.6 with a band of one, and a top edge of 9.6.
        call: Approve, condition, or hold
        setup: The verification result is 9 units against a limit of 10, plus or minus 2. What does the board decide?
        story: The review board's decision is not binary, and treating it as though it were is how emergencies end badly in both directions — a premature release exposes the city, an indefinite hold deprives hospitals and homes of water they need now. A conditional approval with monitoring, staged reopening and defined triggers is a way of acting under uncertainty without pretending it has been resolved. What the board decides has to be defensible to a city that has been told several things already.
  - title: Reopen the City
    objective: Deliver a claim-by-claim chemical evidence package and a long-term monitoring plan.
    briefing: The final board must explain what was released, how chemicals moved and changed, which treatments worked, and what contamination remains in solids, infrastructure, and ecosystems. Without a complete fate and uncertainty record, the city cannot know whether the emergency is over or merely hidden.
    stake: "Day fifty-two. The mayor wants one word tonight, and Sipho Mbeki has to put it on a screen behind him. Behind that word sits seven weeks of work, and not all of it is equally solid. Elena Stavros, the long-term monitoring officer, wants the long-term monitoring paid for before the emergency money closes on Friday. Nobody else has mentioned it. Today you take the claims one at a time, and decide what the city keeps paying for."
    takeaway: Deliver a claim-by-claim chemical evidence package and a long-term monitoring plan.
    stops:
      - group: TREAT
        task: Match each state of the evidence to what should be done with it.
        title: What each claim has earned
        concept: Saying what you know and how well you know it
        place: Scientific Review Hall
        scene: The city wants one sentence, and Mbeki has to put it on a screen tonight. The chemistry does not support one. Turning all of it into a single green light is how a place gets reopened above a problem nobody wrote down.
        guide: >-
          The evidence is in four different states at once. Each state needs a different
          sentence. Ask what would have to happen for each one to be settled. Another
          method? A way to measure it? More money? A trigger? Collapsing four states
          into one is how the sentence stops being true.
        background:
          - >-
              Why you match instead of choosing. A response that is right for one situation
              is often nearly right for the next one. Picking from a list lets you take the
              nearly-right answer and never notice. Matching makes you say which situation
              it fits best, and that comparison is the whole point.
          - >-
              How to use the one-each rule. Every response goes somewhere, and nowhere
              twice. So the situations you are sure about are worth more than themselves:
              each one you settle leaves fewer responses for the ones you are not sure
              about. Two lines you trust can decide the other two for you.
          - >-
              Why one wrong line is impossible. If three lines are right, the fourth
              response has nowhere else to go, so it is right too. Being wrong always means
              at least two are wrong at once. If a join feels forced, the mistake is
              probably not in that join — it is in one you already made and stopped
              questioning.
        assumes:
          - evidence comes in strengths, and a claim is only as strong as the weakest step under it
        takeaway: Readiness is claim by claim. There is no single green light.
        format: PROTOCOL
        answerText: 1. Identity confirmed by independent methods and controls. → Treat identity as established with documented methods. 2. A transformation product is plausible but lacks a validated standard. → Label provisional and continue method development. 3. Filtered water meets criteria, but sediment remains contaminated. → Keep managing the sediment, and keep watching for the metal coming back. 4. Pipeline corrosion is controlled only while chemistry remains within a narrow range. → Use conditional operation with chemistry and corrosion triggers.
        why: At the end of this, the evidence sits in four states, and each needs a different sentence. Something confirmed two separate ways can be written down as settled. Something likely, with no way to measure it yet, is provisional, and saying so keeps the record honest. Clean water above dirty mud is being managed rather than solved. And corrosion held inside a narrow window is a condition.
        call: Disposition the final chemical claims
        setup: Match each evidence state to the correct recommendation.
        story: "The city wants one sentence and the chemistry does not support one. At the end of a release the evidence is in several different states at once: some claims are established and can be closed, some are unresolved and need work, some are managed by a control that has to keep being funded, and some are simply unknown. Each of those calls for a different recommendation, and collapsing them into a single green light is how a site gets reoccupied above a problem nobody wrote down."
        rebuttals:
          - Confirmed two ways with checks is the strongest claim here. Write down the methods and treat it as settled.
          - Something likely with no way to measure it cannot be quantified yet. Say so, and keep developing the method.
          - Clean water over dirty mud is a managed situation rather than a solved one, and the managing is what has to continue.
          - Corrosion held inside a narrow window is conditional. The condition needs triggers, or it is just a hope.
        columns:
          - What the evidence supports
          - What you do with it
        scenarios:
          - Confirmed by two separate methods, with checks.
          - Likely, and there is no way to measure it yet.
          - The water passes, and the mud is still contaminated.
        choices:
          - Write it down as settled, with the methods.
          - Call it provisional, and keep working on how to measure it.
          - Keep managing the mud, and keep watching for it coming back.
        mapping: [0, 1, 2]
      - group: TREAT
        task: Compare what the cell removed with what it should have removed.
        title: Did the cell do what it should?
        concept: Measuring the same thing several times, and averaging
        place: Treatment Plant Gallery
        scene: Osei's polishing cell ran for six hours. From the current it drew, it should have taken out about four and a half kilograms of metal. The water figures say it took out three and a half.
        guide: >-
          Four numbers. Two are the current and the hours, and they were used to work
          out the most it could remove. That work is already done. Ask which two numbers
          the comparison needs. A share compares what happened with what was possible.
          Nothing above a hundred per cent is possible.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - the electricity a cell uses sets the most metal it could possibly remove
        takeaway: Comparing what happened with what should have happened is how a claim gets checked.
        format: BALLPARK
        question: What share of the possible removal did the cell actually manage?
        answerText: About 80 per cent of what the electricity allowed. Anything over a hundred would mean a measurement was wrong.
        why: "The electricity going into a cell sets a ceiling. It cannot take out more metal than the current allows, however good it is. So the check is simple: what it actually removed, against what it could have. Three and a half out of four and a half is about eighty per cent, which is a real cell doing well. A figure over a hundred would mean the water measurements are wrong, or somebody has mixed up which tank they came from."
        call: Audit the electrochemical removal from the charge passed
        rebuttals:
          - Concentration affects the rate and the efficiency; the charge is what limits the total.
          - One electron deposits one atom only for a singly charged ion. A divalent ion needs two.
          - The ion's charge is exactly what converts moles of electrons into moles of metal.
        choices:
          - The charge passed sets an upper bound on the moles deposited, through the electrons each ion needs.
          - Nothing. How much metal plates out depends on concentration only, and the current does not matter.
          - It fixes the mass exactly, because every electron deposits one atom of metal.
          - It fixes the mass exactly, and the ion's charge does not enter the calculation.
        answer: The charge passed sets an upper bound on the moles deposited, through the electrons each ion needs.
        estimate:
          prompt: The current the cell drew allows at most 4.5 kilograms of metal to be removed. The water figures say 3.6 kilograms came out.
          question: What share of the possible removal did the cell manage?
          relationship: Share = what it removed ÷ what it could have removed × 100.
          explanation: Divide the actual by the possible, not the other way round. Upside down gives 125 per cent, which would be a cell removing more metal than the electricity allows.
          solution: 3.6 ÷ 4.5, times a hundred, is 80 per cent.
          givens:
            - I = 40 A
            - t = 6.0 h = 21,600 s
            - z = 2 electrons per metal ion
            - F = 96,485 C/mol e⁻
          labels:
            - 3.6 kg (what it actually removed)
            - 4.5 kg (the most it could have)
            - 40 A (the current it drew)
            - 6 hours (how long it ran)
          values: [3.6, 4.5, 40, 6]
          slots: 2
          template: "{0} ÷ {1} × 100"
          formula: a/b*100
          correct: [0, 1]
          target: 80
          tolerance: 5
          units: "%"
        setup: Use the electrical log to set a theoretical ceiling before trusting the water analysis.
      - group: TREAT
        task: Say what the city should keep paying for.
        title: What the city keeps
        place: Long-Term Monitoring Office
        scene: The temporary laboratory is being packed up as the emergency money ends. The plant is running. The mud still holds about seventy-one kilograms. Stavros has funding for one monitoring station after next month.
        guide: >-
          All four options are fair uses of the last money. They protect different
          things. Ask what nobody would notice if it were not funded. Seventy-one
          kilograms are still in the mud. None of it was destroyed. It went quiet. What
          lasts after a spill is the part that went quiet.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - falling below a limit is not the same as being gone
        takeaway: What outlasts an emergency is the part that went quiet, not the part that stopped.
        format: CHOICE
        question: The emergency money is about to move elsewhere. What does the city keep?
        answerText: Keep the monitoring, across water, mud and air. It is the only thing that would notice any of this coming back.
        why: Nothing here was destroyed. Seventy-one kilograms are in the mud, twenty were never accounted for, and something new is still being worked out. All of it is below a limit rather than gone. Watching the water, the mud and the air is the only thing on this list that would notice any of it coming back. Corrosion control protects the pipes, which is a different problem. Keeping the records costs almost nothing and should happen anyway.
        call: Fund the chemical legacy
        setup: The emergency money is about to move elsewhere. What does the city keep?
        story: The immediate emergency is over and the money is about to move somewhere else. What outlasts a release is the contamination that fell below a threshold rather than disappearing, the sediment and infrastructure holding it, and the institutional memory of how any of this was measured. Long-term monitoring, resilient treatment and preserved methods are what convert 15 days of crisis work into capacity the city keeps. What the city keeps is what will still matter when nobody remembers the fire.
        rebuttals:
          - Corrosion control protects the pipes, and the pipes are a different hazard from the seventy-one kilograms in the mud.
          - Open records and reference samples preserve the method, cost very little, and should happen whatever this budget does.
          - Closing the records destroys the only account of how any of it was measured, and the next city starts from nothing.
        choices:
          - Long-term monitoring of the water, the mud and the air.
          - Corrosion control, and making the plant more robust.
          - Open records, reference samples and written methods.
          - Nothing. The records can close once the review is out.
        answer: Long-term monitoring of the water, the mud and the air.
# What each place says when the player reads it.
# --------------------------------------------------------------- the warm-ups
warmups:
  greet:
    title: Six offices in one city, and nobody has met
    why: >-
      The city laboratory, the water company and the health office all take part of this job.
      By Friday one of them has to sign for another's number. Put a name to as many of them as you can now,
      because a signature you cannot picture is one you check twice.
  trial-near:
    title: Walk the river bank before you take a sample
    why: >-
      The city sits along the river, and every sample means something different depending on
      where the water was standing. Walk the near bank once. A map does not show you which
      outfall is above which bridge.
  follow:
    title: Adeyemi walks a bottle from the bank to the bench
    why: >-
      A water sample is taken, cooled, carried and logged before anybody measures it. Adeyemi
      walks one the whole way. Stay with her, and watch how long the bottle spends warm in the
      van.
  hunt:
    title: Six sampling points, and four have markers
    item: { name: sampling point, plural: sampling points }
    why: >-
      Every point on the river has to be found again next month or the numbers cannot be
      compared. Two markers are gone. A point nobody can find twice is a point that measures
      nothing.
  canvass:
    title: Which streets are drinking the tap water
    why: >-
      The exposure estimate assumes people stopped using the tap when they were told. Ask along
      the streets until enough answers have come back to say who stopped and who never got the
      notice.
  evade:
    title: The builder who wants a clean result today
    why: >-
      He has been outside the office since eight wanting the site declared clear. Nothing is
      declared anywhere except on the form, and the second run is not back. Keep clear of him
      and get your round done.
  tag:
    title: Catch Okoye before the machine starts
    why: >-
      Okoye has the list that says which bottles were blanks. Once the machine starts it runs
      for four hours. Without that list this morning's readings are numbers with no way to tell
      a real one from a clean one.

copy:
  WATER: <b>Water Intake Laboratory</b> — The drinking-water intake and the bench beside it. Polarity and intermolecular forces decide what dissolves, what floats as a surface film and what binds to sediment; pH and buffering decide how far a correction actually moves. What this room cannot tell you is where the contaminant went once it left the water column — that answer is in the mud, and it is measured somewhere else.
  GASES: "<b>Air &amp; Plume Station</b> — Mast, sondes and the gas bench. The ideal gas law gives an honest sense of scale: how much volume a release occupies at ambient temperature and pressure. It says nothing about where the material goes. Wind, turbulence, terrain and buoyancy do that, and they change while you are calculating."
  IDENT: <b>Molecular Identification Lab</b> — Chromatography, spectroscopy and the reference library. Separation tells you how many things are present; spectra tell you what they might be. Neither is sufficient alone, and one peak is not automatically one compound. Identity is an evidence package assembled from records, separation and structure together.
  QUANT: <b>Quantitative Analysis &amp; Quality Assurance</b> — Calibration curves, blanks, reference samples and the desk that decides whether a number counts as a result. Dilution, path length and whatever else is in the sample all sit between a signal and a concentration. A measurement without an uncertainty is not yet evidence for a decision.
  ENERGY: <b>Reaction &amp; Thermal Hall</b> — Stoichiometry, calorimetry and kinetics under one roof. Balanced equations bound how much can react; a heat balance separates stored heat from heat still being produced; rate laws and activation energy say how quickly that changes as the vessel warms. All three are needed before anyone enters a confined space.
  TREAT: <b>Pilot Treatment Plant</b> — Oxidation, adsorption and precipitation at pilot scale, with the byproduct bench next door. Every method here lowers the target contaminant. They differ in what they create, what they move into sludge, and what they leave for whoever is monitoring this river in ten years.
  CMD: <b>City Command</b> — Where the mission decision is actually made. The board carries scientific readiness, open high-consequence issues, response credits, and the projection at the deadline. Progress here is not the fraction of questions answered correctly; it is whether the evidence forms one chain that a reviewer could not break.
  RECORDS: <b>Records &amp; Shipping Office</b> — Manifests, supplier lot information and chain-of-custody paperwork. This is evidence that exists before any instrument is switched on, and it is often the cheapest way to eliminate a candidate. A label giving only a common name, with no composition or concentration, is not a record — it is a rumour with letterhead.
  BRIEF: <b>Public Briefing Center</b> — Where the city is told what is known. An uncertainty that survives being repeated has to be stated plainly the first time. A central estimate can be reassuring while the distribution behind it is not.
  YARD: <b>Freight Yard Gatehouse</b> — The fire started here, and several containers beside the river were damaged. The cordon stays until identity and hazard class are established, because an incompatible firefighting or treatment decision is worse than a slow one.
  DRUMS: "<b>The damaged containers</b> — Seven drums, two visibly scorched, none with a usable label. Nobody opens them and nobody identifies a chemical by smell. Composition, charge and provenance come first: secure and inventory, reconcile the records, then measure with validated remote or small-sample methods."
  DOCK: "<b>River sampling point</b> — Surface, mid-depth and sediment samples come off this dock. Where and when you sample decides what you are able to conclude: a surface grab and a sediment core can disagree completely and both be correct about the water they came from."
  READOUT_WATER: <b>Intake chemistry display</b> — pH, conductivity and dissolved concentration at the intake, against the sediment trend beneath it.
  READOUT_GASES: <b>Wind and plume display</b> — Wind speed and direction, stability class, and the current downwind corridor. The corridor is only as fresh as the last wind reading.
  READOUT_IDENT: <b>Spectra and identity display</b> — Chromatogram peaks alongside candidate spectral matches, with the confidence rank for each provisional identity.
  READOUT_QUANT: <b>Calibration and limits display</b> — The working calibration curve, today's blanks, the detection limit and the guard band around the release limit.
  READOUT_ENERGY: <b>Vessel temperature display</b> — Bulk temperature against time, with the cooling capacity drawn as a line the curve must not cross.
  READOUT_TREAT: <b>Treatment train display</b> — Water in and water out for each stage, plus the byproduct and sludge mass that leaves with them.
  BOARD: <b>Response status</b> — Mission, time remaining, scientific readiness and evidence independence, open issues, credits, risk and public trust, with the projection at the deadline. The assumptions behind the projection are inspectable, so a bottleneck can be fixed rather than merely out-spent.

        title: Say what should happen, then check
        place: River Mapping Center
        scene: The reading is above the range this meter was calibrated for. Calibration is the check against known samples. It is what turns a signal into a number. The meter still prints one, and Dana Whitfield, the calibration technician, does not want it in a report unchecked.
        guide: >-
          Lock the reading you expect after watering the sample down by half, before you
          do it. Then water it down and see what the meter says. Checking costs a
          verification slot, and spending it is the point. A meter prints a number for
          almost anything, and only the comparison shows whether this one can be
          trusted.
        background:
          - >-
              Why watering it down is the test. If the reading really comes from this
              chemical, then half as much of it should give half the reading. That holds
              while the reading is inside the range the meter was calibrated for. Outside
              that range it does not halve, because the relationship there has stopped being
              straight.
          - >-
              What a reading outside the range is worth. The meter still prints one, with
              just as many digits and no warning. It is a guess dressed as a measurement,
              and a check like this one is the only way to catch it.
          - >-
              Why you lock the prediction first. Reading the watered-down sample and then
              deciding what you expected is not a test. Doing it in that order is what makes
              the second reading evidence instead of agreement.

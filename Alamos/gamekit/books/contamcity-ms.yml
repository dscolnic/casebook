        choices:
          - label: Something is still reacting in the west bay, and making heat.
            mechanism: It gets hotter after the fire is out, more gas comes off, and the hot spot stays put. That is heat being made.
          - label: Heat left over from the fire is still draining away.
            mechanism: Something heavy takes hours to give back the heat it soaked up.
          - label: The temperature sensors are wrong.

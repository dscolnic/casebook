              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - different materials need different amounts of energy to warm by one degree
        takeaway: A small temperature rise across something heavy is a very large amount of energy.
        format: BALLPARK
        question: How much energy has the bath taken in?
        answerText: About forty-two thousand units of heat. Five degrees sounds like nothing until it is multiplied by two thousand kilograms.
        why: "Warming something by one degree takes energy, and how much depends on what it is and how much of it there is. Water is stubborn: every kilogram needs 4.2 units for each degree. Two thousand kilograms warming five degrees is forty-two thousand of them. Five degrees sounds like nothing, and against that much water it is an enormous amount of energy arriving from somewhere. That is what makes the small number worth calculating."
        call: How much energy raises the temperature?
        setup: Estimate the sensible heat in a water-like containment bath.
        story: The visible fire has been out for two hours and the storage zone is still warming. The energy needed to change the temperature of a material is its mass times its specific heat capacity times the temperature change, which is why a small rise across a large thermal mass can represent a very large amount of energy — water's high heat capacity is exactly what makes it a good containment bath and also what hides how much energy has gone in. The number decides whether cooling capacity on site is adequate or decorative.
        estimate:
          prompt: The bath holds 2,000 kilograms of water. Every kilogram takes 4.2 units of heat for each degree, and it has warmed by 5 degrees.
          question: How much energy has the bath taken in?
          labels:
            - 2,000 kg (water in the bath)
            - 4.2 units for each kilogram, each degree
            - 5 degrees (how much it warmed)
            - 2,260 units for each kilogram (boiling it away)
            - 300 (the temperature on a different scale)
          values: [2000, 4.2, 5, 2260, 300]
          slots: 3
          template: "{0} × {1} × {2}"
          formula: a*b*c
          correct: [0, 1, 2]
          target: 42000
          tolerance: 2500
          units: kJ
          solution: 2,000 × 4.2 × 5 is 42,000 units.
          explanation: Five degrees is the temperature change, not the temperature. Using 300 instead would answer a question about heating it from nothing, which is not what happened.
          givens:
            - mass = 2,000 kg
            - specific heat = 4.2 kJ kg^-1 K^-1
            - temperature rise = 5 K
          relationship: Heat taken in = how much there is × what one degree costs × how many degrees.
      - group: ENERGY
        task: Say which explanation fits both bays.
        title: Left-over heat, or something still going?
        place: Calorimetry Lab
        scene: Two bays saw the same fire. Ninety minutes after the cooling stopped, the east bay is cooling and the west bay is warming. Brandt lays the two logs side by side. The west bay is giving off more gas, and the hot spot has not moved.
        guide: >-
          Six readings, and the east bay is the useful one. Same fire, nothing left
          running. Compare the two bays, reading by reading. A broken sensor would move
          both bays. Left-over heat can only drain away. Warming, with more gas, at one
          fixed spot is a different story. Fire Command releases the site on this.
        background:
          - >-
              Why the quiet readings matter. It is easy to build a story around the number
              that is out of range. But most wrong explanations fail on something that did
              not move. If a cause would have pushed a second reading up and that reading is
              where it should be, the cause is not what happened, however well it explains
              the first one.
          - >-
              How to use the candidates. Take each one and ask what the panel would look
              like if it were true. Then compare that with the panel in front of you. Doing
              it in that order stops you fitting the story to the numbers, which is easy to
              do without noticing.
          - >-
              Why there is only one answer. More than one candidate will fit part of the
              panel, and that is on purpose. Only one fits every part of it. If two still
              look possible, find the reading they disagree about and let that reading
              choose.
        assumes:
          - heat flows from hot to cold, and never the other way by itself
        takeaway: A thing that keeps changing after its cause is removed has a cause of its own.
        format: DIAGNOSIS
        question: Is this heat left over, or something still running?
        answerText: Something is still running in the west bay. Left-over heat drains away, which is what the east bay is doing.
        why: "Left-over heat can only drain away once the fire is out. That is what the east bay is doing, and it is the control. The west bay is doing the opposite: rising, with more gas coming off, and the hot spot sitting in one place at the drum stack. Nothing that is merely cooling behaves like that. Something in there is making heat. And a bad sensor would push both bays the same way, which is exactly why two bays are worth having."
        call: Stored heat or continuing reaction?
        setup: Match each trend to the next interpretation or test.
        story: "Two bays are warm and Fire Command wants to know whether to release the site. There are only two ways a mass can be hot: it absorbed energy earlier and has not yet lost it, or it is making energy now. Those behave completely differently over time — anything that is merely storing heat can only cool toward its surroundings once the source is removed, while a self-heating mass can rise on its own and rise faster as it goes. The panel gives you both bays, and getting this wrong sends responders home before a runaway."
        rebuttals:
          - Left-over heat is exactly what the east bay is doing, which is why the east bay is the control. It cannot rise after the fire goes out.
          - One shared reference is a real worry and it would move both bays the same way. West rises while east falls.
          - Moving liquid carries a hot patch around. This hot spot has not moved at all.
          - Two bays cooling at different speeds is ordinary. One heating while the other cools is not.

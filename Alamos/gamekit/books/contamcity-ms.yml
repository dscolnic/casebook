        cost: 20
        work: 15
        brief: Connect the measurements to a mechanism the team can act on.
      - name: Connect rate and activation energy to thermal feedback
        cost: 26
        work: 19
        brief: Confirm it with evidence that could have failed independently.
      - name: State the condition under which the vessel is safe
        cost: 32
        work: 23
        brief: Hand the conclusion, and its remaining uncertainty, to City Command.
    issues:
      - A confined space is being entered before the gas production estimate exists.
      - The zone is still warming and nobody has separated stored heat from reaction.
      - The rate was measured at room temperature and applied to a warm vessel.
  - id: TREAT
    code: TREAT
    name: Treatment & Infrastructure
    color: "#4a5b6e"
    difficulty: 4
    type: sciencetank
    desc: Corrosion, treatment trains, byproducts and the long tail — fixing it without making it worse.
    defaultLeader: osei
    budget: 82
    milestones:

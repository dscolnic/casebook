  - title: The Water Changes pH
    objective: Select a controlled neutralization strategy and determine when buffer capacity will be exhausted.
    briefing: The river intake becomes acidic, while one proposed treatment could overshoot into strongly basic conditions. The player must use acid-base equilibria and buffering to control pH without masking chemical risk. A pH correction can mobilize metals, damage infrastructure, or injure workers if the chemical context is ignored.
    stake: "Day fourteen. The water at the intake has turned acidic, and Reyes wants it neutralised this morning. Novák, who looks after the pipes, wants to know what a dose will do to them first. Today you work out how much acid is really there, and pick a dose that will not overshoot. There is one dosing pump, and no way to take a dose back out. Overshoot and metals come off the pipe walls."
    takeaway: Select a controlled neutralization strategy and determine when buffer capacity will be exhausted.
    stops:
      - group: WATER
        task: Work out how many times more acidic the water is.
        title: How much more acidic
        concept: Acids and bases, and why the middle is where things are stable
        place: Water Intake Laboratory
        scene: The intake water reads four on the acid scale. Ordinary water reads seven. The plant is about to add something to bring it back, and Reyes wants the size of the problem first.
        guide: >-
          Four numbers. Two are readings on the scale. One is the gap between them. The
          scale counts steps, and each step is ten times. So the gap is what the answer
          is built from, not the readings. The plant is sizing a dose from it.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - each step down the acid scale means ten times more acid
        takeaway: A scale where each step is ten times hides how big a difference really is.
        format: BALLPARK
        question: How many times more acidic is the intake water than ordinary water?
        answerText: A thousand times. Three steps down the scale, and each step is ten times more.
        why: The acid scale is not like a ruler. Each step down means ten times more acid, not one more unit of it. So four is not a little below seven. It is three steps, and three steps is ten times ten times ten. A thousand times more acid than ordinary water. That is why a number that looks like a small change on paper needs a great deal more neutralising than anybody expects.
        call: How many moles of acid are present?
        setup: Use an idealized strong-acid sample.
        story: The river intake has turned acidic and the plant needs a neutralisation dose. pH is a logarithmic measure of the hydrogen ion concentration that is free in solution right now — one pH unit is a factor of ten — so a modest-looking change in pH is a large change in concentration, and pH alone tells you nothing about how much acid is waiting undissociated to take its place. Convert to moles first. Dosing on the pH number alone is how a plant overshoots from acidic straight into strongly basic.
        estimate:
          prompt: The intake reads 4 and ordinary water reads 7. Each step down the scale means ten times more acid.
          question: How many times more acidic is the intake water?
          labels:
            - 10 (times more, for each step)
            - 3 (steps from 7 down to 4)
            - 7 (ordinary water)
            - 4 (the intake now)
          values: [10, 3, 7, 4]
          slots: 2
          template: "{0} multiplied by itself {1} times"
          formula: Math.pow(a,b)
          correct: [0, 1]
          target: 1000
          tolerance: 50
          units: times
          solution: 10 × 10 × 10 is 1,000 times.
          explanation: Three steps is ten times ten times ten. Subtracting instead gives three, which is the number of steps rather than the answer.
          givens:
            - volume = 1,000 L
            - pH = 4.0
          relationship: Times more acidic = ten, multiplied by itself once for every step.

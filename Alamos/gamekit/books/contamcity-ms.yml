# The campaign: One working day each, 3 stops and a callback from day 3.
missions:
  - title: The Unknown Containers
    objective: Create a provisional identity list and choose the next discriminating measurements.
    briefing: A freight-yard fire damages several unlabeled containers beside Riverton's river. The response team must establish chemical identity and hazard classes before firefighters, residents, and the water utility act on rumors. A wrong identity can cause an incompatible firefighting or treatment decision.
    stake: "Day one. The freight yard fire has been out for six hours. A row of damaged containers sits eighty metres from the river, and nobody knows what was in them. Three names are going around, and they do not agree. Adaeze Okonjo, who runs the laboratory, wants two tests before anybody writes a name down. The fire chief wants a name now. Today you build a short list you would defend."
    takeaway: Create a provisional identity list and choose the next discriminating measurements.
    stops:
      - group: IDENT
        task: Match each thing on the record to what it lets you conclude.
        title: Read the label, not the rumour
        place: Accident Command Post
        scene: A fire at the freight yard has damaged several unlabelled drums, eighty metres from the river. Nils Sørensen, who commands the fire crews, has three different guesses on his radio. His firefighters will spray whatever you tell them to.
        guide: >-
          The left side is four kinds of record. The right side is four things you could
          say from one. Ask of each record what it really pins down. Which elements? How
          many of each? What charge? A trade name pins down none of them. Firefighters
          are choosing what to spray from your answer.
        background:
          - >-
              Why you match instead of choosing. A response that is right for one situation
              is often nearly right for the next one. Picking from a list lets you take the
              nearly-right answer and never notice. Matching makes you say which situation
              it fits best, and that comparison is the whole point.
          - >-
              How to use the one-each rule. Every response goes somewhere, and nowhere
              twice. So the situations you are sure about are worth more than themselves:
              each one you settle leaves fewer responses for the ones you are not sure
              about. Two lines you trust can decide the other two for you.
          - >-
              Why one wrong line is impossible. If three lines are right, the fourth
              response has nowhere else to go, so it is right too. Being wrong always means
              at least two are wrong at once. If a join feels forced, the mistake is
              probably not in that join — it is in one you already made and stopped
              questioning.
        takesAsRead:
          - "Dissolving, and why some things dissolve and others do not"
        assumes:
          - a chemical formula says which elements are in something, and how many of each
        takeaway: A name is a label. A formula says what something is made of, which is what decides how it behaves.
        format: PROTOCOL
        answerText: 1. The formula pairs a metal with a charged group of atoms. → Likely an ionic compound. 2. Two substances share the same elements but different ratios. → They are distinct compounds, not interchangeable names. 3. A particle has more electrons than protons. → It is negatively charged. 4. A label gives a common name with no composition or concentration. → The record is insufficient for hazard prediction.
        why: "A formula says which elements are in something and how many of each. That is what decides how it behaves: what it dissolves in, what it reacts with, what it does to water. Change one of those numbers and it is a different substance with different dangers, even though the elements are the same. A trade name carries none of that. It is a word somebody chose, and some of the substances on this list react with water."
        call: Read the formula, not the rumor
        setup: Match each formula-level observation to the correct chemical interpretation.
        story: "A freight-yard fire has damaged several unlabelled containers 80 metres from the river, and the shift supervisor's radio traffic is already carrying 3 different guesses about what is in them. A chemical formula is not a name: it states which elements are present, in what whole-number ratio, and what charge the unit carries, and each of those constrains what the substance can do. A subscript or a charge changed makes a different compound with different reactivity, different solubility and a different hazard class. Firefighters are choosing a suppression agent from whatever identity you give them, and some of the wrong answers react with water."
        rebuttals:
          - A metal with a charged group of atoms is the usual sign of a salt. Two opposite charges holding on to each other.
          - Change how many of each and you change what it does. The counts are part of the identity.
          - More electrons than protons means extra negative charge. Counting the two is the whole test.
          - A trade name with no formula and no strength says nothing about danger. It is a word on a drum.
        columns:
          - What the record shows
          - What you can conclude
        scenarios:
          - A metal, paired with a charged group of atoms.
          - Two records share every element and disagree on how many of each.
          - A label gives a trade name and nothing else.
        choices:
          - Probably one of the salts — held together by opposite charges.
          - Not one material under two labels — these behave differently.
          - Not enough to say anything about the danger.
        mapping: [0, 1, 2]
      - group: IDENT
        task: Put the four steps in order of what each one costs, cheapest first.
        title: From damaged drum to a first answer
        concept: Everything is made of matter, and matter comes in solids, liquids and gases
        place: Molecular Identification Lab
        scene: In the mobile laboratory, Okonjo sets the first sealed drum sample on the bench. The markings on the outside are readable now, and opening the drum will scuff them off. Opening it also lets the air above the liquid escape. She has enough liquid for two tests.
        guide: >-
          Every one of these can be done right now. So this is not about time. It is
          about what you can still do afterwards. Ask what each step uses up. The
          markings? The air above the liquid? The drops? The sample itself? There is
          only enough liquid for two tests.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim that each step needs the
              one before it to have happened. Get one pair the wrong way round and the claim
              is wrong, even if everything else lines up. That is why there is no part
              credit.
          - >-
              Why the ends are the place to start. The first and last steps are usually the
              easiest to be sure of, because one has nothing before it and the other has
              nothing after it. Fixing those two leaves fewer ways for the middle to go, and
              the middle is where the real question usually is.
          - >-
              What the rail can be ordered on. Often it is time. It can also be cost, or
              risk, or what you can still undo afterwards — do the steps that change nothing
              before the ones that change something for good. A step that destroys the
              sample can only be last.
        assumes:
          - some tests leave a sample as they found it, and some use it up
        takeaway: Do the tests that cost nothing before the ones that cannot be taken back.
        format: SEQUENCE
        answerText: 1. Photograph and record the markings on the outside of the drum, which consumes nothing. 2. Sample the headspace vapour onto a sorbent tube, without breaching the bulk liquid. 3. Draw a small aliquot and run a non-destructive spectrum on it. 4. Commit part of that aliquot to a method that destroys it to identify it.
        why: The order is set by what each step costs. The markings on the outside survive only until somebody opens the drum, so they get photographed first, and it costs nothing. Sampling the air above the liquid takes what has already escaped, without opening anything. A test that gives the sample back can be repeated all week if it goes wrong. The test that uses the sample up answers best, and it answers once.
        call: From damaged container to provisional identity
        setup: Order the non-destructive evidence workflow.
        story: "The containers are now evidence as well as hazard. Identification runs in a fixed order for reasons that are chemical rather than bureaucratic: some observations leave the sample exactly as they found it and can be repeated all week, and some consume the material to produce their answer. A destructive method gives the best identification and gives it once. What is on the outside of the drum survives only until somebody opens it. You are choosing the order in which to spend a sample nobody can go back for."
        rebuttals:
          - Photograph first. It costs nothing, and it is the only evidence that stops existing the moment the drum is opened.
          - The air above the liquid second. It samples what has already got out, without breaching anything.
          - A test that gives the sample back third. A mistake there costs nothing at all.
          - The test that uses it up last. It answers best and it answers once, so spend it when you know what to ask.
        cards:
          - Photograph the markings on the outside, which uses nothing up.
          - Collect the air above the liquid, without opening the drum.
          - Run the test that uses up the sample.
        order: [0, 1, 2]
        axis: Put the four in order by what each one costs you, cheapest first. There is no clock here. You can do any of them right now, so the question is which ones you can still do afterwards.
        ends: [Costs nothing, Cannot be taken back]
      - group: IDENT
        task: Spend the budget on the evidence that could change the answer.
        title: Float or sink
        concept: "Dissolving, and why some things dissolve and others do not"
        place: Records and Shipping Office
        scene: One drum is leaking into the bund. Nobody knows what the liquid is yet. Adaeze Okonjo needs to know whether it will float on the water already lying there, or sink under it.
        guide: >-
          All four options are things you could measure about this liquid. Only one of
          them decides floating. Floating is about how heavy a litre is, next to a litre
          of water. Colour and smell tell you other things. So does the amount in the
          drum. The bund is filling while you decide.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - a litre of water weighs about a kilogram
        takeaway: Whether something floats is a comparison, not a property: it is heavier or lighter than the same amount of water.
        format: CHOICE
        question: Which measurement decides whether the liquid floats on water?
        answerText: How much a litre of it weighs. Under a kilogram and it floats, over a kilogram and it sinks.
        why: Floating is a comparison. A litre of water weighs about a kilogram, so a litre of anything lighter than that rides on top and a litre of anything heavier goes under. Nothing else on the list decides it. Colour and smell say nothing about weight. The amount in the drum does not change it either — a full drum and a spoonful of the same liquid float or sink the same way. The answer matters tonight, because a floating layer spreads across the bund and reaches the drain, while a sinking one sits at the bottom where the pump inlet is.
        choices:
          - How much a litre of it weighs
          - What colour it is
          - How strongly it smells
          - How much of it is in the drum
        answer: How much a litre of it weighs
        rebuttals:
          - Colour is worth writing down and decides nothing here. Clear liquids do both.
          - Smell is a warning, not a measurement, and it means putting somebody in the vapour.
          - A spoonful and a full drum of the same liquid float exactly alike.
        call: Say whether it floats
        setup: One drum is leaking into the bund, and nobody knows what the liquid is.
        story: "Whether a spilled liquid floats or sinks decides where it goes and which end of the bund matters. A litre of water weighs about a kilogram; a litre of the spill weighs more or less than that, and that single comparison sets the response. A floating layer spreads out and reaches the drain. A sinking one collects at the bottom, which is where the pump inlet sits, and it can be pumped straight into the system somebody is trying to protect."
  - title: The Vapor Cloud
    objective: Provide a bounded plume assessment and decision triggers for evacuation zones.
    briefing: A colorless plume moves toward two neighborhoods as the weather changes. The team must estimate expansion, density, and direction without treating an ideal-gas model as a complete atmospheric forecast. A delayed evacuation risks exposure; an overbroad evacuation can block emergency access and overwhelm shelters.
    stake: "Day two, first light. The wind has turned, and a colourless cloud is drifting off the yard toward two neighbourhoods. Miklos Varga, the atmospheric chemistry lead, has a forecast that disagrees with the fire chief's map about where it goes by eleven. Sipho Mbeki, the public briefing officer, has to tell residents something by eight. Today you work out how much air that release can fill, and what the warming morning does to it. Warn too small an area and somebody is standing in it."
    takeaway: Provide a bounded plume assessment and decision triggers for evacuation zones.
    stops:
      - group: GASES
        task: Work out how long the cloud takes to reach the school.
        title: How long before it reaches the school
        concept: Gases spread out, and the wind decides where
        place: Mobile Weather Station
        scene: A colourless cloud is drifting away from the yard toward two neighbourhoods. Varga is watching it from the weather station. Police are holding the evacuation roads open. The wind is steady, and there is a school two kilometres downwind.
        guide: >-
          Four numbers, and two of them are distances to other places. One is how wide
          the cloud is, which does not change when it arrives. Ask of each number what
          it measures. A distance? A speed? A size? Police are holding roads open on
          this answer.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - a cloud drifts at roughly the speed of the wind carrying it
        takeaway: A hazard has a speed, and a speed turns a distance into the time you have.
        format: BALLPARK
        question: How long before the cloud reaches the school?
        answerText: About eight minutes. Two thousand metres at four metres a second is five hundred seconds.
        why: A cloud is carried by the wind, so it travels at roughly the wind's speed. Two thousand metres at four metres a second is five hundred seconds, which is a little over eight minutes. That is the whole decision. Eight minutes is enough to move a school if somebody starts now, and not enough if the first thing anybody does is argue. And if the wind picks up, the eight minutes shortens without anybody being told.
        call: How much volume can the gas occupy?
        setup: Use an idealized release only to establish scale.
        story: "A colourless plume is drifting toward two neighbourhoods and the incident commander wants a number before the wind shifts. The ideal gas law relates the amount of substance to the volume it occupies at a given temperature and pressure — at ordinary conditions about 24 litres per mole — which turns a mass in a tank into a scale you can reason about. It is a first-order tool and nothing more: it says how big the release is, not where it goes. Evacuating too little exposes people; evacuating too much blocks the roads the response needs."
        estimate:
          prompt: The school is 2,000 metres downwind, and the wind is blowing steadily at about 4 metres a second.
          question: How long before the cloud reaches the school?
          labels:
            - 2,000 m (to the school)
            - 4 m each second (the wind)
            - 500 m (how wide the cloud is)
            - 900 m (to the river)
          values: [2000, 4, 500, 900]
          slots: 2
          template: "{0} ÷ {1}"
          formula: a/b
          correct: [0, 1]
          target: 500
          tolerance: 30
          units: s
          solution: 2,000 ÷ 4 is 500 seconds, a little over eight minutes.
          explanation: Keep the units together. Metres with metres a second gives seconds. Mixing kilometres in gives an answer a thousand times out.
          givens:
            - n = 2.0×10^4 mol
            - T = 300 K
            - P = 1.0×10^5 Pa
            - R = 8.31 J mol^-1 K^-1
          relationship: Time = distance ÷ speed.
      - group: GASES
        task: Match each change in the field to what it does.
        title: What changes the cloud
        place: Gas Properties Lab
        scene: The weather station shows the temperature rising and the pressure falling, with the wind picking up. Erik Lindqvist, the cloud modeller, wants each change sorted out. Crews report vapour pooling in a low channel downwind.
        guide: >-
          Four changes in the field. Two of them change how much room the gas takes up.
          Two of them change where the gas goes. Ask which of the two each change does.
          Get that wrong and the map moves for the wrong reason. Vapour is pooling in a
          low channel.
        background:
          - >-
              Why you match instead of choosing. A response that is right for one situation
              is often nearly right for the next one. Picking from a list lets you take the
              nearly-right answer and never notice. Matching makes you say which situation
              it fits best, and that comparison is the whole point.
          - >-
              How to use the one-each rule. Every response goes somewhere, and nowhere
              twice. So the situations you are sure about are worth more than themselves:
              each one you settle leaves fewer responses for the ones you are not sure
              about. Two lines you trust can decide the other two for you.
          - >-
              Why one wrong line is impossible. If three lines are right, the fourth
              response has nowhere else to go, so it is right too. Being wrong always means
              at least two are wrong at once. If a join feels forced, the mistake is
              probably not in that join — it is in one you already made and stopped
              questioning.
        assumes:
          - a gas has a state, and it also has a place, and those change for different reasons
        takeaway: Some things change what the gas is doing. Others change where it is going. They are not the same question.
        format: PROTOCOL
        answerText: 1. Temperature rises at roughly constant pressure. → Volume rises in proportion to the absolute temperature. 2. External pressure falls for the same gas amount and temperature. → Volume rises in inverse proportion to the pressure. 3. A gas has greater molar mass than surrounding air. → It may initially favour lower-level accumulation, though turbulence matters. 4. Wind direction shifts while the source continues. → The downwind risk corridor must be updated.
        why: Two different things are happening at once. Warming a gas makes it take up more room, and dropping the pressure around it does the same. That is about the gas itself. Whether it hugs the ground or lifts away depends on how heavy it is compared with air, which is a different question again. And where it goes is the wind's business entirely. Nothing about the gas changed when the wind turned. The place it was heading did.
        call: Interpret plume behavior
        setup: Match each change to its first-order consequence.
        story: "The weather is changing while the plume is still moving. Two different physics are operating at once here: gas-law behaviour, which says how a fixed amount of substance responds to changes in temperature and pressure, and atmospheric transport, which says where the resulting parcel actually goes. Density relative to air decides whether the cloud hugs the ground or lifts; wind and turbulence decide how fast it dilutes; terrain decides where it pools. Each change on the board pushes on one of those and not necessarily the others, and the neighbourhood downwind is where the arithmetic lands."
        rebuttals:
          - Warming a gas at the same pressure makes it swell, in step with the warming.
          - Less pressure pushing in on the same gas lets it swell out. Half the pressure, twice the room.
          - Being heavier than air decides whether it sinks or lifts, and stirring by the wind can beat it.
          - A wind shift moves where it goes and changes nothing about the gas itself.
        columns:
          - What changes in the field
          - What it does
        scenarios:
          - The temperature rises, with the pressure much the same.
          - The pressure falls, with the same gas and the same warmth.
          - The gas is heavier than air.
        choices:
          - It takes up more room, in step with the warming.
          - It takes up more room, with less pushing in.
          - It may sink and pool low down.
        mapping: [0, 1, 2]
      - group: GASES
        task: Say why the same drum reads three times higher.
        title: Why the drum is worse in the afternoon
        concept: Reactions give out heat or take it in, and heat speeds things up
        place: Atmospheric Monitoring Post
        scene: The same open drum reads three times the vapour at two in the afternoon as it did at six in the morning. Nothing has been added and nothing taken out.
        guide: >-
          All four options would explain a bigger reading. They differ in what changed.
          One changes the liquid. One changes the instrument. One changes how much is
          left. One changes only how much sits in the air. Nothing was added and nothing
          taken out. That is the fact that decides it.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - a liquid is always sending some of itself into the air above it
        takeaway: A measurement of a hazard belongs to the conditions it was taken in.
        format: CHOICE
        question: Same drum, same liquid, three times the vapour. Why?
        answerText: It warmed up. A warmer liquid puts far more of itself into the air above it, with nothing else changing at all.
        why: A liquid is always losing molecules into the air above it, and getting some back. How many are up there at once depends on temperature, and it climbs steeply. Ten or fifteen degrees can double it. So the drum that was safe to stand near at dawn is not the same drum at two in the afternoon, with nothing having been added or taken away. It is why measurements get taken at the hottest part of the day.
        call: Choose the next plume evidence
        rebuttals:
          - Something new would show up as a different substance, and the analysis shows the same one.
          - Both readings came from the same instrument, and three times over is far more than it can drift.
          - Evaporating takes away the part that evaporates most easily, which would lower the vapour rather than raise it.
        choices:
          - Warmer liquid puts more of itself into the air.
          - It reacted during the day and made something that evaporates faster.
          - The morning reading was wrong, because instruments drift when cold.
          - More evaporated overnight, so what is left is stronger.
        answer: Warmer liquid puts more of itself into the air.
      - group: IDENT
        task: Sort the drums before the contractor lifts them.
        title: Water helps, or water makes it worse
        concept: "A mixture is things sharing a space without becoming one another"
        place: Container Yard
        scene: The contractor lifts at four, and Sørensen wants the yard sorted first. Some of these drums are made safer by water. Others react with water, and a hose is the worst thing that could reach them.
        guide: >-
          Two bins. Ask what happens when water reaches it. Something that dissolves is made
          weaker by water. Something that reacts with water makes heat or gas, and then the
          hose has made things worse.
        background:
          - >-
              Why this is the first question. Water is what a fire crew has, so water is what
              usually arrives. For most of a yard that is right, and for a short list it is the worst
              possible move.
          - >-
              What reacting looks like. Heat, sometimes enough to boil the water. Gas coming off that
              was not there before. Both happen in seconds and neither can be undone.
        assumes:
          - some things dissolve in water and some react with it
        takeaway: The usual answer is right for most things and dangerous for a few.
        format: BELT
        question: Send each drum to the bin that says what water would do.
        answerText: Anything that dissolves goes left, and water helps. Anything that reacts goes right, and a hose is the last thing it should meet.
        why: >-
          Water is the usual answer to a spill because it is what everybody has. For most of a
          yard it is the right one. A salt or a weak acid gets weaker as more water arrives, so
          diluting it helps. The short list is where that flips. Some metals react with water
          and give off a gas that catches fire. Strong acid gives off so much heat when water
          hits it that the water boils and throws the acid back, which is why the rule is acid
          into water and never the other way round. Some solids give off a gas that is worse in
          the air than the drum was on the ground. None of this shows on the outside. The label
          is the only thing that says which list a drum is on, which is why a yard of drums
          with no labels is the emergency and not just a nuisance.

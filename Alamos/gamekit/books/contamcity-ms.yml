      - group: WATER
        task: Set the slow-down and stop rules before the stream runs.
        title: Neutralise without overshooting
        place: Treatment Control Room
        scene: The pump is primed and the operators are waiting on the valve. The water is acidic, and Novák says the iron pipe is corroding. Every change to the pump shows up one reading later.
        guide: >-
          One rule, written now and fixed once you release it. The base feed is pushing the tank
          up. Past pH 7.5 the water is bad again the other way. Here is the catch: a pump change
          shows on the meter one reading late, so the tank keeps rising after you stop the feed.
          Put your line below 7.5 by that one reading of rise. Do not put it so low that it fires
          on water which has not shown anything yet.
        background:
          - >-
              What the delay does. Your correction lands on water that left the mixing point
              one interval ago. Push hard using an old reading and the correction arrives on
              top of one already in the pipe. That is what overshooting is, and the delay is
              the whole reason it happens.
          - >-
              Why both mistakes cost. The water is acidic and the pipe is iron, so dosing
              too little keeps eating the pipe. Dosing too much swings the tank the other
              way and the pump has to chase it back. Neither is free, and where you put the
              two thresholds is how you balance them.
          - >-
              Why the rules go first. A threshold changed while the readings arrive is not a
              rule, it is a description of what somebody already did. The operators at the
              valve need to know what will happen before it happens.
        assumes:
          - the meter shows what the pump did one reading ago, not what it is doing now
          - each step on the acid scale is ten times, so equal steps are not equal amounts

        cost: 14
        work: 11
        brief: Establish what this area can measure, and what it cannot.
      - name: Separate transport from chemistry in the plume
        cost: 20
        work: 15
        brief: Connect the measurements to a mechanism the team can act on.
      - name: Track the secondary products after the source stops
        cost: 26
        work: 19
        brief: Confirm it with evidence that could have failed independently.
      - name: Issue a defensible exposure picture over time
        cost: 32
        work: 23
        brief: Hand the conclusion, and its remaining uncertainty, to City Command.
    issues:
      - The ideal-gas estimate is being quoted as a hazard footprint.
      - The wind shifted after the corridor was drawn, and nobody has redrawn it.
      - Concentrations fell while a photochemical product rose, and only one is monitored.
  - id: WATER
    code: WATER
    name: Solutions & Water Chemistry
    color: "#1f7a6b"
    difficulty: 5
    type: protocol
    desc: Polarity, partitioning, pH and equilibrium — where the contaminant goes once it is wet.
    defaultLeader: ferreira
    budget: 84
    milestones:
      - name: Predict partitioning from molecular interactions
        cost: 14
        work: 11
        brief: Establish what this area can measure, and what it cannot.
      - name: Bring the intake pH under control without masking risk
        cost: 20
        work: 15
        brief: Connect the measurements to a mechanism the team can act on.
      - name: Show whether equilibrium moved the hazard or removed it
        cost: 26
        work: 19
        brief: Confirm it with evidence that could have failed independently.
      - name: Account for the contaminant across water, sediment and solids
        cost: 32
        work: 23
        brief: Hand the conclusion, and its remaining uncertainty, to City Command.
    issues:
      - Dissolved concentration fell and sediment concentration rose, and only water is sampled.
      - A pH correction could overshoot into strongly basic conditions.
      - The sampling plan measures the surface film and calls it the river.
  - id: QUANT
    code: QUANT
    name: Quantitative Analysis
    color: "#b0762a"
    difficulty: 5
    type: ballpark
    desc: Dilution, calibration, detection limits and uncertainty — turning a signal into a defensible number.
    defaultLeader: nakamura
    budget: 80
    milestones:
      - name: Turn instrument signal into concentration
        cost: 14
        work: 11
        brief: Establish what this area can measure, and what it cannot.
      - name: Put a calibration and a blank behind every number
        cost: 20
        work: 15
        brief: Connect the measurements to a mechanism the team can act on.
      - name: Attach an uncertainty to the decision, not just the sample
        cost: 26
        work: 19
        brief: Confirm it with evidence that could have failed independently.
      - name: Establish the release rule before the result arrives
        cost: 32
        work: 23
        brief: Hand the conclusion, and its remaining uncertainty, to City Command.
    issues:
      - A diluted result is being compared directly with a threshold.
      - The measured value sits inside its own uncertainty of the limit.
      - Every sample came from the same point on the same day.
  - id: ENERGY
    code: ENERGY
    name: Reactions & Energy
    color: "#b3462f"
    difficulty: 5
    type: sequence
    desc: Stoichiometry, calorimetry and kinetics — how much can react, how much heat, and how fast.
    defaultLeader: brandt
    budget: 86
    milestones:

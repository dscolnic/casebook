        task: Say what the test explains about the overshoot.
        title: Why the first dose overshot
        place: Acid-Base Bench
        scene: A dose worked out from the intake reading overshot badly. Osei has the bench test up beside a curve for a simple acid. That test is a titration: add a little at a time, until the water changes, and count how much it took.
        guide: >-
          Six readings, and two are there to rule things out. The fresh meter checks,
          and the simple acid at the same reading. Compare the test curve against that
          simple acid. A long flat stretch is something a simple acid does not have. The
          first dose overshot, so the answer has to explain that too.
        background:
          - >-
              Why the quiet readings matter. It is easy to build a story around the number
              that is out of range. But most wrong explanations fail on something that did
              not move. If a cause would have pushed a second reading up and that reading is
              where it should be, the cause is not what happened, however well it explains
              the first one.
          - >-
              How to use the candidates. Take each one and ask what the panel would look
              like if it were true. Then compare that with the panel in front of you. Doing
              it in that order stops you fitting the story to the numbers, which is easy to
              do without noticing.
          - >-
              Why there is only one answer. More than one candidate will fit part of the
              panel, and that is on purpose. Only one fits every part of it. If two still
              look possible, find the reading they disagree about and let that reading
              choose.
        assumes:
          - some acids hold most of their acid back, and let it out as you neutralise
        takeaway: A reading tells you what is loose right now. It does not tell you what is held in reserve.
        format: DIAGNOSIS
        question: Which explanation accounts for the flat stretch and the dose it really took?
        answerText: The water holds a reserve of acid that the reading cannot see. It lets more out as you neutralise, which is why the dose was five times bigger.
        why: "The reading measures the acid that is loose in the water at that moment. Some acids hold most of theirs back, and release more every time you neutralise what is loose. So the reading looks mild while the amount actually needed is five times bigger. That is what the long flat stretch on the test is: base going in and the reading barely moving, because more acid keeps arriving from the reserve."
        call: Read the titration curve
        setup: Match each feature to its meaning.
        story: "The curve on the screen is the result of adding base slowly and watching what the solution does. A titration is that: adding a measured amount, drop by drop, until the water changes, and counting how much it took. It is two instruments in one: quantitatively it measures how much base was needed to reach the equivalence point, which is a measure of total acid rather than free acid, and diagnostically its shape identifies the chemistry — the steepness of the rise, the presence or absence of a flat region, and where the equivalence point falls all say something about what kind of acid is in the water. The plant will dose the intake from your reading."
        rebuttals:
          - A simple acid is the reference curve, on the same axes. It finishes early and sharply, and this one does neither.
          - The meter was checked against two known liquids and it was right. It is answering a different question from the one the dose needed.
          - Something over-strength would overshoot and it would also finish sooner. This took five times more, not less.
          - Adding extra is a habit, not an explanation. It cannot produce a flat stretch or a five-fold demand.

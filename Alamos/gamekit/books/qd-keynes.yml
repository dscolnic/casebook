copy:
  FLOW: <p>The flow room, open to the corridor on the west side. A wall-sized board with the whole economy drawn on it, no chairs, and chalk on the floor.</p>
  STAT: <p>The statistics room, across the corridor. Eight metres of filing, returns by industry, and a clerk who will not compare December with June.</p>
  MODEL: <p>The model room, at the far end of the west side. A long working table down the middle, a slide rule with a cracked cursor, and one quire of graph paper.</p>
  DESK: <p>The policy desk, opposite the model room. A file, a numbered-copy book, and a summary being held back until the conditions are written into it.</p>
  PORCH: <p>The porter's room, inside the front door. A book that doubles as the fire roll, a rack of pigeonholes, and a telephone that rings for the policy desk.</p>
  TEA: <p>The common room, halfway down the west side. A radiator that knocks, eight chairs that never leave, and a rota with two blank days on it.</p>
  DUP: <p>The duplicating room, beside the porter. A machine, a smell of spirit, and a rule that every copy is numbered.</p>
  RACK: <p>The stationery store at the end of the west side. Foolscap, carbons, graph paper and blue ink, and a card to sign when you take the last of anything.</p>
  LIB: <p>The library at the far end. Bound trade figures that do not leave the room, two armchairs, and the only quiet in the building.</p>

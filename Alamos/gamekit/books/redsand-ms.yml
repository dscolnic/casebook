          a value.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - a dissolved salt separates into ions in water
          - the freezing point of pure water is 273 K
        takeaway: In the ideal colligative model, freezing-point depression scales with the number of dissolved particles, not their chemical identity.
        format: BALLPARK
        question: Estimate how far this brine's freezing point falls below that of pure water.
        why: >-
          Salt dissolved in water gets in the way of ice forming, so the water has to be taken colder
          before it freezes. Enough salt and the drop is enormous — tens of degrees rather than one or
          two. That is why the dirty water out of the ground survives a night the clean water would
          not. It is also why cleaning it creates a heating problem the plant did not have before.
        estimate:
          prompt: The tank water holds 8 units of salt in every kilogram, and each unit breaks into three pieces once it dissolves.
          question: Estimate how far this brine's freezing point falls below that of pure water.
          labels:
            - 3  (particles released per formula unit)
            - 1.86 K kg/mol  (freezing-point constant of water)
            - 8.0 mol/kg  (molality of the brine)
            - 0.51 K kg/mol  (boiling-point constant of water)
            - 223 g/mol  (molar mass of magnesium perchlorate)
          values: [3, 1.86, 8, 0.51, 223]
          slots: 3
          template: "{0} × {1} × {2}"
          formula: a*b*c
          correct: [0, 1, 2]
          target: 44.6
          tolerance: 3
          units: K
          solution: ΔTf = 3 × 1.86 × 8.0 ≈ 45 K below the freezing point of pure water.
          explanation: The particle count is what matters, so a salt giving three ions counts three times. The boiling-point constant and the molar mass belong to other questions.
          relationship: >-
            Freezing point drop = the particles each salt unit gives × 1.86 × how much salt is dissolved in each kilogram.
      - group: ELEC
        task: Account for the voltage above the thermodynamic minimum
        title: What the extra volt is doing
        concept: 'A day has an energy budget, and everything spends from it'
        place: Electrolysis Hall
        scene: >-
          The cell needs 1.23 volts to split water. Achebe has it running at 1.8, and wants to know
          where the difference is going.
        guide: >-
          Every extra volt costs the station power. Ask what could happen to that energy if it is not
          going into the hydrogen. Energy does not vanish; it turns into something.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a cell has a minimum voltage set by the thermodynamics of the reaction
          - electrical power is current times voltage
        takeaway: >-
          Extra voltage above the minimum comes out as heat, not as better fuel.
        format: CHOICE
        question: >-
          Where does the extra voltage above 1.23 go?
        why: >-
          Water splitting needs 1.23 volts and no less. Anything above that does not make better
          hydrogen — hydrogen is hydrogen — so it has to come out somewhere else, and it comes out as
          heat in the stack. That heat then has to be carried away, which costs power too. So running
          the cell hard is paid for twice, and the arithmetic of how hard to run it is one of the real
          decisions on this station.
        choices:
          - It leaves the stack as heat
          - It is stored in the hydrogen as extra energy
          - It is what makes the reaction happen at all
          - It goes into warming the water being fed in

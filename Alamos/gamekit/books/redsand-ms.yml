        rebuttals:
          - The lower resin catches whatever the upper resin missed, so nothing shows early.
          - A full column catches less, not more; it cannot improve.
          - That would mean the column never really works, and it does.
  # ---------------------------------------------------------------- sol 300
  - title: A new charge and a rule for the water
    objective: Get a bed back into service and decide what stops this happening again.
    briefing: There is one spare catalyst charge on the station and no second one coming.
    stake: >-
      Sol 301, and after ten days of argument there is one spare catalyst charge on the planet. If
      this one is poisoned the same way there is no third. Kaur will not fit it until the water is
      clean enough to promise. Today you put the steps of bringing a charge into service in order.
      You also choose the one improvement the station should spend its spare hours on.
    takeaway: A part with no replacement is commissioned by procedure rather than by enthusiasm.
    stops:
      - group: KINET
        task: Order the four operations for bringing the charge into service.
        title: Bringing a charge into service
        concept: 'A catalyst gives the reaction an easier path'
        task: >-
          Order the three steps of bringing a charge into service.
        place: Catalyst Bay
        scene: >-
          There is one spare catalyst charge on the planet. Ravneet Kaur is fitting it, and the order
          of the steps is not negotiable.
        guide: >-
          Put the three steps in the order they have to happen. Ask what each step would do if the one
          before it had been skipped.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim about dependency: each
              step is here because the one before it has already happened, or has to have.
              One transposed pair falsifies that claim wherever it sits, so partial credit
              would be credit for a sequence that does not work.
          - >-
              Why the ends are the place to start. The first and last cards are constrained
              by having nothing before or after them, which usually makes them the two you
              can settle from the scene alone. Pinning them collapses the remaining
              arrangements sharply, and what is left in the middle is where the actual
              judgement lives.
          - >-
              What the rail can be ordered on. Time is the usual axis, but it is not the
              only one. An order can run on cost, on risk, or on reversibility — every
              observation that leaves the sample as it was, before any that consumes it. On
              those boards a chronological reading finds nothing, because none of the steps
              has to happen at a particular hour.
        assumes:
          - nickel oxide has to be reduced to nickel metal before it is active
          - hydrogen at temperature will reduce a metal oxide
        takeaway: >-
          A new catalyst has to be got ready, proved, and only then trusted with production.
        format: SEQUENCE
        why: >-
          Hydrogen and oxygen together in a hot vessel is a fire, so the purge comes first and there
          is no version of this where it does not. The hydrogen step is what turns the charge into a
          working catalyst — it arrives as a compound, not as metal. Only then is there anything to
          test. Run the check before that and you learn that an untreated charge does nothing, which
          nobody needed to find out.
        cards:
          - Purge the reactor until no oxygen is left in it
          - Pass warm hydrogen to turn the surface into metal
          - Run a tenth of normal flow to check it works
        order: [0, 1, 2]
      - group: ELEC
        task: Fund the change that would most alter what the plant does next.
        title: One improvement, four candidates
        concept: 'Change one thing at a time and see what moves'
        place: Electrolysis Hall
        scene: The station has parts and crew time for one improvement. One catalyst charge is already lost, and there is no spare after the new one. Achebe puts four candidates on the board before anyone starts cutting pipe.
        guide: >-
          The plant ran 38 sols on water no column was polishing, and lost a catalyst
          charge to it. Conductivity was logged on every one of those sols and read by
          nobody. The array has not been the limit on any sol this season. There are
          already four probes in the catalyst bed. A second column in series lets the
          lead bed be changed at breakthrough, and needs pipe and a shutdown to fit. One
          catalyst charge is left, and there is no spare after it.
        rules: >-
          Spread the hundred points across the 4 proposals. At least 80 of them have to
          be committed, because a panel that funds almost nothing has not decided
          anything. Your largest single allocation must be 35 or more, and it has to
          land on what the evidence supports most. Keep the total sitting on proposals
          the evidence does not support under fifteen. And a proposal it does support
          should not be left under twenty.
        background:
          - >-
              Why the whole spread is graded. Funding is not a vote for one idea. A
              portfolio says what you think is likely, what is worth hedging against, and
              what is not worth pursuing at all — and the last two are where most of the
              information is. Backing the right proposal while quietly funding a bad one is
              a worse answer than it looks. That is why the small numbers count as much as
              the big one.
          - >-
              What the three numbers are for. Thirty-five is what makes a lead a lead: below
              it you have hedged rather than chosen. Fifteen is the most that can sit on
              unsupported work before it stops being a rounding error. Past that it is a
              second opinion nobody argued for. Twenty is the floor under a line of work you
              have already called strong, because funding it too thin to finish spends the
              money and buys nothing.
          - >-
              Why there is a floor on the total. Points held back are not caution; they are
              a decision not to decide, taken with somebody else's money and somebody else's
              deadline. The floor is what forces the panel to say something.
        assumes:
          - the polishing column gives no warning as it fills
          - the plant has no spare catalyst charge after this one
        takeaway: The work worth doing first is the work that would have caught the fault nobody caught.
        format: SCIENCETANK
        answerText: Fit the conductivity monitor and alarm on reactor feed water. It turns the measurement that already existed into an action before unpolished water reaches the catalyst.
        why: >-
          Every one of these would help, which is what makes it a real decision. The question is not
          which is a good idea but which one changes what the plant can do before the window. Spare
          hours are the scarcest thing on this station, and spending them on something that pays back
          after the vehicle has gone is the same as not spending them at all.
        proposals:
          - label: A
            text: Plumb a second polishing column behind the first, so the lead bed can be changed at breakthrough.
          - label: B
            text: Fit a conductivity monitor with an alarm on the reactor feed water.
          - label: C
            text: Add a fourth panel string to the array to raise the power available.
          - label: D
            text: Install a second temperature probe in the catalyst bed.
        recommended:
          A: 45
          B: 35
      - group: PHASE
        task: Decide whether a rising pressure is a leak
        title: The tank pressure that is not a leak
        concept: 'A gas in a closed tank pushes on its walls'
        place: Cold End
        scene: >-

# redsand.yml — Red Sand: the propellant plant at Arcadia Rise.
#
# AP Chemistry, taught through the back half of the course that The Contaminated
# City leaves alone: kinetics, equilibrium, electrochemistry, entropy and free
# energy, phase behaviour and intermolecular forces, and the solution chemistry
# of a brine nobody on Earth has to drink.
#
# The place is a propellant plant on Arcadia Planitia making methane and oxygen
# out of the atmosphere and the ground, against a transfer window that does not
# move. Format is tools/BOOK_TEMPLATE.md; import with
#
#   node tools/import-book.mjs books/redsand.yml redsand --verify

theme:
  id: redsand_ms
  title: Red Sand
  subtitle: Propellant Lead · Arcadia Rise

# ---------------------------------------------------------------- the areas
# Six areas, chosen as the six units of the course this game exists to teach.
# The argument the campaign turns on runs between two of them: Catalyst Bay
# wants rate and Reactor Hall wants yield, and they are both right on a
# named sol.
groups:
  - id: KINET
    code: KINET
    name: Catalyst Bay
    color: '#d19a2b'
    desc: How fast the reaction goes, what the catalyst does, and what stops it working.
    defaultLeader: sundqvist
    milestones:
      - Establish what the bed is doing now
      - Separate rate from yield
      - Find what is taking the activity away
      - Qualify a charge somebody else can trust
  - id: EQUIL
    code: EQUIL
    name: Reactor Hall
    color: '#c05a33'
    desc: How much methane a pass can give, and what moves that limit.
    defaultLeader: herrera
    milestones:
      - State the balance the loop settles at
      - Move it on purpose rather than by accident
      - Close the carbon ledger across the loop
      - Certify a batch against the flight specification
  - id: PHASE
    code: PHASE
    name: Cold End
    color: '#4a86b8'
    desc: Where a gas becomes a liquid, what holds it there, and what it costs.
    defaultLeader: cho
    milestones:
      - Establish what condenses where
      - Keep the water and the carbon dioxide out of the cold line
      - Account for every kilogram that boils off
      - Hand a loaded tank to the vehicle
  - id: ELEC
    code: ELEC
    name: Electrolysis Hall
    color: '#3f9e8c'
    desc: Splitting water and carbon dioxide with electricity, and what the current buys.
    defaultLeader: achebe
    milestones:
      - Name the half-reactions at each electrode
      - Turn charge into kilograms
      - Find where the current goes when it makes nothing
      - Run the stack inside its thermal limit
  - id: GIBBS
    code: GIBBS
    name: Plant Control
    color: '#8d6bb5'
    desc: Which way a reaction runs on its own, and what has to be paid for.
    defaultLeader: demir
    milestones:
      - Sort the driven steps from the spontaneous ones
      - Put an energy number on each of them
      - Close the sol's ledger against the array
      - Decide what the station stops doing
  - id: SOIL
    code: SOIL
    name: Water Plant
    color: '#9a8352'
    desc: Getting water out of frozen ground, and the ions that come with it.
    defaultLeader: abiola
    milestones:
      - Get water out of the ground and keep it
      - Identify what is dissolved in it
      - Take out what the plant downstream cannot survive
      - Leave a rule the next crew can follow

# ------------------------------------------------------------------ the cast
# 13 people, at least 2 per area. Sundqvist and Herrera are the argument;
# everybody else has a position they will defend and a limit they admit to.
roster:
  - id: sundqvist
    name: Ingrid Sundqvist
    role: Plant Production Lead
    division: KINET
    bio: |
      Runs the plant against a calendar. Her case is arithmetic: the tank has to
      hold 29 tonnes on the sol the window opens, and a plant running
      below its rated output on any sol is a plant that has already lost that
      sol's kilograms.

      She reads the reactor as a rate problem. Heat the bed, move more gas
      through it, recycle whatever comes out unconverted, and the loop makes up
      in passes what it gives away per pass. Twice she has been right about that
      when everybody else was being careful.

      Her limit is that a kilogram made off-specification is not a kilogram. She
      knows it, argues with it, and has never once loaded a batch she was told
      not to.
    quiz:
      - q: Why does Sundqvist treat a slow sol as a loss she cannot get back?
        a: The window is fixed, so a sol's shortfall has to be carried by the sols left
        wrong:
          - The catalyst charge ages on a schedule set by its manufacturer
          - The plant's rated output is the figure the whole mission was planned and costed against
          - A slow sol forces the reactor to be purged and started again cold
  - id: herrera
    name: Tomás Herrera
    role: Reactor and Yield Lead
    division: EQUIL
    bio: |
      Owns the reactor loop and the specification the propellant has to meet. He
      thinks of the reaction as a balance rather than a process: at a given
      temperature and pressure there is an amount of methane the mixture will
      settle at, and no amount of urgency moves it.

      What he watches is the gap between what went in as carbon and what came out
      as product. A loop that cannot account for its own carbon is a loop making
      something nobody has named yet, and he has found carbon monoxide that way
      twice.

      His limit is that the balance says nothing about how long it takes to get
      there. A reactor can be at the right conditions and still be far too slow,
      and he needs Catalyst Bay to tell him which he is looking at.
    quiz:
      - q: What is Herrera actually testing when he compares carbon in against carbon out?
        a: Whether the loop is making a product nobody has listed
        wrong:
          - Whether the flow meters on the inlet and outlet still agree
          - Whether the reactor has reached the temperature the schedule asks for
          - Whether the catalyst charge has any working life left in it
  - id: cho
    name: Mei-Ling Cho
    role: Cryogenics Engineer
    division: PHASE
    bio: |
      Keeps the cold end, which is the part of the plant that turns a gas nobody
      can store into a liquid the vehicle can fly. Her working rule is that
      everything in the stream has a temperature at which it stops being a gas,
      and they are not the same temperature.

      That is also the whole of her trouble. Water freezes long before methane
      condenses, and carbon dioxide becomes a solid at a temperature the cold
      line passes through on its way down. Either of them will close a pipe from
      the inside with nothing showing outside it.

      Her limit is that she cannot see in. What she has is a pressure, a
      temperature and a flow, and a plug looks very like a valve nobody opened.
    quiz:
      - q: Why does Cho insist the stream is dried before it reaches her equipment?
        a: Water turns solid well above the temperature methane needs to condense
        wrong:
          - Water and methane form a mixture that will not separate again
          - Damp gas corrodes the heat exchanger over a season of running at temperature
          - Water carries dissolved chloride into the storage tank
  - id: achebe
    name: Rosalind Achebe
    role: Power and Electrolysis Engineer
    division: ELEC
    bio: |
      Runs the stacks and the array that feeds them. Everything she does converts
      electrical charge into particles, and the sum is exact: a known current
      for a known time is a known number of molecules, if every electron did the
      job it was sent to do.

      Her interest is the gap between that and what the plant actually collects.
      Some of the current crosses the cell without splitting anything, some of the
      voltage above the thermodynamic minimum turns into heat, and both show up as
      hydrogen that was paid for and never arrived.

      Her limit is the array. Her stacks can take more current than the field can
      supply on most sols, so the number she works to is not an electrochemical
      one at all.
    quiz:
      - q: Why does Achebe distrust a hydrogen figure calculated from the current alone?
        a: Some of the charge crosses the cell without splitting any water
        wrong:
          - The current meter drifts warm over the course of a working sol
          - Faraday's constant depends on the temperature of the electrolyte
          - Hydrogen leaks out of the collection line faster than it is made
  - id: demir
    name: Yusuf Demir
    role: Life Support Officer
    division: GIBBS
    bio: |
      Responsible for the air, the water and the heat the crew lives in, all of
      which come off the same array as the propellant. He is the person who has to
      say out loud that a plant running flat out is a habitat running cold.

      He thinks in free energy rather than in kilowatt-hours, which sounds like
      pedantry until a decision turns on it. Some of what the station does happens
      on its own and needs only to be allowed; the rest has to be paid for, and
      the bill is set by chemistry rather than by engineering.

      His limit is that he is arguing for a margin against a deadline, which is
      the argument that loses. He has lost it four times this season and kept the
      minutes each time.
    quiz:
      - q: Why does Demir separate the station's loads into driven and spontaneous?
        a: The driven ones have a bill fixed by chemistry that no design can avoid
        wrong:
          - Spontaneous processes can be scheduled for the night side of the sol
          - Driven processes are the ones the crew can operate by hand if needed
          - The two kinds are metered on separate circuits from the array
  - id: abiola
    name: Femi Abiola
    role: Regolith and Water Lead
    division: SOIL
    bio: |
      Gets water out of frozen ground, which on this plain means ice cemented
      through the soil rather than ice in a sheet. His plant warms a sealed load,
      catches the vapour and condenses it, and what he collects is not water so
      much as a solution of whatever the ground had in it.

      Most of that is salt of one kind or another, and one of them is perchlorate,
      which is common here, dissolves readily, and lowers the freezing point of
      the brine far enough that it stays liquid at temperatures no fresh water
      would survive.

      His limit is the polishing column. It holds a finite number of ions, it
      gives no warning as it fills, and the sol it is full the water leaving it is
      as dirty as the water going in.
    quiz:
      - q: Why does Abiola describe his product as a solution rather than as water?
        a: Warming the ground dissolves whatever salt was cemented in with the ice
        wrong:
          - The condenser plate leaves a film of oil in every batch
          - Vapour collected under vacuum carries fine dust across to the condenser plate
          - Water made from ice is chemically different from surface water
  - id: stern
    name: Dana Stern
    role: Analytical Chemist
    division: EQUIL
    bio: |
      Runs the assay bench, where every claim the plant makes about its own
      product is either confirmed or quietly withdrawn. Two instruments and a set
      of standards, and a rule that a number without a standard behind it is an
      opinion with a decimal point.

      She is the reason the loop's carbon monoxide was found. It was not on
      anybody's list, so nobody was looking for it, and it sat in the product
      stream for 11 sols reading as inert.

      Her limit is that she measures what she is asked to measure. An assay is a
      question, and a contaminant nobody asks about is a contaminant that passes.
    quiz:
      - q: How did carbon monoxide sit in the product stream for 11 sols?
        a: The assay reported the compounds it was asked for, and that was not one
        wrong:
          - The chromatograph could not resolve it from the methane peak
          - Carbon monoxide forms inside the sample bottle in the hours after it is filled
          - Its concentration stayed below the instrument's detection limit
  - id: kaur
    name: Ravneet Kaur
    role: Catalysis Engineer
    division: KINET
    bio: |
      Looks after the catalyst charges: nickel on an alumina support, in a bed the
      size of a kitchen bin, doing the only job in the plant that nothing else can
      do. She can tell a great deal from where along the bed the heat is.

      A fresh charge does its work in the first few centimetres and the hot spot
      sits there. As the front of the bed loses activity the hot spot walks
      downstream, and the sol it reaches the far end there is no bed left to lose.

      Her limit is that the walk looks the same whatever is causing it. Heat and
      poison both take the front of the bed first, and the difference is visible
      in the spent charge rather than in the plant.
    quiz:
      - q: What does Kaur read from the position of the hot spot in the bed?
        a: How much of the bed has already stopped doing any work
        wrong:
          - Whether the reactor is running above its design temperature
          - How much gas is passing through the bed each minute
          - Whether the charge was packed evenly when it was loaded
  - id: moreau
    name: Élodie Moreau
    role: Cryogenic Fluids Technician
    division: PHASE
    bio: |
      Works the transfer lines and the tank farm. Everything she moves is a
      cryogenic liquid sitting at its own boiling point, which means any heat that
      reaches it leaves as vapour rather than as a temperature rise.

      She keeps the boil-off log, one line per sol, and she can tell a heat leak
      from a bad gauge by whether the loss changes when the tank is topped up.

      Her limit is the vent. Propellant that boils off can be recondensed if there
      is power to do it, and vented if there is not, and the second is a decision
      somebody makes at four in the morning.
    quiz:
      - q: Why does a heat leak into a cryogenic tank show up as vapour rather than as warming?
        a: A boiling liquid holds its temperature and takes the heat as evaporation
        wrong:
          - The tank's insulation keeps the liquid at the temperature it was filled at
          - Vapour rises to the top of the tank and carries the heat with it
          - The gauge measures pressure, so warming is invisible to it
  - id: petrov
    name: Iosif Petrov
    role: Array Technician
    division: ELEC
    bio: |
      Maintains 1800 square metres of photovoltaic panel on an open
      plain in a place with weather. Dust settles on every 1 of them at a rate
      he has measured, and a swept panel is worth a measurable fraction more than
      an unswept 1 for about 20 sols.

      His argument with the plant is about when to sweep. Sweeping costs power and
      crew time, and a storm undoes it, so the decision is a forecast rather than
      a schedule.

      His limit is that he cannot make the sun brighter. On a bad sol the array
      delivers what the sky lets through, and everything downstream is a choice
      about what to switch off.
    quiz:
      - q: Why is Petrov's sweeping schedule a forecast rather than a routine?
        a: A storm arriving soon after a sweep wastes the power the sweep cost
        wrong:
          - Panels can be damaged if they are swept more than once a season
          - Dust settles at a rate that changes with the time of year
          - Crew time for sweeping is allocated by the station commander
  - id: wells
    name: Marion Wells
    role: Station Commander
    division: GIBBS
    bio: |
      Commands the station, which in practice means she owns the energy budget and
      the arguments about it. Everything on this plain runs off one array, and she
      is the person who decides whether the next kilowatt-hour goes into the tank
      or into the habitat.

      She has one standing question for any proposal: what happens if we are wrong
      about it, and can we undo it. Work that can be undone she will approve on
      thin evidence. Work that cannot she will hold up for a sol.

      Her limit is that holding things up is itself a decision, and the calendar
      charges for it at the same rate.
    quiz:
      - q: What does Wells ask before approving something proposed on thin evidence?
        a: Whether the station can undo it if the evidence turns out wrong
        wrong:
          - Whether the work can be completed within a single working sol
          - Whether the proposal has been costed against the energy budget
          - Whether two members of the crew agree with the reasoning
  - id: nakagawa
    name: Sora Nakagawa
    role: Drill and Excavation Operator
    division: SOIL
    bio: |
      Cuts the ice-bearing ground the water plant runs on. The ice here is not a
      layer to be found but a cement through the soil, so what the machine brings
      up is a load of frozen dirt with a water content that changes across ten
      metres of ground.

      He samples every load before it goes to the hopper, because the difference
      between 8% water and 3% is the difference between a
      shift that meets its number and one that does not.

      His limit is depth. Below about two metres the machine is slower than the
      plant can use, and the shallow ground near the station has already been cut.
    quiz:
      - q: Why does Nakagawa sample each load before it reaches the hopper?
        a: Water content varies across the ground, so the load's yield is not known
        wrong:
          - Samples are required by the station's excavation permit
          - A hopper cannot be opened again once a load has been sealed and warmed through
          - Dust in the load has to be measured before it enters the plant
  - id: bhatt
    name: Anaya Bhatt
    role: Ascent Vehicle Systems Engineer
    division: PHASE
    bio: |
      Owns the vehicle the whole plant exists to fill. Her tanks take the
      propellant, her specification says what may go into them, and she is the
      last signature before a batch is loaded.

      She is unsentimental about the plant's difficulties. The engine sees a
      mixture, not a season of work, and water in the methane freezes in a valve
      at a temperature the valve reaches every time it is used.

      Her limit is that she cannot test what she is being handed. There is one
      vehicle, it is not fired until it launches, and everything she knows about
      the propellant in it comes from an assay somebody else ran.
    quiz:
      - q: Why does Bhatt hold the specification hard on a trace contaminant?
        a: Nothing loaded into the vehicle can be taken out or tested by firing
        wrong:
          - The specification was written by the vehicle's manufacturer
          - Trace contaminants concentrate in the tank as the propellant around them boils away
          - An assay cannot measure a contaminant below a few parts per million

glossary:
  - name: Sol
    aliases: [sol, sols]
    def: A day on Mars. It is about forty minutes longer than a day on Earth, and the plant counts in them.
  - name: Methane
    aliases: [methane]
    def: The gas this plant makes. It burns in the vehicle's engine, and it turns liquid once it is cold enough.
  - name: Catalyst
    aliases: [catalyst, catalysts, charge]
    def: A material that lets a reaction happen more easily. It is not used up, and it can be spoiled.
  - name: The bed
    aliases: [bed, packed bed, reactor bed]
    def: The vessel the catalyst sits in. Gas is pushed through it and comes out changed.
  - name: Yield
    aliases: [yield, per pass, conversion]
    def: How much of what goes into the reactor comes back out as the thing you wanted.
  - name: Balance point
    aliases: [balance point, settles at, balance]
    def: Where a reaction stops changing because it is going both ways at the same speed.
  - name: Recycle loop
    aliases: [recycle loop, recycle, goes round again]
    def: The pipe that sends unreacted gas back to the front of the reactor to have another go.
  - name: Poisoned
    aliases: [poison, poisoned, poisoning]
    def: What has happened to a catalyst when something has stuck to its surface and will not come off.
  - name: Electrolysis
    aliases: [electrolysis, stack, cell]
    def: Using electricity to split water into hydrogen and oxygen. Stop the current and it stops at once.
  - name: Electron
    aliases: [electron, electrons, charge]
    def: The tiny part of an atom that carries electricity. A current is electrons on the move.
  - name: Boiling point
    aliases: [boiling point, boils]
    def: The temperature at which a liquid turns into a gas. Every substance has its own.
  - name: Freezing point
    aliases: [freezing point, freezes, turns solid]
    def: The temperature at which a liquid turns solid. Salt dissolved in water drags it a long way down.
  - name: Cryogenic
    aliases: [cryogenic, cold end, liquefier]
    def: Cold enough to turn ordinary gases into liquids. Far colder than any weather anywhere.
  - name: Brine
    aliases: [brine, salty water]
    def: Water with a lot of salt dissolved in it. It stays liquid at temperatures that would freeze clean water.
  - name: Perchlorate
    aliases: [perchlorate, chloride, salt from the ground]
    def: The salt that comes out of Martian ground with the water. It is what poisons the catalyst.
  - name: Kilowatt-hour
    aliases: [kilowatt-hour, kilowatt-hours, kwh]
    def: One kilowatt of power used for one hour. It is how the station counts the energy it spends.
  - name: Specification
    aliases: [specification, spec, limit]
    def: The list of limits a batch has to meet before anybody will put it in the vehicle.
  - name: Mixture ratio
    aliases: [mixture ratio]
    def: How many kilograms of oxygen the engine needs for each kilogram of methane.

missions:
  # ---------------------------------------------------------------- sol 291
  - title: 2700 kilograms short
    objective: Establish what the plant is actually limited by before anybody changes a set point.
    briefing: The tank reconciliation was read at breakfast and the plant does not reach the number.
    stake: >-
      Sol 291, and the plant has been behind for weeks. It has to fill the ascent vehicle before
      the launch window, and the window does not move. Ingrid Sundqvist, who runs production,
      makes the shortfall 2,700 kilograms. Tomás Herrera, who owns the reactor, says the plant is
      not slow but wasteful. Today you work out what the reactor actually settles at. You also
      learn why making more each hour is not the same as making more.
    takeaway: A plant has a speed and a ceiling, and they are not the same limit.
    stops:
      - group: EQUIL
        task: Match each change to what it does to the methane.
        title: What the loop settles at
        concept: 'Everything is made of atoms, and atoms are never lost'
        task: >-
          Match each change to what it does to the methane.
        place: Reactor Hall
        scene: >-
          Tomás Herrera has the reactor loop on the board. Gas goes in, methane and water come out,
          and what is left goes round again.
        guide: >-
          Three changes to the loop, and three things that happen to the methane. Match each one. Ask
          what each change does to the crowding inside the vessel.
        background:
          - >-
              Why this is a matching board and not four separate questions. Responses on
              boards like this are written to be plausible for more than one situation, so
              choosing them one at a time lets a nearly-right answer through unexamined.
              Having to place all of them forces the comparison — not "is this reasonable
              here", but "is it more right here than there".
          - >-
              How to use the one-each rule. Because the responses are a set to be
              distributed rather than a list to be sampled, every join you make constrains
              the rest. Settling the two you are confident of can leave the remaining pair
              decided by elimination. Where it does not, two responses are still competing
              for one situation, and that is exactly the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every response used once,
              three correct joins leave the fourth with only one place to go. Any error
              therefore involves at least two joins. That is worth remembering when the last
              pair looks forced: the fault is usually not in the join you are struggling
              with, but in one you made early and stopped questioning.
        assumes:
          - a reaction at its balance point is still running both ways
          - pressure and temperature are the two settings on a gas-phase reactor
        takeaway: >-
          Squeeze a reaction that ends with fewer molecules and it makes more product.
        format: PROTOCOL
        why: >-
          This reaction ends with fewer gas molecules than it starts with, so squeezing the loop
          pushes it toward the smaller side and more methane comes out. Heat works the other way: the
          reaction gives out heat, so adding more of it pushes back. And taking the water away leaves
          the mixture short of what it settles at, so more of the feed turns into product to make up
          the difference. Three different levers, and one of them is free.
        scenarios:
          - The loop pressure is raised from 8 bar to 12
          - The bed is run 40 degrees hotter at the same pressure
          - The water is taken out before the gas goes round again
        choices:
          - More methane — the products take up less room
          - Less methane — the reaction gives out heat already
          - More methane — taking a product away pulls it forward
        mapping: [0, 1, 2]
      - group: KINET
        task: Say what 40 degrees actually buys
        title: Rate is not yield
        concept: 'Temperature is how fast the particles are moving'
        place: Catalyst Bay
        scene: >-
          Sundqvist wants the bed forty degrees hotter tonight. Herrera has the numbers from the last
          time somebody tried it.
        guide: >-
          Two different things can happen when you heat a reaction: it can go faster, and it can end
          up with more or less product. Ask whether those two have to move the same way.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - heating a reaction makes it go faster
          - an exothermic reaction gives out heat as it proceeds
        takeaway: >-
          Going faster and getting more are two different things, and heat can move them apart.
        format: CHOICE
        question: >-
          What happens when the bed is run hotter?
        why: >-
          Heating the bed makes the molecules move faster, so more of them meet and the reaction turns
          gas over more quickly. That is real. But this reaction gives out heat, so adding heat also
          pushes it back toward where it started, and each pass ends with a little less methane in it.
          Faster and less. Which of the two wins depends on the loop, and that is exactly what
          Sundqvist and Herrera are arguing about.
        choices:
          - It works faster and each pass gives a little less
          - Both the speed and the amount go up together
          - The speed stays the same and the amount rises
          - Neither moves much, since pressure sets both
        answer: It works faster and each pass gives a little less
        rebuttals:
          - Heat speeds a reaction up and pushes this one backwards at the same time.
          - The catalyst sets how fast it can go, and heat still changes that.
          - Pressure matters here too, and it is not the only thing that does.
      - group: PHASE
        task: Say why the stream is cleaned before it is cooled
        title: What freezes before methane condenses
        concept: 'Temperature is how fast the particles are moving'
        place: Cold End
        scene: >-
          Mei-Ling Cho, the cryogenics engineer, has the cold end open on the screen. The gas coming
          in is mostly methane, with water and carbon dioxide still in it.
        guide: >-
          Everything has its own temperature for turning solid. The line cools all the way down to
          methane's. Ask what happens to the other things on the way past.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a substance leaves the gas phase at a temperature that depends on the pressure
          - liquid methane needs about 112 K at loop pressure
        takeaway: >-
          Every substance freezes at its own temperature, so a mixture goes solid one part at a time.
        format: CHOICE
        question: >-
          What happens to the water and carbon dioxide in the cold line?
        why: >-
          Water turns solid at 273 kelvin and carbon dioxide at about 195. Methane does not turn
          liquid until 112. So a line cooling all the way down to methane passes both of the others'
          freezing points on the way, and whatever is still in the gas comes out as ice on the inside
          of the pipe. That is why the drier and the trap sit before the cold end rather than after
          it.
        choices:
          - They turn solid long before methane does
          - They dissolve in the liquid methane and stay there
          - They carry heat in and slow the refrigerator down
          - They pass straight through and leave with the methane
        answer: They turn solid long before methane does
        rebuttals:
          - Very little dissolves at these temperatures; they go solid instead.
          - They do carry a little heat, and that is not what blocks a pipe.
          - Nothing passes through a line that is colder than its freezing point.
  # ---------------------------------------------------------------- sol 292
  - title: Run it hotter
    objective: Find what else the same power could be doing, now that the bed is where it should have been.
    briefing: The hot run made its number overnight, and the argument has moved to the electrolysis hall.
    stake: >-
      Sol 292, and Sundqvist wants the reactor bed forty degrees hotter tonight. Ravneet Kaur, the
      catalysis engineer, says the bed has been running cold for weeks and nobody noticed. Herrera
      wants to wait. Six people are on this station and none of them leaves without the fuel.
      Today you find out how long a molecule spends in the bed. You also work out what a hotter
      bed costs somewhere else.
    takeaway: A loop that recycles can afford a poor pass, and a plant with no hydrogen cannot afford anything.
    stops:
      - group: KINET
        task: Work out how long the gas is in contact with the catalyst
        title: How long a molecule stays in the bed
        concept: 'A catalyst gives the reaction an easier path'
        place: Catalyst Bay
        scene: |-
          Kaur wants the contact time worked out at the new flow before anything else is changed. The bed holds 340 litres of packed catalyst and the loop is passing 85 litres a minute through it.
        guide: >-
          Five numbers, and three of them describe the conditions rather than the
          geometry: the pressure, the temperature, and the feed ratio. Ask of each
          whether this time depends on it. Residence time is how long the gas stays with
          the catalyst. Push more gas through the same bed and that contact shortens, so
          flow and conversion move against each other.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - a flow quoted in litres a minute is a volume passing each minute
          - gas volumes depend on the pressure and temperature they are quoted at
        takeaway: Conversion depends on how fast the reaction runs and on how long it is allowed to run for.
        format: BALLPARK
        question: Estimate how long a molecule of gas spends inside the bed.
        why: Residence time is the contact the reaction gets. A rate constant says how quickly reaction occurs at the stated conditions. Residence time says how long the gas remains with the catalyst. Conversion depends on both. Raising throughput by pushing more gas through the same bed shortens that contact. The plant can therefore increase flow while lowering conversion in one move. Rate and residence time must be judged together before a higher production setting is accepted.
        estimate:
          prompt: The bed holds 340 litres of packed catalyst, and the loop passes 85 litres a minute through it at reactor conditions.
          question: Estimate how long a molecule of gas spends inside the bed.
          labels:
            - 340 L  (volume of the packed bed)
            - 85 L/min  (flow through the bed at reactor conditions)
            - 12 bar  (loop pressure)
            - 593 K  (bed temperature)
            - 4  (hydrogen particles needed for each carbon dioxide)
          values: [340, 85, 12, 593, 4]
          slots: 2
          template: "{0} ÷ {1}"
          formula: a/b
          correct: [0, 1]
          target: 4
          tolerance: 0.4
          units: minutes
          solution: t = 340 L ÷ 85 L/min = 4.0 minutes.
          explanation: Contact time is the bed's volume divided by the flow through it. The pressure and the temperature are already inside that flow figure, which is quoted at reactor conditions.
          relationship: >-
            Time in the bed = the space inside the bed divided by the gas flowing through it each minute.
      - group: ELEC
        task: Match each part of the cell to what it does.
        title: Which electrode does which job
        concept: 'Everything is made of atoms, and atoms are never lost'
        task: >-
          Match each part of the cell to what it does.
        place: Electrolysis Hall
        scene: >-
          Rosalind Achebe, who runs the power and the electrolysis, has the cell open. Electrons go in
          at one end and out at the other, and oxygen comes off in between.
        guide: >-
          Three parts of the cell, and three jobs. Match them. Follow the electrons: where they are
          pushed in, where they are pulled out, and what sits between.
        background:
          - >-
              Why this is a matching board and not four separate questions. Responses on
              boards like this are written to be plausible for more than one situation, so
              choosing them one at a time lets a nearly-right answer through unexamined.
              Having to place all of them forces the comparison — not "is this reasonable
              here", but "is it more right here than there".
          - >-
              How to use the one-each rule. Because the responses are a set to be
              distributed rather than a list to be sampled, every join you make constrains
              the rest. Settling the two you are confident of can leave the remaining pair
              decided by elimination. Where it does not, two responses are still competing
              for one situation, and that is exactly the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every response used once,
              three correct joins leave the fourth with only one place to go. Any error
              therefore involves at least two joins. That is worth remembering when the last
              pair looks forced: the fault is usually not in the join you are struggling
              with, but in one you made early and stopped questioning.
        assumes:
          - oxidation is loss of electrons and reduction is gain of electrons
          - a current is a flow of charge
        takeaway: >-
          A cell has two ends and something between them, and each does one job only.
        format: PROTOCOL
        why: >-
          Electricity only does anything here because it goes in one end and out the other. Where it
          is pushed in, the gas picks electrons up. Where it is pulled out, oxygen is left behind and
          comes off as a gas. The layer between has to let charge through, or nothing flows at all,
          and it must not let electrons through, or the current would take the short way round and no
          chemistry would happen.
        scenarios:
          - The end the supply pushes electrons into
          - The end electrons are pulled back out of
          - The solid layer between the two ends
        choices:
          - Carbon dioxide picks up electrons here
          - Oxygen gas comes off here
          - It lets charge across but not electrons
        mapping: [0, 1, 2]
      - group: GIBBS
        task: State which of the plant's steps have a bill
        title: What has to be paid for
        concept: 'A rate is an amount every hour, and it adds up'
        place: Plant Control
        scene: >-
          Sundqvist has the shortfall on the board and the current rate beside it. Nobody has divided
          one by the other in front of the crew yet.
        guide: >-
          Work out how long the plant needs at the rate it is actually running. Two tiles do it. The
          rate the schedule asks for is there to compare with, not to divide by.
        background:
          - >-
              What the two terms are doing. The enthalpy term is the heat the change takes in or
              gives out. The entropy term is how much more, or less, spread out the matter and
              its energy end up, and it is multiplied by the temperature — which is why heating
              something can turn a change that does not run into one that does.
          - >-
              Why a positive answer means a bill. A positive free-energy change means the
              products sit above the reactants, so the energy has to come from somewhere
              outside the reaction. In this plant it comes from the array, through the cell, at
              a price in kilowatt-hours that the ledger on Demir's desk has to carry.
          - >-
              Why the reverse is free. Methane assembly is water splitting run backwards, and it
              gives out what the splitting takes in. That is one number with two signs, not two
              independent facts, and it is why the plant can run one step on its own and never
              the other.
        assumes:
          - some reactions give out heat and others take it in
          - electrical energy can be counted in kilowatt-hours
        takeaway: >-
          A rate and a total give a date, and the date is what an argument is really about.
        format: BALLPARK
        question: >-
          At the rate it is running now, how many sols until the vehicle is full?
        answerText: >-
          About 245 sols at the current rate. The window is in 195, so the plant is not slightly
          behind.
        why: >-
          Two numbers everybody already had, divided once. At eleven kilograms a sol the plant needs
          about 245 more sols, and the window is in 195. That is what turns an argument about settings
          into an argument with a date on it. It also shows why waiting is not a plan. The gap is
          fifty sols wide.
        estimate:
          prompt: The vehicle is 2,700 kilograms short of what it needs. The plant is making about 11 kilograms of methane a sol.
          question: Choose what the plant is short and what it makes each sol.
          labels:
            - 2700  (kilograms still needed)
            - 11  (kilograms of methane made each sol)
            - 13.8  (kilograms a sol the schedule asks for)
            - 6600  (kilograms the vehicle holds in total)
            - 40  (degrees Sundqvist wants to add)
          values: [2700, 11, 13.8, 6600, 40]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 245
          tolerance: 15
          units: sols
          solution: >-
            2,700 ÷ 11 = about 245 sols, against 195 before the window.
          explanation: >-
            The 13.8 is the rate the schedule wants. Dividing by it gives the time the plant is supposed
            to take, not the time it will take.
          givens:
            - the plant is 2,700 kilograms short of what the vehicle needs
            - the cell works at 298 K
          relationship: >-
            Time needed = the amount still wanted divided by the amount made each sol.
  # ---------------------------------------------------------------- sol 293
  - title: The line that stopped passing gas
    objective: Find what closed the cold line, and what the hot run has to do with it.
    briefing: The cold end stopped delivering liquid three hours into the hot run.
    stake: >-
      Sol 293, and overnight the hotter run stopped. A transfer line went solid overnight and a
      whole sol of production is standing in a pipe. Mei-Ling Cho, the cryogenics engineer, will
      not open it while it is pressurised. Herrera says this is exactly what he warned about.
      Today you work out what blocked the pipe without opening it. You also find out what the hot
      pass did to the water.
    takeaway: A plant is a chain, and the fastest step decides nothing on its own.
    stops:
      - group: PHASE
        task: Find the one explanation the quiet readings allow
        title: Reading a blockage from outside the pipe
        concept: 'Solids, liquids and gases, and what changes between them'
        place: Cold End
        scene: >-
          A transfer line stopped passing gas overnight. Cho will not open it while it is under
          pressure. She has four readings from outside it.
        guide: >-
          One explanation has to fit all four readings, not just the loudest one. Read the ordinary
          ones first — a reading that looks normal is what rules the other answers out.
        background:
          - >-
              Why the unremarkable readings decide it. The salient reading is what draws
              attention, and it is usually consistent with several explanations at once,
              which is why it rarely settles anything. The readings that discriminate are
              the ones a candidate predicts should have moved and which have not: a normal
              value is a positive result against every mechanism that would have disturbed
              it.
          - >-
              How to work the candidates. Take each mechanism and predict the panel it
              implies before you look at the panel again — which readings it drives, in
              which direction, and by roughly how much. Then compare. Working that way round
              is what separates a diagnosis from a rationalisation, because the prediction
              is made before the data is consulted.
          - >-
              Why only one candidate survives. Several will account for part of the panel,
              deliberately so, and a partial fit is exactly what a confident wrong answer
              feels like from the inside. When two remain, look for the reading on which
              their predictions differ and let it decide. If no reading separates them you
              have not finished reading the panel.
        assumes:
          - a refrigerator that has reached its set point is doing its job
          - water freezes at a far higher temperature than methane condenses at
        takeaway: >-
          A reading that looks normal is what rules an explanation out.
        format: DIAGNOSIS
        headline: The cold line stopped passing gas over three hours, with the refrigerator at temperature.
        task: Which explanation fits every reading, not the loudest one?
        readings:
          - { zone: Cold line, label: Flow, value: fell to 0 over 3 h, status: alarm }
          - { zone: Cold head, label: Temperature, value: 114 K, status: normal, note: at its set point }
          - { zone: Drier outlet, label: Water content, value: 900 ppm, status: alarm }
          - { zone: Vacuum jacket, label: Pressure, value: steady, status: normal, note: rules out a jacket leak }
          - { zone: Upstream, label: Loop pressure, value: rising, status: high }
        choices:
          - { label: Water past the drier is freezing in the exchanger, mechanism: 'The line cools through 273 K long before it gets anywhere near methane.' }
          - { label: The refrigerator has lost capacity since the hot run began, mechanism: 'A cold head short of temperature passes gas where it should deliver liquid.' }
          - { label: The vacuum jacket has failed, mechanism: 'Heat leaking in warms the line and stops it condensing anything.' }
          - { label: A valve on the cold line was left shut, mechanism: 'A closed valve blocks the flow with everything else reading normally.' }
        answer: Water past the drier is freezing in the exchanger
        why: >-
          The refrigerator is holding its temperature and the vacuum jacket is intact, so the cold end
          is doing its job and nothing is leaking heat in. That leaves something solid inside the
          pipe. The hot run put more water into the gas than the drier could take out, and water turns
          to ice at 273 kelvin, which this line passes through long before it gets near methane. So
          the block is water, and the cause is two sols old.
      - group: EQUIL
        task: Separate the thermodynamic temperature effect from the flow change in the hot run.
        title: Why the hotter pass gave less
        concept: 'Reactions go faster when it is hotter'
        place: Reactor Hall
        scene: >-
          Herrera has the numbers from both passes. The hot one turned gas over faster and gave back
          less methane than the cooler one before it.
        guide: >-
          Work out what share of the feed came back as methane. Two tiles and the hundred do it. The
          temperature is why the two passes differ, and it is not part of either sum.
        background:
          - >-
              What Q is, and what it is not. Q has the same form as K and is evaluated wherever
              the mixture happens to be, so it is a description of the present rather than a
              constant. Comparing the two says which way the reaction still has to go, and
              nothing about how fast it will get there.
          - >-
              Why the exponents are not decoration. Every partial pressure enters raised to its
              coefficient in the balanced equation, and hydrogen's is four. Leaving it out
              changes Q by two orders of magnitude here, which is the difference between a
              mixture that is past its ceiling and one that is nowhere near it.
          - >-
              Why the hot run had two things wrong with it. Temperature moved the ceiling and
              throughput moved the residence time, and the assay alone cannot separate them.
              What it can settle is the ceiling: K at the hotter temperature is smaller, and the
              outlet mixture is already above it.
        assumes:
          - a reaction settles at the same place every time, at the same temperature
          - the Sabatier reaction gives out heat
        takeaway: >-
          A share of the feed is the honest way to compare two passes of different sizes.
        format: BALLPARK
        question: >-
          What per cent of the gas fed in came back as methane on the hot pass?
        answerText: >-
          12.5 per cent, against 16.1 per cent on the cooler pass. Hotter went faster and delivered
          less.
        why: >-
          Comparing raw kilograms would be unfair if the two passes were fed different amounts, so
          both get turned into a share of what went in. The hot pass returns 12.5 per cent and the
          cool one 16.1. That is the argument on this station in one number: the hot bed works through
          gas faster and sends more of it round again unused. Whether that is worth it depends on how
          much the recycle loop costs to run, which is tomorrow's problem.
        estimate:
          prompt: The hot pass was fed 112 kilograms of gas and gave back 14 kilograms of methane. The cooler pass the sol before gave 18.
          question: Choose the methane the hot pass gave and the gas it was fed.
          labels:
            - 14  (kilograms of methane from the hot pass)
            - 112  (kilograms of gas fed into it)
            - 100  (to turn a share into a percentage)
            - 18  (kilograms from the cooler pass, to compare)
            - 40  (degrees hotter than the cool pass)
          values: [14, 112, 100, 18, 40]
          slots: 3
          template: '{0} ÷ {1} × {2}'
          formula: a/b*c
          correct: [0, 1, 2]
          target: 12.5
          tolerance: 1
          units: per cent
          solution: >-
            14 ÷ 112 × 100 = 12.5 per cent, against 16.1 for the cooler pass.
          explanation: >-
            The temperature difference is why the two passes differ. It is not part of working out
            either share.
          givens:
            - 112 kilograms of gas fed to the hot pass
            - 14 kilograms of methane collected from it
          relationship: >-
            Percentage = the part divided by the whole, multiplied by a hundred.
      - group: SOIL
        task: Order the steps the water plant runs in.
        title: Getting water out of frozen ground
        concept: 'A physical change and a chemical change are different things'
        task: >-
          Order the three steps of getting water out of the ground.
        place: Water Plant
        scene: >-
          Femi Abiola, the regolith and water lead, has ice-bearing ground in the hopper. Getting the
          water out of it takes three steps, and the order matters.
        guide: >-
          Put the three steps in the order they have to happen. Ask what each step needs to already be
          true before it can work at all.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim about dependency: each
              step is here because the one before it has already happened, or has to have.
              One transposed pair falsifies that claim wherever it sits, so partial credit
              would be credit for a sequence that does not work.
          - >-
              Why the ends are the place to start. The first and last cards are constrained
              by having nothing before or after them, which usually makes them the two you
              can settle from the scene alone. Pinning them collapses the remaining
              arrangements sharply, and what is left in the middle is where the actual
              judgement lives.
          - >-
              What the rail can be ordered on. Time is the usual axis, but it is not the
              only one. An order can run on cost, on risk, or on reversibility — every
              observation that leaves the sample as it was, before any that consumes it. On
              those boards a chronological reading finds nothing, because none of the steps
              has to happen at a particular hour.
        assumes:
          - warming ice-bearing soil releases water as vapour at low pressure
          - dissolved salts stay behind when water evaporates
        takeaway: >-
          Water leaves frozen ground as vapour, and vapour has to be caught somewhere colder.
        format: SEQUENCE
        why: >-
          Warming the ground turns its ice straight into vapour, and in a sealed hopper the vapour has
          nowhere to go but the pipe. A chilled plate is the only cold thing in the system, so that is
          where it turns back into liquid. Cleaning comes last, because the salts that came out of the
          ground are dissolved in the water by then. Do the cleaning first and there is nothing to
          clean.
        cards:
          - Warm the sealed hopper so the water leaves as vapour
          - Catch the vapour on a chilled plate as liquid
          - Take the salt out on the polishing column
        order: [0, 1, 2]
  # ---------------------------------------------------------------- sol 294
  - title: The loop that pays for itself
    objective: Size the feed the plant needs, and find where the current is going.
    briefing: With the cold line clear, the question is whether the feed can keep up with the bed.
    stake: >-
      Sol 295, and after four days the reactor still does not use everything it is fed. What comes
      out the far end goes round again. Herrera wants the loop understood before anybody changes
      another setting. Rosalind Achebe has a power bill she cannot account for. Today you work out
      how much gas the bed has to be fed to make the target. You also find where eight per cent of
      the electricity is going.
    takeaway: A plant is limited by whichever feed runs out first, and it will not be the same one every sol.
    stops:
      - group: EQUIL
        task: Size the carbon dioxide the bed needs each sol
        title: How much gas the bed has to be fed
        concept: 'Mass is conserved: what went in comes out somewhere'
        place: Reactor Hall
        scene: >-
          The plant has to average 13.8 kilograms of methane a sol. Herrera wants to know how much gas
          has to go in at the front to get that out of the back.
        guide: >-
          Five numbers, and two of them belong to other parts of the equation: the
          hydrogen ratio, and the water produced. Ask of each whether this carbon
          bookkeeping needs it. One carbon atom goes from each carbon dioxide into one
          methane. So one particle in gives one particle out, and the weights are not the same, because
          the molar masses differ.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - one carbon dioxide particle gives one methane particle
          - a particle's weight turns a count of particles into kilograms
        takeaway: Stoichiometry turns a production target into a feed rate, and the feed rate is what the intake has to meet.
        format: BALLPARK
        question: Estimate the carbon dioxide the reactor must be fed each sol.
        why: >-
          Methane weighs sixteen grams for every carbon dioxide's forty-four, so the plant has to
          swallow far more than it makes. Thirty-eight kilograms in for fourteen out. That is not
          waste — the rest of the weight leaves as water, and the water goes back into the plant. It
          does explain why the compressor that pulls carbon dioxide out of the air is the machine
          everything else waits for.
        estimate:
          prompt: The plant must average 13.8 kg of methane a sol. Each carbon dioxide particle gives one methane particle.
          question: Estimate the carbon dioxide the reactor must be fed each sol.
          labels:
            - 13.8 kg  (methane needed each sol)
            - 44  (what one carbon dioxide particle weighs, in units)
            - 16  (what one methane particle weighs, in the same units)
            - 4  (hydrogen particles needed for each carbon dioxide)
            - 2  (water particles made with each methane)
          values: [13.8, 44, 16, 4, 2]
          slots: 3
          template: "{0} × {1} ÷ {2}"
          formula: a*b/c
          correct: [0, 1, 2]
          target: 37.9
          tolerance: 2
          units: kg per sol
          solution: 13.8 kg × 44.0 ÷ 16.0 = 37.9 kg of carbon dioxide a sol.
          explanation: One particle in gives one particle out, so the weights are what set the ratio. The hydrogen and the water are counted elsewhere.
          relationship: >-
            Mass in = mass out, so the feed needed is the product wanted scaled by the two particle
            weights.
      - group: ELEC
        task: Close the hydrogen-equivalent charge ledger and identify the part of the current that did not become collected hydrogen.
        title: Where 8% of the charge went
        relationship: >-
          Mass out = mass in. Everything the cell was given has to turn up somewhere, collected or
          not.
        concept: 'Mass is conserved: what went in comes out somewhere'
        place: Electrolysis Hall
        scene: >-
          Achebe has counted the electricity going into the cell and the hydrogen coming out. They do
          not match. Eight per cent of the charge has gone somewhere else.
        guide: >-
          Read every stream, then count only what belongs in the charge ledger.
          Faraday's law says 640 amps for a sol should give about 594 grams of hydrogen
          and the separator collected 546. Achebe has already cleared the collection
          line and the downstream inventory, so the missing 8% is a term the ledger does
          not yet have.
        background:
          - >-
              What Faraday's law is claiming. Every electron that crosses the cell makes a
              fixed amount of hydrogen. So the predicted mass is arithmetic on the charge,
              and it is an upper bound: it assumes every electron did the intended reaction.
          - >-
              Why the gap is a measurement rather than an error. Electrons that did
              something else — a side reaction, a shuttle current, recombination inside the
              cell — still crossed and still counted as charge. The shortfall is therefore a
              measurement of how much of the current did useful work, which is the cell's
              current efficiency.
          - >-
              Why checking the line first was right. A leak or unmeasured inventory
              downstream would explain the gap without saying anything about the cell.
              Ruling those out is what turns a discrepancy into evidence about the
              electrochemistry.
        assumes:
          - Faraday’s law converts charge into a theoretical amount of product
          - current efficiency is collected product divided by theoretical product from charge
        takeaway: Faraday’s law fixes the theoretical product from charge; current efficiency measures how much of that charge reached the intended reaction.
        format: BALANCE
        question: What term closes the charge ledger, and what does that term measure about the cell?
        balance:
          total:
            amount: 594
            unit: g H₂-equivalent
            label: Product allowed by measured charge
          streams:
            - id: collected
              label: Hydrogen collected at the separator
              value: 546
              display: 546 g
            - id: line_inventory
              label: Change in hydrogen held in the collection line
              value: 0
              display: No change
            - id: measured_vent
              label: Measured hydrogen vent loss
              value: 0
              display: No loss detected
            - id: nonproductive
              label: Charge not recovered as collected H₂
              value: 48
              display: 48 g-equivalent
              hidden: true
          tolerance: 3
          hint: All rows are written in hydrogen-equivalent grams. Count the measured product and any real downstream storage or loss before deciding what must be assigned to the cell itself.
        answerText: The ledger is short by about 48 g of hydrogen-equivalent charge. The cell collected 546/594 ≈ 92% of the Faraday-law maximum, so its current efficiency is about 92%.
        why: >-
          Electricity in and hydrogen out should agree, because every unit of charge makes a fixed
          amount of gas. When they do not, the rest went into something else. Here it is a side
          reaction and a small leak, and both cost power and make nothing. Eight per cent sounds
          survivable until it is turned into kilowatt-hours a sol.
      - group: SOIL
        task: Match each dissolved species to what it does downstream.
        title: What comes with the water

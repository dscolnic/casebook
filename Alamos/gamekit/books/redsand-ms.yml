              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - an ion-exchange bed swaps unwanted ions for harmless ones
          - a packed bed holds a finite number of ions
        takeaway: >-
          A filter that traps from the top down gives no warning until it is nearly full.
        format: CHOICE
        question: >-
          What does the water leaving the column do as the column fills up?
        answerText: The outlet stays low until the loading front approaches it, then rises toward the inlet concentration. That breakthrough curve is the warning the plant must monitor.
        why: >-
          The column fills from the top down. While there is still fresh resin underneath, anything
          the upper part misses gets caught lower, and the water coming out is clean. That stays true
          almost to the end. When the last of the fresh resin is used, the salt comes straight through
          and the reading jumps. So a test at the outlet is a test that tells you the truth too late,
          which is why the next rule anybody writes is about counting litres instead.
        choices:

              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a liquid in a closed tank sits under the pressure of its own vapour
          - vapour pressure rises steeply with temperature
        takeaway: >-
          A closed tank warming up reads higher without losing anything at all.
        format: CHOICE
        question: >-
          Why is the pressure up when the mass has not changed?
        why: >-
          Pressure is the gas particles hitting the walls. Warm them and they move faster and hit
          harder, so the gauge climbs with nothing entering or leaving. The mass reading is what
          settles it: a leak takes mass out, and this tank has lost none. That is the difference
          between a tank that is warming and a tank that is emptying, and only one of the two is an
          emergency.
        choices:
          - The contents are warming up
          - Gas is escaping, and the scales are wrong
          - The liquid is boiling away out of the tank
          - The gauge has drifted, since pressure cannot change
        answer: The contents are warming up
        rebuttals:
          - Gas that escaped would take mass with it, and the mass is steady.
          - Boiling inside a sealed tank moves nothing out of it.
          - Pressure changes in a sealed tank all the time, with temperature.
  # ---------------------------------------------------------------- sol 302
  - title: 40% of the sun
    objective: Decide what the station stops doing when the power halves.
    briefing: A regional dust storm arrived overnight and the array is delivering less than half.
    stake: >-
      Sol 304, and a dust storm has been building for three days. The solar array is delivering
      under half of what it should. Yusuf Demir, the life support officer, will not give up any of
      his share. Everything else on the station is negotiable and everything else wants power.
      Today you work out what the dust leaves of the sun. You also decide what the station stops
      doing.
    takeaway: A power cut on a plain with one array is a decision about what the station stops doing.
    stops:
      - group: ELEC
        task: Work out how much sunlight is reaching the panels
        title: What the dust leaves of the sun
        answerText: >-
          45 watts a square metre, against 490 above the dust. The storm is leaving under a tenth of
          the sun.
        concept: 'A day has an energy budget, and everything spends from it'
        place: Electrolysis Hall
        scene: >-
          Yusuf Demir has five readings from the station's sun sensor, taken through the storm. They
          are not the same, and nobody trusts any one of them.
        guide: >-
          Five readings of one thing. Work out what they come to on average. Two tiles do it. The
          clear-sol figure is there to compare the answer against.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - each unit of optical depth cuts a beam by a further factor
          - a beam is attenuated as an exponential of the depth it passes through
        takeaway: >-
          One reading of a wandering number says almost nothing. The average of several says
          something.
        format: BALLPARK
        question: >-
          What is the average of the five readings taken through the storm?
        why: >-
          Dust moves, so the sensor reading moves with it. The lowest reading makes the storm look
          like the end of the station and the highest makes it look survivable. Neither is a fair
          picture. Added up and divided by five they come to 45 watts a square metre, against 490
          above the dust. That is under a tenth of the sun, and it is a number the crew can plan a sol
          around.
        estimate:
          prompt: The sun sensor was read five times through the storm. The readings were 52, 38, 61, 44 and 30 watts a square metre.
          question: Choose the five readings added together and how many there were.
          labels:
            - 225  (the five readings added together)
            - 5  (readings taken)
            - 490  (watts a square metre above the dust)
            - 61  (the highest single reading)
            - 1900  (square metres of panel)
          values: [225, 5, 490, 61, 1900]
          slots: 2
          template: "{0} ÷ {1}"
          formula: a/b
          correct: [0, 1]
          target: 45
          tolerance: 3
          units: watts a square metre
          solution: >-
            225 ÷ 5 = 45 watts a square metre.
          explanation: >-
            The highest single reading is why an average is needed. The clear-sol figure is what you
            compare the average with.
          relationship: >-
            Average = the readings added together, divided by how many there are.
      - group: GIBBS
        task: Build a plan for the power there is
        title: What the station stops doing
        concept: 'A day has an energy budget, and everything spends from it'
        place: Plant Control
        scene: >-
          The dust storm has cut the sol from about 2,000 kilowatt-hours to 430. The tanks are already
          drawing power and six other jobs are queued behind them.
        guide: >-
          Four hundred and thirty kilowatt-hours for the whole sol, against about two
          thousand on a clear one. Watch the answers list rather than the equipment: it
          shows what the station can still say at the end of the sol under your plan.
          Tank refrigeration is already drawing, so the sacrifices have to come from the
          six demands queued behind it.
        background:
          - >-
              Why refrigeration is not negotiable first. Liquid oxygen already made is
              stored energy the station cannot remake cheaply. Letting it boil off spends
              propellant that took sols of power to produce, so cutting refrigeration to
              save power usually loses more power than it saves.
          - >-
              What the answers list is for. Each demand buys the ability to make a
              particular claim at the end of the sol — that the tank is full, that the assay
              is current, that the soil work is on schedule. A plan is a choice of which
              claims survive the storm.
          - >-
              Why writing the sacrifices down matters. Breakers opened without a record
              become an argument afterwards about what was agreed. Demir and the station
              commander, Marion Wells, are
              asking for the list because the storm will last longer than anybody's memory
              of the reasoning.
        assumes:
          - stopping a process can be reversible or costly to reverse
          - a cryogenic tank warms up when its refrigerator stops
        takeaway: Loads are ranked by what stopping them costs to undo, rather than by what they draw.
        format: ALLOCATE
        question: 430 kilowatt-hours. Build the sol's plan, and know what it stops the station being able to say.
        allocate:
          hint: Nothing on this list is a wrong thing to run. What the plan cannot do is the price of what it can.
          pool:
            amount: 430
            unit: kWh
            mode: scalar
          items:
            - id: habitat
              label: Habitat heat and air
              cost: 180
              protected: true
              note: the crew is not a load
            - id: liquefier
              label: Liquefier and tank refrigeration
              cost: 210
            - id: stacks
              label: Electrolysis stacks at half rate
              cost: 160
            - id: batteries
              label: Recharge the battery reserve
              cost: 120
            - id: drill
              label: Drill and hopper heating
              cost: 90
            - id: drier
              label: Keep the product drier warm
              cost: 40
          answers:
            - question: Does the propellant already made stay in the tanks?
              requires:
                - liquefier
              required: true
            - question: Does the plant make any methane this sol?
              requires:
                - stacks
            - question: Is there reserve in hand for the next storm?
              requires:
                - batteries
            - question: Does the cold end stay clear of ice?
              requires:
                - drier
            - question: Is any ice cut today?
              requires:
                - drill
          commit: Commit the sol's plan
        answerText: >-
          Keep the habitat and the tank refrigeration inside 430. Then pick one more job at most. What
          you leave off is part of the answer.
        why: >-
          There is not enough power for the whole list, so something goes off. The crew's air and heat
          is not on the table. That leaves machines that all do useful work. The hard part is that the
          cheapest thing to stop is often the thing that costs most later. A cold tank has to be made
          cold again, and that costs more than keeping it cold ever did.
      - group: SOIL
        task: Decide what the water plant does with no drill

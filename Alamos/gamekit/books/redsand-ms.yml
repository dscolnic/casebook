  - title: Loading is one way
    objective: Decide whether this batch goes into the vehicle.
    briefing: The batch is made, the assay is back, and one line of it is outside the specification.
    stake: >-
      Sol 306, and after fifteen days the first batch is ready to load. Once propellant goes into
      the vehicle it does not come out again. Cho has one tank of oxygen for every tank of methane
      and wants both checked together. Today you work out how much oxygen a tonne of methane
      needs. You also decide which line the whole load depends on.
    takeaway: A decision that cannot be reversed is worth more care than one that costs more.
    stops:
      - group: EQUIL
        task: Match each assay line to what it means for the vehicle.
        title: The line that fails
        concept: 'Pure enough: what a specification really claims'
        task: >-
          Match each reading to what it means for the load.
        place: Reactor Hall
        scene: >-
          The first batch is analysed against the specification. Cho has three of the readings and the
          limit each one has to meet.
        guide: >-
          Match each reading to what it means for loading. Being inside a limit is not the same as
          being harmless, and being outside one is not always a disaster.
        background:
          - >-
              Why this is a matching board and not four separate questions. Responses on
              boards like this are written to be plausible for more than one situation, so
              choosing them one at a time lets a nearly-right answer through unexamined.
              Having to place all of them forces the comparison — not "is this reasonable
              here", but "is it more right here than there".
          - >-
              How to use the one-each rule. Because the responses are a set to be
              distributed rather than a list to be sampled, every join you make constrains
              the rest. Settling the two you are confident of can leave the remaining pair
              decided by elimination. Where it does not, two responses are still competing
              for one situation, and that is exactly the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every response used once,
              three correct joins leave the fourth with only one place to go. Any error
              therefore involves at least two joins. That is worth remembering when the last
              pair looks forced: the fault is usually not in the join you are struggling
              with, but in one you made early and stopped questioning.
        assumes:
          - water freezes at a temperature the vehicle's valves reach in use
          - carbon monoxide does not burn to give the energy methane does
        takeaway: >-
          A specification is a list of limits, and missing one of them can matter more than missing
          another.
        format: PROTOCOL
        why: >-
          Three readings, and only one of them stops the load. The methane figure passes, but with
          almost no margin, so it is worth watching on the next batch. The carbon monoxide passes
          comfortably and does nothing where it ends up. The water is eight times its limit, and water
          freezes inside valves at temperatures this vehicle will certainly see. Loading is one way,
          so that is the reading that has to be fixed before anything moves.
        scenarios:
          - Methane at 99.1 per cent, limit 99.0
          - Water at 400 parts per million, limit 50
          - Carbon monoxide at 0.5 per cent, limit 1.0
        choices:
          - Inside the limit, with very little to spare
          - Eight times the limit, and it freezes in valves
          - Inside the limit, and harmless where it ends up
        mapping: [0, 1, 2]
      - group: PHASE
        task: Work out how much oxygen goes with the methane
        title: How much oxygen a tonne of methane needs
        concept: 'Mass is conserved: what went in comes out somewhere'
        place: Cold End
        scene: >-
          Cho is loading the vehicle. Every kilogram of methane needs oxygen to burn with, and the two
          tanks have to match.
        guide: >-
          Five numbers, and two of them belong elsewhere: the methane the vehicle
          carries, and the molar mass of carbon dioxide. Ask of each whether this ratio
          needs it. The recipe counts particles and tanks are filled by weight, so the
          molar masses do the converting. And note that an engine may deliberately run
          away from this ratio.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - burning fuel needs oxygen, and out here it has to be carried
          - a recipe counts particles while a tank is filled by weight
        takeaway: >-
          A count of particles is not a weight until you know what each one weighs.
        format: BALLPARK
        question: Estimate the mass of oxygen needed for each kilogram of methane burned.
        why: >-
          Fuel needs air to burn. Out here there is no air, so the vehicle has to carry its own.
          Methane needs two bits of oxygen for each bit of fuel. Oxygen is also heavier. Put the two
          together and you get four kilograms of oxygen for every kilogram of fuel. The oxygen tank is
          much the bigger of the two, and nobody gets to change that.
        estimate:
          prompt: Burning methane completely takes two moles of oxygen per mole of methane. Oxygen is 32.0 g per mole and methane is 16.0.
          question: Estimate the mass of oxygen needed for each kilogram of methane burned.
          labels:
            - 2  (oxygen particles burnt with each methane particle)
            - 32  (what one oxygen particle weighs, in units)
            - 16  (what one methane particle weighs, in the same units)
            - 6600 kg  (methane the vehicle carries)
            - 44  (what one carbon dioxide particle weighs, in units)
          values: [2, 32, 16, 6600, 44]
          slots: 3
          template: "{0} × {1} ÷ {2}"
          formula: a*b/c
          correct: [0, 1, 2]
          target: 4
          tolerance: 0.3
          units: kg of oxygen per kg of methane
          solution: >-
            2 × 32.0 ÷ 16.0 = 4 kilograms of oxygen for every kilogram of methane.
          explanation: >-
            The two ratios are different. Two molecules of oxygen per one of methane makes four
            kilograms per kilogram, because oxygen molecules are heavier.
          relationship: >-
            Oxygen per kilogram of fuel = how many oxygen particles each fuel particle needs × their weight ÷ the fuel's weight.
      - group: ELEC
        task: Say whether the stacks can be pushed harder
        title: What limits the current
        concept: 'A day has an energy budget, and everything spends from it'
        place: Electrolysis Hall
        scene: >-
          Achebe wants to run the cell harder to catch up. Something stops her, and it is not the
          electricity supply.
        guide: >-
          Running harder means more current, and more current means more waste heat. Ask what has to
          happen to that heat before the cell can take another amp.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - the product a cell makes is proportional to the charge it passes
          - the voltage above the minimum leaves the cell as heat
        takeaway: >-
          What limits a machine is often not what it needs, but what it has to get rid of.
        format: CHOICE
        question: >-
          What actually limits how hard the cell can be run?
        choices:
          - The heat the cooling loop can carry away
          - The water supply, since it splits only what it gets
          - The pressure in the hydrogen line as output rises
          - A fixed amount of gas a cell can make in a sol
        answer: The heat the cooling loop can carry away
        why: >-
          Every extra amp makes more hydrogen and more waste heat, and the heat has to go somewhere.
          On this station it goes into a cooling loop with a fixed capacity, and once that loop is
          full the next amp raises the stack temperature instead. So the limit is not the supply, the
          water or the cell itself. It is the radiator, which is a long way from the thing anybody was
          arguing about.
        rebuttals:
          - Water is short here, and the tank still holds more than the cell can use today.
          - That pressure is set by a valve and is nowhere near any limit.
          - >-
              Nothing fixes that amount: it goes up with the current, which is the whole point.
  # ---------------------------------------------------------------- sol 305
  - title: What the next crew is told
    objective: Say what is known, how well it is known, and what was never established.
    briefing: The fortnight ends, and what survives it is what gets written down.
    stake: >-
      Sol 310, the last day of the run. The next crew arrives in three hundred sols, and everybody
      here will have gone home. Sundqvist wants a list of what to leave running. Herrera wants
      every claim in the handover to say what is behind it. Today you decide what keeps running
      while nobody is watching. You also write the honest sentence about the catalyst bed.
    takeaway: A handover states what is known, how well, and what was never established at all.
    stops:
      - group: GIBBS
        task: Fund what the next crew should inherit.
        title: What to leave running
        concept: 'Change one thing at a time and see what moves'
        place: Plant Control
        scene: >-
          Only two things can be left running for the crew who arrive three hundred sols from now.
          Marion Wells, the station commander, has four candidates on the board.
        guide: >-
          This season lost 38 sols of production to a measurement taken every sol,
          logged every sol, and read by nobody. The bed already carries four
          thermocouples. The array has one sun sensor, and it has never disagreed with
          the sky. The next crew arrives 300 sols from now and will not have met anybody
          who was here. An alarm reaches somebody without being looked for. A written
          order tells whoever hears it what to do next.
        rules: >-
          Spread the hundred points across the 4 proposals. At least 80 of them have to
          be committed, because a panel that funds almost nothing has not decided
          anything. Your largest single allocation must be 35 or more, and it has to
          land on what the evidence supports most. Keep the total sitting on proposals
          the evidence does not support under fifteen. And a proposal it does support
          should not be left under twenty.
        background:
          - >-
              Why the whole spread is graded. Funding is not a vote for one idea. A
              portfolio says what you think is likely, what is worth hedging against, and
              what is not worth pursuing at all — and the last two are where most of the
              information is. Backing the right proposal while quietly funding a bad one is
              a worse answer than it looks. That is why the small numbers count as much as
              the big one.
          - >-
              What the three numbers are for. Thirty-five is what makes a lead a lead: below
              it you have hedged rather than chosen. Fifteen is the most that can sit on
              unsupported work before it stops being a rounding error. Past that it is a
              second opinion nobody argued for. Twenty is the floor under a line of work you
              have already called strong, because funding it too thin to finish spends the
              money and buys nothing.
          - >-
              Why there is a floor on the total. Points held back are not caution; they are
              a decision not to decide, taken with somebody else's money and somebody else's
              deadline. The floor is what forces the panel to say something.
        assumes:
          - the fault that cost this season went undetected because nothing measured it
          - the next crew arrives without anybody from this one
        takeaway: What outlives a crew is what somebody made automatic before they left.
        format: SCIENCETANK
        answerText: >-
          Leave the water alarm on, and the written rule for what to do when it sounds. One finds
          trouble and the other says what to do about it.
        why: >-
          Nobody is here for three hundred sols. So a thing left running has to be safe when it fails,
          and worth the power it will draw the whole time. Those are two tests, and a machine has to
          pass both. There is a third one people forget. What is left running is what the next crew
          will find working, and walking into a cold station is a very different first day.
        proposals:
          - label: A
            text: An alarm on feed-water conductivity, wired to the plant panel rather than to a log.
          - label: B
            text: A written standing order for changing the lead polishing column at breakthrough.
          - label: C
            text: A spare set of thermocouples for the catalyst bed.
          - label: D
            text: A second sun sensor at the far end of the array.
        recommended:
          A: 45
          B: 35
      - group: SOIL
        task: Set the warning and column-swap thresholds, then replay the historic conductivity rise without changing them.
        title: Write the rule before the trace moves
        concept: 'Something in the way: how a catalyst gets poisoned'
        place: Water Plant
        scene: Abiola is writing a rule for a crew he will never meet. He loads last season’s conductivity trace into the alarm simulator. Once the replay starts, the thresholds are locked and the values run forward.
        guide: >-
          One rule, written before the trace moves and fixed once you release it. The changeover takes
          one update from the moment it is called, and past 3 × baseline the feed water is outside
          the accepted range. So the line goes back from 3 by however far the trace climbs in that
          update — and not so far back that a clean bed is swapped out for a reading which meant
          nothing.
        background:
          - >-
              Why conductivity is the signal. It rises as the column loses capacity and lets
              ions through, so it is an early indicator of exhaustion rather than a
              measurement of failure. The trace moves before the water is out of
              specification, which is what makes a rule possible at all.
          - >-
              Why two thresholds. A warning gives somebody time to prepare the fresh column;
              the changeover commits the swap. One threshold doing both means the
              preparation starts at the moment the swap should already have happened.
          - >-
              What writing for an absent crew changes. No judgement is available at the
              moment it fires, so the rule has to hold for a trace nobody has seen,
              including a fast rise. That is why the margin is set against the slowest case
              rather than the typical one.
        assumes:
          - an exchange bed reaches breakthrough without warning
          - a lead and lag pair lets one bed be changed while the other works
        takeaway: A breakthrough threshold must be written before the rise and early enough to cover the action’s lead time.
        format: TRIGGER
        question: >-
          At what conductivity do you move the lag column into lead service, given the changeover
          takes one update to complete?
        trigger:
          hint: >-
            Set the rule before release. The swap takes one update to complete, and the accepted-water
            limit on this normalised replay is 3.0 times the clean baseline.
          direction: rising
          scale:
            label: Conductivity of the treated water
            min: 1
            max: 6
            step: 0.1
            unit: × clean baseline
            anchors:
              - { at: 1.0, means: 'the bed is clean and nothing is passing through it' }
              - { at: 4.5, means: 'well outside specification, with the electrolyser taking whatever the bed let through' }
          objective: >-
            The fresh bed is in lead service before the trace crosses 3 × baseline.
          consequenceLimit: 3
          rehearsal:
            note: the bed that was changed out last quarter
            stream:
              - { value: 1.0, hoursLeft: 8 }
              - { value: 1.05, hoursLeft: 7 }
              - { value: 1.2, hoursLeft: 6 }
              - { value: 1.7, hoursLeft: 5 }
              - { value: 2.4, hoursLeft: 4 }
              - { value: 3.6, hoursLeft: 3 }
              - { value: 4.8, hoursLeft: 2 }
              - { value: 5.6, hoursLeft: 1 }
              - { value: 5.9, hoursLeft: 0 }
          conditions:
            - id: swap
              label: Move lag column into lead service
              leadHours: 1
              window: { min: 1.6, max: 2 }
          stream:
            - step: 0
              value: 1
              hoursLeft: 8
              at: update 0
              update: 1 × clean-baseline conductivity
            - step: 1
              value: 1
              hoursLeft: 7
              at: update 1
              update: 1 × clean-baseline conductivity
            - step: 2
              value: 1.1
              hoursLeft: 6
              at: update 2
              update: 1.1 × clean-baseline conductivity
            - step: 3
              value: 1.3
              hoursLeft: 5
              at: update 3
              update: 1.3 × clean-baseline conductivity
            - step: 4
              value: 1.6
              hoursLeft: 4
              at: update 4
              update: 1.6 × clean-baseline conductivity
            - step: 5
              value: 2
              hoursLeft: 3
              at: update 5
              update: 2 × clean-baseline conductivity
            - step: 6
              value: 2.6
              hoursLeft: 2
              at: update 6
              update: 2.6 × clean-baseline conductivity
            - step: 7
              value: 3.4
              hoursLeft: 1
              at: update 7
              update: 3.4 × clean-baseline conductivity
            - step: 8
              value: 4.5
              hoursLeft: 0
              at: update 8
              update: 4.5 × clean-baseline conductivity
        answerText: >-
          Swap at about 1.7 × baseline. It fires with the update the changeover needs, and the trace
          does not reach 3 × baseline until two updates later.
        why: The outlet can remain near baseline while the exchange front is still inside the bed, then rise quickly as the front reaches the end. A threshold is useful only if the response can finish before the water leaves specification. Here changeover takes one update. Triggering at twice baseline completes the swap while the next point is still 2.6 times baseline. Waiting for 2.6 completes it after the trace has crossed the 3.0 limit. Precommitting the rule prevents the next crew from turning hindsight into policy.
      - group: KINET
        task: State what is known about the catalyst and what is not
        title: The honest claim about the bed
        concept: 'Pure enough: what a specification really claims'
        place: Catalyst Bay
        scene: >-
          The handover has to say something about the new catalyst charge. The log from every sol it
          has run is on the desk, and the report needs one sentence about it.
        guide: >-
          Four sentences somebody could write. Ask of each what evidence would be needed to back it
          up, and whether five sols of running gives you that.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a claim is limited by the conditions it was tested under
          - a poison accumulates over time rather than acting at once
        takeaway: >-
          A claim is honest when the evidence behind it reaches exactly as far as the words do.
        format: CHOICE
        question: >-
          What can the handover honestly say about the new charge?
        why: >-
          The first sentence says what happened and for how long, and it holds up. The second claims
          more than anybody measured. The third is the dangerous one: the charge has never met
          chloride, so saying it is safe from chloride is not a finding at all — it is a gap described
          as a result. And refusing to say anything wastes five sols of good evidence. The next crew
          needs the sentence that is exactly the right size.
        choices:
          - It matched the old charge for five sols on clean water
          - It works better than any charge the station has run
          - It cannot be harmed by chloride
          - Nothing can be said after only five sols
        answer: It matched the old charge for five sols on clean water
        rebuttals:
          - Better than any is a bigger claim than five sols can carry.
          - Nobody has fed it chloride, so nothing has been shown about that.
          - Five sols shows something real; it just does not show everything.
# ------------------------------------------------------------- review stops
# Lessons no mission points at. From sol 3 the engine appends a callback to an
# area taught earlier and prefers a "— Review" variant of that lesson, so these
# are the spaced retrieval rather than spares: the same idea, a different case,
# a fortnight after it was first met.
lessons:
  - group: EQUIL
    title: What the loop settles at — Review
    concept: 'Reactions go faster when it is hotter'
    task: Say what each change does to the balance, on a different reactor
    place: Reactor Hall
    scene: >-
      Herrera has a different plant on the screen — one that makes ammonia. The reaction is not
      the same and the three levers are.
    guide: >-
      Four changes and four effects, in a reactor making something else entirely.
      Pair them the same way. Count the gas molecules on each side for pressure. Ask
      which side the heat is on for temperature. Ask whether anything taking part
      was added or removed. And a catalyst changes the time rather than the
      destination.
    background:
      - >-
          Why this is a matching board and not four separate questions. Responses on
          boards like this are written to be plausible for more than one situation, so
          choosing them one at a time lets a nearly-right answer through unexamined.
          Having to place all of them forces the comparison — not "is this reasonable
          here", but "is it more right here than there".
      - >-
          How to use the one-each rule. Because the responses are a set to be
          distributed rather than a list to be sampled, every join you make constrains
          the rest. Settling the two you are confident of can leave the remaining pair
          decided by elimination. Where it does not, two responses are still competing
          for one situation, and that is exactly the distinction the stop is testing.
      - >-
          Why you cannot be wrong about exactly one. With every response used once,
          three correct joins leave the fourth with only one place to go. Any error
          therefore involves at least two joins. That is worth remembering when the last
          pair looks forced: the fault is usually not in the join you are struggling
          with, but in one you made early and stopped questioning.
    assumes:
      - a reaction that gives out heat has its balance pushed back by heating
      - fewer gas molecules on one side makes that side favoured by pressure
    takeaway: A rule about balance is about the equation's shape, not about the substance in the pipe.
    format: PROTOCOL
    task: Match each change to what it does to the ammonia.
    scenarios:
      - The vessel is squeezed to twice its pressure
      - The vessel is warmed by sixty degrees
      - Ammonia is taken out and the rest sent back
    choices:
      - More ammonia — the products take up less room
      - Less ammonia — heat is one of the products
      - More ammonia — taking a product away pulls it forward
    mapping: [0, 1, 2]
    why: >-
      This is the same reasoning in a different plant. Four gas molecules go in and two come out,
      so squeezing the vessel favours the smaller side and more ammonia forms. Heat is one of the
      things the reaction produces, so supplying more of it pushes back. Taking the product out
      leaves the mixture short and pulls the reaction forward again. The chemistry is different
      and the three levers are the same three.
  - group: KINET
    title: Rate is not yield — Review
    concept: 'Temperature is how fast the particles are moving'
    task: Separate speed from ceiling on a different reaction
    place: Catalyst Bay
    scene: >
      The greenhouse reactor is running cold and slow. Its operator proposes 40 degrees more, and
      the same argument that ran through the propellant plant a fortnight ago starts again.
    guide: >-
      Four pairs of statements, and each pair makes two claims. Ask of each whether
      the two halves are allowed to disagree. Temperature is carried by two
      quantities that move in opposite directions for a heat-releasing reaction. So
      the pair that has them both rising cannot be right, and neither can the pair
      that has neither moving.
    background:
      - >-
          Why the wrong options are the interesting ones. Each distractor is written to
          be the answer under one specific misreading — a step skipped, a quantity
          confused with a rate, a correlation taken for a cause. Identifying which
          misreading each belongs to is where the learning is; the right answer alone
          can be reached on instinct and teach nothing.
      - >-
          Why the shape of an option tells you nothing. A correct answer collects the
          qualifying clause and the unit. So across a whole game the key used to be the
          longest option far more often than chance — 88 per cent of passage quizzes
          here, before it was fixed. It is now checked per game as a binomial tail, so
          length, hedging and specificity have had the signal taken out of them
          deliberately.
      - >-
          What the verdict adds. Every wrong option carries its own rebuttal, and the
          verdict prints them — the reason that option fails, not a restatement of the
          right one. They are worth reading after a correct answer as well: a right
          choice made for an approximate reason is indistinguishable from a sound one
          until the day the approximation is what is being tested.
    assumes:
      - heating raises the fraction of collisions that clear the barrier
      - an exothermic reaction's balance is pushed back by heating
    takeaway: One setting moving two quantities in opposite directions is the normal case rather than a special one.
    format: CHOICE
    question: A reaction that gives out heat is run hotter. Which pair of statements is right?
    choices:
      - Faster to its balance, and less product there
      - Faster to its balance, and more product there
      - Slower to its balance, and less product there
      - Neither changes — heat acts on the catalyst
    answer: Faster to its balance, and less product there
    why: >-
      Two things move when you heat this reaction and they move opposite ways. The molecules go
      faster, so the mixture reaches its balance sooner. But the reaction gives out heat, so
      adding heat pushes it back and the balance itself holds less product. Getting there quicker
      to a worse place is the whole shape of the argument on this station, and it is why nobody
      can settle it by shouting.
    rebuttals:
      - Heat pushes this reaction backwards, so the balance holds less rather than more.
      - Heat always speeds a reaction up; it never slows it down.
      - A catalyst changes the speed and never changes the balance.
  - group: PHASE
    title: What freezes before methane condenses — Review
    concept: 'Solids, liquids and gases, and what changes between them'
    place: Cold End
    scene: >-
      Cho has four gases and their freezing temperatures. She wants them in the order a cooling
      line would take them out.
    guide: >-
      All four substances are in the stream together, so nothing here happens before
      anything else. What orders them is how strongly their molecules hold on to one
      another. Ask of each what kind of attraction it has: hydrogen bonds, weaker
      forces between molecules, or only the fleeting pull between electron clouds.
      One of them is a single atom.
    background:
      - >-
          Why the order is graded whole. A sequence is a claim about dependency: each
          step is here because the one before it has already happened, or has to have.
          One transposed pair falsifies that claim wherever it sits, so partial credit
          would be credit for a sequence that does not work.
      - >-
          Why the ends are the place to start. The first and last cards are constrained
          by having nothing before or after them, which usually makes them the two you
          can settle from the scene alone. Pinning them collapses the remaining
          arrangements sharply, and what is left in the middle is where the actual
          judgement lives.
      - >-
          What the rail can be ordered on. Time is the usual axis, but it is not the
          only one. An order can run on cost, on risk, or on reversibility — every
          observation that leaves the sample as it was, before any that consumes it. On
          those boards a chronological reading finds nothing, because none of the steps
          has to happen at a particular hour.
    assumes:
      - each substance leaves the gas phase at its own temperature
      - stronger attractions between molecules mean a higher condensation temperature
    takeaway: Cooling a mixture separates it in the order the attractions between its molecules run.
    format: SEQUENCE
    task: Order the substances by the temperature at which they leave the gas, warmest first.
    cards:
      - Water, which holds together far above room temperature
      - Carbon dioxide, which goes solid near 195 kelvin
      - Nitrogen, which turns liquid near 77 kelvin
    order: [0, 1, 2]
    axis: Order the four substances by the temperature at which each one leaves the gas, warmest first. Nothing here happens before anything else — they are all in the stream together, and the cooling picks them off in the order their molecules hold on to one another.
    ends: [Leaves the gas warmest, Leaves the gas coldest]
    why: >-
      Each of these turns solid or liquid at its own temperature, and a line cooling down passes
      them in that order. Water goes first, a long way above the others, because its molecules
      hold on to each other hardest. Carbon dioxide follows. Nitrogen holds out almost to the
      bottom, because its molecules barely attract each other at all. That order is what lets one
      cold line take a mixture apart one substance at a time.
  - group: ELEC
    title: Which electrode does which job — Review
    concept: 'Everything is made of atoms, and atoms are never lost'
    task: Read a different cell the same way
    place: Electrolysis Hall
    scene: >
      The station's oxygen generator splits water in a low-temperature cell rather than a hot one.
      Achebe wants it read the same way as the hot stacks, part by part.
    guide: >-
      Four parts of a cell and four things that happen. Pair them by asking which
      way the electrons are pushed. In means reduction, and hydrogen appears there
      in any water-splitting cell, hot or cold. Out means oxidation. The separator
      carries one ion and keeps the gases apart. And one item is a threshold rather
      than a place.
    background:
      - >-
          Why this is a matching board and not four separate questions. Responses on
          boards like this are written to be plausible for more than one situation, so
          choosing them one at a time lets a nearly-right answer through unexamined.
          Having to place all of them forces the comparison — not "is this reasonable
          here", but "is it more right here than there".
      - >-
          How to use the one-each rule. Because the responses are a set to be
          distributed rather than a list to be sampled, every join you make constrains
          the rest. Settling the two you are confident of can leave the remaining pair
          decided by elimination. Where it does not, two responses are still competing
          for one situation, and that is exactly the distinction the stop is testing.
      - >-
          Why you cannot be wrong about exactly one. With every response used once,
          three correct joins leave the fourth with only one place to go. Any error
          therefore involves at least two joins. That is worth remembering when the last
          pair looks forced: the fault is usually not in the join you are struggling
          with, but in one you made early and stopped questioning.
    assumes:
      - reduction happens where electrons are pushed in
      - the electrolyte carries ions and not electrons
    takeaway: The parts of an electrolysis cell do the same jobs whatever the cell is made of.
    format: PROTOCOL
    task: Match each part of this cell to what happens there.
    scenarios:
      - The end the supply pushes electrons into
      - The end electrons are drawn back out of
      - The layer between the two ends
    choices:
      - Water picks up electrons and hydrogen comes off
      - Water gives up electrons and oxygen comes off
      - It passes charge and keeps the two gases apart
    mapping: [0, 1, 2]
    why: >-
      The same shape as the cell in the plant, with water instead of carbon dioxide. Electrons
      pushed in at one end are taken up there, and hydrogen comes off. Electrons pulled out at the
      other end leave oxygen behind. The layer between has two jobs at once: let the charge
      across, or nothing flows, and keep the two gases apart, because hydrogen and oxygen mixed
      together in a hot cell is the end of the cell.
  - group: GIBBS
    title: What has to be paid for — Review
    concept: 'A rate is an amount every hour, and it adds up'
    task: Sort four station processes into driven and spontaneous
    place: Plant Control
    scene: >
      Demir has four of the station's processes on the board and wants them sorted before the
      quarterly energy plan is written. Two of them run downhill and two have to be pushed.
    guide: >-
      Four processes and four demands. Pair them by asking two things of each: does
      it run downhill or uphill, and is the bill chemical or physical? Only
      direction decides whether there is a bill at all. Boiling runs downhill, which
      is why stopping it costs work. And compression is uphill and paid for at the
      compressor.
    background:
      - >-
          Why explanations rather than labels. Naming a finding is not accounting for
          it, and a plausible-sounding mechanism attached to the wrong observation is
          the commonest way a wrong story survives. Committing an explanation to one
          clue means claiming it accounts for that clue specifically and not for its
          neighbour, which is where the two come apart.
      - >-
          How to use the one-each rule. The explanations are a set to be distributed,
          not a list to be sampled, so every join constrains the rest. Settling the two
          you are confident of can decide the remaining pair by elimination. Where it
          does not, two explanations are still competing for one clue, and that
          competition is the distinction the stop is testing.
      - >-
          Why you cannot be wrong about exactly one. With every explanation used once,
          three correct joins leave the fourth with only one place to go. Any error
          therefore involves at least two. That is worth remembering when the last pair
          looks forced: the fault is usually not in the join you are struggling with,
          but in one you made early and stopped questioning.
    assumes:
      - a negative free-energy change means a process can run on its own
      - running on its own says nothing about how fast a process goes
    takeaway: Sorting a station's processes by direction is what says which of them have a bill nobody can design away.
    format: CASEBOOK
    task: Match each process to what it needs from the station.
    scenarios:
      - Methane forming over the bed
      - Water splitting in the stack
      - Liquid oxygen boiling in a warm tank
    choices:
      - Runs on its own, and needs a catalyst to be quick
      - Runs only while electricity is pushing it
      - Runs on its own, and the refrigerator fights it
    mapping: [0, 1, 2]
    why: >-
      Some changes happen by themselves and some have to be paid for. Methane forming and oxygen
      boiling both go on their own, one usefully and one expensively. Splitting water does not:
      stop the current and it stops at once. Knowing which is which decides what the plant spends
      power on and what it only has to get out of the way of.
  - group: SOIL
    title: Getting water out of frozen ground — Review
    concept: 'A physical change and a chemical change are different things'
    task: Order the same plant on a poorer load
    place: Water Plant
    scene: >-
      Abiola has a fresh load in the hopper and a new technician on the run. The order of the
      steps has to be confirmed before it is sealed.
    guide: >-
      All four operations will happen, and this load is lean. Ask of each what would
      be indistinguishable without it. Without a figure to expect, a poor yield and
      a plant fault look the same. And the warming has a ceiling as well as a floor,
      because perchlorate salts break down when they are heated hard.
    background:
      - >-
          Why the order is graded whole. A sequence is a claim about dependency: each
          step is here because the one before it has already happened, or has to have.
          One transposed pair falsifies that claim wherever it sits, so partial credit
          would be credit for a sequence that does not work.
      - >-
          Why the ends are the place to start. The first and last cards are constrained
          by having nothing before or after them, which usually makes them the two you
          can settle from the scene alone. Pinning them collapses the remaining
          arrangements sharply, and what is left in the middle is where the actual
          judgement lives.
      - >-
          What the rail can be ordered on. Time is the usual axis, but it is not the
          only one. An order can run on cost, on risk, or on reversibility — every
          observation that leaves the sample as it was, before any that consumes it. On
          those boards a chronological reading finds nothing, because none of the steps
          has to happen at a particular hour.
    assumes:
      - warming ice-bearing soil releases water as vapour at low pressure
      - a leaner load carries the same salts in less water
    takeaway: A poorer load changes the yield of a process and not the order of it.
    format: SEQUENCE
    task: Order the operations for a lean load.
    cards:
      - Weigh the load, so the water it should give is known
      - Seal and warm the hopper without cooking the salts
      - Catch the vapour and measure what actually came out
    order: [0, 1, 2]
    why: >-
      The weighing is what turns the run into a measurement instead of a guess. Knowing what the
      load should give means the amount collected can be compared with it, and a gap between the
      two is a finding rather than a disappointment. Warming comes next and has its own limit,
      because too much heat breaks the salts down and puts new things into the water. Catching and
      measuring closes the loop the weighing opened.
  - group: EQUIL
    title: Why the hotter pass gave less — Review
    concept: 'Reactions go faster when it is hotter'
    task: >-
      Read a table of yields against temperature
    place: Reactor Hall
    scene: >-
      Herrera has a table of what each pass gave at four different bed temperatures. The hotter
      the bed, the less came back each time.
    guide: >-
      Four readings of the same table, and only one explains why the numbers fall. Ask what a
      reaction does when heat is one of the things it produces.
    assumes:
      - where a reaction settles depends on the temperature and on nothing else
      - this reaction gives out heat
    takeaway: A table of constants against temperature is the plant's ceiling written out in advance.
    format: CHOICE
    question: What does a constant falling steeply with temperature tell the plant?
    choices:
      - The reaction gives out heat, so cooler passes give more
      - The reaction takes heat in, so hotter is better
      - The catalyst is dying across that range
      - Pressure changed as well, so the table shows two things
    answer: The reaction gives out heat, so cooler passes give more
    why: >-
      A reaction that gives out heat is pushed backwards by more heat. So the coolest bed the
      plant can still run is the one where each pass gives the most, and the hottest bed gets to a
      worse answer fastest. That is why the argument here is real rather than somebody being
      wrong. Both leads are describing something true about the same table.
    rebuttals:
      - If it took heat in, a hotter bed would give more, and the table says otherwise.
      - A dying catalyst would slow the reaction rather than lower its balance.
      - The pressure is logged and held steady across the whole table.
  - group: PHASE
    title: Reading a blockage from outside the pipe — Review
    concept: 'Cooling a mixture separates it, one substance at a time'
    task: Read a second blockage from its readings
    place: Cold End
    scene: >
      A line on the oxygen side has slowed over two sols. Cho has four readings from around it, and
      the plant needs to know whether to warm the line out or open it up.
    guide: >-
      Five readings, and three of them rule things out. A cold head at its set
      point. A steady jacket pressure. A flow falling over two sols rather than in a
      minute. Ask of each candidate how many of the five it fits. And note why the
      material matters: one of them clears itself when the line is warmed.
    background:
      - >-
          Why the unremarkable readings decide it. The salient reading is what draws
          attention, and it is usually consistent with several explanations at once,
          which is why it rarely settles anything. The readings that discriminate are
          the ones a candidate predicts should have moved and which have not: a normal
          value is a positive result against every mechanism that would have disturbed
          it.
      - >-
          How to work the candidates. Take each mechanism and predict the panel it
          implies before you look at the panel again — which readings it drives, in
          which direction, and by roughly how much. Then compare. Working that way round
          is what separates a diagnosis from a rationalisation, because the prediction
          is made before the data is consulted.
      - >-
          Why only one candidate survives. Several will account for part of the panel,
          deliberately so, and a partial fit is exactly what a confident wrong answer
          feels like from the inside. When two remain, look for the reading on which
          their predictions differ and let it decide. If no reading separates them you
          have not finished reading the panel.
    assumes:
      - a refrigerator at its set point is doing its job
      - carbon dioxide deposits as a solid near 195 K
    takeaway: What a blockage is made of decides whether warming the line clears it.
    format: DIAGNOSIS
    headline: An oxygen line has slowed over two sols with the refrigerator holding temperature.
    task: Which explanation fits every reading?
    readings:
      - { zone: Oxygen line, label: Flow, value: down 60% over 2 sols, status: alarm }
      - { zone: Oxygen line, label: Inlet pressure, value: rising, status: high }
      - { zone: Refrigerator, label: Cold head temperature, value: at set point, status: normal }
      - { zone: Upstream trap, label: Carbon dioxide breakthrough, value: 700 ppm, status: alarm }
      - { zone: Line, label: Vacuum jacket pressure, value: unchanged, status: normal, note: the insulation is intact }
    choices:
      - { label: Carbon dioxide past the trap is freezing in the line, mechanism: 'Solid builds slowly on the wall and takes the flow down with it.' }
      - { label: The refrigerator has lost capacity over the last two sols, mechanism: 'A cold head above its set point cannot condense what it is given.' }
      - { label: A valve on this line has been partly closed by somebody, mechanism: 'A restriction cuts the flow and raises the pressure behind it.' }
      - { label: The vacuum jacket on this line has failed, mechanism: 'Heat leaking in warms the line and changes what it can carry.' }
    answer: Carbon dioxide past the trap is freezing in the line
    why: >-
      The same reasoning with a different substance in the pipe. Carbon dioxide turns solid near
      195 kelvin, so it builds up on the wall of any line colder than that. The readings that
      stayed normal are what matter. A working refrigerator and an intact jacket leave only
      something solid inside. Which substance it is decides the fix.
# What each place says when the player reads its sign.
# --------------------------------------------------------------- the warm-ups
warmups:
  greet:
    title: Six people, and the next crew is eighteen months away
    why: >-
      There are six of you here and nobody else for eighteen months. Ingrid Sundqvist, who runs
      production, wants you known to as many of them as you can before the first sol of real work.
      An argument here is not settled by somebody walking out. There is nowhere to walk to.
  trial-near:
    title: Walk the plant while your suit is fresh
    why: >-
      Nine buildings along one track, and the vehicle four hundred metres past the last of them.
      Walk the whole line once now, on a clear sol, with a fresh suit. The next time you do it
      will be in a dust storm, three hours into a suit that is already tired.
  follow:
    title: Cho walks the cold end once
    why: >-
      The cold end is the part of the plant no diagram really covers. Which joint frosts first,
      which line ticks as it cools. Mei-Ling Cho, the cryogenics engineer, walks it once this
      morning. Stay with her and keep off the lines. A boot on a cold pipe is a leak nobody can
      weld out here.
  hunt:
    title: Six regolith bins, and the tally says four
    item: { name: regolith bin, plural: regolith bins }
    why: >-
      The feedstock count is what the whole schedule is planned against, and two bins are not
      where it says they are. A bin nobody can find is either full and idle or empty and counted.
      Those two mean very different launch dates.
  canvass:
    title: Who has actually seen the seal on module four
    why: >-
      The habitat started leaking a little on sol 9, and the log blames a seal nobody has looked
      at since landing. Ask round the crew until enough of them have said what they actually saw.
      Six people is small enough that one guess turns into a fact by teatime.
  evade:
    title: Earth wants a call and the window is closing
    why: >-
      There is a downlink slot in twenty minutes and the doctor on Earth wants all of it for a
      medical call. The tank pressure survey has to go this window or wait a whole sol. Keep out
      of the way until the data is queued and sent.
  tag:
    title: Catch Achebe before the array goes into storm mode
    why: >-
      Rosalind Achebe, who runs the power, is walking out to put the solar array into storm mode
      before the dust arrives. Once it is folded nobody reads a panel current off it for three
      sols, and the electrolysis plan for the storm needs those numbers today.

copy:
  KINET: <p>Catalyst Bay. Nickel on alumina, in a bed the size of a kitchen bin, doing the one job in this plant that nothing else can do.</p>
  EQUIL: <p>The reactor hall. Carbon dioxide and hydrogen go in, methane and water come out, and the argument is about how much.</p>
  PHASE: <p>The cold end. Where a gas nobody can store becomes a liquid the vehicle can fly, at 112 kelvin.</p>
  ELEC: <p>The electrolysis hall. 12 cells splitting water, and 1 hot stack splitting carbon dioxide straight to oxygen.</p>
  GIBBS: <p>Plant control. The energy ledger for everything on this plain, and the desk where the arguments about it end.</p>
  SOIL: <p>The water plant. Frozen ground in at one end, and a brine that has to be cleaned before anything downstream can use it.</p>
  HAB: <p>The habitat. 6 people, 19 degrees, and the only room on the planet with a window somebody chose the view from.</p>
  PAD: <p>The pad. The ascent vehicle stands on it, 4.3 tonnes of methane aboard and 6.6 needed.</p>
  ARRAY: <p>The array shed. 1800 square metres of panel out there, and a sun sensor that says how much of the sun is reaching it.</p>
  TANKS: <p>The tank farm. Everything the plant has made so far, held at its own boiling point and losing a little every sol.</p>
  GARAGE: <p>The garage. Two pressurised rovers, one drill rig, and the dust that comes back in with all of them.</p>
  INTAKE: <p>The intake. 6 millibars of carbon dioxide compressed to 12 bar, which is most of the plant's power bill before any chemistry happens.</p>

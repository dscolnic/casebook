    - 'Thermal loads look cheap to drop and are the most expensive: reheating a cold cabin costs far more energy than holding a warm one, and cold batteries deliver less than the plan assumes.'
- title: A Dangerous Battery Configuration
  objective: Approve only a configuration whose voltage, current sharing, and failure behavior are understood.
  briefing: Engineers propose reconnecting battery modules, but a mismatched module could overheat or reverse-charge. The
    player must reason through series, parallel, internal resistance, and fault isolation.
  stake: >-
    Forty-two hours in. The electrical load officer, Ana Ferreira, has found a battery module on the damaged bus that would buy eleven hours,
    and Shah wants it connected before the next pass. Nobody knows its state of charge, and the connectors
    were never meant for this. This shift you decide whether that configuration is safe and what has to be
    measured first. Two batteries wired one after another add their voltages. Wired side by side they share
    the load — but only if they start at the same voltage. If they do not, the higher drives current into
    the lower, through whatever resistance is in the path, and Shah's own account of a hot connector tells
    you what happens next: the difference becomes heat, exactly where nobody can reach it. Sealed cabin.
    Three people. Eleven hours is not worth a fire.
  takeaway: Use series circuits, parallel circuits, internal resistance, Joule heating, fault isolation as an evidence chain
    rather than as isolated facts.
  stops:
  - group: ELEC
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: Series or parallel?
    place: Battery Test Bench
    scene: >-
      Engineers want to reconnect battery modules to buy hours of endurance. The
      room agrees what each wiring choice does before anything is bolted up,
      because adding a module can also take capability away.
    takeaway: Redundancy is useful only when connection and protection behavior are explicit.
    format: PROTOCOL
    rebuttals:
    - Cells in series add their voltages. The current is the same everywhere in the string, so nothing is gained in capacity.
    - Cells in parallel hold the voltage and add current capacity. This is how you get more amp-hours without changing the bus.
    - A resistive parallel branch carries less than its share, and the remaining branches carry more than theirs. Unequal sharing is how one branch overheats.
    - One open cell in series interrupts the entire path. In parallel the same failure loses one branch; in series it loses everything.
    assumes:
    - a battery has both a voltage and a current it can supply
    scenarios:
    - Add equal cells in series.
    - Add equal cells in parallel.
    - One parallel branch gains resistance.
    - One series cell opens.
    choices:
    - Total voltage increases.
    - Current capacity can increase while voltage stays similar.
    - That branch carries less current and sharing becomes unequal.
    - The entire series path is interrupted.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: >-
      Topology decides voltage, current sharing and how a fault spreads. Equal
      cells in series add their voltages and carry the same current, so the
      string is only as good as its worst cell. The same cells in parallel hold
      the voltage and share the current, which is where extra capacity comes
      from. A parallel branch that gains resistance stops carrying its share and
      the others pick it up, unequally. A single open cell in a series string
      breaks the whole path. Redundancy is only redundancy when the connection
      and the protection are both explicit.

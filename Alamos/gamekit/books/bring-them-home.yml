theme:
  id: bring_them_home
  title: Bring Them Home
  subtitle: Flight Director · Lunar Return Mission
groups:
- id: NAV
  code: NAV
  name: Guidance & Motion
  color: '#315c78'
  desc: Kinematics, forces, gravity, trajectories, and navigation evidence.
  defaultLeader: reyes
  milestones:
  - Reconstruct the state
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: ELEC
  code: ELEC
  name: Power & Circuits
  color: '#9a741d'
  desc: Voltage, current, resistance, batteries, generation, and electrical faults.
  defaultLeader: shah
  milestones:
  - Close the power budget
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: THERM
  code: THERM
  name: Thermal & Life Support
  color: '#4b775f'
  desc: Heat transfer, gas behavior, pressure, flow, and life-support transport.
  defaultLeader: brooks
  milestones:
  - Keep the cabin stable
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: COMMS
  code: COMMS
  name: Waves & Communications
  color: '#704f88'
  desc: Radio waves, link budgets, pointing, optics, and signal timing.
  defaultLeader: ito
  milestones:
  - Recover the link
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: STRUCT
  code: STRUCT
  name: Rotation & Structures
  color: '#9a3f36'
  desc: Torque, angular motion, oscillations, resonance, and structural response.
  defaultLeader: mensah
  milestones:
  - Control motion and vibration
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: INTEG
  code: INTEG
  name: Mission Integration
  color: '#3d6f52'
  desc: Uncertainty, competing constraints, robust decisions, and final readiness.
  defaultLeader: carter
  milestones:
  - Integrate the evidence
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
roster:
- id: reyes
  name: Dr. Camila Reyes
  role: Guidance Lead
  division: NAV
  quiz:
  - q: How does Reyes tell a real trajectory change from a measurement artefact?
    a: By seeing whether independent sources moved, or only one
    wrong:
    - By re-running the same navigation solution with much tighter tolerances
    - By waiting for the next scheduled navigation update
    - By comparing the result against the pre-launch plan
  bio: |-
    Sits at the front of the guidance row and owns what the room believes about
    where the vehicle is. Three tracking stations, a star sight and the crew's own
    inertial platform, and her job on a quiet shift is deciding which of them to
    trust when they stop agreeing.

    Her first question about any apparent trajectory change is how many independent
    sources moved. One source moving is a measurement; every source moving is a
    spacecraft. She has watched this room spend two hours chasing a burn that turned
    out to be a station's clock.
- id: shah
  name: Priya Shah
  role: Power Systems Lead
  division: ELEC
  quiz:
  - q: Why does Shah read voltage, current and heat as one system?
    a: They are three views of one energy budget
    wrong:
    - Three separate instruments together are more accurate than any one of them
    - Heat is the only quantity that can be measured directly in flight
    - The three meters share a single power supply
  bio: |-
    Keeps the electrical picture for the whole vehicle, which on this flight is one
    battery stack, two fuel cells and a long list of things that would like to draw
    from them.

    She will not look at a voltage on its own. Voltage, current and the heat coming
    off a component are the same energy accounted for three ways, and a fault that
    hides in one of them is usually plain in another. A bus holding its voltage
    while running warm is spending something, and the question is what.
- id: brooks
  name: Dr. Aaron Brooks
  role: Thermal and Life Support Lead
  division: THERM
  quiz:
  - q: What does Brooks mean by asking whether hardware is transporting what it should?
    a: Power to a fan is not proof that air is moving
    wrong:
    - Hardware telemetry becomes unreliable during a power-down and cannot be trusted
    - Transport rates can only be measured on the ground
    - The crew cannot hear whether a fan is running
  bio: |-
    Answers for the air the crew breathes and the heat the vehicle has to throw
    away, both of which are transport problems before they are anything else.

    His standing objection is that a powered box is not a working box. Current
    reaching a fan says the motor is turning, not that air is moving through the
    duct behind it. What he asks for is the transport itself — a flow, a temperature
    difference, a carbon dioxide reading coming down — and he has been shown
    telemetry proving a scrubber was running while the cabin said it was not.
- id: ito
  name: Naomi Ito
  role: Communications Lead
  division: COMMS
  quiz:
  - q: Why does Ito treat received power as only part of a link diagnosis?
    a: Pointing, range and a transmitter fault all look the same in it
    wrong:
    - Received power is sampled too slowly to be useful during a fast fade
    - Power readings are quantised too coarsely at long range
    - Only frequency measurements are calibrated
  bio: |-
    Owns the link, which for the next four days means one high-gain antenna, two
    ground stations and a spacecraft that is slowly rotating.

    Received power is where everybody looks first and the reading she trusts least
    on its own. A weak signal can be an antenna pointing off, the range opening, or
    a transmitter failing, and all three arrive at the receiver looking the same.
    What separates them is whatever else moved at that moment: attitude, range rate,
    the temperature at the amplifier.
- id: mensah
  name: Kwame Mensah
  role: Dynamics and Structures Lead
  division: STRUCT
  quiz:
  - q: Why does Mensah care about the frequency something is shaken at, not just how hard?
    a: A structure answers strongly only near its own natural frequency
    wrong:
    - Forcing at high frequency always does more damage than forcing at low frequency
    - Frequency determines how far the vibration travels through the hull
    - Accelerometers only respond above a threshold frequency
  bio: |-
    Reads the accelerometers, which means he spends a flight arguing that how hard
    something is shaken matters less than how fast.

    A panel takes up a shake hardest when the rate it is shaken at matches the rate
    it wants to ring at, and the same force applied away from that rate is felt and
    forgotten. So the number he wants first is a rate rather than an amplitude: a
    thruster pulsing at four hertz into a panel that rings at four hertz is a
    different event from the same thruster at twenty.
- id: carter
  name: Dr. Evelyn Carter
  role: Mission Integration Lead
  division: INTEG
  quiz:
  - q: What is Carter guarding against by demanding independent evidence?
    a: Two instruments sharing a step can be wrong together
    wrong:
    - Crew reports become unreliable when the people making them are under stress
    - A single instrument cannot be calibrated in flight
    - Independent teams work faster than one large team
  bio: |-
    Sits at the back of the room where the recommendations arrive, and is the last
    person to say yes. Eleven missions, two of which she stopped.

    What she looks for is not agreement but independence. Two instruments sharing a
    power supply, a calibration or a line of software can be wrong together and
    confident together, and a room reading them side by side hears that as
    confirmation. Her question is always which step the two answers have in
    common.
- id: whitaker
  name: Dale Whitaker
  role: Trajectory Officer
  division: NAV
  bio: |-
    Fits trajectories to whatever tracking exists, which on a bad shift is three
    numbers taken hours apart. A fit that matches the data he has is easy; a fit
    that predicts the next observation is the only kind he will sign.

    He treats residuals as the real output. A pattern in what the model got
    wrong points at an unmodelled force or a clock error, and both of those have
    hidden themselves inside a good-looking fit before.
  quiz:
  - q: Why does Whitaker judge a trajectory fit by its residuals rather than by how closely
      it matches the tracking?
    a: Structure in the errors shows a force or a clock the fit is hiding
    wrong:
    - Residuals are the only quantity the tracking stations report back to the room
    - A fit with small residuals always has small uncertainty
    - Residuals convert range measurements into velocity
- id: ferreira
  name: Ana Ferreira
  role: Electrical Load Officer
  division: ELEC
  bio: |-
    Keeps the power budget, which during this flight means keeping a list of
    everything aboard that consumes energy and what happens the hour after it is
    switched off.

    Her rule is that no load is switched off in isolation. A heater turned off to
    save amp-hours becomes a thermal problem that costs more amp-hours to
    reverse, and the ledger has to be kept across systems rather than within one.
  quiz:
  - q: Why does Ferreira refuse to evaluate a load in isolation?
    a: Switching one off moves the cost somewhere else
    wrong:
    - Every load aboard draws the same current
    - Loads can only be measured while the fuel cells are running
    - A load's cost is fixed by its rating rather than by its use
- id: novak
  name: Petra Novak
  role: Life Support Engineer
  division: THERM
  bio: |-
    Works the three things a sealed cabin runs out of — heat, breathable gas and
    water — and the ways they interfere with each other. Cooling the cabin
    condenses water onto the coldest surfaces, and the coldest surfaces are
    usually the electronics.

    She measures in more than one place on principle. A single cabin sensor
    reports the air beside itself, and a compartment with poor circulation can be
    perfectly comfortable at the sensor and dangerous two metres away.
  quiz:
  - q: Why does Novak insist on carbon dioxide readings from several cabin locations?
    a: With poor circulation the gas is not uniform, so a sensor reads its own corner
    wrong:
    - Sensors drift too quickly to be trusted individually
    - The crew cannot reach the primary sensor while the module is powered down for the test
    - Multiple readings are averaged to remove instrument noise
- id: haldane
  name: Marcus Haldane
  role: Link Analyst
  division: COMMS
  bio: |-
    Accounts for every decibel between the spacecraft transmitter and the ground
    receiver. A fade is never mysterious to him; it is one term in a budget that
    changed, and the work is finding which.

    Range, antenna pointing, receiver bandwidth and transmitter health all reduce
    the same received power, and they are told apart by what else changed at the
    same moment rather than by the signal level itself.
  quiz:
  - q: How does Haldane separate a pointing problem from a transmitter failure?
    a: By what changed alongside it — attitude, range and schedule leave traces
    wrong:
    - A transmitter failure always removes the carrier completely
    - Pointing errors change the frequency and failures do not
    - The received power alone identifies the cause without any other measurement
- id: okoye
  name: Chidi Okoye
  role: Structural Dynamics Engineer
  division: STRUCT
  bio: |-
    Studies how a spacecraft responds to being pushed at particular rates. A
    structure has frequencies at which a small repeated force produces a large
    motion, and hardware that is perfectly strong at rest can fail there.

    He never accepts a single accelerometer as a description of a mode. One
    sensor sits at one point, and a point that happens to sit at a node reads
    almost nothing while the panel beside it moves.
  quiz:
  - q: Why will Okoye not characterise a vibration mode from one accelerometer?
    a: At a still point of that mode there is nothing to feel
    wrong:
    - Accelerometers cannot measure below one hertz
    - A single sensor cannot record frequency, only amplitude
    - One sensor is enough only if the pump speed is constant
- id: lindqvist
  name: Erika Lindqvist
  role: Flight Dynamics Integrator
  division: INTEG
  bio: |-
    Sits between the back rooms and the loop, and her job is the one nobody else
    has: deciding which of six correct answers the flight director hears first.

    She keeps the anomaly log, because in a fast failure the expensive mistake is
    not a wrong number but two rooms acting on different versions of the same
    number an hour apart.
  quiz:
  - q: What does Lindqvist treat as the main risk during a fast-moving failure?
    a: Two teams working from figures that disagree
    wrong:
    - A back room refusing to give an estimate at all
    - The crew asking questions over the loop
    - Telemetry arriving faster than it can be plotted
glossary:
- name: Calibration
  aliases:
  - calibration
  - calibrated
  - calibrate
  def: The correction between what an instrument reads and what is true, established against
    something known. A shared calibration is why two instruments can be wrong together.
- name: Common-mode error
  aliases:
  - common-mode error
  def: A shared error that makes several measurements agree for the same wrong reason.
- name: Doppler shift
  aliases:
  - doppler shift
  def: A frequency change caused by relative motion between source and observer.
- name: Impulse
  aliases:
  - impulse
  def: A force multiplied by the time it acts for. It equals the change in momentum, which
    is mass times speed, so a small thrust held for a long time can change speed as much as
    a large one held briefly.
- name: Parallax
  aliases:
  - parallax
  def: The apparent shift of a nearby object against a distant background when the viewpoint
    moves. With a known baseline it gives a distance.
- name: Power
  aliases:
  - power
  def: The rate at which energy is transferred or used.
- name: Resonance
  aliases:
  - resonance
  def: Large oscillation produced when forcing is near a system natural frequency.
- name: Scrubber
  aliases:
  - scrubber
  - scrubbers
  def: The unit that removes carbon dioxide from the cabin air. It cleans only the air that
    reaches it.
- name: State vector
  aliases:
  - state vector
  def: A compact description of position and velocity at one time.
- name: Torque
  aliases:
  - torque
  def: The rotational effect of a force applied with a lever arm.
- name: Transponder
  aliases:
  - transponder
  def: The box aboard the spacecraft that answers a radio pulse from the ground, which is
    what makes timing the round trip a distance measurement.
- name: GO
  aliases:
  - go
  - GO
  def: Flight-control approval to carry out the stated plan. It means the known risks fit
    inside the agreed safety limits.
missions:
- title: The Failure
  objective: Create a trusted state vector and a prioritized anomaly list before commanding
    the crew.
  briefing: An explosion has damaged the ship and its sensors disagree. Decide what is real
    before the crew acts.
  stake: Shift 1. An explosion hit the ship four minutes ago. Power is falling, and three
    pressure screens show the same sharp drop. You must find whether the cabin is leaking
    before a wrong order wastes air, power, or crew time.
  takeaway: Use units, vectors, graphs, measurement uncertainty, common-mode failure as an
    evidence chain rather than as isolated facts.
  stops:
  - group: INTEG
    task: Open the dependency chain behind each pressure reading. Keep the evidence that stands
      on its own, then name the shared source that explains the false alarm.
    title: 'What failed: the spacecraft or the sensors?'
    place: Mission Control
    scene: Nine minutes after the bang, three digital cabin-pressure channels fall together.
      A mechanical gauge stays steady, and the acoustic leak monitor hears no escaping gas.
      Carter, the mission integration lead, needs one call before the crew opens a panel.
    guide: Open each pressure channel to see what it depends on. Keep the ones that would
      still stand if the sensor electronics were at fault, and untick the rest. Then name
      the shared source that moved the others. Three channels falling together is not three
      measurements agreeing; it is one measurement repeated three times if they share a supply.
    background:
    - Why three digital channels can be one measurement. Redundant transducers usually share
      a power supply, a reference voltage and a signal conditioning card. Any of those failing
      moves all three readings the same way at the same moment, which is exactly what a real
      depressurisation looks like on the display.
    - What the other two instruments are for. A mechanical gauge has no electronics between
      the cabin and the needle. An acoustic monitor listens for escaping gas rather than measuring
      pressure at all. Neither depends on the suspect chain, which is why they carry more
      weight here than any number of digital channels.
    - Why the diagnosis has to come before the panels. Opening panels in a cabin that is genuinely
      losing air spends time the crew may not have. Sending them to chase an instrumentation
      fault costs the same hour with no leak to find. The flight director needs one answer,
      not a list of possibilities.
    assumes:
    - several instruments can share one reference circuit
    - an independent measurement does not inherit that shared failure
    takeaway: Several agreeing readouts count as one piece of evidence when they inherit the
      same physical reference.
    format: TRACE
    question: Which pressure evidence survives the dependency check, and what shared source
      moved the rest?
    trace:
      decision: Decide whether the cabin pressure really changed or several readouts inherited
        one bad reference.
      hint: Open each channel to see what physical sources it depends on. Keep channels whose
        measurement path does not pass through the suspect shared source.
      channels:
      - id: digital_a
        label: Pressure channel A
        reading: drops sharply
        depends:
        - cabin
        - sensor_ref
      - id: digital_b
        label: Pressure channel B
        reading: drops sharply
        depends:
        - cabin
        - sensor_ref
      - id: digital_c
        label: Pressure channel C
        reading: drops sharply
        depends:
        - cabin
        - sensor_ref
      - id: mechanical
        label: Direct pressure gauge
        reading: steady
        depends:
        - cabin
        - mechanical_path
      - id: acoustic
        label: Leak monitor
        reading: no leak signature
        depends:
        - acoustic_path
      resources:
      - id: cabin
        label: Cabin gas pressure
      - id: sensor_ref
        label: Shared electrical reference
      - id: mechanical_path
        label: Mechanical gauge linkage
      - id: acoustic_path
        label: Acoustic leak monitor
      target: sensor_ref
      independent:
      - mechanical
      - acoustic
    answerText: Keep the mechanical pressure evidence and reject the three digital channels
      as independent votes.
    why: Agreement is strong evidence only when the measurements can fail independently. The
      three digital pressure channels all inherit the same reference circuit. When that reference
      shifts, all three move together even if cabin pressure does not. The mechanical gauge
      has a different physical path, so its steady reading still counts. The acoustic monitor
      also finds no leak. Tracing dependencies turns three alarming numbers into one electrical
      fault and preserves the evidence that still stands.
    headline: Mission Control receives a sudden cabin-pressure warning on several digital
      channels.
    reason: A false leak call could waste the crew's air and time.
  - group: INTEG
    task: Put the four cards in order. Start with the step that must happen first.
    title: Build the first state estimate
    place: Telemetry Analysis Room
    scene: One power bus reads zero. The guidance unit has lost its record. Carter asks you
      to rebuild the log so the next shift can trust it.
    guide: All four of these will be done, so this is not a list of options. Ask of each what
      would be lost or wasted if it came later. Telemetry across the failure is overwritten
      within minutes. A fit across mixed clocks produces a confident answer that is wrong.
      And a command is only worth issuing once the estimate it rests on carries an uncertainty.
    background:
    - 'Why the order is graded whole. A sequence is a claim about dependency: each step is
      here because the one before it has already happened, or has to have. One transposed
      pair falsifies that claim wherever it sits, so partial credit would be credit for a
      sequence that does not work.'
    - Why the ends are the place to start. The first and last cards have nothing before or
      after them. That constraint usually makes them the two you can settle from the scene
      alone. Pinning them collapses the remaining arrangements sharply, and what is left in
      the middle is where the actual judgement lives.
    - What the rail can be ordered on. Time is the usual axis, but it is not the only one.
      An order can run on cost, on risk, or on reversibility — every observation that leaves
      the sample as it was, before any that consumes it. On those boards a chronological reading
      finds nothing, because none of the steps has to happen at a particular hour.
    assumes:
    - a number without its units and its time is not a measurement
    takeaway: A good emergency command works across uncertainty rather than assuming it away.
    format: SEQUENCE
    why: A state estimate is only worth having if it survives being wrong, and the order is
      what makes that possible. Telemetry across the failure is overwritten within minutes,
      so it is frozen before anything is computed from it. Units, timestamps and calibration
      come next, because a fit across mixed clocks produces a confident answer that is wrong.
      Estimates then carry uncertainties rather than single values. And the commands that
      follow are the ones whose benefit holds across every state the data still allows.
    rebuttals:
    - Preserve the telemetry first. It is the only step with a deadline set by something other
      than the crew — the buffers overwrite whether or not anybody is ready.
    - Check units, timestamps and shared dependencies second. This is where a common-mode
      failure becomes visible instead of being fitted.
    - Build the estimates third, with uncertainties attached. A state without an uncertainty
      cannot be argued with or tested.
    - Command last, and only where the benefit survives the whole range of states still consistent
      with the data.
    cards:
    - Freeze and preserve the pre- and post-failure telemetry.
    - Verify units, timestamps, calibration states, and shared dependencies.
    - Construct position, velocity, attitude, power, pressure, and temperature estimates with
      uncertainties.
    - Issue only commands whose benefits remain robust across the plausible states.
    order:
    - 0
    - 1
    - 2
    - 3
    reason: Every later order depends on a log the next shift can trust.
  - group: INTEG
    task: Ten minutes to the next tracking pass. What does the flight director do first?
    title: Spend the first ten minutes
    concept: "Systems thinking: dependency, redundancy, failure modes"
    place: Spacecraft Systems Console
    scene: Four teams want the crew's radio at once. The next tracking pass starts in ten
      minutes. You must set one order before mixed commands reach the ship.
    guide: All four options are real work that has to happen in the next hour. Ask of each
      what it costs in the only resource that is short, which is attention. Four controllers
      are already working one failure from four sets of numbers. Two versions of the same
      analysis can reach the crew, and they will fly whichever arrives first.
    background:
    - Why the wrong options are the interesting ones. Each distractor is written to be the
      answer under one specific misreading. A step skipped. A quantity confused with a rate.
      A correlation taken for a cause. Identifying which misreading each belongs to is where
      the learning is; the right answer alone can be reached on instinct and teach nothing.
    - Why the shape of an option tells you nothing. A correct answer collects the qualifying
      clause and the unit. So across a whole game the key used to be the longest option far
      more often than chance. Here it ran to 88 per cent of passage quizzes, before it was
      fixed. It is now checked per game as a binomial tail, so length, hedging and specificity
      have had the signal taken out of them deliberately.
    - What the verdict adds. Every wrong option carries its own rebuttal, and the verdict
      prints them — the reason that option fails, not a restatement of the right one. They
      are worth reading after a correct answer as well. A right choice made for an approximate
      reason looks exactly like a sound one. It stops looking like one on the day the approximation
      is what is being tested.
    assumes:
    - two rooms acting on different versions of one number is worse than either acting alone
    takeaway: Attention is a scarce physical resource during a fast-moving systems failure.
    format: CHOICE
    question: Ten minutes to the next tracking pass. Four teams are working the same failure mode — the same broken
      system — from four different sets of numbers. What does the flight director do first?
    why: Attention is a physical resource in an emergency, just like propellant. The first
      decision determines where that resource goes. Four controllers are already working one
      failure from four sets of numbers. Without one log and one command authority, the same
      analysis can be repeated or contradicted. The crew may then execute whichever version
      reaches them first. Organising the room is not a delay before the technical work. It
      is what lets every later calculation and command count once.
    choices:
    - Open one anomaly log and one command authority.
    - Reconstruct the electrical and pressure timeline.
    - Verify the path and attitude on its own.
    - Ask every subsystem for a complete report at once.
    answer: Open one anomaly log and one command authority.
    rebuttals:
    - The electrical and pressure timeline is the first real analysis, and it is exactly what
      the log exists to hold. Start it second and it survives the shift change.
    - Independent trajectory verification decides whether the vehicle can come home. It is
      needed before the burn, not before the room is organised.
    - Six complete subsystem reports arrive after the tracking pass and consume the ten minutes
      that were supposed to prepare for it.
    reason: One clear order keeps the crew from acting on mixed commands.
- title: Find the Spacecraft
  objective: Produce a consistent trajectory estimate and identify which new observation most
    reduces uncertainty.
  briefing: The ship's computer lost its position and speed. Rebuild both from the tracking
    data that remain.
  stake: Shift 2. Nine hours have passed. The ground still cannot place the ship. Reyes, the
    guidance lead, needs its position, while Whitaker, the trajectory officer, needs a path.
    You must join the last readings before the best tracking site drops from view.
  takeaway: Use position, velocity, acceleration, coordinate systems, graphs of motion as
    an evidence chain rather than as isolated facts.
  stops:
  - group: NAV
    task: Match each quantity the state estimate needs to the measurement that provides it.
    title: Which measurement constrains what?
    place: Deep-Space Tracking Station
    scene: The ship's computer lost its state, and tracking comes and goes. Each tool measures
      a different part of motion. Choose what the next pass must collect.
    guide: Four things the state estimate needs, and four ways of measuring. Pair them by
      asking what each measurement is physically sensitive to. An angle? A travel time? A
      frequency shift? Or a difference between two earlier answers? One of the four is built
      out of the others, which is why it is the noisiest. The next pass is intermittent, so
      what gets scheduled has to be chosen.
    background:
    - Why this is a matching board and not four separate questions. Responses on boards like
      this are written to be plausible for more than one situation. Choosing them one at a
      time lets a nearly-right answer through unexamined. Having to place all of them forces
      the comparison — not "is this reasonable here", but "is it more right here than there".
    - How to use the one-each rule. Because the responses are a set to be distributed rather
      than a list to be sampled, every join you make constrains the rest. Settling the two
      you are confident of can leave the remaining pair decided by elimination. Where it does
      not, two responses are still competing for one situation, and that is exactly the distinction
      the stop is testing.
    - Why you cannot be wrong about exactly one. With every response used once, three correct
      joins leave the fourth with only one place to go. Any error therefore involves at least
      two joins. That is worth remembering when the last pair looks forced. The fault is usually
      not in the join you are struggling with. It is in one you made early and stopped questioning.
    takesAsRead:
    - 'Waves: frequency, wavelength, speed'
    assumes:
    - describing where something is and how it is moving takes six numbers
    takeaway: Navigation is a reconstruction from partial projections.
    format: PROTOCOL
    why: Each measurement constrains a different part of the spacecraft state. Direction comes
      from an optical angle; range comes from radio travel time; Doppler constrains line-of-sight
      speed. For a one-way 2 GHz carrier, 1 km/s of radial speed produces about a 6.7 kHz
      shift. A coherent two-way tracking link carries roughly twice the first-order Doppler
      because the signal experiences the motion on the uplink and downlink. Repeated positions
      can supply transverse motion and acceleration, but differencing measurements amplifies
      their noise.
    columns:
    - What we want to measure
    - How we measure it
    rebuttals:
    - Direction is an angle, and the star camera is the only instrument here that measures
      one.
    - Line-of-sight velocity is carried in carrier phase and frequency; the exact Doppler
      factor depends on whether the tracking link is one-way or coherent two-way.
    - A distance is a time multiplied by a speed, which is what the round trip provides.
    - Rates come from repetition — two positions give a velocity, and two velocities give
      an acceleration.
    scenarios:
    - Direction on the sky.
    - Line-of-sight velocity.
    - Range along the line of sight.
    - How fast it is going, and whether that is steady.
    choices:
    - Photograph the ship against catalogued stars. The angle between it and stars whose places
      are already fixed gives the line it lies along, to the precision of the catalogue and
      the optics.

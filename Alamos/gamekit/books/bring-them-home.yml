    why: >-
      Powering a machine is not the same as achieving its function, and this
      panel measures both the machine and the quantity it is supposed to move. A
      fan spinning against a blocked path draws its current and moves almost no
      air, so normal current proves the motor is turning and nothing else.
      Airflow is low and the pressure drop across the filter is high, which is a

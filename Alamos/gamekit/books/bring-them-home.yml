- title: A Dangerous Battery Configuration
  objective: Approve only a configuration whose voltage, current sharing, and failure behavior
    are understood.
  briefing: A spare battery could add hours, but a bad link could start a fire. Test the setup
    before it is used in flight.
  stake: Shift 6. Ferreira, the electrical load officer, found a spare battery. It may add
    11 hours, but its voltage does not match the live bus. The new joint is warm. You must
    test the current before the battery starts a cabin fire.
  takeaway: Use series circuits, parallel circuits, internal resistance, Joule heating, fault
    isolation as an evidence chain rather than as isolated facts.
  stops:
  - group: ELEC
    task: Ferreira wants redundancy — a spare that carries on if one cell fails. Match each wiring change to what it
      actually does. Use each choice once.
    title: Series or parallel?
    place: Battery Test Bench
    scene: A spare battery may buy more time. Ferreira asks how each wiring plan changes voltage,
      current, and the effect of one bad cell.
    guide: 'Four wiring changes, and four consequences. Pair them by asking what stays the
      same in that arrangement: the voltage across each part, or the current through it. Then
      ask what one fault does. Adding a module can take capability away, because a single
      open cell can break a whole series path. This is being bolted up to buy hours of endurance.'
    background:
    - Why this is a matching board and not four separate questions. Responses on boards like
      this are written to be plausible for more than one situation. Choosing them one at a
      time lets a nearly-right answer through unexamined. Having to place all of them forces
      the comparison — not "is this reasonable here", but "is it more right here than there".
    - How to use the one-each rule. Because the responses are a set to be distributed rather
      than a list to be sampled, every join you make constrains the rest. Settling the two
      you are confident of can leave the remaining pair decided by elimination. Where it does
      not, two responses are still competing for one situation, and that is exactly the distinction
      the stop is testing.
    - Why you cannot be wrong about exactly one. With every response used once, three correct
      joins leave the fourth with only one place to go. Any error therefore involves at least
      two joins. That is worth remembering when the last pair looks forced. The fault is usually
      not in the join you are struggling with. It is in one you made early and stopped questioning.
    assumes:
    - a battery has both a voltage and a current it can supply
    takeaway: Redundancy is useful only when connection and protection behavior are explicit.
    format: PROTOCOL
    why: Circuit topology determines voltage, current sharing, and fault behavior. Equal cells
      in series add voltage while carrying the same current. One open cell can therefore break
      the whole series path. Equal cells in parallel keep about the same voltage and share
      the current. That arrangement can add useful capacity. A resistive parallel branch carries
      less than its share, forcing the other branches to carry more. Redundancy only helps
      when the connection and protection rules prevent one fault from defeating the whole
      arrangement.
    columns:
    - What you change
    - What happens
    rebuttals:
    - Cells in series add their voltages. The current is the same everywhere in the string,
      so nothing is gained in capacity.
    - Cells in parallel hold the voltage and add current capacity. This is how you get more
      amp-hours without changing the bus.
    - A resistive parallel branch carries less than its share, and the remaining branches
      carry more than theirs. Unequal sharing is how one branch overheats.
    - One open cell in series interrupts the entire path. In parallel the same failure loses
      one branch; in series it loses everything.
    scenarios:
    - Add equal cells in series.
    - Add equal cells in parallel.
    - One parallel branch gains resistance.
    - One series cell opens.
    choices:
    - Total voltage increases.
    - Current capacity can increase while voltage stays similar.
    - That branch carries less current and sharing becomes unequal.
    - The entire series path is interrupted.
    mapping:
    - 0
    - 1
    - 2
    - 3
    reason: The wrong wiring can remove power or spread a fault.
  - group: ELEC
    task: Use the values shown. Write the equation and give a rounded answer with units.
    title: Heating at a bad connection
    place: Electrical Integration Room
    scene: A new battery joint has 0.05 ohms of resistance and carries 20 amps. Find its heat
      rate before it starts a fire.
    guide: 'Five numbers, and three of them belong elsewhere: the bus voltage, the whole cable
      run, and half the current. Ask of each whether the heating at this joint depends on
      it. Note the square: at half the current the same joint gives off a quarter of the power.
      And note where it is. Twenty watts is nothing on a radiator and a great deal in one
      connector in a sealed cabin.'
    background:
    - Why an estimate rather than a calculation. Every quantity on this board is already measured
      or stated, so nothing here has to be derived. Two things are being tested. Can you pick
      the quantities the relationship actually needs? And does the size of the answer look
      right once they are in place?
    - Why the tiles carry labels. A bare number cannot be checked against the relationship
      it is going into. Reading the label is how a unit mismatch is caught before the tile
      is placed. It is also how you catch a quantity that belongs to a different part of the
      problem. That habit is what this format exists to build.
    assumes:
    - a resistance carrying current turns electrical power into heat
    takeaway: Small resistances matter when current is large because heating scales with current
      squared.
    format: BALLPARK
    question: Estimate the heating power at the connection.
    why: Resistive heating is current squared times resistance, so the current term dominates.
      The same connector at half the current would give off a quarter of the power. The resistance
      sounds like nothing written down. The wattage it makes at this current is what decides
      whether the junction runs warm or starts a fire. 20 watts is nothing spread over a radiator.
      It is a great deal in one connector, in a sealed cabin, with no air moving over it.
    estimate:
      relationship: Power dissipated = current² × resistance.
      prompt: A connector in the improvised path develops 0.05 ohms while carrying 20 amps.
      question: Estimate the heating power at the connection.
      labels:
      - 20 A (current through the joint)
      - 0.05 Ω (joint resistance)
      - 28 V (bus voltage)
      - 0.5 Ω (resistance of the whole cable run)
      - 10 A (half the current)
      values:
      - 20
      - 0.05
      - 28
      - 0.5
      - 10
      slots: 2
      template: '{0}² × {1}'
      formula: a*a*b
      correct:
      - 0
      - 1
      target: 20
      tolerance: 2
      units: W
      solution: P = I²R = 20 W, in a joint the size of a thumbnail.
      explanation: 'The bus voltage is the wrong term: the power lost in a series joint depends
        on the current through it and the voltage across it, not the voltage of the system
        it sits in. Current enters squared, so the same joint at 10 A would dissipate a quarter
        as much.'
    reason: A small bad joint can start a fire at high current.
  - group: INTEG
    task: Lock a predicted equalization current, make the protected test connection, then
      choose whether to spend a check on the current that actually flows.
    title: Qualify the emergency battery plan
    place: Crew Procedure Simulator
    scene: The spare battery and live bus have different voltages. The cable can carry only
      8 amps. Predict the first current, then test it through a safe limit.
    guide: Lock what current you expect before anything is connected. Then make the connection
      and decide whether to spend what it costs to measure the electrical effect. The connector
      is rated for 8 amps, and the module reads 31 volts against a nominal 37. So the prediction
      is about whether this is safe as well as whether it helps.
    background:
    - Why the voltage matters more than it looks. A module at 31 volts against 37 nominal
      is either partly discharged or damaged, and those imply very different currents when
      it is connected to a healthy bus. The current is set by the difference between the two,
      divided by the resistance of everything between them.
    - What the connector rating means. Eight amps is what the hardware can carry continuously.
      Exceeding it inside a sealed cabin is not a component failure — it is heat, and possibly
      smoke, in the volume the crew is breathing.
    - 'Why measure rather than assume. The prediction can be right and the hardware still
      behave differently: a damaged cell, a high-resistance joint, a connector not fully seated.
      Spending the measurement is what converts a plan into a qualification, and not spending
      it leaves the crew relying on arithmetic.'
    assumes:
    - a voltage difference between connected batteries drives current
    - a current rating is a physical limit, not a suggestion
    takeaway: A successful electrical action is not a verified outcome until the current and
      heating it produces are measured.
    format: VERIFY
    question: What current do you expect, and will you verify the electrical effect before
      qualifying the module?
    verify:
      hint: Enter a predicted current before connecting. After the protected test succeeds,
        spend one check to read either clamp current or connector temperature; a completed
        connection alone does not pass.
      prediction:
        min: 6
        max: 16
        unit: A
        step: 0.2
      truth: 14
      passRatio:
      - 0.9
      - 1.1
      intervention:
        id: protected_test
        label: Connect through fused test lead
        alwaysSucceeds: true
      checks: 1
      requiredMeasurement: true
      limit:
        value: 8
        unit: A
        label: connector rating
      unit: A
      measurement:
        label: Clamp-current reading
        note: 14 A equalization current
        cost: 1
    answerText: The protected test produces about 14 A.
    why: Two batteries at different voltages exchange current as soon as a conductive path
      joins them. The connection can look mechanically perfect while the current is already
      above a connector rating. Protection limits the consequence of being wrong, but it does
      not tell you what happened. The electrical result still has to be measured. Here the
      test lead survives, yet the measured current is too high for the intended connector.
      That makes the direct configuration unacceptable even though the test itself completed
      normally.
    reason: The spare battery helps only if its first current is safe.

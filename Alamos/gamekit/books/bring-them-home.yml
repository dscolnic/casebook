theme:
  id: bring_them_home
  title: Bring Them Home
  subtitle: Flight Director · Lunar Return Mission

# The areas of study. One column of the game each; every group needs somebody on the roster.
groups:
  - id: NAV
    code: NAV
    name: Guidance & Motion
    color: "#315c78"
    desc: Kinematics, forces, gravity, trajectories, and navigation evidence.
    defaultLeader: reyes
    milestones:
      - Reconstruct the state
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: ELEC
    code: ELEC
    name: Power & Circuits
    color: "#9a741d"
    desc: Voltage, current, resistance, batteries, generation, and electrical faults.
    defaultLeader: shah
    milestones:
      - Close the power budget
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: THERM
    code: THERM
    name: Thermal & Life Support
    color: "#4b775f"
    desc: Heat transfer, gas behavior, pressure, flow, and life-support transport.
    defaultLeader: brooks
    milestones:
      - Keep the cabin stable
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: COMMS
    code: COMMS
    name: Waves & Communications
    color: "#704f88"
    desc: Radio waves, link budgets, pointing, optics, and signal timing.
    defaultLeader: ito
    milestones:
      - Recover the link
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: STRUCT
    code: STRUCT
    name: Rotation & Structures
    color: "#9a3f36"
    desc: Torque, angular motion, oscillations, resonance, and structural response.
    defaultLeader: mensah
    milestones:
      - Control motion and vibration
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: INTEG
    code: INTEG
    name: Mission Integration
    color: "#3d6f52"
    desc: Uncertainty, competing constraints, robust decisions, and final readiness.
    defaultLeader: carter
    milestones:
      - Integrate the evidence
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off

# The cast. `division` is what makes a person a valid person stop.
roster:
  - id: reyes
    name: Dr. Camila Reyes
    role: Guidance Lead
    division: NAV
    quiz:
      - q: How does Reyes tell a real trajectory change from a measurement artefact?
        a: By seeing whether independent sources moved, or only one
        wrong:
          - By re-running the same navigation solution with much tighter tolerances
          - By waiting for the next scheduled navigation update
          - By comparing the result against the pre-launch plan
    bio: Uses independent tracking and dynamics to decide whether an apparent trajectory change is physical or a measurement artifact.
  - id: shah
    name: Priya Shah
    role: Power Systems Lead
    division: ELEC
    quiz:
      - q: Why does Shah read voltage, current and heat as one system?
        a: They are three views of one energy budget
        wrong:
          - Three separate instruments together are more accurate than any one of them
          - Heat is the only quantity that can be measured directly in flight
          - The three meters share a single power supply
    bio: Reads voltage, current, power, and heat as one energy system rather than isolated meters.
  - id: brooks
    name: Dr. Aaron Brooks
    role: Thermal and Life Support Lead
    division: THERM
    quiz:
      - q: What does Brooks mean by asking whether hardware is transporting what it should?
        a: Power to a fan is not proof that air is moving
        wrong:
          - Hardware telemetry becomes unreliable during a power-down and cannot be trusted
          - Transport rates can only be measured on the ground
          - The crew cannot hear whether a fan is running
    bio: Tracks heat and gas through the cabin and asks whether powered hardware is actually transporting what it should.
  - id: ito
    name: Naomi Ito
    role: Communications Lead
    division: COMMS
    quiz:
      - q: Why does Ito treat received power as only part of a link diagnosis?
        a: Pointing, range and a transmitter fault all look the same in it
        wrong:
          - Received power is sampled too slowly to be useful during a fast fade
          - Power readings are quantised too coarsely at long range
          - Only frequency measurements are calibrated
    bio: Turns wave physics, antenna pointing, range, and receiver measurements into a quantitative link diagnosis.
  - id: mensah
    name: Kwame Mensah
    role: Dynamics and Structures Lead
    division: STRUCT
    quiz:
      - q: Why does Mensah care about the frequency something is shaken at, not just how hard?
        a: A structure answers strongly only near its own natural frequency
        wrong:
          - Forcing at high frequency always does more damage than forcing at low frequency
          - Frequency determines how far the vibration travels through the hull
          - Accelerometers only respond above a threshold frequency
    bio: Connects torque, forcing frequency, natural modes, and measured motion to spacecraft behavior.
  - id: carter
    name: Dr. Evelyn Carter
    role: Mission Integration Lead
    division: INTEG
    quiz:
      - q: What is Carter guarding against by demanding independent evidence?
        a: Two instruments sharing a step can be wrong together
        wrong:
          - Crew reports become unreliable when the people making them are under stress
          - A single instrument cannot be calibrated in flight
          - Independent teams work faster than one large team
    bio: Challenges common-mode assumptions and makes the final decision only after independent evidence agrees.
  - id: whitaker
    name: Dale Whitaker
    role: Trajectory Officer
    division: NAV
    bio: |-
      Fits trajectories to whatever tracking exists, which on a bad shift is three
      numbers taken hours apart. A fit that matches the data he has is easy; a fit
      that predicts the next observation is the only kind he will sign.

      He treats residuals as the real output. A pattern in what the model got
      wrong points at an unmodelled force or a clock error, and both of those have
      hidden themselves inside a good-looking fit before.
    quiz:
      - q: Why does Whitaker judge a trajectory fit by its residuals rather than by how closely it matches the tracking?
        a: Structure in the errors shows a force or a clock the fit is hiding
        wrong:
          - Residuals are the only quantity the tracking stations report back to the room
          - A fit with small residuals always has small uncertainty
          - Residuals convert range measurements into velocity
  - id: ferreira
    name: Ana Ferreira
    role: Electrical Load Officer
    division: ELEC
    bio: |-
      Keeps the power budget, which during this flight means keeping a list of
      everything aboard that consumes energy and what happens the hour after it is
      switched off.

      Her rule is that no load is switched off in isolation. A heater turned off to
      save amp-hours becomes a thermal problem that costs more amp-hours to
      reverse, and the ledger has to be kept across systems rather than within one.
    quiz:
      - q: Why does Ferreira refuse to evaluate a load in isolation?
        a: Switching one off moves the cost somewhere else
        wrong:
          - Every load aboard draws the same current
          - Loads can only be measured while the fuel cells are running
          - A load's cost is fixed by its rating rather than by its use
  - id: novak
    name: Petra Novak
    role: Life Support Engineer
    division: THERM
    bio: |-
      Works the three things a sealed cabin runs out of — heat, breathable gas and
      water — and the ways they interfere with each other. Cooling the cabin
      condenses water onto the coldest surfaces, and the coldest surfaces are
      usually the electronics.

      She measures in more than one place on principle. A single cabin sensor
      reports the air beside itself, and a compartment with poor circulation can be
      perfectly comfortable at the sensor and dangerous two metres away.
    quiz:
      - q: Why does Novak insist on carbon dioxide readings from several cabin locations?
        a: With poor circulation the gas is not uniform, so a sensor reads its own corner
        wrong:
          - Sensors drift too quickly to be trusted individually
          - The crew cannot reach the primary sensor while the module is powered down for the test
          - Multiple readings are averaged to remove instrument noise
  - id: haldane
    name: Marcus Haldane
    role: Link Analyst
    division: COMMS
    bio: |-
      Accounts for every decibel between the spacecraft transmitter and the ground
      receiver. A fade is never mysterious to him; it is one term in a budget that
      changed, and the work is finding which.

      Range, antenna pointing, receiver bandwidth and transmitter health all reduce
      the same received power, and they are told apart by what else changed at the
      same moment rather than by the signal level itself.
    quiz:
      - q: How does Haldane separate a pointing problem from a transmitter failure?
        a: By what changed alongside it — attitude, range and schedule leave traces
        wrong:
          - A transmitter failure always removes the carrier completely
          - Pointing errors change the frequency and failures do not
          - The received power alone identifies the cause without any other measurement
  - id: okoye
    name: Chidi Okoye
    role: Structural Dynamics Engineer
    division: STRUCT
    bio: |-
      Studies how a spacecraft responds to being pushed at particular rates. A
      structure has frequencies at which a small repeated force produces a large
      motion, and hardware that is perfectly strong at rest can fail there.

      He never accepts a single accelerometer as a description of a mode. One
      sensor sits at one point, and a point that happens to sit at a node reads
      almost nothing while the panel beside it moves.
    quiz:
      - q: Why will Okoye not characterise a vibration mode from one accelerometer?
        a: At a still point of that mode there is nothing to feel
        wrong:
          - Accelerometers cannot measure below one hertz
          - A single sensor cannot record frequency, only amplitude
          - One sensor is enough only if the pump speed is constant
  - id: lindqvist
    name: Erika Lindqvist
    role: Flight Dynamics Integrator
    division: INTEG
    bio: |-
      Sits between the back rooms and the loop, and her job is the one nobody else
      has: deciding which of six correct answers the flight director hears first.

      She keeps the anomaly log, because in a fast failure the expensive mistake is
      not a wrong number but two rooms acting on different versions of the same
      number an hour apart.
    quiz:
      - q: What does Lindqvist treat as the main risk during a fast-moving failure?
        a: Two teams working from figures that disagree
        wrong:
          - A back room refusing to give an estimate at all
          - The crew asking questions over the loop
          - Telemetry arriving faster than it can be plotted

# Terms the game may explain in place.
glossary:
  - name: Calibration
    aliases:
      - calibration
      - calibrated
      - calibrate
    def: The correction between what an instrument reads and what is true, established against something known. A shared calibration is why two instruments can be wrong together.
  - name: Common-mode error
    aliases:
      - common-mode error
    def: A shared error that makes several measurements agree for the same wrong reason.
  - name: Doppler shift
    aliases:
      - doppler shift
    def: A frequency change caused by relative motion between source and observer.
  - name: Parallax
    aliases:
      - parallax
    def: The apparent shift of a nearby object against a distant background when the viewpoint moves. With a known baseline it gives a distance.
  - name: Power
    aliases:
      - power
    def: The rate at which energy is transferred or used.
  - name: Resonance
    aliases:
      - resonance
    def: Large oscillation produced when forcing is near a system natural frequency.
  - name: Scrubber
    aliases:
      - scrubber
      - scrubbers
    def: The unit that removes carbon dioxide from the cabin air. It cleans only the air that reaches it.
  - name: State vector
    aliases:
      - state vector
    def: A compact description of position and velocity at one time.
  - name: Torque
    aliases:
      - torque
    def: The rotational effect of a force applied with a lever arm.
  - name: Transponder
    aliases:
      - transponder
    def: The box aboard the spacecraft that answers a radio pulse from the ground, which is what makes timing the round trip a distance measurement.

# The campaign: 1 working day each, 3 stops and a callback from day 3.
missions:
  - title: The Failure
    objective: Create a trusted state vector and a prioritized anomaly list before commanding the crew.
    briefing: A crewed lunar spacecraft reports an explosion, falling electrical power, and contradictory telemetry. The player takes the flight-director console and must first determine what can still be measured reliably.
    stake: "The bang was four minutes ago. Commander Hale reported it before any instrument did, which is the first thing that should worry you. Now three consoles hold numbers that contradict each other: one bus reads zero, the guidance computer has restarted with nothing loaded, and several cabin-pressure channels dropped together inside the same second. The integration lead, Evelyn Carter, is already saying that channels dropping together are one fault and not three. This shift you decide what is happening to the vehicle, get one agreed picture of it, and set how this room will work for the next five days. Hale, Ruiz and Sato can hear every word of this."
    takeaway: Use units, vectors, graphs, measurement uncertainty, common-mode failure as an evidence chain rather than as isolated facts.
    stops:
      - group: INTEG
        task: Open the dependency chain behind each pressure reading. Keep the evidence that stands independently, then name the shared source that explains the false alarm.
        title: "What failed: the spacecraft or the sensors?"
        place: Mission Control
        scene: Nine minutes after the bang, three digital cabin-pressure channels fall together. A mechanical gauge, an acoustic leak monitor, and the sensor-electronics page are also live. The flight director wants one diagnosis before the crew starts opening panels.
        assumes:
          - several instruments can share one reference circuit
          - an independent measurement does not inherit that shared failure
        takeaway: Several agreeing readouts count as one piece of evidence when they inherit the same physical reference.
        format: TRACE
        question: Which pressure evidence survives the dependency check, and what shared source moved the rest?
        trace:
          decision: Decide whether the cabin pressure really changed or several readouts inherited one bad reference.
          hint: Open each channel to see what physical sources it depends on. Keep channels whose measurement path does not pass through the suspect shared source.
          channels:
            - id: digital_a
              label: Pressure channel A
              reading: drops sharply
              depends:
                - cabin
                - sensor_ref
            - id: digital_b
              label: Pressure channel B
              reading: drops sharply
              depends:
                - cabin
                - sensor_ref
            - id: digital_c
              label: Pressure channel C
              reading: drops sharply
              depends:
                - cabin
                - sensor_ref
            - id: mechanical
              label: Direct pressure gauge
              reading: steady
              depends:
                - cabin
                - mechanical_path
            - id: acoustic
              label: Leak monitor
              reading: no leak signature
              depends:
                - acoustic_path
          resources:
            - id: cabin
              label: Cabin gas pressure
            - id: sensor_ref
              label: Shared electrical reference
            - id: mechanical_path
              label: Mechanical gauge linkage
            - id: acoustic_path
              label: Acoustic leak monitor
          target: sensor_ref
          independent:
            - mechanical
            - acoustic
        answerText: Keep the mechanical pressure evidence and reject the three digital channels as independent votes. Their common sensor-reference circuit is the shared source that shifted.
        why: Agreement is strong evidence only when the measurements can fail independently. The three digital pressure channels all inherit the same reference circuit. When that reference shifts, all three move together even if cabin pressure does not. The mechanical gauge has a different physical path, so its steady reading still counts. The acoustic monitor also finds no leak. Tracing dependencies turns three alarming numbers into one electrical fault and preserves the evidence that still stands.
        headline: Mission Control receives a sudden cabin-pressure warning on several digital channels.
      - group: INTEG
        task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly placed cards after each check.
        title: Build the first state estimate
        place: Telemetry Analysis Room
        scene: Three consoles hold contradictory numbers. One bus reads zero. The guidance platform has restarted with no record of what it saw. Nothing has been written down in an order the next controller could reconstruct.
        assumes:
          - a number without its units and its time is not a measurement
        takeaway: A good emergency command works across uncertainty rather than assuming it away.
        format: SEQUENCE
        why: A state estimate is only worth having if it survives being wrong, and the order is what makes that possible. Telemetry across the failure is overwritten within minutes, so it is frozen before anything is computed from it. Units, timestamps and calibration come next, because a fit across mixed clocks produces a confident answer that is wrong. Estimates then carry uncertainties rather than single values. And the commands that follow are the ones whose benefit holds across every state the data still allows.
        rebuttals:
          - Preserve the telemetry first. It is the only step with a deadline set by something other than the crew — the buffers overwrite whether or not anybody is ready.
          - Check units, timestamps and shared dependencies second. This is where a common-mode failure becomes visible instead of being fitted.
          - Build the estimates third, with uncertainties attached. A state without an uncertainty cannot be argued with or tested.
          - Command last, and only where the benefit survives the whole range of states still consistent with the data.
        cards:
          - Freeze and preserve the pre- and post-failure telemetry.
          - Verify units, timestamps, calibration states, and shared dependencies.
          - Construct position, velocity, attitude, power, pressure, and temperature estimates with uncertainties.
          - Issue only commands whose benefits remain robust across the plausible states.
        order: [0, 1, 2, 3]
      - group: INTEG
        task: Ten minutes to the next tracking pass. What does the flight director do first?
        title: Spend the first ten minutes
        place: Spacecraft Systems Console
        scene: Four controllers, a crew flying a vehicle that is venting something, and ten minutes to the next tracking pass. Every subsystem wants the loop, and each believes its own problem is the one that kills the crew.
        assumes:
          - two rooms acting on different versions of one number is worse than either acting alone
        takeaway: Attention is a scarce physical resource during a fast-moving systems failure.
        format: CHOICE
        question: Ten minutes to the next tracking pass. What does the flight director do first?
        why: Attention is a physical resource in an emergency, just like propellant. The first decision determines where that resource goes. Four controllers are already working one failure from four sets of numbers. Without one log and one command authority, the same analysis can be repeated or contradicted. The crew may then execute whichever version reaches them first. Organising the room is not a delay before the technical work. It is what lets every later calculation and command count once.
        choices:
          - Open one anomaly log and one command authority.
          - Reconstruct the electrical and pressure timeline.
          - Verify the trajectory and attitude independently.
          - Ask every subsystem for a complete report at once.
        answer: Open one anomaly log and one command authority.
        rebuttals:
          - The electrical and pressure timeline is the first real analysis, and it is exactly what the log exists to hold. Start it second and it survives the shift change.
          - Independent trajectory verification decides whether the vehicle can come home. It is needed before the burn, not before the room is organised.
          - Six complete subsystem reports arrive after the tracking pass and consume the ten minutes that were supposed to prepare for it.
  - title: Find the Spacecraft
    objective: Produce a consistent trajectory estimate and identify which new observation most reduces uncertainty.
    briefing: Tracking data are intermittent, and the onboard computer has restarted. The team must reconstruct position and velocity from range, bearing, and timed observations.
    stake: 9 hours after the bang, and the station carrying the whole solution sets in 40 minutes. The guidance lead, Camila Reyes, will not sign the trajectory until she has one measurement that did not come through the same computer. Today you rebuild where the spacecraft is and how fast it is going, and buy the next observation. Fitting the measurements together is the job, and only one station is still up. Her trajectory officer, Dale Whitaker, wants a number now so the room can start planning the correction. Reyes wants the right number. They are both right, and there are 40 minutes.
    takeaway: Use position, velocity, acceleration, coordinate systems, graphs of motion as an evidence chain rather than as isolated facts.
    stops:
      - group: NAV
        task: Match each quantity the state estimate needs to the measurement that provides it.
        title: Which measurement constrains what?
        place: Deep-Space Tracking Station
        scene: The onboard computer has restarted and the tracking is intermittent, so the state has to be rebuilt from whatever measurements can still be taken. The room has to say what each type buys before it schedules any of them.
        assumes:
          - describing where something is and how it is moving takes six numbers
        takeaway: Navigation is a reconstruction from partial projections.
        format: PROTOCOL
        why: Each measurement constrains a different part of the spacecraft state. Direction comes from angles against known stars. Range comes from radio travel time. Doppler carries line-of-sight speed in the frequency shift. At 2 gigahertz, a closing speed of 1 kilometre per second shifts the carrier by about 7 kilohertz. Repeated positions give velocity, and repeated velocities give acceleration. That last step is noisy because each subtraction carries measurement error forward.
        columns:
          - What we want to measure
          - How we measure it
        rebuttals:
          - Direction is an angle, and the star camera is the only instrument here that measures one.
          - A velocity along the line of sight is carried by the returned wave itself, in its frequency.
          - A distance is a time multiplied by a speed, which is what the round trip provides.
          - Rates come from repetition — two positions give a velocity, and two velocities give an acceleration.
        scenarios:
          - Direction on the sky.
          - Line-of-sight velocity.
          - Range along the line of sight.
          - How fast it is going, and whether that is steady.
        choices:
          - Photograph the spacecraft against catalogued stars. The angle between it and stars whose places are already fixed gives the line it lies along, to the precision of the catalogue and the optics.
          - Compare the frequency that comes back with the frequency that was sent. Motion along the line of sight stretches or compresses the returning wave, and the fractional change in frequency equals the speed as a fraction of the speed of light.
          - Time a pulse out to the spacecraft and back through its transponder. Radio travels at a known speed, so half the round-trip time multiplied by that speed is the distance.
          - Repeat the same position measurement at recorded times. Subtracting positions gives velocity, and subtracting those velocities gives acceleration.
        mapping: [0, 1, 2, 3]
      - group: NAV
        task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly placed cards after each check.
        title: Reconstruct the state vector
        place: Guidance Room
        scene: The computer restarted and lost its alignment. A range, two bearing angles, and a Doppler trace remain. They were recorded on different clocks, and the next tracking pass will test whatever state the room reconstructs.
        assumes:
          - measurements only combine when they share a frame and a clock
        takeaway: A useful state estimate predicts future observations and exposes its own failures.
        format: SEQUENCE
        why: A useful state estimate has to predict the next observation. First, every measurement is moved onto one coordinate system and one clock. Otherwise a clean fit can still be wrong. Range, angle, and Doppler are then fitted together because they constrain different parts of the motion. The residuals show what the model missed. A pattern suggests an unmodeled force; random scatter suggests noise. Finally, both the state and its uncertainty are propagated to the time of the burn.
        rebuttals:
          - One coordinate system and one time standard first. Two clocks in a single fit is the error that never shows up in the residuals afterwards.
          - Fit range, angle and Doppler together second. Fitting them separately gives three answers and no way to choose.
          - Read the residuals third, for structure rather than size. Scatter is noise; a pattern is a force nobody modelled.
          - Propagate state and uncertainty to the decision time last. The burn happens later than the data, and the uncertainty grows on the way.
        cards:
          - Transform all observations into one coordinate and time system.
          - Fit a trajectory that predicts range, angle, and Doppler together.
          - Examine residuals for bias or unmodeled acceleration.
          - Propagate the state and its uncertainty forward to the hour the burn is committed.
        order: [0, 1, 2, 3]
      - group: NAV
        task: Why does the spacecraft need any speed at all to stay in that orbit?
        title: What holds it in the curve
        place: Guidance Computer Room
        scene: The free-return path swings the spacecraft round the Moon at 2,500 kilometres altitude. Somebody on the loop has asked why it does not simply fall onto the surface, and the room owes them an answer.
        assumes:
          - an object moving in a circle is accelerating even at constant speed
        takeaway: A curved path needs a force toward the centre, and orbital motion is that force being exactly enough.
        format: CHOICE
        question: Why does the spacecraft need any speed at all to stay in that orbit?
        why: Circular motion requires acceleration toward the centre. Around the Moon, gravity supplies that inward acceleration. The spacecraft is therefore falling during the entire orbit. Its sideways speed makes the falling path curve around the Moon instead of into the surface. Too little speed makes the path intersect the Moon. Too much opens the path outward. No engine must hold the spacecraft up. The crew feel weightless because there is no support force opposing the free fall.
        choices:
          - Its sideways speed makes continuous free fall curve around the Moon.
          - An outward inertial force balances gravity so the spacecraft has no acceleration.
          - Its speed reduces how strongly lunar gravity acts on the spacecraft.
          - Its forward motion produces lift that supports it against lunar gravity.
        answer: Its sideways speed makes continuous free fall curve around the Moon.
        rebuttals:
          - In an inertial frame there is no outward force balancing gravity. The spacecraft accelerates inward continuously.
          - Speed does not weaken gravity. It changes the shape of the path produced by that inward acceleration.
          - There is no atmosphere to provide aerodynamic lift, and the engine is off for most of the return.
  - title: The Wrong Trajectory
    objective: Choose a correction that restores a safe return while preserving fuel and engine options.
    briefing: The spacecraft is drifting away from its planned free-return path. The player must use Newtonian gravity and impulse to determine whether a small correction now can prevent a large correction later.
    stake: 18 hours in, the drift is confirmed, and this is where Whitaker and Carter stop agreeing for the rest of the mission. The path misses the entry corridor by 400 kilometres. Whitaker wants a modest burn this shift, arguing that a correction gets cheaper the earlier it is made. Carter wants to wait for the next tracking pass, because correcting a number you have not measured properly is how a small error becomes a committed one. This shift you settle it. That is Whitaker's whole case, and this shift it is the better one. There is no more propellant coming.
    takeaway: Use Newton’s laws, gravity, orbits, impulse, trajectory sensitivity as an evidence chain rather than as isolated facts.
    stops:
      - group: INTEG
        task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly placed cards after each check.
        title: From force to trajectory change
        place: Orbital Analysis Room
        scene: The spacecraft is drifting off the free-return path by an amount that is small today and fatal at the atmosphere. The crew wants to know why a few seconds of thrust now beats minutes of thrust tomorrow.
        assumes:
          - a force acting on a mass produces an acceleration
        takeaway: Trajectory control acts on velocity now to change position much later.
        format: SEQUENCE
        why: "The chain starts with force applied for a measured time. Force divided by spacecraft mass gives acceleration. That acceleration changes velocity during the burn. The impulse, force times time, equals the change in momentum. For a fixed spacecraft mass, that sets the change in speed. The new velocity then changes where the spacecraft will be hours later. This is why an early correction can be small: the vehicle carries the changed velocity for a long time before arrival."
        rebuttals:
          - Force for a measured time is where the chain starts. Everything after it is a consequence of that one product.
          - Force divided by mass is acceleration. The same engine on a heavier vehicle produces less of it.
          - Acceleration integrated over the burn is the velocity change, and it is proportional to the impulse rather than to the thrust alone.
          - The new velocity changes position hours later. That delay is not a weakness of the method — it is what makes a small early burn worth a large late one.
        cards:
          - An engine produces a force for a measured time.
          - The force gives the spacecraft an acceleration.
          - Acceleration changes velocity by an impulse-dependent amount.
          - The new velocity changes the later orbit and encounter geometry.
        order: [0, 1, 2, 3]
      - group: NAV
        task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
        title: Small burn, large consequence
        place: Guidance Console
        scene: A 30,000 kg spacecraft takes 6,000 N of thrust for 20 seconds. The flight-dynamics officer needs the resulting acceleration and change in speed before the correction burn is approved.
        assumes:
          - force applied over a time is an impulse
        takeaway: Orbital corrections often rely on small velocity changes applied early.
        format: BALLPARK
        question: Estimate the change in speed.
        why: Force divided by mass gives an acceleration of 0.20 metres per second squared. Over 20 seconds, that produces a 4 metre-per-second change in speed. The same result comes from impulse divided by mass. Four metres per second looks tiny beside an orbital speed measured in kilometres per second. Applied days before arrival, however, it shifts the encounter by hundreds of kilometres. A late correction must produce the same positional change in far less time, so it costs much more.
        estimate:
          relationship: Net force ÷ mass is the acceleration. Thrust is steady, so at constant acceleration the velocity change is acceleration × burn time.
          prompt: A 30,000 kg spacecraft receives 6,000 N of thrust for 20 seconds.
          question: Estimate the change in speed.
          labels:
            - 6,000 N (thrust)
            - 20 s (burn duration)
            - 30,000 kg (vehicle mass)
            - 9.81 m/s² (surface gravity)
            - 1,500 s (specific impulse)
          values: [6000, 20, 30000, 9.81, 1500]
          slots: 3
          template: "{0} × {1} ÷ {2}"
          formula: a*b/c
          correct: [0, 1, 2]
          target: 4
          tolerance: 0.3
          units: m/s
          solution: Δv = Ft/m = 4 m/s.
          explanation: Force times time is impulse; impulse divided by mass is the velocity change. Surface gravity has no bearing on a vehicle in free flight, and specific impulse would tell you what the burn costs in propellant rather than what it achieves.
      - group: THERM
        task: The tank reads 40 psi and the regulator wants 15. What is the flow doing?
        title: What the pressure difference is for
        place: Life Support Lab
        scene: The oxygen tank reads 40 psi, the cabin regulator is set to 15, and the flow has fallen to half of what the plan assumed. The line is the same line it was yesterday.
        assumes:
          - gas flows from higher pressure to lower pressure
        takeaway: Something moves through a system for one reason and is held back for another.
        format: CHOICE
        question: The tank reads 40 psi and the regulator wants 15. What is the flow doing?
        why: Gas moves when a pressure difference exists across a path. The flow rate also depends on how restrictive that path is. A 40 psi tank feeding a 15 psi regulator still has a strong driving difference. If the measured flow falls by half, either that difference changed or resistance in the path increased. A partly closed valve, ice, or a loaded filter can do that. Tank pressure alone never guarantees flow, because even a high-pressure tank delivers nothing through a blocked line.
        choices:
          - The pressure difference still drives flow; the lower rate points to more resistance in the path.
          - The regulator fixes the flow rate, so a lower measured rate must be a bad flow sensor.
          - The 40 psi tank pressure alone sets the flow, so the regulator cannot explain any change.
          - The cabin temperature can reverse the flow even while the tank remains at higher pressure.
        answer: The pressure difference still drives flow; the lower rate points to more resistance in the path.
        rebuttals:
          - A regulator sets downstream pressure, not a guaranteed flow. Added restriction can reduce flow at the same pressure setting.
          - Flow depends on the whole pressure drop and the resistance between the two ends, not on tank pressure alone.
          - A warmer cabin can change gas density and pressure, but it does not reverse a large pressure gradient by itself.
  - title: Turn Without Wasting Fuel
    objective: Develop a controlled reorientation procedure that stops the rotation at the required attitude.
    briefing: The main guidance platform is unavailable, and the crew must reorient the spacecraft using limited thrusters and visible reference objects.
    stake: 26 hours in. The guidance platform is off to save power, 1 thruster quad is dead, and Hale has to turn the spacecraft 90 degrees by hand while Sato reads angles aloud. Kwame Mensah, who owns the structural dynamics, has done the sums and does not like them. This shift you agree what the rotation numbers mean, write the procedure, and work out what a thruster actually does. Every degree of turn is paid for twice, once to start it and once to stop it. Let it tumble and the antenna, the array and the burn attitude go together.
    takeaway: Use torque, angular acceleration, moment of inertia, angular momentum, center of mass as an evidence chain rather than as isolated facts.
    stops:
      - group: STRUCT
        task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used once.
        title: Read rotational motion
        place: Attitude Dynamics Lab
        scene: The main guidance platform is unavailable and the crew is about to fly the vehicle by hand. Before anybody touches a thruster the room states the rotational mechanics plainly, because each one has a consequence the crew will feel.
        assumes:
          - a torque is what makes something start or stop turning
        takeaway: Attitude control is Newtonian mechanics around a center of mass.
        format: PROTOCOL
        why: Attitude control is Newtonian mechanics about a centre of mass. Torque grows with force and with the lever arm from that centre. The same torque produces less angular acceleration when the moment of inertia is larger. Equal and opposite torques applied for equal times cancel the net angular impulse. Internal mass motion can change how fast different parts rotate, but it cannot change the vehicle's total angular momentum without an external torque. Those four rules set the logic of every manual turn.
        columns:
          - What you change
          - What happens to the rotation
        rebuttals:
          - The same force farther from the centre of mass is a longer lever arm and therefore a larger torque. This is the term the crew can actually choose.
          - The same torque on a larger moment of inertia gives less angular acceleration. Harder to start, and equally hard to stop.
          - Equal and opposite torques for equal times cancel the net angular impulse, which is what a start pulse and a stop pulse are for.
          - Moving internal mass with no external torque redistributes the rotation and conserves the total. Nothing inside the vehicle can change it.
        scenarios:
          - Apply the same force farther from the center of mass.
          - Increase moment of inertia with the same torque.
          - Apply equal and opposite torques for equal times.
          - Move internal masses while no external torque acts.
        choices:
          - Larger torque.
          - Smaller angular acceleration.
          - Approximately cancel the net angular impulse.
          - Total angular momentum remains conserved, though rotation distribution can change.
        mapping: [0, 1, 2, 3]
      - group: INTEG
        task: Choose the opening pulse and the angle where counter-torque begins. Run the maneuver and stop the spacecraft at 90 degrees with almost no remaining rotation.
        title: Execute a manual attitude maneuver
        place: Crew Procedures Room
        scene: The guidance platform is off. The crew must turn the spacecraft 90 degrees using 2 opposing thruster pairs and a window reticle. Every extra correction spends propellant reserved for entry.
        assumes:
          - a torque changes angular speed
          - rotation continues after a thruster stops firing
        takeaway: In undamped rotation, stopping the torque does not stop the motion; braking must begin before the target.
        format: FLY
        question: How hard do you start the turn, and where do you begin braking so the spacecraft arrives at rest?
        fly:
          hint: Pick a start-pulse duration, then set the angle where the opposite thruster begins firing. The run ends only when the vehicle has stopped rotating.
          target: 90
          accel: 2
          tolerance: 3
          rateTolerance: 1
          start: 0
          startRate: 0
          pulse:
            min: 4
            max: 8
            step: 2
            unit: s
          budget: 16
          brake:
            min: 35
            max: 90
            step: 1
        answerText: Brake before the target. For the 6 s pulse shown here, the vehicle reaches 12 deg/s and needs about 36 degrees of counter-torque to stop, so braking begins near 54 degrees.
        why: A thruster pulse changes angular speed; it does not create a turn that stops by itself. After the opening pulse ends, the spacecraft keeps rotating at the new rate. The opposite thruster needs time and angle to remove that rate. For equal start and stop pulses, the braking distance is the same kind of problem as stopping a moving cart. A late brake therefore overshoots. The maneuver is successful only when both angle and angular rate are small at the target.
      - group: NAV
        task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
        title: Torque from a thruster
        place: Guidance Console
        scene: A 200 N thruster fires at right angles, 3 metres from the centre of mass. The crew needs the torque before it can predict how fast the vehicle starts to turn.
        assumes:
          - a longer lever arm gives the same force more turning effect
        takeaway: Force location matters as much as force magnitude in rotational control.
        format: BALLPARK
        question: Estimate the torque about the centre of mass.
        why: Torque is force times lever arm times the sine of the angle between them. Here the force is perpendicular, so that sine is one. The calculation is therefore just 200 newtons times 3 metres. The result is 600 newton metres. Move the same thruster closer to the centre of mass and the torque falls in direct proportion. On this vehicle, the crew can choose which thruster pair fires. That choice changes the lever arm without changing the thruster.
        estimate:
          relationship: Torque = force × lever arm, when the force is at right angles to the arm.
          prompt: A 200 N thruster fires at right angles, 3 metres from the centre of mass.
          question: Estimate the torque about the centre of mass.
          labels:
            - 3 m (lever arm to the centre of mass)
            - 200 N (thruster force)
            - 1.5 m (distance to the docking ring)
            - 30,000 kg (vehicle mass)
            - 0.5 (cosine of 60°)
          values: [3, 200, 1.5, 30000, 0.5]
          slots: 2
          template: "{0} × {1}"
          formula: a*b
          correct: [0, 1]
          target: 600
          tolerance: 40
          units: N m
          solution: τ = rF = 600 N m, with the force at right angles.
          explanation: Torque is force times lever arm times the sine of the angle between them, and at right angles that last factor is one — which is why it does not appear. The lever arm has to be measured to the centre of mass, not to whatever structure is nearest.
  - title: The Power Budget
    objective: Build a load-shedding plan that preserves essential functions through the next critical maneuver.
    briefing: Fuel cells and batteries are degraded. Every electrical load now competes with guidance, communications, thermal control, and life support.
    stake: 34 hours in, and the argument changes shape. Priya Shah, who runs the power systems, has the reserve down to hours and wants everything non-essential off by the end of the shift. Aaron Brooks, on thermal and life support, says the two things on his list are the scrubber fan and the cabin heaters, and that his crew are already sleeping in everything they own. The bus is sagging at 24 volts instead of 28 while the current sits near where it should be, which is Shah's other problem. This shift you work out how long the batteries last, decide why the voltage is low, and choose what goes off.

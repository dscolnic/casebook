      - 2.0e9 Hz (carrier frequency)
      - 2.0e6 Hz (the carrier, misread as megahertz)
      - 343 m/s (speed of sound)
      - 12 dB (the observed loss)
      values:
      - 300000000.0
      - 2000000000.0
      - 2000000.0
      - 343
      - 12
      slots: 2
      template: '{0} ÷ {1}'
      formula: a/b
      correct:
      - 0
      - 1
      target: 0.15
      tolerance: 0.015
      units: m
      solution: λ = c/f = 0.15 m.
      explanation: A factor of a thousand in the frequency is a factor of a thousand in the wavelength, and a 150-metre wave would need an antenna nobody could fly. Reading the exponent is most of this calculation.
  - group: STRUCT
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly
      placed cards after each check.
    title: Recover the weak link
    place: Spacecraft Attitude Console
    scene: >-
      The carrier is down twelve decibels and drifting in frequency. The crew is
      answering calls it can barely hear, and the next navigation update depends
      on getting the link back.
    takeaway: Communication recovery joins wave physics, control, and estimation.
    format: SEQUENCE
    rebuttals:
    - Attitude and antenna geometry first. Pointing is the largest term in the budget and the cheapest one to fix.
    - 'Lower rate and narrower bandwidth second: less noise in the channel, and a slower signal needs less power to read.'
    - Large ground antennas with predicted Doppler third. The signal has drifted in frequency, so the receiver has to be told where to listen.
    - Feed the recovered range and Doppler into navigation last. Getting the link back also produces the measurements the burn needs.
    assumes:
    - a slower signal needs less power to be read
    cards:
    - Verify spacecraft attitude and antenna geometry.
    - Reduce data rate and narrow the receiver bandwidth.
    - Coordinate high-gain ground antennas and predicted Doppler tracking.
    - Use recovered range and Doppler data to refine navigation.
    order:
    - 0
    - 1
    - 2
    - 3
    why: >-
      Recovery combines three disciplines in a fixed order, cheapest and largest
      first. Pointing is the biggest term in the link budget and costs nothing
      but attitude, so geometry is checked before anything else. Reducing the
      data rate and narrowing the receiver bandwidth buys signal-to-noise
      without touching the spacecraft. Coordinating the large ground antennas
      with predicted Doppler puts the receiver where the signal actually is. And
      the range and Doppler recovered along the way feed straight back into
      navigation.
- title: A Blind Maneuver
  objective: Design a manual alignment procedure whose dominant angular errors are bounded.
  briefing: The crew must align for an engine burn using a window view, a reticle, and imperfect star references. The player
    must connect optics, angular measurement, and reference frames.
  stake: >-
    Seventy-four hours in, and this is the quiet shift. There is no guidance platform and no star tracker,
    so Ruiz will aim the burn by eye through a window reticle while Sato holds a stopwatch. Reyes has spent
    the shift separating what actually moves the spacecraft's aim from what only appears to. This shift you
    decide how many sightings make an alignment trustworthy. An aiming error is an angle, and an angle
    becomes a distance when multiplied by how far you are going: a tenth of a degree is invisible in that
    window and is hundreds of kilometres at the far end. Some of what Ruiz sees is real motion. Some is the
    window, the lighting, or his own eye at four degrees. Only repeated sightings on several stars separate
    them, and each one costs him twenty minutes of cold.
  takeaway: Use lenses, angular measurement, parallax, reference frames, error propagation as an evidence chain rather than
    as isolated facts.
  stops:
  - group: COMMS
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: What shifts the apparent direction?
    place: Optics Test Room
    scene: >-
      The crew will aim the burn by eye, through a window reticle. Before that
      is trusted the room separates what the instrument does from what the
      spacecraft does.
    takeaway: Manual navigation requires separating instrument geometry from spacecraft motion.
    format: PROTOCOL
    rebuttals:
    - Eye moving against a nearby reticle is instrument parallax. Nothing outside the window has changed.
    - A focus change alters how sharp the image is and leaves the direction where it was.
    - A near object shifting against distant stars as the viewpoint moves is geometric parallax, and the size of the shift carries the distance.
    - The star field is fixed in inertial space. If it appears to move, the vehicle turned.
    assumes:
    - what you see through an eyepiece depends on where your eye is
    scenarios:
    - The eye moves relative to a nearby reticle.
    - A lens focal setting changes image sharpness.
    - A nearby object shifts against distant stars as viewpoint changes.
    - The spacecraft rotates while the star field remains fixed inertially.
    choices:
    - Parallax between eye and reticle.
    - Focus change.
    - Geometric parallax.
    - Change of body-frame orientation relative to the inertial frame.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: >-
      Manual navigation is only trustworthy when instrument geometry and
      spacecraft motion are told apart, because both move the line of sight and
      only one of them means anything. An eye shifting relative to a nearby
      reticle is parallax inside the instrument, and it is entirely an artefact
      of the observer. A focal change alters sharpness and not direction. A
      nearby object shifting against distant stars is real geometric parallax,
      carrying real distance information. And the star field staying fixed while
      the view turns is the vehicle rotating.
  - group: INTEG
    task: Match each feature of the plotted trace to what it tells you about the motion.
    title: Reading the trace instead of the number
    place: Flight Director console
    scene: >-
      The plot board has ninety minutes of range against time on it, and the room
      keeps quoting the latest value out loud. The shape of the line has more in it
      than the last point does.
    takeaway: A graph carries rate and change of rate, neither of which is visible in the latest reading.
    format: PROTOCOL
    assumes:
    - the slope of a distance-time graph is a speed
    question: Match each feature of the plotted trace to what it tells you about the motion.
    scenarios:
    - The slope of the line
    - A change in the slope
    - Scatter about a smooth line
    - A step with no slope change after it
    choices:
    - The rate the quantity is changing at.
    - An acceleration, so something acted.
    - Measurement noise rather than motion.
    - An instrument or bookkeeping offset, not a manoeuvre.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: >-
      A distance-time trace gives the speed in its slope and the acceleration in how
      that slope changes, and neither is recoverable from the newest number read out
      loud. The two failure shapes matter as much: scatter around a smooth line is
      noise, and a step that leaves the slope unchanged is an offset — a recalibrated
      instrument, a units change, a bookkeeping correction — rather than anything the
      spacecraft did. Reading the shape first is what stops the room chasing a
      manoeuvre that never happened.
    rebuttals:
    - The slope is the rate; the value is only where the quantity has got to.
    - A slope change is the acceleration, which is the only feature that means a force acted.
    - Scatter is the instrument. Averaging it improves the estimate; explaining it as motion invents one.
  - group: NAV
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
    title: How far it drifts while nobody is steering
    place: Guidance Computer Room
    scene: >-
      Between the two burns the spacecraft is unpowered, and a small residual
      acceleration acts on it for 90 seconds. Nobody has turned that into a
      distance yet.
    takeaway: Under a constant acceleration, displacement grows with the square of the time.
    format: BALLPARK
    assumes:
    - an object under constant acceleration covers half the acceleration times the time squared
    question: Estimate the drift over the 90 seconds.
    why: >-
      Half of 0.004 metres a second squared, times 90 squared, is about 16 metres.
      The reason this matters more than it looks is the square: double the coast and
      the drift quadruples, so the same residual over six minutes is not 32 metres
      but 260. It is the same relationship as free fall — a projectile with no
      thrust is under one acceleration and nothing else, and its path is set by that
      and its initial velocity alone.
    estimate:
      relationship: Displacement = ½ × acceleration × time², for a constant acceleration from rest.
      prompt: A residual acceleration of 0.004 m/s² acts for 90 s with the engine off.
      question: Estimate the drift over the 90 seconds.
      labels:
      - 0.004 m/s² (residual acceleration)
      - 90 s (unpowered coast)
      - 0.5 (the one half in the relationship)
      - 9.81 m/s² (surface gravity, for scale)
      values:
      - 0.004
      - 90
      - 0.5
      - 9.81
      slots: 3
      template: '{2} × {0} × {1}²'
      formula: c*a*b*b
      correct:
      - 0
      - 1
      - 2
      target: 16
      tolerance: 3
      units: m
      solution: 0.5 × 0.004 × 90² = 0.002 × 8,100 ≈ 16 m.
      explanation: The time is squared. Use it once and the answer is 0.36 m, which would look like nothing worth correcting.
- title: Crossing the Atmosphere
  objective: Choose a corridor and monitoring strategy robust to atmospheric and navigation uncertainty.
  briefing: 'The return corridor is narrow: too steep causes extreme heating and deceleration; too shallow risks skipping
    back into space. The player must integrate drag, energy conversion, and atmospheric density.'
  stake: >-
    Eighty-two hours in, and nothing goes wrong this shift, which is its own kind of unnerving. The capsule
    will arrive at about eleven kilometres a second into a corridor roughly a degree wide, and Erika Lindqvist, integrating the flight dynamics, wants the whole room to understand what that means before anybody is asked to vote on it. This shift you
    follow where the energy goes, put a number on it, and decide how to protect the corridor. Entry is a
    controlled disposal of energy: the only way to lose it is to hand it to the air as heat. Too shallow and
    the atmosphere does not take enough, and the capsule skips back out with no consumables to come round
    again. Too steep and it takes it all in seconds, faster than the shield or the people inside can
    survive. The same physics keeps them alive and would kill them.
  takeaway: Use kinetic energy, drag, work-energy, heating, deceleration as an evidence chain rather than as isolated facts.
  stops:
  - group: INTEG
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly
      placed cards after each check.
    title: Where orbital energy goes
    place: Entry Dynamics Room
    scene: >-
      The capsule arrives at the atmosphere with the kinetic energy of a
      hundred-tonne truck at orbital speed. It has to reach the ocean carrying
      almost none of it.
    takeaway: Reentry is an energy-dissipation problem constrained by human and material limits.
    format: SEQUENCE
    rebuttals:
    - The vehicle arrives with the energy. Everything that follows is that energy leaving.
    - Drag does negative work — it is the mechanism that removes the energy, and it acts along the whole path.
    - The energy becomes heat in the shocked gas and the wake. A blunt shield is shaped to put it there rather than into the vehicle.
    - Falling velocity and altitude are the result. How fast they fall is what the shield and the trajectory shape are for.
    assumes:
    - energy is not destroyed, it is moved somewhere else
    cards:
    - The spacecraft enters with large kinetic and gravitational energy.
    - Atmospheric drag performs negative work on the spacecraft.
    - Energy becomes heat in shocked gas, the vehicle, and the wake.
    - Velocity and altitude fall while thermal protection and trajectory shape control the rates.
    order:
    - 0
    - 1
    - 2
    - 3
    why: >-
      Reentry is an energy problem before it is a heat problem, and the chain
      says where the energy goes. The vehicle arrives with large kinetic and
      gravitational energy. Drag does negative work on it, taking that energy
      out. The energy does not vanish: it becomes heat in the shocked gas ahead
      of the shield and in the wake behind it, which is why most of it never
      enters the vehicle at all. Velocity and altitude then fall, at a rate the
      shield and the trajectory shape between them control.
  - group: THERM
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.

      Two things have to be true at once: enough sorbent surface to take the
      carbon dioxide chemically, and a sealed path that forces cabin air through
      it rather than around it. Bypass is the failure mode that looks like
      success. The fan runs, the crew hears it, and the concentration keeps
      climbing — because sorbent only removes carbon dioxide from air that
      actually crosses it. A large sorbent bed with a gap around it removes less
      than a small one with no gap.

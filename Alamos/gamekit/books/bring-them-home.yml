    - An audible fan proves a motor is turning. It says nothing about how much air is moving, or where.
- title: Communication Fades
  objective: Restore a reliable low-bandwidth link and use the signal itself as a navigation measurement.
  briefing: The spacecraft signal weakens and shifts in frequency as geometry changes. The team must separate transmitter
    failure from antenna pointing, range loss, and Doppler effects.
  stake: >-
    Sixty-six hours in, the link went weak at the moment the vehicle turned — down twelve decibels, and Hale
    is answering calls he can barely hear. The communications lead, Naomi Ito, has the link budget open and her network officer is arguing for a
    different term in it. This shift you find the cause and get the link back. A radio link is a sum:
    transmitter power, antenna gain, distance, pointing, receiver sensitivity, all in decibels, and any
    single term can account for the loss if it is large enough. That is what makes size worth checking
    before story. Distance changes slowly and costs little. A narrow beam a few degrees off costs a great
    deal. And losing this costs two things at once, because the signal is also a navigation measurement —
    the room goes deaf and half blind in the same minute, with a burn still to fly.
  takeaway: Use waves, frequency, wavelength, inverse-square behavior, Doppler effect as an evidence chain rather than as
    isolated facts.
  stops:
  - group: COMMS
    task: Which explanation fits the link budget and the independent stations?
    title: Why did the signal fade?
    place: Deep-Space Antenna
    scene: >-
      Voice and telemetry both go weak at once. Received power is down about 12
      decibels, and the crew is answering calls they can barely hear.
    takeaway: A link-budget diagnosis should compare the size of every proposed effect with the size of the observed loss.
    format: DIAGNOSIS
    rebuttals:
    - A transmitter fault would show as reduced output, and the spacecraft reports normal power. The loss is happening between the antenna and the ground.
    - The range change accounts for about one decibel of the twelve. It is real and it is nowhere near large enough.
    - A faulty ground receiver would affect one station. Two stations on different continents see the same fade.
    assumes:
    - a directional antenna is much weaker off to the side
    headline: Voice and telemetry suddenly become weak.
    readings:
    - zone: Received power
      label: Received power
      value: Down about 12 dB
      status: alarm
      note: Large link loss
    - zone: Transmitter output
      label: Transmitter output
      value: Normal
      status: normal
      note: Spacecraft radio power is unchanged
    - zone: Range change
      label: Range change
      value: Would explain about 1 dB
      status: alarm
      note: Distance alone is too small an effect
    - zone: Antenna pointing error
      label: Antenna pointing error
      value: About 6 degrees
      status: alarm
      note: Large compared with the narrow beam
    - zone: Second ground station
      label: Second ground station
      value: Also sees weak signal
      status: alarm
      note: Not a single receiver problem
    choices:
    - label: Antenna mispointing
      mechanism: The directional beam is no longer centered on Earth, reducing received power at multiple stations.
    - label: Transmitter power loss
      mechanism: The spacecraft radio is emitting far less power than commanded.
    - label: Increased distance
      mechanism: Free-space spreading from the new range accounts for nearly all of the loss.
    - label: One bad ground receiver
      mechanism: A local receiver fault weakens the signal at only one station.
    answer: Antenna mispointing
    why: >-
      A link budget is a sum of gains and losses, so diagnosis means comparing
      the size of each proposed cause against the size of the loss actually
      seen. Twelve decibels is a factor of about sixteen in power, and the range
      change accounts for roughly one of them — far too small. The transmitter
      reports normal output. A second station on another continent sees the same
      fade, which rules out anything local to one dish. The antenna is six
      degrees off-point, and on a narrow beam that is enough.

# Claude-ready mission book. Follows BOOK_TEMPLATE.md conventions.
# Exactly 15 missions, 3 stops per mission. Formats use exact importer names.
# Diagnosis is a first-class format: the full evidence panel is visible and quiet readings matter.
theme:
  id: bring_them_home
  title: Bring Them Home
  subtitle: "Flight Director \xB7 Lunar Return Mission"
groups:
- id: NAV
  code: NAV
  name: Guidance & Motion
  color: '#315c78'
  desc: Kinematics, forces, gravity, trajectories, and navigation evidence.
  defaultLeader: reyes
  milestones:
  - Reconstruct the state
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: ELEC
  code: ELEC
  name: Power & Circuits
  color: '#9a741d'
  desc: Voltage, current, resistance, batteries, generation, and electrical faults.
  defaultLeader: shah
  milestones:
  - Close the power budget
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: THERM
  code: THERM
  name: Thermal & Life Support
  color: '#4b775f'
  desc: Heat transfer, gas behavior, pressure, flow, and life-support transport.
  defaultLeader: brooks
  milestones:
  - Keep the cabin stable
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: COMMS
  code: COMMS
  name: Waves & Communications
  color: '#704f88'
  desc: Radio waves, link budgets, pointing, optics, and signal timing.
  defaultLeader: ito
  milestones:
  - Recover the link
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: STRUCT
  code: STRUCT
  name: Rotation & Structures
  color: '#9a3f36'
  desc: Torque, angular motion, oscillations, resonance, and structural response.
  defaultLeader: mensah
  milestones:
  - Control motion and vibration
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: INTEG
  code: INTEG
  name: Mission Integration
  color: '#3d6f52'
  desc: Uncertainty, competing constraints, robust decisions, and final readiness.
  defaultLeader: carter
  milestones:
  - Integrate the evidence
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
roster:
- id: reyes
  name: Dr. Camila Reyes
  role: Guidance Lead
  division: NAV
  bio: Uses independent tracking and dynamics to decide whether an apparent trajectory change is physical or a measurement
    artifact.
- id: shah
  name: Priya Shah
  role: Power Systems Lead
  division: ELEC
  bio: Reads voltage, current, power, and heat as one energy system rather than isolated meters.
- id: brooks
  name: Dr. Aaron Brooks
  role: Thermal and Life Support Lead
  division: THERM
  bio: Tracks heat and gas through the cabin and asks whether powered hardware is actually transporting what it should.
- id: ito
  name: Naomi Ito
  role: Communications Lead
  division: COMMS
  bio: Turns wave physics, antenna pointing, range, and receiver measurements into a quantitative link diagnosis.
- id: mensah
  name: Kwame Mensah
  role: Dynamics and Structures Lead
  division: STRUCT
  bio: Connects torque, forcing frequency, natural modes, and measured motion to spacecraft behavior.
- id: carter
  name: Dr. Evelyn Carter
  role: Mission Integration Lead
  division: INTEG
  bio: Challenges common-mode assumptions and makes the final decision only after independent evidence agrees.
- id: whitaker
  name: Dale Whitaker
  role: Trajectory Officer
  division: NAV
  bio: |
    Fits trajectories to whatever tracking exists, which on a bad shift is three
    numbers taken hours apart. A fit that matches the data he has is easy; a fit
    that predicts the next observation is the only kind he will sign.

    He treats residuals as the real output. A pattern in what the model got
    wrong points at an unmodelled force or a clock error, and both of those have
    hidden themselves inside a good-looking fit before.
  quiz:
    - q: Why does Whitaker judge a trajectory fit by its residuals rather than by how closely it matches the tracking?
      a: Structure in the errors reveals an unmodelled force or a clock problem that a close fit can hide
      wrong:
        - Residuals are the only quantity the tracking stations report
        - A fit with small residuals always has small uncertainty
        - Residuals convert range measurements into velocity
- id: ferreira
  name: Ana Ferreira
  role: Electrical Load Officer
  division: ELEC
  bio: |
    Keeps the power budget, which during this flight means keeping a list of
    everything aboard that consumes energy and what happens the hour after it is
    switched off.

    Her rule is that no load is switched off in isolation. A heater turned off to
    save amp-hours becomes a thermal problem that costs more amp-hours to
    reverse, and the ledger has to be kept across systems rather than within one.
  quiz:
    - q: Why does Ferreira refuse to evaluate a load in isolation?
      a: Switching one off moves the cost into another system, often at a higher price later
      wrong:
        - Every load aboard draws the same current
        - Loads can only be measured while the fuel cells are running
        - A load's cost is fixed by its rating rather than by its use
- id: novak
  name: Petra Novak
  role: Life Support Engineer
  division: THERM
  bio: |
    Works the three things a sealed cabin runs out of — heat, breathable gas and
    water — and the ways they interfere with each other. Cooling the cabin
    condenses water onto the coldest surfaces, and the coldest surfaces are
    usually the electronics.

    She measures in more than one place on principle. A single cabin sensor
    reports the air beside itself, and a compartment with poor circulation can be
    perfectly comfortable at the sensor and dangerous two metres away.
  quiz:
    - q: Why does Novak insist on carbon dioxide readings from several cabin locations?
      a: With poor circulation the gas is not uniform, so one sensor reports only the air beside it
      wrong:
        - Sensors drift too quickly to be trusted individually
        - The crew cannot reach the primary sensor during a powerdown
        - Multiple readings are averaged to remove instrument noise
- id: haldane
  name: Marcus Haldane
  role: Link Analyst
  division: COMMS
  bio: |
    Accounts for every decibel between the spacecraft transmitter and the ground
    receiver. A fade is never mysterious to him; it is one term in a budget that
    changed, and the work is finding which.

    Range, antenna pointing, receiver bandwidth and transmitter health all reduce
    the same received power, and they are told apart by what else changed at the
    same moment rather than by the signal level itself.
  quiz:
    - q: How does Haldane separate a pointing problem from a transmitter failure?
      a: By what changed alongside the signal — attitude, range and schedule each leave their own trace
      wrong:
        - A transmitter failure always removes the carrier completely
        - Pointing errors change the frequency and failures do not
        - The received power alone identifies the cause
- id: okoye
  name: Chidi Okoye
  role: Structural Dynamics Engineer
  division: STRUCT
  bio: |
    Studies how a spacecraft responds to being pushed at particular rates. A
    structure has frequencies at which a small repeated force produces a large
    motion, and hardware that is perfectly strong at rest can fail there.

    He never accepts a single accelerometer as a description of a mode. One
    sensor sits at one point, and a point that happens to sit at a node reads
    almost nothing while the panel beside it moves.
  quiz:
    - q: Why will Okoye not characterise a vibration mode from one accelerometer?
      a: A sensor at a node of the mode reads almost nothing while the structure moves nearby
      wrong:
        - Accelerometers cannot measure below one hertz
        - A single sensor cannot record frequency, only amplitude
        - One sensor is enough only if the pump speed is constant
- id: lindqvist
  name: Erika Lindqvist
  role: Flight Dynamics Integrator
  division: INTEG
  bio: |
    Sits between the back rooms and the loop, and her job is the one nobody else
    has: deciding which of six correct answers the flight director hears first.

    She keeps the anomaly log, because in a fast failure the expensive mistake is
    not a wrong number but two rooms acting on different versions of the same
    number an hour apart.
  quiz:
    - q: What does Lindqvist treat as the main risk during a fast-moving failure?
      a: Two rooms acting on different versions of the same number
      wrong:
        - A back room refusing to give an estimate at all
        - The crew asking questions over the loop
        - Telemetry arriving faster than it can be plotted
glossary:
- name: State vector
  aliases:
  - state vector
  def: A compact description of position and velocity at one time.
- name: Common-mode error
  aliases:
  - common-mode error
  def: A shared error that makes several measurements agree for the same wrong reason.
- name: Torque
  aliases:
  - torque
  def: The rotational effect of a force applied with a lever arm.
- name: Resonance
  aliases:
  - resonance
  def: Large oscillation produced when forcing is near a system natural frequency.
- name: Power
  aliases:
  - power
  def: The rate at which energy is transferred or used.
- name: Doppler shift
  aliases:
  - doppler shift
  def: A frequency change caused by relative motion between source and observer.
missions:
- title: The Failure
  objective: Create a trusted state vector and a prioritized anomaly list before commanding the crew.
  briefing: A crewed lunar spacecraft reports an explosion, falling electrical power, and contradictory telemetry. The player
    takes the flight-director console and must first determine what can still be measured reliably.
  stake: >-
    The bang was four minutes ago. Commander Hale reported it before any instrument did, which is the first
    thing that should worry you. Now three consoles hold numbers that contradict each other: one bus reads
    zero, the guidance computer has restarted with nothing loaded, and several cabin-pressure channels
    dropped together inside the same second. The integration lead, Evelyn Carter, is already saying that channels dropping together are
    one fault and not three. This shift you decide what is happening to the vehicle, get one agreed picture
    of it, and set how this room will work for the next five days. Before anything is fixed you need a state
    estimate: what the spacecraft is doing, told apart from what the instruments say it is doing. Those are
    not the same, and instruments sharing a box can be wrong together in a way that looks like agreement.
    Hale, Ruiz and Sato can hear every word of this.
  takeaway: Use units, vectors, graphs, measurement uncertainty, common-mode failure as an evidence chain rather than as isolated
    facts.
  stops:
  - group: INTEG
    task: Which explanation fits the digital alarms, independent physical checks, and shared electronics?
    title: 'What failed: the spacecraft or the sensors?'
    place: Mission Control
    scene: >-
      Nine minutes after the bang, several digital cabin-pressure channels drop
      together inside the same second. Before the crew spends oxygen and time
      hunting a leak, the panel has to be read as one system.
    takeaway: Three readouts are not three independent measurements when they share the same electronics.
    format: DIAGNOSIS
    rebuttals:
    - Escaping gas would move the mechanical gauge too, because that gauge needs no electronics at all. It is steady.
    - One failed sensor moves one channel. Three channels dropping in the same second is a shared cause, not a coincidence.
    - Corrupted telemetry would show as bad packets, and the radio link is clean. The numbers are arriving intact and saying something wrong.
    assumes:
    - a gauge can fail without the thing it measures changing
    headline: Mission Control receives a sudden cabin-pressure warning on several digital channels.
    readings:
    - zone: Digital pressure channels
      label: Digital pressure channels
      value: All drop at the same second
      status: alarm
      note: Three channels share one reference circuit
    - zone: Crew mechanical gauge
      label: Crew mechanical gauge
      value: Steady
      status: normal
      note: Independent local indication
    - zone: Acoustic leak monitor
      label: Acoustic leak monitor
      value: Quiet
      status: normal
      note: No leak-like sound signature
    - zone: Sensor reference voltage
      label: Sensor reference voltage
      value: Shifted low
      status: alarm
      note: Shared input to the digital channels
    - zone: Radio link quality
      label: Radio link quality
      value: Normal
      status: normal
      note: Telemetry packets are arriving cleanly
    choices:
    - label: Real cabin leak
      mechanism: Cabin gas is escaping, so independent pressure evidence should also move.
    - label: Common reference failure
      mechanism: A shared electrical reference biases several digital sensors in the same direction.
    - label: One bad pressure sensor
      mechanism: A single sensor has failed while the others remain independent and correct.
    - label: Communications corruption
      mechanism: The radio link is scrambling otherwise valid spacecraft data.
    answer: Common reference failure
    why: >-
      Three readouts are not three independent measurements when they share a
      reference circuit. A shift in that one voltage moves all of them at once,
      in the same direction, in the same second — which is what the panel shows
      and what a real leak does not do. The evidence that owes nothing to those
      electronics agrees: the mechanical gauge is plumbed straight to the cabin
      and is steady, and the acoustic monitor hears nothing. The reference
      voltage itself has shifted low, which names the fault.
  - group: INTEG
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly
      placed cards after each check.
    title: Build the first state estimate
    place: Telemetry Analysis Room
    scene: >-
      Three consoles hold contradictory numbers. One bus reads zero, the
      guidance platform has restarted with no record of what it saw, and nothing
      has been written down in an order anyone can reconstruct.
    takeaway: A good emergency command works across uncertainty rather than assuming it away.
    format: SEQUENCE
    rebuttals:
    - Preserve the telemetry first. It is the only step with a deadline set by something other than the crew — the buffers overwrite whether or not anybody is ready.
    - Check units, timestamps and shared dependencies second. This is where a common-mode failure becomes visible instead of being fitted.
    - Build the estimates third, with uncertainties attached. A state without an uncertainty cannot be argued with or tested.
    - Command last, and only where the benefit survives the whole range of states still consistent with the data.
    assumes:
    - a number without its units and its time is not a measurement
    cards:
    - Freeze and preserve the pre- and post-failure telemetry.
    - Verify units, timestamps, calibration states, and shared dependencies.
    - Construct position, velocity, attitude, power, pressure, and temperature estimates with uncertainties.
    - Issue only commands whose benefits remain robust across the plausible states.
    order:
    - 0
    - 1
    - 2
    - 3
    why: >-
      A state estimate is only worth having if it survives being wrong, and the
      order is what makes that possible. Telemetry across the failure is
      overwritten within minutes, so it is frozen before anything is computed
      from it. Units, timestamps and calibration come next, because a fit across
      mixed clocks produces a confident answer that is wrong. Estimates then
      carry uncertainties rather than single values. And the commands that
      follow are the ones whose benefit holds across every state the data still
      allows.
  - group: INTEG
    task: Ten minutes to the next tracking pass. What does the flight director do first?
    title: Spend the first ten minutes
    place: Spacecraft Systems Console
    scene: >-
      Four controllers, a crew flying a vehicle that is venting something, and
      ten minutes to the next tracking pass. Every subsystem wants the loop, and
      each believes its own problem is the one that kills the crew.
    takeaway: Attention is a scarce physical resource during a fast-moving systems failure.
    format: CHOICE
    assumes:
    - two rooms acting on different versions of one number is worse than either acting alone
    question: Ten minutes to the next tracking pass. What does the flight director do first?
    choices:
    - Establish a single anomaly log and one command authority.
    - Reconstruct the electrical and pressure timeline.
    - Verify the trajectory and attitude independently.
    - Ask every subsystem for a complete report at once.
    answer: Establish a single anomaly log and one command authority.
    why: >-
      Attention is a physical resource in an emergency, the same way propellant
      is, and the first decision is what spends it. Four controllers are already
      working one failure from four sets of numbers. Until there is a single
      record and a single command authority, every analysis that follows can be
      done twice and contradicted once — and the crew executes whichever version
      reaches them first. Organising the room is not a delay before the work. It
      is what makes the work count once.
    rebuttals:
    - The electrical and pressure timeline is the first real analysis, and it is exactly what the log exists to hold. Start it second and it survives the shift change.
    - Independent trajectory verification decides whether the vehicle can come home. It is needed before the burn, not before the room is organised.
    - Six complete subsystem reports arrive after the tracking pass and consume the ten minutes that were supposed to prepare for it.
- title: Find the Spacecraft
  objective: Produce a consistent trajectory estimate and identify which new observation most reduces uncertainty.
  briefing: Tracking data are intermittent, and the onboard computer has restarted. The team must reconstruct position and
    velocity from range, bearing, and timed observations.
  stake: >-
    Nine hours after the bang, and the station carrying the whole solution sets in forty minutes. The guidance lead, Camila Reyes, will not sign the trajectory until she has one measurement that did not come through the same computer. Today
    you rebuild where the spacecraft is and how fast it is going, and buy the next observation. Different
    measurements answer different questions. A radar echo gives distance, because the pulse takes a known
    time to go out and come back. A shift in the returning frequency gives speed toward or away. Angles give
    direction, and badly. Fitting them together is the job, and the signal's own travel time is one of your
    instruments. Her trajectory officer, Dale Whitaker, wants a number now so the room can start planning the correction. Reyes wants the
    right number. They are both right, and there are forty minutes.
  takeaway: Use position, velocity, acceleration, coordinate systems, graphs of motion as an evidence chain rather than as
    isolated facts.
  stops:
  - group: NAV
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: Which measurement constrains what?
    place: Deep-Space Tracking Station
    scene: >-
      The onboard computer has restarted and the tracking is intermittent, so
      the state has to be rebuilt from whatever measurements can still be taken.
      The room has to say what each type buys before it schedules any of them.
    takeaway: Navigation is a reconstruction from partial projections.
    format: PROTOCOL
    rebuttals:
    - Travel time is a distance along the line of sight. It is measured rather than fitted, and it carries no direction information at all.
    - Doppler shift is a rate of change of that distance — line-of-sight velocity, and only the line-of-sight part.
    - An angle against fixed stars says which way, not how far. Two objects on the same bearing at different ranges give the same reading.
    - Positions repeated at known times give velocity by differencing, and the trend in that velocity is acceleration.
    assumes:
    - describing where something is and how it is moving takes six numbers
    scenarios:
    - Two-way signal travel time.
    - Doppler frequency shift.
    - Angular position against background stars.
    - Repeated positions at known times.
    choices:
    - Range along the line of sight.
    - Line-of-sight velocity.
    - Direction on the sky.
    - Velocity and acceleration trends.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: >-
      Navigation is reconstruction from partial projections: no single
      measurement type gives the full state, and each one leaves a different
      part of it free. Two-way travel time fixes how far away the spacecraft is
      and says nothing about direction. Doppler shift measures how fast that
      distance is changing, which is one component of velocity and not the
      others. An angle against background stars fixes direction and leaves
      distance free. Repeated positions at known times give velocity by
      differencing, and differencing again gives acceleration.
  - group: NAV
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly
      placed cards after each check.
    title: Reconstruct the state vector
    place: Guidance Room
    scene: >-
      The computer restarted and lost its alignment. What is left is a range
      from one station, two bearing angles taken ninety minutes apart, and a
      Doppler trace recorded in a different time standard from either.
    takeaway: A useful state estimate predicts future observations and exposes its own failures.
    format: SEQUENCE
    rebuttals:
    - One coordinate system and one time standard first. Two clocks in a single fit is the error that never shows up in the residuals afterwards.
    - Fit range, angle and Doppler together second. Fitting them separately gives three answers and no way to choose.
    - Read the residuals third, for structure rather than size. Scatter is noise; a pattern is a force nobody modelled.
    - Propagate state and uncertainty to the decision time last. The burn happens later than the data, and the uncertainty grows on the way.
    assumes:
    - measurements only combine when they share a frame and a clock
    cards:
    - Transform all observations into one coordinate and time system.
    - Fit a trajectory that predicts range, angle, and Doppler together.
    - Examine residuals for bias or unmodeled acceleration.
    - Propagate the state and its uncertainty forward to the hour the burn is committed.
    order:
    - 0
    - 1
    - 2
    - 3
    why: >-
      A state estimate is only useful if it predicts the next observation, and
      everything in this order exists to make that test possible. A joint fit
      across two time standards produces an orbit nobody can see is wrong, so
      the transformation comes first. The fit then has to reproduce range, angle
      and Doppler together rather than each in turn. What the fit got wrong is
      where the information is: structure in the residuals means an unmodelled
      force. And state and uncertainty are propagated together, because the
      decision is made at a later time than the data.
  - group: NAV
    task: Why does the spacecraft need any speed at all to stay in that orbit?
    title: What holds it in the curve
    place: Guidance Computer Room
    scene: >-
      The free-return path swings the spacecraft round the Moon at 2,500 kilometres
      altitude. Somebody on the loop has asked why it does not simply fall onto the
      surface, and the room owes them an answer.
    takeaway: A curved path needs a force toward the centre, and orbital motion is that force being exactly enough.
    format: CHOICE
    assumes:
    - an object moving in a circle is accelerating even at constant speed
    question: Why does the spacecraft need any speed at all to stay in that orbit?
    choices:
    - It is falling, and its sideways speed is what makes the fall a curve that misses.
    - Gravity is balanced by an outward centrifugal force, so nothing accelerates.
    - At that altitude the Moon's gravity is too weak to matter.
    - The spacecraft's own thrust holds it up against gravity.
    answer: It is falling, and its sideways speed is what makes the fall a curve that misses.
    why: >-
      Circular motion is acceleration toward the centre, and here the whole of that
      acceleration is gravity: the spacecraft is falling the entire time, and its
      transverse speed turns the fall into a curve that keeps missing the surface.
      Get the speed wrong and the curve closes on the Moon or opens away from it.
      There is no outward force to balance — in the spacecraft's frame the crew feel
      weightless precisely because nothing is opposing gravity.
    rebuttals:
    - Centrifugal force is an artefact of the rotating frame; in the inertial frame there is one force and it points inward.
    - Lunar gravity at that altitude is about a fifth of what it is at the surface, which is not negligible at all.
    - The engine is off, and it stays off for most of the return.
- title: The Wrong Trajectory
  objective: Choose a correction that restores a safe return while preserving fuel and engine options.
  briefing: The spacecraft is drifting away from its planned free-return path. The player must use Newtonian gravity and impulse
    to determine whether a small correction now can prevent a large correction later.
  stake: >-
    Eighteen hours in, the drift is confirmed, and this is where Whitaker and Carter stop agreeing for the
    rest of the mission. The path misses the entry corridor by four hundred kilometres. Whitaker wants a
    modest burn this shift, arguing that a correction gets cheaper the earlier it is made. Carter wants to
    wait for the next tracking pass, because correcting a number you have not measured properly is how a
    small error becomes a committed one. This shift you settle it. A burn is a force applied for a time; it
    changes velocity, and velocity is what a trajectory is made of, so an early push is worth an enormous
    one later. That is Whitaker's whole case, and this shift it is the better one. There is no more
    propellant coming.
  takeaway: "Use Newton\u2019s laws, gravity, orbits, impulse, trajectory sensitivity as an evidence chain rather than as\
    \ isolated facts."
  stops:
  - group: INTEG
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly
      placed cards after each check.
    title: From force to trajectory change
    place: Orbital Analysis Room
    scene: >-
      The spacecraft is drifting off the free-return path by an amount that is
      small today and fatal at the atmosphere. The crew wants to know why a few
      seconds of thrust now beats minutes of thrust tomorrow.
    takeaway: Trajectory control acts on velocity now to change position much later.
    format: SEQUENCE
    rebuttals:
    - Force for a measured time is where the chain starts. Everything after it is a consequence of that one product.
    - Force divided by mass is acceleration. The same engine on a heavier vehicle produces less of it.
    - Acceleration integrated over the burn is the velocity change, and it is proportional to the impulse rather than to the thrust alone.
    - The new velocity changes position hours later. That delay is not a weakness of the method — it is what makes a small early burn worth a large late one.
    assumes:
    - a force acting on a mass produces an acceleration
    cards:
    - An engine produces a force for a measured time.
    - The force gives the spacecraft an acceleration.
    - Acceleration changes velocity by an impulse-dependent amount.
    - The new velocity changes the later orbit and encounter geometry.
    order:
    - 0
    - 1
    - 2
    - 3
    why: >-
      The chain is Newtonian and worth stating in order, because it is the
      reason an early correction is cheap. An engine produces a force for a
      measured time. That force gives the vehicle an acceleration set by its
      mass, so the same engine moves a heavy spacecraft less. The acceleration
      changes velocity by an amount proportional to the impulse. And the new
      velocity changes where the vehicle is hours later — trajectory control
      acts on velocity now to move position much later, which is why time is the
      term doing the work.
  - group: NAV
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
    title: Small burn, large consequence
    place: Guidance Console
    scene: >-
      A 30,000 kg spacecraft takes 6,000 N of thrust for 20 seconds. The flight
      dynamics officer wants the change in speed on the loop before the burn is
      approved.
    takeaway: Orbital corrections often rely on small velocity changes applied early.
    format: BALLPARK
    assumes:
    - force applied over a time is an impulse
    why: >-
      Force multiplied by time is impulse, and impulse divided by mass is the
      change in speed. The number that comes out looks absurd next to an orbital
      speed measured in kilometres per second, and that is the lesson rather
      than a problem with the arithmetic. A few metres per second applied days
      from arrival moves the arrival point by hundreds of kilometres, because
      the vehicle carries the difference for every one of those hours. The same
      correction made near the atmosphere costs many times as much.
    question: Estimate the change in speed.
    estimate:
      relationship: >-
        Impulse = force × time. Velocity change = impulse ÷ mass.
      prompt: A 30,000 kg spacecraft receives 6,000 N of thrust for 20 seconds.
      question: Estimate the change in speed.
      labels:
      - 6,000 N (thrust)
      - 20 s (burn duration)
      - 30,000 kg (vehicle mass)
      - 9.81 m/s² (surface gravity)
      - 1,500 s (specific impulse)
      values:
      - 6000
      - 20
      - 30000
      - 9.81
      - 1500
      slots: 3
      template: '{0} × {1} ÷ {2}'
      formula: a*b/c
      correct:
      - 0
      - 1
      - 2
      target: 4
      tolerance: 0.3
      units: m/s
      solution: Δv = Ft/m = 4 m/s.
      explanation: Force times time is impulse; impulse divided by mass is the velocity change. Surface gravity has no bearing on a vehicle in free flight, and specific impulse would tell you what the burn costs in propellant rather than what it achieves.
  - group: THERM
    task: The tank reads 40 psi and the regulator wants 15. What is the flow doing?
    title: What the pressure difference is for
    place: Life Support Lab
    scene: >-
      The oxygen tank reads 40 psi, the cabin regulator is set to 15, and the flow
      has fallen to half of what the plan assumed. The line is the same line it was
      yesterday.
    takeaway: Flow is driven by a pressure difference and limited by the restriction in the path.
    format: CHOICE
    assumes:
    - gas flows from higher pressure to lower pressure
    question: The tank reads 40 psi and the regulator wants 15. What is the flow doing?
    choices:
    - Flowing on the difference, and the fall means either the difference or the path has changed.
    - Stopped, because the regulator setting is below the tank pressure.
    - Set by the tank pressure alone, so 40 psi guarantees the planned flow.
    - Reversed, since the cabin is warmer than the tank.
    answer: Flowing on the difference, and the fall means either the difference or the path has changed.
    why: >-
      Gas moves because there is a pressure difference across the path, and how much
      moves depends on that difference and on how restricted the path is. Twenty-five
      psi of difference is still there, so a halved flow points at the path — a
      partly closed valve, ice at an orifice, a filter loading up — or at a reading
      that is not measuring what the crew think it is. Tank pressure on its own
      cannot promise a flow rate: the same 40 psi delivers nothing through a blocked
      line.
    rebuttals:
    - A regulator set below tank pressure is the condition for flow, not an obstacle to it.
    - Tank pressure sets one end of the difference; the restriction in between sets the rate.
    - Temperature changes gas density and pressure a little; it does not reverse a 25 psi gradient.
- title: Turn Without Wasting Fuel
  objective: Develop a controlled reorientation procedure that stops the rotation at the required attitude.
  briefing: The main guidance platform is unavailable, and the crew must reorient the spacecraft using limited thrusters and
    visible reference objects.
  stake: >-
    Twenty-six hours in. The guidance platform is off to save power, one thruster quad is dead, and Hale has
    to turn the spacecraft ninety degrees by hand while Sato reads angles aloud. Kwame Mensah, who owns the structural dynamics, has done the sums and does not like them. This shift you agree what the rotation numbers mean, write the procedure, and
    work out what a thruster actually does. Turning follows the same bookkeeping as moving in a line, with
    rotation in place of speed. A thruster firing off to one side produces a twisting force, and how much
    twist depends on how far it sits from the balance point. Starting a rotation is only half of it. Nothing
    stops out here on its own — an equal twist has to be applied the other way, so every degree is paid for
    twice. Let it tumble and the antenna, the array and the burn attitude go together.
  takeaway: Use torque, angular acceleration, moment of inertia, angular momentum, center of mass as an evidence chain rather
    than as isolated facts.
  stops:
  - group: STRUCT
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: Read rotational motion
    place: Attitude Dynamics Lab
    scene: >-
      The main guidance platform is unavailable and the crew is about to fly the
      vehicle by hand. Before anybody touches a thruster the room states the
      rotational mechanics plainly, because each one has a consequence the crew
      will feel.
    takeaway: Attitude control is Newtonian mechanics around a center of mass.
    format: PROTOCOL
    rebuttals:
    - The same force farther from the centre of mass is a longer lever arm and therefore a larger torque. This is the term the crew can actually choose.
    - The same torque on a larger moment of inertia gives less angular acceleration. Harder to start, and equally hard to stop.
    - Equal and opposite torques for equal times cancel the net angular impulse, which is what a start pulse and a stop pulse are for.
    - Moving internal mass with no external torque redistributes the rotation and conserves the total. Nothing inside the vehicle can change it.
    assumes:
    - a torque is what makes something start or stop turning
    scenarios:
    - Apply the same force farther from the center of mass.
    - Increase moment of inertia with the same torque.
    - Apply equal and opposite torques for equal times.
    - Move internal masses while no external torque acts.
    choices:
    - Larger torque.
    - Smaller angular acceleration.
    - Approximately cancel the net angular impulse.
    - Total angular momentum remains conserved, though rotation distribution can change.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: >-
      Attitude control is Newtonian mechanics about a centre of mass, and four
      rules cover what the crew can do. Torque is force times lever arm, so the
      same thruster mounted farther out turns the vehicle harder. Angular
      acceleration is torque divided by moment of inertia, so a vehicle that is
      harder to turn responds less to the same push. Equal and opposite torques
      for equal times leave the angular momentum where it started. And with no
      external torque, moving mass inside the vehicle changes its shape and its
      spin rate but never its total angular momentum.

      pool:
        amount: 41
        unit: Ah
      items:
      - id: life
        label: Life support and circulation
        rate: 0.4
        unit: A
        cost: 24.8
        hours: 62
      - id: thermal
        label: Thermal survival loads
        rate: 1.1
        unit: A
        cost: 6.6
        hours: 6
      - id: guidance
        label: Guidance and navigation windows
        rate: 1.8
        unit: A
        cost: 7.2
        hours: 4
      - id: comms
        label: High-bandwidth communications
        rate: 0.9
        unit: A
        cost: 55.8
        hours: 62
      answers:
      - required: true
        requires:
        - life
        - thermal
        question: Keep crew and critical batteries within survival limits
      - required: true
        requires:
        - guidance
        question: Power the planned navigation and burn windows
      - required: false
        requires:
        - comms
        question: Maintain continuous high-bandwidth communications
    answerText: The required loads use 38.6 Ah, leaving 2.4 Ah.
    why: Amp-hours are current multiplied by time. Continuous life support costs 0.4 A × 62
      h = 24.8 Ah. Six hours of thermal protection at 1.1 A costs 6.6 Ah, and four guidance
      hours at 1.8 A cost 7.2 Ah. Those required loads total 38.6 Ah, leaving 2.4 Ah. At 0.9
      A, that buys only about 2.7 hours of high-bandwidth communications. The right plan is

- title: Crossing the Atmosphere
  objective: Choose a corridor and monitoring strategy robust to atmospheric and navigation
    uncertainty.
  briefing: The ship is nearing a narrow entry path. Choose a target that stays safe when
    the air and tracking are uncertain.
  stake: Shift 11. The capsule will strike the air near 11 kilometres per second. Too shallow
    may send it back toward space, while too steep may crush or burn the crew. You must turn
    a range of possible paths into one safe entry call.
  takeaway: Use kinetic energy, drag, work-energy, heating, deceleration as an evidence chain
    rather than as isolated facts.
  stops:
  - group: INTEG
    task: Put the four cards in order. Start with the step that must happen first.
    title: Where orbital energy goes
    place: Entry Dynamics Room
    scene: The capsule reaches the air with huge kinetic energy. It must lose nearly all of
      it before splashdown. Trace where that energy goes.
    guide: These four are one chain, and reentry is an energy problem before it is a temperature
      problem. Ask of each card what has to be true first. There is no atmospheric braking
      before there is atmosphere. Energy cannot become heat until it has left the vehicle's
      motion. The last card is where the shield and the trajectory decide the rates rather
      than the total.
    background:
    - 'Why the order is graded whole. A sequence is a claim about dependency: each step is
      here because the one before it has already happened, or has to have. One transposed
      pair falsifies that claim wherever it sits, so partial credit would be credit for a
      sequence that does not work.'
    - Why the ends are the place to start. The first and last cards have nothing before or
      after them. That constraint usually makes them the two you can settle from the scene
      alone. Pinning them collapses the remaining arrangements sharply, and what is left in
      the middle is where the actual judgement lives.
    - What the rail can be ordered on. Time is the usual axis, but it is not the only one.
      An order can run on cost, on risk, or on reversibility — every observation that leaves
      the sample as it was, before any that consumes it. On those boards a chronological reading
      finds nothing, because none of the steps has to happen at a particular hour.
    takesAsRead:
    - Newton's laws and free-body reasoning
    assumes:
    - energy is not destroyed, it is moved somewhere else
    takeaway: Reentry is an energy-dissipation problem constrained by human and material limits.
    format: SEQUENCE
    why: Reentry is primarily an energy-transfer problem. At atmospheric interface the vehicle's
      mechanical energy is dominated by its enormous kinetic energy. Aerodynamic forces do
      negative work on the spacecraft, transferring mechanical energy into internal energy
      of the shocked gas, the wake, the heat shield, and the structure. The heat shield does
      not make that energy disappear. Its shape and materials control where the heating occurs
      and how much reaches the cabin. The trajectory controls the rate.
    rebuttals:
    - The vehicle arrives carrying the energy, overwhelmingly as kinetic energy at lunar-return
      speed. Everything that follows is redistribution and removal of that mechanical energy.
    - Drag does negative work — it is the mechanism that removes the energy, and it acts along
      the whole path.
    - The energy becomes heat in the shocked gas and the wake. A blunt shield is shaped to
      put it there rather than into the vehicle.
    - Falling velocity and altitude are the result. How fast they fall is what the shield
      and the trajectory shape are for.
    cards:
    - The spacecraft reaches atmospheric interface with enormous mechanical energy, dominated
      by kinetic energy.
    - Atmospheric drag performs negative work on the spacecraft.
    - Energy becomes heat in shocked gas, the vehicle, and the wake.
    - Velocity and altitude fall while thermal protection and trajectory shape control the
      rates.
    order:
    - 0
    - 1
    - 2
    - 3
    reason: The crew survives only if entry sheds energy at a safe rate.
    concept: Work, energy and conservation of energy

    format: CHOICE
    question: What is the safest immediate control-panel action?
    why: Resonance requires periodic forcing near a natural frequency. The fastest reversible
      control is therefore to move the pump rotor away from the measured resonant band while
      preserving the required flow if the pump map allows it. Added damping or structural
      changes could be permanent fixes, but they require hardware access. Racing through the

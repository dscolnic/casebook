        assumes:
          - energy is a stock, and power is the rate it is drawn at
        why: Energy and power are different things, and the division between them is the whole calculation. An inventory in kilowatt-hours divided by a draw in kilowatts leaves hours. It is an ideal figure. It assumes the load stays flat and that every last watt-hour is available, and neither is true — a cold battery gives less than its rating. It is still the number every other decision this shift gets argued against, so it is worth having early and worth calling approximate.
        question: Estimate the ideal endurance.
        estimate:
          relationship: Endurance = energy stored ÷ power drawn.
          prompt: The fuel cells are gone. The entry batteries hold about 18 kilowatt-hours of usable energy and the essential loads draw about 3 kilowatts.
          question: Estimate the ideal endurance.
          labels:
            - 18 kWh (usable energy)
            - 3 kW (essential load)
            - 28 V (bus voltage)
            - 3.5 kW (peak load, briefly)
            - 6 h (time to the next burn)
          values: [18, 3, 28, 3.5, 6]
          slots: 2
          template: "{0} ÷ {1}"
          formula: a/b
          correct: [0, 1]
          target: 6
          tolerance: 0.4
          units: h
          solution: 18 kWh ÷ 3 kW = 6 h.
          explanation: Energy is an inventory and power is the rate it is spent at; the hours come from dividing one by the other. Bus voltage describes how the energy is delivered and says nothing about how much there is.
      - group: INTEG
        task: Which fault fits the voltage, current, generation, and thermal evidence?

    - Measuring in more places is how you confirm the fix worked or merely moved the problem.
      It is the check, not the change.
    - Passing through faster assumes the structure survives the passage, which is the assumption
      the growing amplitude across three cycles is calling into question.
    reason: A quick speed change can save the panel without stopping the pump.
  - group: COMMS
    task: Work the call board while the flight rule changes.
    title: What the room is calling now
    concept: 'Systems thinking: dependency, redundancy, failure modes'
    place: Flight Director's Console
    scene: Calls reach the flight loop faster than you can answer. The top risk changes after
      the burn, the leak, and crew wake-up. Follow the rule now in force.
    guide: Answer the calls the current rule wants and hold the rest. The rule is called once
      on the loop and then it stands; nobody repeats it. What is scored is the calls either
      side of a change. They are the only ones that show whether the room is working to this
      rule or to the one before it.
    background:
    - Why a flight rule changes. Before a burn everything defers to the burn. Once a leak
      is confirmed everything defers to the leak. When the crew are asleep the rule is different
      again, because a call that wakes them costs something a call to the ground does not.
    - Why the changeover is the dangerous part. A room working to the old rule for two more
      minutes gives the loop to a call that no longer matters. The call that does matter waits
      behind it, with nothing to say it was displaced.
    assumes:
    - a control room answers calls in an order somebody decides
    takeaway: The cost of a withdrawn instruction is paid by whoever is still working to it.
    format: SPOT
    question: Answer to the rule in force. It is set by the failure mode that matters most
      right now, and it changes without being repeated.
    answerText: Work the rule rather than the loudest call.
    why: Three rules run across the shift, and each wants a different part of the board. Anything
      affecting the burn, then anything affecting the leak, then anything that would wake
      the crew. A call can answer two at once, which is what makes the change cost real rather
      than notional. The panel scores the window either side of each change. Most of what
      arrives is wanted by neither rule, and is correctly held by somebody who has read nothing.
      The room's own version is the two minutes after a leak is confirmed. The rule has changed,
      and the loop is still going to the trajectory people, because that is who it belonged
      to a moment ago.
    spot:
      duration: 40
      switchEvery: 12
      pass: 0.75
      hint: The flight rule is called once on the loop and then it stands.
      targets:
      - id: k1
        label: Burn attitude query
        tags:
        - burn
      - id: k2
        label: Leak rate update
        tags:
        - leak
      - id: k3
        label: Burn timing, leak affected
        tags:
        - burn
        - leak
      - id: k4
        label: Crew sleep shift request
        tags:
        - crew
      - id: k5
        label: Ground station handover
        tags:
        - routine
      - id: k6
        label: Leak fix needs crew
        tags:
        - leak
        - crew
      - id: k7
        label: Consumables report
        tags:
        - routine
      - id: k8
        label: Burn cut-off check
        tags:
        - burn
      rules:
      - say: Anything affecting the burn
        want:
        - burn
      - say: Anything affecting the leak
        want:
        - leak
      - say: Anything that wakes the crew
        want:
        - crew
      commit: Open the loop
    reason: Old priorities can waste the few minutes left for a new risk.
- title: Choose the Return Path
  objective: Select a return plan with explicit margins and contingencies for the dominant
    uncertainties.
  briefing: Four paths home spend fuel, time, water, and entry margin in different ways. Choose
    the one that survives a bad estimate.
  stake: Shift 13. Four paths home remain, and each spends a different safety margin. Water
    may run out almost a day earlier than the best estimate. You must choose the path that
    still works when that estimate is wrong.
  takeaway: Use optimization, constraints, trade spaces, margins, critical path as an evidence
    chain rather than as isolated facts.
  stops:
  - group: INTEG
    task: Match each path to the dependency it pushes closest to its limit — the thing that runs out first. Use each
      choice once.
    title: Name the binding constraint
    concept: "Systems thinking: dependency, redundancy, failure modes"
    place: Mission Design Center
    scene: Four paths home are on the board. Each spends fuel, time, water, heat, or radio
      cover. Name the limit each path comes closest to.
    guide: 'Four return paths, and four subsystems that pay for them. Pair them by asking
      what each path spends: consumables, propellant, heating, or the crew''s own ability
      to navigate. No path is cheapest on every count. So the useful question is not which
      is fastest but which constraint each one pushes closest to its limit.'
    background:
    - Why this is a matching board and not four separate questions. Responses on boards like
      this are written to be plausible for more than one situation. Choosing them one at a
      time lets a nearly-right answer through unexamined. Having to place all of them forces
      the comparison — not "is this reasonable here", but "is it more right here than there".
    - How to use the one-each rule. Because the responses are a set to be distributed rather
      than a list to be sampled, every join you make constrains the rest. Settling the two
      you are confident of can leave the remaining pair decided by elimination. Where it does
      not, two responses are still competing for one situation, and that is exactly the distinction
      the stop is testing.
    - Why you cannot be wrong about exactly one. With every response used once, three correct
      joins leave the fourth with only one place to go. Any error therefore involves at least
      two joins. That is worth remembering when the last pair looks forced. The fault is usually
      not in the join you are struggling with. It is in one you made early and stopped questioning.
    assumes:
    - a spacecraft carries a fixed amount of everything it needs
    takeaway: The best physical solution is not necessarily the shortest or lowest-fuel solution.
    format: PROTOCOL
    why: A trajectory is a system choice because its costs land on different subsystems. More
      flight time spends oxygen, water, scrubber capacity, and electrical energy. A larger
      correction burn spends propellant and increases execution error. A steeper atmospheric
      entry raises peak heating and deceleration. A long communications blackout leaves the
      crew without ground support when navigation is most difficult. No single path minimizes
      every cost. The useful question is which constraint each path pushes closest to its
      limit.
    columns:
    - What the option changes
    - What runs out first
    rebuttals:
    - More days is more oxygen, more water, more scrubber capacity and more power. Consumables
      are the clock on a long return.
    - 'A larger burn is propellant, and it is also execution error: a bigger correction can
      be wrong by more.'
    - A steeper entry raises peak heating and deceleration together. Both are limits on the
      shield and on the crew.
    - A long blackout is time with no ground support, and it lands on crew autonomy and navigation
      confidence rather than on any hardware.
    scenarios:
    - Longer return time.
    - Larger correction burn.
    - Steeper atmospheric entry.
    - Long communications blackout.
    choices:
    - Consumables and thermal survival.
    - Fuel and propulsion reliability.
    - Heating and deceleration.
    - Crew autonomy and navigation confidence.
    mapping:
    - 0
    - 1
    - 2
    - 3
    reason: The safest path is set by the limit it nearly breaks.
  - group: INTEG
    task: Move the consumable-endurance assumption through its allowed range and choose the
      return path that remains feasible at the pessimistic end.
    title: Select the robust trajectory
    place: Life-Support Desk
    scene: The four paths take 58, 63, 66, or 71 hours, and their propellant and entry margins
      differ. The consumable endurance is uncertain by about a day, and water is the tightest
      supply.
    guide: Four return paths, and the consumable estimate is uncertain by about a day. Move
      that estimate to its pessimistic end before choosing, and watch which trajectories go
      dark. A path that works at the nominal estimate and fails a day short is not a plan.
      Water is the tightest supply, so it is the one to test against.
    background:
    - Why the pessimistic end rather than the expected one. The endurance figure is an estimate
      with a spread, not a measurement. Choosing at the middle of it means accepting a real
      chance of running out. Running out of water on a return trajectory is not recoverable
      by any later decision.
    - What the trade actually is. A faster path uses more propellant and leaves less entry
      margin; a slower one asks more of the consumables. Neither end is safe, which is why
      the choice is made by testing both against their uncertain quantity rather than by minimising
      one number.
    - Why water rather than oxygen or power. It is the supply with the least margin, so it
      fails first, and every hour added to the trajectory costs it directly. The binding constraint
      is the one worth stressing; testing against a comfortable supply proves nothing.
    assumes:
    - a constraint can eliminate an otherwise attractive option
    - uncertainty should be tested in the direction that makes the plan hardest
    takeaway: A robust choice survives the plausible error in the assumption that matters
      most, even when another option looks better nominally.
    format: STRESS
    question: Which trajectory still works when the life-support estimate is wrong in the
      bad direction?
    stress:
      hint: Drag usable consumable endurance from the nominal value toward the pessimistic
        end. A candidate goes dark when any required criterion crosses its limit.
      assumption:
        id: consumable_endurance
        label: Usable consumable endurance
        nominal: 88
        min: 64
        max: 112
        unit: h
        step: 1
      criteria:
      - id: life_support
        label: Return before consumables run out
        type: returnHours<=assumption
        key: returnHours
      - id: entry_margin
        label: Entry-angle margin
        minimum: 0.4
        unit: deg
        key: entryMarginDeg
      - id: propellant_margin
        label: Propellant reserve
        minimum: 6
        unit: kg
        key: propellantMarginKg
      candidates:
      - id: fast
        label: Fast return
      - id: balanced
        label: Balanced return
      - id: cool
        label: Low-heating return
      - id: fuel
        label: Low-fuel return
      robust: balanced
      feasible:
        fast: 224
        balanced: 63
        cool: 66
        fuel: 71
      optimiseOn: returnHours
      scores:
        fast:
          returnHours: 58
          entryMarginDeg: 0.25
          propellantMarginKg: 7
        balanced:
          returnHours: 63
          entryMarginDeg: 0.6
          propellantMarginKg: 9
        cool:
          returnHours: 66
          entryMarginDeg: 0.8
          propellantMarginKg: 11
        fuel:
          returnHours: 71
          entryMarginDeg: 0.55
          propellantMarginKg: 15
    answerText: Choose the 63-hour balanced return.
    why: A nominal comparison hides which path fails first when an uncertain input moves.
      The shortest return looks best if time is the only score, but its entry margin is too
      small. The longest options preserve other resources but depend on life support lasting
      beyond the pessimistic estimate. The balanced path is not the nominal winner on speed.
      It is the only candidate that keeps enough entry and propellant margin while also returning
      before the low-end consumable limit. That is robustness rather than average performance.
    reason: The crew needs a path that survives a bad water estimate.
  - group: THERM
    task: Order the commitment so the abort trigger still has something to act on.
    title: Commit to the path
    place: Thermal and Entry Review
    scene: The burn will close most other paths. Before it starts, write the sign that would
      prove this plan unsafe while there is still time to act.
    guide: All four of these will happen, and the burn closes most of the alternatives. Ask
      of each what would be impossible afterwards. Comparing candidates under the nominal
      case settles nothing, because the nominal case was never in doubt. And an abort trigger
      defined after the burn is a trigger with nothing left to act on.
    background:
    - 'Why the order is graded whole. A sequence is a claim about dependency: each step is
      here because the one before it has already happened, or has to have. One transposed
      pair falsifies that claim wherever it sits, so partial credit would be credit for a
      sequence that does not work.'
    - Why the ends are the place to start. The first and last cards have nothing before or
      after them. That constraint usually makes them the two you can settle from the scene
      alone. Pinning them collapses the remaining arrangements sharply, and what is left in
      the middle is where the actual judgement lives.
    - What the rail can be ordered on. Time is the usual axis, but it is not the only one.
      An order can run on cost, on risk, or on reversibility — every observation that leaves
      the sample as it was, before any that consumes it. On those boards a chronological reading
      finds nothing, because none of the steps has to happen at a particular hour.
    takeaway: An abort trigger has to be defined while there is still propellant to act on
      it.
    format: SEQUENCE
    rebuttals:
    - 'Quantify the margins first: propellant, consumables, thermal, corridor width. Everything
      after this is arithmetic on those numbers.'
    - Compare under off-nominal conditions second. Comparing nominals ranks the candidates
      by the case that was never the problem.
    - Name the abort observation and its time third — before the burn. Afterwards most alternatives
      have closed and the trigger has nothing to act on.
    - Burn last, and keep updating the margins. Commitment is not the end of the estimate.
    assumes:
    - a decision can only be undone while the means to undo it still exist
    cards:
    - 'Quantify the margins: propellant, consumables, thermal, and the corridor width.'
    - Compare the candidates under the off-nominal cases, not the nominal one.
    - Name the observation that would show the choice was wrong, and the time it arrives.
    - Burn, and keep updating the margins against what the tracking returns.
    order:
    - 0
    - 1
    - 2
    - 3
    why: A plan is a hypothesis about future physical states, and it needs a way to be found
      wrong in time. The margins are quantified first, because they are what the decision
      is made of. The candidates are compared under off-nominal conditions rather than nominal
      ones, because the nominal case is the one that was never in doubt. The abort trigger
      is named before the burn — defined afterwards it is a trigger with nothing left to act
      on. Then the margins keep being updated against what the tracking returns.
    reason: An abort rule helps only while fuel remains to use it.
- title: The Last Correction
  objective: Decide whether to burn using the expected benefit relative to navigation and
    propulsion uncertainty.
  briefing: Ground tracking says the ship moved, but the stations share one clock. Decide
    whether to burn or check the clock first.
  stake: Shift 14. Several ground results now place the ship ahead of its path. They agree,
    but they also use the same clock. You must decide whether the ship moved or the clock
    moved before the last burn window closes.
  takeaway: Use random and systematic error, weighted averages, errors that move together,
    propagation, decision thresholds as an evidence chain rather than as isolated facts.
  stops:
  - group: NAV
    task: Which explanation fits the range, angle and Doppler evidence, and the independent
      timing check beside it?
    title: Real trajectory error or common clock drift?
    place: Global Tracking Network
    scene: Range and Doppler place the ship ahead of its path. Both use one ground clock.
      Compare them with the star angle and the clock log before burning.
    guide: Several radiometric products agree, but agreement is not independence. Ask which
      products inherit the same station time-and-frequency reference, then compare them with
      the optical angle and an independent timing standard before authorising a burn.
    background:
    - Why the wrong options are the interesting ones. Each distractor is written to be the
      answer under one specific misreading. A step skipped. A quantity confused with a rate.
      A correlation taken for a cause. Identifying which misreading each belongs to is where
      the learning is; the right answer alone can be reached on instinct and teach nothing.
    - Why the shape of an option tells you nothing. A correct answer collects the qualifying
      clause and the unit. So across a whole game the key used to be the longest option far
      more often than chance. Here it ran to 88 per cent of passage quizzes, before it was
      fixed. It is now checked per game as a binomial tail, so length, hedging and specificity
      have had the signal taken out of them deliberately.
    - What the verdict adds. Every wrong option carries its own rebuttal, and the verdict
      prints them — the reason that option fails, not a restatement of the right one. They
      are worth reading after a correct answer as well. A right choice made for an approximate
      reason looks exactly like a sound one. It stops looking like one on the day the approximation
      is what is being tested.
    assumes:
    - several instruments can be wrong together if they share a part
    takeaway: When several measurements agree, ask whether they agree independently or merely
      inherit the same clock, calibration, or model.
    format: CHOICE
    why: Agreement matters only when measurements can fail independently. The range and coherent-Doppler
      products are reduced against the same ground time-and-frequency reference. A timebase
      error can therefore bias the derived state in a correlated way, even though the raw
      observables are different. The optical angle uses different physics and still matches
      prediction. An independent timing check then shows the common reference is offset, and
      reprocessing the radiometric data removes most of the apparent trajectory jump. The
      lesson is not that every clock error moves range and Doppler identically. It is that
      derived products can share a reference, and therefore share a failure mode.
    rebuttals:
    - A real trajectory change needs a force, and onboard dynamics show no unmodelled acceleration.
      Nothing pushed the spacecraft.
    - Independent failures do not drift in the same direction at the same moment. These channels
      share a clock, which is why they moved together.
    - A star tracker fault would put the angular solution in the wrong place. The angles are
      the measurements that agree with the prediction.
    headline: Several ground measurements suddenly place the spacecraft ahead of its predicted
      path.
    readings:
    - zone: Range/Doppler residuals
      label: Range/Doppler residuals
      value: Shift together
      status: alarm
      note: Both channels use the same ground time reference
    - zone: Star-angle navigation
      label: Star-angle navigation
      value: Matches predicted direction
      status: normal
      note: Independent angular geometry is stable
    - zone: Ground timing reference
      label: Ground timing reference
      value: Offset detected
      status: alarm
      note: Shared clock is late relative to an independent standard
    - zone: Reprocessed data
      label: Reprocessed data
      value: Residual largely disappears with corrected time
      status: alarm
      note: Same raw observations, new timestamps
    - zone: Onboard dynamics
      label: Onboard dynamics
      value: No unmodeled acceleration
      status: normal
      note: No physical force explains a sudden trajectory jump
    choices:
    - label: Real trajectory error
      mechanism: The ship has physically moved away from the predicted path.
    - label: Common timing-reference error
      mechanism: Shared timestamps bias several derived range and velocity measurements together.
    - label: Independent sensor failures
      mechanism: Multiple unrelated instruments happen to drift in the same direction at once.
    - label: Star tracker failure
      mechanism: The angular navigation system alone is producing the bad state estimate.
    answer: Common timing-reference error
    reason: A burn for a clock error would create a real miss.
    question: Which explanation fits the range, angle and Doppler evidence, and the independent
      timing check beside it?
  - group: NAV
    task: Use the two perpendicular one-sigma components to estimate the root-sum-square position-error
      scale used in the brief.
    title: Combine the orthogonal error components
    place: Navigation Covariance Room
    scene: The navigation covariance gives one-sigma position errors of 6 km and 8 km on perpendicular
      axes. Find the root-sum-square scale, without calling it a 68% circle.
    guide: The two components are independent and perpendicular, so their variances add. The
      square root of 6²+8² is a useful RMS/RSS size for the two-dimensional error vector.
      It is not, by itself, the radius containing 68% of a two-dimensional Gaussian.
    background:
    - Why an estimate rather than a calculation. Every quantity on this board is already measured
      or stated, so nothing here has to be derived. Two things are being tested. Can you pick
      the quantities the relationship actually needs? And does the size of the answer look
      right once they are in place?
    - Why the tiles carry labels. A bare number cannot be checked against the relationship
      it is going into. Reading the label is how a unit mismatch is caught before the tile
      is placed. It is also how you catch a quantity that belongs to a different part of the
      problem. That habit is what this format exists to build.
    assumes:
    - the two quoted axis errors are independent one-sigma components
    takeaway: Independent orthogonal variance components add in quadrature, but their RSS
      is not the same thing as a radial confidence interval.
    format: BALLPARK
    question: Estimate the root-sum-square position-error scale.
    why: 'Independent one-sigma components along perpendicular axes combine in quadrature
      as an RMS scale: √(6²+8²)=10 km. That preserves the variance geometry and is useful
      for comparing error budgets. But a two-dimensional Gaussian does not put 68% of its
      probability inside a circle of that radius. A true radial confidence region comes from
      the full covariance. The game therefore labels 10 km as an error scale, not a one-sigma
      radial boundary.'
    estimate:
      relationship: 'Independent errors along perpendicular axes add in quadrature: the root
        of the sum of the squares.'
      prompt: Two independent one-sigma position components are 6 km and 8 km on perpendicular
        axes.
      question: Estimate the root-sum-square position-error scale.
      labels:
      - 6 km (one-sigma, first axis)
      - 8 km (one-sigma, second axis)
      - 14 km (the 2 added)
      - 7 km (their average)
      - 2 (number of axes)
      values:
      - 6
      - 8
      - 14
      - 7
      - 2
      slots: 2
      template: √({0}² + {1}²)
      formula: Math.sqrt(a*a+b*b)
      correct:
      - 0
      - 1
      target: 10
      tolerance: 0.5
      units: km
      solution: √(6² + 8²) = 10 km RSS.
      explanation: The variances of independent orthogonal components add. The 10 km result
        is an RSS/RMS scale for the vector error, not automatically a 68% radial confidence
        radius.
    reason: The final burn rule needs one honest error scale.
  - group: INTEG
    task: Spend the remaining tracking budget on the observation that can actually change
      the burn decision.
    title: Burn or observe?
    place: Flight Director Console
    scene: Two tracking results use the same clock. A burn is ready, but one more check can
      still fit. Buy evidence that can fail in a different way.
    guide: Two tracking solutions disagree, and both are computed through the same station
      clock model. Open each piece of evidence and ask what its result would change about
      the burn decision. Buy the evidence that could distinguish a real trajectory error from
      a clock error, not the evidence that would refine a number both solutions already share.
    background:
    - Why two disagreeing solutions can share a fault. Both are derived from timing measurements
      referred to the same clock model. A modelling error moves both. It can move them by
      different amounts, because they use different station geometries. That looks exactly
      like a genuine disagreement about where the spacecraft is.
    - 'What would separate the two explanations. A measurement that does not depend on that
      clock model: an optical sighting, a different tracking technique, a station whose timing
      comes from elsewhere. Any of those either confirms the trajectory or exonerates it.'
    - Why the burn makes it urgent. Correcting a trajectory that is not wrong introduces the
      error you were trying to remove, and spends propellant doing it. The decision closes
      shortly, which is what makes the choice of evidence a decision rather than a preference.
    takesAsRead:
    - Newton's laws and free-body reasoning
    assumes:
    - two measurements that share a clock do not provide independent timing evidence
    - an observation can be valuable even if it is less precise
    takeaway: The most valuable measurement is the one whose failure mode is independent enough
      to change the decision.
    format: VALUE
    question: Which evidence is worth buying before committing the correction burn?
    value:
      decision: Decide whether to execute the correction burn or hold it for more evidence.
      hint: Each option costs tracking budget. Open an option to see what it would reveal
        and which evidence axis it uses before you spend.
      budget:
        amount: 2
      options:
      - id: reprocess
        label: Reprocess the same range data
        cost: 1
        axis: shared timing
        decisive: false
        reveals: whether numerical reduction noise changed the timing-based solution
      - id: second_range
        label: Take another clock-linked range pass
        cost: 1
        axis: shared timing
        decisive: false
        reveals: whether a new range point repeats the same clock-dependent offset
      - id: optical
        label: Take an optical star-angle fix
        cost: 2
        axis: independent geometry
        decisive: true
        reveals: whether the spacecraft direction is displaced without using the suspect ground
          clock
      - id: propagate
        label: Run a denser trajectory propagation
        cost: 1
        axis: model prediction
        decisive: false
        reveals: how the current state estimate evolves if its inputs are accepted
    answerText: Buy the independent optical star-angle observation.
    why: More precision on the same dependency does not resolve a common-mode ambiguity. Reprocessing
      the same timing data can reduce numerical noise while leaving the clock error untouched.
      Another range pass tied to that clock has the same weakness. An optical star-angle observation
      uses different physics and a different reference, so it can tell whether the spacecraft
      itself is displaced. Under a small budget, that independence is worth more than another
      precise copy of the evidence already in hand.
    reason: One independent check can prevent a needless last burn.
- title: Reentry
  objective: Spend the last verification checks, lock the blackout sequence, and make the
    final go/no-go entry decision.
  briefing: Entry starts in minutes and the radio will soon go silent. Spend the last checks
    and make the final call.
  stake: Shift 15. Entry starts in 11 minutes, and the ground will soon lose the radio for
    four minutes. The shield, flight path, guidance unit, battery link, and hand aim must
    all work together. You have two checks left, then you must send the crew into the air
    or call no-go.
  takeaway: Use integrated mechanics, thermodynamics, waves, fluids, uncertainty, ethics of
    command as an evidence chain rather than as isolated facts.
  stops:
  - group: INTEG
    task: Choose which readiness claims to verify before entry. You have two checks for four
      signed claims. So spend them where an unverified error would matter most.
    title: Disposition final readiness
    place: Integrated Flight Room
    scene: Entry starts in 11 minutes. Four claims are signed, but one lacks a check outside
      its own team. Spend the last two checks where failure would hurt most.
    guide: Four signed readiness claims, eleven minutes, and two physical checks that can
      still be completed. Open each claim and read what backs it. Some rest on independent
      evidence and one does not. Hold what the evidence does not support, and spend the checks
      where being wrong would matter most once the vehicle is in blackout.
    background:
    - Why blackout changes the arithmetic. During entry there is no telemetry and no way to
      intervene. Every claim on that console is a decision that cannot be revisited for several
      minutes. That is why an unverified claim is worse here than anywhere else in the mission.
    - What a signature means at this point. Somebody has taken responsibility for a statement.
      Under time pressure, signatures are given on the basis of what somebody was told. That
      is how a claim with nothing behind it takes on the same appearance as one with a test
      behind it.
    - How to choose between two unbacked claims. By consequence during entry, not by how doubtful
      each is. A claim whose failure is survivable is worth less verification than one that
      is not, however much more likely the first is to be wrong.
    assumes:
    - a signature records responsibility, not physical truth
    - verification time should be spent according to consequence and existing evidence
    takeaway: A signed readiness claim is a record of what someone believes; critical physical
      states still need evidence proportional to their consequence.
    format: ATTEST
    question: Which claims deserve the final physical check before the vehicle enters blackout?
    attest:
      hint: Open each signed claim to see what evidence already backs it. You can perform
        only two final checks before the clock expires.
      checks: 2
      claims:
      - id: entry_state
        label: Entry state lies inside the robust corridor
        signedBy: Navigation
        critical: true
        backed: true
        evidence: independent range, Doppler, and optical solution
      - id: shield_config
        label: Thermal-shield configuration matches the approved state
        signedBy: Configuration
        critical: true
        backed: false
        evidence: undocumented change after the last signed configuration record
      - id: blackout_guidance
        label: Onboard guidance is ready for the blackout
        signedBy: Guidance
        critical: false
        backed: true
        evidence: completed autonomous guidance self-test
      - id: station_bias
        label: Known station bias has been removed
        signedBy: Tracking
        critical: false
        backed: true
        evidence: reprocessed residual check under the validated correction rule
      priority:
      - shield_config
      - entry_state
    answerText: Physically verify the heat-shield setup first, then confirm the entry state
      remains inside the approved corridor.
    why: A signature records responsibility, not physical truth. Verification time should
      go where consequence is highest and independent evidence is weakest. The undocumented
      shield-state change is therefore the first check. The entry state is already well supported,
      but its consequence is so large that it earns the second final check. The guidance self-test
      and corrected station bias already have direct evidence.
    reason: The last checks must target the least-backed fatal claims.
  - group: INTEG
    task: Order the entry around the four minutes with no radio.
    title: Execute the final physical chain
    place: Crew Capsule
    scene: Entry starts in 11 minutes. The radio will go dark for four. Put each ground-led
      step before that silence.
    guide: Four minutes with no radio is what orders these four. Ask of each whether it needs
      ground input, and whether it can be done after the interface. Anything the ground has
      to approve happens before the blackout. Anything compared against a prediction can only
      happen once entry has begun. And the record is the only direct test the predicted envelope
      will ever get.
    background:
    - 'Why the order is graded whole. A sequence is a claim about dependency: each step is
      here because the one before it has already happened, or has to have. One transposed
      pair falsifies that claim wherever it sits, so partial credit would be credit for a
      sequence that does not work.'
    - Why the ends are the place to start. The first and last cards have nothing before or
      after them. That constraint usually makes them the two you can settle from the scene
      alone. Pinning them collapses the remaining arrangements sharply, and what is left in
      the middle is where the actual judgement lives.
    - What the rail can be ordered on. Time is the usual axis, but it is not the only one.
      An order can run on cost, on risk, or on reversibility — every observation that leaves
      the sample as it was, before any that consumes it. On those boards a chronological reading
      finds nothing, because none of the steps has to happen at a particular hour.
    assumes:
    - you cannot fix from the ground what happens while the radio is quiet
    takeaway: 'Entry is ordered by the blackout: whatever needs the ground has to be settled
      before it starts.'
    format: SEQUENCE
    why: The blackout forces the order of operations. Attitude, configuration, and the approved
      state estimate are set before atmospheric interface because ground commands will soon
      be unavailable. The roles of onboard guidance and the ground are also settled before
      commitment. Deceleration and heating can only be compared with predictions after entry
      begins. Recovery follows once the high-energy phase is over. The telemetry record is
      preserved throughout, because this single flight is the only direct test of the predicted
      entry envelope.
    rebuttals:
    - Attitude and configuration first, before the interface. Nothing here can be changed
      through four minutes of silence.
    - Commit with the onboard and ground roles already unambiguous. Deciding who is flying
      is not something to work out during the blackout.
    - Monitor deceleration and heating against the envelope third. It cannot begin before
      entry, because there is nothing to compare against yet.
    - Descent and recovery last, preserving the record. It is the only flight that will ever
      produce this data.
    cards:
    - Set the approved attitude and configuration, because nothing can be changed through
      the blackout.
    - Commit to the interface with the onboard and ground roles already unambiguous.
    - Monitor deceleration and heating against the predicted envelope.
    - Transition to descent, preserving the record of what the envelope actually did.
    order:
    - 0
    - 1
    - 2
    - 3
    reason: The ground cannot fix the order once the radio goes dark.
  - group: INTEG
    task: Use the checked shield, path, and guidance to make the final call.
    title: Give the entry GO
    concept: 'Systems thinking: dependency, redundancy, failure modes'
    place: Flight Director Console
    scene: The shield matches its safe setup. Two kinds of tracking keep the ship inside the
      entry path. Guidance can fly through the radio blackout. Make the final call.
    guide: This is the decision the previous fourteen shifts built. Ask whether any unresolved
      item is both capable of changing the entry outcome and still actionable before interface.
      Do not demand certainty the measurements cannot provide, and do not spend propellant
      correcting an error that independent evidence says is in the ground system.
    background:
    - A go/no-go is not a vote on whether every uncertainty vanished. It is a decision about
      whether the remaining uncertainty lies inside the margins the vehicle was designed and
      targeted to survive.
    - The dangerous temptation is to react to the newest alarming number. The last tracking
      anomaly shared a ground timebase, and disappeared under an independent timing correction.
      Burning against it would create a real trajectory change to fix a measurement error.
    - Once entry begins, the ground loses command authority during plasma blackout. That is
      why the configuration, state, and onboard roles were verified before this call.
    assumes:
    - the heat-shield configuration has been physically verified
    - the entry state is supported by independent tracking
    - onboard guidance has passed its autonomous test
    takeaway: The final decision is earned when the remaining uncertainty is inside verified
      physical margins and no unresolved actionable hazard remains.
    format: CHOICE
    question: What is the flight director's final call, when the test that matters is whether
      a failure mode is still live and still fixable?
    why: The evidence now supports entry. The shield configuration has been physically checked.
      The navigation solution lies inside the approved corridor, with independent support.
      Autonomous guidance is ready for the blackout. The late radiometric anomaly was traced
      to a shared ground reference rather than to spacecraft motion. An unplanned burn would
      add a real trajectory change without evidence that one is needed. Waiting is not a neutral
      option because the vehicle is already committed to atmospheric encounter. The defensible
      call is GO for entry under the signed checklist and predefined monitoring triggers.
    choices:
    - GO for entry on the signed checklist and the checked path.
    - Burn now to remove the clock-based offset.
    - Wait for entry data before choosing.
    - Open the checked shield again.
    answer: GO for entry on the signed checklist and the checked path.
    rebuttals:
    - The remaining radiometric offset came from the shared ground timebase. Burning against
      it would turn a measurement error into a real trajectory error.
    - Entry begins before the blackout ends and cannot be deferred until deceleration data
      arrive. Onboard roles must be settled first.
    - Another inspection consumes the last minutes and creates configuration risk without
      new evidence that the verified shield state is wrong.
    answerText: GO for entry.
    reason: This is the final choice the whole return has built toward.
interiors:
  NAV:
    caption: A state estimate that cannot predict the next observation is a number, not a
      position.
    standLine: Range from 1 station, 2 bearings 90 minutes apart, and a Doppler trace in a
      different time standard.
    station:
      kind: panel
      title: Guidance console
      rows:
      - label: Last good state
        value: 04:12 GET
        status: normal
      - label: Tracking gap
        value: 96 min
        status: alarm
      - label: Residual
        value: 4.1 km
        status: high
  ELEC:
    caption: Power is a rate. Endurance is what the inventory divided by that rate buys you.
    standLine: Fuel cells gone, entry batteries carrying loads they were never budgeted for.
    station:
      kind: vitals
      title: Main bus B
      rows:
      - label: Usable energy
        value: 18 kWh
        status: low
      - label: Essential load
        value: 3.0 kW
        status: alarm
      - label: Bus voltage
        value: 26.4 V
        status: normal
  THERM:
    caption: The cabin cools whether or not anybody is watching the number.
    standLine: Condensation on the panels, four degrees and falling, crew sleeping in suits.
    station:
      kind: vitals
      title: Cabin environment
      rows:
      - label: Cabin temperature
        value: 4.2 C
        status: alarm
      - label: CO2 partial pressure
        value: 13 mmHg
        status: alarm
      - label: Cabin pressure
        value: 5.0 psia
        status: normal
  COMMS:
    caption: A link budget is arithmetic. Which term broke it is evidence.
    standLine: Carrier down 12 decibels and drifting, with attitude, range and antenna schedule
      all changed.
    station:
      kind: panel
      title: Downlink
      rows:
      - label: Carrier level
        value: -12 dB
        status: alarm
      - label: Doppler residual
        value: 30 Hz
        status: high
      - label: Ground antenna
        value: 64 m
        status: normal
  STRUCT:
    caption: A structure fails at the frequency you are driving it at, not the one on the
      drawing.
    standLine: A panel oscillating whenever the pump runs near one speed, and one accelerometer
      watching it.
    station:
      kind: panel
      title: Vibration
      rows:
      - label: Peak response
        value: 0.9 g
        status: alarm
      - label: Pump speed
        value: 3050 rpm
        status: high
      - label: Damping
        value: not measured
        status: low
  INTEG:
    caption: Every call here is made on numbers somebody else measured, late.
    standLine: One anomaly log, six back rooms, and a crew who can hear the loop.
    station:
      kind: panel
      title: Flight director loop
      rows:
      - label: Open calls
        value: 3
        status: alarm
      - label: Consumables
        value: 89 h
        status: high
      - label: Entry interface
        value: 62 h
        status: normal
warmups:
  greet:
    title: Meet the six people who can save the crew
    why: Meet each lead now so you know who owns the ship's path, power, air, radio, motion,
      and final calls.
  trial-near:
    title: Carry the first alarm across Mission Control
    why: Reach the pressure, power, and guidance consoles before the crew acts on three readings
      that may share one fault.
  follow:
    title: Shadow the live handover
    why: Follow the outgoing controller so no lost fact becomes the next shift's wrong order.
  hunt:
    title: Find the missing survival logs
    item:
      name: consumable log
      plural: consumable logs
    why: Recover the air, water, power, fuel, heat, and filter logs so the room knows how
      long the crew can live.
  canvass:
    title: Find who truly saw the explosion
    why: Ask each console what it measured so one bad data path is not mistaken for damage
      across the ship.
  evade:
    title: Keep an unverified story off the air
    why: Avoid the press officer until the room knows whether the crew faces a leak or a sensor
      fault.
  tag:
    title: Catch Reyes before the first burn call
    why: Reach Reyes, the guidance lead, with the corrected ship mass before she locks a burn
      based on the old number.
copy:
  NAV: <p>Guidance. Where the spacecraft is, how fast, and how much of that is actually known.</p>
  ELEC: <p>Electrical systems. Every watt aboard is drawn from an inventory that is not being
    refilled.</p>
  THERM: <p>Thermal and life support. Heat, gas and water — the three things a cabin runs
    out of.</p>
  COMMS: <p>Communications. Everything known about the vehicle arrives through this room.</p>
  STRUCT: <p>Structures and dynamics. Rotation, vibration and the loads a spacecraft was built
    to take.</p>
  INTEG: <p>Mission operations. Six rooms report here and one person decides.</p>
  SIGNIN: <p>Badge and sign-in. Nobody reaches the operations floor without appearing on this
    sheet.</p>
  GALLERY: <p>The viewing gallery. Off-shift controllers wait out a burn here rather than
    at home.</p>
  QUIET: <p>The crew family room. Kept staffed, and kept away from the loop.</p>
  LIBRARY: <p>The trajectory library. Every plot, every burn, every version that was superseded.</p>
lessons:
- group: NAV
  title: Which measurement constrains what? — Review
  concept: Doppler shift
  place: Deep-Space Tracking Station
  task: Match each observation to the part of the state it leaves unmeasured.
  scene: Whitaker has one station and a 20-minute pass. Each reading misses part of the ship's
    state. Name each blind part before the pass begins.
  guide: Four observations, and four things none of them can see. Pair them by asking what
    the instrument is physically sensitive to, then take the complement. A frequency shift
    responds to motion along the beam. A travel time responds to distance along a line. An
    angle fixes the line and nothing on it. And one of the four is built by subtracting two
    earlier answers.
  background:
  - Why this is a matching board and not four separate questions. Responses on boards like
    this are written to be plausible for more than one situation. Choosing them one at a time
    lets a nearly-right answer through unexamined. Having to place all of them forces the
    comparison — not "is this reasonable here", but "is it more right here than there".
  - Why a blind axis is worth scheduling against. A pass is short, and the station can only
    be pointed at one thing at a time. So the observation worth buying is the one whose blind
    axis is already covered by something else. Two measurements blind in the same direction
    cost twice and buy once.
  - Why the transverse direction is the hard one here. A Doppler track is the cheapest measurement
    on the list and the one the room trusts most. It responds only to the component of velocity
    along the beam. A spacecraft drifting sideways at a kilometre a second moves the carrier
    by nothing.
  takesAsRead:
  - 'Waves: frequency, wavelength, speed'
  assumes:
  - a measurement responds to one component of the motion and not to the others
  - subtracting two measured numbers carries both of their errors into the answer
  takeaway: Every observation is blind along some axis, and a schedule is chosen against the
    blind axes rather than the strong ones.
  format: PROTOCOL
  columns:
  - The observation
  - What it cannot see
  scenarios:
  - A Doppler track held through the whole pass.
  - A round-trip range measurement at closest approach.
  - A pair of star-camera bearings ninety minutes apart.
  - Two positions differenced to give a velocity.
  choices:
  - Motion across the beam. A velocity at right angles to the line of sight shifts the returned
    frequency by nothing at all.
  - Direction. A distance says how far along a line the spacecraft has got and never which
    of the lines it is on.
  - Distance. An angle fixes the line the spacecraft lies along and says nothing whatever
    about how far out it is.
  - Precision. Each position arrives with its own error, and the subtraction carries both
    of them into the rate.
  mapping:
  - 0
  - 1
  - 2
  - 3
  rebuttals:
  - Doppler is a frequency shift, so it answers only for the component of velocity along the
    beam and is silent about the rest.
  - Range is a time multiplied by a speed. It puts the spacecraft on a sphere and leaves every
    direction on that sphere open.
  - A bearing is an angle against catalogued stars. It fixes a line through the station and
    puts nothing at all on that line.
  - A rate built by subtraction inherits the errors of both numbers subtracted, which is why
    it is the noisiest quantity on the board.
  why: Each observation responds to one part of the motion and is silent about the rest. So
    the useful question about a short pass is not which measurement is best. It is which axis
    is still uncovered. Doppler carries the line-of-sight component of velocity and nothing
    across it. Range fixes a distance and leaves the direction open. A bearing does the opposite.
    Differenced positions give a rate and carry both errors forward. Two observations blind
    in the same direction cost two passes and buy one answer.
  reason: A short pass must measure the part no other tool can see.
- group: NAV
  title: Reconstruct the state vector — Review
  concept: Vectors and components
  place: Guidance Room
  task: Arrange the four cards from the earliest prerequisite or cause to the latest result.
  scene: The guidance unit has reset again. Hand-read star angles remain, but their clocks
    differ. Agree on the axes and clock before using them.
  guide: All four of these will be done, so ask what each one needs to be true already. A
    direction is only a direction once somebody has said which way the axes point. Components
    cannot be added until they are components on the same axes. A velocity is a difference
    between two positions. And the crew read attitude in their own frame, not in the room's.
  background:
  - 'Why the order is graded whole. A sequence is a claim about dependency: each step is here
    because the one before it has already happened, or has to have. One transposed pair falsifies
    that claim wherever it sits, so partial credit would be credit for a sequence that does
    not work.'
  - What a hand-taken mark actually is. A sextant angle between a star and a landmark is a
    direction and a moment, and nothing else. It carries no distance, no frame and no clock
    of its own, which is why all three have to be supplied before any arithmetic is done to
    it.
  - Why the last step is a rotation rather than a calculation. The state is computed in the
    frame the ground works in, and the crew fly the vehicle in theirs. The same vector has
    different numbers in the two, so a state handed across without the rotation is right and
    unusable.
  assumes:
  - a direction is only a set of numbers once the axes have been named
  - components add only when they are components on the same axes
  takeaway: A vector is numbers plus the axes they are measured against, and the axes have
    to be settled before any of the numbers can be added.
  format: SEQUENCE
  cards:
  - Name one set of axes and one clock, and record which way each axis points.
  - Resolve every sextant mark into components along the three named axes.
  - Add the components against the last trusted range for a position, and difference two positions
    for a velocity.
  - Rotate the finished state into the crew's own body axes before any burn attitude is read
    off it.
  order:
  - 0
  - 1
  - 2
  - 3
  rebuttals:
  - Name the axes and the clock first. A direction with no frame behind it is three numbers
    that cannot be compared with anything.
  - Resolve the marks into components second. Angles taken against different references do
    not add; their components on shared axes do.
  - Combine into a position and difference for velocity third. Both steps are arithmetic on
    components, so they wait for the components.
  - Rotate into body axes last. The crew set attitude in their own frame, and a state handed
    over in the ground's frame is unusable to them.
  why: A vector is a set of numbers together with the axes they are measured against, and
    the numbers mean nothing without the axes. So the frame and the clock are settled before
    anything is resolved. Each sextant mark then becomes components on those shared axes,
    which is what makes them addable at all. Position comes from combining components with
    a range, and velocity from differencing two positions. The rotation into body axes is
    last because it changes every number while changing nothing physical.
  reason: A burn vector is useless until its axes and clock agree.
- group: INTEG
  title: 'What failed: the spacecraft or the sensors? — Review'
  concept: 'Systems thinking: dependency, redundancy, failure modes'
  place: Mission Control
  task: Open the dependency chain behind each temperature reading, keep what stands on its
    own, and name the shared source.
  scene: Three thermocouples on the fuel tank climb together, four hours after a signal-conditioning
    card was swapped. The boil-off rate and the crew's hand-held reading stay steady. Carter
    wants the diagnosis before anybody vents the tank.
  guide: Open each temperature channel to see what it depends on. Keep the ones that would
    still stand if the new card were faulty, and untick the rest. Then name the shared source.
    Venting the tank is not free and it is not reversible, so the question is whether the
    gas is warming or the measurement chain is.
  background:
  - Why three thermocouples can be one measurement. Redundant temperature channels are usually
    amplified and digitised by one conditioning card, which supplies the excitation and the
    cold-junction reference. A fault in either moves all three readings the same way at the
    same moment, which is exactly what a warming tank looks like on the display.
  - Why the boil-off rate is worth more than three thermocouples here. Gas leaving a tank
    through a relief path is a flow. It is measured by a different instrument on a different
    chain, and it is a direct consequence of the tank being warm. It cannot inherit a fault
    in the temperature electronics because it does not pass through them.
  - Why the timing matters as much as the pattern. The card was fitted this morning, and the
    divergence starts hours later rather than at the swap, which is how a marginal connection
    behaves as it warms. A shared cause does not have to act at the instant it is installed.
  assumes:
  - redundant sensors often share one amplifier and one reference
  - an instrument on a different physical principle does not inherit that fault
  takeaway: Redundancy only buys independence when the redundant paths do not meet, and they
    usually meet at the card.
  format: TRACE
  question: Which temperature evidence survives the dependency check, and what shared source
    moved the rest?
  trace:
    decision: Decide whether the tank gas is really warming or three channels inherited a
      fault in the new conditioning card.
    hint: Open each channel to see what it depends on. Keep the channels whose measurement
      path does not run through the suspect card.
    channels:
    - id: tc_a
      label: Tank thermocouple A
      reading: up nine degrees Celsius in four minutes
      depends:
      - tank
      - cond_card
    - id: tc_b
      label: Tank thermocouple B
      reading: up nine degrees Celsius in four minutes
      depends:
      - tank
      - cond_card
    - id: tc_c
      label: Tank thermocouple C
      reading: up eight degrees Celsius in four minutes
      depends:
      - tank
      - cond_card
    - id: boiloff
      label: Relief line boil-off rate
      reading: steady at 0.4 kilograms an hour since the bang
      depends:
      - tank
      - vent_path
    - id: handheld
      label: Crew hand-held infrared reading
      reading: within a degree of the figure taken this morning
      depends:
      - tank
      - crew_optics
    resources:
    - id: tank
      label: Tank gas temperature
    - id: cond_card
      label: Signal conditioning card fitted this morning
    - id: vent_path
      label: Relief line flow meter
    - id: crew_optics
      label: Hand-held infrared thermometer
    target: cond_card
    independent:
    - boiloff
    - handheld
  answerText: Keep the boil-off rate and the crew's hand-held reading.
  why: Three channels agreeing is three votes only if they can fail separately, and these
    three are amplified and referenced by one card. A fault in that card moves all of them
    the same way at once, which is indistinguishable on the display from a tank that is genuinely
    warming. The boil-off rate is a flow on a different instrument, and the crew's hand-held
    reading is an optical measurement made in the cabin. Neither passes through the card,
    and both say the gas is where it was. Venting would have thrown away propellant to correct
    an electrical fault.
  reason: Venting for a bad card would throw away fuel the crew needs.
- group: THERM
  title: What the pressure difference is for — Review
  concept: Fluid pressure and flow
  place: Life Support Lab
  task: The pump still holds 24 psi across the loop and the flow has fallen by a third. What
    does that combination mean?
  scene: Coolant flow falls by one third, but the pump still adds 24 psi. Decide whether the
    push or the path changed.
  guide: 'All four options explain a flow that has fallen. They differ in what they hold responsible:
    the path, the pump, the instrument, or the fluid. Ask of each whether it is consistent
    with a driving difference that has not moved. A pressure difference makes the fluid go;
    how obstructed the path is decides how much of it goes per minute.'
  background:
  - Why the wrong options are the interesting ones. Each distractor is written to be the answer
    under one specific misreading. A step skipped. A quantity confused with a rate. A correlation
    taken for a cause. Identifying which misreading each belongs to is where the learning
    is; the right answer alone can be reached on instinct and teach nothing.
  - 'Why an unchanged difference is the informative half. Two numbers describe this loop:
    what pushes and what resists. If the push is where it was and the flow has fallen, the
    resistance is the only term left to have moved. Had the difference fallen with the flow,
    the pump would be the first thing to look at instead.'
  - What can add resistance in a cold loop. A partly closed valve, a loaded filter, gas collected
    at a high point, or glycol thickening as the cabin cools. All four reduce the flow at
    an unchanged pressure difference. What separates them is where in the loop the pressure
    is lost, rather than how much.
  takesAsRead:
  - Newton's laws and free-body reasoning
  assumes:
  - a pressure difference drives a flow and the path decides its rate
  takeaway: When the push has not changed and the flow has, the path is what moved.
  format: CHOICE
  question: The pump still holds 24 psi across the loop and the flow has fallen by a third.
    What does that combination mean?
  choices:
  - The push is unchanged, so the loss of flow points to added resistance in the loop.
  - A pump holding its pressure rise cannot have lost flow, so the flow meter is at fault.
  - Pressure difference and flow are one measurement in two units, so both readings cannot
    be right together.
  - Colder glycol is denser, and a denser fluid always carries more flow at the same pressure
    difference.
  answer: The push is unchanged, so the loss of flow points to added resistance in the loop.
  rebuttals:
  - A pump sets the pressure rise it can hold, not the flow that results. The flow that a
    given rise produces depends on what the loop does to it.
  - They are two different quantities. One is what drives the fluid, the other is how much
    of it arrives, and the ratio between them is the resistance.
  - Cooling thickens glycol rather than helping it along, so a denser, more viscous fluid
    moves more slowly at the same difference, not faster.
  why: Two quantities describe this loop and only one of them has moved. The pressure difference
    is what drives the glycol, and the resistance of the path decides how much arrives per
    minute. With the difference held at twenty-four psi and the flow down by a third, the
    resistance is the only term left that can have changed. A part-closed valve, a loaded
    filter, gas trapped at a high point or glycol thickening in a cooling cabin all do that.
    A healthy pump guarantees a pressure rise, never a flow.
  reason: The crew needs flow, not just a healthy pump reading.

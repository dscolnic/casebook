      reason looks exactly like a sound one. It stops looking like one on the day the approximation
      is what is being tested.
    assumes:
    - air, like water, takes the easiest path it is offered
    takeaway: A life-support fix must manage both chemical uptake and fluid flow.
    format: CHOICE
    question: Tape, a suit hose, a sock and a flight-plan cover. What must the fix get right?
    why: The fix needs both enough sorbent and a sealed flow path through it. Air that slips
      around the canister reaches the cabin unchanged. That bypass can look deceptively normal
      because the fan still runs and makes noise. Carbon dioxide is removed only from air
      that actually crosses the sorbent. A large canister with a gap around it can therefore
      perform worse than a smaller one with a tight seal. Flow path and chemical capacity
      have to work together.

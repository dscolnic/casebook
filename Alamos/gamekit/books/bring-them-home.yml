  - group: INTEG
    task: The corridor is about a degree wide. What does the room do with the time left?
    title: Protect the entry corridor
    place: Crew G-Load Console
    scene: >-
      The corridor runs from 5.3 to 7.7 degrees, and the current solution sits at 6.2 with an uncertainty of half a degree. Below 5.3 the capsule skips back out with no propellant to correct with; above 7.7 the heating and deceleration exceed what the crew and the structure survive left to return.
    takeaway: Entry safety comes from margins across plausible conditions, not perfection at one nominal point.
    format: CHOICE
    assumes:
    - a plan can be optimal and still miss
    question: The corridor is about a degree wide. What does the room do with the time left?
    choices:
    - Refine the position and velocity uncertainty before entry.
    - Model steep and shallow atmospheric scenarios.
    - Verify the heat-shield and centre-of-mass configuration.
    - Optimise the nominal entry trajectory as far as it will go.
    answer: Refine the position and velocity uncertainty before entry.
    why: >-
      The corridor is a constraint on where the vehicle actually is. So what
      decides the outcome is the uncertainty, not where the nominal trajectory
      lands: the whole distribution has to fit inside a gap about a degree wide.
      Shrinking that uncertainty is the only thing here that makes the same
      corridor easier to hit. Optimising the nominal makes the best case better
      and does nothing for the cases that miss, and those are the ones that kill
      the crew.
    rebuttals:
    - Steep and shallow atmospheres bound a variation nobody can reduce. Worth knowing; it changes what you can survive, not where you are.
    - Verifying the shield and the centre of mass is required before commitment and moves the trajectory not at all.
    - Optimising the nominal makes the best case better. The corridor is missed by the cases that are not nominal.
- title: The Structure Is Vibrating
  objective: Move the system away from resonance and verify that the mitigation works across operating conditions.
  briefing: A pump and flexible panel produce a growing oscillation near one operating speed. The player must identify resonance
    and protect the structure without disabling life support.
  stake: >-
    Ninety hours in, and a structural dynamics engineer, Chidi Okoye, caught this one — worth saying, because nothing else this week has been
    caught early. A panel starts shaking whenever a pump runs near one particular speed, and a line behind
    it has been rubbing for an hour. Mensah has the numbers ready. This shift you decide what is driving it,
    work out the structure's own natural rhythm, and stop it. Every structure has speeds it prefers, set by
    how stiff it is and how heavy. Drive it near one and small repeated pushes add into large motion, the
    way a swing answers small pushes at the right moment. So the sign is not how big the shaking is but how
    narrow: it peaks in a narrow band of pump speed and dies outside it. Change the speed and it stops. This
    is a shift where something is simply fixed.
  takeaway: Use simple harmonic motion, natural frequency, resonance, damping, forced oscillation as an evidence chain rather
    than as isolated facts.
  stops:
  - group: INTEG
    task: Which explanation fits the frequency, speed dependence, and independent accelerometers?
    title: What is driving the vibration?
    place: Structural Dynamics Lab
    scene: >-
      A structural vibration becomes severe only in a narrow band of
      reaction-wheel speed. It peaks sharply near 3,200 rpm and falls away above
      and below.
    takeaway: Resonance is diagnosed by relationships among forcing frequency, natural frequency, and response - not by amplitude
      alone.
    format: DIAGNOSIS
    rebuttals:
    - A loose sensor rattles on its own mount. A second accelerometer in a different location sees the same mode.
    - An impact is a single kick and would not care what speed the wheel is running at. The impact monitor recorded nothing.
    - Structural breakup gives large vibration across many frequencies and operating states. This is narrow-band, repeatable and reversible.
    assumes:
    - every structure has speeds at which it prefers to shake
    headline: A structural vibration becomes severe only during a narrow band of reaction-wheel speed.
    readings:
    - zone: Vibration amplitude
      label: Vibration amplitude
      value: Sharp peak near 3200 rpm
      status: alarm
      note: Falls again above and below that speed
    - zone: Measured vibration frequency
      label: Measured vibration frequency
      value: Matches known structural mode
      status: alarm
      note: Frequency alignment is repeatable
    - zone: Wheel-speed change
      label: Wheel-speed change
      value: Moving away from 3200 rpm reduces vibration
      status: alarm
      note: Immediate reversible response
    - zone: Second accelerometer
      label: Second accelerometer
      value: Sees the same mode
      status: alarm
      note: Not confined to one sensor mount
    - zone: Impact monitor
      label: Impact monitor
      value: No impulse recorded
      status: normal
      note: No evidence of a discrete strike
    choices:
    - label: Resonance driven by wheel forcing
      mechanism: A periodic forcing frequency approaches a structural natural frequency and amplifies motion.
    - label: Loose accelerometer
      mechanism: One sensor mechanically rattles while the spacecraft structure remains quiet.
    - label: One-time impact
      mechanism: A collision gives the structure an impulsive kick independent of wheel speed.
    - label: Broad structural breakup
      mechanism: Damage creates large vibration across a wide range of frequencies and operating states.
    answer: Resonance driven by wheel forcing
    why: >-
      Resonance is diagnosed by the relationship between the forcing frequency,
      the natural frequency and the response — not by how large the amplitude
      is. A structure perfectly strong at rest can fail when it is driven at a
      frequency it happens to like. Here the vibration frequency matches a known
      structural mode, the amplitude peaks in a narrow band of wheel speed, and
      moving the wheel away reduces it immediately and reversibly. A second
      accelerometer somewhere else sees the same mode, so it is the structure
      and not the sensor.
  - group: STRUCT
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
    title: Spring-mass period
    place: Spacecraft Vibration Console
    scene: >-
      A mounted component is modelled as a 4 kg mass on a 400 N/m spring. The
      analyst wants its natural period before the pump speeds are set.
    takeaway: Natural frequency emerges from inertia and stiffness.
    format: BALLPARK
    assumes:
    - a stiffer spring vibrates faster and a heavier mass vibrates slower
    why: >-
      Natural frequency comes out of inertia and stiffness alone — heavier is
      slower, stiffer is faster — and the period is one over that frequency. The
      point of the calculation is what it lets you avoid. Knowing where a
      structure's natural frequency sits tells you which operating speeds will
      drive it, and lets the pump be scheduled around it. The hardware will
      otherwise deliver the same information much more expensively, and usually
      while somebody is depending on it.
    question: Estimate the natural period.
    estimate:
      relationship: >-
        Period = 2π × the square root of (mass ÷ stiffness).
      prompt: A mounted component is modelled as a 4 kg mass on a 400 N/m spring.
      question: Estimate the natural period.
      labels:
      - 4 kg (component mass)
      - 400 N/m (mount stiffness)
      - 3,200 rpm (reaction-wheel speed)
      - 0.5 kg (the damper)
      - 10 Hz (a nearby mode)
      values:
      - 4
      - 400
      - 3200
      - 0.5
      - 10
      slots: 2
      template: 2π √({0} ÷ {1})
      formula: 2*Math.PI*Math.sqrt(a/b)
      correct:
      - 0
      - 1
      target: 0.628
      tolerance: 0.05
      units: s
      solution: T = 2π√(m/k) ≈ 0.63 s, about 1.6 Hz.
      explanation: Only inertia and stiffness set the natural frequency — heavier is slower, stiffer is faster. The wheel speed is what might drive this mode, which is the next question and not this one.
  - group: INTEG
    task: The panel oscillates whenever the pump runs near one speed. What do you do?
    title: Stop the resonance
    place: Operations Planning Room
    scene: >-
      A panel oscillates whenever the pump runs near one particular speed, and
      the amplitude has grown across three cycles. The pump is needed and the
      panel is structural.
    takeaway: A structural fix should change the dynamics and then demonstrate that the dangerous mode is controlled.
    format: CHOICE
    assumes:
    - a resonance needs both a structure and something driving it
    question: The panel oscillates whenever the pump runs near one speed. What do you do?
    choices:
    - Shift the pump's operating speed away from the measured resonance.
    - Add or restore damping at the panel.
    - Measure the response at several more locations first.
    - Drive the pump harder to pass through the band faster.
    answer: Shift the pump's operating speed away from the measured resonance.
    why: >-
      Resonance is a coincidence between a forcing frequency and a natural one,
      so only two things can be changed: the structure or the forcing. On a
      vehicle in flight the forcing is the one that can be changed now,
      reversibly, with nobody's hands on the panel. Damping is the better
      permanent fix and needs hardware and access. Passing through the band
      faster assumes the structure survives the passage, which is exactly the
      assumption three growing cycles have called into question.
    rebuttals:
    - Damping bleeds energy out of the mode and is the right permanent fix. It needs hardware, access and a crew member with their hands on the structure.
    - Measuring in more places is how you confirm the fix worked or merely moved the problem. It is the check, not the change.
    - Passing through faster assumes the structure survives the passage, which is the assumption the growing amplitude across three cycles is calling into question.
- title: Choose the Return Path
  objective: Select a return plan with explicit margins and contingencies for the dominant uncertainties.
  briefing: Several return trajectories trade fuel, time, heating, communications, and life-support consumption. The player
    must make a multi-constraint physical decision rather than optimize one variable.
  stake: >-
    Ninety-eight hours in. The correction Whitaker flew on the third shift has come back with a cost:
    tracking now says the path he chose is the expensive one, and Carter has not said anything about it,
    which is somehow worse. Four routes are on the board — fastest, least propellant, coolest entry, best
    tracking coverage — and once the burn flies most of them close. This shift you find what actually limits
    this vehicle and pick the path that survives being wrong. A plan is held back by one thing at a time:
    propellant, power, air, heat, or where the stations happen to be. Optimising against any of the others
    just moves the failure somewhere less visible. What you want is the path with something left when the
    next thing breaks.
  takeaway: Use optimization, constraints, trade spaces, margins, critical path as an evidence chain rather than as isolated
    facts.
  stops:
  - group: INTEG
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: Name the binding constraint
    place: Mission Design Center
    scene: >-
      Four return paths are on the board and each stresses a different
      subsystem. The room cannot simply take the fastest one.
    takeaway: The best physical solution is not necessarily the shortest or lowest-fuel solution.
    format: PROTOCOL
    rebuttals:
    - More days is more oxygen, more water, more scrubber capacity and more power. Consumables are the clock on a long return.
    - 'A larger burn is propellant, and it is also execution error: a bigger correction can be wrong by more.'
    - A steeper entry raises peak heating and deceleration together. Both are limits on the shield and on the crew.
    - A long blackout is time with no ground support, and it lands on crew autonomy and navigation confidence rather than on any hardware.
    assumes:
    - a spacecraft carries a fixed amount of everything it needs
    scenarios:
    - Longer return time.
    - Larger correction burn.
    - Steeper atmospheric entry.
    - Long communications blackout.
    choices:
    - Consumables and thermal survival.
    - Fuel and propulsion reliability.
    - Heating and deceleration.
    - Crew autonomy and navigation confidence.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: >-
      A trajectory is a system choice, and its effects land on subsystems that
      have nothing to do with each other. A longer return burns consumables —
      oxygen, lithium hydroxide, water, power — at a rate nobody can lower much.
      A larger correction burn spends propellant and adds the uncertainty of
      executing it. A steeper entry raises peak heating and deceleration on the
      shield and on the crew. A long blackout removes the ground at the moment
      it would be most useful. The best path is the one whose binding constraint
      the vehicle can actually meet.
  - group: INTEG
    task: Consumables are known only to within about a day. Which return do you fly?
    title: Select the robust trajectory
    place: Life-Support Desk
    scene: >-
      Four return paths: 58 hours, 71 hours, 66 hours and 63 hours, each best at something — speed, propellant, entry heating, tracking coverage. The consumables that decide between them are known only to within about a day, and the water margin is the tightest of them.
    takeaway: Robust optimization values margin and adaptability, not only nominal efficiency.
    format: CHOICE
    assumes:
    - choosing between two numbers that differ by less than their error is choosing at random
    question: Consumables are known only to within about a day. Which return do you fly?
    choices:
    - The moderate return, with balanced fuel, thermal and consumable margins.
    - The fast return, accepting narrow entry and propulsion margins.
    - The slow return, preserving fuel at the cost of life-support margin.
    - Defer the choice and hold the propellant for a later correction.
    answer: The moderate return, with balanced fuel, thermal and consumable margins.
    why: >-
      The uncertainty in the consumables is larger than the gap between the two
      fastest options. Choosing between them on nominal numbers is choosing on
      noise. Robust choice values margin and the ability to change your mind
      later, not efficiency against today's best guess. A path that is optimal
      against that guess, and infeasible if it is off by a day, is not the
      safest thing on the board. It is the one that fails first when the
      estimate moves — and it will move.
    rebuttals:
    - The fast return is optimal against an estimate carrying a day of uncertainty, and its margins are narrowest exactly where that uncertainty lands.
    - The slow return preserves propellant and spends a life-support capacity nobody has bounded. It is optimal against the wrong constraint.
    - Deferring is a rule about when to burn, not a trajectory. The vehicle is on one whether or not the choice is made.
  - group: THERM
    task: Order the commitment so the abort trigger still has something to act on.
    title: Commit to the path
    place: Thermal and Entry Review
    scene: >-
      The decision has to be made this shift, and once the burn is executed most
      of the alternatives close. Nobody has yet written down what would show the
      choice was wrong.
    takeaway: An abort trigger has to be defined while there is still propellant to act on it.
    format: SEQUENCE
    rebuttals:
    - 'Quantify the margins first: propellant, consumables, thermal, corridor width. Everything after this is arithmetic on those numbers.'
    - Compare under off-nominal conditions second. Comparing nominals ranks the candidates by the case that was never the problem.
    - Name the abort observation and its time third — before the burn. Afterwards most alternatives have closed and the trigger has nothing to act on.
    - Burn last, and keep updating the margins. Commitment is not the end of the estimate.
    assumes:
    - a decision can only be undone while the means to undo it still exist
    cards:
    - 'Quantify the margins: propellant, consumables, thermal, and the corridor width.'
    - Compare the candidates under the off-nominal cases, not the nominal one.
    - Name the observation that would show the choice was wrong, and the time it arrives.
    - Burn, and keep updating the margins against what the tracking returns.
    order:
    - 0
    - 1
    - 2
    - 3
    why: >-
      A plan is a hypothesis about future physical states, and it needs a way to
      be found wrong in time. The margins are quantified first, because they are
      what the decision is made of. The candidates are compared under
      off-nominal conditions rather than nominal ones, because the nominal case
      is the one that was never in doubt. The abort trigger is named before the
      burn — defined afterwards it is a trigger with nothing left to act on.
      Then the margins keep being updated against what the tracking returns.
- title: The Last Correction
  objective: Decide whether to burn using the expected benefit relative to navigation and propulsion uncertainty.
  briefing: Hours before entry, tracking stations disagree slightly. The player must combine measurements with correlated
    errors and decide whether another burn reduces or increases total risk.
  stake: >-
    A hundred and six hours in, and it is Carter's turn — she has been waiting four days for it. Several
    ground stations have suddenly put the spacecraft ahead of its predicted path. They agree closely, and
    they are fed from the same timing reference. Whitaker wants the burn now, on the same argument that was
    correct on the third shift. This shift you decide whether the trajectory really moved. Uncertainties
    combine in a particular way: two independent errors add to less than their sum, which is why
    independence is worth more than precision. Measurements sharing a clock, a calibration or a piece of
    software are not independent, so their agreement measures nothing. And a correction is only worth making
    if it is bigger than the error in knowing it.
  takeaway: Use random and systematic error, weighted averages, covariance, propagation, decision thresholds as an evidence
    chain rather than as isolated facts.
  stops:
  - group: NAV
    task: Which explanation fits the ranging, angle, clock, and independent-time checks?
    title: Real trajectory error or common clock drift?
    place: Global Tracking Network
    scene: >-
      Several ground measurements suddenly place the spacecraft ahead of its
      predicted path. They agree with each other, and the room is being asked to
      command a correction burn.
    takeaway: When several measurements agree, ask whether they agree independently or merely inherit the same clock, calibration,
      or model.
    format: DIAGNOSIS
    rebuttals:
    - A real trajectory change needs a force, and onboard dynamics show no unmodelled acceleration. Nothing pushed the spacecraft.
    - Independent failures do not drift in the same direction at the same moment. These channels share a clock, which is why they moved together.
    - A star tracker fault would put the angular solution in the wrong place. The angles are the measurements that agree with the prediction.
    assumes:
    - several instruments can be wrong together if they share a part
    headline: Several ground measurements suddenly place the spacecraft ahead of its predicted path.
    readings:
    - zone: Range/Doppler residuals
      label: Range/Doppler residuals
      value: Shift together
      status: alarm
      note: Both channels use the same ground time reference
    - zone: Star-angle navigation
      label: Star-angle navigation
      value: Matches predicted direction
      status: normal
      note: Independent angular geometry is stable
    - zone: Ground timing reference
      label: Ground timing reference
      value: Offset detected
      status: alarm
      note: Shared clock is late relative to an independent standard
    - zone: Reprocessed data
      label: Reprocessed data
      value: Residual largely disappears with corrected time
      status: alarm
      note: Same raw observations, new timestamps
    - zone: Onboard dynamics
      label: Onboard dynamics
      value: No unmodeled acceleration
      status: normal
      note: No physical force explains a sudden trajectory jump
    choices:
    - label: Real trajectory error
      mechanism: The spacecraft has physically moved away from the predicted path.
    - label: Common timing-reference error
      mechanism: Shared timestamps bias several derived range and velocity measurements together.
    - label: Independent sensor failures
      mechanism: Multiple unrelated instruments happen to drift in the same direction at once.
    - label: Star tracker failure
      mechanism: The angular navigation system alone is producing the bad state estimate.
    answer: Common timing-reference error
    why: >-
      When several measurements agree, the question is whether they agree
      independently or merely inherit the same clock, calibration and software.
      Correlated errors look exactly like a real signal until something outside
      the chain is consulted. Range and Doppler both use the ground time
      reference and both shifted. Star-angle navigation uses no ground clock and
      matches the prediction. The timing reference is found to be offset, and
      reprocessing the same raw observations with corrected timestamps makes
      most of the residual disappear — with no manoeuvre.
  - group: NAV
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
    title: Combine independent uncertainties
    place: Navigation Covariance Room
    scene: >-
      Two independent one-sigma position errors, 6 km and 8 km, along
      perpendicular directions. The navigation team needs a single number for
      the entry brief.
    takeaway: Independent orthogonal uncertainties combine in quadrature.
    format: BALLPARK
    assumes:
    - two errors along different directions do not simply add
    why: >-
      Independent uncertainties along perpendicular axes combine in quadrature —
      each is squared, the squares are added, and the root is taken — so the
      answer is smaller than the sum and larger than either term on its own.
      Getting it wrong matters in both directions here. Overstated uncertainty
      argues for a correction burn that is not needed and spends propellant that
      cannot be replaced. Understated uncertainty hides a corridor violation,
      and the corridor is about a degree wide.
    question: Estimate the combined two-dimensional uncertainty.
    estimate:
      relationship: >-
        Independent errors along perpendicular axes add in quadrature: the root of
        the sum of the squares.
      prompt: Two independent one-sigma position errors, 6 km and 8 km, along perpendicular directions.
      question: Estimate the combined two-dimensional uncertainty.
      labels:
      - 6 km (one-sigma, first axis)
      - 8 km (one-sigma, second axis)
      - 14 km (the two added)
      - 7 km (their average)
      - 2 (number of axes)
      values:
      - 6
      - 8
      - 14
      - 7
      - 2
      slots: 2
      template: √({0}² + {1}²)
      formula: Math.sqrt(a*a+b*b)
      correct:
      - 0
      - 1
      target: 10
      tolerance: 0.5
      units: km
      solution: √(6² + 8²) = 10 km.
      explanation: Independent errors along perpendicular axes combine in quadrature, so the total is smaller than the sum and larger than either term. Adding them is the common mistake and it overstates the uncertainty by forty per cent here.
  - group: INTEG
    task: Two stations disagree by more than either one's stated error. Do you burn?
    title: Burn or observe?
    place: Flight Director Console
    scene: >-
      Two tracking stations disagree by slightly more than either one's stated
      error. Both use the same station clock model, and a correction burn is on
      the table.
    takeaway: Corrections should reduce total uncertainty and risk, not merely move the nominal trajectory.
    format: CHOICE
    assumes:
    - agreement between two measurements means nothing if they can fail the same way
    question: Two stations disagree by more than either one's stated error. Do you burn?
    choices:
    - No — obtain one more independent, high-leverage observation.
    - Yes — execute the correction the current solution calls for.
    - No — preserve propulsion and accept the corridor as it stands.
    - No — update the entry predictions across the full covariance first.
    answer: No — obtain one more independent, high-leverage observation.
    why: >-
      Both stations share a clock model, so their agreement was never
      independent and their disagreement does not say which one is wrong. Only a
      measurement that cannot fail the same way can settle it. There is a second
      reason to wait: a correction burn carries its own execution uncertainty,
      roughly the size of the disagreement being argued about, so burning now
      would move the vehicle by about as much as the number might be wrong. A
      correction is worth making when it reduces risk, not when it moves the
      nominal.
    rebuttals:
    - A burn whose expected shift is smaller than its own execution uncertainty moves the nominal without reducing the risk, and spends propellant doing it.
    - Preserving propulsion is the consequence of not burning rather than a decision in its own right, and it leaves the disagreement exactly where it was.
    - Updating the predictions across the covariance says how bad the disagreement is. It adds no new information about which station is right.
- title: Reentry
  objective: Conduct a claim-by-claim readiness review and execute entry with predefined triggers and authority.
  briefing: 'The final minutes require every physical model and procedure to agree: attitude, center of mass, velocity, atmosphere,
    thermal shield, communications, and recovery.'
  stake: >-
    A hundred and eighteen hours in. The sequence starts in eleven minutes, four of them with no
    communications, and nothing in it can be undone. This shift you take the claims one at a time and decide
    whether this vehicle is ready. They are not equally strong: a heat shield cold for four days, a battery
    charged through a path Ferreira invented on the sixth shift, an alignment Ruiz flew by hand against
    stars, a corridor entered on Carter's independent measurement rather than on four instruments that
    agreed. Each has to be true at the same moment as all the others, and the job is to say how strongly
    each is held and on what. After the first event there are no decisions left, only things to watch. Hale,
    Ruiz and Sato have heard every word of this for five days, and today they say very little.
  takeaway: Use integrated mechanics, thermodynamics, waves, fluids, uncertainty, ethics of command as an evidence chain rather
    than as isolated facts.
  stops:
  - group: INTEG
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: Disposition final readiness
    place: Integrated Flight Room
    scene: >-
      The final go or no-go. Four claims of very different quality are in front
      of the room, and in eleven minutes the vehicle enters, the radio goes
      quiet, and nothing can be revisited.
    takeaway: Final authority should follow traceable evidence and pre-agreed criteria.
    format: PROTOCOL
    rebuttals:
    - A state inside the corridor across the modelled uncertainty is the one claim that can simply be approved — with tracking continued, because the margin is not infinite.
    - An undocumented configuration change to the heat shield is held and resolved while there is still time to hold. It is the only item here that cannot be accepted with a caveat.
    - An expected blackout with verified onboard guidance is accepted, with the procedure written down. It is a known condition, not a surprise.
    - A known station bias is corrected or excluded under the rule that was validated in advance — not argued about now, when everyone wants to go.
    assumes:
    - a decision made under pressure follows whatever rule was agreed before the pressure
    scenarios:
    - Entry state lies inside the robust corridor across modeled uncertainty.
    - Thermal-shield configuration is uncertain after an undocumented change.
    - A minor communications loss is expected but autonomous guidance is verified.
    - One tracking solution disagrees because of a known station bias.
    choices:
    - Approve the entry claim with continued tracking.
    - Hold or resolve configuration before commitment if physically possible.
    - Accept with a documented blackout procedure.
    - Exclude or correct the biased data under the validated rule.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: >-
      Readiness is granular. Some claims can be approved and others need action
      first, and giving them all one answer is how a room that wants to say yes
      ends up saying yes to everything. A state inside the corridor is approved,
      with tracking continued. An uncertain shield configuration is held while
      holding is still possible. An expected blackout with verified onboard
      guidance is accepted, with the procedure written down. A known station
      bias is corrected under the rule agreed beforehand.
  - group: INTEG
    task: Order the entry around the four minutes with no communications.
    title: Execute the final physical chain
    place: Crew Capsule
    scene: >-
      Everything the last five days established comes down to the next eleven
      minutes, four of them with no communications at all. The order cannot be
      repeated.
    takeaway: >-
      Entry is ordered by the blackout: whatever needs the ground has to be
      settled before it starts.
    format: SEQUENCE
    rebuttals:
    - Attitude and configuration first, before the interface. Nothing here can be changed through four minutes of silence.
    - Commit with the onboard and ground roles already unambiguous. Deciding who is flying is not something to work out during the blackout.
    - Monitor deceleration and heating against the envelope third. It cannot begin before entry, because there is nothing to compare against yet.
    - Descent and recovery last, preserving the record. It is the only flight that will ever produce this data.
    assumes:
    - you cannot fix from the ground what happens while the radio is quiet
    cards:
    - Set the approved attitude and configuration, because nothing can be changed through the blackout.
    - Commit to the interface with the onboard and ground roles already unambiguous.
    - Monitor deceleration and heating against the predicted envelope.
    - Transition to descent, preserving the record of what the envelope actually did.
    order:
    - 0
    - 1
    - 2
    - 3
    why: >-
      The order is forced by the blackout. Attitude, configuration and the
      approved state estimate are set before the atmospheric interface, because
      there is no way to change any of them once the radio goes quiet. The roles
      of the onboard system and the ground are made unambiguous before
      commitment, for the same reason. Monitoring deceleration and heating
      against the predicted envelope cannot start earlier, because there is
      nothing yet to monitor. And the transition to descent preserves the
      record, because this flight will only happen once.
  - group: NAV
    task: The review board convenes on Monday. What does the programme commit to?
    title: Fund the mission legacy
    place: Entry Tracking Network
    scene: >-
      The crew is aboard the recovery ship and the review board convenes on Monday. Four proposals for three funded slots: the tank redesign, a second telemetry path, a full-duration thermal test article, and a simulator upgrade built from this flight's own data.
    takeaway: The scientific obligation after a crisis is to learn from every discrepancy, not only the successful outcome.
    format: CHOICE
    assumes:
    - a fix that removes a cause outlasts a fix that improves the response
    question: The review board convenes on Monday. What does the programme commit to?
    choices:
    - Redesign the common-mode electrical and sensor dependencies.
    - Preserve the complete telemetry, configuration and decision logs.
    - Improve simulation and crew rehearsal for degraded modes.
    - Record the outcome as a success and close the anomalies.
    answer: Redesign the common-mode electrical and sensor dependencies.
    why: >-
      The failure that started this was three pressure readouts sharing one
      reference circuit, and the near-miss at the end was two tracking stations
      sharing one clock. The same shape twice, five days apart. Redesigning
      those common-mode dependencies is the only proposal here that removes a
      cause rather than improving the response to it. A programme learns from
      the discrepancies it recorded, and closing them as one-offs keeps every
      dependency that produced them for the next crew to inherit.
    rebuttals:
    - Preserving telemetry and decision logs is what makes any reconstruction possible, and it should be finished before Monday rather than funded after it.
    - Rehearsal for degraded modes improves how the next crew survives the same fault. Valuable, and it accepts the fault.
    - Closing the anomalies as one-offs keeps every dependency that produced them, and the next mission inherits all of it.
# --------------------------------------------------------------- the rooms
# What is inside each back room, and what its console reads. Keyed by group.
interiors:
  NAV:
    caption: A state estimate that cannot predict the next observation is a number, not a position.
    standLine: Range from one station, two bearings ninety minutes apart, and a Doppler trace in a different time standard.
    station:
      kind: panel
      title: Guidance console
      rows:
        - { label: Last good state, value: 04:12 GET, status: normal }
        - { label: Tracking gap, value: 96 min, status: alarm }
        - { label: Residual, value: 4.1 km, status: high }
  ELEC:
    caption: Power is a rate. Endurance is what the inventory divided by that rate buys you.
    standLine: Fuel cells gone, entry batteries carrying loads they were never budgeted for.
    station:
      kind: vitals
      title: Main bus B
      rows:
        - { label: Usable energy, value: 18 kWh, status: low }
        - { label: Essential load, value: 3.0 kW, status: alarm }
        - { label: Bus voltage, value: 26.4 V, status: normal }
  THERM:
    caption: The cabin cools whether or not anybody is watching the number.
    standLine: Condensation on the panels, four degrees and falling, crew sleeping in suits.
    station:
      kind: vitals
      title: Cabin environment
      rows:
        - { label: Cabin temperature, value: 4.2 C, status: alarm }
        - { label: CO2 partial pressure, value: 13 mmHg, status: alarm }
        - { label: Cabin pressure, value: 5.0 psia, status: normal }
  COMMS:
    caption: A link budget is arithmetic. Which term broke it is evidence.
    standLine: Carrier down twelve decibels and drifting, with attitude, range and antenna schedule all changed.
    station:
      kind: panel
      title: Downlink
      rows:
        - { label: Carrier level, value: -12 dB, status: alarm }
        - { label: Doppler residual, value: 30 Hz, status: high }
        - { label: Ground antenna, value: 64 m, status: normal }
  STRUCT:
    caption: A structure fails at the frequency you are driving it at, not the one on the drawing.
    standLine: A panel oscillating whenever the pump runs near one speed, and one accelerometer watching it.
    station:
      kind: panel
      title: Vibration
      rows:
        - { label: Peak response, value: 0.9 g, status: alarm }
        - { label: Pump speed, value: 3050 rpm, status: high }
        - { label: Damping, value: not measured, status: low }
  INTEG:
    caption: Every call here is made on numbers somebody else measured, late.
    standLine: One anomaly log, six back rooms, and a crew who can hear the loop.
    station:
      kind: panel
      title: Flight director loop
      rows:
        - { label: Open calls, value: 3, status: alarm }
        - { label: Consumables, value: 89 h, status: high }
        - { label: Entry interface, value: 62 h, status: normal }

copy:
  NAV: <p>Guidance. Where the spacecraft is, how fast, and how much of that is actually known.</p>
  ELEC: <p>Electrical systems. Every watt aboard is drawn from an inventory that is not being refilled.</p>
  THERM: <p>Thermal and life support. Heat, gas and water — the three things a cabin runs out of.</p>
  COMMS: <p>Communications. Everything known about the vehicle arrives through this room.</p>
  STRUCT: <p>Structures and dynamics. Rotation, vibration and the loads a spacecraft was built to take.</p>
  INTEG: <p>Mission operations. Six rooms report here and one person decides.</p>
  SIGNIN: <p>Badge and sign-in. Nobody reaches the operations floor without appearing on this sheet.</p>
  GALLERY: <p>The viewing gallery. Off-shift controllers wait out a burn here rather than at home.</p>
  QUIET: <p>The crew family room. Kept staffed, and kept away from the loop.</p>
  LIBRARY: <p>The trajectory library. Every plot, every burn, every version that was superseded.</p>

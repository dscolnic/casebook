    takeaway: Attitude control is Newtonian mechanics around a center of mass.
    format: PROTOCOL
    why: Attitude control is Newtonian mechanics about a centre of mass. Torque grows with
      force and with the lever arm from that centre. The same torque produces less angular
      acceleration when the moment of inertia is larger. Equal and opposite torques applied
      for equal times cancel the net angular impulse. Internal mass motion can change how
      fast different parts rotate, but it cannot change the vehicle's total angular momentum
      without an external torque. Those four rules set the logic of every manual turn.
    columns:
    - What you change
    - What happens to the rotation
    rebuttals:
    - The same force farther from the centre of mass is a longer lever arm and therefore a
      larger torque. This is the term the crew can actually choose.
    - The same torque on a larger moment of inertia gives less angular acceleration. Harder
      to start, and equally hard to stop.
    - Equal and opposite torques for equal times cancel the net angular impulse, which is
      what a start pulse and a stop pulse are for.
    - Moving internal mass with no external torque redistributes the rotation and conserves
      the total. Nothing inside the vehicle can change it.

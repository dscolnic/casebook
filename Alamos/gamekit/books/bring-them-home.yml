    format: CHOICE
    assumes:
    - slowing a loss and replacing it are different things
    question: Four degrees and falling, on a fixed energy budget. What do you spend it on?
    choices:
    - Insulate the crew zone and the critical batteries.
    - Schedule short circulation periods to limit gradients.
    - Heat the whole spacecraft continuously at a low level.
    - Monitor temperature at several representative locations.
    answer: Insulate the crew zone and the critical batteries.
    why: >-
      Insulation slows the heat leaving. It does not replace the heat that left.
      That makes it the only option here whose benefit does not stop when the
      energy does. Putting it on the crew zone and the critical batteries spends
      a fixed budget where being cold costs most — and cold batteries deliver
      less than the plan assumes, so the energy problem starts feeding itself.
      Thermal survival is an allocation across space, time and consequence, not
      one setting.
    rebuttals:
    - Short circulation periods limit the gradients that drive condensation and cost power every time they run. Worth doing; not what keeps anybody alive.
    - Heating the whole vehicle spends the budget on volume nobody is in, and the loss scales with the surface it is heating.
    - Monitoring is how you find out whether any of this worked. It warms nothing.
- title: The Air Problem
  objective: Develop a safe temporary air-cleaning and circulation strategy using only validated physical principles and monitored
    limits.
  briefing: Carbon dioxide removal is failing, and pressure readings differ between compartments. The player must connect
    gas laws, partial pressure, fluid flow, and filter resistance.
  stake: >-
    Fifty-eight hours in. Carbon dioxide is climbing in a cabin built for two and holding three. The life support engineer, Petra Novak, has been on the loop with the crew for an hour, and the canisters that fit are aboard the module they cannot
    use. The scrubber fan still draws its rated current, which Brooks refuses to accept as good news. Today
    you find out why the air is not being cleaned, work out how fast three people fill a cabin, and build
    something out of what is aboard. Removal is a rate, set by the chemistry that takes the gas up and by
    the air actually reaching it. A fan at rated current only proves the motor is turning; against a blocked
    path it moves almost nothing and sounds exactly right. Hale has started making small mistakes reading
    numbers back. That is the first symptom, and he cannot notice it himself.
  takeaway: Use ideal gases, partial pressure, flow resistance, pressure difference, filtration as an evidence chain rather
    than as isolated facts.
  stops:
  - group: INTEG
    task: Which explanation fits the gas, pressure, flow, and electrical readings together?
    title: Diagnose the air system

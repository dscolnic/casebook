  - title: A Dangerous Battery Configuration
    objective: Approve only a configuration whose voltage, current sharing, and failure behavior are understood.
    briefing: Engineers propose reconnecting battery modules, but a mismatched module could overheat or reverse-charge. The player must reason through series, parallel, internal resistance, and fault isolation.
    stake: 42 hours in. The electrical load officer, Ana Ferreira, has found a battery module on the damaged bus that would buy 11 hours, and Shah wants it connected before the next pass. Nobody knows its state of charge, and the connectors were never meant for this. Ferreira has already reported one connector on that bus running warm and cannot say why. This shift you decide whether that configuration is safe and what has to be measured first. Shah is counting the hours and Brooks is counting the people. Sealed cabin. Three of them. 11 hours is not worth a fire.
    takeaway: Use series circuits, parallel circuits, internal resistance, Joule heating, fault isolation as an evidence chain rather than as isolated facts.
    stops:
      - group: ELEC
        task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used once.
        title: Series or parallel?
        place: Battery Test Bench
        scene: Engineers want to reconnect battery modules to buy hours of endurance. The room agrees what each wiring choice does before anything is bolted up, because adding a module can also take capability away.
        assumes:
          - a battery has both a voltage and a current it can supply
        takeaway: Redundancy is useful only when connection and protection behavior are explicit.
        format: PROTOCOL
        why: Circuit topology determines voltage, current sharing, and fault behavior. Equal cells in series add voltage while carrying the same current. One open cell can therefore break the whole series path. Equal cells in parallel keep about the same voltage and share the current. That arrangement can add useful capacity. A resistive parallel branch carries less than its share, forcing the other branches to carry more. Redundancy only helps when the connection and protection rules prevent one fault from defeating the whole arrangement.
        columns:
          - What you change
          - What happens
        rebuttals:
          - Cells in series add their voltages. The current is the same everywhere in the string, so nothing is gained in capacity.
          - Cells in parallel hold the voltage and add current capacity. This is how you get more amp-hours without changing the bus.
          - A resistive parallel branch carries less than its share, and the remaining branches carry more than theirs. Unequal sharing is how one branch overheats.
          - One open cell in series interrupts the entire path. In parallel the same failure loses one branch; in series it loses everything.
        scenarios:
          - Add equal cells in series.
          - Add equal cells in parallel.
          - One parallel branch gains resistance.
          - One series cell opens.
        choices:
          - Total voltage increases.
          - Current capacity can increase while voltage stays similar.
          - That branch carries less current and sharing becomes unequal.
          - The entire series path is interrupted.
        mapping: [0, 1, 2, 3]
      - group: ELEC
        task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
        title: Heating at a bad connection
        place: Electrical Integration Room
        scene: A connector in the improvised battery path develops 0.05 ohms while carrying 20 amps. The joint is inside a sealed cabin. The power team needs its heating rate before the hardware is approved.
        assumes:
          - a resistance carrying current turns electrical power into heat
        takeaway: Small resistances matter when current is large because heating scales with current squared.
        format: BALLPARK
        question: Estimate the heating power at the connection.
        why: Resistive heating is current squared times resistance, so the current term dominates. The same connector at half the current would give off a quarter of the power. The resistance sounds like nothing written down. The wattage it makes at this current is what decides whether the junction runs warm or starts a fire. 20 watts is nothing spread over a radiator. It is a great deal in one connector, in a sealed cabin, with no air moving over it.
        estimate:
          relationship: Power dissipated = current² × resistance.
          prompt: A connector in the improvised path develops 0.05 ohms while carrying 20 amps.
          question: Estimate the heating power at the connection.
          labels:
            - 20 A (current through the joint)
            - 0.05 Ω (joint resistance)
            - 28 V (bus voltage)
            - 0.5 Ω (resistance of the whole cable run)
            - 10 A (half the current)
          values: [20, 0.05, 28, 0.5, 10]
          slots: 2
          template: "{0}² × {1}"
          formula: a*a*b
          correct: [0, 1]
          target: 20
          tolerance: 2
          units: W
          solution: P = I²R = 20 W, in a joint the size of a thumbnail.
          explanation: "The bus voltage is the wrong term: the power lost in a series joint depends on the current through it and the voltage across it, not the voltage of the system it sits in. Current enters squared, so the same joint at 10 A would dissipate a quarter as much."

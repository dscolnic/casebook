      Infrared exchange between warm objects and a cold wall is radiation, which needs no
      material medium. A metal strut carrying heat into colder structure is conduction through
      a solid. Naming the pathway matters because insulation, circulation, reflective surfaces,
      and thermal isolation act on different mechanisms. A useful fix starts by identifying
      which pathway is actually carrying the energy away.
    columns:
    - What is happening in the cabin
    - Which mechanism that is
    rebuttals:
    - Bodies in direct contact exchange heat by conduction. It is short-range and it needs
      touching.
    - 'Air carrying warmth around the cabin is convection: the heat rides on moving fluid
      rather than passing through it.'
    - A cold wall absorbing infrared from warmer objects is radiation. It works across a vacuum
      and needs nothing in between.
    - A metal strut to external structure is conduction along a solid path, straight to a
      sink. It is the leak that never stops.
    scenarios:
    - Crew huddle and share direct contact.
    - Air circulation moves heat around the cabin.
    - A cold wall receives infrared energy from warmer objects.
    - A metal strut conducts heat to an external structure.
    choices:
    - Conduction between bodies.
    - Convection or forced air transport.
    - Radiation.
    - Conduction through a solid path.
    mapping:
    - 0
    - 1
    - 2
    - 3
    reason: The right heat fix depends on how heat is escaping.
    concept: 'Heat transfer: conduction, convection, radiation'
  - group: INTEG
    task: Four degrees and falling, on a fixed energy budget. What do you spend it on?
    title: Keep the cabin survivable
    place: Materials and Insulation Shop
    scene: The cabin is near 4°C, and water is forming on the walls. There is not enough power
      to heat the whole ship. Protect the parts that matter most.
    guide: All four options are ways to spend a fixed energy budget. Ask of each whether it
      slows the loss or replaces energy already gone. Insulation does the first and cannot
      do the second. Then ask where cold costs most. Cold batteries deliver less usable energy,
      so a thermal problem becomes a power problem. The crew is asleep in their suits at four
      degrees.
    background:
    - Why the wrong options are the interesting ones. Each distractor is written to be the
      answer under one specific misreading. A step skipped. A quantity confused with a rate.
      A correlation taken for a cause. Identifying which misreading each belongs to is where
      the learning is; the right answer alone can be reached on instinct and teach nothing.
    - Why the shape of an option tells you nothing. A correct answer collects the qualifying
      clause and the unit. So across a whole game the key used to be the longest option far
      more often than chance. Here it ran to 88 per cent of passage quizzes, before it was
      fixed. It is now checked per game as a binomial tail, so length, hedging and specificity
      have had the signal taken out of them deliberately.
    - What the verdict adds. Every wrong option carries its own rebuttal, and the verdict
      prints them — the reason that option fails, not a restatement of the right one. They
      are worth reading after a correct answer as well. A right choice made for an approximate
      reason looks exactly like a sound one. It stops looking like one on the day the approximation
      is what is being tested.
    takesAsRead:
    - Newton's laws and free-body reasoning
    assumes:
    - slowing a loss and replacing it are different things
    takeaway: Thermal survival is an allocation problem across space, time, and consequence.
    format: CHOICE
    question: Four degrees and falling, on a fixed energy budget. What do you spend it on?
    why: Insulation slows heat loss; it does not replace energy that has already left. That
      makes insulation valuable when the power budget is fixed. Put it around the crew zone
      and critical batteries, where cold has the largest consequence. Cold batteries also
      deliver less usable energy, so a thermal problem can become a power problem. Heating
      the whole vehicle spends scarce energy on empty volume and exterior surface. Thermal
      survival is therefore an allocation across space, time, and consequence.
    choices:
    - Insulate the crew zone and the critical batteries.
    - Spend the remaining energy on brief whole-cabin reheating cycles.
    - Run cabin circulation continuously to keep every location at the same temperature.
    - Concentrate heating on the electronics bay and let the crew rely on suits.
    answer: Insulate the crew zone and the critical batteries.
    rebuttals:
    - Whole-cabin reheating replaces lost energy but does little to slow the next loss. The
      same power has to be spent again each cycle.
    - Continuous circulation reduces temperature gradients but costs power continuously and
      does not reduce heat leaving the spacecraft.
    - Protecting electronics alone preserves hardware while the crew zone and batteries continue
      to cool. The survival constraint is broader than one bay.
    reason: The last heater time must protect people and entry power.
  - group: THERM
    task: Hold the cabin while the crew works.
    title: Cabin pressure, through the work period
    place: Environmental Console
    scene: The crew works in the middle cabin while an airlock cycles. A scrubber starts,
      and an old leak stays on the log. Track which change moves the pressure.
    guide: Hold the cabin pressure inside the band on the console. The band narrows through
      the work period. The crew are moving toward the module with the suspect seal. A margin
      that was comfortable at the start is not comfortable there. The makeup valve is your
      control.
    background:
    - 'Why a leak is not a step. A leak is a rate: the cabin loses gas for as long as the
      hole is open, so the pressure keeps falling and does not settle anywhere. That is why
      a cabin with a small leak is held rather than corrected.'
    - Why the airlock and the scrubber are different in kind. Cycling the airlock takes a
      volume of gas out once. The scrubber changes what the cabin is doing continuously. Both
      show up on the same gauge and want different answers.
    - Why the margin matters more later. Everything the crew are doing is reversible except
      being in the wrong module when the pressure goes. The band narrows because the cost
      of the same excursion rises as they move.
    assumes:
    - a sealed volume loses pressure if gas escapes from it
    takeaway: A leak is a rate, so it is answered by a setting rather than by a correction.
    format: HOLD
    question: Hold the cabin inside the band through the work period.
    answerText: Inside the band for most of the period, with the makeup valve set to match
      the leak rate rather than opened after the pressure has already fallen.
    why: 'A leak is a rate, and everything about handling one follows from that. The cabin
      loses gas for as long as the hole is open. So the pressure keeps falling and never settles.
      A valve opened once and closed again buys a few minutes and changes nothing. What works
      is setting the makeup flow to match the loss and leaving it there. That is also what
      makes the leak measurable: the flow you need to hold steady is the leak rate. The ground
      needs that number to decide whether the module can stay in use. The airlock is the opposite
      case. Cycling it removes a fixed volume once, so it wants a correction rather than a
      new setting.'
    hold:
      quantity: Cabin pressure
      unit: kPa
      control: Makeup valve
      hold: 101
      band: 0.4
      narrowTo: 0.2
      duration: 45
      direction: raise
      authority: 0.1
      pass: 0.8
      hint: A leak keeps leaking. Set the valve to match it rather than correcting after the
        gauge moves.
      disturbances:
      - label: Suspect seal opens up a little
        at: 4
        amount: -0.03
      - label: Scrubber comes on line
        at: 20
        amount: 0.05
      - label: Sample airlock cycles
        at: 38
        amount: -0.045
      commit: Report the period
    reason: The crew needs stable air while they build the filter fix.
- title: The Air Problem
  objective: Develop a safe temporary air-cleaning and circulation strategy using only validated
    physical principles and monitored limits.
  briefing: Carbon dioxide is rising even though the scrubber fan runs. Find the blocked air
    path and build a safe fix.
  stake: Shift 8. Carbon dioxide is rising even though the scrubber fan sounds normal. The
    spare filters do not fit, and the crew is starting to make small mistakes. You must find
    the blocked flow and force cabin air through a working filter.
  takeaway: Use ideal gases, partial pressure, flow resistance, pressure difference, filtration
    as an evidence chain rather than as isolated facts.
  stops:
  - group: INTEG
    task: Trace the air path from the cabin through the scrubber loop. Put the links in order,
      then name the link that governs how much carbon dioxide reaches the sorbent.
    title: Diagnose the air system
    place: Life-Support Laboratory
    scene: Carbon dioxide keeps rising. The fan sounds normal and draws normal power, but
      little air crosses the filter. Use the pressure readings to find the block.
    guide: Build the path the air takes, in order, and then name the link where it becomes
      limiting. The fan sounds normal and draws its usual current, which tells you the fan
      is working. Pressure on both sides of the filter and the bed is what locates the restriction,
      so read those rather than trusting the sound.
    background:
    - Why a working fan and low flow means a restriction. A fan draws current according to
      how much air it is actually moving. A fan meeting a blockage moves less air, works less
      hard, and sounds entirely normal. So the current reading is evidence that the fan is
      fine, not that the system is.
    - What a pressure difference across a component tells you. Flow through a restriction
      costs pressure. A large drop across the filter with a small one across the bed says
      the filter is the restriction, and the reverse says the bed is. That is the measurement
      that separates two very different repairs.
    - Why carbon dioxide is the clock. It rises whenever removal is slower than production,
      and the crew's symptoms begin well before the level is dangerous. The chain has to be
      diagnosed while everyone can still think clearly, which is the real deadline.
    assumes:
    - a running motor does not guarantee useful flow
    - air must pass through every required link in a closed loop
    takeaway: A transport chain is limited by the required link that most restricts the quantity
      moving through it.
    format: CHAIN
    question: Where does the air-transfer chain become limiting?
    chain:
      hint: Put the air-transfer links in physical order. Then use the observed flow and pressure
        pattern to name the one required link that governs the entire loop.
      links:
      - id: intake
        label: Cabin intake
        transfers: cabin air into the loop
        reading: intake open
      - id: fan
        label: Scrubber fan
        transfers: pressure rise to the moving air
        reading: normal current and sound
      - id: filter
        label: Filter section
        transfers: air through the particulate barrier
        reading: large pressure drop across this section
      - id: sorbent
        label: CO2 sorbent bed
        transfers: carbon dioxide from air into sorbent
        reading: bed installed
      - id: return
        label: Return duct
        transfers: treated air back to the cabin
        reading: duct open
      distractor: fan
      order:
      - intake
      - fan
      - filter
      - sorbent
      - return
      governing: filter
    answerText: The filter is the governing link.
    why: The fan supplies the pressure difference that can move air, but every downstream
      restriction decides how much flow that pressure can produce. Normal motor current therefore
      proves only that the fan is powered. It does not prove that cabin air reaches the sorbent.
      A large pressure drop across one link, paired with low total airflow, identifies the
      bottleneck. Because every carbon dioxide molecule must cross that link before reaching
      the scrubber, the whole loop performs at the rate that restriction allows.
    headline: Cabin carbon dioxide rises even though the scrubber fan still draws power.
    reason: A powered fan cannot clean air that does not flow.
  - group: THERM
    task: Use the values shown. Write the equation and give a rounded answer with units.

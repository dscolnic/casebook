    why: >-
      Voltage, current and heat are three views of one energy picture, and
      reading them together locates the fault instead of guessing at it. A
      resistance in the path drops voltage in proportion to the current through
      it, and dissipates the lost power as heat exactly where the resistance is
      — which is what the hot junction is. Generation is healthy, because array
      current is normal. Nothing new is being drawn, because the total load is
      near plan. What is left is the path between them.

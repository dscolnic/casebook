    falling, condensation is running down the walls, and Ruiz has stopped being able to write legibly. Today
    you work out how fast the vehicle is losing heat, decide which way it is leaving, and choose what to
    insulate. Heat goes three ways: by conduction through whatever touches something colder, by air carrying
    it, and by radiation into space, which needs no contact at all. Each is fought differently and there is
    power for one. Average temperature is also the wrong number. Batteries fail at their own local
    temperature, and the coldest spot in that cabin is the wall behind the pack the entry sequence depends
    on. Brooks is arguing for the crew, Shah for the batteries, and they want the same watts.
  takeaway: Use heat capacity, conduction, convection, radiation, energy balance as an evidence chain rather than as isolated
    facts.

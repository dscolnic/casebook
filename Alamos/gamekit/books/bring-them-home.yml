      - 0.5 (cosine of 60°)
      values:
      - 3
      - 200
      - 1.5
      - 30000
      - 0.5
      slots: 2
      template: '{0} × {1}'
      formula: a*b
      correct:
      - 0
      - 1
      target: 600
      tolerance: 40
      units: N m
      solution: τ = rF = 600 N m, with the force at right angles.
      explanation: Torque is force times lever arm times the sine of the angle between them, and at right angles that last factor is one — which is why it does not appear. The lever arm has to be measured to the centre of mass, not to whatever structure is nearest.
- title: The Power Budget
  objective: Build a load-shedding plan that preserves essential functions through the next critical maneuver.
  briefing: Fuel cells and batteries are degraded. Every electrical load now competes with guidance, communications, thermal
    control, and life support.
  stake: >-
    Thirty-four hours in, and the argument changes shape. Priya Shah, who runs the power systems, has the reserve down to hours and wants
    everything non-essential off by the end of the shift. Aaron Brooks, on thermal and life support, says the two things on his list are the scrubber fan and the cabin heaters, and that his crew are already sleeping in everything they own. The
    bus is sagging at 24 volts instead of 28 while the current sits near where it should be, which is Shah's
    other problem. This shift you work out how long the batteries last, decide why the voltage is low, and
    choose what goes off. Power is voltage times current; energy is power times time; and an honest budget
    lists every load and how long it runs. Voltage low while current looks normal points at resistance in
    the path, eating the difference and turning it into heat somewhere.
  takeaway: Use current, voltage, resistance, electrical power, energy budget as an evidence chain rather than as isolated
    facts.
  stops:
  - group: ELEC
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
    title: How long can the battery last?
    place: Electrical Systems Room
    scene: >-
      The fuel cells are gone and the crew is on entry batteries days earlier
      than any plan allowed for. The flight surgeon wants an endurance number
      before the next powerdown decision.

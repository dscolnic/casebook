    why: >-
      Wavelength is the speed of light divided by frequency, which makes this a
      single division — and it is the first term in everything that follows.
      Beam width goes roughly as wavelength divided by aperture, so a longer
      wave from the same dish gives a wider, more forgiving beam, and a shorter
      one gives a narrow beam that demands accurate pointing. Every tolerance
      the team quotes for the rest of the shift starts from this number.
    question: Estimate the wavelength.
    estimate:

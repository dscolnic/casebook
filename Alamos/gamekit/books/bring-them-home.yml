- title: Communication Fades
  objective: Restore a reliable low-bandwidth link and use the signal itself as a navigation
    measurement.
  briefing: The radio fades when the ship turns. Find the cause, restore the link, and save
    the tracking signal.
  stake: Shift 9. The radio loses 12 decibels when the ship turns. Ito, the communications
    lead, must tell a bad sender from a bad aim. You must restore the link before it is needed
    to guide the next burn.
  takeaway: Use waves, frequency, wavelength, inverse-square behavior, Doppler effect as an
    evidence chain rather than as isolated facts.
  stops:
  - group: COMMS
    task: Change one link condition at a time, measure received power. Reverse the change.
      Identify the cause only when the signal follows the change both ways.
    title: Why did the signal fade?
    place: Deep-Space Antenna
    scene: 'Voice and telemetry drop about twelve decibels at both ground stations whenever
      the ship turns. The spacecraft transmitter output is nominal. Three things can be tested
      without committing the mission: the antenna pointing, the redundant transmitter chain,
      and a backup receiver path.'
    guide: The number you are watching is the received signal strength, currently about twelve
      decibels low at both stations. Each test swaps or corrects one part of the path without
      committing the mission. A response counts only if it is larger than the noise on the
      link. Two stations failing together already narrows what can be common to both. Run
      one test, undo it, and name the part the fade follows.
    background:
    - Why two stations at once is the clue. The two ground stations are on opposite sides
      of the Earth, with separate receivers, separate crews and separate weather. A fault
      in one of those cannot show up at the other. So anything that explains both has to be
      common to both. That means the spacecraft end, or the geometry between them.
    - What twelve decibels means. Decibels are a ratio on a logarithmic scale. Three of them
      is about half the power. Ten is a tenth, and twelve is about one sixteenth of the power
      arriving. That is the difference between voice you can work with and voice you cannot,
      which is why the number matters more than it sounds.
    - Why every test is reversible here. There is a crew aboard, so a test that cannot be
      undone is not a test but a decision. The pointing correction, the redundant transmitter
      chain and the backup receiver path were chosen because each can be tried and put back.
      That is what makes the reversal half of the method available at all.
    takesAsRead:
    - Kinematics
    assumes:
    - decibels add gains and losses on a link budget
    - a causal test changes one condition while the others stay fixed
    takeaway: A reversible one-variable test can separate a causal fault from conditions that
      merely occur at the same time.
    format: CONTROL
    question: Which reversible change makes the twelve-decibel drop in received carrier power
      appear and disappear?
    control:
      hint: Run one reversible test at a time. A cause has to produce a response larger than
        the noise and reproduce that response when the change is reversed.
      baseline: -12
      noise: 0.2
      variables:
      - id: receiver_path
        label: Ground receiver path
      - id: tx_chain
        label: Spacecraft transmitter chain
      - id: pointing
        label: Antenna pointing correction
      reversalRequired: true
      acceptResponseDb: 0.6
      observable:
        label: received power db relative
      response: 11
      truth: pointing
    answerText: The antenna pointing is the cause.
    why: Several things can weaken a radio link, but a causal test asks whether the signal
      follows one controlled change. Swapping to a backup ground receiver changes almost nothing,
      so the fade is not local to one receiver. Swapping transmitter chains at the same output
      also changes almost nothing. Correcting the antenna pointing restores nearly all the
      missing power. Reversing that pointing change brings the loss back. That two-way response
      ties the fade to antenna geometry rather than to coincidence.
    headline: Voice and telemetry suddenly become weak.
    reason: The next burn needs both a voice link and tracking data.
  - group: COMMS
    task: Use the values shown. Write the equation and give a rounded answer with units.
    title: Wavelength of the radio link
    place: Communications Analysis Room
    scene: The link is fading, and the pointing model needs the carrier wavelength. The ship
      transmits at 2.0 gigahertz. Both ground stations are watching the received power, so
      the beam width matters.
    guide: 'Five numbers, and three of them are traps. One is the carrier misread as megahertz.
      One is the speed of sound. One is the observed loss. Ask of each whether it belongs
      to this wave at all. And note what the answer feeds: the beam width scales with wavelength
      over aperture, so this number sets how forgiving the pointing can be.'
    background:
    - Why an estimate rather than a calculation. Every quantity on this board is already measured
      or stated, so nothing here has to be derived. Two things are being tested. Can you pick
      the quantities the relationship actually needs? And does the size of the answer look
      right once they are in place?
    - Why the tiles carry labels. A bare number cannot be checked against the relationship
      it is going into. Reading the label is how a unit mismatch is caught before the tile
      is placed. It is also how you catch a quantity that belongs to a different part of the
      problem. That habit is what this format exists to build.
    takesAsRead:
    - Kinematics
    assumes:
    - frequency and wavelength are two descriptions of one wave
    takeaway: Frequency and wavelength are reciprocal descriptions of the same propagating
      wave.
    format: BALLPARK
    question: Estimate the wavelength.
    why: Wavelength is wave speed divided by frequency. At 2.0 gigahertz, the radio wavelength
      is about 0.15 metre. That number also sets the scale of the antenna beam. For a fixed
      dish size, beam width is roughly proportional to wavelength divided by aperture. A longer
      wavelength gives a wider, more forgiving beam. A shorter wavelength gives a narrower
      beam and demands better pointing. The calculation is simple, but it feeds directly into
      the pointing tolerance used for the link.
    estimate:
      relationship: Wavelength = speed of light ÷ frequency.
      prompt: The carrier is at 2.0 gigahertz, and beam width scales with wavelength over
        aperture.
      question: Estimate the wavelength.
      labels:
      - 3.0e8 m/s (speed of light)
      - 2.0e9 Hz (carrier frequency)
      - 2.0e6 Hz (the carrier, misread as megahertz)
      - 343 m/s (speed of sound)
      - 12 dB (the observed loss)
      values:
      - 300000000
      - 2000000000
      - 2000000
      - 343
      - 12
      slots: 2
      template: '{0} ÷ {1}'
      formula: a/b
      correct:
      - 0
      - 1
      target: 0.15
      tolerance: 0.015
      units: m
      solution: λ = c/f = 0.15 m.
      explanation: A factor of 1000 in the frequency is a factor of 1000 in the wavelength,
        and a 150-metre wave would need an antenna nobody could fly. Reading the exponent
        is most of this calculation.
    reason: Wavelength sets how sharply the antenna must point.
  - group: STRUCT
    task: Put the four cards in order. Start with the step that must happen first.
    title: Recover the weak link
    place: Spacecraft Attitude Console
    scene: The radio is weak and its pitch is moving. The crew can barely hear the ground.
      Put the checks in the order that can restore the link.
    guide: 'All four steps will be taken, so ask which buys the most for the least. Pointing
      is the largest term in the link budget and costs nothing but attitude. Narrowing the
      bandwidth buys signal without touching the spacecraft. And one of these four is not
      a recovery action at all: it is what the recovered data are then used for.'
    background:
    - 'Why the order is graded whole. A sequence is a claim about dependency: each step is
      here because the one before it has already happened, or has to have. One transposed
      pair falsifies that claim wherever it sits, so partial credit would be credit for a
      sequence that does not work.'
    - Why the ends are the place to start. The first and last cards have nothing before or
      after them. That constraint usually makes them the two you can settle from the scene
      alone. Pinning them collapses the remaining arrangements sharply, and what is left in
      the middle is where the actual judgement lives.
    - What the rail can be ordered on. Time is the usual axis, but it is not the only one.
      An order can run on cost, on risk, or on reversibility — every observation that leaves
      the sample as it was, before any that consumes it. On those boards a chronological reading
      finds nothing, because none of the steps has to happen at a particular hour.
    takeaway: Communication recovery joins wave physics, control, and estimation.
    format: SEQUENCE
    rebuttals:
    - Attitude and antenna geometry first. Pointing is the largest term in the budget and
      the cheapest one to fix.
    - 'Lower rate and narrower bandwidth second: less noise in the channel, and a slower signal
      needs less power to read.'
    - Large ground antennas with predicted Doppler third. The signal has drifted in frequency,
      so the receiver has to be told where to listen.
    - Feed the recovered range and Doppler into navigation last. Getting the link back also
      produces the measurements the burn needs.
    takesAsRead:
    - 'Waves: frequency, wavelength, speed'
    assumes:
    - a slower signal needs less power to be read
    cards:
    - Verify spacecraft attitude and antenna geometry.
    - Reduce data rate and narrow the receiver bandwidth.
    - Coordinate high-gain ground antennas and predicted Doppler tracking.
    - Use recovered range and Doppler data to refine navigation.
    order:
    - 0
    - 1
    - 2
    - 3
    why: Recovery combines three disciplines in a fixed order, cheapest and largest first.
      Pointing is the biggest term in the link budget and costs nothing but attitude, so geometry
      is checked before anything else. Reducing the data rate and narrowing the receiver bandwidth
      buys signal-to-noise without touching the spacecraft. Coordinating the large ground
      antennas with predicted Doppler puts the receiver where the signal actually is. And
      the range and Doppler recovered along the way feed straight back into navigation.
    reason: The fastest safe test can restore contact before the burn.
- title: A Blind Maneuver
  objective: Design a manual alignment procedure whose dominant angular errors are bounded.
  briefing: The crew must aim a burn without the main guidance unit. Bound the sighting errors
    before trusting the turn.
  stake: Shift 10. The main guidance unit is still off, and bright debris hides many stars.
    The crew will aim through a window with Earth and the Sun as guides. You must tell a real
    turn from a sighting shift before a tiny angle becomes a large miss at Earth.
  takeaway: Use lenses, angular measurement, parallax, reference frames, error propagation
    as an evidence chain rather than as isolated facts.
  stops:
  - group: COMMS
    task: Match each apparent shift to what physically moved, and keep angular error apart
      from a real turn of the ship. Use each choice once.
    title: What shifts the apparent direction?
    place: Optics Test Room
    scene: Bright debris hides many stars. The crew will use Earth, the Sun, and a window
      grid. First tell a true ship turn from a shift caused by eye position.
    guide: 'Four apparent shifts, four causes. Ask what physically moved: the eye, the optics,
      the viewpoint, or the spacecraft. The crew is about to aim a burn with this sight, so
      an apparent reticle shift cannot be allowed to masquerade as attitude error.'
    background:
    - Why this is a matching board and not four separate questions. Responses on boards like
      this are written to be plausible for more than one situation. Choosing them one at a
      time lets a nearly-right answer through unexamined. Having to place all of them forces
      the comparison — not "is this reasonable here", but "is it more right here than there".
    - How to use the one-each rule. Because the responses are a set to be distributed rather
      than a list to be sampled, every join you make constrains the rest. Settling the two
      you are confident of can leave the remaining pair decided by elimination. Where it does
      not, two responses are still competing for one situation, and that is exactly the distinction
      the stop is testing.
    - Why you cannot be wrong about exactly one. With every response used once, three correct
      joins leave the fourth with only one place to go. Any error therefore involves at least
      two joins. That is worth remembering when the last pair looks forced. The fault is usually
      not in the join you are struggling with. It is in one you made early and stopped questioning.
    assumes:
    - what you see through an eyepiece depends on where your eye is
    takeaway: Manual navigation requires separating instrument geometry from spacecraft motion.
    format: PROTOCOL
    why: Manual alignment works only if instrument geometry is separated from vehicle motion.
      Moving the eye relative to a nearby reticle creates sighting parallax without changing
      the external line of sight. Focus changes sharpness, not direction. A nearby object
      that changes apparent position against a distant reference as viewpoint changes shows
      geometric parallax. A stable celestial reference moving across the reticle instead indicates
      a change in body orientation. These effects can look similar in one glance and have
      completely different consequences for a burn.

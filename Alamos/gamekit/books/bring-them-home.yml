  - group: INTEG
    task: Use the available tracking and targeting actions to place enough of the entry-angle
      distribution inside the safe corridor.
    title: Protect the entry corridor
    place: Crew G-Load Console
    scene: Safe entry lies from 5.3° to 7.7°. The best path is 6.2° with a 0.5° one-sigma
      spread. Use two actions to make the full range safer.
    guide: The display is a probability distribution, not a hard band of every possible angle.
      Its centre is 6.2 degrees and its one-sigma width is 0.5 degrees; the safe corridor
      spans 5.3 to 7.7. One action shifts the centre, while an independent tracking pass reduces
      the statistical width. Apply the actions and judge the probability left outside either
      boundary.
    background:
    - Why one sigma is not a fence. A standard deviation describes the width of a probability
      distribution; it is not the set of all angles the vehicle could have. Entry safety therefore
      depends on how much probability remains outside the corridor, not simply whether the
      drawn one-sigma interval fits between the lines.
    - 'Two different actions. A targeting correction moves the nominal, which slides the whole
      band along the corridor. A tracking pass adds information, which is the only thing that
      makes it narrower. Confusing them is the classic error in this room: the number on the
      display gets better and the risk does not.'
    - Why 'when is it ready' is part of the question. Every action costs time on a clock the
      vehicle sets, and the crew cannot wait for an arbitrarily tight solution. So the decision
      is not merely what to do but when the band is inside the corridor by enough that the
      next hour is better spent elsewhere.
    assumes:
    - an uncertainty band describes a range of plausible states
    - a narrower distribution puts more probability near its center
    takeaway: Moving an estimate changes its center; new information changes its width, and
      safety can depend on both.
    format: CLOUD
    question: Can you make the entry solution robust without confusing a better center with
      a narrower uncertainty? Place the bars to report the mean and its one-sigma uncertainty.
    cloud:
      hint: The horizontal position is the nominal entry angle; the width is its one-sigma
        uncertainty. Try each action separately before combining them.
      actions:
      - id: recenter
        label: Small targeting correction
        effect: shift
        amount: 1
      - id: track
        label: Independent tracking pass
        effect: narrow
        amount: 0.7
      centre: 6.2
      spread: 0.5
      bounds:
        min: 5.3
        max: 7.7
      pass: 0.995
    answerText: 'Use both actions: center the solution near 6.5 degrees and narrow the one-sigma
      width to about 0.35 degrees.'
    why: The nominal entry angle is only the centre of a distribution. A targeting correction
      moves that centre but does not by itself make the state better known. Independent tracking
      can narrow the distribution by adding information. Here the authored Gaussian model
      requires both. Recentering removes the offset. Tracking reduces the width, until the
      probability inside the 5.3–7.7 degree corridor exceeds the stated 99.5% decision rule.
      The rule is a model assumption for this game, not a universal reentry standard.
    reason: A good center is unsafe if the possible paths are too wide.
- title: The Structure Is Vibrating
  objective: Move the system away from resonance and verify that the mitigation works across
    operating conditions.
  briefing: A pump is making a panel shake near one speed. Move the system away from resonance
    before a line breaks.
  stake: Shift 12. A pump makes one panel shake hard near 3,200 rpm. A line behind the panel
    has rubbed for an hour, and the motion grows each time the pump returns to that speed.
    You must test for resonance and move away from it before the line breaks.
  takeaway: Use simple harmonic motion, natural frequency, resonance, damping, forced oscillation
    as an evidence chain rather than as isolated facts.
  stops:
  - group: INTEG
    task: Which explanation fits the frequency, the speed dependence and the independent accelerometers?
    title: What is driving the vibration?
    place: Structural Dynamics Lab
    scene: The panel shakes hard only near 3,200 rpm. The motion fades above and below that
      speed. Okoye, the structures engineer, asks if the pump is driving resonance.
    guide: 'Three facts have to agree: the response peaks near 3,200 rpm, it falls on either
      side, and two independent accelerometers see the same mode. Ask which explanation predicts
      all three. A loose sensor cannot make a second sensor respond, and an impact would not
      switch on and off with rotor speed.'
    background:
    - Why the wrong options are the interesting ones. Each distractor is written to be the
      answer under one specific misreading. A step skipped. A quantity confused with a rate.
      A correlation taken for a cause. Identifying which misreading each belongs to is where
      the learning is; the right answer alone can be reached on instinct and teach nothing.
    - Why the shape of an option tells you nothing. A correct answer collects the qualifying
      clause and the unit. So across a whole game the key used to be the longest option far
      more often than chance. Here it ran to 88 per cent of passage quizzes, before it was
      fixed. It is now checked per game as a binomial tail, so length, hedging and specificity
      have had the signal taken out of them deliberately.
    - What the verdict adds. Every wrong option carries its own rebuttal, and the verdict
      prints them — the reason that option fails, not a restatement of the right one. They
      are worth reading after a correct answer as well. A right choice made for an approximate
      reason looks exactly like a sound one. It stops looking like one on the day the approximation
      is what is being tested.
    assumes:
    - every structure has speeds at which it prefers to shake
    takeaway: How hard something shakes matters less than what is shaking it and how fast.
    format: CHOICE
    why: Resonance is identified by the relationship between forcing frequency and structural
      response. A rotor at 3,200 rpm forces the structure at about 53.3 Hz. If a structural
      mode lies near that frequency, repeated forcing can build a large response even when
      the static load is harmless. Moving the pump away from the band immediately reduces
      the forcing at that mode. The second accelerometer confirms the response belongs to
      the structure rather than one loose sensor.
    rebuttals:
    - A loose sensor rattles on its own mount. A second accelerometer in a different location
      sees the same mode.
    - An impact is a single kick and would not care what speed the wheel is running at. The
      impact monitor recorded nothing.
    - Structural breakup gives large vibration across many frequencies and operating states.
      This is narrow-band, repeatable and reversible.
    headline: A structural vibration becomes severe only during a narrow band of pump speed.
    readings:
    - zone: Vibration amplitude
      label: Vibration amplitude
      value: Sharp peak near 3,200 rpm
      status: alarm
      note: Falls again above and below that speed
    - zone: Measured vibration frequency
      label: Measured vibration frequency
      value: Matches known structural mode
      status: alarm
      note: Frequency alignment is repeatable
    - zone: Pump-speed change
      label: Pump-speed change
      value: Moving away from 3200 rpm reduces vibration
      status: alarm
      note: Immediate reversible response
    - zone: Second accelerometer
      label: Second accelerometer
      value: Sees the same mode
      status: alarm
      note: Not confined to one sensor mount
    - zone: Impact monitor
      label: Impact monitor
      value: No impulse recorded
      status: normal
      note: No evidence of a discrete strike
    choices:
    - label: Resonance driven by pump forcing
      mechanism: The pump forcing frequency approaches a structural natural frequency and
        amplifies motion.
    - label: Loose accelerometer
      mechanism: One sensor mechanically rattles while the ship structure remains quiet.
    - label: One-time impact
      mechanism: A collision gives the structure an impulsive kick independent of wheel speed.
    - label: Broad structural breakup
      mechanism: Damage creates large vibration across a wide range of frequencies and operating
        states.
    answer: Resonance driven by pump forcing
    reason: The pump speed must change before the hidden line breaks.

    - Eye moving against a nearby reticle is instrument parallax. Nothing outside the window
      has changed.
    - A focus change alters how sharp the image is and leaves the direction where it was.
    - A near object shifting against distant stars as the viewpoint moves is geometric parallax,
      and the size of the shift carries the distance.
    - The star field is fixed in inertial space. If it appears to move, the vehicle turned.
    scenarios:
    - The eye moves relative to a nearby reticle.
    - A lens focal setting changes image sharpness.
    - A nearby object shifts against distant stars as viewpoint changes.
    - The spacecraft rotates while the star field remains fixed inertially.

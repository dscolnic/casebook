            max: 16
            unit: A
            step: 0.2
          truth: 14
          passRatio: [0.9, 1.1]
          intervention:
            id: protected_test
            label: Connect through fused test lead
            alwaysSucceeds: true
          checks: 1
          requiredMeasurement: true

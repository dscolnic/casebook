    why: >-
      A power plan is an allocation across time as well as across systems, and
      the loads that look cheapest to shed are often the ones whose consequences
      arrive later. Communications is the only load here that degrades
      gracefully: a lower rate and a narrower channel still get the numbers
      down. Guidance draws power at known times and none outside them, so it is
      scheduled rather than shed. Thermal control costs far more to restore than

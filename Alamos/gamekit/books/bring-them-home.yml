- title: The Power Budget
  objective: Build a load-shedding plan that preserves essential functions through the next
    critical maneuver.
  briefing: The fuel cells are gone and the batteries must last to entry. Find the power loss
    and choose what stays on.
  stake: Shift 5. Power must now last 62 more hours. Shah, the power systems lead, sees a
    four-volt drop and a hot joint while every system asks to stay on. You must find the loss
    and save enough power for air, heat, guidance, and entry.
  takeaway: Use current, voltage, resistance, electrical power, energy budget as an evidence
    chain rather than as isolated facts.
  stops:
  - group: ELEC
    task: Use the values shown. Write the equation and give a rounded answer with units.
    title: How long can the battery last?
    place: Electrical Systems Room
    scene: The fuel cells are gone. Entry batteries are now carrying the ship days too soon.
      Shah needs a rough count of hours before the next power cut.
    guide: 'Five numbers, and three of them belong to other questions: the bus voltage, the
      brief peak, and the time to the next burn. Ask of each whether it is an amount of energy
      or a rate of use. Energy divided by a rate leaves a time. And note what the answer assumes:
      a flat load, and every last watt-hour available. A cold battery gives less than its
      rating.'
    background:
    - Why an estimate rather than a calculation. Every quantity on this board is already measured
      or stated, so nothing here has to be derived. Two things are being tested. Can you pick
      the quantities the relationship actually needs? And does the size of the answer look
      right once they are in place?
    - Why the tiles carry labels. A bare number cannot be checked against the relationship
      it is going into. Reading the label is how a unit mismatch is caught before the tile
      is placed. It is also how you catch a quantity that belongs to a different part of the
      problem. That habit is what this format exists to build.
    takeaway: Power is the rate of energy use; endurance depends on both energy inventory
      and load.
    format: BALLPARK
    takesAsRead:
    - 'Circuits: current, voltage, resistance, Ohm''s law'
    assumes:
    - energy is a stock, and power is the rate it is drawn at
    why: Energy and power are different things, and the division between them is the whole
      calculation. An inventory in kilowatt-hours divided by a draw in kilowatts leaves hours.
      It is an ideal figure. It assumes the load stays flat and that every last watt-hour
      is available, and neither is true — a cold battery gives less than its rating. It is
      still the number every other decision this shift gets argued against, so it is worth
      having early and worth calling approximate.
    question: Estimate the ideal endurance.
    estimate:
      relationship: Endurance = energy stored ÷ power drawn.
      prompt: The fuel cells are gone. The entry batteries hold about 18 kilowatt-hours of
        usable energy and the essential loads draw about 3 kilowatts.
      question: Estimate the ideal endurance.
      labels:
      - 18 kWh (usable energy)
      - 3 kW (essential load)
      - 28 V (bus voltage)
      - 3.5 kW (peak load, briefly)
      - 6 h (time to the next burn)
      values:
      - 18
      - 3
      - 28
      - 3.5
      - 6
      slots: 2
      template: '{0} ÷ {1}'
      formula: a/b
      correct:
      - 0
      - 1
      target: 6
      tolerance: 0.4
      units: h
      solution: 18 kWh ÷ 3 kW = 6 h.
      explanation: Energy is an inventory and power is the rate it is spent at; the hours
        come from dividing one by the other. Bus voltage describes how the energy is delivered
        and says nothing about how much there is.
    reason: The crew cannot plan the return without a power clock.
  - group: INTEG
    task: Which fault fits the voltage, current, generation and thermal evidence?
    title: Why is bus voltage collapsing?
    place: Spacecraft Load Panel
    scene: The main bus has fallen from 28 volts to 24. Total current is near the plan, but
      one joint is hot. Find the fault before more gear is shut off.
    guide: Four options, and three readings have to be explained together. Generation is normal.
      Total load current is near plan. Something is hot. Ask of each option how many of those
      it covers. A failed array or a hidden load would move the current. A bad meter would
      not make anything warm. Equipment is about to be pulled off the bus on this answer.
    background:
    - Why the wrong options are the interesting ones. Each distractor is written to be the
      answer under one specific misreading. A step skipped. A quantity confused with a rate.
      A correlation taken for a cause. Identifying which misreading each belongs to is where
      the learning is; the right answer alone can be reached on instinct and teach nothing.
    - Why the shape of an option tells you nothing. A correct answer collects the qualifying
      clause and the unit. So across a whole game the key used to be the longest option far
      more often than chance. Here it ran to 88 per cent of passage quizzes, before it was
      fixed. It is now checked per game as a binomial tail, so length, hedging and specificity
      have had the signal taken out of them deliberately.
    - What the verdict adds. Every wrong option carries its own rebuttal, and the verdict
      prints them — the reason that option fails, not a restatement of the right one. They
      are worth reading after a correct answer as well. A right choice made for an approximate
      reason looks exactly like a sound one. It stops looking like one on the day the approximation
      is what is being tested.
    assumes:
    - current through a resistance drops voltage and makes heat
    takeaway: Electrical faults are easier to localize when voltage, current, and heat are
      treated as parts of one energy picture.
    format: CHOICE
    why: Voltage, current, and heat describe the same electrical fault from different angles.
      A resistive junction creates a voltage drop when current passes through it. The lost
      electrical power becomes heat at that junction. Here generation is normal and the total
      load current is near plan, so neither a failed array nor a hidden load fits. The hot
      connection and low downstream bus voltage point to resistance in the path. Measuring
      all three quantities localizes the fault instead of guessing from voltage alone.
    rebuttals:
    - A hidden load would show as total load current above plan, and the total is where it
      was expected to be.
    - A failed array would show as low array current. Generation is normal; the problem is
      downstream of it.
    - A bad voltmeter explains the reading and not the hot junction or the extra battery current.
      Two independent instruments agree that something real is happening.
    headline: The spacecraft power bus sags under a normal load.
    readings:
    - zone: Main bus voltage
      label: Main bus voltage
      value: 24 V instead of 28 V
      status: alarm
      note: Significant sag under load
    - zone: Battery current
      label: Battery current
      value: Higher than expected
      status: alarm
      note: Battery is supporting the bus
    - zone: Solar-array current
      label: Solar-array current
      value: Normal
      status: normal
      note: Primary generation has not collapsed
    - zone: Total load current
      label: Total load current
      value: Near planned value
      status: alarm
      note: No large unexpected load surge
    - zone: Connector temperature
      label: Connector temperature
      value: Hot spot at one junction
      status: alarm
      note: Local electrical heating
    choices:
    - label: High-resistance connection
      mechanism: A resistive junction drops voltage and converts electrical power to heat.
    - label: Large hidden load
      mechanism: An unexpected device draws much more current and pulls down the bus.
    - label: Solar-array failure
      mechanism: Generation falls sharply, forcing the battery to replace missing array current.
    - label: Bad voltmeter only
      mechanism: The bus is healthy and the low voltage exists only in one measurement channel.
    answer: High-resistance connection
    reason: Blind load cuts may waste power and leave the fault hot.
    takesAsRead:
  - group: INTEG
    task: Allocate 41 amp-hours across continuous life support, six hours of thermal protection,
      four guidance windows. Whatever radio time remains.
    title: Shed load without losing the mission
    place: Mission Planning Desk
    scene: The battery holds 41 amp-hours. Air, heat, and guidance need fixed blocks of time.
      Work out how much radio time remains.
    guide: 'Forty-one amp-hours, sixty-two hours to fly, and a current draw of 4.2 amps that
      does not fit. Watch the questions list rather than the loads: it shows what the spacecraft
      can still do under the current plan. Every hour you buy for one load is an hour you
      have taken from another, and at least one has to come down within minutes.'
    background:
    - What an amp-hour buys. One amp for one hour. At 4.2 amps the whole reserve lasts under
      ten hours, against sixty-two to fly. So this is not a trimming exercise. The load has
      to fall by a factor of several and stay down.
    - Why the loads are not equal. Guidance and communications can be intermittent — used
      for a pass and switched off. Thermal control has a time constant of hours, so it can
      be cycled. Life support cannot be interrupted at all. That difference is what makes
      a plan possible.
    - Why minutes matter for the first cut. Every hour spent deciding is drawn at the current
      rate, so a slow decision has already spent part of what it was allocating. The first
      reduction buys the time to make the rest of the plan properly.
    takesAsRead:
    - Electrical power and energy budgets
    - 'Circuits: current, voltage, resistance, Ohm''s law'
    assumes:
    - amp-hours equal current multiplied by time
    - some loads can be duty-cycled while others must run continuously
    takeaway: A finite energy budget is a set of tradeoffs between load rate, runtime, and
      the mission conditions each load protects.
    format: ALLOCATE
    question: How many hours of each load can the ship afford?
    allocate:
      hint: 'Meet the required runtimes first: 62 h of life support, 6 h of thermal protection,

      question: Estimate the carbon dioxide produced in six hours.
      labels:
      - 3 people
      - 20 L/person/hour
      - 6 hours
      - 24 hours (a full day)
      - 1.0 kg/person/day (mass basis)
      values:
      - 3
      - 20
      - 6
      - 24
      - 1
      slots: 3
      template: '{0} × {1} × {2}'
      formula: a*b*c
      correct:
      - 0
      - 1
      - 2
      target: 360
      tolerance: 25
      units: L
      solution: 3 × 20 × 6 = 360 L over the 6 hours.
      explanation: A rate per person per hour needs a head count and an interval, and both
        have to match the question asked. A daily mass figure describes the same crew and
        cannot be multiplied into this one without a density and a different arithmetic.
    reason: The new filter path must handle what three people make.

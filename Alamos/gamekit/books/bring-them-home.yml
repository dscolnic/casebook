      Nothing damps the rotation. A torque that starts the turn keeps it turning
      until an equal and opposite one stops it. So starting and stopping are two
      decisions, and the second one has to be planned before it is needed. The
      crew reads attitude and rate from whatever cues still work, applies a
      bounded torque, coasts while watching the target come round, and brakes

# aftershock.yml — Kestrel Bay, 3 days after a magnitude 6.8.
#
# 1 earthquake, 2 disasters: Upper Town on granite, the Flats on hydraulic
# fill. The course is site effect, structural behaviour and decision under
# uncertainty, and the campaign is a fortnight of deciding which buildings
# people go back into.
#
# The argument, both sides right on a named day: Marisol Okonkwo places a
# building on what the evidence supports and will not move faster than it;
# Bram Halvorsen places it on what the town can survive being without, and
# argues that an empty hospital kills people too. Okonkwo is right on day 4.
# Halvorsen is right on day 6.

theme:
  id: aftershock
  title: Aftershock
  subtitle: Building Safety Coordinator · Kestrel Bay

groups:
  - id: SEIS
    code: SEIS
    name: Seismic Network
    color: '#2980b9'
    desc: What the ground actually did, and which instrument is entitled to say so.
    defaultLeader: okonkwo
    milestones: [Read the records, Locate the source, Check the instruments, Ready to hand over]
  - id: STRUCT
    code: STRUCT
    name: Structural Assessment
    color: '#c0392b'
    desc: Whether a building is safe to enter, and what that placard is worth.
    defaultLeader: halvorsen
    milestones: [Walk the building, Find the load path, Rate the damage, Ready to hand over]
  - id: GEO
    code: GEO
    name: Geotechnical
    color: '#8e6b2f'
    desc: The ground under the town, and why it behaved in two different ways.
    defaultLeader: navarro
    milestones: [Log the ground, Test the fill, Bound the movement, Ready to hand over]
  - id: MAT
    code: MAT
    name: Materials & Testing
    color: '#7d5ba6'
    desc: What the concrete, the brick and the steel can still carry.
    defaultLeader: ferreira
    milestones: [Take the sample, Test it, Compare with design, Ready to hand over]
  - id: HAZ
    code: HAZ
    name: Hazard & Forecasting
    color: '#2f8f7a'
    desc: What might still happen, expressed as a number somebody can act on.
    defaultLeader: tanaka
    milestones: [Read the sequence, Fit the rate, State the uncertainty, Ready to hand over]
  - id: SAFE
    code: SAFE
    name: Public Safety
    color: '#d35400'
    desc: Cordons, notices and the cost of keeping people out of their own houses.
    defaultLeader: adeyemi
    milestones: [Set the cordon, Tell people why, Weigh the cost, Ready to hand over]

roster:
  - id: okonkwo
    name: Marisol Okonkwo
    role: Structural engineer, Building Safety Coordinator's deputy
    division: STRUCT
    color: '#c0392b'
    bio: >-
      <p>Nineteen years assessing buildings, six of them after earthquakes in three countries. She
      places a building on what the evidence supports and not one step further, and she has been
      overruled enough times to know exactly what it costs when she is right.</p>
      <p>Her rule, said aloud most mornings: a placard is a claim about a building, and a claim you
      cannot trace is a guess wearing a colour.</p>
    quiz:
      - q: Why does Okonkwo refuse to upgrade a placard on a walk-past?
        a: A rapid assessment samples what is visible from outside
        wrong:
          - Rapid assessments are only valid for the first 24 hours after an event
          - A placard cannot legally be changed once it has been fixed to the door
          - Damage always shows on the outside of a building before the inside
  - id: halvorsen
    name: Bram Halvorsen
    role: Emergency manager for the district
    division: SAFE
    color: '#d35400'
    bio: >-
      <p>Ran the response to two floods and a gas main before this. He thinks in what the town
      cannot do without: a hospital with nobody in it, a school that stays shut for a term, a port
      that stops paying wages. He is not careless and he is not in a hurry for its own sake.</p>
      <p>His argument with Okonkwo is the fortnight's argument, and each of them is right on a day
      the other is wrong.</p>
    quiz:
      - q: What does Halvorsen mean when he says an empty hospital has a cost?
        a: Care not given elsewhere is also harm, and it does not appear on any inspection form
        wrong:
          - Empty buildings deteriorate faster than occupied ones do
          - The hospital loses its funding if it is closed for more than a week
          - An empty building cannot be inspected properly while the power is off
  - id: navarro
    name: Elena Navarro
    role: Geotechnical engineer
    division: GEO
    color: '#8e6b2f'
    bio: >-
      <p>She wrote her thesis on the fill under this town, which nobody read at the time and four
      people have asked her for this week. She can tell you which streets were creek in 1910 and it
      turns out those are the streets with sand in them now.</p>
      <p>She is the 1 who keeps saying that the buildings are not the story, the ground is.</p>
    quiz:
      - q: Why does Navarro care which streets were a creek a century ago?
        a: Loose saturated fill in an old channel is where liquefaction shows up
        wrong:
          - Old creek beds are where the water mains were laid and they break first
          - Historical maps are the only record of where the fault runs
          - Buildings on former creek beds are always older and therefore weaker
  - id: ferreira
    name: Duarte Ferreira
    role: Materials engineer, testing laboratory
    division: MAT
    color: '#7d5ba6'
    bio: >-
      <p>He breaks things for a living and is unromantic about it. Cores from a damaged column,
      coupons cut from a brace, a rebound hammer for the cases where nobody will let him cut
      anything: he wants a number with a method attached and treats everything else as an opinion.</p>
      <p>He is patient with people and impatient with round figures nobody can source.</p>
    quiz:
      - q: Why will Ferreira not accept a rebound hammer reading as a strength?
        a: It measures surface hardness, which is a proxy that has to be calibrated against cores
        wrong:
          - The hammer only works on concrete poured within the last five years
          - Rebound readings are affected by the weather and are useless in the rain
          - A hammer test damages the surface and cannot be repeated
  - id: tanaka
    name: Rei Tanaka
    role: Seismologist, hazard and forecasting
    division: HAZ
    color: '#2f8f7a'
    bio: >-
      <p>Fits aftershock sequences for a living and spends most of the week explaining that a
      forecast is a rate and not a promise. She is careful in public and blunt in the room.</p>
      <p>She keeps a printed copy of the sequence taped to the wall, updated by hand, because she
      says people believe a curve they watched being drawn.</p>
    quiz:
      - q: What does Tanaka's aftershock forecast actually state?
        a: A rate of events per day, with a range around it
        wrong:
          - The date on which the sequence will end
          - The magnitude of the next aftershock
          - Which fault segment will move next
  - id: adeyemi
    name: Funmi Adeyemi
    role: Public information officer
    division: SAFE
    color: '#e08a2e'
    bio: >-
      <p>She has to turn everything this office decides into something a person standing in the
      street can act on, in two sentences, without frightening anybody into doing something worse.
      She is the only one who reads the notices aloud before they go out.</p>
      <p>Her test for a notice: what does somebody do differently after reading it?</p>
    quiz:
      - q: What is Adeyemi's test for a public notice?
        a: Whether somebody reading it does something different afterwards
        wrong:
          - Whether it uses only words in common use
          - Whether it has been approved by every agency involved
          - Whether it can be printed on a single side of paper
  - id: cardoso
    name: Inês Cardoso
    role: Network technician, Seismic Network
    division: SEIS
    color: '#2980b9'
    bio: >-
      <p>She maintains the vault on the bench above town and the four field stations below it, which
      means she is the only person who knows that two of them have been running on a clock that
      drifted since spring.</p>
      <p>She is not embarrassed about it. She is the one who found it.</p>
    quiz:
      - q: Why does Cardoso check the vault instrument against a second one?
        a: A single instrument cannot show its own drift
        wrong:
          - Vault instruments are less accurate than field stations
          - Two instruments together record a wider frequency range
          - The vault instrument is only used for large events
  - id: whitcombe
    name: Alan Whitcombe
    role: Assessment engineer, second team
    division: STRUCT
    color: '#a0392b'
    bio: >-
      <p>Came up from the city with the second wave of assessors and has placarded more buildings
      this week than most engineers do in a career. He is fast, and he knows the risk in being fast,
      which is why he writes down what he did not look at.</p>
      <p>The list of what he did not look at is the most useful document in the office.</p>
    quiz:
      - q: Why does Whitcombe keep a second list beside his placards?
        a: A placard says nothing about the parts of a building nobody could get to
        wrong:
          - A second list is required by the standard before a placard can be changed later
          - It records which buildings he expects to collapse in an aftershock
          - Inspectors are rotated, so the next one needs to know who was there
  - id: mbeki
    name: Thandi Mbeki
    role: Geotechnical field technician
    division: GEO
    color: '#9e7a3a'
    bio: >-
      <p>Logs the ground: cone tests where a rig can get in, hand augers where it cannot, and a
      photograph of every sand fan in the Flats with a scale bar in it.</p>
      <p>The photographs are turning into the best record anybody has of what the ground did.</p>
    quiz:
      - q: Why does Mbeki put a scale bar in every photograph?
        a: Without it the picture records that ejecta happened, not how much
        wrong:
          - Photographs taken without a scale bar cannot be entered as evidence at an inquiry
          - The bar keeps the camera at a fixed distance from the ground
          - It marks which photographs were taken after the first aftershock
  - id: sorensen
    name: Kirsten Sørensen
    role: Laboratory technician, Materials & Testing
    division: MAT
    color: '#8b6bb0'
    bio: >-
      <p>Runs the press. Cuts, caps and crushes cores, and keeps the chain of custody that makes the
      result mean anything — which building, which column, which face, which day.</p>
      <p>She has refused two samples this week for arriving without a label.</p>
    quiz:
      - q: Why does Sørensen refuse an unlabelled core?
        a: A strength belongs to one column in one building, and an unlabelled core belongs to none
        wrong:
          - Unlabelled cores dry out on the bench before the press is free to test them
          - The press cannot be calibrated without knowing the concrete's age
          - Regulations require every sample to carry the name of the engineer who cut it
  - id: ives
    name: Peter Ives
    role: Hospital facilities manager
    division: HAZ
    color: '#3a9a84'
    bio: >-
      <p>He has 90 beds, a yellow placard on his front door and no idea when either of those
      changes. He knows his building better than anybody assessing it, and he knows that is not the
      same as being able to say it is safe.</p>
      <p>He is not fighting the process. He is asking it to hurry, precisely.</p>
    quiz:
      - q: Why can Ives not simply declare his own building safe?
        a: Knowing a building well is not the same as having assessed what the earthquake did to it
        wrong:
          - Facilities managers are not permitted to enter a building that carries a yellow placard
          - He has no access to the design drawings for the upper floors
          - A declaration by the occupier would invalidate the insurance
  - id: delacroix
    name: Yvette Delacroix
    role: Ward councillor for the Flats
    division: SAFE
    color: '#d4762a'
    bio: >-
      <p>Represents the half of town that got the worse earthquake and has the smaller houses. She
      turns up to every meeting with a list of who is sleeping where, and she can name the streets
      that have been cordoned longest.</p>
      <p>She is not against the cordons. She wants somebody to say when they end.</p>
    quiz:
      - q: What is Delacroix actually asking the office for?
        a: The condition each stretch of cordon would have to meet to come down
        wrong:
          - A guaranteed date on which every street reopens
          - Compensation for every household still unable to get back into its own house
          - A second opinion from an engineer she chooses herself

glossary:
  - name: Placard
    aliases: [placards, placarded, placarding]
    def: The notice fixed to a building after an inspection — green to enter, yellow for restricted use, red for no entry.
  - name: Epicentre
    aliases: [epicenter]
    def: The point on the surface directly above where the fault started to slip.
  - name: Magnitude
    aliases: [magnitudes]
    def: A single number for the size of an earthquake, on a scale where each unit is about 32 times the energy.
  - name: Intensity
    aliases: []
    def: How strongly the ground shook at one particular place, which differs across a town in one earthquake.
  - name: Liquefaction
    aliases: [liquefied, liquefy]
    def: Wet, loosely packed ground losing its strength while it is shaken, and behaving like a heavy liquid.
  - name: Ejecta
    aliases: [sand boil, sand boils]
    def: Sand and water that reached the surface from below, left as grey fans in the street.
  - name: Fill
    aliases: [hydraulic fill, reclaimed]
    def: Ground that was placed by people rather than laid down by nature, often dredged and pumped into position.
  - name: Bedrock
    aliases: [rock site]
    def: Solid rock beneath the ground surface, which shakes only lightly where loose fill shakes hard.
  - name: Site effect
    aliases: [amplification, amplify, amplified]
    def: Soft ground magnifying shaking, so two places the same distance from an earthquake feel different ones.
  - name: Natural period
    aliases: [fundamental period]
    def: The time a building takes to sway back and forth once when it is pushed and let go.
  - name: Resonance
    aliases: [resonant]
    def: What happens when the ground shakes at close to a building's own natural period, so each push adds to the last.
  - name: Base shear
    aliases: []
    def: The total horizontal force an earthquake applies at the bottom of a building.
  - name: Load path
    aliases: [load paths]
    def: The route a force takes down through a building to the ground; if it stops anywhere, that is where the damage goes.
  - name: Kilopascal
    aliases: [kPa, kilopascals]
    def: A unit of pressure or stress — a thousand newtons spread over a square metre. Soil stresses on this site run to a few tens of them.
  - name: Soft storey
    aliases: [soft story, soft-storey]
    def: A floor with much lower stiffness than the storeys above it, usually an open ground floor, which takes all the movement.
  - name: Ductility
    aliases: [ductile, brittle]
    def: A material's ability to bend a long way without breaking, which is what lets a building absorb an earthquake.
  - name: Unreinforced masonry
    aliases: [URM, masonry]
    def: Brick or stone with no steel in it, strong when pressed and weak when pulled sideways.
  - name: Factor of safety
    aliases: [safety factor]
    def: What a part can carry, divided by what was required of it.
  - name: Aftershock
    aliases: [aftershocks]
    def: A smaller earthquake following the main one, on the same fault system, becoming rarer as time passes.
  - name: Cordon
    aliases: [cordoned, cordons]
    def: A boundary keeping people out of an area, and a decision with a cost on both sides of it.

  - name: Fault
    aliases: [faults, fault line]
    def: A break in the rock where the two sides have moved past each other, and can move again.
  - name: Pore pressure
    aliases: [pore water pressure]
    def: Water pressure in the gaps inside the ground, which holds the packed particles apart.
  - name: Loose ground
    aliases: [loose, loosely packed]
    def: Ground that is not tightly packed, so shaking can settle it into a smaller space.
  - name: Saturated
    aliases: [saturation]
    def: Ground in which every gap is already full of water.
  - name: Bearing capacity
    aliases: [bearing]
    def: How much weight the ground can take before it fails under a building.
  - name: Shear
    aliases: [shear force, in shear]
    def: A force that slides one part of a wall or column past the part beside it.
  - name: Capacity
    aliases: [capacities]
    def: How much a part of a building can carry before it fails.
  - name: Demand
    aliases: []
    def: How much the earthquake actually required that part to carry.

missions:
  - title: Two towns, one earthquake
    objective: Work out why the same shaking wrecked one half of Kestrel Bay and spared the other.
    briefing: Upper Town lost its chimneys. The Flats lost its streets. Both are the same distance from the source.
    stake: >-
      Friday, three days after, and the first thing anybody says on walking into the base is that it
      makes no sense. Upper Town, on the granite bench, has parapets in the street and almost every
      building standing. The Flats, 1100 metres away on the same side of the same fault,
      have sand in the gutters, a six-storey block leaning at 8 degrees and a wharf that moved
      2 metres. Marisol Okonkwo will not sign an assessment programme until she can say why.
      Elena Navarro thinks she already knows and wants a borehole to prove it. Today you read the
      two records side by side, work out what the ground did to the shaking on its way up, and
      decide which half of town gets the assessors first.
    takeaway: One earthquake produces as many shakings as there are grounds to shake, and the ground is the difference.
    stops:
      - group: SEIS
        task: Compare the two records from one earthquake
        title: The same event, recorded twice
        concept: Intensity against magnitude — one event, many shakings
        place: Seismic Network
        scene: |-
          Inês Cardoso has the vault record from the bench and the field station record from Bay Road. Same event, same minute, 1100 metres apart. One trace is short and sharp, the other is three times taller and goes on for half a minute longer.
        guide: >-
          All four options explain two records that disagree. They differ in what they
          blame: the instrument, the ground, the distance, or the timing. Two of them
          are checkable from the scene. Same event, same minute, 1100 metres apart. Ask
          what 1100 metres can and cannot account for. Which one is right decides
          whether the Flats get a stronger design value or a service call.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - an instrument records the shaking where it stands, not the earthquake itself
        takeaway: A record describes one place, so two records of one earthquake can disagree and both be right.
        format: CHOICE
        question: What does the difference between the two records mean?
        answerText: The Flats record is about 3 times the rock-site amplitude in the strongest band, so A_soft/A_rock ≈ 3 there. That supports a real site-amplification effect; the factor is frequency-dependent and should not be applied blindly to every building or motion measure.
        why: Soft ground can amplify and lengthen shaking in a particular period band. Here the 2 records give A_soft/A_rock ≈ 3 for the strongest motion. That is a site effect, not a larger earthquake under the Flats. Buildings also have preferred periods. A rough rule is T ≈ 0.1N seconds for an N-storey building. If strong site motion overlaps a building period, resonance can increase response. The ratio is frequency-dependent, so one factor should not be applied to every motion measure.
        choices:
          - One of the two instruments is faulty and its record should be discarded.
          - The soft ground under the Flats amplified and lengthened the shaking.
          - The Flats are closer to the epicentre, which is why the shaking there was stronger.
          - The Flats record includes aftershocks that the vault instrument was not running for.
        answer: The soft ground under the Flats amplified and lengthened the shaking.
        rebuttals:
          - Both instruments checked out against a second sensor this morning; the difference is real.
          - 1100 metres is nothing against a source 20 kilometres away, so distance cannot explain a factor of 3.
          - Both records cover the same 90 seconds, and the aftershocks are on separate traces.
      - group: GEO
        task: Say what the ground under the Flats is made of
        title: Ground that people put there
        place: Geotechnical
        scene: |-
          Navarro has an 1892 survey and a photograph from 1948. Where Bay Road now runs there was a tidal creek, and the port was pumped into place out of the dredger over four summers.
        guide: >-
          Four descriptions of ground, and four behaviours under shaking. Pair them by
          asking two things of each: how loose is it, and can the water get out. Age is
          not the variable it looks like. One of these is the wettest and loosest of
          all. It is a line on an 1892 survey, invisible from the street.
        background:
          - >-
              Why this is a matching board and not four separate questions. Responses on
              boards like this are written to be plausible for more than one situation, so
              choosing them one at a time lets a nearly-right answer through unexamined.
              Having to place all of them forces the comparison — not "is this reasonable
              here", but "is it more right here than there".
          - >-
              How to use the one-each rule. Because the responses are a set to be
              distributed rather than a list to be sampled, every join you make constrains
              the rest. Settling the two you are confident of can leave the remaining pair
              decided by elimination. Where it does not, two responses are still competing
              for one situation, and that is exactly the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every response used once,
              three correct joins leave the fourth with only one place to go. Any error
              therefore involves at least two joins. That is worth remembering when the last
              pair looks forced: the fault is usually not in the join you are struggling
              with, but in one you made early and stopped questioning.
        assumes:
          - ground can be natural or placed by people
        takeaway: Liquefaction needs susceptible soil, enough saturation and strong cyclic loading; young hydraulic fill often supplies the first two.
        format: PROTOCOL
        question: Say what the ground under the Flats is made of
        why: "Hydraulic fill is deposited loose and commonly remains saturated. During shaking, grains try to rearrange while water cannot escape quickly. Effective stress is σ' = σ − u: as pore-water pressure u rises, the grain-to-grain stress σ' falls. If that contact stress becomes very small, the soil can lose much of its shear strength and behave like a fluid. The old creek line matters because it marks especially wet, loose fill, which is also where the sand ejecta appeared."
        rebuttals:
          - Hydraulic fill is dropped through water, so it settles loose and stays saturated.
          - The granite bench is neither loose nor saturated, so its behaviour under shaking is nothing like the fill.
          - The old creek line is where the loosest wettest material sits, which is why the fans follow it.
          - Age matters because ground gains strength as it consolidates, and 80 years is young.
        columns:
          - The ground
          - What it does when shaken
        scenarios:
          - Hydraulic fill, pumped in from a dredger in the 1940s.
          - The granite bench under Upper Town.
          - The line of the 1892 tidal creek.
          - Ground that has been in place for 10000 years.
        choices:
          - Loose and saturated, so shaking can pack it and the water pressure rises.
          - Stiff and drained, so it passes the shaking on almost unchanged.
          - The loosest and wettest of all, which is where the sand fans appeared.
          - Consolidated by its own weight over time, which is why age is a defence.
        mapping: [0, 1, 2, 3]
      - group: STRUCT
        task: Allocate the six assessor-days across the four inspection packages, then check which operational questions the plan can answer.
        title: Where the first day of assessment goes
        place: Structural Assessment
        scene: Six assessors are free for one day. 400 displaced households are waiting on decisions in the Flats. Marina Court and the Parade are already cordoned, while Upper Town is mostly occupied. The team board shows six assessor-days available.
        guide: >-
          Six assessor-days is the whole pool, and each package you drag in spends some
          of it. Watch the answers list rather than the buildings: it shows which
          questions the current plan can answer, and every package you buy is a question
          you can answer and one you have given up. The cordons already in place cost
          nothing. Commit the plan when the answers you can give are the ones today
          needs.
        background:
          - >-
              Why the pool is the constraint. Six assessors for one day is a fixed quantity
              of attention, and the Flats alone could absorb all of it. The decision is not
              what is worth inspecting — nearly everything is — but which inspections change
              what happens before tonight.
          - >-
              What makes an answer worth buying today. Four hundred households are waiting
              on a re-occupancy decision. An inspection that can produce that decision by
              this evening is worth more than one that produces a better answer next week,
              because the second one has already been made for them by the delay.
          - >-
              Why the existing cordons are on the board at zero. They are already in force,
              so they cost nothing to keep and they answer nothing new. They are there to be
              noticed: a plan that spends assessor-days re-establishing what is already
              closed has bought a question it had already answered.
        assumes:
          - an assessment programme is a queue, and the order is a decision
        takeaway: A finite inspection team should be spent on the questions whose answers can still change what happens today.
        format: ALLOCATE
        question: Can your allocation preserve a same-day re-occupancy decision for the waiting Flats households while accepting that some lower-value questions will wait?
        allocate:
          hint: Drag inspection packages into the six-day pool. The live panel shows which questions the current plan can answer; you do not need to answer every question today.
          pool:
            amount: 6
            unit: assessor-days
            label: Assessment capacity today
          items:
            - id: existing_controls
              label: Existing cordons and closure orders
              cost: 0
              protected: true
            - id: flats
              label: Flats terrace re-occupancy sweep
              cost: 4
            - id: marina
              label: Additional Marina Court documentation
              cost: 2
            - id: upper
              label: Upper Town timber-house follow-up
              cost: 2
            - id: parade
              label: Detailed Parade damage documentation
              cost: 2
          answers:
            - required: true
              requires:
                - flats
              question: Can the waiting Flats households receive an occupancy decision today?
            - required: false
              requires:
                - marina
              question: Can Marina Court be described in more detail today?
            - required: false
              requires:
                - upper
              question: Can the standing Upper Town houses receive an extra follow-up today?
            - required: false
              requires:
                - parade
              question: Can the already-closed Parade be documented in more detail today?
        answerText: Keep at least four assessor-days on the Flats sweep so the waiting households can receive an occupancy decision today. Spend the remaining two days on one optional question; the other useful questions have to wait because the team cannot buy all four packages.
        why: Assessment capacity is a finite pool, so every useful inspection has an opportunity cost. The Flats package can resolve an occupancy decision for hundreds of displaced households. Marina Court and the Parade already have protective controls in place, so extra detail there changes less today. Upper Town follow-up is useful but not essential to the immediate re-occupancy decision. The allocation should therefore preserve the Flats question first, then spend remaining capacity only where another answer is worth the assessor-days it consumes.
  - title: The number everybody has already heard
    objective: Pin the magnitude and the location down, and separate them from what people felt.
    briefing: Two agencies published two magnitudes, and the difference is being read as a disagreement.
    stake: >-
      Saturday, and the town has two numbers for the same earthquake. 1 agency said 6.6 within
      20 minutes; another said 6.8 6 hours later. Rei Tanaka can explain the difference in one
      sentence to an engineer and has spent the morning failing to explain it to a radio station.
      Funmi Adeyemi has to put something in a notice by four. Meanwhile Inês Cardoso has found that
      two field stations have been running on a clock that drifted since spring, which changes where
      the epicentre plots. Today you locate the earthquake properly, say what its magnitude is and
      what it is not, and write down what the difference between 6.6 and 6.8 actually means.
    takeaway: A magnitude is a measurement with a method attached, and revising it is the method working.
    stops:
      - group: SEIS
        task: Locate the source from arrival times
        title: How far away it started
        concept: P and S waves, and what the gap between them measures
        place: Seismic Network
        scene: |-
          The vault trace shows the P arrival at 04:12:19 and the S arrival at 04:12:32. Cardoso wants the distance before anybody draws a circle on a map.
        guide: >-
          Five numbers, and two of them belong to the earthquake rather than to this
          station: the magnitude and the depth. Two others are clock readings, and only
          the gap between them carries distance. Ask of each whether it describes the
          source or the arrival. And note what one station can give: a radius, not a
          position. The circle still needs other stations before anybody draws on a map.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - P waves travel faster than S waves through the same rock
        takeaway: The gap between the two arrivals grows with distance, so one station gives a distance and three give a place.
        format: BALLPARK
        question: Estimate the distance from this station to the source.
        answerText: About 100 km.
        why: Both waves leave together, but the P wave travels faster. Their arrival-time gap therefore grows with distance from the source. For shallow crust, about eight kilometres of source distance corresponds to each second of S-minus-P separation. The 13-second gap gives about 104 km. One station supplies only a radius, so the source still lies somewhere on a circle. A network combines several station distances to locate the source region rather than mistaking one distance for a position.
        estimate:
          prompt: |-
            The P wave arrived at 04:12:19 and the S wave at 04:12:32. Use 8 km for each second of separation.
          question: Choose the two arrival times and the constant.
          labels:
            - 32 s  (S arrival, seconds past the minute)
            - 19 s  (P arrival, seconds past the minute)
            - 8 km/s  (distance per second of separation)
            - 6.8  (the magnitude)
            - 11 km  (depth of the source)
          values: [32, 19, 8, 6.8, 11]
          slots: 3
          template: ({0} − {1}) × {2}
          formula: (a-b)*c
          correct: [0, 1, 2]
          target: 104
          tolerance: 12
          units: km
          solution: d = (32 − 19) × 8 = 104 km.
          explanation: |-
            About 100 kilometres to the source. The magnitude and the depth are both real numbers about this earthquake and neither belongs in this calculation — one is how big it was, the other is how deep, and this is how far.
          givens:
            - The S minus P interval is 13 seconds
            - Distance is about 8 km for each second of that gap
          relationship: |-
            Distance = the S-minus-P interval × 8 km per second, because the 2 waves left together and travel at different speeds.
      - group: HAZ
        task: Explain what changed between the 6.6 and 6.8 solutions
        title: Why the number moved
        place: Hazard & Forecasting
        scene: |-
          Tanaka has both agency bulletins on the desk. The early one used the first stations to report; the later one used the whole network and the long-period part of the record.
        guide: >-
          The later solution has a fault model behind it: an area and an average slip.
          Build the seismic moment from the rigidity, the area and the slip, and the verdict
          turns that into a magnitude. Watch the units — the area is given in square
          kilometres and the moment needs square metres, so one of the tiles is the
          conversion already done and another is the same area unconverted.
        background:
          - >-
              What the moment is made of. Rigidity times ruptured area times average slip. It is
              a physical quantity with units of newton metres, and it is what a long-period
              record measures — which is why a bulletin written from the first few seconds of
              short-period data can be revised once the whole waveform has arrived.
          - >-
              Why the scale is logarithmic. Magnitude is two thirds of the base-ten logarithm of
              the moment, less a constant, so one step of 0.2 in magnitude is a factor of about
              two in moment. Nothing about the earthquake changed between the bulletins; the
              estimate of how much fault moved by how much did.
          - >-
              Why this matters for the notice. A town told the number went from 6.6 to 6.8 hears
              that the earthquake grew. What actually happened is that the second estimate saw
              twice as much moment as the first one could, and the difference is a property of
              networks and waveforms rather than of the ground.
        takesAsRead:
          - Magnitude as a logarithmic scale
        assumes:
          - a magnitude is computed from records, so more records can change it
        takeaway: A magnitude revision means the estimate changed as the available waveform and network coverage improved; the earthquake itself did not change.
        format: BALLPARK
        question: From the later solution's fault model, what seismic moment does the 6.8 estimate correspond to?
        answerText: About 2.0 × 10¹⁹ newton metres, which is M_w 6.8. The first bulletin's 6.6 corresponds to roughly half that moment — the estimate doubled, the earthquake did not.
        why: "Seismic moment is M₀ = μAD — rigidity times ruptured area times average slip. The later solution's model is 600 km² of fault, which is 6.0 × 10⁸ m², slipping an average of 1.1 m through crust with a rigidity of 3.0 × 10¹⁰ Pa, so M₀ = 3.0 × 10¹⁰ × 6.0 × 10⁸ × 1.1 ≈ 2.0 × 10¹⁹ N·m. Moment magnitude is M_w = ⅔ log₁₀ M₀ − 6.06, and ⅔ × 19.30 − 6.06 = 6.80. The first bulletin's 6.6 is 10^(1.5 × 0.2) ≈ 2 times smaller in moment, which is exactly what a rapid short-period estimate misses: the long-period part of the record is where a large slow rupture shows up. So the revision is a statement about network coverage and waveform bandwidth, and the fault moved once."
        estimate:
          prompt: The later solution models 600 km² of ruptured fault slipping an average of 1.1 m, in crust with a rigidity of 3.0 × 10¹⁰ Pa.
          question: Choose the rigidity, the ruptured area in square metres, and the average slip.
          labels:
            - 3.0e10  (μ, rigidity of the crust in Pa)
            - 6.0e8  (A, ruptured area in m² — the 600 km² converted)
            - 1.1  (D, average slip in m)
            - 600  (A, the ruptured area still in km²)
            - 6.8  (the revised magnitude)
          values: [30000000000, 600000000, 1.1, 600, 6.8]
          slots: 3
          template: '{0} × {1} × {2}'
          formula: a*b*c
          correct: [0, 1, 2]
          target: 1.98e19
          tolerance: 2e18
          units: N·m of seismic moment
          solution: 3.0 × 10¹⁰ × 6.0 × 10⁸ × 1.1 ≈ 2.0 × 10¹⁹ N·m, and M_w = ⅔ log₁₀(2.0 × 10¹⁹) − 6.06 = 6.80.
          explanation: The moment doubled between bulletins because the second one could see the long-period signal. The fault moved once.
          givens:
            - 600 km² of ruptured fault, average slip 1.1 m
            - rigidity of the crust 3.0 × 10¹⁰ Pa
          relationship: M₀ = μ · A · D, and then M_w = ⅔ log₁₀ M₀ − 6.06 with the moment in newton metres.
      - group: SAFE
        task: Say it in a way that survives being repeated
        title: A notice somebody acts on
        place: Public Safety
        scene: |-
          Adeyemi has 200 words and an audience that has heard 2 numbers and a rumour about a bigger 1 coming. She wants to know what the notice has to contain.
        guide: >-
          All four of these will be in the notice, so nothing is being left out. Ask
          instead which one somebody can act on while standing in the street, and which
          is a fact they will repeat later. Two hundred words are read in the order they
          are printed. A revision from 6.6 to 6.8 changes nothing about what to do
          outside this building, and a rate is not a prediction.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim about dependency: each
              step is here because the one before it has already happened, or has to have.
              One transposed pair falsifies that claim wherever it sits, so partial credit
              would be credit for a sequence that does not work.
          - >-
              Why the ends are the place to start. The first and last cards are constrained
              by having nothing before or after them, which usually makes them the two you
              can settle from the scene alone. Pinning them collapses the remaining
              arrangements sharply, and what is left in the middle is where the actual
              judgement lives.
          - >-
              What the rail can be ordered on. Time is the usual axis, but it is not the
              only one. An order can run on cost, on risk, or on reversibility — every
              observation that leaves the sample as it was, before any that consumes it. On
              those boards a chronological reading finds nothing, because none of the steps
              has to happen at a particular hour.
        takesAsRead:
          - P and S waves, and what the gap between them measures
        assumes:
          - a public notice is read once, quickly, by somebody who is tired
        takeaway: A notice earns its place by changing what somebody does, and everything else in it competes with that.
        format: SEQUENCE
        question: Say it in a way that survives being repeated
        why: People act on the first thing they can use, so the action goes first. The reason comes next because it helps the instruction survive retelling. The magnitude revision belongs after the immediate action and explanation. It matters scientifically, but it does not change what someone should do outside this building. The aftershock forecast comes last and must be framed as a rate. That keeps a useful probability statement from being repeated as a prediction of a particular event.
        cards:
          - What to do about the building you are standing outside.
          - Why, in one sentence.
          - That the magnitude was revised from 6.6 to 6.8, and what that does and does not mean.
          - The aftershock forecast, stated as a rate per week.
        order: [0, 1, 2, 3]
  - title: What the placard is claiming
    objective: Learn what a rapid assessment can honestly say, and what it cannot.
    briefing: 400 buildings were placarded in 2 days by 6 people. Somebody has to say what that is worth.
    stake: >-
      Sunday, and the first placards are being argued about. Alan Whitcombe's team got through 400
      buildings in 2 days, which is fast, and Whitcombe is the first to say what that
      speed bought and what it cost. A green placard on a house in the Flats means an engineer stood
      outside it for six minutes. Yvette Delacroix has residents asking whether green means safe,
      and Peter Ives at the hospital wants to know why his yellow has not moved in three days. Today
      you work out what a rapid assessment actually inspects, what a placard colour is claiming, and
      which buildings have to be looked at again properly.
    takeaway: A placard states what an inspection covered, and the ones that go wrong are the ones read as covering more.
    stops:
      - group: STRUCT
        task: Say what a rapid assessment actually samples
        title: Six minutes outside a building
        place: Structural Assessment
        scene: |-
          Whitcombe's form has 11 boxes and a place for the colour. He filled 400 of them in 2 days, and he has kept a second list of everything he did not look at.
        guide: >-
          The left column is four things about a building. The right column says whether
          six minutes outside it could have reached them. Ask of each: could somebody
          see this from the footpath? A form with a colour on it will be read later as a
          claim about the whole building. So what was not looked at has to be recorded
          as carefully as what was, and Whitcombe kept that second list.
        background:
          - >-
              Why explanations rather than labels. Naming a finding is not accounting for
              it, and a plausible-sounding mechanism attached to the wrong observation is
              the commonest way a wrong story survives. Committing an explanation to one
              clue means claiming it accounts for that clue specifically and not for its
              neighbour, which is where the two come apart.
          - >-
              How to use the one-each rule. The explanations are a set to be distributed,
              not a list to be sampled, so every join constrains the rest. Settling the two
              you are confident of can decide the remaining pair by elimination. Where it
              does not, two explanations are still competing for one clue, and that
              competition is the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every explanation used once,
              three correct joins leave the fourth with only one place to go. Any error
              therefore involves at least two. That is worth remembering when the last pair
              looks forced: the fault is usually not in the join you are struggling with,
              but in one you made early and stopped questioning.
        assumes:
          - an inspection covers what the inspector could see
        takeaway: "A rapid assessment is triage: it records observed hazards and access limits, not a complete structural evaluation."
        format: CASEBOOK
        question: Say what a rapid assessment actually samples
        why: "A rapid assessment is designed to screen many buildings quickly after a disaster. It can identify gross leaning, collapse hazards, obvious structural distress and accessible life-safety problems. It cannot establish the condition of concealed connections, inaccessible rooms, foundations or every member in the load path. The discipline is therefore two-part: record what was observed and record what could not be observed. A green placard is useful only when later users do not silently expand its scope beyond the inspection that produced it."
        rebuttals:
          - Cracking visible from the street is exactly what a rapid assessment is designed to catch.
          - A connection inside a wall cannot be seen from outside and is not covered by the walk-past.
          - Foundation condition needs excavation or survey, neither of which happens in six minutes.
          - Damage in an unopened part of a building is invisible to any exterior inspection.
        columns:
          - What was inspected
          - What the placard can say about it
        scenarios:
          - Cracking in the visible outside walls.
          - A steel connection buried inside a wall lining.
          - The state of the foundation under the building.
          - The rear wing, which was locked and nobody entered.
        choices:
          - Covered — this is what a walk-past is for.
          - Not covered, and no colour on the door implies anything about it.
          - Not covered without survey or excavation.
          - Not covered, and the form should record that nobody got in.
        mapping: [0, 1, 2, 3]
      - group: SAFE
        task: Explain what green means to somebody standing in the street
        title: Green does not mean safe
        place: Public Safety
        scene: |-
          Delacroix has three residents outside with green placards and one question between them: is my house all right? Adeyemi will not say yes and needs a sentence that is not a dodge.
        guide: >-
          All four options are things a resident might hear as reassurance. They differ
          in how much they claim. Ask of each whether the rapid inspection could have
          established it. Three residents are outside asking whether their house is all
          right. A sentence that promises more than the inspection did is not kindness,
          and the placard will be quoted back later.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - people read a colour as a verdict
        takeaway: A placard is an occupancy decision based on a defined inspection, not a warranty that every hidden part is undamaged.
        format: CHOICE
        question: What does a green placard entitle somebody to be told?
        why: The public message should be specific. The rapid inspection found no observed condition requiring an occupancy restriction in the areas that could be assessed. The form also records what the team could not inspect. That is different from promising the building is undamaged or fully evaluated. It also does not guarantee safety in every aftershock. The limitation is scientifically useful because it tells the owner what the inspection actually established and which unresolved areas may still need follow-up before a particular use resumes.
        choices:
          - That the building is safe to live in and has been checked throughout.
          - That no restriction was found from what could be inspected, and what was not inspected is listed.
          - That the building came through undamaged and needs no repair work.
          - That the building will withstand any aftershock in the forecast.
        answer: That no restriction was found from what could be inspected, and what was not inspected is listed.
        rebuttals:
          - Nothing in a rapid assessment checks a whole building, so "checked throughout" is untrue.
          - Green is not a statement about repair work; plenty of green buildings need it.
          - No placard is a claim about future shaking, and the forecast is a rate rather than a guarantee.
      - group: HAZ
        task: Decide which buildings get looked at again
        title: The ones worth a second visit
        place: Hazard & Forecasting
        scene: The field roster locks in ten minutes. Two engineers are free tomorrow, four addresses are on Tanaka's board, and each has somebody waiting for an answer. Once the roster closes, the other three wait another day.
        guide: >-
          All four buildings deserve an answer and only two engineers are free. Ask of
          each two things: what did the first visit fail to see, and what is the cost of
          being wrong. An empty red building is already restricted, so a second visit
          changes little today. An anxious owner needs a conversation, which is not the
          same resource as an engineer-day.
        background:
          - >-
              Why first is a different question from most important. When several calls
              compete for the same hour, what a choice is worth is not its own importance
              but the difference between doing it now and doing it later. A serious problem
              that will be no worse in an hour costs nothing to defer. A smaller one that
              closes a door costs everything behind that door.
          - >-
              What to look for in the options. Two things separate them: which is still
              changing, and which is a precondition for the others. A situation that is
              deteriorating has a cost per hour attached to it, and a step that unblocks the
              rest multiplies the value of the hours after it. Everything else is a
              preference about where to start.
          - >-
              Why only one answer is marked. In the situation these options describe all of
              them eventually happen; what is being tested is the head of the queue, because
              that is where the reasoning is visible. The verdict names what each of the
              others was waiting on, which is worth reading even when the choice was right —
              the ordering behind the first place is the rest of the answer.
        assumes:
          - a second inspection is a scarce thing to spend
        takeaway: Re-inspect where the first look was least able to see and the consequence of being wrong is largest.
        format: TRIAGE
        question: Which building gets the detailed evaluation first?
        why: A second inspection is valuable when the first one left an important condition unseen and the consequence of being wrong is high. The hospital is worst on both counts. 90 patients are inside, and the unresolved plant room is exactly the item preventing a clearer placard. The red warehouse is empty and already restricted, so another visit changes little today. The two green buildings have lower consequence. Their owners still deserve answers, but that can begin with communication rather than a scarce engineer-day.
        choices:
          - The hospital, yellow, occupied by 90 patients, with an unopened plant room.
          - A green two-storey shop with a cracked front step.
          - A red warehouse, empty, on the port, with an obvious lean.
          - A green house whose owner is anxious and has called four times.
        answer: The hospital, yellow, occupied by 90 patients, with an unopened plant room.
        rebuttals:
          - A cracked front step is a non-structural defect on a low-consequence building.
          - The warehouse is empty and red; a second look changes nothing about who is at risk today.
          - An anxious owner deserves an explanation, which is a different resource from an engineer's day.
  - title: The building that looks worst
    objective: Separate what frightens people from what is actually holding the building up.
    briefing: Marina Court is leaning eight degrees and its structure is undamaged. The queue outside it is not about engineering.
    stake: >-
      Monday, and Marina Court is on the front page. Six storeys of flats sitting over at eight
      degrees above the marina, photographed from the water, and the photograph has done more to
      frighten this town than anything the office has said. Elena Navarro has been under it: the
      raft foundation is uncracked, the frame is plumb within itself, and the columns show nothing.
      Bram Halvorsen wants it demolished this week because of what it is doing to people. Marisol
      Okonkwo will not sign a demolition of a sound building on the strength of a photograph, and
      today she is right. Today you work out what actually failed, what the lean costs, and what a
      demolition would and would not fix.
    takeaway: A building can fail without breaking, and the thing that failed may be the ground it stands on.
    stops:
      - group: GEO
        task: Which explanation fits every observation?
        title: The raft is fine and the building is not
        place: Geotechnical
        scene: "Navarro's survey: the raft is intact, level within itself, and rotated. 1 side has gone down 340 millimetres and the other has come up 90. The sand fans are worst on the low side."
        guide: >-
          Four options, and the survey above has to be explained whole. Ask of each
          option how many of its four readings it covers. The intact raft. The level
          within itself. The rotation. And where the sand came up. A frame that failed
          would distort rather than rotate as one piece.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        takesAsRead:
          - Stress, strain and the yield point
        assumes:
          - a foundation spreads a building's weight into the ground
        takeaway: A structure can fail without anything in the structure breaking.
        format: CHOICE
        question: Which explanation fits every observation?
        why: The observations point to support beneath the raft rather than distortion within the frame. The raft is intact and the building rotated almost as a rigid body; one edge settled while the other heaved, with fresh sand ejecta concentrated on the low side. During liquefaction, excess pore pressure can sharply reduce effective stress and bearing resistance, allowing settlement and lateral movement without the frame itself yielding. That does not prove every detail, but it is the hypothesis that explains the survey, ejecta and undamaged frame together.
        headline: A six-storey block is eight degrees out of plumb, with no damage to its structure.
        readings:
          - zone: Raft foundation
            label: Cracking
            value: none
            status: normal
          - zone: Frame
            label: Out of plumb within itself
            value: 0.1°
            status: normal
          - zone: North edge
            label: Settlement
            value: 340 mm
            status: alarm
          - zone: South edge
            label: Heave
            value: 90 mm
            status: alarm
          - zone: Street
            label: Ejecta
            value: heavy on the north side
            status: alarm
        choices:
          - label: The frame failed and the lean is structural
            mechanism: A frame that has yielded on one side would lean this way.
          - label: The ground liquefied and lost bearing capacity under one side
            mechanism: Liquefied soil cannot carry the pressure under the raft, so the raft rotates into it.
          - label: The raft was built out of level and this predates the earthquake
            mechanism: A construction fault would produce a permanent lean.
          - label: An aftershock struck the building from one side
            mechanism: A directional pulse could push a building over.
        answer: The ground liquefied and lost bearing capacity under one side
        rebuttals:
          - A yielded frame shows distortion within itself, and this one is plumb to a tenth of a degree.
          - A construction fault would have been visible for years and would not come with fresh ejecta.
          - A single directional pulse does not settle 1 edge by 340 mm and lift the other.
      - group: STRUCT
        task: Decide what the lean actually costs
        title: What eight degrees does
        place: Structural Assessment
        scene: Okonkwo has the column loads. At eight degrees the weight above each column no longer lands over its centre, and the offset grows with height up the building. The survey sheet and column plan are open beside him.
        guide: >-
          All four options are true things about a leaning building. They differ in
          whether they name a load path or a feeling. Ask of each whether an engineer
          could put a number on it from the survey sheet and the column plan. A column
          carries weight best along its own axis. Eight degrees moves that weight off
          the axis, and the offset grows with height.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a leaning column carries its load off-centre
        takeaway: The lean matters because gravity now acts with eccentricity, creating P–Δ effects and extra bending demand in the frame.
        format: CHOICE
        question: What is the engineering objection to leaving Marina Court standing?
        why: A column is efficient when its gravity load stays close to its axis. Once the building leans, the weight above acts with an offset, creating additional bending moment; as lateral displacement grows, the gravity load can amplify that demand through P–Δ effects. The engineering question is therefore not whether eight degrees looks frightening, but whether the measured geometry, member capacities and continued ground stability leave adequate margin. The undamaged frame is encouraging evidence, not permission to ignore the new load path.
        choices:
          - That the lean will keep increasing on its own until the building falls over.
          - That the weight now acts off-centre, adding bending to columns built to be squashed.
          - That a leaning building is frightening and public confidence matters.
          - That the frame has been weakened by the rotation itself.
        answer: That the weight now acts off-centre, adding bending to columns built to be squashed.
        rebuttals:
          - The lean stops when the pore pressure dissipates; it is not a process that runs away by itself.
          - Public confidence is a real cost and a reason to explain, not a reason a structure is unsafe.
          - The frame is undamaged, which is precisely what the survey found.
      - group: SAFE
        task: Spend the five-day investigation budget on evidence that can change the town-wide decision about the ground beneath Marina Court and its neighbours.
        title: What knocking it down would fix
        place: Public Safety
        scene: Halvorsen wants Marina Court demolished this week. Delacroix has 12 neighbouring buildings on the same reclaimed ground and 5 investigation-days before the cordon review. Four proposed uses of that window are written across the site map.
        guide: >-
          Five investigation-days, four proposals, and a demolition somebody wants this
          week. Open each proposal to see what decision its result could change. Marina
          Court is already cordoned, so evidence about that one building changes nothing
          that is not already decided — the twelve neighbours on the same reclaimed
          ground are where the open decision is. Commit the window you would spend.
        background:
          - >-
              What is already decided and what is not. Marina Court is cordoned; nobody is
              going back in this week whatever a test says. The open question is whether the
              ground condition that damaged it requires action on the twelve buildings
              around it, and that is a question about the ground rather than about the
              building.
          - >-
              Why the most visible damage is the trap. A proposal to instrument the
              worst-damaged structure produces vivid results and answers a question that has
              been closed. It is the most defensible-sounding way to spend five days and
              learn nothing that changes a decision.
          - >-
              What generalising means here. A campaign of cone tests and boreholes across
              the Flats measures the fill itself, which every one of the thirteen buildings
              sits on. One result then bears on twelve open decisions instead of one closed
              one — the same money, an order of magnitude more use.
        assumes:
          - a decision can treat a symptom or a cause
        takeaway: The best next measurement is the one that can change the decision you still have to make, not the one that studies the most visible damage.
        format: VALUE
        question: Which investigation buys information that generalises beyond the one building already cordoned?
        value:
          hint: Open each proposal to see what decision its result could change. The five-day investigation window is fixed, and the current cordon remains in place during the work.
          budget:
            amount: 5
            unit: investigation-days
            label: Investigation window
          decision: Decide whether the ground condition that affected Marina Court also requires action on neighbouring blocks.
          options:
            - id: ground_campaign
              label: CPTs, boreholes and groundwater checks across the Flats corridor
              cost: 3
              axis: extent of susceptible ground
              decisive: true
              reveals: Whether the same loose saturated layers and groundwater conditions continue beneath neighbouring blocks.
            - id: lean_monitor
              label: Increase Marina Court lean monitoring
              cost: 1
              axis: motion of the known building
              decisive: false
              reveals: Whether the already-cordoned building is continuing to rotate or has stabilised over the monitoring window.
            - id: demolition_plan
              label: Advance demolition engineering for Marina Court
              cost: 4
              axis: removal of the known hazard
              decisive: false
              reveals: How the known building could be removed safely, without establishing whether nearby buildings share its ground condition.
            - id: underpin_concept
              label: Develop an underpinning concept for Marina Court alone
              cost: 4
              axis: single-building intervention
              decisive: false
              reveals: How one foundation might be strengthened, without mapping the extent of the underlying susceptible fill.
        answerText: Buy the corridor-wide ground investigation. Marina Court still needs its cordon and monitoring, but CPTs, boreholes and groundwater data can show whether the same failure mechanism threatens neighbouring blocks. Demolition or underpinning may later be justified, but neither answers the town-wide ground question.
        why: Demolition can remove Marina Court as a visible hazard, but it does not reveal whether the same ground condition extends beneath nearby buildings. A corridor investigation can. CPTs, boreholes and groundwater checks test the ground shared by several sites while the existing cordon controls the known building hazard. Extra lean monitoring or a one-building underpinning concept answer narrower questions. Value of information therefore depends on the decision the evidence can change, not on how dramatic or precise the proposed work sounds.
        evidence: The raft is uncracked and the frame is plumb within itself. 12 blocks stand on the same fill. Demolition would take three weeks and cost about the same as investigating the whole Flats. Nobody is inside the building. The lean has not changed in three days of readings.
  - title: The one everybody assumed was fine
    objective: Look at a green building properly, and find what a walk-past could never see.
    briefing: Bay Road School is green, term starts in a week, and nobody has been inside the gym.
    stake: >-
      Tuesday, and the school is the quiet problem. Bay Road School came through with a green
      placard, its classrooms look untouched, and the district would like 400 children back
      in it next week. Alan Whitcombe placarded it on day one from outside and wrote on his second
      list that the gymnasium was locked. The gym is a single-storey hall with a long-span roof, no
      internal walls, and heavy precast panels for its side walls. Marisol Okonkwo has the keys this
      morning. Today you work out what a long-span hall does in an earthquake, what holds its walls
      to its roof, and whether 400 children go into it on Monday.
    takeaway: The dangerous building is often the one nobody looked at, because nothing about it invited a second look.
    stops:
      - group: STRUCT
        task: Assemble the horizontal load path from panel inertia to the ground, then identify the required transfer whose failure opens that path.
        title: A hall with nothing in the middle
        place: Structural Assessment
        scene: Bay Road School's gym has a long roof, heavy precast wall panels and no interior bracing line. The structural drawings are pinned across a table. One panel connection tested poorly, but the larger members look undamaged.
        guide: >-
          Build the path the sideways force actually takes, in order, from the moving
          mass to the ground. Then name the one required transfer that would break the
          path if it went. The largest member is not automatically the answer: a path is
          only as good as its weakest handover, and the readings on each link tell you
          which handover that is.
        background:
          - >-
              What a lateral system is. In an earthquake the mass of the building wants to
              keep going sideways while the ground moves under it. That inertia has to be
              carried by something, handed on, and eventually delivered to the foundation.
              Each of those handovers is a connection, and a connection that cannot carry
              its share ends the path there.
          - >-
              Why a gym is the hard case. A long roof with heavy precast panels and no
              interior bracing line has very few paths available: the roof has to act as a
              horizontal plate and hand its load to the end walls, and the panels have to be
              tied into that plate. Remove one tie and the panel is a free-standing wall
              carrying its own inertia.
          - >-
              Why undamaged members are not reassurance. The beams and columns can be in
              perfect condition while the connection between them is not, and a connection
              is exactly what the drawings say least about. One panel connection tested
              poorly, which is a statement about the class of connection rather than about
              that panel.
        assumes:
          - a horizontal force has to travel through a building to reach the ground
        takeaway: A lateral system works only when every required transfer carries force continuously from the moving mass to the foundation.
        format: CHAIN
        question: Which link governs the panel load path when the building shakes sideways?
        chain:
          hint: Arrange the force transfers from the moving panel to the ground. Then choose the required link whose loss would open the otherwise continuous path.
          distractor: panel_body
          links:
            - id: panel_inertia
              label: Horizontal inertia of the precast panel
              transfers: lateral inertial force within the panel
            - id: panel_tie
              label: Tie between the precast panel and the roof
              transfers: panel force into the roof diaphragm
            - id: roof_diaphragm
              label: Roof diaphragm carrying force toward the end wall
              transfers: collected lateral force across the roof
            - id: end_wall
              label: Resisting end wall or frame
              transfers: roof shear into the vertical lateral system
            - id: foundation
              label: Foundation and ground
              transfers: base shear into the ground
            - id: panel_body
              label: The large precast panel body
              transfers: internal forces within the panel
          order:
            - panel_inertia
            - panel_tie
            - roof_diaphragm
            - end_wall
            - foundation
          governing: panel_tie
        answerText: The force path is panel inertia → panel-to-roof tie → roof diaphragm → resisting wall or frame → foundation. The governing link is the panel-to-roof tie. If that connection lets go, the size of the panel, roof and end wall cannot preserve a continuous path for the panel force.
        why: "Earthquake inertia does not disappear because the visible structural members are large. A base-shear relation such as V = C_sW estimates a total lateral demand, but that force still needs a continuous path to the ground. For the gym panel, inertia crosses the panel-to-roof tie, enters the roof diaphragm, reaches the resisting end wall or frame, and then reaches the foundation. The small tie is therefore load-bearing in the literal sense: if it opens, the rest of the strong path cannot collect that panel's force."
      - group: MAT
        task: Compare the measured anchor capacity with the estimated earthquake demand
        title: What the tested anchors actually carried
        concept: Stress, strain and the yield point
        place: Materials & Testing
        scene: |-
          Kirsten Sørensen has pulled two cast-in anchors from a spare panel in the yard. The design drawing says 40 kilonewtons each. The first came out at 24, the second at 27.
        guide: >-
          Five numbers, and two of them belong to other questions: the roof span and the
          number of panels. One is what the drawing promised rather than what the wall
          got. Ask of each whether it describes what the anchors carried or what the
          wall asks of them. And note what two pulls cannot carry: a ratio is not a
          factor of safety, whatever it comes out at.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - a designed capacity is a claim to be checked
        takeaway: Two pull tests can show a serious capacity shortfall; they do not by themselves establish a code-level factor of safety for every anchor in the building.
        format: BALLPARK
        question: Estimate the observed capacity-to-demand ratio for the two tested anchors.
        answerText: About 0.8 — below 1.
        why: "Two anchors were pulled. They averaged 25.5 kN against a demand of 31 kN, so what was measured is about 0.82 of what the wall asks of them. The anchors are short. But 0.82 is not a factor of safety, and calling it one claims far more than two pulls can carry: a real check also has to hold the scatter between anchors, the way the joint lets go when it lets go, and the margins the code puts on both. None of that has to be settled to act. Restrict the gym, test enough anchors to mean something, and design the repair."
        estimate:
          prompt: |-
            The 2 anchors tested at 24 kN and 27 kN. The assessed demand on each anchor from this earthquake is 31 kN.
          question: Choose the tested capacity and the demand.
          labels:
            - 25.5 kN  (mean tested capacity)
            - 31 kN  (assessed demand)
            - 40 kN  (the drawing's design capacity)
            - 34 m  (the roof span)
            - 8  (panels on this wall)
          values: [25.5, 31, 40, 34, 8]
          slots: 2
          template: "{0} ÷ {1}"
          formula: a/b
          correct: [0, 1]
          target: 0.82
          tolerance: 0.12
          units: (ratio)
          solution: Observed ratio = 25.5 ÷ 31 ≈ 0.82.
          explanation: About 0.82, below 1. This is an observed ratio from two specimens, not by itself a formal code factor of safety; variability and design resistance factors still matter.
          givens:
            - The anchors tested at a mean of 25.5 kN
            - The assessed demand on each is 31 kN
          relationship: Observed capacity-to-demand ratio = mean tested capacity ÷ assessed demand.
      - group: SAFE
        task: Say what happens to term
        title: 400 children on Monday
        concept: Placarding as a decision under uncertainty
        place: Public Safety
        scene: 400 children are due back Monday. The classrooms are sound and the gym is not. Halvorsen has parents calling, the district has no spare campus, and the morning bus schedule depends on whatever answer comes off this table.
        guide: >-
          All four options are defensible readings of one site with two different
          buildings on it. Ask of each whether it treats the site as one thing or as
          parts. The classrooms and the gym have different evidence behind them. Four
          hundred children arrive Monday and there is no spare campus. A decision that
          covers both buildings equally is ignoring half of what was measured.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a building can be used in part
        takeaway: The useful question is which parts can be occupied, not whether the site is open or shut.
        format: CHOICE
        question: What should happen to Bay Road School on Monday?
        why: The useful decision is component-specific. The classroom block has no identified structural deficiency, while the gym has heavy panels attached by connections whose tested capacity is below the estimated demand. If the gym can be physically isolated from classroom access and egress, the classrooms can reopen while the hall remains closed and the connections are repaired. If routes or falling hazards overlap, that separation has to be solved first. Partial occupancy is not optimism; it is a controlled use tied to the actual defect.
        choices:
          - Open the whole site; the placard is green and the classrooms are undamaged.
          - Open the classrooms and close the gymnasium until the panel connections are fixed.
          - Close the whole site until every building on it has had a detailed evaluation.
          - Open the site but hold all classes in the gymnasium, which has no internal walls to fall.
        answer: Open the classrooms and close the gymnasium until the panel connections are fixed.
        rebuttals:
          - The green placard covered what could be seen from outside, and the gym was locked.
          - Closing the classrooms protects nobody, since nothing in them is deficient.
          - The gym is the worst room on the site, not the safest — its walls are the ones tied on by anchors that tested below demand.
  - title: The hospital, and what waiting costs
    objective: Resolve a yellow placard on the one building the district cannot do without.
    briefing: 90 patients, 3 days of yellow, and an argument about whether more evidence is worth more time.
    stake: >-
      Wednesday, and the hospital has been yellow for four days. Peter Ives has 90 patients on
      the ground floor and the 2 upper floors closed, the district's surgery is being done 60
      kilometres away, and 2 people have already been transferred who would not have been. Marisol
      Okonkwo wants the plant room opened and the shear walls cored before she signs anything. Bram
      Halvorsen says every day of that is a day of care not delivered, and this morning he is right:
      the evidence Okonkwo wants will take four days and will not change what the building is. Today

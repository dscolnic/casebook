  - title: The material, and what it can still carry
    objective: Get a number for the strength of a damaged building instead of an opinion.
    briefing: The library's columns look cracked. Nobody has said what they can still hold.
    stake: >-
      Friday, and the argument at the base has moved from buildings to numbers. The public library is
      a 1970s concrete frame with diagonal cracking in 3 ground-floor columns, and 3
      engineers have looked at it and used the words moderate, serious and superficial. Duarte
      Ferreira points out that none of those is a number, and that his laboratory can produce one in
      a day. Kirsten Sørensen has already cut four cores and refused a fifth for arriving without a
      label saying which column it came from. Today you take a sample properly, turn it into a
      strength, compare it with what the design assumed, and decide what the building may be used
      for while that is happening.
    takeaway: A word like serious is an opinion; a strength with a method behind it is something the next engineer can use.

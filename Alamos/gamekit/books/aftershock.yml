  - title: Three things at once
    objective: Rank three demands on one office in one afternoon.
    briefing: An aftershock, a burst main and a deadline for the school, all inside an hour.
    stake: >-
      Wednesday, 15:40, and 3 things arrive together. A magnitude 5.1 aftershock has just shaken
      the town, which is the largest in a week. A water main has burst on Ferry Street and is
      pouring into ground everybody now knows is loose. And the district wants a decision on the
      school gymnasium by five o'clock, because contractors are holding a slot for Saturday. Marisol
      Okonkwo has four engineers, Bram Halvorsen is on the phone to the utility, and Funmi Adeyemi
      has three drafts of a notice nobody has approved. Today you decide what gets attention first,
      work out what the aftershock did to buildings already damaged, and say what a burst main does
      to fill.
    takeaway: Ranking is about which problem grows fastest and which is cheapest to remove, not about which sounds worst.
    stops:
      - group: SAFE
        task: Keep one incident under your own engineering attention and delegate the others with an owner, a first action and a return condition.
        title: Which of the three cannot wait
        place: Public Safety
        scene: >-
          Three calls land within minutes. A burst main is feeding water into the Flats.
          Several vulnerable buildings need checks after the M5.1 aftershock, and Bay
          Road School needs its reopening message issued. Four engineers are available.
        guide: >-
          Three calls, four engineers, and one of the three you have to keep yourself.
          For each of the others, choose an owner who can take a real first action and
          the reading or event that brings the problem back to you. A handover with an
          owner and no return condition is not a handover. Then take the watch on the
          one that needs your own judgement.
        background:
          - >-
              Which one to keep. One of these is getting worse while you decide, one has a
              life-safety consequence that has to be checked, and one is a deadline that is
              stable — the message will still need issuing in an hour. Keeping the stable
              one is the classic error: it is the easiest to finish, and finishing it costs
              the field response its hours.
          - >-
              Why a first action is required. "Watch it" is not a handover. An owner who
              cannot take a concrete step is a person who will come back for instructions at
              the worst moment, so the panel asks for the action they will take before they
              need to ask anybody.
          - >-
              Why a return condition is the other half. Delegation is not disposal: the
              problem comes back if it crosses a threshold, and naming that threshold now is
              what lets somebody else hold it without checking in. A burst main over
              liquefiable fill and a reopening message have very different triggers, and
              both need one.
        assumes:
          - a problem still growing is different from one that has finished
        takeaway: Good delegation couples every handoff to a first action and a condition for returning the problem, while scarce expert attention stays on the judgment that cannot be automated.
        format: DELEGATE
        question: How do you divide the team so the worsening condition is stopped, the life-safety consequence is checked and the stable deadline does not consume the field response?
        delegate:
          hint: Assign each handoff to a role that can take its first real action. The handoff is incomplete until it also says what result or threshold brings the problem back to you.
          team:
            - id: utility
              label: utility
            - id: player
              label: player
            - id: desk
              label: desk
          people:
            - id: utility
              label: Utility liaison
            - id: desk
              label: Desk engineer
            - id: field
              label: Field engineer
            - id: player
              label: Building Safety Coordinator
          problems:
            - id: burst_main
              label: Burst water main over liquefaction-susceptible fill
              trend: rising
              irreversible: true
              loud: true
              stable: false
              rate: worsens while uncontrolled flow continues
              consequence: additional water raises pore pressure and can reduce effective-stress margin before another strong aftershock
              owner: utility
              firstAction: Order immediate isolation of the main and confirm that flow is stopping
              returnCondition: Return when flow is isolated or if isolation cannot be achieved promptly
              delegable: true
            - id: aftershock_checks
              label: Known vulnerable occupied or shored buildings after the M5.1 aftershock
              trend: not rising
              irreversible: false
              loud: false
              stable: false
              rate: new damage, if present, occurred during the completed aftershock
              consequence: restrictions could be relaxed or retained on the wrong structural condition without a focused re-check
              owner: player
              firstAction: Start rapid re-checks at the highest-risk occupied or shored buildings
              returnCondition: Do not relax restrictions until the rapid checks establish whether new distress occurred
              delegable: false
            - id: school_deadline
              label: Bay Road School reopening communication deadline
              trend: not rising
              irreversible: false
              loud: true
              stable: true
              rate: communication deadline approaches but the technical conclusion is unchanged
              consequence: families lack a clear route and occupancy message even though the engineering decision already exists
              owner: desk
              firstAction: Issue the classroom-open and gym-closed message with the route controls
              returnCondition: Return only if the isolation plan cannot keep occupied routes clear of the gym hazard
              delegable: true
          first: aftershock_checks
          firstActions:
            - id: a1
              label: Order immediate isolation of the main and confirm that flow is stopping
            - id: a2
              label: Start rapid re-checks at the highest-risk occupied or shored buildings
            - id: a3
              label: Issue the classroom-open and gym-closed message with the route controls
        answerText: Keep the post-aftershock building checks under direct engineering attention. Send the utility liaison to isolate the burst main immediately. Give the school communication to the desk engineer. Every handoff needs an owner, a first action and a return condition, so field judgment stays on uncertain building consequences.
        why: The burst main is actively worsening the ground condition, so utility isolation starts immediately. The M5.1 aftershock is over, but vulnerable or shored buildings may have new distress. That uncertainty needs engineering judgment before restrictions change. The school decision is already technically settled and mainly needs communication. Parallel work is therefore better than a single ranked list. Stop the growing input, keep direct attention on uncertain building consequences, and hand the stable message to the desk.
      - group: GEO
        task: Say what water does to fill
        title: Wetting ground that has already failed
        place: Geotechnical
        scene: |-
          Mbeki is on Ferry Street with a standpipe. The water table under the road has risen three quarters of a metre since the main went, and the ground surface is soft again underfoot.
        guide: >-
          Put a number on what the leak did. The grains are held together by the effective
          stress, which is the total weight above them less the water pressure between them.
          Pick the total stress at three metres and the pore pressure the risen water table
          now gives, and take one from the other. Two tiles are the pressures before the main
          burst, which is the comparison rather than the answer.
        background:
          - >-
              What effective stress is. The soil skeleton carries the difference between the
              total stress pressing down and the water pressure in the pores pushing the grains
              apart. Strength lives in that difference, which is why a saturated fill can be
              strong one day and behave like a liquid the next without a gram of it moving away.
          - >-
              What the leak did and did not do. A higher water table raises the pore pressure and
              takes the margin down. It liquefies nothing on its own — cyclic shaking is still
              required to build the pressure the rest of the way. What has changed is how much
              shaking that now takes.
          - >-
              Why Upper Town is different. On competent granite the same burst main is a plumbing
              problem. There is no loose saturated skeleton whose grain contacts can be unloaded
              by water pressure, so the mechanism has nothing to act on.
        assumes:
          - liquefaction requires saturated ground
        takeaway: Raising the water table reduces effective stress in susceptible fill, increasing liquefaction susceptibility during renewed shaking without causing liquefaction by itself.
        format: BALLPARK
        question: At three metres down under Ferry Street, what is the effective stress now the water table has risen?
        answerText: About 39 kilopascals (kPa), down from 47 before the main burst — the grains are carrying 16 per cent less, and it takes a correspondingly smaller aftershock to finish the job.
        why: "Effective stress is σ' = σ − u. The fill weighs about 18 kN per cubic metre, so at three metres the total vertical stress is 18 × 3 = 54 kPa, and that has not changed. What has changed is the water. The table was 2.25 m down, giving a pore pressure at three metres of 9.81 × 0.75 ≈ 7.4 kPa and an effective stress of 54 − 7.4 ≈ 47 kPa. It is now 1.5 m down, so u = 9.81 × 1.5 ≈ 14.7 kPa and σ' = 54 − 14.7 ≈ 39 kPa. The skeleton is carrying about 16 per cent less than it was on Monday, and everything the ground can resist scales with that number. The leak has liquefied nothing by itself; cyclic shaking is still required to raise u the rest of the way to σ. It has simply moved the starting point closer, which is why the same aftershock forecast means something different on Ferry Street this week. On granite there is no loose saturated skeleton for the mechanism to act on at all."
        estimate:
          prompt: The fill weighs about 18 kN/m³. The water table under Ferry Street is now 1.5 m down, so at 3 m the pore pressure is 9.81 × 1.5 ≈ 14.7 kPa.
          question: Choose the total vertical stress at three metres and the pore pressure there now.
          labels:
            - 54  (σ, total vertical stress at 3 m, in kPa)
            - 14.7  (u, pore pressure at 3 m now, in kPa)
            - 7.4  (u before the main burst, in kPa)
            - 47  (σ' before the main burst, in kPa)
            - 0.75  (metres the water table has risen)
          values: [54, 14.7, 7.4, 47, 0.75]
          slots: 2
          template: '{0} − {1}'
          formula: a-b
          correct: [0, 1]
          target: 39.3
          tolerance: 3
          units: kilopascals (kPa) of effective stress
          solution: 54 − 14.7 ≈ 39 kPa, against 54 − 7.4 ≈ 47 kPa before the main burst.
          explanation: The grains carry 16 per cent less than they did. Shaking is still needed to liquefy the fill; less of it than before.
          givens:
            - fill at about 18 kN/m³, so σ = 54 kPa at three metres
            - the water table is now 1.5 m down, giving u ≈ 14.7 kPa
          relationship: Effective stress is σ' = σ − u — the total stress less the pore-water pressure, and the strength of the soil lives in the difference.
      - group: STRUCT
        task: Work out what the 5.1 did to the shored buildings
        title: A smaller shake against a weaker building
        concept: Peak ground acceleration and what a building feels
        place: Structural Assessment
        scene: |-
          The 5.1 was about a tenth of the mainshock's ground motion in the Flats. 11 buildings have been shored since Friday, and 2 of them have new cracking this afternoon.
        guide: >-
          Four readings of the same afternoon. Ask of each what the shoring was for. It
          is temporary support, not a repair, so new cracking is not automatically a
          failure of it. What has changed since Friday is on the other side of the
          comparison. Eleven buildings have less capacity, and two of them responded.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        takesAsRead:
          - P and S waves, and what the gap between them measures
        assumes:
          - a shored building is being held rather than repaired
        takeaway: New cracking during a smaller aftershock is evidence that residual capacity or detailing deserves escalation; it is not a complete diagnosis by itself.
        format: CHOICE
        question: What do the two buildings with new cracking tell the office?
        why: "Shoring is temporary load support, not restoration of the damaged structural system. New cracking during a smaller aftershock therefore matters: it shows that the current combination of residual capacity, shoring and aftershock demand produced additional distress. That is a reason to maintain or tighten restrictions and perform a focused reassessment before deciding on strengthening, evacuation or a revised shore scheme. It does not by itself prove the shoring failed, identify the exact damaged mechanism, or tell you how close the building is to collapse."
        choices:
          - That the shoring failed and should be replaced with a different system.
          - That these two are near their reduced capacity, which is what shoring bought time against.
          - That the aftershock was much larger in those two streets than the network recorded.
          - That the original assessment of both buildings was wrong.
        answer: That these two are near their reduced capacity, which is what shoring bought time against.
        rebuttals:
          - The shoring is still standing and doing its job; nothing about it failed.
          - Network stations either side of those streets recorded the same motion, so the shaking was not local.
          - The original assessment said these buildings had reduced capacity, which is exactly what this confirms.
  - title: The last morning it can be changed
    objective: Commit the town to a rebuilding standard while the window is open.
    briefing: The recovery plan closes for comment today, and the ground improvement clause is in or out.
    stake: >-
      Thursday, and the recovery plan goes to the council tonight. Inside it is one clause that
      matters more than the rest: whether rebuilding in the Flats requires ground improvement, or
      merely stronger foundations. Elena Navarro has the corrected amplification and the borehole
      programme. Bram Halvorsen has the cost, which is large and falls on people who have just lost
      houses. Yvette Delacroix has 400 households who want to rebuild this year and cannot
      afford to wait for a scheme. After tonight the clause cannot be reopened for five years.
      Today you work out what ground improvement buys, what it costs, and what the town commits to
      if the clause goes in — and what it commits to if it does not.
    takeaway: The moment a decision stops being reversible is the moment it needs the whole argument, not the quickest one.
    stops:
      - group: GEO
        task: Say what ground improvement actually does
        title: Fixing the ground instead of the building
        place: Geotechnical
        scene: "Navarro has three options costed: stone columns, deep densification, and doing nothing to the ground while designing stiffer foundations on top of it. The council wants one approach written into the rebuild guidance."
        guide: >-
          Three costed options and four readings of what separates them. Ask of each
          option where in the system it acts: on the soil, on the structure, or on
          neither. A stiff foundation can carry a building across ground that moves. It
          does nothing for the road, the buried services or the site next door. Both
          approaches can be right, and the council is writing one of them into guidance.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - liquefaction can be addressed in the ground or accommodated in the structure
        takeaway: Ground improvement reduces liquefaction susceptibility or its consequences; structural foundations can instead bypass or accommodate some ground deformation.
        format: CHOICE
        question: What is the engineering difference between treating the ground and designing the foundation around the hazard?
        why: The two strategies act at different places in the system. Densification can increase density and cyclic resistance; drains or stone columns may also help dissipate excess pore pressure, depending on the design. That reduces liquefaction susceptibility rather than guaranteeing the soil can never liquefy. Structural solutions such as piles or rafts may bypass weak layers or tolerate differential movement, but they leave roads, buried utilities and neighbouring sites exposed to ground deformation. Both can be legitimate; the town-level question is which consequences the policy is trying to reduce.
        choices:
          - There is none in practice; both prevent liquefaction damage equally.
          - Improvement stops the fill liquefying; a stiff foundation only rides it out.
          - Improvement is cheaper because it is done once for a whole street.
          - A stiffer foundation prevents shaking from reaching the building at all.
        answer: Improvement stops the fill liquefying; a stiff foundation only rides it out.
        rebuttals:
          - The two are not equivalent, since one removes the mechanism and one accommodates it.
          - Improvement is generally more expensive per site, not less, though it covers more than the building.
          - Nothing stops shaking reaching a building; a stiff foundation changes how it responds to it.
      - group: MAT
        task: Quantify the change in cone resistance without turning it into a false safety factor
        title: A measurable acceptance target
        place: Materials & Testing
        scene: "Ferreira has cone penetration results from a trial panel: the fill tested at 4 MPa before the stone columns went in and 11 after. The two CPT traces lie side by side on the desk."
        guide: >-
          Five numbers, and three belong elsewhere: the depth of the fill, the
          amplification factor and a concrete strength. Ask of each whether it came from
          these two cone traces. And note what the factor is and is not. Cone resistance
          is an input to a liquefaction assessment, so 2.75 times the resistance is not
          2.75 times the margin.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - "CPT stands for cone penetration test: a standard cone is pushed into the ground and its resistance is recorded"
        takeaway: CPT resistance is a measurable quality-control indicator; a 2.75-fold increase in qc is not automatically a 2.75-fold increase in liquefaction resistance.
        format: BALLPARK
        question: By what factor did the measured cone resistance increase?
        answerText: About 2.8 times.
        why: "The measured cone resistance rose from 4 to 11 MPa, a factor of 2.75. That is a strong, auditable construction-control result: the treated ground is substantially more resistant to penetration at that location. But qc is an input to liquefaction evaluation, not a direct safety factor. Cyclic resistance also depends on overburden, fines, groundwater and the design method used. A good specification can therefore require a target corrected CPT resistance or verified performance profile without claiming that '2.75 times qc' means '2.75 times safer.'"
        estimate:
          prompt: The trial panel tested at 4 MPa cone resistance before treatment and 11 MPa after.
          question: Choose the two cone resistances.
          labels:
            - 11 MPa  (after treatment)
            - 4 MPa  (before treatment)
            - 15 m  (depth of the fill)
            - 5  (the corrected amplification factor)
            - 28 MPa  (concrete strength from the library cores)
          values: [11, 4, 15, 5, 28]
          slots: 2
          template: "{0} ÷ {1}"
          formula: a/b
          correct: [0, 1]
          target: 2.75
          tolerance: 0.5
          units: × stronger
          solution: 11 ÷ 4 ≈ 2.8 times the original resistance.
          explanation: Nearly three times. The fill depth, the amplification factor and the library's concrete strength are all real numbers from this fortnight and none of them belongs here.
          givens:
            - Cone resistance before treatment was 4 MPa
            - Cone resistance after treatment was 11 MPa
          relationship: Improvement factor = resistance after ÷ resistance before.
      - group: SAFE
        task: Commit, and say what the commitment contains
        title: What the next five years hold
        place: Public Safety
        scene: The clause goes in or it does not, and nobody can reopen it for five years. Delacroix is holding the spring rebuild schedule beside the draft ordinance. The geotechnical section is the last unresolved page.
        guide: >-
          Four versions of the clause on the left, and what each one actually produces
          on the right. Pair them by asking who has to pay and how soon. A requirement
          nobody can afford stops rebuilding instead of improving ground. No requirement
          rebuilds the same vulnerability on the same fill. And the last pairing is
          about time: nobody can reopen this for five years.
        background:
          - >-
              Why this is a matching board and not four separate questions. Responses on
              boards like this are written to be plausible for more than one situation, so
              choosing them one at a time lets a nearly-right answer through unexamined.
              Having to place all of them forces the comparison — not "is this reasonable
              here", but "is it more right here than there".
          - >-
              How to use the one-each rule. Because the responses are a set to be
              distributed rather than a list to be sampled, every join you make constrains
              the rest. Settling the two you are confident of can leave the remaining pair
              decided by elimination. Where it does not, two responses are still competing
              for one situation, and that is exactly the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every response used once,
              three correct joins leave the fourth with only one place to go. Any error
              therefore involves at least two joins. That is worth remembering when the last
              pair looks forced: the fault is usually not in the join you are struggling
              with, but in one you made early and stopped questioning.
        assumes:
          - a decision to require something is also a decision about who pays for it
        takeaway: Science can define the hazard and performance target; the rebuilding policy must also specify affordability, phasing and who carries the cost.
        format: PROTOCOL
        question: Commit, and say what the commitment contains
        why: The engineering evidence can define the ground hazard and the performance a treatment programme should demonstrate. It cannot decide who pays or how quickly households must comply. A requirement without financing can stall rebuilding. No requirement can reproduce the same vulnerability. A workable policy therefore states where the rule applies and names a measurable geotechnical acceptance target. It also provides funding or phasing and a review process as new site data arrive. That separates the technical standard from the political choices needed to implement it.
        rebuttals:
          - With the clause, the ground improves street by street over about a decade as sites are rebuilt.
          - With the clause, 400 households meet a cost they have not budgeted for, so it needs a scheme beside it.
          - Without it, rebuilding is fast and cheap, and the fill is unchanged when the next earthquake comes.
          - Either way the decision is fixed for five years, which is why it is argued tonight rather than next spring.
        columns:
          - The version
          - What the town is committing to
        scenarios:
          - The clause goes in, with a funding scheme beside it.
          - The clause goes in, with no scheme.
          - The clause stays out.
          - Either version, once council has voted.
        choices:
          - The ground improves street by street over about a decade as sites are rebuilt.
          - A requirement people cannot afford, which stops rebuilding rather than improving ground.
          - Fast, cheap rebuilding on the same fill, in place for the next event.
          - Five years in which the decision cannot be reopened, whatever is learned.
        mapping: [0, 1, 2, 3]
  - title: What we know, and how well
    objective: State the fortnight's findings at the confidence each one has earned.
    briefing: The report goes out today, and it has to say which of its findings are measurements and which are judgements.
    stake: >-
      Friday, two weeks on, and the fortnight goes into a report. Marisol Okonkwo will not sign a
      document that states everything at the same confidence, because a reader who cannot tell a
      measurement from a judgement will act on both the same way. Elena Navarro has the borehole
      results. Rei Tanaka wants her forecast stated as a rate with a range rather than as a number.
      Inês Cardoso wants the vault siting error written down as a finding rather than buried as a
      correction. Funmi Adeyemi has to turn all of it into something a household can use. Today you
      sort the findings by the evidence under them, and decide which of the fortnight's changes
      should outlive the emergency.
    takeaway: A finding is worth what its evidence is worth, and saying so is what makes a report usable a year later.
    stops:
      - group: SEIS
        task: Sort the findings by their evidence
        title: Measured, inferred, assumed
        concept: "Documentation: the record somebody inherits"
        place: Seismic Network
        scene: |-
          Cardoso lays out four of the fortnight's statements. The office believes all four. They are not held for the same reasons and she will not let them into the report as equals.
        guide: >-
          Four statements the office believes, held for four different reasons. Sort
          them by what an opponent would have to produce to challenge each: a second
          log, another event, a borehole, or a future earthquake. Belief is not the
          variable. The weakest of the four is the one the plan clause rests on, and
          saying so in the report is what makes it usable.
        background:
          - >-
              Why explanations rather than labels. Naming a finding is not accounting for
              it, and a plausible-sounding mechanism attached to the wrong observation is
              the commonest way a wrong story survives. Committing an explanation to one
              clue means claiming it accounts for that clue specifically and not for its
              neighbour, which is where the two come apart.
          - >-
              How to use the one-each rule. The explanations are a set to be distributed,
              not a list to be sampled, so every join constrains the rest. Settling the two
              you are confident of can decide the remaining pair by elimination. Where it
              does not, two explanations are still competing for one clue, and that
              competition is the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every explanation used once,
              three correct joins leave the fourth with only one place to go. Any error
              therefore involves at least two. That is worth remembering when the last pair
              looks forced: the fault is usually not in the join you are struggling with,
              but in one you made early and stopped questioning.
        assumes:
          - a claim can rest on a measurement, on an inference, or on nothing yet
        takeaway: Sorting findings by their evidence is what lets a later reader know which ones to check first.
        format: CASEBOOK
        question: Sort the findings by their evidence
        why: The four claims deserve different labels because their evidence chains differ. The vault siting error is directly documented and independently checked against competent rock. The hospital's 0.31 g is a direct measurement for 1 location and 1 event. Marina Court's mechanism is a strong inference from survey, ejecta and geotechnical behaviour rather than a direct observation beneath the raft. Future Flats amplification is conditional on corrected site-response evidence and the frequency content of a future earthquake. Stating those limits makes the report more useful, not weaker.
        rebuttals:
          - The vault error has a 1998 trench log and 5 days of side-by-side recording behind it.
          - The hospital's 0.31 g came from an instrument in its own basement, for 1 event.
          - Marina Court's cause is sound geotechnics on a survey, with no borehole under the raft.
          - The future behaviour of the fill is a projection, and it is the weakest claim in the report.
        columns:
          - The finding
          - How strongly it is held
        scenarios:
          - The reference vault is founded on weathered granite, not rock.
          - The hospital experienced 0.31 g at its base.
          - Marina Court rotated through loss of bearing capacity.
          - The Flats will amplify by about five in a future earthquake.
        choices:
          - Established. A 1998 trench log and 5 days of side-by-side records.
          - Measured, once, at one building, for one event.
          - Inferred. Good geotechnics on a survey, with no borehole under the raft.
          - Projected. The weakest claim in the report, and the one the plan clause rests on.
        mapping: [0, 1, 2, 3]
      - group: HAZ
        task: State the forecast as a range
        title: The number that has to be a range
        place: Hazard & Forecasting
        scene: Tanaka's aftershock forecast goes into the report. She wants the range in the sentence and Okonkwo wants to know what the range is for. The staffing appendix cannot be signed until she chooses the wording.
        guide: >-
          Four reasons to publish a range, and they differ in who the range is for. Ask
          of each whether it is about caution, honesty, defensibility, or planning.
          Nobody staffs an emergency to the average week. A single number tells a
          planner nothing about how far the sequence might run above it, so they invent
          a margin instead. The staffing appendix cannot be signed until the wording is
          chosen.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a forecast is a distribution rather than a single value
        takeaway: A forecast without a range cannot size a decision, because the decision is sized against the range.
        format: CHOICE
        question: Why does the forecast go in as a range rather than a single number?
        why: |-
          Nobody staffs an emergency to the average week. They staff it to a week that is worse than average, and how much worse is exactly what the range says. A single number tells a planner nothing about how far the sequence might run above it, so the planner invents a margin — usually badly, usually too small. The range is also the honest part: it says which part of the behaviour is well constrained by 400 recorded events and which is not.
        choices:
          - Because a range is more cautious, and caution is appropriate after an event like this.
          - Because what people have to plan against is the upper end, and a single number deletes it.
          - Because the model is not good enough yet to state a single number honestly.
          - Because a range cannot be shown to be wrong afterwards.
        answer: Because what people have to plan against is the upper end, and a single number deletes it.
        rebuttals:
          - Caution is not the reason; the range is a quantity the staffing calculation needs as an input.
          - The model's quality is what the range states, which is the opposite of hiding it.
          - A range makes the forecast checkable, because outcomes outside it count against the model.
      - group: STRUCT
        task: Choose the permanent practice that closes the repeated blind spot
        title: What outlives the emergency
        place: Structural Assessment
        scene: Four things the office started doing under pressure. Okonkwo asks which of them is worth its cost on an ordinary Tuesday, when nothing has happened. The emergency procedures are being rewritten into the permanent manual.
        guide: >-
          All four practices are good ones. Two questions separate them. Does it block
          the failure that actually happened? And will the office still be doing it in a
          quiet month? Trace each back to the mechanism. The gym, the plant room and the
          basement were all outside the first inspection. All three omissions were
          written down, and nobody acted on the list.
        background:
          - >-
              Why first is a different question from most important. When several calls
              compete for the same hour, what a choice is worth is not its own importance
              but the difference between doing it now and doing it later. A serious problem
              that will be no worse in an hour costs nothing to defer. A smaller one that
              closes a door costs everything behind that door.
          - >-
              What to look for in the options. Two things separate them: which is still
              changing, and which is a precondition for the others. A situation that is
              deteriorating has a cost per hour attached to it, and a step that unblocks the
              rest multiplies the value of the hours after it. Everything else is a
              preference about where to start.
          - >-
              Why only one answer is marked. In the situation these options describe all of
              them eventually happen; what is being tested is the head of the queue, because
              that is where the reasoning is visible. The verdict names what each of the
              others was waiting on, which is worth reading even when the choice was right —
              the ordering behind the first place is the rest of the answer.
        assumes:
          - a practice adopted under pressure has a cost that only shows later
        takeaway: An unknown only becomes safer when it has an owner, a deadline and a rule that prevents final clearance from silently forgetting it.
        format: TRIAGE
        question: Which permanent practice would most directly prevent the school, hospital and Ferry Street failure mode from repeating?
        why: A permanent practice should catch recurring failure modes at a cost the office will actually keep paying. The school gym, hospital plant room and Ferry Street basement were all outside the first inspection scope, yet the omissions were written down. Making that unresolved list actionable would have exposed each gap. Two engineers on every placard would halve throughput without a measured benefit. Daily public meetings were useful only during the crisis. Re-inspecting every shored building after every magnitude-4 event is so broad that staff would eventually stop following the rule.
        choices:
          - Recording, on every inspection, the parts of the building nobody could see.
          - Two engineers on every placard, which halves the number of buildings assessed per day.
          - A daily public meeting, which took two hours out of every afternoon.
          - Re-inspecting every shored building after any aftershock above magnitude 4.
        answer: Recording, on every inspection, the parts of the building nobody could see.
        rebuttals:
          - Doubling up on placards halves the number of buildings cleared per day, for an error rate nobody has quantified.
          - A daily public meeting was right during the emergency and is not sustainable as a standing practice.
          - A rule triggered by every magnitude 4 will be dropped the first quiet year, which makes it worse than no rule.
interiors:
  SEIS:
    caption: An instrument records the place it stands in, not the earthquake.
    standLine: 2 traces of 1 event, 1100 metres apart.
    station:
      kind: panel
      title: Vault channel

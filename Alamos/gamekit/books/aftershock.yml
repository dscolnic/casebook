          template: "{0} ÷ {1}"
          formula: a/b
          correct: [0, 1]
          target: 13
          tolerance: 4
          units: events
          solution: n ≈ 26 ÷ 2 ≈ 13 events on day 8.
          explanation: |-
            About 13. The day-one count and the running total describe the sequence so far, and the magnitude is the size of the mainshock rather than anything about the rate.
          givens:
            - Day 4 had 26 events above magnitude 3
            - Day eight is twice as far from the mainshock
          relationship: |-
            Rate ≈ K ÷ elapsed time, so doubling the time since the mainshock roughly halves the number of events per day.
      - group: SEIS
        task: Say what a forecast does not claim
        title: A rate is not a schedule
        concept: Probability of a larger event after a mainshock
        place: Seismic Network
        scene: The notice draft says the aftershocks will have stopped by the end of the month. Cardoso points at the sentence and asks where the month came from. The sentence is due for the afternoon public bulletin.
        guide: >-
          Put the fitted numbers through the decay law and see what day thirty actually
          gives. The rate falls as a power of the time since the mainshock, so pick the
          productivity, the time offset and the elapsed days, and read the answer as
          events per day. One tile is the exponent, which goes in the power and not in the
          denominator on its own.
        background:
          - >-
              What the law says. The rate of aftershocks per day falls roughly as one over the
              elapsed time raised to a power near one, with a small offset that keeps the first
              hours finite. It is a decay, not a countdown: the curve approaches zero and never
              arrives, which is why no end date can be read off it.
          - >-
              Why a fitted rate is not a schedule. The number that comes out is an expectation
              over an interval — so many per day on average. Actual counts scatter around it,
              some days three and some days none, and a rate of a tenth of an event per day does
              not promise the tenth day is the one.
          - >-
              Why size is a separate question. The decay law describes how often, and the
              magnitude distribution describes how large. A falling rate lowers the chance of a
              large aftershock in the same proportion as a small one, and rules nothing out.
              Publishing a month is therefore two mistakes: an end where there is a fade, and a
              date where there is a rate.
        takesAsRead:
          - Aftershock decay as a power law
        assumes:
          - a forecast states what is expected on average
        takeaway: A rate says how often, not when or how large, and writing it as a date makes a promise nobody can keep.
        format: BALLPARK
        question: At day 30 after the mainshock, what does the fitted decay law give as the expected rate?
        answerText: About 2.7 events a day above magnitude 2, falling and never reaching zero. That is a rate with a range, not an end date — and the draft's month cannot be read off this curve at all.
        why: "The Omori–Utsu law is n(t) = K / (c + t)^p, and the fitted values for this sequence are K = 84, c = 0.2 days and p = 1.05. At t = 30 days the denominator is 30.2^1.05 ≈ 35.6, so the expected rate is 84 ÷ 35.6 ≈ 2.4 to 2.7 events a day above magnitude 2, depending on how the fit is rounded. That is an expectation over an interval, and daily counts will land either side of it. What the curve cannot do is reach zero: a power law fades, and the day it 'stops' does not exist. Publishing a month therefore makes two errors at once — an end date where the mathematics gives a fade, and a certainty where it gives a rate. The right sentence names a number per week and a range, and says nothing about the largest event, because how often and how large are different distributions."
        estimate:
          prompt: The fit for this sequence is K = 84, c = 0.2 days, p = 1.05. The bulletin is being written for day 30 after the mainshock.
          question: Choose the productivity, and the elapsed-time term raised to the fitted power.
          labels:
            - 84  (K, the fitted productivity)
            - 35.6  ((c + t)^p at 30 days, with p = 1.05)
            - 30.2  (c + t at 30 days, before the power is applied)
            - 1.05  (p, the fitted exponent)
            - 0.2  (c, the offset in days)
          values: [84, 35.6, 30.2, 1.05, 0.2]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 2.36
          tolerance: 0.4
          units: events a day above magnitude 2
          solution: 84 ÷ 30.2^1.05 = 84 ÷ 35.6 ≈ 2.4 a day, falling and never reaching zero.
          explanation: The aftershock rate is a fading expectation with a range around it. No end date falls out of a power law.
          givens:
            - K = 84, c = 0.2 days, p = 1.05
            - the bulletin is for day 30 after the mainshock
          relationship: The aftershock rate is n(t) = K / (c + t)^p — a power law that decays and never reaches zero.
      - group: STRUCT
        task: Say what the falling rate means for a cracked building
        title: Damaged, and waiting to be asked again
        place: Structural Assessment
        scene: Okonkwo has 11 buildings with cracked shear walls that are still standing. Each has less capacity than it had a week ago, and the sequence has not finished. The shoring list is pinned beside the new forecast.
        guide: >-
          All four options give a reason the eleven buildings stay urgent. They differ
          in what is changing: the hazard, the buildings, or both. Ask of each whether
          the falling aftershock rate contradicts it. Two of these say the shaking will
          get worse, and the forecast says otherwise. What has changed since Friday is
          on the other side of the comparison.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one

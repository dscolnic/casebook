# --------------------------------------------------------------- the warm-ups
# Why this fortnight takes each of the seven runs. The schedule is the engine's,
# and this site has two tiers of ground, so the far lap is real: the Flats are
# across the fault scarp and the vehicles come out with them.
warmups:
  trial-near:
    title: Walk Upper Town before you placard anything
    why: >-
      Three days after, and you have not been here before. Okonkwo, the structural engineer,
      takes every assessor round the near ground once on foot: the office, the structural bench,
      the materials lab. Nothing is placarded from a map, and the plan card names streets that
      mean nothing until you have stood in them and seen which way the ground falls.
  greet:
    title: Two agencies, one office, and nobody has been introduced
    why: >-
      The office is half council and half seconded engineers who arrived on Saturday, and by
      Friday somebody will have to take a decision on somebody else's assessment. Get round the
      building and put a name to as many of them as you can now, because a signature you cannot
      attach to a face is a signature you will end up double-checking.
  trial-far:
    title: The Flats open today, and the vehicles come out with them
    why: >-
      Everything across the scarp has been walkable all week and nothing out there has been
      called. That changes today: the fill, the wharf and Ferry Street go on the list, and they
      are far enough out that the van is signed out to reach them. Drive the route once before
      the calls start sending you down it.
  follow:
    title: Mbeki walks the liquefaction line once
    why: >-
      The boundary between the granite bench and the fill is not on any map at the accuracy
      anybody needs, and Mbeki, the geotechnical field technician, can see it in the ground. She
      walks it once, this morning, stopping where the surface changes. Stay with her — far
      enough back to see what she is pointing at, close enough not to lose which way she turned
      at the ejecta.
  hunt:
    title: Six props went out and the log has four
    item: { name: prop, plural: props }
    why: >-
      Every temporary prop on the Parade has to be accounted for before the cordon can be
      reduced, because a prop that nobody can find is either holding something up or lying in a
      street where a lorry will hit it. Four are where the log says. Find the rest.
  canvass:
    title: Who actually spent the night in their own bed
    why: >-
      The occupancy figures the office is working from came from Saturday, and they decide which
      buildings get assessed first. Ask along the affected streets until enough answers have
      come back to say whether people went to the hall as instructed or came home once the
      shaking stopped.
  evade:
    title: The developer who wants a green placard in the street
    why: >-
      A developer has been in the office car park since eight wanting a verbal assurance about
      Marina Court, and Cardoso, the network technician, has said plainly that nothing is agreed
      anywhere but on the form. Keep clear of him and get your round done. A placard agreed in a
      car park is a placard nobody signed.
  tag:
    title: Catch Ives before the hospital handover
    why: >-
      Ives, the hospital facilities manager, has the only copy of the ward occupancy plan with
      the yellow-placard rooms marked on it, and he is walking back to the hospital for the ten
      o'clock handover. After that he is on a ward round for four hours, and the afternoon's
      decision about the ground floor rests on a drawing that currently exists once.

copy:
  SEIS: <p>The vault, cut into the bench above town. Concrete, a locked hatch, and the instrument every comparison this fortnight has been made against.</p>
  STRUCT: <p>Assessment. Forms on every surface, a plan of the town with 400 coloured dots on it, and a queue outside that starts before the door opens.</p>
  GEO: <p>Geotechnical. Boxes of core, a hand auger against the wall, and an 1892 survey showing where the creek used to run.</p>
  MAT: <p>The testing laboratory. A press, a saw, and a chain of custody that means the number belongs to a particular column in a particular building.</p>
  HAZ: <p>The incident base, on the boundary between the two halves of town. The aftershock sequence is taped to the wall and updated by hand, because people believe a curve they watched being drawn.</p>
  SAFE: <p>Public safety. Cordon tape, printed notices, and the list of who is sleeping where.</p>
  HOSP: <p>Kestrel Bay Hospital. 90 patients on the ground floor, 2 upper floors closed, and a yellow placard nobody has been able to resolve.</p>
  SCHOOL: <p>Bay Road School. Green placard, undamaged classrooms, and a gymnasium whose wall panels are held on by anchors that tested below demand.</p>
  PARADE: <p>The Parade. 1890s shopfronts with their parapets in the street and timber shores holding the façades in.</p>
  DEPOT: <p>The port gate. The quay moved two metres seaward and the cranes have not turned since.</p>

  - title: What the ground will do next
    objective: Turn an aftershock sequence into a rate somebody can plan around.
    briefing: 41 aftershocks yesterday, 26 today. Everybody wants to know when it stops.
    stake: >-
      Thursday, and the question in every room is when the aftershocks end. Rei Tanaka has the
      sequence: 210 events above magnitude 3 in 4 days, falling steadily. Bram
      Halvorsen wants a date he can put on a notice and Funmi Adeyemi has to write it. Marisol
      Okonkwo needs the rate for a different reason — a damaged building has a reduced capacity, and
      the chance of it being tested again is the only thing that makes a red placard urgent rather
      than tidy. Today you fit the decay, say what the forecast is and is not, and work out what a
      falling rate means for the buildings still standing with cracks in them.
    takeaway: An aftershock forecast is a rate with a range, and the useful question is what it does to a decision.
    stops:
      - group: HAZ
        task: Fit the decay and say what it predicts
        title: The rate, falling
        place: Hazard & Forecasting
        scene: |-
          Day 1 had 96 events above magnitude 3. Day 2 had 52, day 3 41, day 4 26. Tanaka's fit has the rate roughly halving as the elapsed time doubles.
        guide: >-
          Five numbers, and two of them belong to other questions: the magnitude and the
          running total. One is day one, which is four doublings back rather than one.
          Ask of each whether it is a count, a time, or a ratio of times. And note what
          comes out: an expected rate, not a quota. Real days scatter either side of a
          fitted curve.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - a rate can fall smoothly without ever reaching zero
        takeaway: A simple Omori-style decay gives a central rate estimate; the real forecast also needs uncertainty around that curve.
        format: BALLPARK
        question: Estimate the number of magnitude 3+ aftershocks on day 8.
        answerText: About 13.
        why: A simple Omori-style model writes the aftershock rate as n(t) = K/(c+t)^p. When p is near one and c is small after the first day, doubling elapsed time roughly halves the central rate. Day 4 had 26 magnitude-3-plus events, so day 8 gives about 26 × 4/8 = 13. Real sequences scatter around that curve, and K, c and p are fitted with uncertainty. 13 is therefore an expected rate, not a quota or a scheduled event.
        estimate:
          prompt: |-
            Day 4 had 26 events above magnitude 3, and the rate falls roughly as 1 over elapsed time. Day eight is twice as far from the mainshock as day four.
          question: Choose the day-four count and the ratio of the two times.
          labels:
            - 26  (events on day 4)
            - 2  (day 8 is twice as far out)
            - 96  (events on day 1)
            - 6.8  (the mainshock magnitude)
            - 210  (total events so far)
          values: [26, 2, 96, 6.8, 210]

      - group: SEIS
        task: Check what the hospital actually experienced
        title: The instrument in the basement
        concept: "Instruments: what an accelerograph actually records"
        place: Seismic Network
        scene: |-
          There is an accelerograph in the hospital basement, installed in 1998 and never used in anger. Cardoso has the record. It shows a peak of 0.31 g, and the building was designed for 0.35.
        guide: >-
          Turn the recorded acceleration into the sideways force the frame actually had to
          carry, so the two numbers can be compared as forces rather than as fractions of
          gravity. The base shear is the seismic coefficient times the building's weight.
          One tile is the coefficient the building was designed to and another is the
          weight of one floor, which is not what the whole frame carries.
        background:
          - >-
              What a base shear is. The total horizontal force at the foundations, and the number
              a frame is proportioned against. It is the seismic coefficient — the design
              acceleration as a fraction of gravity, after the code's factors — multiplied by the
              weight the building brings to the shaking.
          - >-
              Why 0.31 against 0.35 is not a verdict. It is one input, measured directly, which is
              worth a great deal in a fortnight where most numbers are inferred. What a building
              feels also depends on which frequencies arrived, how long the shaking lasted, and
              how the frame and its parts are detailed. None of that is in a peak.
          - >-
              What the record cannot reach. It says nothing about the plant-room restraint,
              nothing about what the inspection found, and nothing about the parts of the
              building that respond at their own period rather than the ground's. A design value
              is not a threshold below which nothing breaks.
        takesAsRead:
          - Peak ground acceleration and what a building feels
          - P and S waves, and what the gap between them measures
        assumes:
          - a building can be instrumented, and the record is about that building
        takeaway: A building-mounted accelerograph measures one part of the demand directly; it does not turn a code design value into a damage threshold.
        format: BALLPARK
        question: What sideways force did the recorded motion put into the frame, against what it was designed for?
        answerText: About 26 meganewtons (MN) against a design base shear of 30 MN — a little under, and the record's real value is that one input is now measured rather than assumed.
        why: "The hospital is four storeys, so its natural period is about T ≈ 0.1 N = 0.4 s, and that is the period at which the design coefficient is read off the spectrum. Base shear is then V = C_s · W: that coefficient times the weight the building brings to the shaking. The hospital's seismic weight is about 85 meganewtons, and the recorded peak of 0.31 g gives a coefficient of 0.31, so the frame saw roughly 0.31 × 85 ≈ 26 MN. The design value of 0.35 g gives 0.35 × 85 ≈ 30 MN. So the demand was about 12 per cent under what the frame was proportioned for, which is worth knowing and is not a clearance. Three things the number does not carry: which frequencies arrived, how long the shaking went on, and how the building and its contents are detailed — the plant-room restraint responds to its own motion, not to the basement's. A design value is a proportioning input, not a line below which nothing breaks. What the record genuinely removes is the largest unknown of the fortnight: for once, the ground motion at a specific building was measured instead of inferred from a ratio."
        estimate:

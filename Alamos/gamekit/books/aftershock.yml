              evidence: Road-support observations show the disturbed surface cannot yet support the appliance route.
            - id: south
              label: Keep the southern leg inside the public exclusion boundary
              critical: true
              backed: false
              evidence: No hazard or access reason is recorded for this segment.
        answerText: Verify the southern leg first. Its exclusion is a current safety claim with no recorded physical basis. If a hazard is present, document it and keep the segment. If none is found, the line should not survive merely because it was drawn during the first response.
        why: A cordon can contain several hazards, each with its own condition for removal. The Parade segment has an overhead-masonry basis. The gas-main segment depends on utility status. Ferry Street is an access restriction for heavy emergency vehicles. The southern leg is different. The map still excludes people, but the log contains no recorded hazard supporting that claim. With one field check before the map is reissued, the unbacked segment deserves verification before a restriction with direct support is checked again.
      - group: GEO
        task: Say whether the liquefied street is dangerous or just unusable
        title: Soft ground, three days on
        concept: Lateral spreading toward a free face
        place: Geotechnical
        scene: Thandi Mbeki has been on Ferry Street with a hand auger. The sand fans have dried, the water table has dropped back, and the surface bears a person easily and a truck not at all.
        guide: >-
          Four options describing the same street, from ruined to recovered. Ask of each
          which observation supports it and which contradicts it. The fans have dried
          and the water table has dropped, so the excess pressure has gone. The surface
          takes a person and not a truck. A dry surface says nothing about heavy loads,
          and drained is not the same as unchanged.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - liquefied ground regains strength as pore pressure dissipates
        takeaway: Liquefaction is transient, but the ground left behind can have settlement, voids and uncertain bearing capacity even after pore pressure dissipates.
        format: CHOICE
        question: What is the defensible status of Ferry Street now?
        why: Liquefaction needs high pore pressure during shaking. Afterward, that excess pressure drains away and grain contacts recover. The ground can still be badly changed. Settlement, lateral spreading, ejecta, local voids and uneven stiffness may remain. Some loose sand may even become denser, so calling the whole deposit 'looser' is too simple. A dry surface also says little about truck support. Ferry Street is disturbed ground with heavy-load capacity unverified. Susceptible saturated layers could liquefy again in a strong aftershock.
        choices:
          - Still liquefied, and dangerous to anybody walking on it.
          - Drained and disturbed — walkable, no heavy vehicles, and liable to go again.
          - Fully recovered, since the water has gone and the surface is dry.
          - Permanently destroyed, and the street will have to be rebuilt before anybody returns.
        answer: Drained and disturbed — walkable, no heavy vehicles, and liable to go again.
        rebuttals:
          - Pore pressure dissipates in hours, so the ground is not still liquefied three days on.
          - Dry at the surface is not recovered underneath; the fabric of the ground has changed.
          - Nothing here says the street is beyond repair, and most liquefied ground is repaired rather than replaced.
      - group: HAZ
        task: Set what has to be true for people to go home
        title: A condition, not a date
        place: Hazard & Forecasting
        question: What should the office commit to?
        scene: Halvorsen wants a date. Delacroix wants a condition. Tanaka points out that a date makes a promise about the ground and a condition makes a promise about the office. The next resident update is due before the office closes.
        takesAsRead:
          - Peak ground acceleration and what a building feels
          - P and S waves, and what the gap between them measures
        assumes:
          - a commitment can be tied to a date or to an event
        takeaway: Tie a decision to a condition somebody can check, and it stays honest whatever the ground does next.
        format: CHOICE
        why: "A date promises something about the ground that the office cannot control. A condition promises what evidence the office will require before changing the restriction. Publishing those conditions turns an open-ended wait into visible progress. Residents can see what remains: utility clearance, access checks, targeted assessment or repair. The aftershock rate is a poor release trigger because it does not measure the local hazard on a specific street. The commitment should therefore name the observations and actions that will justify reopening, not a day selected for reassurance."
        rebuttals:
          - A date is a promise about ground behaviour and repair work that nobody can guarantee.
          - The aftershock rate is not the hazard recorded on any of these stretches.
          - Detailed assessment of every building would take a month and is not what most of these streets need.
        choices:
          - A date — the cordon lifts on Friday.
          - A condition — each stretch lifts when its recorded hazard is resolved.
          - A rate — the cordon lifts when aftershocks fall below one a day.
          - No commitment until every building inside the cordon has been assessed in detail.
        answer: A condition — each stretch lifts when its recorded hazard is resolved.

  - title: The photograph that changed the meeting
    objective: Deal with evidence that arrives from outside the process, in public.
    briefing: A resident's photograph of a cracked column is on the front page, and the building is green.
    stake: >-
      Sunday, and the office is on the back foot. A resident photographed a cracked column in the
      basement car park of a green-placarded apartment block on Ferry Street and gave it to the
      paper. The photograph is real, the crack is real, and the block has 90 flats with people
      back inside it. Alan Whitcombe placarded it green from outside on day one and never saw the
      basement. Funmi Adeyemi has a public meeting at six. Marisol Okonkwo has two hours and no
      access key. Today you work out what the photograph does and does not establish, get into the
      basement, and decide what to say at six o'clock about a process that missed it.
    takeaway: Evidence does not stop being evidence because of who found it, and a process that cannot absorb it will be worked around.
    stops:
      - group: STRUCT
        task: Say what the photograph establishes
        title: A real crack, and an unknown building
        place: Structural Assessment
        scene: The photograph has already been passed around town. It shows a basement column with a horizontal crack, pipework and no daylight. There is no scale, no building number and no way to tell which column it is.
        guide: >-
          Four options, and they differ in how much a photograph can carry. There is no
          scale, no building number and no earlier picture. Ask of each option what it
          would need that the image does not have: a width, an age, a location, a cause.
          Accepting the crack as real is not the same as knowing what it means, and it
          is already all over town.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a photograph records what was in front of the lens
        takeaway: An authenticated photograph can establish an observation while leaving scale, location, age and mechanism unresolved.
        format: CHOICE
        question: What has the photograph established?
        why: Once the image is accepted as genuine, the crack is evidence, but its scope is narrow. The photograph has no scale, exact location, earlier comparison or useful view of the surrounding structure. It cannot establish the crack's width, age, importance or cause. It does establish that a basement area outside the rapid inspection contains a real feature worth checking. The response is therefore to locate it and gather context quickly. The photograph alone neither justifies evacuation nor supports dismissing the observation.
        choices:
          - That the building is unsafe and should be evacuated tonight.
          - That a crack exists somewhere the green placard never covered.
          - Nothing, because it was not taken by an engineer under controlled conditions.
          - That the assessment team was negligent in issuing a green placard.
        answer: That a crack exists somewhere the green placard never covered.
        rebuttals:
          - Nothing about width, location or age is available from the image, so evacuation is not supported by it.
          - Who took a photograph does not change what is in it, and dismissing it on that basis is how a process loses trust.
          - The team recorded that the basement was not inspected, which is the opposite of negligence.
      - group: MAT
        task: Choose the leading hypothesis and the check that would distinguish it
        title: Down there with a torch
        concept: Bearing capacity and settlement
        place: Materials & Testing
        scene: "In the basement: the crack is 0.4 mm and horizontal, a metre above the floor. Five more columns along the row carry one that looks the same. The original construction drawings are open on a crate nearby."
        guide: >-
          Four explanations, and one fact constrains all of them. Six columns in a row
          carry the same feature at the same height and the same width. Ask of each
          option whether it would produce that repetition. Six independent failures
          rarely agree to a millimetre. The drawings are open on a crate, which is where
          a shared construction detail would show up.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a defect that repeats in a pattern usually has a construction cause
        takeaway: When the same feature repeats at the same place in many members, look first for a shared detail before assuming separate failures.
        format: CHOICE
        question: What is the best-supported explanation to test first?
        why: A horizontal feature of nearly identical height and width across six columns strongly suggests a construction detail shared by all six, such as the top of a concrete lift. That is more likely than six independent shear failures producing the same geometry. But earthquake damage can also exploit construction joints, so 'construction joint' is a hypothesis, not an automatic clearance. Check drawings or pour records, inspect displacement and spalling across the joint, and compare with undamaged columns before deciding whether the earthquake changed its condition.
        choices:
          - Earthquake shear damage in every column of the row.
          - A construction joint at the top of the first pour.
          - Foundation settlement lifting the columns.
          - Corrosion of the reinforcement inside the columns.
        answer: A construction joint at the top of the first pour.
        rebuttals:
          - Earthquake shear runs diagonally and varies column to column; this is horizontal and uniform.
          - Settlement would show as differential movement and cracking in the slab, and there is none.
          - Corrosion cracks run along the bars and come with rust staining, neither of which is present.
      - group: SAFE
        task: Say it at six o'clock
        title: The meeting
        place: Public Safety
        scene: 200 people are already in the hall. One photograph has been forwarded all over town. The office has to explain what it found tonight, what it did not see on day one, and what happens next before anyone goes home.
        guide: >-
          All four of these have to be said tonight, so nothing is being withheld. Ask
          which one the hall came to hear, and which one it will only accept afterwards.
          Two hundred people are already seated and the photograph has been forwarded
          all over town. An explanation offered before the finding reads as a defence,
          and the admission is the part that has to be plain.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim about dependency: each
              step is here because the one before it has already happened, or has to have.
              One transposed pair falsifies that claim wherever it sits, so partial credit
              would be credit for a sequence that does not work.
          - >-
              Why the ends are the place to start. The first and last cards are constrained
              by having nothing before or after them, which usually makes them the two you
              can settle from the scene alone. Pinning them collapses the remaining
              arrangements sharply, and what is left in the middle is where the actual
              judgement lives.
          - >-
              What the rail can be ordered on. Time is the usual axis, but it is not the
              only one. An order can run on cost, on risk, or on reversibility — every
              observation that leaves the sample as it was, before any that consumes it. On
              those boards a chronological reading finds nothing, because none of the steps
              has to happen at a particular hour.
        assumes:
          - trust is affected by how a process handles being wrong
        takeaway: Say what was found, what it means and what the process missed, in that order, and commit to the part you control.
        format: SEQUENCE
        question: Say it at six o'clock
        why: "The finding goes first because that is what everyone came to hear. Its meaning follows: the repeated horizontal crack fits a construction joint better than new earthquake shear damage. Then the office should state the process gap plainly. The basement was not inspected, the omission was recorded, and nobody acted on the list. The final step is the change in practice. This order keeps the meeting focused on evidence first. It also turns acknowledgment of a process failure into a specific corrective action rather than a defensive argument."
        cards:
          - What was found in the basement tonight, plainly.
          - What it means — a construction joint, not earthquake damage.
          - That the basement was never inspected, that this was recorded, and that nobody acted on the record.
          - What changes now — every unopened space on the list gets visited, with dates.
        order: [0, 1, 2, 3]
      - group: GEO
        task: Hold the dewatering while the excavation stands open.
        title: The water table, while the trench is open
        concept: "Effective stress, and why water pressure matters"
        place: Geotechnical
        scene: The trench for the temporary shoring has to stand open for an afternoon in ground that liquefied nine days ago. The wellpoints hold the water down. If the water comes back up the sides do not wait to be asked.
        guide: >-
          Hold the water table below the trench floor, inside the band on the gauge. The band
          narrows as the afternoon goes on, because each hour the sides stand open they lose a
          little of what was holding them. The wellpoint pumps are your control, and every
          inflow keeps arriving until the pumps answer it.
        background:
          - >-
              Why the water is what matters. The sand is held together by the pressure between grains,
              and that is the weight above less the water pressure between them. Let the water rise
              and the grains stop pressing on each other while nothing about the sand has changed.
          - >-
              Why an inflow is a rate. Rain on the fill, a leaking main, the tide in the harbour —
              each of them keeps feeding water in for as long as it lasts, so the table does not
              settle at a new level. It keeps rising until pumping matches the inflow.
          - >-
              Why the margin shrinks. An open trench face creeps: it loses a little strength every
              hour it stands, so the same rise in water is a bigger fraction of what is left by the
              end of the afternoon than it was at the start.
        assumes:
          - water pressure between grains reduces the strength of sandy ground
        takeaway: A trench is held open by a pressure balance, and the balance is held by a pump.
        format: HOLD
        question: Hold the water table below the trench floor while the shoring goes in.
        answerText: Inside the band for most of the afternoon, with the pumps set to match each inflow rather than started after the gauge has already risen.
        why: >-
          Sandy ground holds together because the grains press on one another, and that
          pressure is the weight above less the water pressure between them. Raise the water and
          the grains stop pressing, though nothing about the sand has changed — which is the
          same mechanism that liquefied this ground nine days ago, arriving slowly instead of
          in forty seconds. Every disturbance here is a rate. Rain on the fill keeps arriving,
          the leaking main keeps leaking, the tide keeps coming in, so the table does not settle
          at a new level and a pump started briefly buys nothing. Set the pumps to match the
          inflow and leave them there. The band narrows because an open face creeps: it loses a
          little strength every hour it stands, so the rise that was tolerable at one o'clock is
          most of the remaining margin by four.
        hold:
          quantity: Water table below the trench floor
          unit: m
          control: Wellpoint pumps
          hold: 1.5
          band: 0.4
          narrowTo: 0.2
          duration: 45
          direction: raise
          authority: 0.1
          pass: 0.8
          hint: Each inflow keeps arriving. Set the pumps to match it rather than starting them when the gauge moves.
          disturbances:
            - { label: Rain starts on the fill, at: 4, amount: -0.03 }
            - { label: Tide goes out in the harbour, at: 20, amount: 0.05 }
            - { label: The leaking main is found, at: 38, amount: -0.045 }
          commit: Report the afternoon
  - title: A quiet day on the bench
    objective: Spend a day on the half of town nobody is arguing about.
    briefing: Upper Town has been assessed, cleared and forgotten. Somebody should look at it properly.
    stake: >-
      Monday, and for the first time in ten days nothing is on fire. The Flats have their programme,
      the hospital is open, the school is running in its classrooms, and the office has a day with
      no crisis in it. Marisol Okonkwo spends those days on the half of town nobody is asking about,
      because Upper Town was cleared quickly on the strength of standing up, and standing up is not
      the same as undamaged. Alan Whitcombe walks the Parade with her. Today you look at masonry
      properly, work out what holds a heavy old wall to the floors behind it, and decide what is
      worth doing to buildings that are not currently anybody's emergency.
    takeaway: The building that survived is the one you learn most from, because you can still see what saved it.
    stops:
      - group: STRUCT
        task: Say why the masonry failed the way it did
        title: Walls that fall outward
        concept: Unreinforced masonry, and why it fails outward
        place: Structural Assessment
        scene: Owners are asking when the Parade can reopen. Every parapet fell outward into the street, while the buildings behind them remain standing. Timber floors are still connected. The fallen masonry is tagged by frontage, and the barriers are still up.
        guide: >-
          Follow the sideways force from the shaking ground up through the building and name
          the link that gave way. Each step carries a reading saying what restraint it can
          actually provide. The heaviest element on the board is not automatically the one
          that failed, and neither is the first step in the path.
        background:
          - >-
              Why out of plane. Masonry is strong in compression and weak in tension, so a wall
              pushed sideways cannot hold itself up by bending. It stays standing only while
              something ties it back at intervals — a floor, a roof, or a strap into the
              diaphragm. Where the tie stops, the wall is a free cantilever.
          - >-
              Why the parapet and not the wall. The wall below is held by the timber floors, which
              are still connected and did their job. The parapet projects above the roof line with
              nothing above it and nothing behind it, so the whole horizontal force it collects
              has to be resisted at its base, in bending, by mortar.
          - >-
              Why this is the useful kind of failure. It is local, repeatable and explained by one
              missing connection, so the retrofit targets the tie rather than the building. A
              frontage whose parapet is anchored back to the roof structure is a different
              proposition from one whose whole wall needs work.
        assumes:
          - masonry is strong in compression and weak in tension
        takeaway: Unreinforced masonry fails out of plane, so the free top of a wall goes first and the tied part stays.
        format: CHAIN
        question: Trace the sideways force through the frontage and name the link that failed.
        answerText: The mortar bed at the parapet's base, resisting the whole force in bending because nothing ties the top back. Every other link in the path had the capacity it needed.
        why: Horizontal shaking gives every part of the frontage an inertia force proportional to its mass, and that force has to travel somewhere. Below roof level it goes into the timber floors, which are connected and stiff enough in their own plane to carry it to the cross walls and down to the foundations — every one of those links had capacity to spare. Above roof level the path stops. A parapet has nothing tying its top back and nothing above it, so the entire force it collects must be resisted at its base by mortar in bending, which is the one thing unreinforced masonry cannot do. That is why every parapet on the Parade went and the walls below them stayed. It also decides the repair: the missing link is a connection, so the retrofit is an anchor into the roof structure rather than work on the wall.
        chain:
          links:
            - id: mass
              label: Parapet mass collecting horizontal inertia
              transfers: 1.1 m of free-standing brickwork, about 9 kN per metre of frontage
            - id: bed
              label: Mortar bed at the parapet base, resisting that force in bending
              transfers: about 2 kN per metre in tension across the bed, with no tie above it
            - id: wall
              label: Wall below roof level, held by the timber floors
              transfers: restrained every 3.2 m, capacity about 34 kN per metre of wall
            - id: floors
              label: Timber floor diaphragms into the cross walls
              transfers: still connected, carrying an estimated 210 kN in plane
            - id: crosswalls
              label: Cross walls down to the footings
              transfers: 640 kN capacity, the heaviest element on the frontage
          order: [mass, bed, wall, floors, crosswalls]
          governing: bed
          distractor: crosswalls
      - group: MAT
        task: Spend the listed-façade disturbance allowance on the test that can actually support the proposed anchor design.
        title: What you can learn without breaking it
        place: Materials & Testing
        scene: Ferreira has four test proposals for the Parade's listed brickwork. The scaffold permit allows one small trial location this week, and owners will not accept large-scale destructive sampling. A tie-back design still needs a defensible capacity number.
        guide: >-
          Four tests are on the table and the permit allows one trial location. Open
          each card: it says what the test measures and how much listed fabric it
          consumes. The tie-back design needs a defensible pull-out capacity, so the
          test worth buying is the one that measures that property — not the one that
          produces the most precise number about something else.
        background:
          - >-
              What the design actually needs. A tie-back is only as good as what it is
              anchored into, so the number the drawing needs is how much force an anchor in
              this brickwork can carry before it pulls out. Compressive strength, mortar
              composition and moisture content are all real properties of the wall, and none
              of them is that number.
          - >-
              Why precision is not value. A laboratory can give three significant figures on
              a property the design does not use, and the report will look better than a
              crude pull-out test with wide scatter. The question is which measurement
              changes the decision, which is the same question VALUE asks in every game that
              has one.
          - >-
              Why the fabric cost is on the card. This is listed brickwork: every test
              damages something that cannot be replaced, and the owners have already refused
              large-scale sampling. A test's cost here is not money but heritage, which
              makes choosing well a conservation decision as much as an engineering one.
        assumes:
          - a test can be destructive, semi-destructive or neither
        takeaway: A precise test is valuable only when it measures the property that the pending design decision actually needs.
        format: VALUE
        question: Which measurement answers the capacity question the retrofit depends on?
        value:
          hint: Open each test card and read both what it measures and how much listed fabric it consumes. The design decision is about a tie anchor in the existing wall.
          budget:
            amount: 1
            unit: fabric-impact points
            label: Listed-façade disturbance allowance
          decision: Choose a measurement that can support the pull-out capacity used in the proposed tie-back design.
          options:
            - id: pullout
              label: Pull-out test on a trial anchor in the existing brickwork
              cost: 1
              axis: anchor pull-out capacity
              decisive: true
              reveals: The force a representative installed anchor can transfer before pull-out in the existing wall.
            - id: brick_core
              label: Cut masonry samples for compressive testing
              cost: 4
              axis: brick compressive strength
              decisive: false
              reveals: The compressive strength of removed masonry samples, not the installed anchor pull-out capacity.
            - id: rebound
              label: Rebound-hammer survey across the façade
              cost: 0.2
              axis: surface hardness
              decisive: false
              reveals: Relative surface hardness and variability across the façade without an anchor-capacity measurement.
            - id: mortar
              label: Visual and penknife survey of mortar joints
              cost: 0.1
              axis: mortar condition
              decisive: false
              reveals: Where mortar is soft or deteriorated, useful context that does not quantify tie-anchor pull-out resistance.
        answerText: Use the disturbance allowance on a representative trial-anchor pull-out test. It measures the capacity the proposed tie-back actually needs in the real wall. Brick crushing, rebound hardness and mortar condition may be useful supporting evidence, but none provides the anchor pull-out capacity needed for this design.
        why: The design question is whether an anchor installed in this old wall can transfer the required force. A trial-anchor pull-out test measures that property directly in the existing masonry and at the intended embedment. Brick compressive strength, rebound hardness and mortar condition can all describe parts of the wall, but none is the same as anchor pull-out capacity. The listed façade also makes disturbance a real cost. The best test therefore couples decision relevance with the smallest adequate physical intervention.
      - group: SEIS
        task: Decide what is worth doing now
        title: Before the next one
        place: Seismic Network
        scene: |-
          Nothing on the Parade is dangerous today. The same parapets, on the same walls, will be here for the next earthquake, and the recurrence interval on this fault is about 140 years.
        guide: >-
          Every parapet on the Parade came down and no wall behind one did. Tying back
          costs about £8,000 a building while the scaffolding stands, and about £25,000
          once it is gone. A detailed assessment of one building takes three weeks and
          produces no strengthening. The grant scheme opens in eleven months and is
          oversubscribed in its first week. Lightweight replacement needs the parapets
          down first and a consented design, which is next summer at the earliest. The last
          event was six days ago.
        rules: >-
          Spread the hundred points across the 4 proposals. At least 75 of them have to
          be committed, because a panel that funds almost nothing has not decided
          anything. Your largest single allocation must be 35 or more, and it has to
          land on what the evidence supports most. Keep the total sitting on proposals
          the evidence does not support under fifteen. And a proposal it does support
          should not be left under twenty.
        background:
          - >-
              Why the whole spread is graded. Funding is not a vote for one idea. A
              portfolio says what you think is likely, what is worth hedging against, and
              what is not worth pursuing at all — and the last two are where most of the
              information is. Backing the right proposal while quietly funding a bad one is
              a worse answer than it looks. That is why the small numbers count as much as
              the big one.
          - >-
              What the three numbers are for. Thirty-five is what makes a lead a lead: below
              it you have hedged rather than chosen. Fifteen is the most that can sit on
              unsupported work before it stops being a rounding error. Past that it is a
              second opinion nobody argued for. Twenty is the floor under a line of work you
              have already called strong, because funding it too thin to finish spends the
              money and buys nothing.
          - >-
              Why there is a floor on the total. Points held back are not caution; they are
              a decision not to decide, taken with somebody else's money and somebody else's
              deadline. The floor is what forces the panel to say something.
        assumes:
          - a hazard that has occurred will occur again
        takeaway: Fix a repeatedly observed, low-cost life-safety failure mode while access is already in place; do not let an average recurrence interval become a countdown clock.
        format: SCIENCETANK
        question: Decide what is worth doing now
        why: "Tying parapets back has an unusually strong case: the failure mode occurred repeatedly, the retrofit acts directly on it, and scaffolding already in place makes the marginal cost much lower. The quoted 140-year recurrence interval is not a promise of 140 quiet years after this event; earthquakes do not reset a calendar. That statistic belongs in long-term hazard context, not in the argument for waiting. Act now because the defect is known, the consequence is falling masonry, and the cheapest access window is open."
        proposals:
          - label: A
            text: Tie the parapets back to the floor structure now, while the scaffolding is up.
          - label: B
            text: Commission a detailed seismic assessment of each building on the Parade.
          - label: C
            text: Wait for the strengthening grant scheme, which opens next year.
          - label: D
            text: Demolish the parapets and rebuild them in lightweight material later.
        recommended:
          A: 55
          D: 20
  - title: The record that was wrong all along
    objective: Re-read the fortnight after finding the instrument everyone trusted was mis-sited.
    briefing: The vault on the bench is not on rock. It is on four metres of weathered granite, and that changes every comparison.
    stake: >-
      Tuesday, and Inês Cardoso has found the thing nobody wanted found. The vault above Upper Town
      is the reference station — the rock record every comparison in this fortnight has been made
      against — and when she went up to service it she looked at the trench log from its
      installation in 1998. It is not founded on rock. It sits on 4 metres of weathered, broken
      granite that behaves like a stiff soil, and it has been amplifying by about 1.6 since the day
      it was built. Every amplification figure this office has quoted is therefore too small. Today
      you work out what that does to the fortnight's conclusions, and which of them still stand.
    takeaway: A reference that is not what it claims moves every measurement made against it, and finding that out is a good day.
    stops:
      - group: SEIS
        task: Open the dependency chain behind each conclusion, keep the ones that stand independently, and identify the shared reference source behind the conclusions that must be revised.
        title: Measuring against the wrong zero
        place: Seismic Network
        scene: Cardoso's five-day side-by-side check is finished, and the benchmark used since day one no longer stands unchanged. Navarro lays five fortnight conclusions beside the corrected station report. Some may survive untouched; others may force a redraw before the next briefing.
        guide: >-
          Open a conclusion and the panel shows what it was computed from. Keep the ones
          that stand on a measurement of their own, and untick the ones whose chain runs
          through the corrected reference. Then name the source the failing ones share.
          Both halves are graded: throwing away an independent conclusion costs you as
          much as keeping a dependent one.
        background:
          - >-
              What a shared reference is. Every station's record is interpreted against an
              assumed site response, and one station's has been corrected after five days of
              side-by-side comparison. Anything computed through that station inherits the
              correction; anything measured elsewhere does not. The error is not in the
              instrument — it is in one number every dependent conclusion was divided by.
          - >-
              Why untangling matters more than caution. The safe-looking move is to withdraw
              the whole fortnight, and it is wrong twice over: it throws away conclusions
              that were never affected, and it tells the next briefing that nothing is known
              when several things are. A retraction is a claim too, and it should be as
              narrow as the evidence.
          - >-
              How to read a chain. A conclusion is supported if some path to it never
              touches the suspect source. That is a question about the graph rather than
              about the size of the numbers, which is why the panel makes you open each one
              instead of judging by how alarming it looks.
        assumes:
          - a comparison is only as good as the thing compared against
        takeaway: A shared reference error propagates only through conclusions that depend on it; independent measurements should not be discarded with the common source.
        format: TRACE
        question: Which conclusions actually inherit the bad reference, and which remain supported by independent evidence?
        trace:
          hint: Open each conclusion and inspect the sources underneath it. Keep conclusions whose evidence chain does not pass through the suspect reference, then name the source shared by the conclusions that fail.
          target: vault_ref
          channels:
            - id: ratio
              label: Flats motion comparison
              reading: ×3.0 peak-velocity ratio, dimensionless (fortnight report)
              depends:
                - flats_record
                - vault_ref
            - id: planning_factor
              label: Rebuilding demand factor
              reading: ×3.0 design demand factor, dimensionless (district planning memo)
              depends:
                - flats_record
                - vault_ref
            - id: hospital_pga
              label: Hospital base acceleration
              reading: 0.31 g peak horizontal acceleration (basement instrument record)
              depends:
                - hospital_record
            - id: magnitude
              label: Final event magnitude
              reading: M_w 6.8 moment magnitude (final agency bulletin)
              depends:
                - network_solution
            - id: marina
              label: Marina Court failure diagnosis
              reading: settlement, heave and sand ejecta documented (field assessment record)
              depends:
                - marina_survey
          correction:
            what: Site response of the reference station on the bench
            was: "×1.0 — founded on competent granite, no amplification"
            now: "×1.6 — four metres of weathered granite, measured over five days side by side"
            effect: Any value measured against this station is low by that factor.
            corrected: "The ×3.0 Flats ratio is ×3.0 × 1.6 ≈ ×4.8 relative to competent rock, and the demand factor copied from it moves with it."
          resources:
            - id: vault_ref
              label: Reference-station site response
            - id: flats_record
              label: Flats accelerograph record
            - id: hospital_record
              label: Hospital basement accelerograph
            - id: network_solution
              label: Multi-station source solution
            - id: marina_survey
              label: Marina Court survey and ground observations
          independent:
            - hospital_pga
            - magnitude
            - marina
        answerText: Revise the Flats motion comparison and the rebuilding demand factor copied from it. Both were measured against the station the panel says now reads ×1.6 instead of ×1.0, so the ×3.0 ratio is ×4.8 relative to competent rock. Keep the hospital's 0.31 g, the network M_w 6.8 and the Marina Court diagnosis; their evidence chains do not run through that station.
        why: A ratio inherits the error of whatever sits under the line, and the panel gives you both terms: a published ×3.0 and a reference station that reads ×1.6 where ×1.0 was assumed. The corrected value is 3.0 × 1.6 ≈ 4.8 times competent rock, and the demand factor copied from that ratio carries the same dependency. The hospital basement accelerograph measured 0.31 g on its own instrument, the moment magnitude came off a multi-station solution and Marina Court was surveyed on the ground, so none of the three moves. Dependency tracing limits the correction to the conclusions that actually share the bad reference.
      - group: GEO
        task: Sort the fortnight's conclusions
        title: What still stands
        place: Geotechnical
        scene: Navarro puts four of the fortnight's conclusions on the board and asks which of them leaned on the vault ratio and which did not. The corrected vault report is clipped beside the board.
        guide: >-
          Four conclusions from the fortnight, and the reference station turns out to be
          founded on weathered granite. Trace each conclusion back to its evidence and
          ask whether the vault is in it. A survey, a heave and a field of ejecta do not
          need a reference station. Neither does a basement instrument. One bad
          denominator invalidates what divided by it and nothing else.
        background:
          - >-
              Why explanations rather than labels. Naming a finding is not accounting for
              it, and a plausible-sounding mechanism attached to the wrong observation is
              the commonest way a wrong story survives. Committing an explanation to one
              clue means claiming it accounts for that clue specifically and not for its
              neighbour, which is where the two come apart.
          - >-
              How to use the one-each rule. The explanations are a set to be distributed,
              not a list to be sampled, so every join constrains the rest. Settling the two
              you are confident of can decide the remaining pair by elimination. Where it
              does not, two explanations are still competing for one clue, and that
              competition is the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every explanation used once,
              three correct joins leave the fourth with only one place to go. Any error
              therefore involves at least two. That is worth remembering when the last pair
              looks forced: the fault is usually not in the join you are struggling with,
              but in one you made early and stopped questioning.
        assumes:
          - a conclusion can rest on one measurement or on several
        takeaway: A bad reference invalidates what was measured against it and leaves what was measured directly alone.
        format: CASEBOOK
        question: Sort the fortnight's conclusions
        why: Trace each conclusion to the evidence that supports it. The Flats amplification ratio directly used the vault as its reference, so it must be restated. Marina Court's diagnosis came from settlement, heave, ejecta and structural survey. The hospital's 0.31 g came from its own basement instrument. The parapet case rests on observed building failures and restraint details. Those conclusions may deserve other checks, but this reference-station error does not erase them. One bad denominator should not become an excuse to discard unrelated evidence.
        rebuttals:
          - The amplification factor was the vault ratio, so it is the one conclusion that falls outright.
          - Marina Court was diagnosed from settlement, heave and ejecta, with no reference station involved.
          - The hospital's demand was measured by an accelerograph in its own basement.
          - The parapet argument rests on every parapet having fallen, which is an observation rather than a ratio.
        columns:
          - The conclusion
          - What the vault error does to it
        scenarios:
          - The Flats amplify shaking by about three times.
          - Marina Court failed through loss of bearing capacity.
          - The hospital saw 0.31 g against a design value of 0.35.
          - The Parade's parapets need tying back.
        choices:
          - Falls, and is restated — the real factor is nearer five.
          - Stands. Survey, heave and ejecta; no reference station in it.
          - Stands. Measured in the hospital's own basement.
          - Stands. An observation about buildings rather than a ratio.
        mapping: [0, 1, 2, 3]
      - group: HAZ
        task: Decide what a bigger amplification changes
        title: Five times, not three
        concept: "Site effect: soft ground amplifies"
        place: Hazard & Forecasting
        scene: If the Flats amplify by five rather than three, the shaking a future earthquake will deliver there is much larger than the figure in the district plan. The revised district map is waiting for a replacement number.
        guide: >-
          Two instruments recorded the same earthquake, one on the Flats and one on rock
          above the town. The amplification is the ratio between what they measured, so pick
          the two peak accelerations and divide. One tile is the figure the district plan
          currently carries, which is the number being replaced rather than an input to it.
        background:
          - >-
              What the ratio is. Site amplification is the peak motion on soft ground over the
              peak motion on competent rock for the same event. It is dimensionless, so both
              readings have to be in the same units, and it is a property of the ground rather
              than of the earthquake.
          - >-
              Why one number is not a spectrum. Soft ground amplifies some frequencies far more
              than others, so a single ratio is a summary. It is the summary the district plan
              uses, which is why replacing three with five moves every design value that plan
              feeds — and why the full answer is a curve somebody still has to measure.
          - >-
              What the correction cannot touch. The placards came from what inspectors saw in
              buildings, and the cracks are already photographed. A revised ratio changes the
              shaking a future earthquake is expected to deliver, and rewrites nothing that has
              already been observed.
        takesAsRead:
          - Peak ground acceleration and what a building feels
        assumes:
          - design values are chosen from expected shaking
        takeaway: Correcting site response changes forward-looking hazard and design assumptions; it does not rewrite damage that was observed directly.
        format: BALLPARK
        question: From the two records of the same earthquake, what is the Flats' amplification over rock?
        answerText: About 5.0 — 0.41 g on the Flats against 0.082 g at the vault on granite. The district plan's 3 is the number being replaced, and what it changes is future design, not the placards already issued.
        why: "Site amplification is A_soft / A_rock: the peak acceleration recorded on soft ground divided by the peak on competent rock for the same event. The Flats instrument recorded 0.41 g and the vault instrument on granite recorded 0.082 g, so the ratio is 0.41 ÷ 0.082 ≈ 5.0, against the 3 the district plan assumes. Both readings are in g, so the answer is dimensionless, which is what makes it a property of the ground rather than of this earthquake. Two things follow and one does not. The design values for rebuilding in the Flats rise, and the case for ground improvement gets much stronger. What does not change is anything already observed: the placards came from inspections of real buildings, and the magnitude of the earthquake was measured from waveforms, not inferred from a ratio. And one number is still only a summary — amplification varies with frequency, so the Flats need a response curve before anything is designed against them."
        estimate:
          prompt: The same earthquake was recorded at 0.41 g on the Flats and 0.082 g at the vault instrument on granite above Upper Town.
          question: Choose the soft-ground peak and the rock peak.
          labels:
            - 0.41  (peak acceleration on the Flats, in g)
            - 0.082  (peak acceleration on granite, in g)
            - 3  (the amplification the district plan currently assumes)
            - 0.31  (the basement record inside the hospital, in g)
            - 6.8  (the moment magnitude of the event)
          values: [0.41, 0.082, 3, 0.31, 6.8]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 5.0
          tolerance: 0.4
          units: times (dimensionless)
          solution: 0.41 ÷ 0.082 ≈ 5.0 against the plan's 3, and the ratio is dimensionless because both records are in g.
          explanation: Five rather than three moves every design value the district plan feeds, and rewrites nothing already observed.
          givens:
            - 0.41 g on the Flats and 0.082 g on granite, same event
            - the district plan currently assumes 3
          relationship: Site amplification is A_soft / A_rock — the peak on soft ground over the peak on rock for the same event, so it is dimensionless.
      - group: SAFE
        task: Work the assessment queue while the priority changes.
        title: What the teams are being sent to
        concept: Rapid assessment against detailed evaluation
        place: Assessment Office
        scene: Buildings queue for assessment faster than the teams can reach them. The office works to one priority, and Okonkwo changes it as the fortnight does — after the aftershock, after the schools ask, after the cordon goes up.
        guide: >-
          Send teams to what the current priority wants and leave the rest queued. The
          priority on the office board changes during the day and nobody announces it. What
          is scored is the buildings either side of a change, because they are the only ones
          that show whether the office is reading the board.
        background:
          - >-
              Why the priority changes. Early it is occupied buildings, because people are in them.
              After an aftershock it is anything already placarded yellow, because their capacity has
              fallen and the same shake now does more. When the schools ask it is schools, because a
              decision is waiting on the answer rather than on the risk.
          - >-
              Why the changeover costs. A team sent under the old priority spends half a day on a
              building nobody is waiting for, and the building that the new priority named waits
              another night with people in it.
        assumes:
          - an office decides which buildings are assessed first
        takeaway: The cost of a withdrawn instruction is paid by whoever is still working to it.
        format: SPOT
        question: Dispatch to the priority on the board, and keep watching the board.
        answerText: Read the board rather than the queue. Every change leaves an hour in which the old priority still looks like today's.
        why: >-
          Three priorities run across the fortnight and each wants a different part of the
          queue. Occupied buildings, then anything already placarded yellow, then schools. A
          building can answer two at once, which is what makes the change cost real rather
          than notional, and the panel scores the window either side of each change because
          most of the queue is wanted by neither priority and is correctly left waiting by
          somebody who has read nothing. The office's own version is the hour after an
          aftershock: the priority has changed to the yellow placards, whose capacity has just
          fallen again, and the teams already in the vans are driving to the list that was
          current before the shake.
        spot:
          duration: 40
          switchEvery: 12
          pass: 0.75
          hint: The priority is on the office board, and it is changed without an announcement.
          targets:
            - id: b1
              label: Flats, occupied
              tags: [occupied]
            - id: b2
              label: Yellow placard, empty
              tags: [yellow]
            - id: b3
              label: School, occupied
              tags: [school, occupied]
            - id: b4
              label: Yellow placard, occupied
              tags: [yellow, occupied]
            - id: b5
              label: Warehouse, empty
              tags: [empty]
            - id: b6
              label: School, closed
              tags: [school]
            - id: b7
              label: Shop row, empty
              tags: [empty]
            - id: b8
              label: Church hall, yellow
              tags: [yellow]
          rules:
            - say: Anything occupied
              want: [occupied]
            - say: Anything already yellow
              want: [yellow]
            - say: Any school

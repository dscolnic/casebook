      - group: STRUCT
        task: Inspect what backs each recorded claim, then spend the single direct-verification visit before the placard review.
        title: The part nobody has seen
        concept: "Peak ground acceleration and what a building feels"
        place: Structural Assessment
        scene: 90 patients remain on the ground floor while 2 upper floors sit empty. The hospital is still yellow after three days. Frame, cladding and stair are documented. The roof plant room remains locked, with two full water tanks above it.
        guide: >-
          Each claim on the list is signed or checked by somebody. Open the backing
          before you spend anything: some claims rest on an inspection of the thing they
          describe, and some rest on a document, an assumption or a locked door. You
          have one physical verification. Hold the claims the evidence does not support,
          and spend the visit where being wrong would cost the most.
        background:
          - >-
              What a record is and is not. A signature says somebody took responsibility for
              a statement. It does not say the condition was observed, and on a building
              three days after an earthquake those two come apart constantly: drawings are
              checked, cladding is looked at from the street, and a locked plant room is
              written up from the last inspection before the shake.
          - >-
              Why the tanks matter. Two full water tanks are mass, high up, in a room nobody
              has entered since the earthquake. If their supports have moved, the
              consequence lands on the floor below — where ninety patients are. The claim
              about that room is therefore the one whose being wrong costs the most,
              whatever its paperwork says.
          - >-
              Why one check rather than four. Verification costs time the hospital does not
              have while it stays yellow. Choosing which claim to check is the actual
              professional judgement, and it is a judgement about consequence rather than
              about which record looks flimsiest.
        takesAsRead:
        assumes:
          - a building's parts can be cleared separately
        takeaway: A signed or checked record is useful only to the extent that it is backed by observation of the condition it claims.
        format: ATTEST
        question: Which critical claim still needs physical verification on the current building?
        attest:
          hint: Open the backing attached to each claim before spending the visit. You have one direct verification before the placard review.
          checks: 1
          checkUnit: direct verification visit
          claims:
            - id: frame
              label: The reinforced-concrete frame has no observed condition requiring the current restriction
              critical: true
              backed: true
              evidence: Three days of frame inspection on all accessible floors.
            - id: cladding
              label: The external cladding does not present the unresolved structural issue
              critical: false
              backed: true
              evidence: Cladding inspection completed on day two.
            - id: stairs
              label: The main stair and egress route are usable for the proposed occupancy
              critical: true
              backed: true
              evidence: The stair core was directly inspected because it is the main escape route.
            - id: plant_room
              label: The roof water-tank restraints are adequate for the proposed occupancy
              critical: true
              backed: false
              evidence: No direct observation; the roof plant room remains unvisited.
        answerText: Verify the roof plant room. The frame, cladding and stairs already have direct observations behind them. The two full water tanks and their restraints are the critical condition nobody has seen, so that unbacked claim is the one holding the placard review open.
        why: A yellow placard should reduce to specific unresolved conditions, not a general feeling that more inspection is always safer. The frame, cladding and main stair already have direct observations behind their claims. The roof plant room does not. Its full water tanks add substantial mass high in the building, and nobody has seen their restraints. With one verification visit, repeating a comfortable backed inspection wastes the chance to resolve the one critical claim that still lacks physical evidence on the present configuration.
      - group: HAZ
        task: Put the cost of waiting into the same units
        title: What four more days buys
        place: Hazard & Forecasting
        scene: Tanaka has the aftershock rate for the coming week. Ives has the transfer log. Halvorsen wants both of them stated as consequences rather than as principles. The review board meets again at the end of the week.
        guide: >-

            - 85  (W, the building's seismic weight in MN)
            - 0.35  (C_s the building was designed to, in g)
            - 14  (the weight of one floor, in MN)
            - 1998  (the year the instrument was installed)
          values: [0.31, 85, 0.35, 14, 1998]
          slots: 2
          template: '{0} × {1}'
          formula: a*b
          correct: [0, 1]
          target: 26.35
          tolerance: 2
          units: meganewtons (MN) of base shear
          solution: 0.31 × 85 ≈ 26 MN, against a design base shear of 0.35 × 85 ≈ 30 MN.
          explanation: About 12 per cent under the design force. One input measured, and not a clearance for the building.
          givens:
            - four storeys, so the natural period is T ≈ 0.1 × 4 = 0.4 s
            - seismic weight about 85 meganewtons
            - recorded peak 0.31 g, design value 0.35 g
          relationship: An N-storey building has a natural period T ≈ 0.1 N. The coefficient is read off the spectrum there, and the base shear is V = C_s · W.
      - group: STRUCT
        task: Sort the damage photographs before the panel sits.
        title: The frame, or the finish
        concept: "Load path, and what happens where it stops"
        place: Structural Assessment
        scene: Four hundred photographs came in from the rapid assessment and the panel sits at four. Some of what is in them is the structure. The rest is what was hung on it, and the two produce the same alarm in a caption.
        guide: >-
          Two bins. Structural damage is to the things carrying load down to the ground —
          columns, beams, walls that hold something up, connections between them.
          Non-structural damage is to what the building carries: cladding, ceilings, partitions,
          services. Sort on whether the item is in the load path.
        background:
          - >-
              Why the split decides the placard rather than the repair bill. A cracked partition is
              expensive and does not change whether the building stands up in the next aftershock. A
              cracked column does, and it can be behind a partition that looks fine.
          - >-
              Why non-structural damage still kills people. Falling cladding, a collapsed ceiling grid
              and a toppled bookcase all injure. They are dealt with by clearing and securing rather
              than by shoring, which is a different crew and a different day.
        assumes:
          - some parts of a building hold it up and some are carried by it
        takeaway: What decides occupancy is what is in the load path, not what looks worst.
        format: BELT
        question: Send each photograph to the bin that says whether it is in the load path.
        answerText: Anything carrying load to the ground is structural. Anything the building carries is not, however alarming it looks.
        why: >-
          The placard question is whether the building will stand up to the next shake, and
          only what carries load answers it. Columns, beams, shear walls and their connections
          are the path down to the foundation, and damage to any of them changes capacity. A
          shattered partition, a collapsed ceiling grid, cladding hanging off a facade and a
          toppled bookcase are all carried *by* that path, and none of them makes the frame
          weaker. That is why the sort matters more than it sounds: the alarming photographs
          are mostly non-structural, and the photograph that decides the placard is often a
          hairline diagonal on a column behind an intact wall. Non-structural damage still
          injures people — falling cladding is the commonest injury in a moderate earthquake —
          so the answer is not that it does not matter. It is that it wants a different crew,
          a different urgency, and no shoring.

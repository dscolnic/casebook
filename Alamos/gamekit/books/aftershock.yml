      - group: MAT
        task: Get a strength from a damaged column
        title: A number, with a method attached
        concept: Sampling and testing damaged material
        place: Materials & Testing
        scene: "4 cores, 100 mm across, cut from the cracked columns. Sørensen caps and crushes them: 28, 31, 24 and 30 megapascals. The 1974 drawing calls for 25. The four labelled specimens are still on the testing bench."
        guide: >-
          Work the third core's strength out from the machine's own numbers rather than
          reading it off the report. Stress is the crushing force divided by the area the
          force acted on, and the area is the circle the core presents — not its diameter.
          One tile is that diameter, left for somebody who divides by the wrong thing.
        background:
          - >-
              Why the area and not the diameter. A stress is a force spread over a surface, so
              the number underneath has to be an area in square metres. A 100 mm core presents a
              circle of about 0.00785 m², and using 0.1 instead gives an answer twelve times too
              small with no unit to warn you.
          - >-
              What the strain is doing. The machine also records shortening: 0.42 mm over a
              200 mm gauge length is a strain of 0.0021, which is dimensionless because it is a
              length over a length. Stress against strain up to the yield point is what the
              material's stiffness is, and it is the pair that makes a stress–strain curve.
          - >-
              What a core does not settle. A member's capacity depends on the force it actually
              carried, on its reinforcement and on how well that steel confines the concrete —
              none of which travels in a cylinder. Four cores near the specified strength argue
              against grossly weak concrete and say nothing about a cracked column's remaining
              capacity.
        assumes:
          - concrete strength is measured by crushing a sample of known size
        takeaway: Core tests characterize sampled concrete; they do not certify the residual capacity of the cracked columns.
        format: BALLPARK

        guide: >-
          Shaking like this needs two things. A structure with its own rhythm, and
          something pushing in time with it. All four options act on one of those, or on
          neither. Ask which, and how fast the crew could do it. It has already grown
          worse over three cycles. So one option's bet, that it holds together on the way
          through, is not safe.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - shaking like this needs a structure and something pushing it in time
        takeaway: Change what is pushing, when you cannot change what is being pushed.
        format: CHOICE
        question: Which change stops the pushes landing in time with the panel?
        answerText: Move the pump speed off the band. It stops the pushes landing in time, and it can be undone at once.
        why: "This kind of shaking needs two things: a structure with a rhythm, and something pushing in time with it. In flight, changing what is pushing is far easier than changing the structure. Moving the pump speed off the band stops the pushes landing in time, and it can be undone in a second. Deadening the panel is the proper permanent fix, and it needs hardware and somebody's hands on it. Running faster through the band assumes it survives the crossing."
        choices:
          - Move the pump's speed away from the band.
          - Deaden the panel, so the shaking dies away.
          - Measure it in a few more places first.
          - Run the pump harder, to get through the band quickly.
        answer: Move the pump's speed away from the band.
        rebuttals:
          - Deadening it bleeds the energy away and is the right permanent fix. It needs hardware, access and somebody's hands on the structure.
          - Measuring in more places is how you check the fix worked. It is the check rather than the fix.

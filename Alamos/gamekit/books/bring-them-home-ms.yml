  - title: The Last Correction
    objective: Decide whether to burn using the expected benefit relative to navigation and propulsion uncertainty.
    briefing: Hours before entry, tracking stations disagree slightly. The player must combine measurements with correlated errors and decide whether another burn reduces or increases total risk.
    stake: "A hundred and six hours in, and it is Carter's turn. She has waited four days for it. Several ground stations suddenly put the spacecraft ahead of its path. They agree with each other, and they all run off the same clock. Whitaker wants the burn now. Today you decide whether the spacecraft really moved. Carter's rule is that a correction is only worth making when it is bigger than the doubt in the measurement."
    takeaway: Use random and systematic error, weighted averages, errors that move together, propagation, decision thresholds as an evidence chain rather than as isolated facts.
    stops:
      - group: NAV
        task: Say which explanation fits all four checks.
        title: Really off course, or one bad clock?
        place: Global Tracking Network
        scene: Several ground measurements suddenly put the spacecraft ahead of where it should be. They agree with each other. A star camera and the clock records are both available.
        guide: >-
          Open each measurement to see what it depended on. Keep the ones that would
          still stand if one clock were wrong, and untick the rest. Then name what the
          others share. Two ground measurements agreeing is not two pieces of evidence
          if both were timed by the same clock.
        background:
          - >-
              Why agreeing is not the same as independent. Both ground measurements work out
              where the spacecraft is from how long a signal took. If the clock they both
              use is wrong, both answers move the same way at the same moment. They will
              agree beautifully and both be wrong.
          - >-
              What the star camera is doing on the board. It works out where the spacecraft
              is by looking at stars, with no clock involved. So it either confirms the two
              ground answers or it does not, and either way it is telling you something they
              cannot.
          - >-
              Why this matters before anybody acts. Correcting a course that is not wrong
              makes it wrong, and spends fuel doing it. Finding out which measurements moved
              on their own is what stops that.
        assumes:
          - several instruments can be wrong together if they share a part
        takeaway: When measurements agree, ask whether they agree separately or share a part.
        format: TRACE
        question: Which measurements moved on their own, and which moved together?
        trace:
          decision: Decide whether the spacecraft really moved or several measurements share one late clock.
          hint: Open each measurement to see what it is built from. Keep the ones that do not pass through the suspect clock.
          channels:
            - id: range
              label: Range measurement
              reading: puts it ahead
              depends:
                - path
                - ground_clock
            - id: doppler
              label: Doppler measurement
              reading: puts it ahead
              depends:
                - path
                - ground_clock
            - id: reprocessed
              label: The same data, re-timed
              reading: puts it ahead
              depends:
                - path
                - ground_clock
            - id: star
              label: Star camera
              reading: matches the prediction
              depends:
                - path
                - star_field
          resources:
            - id: path
              label: Where the spacecraft actually is
            - id: ground_clock
              label: The ground clock
            - id: star_field
              label: The stars
          target: ground_clock
          independent:
            - star
        answerText: One shared clock. The measurements that moved all use it, and the star camera, which does not, still agrees with the prediction.
        why: Agreement counts only when the things agreeing could have failed apart. These measurements all use the same ground clock, so one clock error moves them together. The star camera does not use that clock, and it still matches the prediction. Nothing pushed the spacecraft, and the onboard readings show no push either. Redo the sums with the corrected clock and nearly all the error disappears. Several agreeing numbers turned out to be one fault.
        rebuttals:
          - Moving off course needs a push, and the onboard readings show no push at all.
          - Separate failures do not drift the same way at the same moment. These share a clock.
          - A failed star camera would put its answer in the wrong place. It is the one that agrees with the prediction.
        headline: Several ground measurements suddenly put the spacecraft ahead of where it should be.
        readings:
          - zone: Range/Doppler residuals
            label: Range/Doppler residuals
            value: Shift together
            status: alarm
            note: Both channels use the same ground time reference
          - zone: Star-angle navigation
            label: Star-angle navigation
            value: Matches predicted direction
            status: normal
            note: Independent angular geometry is stable
          - zone: Ground timing reference
            label: Ground timing reference
            value: Offset detected
            status: alarm
            note: Shared clock is late relative to an independent standard
          - zone: Reprocessed data
            label: Reprocessed data
            value: Residual largely disappears with corrected time
            status: alarm
            note: Same raw observations, new timestamps
          - zone: Onboard dynamics
            label: Onboard dynamics
            value: No unmodeled acceleration
            status: normal
            note: No physical force explains a sudden trajectory jump
        choices:
          - label: The spacecraft really is off course.
            mechanism: It has actually moved away from the predicted path.
          - label: One shared clock is wrong, and it moved everything that uses it.
            mechanism: One shared timestamp shifts everything worked out from it, together.
          - label: Several instruments failed separately, at the same time.
            mechanism: Unrelated instruments happen to drift the same way at the same moment.
          - label: The star camera has failed.
            mechanism: The star camera alone is producing a wrong answer.
        answer: One shared clock is wrong, and it moved everything that uses it.
      - group: NAV
        task: Work out how much clear space is left either side.
        title: How much room is left
        concept: "Rates: how fast something is used up, and how long it lasts"
        place: Navigation Covariance Room
        scene: The entry corridor is forty kilometres wide. The circle of doubt around the spacecraft's position is ten kilometres across. Sandoval needs a margin before the burn is called.
        guide: >-
          Three numbers, and one of them is a single one of the two errors. That was
          used earlier to work out the circle of doubt. Ask which two this needs. The
          doubt sits around the middle, so it uses up room on both sides at once. That
          is why the answer is not the corridor minus the doubt.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - a position is the middle of a circle of doubt, not a fact
        takeaway: A route is planned against the doubt, not against the line drawn through the middle of it.
        format: BALLPARK
        question: How much clear space is left on each side, if it flies down the middle?
        answerText: Fifteen kilometres each side. Twenty from the middle of the corridor, less five for how far off the spacecraft might be.
        why: The corridor is forty kilometres wide, so aiming down the middle puts twenty either side. The spacecraft could be five kilometres off in any direction, so five of those twenty are already spent before anybody makes a mistake. Fifteen is what is left. That is the number the burn is judged against, and it is why the doubt has to be drawn at the same scale as the corridor rather than mentioned in a footnote.
        estimate:
          relationship: Margin = (corridor − doubt) ÷ 2.
          prompt: The corridor is 40 kilometres wide. The circle of doubt around the position is 10 kilometres across.
          question: How much clear space is left on each side, if it flies down the middle?
          labels:
            - 40 km (width of the corridor)
            - 10 km (width of the doubt)
            - 6 km (one of the two errors)
          values: [40, 10, 6]
          slots: 2
          template: "({0} − {1}) ÷ 2"
          formula: (a-b)/2
          correct: [0, 1]
          target: 15
          tolerance: 2
          units: km
          solution: Forty take away ten is thirty. Down the middle, that is 15 kilometres on each side.
          explanation: Take the doubt off the corridor first, then split what is left between the two sides. Both are widths, so both belong to the whole corridor rather than to one edge of it.
      - group: INTEG
        task: Predict what the burn will do, fire it, then measure it.
        title: Say it before you do it
        concept: Repeats and averages, and what one reading is worth
        place: Flight Director Console
        scene: The correction burn is ready. It adds 3 metres a second, 12 hours before the spacecraft reaches the air. Carter wants the prediction written down first.
        guide: >-
          Write down how far you expect the burn to move the landing point, before it is
          fired. Once written it cannot be changed. Then fire the burn, and then decide
          whether to spend what it costs to measure where the landing point actually
          went. Not measuring is an answer too, and a poor one.
        background:
          - >-
              Why a small burn moves the landing point so much. Three metres a second,
              twelve hours out, is applied to a spacecraft travelling thousands of metres a
              second. It barely changes the speed. What it changes is the path, and twelve
              hours of flying turns a small change of path into a large change of where it
              arrives.
          - >-
              Why the prediction goes first. A number written after the measurement is not a
              prediction. With the answer in front of you it is genuinely hard to remember
              what you expected, which is why the order is enforced rather than suggested.
          - >-
              What is lost by not measuring. A prediction nobody checks can never be wrong,
              which is what makes it worthless. Checking is also the only way to find out
              whether the model used to make it can be trusted for the next burn.
        assumes:
          - a speed and a time give a distance
          - a prediction is only a test if it is made before the result is known
        takeaway: A burn that happened is not a burn that worked. Only the measurement afterwards says so.
        format: VERIFY
        question: Predict how far the burn moves the landing point, fire it, and then measure.
        verify:
          hint: Write the prediction first. It cannot be changed afterwards, which is the whole point of writing it first.
          prediction: { label: How far the landing point moves, unit: km, min: 0, max: 200, step: 5 }
          truth: 130
          passRatio: [0.7, 1.4]
          intervention:
            label: The correction burn
            note: 3 metres per second, 12 hours before entry.
            outcome: Burn complete. The engine ran for the full nine seconds.
          measurement:
            label: A tracking pass after the burn
            note: One station, comparing where it is now against where it was going.
            cost: 1
            costUnit: passes
          unmeasuredMoral: The engine fired and nobody looked. A burn that happened is not the same as a burn that worked.
          commit: Report the correction
        answerText: About 130 kilometres — and only the tracking pass afterwards shows whether it really moved that far.
        why: Three metres every second sounds like nothing. Keep it up for 12 hours and it is a long way. Three metres a second is about 11 kilometres an hour. Eleven, for 12 hours, is roughly 130 kilometres. Say that number out loud first. It is the only thing the tracking pass can be compared against. An engine can run short, point a little wrong, or stop early. None of that shows on the console that told it to fire. The pass afterwards is what turns a burn that happened into a burn that worked.
  - title: Reentry
    objective: Conduct a claim-by-claim readiness review and execute entry with predefined triggers and authority.
    briefing: "The final minutes require every physical model and procedure to agree: attitude, center of mass, velocity, atmosphere, thermal shield, communications, and recovery."
    stake: "A hundred and eighteen hours in. The landing starts in eleven minutes, four of them with no radio, and none of it can be undone. Today you check the claims one at a time and decide whether this spacecraft is ready. The heat shield has been cold for four days. The battery was charged a way nobody planned. Ruiz lined the spacecraft up by hand, against stars. All of it has to hold at the same moment."
    takeaway: Use integrated mechanics, thermodynamics, waves, fluids, uncertainty, ethics of command as an evidence chain rather than as isolated facts.
    stops:
      - group: INTEG
        task: Say why the radio goes quiet.
        title: Four minutes of silence
        place: Integrated Flight Room
        scene: For four minutes in the middle of entry there is no radio at all. The room knows it is coming, and Carter still wants somebody to say why it happens.
        guide: >-
          Four options, and three of them blame equipment or geometry. Ask of each
          whether it would give exactly four minutes, every time, in the same part of
          entry. Something breaking would not. Being behind the Moon does not happen
          here. What happens instead is that the capsule makes the air around itself
          glow.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - rubbing something hard makes it hot
          - radio waves travel through air but not through everything
        takeaway: Some silences are physics rather than faults, and nothing on the ground can shorten one.
        format: CHOICE
        question: Why does the radio go quiet for four minutes?
        answerText: The air around the capsule is squeezed until it glows, and glowing air will not let radio through.
        why: The capsule hits the air at enormous speed, and the air in front of it has nowhere to go. Being squeezed that hard makes it hot, hot enough to glow, and that glowing layer wraps the whole capsule. Radio waves cannot get through it. The silence is not a fault and nobody can fix it from the ground. It ends by itself when the capsule has slowed enough for the air to stop glowing, and everything that might need a decision has to be settled before it starts.
        choices:
          - Glowing hot air wraps the capsule and blocks radio.
          - The antenna is switched off to save battery.
          - The capsule is behind the Moon at that point.
          - The radio is broken by the shaking of entry.
        answer: Glowing hot air wraps the capsule and blocks radio.
        rebuttals:
          - Nothing is switched off. The radio is transmitting the whole time and nothing gets out.
          - The Moon is far behind them by entry. They are at the Earth.
          - Nothing breaks. The radio works again by itself once the capsule slows down.
      - group: INTEG
        task: Put the entry steps in order around the four minutes of silence.
        title: The order the silence forces
        place: Crew Capsule
        scene: Everything now depends on eleven minutes, and four of them have no radio at all. Anything that needs the ground has to happen before the silence starts.
        guide: >-
          Four minutes with no radio is what puts these in order. Ask of each step
          whether it needs the ground, and whether it could be done after the silence
          starts. Anything the ground must agree to happens first. Anything compared
          with a prediction can only happen once entry has begun.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim that each step needs the
              one before it to have happened. Get one pair the wrong way round and the claim
              is wrong, even if everything else lines up. That is why there is no part
              credit.
          - >-
              Why the ends are the place to start. The first and last steps are usually the
              easiest to be sure of, because one has nothing before it and the other has
              nothing after it. Fixing those two leaves fewer ways for the middle to go, and
              the middle is where the real question usually is.
          - >-
              What the rail can be ordered on. Often it is time. It can also be cost, or
              risk, or what you can still undo afterwards — do the steps that change nothing
              before the ones that change something for good. A step that destroys the
              sample can only be last.
        assumes:
          - nothing can be fixed from the ground while the radio is quiet
        takeaway: When part of a plan cannot be changed, everything that might need changing goes before it.
        format: SEQUENCE
        why: Four minutes of silence sets the whole order. Anything that needs a decision from the ground has to be settled first, because during the silence there is nobody to ask. Who is flying gets agreed before the silence, not during it. Watching the slowing and the heating can only start once entry has begun, so it comes after. And the recording runs throughout, because this flight is the only test the predictions will ever get.
        rebuttals:
          - Attitude and settings first, before entry. Nothing here can be changed through four minutes of silence.
          - Agree who is flying before committing. That is not something to work out while nobody can talk.
          - Watching the slowing comes third. It cannot start before entry, because there is nothing to compare yet.
          - Descent last, with the record kept. This is the only flight that will ever produce this data.
        cards:
          - Set the approved attitude and settings before the silence.
          - Agree who is flying, before the radio goes quiet.
          - Watch the slowing and the heating against what was predicted.
        order: [0, 1, 2]
      - group: NAV
        task: Say which proposal removes the cause rather than improving the response.
        title: What the review should fix
        place: Entry Tracking Network
        scene: The crew is aboard the recovery ship and the review board meets Monday. Four proposals compete for three funded places.
        guide: >-
          All four proposals are worth money, and there are three places. Ask of each
          whether it removes a cause, or helps you cope with one. The same weakness
          turned up twice on this flight. Several readings on one circuit, and several
          measurements on one clock. Both times, things agreeing looked stronger than it
          was.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - a fix that removes a cause outlasts a fix that improves the response
        takeaway: Fixing what caused it outlasts getting better at coping with it.
        format: CHOICE
        question: Which proposal deserves first place, because it removes the cause?
        answerText: Remove the shared parts. Everything else on the list helps people cope with the same failure rather than preventing it.
        why: The same weakness appeared twice on this flight. Three pressure readings shared one circuit, and later several tracking numbers shared one clock. Both times, agreement looked far stronger than it was, and both times somebody nearly acted on it. Removing those shared parts is the only proposal that stops it happening again. Keeping better records and rehearsing more both help people cope with it, which is a different and smaller thing.
        choices:
          - Redesign the shared circuits and shared clocks, so agreement means something.
          - Keep the full records of telemetry, settings and decisions.
          - Improve the simulator, and rehearse failures more.
          - Put more people on the anomaly desk for future flights.
        answer: Redesign the shared circuits and shared clocks, so agreement means something.
        rebuttals:
          - Keeping the records is how anybody reconstructs it afterwards, and it leaves the shared parts exactly where they are.
          - Rehearsing improves how people handle the same failure. It does not stop the shared clock failing again.
          - More people can diagnose it faster, and the shared part is still there to fail.
# What each place says when the player reads it.
# --------------------------------------------------------------- the warm-ups
warmups:
  greet:
    title: Four rows of consoles, and every row owns part of the answer
    why: >-
      The room is one floor of desks, and the team that reads the power numbers sits two rows from
      the team that reads the air. Put a name to as many of them as you can before the next pass. In here you ask
      across the room, not down a corridor.
  trial-near:
    title: Walk the floor before the first pass
    why: >-
      The plot boards are at the front and the consoles step down towards them in four tiers.
      Walk the whole floor once, because when a number is wrong you have about ninety seconds to
      get to the desk that owns it.
  follow:
    title: Duarte walks a number from the aerial to the board
    why: >-
      A reading comes down from the spacecraft, through three desks, and onto the wall. Duarte
      walks the whole path once. Stay with her, and watch which desk is allowed to change it.
  hunt:
    title: Six spare tapes, and the log lists four
    item: { name: spare tape, plural: spare tapes }
    why: >-
      Every pass is recorded twice, and two of the spare tapes are not where the log says. A
      tape nobody can find is a pass nobody can play back, and you only get the pass once.
  canvass:
    title: Which desks saw the drop, and when
    why: >-
      Something in the power reading dipped for four seconds. Whether every desk saw it at the
      same moment decides if it was the spacecraft or the ground station. Ask round the room
      until enough desks have answered.
  evade:
    title: Keep clear of the press desk before the pass
    why: >-
      Somebody has been waiting by the door for a number since six, and nothing goes out before
      it is checked twice. Get to your console without going past them, and leave the talking
      until after the pass.
  tag:
    title: Catch Lindqvist before the shift changes
    why: >-
      Lindqvist, the flight dynamics integrator, has the hand-written power budget from the last
      pass, and the handover is in six minutes. After that she is off shift for twelve hours.
      Nothing this morning can be worked out without those figures.

copy:
  NAV: <p>Guidance. Where the spacecraft is, how fast, and how much of that is actually known.</p>
  ELEC: <p>Electrical systems. Every watt aboard is drawn from an inventory that is not being refilled.</p>
  THERM: <p>Thermal and life support. Heat, gas and water — the three things a cabin runs out of.</p>
  COMMS: <p>Communications. Everything known about the vehicle arrives through this room.</p>
  STRUCT: <p>Structures and dynamics. Rotation, vibration and the loads a spacecraft was built to take.</p>
  INTEG: <p>Mission operations. Six rooms report here and one person decides.</p>
  SIGNIN: <p>Badge and sign-in. Nobody reaches the operations floor without appearing on this sheet.</p>
  GALLERY: <p>The viewing gallery. Off-shift controllers wait out a burn here rather than at home.</p>
  QUIET: <p>The crew family room. Kept staffed, and kept away from the loop.</p>
  LIBRARY: <p>The trajectory library. Every plot, every burn, every version that was superseded.</p>

            - { name: Follows sun angle, bin: left }
            - { name: Matches the model, bin: left }
            - { name: Crew confirms it, bin: left }
            - { name: Instant jump, bin: right }
            - { name: Past the scale, bin: right }
            - { name: Frozen an hour, bin: right }
            - { name: Exactly zero, bin: right }
            - { name: Two others disagree, bin: right }
            - { name: An impossible speed, bin: right }
            - { name: Flicking every second, bin: right }
            - { name: Negative temperature, bin: right }
            - { name: Changed with reset, bin: right }
            - { name: One string only, bin: right }
            - { name: Noise gone entirely, bin: right }
            - { name: Off the scale, bin: right }
            - { name: Stuck at maximum, bin: right }
            - { name: Nothing else agrees, bin: right }
          commit: Start the line
  - title: The Power Budget
    objective: Build a load-shedding plan that preserves essential functions through the next critical maneuver.
    briefing: Fuel cells and batteries are degraded. Every electrical load now competes with guidance, communications, thermal control, and life support.
    stake: "Thirty-four hours in. Priya Shah, the power systems lead, has the power reserve down to hours, and she wants everything not vital switched off today. Aaron Brooks, the thermal and life support lead, says the two things on his list are the air scrubber and the heaters. His crew are sleeping in everything they own. Today you work out how long the batteries last and choose what goes off. Whatever you switch off, somebody up there feels it."
    takeaway: Use current, voltage, resistance, electrical power, energy budget as an evidence chain rather than as isolated facts.
    stops:
      - group: ELEC
        task: Turn the store and the draw into hours.
        title: How long can the battery last?
        place: Electrical Systems Room
        scene: The fuel cells are gone, and the crew is on the entry batteries days earlier than any plan allowed. The flight doctor, who watches the crew's health from the ground, wants a number of hours before the next decision about switching things off.
        guide: >-
          Five numbers, and three belong to other questions. The voltage, the brief
          peak, and the time to the next burn. Ask of each whether it is an amount
          stored, or a rate of use. An amount divided by a rate leaves a time. And note
          what the answer assumes: nothing switching on, and every last bit usable.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - a store is an amount, and a draw is how fast it is being used
        takeaway: An amount divided by a rate is a time, and that time is what every other decision gets argued against.
        format: BALLPARK
        question: How long will the batteries last?
        answerText: About six hours, if the draw stays flat. It is a rough number, and everything today gets argued against it.
        why: There is a store and there is a draw, and dividing one by the other gives hours. Eighteen kilowatt hours at three kilowatts is six hours. It is an ideal figure. It assumes the draw stays flat and that every last bit of the store is usable, and neither is quite true. A cold battery gives less than its label. It is still the number every argument this shift is measured against, so it is worth having early and worth calling rough.
        estimate:
          relationship: Hours = what is in the store ÷ how fast it is being used.
          prompt: The entry batteries hold about 18 kilowatt hours that can actually be used. The things that must stay on draw about 3 kilowatts.
          question: How long will the batteries last?
          labels:
            - 18 kWh (what is usable in the batteries)
            - 3 kW (what must stay on)
            - 28 V (the bus voltage)
            - 3.5 kW (the peak draw, briefly)
            - 6 h (time to the next burn)
          values: [18, 3, 28, 3.5, 6]
          slots: 2
          template: "{0} ÷ {1}"
          formula: a/b
          correct: [0, 1]
          target: 6
          tolerance: 0.4
          units: h
          solution: 18 ÷ 3 is 6 hours.
          explanation: The bus voltage says how the energy is delivered, and nothing about how much there is. The time to the next burn is a deadline rather than an ingredient.

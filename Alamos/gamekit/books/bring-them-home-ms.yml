theme:
  id: bring_them_home_ms
  title: Bring Them Home
  subtitle: Flight Director · Lunar Return Mission

# The areas of study. One column of the game each; every group needs somebody on the roster.
groups:
  - id: NAV
    code: NAV
    name: Guidance & Motion
    color: "#315c78"
    desc: Kinematics, forces, gravity, trajectories, and navigation evidence.
    defaultLeader: reyes
    milestones:
      - Reconstruct the state
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: ELEC
    code: ELEC
    name: Power & Circuits
    color: "#9a741d"
    desc: Voltage, current, resistance, batteries, generation, and electrical faults.
    defaultLeader: shah
    milestones:
      - Close the power budget
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: THERM
    code: THERM
    name: Thermal & Life Support
    color: "#4b775f"
    desc: Heat transfer, gas behavior, pressure, flow, and life-support transport.
    defaultLeader: brooks
    milestones:
      - Keep the cabin stable
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: COMMS
    code: COMMS
    name: Waves & Communications
    color: "#704f88"
    desc: Radio waves, link budgets, pointing, optics, and signal timing.
    defaultLeader: ito
    milestones:
      - Recover the link
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: STRUCT
    code: STRUCT
    name: Rotation & Structures
    color: "#9a3f36"
    desc: Torque, angular motion, oscillations, resonance, and structural response.
    defaultLeader: mensah
    milestones:
      - Control motion and vibration
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: INTEG
    code: INTEG
    name: Mission Integration
    color: "#3d6f52"
    desc: Uncertainty, competing constraints, robust decisions, and final readiness.
    defaultLeader: carter
    milestones:
      - Integrate the evidence
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off

# The cast. `division` is what makes a person a valid person stop.
roster:
  - id: reyes
    name: Dr. Camila Reyes
    role: Guidance Lead
    division: NAV
    quiz:
      - q: How does Reyes tell a real trajectory change from a measurement artefact?
        a: By seeing whether independent sources moved, or only one
        wrong:
          - By re-running the same navigation solution with much tighter tolerances
          - By waiting for the next scheduled navigation update
          - By comparing the result against the pre-launch plan
    bio: Uses independent tracking and dynamics to decide whether an apparent trajectory change is physical or a measurement artifact.
  - id: shah
    name: Priya Shah
    role: Power Systems Lead
    division: ELEC
    quiz:
      - q: Why does Shah read voltage, current and heat as one system?
        a: They are three views of one energy budget
        wrong:
          - Three separate instruments together are more accurate than any one of them
          - Heat is the only quantity that can be measured directly in flight
          - The three meters share a single power supply
    bio: Reads voltage, current, power, and heat as one energy system rather than isolated meters.
  - id: brooks
    name: Dr. Aaron Brooks
    role: Thermal and Life Support Lead
    division: THERM
    quiz:
      - q: What does Brooks mean by asking whether hardware is transporting what it should?
        a: Power to a fan is not proof that air is moving
        wrong:
          - Hardware telemetry becomes unreliable during a power-down and cannot be trusted
          - Transport rates can only be measured on the ground
          - The crew cannot hear whether a fan is running
    bio: Tracks heat and gas through the cabin and asks whether powered hardware is actually transporting what it should.
  - id: ito
    name: Naomi Ito
    role: Communications Lead
    division: COMMS
    quiz:
      - q: Why does Ito treat received power as only part of a link diagnosis?
        a: Pointing, range and a transmitter fault all look the same in it
        wrong:
          - Received power is sampled too slowly to be useful during a fast fade
          - Power readings are quantised too coarsely at long range
          - Only frequency measurements are calibrated
    bio: Turns wave physics, antenna pointing, range, and receiver measurements into a quantitative link diagnosis.
  - id: mensah
    name: Kwame Mensah
    role: Dynamics and Structures Lead
    division: STRUCT
    quiz:
      - q: Why does Mensah care about the frequency something is shaken at, not just how hard?
        a: A structure answers strongly only near its own natural frequency
        wrong:
          - Forcing at high frequency always does more damage than forcing at low frequency
          - Frequency determines how far the vibration travels through the hull
          - Accelerometers only respond above a threshold frequency
    bio: Connects torque, forcing frequency, natural modes, and measured motion to spacecraft behavior.
  - id: carter
    name: Dr. Evelyn Carter
    role: Mission Integration Lead
    division: INTEG
    quiz:
      - q: What is Carter guarding against by demanding independent evidence?
        a: Two instruments sharing a step can be wrong together
        wrong:
          - Crew reports become unreliable when the people making them are under stress
          - A single instrument cannot be calibrated in flight
          - Independent teams work faster than one large team
    bio: Challenges common-mode assumptions and makes the final decision only after independent evidence agrees.
  - id: whitaker
    name: Dale Whitaker
    role: Trajectory Officer
    division: NAV
    bio: |-
      Fits trajectories to whatever tracking exists, which on a bad shift is three
      numbers taken hours apart. A fit that matches the data he has is easy; a fit
      that predicts the next observation is the only kind he will sign.

      He treats residuals as the real output. A pattern in what the model got
      wrong points at an unmodelled force or a clock error, and both of those have
      hidden themselves inside a good-looking fit before.
    quiz:
      - q: Why does Whitaker judge a trajectory fit by its residuals rather than by how closely it matches the tracking?
        a: Structure in the errors shows a force or a clock the fit is hiding
        wrong:
          - Residuals are the only quantity the tracking stations report back to the room
          - A fit with small residuals always has small uncertainty
          - Residuals convert range measurements into velocity
  - id: ferreira
    name: Ana Ferreira
    role: Electrical Load Officer
    division: ELEC
    bio: |-
      Keeps the power budget, which during this flight means keeping a list of
      everything aboard that consumes energy and what happens the hour after it is
      switched off.

      Her rule is that no load is switched off in isolation. A heater turned off to
      save amp-hours becomes a thermal problem that costs more amp-hours to
      reverse, and the ledger has to be kept across systems rather than within one.
    quiz:
      - q: Why does Ferreira refuse to evaluate a load in isolation?
        a: Switching one off moves the cost somewhere else
        wrong:
          - Every load aboard draws the same current
          - Loads can only be measured while the fuel cells are running
          - A load's cost is fixed by its rating rather than by its use
  - id: novak
    name: Petra Novak
    role: Life Support Engineer
    division: THERM
    bio: |-
      Works the three things a sealed cabin runs out of — heat, breathable gas and
      water — and the ways they interfere with each other. Cooling the cabin
      condenses water onto the coldest surfaces, and the coldest surfaces are
      usually the electronics.

      She measures in more than one place on principle. A single cabin sensor
      reports the air beside itself, and a compartment with poor circulation can be
      perfectly comfortable at the sensor and dangerous two metres away.
    quiz:
      - q: Why does Novak insist on carbon dioxide readings from several cabin locations?
        a: With poor circulation the gas is not uniform, so a sensor reads its own corner
        wrong:
          - Sensors drift too quickly to be trusted individually
          - The crew cannot reach the primary sensor while the module is powered down for the test
          - Multiple readings are averaged to remove instrument noise
  - id: haldane
    name: Marcus Haldane
    role: Link Analyst
    division: COMMS
    bio: |-
      Accounts for every decibel between the spacecraft transmitter and the ground
      receiver. A fade is never mysterious to him; it is one term in a budget that
      changed, and the work is finding which.

      Range, antenna pointing, receiver bandwidth and transmitter health all reduce
      the same received power, and they are told apart by what else changed at the
      same moment rather than by the signal level itself.
    quiz:
      - q: How does Haldane separate a pointing problem from a transmitter failure?
        a: By what changed alongside it — attitude, range and schedule leave traces
        wrong:
          - A transmitter failure always removes the carrier completely
          - Pointing errors change the frequency and failures do not
          - The received power alone identifies the cause without any other measurement
  - id: okoye
    name: Chidi Okoye
    role: Structural Dynamics Engineer
    division: STRUCT
    bio: |-
      Studies how a spacecraft responds to being pushed at particular rates. A
      structure has frequencies at which a small repeated force produces a large
      motion, and hardware that is perfectly strong at rest can fail there.

      He never accepts a single accelerometer as a description of a mode. One
      sensor sits at one point, and a point that happens to sit at a node reads
      almost nothing while the panel beside it moves.
    quiz:
      - q: Why will Okoye not characterise a vibration mode from one accelerometer?
        a: At a still point of that mode there is nothing to feel
        wrong:
          - Accelerometers cannot measure below one hertz
          - A single sensor cannot record frequency, only amplitude
          - One sensor is enough only if the pump speed is constant
  - id: lindqvist
    name: Erika Lindqvist
    role: Flight Dynamics Integrator
    division: INTEG
    bio: |-
      Sits between the back rooms and the loop, and her job is the one nobody else
      has: deciding which of six correct answers the flight director hears first.

      She keeps the anomaly log, because in a fast failure the expensive mistake is
      not a wrong number but two rooms acting on different versions of the same
      number an hour apart.
    quiz:
      - q: What does Lindqvist treat as the main risk during a fast-moving failure?
        a: Two teams working from figures that disagree
        wrong:
          - A back room refusing to give an estimate at all
          - The crew asking questions over the loop
          - Telemetry arriving faster than it can be plotted

# Terms the game may explain in place.
glossary:
  - name: Calibration
    aliases:
      - calibration
      - calibrated
      - calibrate
    def: The correction between what an instrument reads and what is true, established against something known. A shared calibration is why two instruments can be wrong together.
  - name: Common-mode error
    aliases:
      - common-mode error
    def: A shared error that makes several measurements agree for the same wrong reason.
  - name: Doppler shift
    aliases:
      - doppler shift
    def: A frequency change caused by relative motion between source and observer.
  - name: Parallax
    aliases:
      - parallax
    def: The apparent shift of a nearby object against a distant background when the viewpoint moves. With a known baseline it gives a distance.
  - name: Power
    aliases:
      - power
    def: The rate at which energy is transferred or used.
  - name: Resonance
    aliases:
      - resonance
    def: Large oscillation produced when forcing is near a system natural frequency.
  - name: Scrubber
    aliases:
      - scrubber
      - scrubbers
    def: The unit that removes carbon dioxide from the cabin air. It cleans only the air that reaches it.
  - name: State vector
    aliases:
      - state vector
    def: A compact description of position and velocity at one time.
  - name: Torque
    aliases:
      - torque
    def: The rotational effect of a force applied with a lever arm.
  - name: Transponder
    aliases:
      - transponder
    def: The box aboard the spacecraft that answers a radio pulse from the ground, which is what makes timing the round trip a distance measurement.

# The campaign: 1 working day each, 3 stops and a callback from day 3.
missions:
  - title: The Failure
    objective: Create a trusted state vector and a prioritized anomaly list before commanding the crew.
    briefing: A crewed lunar spacecraft reports an explosion, falling electrical power, and contradictory telemetry. The player takes the flight-director console and must first determine what can still be measured reliably.
    stake: The bang was four minutes ago. Commander Hale reported it before any instrument did, which is the first thing that should worry you. Now three consoles hold numbers that disagree. One power bus reads zero. The guidance computer has restarted with nothing in it. And several cabin pressure readings dropped together inside the same second. Evelyn Carter is already saying that readings dropping together are one fault, not three. This shift you decide what is happening to the spacecraft, get one agreed picture of it, and set how this room will work for the next five days. Hale and the crew can hear every word.
    takeaway: Use units, vectors, graphs, measurement uncertainty, common-mode failure as an evidence chain rather than as isolated facts.
    stops:
      - group: INTEG
        task: Open what each reading depends on, keep what stands alone, and name what the rest share.
        title: The spacecraft, or the sensors?
        place: Mission Control
        scene: Nine minutes after the bang, three cabin pressure readings fall together. A mechanical gauge and a leak listener are also live. The flight director wants one answer before the crew opens any panels.
        assumes:
          - several instruments can run off one shared circuit
          - a reading that stands alone does not inherit that circuit's fault
        takeaway: Several readouts agreeing count as one, when they all hang off the same thing.
        format: TRACE
        question: Which pressure evidence survives, and what moved the rest?
        trace:
          decision: Decide whether the cabin pressure really changed or several readouts inherited one bad reference.
          hint: Open each channel to see what physical sources it depends on. Keep channels whose measurement path does not pass through the suspect shared source.
          channels:
            - id: digital_a
              label: Pressure channel A
              reading: drops sharply
              depends:
                - cabin
                - sensor_ref
            - id: digital_b
              label: Pressure channel B
              reading: drops sharply
              depends:
                - cabin
                - sensor_ref
            - id: digital_c
              label: Pressure channel C
              reading: drops sharply
              depends:
                - cabin
                - sensor_ref
            - id: mechanical
              label: Direct pressure gauge
              reading: steady
              depends:
                - cabin
                - mechanical_path
            - id: acoustic
              label: Leak monitor
              reading: no leak signature
              depends:
                - acoustic_path
          resources:
            - id: cabin
              label: Cabin gas pressure
            - id: sensor_ref
              label: Shared electrical reference
            - id: mechanical_path
              label: Mechanical gauge linkage
            - id: acoustic_path
              label: Acoustic leak monitor
          target: sensor_ref
          independent:
            - mechanical
            - acoustic
        answerText: Keep the mechanical gauge and the leak listener. The three digital channels share one circuit, and that circuit is what moved.
        why: Agreement is only strong evidence when the things agreeing could have failed separately. These three digital readings share one circuit. Shift that circuit and all three move together, whether or not the cabin does. The mechanical gauge works a different way altogether, and it has not moved. The leak listener hears nothing. So three frightening numbers turn into one electrical fault, and the evidence that still stands is kept rather than thrown out with them.
        headline: Mission Control receives a sudden cabin-pressure warning on several digital channels.
      - group: INTEG
        task: Put the four steps in the order they have to happen.
        title: Build the first picture
        place: Telemetry Analysis Room
        scene: Three consoles hold numbers that disagree. One power bus reads zero. The guidance computer has restarted with no memory of what it saw. Nothing has been written down yet.
        assumes:
          - a number without its units and its time is not a measurement
        takeaway: An answer built to survive being wrong has to be built in a particular order.
        format: SEQUENCE
        why: The recordings from across the failure get wiped within minutes, so they are saved before anything is worked out. Units and clocks come next. A tidy answer built from mixed clocks is confidently wrong. Then the estimates, each with a range rather than one number. A number with no range cannot be argued with. And the only commands worth sending are the ones that help whatever turns out to be true.
        rebuttals:
          - Save the recordings first. It is the only step with a deadline set by a machine rather than by people.
          - Units and clocks second. This is where one shared fault shows up, instead of being fitted into the answer.
          - Estimates third, each with a range. A single number cannot be argued with or tested.
          - Commands last, and only the ones that survive every answer the data still allows.
        cards:
          - Save the recordings from before and after the failure.
          - Check the units, the clocks, and what everything depends on.
          - Work out where it is, how it is moving and how it is doing, each with a range.
          - Send only the commands that help whatever the truth turns out to be.
        order: [0, 1, 2, 3]
      - group: INTEG
        task: Say what the flight director does first.
        title: Spend the first ten minutes
        place: Spacecraft Systems Console
        scene: Four controllers, a crew in a spacecraft that is venting something, and ten minutes to the next tracking pass. Every desk believes its own problem is the one that kills them.
        assumes:
          - two rooms acting on different versions of one number is worse than either acting alone
        takeaway: Attention is a resource in an emergency, and the first decision is where it goes.
        format: CHOICE
        question: Ten minutes to the next tracking pass. What does the flight director do first?
        answerText: Open one log and name one person to give commands. Everything after that counts once instead of three times.
        why: Attention runs out like fuel does. Four people are already working the same failure from four sets of numbers, and nothing says which set is the real one. One log and one voice giving commands stops the same work being done twice and contradicted once. Organising the room is not a delay before the technical work. It is what makes every later calculation count once instead of three times.
        choices:
          - Open one log, and name one person to give commands.
          - Rebuild the timeline of the power and the pressure.
          - Check the trajectory and the attitude independently.
          - Ask every desk for a full report at once.
        answer: Open one log, and name one person to give commands.
        rebuttals:
          - The power and pressure timeline is the first real piece of work, and the log is what holds it. Start it second and it survives the shift change.
          - Checking the trajectory decides whether they can get home. It is needed before the burn, not before the room is sorted out.
          - Six full reports arrive after the tracking pass, and eat the ten minutes that were meant to prepare for it.
  - title: Find the Spacecraft
    objective: Produce a consistent trajectory estimate and identify which new observation most reduces uncertainty.
    briefing: Tracking data are intermittent, and the onboard computer has restarted. The team must reconstruct position and velocity from range, bearing, and timed observations.
    stake: 9 hours after the bang, and the station carrying the whole solution sets in 40 minutes. The guidance lead, Camila Reyes, will not sign the trajectory until she has one measurement that did not come through the same computer. Today you rebuild where the spacecraft is and how fast it is going, and buy the next observation. Fitting the measurements together is the job, and only one station is still up. Her trajectory officer, Dale Whitaker, wants a number now so the room can start planning the correction. Reyes wants the right number. They are both right, and there are 40 minutes.
    takeaway: Use position, velocity, acceleration, coordinate systems, graphs of motion as an evidence chain rather than as isolated facts.
    stops:
      - group: NAV
        task: Match each thing you need to know to the measurement that gives it.
        title: Which measurement gives what
        place: Deep-Space Tracking Station
        scene: The onboard computer has restarted and the tracking comes and goes. The room has to rebuild where the spacecraft is from whatever can still be measured, and say what each measurement buys.
        assumes:
          - saying where something is and how it is moving takes more than one number
        takeaway: No single measurement gives a position. Each one gives a piece, and the pieces are different shapes.
        format: PROTOCOL
        why: "Each measurement answers a different question and none of them answers all of it. Photographing the spacecraft against known stars gives a direction and no distance. Timing a radio pulse out and back gives a distance and no direction. The pitch of the returning signal says how fast it is coming or going, and nothing about sideways motion. And rates come from repeating: two positions give a speed, two speeds give a change in speed."
        columns:
          - What we want to know
          - How we measure it
        rebuttals:
          - Direction is an angle, and the star camera is the only instrument here that measures one.
          - Motion toward us or away shows up in the pitch of what comes back, and nowhere else.
          - A distance is a speed multiplied by a time, which is what the round trip gives you.
          - Rates come from repeating. Two positions give a speed, and two speeds give a change.
        scenarios:
          - Which direction it lies in.
          - How fast it is coming toward us.
          - How far away it is.
          - Whether its speed is changing.
        choices:
          - Photograph it against stars whose places are already known.
          - Compare the pitch of the signal coming back with the one sent out.
          - Time a radio pulse out to it and back again.
          - Measure the same thing twice, and subtract.
        mapping: [0, 1, 2, 3]
      - group: NAV
        task: Put the four steps in order.
        title: Rebuild where it is
        place: Guidance Room
        scene: The computer restarted and lost its bearings. A distance, two angles and a pitch trace remain, recorded on different clocks. The next tracking pass will test whatever the room reconstructs.
        assumes:
          - measurements only combine when they are on the same map and the same clock
        takeaway: A useful answer predicts the next measurement, and says how sure it is.
        format: SEQUENCE
        why: Everything goes onto one map and one clock first, or a tidy answer comes out wrong in a way nobody can see. The distance, the angles and the pitch then get fitted together. Each pins down something different, and fitted apart they give three answers. What the fit misses is read for pattern rather than size. A pattern is a force nobody allowed for. Then it is carried forward to the burn.
        rebuttals:
          - One map and one clock first. Two clocks in one fit is the mistake that never shows up afterwards.
          - Fit all three together second. Fitted separately they give three answers and no way to choose.
          - Read the misses third, for pattern rather than size. A pattern is a force nobody modelled.
          - Carry it forward last. The burn happens later than the measurements, and the doubt grows on the way.
        cards:
          - Put every measurement on one map and one clock.
          - Fit a path that matches the distance, the angles and the pitch together.
          - Look at what the fit misses, and see whether the misses form a pattern.
          - Carry the answer, and its range, forward to the hour of the burn.
        order: [0, 1, 2, 3]
      - group: NAV
        task: Say why the spacecraft needs speed to stay in that path.
        title: What holds it in the curve
        place: Guidance Computer Room
        scene: The return path swings the spacecraft round the Moon at two and a half thousand kilometres up. Somebody on the loop has asked why it does not simply fall onto the surface.
        assumes:
          - something moving in a circle is being pulled toward the middle, even at a steady speed
        takeaway: An orbit is falling, with enough sideways speed that the ground keeps curving away.
        format: CHOICE
        question: Why does the spacecraft need any speed at all to stay in that path?
        answerText: It is falling the whole way round. Its sideways speed means the surface curves away as fast as it drops.
        why: "It is falling. It has been falling the whole way round. What stops it arriving is sideways speed: while gravity pulls it down, it moves along, and the Moon's surface curves away underneath at about the same rate. Too slow and the path meets the ground. Too fast and it swings out and away. Nothing is holding it up, which is exactly why the crew float. Falling and floating are the same thing here."
        choices:
          - Its sideways speed turns constant falling into a curve around the Moon.
          - An outward force balances gravity, so nothing is pulling it anywhere.
          - Its speed weakens the Moon's pull on it.
          - Its forward motion holds it up, the way a wing holds up a plane.
        answer: Its sideways speed turns constant falling into a curve around the Moon.
        rebuttals:
          - There is no outward force. The spacecraft is being pulled inward the whole time, which is what bends the path.
          - Speed does not weaken gravity. It changes the shape of the path that gravity produces.
          - There is no air out there to push against, and the engine is off for nearly all of it.
  - title: Turn Without Wasting Fuel
    objective: Develop a controlled reorientation procedure that stops the rotation at the required attitude.
    briefing: The main guidance platform is unavailable, and the crew must reorient the spacecraft using limited thrusters and visible reference objects.
    stake: 26 hours in. The guidance platform is off to save power, 1 thruster quad is dead, and Hale has to turn the spacecraft 90 degrees by hand while Sato reads angles aloud. Kwame Mensah, who owns the structural dynamics, has done the sums and does not like them. This shift you agree what the rotation numbers mean, write the procedure, and work out what a thruster actually does. Every degree of turn is paid for twice, once to start it and once to stop it. Let it tumble and the antenna, the array and the burn attitude go together.
    takeaway: Use torque, angular acceleration, moment of inertia, angular momentum, center of mass as an evidence chain rather than as isolated facts.
    stops:
      - group: STRUCT
        task: Match each change to what it does to the turning.
        title: How a spacecraft turns
        place: Attitude Dynamics Lab
        scene: The guidance computer is out and the crew is about to fly by hand. Before anybody touches a thruster, the room says plainly what each change does.
        assumes:
          - a push off to one side is what makes something start or stop turning
        takeaway: Turning follows the same rules as moving. It is just harder to see them.
        format: PROTOCOL
        why: Four rules cover every hand-flown turn. The same push further from the middle turns harder, which is the one the crew can actually choose. The same push on a heavier, more spread-out craft turns it more slowly, and stops it more slowly too. A push one way and an equal push back cancels out, which is what starting and stopping a turn actually is. And moving things about inside changes nothing overall, because nothing inside can push on the outside.
        columns:
          - What you change
          - What happens to the turning
        rebuttals:
          - The same push further out has more leverage, and it is the term the crew can actually choose.
          - The same push on something harder to turn gives less turning. Harder to start, and just as hard to stop.
          - Equal pushes for equal times cancel out. That is exactly what a start pulse and a stop pulse are.
          - Moving mass inside shifts the turning about between parts, and it cannot change the total.
        scenarios:
          - The same push, further from the middle.
          - The same push, on a craft that is harder to turn.
          - An equal push one way, then the other, for equal times.
          - Moving things about inside, with nothing pushing from outside.
        choices:
          - It turns harder.
          - It turns more slowly.
          - The turning cancels out, and it ends up as it started.
          - The total turning cannot change, however things move inside.
        mapping: [0, 1, 2, 3]
      - group: INTEG
        task: Choose the opening pulse and where to start braking, then run the turn.
        title: Turning it by hand
        place: Crew Procedures Room
        scene: The guidance computer is off. The crew has to turn the spacecraft ninety degrees using two thruster pairs and a mark on the window. Every extra correction spends fuel meant for the return.
        assumes:
          - a push changes how fast something turns
          - it keeps turning after the thruster stops
        takeaway: Stopping the push does not stop the motion, so the braking has to start early.
        format: FLY
        question: How hard do you start the turn, and where do you start braking so it arrives still?
        fly:
          hint: Pick a start-pulse duration, then set the angle where the opposite thruster begins firing. The run ends only when the vehicle has stopped rotating.
          target: 90
          accel: 2
          tolerance: 3
          rateTolerance: 1
          start: 0
          startRate: 0
          pulse:
            min: 4
            max: 8
            step: 2
            unit: s
          budget: 16
          brake:
            min: 35
            max: 90
            step: 1
        answerText: Brake before the target. A six-second pulse gets it turning at twelve degrees a second, which takes about thirty-six degrees to stop, so braking starts near fifty-four.
        why: A thruster pulse does not make a turn that stops itself. It changes how fast the spacecraft is turning, and when the pulse ends it keeps going at that rate. Stopping needs the opposite thruster, and that takes just as long as starting did. So the braking has to begin before the target, by about the angle the starting pulse used up. Brake at the target and it sails past. The turn only works if the angle and the turning both reach zero together.
      - group: NAV
        task: Work out the turning effect of the thruster.
        title: Turning effect from a thruster
        place: Guidance Console
        scene: A thruster pushes with two hundred newtons, three metres out from the middle of the spacecraft. The crew needs the turning effect before it can predict how fast the turn starts.
        assumes:
          - the same push further from the middle turns something harder
        takeaway: Where a push is applied matters as much as how hard it pushes.
        format: BALLPARK
        question: How much turning effect does the thruster give?
        answerText: Six hundred. Two hundred newtons pushing three metres out from the middle.
        why: Turning effect is the push multiplied by how far out it acts. Two hundred newtons, three metres from the middle, is six hundred. Move the same thruster in to half the distance and the turning effect halves, with the same fuel burnt. That is why the crew care which pair fires. They cannot make the thruster stronger, and they can choose one that acts further out, and it is exactly the same amount of fuel either way.
        estimate:
          relationship: Turning effect = the push × how far out it acts.
          prompt: The thruster pushes with 200 newtons, at right angles, three metres out from the middle of the spacecraft.
          question: How much turning effect does the thruster give?
          labels:
            - 3 m (how far out the thruster is)
            - 200 N (how hard it pushes)
            - 1.5 m (distance to the docking ring)
            - 30,000 kg (what the spacecraft weighs)
            - 0.5 (a half)
          values: [3, 200, 1.5, 30000, 0.5]
          slots: 2
          template: "{0} × {1}"
          formula: a*b
          correct: [0, 1]
          target: 600
          tolerance: 40
          units: N m
          solution: 200 × 3 is 600.
          explanation: The distance has to be measured to the middle of the spacecraft, not to whatever piece of structure is nearest. The mass of the craft decides how fast it then turns, and it is not part of this sum.
  - title: The Power Budget
    objective: Build a load-shedding plan that preserves essential functions through the next critical maneuver.
    briefing: Fuel cells and batteries are degraded. Every electrical load now competes with guidance, communications, thermal control, and life support.
    stake: Thirty-four hours in, and the argument changes shape. Priya Shah has the power reserve down to hours. She wants everything that is not vital switched off by the end of the shift. Aaron Brooks says the two things on his list are the scrubber fan and the cabin heaters. His crew are already sleeping in everything they own. And the bus is sagging at twenty-four volts instead of twenty-eight, while the current sits where it should. That is Shah's other problem. This shift you work out how long the batteries last, decide why the voltage is low, and choose what goes off.
    takeaway: Use current, voltage, resistance, electrical power, energy budget as an evidence chain rather than as isolated facts.
    stops:
      - group: ELEC
        task: Turn the store and the draw into hours.
        title: How long can the battery last?
        place: Electrical Systems Room
        scene: The fuel cells are gone, and the crew is on the entry batteries days earlier than any plan allowed. The flight surgeon wants a number of hours before the next decision about switching things off.
        assumes:
          - a store is an amount, and a draw is how fast it is being used
        takeaway: An amount divided by a rate is a time, and that time is what every other decision gets argued against.
        format: BALLPARK
        question: How long will the batteries last?
        answerText: About six hours, if the draw stays flat. It is a rough number, and everything today gets argued against it.
        why: There is a store and there is a draw, and dividing one by the other gives hours. Eighteen kilowatt hours at three kilowatts is six hours. It is an ideal figure. It assumes the draw stays flat and that every last bit of the store is usable, and neither is quite true. A cold battery gives less than its label. It is still the number every argument this shift is measured against, so it is worth having early and worth calling rough.
        estimate:
          relationship: Hours = what is in the store ÷ how fast it is being used.
          prompt: The entry batteries hold about 18 kilowatt hours that can actually be used. The things that must stay on draw about 3 kilowatts.
          question: How long will the batteries last?
          labels:
            - 18 kWh (what is usable in the batteries)
            - 3 kW (what must stay on)
            - 28 V (the bus voltage)
            - 3.5 kW (the peak draw, briefly)
            - 6 h (time to the next burn)
          values: [18, 3, 28, 3.5, 6]
          slots: 2
          template: "{0} ÷ {1}"
          formula: a/b
          correct: [0, 1]
          target: 6
          tolerance: 0.4
          units: h
          solution: 18 ÷ 3 is 6 hours.
          explanation: The bus voltage says how the energy is delivered, and nothing about how much there is. The time to the next burn is a deadline rather than an ingredient.
      - group: INTEG
        task: Say which fault fits the voltage, the current and the heat together.
        title: Why is the voltage sagging?
        place: Spacecraft Load Panel
        scene: The power bus is sagging at twenty-four volts instead of twenty-eight, while the total current sits where it was planned to be. Engineers want to start pulling equipment off.
        assumes:
          - current pushing through something that resists it drops the voltage and makes heat
        takeaway: Voltage, current and heat are three views of one fault, and one view is not enough.
        format: CHOICE
        question: Which fault fits the voltage, the current and the heat?
        answerText: A bad connection in the path. It eats voltage on the way through and turns it into heat, which is why the joint is warm.
        why: Three readings, one fault, and each says something different. Something extra drawing power would show up as more current than planned. The current is where it should be. A failed supply would show as less coming in, and what comes in is normal. What is left is something in the path resisting. It eats voltage going past and turns it into heat.
        rebuttals:
          - Something extra drawing power would show as more current than planned, and the current is where it should be.
          - A failed supply would show as less coming in. What is coming in is normal, so the fault is further along.
          - A bad voltmeter explains the reading and not the hot joint or the extra battery current. Two instruments agree.
        headline: The power bus sags under a load that is exactly what was planned.
        readings:
          - zone: Main bus voltage
            label: Main bus voltage
            value: 24 V instead of 28 V
            status: alarm
            note: Significant sag under load
          - zone: Battery current
            label: Battery current
            value: Higher than expected
            status: alarm
            note: Battery is supporting the bus
          - zone: Solar-array current
            label: Solar-array current
            value: Normal
            status: normal
            note: Primary generation has not collapsed
          - zone: Total load current
            label: Total load current
            value: Near planned value
            status: alarm
            note: No large unexpected load surge
          - zone: Connector temperature
            label: Connector temperature
            value: Hot spot at one junction
            status: alarm
            note: Local electrical heating
        choices:
          - label: A bad connection somewhere in the path.
            mechanism: A resisting joint drops the voltage past it, and turns what it drops into heat.
          - label: Something extra drawing power that nobody knows about.
            mechanism: An unexpected device pulls extra current and drags the bus down.
          - label: The supply itself has failed.
            mechanism: Less is coming in, so the battery has to make up the difference.
          - label: Only the voltmeter is wrong.
            mechanism: The bus is fine, and only one instrument is telling a story.
        answer: A bad connection somewhere in the path.
      - group: INTEG
        task: Share out the amp-hours, and keep every needed condition met.

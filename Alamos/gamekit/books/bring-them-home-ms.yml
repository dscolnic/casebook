              question: Maintain continuous high-bandwidth communications
        answerText: Buy life support for the whole return. Book the guidance windows. Keep enough heating to protect the batteries. What is left pays for short radio windows.
        why: This is not a list of what matters most. It is a sum. Every load costs its draw multiplied by the hours it runs, and the total cannot pass forty-one. Life support runs the whole way, so it is bought first. Guidance is needed in fixed windows, so those get booked. Heating can be switched on and off, and not removed, because a cold battery gives less back.
  - title: The Cabin Is Cooling
    objective: Create a thermal survival plan that protects crew, electronics, and batteries with minimal power.
    briefing: With most systems powered down, cabin temperature falls and condensation forms. The player must balance conduction, convection, radiation, metabolic heat, and battery performance.
    stake: "Two days after the bang, Brooks wins one, and it costs Shah her margin. The cabin is at four degrees and falling, condensation is running down the walls, and Ruiz has stopped being able to write legibly. Today you work out how fast the vehicle is losing heat, decide which way it is leaving, and choose what to insulate. There is power to fight it one way and not three. Average temperature is also the wrong number: batteries fail at their own local temperature, and the coldest spot in that cabin is the wall behind the pack the entry sequence depends on. Brooks is arguing for the crew, Shah for the batteries, and they want the same watts."
    takeaway: Use heat capacity, conduction, convection, radiation, energy balance as an evidence chain rather than as isolated facts.
    stops:
      - group: THERM
        task: Work out how far the temperature falls in three hours.
        title: How much does the cabin cool?
        place: Thermal Control Lab
        scene: With most things switched off, the cabin is losing about a kilowatt more heat than it makes. The flight surgeon wants to know how long the crew has before the cold becomes a medical problem.
        assumes:
          - it takes energy to warm something up, and the same energy leaves as it cools
        takeaway: Big things change temperature slowly, and that slowness is time to think.
        format: BALLPARK
        question: How far does the cabin cool over three hours?
        answerText: Under one degree. The cabin is heavy, so a kilowatt leaking for three hours barely moves it.
        why: The cabin and everything in it is heavy, and heavy things take a lot of energy to warm or cool by even one degree. A kilowatt leaking for three hours sounds alarming, and against this much stuff it is under a degree. That is the useful part. The cold is real and it is slow, so the crew has hours rather than minutes. The same fact is why warming it back up later costs so much.
        estimate:
          relationship: Degrees lost = energy lost ÷ energy for one degree. Energy lost = watts × seconds.
          prompt: The cabin is losing about 1,000 watts more than it makes, for three hours — which is 10,800 seconds. Warming this cabin by one degree takes about 12 million joules.
          question: How far does the cabin cool over three hours?
          labels:
            - 1,000 W (what it is losing)
            - 10,800 s (three hours)
            - 12 million joules for one degree
            - 3 h (the same three hours, in hours)
            - 4 °C (the cabin now)
          values: [1000, 10800, 12000000, 3, 4]
          slots: 3
          template: "{0} × {1} ÷ {2}"
          formula: a*b/c
          correct: [0, 1, 2]
          target: 0.9
          tolerance: 0.1
          units: K
          solution: 1,000 × 10,800 is 10.8 million joules. Divided by 12 million, that is about 0.9 of a degree.
          explanation: A watt is a joule every second, so the time has to be in seconds. Use hours instead and the answer is out by three thousand six hundred.
      - group: THERM
        task: Match each thing happening in the cabin to how the heat is moving.
        title: How the heat is getting out
        place: Cabin Environment Console
        scene: The cabin is cooling and the crew wants to do something about it. What they can do depends on how the heat is actually leaving, so the room names the route first.
        assumes:
          - heat moves by touching, by riding on moving air, or by beaming across a gap
        takeaway: Naming the route is what tells you which fix would work at all.
        format: PROTOCOL
        why: Heat leaves three ways, and each has a different fix. By touching, which needs contact and is short range. By riding on moving air, which is why circulation spreads warmth about. And by beaming straight across a gap, which needs nothing in between and works fine in vacuum. A metal strut running out to the cold structure is the worst kind, because it touches all the way and never stops. Insulation, circulation and shiny surfaces each work on a different one.
        columns:
          - What is happening in the cabin
          - How the heat is moving
        rebuttals:
          - People in contact pass heat by touching. It is short range and it needs contact.
          - Air carrying warmth about the cabin is heat riding on something moving, rather than passing through it.
          - A cold wall soaking up warmth from across the cabin is heat beaming across a gap. It needs nothing in between.
          - A metal strut to the outside conducts all the way out, and it never stops. That is the leak that runs all night.
        scenarios:
          - The crew huddle together.
          - Moving air carries warmth round the cabin.
          - A cold wall soaks up warmth from everything facing it.
          - A metal strut runs out to the structure outside.
        choices:
          - Heat moving by touching.
          - Heat riding on moving air.
          - Heat beaming across a gap.
          - Heat conducted straight out along metal.
        mapping: [0, 1, 2, 3]
      - group: INTEG
        task: Say what the last of the energy should be spent on.
        title: Keep the cabin survivable
        place: Materials and Insulation Shop
        scene: The cabin is at four degrees and falling. Water is beading on the walls and the crew is sleeping in their suits. Heating all of it is not affordable on what is left.
        assumes:
          - slowing a loss and replacing it are different things
        takeaway: Slowing a loss keeps paying. Replacing it has to be paid again every time.
        format: CHOICE
        question: Four degrees and falling, on a fixed amount of energy. What do you spend it on?
        answerText: Wrap the crew area and the batteries. Slowing the loss keeps paying after the energy is gone; reheating has to be paid for again every time.
        why: There are two ways to fight cold and they cost differently. Replacing heat means paying again the moment you stop. Slowing the loss keeps working after the spending stops, which is what matters when the energy is fixed. So it goes round the crew and round the batteries, where cold does the most damage. Cold batteries also give back less than warm ones, so a heat problem quietly becomes a power problem if nobody attends to it.
        choices:
          - Wrap the crew area and the batteries, to slow the loss.
          - Spend the rest on short bursts of heating the whole cabin.
          - Run the fans all the time, so everywhere is the same temperature.
          - Heat the electronics bay, and let the crew rely on their suits.
        answer: Wrap the crew area and the batteries, to slow the loss.
        rebuttals:
          - Reheating the whole cabin replaces what has gone and does nothing about the next hour. The same energy gets spent again.
          - Running the fans evens the temperature out and costs power the whole time, and it does not slow anything leaving.
          - Protecting the electronics keeps the hardware and lets the crew and the batteries go on cooling.
  - title: The Air Problem
    objective: Develop a safe temporary air-cleaning and circulation strategy using only validated physical principles and monitored limits.
    briefing: Carbon dioxide removal is failing, and pressure readings differ between compartments. The player must connect gas laws, partial pressure, fluid flow, and filter resistance.
    stake: 58 hours in. Carbon dioxide is climbing in a cabin built for two and holding three. The life support engineer, Petra Novak, has been on the loop with the crew for an hour, and the canisters that fit are aboard the module they cannot use. The scrubber fan still draws its rated current, which Brooks refuses to accept as good news. Today you find out why the air is not being cleaned, work out how fast three people fill a cabin, and build something out of what is aboard. Hale has started making small mistakes reading numbers back. That is the first symptom, and he cannot notice it himself.
    takeaway: Use ideal gases, partial pressure, flow resistance, pressure difference, filtration as an evidence chain rather than as isolated facts.
    stops:
      - group: INTEG
        task: Build the air path in order, then name the link that is holding it up.
        title: Follow the air
        place: Life-Support Laboratory
        scene: Carbon dioxide keeps climbing. The scrubber fan sounds normal and draws its usual current, and the airflow is low. There are pressure readings on both sides of the filter.
        assumes:
          - a motor running does not prove any air is moving
          - air has to pass through every part of a loop
        takeaway: A chain moves at the rate of its most restricted link, not the rate of its noisiest one.
        format: CHAIN
        question: Where does the air path become the problem?
        chain:
          hint: Put the air-transfer links in physical order. Then use the observed flow and pressure pattern to name the one required link that governs the entire loop.
          links:
            - id: intake
              label: Cabin intake
              transfers: cabin air into the loop
              evidence: intake open
            - id: fan
              label: Scrubber fan
              transfers: pressure rise to the moving air
              evidence: normal current and sound
            - id: filter
              label: Filter section
              transfers: air through the particulate barrier
              evidence: large pressure drop across this section
            - id: sorbent
              label: CO2 sorbent bed
              transfers: carbon dioxide from air into sorbent
              evidence: bed installed
            - id: return
              label: Return duct
              transfers: treated air back to the cabin
              evidence: duct open
          distractor: fan
          order:
            - intake
            - fan
            - filter
            - sorbent
            - return
          governing: filter
        answerText: The filter. The fan is fine, and almost nothing is getting past that filter, so nothing reaches the scrubber.
        why: The fan makes a push. How much air moves depends on everything downstream of it. Normal current only proves the fan has power. The pressure difference across the filter is large and the flow is small, which is what a blockage looks like. Every breath has to get through that filter before it reaches anything that cleans it. So the loop runs at whatever the filter allows.
        headline: Cabin carbon dioxide rises even though the scrubber fan still draws power.
      - group: THERM
        task: Work out how much carbon dioxide the crew makes in six hours.
        title: How much they breathe out
        place: Cabin Air Console
        scene: Three crew, each breathing out about twenty litres of carbon dioxide an hour. The workshop needs to know what a home-made scrubber has to keep up with over the next six hours.
        assumes:
          - a rate multiplied by a time gives a total
        takeaway: The rate something arrives at sets the smallest rate that can remove it.
        format: BALLPARK
        question: How much carbon dioxide do they make in six hours?
        answerText: About 360 litres. Sixty litres an hour between the three of them, for six hours.
        why: Three people at twenty litres an hour make sixty litres an hour between them. Six hours of that is three hundred and sixty. That number is the bar. Anything that removes carbon dioxide more slowly than the crew makes it does not hold the level steady. It only makes the rise slower. The workshop does not need this precise. It needs to know whether what they can build is big enough to matter at all.
        estimate:
          relationship: Total = what one person makes an hour × how many people × how many hours.
          prompt: Three crew each breathe out about twenty litres of carbon dioxide an hour, and the scrubber has to keep up for six hours.
          question: How much carbon dioxide do they make in six hours?
          labels:
            - 3 (people)
            - 20 L each hour, each person
            - 6 (hours)
            - 24 (hours in a day)
            - 1.0 kg each person each day
          values: [3, 20, 6, 24, 1]
          slots: 3
          template: "{0} × {1} × {2}"
          formula: a*b*c
          correct: [0, 1, 2]
          target: 360
          tolerance: 25
          units: L
          solution: 3 × 20 × 6 is 360 litres.
          explanation: A rate for one person needs a head count and a stretch of time, and both have to match the question. The daily figure describes the same crew and cannot be used here without more work.
      - group: INTEG
        task: Say what the improvised fix has to get right.
        title: Make the air breathable
        place: Crew Hardware Workshop
        scene: Carbon dioxide is close to the limit and still climbing. The spare canisters are square, the socket is round, and there is tape, a suit hose, a sock and a plastic cover.
        assumes:
          - air, like water, goes the easiest way it is offered
        takeaway: Nothing gets cleaned unless it goes through the thing that cleans it.
        format: CHOICE
        question: Tape, a hose, a sock and a plastic cover. What does the fix have to get right?
        answerText: A sealed path, so the air has nowhere to go but through. A gap round the canister undoes everything else.
        why: Two things have to be true, and only one of them is obvious. There has to be something that takes the carbon dioxide out, and every bit of air has to be made to go through it. Air is lazy. Leave a gap round the canister and most of it goes round instead of through, and comes back into the cabin exactly as it left. A big canister with a gap round it cleans less than a small one taped tight.
        choices:
          - A sealed path, so the air has to go through the canister.
          - As much of the canister exposed to the cabin as possible.
          - Readings taken in several places round the cabin.
          - A fan loud enough that the crew can hear it running.
        answer: A sealed path, so the air has to go through the canister.
        rebuttals:
          - Exposing more of it only helps the air that reaches it. A big canister with a gap round it cleans less than a small one taped tight.
          - Measuring in several places is how they find out whether it worked. That is necessary and it is not the fix.
          - A fan they can hear proves a motor is turning. It says nothing about how much air is moving, or where it goes.
  - title: Communication Fades
    objective: Restore a reliable low-bandwidth link and use the signal itself as a navigation measurement.
    briefing: The spacecraft signal weakens and shifts in frequency as geometry changes. The team must separate transmitter failure from antenna pointing, range loss, and Doppler effects.
    stake: 66 hours in, the link went weak at the moment the vehicle turned — down 12 decibels, and Hale is answering calls he can barely hear. The communications lead, Naomi Ito, has the link budget open and her network officer is arguing for a different term in it. Ito wants the pointing checked first and he wants the receiver. This shift you find the cause and get the link back. Losing this costs two things at once, because the signal is also a navigation measurement — the room goes deaf and half blind in the same minute, with a burn still to fly.
    takeaway: Use waves, frequency, wavelength, inverse-square behavior, Doppler effect as an evidence chain rather than as isolated facts.
    stops:
      - group: COMMS
        task: Change one thing at a time, and put it back, until the fade follows something.
        title: Why did the signal fade?
        place: Deep-Space Antenna
        scene: Voice and data have gone weak at two ground stations at once. The spacecraft's transmitter is putting out what it should. Three things can be swapped without risking anything.
        assumes:
          - a fair test changes one thing and leaves the rest alone
        takeaway: A cause is proved when the effect follows the change both ways.
        format: CONTROL
        question: Which change makes the fade appear and disappear?
        control:
          hint: Run one reversible test at a time. A cause has to produce a response larger than the noise and reproduce that response when the change is reversed.
          baseline: -12
          noise: 0.2
          variables:
            - id: receiver_path
              label: Ground receiver path
            - id: tx_chain
              label: Spacecraft transmitter chain
            - id: pointing
              label: Antenna pointing correction
          reversalRequired: true
          acceptResponseDb: 0.6
          observable:
            label: received power db relative
          response: 11
          truth: pointing
        answerText: Where the antenna is pointing. Correcting it brings the signal back, and putting the error back makes it fade again. Neither swap changes anything.
        why: Several things can weaken a radio link, and only one test settles which. Swap to a different ground receiver and nothing changes, so it is not one receiver. Swap the transmitter chain and nothing changes, so it is not the transmitter. Correct where the antenna is pointing and almost all the missing signal comes back. Point it wrong again and the fade returns. Following the change in both directions is what makes it a cause rather than a coincidence.
        headline: Voice and telemetry suddenly become weak.
      - group: COMMS
        task: Work out how long one wave of the radio signal is.
        title: How long is one wave
        place: Communications Analysis Room
        scene: The link is fading, and the antenna team needs the length of one wave for its pointing model. The spacecraft transmits two billion waves a second.
        assumes:
          - radio travels at a fixed speed, three hundred million metres every second
        takeaway: How long a wave is decides how fussy the aiming has to be.
        format: BALLPARK
        question: How long is one wave?
        answerText: About fifteen centimetres. That short a wave makes a narrow beam, which is why the aiming has to be so exact.
        why: Radio covers three hundred million metres in a second. In that same second, two billion waves go past. So one wave is that distance shared between them, which is about fifteen centimetres. The number matters because the dish sends its signal in a beam. Short waves make a narrow beam. A narrow beam reaches further, and it has to be aimed far more carefully.
        estimate:
          relationship: Length of one wave = how far it travels in a second ÷ how many waves fit in that second.
          prompt: Radio travels 300 million metres each second, and this signal fits 2 billion waves into that second.
          question: How long is one wave?
          labels:
            - 3.0e8 m/s (speed of light)
            - 2.0e9 Hz (carrier frequency)
            - 2.0e6 Hz (the carrier, misread as megahertz)
            - 343 m/s (speed of sound)
            - 12 dB (the observed loss)
          values: [300000000, 2000000000, 2000000, 343, 12]
          slots: 2
          template: "{0} ÷ {1}"
          formula: a/b
          correct: [0, 1]
          target: 0.15
          tolerance: 0.015
          units: m
          solution: 300,000,000 ÷ 2,000,000,000 is 0.15 metres.
          explanation: Read the big numbers carefully. Millions instead of billions makes each wave a hundred and fifty metres long, which would need an aerial nobody could fly.
      - group: STRUCT
        task: Put the four moves in order.
        title: Get the link back
        place: Spacecraft Attitude Console
        scene: The signal is weak and drifting. The crew is answering calls it can barely hear. The next navigation update depends on getting the link back.
        assumes:
          - a slower message needs less signal to be read
        takeaway: Do the biggest and cheapest thing first, and let each move buy the next.
        format: SEQUENCE
        why: Pointing is the biggest thing on the list and the cheapest to fix, so it goes first. Slowing the message down comes next. Less is being sent, so less signal is needed to read it, and nothing aboard has to change. Then the big ground dishes get told where to listen, because the signal has drifted. What comes back feeds the navigation the burn needs.
        rebuttals:
          - Pointing first. It is the biggest term in the sum, and the cheapest one to fix.
          - Slowing the message down second. A slower message needs less signal, and it costs nothing aboard.
          - The big dishes third, told where to listen, because the signal has drifted in frequency.
          - Navigation last. Getting the link back also produces the measurements the burn needs.
        cards:
          - Check where the spacecraft is pointing.
          - Slow the message down, and listen over a narrower range.
          - Point the big ground dishes, and tell them where to listen.
          - Feed the tracking that comes back into the navigation.
        order: [0, 1, 2, 3]
  - title: The Structure Is Vibrating
    objective: Move the system away from resonance and verify that the mitigation works across operating conditions.
    briefing: A pump and flexible panel produce a growing oscillation near one operating speed. The player must identify resonance and protect the structure without disabling life support.
    stake: 90 hours in, and a structural dynamics engineer, Chidi Okoye, caught this 1 — worth saying, because nothing else this week has been caught early. A panel starts shaking whenever a pump runs near one particular speed, and a line behind it has been rubbing for an hour. Mensah has the numbers ready. This shift you decide what is driving it, work out the structure's own natural rhythm, and stop it. The shaking dies away as soon as the pump moves off that speed, which is the part Okoye thinks matters. This is a shift where something is simply fixed.
    takeaway: Use simple harmonic motion, natural frequency, resonance, damping, forced oscillation as an evidence chain rather than as isolated facts.
    stops:
      - group: INTEG
        task: Say which explanation fits how the shaking depends on speed.
        title: What is shaking it?
        place: Structural Dynamics Lab
        scene: A bad vibration only appears when the wheel runs near one speed. Above and below that it dies away. Two sensors on different parts of the structure see the same narrow band.
        assumes:
          - everything has speeds at which it prefers to shake
        takeaway: What matters is not how hard it shakes, but what is shaking it, and how fast.
        format: CHOICE
        question: Which explanation fits the readings?
        answerText: The wheel is pushing in time with the structure's own rhythm. That is why it only happens in a narrow band of speed.
        why: Everything has a rhythm it likes to shake at, the way a swing does. Push a swing at any old moment and little happens. Push it in time with itself and it goes higher every push. Here the wheel is the push, and one speed lands in time with the structure's own rhythm. Move off that speed either way and the pushes fall out of step. That is why the vibration has a narrow band rather than growing with speed.
        rebuttals:
          - A loose sensor rattles on its own mount. A second sensor somewhere else sees exactly the same thing.
          - A single knock does not care what speed the wheel is running at, and nothing recorded an impact.
          - Breaking up shakes at every speed. This is narrow, repeatable, and it stops when the speed changes.
        headline: A bad vibration appears only in a narrow band of wheel speed.
        readings:
          - zone: Vibration amplitude
            label: Vibration amplitude
            value: Sharp peak near 3200 rpm
            status: alarm
            note: Falls again above and below that speed
          - zone: Measured vibration frequency
            label: Measured vibration frequency
            value: Matches known structural mode
            status: alarm
            note: Frequency alignment is repeatable
          - zone: Wheel-speed change
            label: Wheel-speed change
            value: Moving away from 3200 rpm reduces vibration
            status: alarm
            note: Immediate reversible response
          - zone: Second accelerometer
            label: Second accelerometer
            value: Sees the same mode
            status: alarm
            note: Not confined to one sensor mount
          - zone: Impact monitor
            label: Impact monitor
            value: No impulse recorded
            status: normal
            note: No evidence of a discrete strike
        choices:
          - label: The wheel is pushing in time with the structure's own rhythm.
            mechanism: A repeated push lands in time with the structure's rhythm, and the shaking builds.
          - label: One sensor has come loose and is rattling.
            mechanism: One sensor rattles on its own mount while the structure is quiet.
          - label: Something hit it once, and this is the after-effect.
            mechanism: A single knock rings the structure, whatever the wheel is doing.
          - label: The structure is breaking up.
            mechanism: Damage shakes everything, at all speeds and all frequencies.
        answer: The wheel is pushing in time with the structure's own rhythm.
      - group: STRUCT
        task: Work out the highest speed that is safely below the bad band.
        title: How far to stay clear
        place: Spacecraft Vibration Console
        scene: The bad band runs from three thousand one hundred to three thousand three hundred turns a minute. The rule is to stay two hundred clear of it, and the pump still has to run.
        assumes:
          - a shaking problem has a band of speeds, with room either side
        takeaway: Avoiding a resonance is arithmetic on the band, not a matter of running gently.
        format: BALLPARK
        question: What is the highest speed that is safely below the band?
        answerText: Two thousand nine hundred turns a minute. The band starts at 3,100, and the rule is 200 clear of it.
        why: A resonance is a band rather than a point, and a margin either side of it is what stops the pump wandering back in. The band starts at three thousand one hundred. Two hundred clear of that is two thousand nine hundred, and that is the fastest the pump can safely run below it. Running slower is fine. Running anywhere between three thousand one hundred and three thousand three hundred is not, and neither is sitting just outside and drifting.
        estimate:
          relationship: Highest safe speed = the bottom of the band − the clearance.
          prompt: The bad band runs from 3,100 to 3,300 turns a minute. The rule is to stay 200 clear of it.
          question: What is the highest speed that is safely below the band?
          labels:
            - 3,100 (bottom of the bad band)
            - 200 (clearance needed)
            - 3,300 (top of the band)
            - 3,200 (the worst point)
          values: [3100, 200, 3300, 3200]
          slots: 2
          template: "{0} − {1}"
          formula: a-b
          correct: [0, 1]
          target: 2900
          tolerance: 50
          units: rpm
          solution: 3,100 − 200 is 2,900 turns a minute.
          explanation: Work off the bottom of the band, not the worst point in the middle of it. Using 3,200 puts the pump inside the band it is meant to avoid.
      - group: INTEG
        task: Say what the safest immediate move is.
        title: Stop the shaking
        place: Operations Planning Room
        scene: A panel shakes whenever the pump runs near one speed, and it has grown worse over three cycles. The pump is needed, and its speed can still be changed from the panel.
        assumes:
          - shaking like this needs a structure and something pushing it in time
        takeaway: Change what is pushing, when you cannot change what is being pushed.
        format: CHOICE
        question: What is the safest immediate move?
        answerText: Move the pump speed off the band. It stops the pushes landing in time, and it can be undone at once.
        why: "This kind of shaking needs two things: a structure with a rhythm, and something pushing in time with it. In flight, changing what is pushing is far easier than changing the structure. Moving the pump speed off the band stops the pushes landing in time, and it can be undone in a second. Deadening the panel is the proper permanent fix, and it needs hardware and somebody's hands on it. Running faster through the band assumes it survives the crossing."
        choices:
          - Move the pump's speed away from the band.
          - Deaden the panel, so the shaking dies away.
          - Measure it in a few more places first.
          - Run the pump harder, to get through the band quickly.
        answer: Move the pump's speed away from the band.
        rebuttals:
          - Deadening it bleeds the energy away and is the right permanent fix. It needs hardware, access and somebody's hands on the structure.
          - Measuring in more places is how you check the fix worked. It is the check rather than the fix.
          - Getting through quickly assumes the structure survives the crossing, which is exactly what three growing cycles have called into question.
  - title: The Last Correction
    objective: Decide whether to burn using the expected benefit relative to navigation and propulsion uncertainty.
    briefing: Hours before entry, tracking stations disagree slightly. The player must combine measurements with correlated errors and decide whether another burn reduces or increases total risk.
    stake: 106 hours in, and it is Carter's turn — she has been waiting 4 days for it. Several ground stations have suddenly put the spacecraft ahead of its predicted path. They agree closely, and they are fed from the same timing reference. Whitaker wants the burn now, on the same argument that was correct on the third shift. This shift you decide whether the trajectory really moved. Carter's rule is that a correction is worth making only when it is bigger than the error in knowing it, and she will say so in front of the room.
    takeaway: Use random and systematic error, weighted averages, errors that move together, propagation, decision thresholds as an evidence chain rather than as isolated facts.
    stops:
      - group: NAV
        task: Say which explanation fits all four checks.
        title: Really off course, or one bad clock?
        place: Global Tracking Network
        scene: Several ground measurements suddenly put the spacecraft ahead of where it should be. They agree with each other. A star camera and the clock records are both available.
        assumes:
          - several instruments can be wrong together if they share a part
        takeaway: When measurements agree, ask whether they agree separately or share a part.
        format: CHOICE
        question: Which explanation fits all four checks?
        answerText: One shared clock. The measurements that moved all use it, and the star camera, which does not, still agrees with the prediction.
        why: Agreement counts only when the things agreeing could have failed apart. These measurements all use the same ground clock, so one clock error moves them together. The star camera does not use that clock, and it still matches the prediction. Nothing pushed the spacecraft, and the onboard readings show no push either. Redo the sums with the corrected clock and nearly all the error disappears. Several agreeing numbers turned out to be one fault.
        rebuttals:
          - Moving off course needs a push, and the onboard readings show no push at all.
          - Separate failures do not drift the same way at the same moment. These share a clock.
          - A failed star camera would put its answer in the wrong place. It is the one that agrees with the prediction.
        headline: Several ground measurements suddenly put the spacecraft ahead of where it should be.
        readings:
          - zone: Range/Doppler residuals
            label: Range/Doppler residuals
            value: Shift together
            status: alarm
            note: Both channels use the same ground time reference
          - zone: Star-angle navigation
            label: Star-angle navigation
            value: Matches predicted direction
            status: normal
            note: Independent angular geometry is stable
          - zone: Ground timing reference
            label: Ground timing reference
            value: Offset detected
            status: alarm
            note: Shared clock is late relative to an independent standard
          - zone: Reprocessed data
            label: Reprocessed data
            value: Residual largely disappears with corrected time
            status: alarm
            note: Same raw observations, new timestamps
          - zone: Onboard dynamics
            label: Onboard dynamics
            value: No unmodeled acceleration
            status: normal
            note: No physical force explains a sudden trajectory jump
        choices:
          - label: The spacecraft really is off course.
            mechanism: It has actually moved away from the predicted path.
          - label: One shared clock is wrong, and it moved everything that uses it.
            mechanism: One shared timestamp shifts everything worked out from it, together.
          - label: Several instruments failed separately, at the same time.
            mechanism: Unrelated instruments happen to drift the same way at the same moment.
          - label: The star camera has failed.
            mechanism: The star camera alone is producing a wrong answer.
        answer: One shared clock is wrong, and it moved everything that uses it.
      - group: NAV
        task: Work out how much clear space is left either side.
        title: How much room is left
        place: Navigation Covariance Room
        scene: The entry corridor is forty kilometres wide. The circle of doubt around the spacecraft's position is ten kilometres across. Sandoval needs a margin before the burn is called.
        assumes:
          - a position is the middle of a circle of doubt, not a fact
        takeaway: A route is planned against the doubt, not against the line drawn through the middle of it.
        format: BALLPARK
        question: How much clear space is left on each side, if it flies down the middle?
        answerText: Fifteen kilometres each side. Twenty from the middle of the corridor, less five for how far off the spacecraft might be.
        why: The corridor is forty kilometres wide, so aiming down the middle puts twenty either side. The spacecraft could be five kilometres off in any direction, so five of those twenty are already spent before anybody makes a mistake. Fifteen is what is left. That is the number the burn is judged against, and it is why the doubt has to be drawn at the same scale as the corridor rather than mentioned in a footnote.
        estimate:
          relationship: Margin = half the corridor − half the doubt.
          prompt: The corridor is 40 kilometres wide. The circle of doubt around the position is 10 kilometres across.
          question: How much clear space is left on each side, if it flies down the middle?
          labels:
            - 40 km (width of the corridor)
            - 10 km (width of the doubt)
            - 2 (halves)
            - 6 km (one of the two errors)
          values: [40, 10, 2, 6]
          slots: 2
          template: "{0} ÷ 2 − {1} ÷ 2"
          formula: a/2-b/2
          correct: [0, 1]
          target: 15
          tolerance: 2
          units: km
          solution: 40 ÷ 2 is 20. 10 ÷ 2 is 5. Twenty take away five is 15 kilometres.
          explanation: Both get halved, because both are widths and the spacecraft is aiming down the middle of them. Take the whole doubt off one side and the answer is too gloomy by five kilometres.
      - group: INTEG
        task: Spend the last of the tracking on what could change the decision.
        title: Burn, or look again?
        place: Flight Director Console
        scene: Two tracking answers disagree, and both lean on the same station clock. A correction burn is ready to go. There is time for one more piece of evidence before the decision closes.
        assumes:
          - two measurements that share a clock are not two pieces of evidence
          - a rougher measurement can be worth more than a precise one
        takeaway: The measurement worth buying is the one that could fail differently.
        format: VALUE
        question: Which evidence is worth buying before committing the burn?
        value:
          decision: Decide whether to execute the correction burn or hold it for more evidence.
          hint: Each option costs tracking budget. Open an option to see what it would reveal and which evidence axis it uses before you spend.
          budget:
            amount: 2
          options:
            - id: reprocess
              label: Reprocess the same range data
              cost: 1
              axis: shared timing
              decisive: false
              reveals: whether numerical reduction noise changed the timing-based solution
            - id: second_range
              label: Take another clock-linked range pass
              cost: 1
              axis: shared timing
              decisive: false
              reveals: whether a new range point repeats the same clock-dependent offset
            - id: optical
              label: Take an optical star-angle fix
              cost: 2
              axis: independent geometry
              decisive: true
              reveals: whether the spacecraft direction is displaced without using the suspect ground clock
            - id: propagate
              label: Run a denser trajectory propagation
              cost: 1
              axis: model prediction
              decisive: false
              reveals: how the current state estimate evolves if its inputs are accepted
        answerText: Buy the star-camera sighting. It is the only one that could disagree with the clock, which is what the argument is about.
        why: More precision on the same clock cannot settle a question about that clock. Redoing the sums makes the numbers tidier and leaves the clock exactly where it was. Another pass tied to the same clock has the same weakness. A star-camera sighting uses different physics and a different reference altogether, so it can say whether the spacecraft has actually moved. When there is time for one thing, being different matters more than being precise.
  - title: Reentry
    objective: Conduct a claim-by-claim readiness review and execute entry with predefined triggers and authority.
    briefing: "The final minutes require every physical model and procedure to agree: attitude, center of mass, velocity, atmosphere, thermal shield, communications, and recovery."
    stake: "A hundred and 18 hours in. The sequence starts in 11 minutes, 4 of them with no communications, and nothing in it can be undone. This shift you take the claims one at a time and decide whether this vehicle is ready. They are not equally strong: a heat shield cold for four days, a battery charged through a path Ana Ferreira, the load officer, invented on the sixth shift, an alignment Ruiz flew by hand against stars, a corridor entered on Carter's independent measurement. Every one of them has to hold at the same moment. After the first event there are no decisions left, only things to watch. Hale, Ruiz and Sato have heard every word of this for five days, and today they say very little."
    takeaway: Use integrated mechanics, thermodynamics, waves, fluids, uncertainty, ethics of command as an evidence chain rather than as isolated facts.
    stops:
      - group: INTEG
        task: Spend the two checks on the claims where being wrong costs most.
        title: What still needs checking
        place: Integrated Flight Room
        scene: Eleven minutes to entry. Four signed statements sit on the flight director's console. Some have real measurements behind them and one does not. Two checks can still be done.
        assumes:
          - a signature records who is responsible, not whether it is true
          - time to check should go where being wrong costs most
        takeaway: A signature says somebody believes it. The evidence behind it is a separate question.
        format: ATTEST
        question: Which claims deserve the last checks before the radio goes quiet?
        attest:
          hint: Open each signed claim to see what evidence already backs it. You can perform only two final checks before the clock expires.
          checks: 2
          claims:
            - id: entry_state
              label: Entry state lies inside the robust corridor
              signedBy: Navigation
              critical: true
              backed: true
              evidence: independent range, Doppler, and optical solution
            - id: shield_config
              label: Thermal-shield configuration matches the approved state
              signedBy: Configuration
              critical: true
              backed: false
              evidence: undocumented change after the last signed configuration record
            - id: blackout_guidance
              label: Onboard guidance is ready for the blackout
              signedBy: Guidance
              critical: false
              backed: true
              evidence: completed autonomous guidance self-test
            - id: station_bias
              label: Known station bias has been removed
              signedBy: Tracking
              critical: false
              backed: true
              evidence: reprocessed residual check under the validated correction rule
          priority:
            - shield_config
            - entry_state
        answerText: Check the heat shield first, then that the path is still inside the corridor. The other two already have measurements behind them.
        why: "Paper readiness and real readiness are different things. Three of these have direct measurements behind them: tracking, a known correction, a checked setting. The heat shield changed and the record of the change is incomplete, and it is also the one where being wrong ends the flight. So one check goes there. The second confirms the entry path is still inside the corridor, because that is the other thing nobody can fix once the radio stops."
      - group: INTEG
        task: Put the entry steps in order around the four minutes of silence.
        title: The order the silence forces
        place: Crew Capsule
        scene: Everything now depends on eleven minutes, and four of them have no radio at all. Anything that needs the ground has to happen before the silence starts.
        assumes:
          - nothing can be fixed from the ground while the radio is quiet
        takeaway: When part of a plan cannot be changed, everything that might need changing goes before it.
        format: SEQUENCE
        why: Four minutes of silence sets the whole order. Anything that needs a decision from the ground has to be settled first, because during the silence there is nobody to ask. Who is flying gets agreed before the silence, not during it. Watching the slowing and the heating can only start once entry has begun, so it comes after. And the recording runs throughout, because this flight is the only test the predictions will ever get.
        rebuttals:
          - Attitude and settings first, before entry. Nothing here can be changed through four minutes of silence.
          - Agree who is flying before committing. That is not something to work out while nobody can talk.
          - Watching the slowing comes third. It cannot start before entry, because there is nothing to compare yet.
          - Descent last, with the record kept. This is the only flight that will ever produce this data.
        cards:
          - Set the approved attitude and settings, because none of it can be changed during the silence.
          - Agree who is flying, before the radio goes quiet rather than during it.
          - Watch the slowing and the heating against what was predicted.
          - Come down, and keep the record of what actually happened.
        order: [0, 1, 2, 3]
      - group: NAV
        task: Say which proposal removes the cause rather than improving the response.
        title: What the review should fix
        place: Entry Tracking Network
        scene: The crew is aboard the recovery ship and the review board meets Monday. Four proposals compete for three funded places.
        assumes:
          - a fix that removes a cause outlasts a fix that improves the response
        takeaway: Fixing what caused it outlasts getting better at coping with it.
        format: CHOICE
        question: Which proposal deserves first place, because it removes the cause?
        answerText: Remove the shared parts. Everything else on the list helps people cope with the same failure rather than preventing it.
        why: The same weakness appeared twice on this flight. Three pressure readings shared one circuit, and later several tracking numbers shared one clock. Both times, agreement looked far stronger than it was, and both times somebody nearly acted on it. Removing those shared parts is the only proposal that stops it happening again. Keeping better records and rehearsing more both help people cope with it, which is a different and smaller thing.
        choices:
          - Redesign the shared circuits and shared clocks, so agreement means something.
          - Keep the full records of telemetry, settings and decisions.
          - Improve the simulator, and rehearse failures more.
          - Put more people on the anomaly desk for future flights.
        answer: Redesign the shared circuits and shared clocks, so agreement means something.
        rebuttals:
          - Keeping the records is how anybody reconstructs it afterwards, and it leaves the shared parts exactly where they are.
          - Rehearsing improves how people handle the same failure. It does not stop the shared clock failing again.
          - More people can diagnose it faster, and the shared part is still there to fail.
# What each place says when the player reads it.
copy:
  NAV: <p>Guidance. Where the spacecraft is, how fast, and how much of that is actually known.</p>
  ELEC: <p>Electrical systems. Every watt aboard is drawn from an inventory that is not being refilled.</p>
  THERM: <p>Thermal and life support. Heat, gas and water — the three things a cabin runs out of.</p>
  COMMS: <p>Communications. Everything known about the vehicle arrives through this room.</p>
  STRUCT: <p>Structures and dynamics. Rotation, vibration and the loads a spacecraft was built to take.</p>
  INTEG: <p>Mission operations. Six rooms report here and one person decides.</p>
  SIGNIN: <p>Badge and sign-in. Nobody reaches the operations floor without appearing on this sheet.</p>
  GALLERY: <p>The viewing gallery. Off-shift controllers wait out a burn here rather than at home.</p>
  QUIET: <p>The crew family room. Kept staffed, and kept away from the loop.</p>
  LIBRARY: <p>The trajectory library. Every plot, every burn, every version that was superseded.</p>

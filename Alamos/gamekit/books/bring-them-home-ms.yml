        title: Why is the voltage sagging?
        place: Spacecraft Load Panel
        scene: A main power line is sagging at twenty-four volts instead of twenty-eight, while the current drawn from it sits where it was planned to be. Engineers want to start pulling equipment off.
        guide: >-
          Four options, and three facts have to fit together. The supply is fine. The
          current is where it was planned. Something is hot. Ask of each option how many
          of those it covers. A hidden extra load would show in the current. A wrong
          meter would not warm anything up. Equipment is about to be pulled off on this
          answer.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - current pushing through something that resists it drops the voltage and makes heat
        takeaway: Voltage, current and heat are three views of one fault, and one view is not enough.
        format: CHOICE
        question: Which fault fits the voltage, the current and the heat?
        answerText: A bad connection in the path. It eats voltage on the way through and turns it into heat, which is why the joint is warm.
        why: Three readings, one fault, and each says something different. Something extra drawing power would show up as more current than planned. The current is where it should be. A failed supply would show as less coming in, and what comes in is normal. What is left is something in the path resisting. It eats voltage going past and turns it into heat.
        rebuttals:
          - Something extra drawing power would show as more current than planned, and the current is where it should be.
          - A failed supply would show as less coming in. What is coming in is normal, so the fault is further along.
          - A bad voltmeter explains the reading and not the hot joint or the extra battery current. Two instruments agree.
        headline: A main power line sags under a load that is exactly what was planned.
        readings:
          - zone: Main bus voltage
            label: Main bus voltage
            value: 24 V instead of 28 V
            status: alarm
            note: Significant sag under load
          - zone: Battery current
            label: Battery current
            value: Higher than expected
            status: alarm
            note: Battery is supporting the bus
          - zone: Solar-array current
            label: Solar-array current
            value: Normal
            status: normal
            note: Primary generation has not collapsed
          - zone: Total load current
            label: Total load current
            value: Near planned value
            status: alarm
            note: No large unexpected load surge
          - zone: Connector temperature
            label: Connector temperature
            value: Hot spot at one junction
            status: alarm
            note: Local electrical heating
        choices:
          - label: A bad connection somewhere in the path.
            mechanism: A resisting joint drops the voltage past it, and turns what it drops into heat.
          - label: Something extra drawing power that nobody knows about.
            mechanism: An unexpected device pulls extra current and drags the bus down.
          - label: The supply itself has failed.
            mechanism: Less is coming in, so the battery has to make up the difference.
          - label: Only the voltmeter is wrong.
            mechanism: The bus is fine, and only one instrument is telling a story.
        answer: A bad connection somewhere in the path.
      - group: INTEG
        task: Share out the amp-hours, and keep every needed condition met.
        title: Switch things off without losing the mission
        place: Mission Planning Desk
        scene: Forty-one amp-hours left, and sixty-two hours to fly. An amp-hour is one hour of giving one amp, so forty-one of them is not much. Guidance, radio, heating and life support all want power. Something has to be turned down within minutes.
        guide: >-
          Forty-one amp-hours, sixty-two hours to fly, and everything switched on uses
          more than that. Watch the list of questions rather than the loads: it shows
          what the spacecraft can still do with your plan. Every hour you give one thing
          is an hour taken from another, and something has to come down within minutes.
        background:
          - >-
              How little there is. At the current draw the whole reserve lasts under ten
              hours, and there are sixty-two to fly. So this is not a matter of trimming a
              bit. The draw has to come down by several times over and stay down.
          - >-
              Why the loads are not equal. The radio and the guidance computer can be
              switched on for a while and off again. Heating changes slowly, so it can be
              cycled. Life support cannot be interrupted at all. That is what makes a plan
              possible.
          - >-
              Why the first cut cannot wait. Power is being used at the current rate while
              you decide, so a slow decision has already spent some of what it was deciding
              about. Cutting something early buys the time to plan the rest properly.
        assumes:
          - an amp-hour is a current drawn for an hour
          - some things can be switched on and off, and some cannot
        takeaway: A power budget is not a ranking of what matters. It is hours multiplied by draw, and the total is fixed.
        format: ALLOCATE
        question: How many hours of each can the spacecraft afford?
        allocate:
          hint: Set runtime for each load. The amp-hour total updates as current times hours, and the mission-condition panel shows what your allocation can still accomplish.
          pool:
            amount: 41
            unit: Ah
          items:
            - id: life
              label: Life support and circulation
              rate: 0.4
              unit: A
              cost: 24.8
              hours: 62
            - id: thermal
              label: Thermal survival loads
              rate: 1.1
              unit: A
              cost: 6.6
              hours: 62
            - id: guidance
              label: Guidance and navigation windows
              rate: 1.8
              unit: A
              cost: 7.2
              hours: 62
            - id: comms
              label: High-bandwidth communications
              rate: 0.9
              unit: A
              cost: 55.8
              hours: 62
          answers:
            - required: true
              requires:
                - life
                - thermal
              question: Keep crew and critical batteries within survival limits
            - required: true
              requires:
                - guidance
              question: Power the planned navigation and burn windows
            - required: false
              requires:
                - comms

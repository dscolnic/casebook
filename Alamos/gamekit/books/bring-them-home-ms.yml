      - group: INTEG
        task: Sort the flags before the handover.
        title: The spacecraft, or the sensor
        concept: "What a measurement can honestly say, and what it cannot"
        place: Telemetry Room
        scene: The console has flagged more numbers than the team can look at before handover. Some of them are the spacecraft doing something. The rest are the sensor going wrong, and both are just numbers on a list.
        guide: >-
          Two bins. Ask whether anything else on board agrees. A real change shows up in more
          than one place and happens at a speed that is possible. A broken sensor jumps
          instantly, goes off the end of its scale, or sits still while everything else moves.
        background:
          - >-
              Why this comes first. The answer to the spacecraft misbehaving is to do something. The
              answer to a sensor misbehaving is to stop trusting the number. Getting it the wrong way
              round spends fuel on a problem that is not there.
          - >-
              What a broken sensor looks like. A jump nothing could really do. A reading past the end
              of the scale. A number that has not moved in an hour while everything near it has.
        assumes:
          - a number comes from a sensor, and a sensor can break
        takeaway: The spacecraft and the sensor go wrong in different ways.
        format: BELT
        question: Send each flag to the bin that says what the problem is.
        answerText: Anything possible and backed up by other readings is the spacecraft. Anything instant, off the scale, stuck or on its own is the sensor.
        why: >-
          Every flag is a number that moved. A number is not the thing itself. When the
          spacecraft really is warming up, it shows in more than one place. The structure
          warms. The radiator warms. The power draw agrees. And it all happens at a speed
          heating can manage. A broken sensor does none of that. It jumps all at once. Or it
          parks past the end of its range. Or it freezes while everything near it changes. Or
          it disagrees with two other sensors measuring the same thing. So the test is whether
          anything else agrees, not whether the number looks sensible. A broken sensor can give
          a very sensible number. The cost runs both ways. Chasing a broken sensor wastes fuel
          on a problem nobody has. Calling a real problem a bad reading is worse.
        belt:
          left: { name: The spacecraft }
          right: { name: The sensor }
          need: 20
          lives: 3
          pass: 0.8
          hint: Ask whether anything else on board agrees.

  - title: Communication Fades
    objective: Restore a reliable low-bandwidth link and use the signal itself as a navigation measurement.
    briefing: The spacecraft signal weakens and shifts in frequency as geometry changes. The team must separate transmitter failure from antenna pointing, range loss, and Doppler effects.
    stake: "Sixty-six hours in. The radio went weak the moment the spacecraft turned. Hale is answering calls he can barely hear. Naomi Ito, the communications lead, wants the aim checked first. Her network officer wants the receiver checked instead. Today you find the cause and get the link back. Losing the radio costs twice, because it is also how the room measures where the spacecraft is. There is still a burn to fly."
    takeaway: Use waves, frequency, wavelength, inverse-square behavior, Doppler effect as an evidence chain rather than as isolated facts.
    stops:
      - group: COMMS
        task: Change one thing at a time, and put it back, until the fade follows something.
        title: Why did the signal fade?
        place: Deep-Space Antenna
        scene: Voice and data have gone weak at two ground stations at once. A ground station is a dish antenna on Earth, and these two are on opposite sides of the world. The spacecraft's transmitter is putting out what it should. Three things can be swapped without risking anything.
        guide: >-
          The number you watch is how strong the signal is. Right now it is about twelve
          decibels low at both dishes. Each test changes one part of the path and can be
          undone. A change counts only if the number moves more than it wanders on its
          own. Both dishes are weak at once, which already tells you the cause has to be
          something they share. Change one thing, undo it, and name the part the fade
          follows.
        background:
          - >-
              Why two dishes at once is a clue. The two ground stations sit on opposite
              sides of the Earth. They have their own receivers, their own crews and their
              own weather. A fault in one cannot make the other weak. So the cause has to be
              something both of them share, which means the spacecraft end or the aim.
          - >-
              What decibels are. A decibel is a way of writing a ratio. Three decibels is
              about half the power. Ten decibels is a tenth of it. Twelve decibels is about
              one sixteenth. That is the difference between a voice you can work with and
              one you cannot.
          - >-
              Why every test can be undone. There are people aboard the spacecraft. A change
              you cannot undo is a decision, not a test. All three of these can be tried and
              put back, which is what lets you check that the fade follows the change both
              ways.
        assumes:
          - a fair test changes one thing and leaves the rest alone
        takeaway: A cause is proved when the effect follows the change both ways.
        format: CONTROL
        question: Which change makes the fade appear and disappear?
        control:
          hint: Run one reversible test at a time. A cause has to produce a response larger than the noise and reproduce that response when the change is reversed.
          baseline: -12
          noise: 0.2
          variables:
            - id: receiver_path
              label: Ground receiver path
            - id: tx_chain
              label: Spacecraft transmitter chain
            - id: pointing
              label: Antenna pointing correction
          reversalRequired: true
          acceptResponseDb: 0.6
          observable:
            label: received power db relative
          response: 11
          truth: pointing
        answerText: Where the antenna is pointing. Correcting it brings the signal back, and putting the error back makes it fade again. Neither swap changes anything.
        why: Several things can weaken a radio link, and only one test settles which. Swap to a different ground receiver and nothing changes, so it is not one receiver. Swap the transmitter chain and nothing changes, so it is not the transmitter. Correct where the antenna is pointing and almost all the missing signal comes back. Point it wrong again and the fade returns. Following the change in both directions is what makes it a cause rather than a coincidence.
        headline: Voice and telemetry suddenly become weak.

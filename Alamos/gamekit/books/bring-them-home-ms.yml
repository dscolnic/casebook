  - title: The Air Problem
    objective: Develop a safe temporary air-cleaning and circulation strategy using only validated physical principles and monitored limits.
    briefing: Carbon dioxide removal is failing, and pressure readings differ between compartments. The player must connect gas laws, partial pressure, fluid flow, and filter resistance.
    stake: "Fifty-eight hours in. Carbon dioxide is climbing in a cabin built for two and holding three. Petra Novak, the life support engineer, has been on the radio with the crew for an hour. The spare canisters are the wrong shape for the socket. Today you find out why the air is not being cleaned, and build something out of what is aboard. Hale has started making small mistakes reading numbers back. That is the first sign, and he cannot see it himself."
    takeaway: Use ideal gases, partial pressure, flow resistance, pressure difference, filtration as an evidence chain rather than as isolated facts.
    stops:
      - group: INTEG
        task: Build the air path in order, then name the link that is holding it up.
        title: Follow the air
        concept: Air is a mixture, and the share of each gas has to stay in range
        place: Life-Support Laboratory
        scene: Carbon dioxide keeps climbing. The scrubber, which is the machine that takes that gas back out of the air, has a fan that sounds normal and draws its usual current. The airflow through it is low. There are pressure readings on both sides of the filter.
        guide: >-
          Build the path the air takes, in order, then name the link where it becomes
          the problem. The fan sounds normal and draws its usual current, which tells
          you the fan is fine. The pressure readings on both sides of the filter are
          what show you where the blockage is, so read those instead of trusting the
          sound.
        background:
          - >-
              Why a working fan and low airflow means a blockage. A fan uses more current
              the more air it moves. Meeting a blockage, it moves less air, works less hard,
              and sounds completely normal. So the current reading is evidence about the
              fan, not about the system.
          - >-
              What a pressure difference tells you. Pushing air through a blockage costs
              pressure. A big drop across the filter and a small one across the scrubber
              says the filter is blocked. The other way round says the scrubber is. Those
              need different repairs.
          - >-
              Why the carbon dioxide is the clock. It climbs whenever the scrubber removes
              it more slowly than the crew makes it, and people get slow and confused well
              before the level is dangerous. The problem has to be found while everybody can
              still think clearly.
        assumes:
          - a motor running does not prove any air is moving
          - air has to pass through every part of a loop
        takeaway: A chain moves at the rate of its most restricted link, not the rate of its noisiest one.
        format: CHAIN
        question: Where does the air path become the problem?
        chain:
          hint: Put the air-transfer links in physical order. Then use the observed flow and pressure pattern to name the one required link that governs the entire loop.
          links:
            - id: intake
              label: Cabin intake
              transfers: cabin air into the loop
              reading: intake open
            - id: fan
              label: Scrubber fan
              transfers: pressure rise to the moving air
              reading: normal current and sound
            - id: filter
              label: Filter section
              transfers: air through the particulate barrier
              reading: large pressure drop across this section
            - id: sorbent
              label: CO2 sorbent bed
              transfers: carbon dioxide from air into sorbent
              reading: bed installed
            - id: return
              label: Return duct
              transfers: treated air back to the cabin
              reading: duct open
          distractor: fan
          order:
            - intake
            - fan
            - filter
            - sorbent
            - return
          governing: filter
        answerText: The filter. The fan is fine, and almost nothing is getting past that filter, so nothing reaches the scrubber.
        why: The fan makes a push. How much air moves depends on everything downstream of it. Normal current only proves the fan has power. The pressure difference across the filter is large and the flow is small, which is what a blockage looks like. Every breath has to get through that filter before it reaches anything that cleans it. So the loop runs at whatever the filter allows.
        headline: Cabin carbon dioxide rises even though the scrubber fan still draws power.

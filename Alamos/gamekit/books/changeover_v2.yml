  # --- Stop 59: Consequence audit
  #     Concept: linked policy consequences; Keystone: AD/forex/growth; Area: Statistics Floor; Learning role: COMBINE; Difficulty: L5; Story role: L5.
  #     placement: TRACE, at threshold-rail.
  - group: STATS
    at: threshold-rail
    title: "Consequence audit"
    concept: 24   # linked policy consequences
    reason: "The final numbers are ready, but the safeguards still need checking for shared dependencies."
    scene: "Because 3.25% yields a 1.00% real rate with positive reserves, trace its effects through investment, AD, capital flows, exchange value, NX, and growth. Separate independent price and payment safeguards."
    motivation: "The consequence audit distinguishes independent protection of prices and payments from repeated versions of one check."
    format: TRACE
    question: "Open every dependency and submit the complete consequence map."
    answerText: "\"The real rate links investment, AD, capital flows, currency, NX, and growth; CPI and payment limits independently govern reversal.\""
    why: "The final rate is credible only if domestic and foreign consequences remain visible."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. The final rate is credible only if domestic and foreign consequences remain visible.
    # correct result: The keyed result shown by the completed interaction.
    # state/output: Record the result and unlock the next named stop.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   trace:{channels:[{id:"investment",label:"private investment",dependency:"real interest rate",target_dependent:true},{id:"aggregate_demand",label:"aggregate demand",dependency:"real interest rate",target_dependent:true},{id:"capital",label:"capital formation",dependency:"real interest rate",target_dependent:true},{id:"forex",label:"capital inflow and RATE demand",dependency:"real interest rate",target_dependent:true},{id:"net_exports",label:"net exports",dependency:"exchange-rate branch",target_dependent:true},{id:"growth",label:"long-run growth",dependency:"capital branch",target_dependent:true},{id:"CPI",label:"CPI check",dependency:"price survey",independent:true},{id:"payments",label:"payment failures",dependency:"payment network",independent:true}],shared_upstream:"real interest rate",correct_conclusion:"moderate stance with independent CPI and payment safeguards",answerText:"Six policy channels share the real-rate source; independent CPI and payment channels keep the final stance conditional."}
    trace:
      channels:
        - id: investment
          label: Private investment
          reading: falls as the real rate rises
          depends:
            - real_interest_rate
        - id: aggregate_demand
          label: Aggregate demand
          reading: falls with investment
          depends:
            - real_interest_rate
        - id: capital
          label: Capital formation
          reading: slows after investment falls
          depends:
            - real_interest_rate
        - id: forex
          label: Capital inflow and RATE demand
          reading: rise with the real rate
          depends:
            - real_interest_rate
        - id: net_exports
          label: Net exports
          reading: fall after RATE appreciates
          depends:
            - exchange_rate_branch
        - id: growth
          label: Long-run growth
          reading: slows with capital formation
          depends:
            - capital_branch
        - id: cpi
          label: CPI check
          reading: 3.0% inflation
          depends:
            - price_survey
        - id: payments
          label: Payment failures
          reading: 0.5% of payments
          depends:
            - payment_network
      resources:
        - id: real_interest_rate
          label: real_interest_rate
        - id: exchange_rate_branch
          label: exchange_rate_branch
        - id: capital_branch
          label: capital_branch
        - id: price_survey
          label: price_survey
        - id: payment_network
          label: payment_network
      independent:
        - cpi
        - payments
      target: real_interest_rate

  # --- Stop 60: Sign
  #     Concept: final policy; Keystone: all keystones; Area: Rate Room; Learning role: TRANSFER; Difficulty: L5; Story role: payoff.
  #     placement: TRIGGER, at conversion-desk.
  - group: RATE
    at: conversion-desk
    title: "Sign"
    concept: 24   # final policy
    reason: "All final checks are assembled and the currency plan is ready for authorization."
    scene: "Enter the final numbers and sign only if every bar is complete."
    motivation: "The completed signature records whether every required economic and payment condition supports proceeding with conversion."
    format: TRIGGER
    question: "Submit number pair (4.15 crowns/RATE, 3.25%), then the three numeric conditions, then select SIGN; the panel blocks SIGN unless all four bars equal 100."
    answerText: "\"Signed: 4.15 conversion, 3.25% policy rate, with joint output/payment action trigger and CPI stop.\""
    why: "Conditions turn one rate choice into a testable policy rather than a guess."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. Conditions turn one rate choice into a testable policy rather than a guess.
    # correct result: The keyed result shown by the completed interaction.
    # state/output: Page 15; all locks; no more quizzes.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   rule:"conversion 4.15; policy rate 3.25%; buy bonds if Y≤680 AND failures≥2%; stop if companion CPI≥6.5%"; anchors:[4.15,3.25,680,2,6.5]; objective:"stable conversion with full employment and price guard"; direction:"conditional expansion"; consequence_limit:"CPI".
    trigger:
      scale:
        label: payment-failure rate
        unit: "%"
        min: 0
        max: 10
        step: 0.25

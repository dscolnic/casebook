      - group: DRY
        task: Say what shorter plants do to the harvest.
        title: Short is not simply worse
        concept: Choosing for one trait can drag another along with it
        place: Drying & Processing Hall
        scene: Toft points out that shorter wheats were the whole point of the 1960s. Less stem, more grain, and they stand up in the rain. Volpe still did not ask for fifteen centimetres.
        guide: >-
          Work out what share of everything the plant built ended up in the grain. Take the
          grain weight and divide it by the whole weight the plant made, stem and roots and all.
          One tile is the weight of the stem on its own, which is part of the total rather than
          the thing you divide by.
        background:
          - >-
              What the share means. A plant builds a fixed amount in a season, and then divides it
              between stem, leaves, roots and grain. The share that ends up in the grain is what a
              farmer takes away, and shorter wheats raised it by spending less on stem.
          - >-
              Why the stem is not waste. It holds the ear up, carries water and sugar to it, and keeps
              the crop off the ground in August rain. A stem strong enough to stand in weather is paid
              for out of the same total as the grain.
          - >-
              Why a shorter plant is not a better plant. It does not build more. It divides what it
              builds differently, which is a gain until the stem is too weak to hold the ear up in
              bad weather.
        assumes:
          - a plant shares out what it builds between stem, leaf and grain
        takeaway: What matters is the share of what a plant built that ends up in the grain.
        format: BALLPARK
        question: What share of everything the plant built ended up in the grain?
        answerText: About 0.45, or a little under half. The tall wheat manages 0.33, and the difference is stem the short plant did not build.
        why: A crop builds a certain amount in a season and then divides it up. This short wheat built 19.6 tonnes across the field, and 8.6 tonnes of that is grain: 8.6 ÷ 19.6 ≈ 0.45. A little under half. The tall wheat beside it built about the same total and got 0.33 of it into the ear, because more went into stem. That is the whole gain of the 1960s, and it is a gain in sharing rather than in building — neither plant photosynthesises faster than the other. It is also why the trade has a limit. The stem holds the ear up, carries water and sugar to it, and keeps the crop out of the mud in August rain, and all of that is bought out of the same total. Volpe's fifteen centimetres is not a rounding error either: it is stem, paid for with grain.
        estimate:
          prompt: The crop built 19.6 tonnes across the field. 8.6 tonnes of that is grain. The stem accounts for 5.2 tonnes.
          question: Choose the grain weight and the whole weight the plant built.
          labels:
            - 8.6  (tonnes of grain)
            - 19.6  (tonnes the plant built in total)
            - 5.2  (tonnes of stem)
            - 0.33  (the share a tall wheat manages)
          values: [8.6, 19.6, 5.2, 0.33]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 0.44
          tolerance: 0.04
          units: share that ended up as grain
          solution: 8.6 ÷ 19.6 ≈ 0.45, against about 0.33 for the tall wheat.
          explanation: A gain in sharing, not in building. The stem is paid for out of the same total.
          givens:
            - the crop built 19.6 tonnes, of which 8.6 is grain
            - a tall wheat gets about 0.33 into the ear
          relationship: The share is grain ÷ everything the plant built. A shorter plant builds no more; it divides what it builds differently.

  # ---------------------------------------------------------------- day 6
  - title: How many is enough
    objective: Put a number on what a regeneration needs, and on what the vault is losing.
    briefing: 40 accessions, 1 field, and a number nobody wants to hear.
    stake: "Monday of the second week, and the regrow list has to be cut from sixty to forty. Tomas Ivanescu has worked out how many plants each regrow needs, and it is not the number in the manual. Mbaye has eleven years of tests on one batch, and a line the results are about to cross. Today you size the samples, and work out which of last year's results were really the ground talking."
    takeaway: Every number here is about a population, and populations do not behave like the plants in them.
    stops:
      - group: POP
        task: Work out what share of the plants gave pollen.
        title: Not the number of plants
        concept: How many plants you need to keep a kind going
        place: Genetic Resources Office
        scene: Last year's grow-out used a hundred and twenty plants. Only eighteen of them gave pollen, and a hundred and two set seed. Ivanescu wants that looked at before the next plan.
        guide: >-
          Four numbers, and two of them belong to other questions. The seed plants, and
          half the plot. Ask which two a share needs. A share compares one group with
          the whole, so the total is the plants standing rather than any part of it. The
          pollen side is much the smaller group here.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - this crop keeps pollen and seed on separate plants
          - every seed has one parent on each side
        takeaway: A crowd of plants can pass on as little as a handful, if one side of the family is small.
        format: BALLPARK
        question: What share of the plants gave pollen?
        answerText: Fifteen per cent. Every seed in that batch got its pollen from one of just eighteen plants.
        why: Every seed gets half its genes from a pollen plant and half from a seed plant. So the pollen side is a doorway that everything has to come through. Here that doorway was eighteen plants wide, out of a hundred and twenty standing in the plot. Fifteen per cent. What it costs is variety. Whatever those eighteen plants did not carry is gone from the batch, however many plants were standing there.
        estimate:
          prompt: A hundred and twenty plants stood in the plot. Eighteen of them gave pollen, and a hundred and two set seed.
          question: What share of the plants gave pollen?
          labels:
            - 18  (plants that gave pollen)
            - 120  (plants standing in the plot)
            - 102  (plants that set seed)
            - 60  (half the plot)
          values: [18, 120, 102, 60]
          slots: 2
          template: "{0} ÷ {1} × 100"
          formula: a/b*100
          correct: [0, 1]
          target: 15
          tolerance: 2
          units: "%"
          solution: Eighteen ÷ a hundred and twenty, times a hundred, is fifteen per cent.
          explanation: A hundred and twenty plants stood there, and that is not the number that matters. Every seed had to get its pollen from one of eighteen.
          givens:
            - 18 plants gave pollen
            - 120 plants stood in the plot
          relationship: Share = the pollen plants ÷ all the plants × 100.
      - group: VAULT
        task: Set the thresholds before replaying the record.
        title: Write the rule before it falls
        place: Seed Vault
        scene: Mbaye has eleven germination tests on one batch, falling from ninety-eight per cent to eighty-five. The rule says grow it out at eighty-five. Booking a field takes time, and so does the grow-out.
        guide: >-
          One rule, written before the results arrive. Once you release it the number cannot change.
          The grow-out takes one reading to get going from the moment it is called. Below 85 %
          germination the lot is past the floor. So your line has to sit above 85 by however far the
          number falls in one reading — and not so far above it that a healthy lot is grown out for
          nothing.
        background:
          - >-
              Why a floor is not a trigger. The floor is where the seed must already have
              been grown out and replaced. Everything that has to happen first takes weeks,
              so the trigger has to sit above the floor by however long the work takes.
          - >-
              What the falling numbers tell you. Eleven tests falling from ninety-eight to
              eighty-five is a trend, not scatter. How fast it is falling is what turns a
              threshold into a date, and a rule written against the level alone ignores
              that.
          - >-
              Why the rules go first. Test results arrive one at a time. A threshold moved
              as they arrive is just a description of what somebody already decided, and the
              next person to run the vault cannot follow it.
        assumes:
          - germination is the share of seeds that actually grow
          - a grow-out needs field space booked before it can start
        takeaway: A threshold has to fire early enough for the thing it starts to arrive in time.
        format: TRIGGER
        question: >-
          At what germination do you start the grow-out, when it takes one reading to get going?
        trigger:
          hint: >-
            Set the rule before release. The grow-out takes one reading to get going, and the numbers
            only fall.
          direction: falling
          scale:
            label: Germination of the stored lot
            min: 80
            max: 100
            unit: "%"
            anchors:
              - { at: 98, means: 'the lot as it went into the vault' }
              - { at: 84, means: 'under the floor — grow it out now or the lot is gone' }
          consequenceLimit: 85
          objective: >-
            The grow-out has started before germination falls to the 85 % floor.
          rehearsal:

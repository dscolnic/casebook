#
# DERIVED from books/seedbank.yml by tools/derive-edition.mjs. The place, the
# cast and the story are the base game's and are not this file's to change; the
# course is. Days kept: 1, 2, 4, 5, 6, 8, 9, 12, 14, 15 of 15.
#
# What may be rewritten here, and what may not, is MIDDLE_SCHOOL_EDITIONS.md §1,
# and engine/dev/editionParity.mjs fails the game for crossing it. Rewrite the
# prose against books/GRADE6_BRIEF.md and re-import:
#
#   node tools/import-book.mjs books/seedbank-ms.yml seedbank_ms --verify

# Wellmere — a seed bank, a breeding programme, and one season to decide.
#
# The second AP Biology game. Outbreak: Riverton is the medical-molecular half
# of that course — cells, membranes, diagnostics, immunity, epidemiology. This is
# the other half, the one a hospital campus can only name-check: heredity,
# selection, population genetics and plant energetics. Nothing here is decided by
# a pathogen and a patient; everything is decided by a cross, a frequency or a
# temperature.
#
# The argument: Volpe holds that a line good enough to release is a line that
# should be released, because a season lost is food nobody eats. Qureshi holds
# that the collection is the only copy of what nobody has needed yet, and that
# every shortcut through it is taken from people who are not in the room.
# Volpe is right on day 4. Qureshi is right on day 12.

theme:
  id: seedbank_ms
  title: Wellmere
  subtitle: Season Lead · Wellmere Seed Bank

groups:
  - id: VAULT
    code: VAULT
    name: Conservation & Viability
    color: '#2f5d52'
    desc: What a seed is doing while it sits still, and how long it can go on doing it.
    defaultLeader: mbaye
    milestones: [Read the store, Test the germination, Decide what to regenerate, Ready to hand over]
  - id: CROSS
    code: CROSS
    name: Heredity & Crossing
    color: '#7a4fa3'
    desc: Which parents, which offspring, and what a ratio is evidence of.
    defaultLeader: volpe
    milestones: [Choose the parents, Make the cross, Read the generation, Ready to hand over]
  - id: POP
    code: POP
    name: Population Genetics
    color: '#1f7a6b'
    desc: What a collection holds, and what is lost every time it is grown out.
    defaultLeader: ivanescu
    milestones: [Count the alleles, Test against the null, Size the sample, Ready to hand over]
  - id: TRIAL
    code: TRIAL
    name: Field Trials & Selection
    color: '#b0762a'
    desc: Telling a good line from a good year, on ground that is never uniform.
    defaultLeader: quiroga
    milestones: [Lay out the trial, Score the plots, Separate line from site, Ready to hand over]
  - id: LAB
    code: LAB
    name: Markers & Gene Expression
    color: '#3f6f8f'
    desc: What a piece of DNA can tell you about a plant you have not grown yet.
    defaultLeader: nakagawa
    milestones: [Run the marker, Check the linkage, Predict the phenotype, Ready to hand over]
  - id: DRY
    code: DRY
    name: Agronomy & Plant Energetics
    color: '#b3462f'
    desc: Where the mass in a seed comes from, and what it costs the plant to make it.
    defaultLeader: toft
    milestones: [Measure the crop, Follow the carbon, Account for the water, Ready to hand over]

roster:
  - id: qureshi
    name: Dr. Nasrin Qureshi
    role: Collection Curator
    division: VAULT
    bio: |
      Keeps 41,000 accessions, which is 41,000 populations rather than 41,000
      seeds. What is in the vault is not a list of varieties; it is the variation
      inside each of them, and that is the part which cannot be bought back.

      Her argument with the breeding programme is the same one every season.
      Every time an accession is grown out to refresh it, a sample of it is what
      survives — and a sample is smaller than the thing it came from. Do that
      often enough with too few plants and the collection quietly becomes a
      different collection.

      Her limit is that she is defending against a problem nobody has yet. The
      rust that makes her right arrives after the season she loses the argument.
    quiz:
      - q: Why does Qureshi call an accession a population rather than a variety?
        a: The variation inside it is the part that cannot be replaced
        wrong:
          - Accessions are stored as bulk samples rather than as named varieties
          - A variety has to be registered before a gene bank will accept it
          - Populations are counted by weight and varieties by seed number
  - id: volpe
    name: Dr. Chiara Volpe
    role: Head Breeder
    division: CROSS
    bio: |
      Runs the breeding programme and counts in seasons, because that is the unit
      she is given. A cross made this spring is a line in four years and a
      release in seven, and every argument that delays one delays all of them.

      She is unsentimental about the collection in a way the curator finds
      alarming and is not wrong about: material nobody uses is material that
      helps nobody, and a gene bank that never gives anything away is a very
      expensive cupboard.

      Her limit is the thing she is selecting for. A line bred for one place and
      one decade is exactly as good as that place and that decade turn out to be.
    quiz:
      - q: Why does Volpe treat a season's delay as expensive?
        a: Every step of a seven-year pipeline moves back with it
        wrong:
          - Seed loses viability if it is held for a further season before sowing
          - Trial ground has to be rented a year in advance and cannot be deferred
          - Funding for a breeding programme is released one season at a time
  - id: mbaye
    name: Dr. Yusuf Mbaye
    role: Seed Physiologist
    division: VAULT
    bio: |
      Answers one question for a living: how long will this live? A seed in the
      vault is not inert. It is respiring, slowly, and everything he controls —
      the drying room, the moisture content, the minus 18 — is aimed at
      making that slower.

      He germinates a sample of every accession on a schedule and plots the
      curve. When it drops below 85% the accession has to be
      grown out, which is the moment the argument between the vault and the
      field starts again.

      His limit is that a germination test costs seed. Every measurement of how
      alive a collection is takes a little of it away.
    quiz:
      - q: Why does Mbaye dry seed before it goes into the vault?
        a: A drier seed respires more slowly and lives longer
        wrong:
          - Dry seed packs more tightly and the vault holds more of it
          - Moisture makes the passport labels illegible over time
          - Freezing wet seed shatters the seed coat on the way down
  - id: ivanescu
    name: Dr. Tomas Ivanescu
    role: Population Geneticist
    division: POP
    bio: |
      Counts alleles for a living and is patient about being asked why it
      matters. A frequency is a fact about a population and not about any plant
      in it, and most arguments here come from somebody forgetting which of the
      two they are holding.

      He is the one who works out how many plants an accession has to be grown
      from. It is not a matter of taste: below a certain number, drift takes rare
      alleles out on its own, and nothing about the growing was done badly.

      His limit is that he cannot say which allele will matter. He can only say
      what it costs to keep all of them, which is an argument nobody enjoys.
    quiz:
      - q: Why can Ivanescu not say which alleles are worth keeping?
        a: What is useful depends on a future nobody has seen
        wrong:
          - Allele frequencies cannot be measured accurately below 1%
          - The passport data does not record which alleles an accession carries
          - Sequencing every accession would cost more than the collection is worth
  - id: quiroga
    name: Dr. Meera Quiroga
    role: Field Trials Manager
    division: TRIAL
    bio: |
      Lays out the ground. Four replicates, randomised within blocks, and the
      same line sown in four different places on purpose — because the north end
      of that field is wetter than the south and always has been.

      What she is defending against is the oldest mistake in agriculture:
      deciding a line is good when what was good was the corner it grew in. The
      randomisation is not a formality; it is the only reason the numbers at the
      end mean a line at all.

      Her limit is one site and one year. Everything she measures is true of
      Wellmere in this weather, and saying so is most of her job.
    quiz:
      - q: Why does Quiroga sow the same line in four separate plots?
        a: So a difference between plots does not get read as a difference between lines
        wrong:
          - Four plots give enough seed to sow the following season
          - Regulations require every trial entry to be replicated four times
          - A single plot cannot be scored accurately by one person
  - id: nakagawa
    name: Dr. Hana Nakagawa
    role: Molecular Laboratory Lead
    division: LAB
    bio: |
      Runs the markers, and is careful about what a marker is: a piece of DNA
      near the gene you care about, not the gene itself. Near is doing the work
      in that sentence, and how near decides how often the marker lies.

      She can tell the breeder which seedlings to keep before they have a leaf
      worth looking at, which saves a year. She will also say, unprompted, when a
      marker has come loose from the trait in a new population and is no longer
      telling anybody anything.

      Her limit is that she tests for what somebody has already found. A marker
      exists because a gene was mapped, and nothing in her laboratory finds the
      thing nobody has looked for.
    quiz:
      - q: Why does Nakagawa re-check a marker in each new population?
        a: Recombination can separate it from the gene it stands for
        wrong:
          - Markers degrade in storage and have to be re-synthesised each season
          - Every population needs its own primers for the same marker
          - Laboratory reagents vary between batches and shift the result
  - id: toft
    name: Dr. Osman Toft
    role: Agronomist
    division: DRY
    bio: |
      Follows the carbon. Every gram of grain in the drying hall was atmospheric
      carbon dioxide in June, and the difference between a good line and a bad
      one is mostly what it did with the light and the water it was given.

      He measures the boring things nobody publishes — canopy cover, days to
      flowering, water use — because they are what explain a yield rather than
      report it. A line that yields well and cannot say why is a line nobody can
      breed from.

      His limit is that a field is not a chamber. Everything he measures is
      confounded with the weather, which is why he keeps 11 years of it.
    quiz:
      - q: Why does Toft measure canopy cover and flowering date alongside yield?
        a: They explain a yield instead of only recording it
        wrong:
          - Yield cannot be measured accurately until the crop has flowered
          - Canopy cover is what the trial protocol requires to be reported
          - Flowering date is used to schedule the harvest crew
  - id: ashworth
    name: Wren Ashworth
    role: Genebank Technician
    division: VAULT
    bio: |
      Packs, labels, counts and finds. Every accession that leaves the vault and
      every one that comes back goes through their hands, and the number on the
      packet is the only thing tying a seed to everything known about it.

      They are quietly the most careful person on site. A mislabelled packet is
      not a small error: it is a plant whose passport belongs to something else,
      and it can be 20 years before anybody notices.

      Their limit is that they can only record what the field tells them. A plot
      harvested into the wrong bag arrives here already wrong.
    quiz:
      - q: Why does Ashworth treat a packet number as the important part?
        a: Without it the seed is separated from everything known about it
        wrong:
          - Numbers are how the vault's temperature log is cross-referenced
          - The number determines which shelf and box the packet belongs in
          - Accessions cannot be exported without a number on the packet
  - id: fenn
    name: Idris Fenn
    role: Farmer, and on-farm conservation partner
    division: POP
    bio: |
      Grows four landraces on his own ground because his grandfather did, and
      because two of them do something in a wet August that nothing modern does.
      Wellmere has samples of all four; his fields have the living versions.

      What he provides that the vault cannot is a population still being
      selected — by his soil, his weather and his own choice of what to keep
      seed from. The vault holds 1994. His field holds this year.

      His limit is that he is one farm. What his ground selects for is his
      ground, and he says so before anybody else can.
    quiz:
      - q: What does Fenn's field hold that the vault does not?
        a: Plants still under the pressures of a real farm
        wrong:
          - Larger seed samples than a gene bank can store
          - Varieties that were never accepted into the collection
          - Seed that has been tested for germination every year
  - id: pirelli
    name: Sylvie Pirelli
    role: Data & Passport Records
    division: LAB
    bio: |
      Holds the passport data: where each accession was collected, when, by whom
      and from what. It is the difference between a bag of seed and a sample of
      somewhere.

      She is strict about provenance because everything downstream leans on it. A
      duplicate entered twice under two names inflates a collection on paper and
      wastes a regeneration slot that something unique needed.

      Her limit is that she inherited most of it. Half these records were written
      on paper by people who are dead, and the gaps are permanent.
    quiz:
      - q: Why does Pirelli chase duplicate accessions so hard?
        a: A duplicate takes a regeneration slot something unique needed
        wrong:
          - Duplicates make the collection appear smaller than it is
          - Storage space in the vault is the limiting resource
          - Two records of one accession cannot both be exported
  - id: bengtsson
    name: Otto Bengtsson
    role: Glasshouse Manager
    division: CROSS
    bio: |
      Runs three bays at three temperatures and knows what each one is for: the
      warm bay to push a generation through in winter, the cool bay for the
      lines that will not flower without a cold spell, and the screening bay,
      which is kept apart because there is rust in it on purpose.

      He can get the programme an extra generation a year, which is the single
      biggest lever anybody at Wellmere has on time.

      His limit is that a glasshouse is not a field. A line that looks superb in
      his bays has been grown without wind, without drought and without
      competition, and he says so every time somebody gets excited.
    quiz:
      - q: Why does Bengtsson warn against judging a line in the glasshouse?
        a: It has grown without wind, drought or competition
        wrong:
          - Glasshouse plants are grown at higher density than field plots
          - The bays cannot be scored with the same instruments as a field
          - Lines in glasshouses are grown from smaller seed samples

glossary:
  - name: Seed
    aliases: [seeds]
    def: A young plant with its own supplies and a coat around both. Everything in this collection is one, and none of them is inert.
  - name: Gene
    aliases: [genes]
    def: One instruction in a plant's inheritance — for a protein, and through it for something about the plant.
  - name: DNA
    aliases: []
    def: The molecule those instructions are written in, copied into every cell and handed on when a plant reproduces.
  - name: Chromosome
    aliases: [chromosomes]
    def: One long thread carrying many instructions in a fixed order, and inherited whole. A wheat plant has 21 pairs.
  - name: Pollen
    aliases: []
    def: What a plant fertilises with. One grain of it carries a single set of chromosomes to an egg.
  - name: Plot
    aliases: [plots]
    def: One patch of a trial, carrying one line. It is the unit everything in the field is measured on.
  - name: Accession
    aliases: [accessions]
    def: One sample held in a collection, with a number and a record of where it came from. What is in it is a population.
  - name: Variety
    aliases: [varieties]
    def: A named, uniform crop type sold to farmers. A collection holds many of them and is not made of them.
  - name: Trait
    aliases: [traits]
    def: Anything about a plant somebody measures or scores — its height, its yield, whether it stays standing.
  - name: Landrace
    aliases: [landraces]
    def: A crop population shaped by one place and its farmers over generations rather than by a breeding programme.
  - name: Viability
    aliases: [viable]
    def: The share of a sample that will still grow. It falls with time, and how fast depends on how the sample is kept.
  - name: Germination test
    aliases: [germination]
    def: Sowing a sample of an accession to count how many come up. It is the only honest measure of viability, and it costs seed.
  - name: Regeneration
    aliases: [regenerate, regenerated, grow-out]
    def: Growing an accession out to make fresh seed. Every one is a new sample of the old population.
  - name: Respiration
    aliases: [respire, respiring]
    def: The slow burning of what a cell has put by, which is how it keeps going. Cold and dry makes it slower; warm and damp makes it quick, and then it ends.
  - name: Moisture content
    aliases: [moisture]
    def: How much water a seed is carrying, as a share of its weight. It sets the rate of everything else that happens to it.
  - name: Photosynthesis
    aliases: [photosynthetic]
    def: Building sugars from carbon dioxide and water using light. Every gram of grain was air in June.
  - name: Allele
    aliases: [alleles]
    def: One of the versions a gene comes in. A population holds several; a plant holds two.
  - name: Allele frequency
    aliases: [frequencies, gene frequency]
    def: How common a version of a gene is in a population, as a proportion. It is a fact about the population, not about any plant.
  - name: Hardy-Weinberg
    aliases: [hardy–weinberg, equilibrium expectation]
    def: What genotype proportions would be if nothing were acting on a population. It is a null to be tested against, not a description.
  - name: Genetic drift
    aliases: [drift]
    def: Change in allele frequency by sampling alone. It is strongest in small populations, and what it removes is whatever was uncommon.
  - name: Effective population size
    aliases: [effective size]
    def: How large a population behaves as, genetically. Uneven contributions and few parents both make it smaller than the plant count.
  - name: Bottleneck
    aliases: [bottlenecks]
    def: A generation grown from too few parents. What comes out is a sample of what went in, and the uncommon versions are what go missing.
  - name: Meiosis
    aliases: []
    def: The division that makes a plant's male and female cells. It halves the number of chromosomes and shuffles what goes into each.
  - name: Segregation
    aliases: [segregate, segregates]
    def: The separation of a plant's two alleles into different gametes, so a cross gives offspring in predictable proportions.
  - name: Cross
    aliases: [crosses, crossing, backcross]
    def: Deliberately fertilising one plant with another. A backcross returns to one parent to keep the rest of that parent.
  - name: Dominant
    aliases: [dominance, recessive]
    def: An allele whose effect shows when only one copy is present. A recessive one shows only when both copies are it.
  - name: Phenotype
    aliases: [phenotypes]
    def: What a plant turns out to be like, as opposed to what it is carrying. Two plants can match here and differ underneath.
  - name: Genotype
    aliases: [genotypes]
    def: Which alleles a plant carries. Two plants can share a phenotype and not a genotype.
  - name: Heritability
    aliases: [heritable]
    def: How much of the variation in something measured, in one population in one place, is down to inheritance rather than conditions.
  - name: Selection differential
    aliases: [selection intensity]
    def: How much better the plants you kept were than the average of what you grew. It is what you asked for.
  - name: Marker
    aliases: [markers, marker-assisted]
    def: A stretch of DNA close enough to a gene to travel with it, used to pick plants before anything can be seen.
  - name: Linkage
    aliases: [linked]
    def: Two instructions near each other on one chromosome travel together. It is what makes a marker work, and what brings unwanted neighbours along with a wanted one.
  - name: Recombination
    aliases: [recombine, crossing over]
    def: The swapping of pieces between a plant's two sets of genes, before it passes one on. Given enough tries, it separates neighbours.
  - name: Replicate
    aliases: [replicates, replication]
    def: The same line grown in more than one place, so that the ground can be told apart from the line.
  - name: Randomisation
    aliases: [randomise, randomised]
    def: Assigning entries to plots by chance, so that no line is systematically given the best corner of a field.
  - name: Block
    aliases: [blocks, blocking]
    def: A group of neighbouring plots, close enough to be alike. Comparing inside one removes most of what the field itself contributes.
  - name: Pathogen
    aliases: [pathogens]
    def: Anything living that makes a plant ill — a fungus, a bacterium, a virus. It is under selection too, which is why a defence does not stay one.
  - name: Rust
    aliases: []
    def: A fungal disease of cereals that spreads on the wind and evolves around resistance. It is why nobody plants one variety everywhere.
  - name: Resistance gene
    aliases: [resistance]
    def: An allele that lets a plant fight off a particular disease. A disease that changes can make it worthless in a season.

missions:
  # ---------------------------------------------------------------- day 1
  - title: What is actually in the vault
    objective: Find out what Wellmere is holding and what it is doing while it sits there.
    briefing: 41000 accessions, and 60 of them overdue.
    stake: "Monday in the first week of March, and the sowing plan has to be signed by Friday. Wellmere holds forty-one thousand seed batches at minus 18. Yusuf Mbaye says sixty of them must be grown out this season, and there is ground for about forty. Chiara Volpe wants that ground for her trial, and Nasrin Qureshi wants it for the collection. Today you find out what a seed does while it is stored."
    takeaway: A stored seed is alive and spending itself, and everything in the vault is aimed at slowing that down.
    stops:
      - group: VAULT
        task: Say what the cold and the drying are for.
        title: Why the vault is cold
        place: Seed Vault
        scene: Mbaye has two lots of the same seed on the bench. One spent four years dried, at minus eighteen degrees. The other sat in a warm shed, and only three in ten still grow.
        guide: >-
          Four accounts of why cold and dry works. Ask of each whether it treats the
          seed as alive or as dead. A dried seed is still slowly changing inside, so
          damage builds up over years. Two of these options have something being blocked
          or killed instead. And a clean sealed packet still lasts far longer when it is
          cold.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - some seeds can survive being dried out and frozen
        takeaway: Keeping something alive for decades is a matter of slowing down what damages it.
        format: CHOICE
        question: Why does cold, dry storage keep a seed alive longer?
        answerText: Cold and drying slow the chemistry that damages a seed from the inside, so it stays able to grow for far longer.
        why: A dried seed is still alive, and being alive means chemistry going on inside it. That chemistry slowly damages the parts the seed will need when it wakes up. Taking the water out slows those changes down. Cold slows them further, so the two work together. It is not a fuel tank running out. It is damage adding up, and everything in the vault is there to make it add up more slowly.
        choices:
          - They slow down the chemical changes that damage a stored seed.
          - They keep the seed asleep, blocking what starts it growing.
          - They mostly work by killing the moulds already in the packet.
          - They harden the coat, so the cells inside need no repair.
        answer: They slow down the chemical changes that damage a stored seed.
        rebuttals:
          - Staying asleep stops a seed sprouting at the wrong time. It does not explain decades of slower ageing.
          - Drying and sealing do hold pests and mould back. A clean seed still ages.
          - The coat does not make the cells inside maintenance-free. What changes is how fast the damage builds up.
      - group: CROSS
        task: Say what the cross is for.
        title: Two parents, and what you are asking of them
        place: Crossing Hall
        scene: Volpe has two parents pinned above the bench. One is a modern wheat that yields well. The other is an old local kind that came through the 2018 drought. Bengtsson asks what she wants.
        guide: >-
          Four accounts of what a cross is for. Ask of each whether it could happen when
          each parent passes on half its genes. The offspring get a mix, not an average.
          Neither parent already has the combination being looked for. And many of the
          offspring will be worse than both, because the bad genes get shuffled too.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - young plants get half their genes from each parent
        takeaway: A cross is a request for a combination, and it takes generations to find out whether it was granted.
        format: CHOICE
        question: What is the programme actually asking for by crossing these two?
        answerText: Plants carrying useful genes from both parents at once. Neither parent has that combination, which is why it takes generations.
        why: Each parent hands on half its genes, so the first generation gets one set from each. The generation after that shuffles those sets into thousands of combinations. What the breeder wants is the yield genes of the modern parent together with the drought genes of the old one. Neither parent has that. Most of the offspring will be worse than either. Breeding is growing enough of them to find the rare ones worth keeping.
        choices:
          - Plants that carry the useful genes of both parents at once.
          - Plants halfway between the two parents in everything.
          - An old local kind, improved by contact with the modern one.
          - A cross that beats both parents, because crosses are stronger.
        answer: Plants that carry the useful genes of both parents at once.
        rebuttals:
          - Traits built from many genes do average out. The ones being chased here do not.
          - An old local kind is a whole population. Crossing changes what comes out of it rather than improving it in place.
          - Crosses do beat their parents in some crops, and that is not what this programme is for.
      - group: TRIAL
        task: Say what sowing each line four times buys.
        title: Why the same line is sown four times
        place: Field Laboratory
        scene: Meera Quiroga has the plot map on the wall. Two hundred and forty plots, each line sown four times across four blocks, in scrambled order. The north end is visibly wetter.
        guide: >-
          Four things four plots might buy. Ask of each whether it is about the
          comparison or about safety. A field is not the same everywhere: drainage,
          depth and shelter all vary. So one plot's yield is the seed and the ground
          together. Spreading a line across the field is what separates them.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - the same crop grows differently in different parts of a field
        takeaway: Repeating a thing in different places is how you find out which part of the answer was the place.
        format: CHOICE
        question: What does sowing each line in four scattered plots buy?
        answerText: A comparison between seeds rather than between patches of ground — and a measure of how much the ground was worth.
        why: Ground varies. Drainage, depth, shelter, how hard it was driven over. Sow a line once and its yield is the seed and that patch mixed together, with no way to tell them apart. Sow it four times in different blocks and the patches differ while the seed does not. Scrambling the order stops anybody's habits handing good ground to a favourite. How much the four disagree is itself a measure of how much the ground matters.
        choices:
          - A comparison that separates the seed from its patch of ground.
          - Four separate lots of seed, protecting next season's planting stock.
          - Cover against one storm wiping out the whole trial.
          - A more exact yield figure from each individual plot.
        answer: A comparison that separates the seed from its patch of ground.
        rebuttals:
          - A yield trial is harvested to compare. These four are not four separate seed stocks.
          - Weather arrives across the whole site, so four nearby plots are not four separate seasons.
          - Each plot is measured the same way. What repeating buys is a better comparison, not a better plot.
  # ---------------------------------------------------------------- day 2
  - title: What the generation tells you
    objective: Read the second generation of last year's cross, and check it against a marker.
    briefing: 400 plants in the warm bay, and a ratio to count.
    stake: "Tuesday. Four hundred plants from Volpe's cross are in the warm bay. This is the generation where the parents' hidden versions come apart and show themselves. Hana Nakagawa has run a marker test on the same plants and has a disagreement to explain. Eleven of them carry the resistance gene and do not look it. Today you count what the generation is telling you, and work out what the mismatch means."
    takeaway: A ratio is evidence about what the parents carried, not a decoration on a data sheet.
    stops:
      - group: CROSS
        task: Say what the counts show about the resistance.
        title: Counting a generation
        concept: Living things pass traits to their offspring
        place: Crossing Hall
        scene: Four hundred plants from the second generation. Three hundred and six shrug the disease off, and ninety-four do not. The breeder asks what that number was supposed to be.
        guide: >-
          Work out what number was expected before looking at what came. Each parent carries
          one resistant copy and one that is not, so three plants in four should shrug the
          disease off. That is a share of the four hundred. One tile is the count that actually
          came, which is what you are comparing against.
        background:
          - >-
              Where three in four comes from. Each parent gives one of its two copies to each seed.
              There are four ways the copies can pair up, and three of those four contain a resistant
              copy. One resistant copy is enough, so three in four look resistant.
          - >-
              Why the whole generation is the evidence. Any single plant is resistant or not, and
              tells you nothing. Four hundred of them make a proportion, and a proportion is what a
              breeding rule predicts.
          - >-
              Why close is the right answer. Nobody expects exactly three hundred. Coin tosses do not
              come out exactly half, and four hundred plants is enough for the count to land near the
              expected number rather than on it.
        assumes:
          - a plant carries two copies of each gene and passes on one of them
        takeaway: The proportions across a whole generation carry information that no single plant does.
        format: BALLPARK
        question: How many of the four hundred plants should shrug the disease off?
        answerText: Three hundred. Three plants in four is 0.75 of 400, and 306 came in — close enough to say one gene is doing it, with the resistant copy the stronger one.
        why: Each parent has two copies of the gene and gives one to each seed. There are four ways those copies can pair up, and three of the four include a resistant copy. One copy is enough to shrug the disease off, so three plants in four should manage it. Three quarters of four hundred is 400 × 0.75 = 300. The tray gave 306, which is as close as anybody should expect — a proportion lands near its expected number, not exactly on it, in the same way a hundred coin tosses rarely give exactly fifty heads. That is what makes the count evidence. If two genes were doing the work, and either one was enough, the expected number would be 375 instead, and 306 is nowhere near it. No single plant in the tray could have told you any of this.
        estimate:
          prompt: Four hundred plants in the second generation. Each parent carries one resistant copy and one that is not, so three plants in four are expected to be resistant.
          question: Choose the number of plants and the share expected to be resistant.
          labels:
            - 400  (plants in the tray)
            - 0.75  (three in four, the share expected)
            - 306  (plants that shrugged it off)
            - 0.94  (the share expected if two genes did it)
          values: [400, 0.75, 306, 0.94]
          slots: 2
          template: '{0} × {1}'
          formula: a*b
          correct: [0, 1]
          target: 300
          tolerance: 12
          units: resistant plants expected
          solution: 400 × 0.75 = 300 expected, against 306 counted.
          explanation: Three hundred expected, three hundred and six counted. One gene, with the resistant copy the stronger one.
          givens:
            - four hundred plants, 306 of them resistant
            - three in four expected when each parent carries one resistant copy
          relationship: Expected number = how many × the fraction expected, which is a part = whole × share: 0.75 is the share of the plants expected to be resistant.
      - group: LAB
        task: Say what the drift does to the screen.
        title: What the screen may not find
        concept: A trait can hide in one generation and show up in the next
        place: Molecular Laboratory
        scene: Nakagawa is screening fifty batches for a second resistance gene. Twenty-two of them are on the drifted list, and their test controls are clean. She wants to know what a clean result still means.
        guide: >-
          Four readings of what drift does to a test. Ask of each whether it changes
          clean results, positive results, or both. Chance can remove a gene that was
          rare, so a clean result now has two stories and the test cannot tell them
          apart. Chance cannot invent the gene, so a positive still means something.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - a gene that is rare in a population may be missing from a small sample of it
        takeaway: A screen finds what is in front of it, and what is in front of it is what survived the last grow-out.
        format: CHOICE
        question: What does the drift mean for the screen?
        answerText: A clean result no longer proves the gene was never there. It may have been lost in a grow-out, and the test cannot tell the difference.
        why: Drift can remove a gene that was rare to begin with. So a clean result from one of those batches has two explanations. The gene was never there, or it was there and got lost in a grow-out. The test cannot tell those apart, because it is looking at the seed in front of it. A positive is still worth having, because drift removes genes and never invents them. The fix is to test material that missed the bottleneck.
        choices:
          - A clean result there no longer proves the gene is absent.
          - The screen will report genes that are not there at all.
          - The screen has to be rebuilt around different tests.
          - Nothing. Resistance genes get kept, because they are useful.
        answer: A clean result there no longer proves the gene is absent.
        rebuttals:
          - Drift removes genes rather than inventing them, so a positive result is unaffected.
          - The tests work. What has changed is the seed they are being run on.
          - Nothing in a vault cares about rust, so there is no reason for resistance to be kept.
      - group: DRY
        task: Say where the weight in the harvest came from.
        title: Where a tonne of grain comes from
        concept: "Same seed, different field: what a plant looks like depends on where it grew"
        place: Drying & Processing Hall
        scene: The agronomist has eleven tonnes of grain from one field on the weighbridge slip. A trainee has just said the crop got it out of the soil. He would like that settled.
        guide: >-
          Work out how much of the eleven tonnes is the stuff the plant built out of air. About
          nine tenths of dry grain is sugar and starch, and all of that came in through the
          leaves as carbon dioxide. One tile is the share that came out of the soil, which is
          the small part and not the answer.
        background:
          - >-
              What grain is made of. Once it is dry, about nine parts in ten are carbohydrate — sugars
              and starch, built out of carbon dioxide from the air and water, using light. That is
              where almost all the weight comes from.
          - >-
              What the soil gives. Minerals, and only a few per cent of the weight. They matter enormously,
              because a crop short of nitrogen cannot build much of anything, and they are not what the
              harvest is made of.
          - >-
              Where the water goes. Most of the water a crop takes up leaves again through its leaves as
              vapour. It is not in the weighbridge figure at all, because the grain is weighed dry.
        assumes:
          - plants build sugars out of carbon dioxide and water, using light
        takeaway: A harvest weighs what it weighs because of something that was not there when it started.
        format: BALLPARK
        question: How much of the eleven tonnes came in through the leaves, out of the air?
        answerText: About ten tonnes of it. Nine tenths of dry grain is sugar and starch built out of carbon dioxide, and the soil's share is a few hundred kilos of minerals.
        why: Dry grain is about nine parts in ten carbohydrate — sugar and starch. The plant builds all of it out of carbon dioxide taken in through its leaves, with water and light. So the part of the harvest that came out of the air is 11 × 0.9 ≈ 9.9 tonnes, near enough ten. The soil's contribution is the other part: minerals, a few per cent of the weight, a few hundred kilograms across the whole field. That small share is not unimportant — a crop short of nitrogen cannot build much of anything — but it is not what the harvest is made of. The water is not in the figure at all. Most of what the crop took up left again through its leaves as vapour, and the grain on the slip has been weighed dry. So the trainee has it backwards: the field gave the minerals, and the air gave the weight.
        estimate:
          prompt: Eleven tonnes of dry grain. About nine tenths of dry grain is carbohydrate, built out of carbon dioxide from the air.
          question: Choose the harvest weight and the share of it that is carbohydrate.
          labels:
            - 11  (tonnes of dry grain)
            - 0.9  (the share that is sugar and starch)
            - 0.03  (the share that came from the soil)
            - 4000  (tonnes of water the crop used)
          values: [11, 0.9, 0.03, 4000]
          slots: 2
          template: '{0} × {1}'
          formula: a*b
          correct: [0, 1]
          target: 9.9
          tolerance: 0.6
          units: tonnes built out of air
          solution: 11 × 0.9 ≈ 9.9 tonnes out of the air, against a few hundred kilos of minerals from the soil.
          explanation: The air gave the weight and the field gave the minerals. The water left again through the leaves.
          givens:
            - eleven tonnes of dry grain from one field
            - about nine tenths of dry grain is carbohydrate
          relationship: Part = whole × share, and the share that is carbohydrate came in as carbon dioxide.

  # ---------------------------------------------------------------- day 4
      - group: VAULT
        task: Hold the drying room while the lots come in.
        title: Six per cent, while the lorries arrive
        concept: "A seed is alive, and it can be kept alive or let die"
        place: Seed Vault
        scene: Seed has to be dried to six per cent before it goes into the vault. Wet lots keep arriving off the field. The dehumidifier is the only thing that takes water out of the air.
        guide: >-
          Hold the room at six per cent, inside the band on the dial. The band gets narrower
          later in the week, because seed that is nearly dry is spoiled by less. Each wet lot
          keeps adding water for as long as it stands there. Set the dehumidifier to answer
          the load, not the reading.
        background:
          - >-
              Why a lot is not a single push. A lorry does not add water once and stop. The wet seed
              keeps giving water to the air while it sits in the room.
          - >-
              Why dry matters. A seed is alive. Cold and dry both slow it down, so it stays alive for
              longer. The freezer holds itself. The drying is held by whoever is on the floor.
        assumes:
          - seed is dried before it goes into store
        takeaway: A load that keeps arriving is not answered by one correction.
        format: HOLD
        question: Hold the drying room at six per cent while the week's seed comes in.
        answerText: Inside the band most of the week, with the dehumidifier set to match each load rather than nudged after the dial has moved.
        why: >-
          Every lot that arrives is a load that keeps working. Wet seed gives up water to the
          air for as long as it stands in the room, so the reading climbs and keeps climbing.
          One nudge on the dehumidifier does nothing that lasts. Set it where it matches what
          is coming in, and leave it there. Later in the week the band narrows. Early on, the
          seed is wet and a tenth of a point either way makes no difference. Near six per cent
          it is the difference between seed that keeps for decades and seed that keeps for
          years. That is the whole job of a vault. Cold and dry each slow a seed down, and they
          multiply together. The freezer holds itself. The dryness is held by a person.
        hold:
          quantity: Drying room moisture
          unit: '%'
          control: Dehumidifier
          hold: 6
          band: 0.4
          narrowTo: 0.2
          duration: 45
          direction: lower
          authority: 0.1
          pass: 0.8
          hint: Each lot keeps adding water. Set the dehumidifier to match it.
          disturbances:
            - { label: Wet lot in from the field, at: 4, amount: 0.03 }
            - { label: Drain backs up, at: 20, amount: 0.05 }
            - { label: The wet intake finishes, at: 38, amount: -0.045 }
          commit: Report the week
  - title: The season you do not get back
    objective: Weigh a release against a delay, with a dry summer forecast.
    briefing: WM-712 is ready. The ground it needs is the ground the vault wants.
    stake: "Thursday, and the sowing plan is due tomorrow. Volpe's line WM-712 has been through four seasons and yields eleven per cent over the standard in dry years. Releasing it needs the whole west ground — which is the ground Qureshi's sixty overdue batches would have used. The forecast for summer is dry. Today you work out what a season's delay actually costs, and what the trial data does not support."
    takeaway: A delay is not neutral, and neither is a release; the question is which cost is recoverable.
    stops:
      - group: CROSS
        task: Decide what the extra generation is for.
        title: An extra generation in the bay
        concept: Choosing which plants to breed from, and what that costs
        place: Crossing Hall
        scene: Bengtsson can run one more generation over the winter in the warm bay. A generation there takes three months instead of twelve. There is room for one population.
        guide: >-
          Three jobs want the bay, and the rail is not a clock. Put them in order by what the
          winter can never give back: the job that only works indoors goes first, and the job
          that the field will do just as well in spring goes last.
        axis: Order the three by how much the winter is worth to each one, most first. This is not a clock — all three could start in the bay this week, and the question is which one gains something the field cannot give it.
        ends: [Only the bay can do it, The field does it just as well]
        background:
          - >-
              What the bay is good for. Getting a generation finished out of season, so a cross moves one
              step closer while the fields are empty. Three months instead of twelve, four times a year
              instead of once.
          - >-
              What the bay is bad for. Judging anything. Plants in a warm bay grow in light, water and
              temperature nothing like a field, so a yield measured there is a fact about the bay. Any
              judgement has to wait for ground outside.
          - >-
              Why multiplying seed goes last. It works perfectly well in the bay and it works perfectly
              well in a field in spring, so spending the winter on it spends a scarce thing on a job
              that has an easy alternative.
        assumes:
          - a glasshouse can finish a generation out of season
        takeaway: A generation indoors is for moving material along, not for judging it.
        format: SEQUENCE
        question: Order the three jobs by how much the winter in the bay is worth to each.
        cards:
          - Push the backcross on one more generation
          - Grow out the overdue landrace batch
          - Multiply seed of WM-712 for the merchant
        order: [0, 1, 2]
        answerText: The backcross first, the overdue batch second, and the seed multiplication last. Only the first gains something the field cannot give it this winter.
        why: The bay does one thing nothing else can do. It finishes a generation out of season, in three months instead of twelve. So the job that belongs there is the one where a generation is the whole point. That is the backcross. It needs one more round before it can be tested outside, and every winter it is not run adds a year to the programme. The overdue batch comes next. It does need regrowing, and it needs enough plants to keep what is in it, which the bay can just manage. Multiplying seed for the merchant goes last. Not because it does not matter — it works just as well in a field in spring. Putting it in the bay spends the scarce thing on the job with an easy alternative. And nothing in there can be judged. Yield in a warm bay is a fact about the bay, so any measuring still waits for ground outside.
      - group: TRIAL
        task: Say what four seasons of trials support.
        title: What the trial can actually claim
        place: Field Laboratory
        scene: Four seasons, one site, four plots each. WM-712 is ahead by eleven per cent in the two dry years and by two in the wet ones. The leaflet says eleven per cent higher yielding.
        guide: >-
          Work out how many times bigger the dry-year gain is than the wet-year one. It is the
          bigger figure divided by the smaller one. One tile is the number of seasons, which is
          how much evidence there is rather than part of this sum.
        background:
          - >-
              What a trial measures. Four plots per line over four seasons separate the line from the
              piece of ground it grew on. They do it under the weather those seasons happened to bring,
              and that weather is part of the answer.
          - >-
              Why the leaflet's number is a problem. Eleven per cent is true, and it is true of two dry
              years. A farmer in a wet season gets two, so a number quoted without its conditions is a
              different claim wearing the same digits.
          - >-
              What to write instead. The gain, and the seasons it belongs to, in one sentence. It is
              longer and it stays true whatever next summer does.
        assumes:
          - a trial measures what happened under the conditions it happened in
        takeaway: A number from a trial carries the conditions it was measured in, or it is a different claim.
        format: BALLPARK
        question: How many times bigger is the dry-year gain than the wet-year gain?
        answerText: Five and a half times. Eleven per cent in dry years against two in wet ones, and only one of those numbers is on the leaflet.
        why: The two figures come from the same trial and the same four plots. In the two dry seasons WM-712 was eleven per cent ahead. In the wet ones it was two. How many times bigger is a division: 11 ÷ 2 = 5.5. So the gain a farmer gets depends on the season more than five times over, and the leaflet prints the larger of the two numbers with nothing attached to it. Nobody made that number up, which is what makes it a hard problem: it is a true figure that becomes a false claim once the conditions are dropped. The sentence that survives says both parts at once — a big gain in dry seasons, a small one in wet, at this site. It is longer, it costs the headline, and it is still correct next summer whatever the weather does.
        estimate:
          prompt: WM-712 was eleven per cent ahead in the two dry seasons and two per cent ahead in the wet ones, over four seasons at one site.
          question: Pick the dry-year gain and the wet-year gain.
          labels:
            - 11  (per cent ahead in the dry seasons)
            - 2  (per cent ahead in the wet seasons)
            - 4  (seasons in the trial)
            - 16  (plots in the trial)
          values: [11, 2, 4, 16]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 5.5
          tolerance: 0.4
          units: times bigger
          solution: 11 ÷ 2 = 5.5 times bigger in a dry season than a wet one.
          explanation: A true number becomes a false claim once the conditions are dropped from it.
          givens:
            - eleven per cent ahead in dry seasons, two per cent in wet ones
          relationship: How many times = bigger ÷ smaller, compared with each other across the seasons the trial actually had.
      - group: DRY
        task: Say why a dry summer costs yield.
        title: What the crop cannot do without water
        concept: "Same seed, different field: what a plant looks like depends on where it grew"
        place: Drying & Processing Hall
        scene: Osman Toft, the agronomist, has eleven years of yield against summer rain, and a roughly straight line through it. A trainee asks why a plant built out of air minds a dry summer at all.
        guide: >-
          Four steps carry carbon from the air into the grain. Each one has a number beside it
          saying how much it is passing today. Put them in the order the carbon travels, then
          name the step that is holding everything up. The biggest number on the board is not
          the answer, and neither is the first step.
        background:
          - >-
              What a governing step is. Along any path, the step passing the least decides the total.
              Improving any other step changes nothing at all, which is why naming the right one
              matters more than describing the path.
          - >-
              Why the pores are the awkward step. A leaf takes carbon dioxide in through tiny pores,
              and loses water out through the same pores. There is no way to open them for one and
              not the other. In a dry summer the plant shuts them to save water, and the carbon stops
              coming in.
          - >-
              What the other steps are doing. The leaves are catching as much light as ever, and the
              machinery inside them still works. The roots are moving water, not carbon. The number
              beside each step is what separates a suspect from the answer.
        assumes:
          - plants take carbon dioxide in through tiny pores in their leaves
        takeaway: The opening a leaf takes carbon in through is the opening it loses water through.
        format: CHAIN
        question: Trace the path carbon takes into the grain, and name the step holding it up in a dry summer.
        answerText: The pores. They are shut to save water, so carbon dioxide cannot get in — and nothing the leaves or the roots do can make up for it.
        why: Almost all the weight of a harvest arrives as carbon dioxide through tiny pores in the leaves. Water vapour leaves through those same pores. In a dry summer the plant shuts them, which is the right choice for staying alive and stops the carbon coming in at the same moment. Look at the numbers on the board. The leaves are catching light as well as ever, the machinery inside them could handle far more carbon than is arriving, and the roots are busy with water. Only one step has fallen, and it has fallen a long way. That is what a governing step means: the step passing the least decides the total, so improving any of the others changes nothing while the pores are shut. Toft's straight line is the same fact drawn over eleven summers, and it is why breeders talk about getting more grain per drop of water rather than about beating drought.
        chain:
          links:
            - id: light
              label: Light caught
              transfers: 780 units, same as a wet year
            - id: pores
              label: Carbon let in
              transfers: 6 units, was 21
            - id: inside
              label: Sugar made
              transfers: room for 24 units
            - id: grain
              label: Sugar to the grain
              transfers: room for 19 units
          order: [light, pores, inside, grain]
          governing: pores
          distractor: light

  # ---------------------------------------------------------------- day 5
  - title: What comes with what you wanted
    objective: Find out what else the resistance gene is dragging behind it.
    briefing: The resistant lines are shorter, and nobody bred them that way.
    stake: "Friday, and the plan is signed. WM-712 goes forward, forty of the sixty batches get regrown, and Qureshi has put in writing what she thinks of that. In the glasshouse, every line carrying the resistance gene is noticeably shorter than its sisters. Nobody chose that. Today you work out what came along with the gene, and whether the test can still be trusted here."
    takeaway: Genes near each other are inherited together, which is what makes markers work and what makes them expensive.
    stops:
      - group: CROSS
        task: Explain why the resistant plants are short.
        title: What came with the gene
        place: Crossing Hall
        scene: Every line carrying the resistance is twelve to fifteen centimetres shorter than its sisters without it. The parent it came from was short. The parent it was bred back into is tall.
        guide: >-
          Four explanations for shorter resistant plants. Ask of each whether it would
          affect every plant or only the ones carrying the new gene. Genes that sit
          close together on a chromosome tend to travel together. Splitting them needs a
          rare swap, which is why so many offspring get grown.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - genes sit in fixed places along a chromosome, in a fixed order
        takeaway: A chromosome is passed on in stretches, so a wanted gene arrives with its neighbours.
        format: CHOICE
        question: Why are the resistant plants shorter?
        answerText: The resistance arrived with a piece of the short parent's chromosome. Splitting them needs a rare swap in a very small gap.
        why: Genes sit in a row along a chromosome, and a chromosome is handed on in stretches rather than gene by gene. So a gene you want arrives with whatever sits beside it. Here the resistance came from a short parent, and a piece of that parent's chromosome came with it. Splitting the two needs a swap in exactly that gap, which is rare. So you grow thousands, and look for the one plant where it happened.
        choices:
          - They carry the short parent's neighbouring genes along with the resistance.
          - Fighting off the disease costs the plant its growth.
          - Breeding back to one parent weakens the plants each time.
          - The short ones got picked by accident in the glasshouse.
        answer: They carry the short parent's neighbouring genes along with the resistance.
        rebuttals:
          - Fighting a disease does cost a plant something, and not a steady fifteen centimetres.
          - Breeding back recovers the tall parent. It does not weaken anything by itself.
          - The picking in the bay was done on the DNA test. Nobody measured height at all.
      - group: LAB
        task: Set the cut-off, freeze it, and score it on plants it has never seen.
        title: A test fitted where it worked
        concept: A fair test needs a control and everything else kept the same
        place: Molecular Laboratory
        scene: >-
          DNA is the set of instructions inside every seed. A marker is a short piece of
          DNA that sits near the gene you care about. Testing the marker is a cheap way
          to ask about the gene. This marker was worked out on the first population.
          Nakagawa now has a new cross, and a hundred plants scored both ways. A
          cut-off's score is how many of a hundred plants it calls right.
        guide: >-
          Drag the cut-off and watch the score on the first population. Remember what
          that score is. The marker was worked out on these plants, so a cut-off tuned
          on them fits these plants as well as the trait. When you have picked one,
          press freeze. Freezing locks your cut-off and opens the new cross, which it
          has never seen. Report what it gets there.
        background:
          - >-
              Why a marker works at all. The marker is not the gene. It is a piece of DNA
              close enough to the gene that the two are usually passed on together. So a
              plant with the marker usually has the gene. How well that holds depends on how
              close the two are in that family of plants.
          - >-
              Why a new parent changes the answer. Bring the trait in from a different
              parent and the DNA around the gene comes too. The marker and the gene may now
              sit further apart, or the marker may travel with the wrong copy of the gene.
              The marker did not change. The plants did.
          - >-
              Why you freeze before you look. A cut-off picked on the first population is
              flattered by it, because it was picked using those plants. The new cross is
              the honest test, and it is only a test while the cut-off was chosen without
              it. That is what pressing freeze means: you have decided, and now you find
              out.
        assumes:
          - a test predicts a trait by sitting near the gene, in the population it was worked out on
        takeaway: A rule fitted on one set of plants has to be scored on a set it has never seen.
        format: HOLDOUT
        question: Set the cut-off on the plants the test was worked out on. Then freeze it and score it on the new cross. What does it get?
        answerText: About 94 per cent, from a cut-off near 48. The cut-off at 63 scores 99 on the old plants and 79 on the new cross, and twenty of those points were noise.
        why: A cut-off chosen on one population partly fits that population's accidents, and accidents do not have to repeat. A broad shelf of good scores is worth trusting. It survives being frozen and used on a new cross. A sharp peak at one exact value does not. That peak was fitted to noise. Scoring on plants the rule has never seen is the only way to tell the two apart.
        holdout:
          axis:
            label: Marker score cut-off
            unit: ""
            min: 20
            max: 90
            step: 1
          unit: "%"
          fitLabel: Mapping population, 240 plants
          testLabel: A new donor cross, never seen
          pass: 92

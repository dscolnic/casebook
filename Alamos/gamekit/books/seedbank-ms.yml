  - title: What goes in the crossing block
    objective: Decide what the next seven years are made of, on the last day it can be changed.
    briefing: The block is drilled tomorrow. After that the parents are fixed.
    stake: "Thursday. The crossing block goes in tomorrow morning, and it decides what the programme works on until 2033. A cross made in it is a line in four years and a release in seven. Volpe has her list and Qureshi has hers, and this year they overlap. There is room for eight crosses. Today you fix the eight. After tomorrow nothing this season can be changed."
    takeaway: A crossing block is a decision about a decade, made in one morning with what is to hand.
    stops:
      - group: CROSS
        task: Spend the eight slots, and keep both resistance questions answered.
        title: Eight crossing commitments
        concept: Choosing which plants to breed from, and what that costs
        place: Crossing Hall
        scene: The crossing board has eight slots for the next two years. Volpe wants yield crosses. Qureshi wants new resistance brought in. The elite line still needs the second gene.
        guide: >-
          Eight slots for two years, and more requests than slots. Watch the list of
          questions rather than the board: it shows what the programme can still answer
          with your plan. Every package you commit is a question answered and one given
          up, and one request can wait a season without costing anything.
        background:
          - >-
              What defended means here. One resistance gene gets beaten eventually. A line
              carrying two takes far longer to beat. Getting the second gene into the best
              line is what keeps everything else the programme has built worth using.
          - >-
              Why new resistance is worth slots at all. Bringing resistance in from an
              unrelated plant is slow and produces nothing sellable for years. It is also
              the only way to have a third gene ready when the second one fails.
          - >-
              Why some work can wait. A question whose answer will be just as useful next
              season is not competing with one that has to be answered before the elite line
              is released.
        assumes:
          - a cross ties up glasshouse space and staff for several seasons
          - closely related parents share the same weaknesses
        takeaway: A breeding plan is the set of questions it chooses to answer, and every slot spent delays another.
        format: ALLOCATE
        question: Which packages keep the programme defended without spending the board on work that can wait?
        allocate:

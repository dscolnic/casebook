      - group: DRY
        task: Sort the harvest bags before the store closes.
        title: Covered early, or open to the wind
        concept: "Two parents each give half, so the young are not copies"
        place: Drying & Processing Hall
        scene: Two hours of bags have to be cleared. A head that was bagged before it flowered could only pollinate itself. A head left open took whatever the wind brought.
        guide: >-
          Two bins. Ask when the cover went on. Before the flowers opened, the plant
          pollinated itself and the line stays the same. Open at flowering, and the father
          could be any plant upwind. The words on the label will not tell you.
        background:
          - >-
              Why the date decides it. A cover put on before flowering keeps other pollen out. A cover
              put on afterwards keeps nothing out, because the pollination has already happened.
          - >-
              Why it matters at the store door. Seed from a selfed head grows into the same line
              again. Seed with an unknown father is something else, and it looks exactly the same in
              the bag.

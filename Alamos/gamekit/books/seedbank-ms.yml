        answerText: >-
          Start the grow-out near 88 % germination. It fires with the reading the grow-out needs, and
          the lot is under way before viability reaches the 85 % floor.
        why: The floor is where the seed stops being good enough. It is the wrong moment to start planning, because everything you would do next takes time. Booking a field takes several updates. Starting the grow-out takes another. Set the thresholds before the numbers arrive, and hindsight cannot quietly move them later. Reserve at ninety and start at eighty-six, and both land in time. Wait for eighty-five and the work begins after the line has been crossed.
      - group: TRIAL
        task: Say why last year's height difference has gone.
        title: A difference that was the field
        concept: "Same seed, different field: what a plant looks like depends on where it grew"
        place: Field Laboratory
        scene: Last season two pure lines differed by nine centimetres in height, clearly. This season the same lines went onto different plots, and now they do not differ at all. The seed has not changed.
        guide: >-
          Say what the height difference will be this year before the plots are measured. Write
          a number down first. If last year's nine centimetres was the seed, it comes back
          wherever the lines are sown. If it was the ground, it goes away when the ground
          changes.
        background:
          - >-
              Why a prediction first. Any result can be explained afterwards. A number written before
              the measuring is a test of the explanation, and the two explanations here predict
              different numbers.
          - >-
              What the two explanations are. Either the lines really do differ in height, in which case
              the difference travels with the seed, or last year's plots differed — deeper soil, more
              water, less wind — in which case the difference stays with the plots.
              
          - >-
              Why the same line is sown four times. Four plots per line, spread around the field, so
              that no line's score is really a score for one corner of the ground. It is the same idea
              as taking an average instead of measuring one plant.
        assumes:
          - the same line grown in two places can give two different answers
        takeaway: A result that does not survive being grown somewhere else was probably about the somewhere.
        format: VERIFY
        question: Predict this year's height difference between the two lines, then measure the plots.
        answerText: About one centimetre — near enough to nothing. Last year's nine centimetres was the plots, and it did not travel with the seed.
        why: Two explanations were available and they predicted different numbers. If the two lines really differ in height, the difference travels with the seed and shows up again wherever they are sown. If last year's plots differed — deeper soil at that end, more water, some shelter — the difference stays behind with the plots. Measured this season, on new ground, the lines differ by about a centimetre, which is nothing. So last year's nine centimetres was the field. Nobody did anything wrong last season: the plots were measured correctly and the number was real. It was just a number about a piece of ground rather than about a kind of wheat. That is what sowing each line in four scattered plots is for, and why a result that does not survive being grown somewhere else is treated as being about the somewhere.
        verify:
          prediction:
            label: Height difference between the two lines this season
            unit: cm
            min: 0
            max: 15
            step: 0.5
          truth: 1
          passRatio: [0.4, 2.5]
          intervention:
            label: Grow both lines again, on four new plots each
            note: same seed, new ground, everything else kept the same
            outcome: Both lines come up and reach full height on all eight plots.
          measurement:
            label: Measure the height of every plot and take the averages
            note: four plots each, averaged
            cost: 1
            costUnit: afternoons
          unmeasuredMoral: Deciding the lines differ and never growing them again is how a fact about one corner of a field becomes a fact about a variety.

  # ---------------------------------------------------------------- day 8
  - title: What you asked for and what you got
    objective: Predict what one round of selection will actually deliver.
    briefing: The best 20 plots, and what their offspring will be like.
    stake: "Harvest week, and the trial is scored. Volpe has picked the best twenty plots out of two hundred and forty, and wants them all kept. Quiroga says most of that head start is the ground they stood on, and will not travel to next year. Two of the best plots also covered the ground eleven days early. Today you work out what the choosing really buys, and why those two did so well."
    takeaway: What a round of selection returns is the part of the difference that was inherited, and no more.
    stops:
      - group: TRIAL
        task: Predict what the next generation will average.
        title: What one round returns
        place: Field Laboratory
        scene: The trial averages 7.4 tonnes a hectare. The twenty plots Volpe wants to keep average 9.1. Quiroga says about a third of that head start gets passed on.
        guide: >-
          Five numbers, and two belong elsewhere: the number of plots, and a head start
          already worked out for you. Ask what this sum needs. The chosen plots were
          ahead for two reasons, and only one of them gets passed on. So their own
          average is not what the next generation will do.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - a plant's performance is partly what it inherited and partly where it grew
        takeaway: Only the inherited share of an advantage is passed on, and for yield that share is small.
        format: BALLPARK
        question: What should the next generation average?
        answerText: About 7.9 tonnes a hectare — a gain of half a tonne, rather than the full 1.7.
        why: The plots you choose are above average for two reasons. Some of it is the plants, and some of it is the ground they happened to stand on. Only the first travels to the next generation. Here the head start is 1.7 tonnes, and about three tenths of that is inherited, so the gain is roughly half a tonne. Expect 9.1 next year and the disappointment is guaranteed. Expect 7.9 and the programme is honest with itself.
        estimate:
          prompt: The trial averages 7.4 tonnes a hectare and the chosen plots average 9.1. About three tenths of that head start is inherited.
          question: What should the next generation average?
          labels:
            - 7.4 (trial average, t/ha)
            - 9.1 (average of the chosen plots)
            - 0.3 (the share that is inherited)
            - 1.7 (the head start, already worked out)
            - 240 (plots in the trial)
          values: [7.4, 9.1, 0.3, 1.7, 240]
          slots: 3
          template: "{0} + {3} × {2}"
          formula: a+b*c
          correct: [0, 3, 2]
          target: 7.91
          tolerance: 0.15
          units: t/ha next generation
          solution: 7.4 + 0.3 × 1.7 is about 7.9 tonnes a hectare.
          explanation: The chosen plots are 1.7 above average, and most of that was the ground they stood on. Only the inherited share travels.
          givens:
            - The trial averages 7.4 and the chosen plots 9.1
            - About 0.3 of the head start is inherited
          relationship: Next average = the trial average + three tenths of the head start.
      - group: CROSS
        task: Say what holding the release back really costs.
        title: What a season costs
        concept: Deciding with a season that does not come round again
        place: Crossing Hall
        scene: Volpe has the pipeline on the board. Cross to release is seven years, and everything behind WM-712 moves back with it. Qureshi asks what a year of a wheat variety is worth.
        guide: >-
          Four accounts of what a season costs. Ask of each whether it is about this
          line or about everything behind it. The programme shares seasons, ground and
          people. Holding one line back holds back its seed increase, the trial that
          would have used the ground, and the crosses waiting. That lands on lines
          nobody was arguing about.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - a breeding programme moves one generation at a time
        takeaway: The cost of holding something back is rarely paid by the thing being held back.
        format: CHOICE
        question: Why does holding it one season cost more than one season?
        answerText: Everything behind it waits too. One season of delay is paid for by lines that had nothing to do with the argument.
        why: A breeding programme is a queue sharing the same seasons, the same ground and the same people. Hold this line for a year and its seed increase waits. So does the trial that would have used that ground, and the crosses behind it. The bill lands on lines that were never part of the argument. That does not settle whether releasing is right. It makes the price of waiting something everybody can see.
        choices:
          - Everything behind it in the queue waits as well.
          - The line loses its edge as everybody else's wheat improves.
          - Seed held for a year does not grow as well afterwards.
          - The trial results go out of date and have to be repeated.
        answer: Everything behind it in the queue waits as well.
        rebuttals:
          - Other wheat does improve, slowly, and that is not what makes one season expensive.
          - A year in a cold store costs a well-dried sample almost nothing.
          - Trial results do not go out of date. They become another year in the series.
      - group: DRY
        task: Say what explains the best two plots.
        title: Why those two did well
        place: Drying & Processing Hall
        scene: Two of the twenty chosen plots covered the ground eleven days before the rest and flowered four days earlier. Their yields are the best in the trial, and the season went dry after flowering.
        guide: >-
          Four things are different about those two plots, and the yield sheet will give you a
          figure for whatever you set up. Change one of them and grow it. Change two and the
          figure cannot say which one did it. Then set your one back the way it was, because a
          difference that does not come back was never the reason.
        background:
          - >-
              Why one thing at a time. Any two plots differ in dozens of ways at once. A test that
              changes several of them gives a number that fits every story, which is the same as
              having no answer.
          - >-
              What covering the ground early buys. Leaves catch light. Covering the ground eleven days
              sooner means eleven more days of catching it while there is still water in the soil to
              use it with, and this season went dry after flowering.
          - >-
              Why setting it back matters. If the yield falls again when the early cover goes, the
              early cover was doing it. If it stays up, something else was, and the test has saved a
              season of breeding for the wrong thing.
        assumes:
          - a crop builds most of its grain from light caught after it flowers
        takeaway: An early crop catches light while there is still water to use it with.
        format: CONTROL
        question: Which difference between those plots is actually raising the yield?
        answerText: Covering the ground early. Sow the same line to cover early and the yield goes up by a third; take the early cover away and it drops back.
        why: Four things were different about the best two plots. Only one of them holds up when it is tested on its own. Sow plots that cover the ground eleven days early. Keep the seed, the date, the water and the nitrogen the same. The yield goes from 6.2 tonnes to 8.3. Take the early cover away and it drops back to 6.4. That is a real cause. The figure follows the change both ways, and it moves far more than the trial's own wobble. The others do nothing on their own. Flowering four days early is worth less than the wobble. So is where the plot sits, and so is the extra nitrogen. Leaves catch light. This season went dry after flowering. So eleven extra days of catching light, while there was still water to use it with, is eleven days the other plots never got.
        control:
          observable:
            label: Yield from the plot
            unit: tonnes
          variables:
            - id: cover
              label: How early the crop covers the ground
            - id: flower
              label: How early it flowers
            - id: place
              label: Where in the field the plot sits
            - id: nitrogen
              label: How much nitrogen the plot got
          held:
            - the same line of wheat
            - the same sowing date
            - the same water
            - the same plot size
          truth: cover
          baseline: 6.2
          response: 2.1
          noise: 0.3
          hint: The trial can be set up again each season. Change what you want, grow it, and read the yield.
          run: Grow the plot
          commit: Name the one that is doing it

  # ---------------------------------------------------------------- day 9
  - title: The collection is not what the records say
    objective: Find out why the regenerated accessions no longer match their own passports.
    briefing: A genotyping run that was meant to be routine.
    stake: "Thursday. Nakagawa ran a routine DNA test across ninety batches. DNA is the instruction set inside every seed, and it can be read directly. A third of them do not match their records — same numbers, same paperwork, different plants. Sylvie Pirelli has checked the labels twice and found nothing wrong. Qureshi has gone down to the vault and has not come back up. Today you work out what happened to those batches, and whether it happened in the vault or in the field."
    takeaway: A collection can be kept perfectly and still stop being the thing it was.
    stops:
      - group: POP
        task: Open what each result rests on, keep what stands alone, and name what the rest share.
        title: Which evidence shares the grow-out
        place: Genetic Resources Office
        scene: Thirty of ninety batches no longer match their records from the 1990s. Nakagawa has four kinds of evidence on the board. The shelf checks are clean.
        guide: >-
          Open each kind of evidence to see what it was worked out from. Keep the ones
          that stand apart from the repeated small grow-outs, and untick the ones that
          inherit them. Then name what the failing ones share. The shelf checks being
          clean is itself evidence about where the drift did not come from.
        background:
          - >-
              What repeated small grow-outs do. Growing a batch back from only a few plants
              loses some of its variety by chance, and doing that again and again keeps
              losing more. The result looks exactly like a collection that has drifted away
              from its old records — because it has, through its own upkeep.
          - >-
              Why clean shelves matter. If the storage or the labelling were at fault, the
              shelf checks would show it. Clean shelves point away from an accident and
              towards something in how the seed has been renewed.
          - >-
              Why some evidence survives. Germination tests and the vault log record how
              seed was handled, not what genes it carries. That is why they can test the
              grow-out history instead of repeating it.
        assumes:
          - a result can depend on how something was handled, as well as on today's test
          - evidence is only independent if it does not share the important step
        takeaway: Several results can agree because they share one history, and that is not several reasons.
        format: TRACE
        question: Which results inherit the repeated small grow-outs, and which stand apart from them?
        trace:
          hint: Open each result and inspect what it rests on. Name the source shared by the genetic shifts, but do not discard a channel whose evidence path never uses it.
          target: regen_history
          resources:
            - id: regen_history
              label: Recorded grow-out history
            - id: genotype_records
              label: The 1994 record and the current genotype panel
            - id: archive_subsample
              label: Archived comparison subsample
            - id: store_records
              label: The germination assay and the storage log
          channels:
            - id: frequency
              label: Allele-frequency comparison
              reading: 18 of 30 loci have moved more than 5 percentage points from the 1994 record
              depends:
                - genotype_records
                - regen_history
            - id: rare
              label: Rare-variant comparison
              reading: 9 alleles recorded in 1994 at under 5% are absent from the current sample
              depends:
                - genotype_records
                - regen_history
            - id: archive
              label: Archived-subsample comparison
              reading: The archived subsample matches the current panel, not the 1994 record
              depends:
                - archive_subsample
                - genotype_records
                - regen_history
            - id: viability
              label: Germination panel
              reading: Germination 91%, and the store has held minus 18 for 28 years
              depends:
                - store_records
          independent:
            - viability
          commit: Correct it
        answerText: The genetic results all share the repeated grow-outs. Keep the germination evidence. It shows the store did its job.
        why: Three of the four kinds of evidence rest on the same grow-out history, so their agreement is one cause counted three times. The germination evidence does not. It rests on tests of whether the seed grows, and it says the seed is fine. Opening what each one depends on splits the story in two. The store kept the seed alive. The grow-outs changed what was in it. Throwing out the germination evidence would lose the half that stands alone.
      - group: LAB
        task: Spend the two checks on evidence that could change which batch gets the slot.
        title: The vial nobody has grown
        place: Molecular Laboratory
        scene: Two of the fifty batches carry the resistance gene, and the screenhouse can grow only one this season. The full vial has been grown out three times. The thin one has never been grown out at all.
        guide: >-
          Four options, and two facts to weigh: how much seed there is, and how many
          times it has been grown out. Ask of each which of the two it uses. The amount
          in the vial says nothing about what is in it. Every grow-out is another chance
          for rare things to be left out.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - every grow-out is a chance for a batch to drift from what it was
          - a small lot of living seed can usually be built back up
        takeaway: Copies of copies drift. The one nobody has copied is the one that still holds what was collected.
        format: CHOICE
        question: One vial is full and has been grown out three times. The other is thin and never grown. Which is closer to the original plant?
        answerText: The thin one. Every grow-out is a chance to drift, and that vial has had none.
        why: A seed batch is not a photograph. Every time it is grown out, only some of the plants set seed, and the batch that comes back is slightly different from the batch that went in. Do that three times and the difference adds up. The thin vial has never been through that, so whatever was collected is still in it. Being thin is a problem you can fix — three hundred seeds carefully grown is a full vial again. Being drifted is not a problem you can fix, because there is nothing left to go back to.
        choices:
          - The thin one, because it has never been grown out
          - The full one, because there is more of it
          - The full one, because it has been checked three times
          - Neither, since both have been in store the same time
        answer: The thin one, because it has never been grown out
        rebuttals:
          - How much there is says nothing about what is in it.
          - A grow-out is not a check. It is a chance for the batch to change.
          - Time in the cold changes a batch far less than a season in a field.
        call: Choose the batch worth the slot
        setup: The screenhouse can grow one of the two this season.
      - group: VAULT
        task: Name the step that failed.
        title: What the store did right
        place: Seed Vault
        scene: Qureshi wants one sentence for the board. It has to name what failed, rather than the room it happened near. The vault log covers twenty-eight years with no fault.
        guide: >-
          Follow the seed's path from the freezer back into the store, and name the step where
          it lost what it lost. Each step has a note saying how well it did its job. The
          freezer is the biggest thing on the board and it is not automatically the answer.
        background:
          - >-
              What the freezer does. Cold keeps seed alive for longer. The log covers twenty-eight
              years with no fault, and seed from the affected packets still grows well, which is what
              a working freezer looks like from outside.
          - >-
              What a grow-out is. Growing a batch out to make fresh seed. It is a sampling step, so
              how many plants went into it decides how much of the batch came back.
          - >-
              Why naming the step matters. The fix follows the step. Call this a storage failure and
              the money goes to a freezer that worked; call it a grow-out failure and the money goes
              to plant counts and pollen distance, which is where it was lost.
        assumes:
          - a store keeps what it is given rather than improving it
        takeaway: Storage held what it was handed. The loss happened in the field, on the way back in.
        format: CHAIN
        question: Follow the seed's path and name the step where the batch lost what it lost.
        answerText: The grow-out. Too few plants went into it, so what came back was a sample of a sample — and the freezer held that faithfully for thirty years.
        why: A store keeps what it is handed. The freezer log covers twenty-eight years without a fault and seed from the affected packets still grows well, so the cold end of this path did its job. The step that did not is the grow-out. Growing a batch out to make fresh seed means taking a sample of it, and this one used thirty plants where two hundred were needed. Whatever those thirty did not carry was gone before the packets went back on the shelf, and no freezer restores it. The label and the record are part of the seed, which is why this matters for the sentence Qureshi wants: naming the room sends money to equipment that worked. Naming the step sends it to plant counts and pollen distance, which is where the collection is actually losing things.
        chain:
          links:
            - id: intake
              label: Seed dried and packed
              transfers: 6 per cent moisture, as specified
            - id: freezer
              label: Held in the freezer
              transfers: 28 years, no fault
            - id: growout
              label: Grown out for fresh seed
              transfers: 30 plants, needed 200
            - id: back
              label: Packed and shelved again
              transfers: 91 in 100 still grow
          order: [intake, freezer, growout, back]
          governing: growout
          distractor: freezer
      - group: LAB
        task: Decide what gets tested early, and what the finished line must still show.
        title: Gene present, resistance working?
        concept: Disease arrives, and resistance is a trait like any other
        place: Molecular Laboratory
        scene: Nakagawa can run the DNA test on two-leaf seedlings. On final plants she can also check whether the gene is switched on after rust, and put real rust on the leaves.
        guide: >-
          Four ways to order the tests. Ask of each what a DNA test can and cannot show.
          Carrying a gene is not the same as using it. Between the gene and a plant that
          survives rust sit several steps, and only one kind of test asks whether the
          whole chain works.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - a nearby marker can come apart from the gene it stands for
          - a gene has to be switched on before it does anything
        takeaway: DNA says what a plant carries. Only a real test says whether it works.
        format: CHOICE
        question: The DNA test says the gene is there. What has it not shown?
        answerText: Use the DNA test early to clear seedlings. Then make the final line show the gene switching on, and shrug off real rust.
        why: The DNA test is worth running early, because it clears out most seedlings months before rust could be used. It is not proof. The marker sits near the gene rather than inside it, and the two can come apart. Even the gene itself only says what the plant carries. It has to switch that gene on when rust arrives. So the last plants get real rust put on them.
        choices:
          - Use the DNA test early, then test the final line against rust.
          - Check the switching every generation. The final rust test is then unnecessary.
          - Put rust on every generation, and the DNA test at the end.
          - Use the DNA test early and late. Carrying the gene is enough.
        answer: Put rust on every generation, and the DNA test at the end.
        rebuttals:
          - Switching on is worth knowing, and the plant still has to beat the rust in the end.
          - Waiting for real rust every generation throws away the months the DNA test buys.
          - A nearby marker can come apart from the gene, and carrying a gene does not prove it works.
  # ---------------------------------------------------------------- day 15
      - group: POP
        task: Work out what happened to the resistance in this batch.
        title: What was lost, and when
        concept: Variety inside a collection, and why losing it is hard to undo
        place: Genetic Resources Office
        scene: Ivanescu has the 1994 field notes for the drifted batch. The collector saw rust on the crop, and noted that about one plant in twenty stayed clean. Today's sample has none.
        guide: >-
          Work out how many resistant plants a grow-out of thirty should have picked up. Five
          plants in every hundred carried the resistance, so take the thirty plants, multiply by
          five, and share the answer across the hundred. One tile is the two hundred plants the
          standard asks for, which is the number nobody used.
        background:
          - >-
              What one in twenty means. Five plants in every hundred carried the resistance in 1994. It
              was there, and it was rare, and rare is the whole problem.
          - >-
              What a grow-out of thirty does. It takes thirty plants and lets them make the next batch.
              With one in twenty carrying the gene, thirty plants are expected to include one or two —
              and quite often none at all, the way five coin tosses sometimes give no heads.
          - >-
              Why nothing notices. The seed that comes back germinates well, looks right and passes every
              routine check. What is missing is a gene nobody tested for, and no freezer puts it back
              once none of the plants that went in carried it.
        assumes:
          - something rare in a population can be missed altogether when a few plants are taken
        takeaway: A gene that has vanished was not necessarily destroyed. It may only have failed to be picked.
        format: BALLPARK
        question: How many resistant plants should a grow-out of thirty have picked up?
        answerText: One or two — and often none. With two hundred plants it would have been ten, which is why the size of a grow-out decides what survives it.
        why: In 1994 five plants in every hundred were resistant, which is one in twenty. A grow-out of thirty plants is therefore expected to include 30 × 5 ÷ 100 = 1.5 of them — one or two, and often none, in the same way five coin tosses sometimes give no heads. So the gene did not have to be destroyed to disappear. It only had to be missed. Two hundred plants would have picked up about ten of them, which is why the standard says two hundred and why the missing plant count on the 1994 sheet matters so much. And nothing about the batch that came back looks wrong: it germinates well, it looks right, and it passes every routine check, because what is gone is a gene nobody tests for until a rust arrives that needs it.
        estimate:
          prompt: In 1994 about one plant in twenty was resistant. The grow-out used thirty plants. The standard is two hundred.
          question: Pick the number of plants, how many in every hundred were resistant, and the hundred.
          labels:
            - 30  (plants used in the grow-out)
            - 5  (resistant in every hundred, which is one in twenty)
            - 100  (the hundred they are counted out of)
            - 200  (plants the standard asks for)
          values: [30, 5, 100, 200]
          slots: 3
          template: '{0} × {1} ÷ {2}'
          formula: a*b/c
          correct: [0, 1, 2]
          target: 1.5
          tolerance: 0.3
          units: resistant plants expected
          solution: 30 × 5 ÷ 100 = 1.5 plants — one or two, often none. Two hundred plants would give 10.
          explanation: The gene did not have to be destroyed to disappear. It only had to be missed.
          givens:
            - five plants in every hundred were resistant in 1994
            - the grow-out used thirty plants, against a standard of two hundred
          relationship: Expected number = how many × the fraction expected, counted out of a hundred. A small grow-out expects one or two of anything rare, and often none.
      - group: VAULT
        task: Say why the farm may hold what the vault lost.
        title: The copy that was never in the vault
        place: Seed Vault
        scene: Fenn's old wheats are growing in the station plots. His family has grown one of them without a break since before Wellmere existed. Rust arrives there most years.
        guide: >-
          Four reasons the field copy might hold what the vault lost. Ask of each
          whether it names a reason or just a difference. Fresher and bigger are not
          reasons. Rust arriving every year means resistant plants leave more seed. In a
          clean nursery, resistance had no advantage at all.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - a crop growing where a disease turns up is being tested by it every year
        takeaway: A population kept in the ground keeps being tested by the thing you might one day need it for.
        format: CHOICE
        question: Why is Fenn's field likely to hold what the vault lost?
        answerText: Rust has tested his crop every year the vault stood still. What survives a test keeps being there; what is never tested can drift away.
        why: Rust has come through Fenn's field most years. In a rust year the plants that shrug it off set more seed, and their share of the next crop goes up. Nobody planned that. It happens because the disease is there. The vault's grow-outs were done in clean nurseries, where resistance bought a plant nothing, so anything rare could quietly vanish. His field is not a frozen copy of 1994. It may be better than one.
        choices:
          - Rust has tested it every year the vault stood still.
          - His seed is fresher, so it is more complete.
          - He has more seed than the vault has of that batch.
          - Farm-saved seed changes faster than stored seed.
        answer: Rust has tested it every year the vault stood still.
        rebuttals:
          - Freshness decides whether seed grows. It says nothing about which genes are in it.
          - Quantity is not the problem. The vault has plenty of a population that has lost the gene.
          - New genes appear far too rarely to put one back in thirty years.

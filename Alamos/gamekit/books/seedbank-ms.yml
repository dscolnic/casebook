        task: Fit the disagreement both ways, then use the direct gene test to separate them.
        title: One disagreement, two possible causes
        place: Molecular Laboratory
        scene: "Nakagawa has four hundred plants scored two ways: by a DNA test, and by whether they fell ill. Eleven carry the marker and still fell ill. The test's own controls look clean."
        guide: >-
          Two controls slide the amount of swapping and the amount of test error along a
          family of mixes that all give eleven disagreements in four hundred plants. See
          how wide that family is before naming a cause. Then bring in the direct gene
          test, which fails for one explanation and not the other.
        background:
          - >-
              Why the disagreement rate alone cannot decide. The marker sits near the gene
              but not on it, so sometimes they are separated when plants are made. A test
              that occasionally misreads produces the same number of disagreements. Eleven
              in four hundred fits several mixtures of the two.
          - >-
              What the direct gene test does. It asks about the gene itself instead of the
              marker nearby, so swapping cannot affect it. A plant that has the gene and
              still fell ill is a test error. A plant that does not have the gene was a
              swap.
          - >-
              Why clean controls are not enough. Controls show the test worked on known
              material. They cannot catch a failure in one particular plant's sample, which
              is exactly what produces a handful of odd results in four hundred.
        assumes:
          - a DNA test looks for a chosen stretch of DNA
          - a marker sits near a gene rather than inside it
          - a plant swaps pieces between its two copies of a chromosome when it makes seed
        takeaway: A test can be right about the marker and still be wrong about the plant.
        format: DEGENERACY
        question: Which mixes of swapping and test error fit the disagreement, and which one survives the direct gene test?
        degeneracy:
          hint: Use the first panel to find more than one pair that fits. Then open the PCR check aimed inside the resistance gene and keep only combinations that fit both measurements.
          controls:
            - id: recombination
              label: Recombination fraction
              min: 0
              max: 0.08
              step: 0.01
              unit: fraction
            - id: marker_error
              label: Marker-assay error fraction
              min: 0
              max: 0.08
              step: 0.01
              unit: fraction
          observable:
            label: Marker–phenotype disagreement, 11 of 400 in this generation
          locus:
            - a: 0
              b: 0.04
            - a: 0.01
              b: 0.03
            - a: 0.02
              b: 0.02
            - a: 0.03
              b: 0.01
            - a: 0.04
              b: 0
          second:
            label: PCR aimed inside the resistance gene itself, on the 11 discordant plants
            apply: Run the direct-gene assay
            locus:
              - a: 0.02
                b: 0
              - a: 0.04
                b: 0
              - a: 0.06
                b: 0
          truth:
            a: 0.04
            b: 0
          tolerance:
            a: 0.005
            b: 0.005
          commit: Report it
        answerText: The first result fits several mixes of swapping and test error. Testing the gene itself rules out the misreading, and swapping is what is left — about four plants in a hundred.
        why: The DNA test here does not look at the resistance gene. It looks at a marker sitting near it. Near is not inside. When a plant makes seed, its two copies of a chromosome swap pieces, and a marker close to a gene usually travels with it and sometimes does not. So eleven disagreements could be swapping, or a test that misreads. One number cannot separate those two. A second test aimed at the gene itself can.
      - group: POP
        task: Pull the plants the rule asks for.
        title: What the crew is pulling today
        concept: "Disease arrives, and resistance is a trait like any other"
        place: Genetic Resources Office
        scene: The rogueing crew works to one rule, chalked at the end of the row. It gets rewritten when the season turns. Nobody walks the rows to tell them.
        guide: >-
          Pull what the rule asks for and leave the rest. The chalk changes during the
          morning and nobody says so. What counts is the plants either side of a change,
          because they show whether you are reading the board or working from memory.
        background:
          - >-
              Why the rule changes. Early on the crew is pulling anything that is not the line. Once
              rust arrives they are looking for something else, and the plants that were being pulled
              an hour ago are now the ones worth keeping.
          - >-
              Why it is hard to spot. A pulled plant leaves a gap and nothing else. Nobody can tell
              afterwards which rule it was pulled under.
        assumes:
          - a work rule can be changed while the work is still going on
        takeaway: The cost of a rule that has changed is paid by whoever is still using the old one.
        format: SPOT
        question: Pull to the chalk at the end of the row, and keep checking the chalk.
        answerText: Read the chalk, not the row. Every change leaves a few minutes when the old rule still feels right.
        why: >-
          Three rules run across the morning and each one wants different plants. Anything that
          is not the line, then anything flowering early, then anything with rust on it. A
          plant can match two rules at once, and that is what makes the change cost something.
          What the panel scores is the plants either side of a change. Most of the row is
          wanted by neither rule, so leaving those alone proves nothing. The damage is hard to
          see afterwards. A plant pulled under the old rule leaves a gap in the row, and the
          gap does not say why it is there. That is why the nursery rule is to read the chalk
          at the start of every row, not at the start of the morning.
        spot:
          duration: 40
          switchEvery: 12
          pass: 0.75
          hint: The chalk at the end of the row is the rule, and it changes without warning.
          targets:
            - id: p1
              label: Off-type, flowering early
              tags: [offtype, early]
            - id: p2
              label: Off-type, no rust
              tags: [offtype, clean]
            - id: p3
              label: True to type, rusted
              tags: [totype, rusted]
            - id: p4
              label: True to type, early
              tags: [totype, early]
            - id: p5
              label: Volunteer from last year
              tags: [offtype, volunteer]
            - id: p6
              label: True to type, clean
              tags: [totype, clean]
            - id: p7
              label: Tall off-type, rusted
              tags: [offtype, rusted]
            - id: p8
              label: Late flowering, clean
              tags: [totype, late]
          rules:
            - say: Anything that is not the line
              want: [offtype]
            - say: Anything flowering early
              want: [early]
            - say: Anything with rust
              want: [rusted]
          commit: Open the row
  - title: What the season established
    objective: Say what Wellmere knows now, what it cost, and what changes.
    briefing: The block is in. The rust is here. The collection is smaller than the catalogue says.
    stake: "Friday, and the season is set. The crossing block went in yesterday. WM-712 was released with its weakness written on the label. The drifted batches are on a list that will take fifteen years to work through. The board meets on Monday, and Qureshi has to explain the season to people who fund gene banks. Today you settle what the season established, and what it cost to find out."
    takeaway: A collection is only as good as the last time each accession was grown, and now Wellmere knows which.
    stops:
      - group: VAULT
        task: Say what the season established about the collection.
        title: What the catalogue says and what is there
        concept: A label and a record are part of the seed
        place: Seed Vault
        scene: Ninety batches were tested. Thirty had changed, and every one of those had been regrown at least twice. The sixty regrown once or never still match. Nine thousand batches have been regrown twice or more.
        guide: >-
          Turn the test into a number for the risky group, and only for that group. Every batch
          that had changed was one that had been regrown twice or more, and the store holds nine
          thousand of those. One tile is the whole collection, which is the number the board
          must not be given.
        background:
          - >-
              What the test showed. All thirty of the changed batches came from the regrown-twice group,
              and none of the sixty from outside it had changed. That points hard at regrowing as the
              risky step.
          - >-
              What it did not show. How many batches nobody tested have changed. Most of the collection
              has never been regrown at all, and that is the group where nothing was found.
          - >-
              What the honest sentence sounds like. A share, the group it applies to, and the size of
              that group: about a third of nine thousand regrown batches, which is around three
              thousand. That is not the same sentence as a third of the collection.
        assumes:
          - a sample can support a statement about the group it came from
        takeaway: A sample can point at a risky group without proving how many in it are affected.
        format: BALLPARK
        question: What number of batches does this season's test put at risk?
        answerText: About three thousand — a third of the nine thousand that have been regrown twice or more. Not a third of the whole collection, which is the sentence the board must not be handed.
        why: Thirty of the ninety tested batches had changed, and every one of the thirty had been regrown twice or more. So the share that matters is a third, and the group it applies to is the nine thousand batches that have been regrown twice or more: 9,000 × 0.33 ≈ 3,000. That is the honest number. Doing the same sum on the whole collection gives thirteen thousand, and it is a claim about batches nobody tested — most of which have never been regrown at all, which is exactly the group where nothing was found. Both numbers come from the same test. Only one of them is a statement the test supports, and the board will quote whichever sentence it is given. That is why the group has to travel with the share every time it is written down.
        estimate:
          prompt: A third of the tested batches had changed, and all of them came from the regrown-twice group. The store holds nine thousand batches regrown twice or more, and forty-one thousand in total.
          question: Pick the group the test applies to, and the share of it that had changed.
          labels:
            - 9000  (batches regrown twice or more)
            - 0.33  (the share of those that had changed)
            - 41000  (batches in the whole collection)
            - 60  (tested batches that still match)
          values: [9000, 0.33, 41000, 60]
          slots: 2
          template: '{0} × {1}'
          formula: a*b
          correct: [0, 1]
          target: 2970
          tolerance: 200
          units: batches at risk
          solution: 9,000 × 0.33 ≈ 3,000 batches in the regrown group. The same sum on 41,000 gives 13,500, which the test cannot support.
          explanation: A third of the risky group is about three thousand. A third of the collection is a claim about batches nobody tested.
          givens:
            - thirty of ninety tested batches had changed, all of them regrown twice or more
            - nine thousand batches have been regrown twice or more
          relationship: Part = whole × share, and the whole here is the group the sample came from rather than the whole collection.
      - group: TRIAL
        task: Say how the season's result should be written up.
        title: One site, one year, again
        concept: "Repeats and averages: one plant proves nothing"
        place: Field Laboratory
        scene: The trial is scored and the lines are chosen. The summary goes to a board that will remember one number. It was a dry season, at one site.
        guide: >-
          Four ways to write one result. Ask of each where the conditions sit next to
          the number. A footnote is not the same sentence. The chosen plots are worse as
          a headline, because they were picked partly for their ground. And holding it
          back treats a limited result as no result.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - a trial's conclusions belong to the conditions it ran under
        takeaway: The sentence worth writing is the one that survives being quoted on its own.
        format: CHOICE
        question: How should this season's result be summarised?
        answerText: Report the trial-wide gain with the dry season and the site in the same sentence. Those conditions are part of the number.
        why: Strip the conditions off a yield number and it turns into a claim nobody tested. This season's gain belongs to one site in a dry year. The chosen plots are worse still as a headline. They were picked after the results were seen, so their advantage includes lucky ground. Putting the site and the season in the same sentence is not caution. It is what the number means.
        choices:
          - Report the whole-trial gain, with the season and site named.
          - Report the bigger figure from the chosen plots only.
          - Report the whole-trial gain, with conditions in a footnote.
          - Hold the result back until another season gives the same number.
        answer: Report the whole-trial gain, with the season and site named.
        rebuttals:
          - The chosen plots were picked after the results were seen, so their advantage includes lucky ground.
          - A headline travels without its footnote, and turns a conditional result into a general one.
          - A second season tests how far the result travels. The first season's result is still real.
      - group: DRY
        task: Say what the long record is worth keeping for.
        title: Twelve years, and what they are for
        place: Drying & Processing Hall
        scene: Toft's records of cover, flowering and weather now run to twelve seasons. Nobody has ever asked for the whole series. This year two of them explained why the best plots pulled away.
        guide: >-
          Work out what an ordinary summer's rain is here, by averaging the twelve seasons on
          the sheet. The total is given; share it out across the number of seasons. One tile is
          this summer's rain, which is the number you are trying to place rather than part of
          the average.
        background:
          - >-
              Why one season cannot be read alone. This summer gave 118 millimetres. On its own that
              is just a number. Against twelve seasons it turns out to be the second driest, and that
              is what makes the yield difference mean something.
          - >-
              What an average is for. It says what is ordinary, so anything can be compared with it.
              Twelve numbers give a fair idea. Two or three would not, because one odd season would
              pull the answer around.
          - >-
              Why it can only be started early. The weather record can be borrowed from the airfield.
              Cover and flowering cannot be borrowed from anywhere, because those crops are gone. A
              measurement nobody asked for in 2014 is the reason this season can be read at all.
        assumes:
          - a long record lets one season be compared against the others
        takeaway: A series of measurements is worth more every year, and it can only be started early.
        format: BALLPARK
        question: What does an ordinary summer give here, across the twelve seasons on the sheet?
        answerText: About 196 millimetres. This summer gave 118, which makes it the second driest of the twelve — and that is only knowable because somebody wrote down the other eleven.
        why: An average says what is ordinary. The twelve summers on Toft's sheet add up to 2,352 millimetres of rain, so the average is 2,352 ÷ 12 = 196 millimetres. This summer gave 118. That is a long way below ordinary — the second driest of the twelve — and it is the fact that makes the rest of the season readable. Without the twelve, 118 is just a number, and the best plots pulling away is just something that happened. With them, the station can say the good plots did well in a season near the dry end of what this place does, which is a sentence somebody can use when choosing what to sow next year. And note which half of the record could have been rebuilt later. The rain can be borrowed from the airfield. Cover and flowering cannot, because those crops are gone, so the measurements nobody asked for in 2014 are the ones doing the work now.
        estimate:
          prompt: The twelve summers on the sheet add up to 2,352 millimetres of rain. This summer gave 118.
          question: Pick the total rain across the twelve seasons and the number of seasons.
          labels:
            - 2352  (millimetres, all twelve summers added up)
            - 12  (seasons on the sheet)
            - 118  (millimetres this summer)
            - 2  (records that explained the best plots)
          values: [2352, 12, 118, 2]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 196
          tolerance: 8
          units: millimetres in an ordinary summer
          solution: 2,352 ÷ 12 = 196 millimetres, against 118 this summer.
          explanation: An average says what is ordinary. It is what makes a single season readable.
          givens:
            - the twelve summers add up to 2,352 mm
            - this summer gave 118 mm
          relationship: Average = total ÷ how many. Twelve seasons give a fair idea of ordinary; two or three would not.

# --------------------------------------------------------------- the warm-ups
warmups:
  trial-near:
    title: Walk the station before the sowing plan is signed
    why: >-
      The station is built in rings. The vault sits in the middle, then the laboratory, then
      the glasshouses. Walk the inner rings once, because a plan drawn from a map does not
      tell you which way the wind crosses the headland.
  greet:
    title: Six people, one season, and the crossing block is Thursday
    why: >-
      Everybody here gets one growing season a year, and they all want the same glasshouse
      space. Get round and put a name to as many of them as you can before the plan is argued over. It is a
      shorter argument between people who have met.
  trial-far:
    title: The outer rings open today, and the van comes out
    why: >-
      The trial plots and the crossing block are out past the glasshouses. Nothing out there
      has been called this week. From today it is, and the van is signed out for it. Drive the
      ring road once so you know which plots are which.
  follow:
    title: Quiroga walks the trial rows once
    why: >-
      The trial is four blocks of twenty rows, and the map only helps if you know where each
      block starts. Quiroga, the field trials manager, walks it once, at scoring pace. Stay with
      her, because she stops at the row ends and that is where the map and the ground disagree.
  hunt:
    title: Six bagged heads, and the sheet lists four
    item: { name: bagged head, plural: bagged heads }
    why: >-
      Every bagged head has to be found before the wind gets up. A bag that has come off means a
      cross with an unknown father, and nothing afterwards can tell you which one it was. Four
      are where the sheet says. Find the rest.
  canvass:
    title: Which growers kept the seed apart
    why: >-
      Growers took seed from Wellmere last year and agreed to keep it away from other wheat.
      What the collection can say about those lines depends on whether they did. Ask round the
      farms until enough answers have come back.
  evade:
    title: The merchant who wants a yes at the gate
    why: >-
      The merchant has been on the causeway since eight, wanting an answer about WM-712 before
      the rust question is settled. Nothing is agreed outside the office. Keep out of his way
      and finish your round.
  tag:
    title: Catch Nakagawa before the machine starts
    why: >-
      Nakagawa, the molecular laboratory lead, has the plate layout for this morning's run. Once
      the machine starts it is four hours, and the layout is the only thing that says which well
      holds which line. Without it the result is ninety-six numbers and no names.

copy:
  VAULT: <p>The Seed Vault, on the neck. No windows, 1 door, and 41000 foil packets on rolling shelves at minus 18. It is the landward end of the site because it is the only building here that needs a lorry.</p>
  DRY: <p>Drying and Processing, out on the trial ring where the harvest comes off. Trays on racks in still, dry air, a cleaning mill that has not been rebalanced since March, and every sack labelled twice because a sack labelled once is a sack with no history.</p>
  CROSS: <p>The Crossing Hall, alone at the centre of the Point. Everything else on this site is arranged around the distance from here: glassine bags, forceps, a bench of pollinated heads under numbered tags, and a whiteboard where 8 slots decide what the programme works on until 2033.</p>
  LAB: <p>The Molecular Laboratory, beside the vault. Plates, a thermal cycler on its third batch of the day, and a wall of gels that say which piece of chromosome a plant inherited and nothing at all about what it will do in a field.</p>
  TRIAL: <p>The Field Laboratory, standing in its own wedge of the trial ring. Scales, a drying oven, sample bags by plot number, and the seaward plots visible through the window standing a hand shorter than the rest.</p>
  POP: <p>Genetic Resources, out in the increase ring among the grow-outs. Passport records, collection maps with pencilled routes on them, and the regeneration log that turns out to be the most important document on the station.</p>
  GH1: <p>Glasshouse 1, the warm bay. Lights on a timer, two generations a year, and the backcross that has to be finished before the rust is regional. It stands inside the isolation buffer because a sealed house is its own isolation.</p>
  GH2: <p>Glasshouse 2, the cool bay. Trays of vernalising seedlings held at four degrees, because a winter wheat that never gets a winter never flowers.</p>
  GH3: <p>Glasshouse 3, the screening bay, with its own door and its own boots. What is grown in here is deliberately infected, which is why it is the far end of the arc from everything else.</p>
  SCREEN: <p>The screenhouses, in the increase ring. Insect-proof mesh over the whole frame, so an increase of one accession stays that accession and nothing flies in with other pollen.</p>
  RECORDS: <p>Passport Records. Where every accession came from, who collected it, on what date and off which hillside, in handwriting going back to 1961.</p>
  THRESH: <p>The threshing floor, by the gate end of the compound. Harvest in, chaff out, and 40 paper bags with a farmer's handwriting on them waiting to be threshed 1 plant at a time.</p>
  GATE: <p>Point Gate, at the landward end of the causeway. The only way on or off, and the bearing the wind comes from — which is the whole reason the crossing block is 300 metres the other way.</p>

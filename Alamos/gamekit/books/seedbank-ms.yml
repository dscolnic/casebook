          flowers opened? If it was, the only pollen that could reach it was its own, and the
          seed grows into the same line next year. If it was open when it flowered, pollen came
          from whatever was flowering upwind, and here that means the trial plots eighty metres
          away. A cover put on afterwards changes nothing at all. That is why the labels are no
          help and are not meant to be. Covers, sleeves and sheets turn up on both sides of the
          floor. The date is the category, and nothing else is.

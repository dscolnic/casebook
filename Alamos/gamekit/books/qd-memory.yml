copy:
  STUDY: <p>The study room, open to the corridor at the near end. A card easel, a chair, and walls with nothing on them worth reading.</p>
  EVENT: <p>The event bay, opposite the study room and also open to the corridor. One screen on a stand, one seat in front of it, and a sealed list of who gets which wording.</p>
  INT: <p>Interview suite A, first door on the west side. A table, two chairs, a recorder, and suite B next door fitted out identically on purpose.</p>
  DATA: <p>The data room, halfway down the east side. A long bench, both groups' counts laid out along it, and the comparisons written down before anybody looked.</p>
  INT2: <p>Interview suite B, next to A and identical to it. Two rooms that differ would be a variable nobody meant to introduce.</p>
  OBS: <p>The observation room, between the two suites. A live feed from both, a log sheet, and a rule against saying anything you would not say next door.</p>
  WAIT: <p>The waiting room, halfway down the west side. Eight chairs, a clock that is nine minutes fast, and a notice asking people not to compare notes.</p>
  BRIEF: <p>The briefing room, near the far end. Where everybody is told what the study actually was, before they leave, including which wording they had.</p>
  RECS: <p>The transcript store at the end of the west side. Tapes, transcripts typed verbatim, and nothing tidied.</p>
  STORE: <p>The equipment store at the far end. Four recorders, a box of tapes, and nine hundred response sheets with a confidence scale printed on each.</p>

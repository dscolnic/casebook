    title: "Mission 9: worked examples"
    examples:
    - {"title":"Accumulation versus magnification","problem":"A fish's contaminant level rises over its lifetime; predators have higher concentrations than prey. Name the two processes.","rule":"Bioaccumulation occurs within an organism; biomagnification increases concentration across feeding levels.","steps":["The individual fish's lifetime increase is bioaccumulation.","The predator-prey concentration increase is biomagnification."],"answer":"These describe different comparisons and may occur together.","mistake":"Not every substance necessarily biomagnifies."}
    - {"title":"Compare food-chain concentrations","problem":"Prey contain 0.2 mg/kg of a persistent contaminant; predators contain 2 mg/kg. Find the concentration ratio.","rule":"Concentration ratio=predator concentration/prey concentration.","steps":["Set up the relationship: Concentration ratio=predator concentration/prey concentration.","ratio=2/0.2=10."],"answer":"Predator concentration is ten times prey concentration in these samples.","mistake":"Compare concentration units consistently; total body mass is a different quantity."}
    - {"title":"Trace oxygen loss","problem":"Fertilizer runoff enters a lake, algae grow rapidly, and later dissolved oxygen falls. Explain the sequence.","rule":"Extra nutrients can stimulate growth; microbial decomposition consumes dissolved oxygen.","steps":["Nutrient enrichment promotes an algal bloom when other conditions permit.","After biomass dies, decomposers use oxygen while breaking it down."],"answer":"The resulting oxygen depletion can harm aquatic animals.","mistake":"Nutrients do not simply remove oxygen by their presence alone."}
    - {"title":"Point versus nonpoint pollution","problem":"Compare waste leaving a single discharge pipe with fertilizer washed from many fields after rain.","rule":"A point source is an identifiable discrete discharge; nonpoint pollution is diffuse.","steps":["The single pipe has a defined outlet that can be sampled and controlled.","Field runoff arrives through many pathways over a broad area."],"answer":"The pipe is a point source; widespread field runoff is nonpoint.","mistake":"The distinction describes the release pathway, not whether the pollutant is dangerous."}
    - {"title":"Integrated pest management","problem":"A grower observes a pest count below the action threshold and beneficial predators present. What is a reasoned next step?","rule":"Integrated pest management combines monitoring, prevention, biological methods, and targeted treatment when justified.","steps":["The count has not reached the preselected action threshold.","Continue monitoring and protect beneficial predators rather than automatically applying a broad pesticide."],"answer":"Use the evidence and threshold to decide whether treatment is needed.","mistake":"Integrated management does not mean either spraying constantly or never treating."}


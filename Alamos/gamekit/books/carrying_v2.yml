  # --- Stop 58: Collapse the final degeneracy
  #     Concept: coupled capacity | uncertainty | all keystones | COMBINE | L5 | crisis; Keystone: coupled capacity | uncertainty | all keystones | COMBINE | L5 | crisis; Area: Chapel Council Room; Learning role: PRACTICE; Difficulty: L3; Story role: coupled capacity | uncertainty | all keystones | COMBINE | L5 | crisis.
  #     placement: DEGENERACY, at delivery-board.
  - group: CHAPEL
    at: delivery-board
    title: "Collapse the final degeneracy"
    concept: 11   # coupled capacity | uncertainty | all keystones | COMBINE | L5 | crisis
    reason: "The climate review leaves multiple visitor-cap and reserve pairs that fit today's water supply."
    scene: "Climate pathways are identified, yet visitor cap and drought reserve trade off while matching today's water total. Apply the dry-year constraint to collapse the pair."
    motivation: "The dry-year constraint identifies which cap-reserve pair remains feasible when recharge falls."
    format: DEGENERACY
    question: "Use the two controls visitor cap and drought reserve: adjust visitor cap from 0 to 340 visitors/day in steps of 20 and reserve from 0% to 30% in steps of 5%. Submit the numerical pair satisfying annual withdrawal at or below 136,800 m3/year during a 15% drought before plan choices unlock."
    # THE BIBLE'S PAYLOAD, converted. Its two `controls` keep their min, max and
    # step; `locus_today` is the family of pairs that all satisfy the constraint
    # today and `locus_drought` the shorter family the drought year leaves, which
    # is the second measurement that collapses it. `truth: [200,20]` and
    # `tolerance: [10,2.5]` become the keyed pair and its band, a to the first
    # control and b to the second.
    degeneracy:
      controls:
      - { id: visitor_cap, label: Visitor cap, unit: visitors/day, min: 0, max: 340, step: 20 }
      - { id: drought_reserve, label: Drought reserve, unit: percent, min: 0, max: 30, step: 5 }
      observable: { label: "Annual withdrawal against the 136,800 m³/year ceiling" }
      locus:
      - { a: 120, b: 30 }
      - { a: 160, b: 25 }
      - { a: 200, b: 20 }
      - { a: 240, b: 15 }
      - { a: 280, b: 10 }
      - { a: 320, b: 5 }
      second:
        label: The same ceiling recomputed for a 15 per cent drought year
        apply: Apply the drought year
        locus:
        - { a: 160, b: 25 }
        - { a: 200, b: 20 }
        - { a: 240, b: 15 }
      truth: { a: 200, b: 20 }
      tolerance: { a: 10, b: 2.5 }
      commit: Report the pair
    answerText: "The completed check shows submit (200 visitors/day, 20% reserve)."
    why: "Collapse the final degeneracy connects the measured environmental mechanism to the next island condition."
    # wrong-path feedback, one rebuttal per wrong option:
    #   The retry identifies the first incorrect mechanism, unit, unsupported claim, omitted requirement, or violated constraint.
    # correct result: Submit (200 visitors/day, 20% reserve)
    # state/output: Keep the result visible, record it in the mission log, and unlock the next authored stop.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   degeneracy:{controls:[{id:visitor_cap,label:"visitors/day",min:0,max:340,step:20},{id:drought_reserve,label:"reserve percent",min:0,max:30,step:5}],locus_today:[[120,30],[160,25],[200,20],[240,15],[280,10],[320,5]],locus_drought:[[160,25],[200,20],[240,15]],constraint:"annual withdrawal <=136800 m3/year during 15% drought",truth:[200,20],tolerance:[10,2.5],required_submission:"numerical pair before plan unlock"}

  # --- Stop 59: Verify the independent water sample
  #     Concept: final water check | causality and evidence | D2,D4,D8 | TRANSFER | L5 | verification; Keystone: final water check | causality and evidence | D2,D4,D8 | TRANSFER | L5 | verification; Area: Waterworks; Learning role: PRACTICE; Difficulty: L3; Story role: final water check | causality and evidence | D2,D4,D8 | TRANSFER | L5 | verification.
  #     placement: VERIFY, at sampler.
  - group: WATER
    at: sampler
    title: "Verify the independent water sample"
    concept: 34   # final water check | causality and evidence | D2,D4,D8 | TRANSFER | L5 | verification
    reason: "The selected visitor cap needs an independent water check before the council can approve it."
    scene: "The dry-year constraint leaves a 200-visitor cap with 20% reserve. Verify final quantity and quality with an independent sample, and the team needs this result before it acts, and this result will guide the next safe decision."
    motivation: "The remaining water margin and measured nitrate and chloride determine whether the cap meets both quantity and quality conditions."
    format: VERIFY
    question: "CALCULATE AND COMMIT margin=136800-132000 in m3/year; OPERATE the sampler with pump and time fixed; MEASURE nitrate and chloride; INTERPRET PASS only below 10.0 and 250 mg/L; no restoration"
    relationship: "margin = ceiling - withdrawal, so 136,800 - 132,000"
    # THE BIBLE'S PAYLOAD, converted. Its keyed margin of 4,800 m3/year is the
    # engine's `truth` and its `tolerance: 100` is written as the `passRatio` the
    # engine grades a prediction on. Its `operate` block is the intervention and
    # its `measure` block the measurement, whose nitrate and chloride readings sit
    # in the measurement note against the two limits the bible's `interpret`
    # names. The dial range is wide enough that not every position passes.
    verify:
      prediction:
        label: Margin under the withdrawal ceiling
        unit: m³/year
        min: 0
        max: 20000
        step: 100
      truth: 4800
      passRatio: [0.979, 1.021]
      intervention:
        label: Run the independent sampler
        note: Pump state and sampling time held fixed.
        outcome: Sampler run. Nothing on the plant was changed.
      measurement:
        label: Margin confirmed against the ceiling
        note: The sampler also reads nitrate 6.4 mg/L and chloride 118 mg/L, both under the 10.0 and 250 mg/L limits.
      lock: Lock the prediction
      commit: Report the verdict
    answerText: "The completed check shows margin 4800 m3/year, nitrate 6.4 mg/L, chloride 118 mg/L: PASS."
    why: "Verify the independent water sample connects the measured environmental mechanism to the next island condition."
    # wrong-path feedback, one rebuttal per wrong option:
    #   The retry identifies the first incorrect mechanism, unit, unsupported claim, omitted requirement, or violated constraint.
    # correct result: Margin 4800 m3/year, nitrate 6.4 mg/L, chloride 118 mg/L: PASS
    # state/output: Keep the result visible, record it in the mission log, and unlock the next authored stop.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   verify:{required_sequence:[calculate_commit,operate,measure,interpret],operate_unlocked_when:prediction_committed,prediction:{equation:"margin=ceiling-withdrawal",inputs:{ceiling:136800,withdrawal:132000},unit:"m3/year",truth:4800,tolerance:100},operate:{control:independent_sampler,fixed:[pump_state,sampling_time]},measure:{nitrate:{value:6.4,unit:"mg/L"},chloride:{value:118,unit:"mg/L"}},interpret:{correct:PASS,criteria:["nitrate <10.0 mg/L","chloride <250 mg/L"]},restore:{required:false,reason:"sampling changes no control"}}


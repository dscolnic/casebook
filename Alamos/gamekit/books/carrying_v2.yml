  - Rate the machines
  - Cost the change
  - Ready for the council
- id: REEF
  code: REEF
  name: Reef Station
  color: '#3f8fa0'
  desc: The species the island keeps, and the water they live in.
  defaultLeader: berhane
  milestones:
  - Count the transect
  - Read the tolerance
  - Test the claim
  - Ready for the council

theme:
  id: carrying
  title: Carrying Capacity
  subtitle: Island Resources Officer · Vellan Island, fifteen days to the ferry vote
groups:
- id: CHAPEL
  code: CHAPEL
  name: Chapel Council Room
  color: '#6b7f8a'
  desc: "Where the campaign's chapel council room work is done."
  milestones: [Open the room, Read what it holds, Settle the question, Hand it on]
- id: HARB
  code: HARB
  name: Harbour Office
  color: '#2f7fa8'
  desc: Landings, the quota, the ferry and who is on the island.
  defaultLeader: calloway
  milestones:
  - Read the landings
  - Work the stock
  - Set the rule
  - Ready for the council
- id: WATER
  code: WATER
  name: Waterworks
  color: '#2e9b8f'
  desc: Rain in, borehole out, and the salt behind both.
  defaultLeader: sorley
  milestones:
  - Measure the recharge
  - Balance the store
  - Find the salt
  - Ready for the council
- id: COMMON
  code: COMMON
  name: Common Office
  color: '#8a9a3c'
  desc: Grazing, gardens, soil and what is sprayed on them.
  defaultLeader: pike
  milestones:
  - Walk the common
  - Read the soil
  - Weigh the inputs
  - Ready for the council
- id: TIP
  code: TIP
  name: Tip and Sorting Yard
  color: '#a06a3c'
  desc: Everything that stays, and what leaks out of it.
  defaultLeader: okafor
  milestones:
  - Weigh the arrivals
  - Trace the leachate
  - Count the gas
  - Ready for the council
- id: POWER
  code: POWER
  name: Turbine Yard
  color: '#c0803a'
  desc: Diesel, the hill, and what a kilowatt-hour costs here.
  defaultLeader: ferris
  milestones:
  - Meter the demand
  - Rate the machines
  - Cost the change
  - Ready for the council
- id: REEF
  code: REEF
  name: Reef Station
  color: '#3f8fa0'
  desc: The species the island keeps, and the water they live in.
  defaultLeader: berhane
  milestones:
  - Count the transect
  - Read the tolerance
  - Test the claim
  - Ready for the council
roster:
- id: voss
  name: "Mara Voss"
  role: "Island Resources Officer; mission authority"
  division: CHAPEL
  pronouns: "she/her"
  bio: |
    Mara Voss is Island Resources Officer; mission authority. Wants a defensible vote in fifteen days. Initially treats complete ledgers as sufficient; learns that shared measurements need independent checks. Says, "What can the island replace?"
- id: reed
  name: "Tomas Reed"
  role: "Harbour and fishery lead"
  division: HARB
  pronouns: "he/him"
  bio: |
    Tomas Reed is Harbour and fishery lead. Wants a second ferry and stable fishing income. Treats landings as stock abundance; accepts effort limits after catch-per-effort falls. Says, "What came over the rail?"
- id: okafor
  name: "Nkemdi Okafor"
  role: "Waterworks technician"
  division: WATER
  pronouns: "she/her"
  bio: |
    Nkemdi Okafor is Waterworks technician. Wants protect the aquifer and school supply. Distrusts growth before distinguishing preventable loss from unavoidable demand. Says, "What changed upstream?"
- id: vale
  name: "Iona Vale"
  role: "Common agronomy lead"
  division: COMMON
  pronouns: "she/her"
  bio: |
    Iona Vale is Common agronomy lead. Wants keep farms productive and affordable. Favors familiar fertilizer; adopts IPM and nutrient budgets when runoff evidence connects fields to reef. Says, "What stays fixed?"
- id: shaw
  name: "Elias Shaw"
  role: "Turbine and diesel mechanic"
  division: POWER
  pronouns: "he/him"
  bio: |
    Elias Shaw is Turbine and diesel mechanic. Wants firm power through winter. Judges sources by nameplate output; accepts capacity factor, storage, and pollution costs. Says, "What runs at dusk?"
- id: chen
  name: "Mei Chen"
  role: "Tip and environmental-health lead"
  division: TIP
  pronouns: "she/her"
  bio: |
    Mei Chen is Tip and environmental-health lead. Wants stop leakage without bankrupting services. Focuses on visible waste; follows nitrogen, toxics, and methane through unseen pathways. Says, "Where does it go next?"
- id: noor
  name: "Rafi Noor"
  role: "Reef ecologist"
  division: REEF
  pronouns: "he/him"
  bio: |
    Rafi Noor is Reef ecologist. Wants protect nursery habitat and long records. Initially assumes warming explains every reef decline; accepts nutrient and fishing interactions. Says, "Which pattern survives?"
- id: costa
  name: "Lena Costa"
  role: "School nurse and population recorder"
  division: HARB
  pronouns: "she/her"
  bio: |
    Lena Costa is School nurse and population recorder. Wants keep children safe and the school open. Treats head count as demand; learns age structure and visitor-days matter. Says, "Who receives the dose?"
- id: pell
  name: "Ada Pell"
  role: "Council chair"
  division: CHAPEL
  pronouns: "she/her"
  bio: |
    Ada Pell is Council chair. Wants conditions residents can understand and enforce. Wants a simple yes/no; accepts a conditional rule with triggers. Says, "Can we write that as a rule?"

glossary:
# mission 1
- name: System
  aliases: [system]   # TODO: the plurals and spellings the prose uses
  def: "a set of connected parts studied together. Reservoir: a place where matter is stored. Flux: an amount moving between stores per unit time. Watershed: land whose water drains to one shared water body."
# mission 2
- name: Infiltration
  aliases: [infiltration]   # TODO: the plurals and spellings the prose uses
  def: "water entering soil. Recharge: water reaching and replenishing an aquifer. Aquifer: underground material that stores and transmits groundwater. Uncertainty: a measured range within which the defensible value may lie."
# mission 3
- name: NPP
  aliases: [npp]   # TODO: the plurals and spellings the prose uses
  def: "plant energy stored after plants use some energy for respiration. Trophic level: a feeding position in a food web. Succession: predictable community change after new land or disturbance. Niche: the resources and conditions a species uses."
# mission 4
- name: Porosity
  aliases: [porosity]   # TODO: the plurals and spellings the prose uses
  def: "the fraction of material made of open space. Permeability: how readily connected pores transmit water. Saltwater intrusion: seawater moving into a freshwater aquifer. Soil horizon: a layer formed by additions, losses, movement, and change."
# mission 5
- name: Generalist
  aliases: [generalist]   # TODO: the plurals and spellings the prose uses
  def: "species with a broad niche."
# mission 5
- name: Specialist
  aliases: [specialist]   # TODO: the plurals and spellings the prose uses
  def: "species with a narrow niche. r-selected: many young, short lives, high early mortality."
# mission 5
- name: K-selected
  aliases: [k-selected]   # TODO: the plurals and spellings the prose uses
  def: "few young, long lives, stable populations."
# mission 5
- name: Carrying capacity
  aliases: [carrying capacity]   # TODO: the plurals and spellings the prose uses
  def: "largest population an environment can sustain."
# mission 6
- name: Tragedy of the commons
  aliases: [tragedy of the commons]   # TODO: the plurals and spellings the prose uses
  def: "overuse of a shared resource."
# mission 6
- name: Sustainable yield
  aliases: [sustainable yield]   # TODO: the plurals and spellings the prose uses
  def: "harvest that does not reduce future supply."
# mission 6
- name: Ecological footprint
  aliases: [ecological footprint]   # TODO: the plurals and spellings the prose uses
  def: "productive land and water needed to support consumption and waste."
# mission 6
- name: IPM
  aliases: [ipm]   # TODO: the plurals and spellings the prose uses
  def: "pest control combining monitoring, prevention, and limited targeted treatment."
# mission 7
- name: Leachate
  aliases: [leachate]   # TODO: the plurals and spellings the prose uses
  def: "polluted liquid draining through waste."
# mission 7
- name: Anaerobic
  aliases: [anaerobic]   # TODO: the plurals and spellings the prose uses
  def: "without oxygen."
# mission 7
- name: Point source
  aliases: [point source]   # TODO: the plurals and spellings the prose uses
  def: "one identifiable outlet."
# mission 7
- name: Nonpoint source
  aliases: [nonpoint source]   # TODO: the plurals and spellings the prose uses
  def: "diffuse runoff."
# mission 7
- name: Sewage treatment
  aliases: [sewage treatment]   # TODO: the plurals and spellings the prose uses
  def: "primary settling, secondary bacterial breakdown, tertiary nutrient removal."
# mission 8
- name: Dose
  aliases: [dose]   # TODO: the plurals and spellings the prose uses
  def: "amount of a substance received per body mass."
# mission 8
- name: Threshold response
  aliases: [threshold response]   # TODO: the plurals and spellings the prose uses
  def: "effect begins above a dose."
# mission 8
- name: Bioavailability
  aliases: [bioavailability]   # TODO: the plurals and spellings the prose uses
  def: "fraction absorbed. LD50: dose lethal to half a test population; lower means more toxic."
# mission 9
- name: Bioaccumulation
  aliases: [bioaccumulation]   # TODO: the plurals and spellings the prose uses
  def: "pollutant buildup within one organism."
# mission 9
- name: Biomagnification
  aliases: [biomagnification]   # TODO: the plurals and spellings the prose uses
  def: "rising concentration at higher trophic levels."
# mission 9
- name: Persistent organic pollutant
  aliases: [persistent organic pollutant]   # TODO: the plurals and spellings the prose uses
  def: "long-lived carbon chemical such as DDT or PCB."
# mission 9
- name: Eutrophication
  aliases: [eutrophication]   # TODO: the plurals and spellings the prose uses
  def: "nutrient enrichment leading to algae and oxygen loss."
# mission 10
- name: Dissolved oxygen
  aliases: [dissolved oxygen]   # TODO: the plurals and spellings the prose uses
  def: "oxygen gas available in water."
# mission 10
- name: Thermal pollution
  aliases: [thermal pollution]   # TODO: the plurals and spellings the prose uses
  def: "warming that lowers oxygen solubility."
# mission 10
- name: Ocean acidification
  aliases: [ocean acidification]   # TODO: the plurals and spellings the prose uses
  def: "falling seawater pH as carbon dioxide enters water."
# mission 10
- name: Dead zone
  aliases: [dead zone]   # TODO: the plurals and spellings the prose uses
  def: "water with too little oxygen for most animals."
# mission 11
- name: Capacity factor
  aliases: [capacity factor]   # TODO: the plurals and spellings the prose uses
  def: "actual energy divided by maximum possible energy."
# mission 11
- name: EROI
  aliases: [eroi]   # TODO: the plurals and spellings the prose uses
  def: "energy returned divided by energy invested."
# mission 11
- name: Primary pollutant
  aliases: [primary pollutant]   # TODO: the plurals and spellings the prose uses
  def: "emitted directly."
# mission 11
- name: Secondary pollutant
  aliases: [secondary pollutant]   # TODO: the plurals and spellings the prose uses
  def: "formed in air."
# mission 11
- name: Thermal inversion
  aliases: [thermal inversion]   # TODO: the plurals and spellings the prose uses
  def: "warm air trapping cooler polluted air below."
# mission 12
- name: Greenhouse gas
  aliases: [greenhouse gas]   # TODO: the plurals and spellings the prose uses
  def: "gas that absorbs outgoing heat."
# mission 12
- name: Global warming potential
  aliases: [global warming potential]   # TODO: the plurals and spellings the prose uses
  def: "heat trapped relative to carbon dioxide."
# mission 12
- name: Half-life
  aliases: [half-life]   # TODO: the plurals and spellings the prose uses
  def: "time for half a radioactive sample to decay."
# mission 12
- name: Base load
  aliases: [base load]   # TODO: the plurals and spellings the prose uses
  def: "power available steadily."
# mission 13
- name: Invasive species
  aliases: [invasive species]   # TODO: the plurals and spellings the prose uses
  def: "introduced organism that spreads and causes harm."
# mission 13
- name: Endemic
  aliases: [endemic]   # TODO: the plurals and spellings the prose uses
  def: "native to one limited place."
# mission 13
- name: CITES
  aliases: [cites]   # TODO: the plurals and spellings the prose uses
  def: "treaty controlling trade in threatened species."
# mission 13
- name: Endangered Species Act
  aliases: [endangered species act]   # TODO: the plurals and spellings the prose uses
  def: "United States law protecting listed species and habitat."
# mission 14
- name: Total fertility rate
  aliases: [total fertility rate]   # TODO: the plurals and spellings the prose uses
  def: "average births per woman; about 2.1 replaces a population without migration."
# mission 14
- name: Population momentum
  aliases: [population momentum]   # TODO: the plurals and spellings the prose uses
  def: "continued growth from a large reproductive-age group."
# mission 14
- name: Demographic transition
  aliases: [demographic transition]   # TODO: the plurals and spellings the prose uses
  def: "shift from high birth/death rates toward low rates."
# mission 14
- name: Overshoot
  aliases: [overshoot]   # TODO: the plurals and spellings the prose uses
  def: "demand beyond available biological capacity."
# mission 15
- name: Radiative forcing
  aliases: [radiative forcing]   # TODO: the plurals and spellings the prose uses
  def: "change in Earth's energy balance in W/m²."
# mission 15
- name: Mitigation
  aliases: [mitigation]   # TODO: the plurals and spellings the prose uses
  def: "reducing causes of environmental change."
# mission 15
- name: Adaptation
  aliases: [adaptation]   # TODO: the plurals and spellings the prose uses
  def: "reducing harm from impacts."
# mission 15
- name: Tipping point
  aliases: [tipping point]   # TODO: the plurals and spellings the prose uses
  def: "threshold beyond which feedback drives further change."

warmups:
  greet:
    title: Ninety-one people, and you will need most of them by Friday
    why: Every number in the council pack comes out of somebody's book, and on Vellan those books are in people's
      heads and kitchens. Calloway, the harbourmaster, wants you known to as many of them as you can get round before
      the ferry argument starts, because a figure you asked for is worth three you found in a file.
  trial-near:
    title: Walk the harbour end before you sign anything
    why: The office, the waterworks and the common all stand inside four hundred metres of the berth, so walk that
      end once and see which is which.
  trial-far:
    title: The far end opens today, and the truck with it
    why: The tip, the hill and the reef station are three hundred metres and more up the island road and nothing
      up there has been called on this week. From today they are on the list and the truck is signed out for it.
      Drive the road once so you know which spur is which before Blessing Okafor, who runs the tip, asks you to
      look at a cell.
  follow:
    title: Follow Vale round the stocking count
    why: 'Iona Vale, the common agronomy lead, counts stock on the common twice a year and she does not stop walking
      to explain it. Stay with her: the count is the only evidence behind the stocking limit, and the argument at
      the spring meeting is always about how it was taken rather than what it said.'
  hunt:
    title: Seven standpipes, and one of them is the leak
    item:
      name: standpipe
      plural: standpipes
    why: The distribution main is losing about a fifth of what the borehole lifts, and Mairead Sorley, the water
      engineer, has narrowed it to the seven standpipes along the island road. Find all seven and read them. A fifth
      of the island's water is a bigger number than anything the ferry argument is about.
  canvass:
    title: Ask the nine graziers one question each
    why: The council paper needs to say whether the graziers would accept an inspected limit, and Dan Pike, who
      administers the grazing rights, will not put words in their mouths. Nine people, one question, and the answer
      only counts if enough of them give it — which is the whole difficulty with asking anybody anything on an island.
  evade:
    title: Stay off the mainland surveyor until the pack is filed
    why: 'The ferry operator''s surveyor came over on the Tuesday boat and wants the abstraction figures before
      Dunmore, the council clerk, has checked them. Keep your distance until the pack is in: a number quoted from
      a corridor conversation arrives at the vote with nobody''s name on it.'
  tag:
    title: Catch Rask before the Friday boat
    why: Petra Rask, the fisheries observer, leaves on the Friday sailing and the stock assessment needs one figure
      that is only in her head — which of the four over-landing boats she saw twice. She walks fast and she is already
      late for the berth.

beatRooms: [BERTH, SCHOOL]

missions:
# 15 mission fragment(s), assembled by tools/assemble-book.mjs from
# carrying_v2/ — edit the fragments, not this file.
# ============================================================ MISSION 1
# Lifted from ../fpl_gpt/CARRYING_CAPACITY_APES_Campaign_Implementation_Bible(1).md by tools/v10extract.mjs. Every quoted string below is
# the bible's, verbatim; engine/dev/bibleParity.mjs holds it to that.
- title: "What the Island Depends On"
  card:
    header: "15 DAYS TO THE FERRY VOTE"
    title: "Nothing Leaves the Ledger"
    goNow: "Go to the Harbour Office and meet Tomas Reed, harbour and fishery lead, at the landings book."
    body: "A warning about water from a school tap arrives while Vellan debates adding another ferry. More sailings could bring more people, supplies, and waste. Use environmental science to trace the island's resources and decide what the ferry plan must count before anyone calls it sustainable."
    objective: "Build the dependency ledger that defines the investigation."
  objective: "Build the dependency ledger that defines the investigation."
  stake: "A warning about water from a school tap arrives while Vellan debates adding another ferry. More sailings could bring more people, supplies, and waste. Use environmental science to trace the island's resources and decide what the ferry plan must count before anyone calls it sustainable."
  takeaway: "Independent evidence must not share the same hidden source. ---"
  segue: "Mission decision: Count water, food, energy, materials, waste, people. And habitat in one linked island system. Matching records do not count twice when they share a source. The council opens the full resource review. Tomorrow, the first closed budget is freshwater."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "System", def: "a set of connected parts studied together."}
  - {name: "Reservoir", def: "a place where matter is stored."}
  - {name: "Flux", def: "an amount moving between stores per unit time."}
  - {name: "Watershed", def: "land whose water drains to one shared water body."}
  equations:
  - {"e":"Change in storage = inputs - outputs","c":"Closing any island resource ledger.","v":[["inputs and outputs","quantities measured over the same period"]],"s":"The ferry can pass only if each essential store remains stable."}
  primer:
  - "Matter cycles through stores; energy flows and is mostly lost as heat."
  - "A boundary decides which inputs and outputs belong in a budget."
  - "Agreement among records is weak evidence if they share one missing source."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-harbour-office
    # On arrival at Harbour Office | landings-book | automatic
    on: { enter: true, at: HARB }
    world: "The draw the boundary fixture wakes and the mission evidence opens."
    panel: "MISSION 1: DRAW THE BOUNDARY OPEN"
    bubbles:
    - who: reed   # Tomas Reed
      say: "The screen totals what was sold; the book also records what came back over the rail."
  - id: after-stop-1
    # After Stop 1 | landings-book | automatic
    on: { after: [1] }
    world: "After Stop 1: Keep the new evidence visible and."
    panel: "STOP 1 RECORDED - STOP 2 OPEN"
    bubbles:
    - who: reed   # Tomas Reed
      say: "Nice work. Use the Stop 1 result to settle match the cycles."
  - id: after-stop-2
    # After Stop 2 | fee-desk | automatic
    on: { after: [2] }
    world: "After Stop 2: a five-ledger wall diagram lights."
    panel: "STOP 2 RECORDED - STOP 3 OPEN"
    bubbles:
    - who: reed   # Tomas Reed
      say: "Good thinking. Use the Stop 2 result to settle separate matter from energy."
  - id: after-stop-3
    # After Stop 3 | landings-book | automatic
    on: { after: [3] }
    world: "The separate matter from energy result remains visible while the find the shared omission fixture lights."
    panel: "STOP 3 RECORDED - STOP 4 OPEN"
    bubbles:
    - who: reed   # Tomas Reed
      say: "Exactly right. REJECTED CATCH"
  - id: at-mission-end
    # At mission end | landings-book | automatic
    on: { missionEnd: true }
    world: "The completed decision changes the mission world and locks into the campaign record."
    panel: "MISSION 1 EVIDENCE: RECORDED"
    bubbles:
    - who: reed   # Tomas Reed
      say: "Outstanding work. You solved the mission. Now we know what every later number must connect to."

  # The optional review, offered when the mission is finished and graded
  # nowhere. GENERATED by tools/bible-deeper.mjs from the campaign bible.
  deeper:
    intro: "You completed What the Island Depends On. Choose GO DEEPER to revisit the four decisions and explore related course ideas; this optional review does not change your metrics or delay the next mission."
    questions:
    - prompt: "In a follow-up to What the Island Depends On, the electronic ledger counts ferry tickets, fuel, and landed fish but ignores rain, groundwater, sunlight, and waste. The next action depends on selecting the conclusion that fits all of those facts. Which environmental-science conclusion correctly applies System?"

    scene: "The probe found a coastal salt front before the tourist peak. Combine that pattern with pumping, rainfall, and nitrate records to reject explanations that fit only one alarm."
    motivation: "The combined pumping, recharge, and chemistry evidence determines which cause the aquifer protection plan must address."
    format: DIAGNOSIS
    question: "Select the single cause that fits every panel zone."
    figure: {"kind":"line","xLabel":"Distance inland (km)","yLabel":"Chloride (mg/L)","caption":"Chloride rises farther inland during the warning period.","series":[{"name":"Earlier","points":[[0,600],[2,380],[4,190],[6,90]]},{"name":"Current","points":[[0,640],[2,470],[4,310],[6,180]]}]}

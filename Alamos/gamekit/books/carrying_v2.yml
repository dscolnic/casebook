    concept: 4   # unit conversion
    reason: "The rainfall balance is complete, but the council needs recharge as a usable water volume."
    scene: "The recharge estimate has to match the aquifer's volume ledger. The catchment map and annual depth use different units."
    motivation: "Recharge depth over the mapped aquifer area sets the annual groundwater supply available for withdrawal planning."
    format: BALLPARK
    question: "Recharge depth is 150 mm/year across 1.2×10⁶ m². Fill depth in metres and area to calculate annual volume."
    # THE BIBLE'S PAYLOAD, converted. The bible's four `labels` tokens become the
    # four tiles, each carrying the value the bible gives it; `slots: 4` and

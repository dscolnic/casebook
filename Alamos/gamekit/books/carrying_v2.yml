  #     placement: BALLPARK, at turbine-plate.
  - group: POWER
    at: turbine-plate
    title: "Calculate capacity factor"
    concept: 26   # capacity factor | energy | 11
    reason: "The small evening reserve makes the turbine's nameplate claim insufficient for supply planning."
    scene: "The peak ledger leaves only fifteen kilowatts, and the turbine plate promises 250 kilowatts. Replace nameplate power with annual performance, and the team needs this result before it acts, and this result will guide the next safe decision."
    motivation: "Annual capacity factor distinguishes rated turbine power from the energy the island actually receives over a year."
    format: BALLPARK
    question: "Apply capacity factor=680000 kWh/(250 kW*8760 h); submit one percent"
    # THE BIBLE'S PAYLOAD, converted. Its three `inputs` become the three tiles
    # and its `equation` the template; `truth: 31.1` is the target and its
    # `tolerance: 0.2` is already an absolute band on a percentage.
    estimate:
      prompt: The plate on the turbine promises 250 kilowatts and the meter has a year of what it actually made.
      question: Estimate the turbine's capacity factor as a percentage.
      relationship: capacity factor = actual output ÷ (rated power × hours in a year)
      labels:
      - 680000 kWh  (actual output last year)
      - 250 kW  (rated turbine power)
      - 8760 h  (hours in a year)
      values: [680000, 250, 8760]
      slots: 3
      template: '{0} ÷ ({1} × {2}) × 100'
      formula: a/(b*c)*100
      correct: [0, 1, 2]
      target: 31.1
      tolerance: 0.2
      units: percent
      solution: 680,000 ÷ (250 × 8,760) × 100 = 31.1 per cent.
      explanation: Rated power is what a machine makes when the wind is right; the capacity factor is what it made against a whole year of running flat out.
    answerText: "The completed check shows capacity factor is 31.1%."
    why: "Calculate capacity factor connects the measured environmental mechanism to the next island condition."

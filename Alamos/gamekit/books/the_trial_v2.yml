    attest:
      checks: 3
      claims:
      - { id: primary_30d, label: "primary 30-day improvement", critical: true, backed: true,
          signedBy: "Lena Wu", evidence: "Registry timestamp 14 months before the first patient." }
      - { id: serious_event, label: "serious-event rate", critical: true, backed: true,
          signedBy: "Lena Wu", evidence: "Registry timestamp 14 months before the first patient." }
      - { id: recovery_mean, label: "recovery-time mean", backed: true,
          signedBy: "Lena Wu", evidence: "Registry timestamp 14 months before the first patient." }
      - { id: site_interaction, label: "two-site treatment interaction", critical: true,
          signedBy: "Lena Wu", evidence: "No registry timestamp; the claim was written after the two-site pattern appeared." }
      - { id: lab_marker, label: "exploratory lab marker",
          signedBy: "Lena Wu", evidence: "No registry timestamp; the marker was added to the pack later." }
      commit: "Seal the claim list"
    answerText: "Each signature is limited to what its source establishes. The unsupported claims lack the specific date, physical condition, independence or scope they assert."
    why: "A clear sample statistic cannot turn an unregistered observation into a pre-specified population claim."
    # wrong-path feedback, one rebuttal per wrong option:

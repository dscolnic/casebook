    - {"title":"What becomes approximately Normal?","problem":"A skewed population is sampled independently in groups of 100. What distribution may become approximately Normal?","rule":"The Central Limit Theorem concerns the sampling distribution of averages under suitable conditions.","steps":["Each sample produces one sample mean. Consider the distribution of those means over repetitions.","Averaging can make that distribution approximately Normal even while individual observations remain skewed."],"answer":"The approximately Normal distribution is the distribution of sample means.","mistake":"The theorem does not make the original population Normal."}
    - {"title":"Improve precision","problem":"For the same population and method, increase sample size from 25 to 100. How does standard error change?","rule":"Standard error scales as 1/sqrt(n).","steps":["Set up the relationship: Standard error scales as 1/sqrt(n).","SE_new/SE_old=sqrt(25/100)=1/2."],"answer":"The standard error is halved.","mistake":"Doubling precision requires four times the sample size, not twice."}
    - {"title":"Count independent evidence sources","problem":"Three reports copy one balance reading. A fourth report uses a separately calibrated balance. How many measurement sources are there?","rule":"Reports are not independent measurements when they copy a common source.","steps":["source group 1 = the first balance and its three copies. Count that measurement once.","source group 2 = the second balance. It adds a separate measurement route."],"answer":"There are two measurement sources, not four.","mistake":"Agreement among copies cannot establish independent confirmation."}


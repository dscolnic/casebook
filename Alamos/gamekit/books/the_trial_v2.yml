# The Trial — CLARION-3, and the 3 weeks before the second interim.
#
# Written to gamekit/tools/BOOK_TEMPLATE.md. The place is themes/the_trial/plan.js;
# the arc it follows is in ../GAME_IDEAS.md under "The Trial".
#
# The argument: Balogun holds that delay has a human cost if one arm is truly worse.
# Feldman holds that the boundary exists so the room cannot mistake a promising
# fluctuation for knowledge. The game lets each position become the right caution
# on a different day, based only on what could actually be known at that point.

theme:
  id: the_trial
  title: The Trial
  subtitle: Methodology & Operations Lead · CLARION-3

groups:
  - id: RAND
    code: RAND
    name: Randomisation & Blinding
    color: '#3f6f8f'
    desc: How an arm is assigned, and what has to be true for nobody to know which.
    defaultLeader: diouf
    milestones: [Read the allocation, Hold the blind, Account for the kit, Ready to hand over]
  - id: ENDP
    code: ENDP
    name: Endpoints & Measurement
    color: '#7a4fa3'
    desc: What is being counted, who counts it, and how the counting can go wrong.
    defaultLeader: ansah
    milestones: [Define the event, Adjudicate the file, Check the measurement, Ready to hand over]
  - id: SAFE
    code: SAFE
    name: Safety Monitoring
    color: '#b3462f'
    desc: What harm looks like early, and who is allowed to see it.
    defaultLeader: vogt
    milestones: [Read the report, Rate the event, Brief the board, Ready to hand over]
  - id: STAT
    code: STAT
    name: Statistical Analysis
    color: '#1f7a6b'
    desc: Power, boundaries, intervals, and what a number is entitled to claim.
    defaultLeader: feldman
    milestones: [State the question, Fix the rule, Estimate the effect, Ready to hand over]
  - id: SITE
    code: SITE
    name: Site Operations
    color: '#b0762a'
    desc: 31 hospitals, and the distance between a chart and a database.
    defaultLeader: marchetti
    milestones: [Visit the site, Verify the source, Close the query, Ready to hand over]
  - id: REG
    code: REG
    name: Regulatory & Reporting
    color: '#5b6a72'
    desc: What was promised in advance, and what has to be said out loud afterwards.
    defaultLeader: umeh
    milestones: [Find the commitment, Record the change, State the result, Ready to hand over]

roster:
- id: voss
  name: "Mara Voss"
  role: "Trial director and mission authority"
  division: SAFE
  pronouns: "she/her"
  bio: |
    She has promised the board a defensible decision on day fifteen and must explain if the
    strongest-looking headline weakens. A settled-looking number can feel final when a deadline
    is close.
- id: navarro
  name: "Eli Navarro"
  role: "SITE division operations lead"
  division: SITE
  pronouns: "he/him"
  bio: |
    He has held up fast-enrolling hospitals as examples while trying to keep recruitment and
    queries moving. Recruitment speed can look like quality before the missing patients and
    regions are examined.
- id: shah
  name: "Priya Shah"
  role: "Randomisation and blinding lead"
  division: RAND
  pronouns: "she/her"
  bio: |
    She has built a correct allocation record and must now show that the handling of actual kits
    preserves what the file promises. A valid digital sequence can hide predictable physical
    handling.
- id: reed
  name: "Tomas Reed"
  role: "STAT division trial statistician"
  division: STAT
  pronouns: "he/him"
  bio: |
    He has defended the analysis plan and wants its work to yield a useful result when the board
    meets. Formal significance can overshadow bias, multiplicity and practical size.
- id: okafor
  name: "Amina Okafor"
  role: "Endpoint adjudication lead"
  division: ENDP
  pronouns: "she/her"
  bio: |
    Sites rely on her event definitions, so changing a rule can require revisiting records
    already treated as settled. Precise counting rules can still measure the wrong construct.
- id: wu
  name: "Lena Wu"
  role: "REG division regulatory and registry lead"
  division: REG
  pronouns: "she/her"
  bio: |
    Lena must preserve a traceable record even when it includes inconvenient changes. A complete
    audit trail can seem to verify the patient evidence itself.
- id: berg
  name: "Jonas Berg"
  role: "Safety monitoring chair"
  division: SAFE
  pronouns: "he/him"
  bio: |
    He is accountable for patients exposed while the board waits and for patients who might lose
    a useful treatment if it stops too soon. An early cluster can demand attention before chance
    and exposure have been properly considered.

glossary:
  - name: Randomisation
    aliases: [randomise, randomised, randomly assigned]
    def: Assigning each participant to an arm by chance, so the groups differ only by luck and by what is being tested.
  - name: Allocation concealment
    aliases: [concealment, concealed allocation]
    def: Keeping the next assignment unknowable until the participant is entered, so nobody can time an entry to get an arm.
  - name: Blinding
    aliases: [blind, blinded, unblinded, masking]
    def: Keeping who is on which arm hidden after assignment — from participants, from staff, or from whoever measures the outcome.
  - name: Arm
    aliases: [arms, treatment arm, control arm]
    def: "One of the groups a trial compares. CLARION-3 has two: the drug and standard care."
  - name: Primary endpoint
    aliases: [endpoint, endpoints, primary outcome]
    def: The one outcome the trial was designed to answer, named before it began. Everything else is secondary.
  - name: Adjudication
    aliases: [adjudicate, adjudicated, adjudication committee]
    def: An independent panel deciding whether what happened to a participant meets the trial's definition of an event.
  - name: Interim analysis
    aliases: [interim, interim look]
    def: A scheduled look at the accumulating data before the trial finishes, done by the board rather than the trial team.
  - name: Stopping boundary
    aliases: [boundary, boundaries, stopping rule]
    def: The result a trial has to beat at an interim look before stopping counts as evidence rather than as luck.
  - name: Alpha
    aliases: [significance level, type I error]
    def: The chance the trial accepts of calling a difference real when there is none. Every extra look spends some of it.
  - name: Power
    aliases: [powered, underpowered]
    def: The chance a trial finds a difference of a stated size if that difference is really there.
  - name: Intention to treat
    aliases: [intention-to-treat, ITT]
    def: Keeping participants in the group they were randomised to for the primary treatment-strategy analysis. What happens after randomisation still has to be handled explicitly; assignment alone does not make missing outcomes disappear.
  - name: Per protocol
    aliases: [per-protocol]
    def: Analysing a subset defined by adherence to the protocol. It answers a different question and can lose the baseline comparability randomisation created because adherence is determined after assignment.
  - name: Absolute risk reduction
    aliases: [absolute risk, ARR, risk difference]
    def: How much less often the outcome happens on the treatment, stated as a difference in percentage points.
  - name: Relative risk
    aliases: [relative, risk ratio, relative reduction]
    def: How much less often the outcome happens on the treatment, stated as a proportion of the control rate.
  - name: Number needed to treat
    aliases: [NNT, number needed]
    def: How many people have to be treated for one of them to avoid the outcome. One divided by the absolute risk reduction.
  - name: Confidence interval
    aliases: [interval, intervals, CI]
    def: A range produced by a repeated-sampling procedure that, under its model, would cover the true effect at the stated rate. In this game it is used as a compatibility range, not as a probability that the true effect lies inside this one interval.
  - name: Information fraction
    aliases: [information, events accrued]
    def: How far through an event-driven analysis it is. In this simplified trial it is approximated by adjudicated events collected divided by events planned; exact information can depend on the analysis and event timing.
  - name: Multiplicity
    aliases: [multiple comparisons, multiple testing]
    def: The way testing many questions makes at least one look impressive by chance alone.
  - name: Subgroup
    aliases: [subgroups, subgroup analysis]
    def: A slice of the participants — by age, by site, by severity — analysed on its own.
  - name: Blinding index
    aliases: [guessing survey]
    def: A check that asks staff or participants to guess the arm, and compares how often they are right against chance.
  - name: Source data
    aliases: [source document, source documents, source data verification]
    def: The hospital's own notes, made when the care happened. The trial's forms are copies of it.
  - name: Protocol deviation
    aliases: [deviation, deviations]
    def: Something done differently from what the protocol says, recorded whether or not it changed anything.
  - name: Serious adverse event
    aliases: [adverse event, adverse events, SAE]
    def: Harm during a trial that puts someone in hospital, disables them or worse — reported whether or not the drug caused it.
  - name: Equipoise
    aliases: []
    def: Honest uncertainty about which arm is better. It is what makes randomising someone defensible, and it ends when the evidence arrives.
  - name: Database lock
    aliases: [locked, data cut]
    def: Freezing the data at a stated moment so an analysis is of something fixed rather than of a moving target.
  - name: Conditional power
    aliases: []
    def: The chance the trial would end up positive if it carried on to the end, given what it has collected so far.
  - name: Fragility
    aliases: [fragility index]
    def: "A descriptive sensitivity measure: how many binary outcomes would have to change for a nominal significance result to cross its threshold. It is not a substitute for an effect estimate, interval, or prespecified sensitivity analysis."
  - name: Regression to the mean
    aliases: [regression toward the mean]
    def: The tendency of an extreme measurement to be less extreme when it is taken again, whatever was done in between.

beatRooms: [DATA]

missions:
# 15 mission fragment(s), assembled by tools/assemble-book.mjs from
# the_trial_v2/ — edit the fragments, not this file.
# ============================================================ MISSION 1
# Split back out of books/the_trial_v2.yml by tools/split-book.mjs; the book's text, verbatim.
# Lifted from ../fpl_gpt/THE_TRIAL_AP_STATISTICS_Campaign_Implementation_Bible.md by tools/v10extract.mjs. Every quoted string below is
# the bible's, verbatim; engine/dev/bibleParity.mjs holds it to that.
- title: "What Was Promised"
  card:
    header: "MISSION 1 - 15 DAYS UNTIL THE BOARD MEETS."
    title: "What Was Promised"
    goNow: "Go to Regulatory & Registry and meet Lena Wu, regulatory and registry lead, at the commitment terminal."
    body: "15 days until the board meets. An empty board binder sits below the dated registry pages. Today you decide which claims were promised before the trial."
    objective: "Recover the trial's pre-specified claims."
  objective: "Recover the trial's pre-specified claims."
  stake: "15 days until the board meets. An empty board binder sits below the dated registry pages. Today you decide which claims were promised before the trial."
  takeaway: "Median and IQR resist extreme values."
  segue: "But Amina finds two odd recovery records; the board needs to know whether the numbers describe real patients."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Variable", def: "a characteristic recorded for each patient."}
  - {name: "Categorical variable", def: "a variable placing a patient into a group."}
  - {name: "Quantitative variable", def: "a variable recorded as a meaningful number."}
  - {name: "Parameter", def: "a fixed but usually unknown number describing a population."}
  - {name: "Statistic", def: "a number computed from a sample."}
  equations:
  - {"e":"interquartile range (IQR) = Q3 - Q1","c":"Measuring the middle half of a quantitative distribution.","v":[["Q1","the first quartile"],["Q3","the third quartile"],["IQR","interquartile range"]],"s":"The board must flag extreme patient values without letting them redefine the promised outcome."}
  - {"e":"upper fence = Q3 + 1.5(IQR)","c":"Setting the cutoff above which a recorded value is flagged as a possible high outlier.","v":[["Q3","the third quartile"],["IQR","the interquartile range"]],"s":"One patient's 34-day recovery time must be checked objectively before it affects the summary."}
  primer:
  - "Graph choice depends on whether data are categorical or quantitative."
  - "A sample statistic estimates a population parameter."
  - "A claim written after seeing results has a different false-alarm risk."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-regulatory-registry
    # On arrival at Regulatory & Registry | commitment-terminal | automatic
    on: { enter: true, at: REG }
    world: "An empty board binder sits below the dated registry pages."
    panel: "MISSION 1: NAME THE DATA OPEN"
    # unlocks: Unlock Stop 1 at commitment-terminal in Regulatory & Registry.
    bubbles:
    - who: wu   # Lena Wu
      say: "The alert matters. First separate what was promised from what was noticed."
  - id: after-stop-1
    # After Stop 1 | records-wall | automatic
    on: { after: [1] }
    world: "At commitment-terminal, the dated accepted-result slip for Stop 1 reads: \"Improved/not improved is categorical, so compare counts or proportions with a bar chart.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 1 RECORDED - STOP 2 OPEN"
    # unlocks: Unlock Stop 2 at records-wall in Regulatory & Registry.
    bubbles:
    - who: wu   # Lena Wu
      say: "That check holds. The first recovery-time display needs an honest description before the team selects a summary statistic."
  - id: after-stop-2
    # After Stop 2 | evidence-desk | automatic
    on: { after: [2] }
    world: "At records-wall, the dated accepted-result slip for Stop 2 reads: \"Describe shape, outliers, center, and spread, using recovery days and treatment arms in every statement.\". The slip remains in that fixture's evidence holder."
    panel: "VARIABLES CLASSIFIED - DISPLAY CHECK PASSED"
    # unlocks: Unlock Stop 3 at evidence-desk in Regulatory & Registry.
    bubbles:
    - who: wu   # Lena Wu
      say: "Good thinking. Now describe what the display actually shows."
  - id: after-stop-3
    # After Stop 3 | claim-ledger | automatic
    on: { after: [3] }
    world: "At evidence-desk, the dated accepted-result slip for Stop 3 reads: \"IQR = 8 days; upper fence = 18 + 1.5(8) = 30 days. Since 34 > 30, flag it and keep it pending review.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 3 RECORDED - STOP 4 OPEN"
    # unlocks: Unlock Stop 4 at claim-ledger in Regulatory & Registry.
    bubbles:
    - who: wu   # Lena Wu
      say: "That check holds. The descriptive review is ready, but the board must separate registered claims from later discoveries."
  - id: at-mission-end
    # At mission end | commitment-terminal | automatic
    on: { missionEnd: true }
    world: "At records-wall, Lena Wu clips the three registered claims to the first binder sleeve. The dated prop remains here on later visits."
    panel: "MISSION 1 EVIDENCE: RECORDED"
    # unlocks: Open the mission outcome and metric screen.
    bubbles:
    - who: wu   # Lena Wu
      say: "The date stays beside the promise. But Amina finds two odd recovery records; the board needs to know whether the numbers describe real patients."

  # The optional review, offered when the mission is finished and graded
  # nowhere. GENERATED by tools/bible-deeper.mjs from the campaign bible.
  deeper:
    intro: "Try six independent practice questions. Each includes its own context and any needed data; no mission records are required."
    questions:
    - prompt: "Which statement best explains variable?"
      hint: "Identify the defining relationship or mechanism for variable. All needed information is in this question."
      answer: "B"
      options:
      - {key: "A", text: "Treating category labels as quantities could create a meaningless average and mislead the researchers.", why: "This describes variable type and graph choice. It does not answer the question about variable."}
      - {key: "B", text: "A characteristic recorded for each patient.", why: "Correct. A characteristic recorded for each patient."}
      - {key: "C", text: "Shape determines whether mean and standard deviation or median and IQR best summarize what patients experienced.", why: "This describes describing a distribution by shape, outliers, center, and spread. It does not answer the question about variable."}
      - {key: "D", text: "An outlier flag triggers source review; it does not grant permission to delete a patient.", why: "This describes iQR outlier rule. It does not answer the question about variable."}
    - prompt: "The distribution has a long right tail. Which pair of summaries is least affected by unusually long recovery times?"
      hint: "Choose summaries based on middle positions rather than extremes."
      answer: "C"
      figure: {"kind":"bars","xLabel":"Recovery time","yLabel":"Patients","caption":"Recovery-time counts in one study","bars":[{"name":"2 days","value":6},{"name":"5 days","value":11},{"name":"8 days","value":7},{"name":"11 days","value":3},{"name":"20 days","value":2}]}
      options:
      - {key: "A", text: "The mean and range.", why: "Both can be strongly influenced by extreme values."}
      - {key: "B", text: "The maximum and minimum.", why: "These summaries depend entirely on extreme observations."}
      - {key: "C", text: "The median and interquartile range.", why: "Correct. The median and interquartile range."}
      - {key: "D", text: "The average of category codes.", why: "Recovery-time summaries must use the measured times, not arbitrary codes."}
    - prompt: "The distribution has a long right tail. Which pair of summaries is least affected by unusually long recovery times?"
      hint: "Choose summaries based on middle positions rather than extremes."
      answer: "D"
      figure: {"kind":"bars","xLabel":"Recovery time","yLabel":"Patients","caption":"Recovery-time counts in one study","bars":[{"name":"2 days","value":6},{"name":"5 days","value":11},{"name":"8 days","value":7},{"name":"11 days","value":3},{"name":"20 days","value":2}]}
      options:
      - {key: "A", text: "The mean and range.", why: "Both can be strongly influenced by extreme values."}
      - {key: "B", text: "The maximum and minimum.", why: "These summaries depend entirely on extreme observations."}
      - {key: "C", text: "The average of category codes.", why: "Recovery-time summaries must use the measured times, not arbitrary codes."}
      - {key: "D", text: "The median and interquartile range.", why: "Correct. The median and interquartile range."}
    - prompt: "Which statement best explains iQR outlier rule?"
      hint: "Identify the defining relationship or mechanism for iqr outlier rule. All needed information is in this question."
      answer: "A"
      options:
      - {key: "A", text: "An outlier flag triggers source review; it does not grant permission to delete a patient.", why: "Correct. An outlier flag triggers source review; it does not grant permission to delete a patient."}
      - {key: "B", text: "A characteristic recorded for each patient.", why: "This describes variable. It does not answer the question about iqr outlier rule."}
      - {key: "C", text: "Treating category labels as quantities could create a meaningless average and mislead the researchers.", why: "This describes variable type and graph choice. It does not answer the question about iqr outlier rule."}
      - {key: "D", text: "Shape determines whether mean and standard deviation or median and IQR best summarize what patients experienced.", why: "This describes describing a distribution by shape, outliers, center, and spread. It does not answer the question about iqr outlier rule."}
    - prompt: "Which statement best explains pre-specification and scope?"
      hint: "Identify the defining relationship or mechanism for pre-specification and scope. All needed information is in this question."
      answer: "B"
      options:
      - {key: "A", text: "A characteristic recorded for each patient.", why: "This describes variable. It does not answer the question about pre-specification and scope."}
      - {key: "B", text: "A clear sample statistic cannot turn an unregistered observation into a pre-specified population claim.", why: "Correct. A clear sample statistic cannot turn an unregistered observation into a pre-specified population claim."}
      - {key: "C", text: "Treating category labels as quantities could create a meaningless average and mislead the researchers.", why: "This describes variable type and graph choice. It does not answer the question about pre-specification and scope."}
      - {key: "D", text: "Shape determines whether mean and standard deviation or median and IQR best summarize what patients experienced.", why: "This describes describing a distribution by shape, outliers, center, and spread. It does not answer the question about pre-specification and scope."}
    - prompt: "Which statement best explains resistant statistic?"
      hint: "Identify the defining relationship or mechanism for resistant statistic. All needed information is in this question."
      answer: "C"
      options:
      - {key: "A", text: "A characteristic recorded for each patient.", why: "This describes variable. It does not answer the question about resistant statistic."}
      - {key: "B", text: "Treating category labels as quantities could create a meaningless average and mislead the researchers.", why: "This describes variable type and graph choice. It does not answer the question about resistant statistic."}
      - {key: "C", text: "A summary changed little by extreme values.", why: "Correct. A summary changed little by extreme values."}
      - {key: "D", text: "Shape determines whether mean and standard deviation or median and IQR best summarize what patients experienced.", why: "This describes describing a distribution by shape, outliers, center, and spread. It does not answer the question about resistant statistic."}

  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 1: worked examples"
    examples:
    - {"title":"Classify two variables","problem":"A survey records shirt color and height in centimetres. Classify each variable.","rule":"A categorical variable names a group; a quantitative variable records a meaningful numerical amount.","steps":["Shirt color places a person in a category. Numeric color codes would still be labels.","Height measures an amount; differences such as 5 cm have meaning."],"answer":"Color is categorical; height is quantitative.","mistake":"Numbers used as labels do not make a variable quantitative."}
    - {"title":"Distinguish parameter from statistic","problem":"A school has 800 students. A random sample of 40 has mean height 160 cm. Is 160 a parameter or a statistic?","rule":"A parameter describes the population; a statistic is calculated from a sample.","steps":["The population is all 800 students; only 40 heights were used.","The value 160 cm is a sample mean, so it estimates the unknown population mean."],"answer":"It is a statistic.","mistake":"Random sampling does not turn a statistic into a population parameter."}
    - {"title":"Calculate a sample proportion","problem":"In a sample of 20 students, 12 cycle to school. Find the sample proportion.","rule":"p-hat = number with the characteristic / sample size.","steps":["Set up the relationship: p-hat = number with the characteristic / sample size.","p-hat=12/20=0.60=60%."],"answer":"Sixty percent of this sample cycle to school.","mistake":"The sample result is not automatically the exact population proportion."}
    - {"title":"Compare center with an extreme value","problem":"For values 1,2,3,4,20, find mean and median.","rule":"Mean = sum/count; median = middle ordered value.","steps":["Set up the relationship: Mean = sum/count; median = middle ordered value.","mean=(1+2+3+4+20)/5=6; median=3."],"answer":"The mean is 6 and median 3; the high value pulls the mean upward.","mistake":"The midpoint of the smallest and largest values is not the median."}
    - {"title":"Apply the outlier fence","problem":"A dataset has first quartile Q1=4 and third quartile Q3=8. Is 15 an upper outlier under the 1.5-IQR rule?","rule":"IQR=Q3-Q1; upper fence=Q3+1.5IQR. The fence is an outlier-screening boundary.","steps":["Set up the relationship: IQR=Q3-Q1; upper fence=Q3+1.5IQR. The fence is an outlier-screening boundary.","IQR=8-4=4; upper fence=8+1.5(4)=14. Since 15>14, the value is flagged."],"answer":"15 is flagged for investigation, not automatically deleted.","mistake":"An outlier flag does not prove a recording error."}

  stops:
  # --- Stop 1: Name the Data
  #     Concept: variable type and graph choice; Keystone: keystone distribution description; Area: Endpoint Adjudication; Learning role: INTRODUCE; Difficulty: L1; Story role: clue.
  #     placement: CHOICE, asked by Lena Wu beside commitment-terminal.
  - group: ENDP
    at: commitment-terminal
    title: "Name the Data"
    person: wu
    concept: 10   # variable type and graph choice
    reason: "The registry must be turned into displays before the board can inspect treatment outcomes."
    scene: "The registry lists treatment arm, serious-event grade, recovery days, and whether each patient improved. Classifying the primary outcome first determines which display can reveal its pattern without turning category codes into fake measurements."
    motivation: "The outcome's variable type determines whether counts and proportions, rather than numerical averages of category codes, belong in the display."
    format: CHOICE
    question: "Primary outcome: improved by day 30, yes or no. Submit one selection: categorical with bar chart; categorical with histogram; quantitative with bar chart; quantitative with boxplot."
    figure: {"kind":"bars","xLabel":"Day-30 outcome","yLabel":"Patients","caption":"Counts of improved and not-improved patients.","bars":[{"name":"Improved","value":68},{"name":"Not improved","value":32}]}
    choices:
    - "Categorical variable with a bar chart."
    - "Categorical variable with a histogram."
    - "Quantitative variable with a bar chart."
    - "Quantitative variable with a boxplot."
    answer: "Categorical variable with a bar chart."
    answerText: "The completed check shows improved/not improved is categorical, so compare counts or proportions with a bar chart."
    why: "Treating category labels as quantities could create a meaningless average and mislead the board."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (2)
    # correct result: Improved/not improved is categorical, so compare counts or proportions with a bar chart.
    # state/output: Primary outcome gains a text CATEGORICAL label; unlock S2; sets up M9 and M12.

  # --- Stop 2: Describe Before Judging
  #     Concept: SOCS and graph uses; Keystone: keystone distribution description; Area: Endpoint Adjudication; Learning role: INTRODUCE; Difficulty: L2; Story role: obstacle.
  #     placement: SEQUENCE, at records-wall.
  - group: ENDP
    at: records-wall
    title: "Describe Before Judging"
    concept: 31   # SOCS and graph uses
    reason: "The first recovery-time display needs an honest description before the team selects a summary statistic."
    scene: "The recovery-days histogram is the team's first quantitative evidence and is unimodal, right-skewed, with two unusually long recoveries. Use SOCS, meaning shape, outliers, center, and spread, to describe the full distribution before choosing summaries."
    motivation: "The distribution's shape and unusual values determine which center and spread can represent recovery without hiding long cases."
    format: SEQUENCE
    question: "The recovery-days histogram is unimodal and right-skewed, with two unusually long recoveries. Put the four description cards in the order that keeps the summary honest."
    # The four cards and their order are the prompt's own list, kept word for word.
    cards:
    - "shape in context"
    - "unusual values"
    - "center in context"
    - "spread in context"
    order: [0, 1, 2, 3]
    answerText: "The completed check shows describe shape, outliers, center, and spread, using recovery days and treatment arms in every statement."
    why: "Shape determines whether mean and standard deviation or median and IQR best summarize what patients experienced."
    # wrong-path feedback, one rebuttal per wrong option:
    #   List values without comparisons; require SOCS in patient context
    # correct result: Describe shape, outliers, center, and spread, using recovery days and treatment arms in every statement.
    # state/output: SOCS CHECK appears; unlock S3; sets up M2.

  # --- Stop 3: Mark the Extreme
  #     Concept: IQR outlier rule; Keystone: keystone distribution description; Area: Endpoint Adjudication; Learning role: PRACTICE; Difficulty: L2; Story role: clue.
  #     placement: BALLPARK, at evidence-desk.
  - group: ENDP
    at: evidence-desk
    title: "Mark the Extreme"
    concept: 30   # IQR outlier rule
    reason: "The two long recoveries need an objective flag before anyone removes or dismisses them."
    scene: "An unusually long stay appears in the trial log. The team needs a consistent flag for review without silently deleting an observation."
    motivation: "The upper fence determines whether the recorded recovery warrants source review, not whether it should automatically be deleted."
    format: BALLPARK
    question: "Q1=10 days and Q3=18 days. Fill Q3 and the IQR in upper fence=Q3+1.5×IQR. Then compare a 34-day stay with that fence."
    # Every tile and the target are the prompt's own numbers: Q1 10, Q3 18, IQR 8,
    # 1.5 x IQR 12, the 34-day record, and the fence 18 + 12 = 30.
    estimate:
      prompt: "Q1 is 10 days and Q3 is 18 days. The upper fence is Q3 + 1.5(IQR)."
      question: "Build the upper fence in days."
      relationship: "upper fence = Q3 + 1.5 x IQR, so 18 days + 1.5 x 8 days"
      labels:
      - "18 days  (Q3)"
      - "12 days  (1.5 x IQR)"
      - "10 days  (Q1)"
      - "8 days  (IQR)"
      - "34 days  (the long recovery record)"
      values: [18, 12, 10, 8, 34]
      slots: 2
      template: '{0} + {1}'
      formula: a+b
      correct: [0, 1]
      target: 30
      tolerance: 0
      units: days
      solution: "IQR = 18 - 10 = 8 days, so 1.5(IQR) = 12 days and the upper fence is 18 + 12 = 30 days."
      explanation: "Since 34 days is above the 30-day fence, the record is flagged and kept pending review."
    answerText: "The completed check shows IQR = 8 days; upper fence = 18 + 1.5(8) = 30 days. Since 34 > 30, flag it and keep it pending review."
    why: "An outlier flag triggers source review; it does not grant permission to delete a patient."
    # wrong-path feedback, one rebuttal per wrong option:
    #   number in days, then flag selection
    # correct result: IQR = 8 days; upper fence = 18 + 1.5(8) = 30 days. Since 34 > 30, flag it and keep it pending review.
    # state/output: The 34-day record gains amber REVIEW, DO NOT DELETE; unlock S4; pays off M2/M7.

  # --- Stop 4: Seal the Claims
  #     Concept: pre-specification and scope; Keystone: keystone study design; Area: Randomisation & Blinding; Learning role: COMBINE; Difficulty: L4; Story role: decision.

  # --- Stop 27: Read the Residual
  #     Concept: residual plots/nonlinearity; Keystone: keystone regression; Area: Endpoint Adjudication; Learning role: PRACTICE; Difficulty: L3; Story role: reveal.
  #     placement: RESIDUAL, at deletion-diagnostic.
  - group: ENDP
    at: deletion-diagnostic
    title: "Read the Residual"
    concept: 30   # residual plots/nonlinearity
    reason: "The fitted line needs a residual check before it is used to adjust patient follow-up comparisons."
    scene: "With the line established, Data Management reveals residuals by distance band. Compare their root-mean-square error (RMS) and shapes, rejecting a lower RMS when its curved or fan-shaped pattern shows systematic error."
    motivation: "Residual structure determines whether the distance model systematically misses curvature or changing variability."
    format: RESIDUAL
    question: "Compare three residual fields: A has random scatter and root-mean-square error (RMS) 2.1, B has a U-shape and RMS 1.8, and C has a fan shape and RMS 1.9. Submit the valid model and interpret residual signs."
    answerText: "The completed check shows choose A. Residual=y-y-hat; positive means the model underpredicted. Pattern matters more than the smallest RMS."
    why: "Random residual scatter supports linear form; structure means the missingness rule remains incomplete."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Lowest RMS always wins; reject structured error
    # correct result: Choose A. Residual=y-y-hat; positive means the model underpredicted. Pattern matters more than the smallest RMS.

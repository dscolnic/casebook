    - {"title":"Recognize extrapolation","problem":"A line was fitted to plants aged 1 to 5 weeks. It predicts their height at 30 weeks. Is this use supported?","rule":"Extrapolation predicts beyond the input range used to fit a model.","steps":["Thirty weeks is outside the observed 1-to-5-week range.","Growth may change after five weeks; the observed fit does not test that later behavior."],"answer":"The prediction is extrapolation and needs new evidence.","mistake":"A high correlation inside the data range does not validate distant predictions."}
    - {"title":"Recognize a systematic miss","problem":"A model has residuals +2,+2,+2,+2 units at four inputs. Another has -1,+1,-1,+1. What does the first pattern suggest?","rule":"Residuals are observations minus predictions; a repeated offset can indicate bias.","steps":["first mean residual = (2+2+2+2)/4 = +2 units. Every prediction is low.","second mean residual = (-1+1-1+1)/4 = 0 units. Its signed errors cancel, though errors remain."],"answer":"The first model shows a consistent underprediction that should be investigated.","mistake":"A zero mean residual does not by itself prove a model is accurate or free of pattern."}

  stops:
  # --- Stop 49: Pass LINE
  #     Concept: LINE; Keystone: keystone regression/conditions; Area: Endpoint Adjudication; Learning role: RETRIEVE; Difficulty: L3; Story role: obstacle.
  #     placement: RESIDUAL, at residual-wall.
  - group: ENDP
    at: residual-wall
    title: "Pass LINE"
    concept: 30   # LINE
    reason: "The dose-response line needs its inference conditions checked before a slope claim is made."
    scene: "The dose-response scatterplot looks linear, but inference needs more than the fitted line. Select the residual field with random scatter, near-Normal shape, independent patients, and equal spread across fitted values."
    motivation: "The residual and design evidence determines whether linear slope inference is justified for the patients measured."
    format: RESIDUAL
    question: "Inspect residual fields A, B, and C for LINE: linearity, independence, Normal residuals, and equal variance. Submit the only field passing all four conditions. Use ordered observation coordinates 1–5 on the residual axis."
    answerText: "The completed check shows a passes LINE: linear residual pattern, independent observations, Normal residuals, and equal variance."
    why: "A small slope p-value cannot repair nonlinearity or a fan-shaped residual field."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Small p repairs a bad model
    # correct result: A passes LINE: linear residual pattern, independent observations, Normal residuals, and equal variance.
    # state/output: slope output unlocks.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   fields A random/equal/normal, B curve, C fan; correct A; independence supplied by random patient units.
    residual:
      fits:
        - id: patterned_low_error
          label: lower average error but patterned residuals
          rms: 0.18
          structured: true
          residuals:
            - x: 1
              y: -0.12
              value: -0.12
            - x: 2
              y: -0.06
              value: -0.06
            - x: 3
              y: 0
              value: 0
            - x: 4
              y: 0.06
              value: 0.06
            - x: 5
              y: 0.12
              value: 0.12
        - id: unpatterned_generalising
          label: slightly higher error with no directional pattern
          rms: 0.21
          residuals:
            - x: 1
              y: 0.05
              value: 0.05
            - x: 2
              y: -0.04
              value: -0.04
            - x: 3
              y: 0.02
              value: 0.02
            - x: 4
              y: -0.03
              value: -0.03
            - x: 5
              y: 0.01
              value: 0.01
      accept: unpatterned_generalising

  # --- Stop 50: Infer the Slope
  #     Concept: slope test/CI and one-tail trap; Keystone: keystone regression/CI/tests; Area: Endpoint Adjudication; Learning role: COMBINE; Difficulty: L4; Story role: reveal.
  #     placement: DERIVE, at analysis-board.
  - group: ENDP
    at: analysis-board
    title: "Infer the Slope"
    concept: 26   # slope test/CI and one-tail trap
    reason: "The slope conditions pass, allowing the dose-response estimate to be tested and bounded."
    scene: "The model passes LINE; output gives b=-0.80 recovery day per dose unit, SE(b)=0.25, and n=30. Derive t, df, the 95% interval, and the correct one-sided p-value from the reported two-sided p=.0034."
    motivation: "The slope statistic, interval, and directional probability quantify evidence for changing recovery time with dose."
    format: DERIVE
    question: "A regression with 30 patients gives slope b=-0.80 recovery day per dose unit and SE(b)=0.25; use t-star=2.048 and a reported two-sided P=0.0034. Calculate t, degrees of freedom, the 95% interval, and the one-sided P-value for a negative slope."
    answerText: "Each dose unit predicts.80 fewer recovery day; the 95% population-slope interval is -1.312 to -.288."
    why: "Direction, units, and uncertainty determine whether the trend is useful rather than merely significant."
    # wrong-path feedback, one rebuttal per wrong option:

  # --- Stop 54: Buy Decision-Changing Evidence
  #     Concept: value of information; Keystone: keystone decision/inference; Area: Monitoring Board Room; Learning role: COMBINE; Difficulty: L5; Story role: character.
  #     placement: VALUE, asked by Tomas Reed beside evidence-budget-desk.
  - group: SAFE
    at: evidence-budget-desk
    title: "Buy Decision-Changing Evidence"
    person: reed
    concept: "value of information"
    reason: "Only one day of staff time remains, so evidence must be chosen by whether it could change action."
    scene: "The stress test leaves one uncertain harm boundary, while efficacy and file integrity are already locked. Spend a 60-hour budget on evidence that can narrow harm uncertainty without reopening settled analyses."
    motivation: "More data are not automatically valuable; useful evidence must alter the stop-or-continue decision."
    format: VALUE
    question: "Allocate at most 60 staff-hours among the five evidence options. Submit the combination that narrows harm uncertainty without reopening locked analyses."
    # MODEL CONVERSION. The payload marks the two options it wants bought
    # `required: true`; the engine's word for "this one would change the decision"
    # is `decisive`, and the pair it names is the payload's own `correct_purchase`.
    # Budget 60, the five costs and the five axes are the payload's, and its
    # `total_available_cost: 115` is what those five costs already add to.
    # The payload gives ids and no labels, so each `label` is that id made readable
    # in the words its own answerText uses ("source calls", "the independent kit
    # audit"). That is a rename, not new copy. The payload supplies no `reveals`
    # line for any option, so none is written; the importer warns and imports.
    value:
      budget: { amount: 60, unit: "staff-hours" }
      options:
      - { id: source_calls, label: "Source calls", axis: "late-event outcome verification", cost: 30, decisive: true }
      - { id: kit_audit, label: "Independent kit audit", axis: "independent exposure verification", cost: 20, decisive: true }
      - { id: efficacy_rerun, label: "Efficacy rerun", axis: "settled efficacy estimate", cost: 25 }
      - { id: staff_survey, label: "Staff survey", axis: "workflow opinion", cost: 15 }
      - { id: biomarker, label: "Biomarker", axis: "new exploratory mechanism", cost: 25 }
      commit: "Order the evidence"
    answerText: "The completed check shows fund source calls and the independent kit audit; they address the live harm boundary."
    why: "More data are not automatically valuable; useful evidence must alter the stop-or-continue decision."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Any new data are valuable
    # correct result: Fund source calls and the independent kit audit; they address the live harm boundary.
    # state/output: evidence orders; travel BOARD.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   value:{budget:60,options:[{id:"source_calls",axis:"late-event outcome verification",cost:30,required:true},{id:"kit_audit",axis:"independent exposure verification",cost:20,required:true},{id:"efficacy_rerun",axis:"settled efficacy estimate",cost:25,required:false},{id:"staff_survey",axis:"workflow opinion",cost:15,required:false},{id:"biomarker",axis:"new exploratory mechanism",cost:25,required:false}],total_available_cost:115,correct_purchase:["source_calls","kit_audit"],reserve:10,answerText:"Buy source calls and the independent kit audit for 50 hours; only they can narrow the unresolved harm boundary."}

  # --- Stop 55: Predict Power Direction
  #     Concept: power/sample size/effect/alpha/sigma; Keystone: keystone errors/power; Area: Randomisation & Blinding; Learning role: RETRIEVE; Difficulty: L3; Story role: decision evidence.
  #     placement: CLOUD, at board-simulator.
  - group: RAND
    at: board-simulator
    title: "Predict Power Direction"
    concept: "power/sample size/effect/alpha/sigma"
    reason: "The board must know whether one follow-up wave can materially narrow uncertainty."
    scene: "The funded calls add observations and reduce missingness without changing alpha or the target effect. Narrow the sampling cloud by increasing n from 200 to 320 while holding effect and variability assumptions fixed."
    motivation: "A narrower sampling distribution increases power and makes the final trigger informative."
    format: CLOUD
    question: "control n 200-320; fixed alpha=.025,effect=4/1000,sigma assumption; target corridor harm boundary; correct conclusion spread decreases, power increases, center unchanged."
    answerText: "The completed check shows increasing n narrows standard error and increases power; it does not move the expected center."
    why: "A narrower sampling distribution increases power and makes the final trigger informative."
    # wrong-path feedback, one rebuttal per wrong option:
    #   n setting and direction-of-change conclusion
    # correct result: Increasing n narrows standard error and increases power; it does not move the expected center.
    # state/output: S4.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   cloud:{settings:[{id:"n200",n:200,center:0.004,spread:0.0031,power:0.52},{id:"n240",n:240,center:0.004,spread:0.0028,power:0.60},{id:"n280",n:280,center:0.004,spread:0.0026,power:0.67},{id:"n320",n:320,center:0.004,spread:0.0024,power:0.73}],fixed:{alpha:0.025,effect:0.004,variance_assumption:"unchanged"},corridor:"harm boundary",correct_conclusion:"larger n narrows spread and raises power without moving center",answerText:"Increasing n from 200 to 320 narrows the sampling cloud and raises power; its expected center stays fixed."}

  # --- Stop 56: Write the Rule
  #     Concept: integrated decision threshold; Keystone: keystone tests/errors; Area: Monitoring Board Room; Learning role: TRANSFER; Difficulty: L5; Story role: decision.
  #     placement: TRIGGER, at trigger-rail.
  - group: SAFE
    at: trigger-rail
    title: "Write the Rule"
    concept: "integrated decision threshold"
    reason: "The last follow-up cannot begin until its stop rule is fixed."
    scene: "The chosen evidence can improve power, but waiting exposes more patients. Commit the harm threshold and maximum enrollment before the new calls arrive, then map each possible result to stop, modify, or continue."
    motivation: "Precommitment prevents a favored outcome from moving the safety boundary tomorrow."
    format: TRIGGER
    question: "rule stop if upper 95% harm bound >=4/1000; modify if 2 to <4; continue if <2; max additional enrollment120; scale 0-6 anchors2,4; inclusive stop at4; objective preserve benefit, consequence limit 4 excess serious events/1000."
    answerText: "The completed check shows authorize one 120-patient follow-up under the written 2/4 thresholds; stop is inclusive at 4."
    why: "Precommitment prevents a favored outcome from moving the safety boundary tomorrow."
    # wrong-path feedback, one rebuttal per wrong option:
    #   numeric threshold pair, enrollment cap, action mapping
    # correct result: Authorize one 120-patient follow-up under the written 2/4 thresholds; stop is inclusive at 4.
    # state/output: binder14; M15.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   trigger: {visible_prompt: "rule stop if upper 95% harm bound >=4/1000; modify if 2 to <4; continue if <2; max additional enrollment120; scale 0-6 anchors2,4; inclusive stop at4; objective preserve benefit, consequence limit 4 excess serious events/1000.", keyed_result: "Authorize one 120-patient follow-up under the written 2/4 thresholds; stop is inclusive at 4.", feedback: "numeric threshold pair, enrollment cap, action mapping", answerText: "Use the keyed result and explanation printed below."}
# ============================================================ MISSION 15
# Lifted from ../fpl_gpt/THE_TRIAL_AP_STATISTICS_Campaign_Implementation_Bible.md by tools/v10extract.mjs. Every quoted string below is
# the bible's, verbatim; engine/dev/bibleParity.mjs holds it to that.
- title: "The Board Pack"
  card:
    header: "DAY 15 - BOARD TODAY"
    title: "The Board Pack"
    goNow: "Go to Regulatory & Registry and meet Mara Voss, trial director, at the delivery board."
    body: "The follow-up is complete, and every earlier result now feeds one board decision. The final claim must match the design, conditions, uncertainty, error rules, and patient stakes. Audit the pack in Regulatory, verify the source at Adjudication, then execute the rule upstairs. By the end of the mission, decide whether CLARION-3 stops, changes, or continues under safeguards."
    objective: "Sign and deliver the Monitoring Board Pack."
  objective: "Sign and deliver the Monitoring Board Pack."
  stake: "The follow-up is complete, and every earlier result now feeds one board decision. The final claim must match the design, conditions, uncertainty, error rules, and patient stakes. Audit the pack in Regulatory, verify the source at Adjudication, then execute the rule upstairs. By the end of the mission, decide whether CLARION-3 stops, changes, or continues under safeguards."
  takeaway: "Use State-Plan-Do-Conclude for every inference argument. ---"
  segue: "Mission decision: Continue with safeguards. The harm bound is below the written line. The benefit range stays above zero. The board signs the full statistical case."
  # The mission card's own "Primer concepts", printed on the plan card.
  primer:
  - "Do not introduce new analyses in the finale."
  - "Carry earlier results forward even after an arithmetic error; the reasoning can still be assessed."
  - "Say fail to reject, never accept or prove the null."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-regulatory-registry
    # On arrival at Regulatory & Registry | records-wall | automatic
    on: { enter: true, at: REG }
    world: "Arrival: REG entry; 14 binder slots lit; Mara says, ; - After S1: method links illuminate; waypoint TAKE SOURCE CLAIMS TO ADJUDICATION. - ADJUD after S2: source/scope stamp appears; waypoint CARRY COMPLETE PACK TO MONITORING BOARD. - BOARD after S3: locked rule displays CONTINUE WITH SAFEGUARDS; - Final/outcome: signatures appear, binder slot15 fills, doors open, BOARD PACK ACCEPTED; timer remains paused; metric victory screen unlocks."
    panel: "MISSION 15: RECONSTRUCT THE EVIDENCE CHAIN OPEN"
    bubbles:
    - who: voss   # Mara Voss
      say: "Rebuild the chain before anyone signs"
  - id: after-stop-57
    # After Stop 57 | outcome-viewer | automatic
    on: { after: [1] }
    world: "The reconstruct the evidence chain result remains visible while the state the reach fixture lights."
    panel: "STOP 57 RECORDED - STOP 58 OPEN"
    bubbles:
    - who: voss   # Mara Voss
      say: "Use the Stop 57 result to settle state the reach."
  - id: after-stop-58
    # After Stop 58 | board-console | automatic
    on: { after: [2] }
    world: "The state the reach result remains visible while the apply the trigger fixture lights."
    panel: "STOP 58 RECORDED - STOP 59 OPEN"
    bubbles:
    - who: voss   # Mara Voss
      say: "Use the Stop 58 result to settle apply the trigger."
  - id: after-stop-59
    # After Stop 59 | board-table | automatic
    on: { after: [3] }
    world: "The apply the trigger result remains visible while the sign the statistical argument fixture lights."
    panel: "STOP 59 RECORDED - STOP 60 OPEN"
    bubbles:
    - who: voss   # Mara Voss
      say: "Use the Stop 59 result to settle sign the statistical argument."
  - id: at-mission-end
    # At mission end | records-wall | automatic
    on: { missionEnd: true }
    world: "The completed decision changes the mission world and locks into the campaign record."
    panel: "MISSION 15 EVIDENCE: RECORDED"
    bubbles:
    - who: voss   # Mara Voss
      say: "The mission decision is recorded. Carry it into the next briefing."

  stops:
  # --- Stop 57: Reconstruct the Evidence Chain
  #     Concept: cumulative matching; Keystone: all keystones; Area: Monitoring Board Room; Learning role: RETRIEVE; Difficulty: L4; Story role: payoff.
  #     placement: CASEBOOK, at records-wall.
  - group: SAFE
    at: records-wall
    title: "Reconstruct the Evidence Chain"
    concept: "cumulative matching"
    reason: "A pack piece is useless if its result is attached to the wrong claim or design."
    scene: "Fourteen pieces now fill the delivery board, but four headline conclusions have lost their method labels. Match each conclusion to its study design, conditions, and correct statistical procedure before signing."
    motivation: "The board can act only when every conclusion remains traceable to the data-generating process."
    format: CASEBOOK
    question: "Match each of four conclusions to its study design, required conditions, and correct procedure. Submit the complete evidence-chain mapping."
    # The four conclusions, the four procedures and the order they pair in are the
    # payload's own lists, kept word for word; "exact mapping" is the identity one.
    scenarios:
    - "primary binary arm effect"
    - "paired recovery"
    - "site event distributions"
    - "dose-response quantitative trend"
    choices:
    - "two-prop z"
    - "paired t"
    - "chi-square homogeneity"
    - "slope t"
    mapping: [0, 1, 2, 3]
    answerText: "The completed check shows match procedure to variable type and design; formulas do not determine scope by themselves."
    why: "The board can act only when every conclusion remains traceable to the data-generating process."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Formula alone chooses test
    # correct result: Match procedure to variable type and design; formulas do not determine scope by themselves.
    # state/output: pack chain lights; travel ADJUD.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   scenarios primary binary arm effect, paired recovery, site event distributions, dose-response quantitative trend; choices two-prop z, paired t, chi-square homogeneity, slope t; exact mapping.

  # --- Stop 58: State the Reach
  #     Concept: causation/generalization/measurement; Keystone: design and scope; Area: Randomisation & Blinding; Learning role: TRANSFER; Difficulty: L5; Story role: payoff.
  #     placement: DIAGNOSIS, at outcome-viewer.
  - group: RAND
    at: outcome-viewer
    title: "State the Reach"
    concept: "causation/generalization/measurement"
    reason: "The final claim must not reach beyond the patients or measurements the trial can support."
    scene: "The reconstructed chain shows random assignment, repaired but not population-random enrollment, verified endpoints, and bounded missingness. Choose the strongest treatment conclusion that every one of those design facts permits the board to state."
    motivation: "A correct calculation can still produce an invalid claim if its population or causal reach is overstated."
    format: DIAGNOSIS
    question: "Use random assignment, nonrandom enrollment, partial rural repair, and verified endpoints. Submit one causal conclusion and one generalization limit."
    # The four readings, their pass/absent/partial values and the four choices are
    # the payload's, as is the keyed first one.
    # DERIVED, not the bible's: `zone`, `label` and the status words. The engine
    # groups readings by zone and needs three, so each reading's zone is its own
    # subject as the payload names it, and `label` says only that the row is a
    # check. The payload's "pass" is a normal status, "absent" an alarm, and
    # "partial" the one in between.
    readings:
    - { zone: "random assignment", label: "check", value: "pass", status: normal }
    - { zone: "random population sample", label: "check", value: "absent", status: alarm }
    - { zone: "rural repair", label: "check", value: "partial", status: low }
    - { zone: "endpoint audit", label: "check", value: "pass", status: normal }
    choices:
    - "causation for trial-like patients with limited generalization"
    - "association only"
    - "universal causation"
    - "population generalization no cause"
    answer: "causation for trial-like patients with limited generalization"
    answerText: "The completed check shows infer a causal treatment effect for patients like those enrolled, while limiting generalization to broader populations."
    why: "A correct calculation can still produce an invalid claim if its population or causal reach is overstated."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Random assignment implies universal generalization
    # correct result: Infer a causal treatment effect for patients like those enrolled, while limiting generalization to broader populations.
    # state/output: source VERIFIED; travel BOARD.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   readings random assignment pass, random population sample absent, rural repair partial, endpoint audit pass. Choices causation for trial-like patients with limited generalization; association only; universal causation; population generalization no cause. Answer first.

  # --- Stop 59: Apply the Trigger
  #     Concept: integrated interval/trigger; Keystone: keystone CI/errors; Area: Monitoring Board Room; Learning role: TRANSFER; Difficulty: L5; Story role: climax.
  #     placement: VERIFY, at board-console.
  - group: SAFE
    at: board-console
    title: "Apply the Trigger"
    concept: "integrated interval/trigger"
    reason: "The written safety rule, not preference, must control the board action."
    scene: "The final source calls yield an excess-harm 95% upper bound of 1.8 per 1,000, below the prewritten continuation line of 2.0. Verify the displayed calculation and apply the locked rule."
    motivation: "Executing a rule after data appear proves that the trial's safeguards are operational rather than decorative."
    format: VERIFY
    question: "**CALCULATE AND COMMIT:** Use upper bound = estimate + 1.96(SE) with estimate 0.60 events/1,000 and SE 0.612 events/1,000; submit the upper bound in events/1,000 before the rule panel unlocks."
    relationship: "upper bound = estimate + 1.96 x SE, so 0.60 + 1.96 x 0.612 events per 1,000 patients"
    # ---- MODEL CONVERSION, the same one redsand's VERIFY needed.
    # The payload gives one submitted quantity (upper harm bound, truth 1.80,
    # tolerance 0.01) and one measurement (upper_bound 1.80). This engine's VERIFY
    # has the player DIAL a prediction on a range and then compares it against what
    # the measurement finds, so:
    #   · `truth` is the measured value, 1.80 events per 1,000
    #   · the dial spans 0 to 4.0 — the floor of a harm bound and the top of the
    #     payload's own rule bands ("continue below 2.0", "modify from 2.0 to below
    #     4.0", "stop at or above 4.0") — at the payload's own 0.01 step, wide
    #     enough that not every dial position passes
    #   · `passRatio` [0.9944, 1.0056] is the payload's +/-0.01 on 1.80 as a ratio
    # `intervention` is the payload's `operation.action`, and `measurement` its
    # `measurements` row; the payload sets restore.required false, so nothing is
    # restored here.
    verify:
      prediction:
        label: "Upper harm bound"
        unit: "events per 1,000 patients"
        min: 0
        max: 4.0
        step: 0.01
      truth: 1.80
      passRatio: [0.9944, 1.0056]
      intervention:
        label: "Apply the locked safety rule"
        note: "Continue below 2.0; modify from 2.0 to below 4.0; stop at or above 4.0."
      measurement:
        label: "Final source calls: upper harm bound and benefit interval"
    answerText: "0.6+1.96(.612)=1.80 per 1,000, below 2.0; benefit interval excludes zero, so continue under safeguards."
    why: "Executing a rule after data appear proves that the trial's safeguards are operational rather than decorative."
    # wrong-path feedback, one rebuttal per wrong option:
    #   predicted upper bound in events/1000, measured values, action conclusion
    # correct result: Predicted and measured upper bound 1.80 events per 1,000 patients, tolerance 0.01 event per 1,000; conclusion continue under safeguards.
    # state/output: rule displays CONTINUE WITH SAFEGUARDS; S4.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   verify:{required_sequence:[calculate_and_commit,operate,measure,interpret],prediction:{equation:"upper bound=estimate+1.96(SE)",inputs:{estimate:0.60,SE:0.612,critical_value:1.96},submit:{quantity:"upper harm bound",unit:"events per 1,000 patients",truth:1.80,tolerance:0.01}},equipment_locked_until_prediction_commit:true,operation:{action:"apply locked safety rule",fixed:["continue below 2.0","modify from 2.0 to below 4.0","stop at or above 4.0"]},measurements:{upper_bound:1.80,unit:"events per 1,000 patients",benefit_interval:"excludes zero"},restore:{required:false,reason:"rule application changes no equipment setting"},correct_conclusion:"continue under safeguards",answerText:"The upper harm bound is 1.80 per 1,000, below 2.0, while benefit excludes zero; continue under safeguards."}

  # --- Stop 60: Sign the Statistical Argument
  #     Concept: FRQ State-Plan-Do-Conclude; Keystone: all keystones; Area: Monitoring Board Room; Learning role: TRANSFER; Difficulty: L5; Story role: final decision.
  #     placement: SEQUENCE, at board-table.
  - group: SAFE
    at: board-table
    title: "Sign the Statistical Argument"
    concept: "FRQ State-Plan-Do-Conclude"
    reason: "The board needs one complete argument whose words, symbols, conditions, work, and conclusion agree."
    scene: "The trigger permits guarded continuation, but the signed record must show how that conclusion was earned. Order State, Plan, Do, and Conclude, preserving population names, units, conditions, calculations, and cautious language."
    motivation: "A reproducible argument lets future monitors challenge any step without rewriting the result."
    format: SEQUENCE
    question: "cards: State parameters/hypotheses in words/symbols; Plan procedure/check conditions; Do formula/statistic/p-value or interval; Conclude compare p to alpha and interpret in context. Exact order. A prior guessed value may carry forward without double penalty."
    # The four cards are the prompt's own list, split at its semicolons and kept
    # word for word; "Exact order" is the order they are listed in.
    cards:
    - "State parameters/hypotheses in words/symbols"
    - "Plan procedure/check conditions"
    - "Do formula/statistic/p-value or interval"
    - "Conclude compare p to alpha and interpret in context"
    order: [0, 1, 2, 3]
    answerText: "The completed check shows state, Plan, Do, Conclude. Use patient variables and units; never say accept H0, prove H0, or omit context."
    why: "A reproducible argument lets future monitors challenge any step without rewriting the result."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Conclusion can omit context or say accept H0
    # correct result: State, Plan, Do, Conclude. Use patient variables and units; never say accept H0, prove H0, or omit context.
    # state/output: signature applied; piece15; final payoff.

copy:
  RAND: <p>The kit warehouse and the cold room. 4000 boxes in numbered order, identical but for the number, and a fridge with a logger on the door.</p>
  ENDP: <p>The adjudication room. Two reading screens back to back, files with the arm and the site stripped out, and a definition on the wall that has not changed in four years.</p>
  SAFE: <p>The monitoring board room. A table for 9, a closed-session sign, and the only meeting in this building that sees CLARION-3 by arm.</p>
  STAT: <p>The statistics room. The analysis plan, the boundary for each look, and every version of both with the date it took effect.</p>
  SITE: <p>The monitors&rsquo; room. Banker&rsquo;s boxes of couriered source documents, a verification table, and a queue of queries waiting on 31 hospitals.</p>
  REG: <p>Regulatory and registry. What the trial promised, when it promised it, and what it still owes the people it reports to.</p>
  SCREEN: <p>Screening and consent. Two chairs, a table and an eligibility checklist &mdash; where somebody becomes a participant, or does not.</p>
  INFUSE: <p>The infusion bay. Six chairs, drip stands, a wall clock, and bags nobody in the room can tell apart.</p>
  LAB: <p>The central lab and sample store. A &minus;80 freezer, racks of aliquots and a chain-of-custody sheet on a clipboard.</p>
  DATA: "<p>The data management floor. Desks, the query board, and the enrolment wall: one card per site, filling as the trial recruits.</p>"
  UNBLIND: <p>Unblinded statistics. One desk, one locked screen, printouts face down. The smallest room on the floor.</p>
  RANDOM: <p>The randomisation office. The allocation server, its monitors facing the wall, and a cabinet of code-break envelopes with two entries in the log.</p>
  ARCHIVE: <p>The trial master file. Every version of the protocol, every approval, and the dates that make the rest of it mean anything.</p>


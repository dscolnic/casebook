  # --- Stop 51: Count the Claims
  #     Concept: registered tests; Keystone: keystone multiplicity/reporting; Area: Monitoring Board Room; Learning role: RETRIEVE; Difficulty: L4; Story role: clue.
  #     placement: ATTEST, asked by Tomas Reed beside claim-ledger.
  - group: SAFE
    at: claim-ledger
    title: "Count the Claims"
    person: reed
    concept: 17   # registered tests
    reason: "The slope finding joins several secondary analyses, so the correction family must be established."
    scene: "The secondary-analysis family must be counted before adjusting its error allowance. The registry distinguishes planned tests from a later exploratory addition."
    motivation: "The timestamps determine which tests belong to the pre-specified family and which results remain exploratory."
    format: ATTEST
    question: "Use registry timestamps to identify the predeclared family; do not add a later analysis to that original family. Read the displayed source excerpts, then select every supported claim and leave unsupported claims unsigned."
    # MODEL CONVERSION. `verification_limit` (10) is the engine's `checks`, and the
    # payload's backed/critical flags carry over one for one — ten backed and
    # critical, the eleventh critical and unbacked, which is `critical_unbacked`.
    # `correct_verified` is what those flags already encode.
    # The payload gives ids and no labels, so each `label` is that id made readable
    # in the stop's own nouns — "the ten preregistered secondary-test timestamps"
    # and the biomarker. That is a rename, not new copy.
    # DERIVED, not the bible's: `evidence` and `signedBy`. The engine prints one
    # line per claim saying what a check turns up; the payload's own test is the
    # registry timestamp, so each line reports only that, and the payload's
    # `signed: true` is attributed to the person the stop is asked by.
    attest:
      checks: 10
      claims:
      - { id: secondary_1, label: "Secondary test 1", critical: true, backed: true,
          signedBy: "Tomas Reed", evidence: "Registry timestamp recorded before results appeared." }
      - { id: secondary_2, label: "Secondary test 2", critical: true, backed: true,
          signedBy: "Tomas Reed", evidence: "Registry timestamp recorded before results appeared." }
      - { id: secondary_3, label: "Secondary test 3", critical: true, backed: true,
          signedBy: "Tomas Reed", evidence: "Registry timestamp recorded before results appeared." }
      - { id: secondary_4, label: "Secondary test 4", critical: true, backed: true,
          signedBy: "Tomas Reed", evidence: "Registry timestamp recorded before results appeared." }
      - { id: secondary_5, label: "Secondary test 5", critical: true, backed: true,
          signedBy: "Tomas Reed", evidence: "Registry timestamp recorded before results appeared." }
      - { id: secondary_6, label: "Secondary test 6", critical: true, backed: true,
          signedBy: "Tomas Reed", evidence: "Registry timestamp recorded before results appeared." }
      - { id: secondary_7, label: "Secondary test 7", critical: true, backed: true,
          signedBy: "Tomas Reed", evidence: "Registry timestamp recorded before results appeared." }
      - { id: secondary_8, label: "Secondary test 8", critical: true, backed: true,
          signedBy: "Tomas Reed", evidence: "Registry timestamp recorded before results appeared." }
      - { id: secondary_9, label: "Secondary test 9", critical: true, backed: true,
          signedBy: "Tomas Reed", evidence: "Registry timestamp recorded before results appeared." }
      - { id: secondary_10, label: "Secondary test 10", critical: true, backed: true,
          signedBy: "Tomas Reed", evidence: "Registry timestamp recorded before results appeared." }
      - { id: late_biomarker, label: "Late biomarker analysis", critical: true,
          signedBy: "Tomas Reed", evidence: "No registry timestamp; the analysis was added after results appeared." }
      commit: "Close the correction family"
    answerText: "Each signature is limited to what its source establishes. The unsupported claims lack the specific date, physical condition, independence or scope they assert."
    why: "Counting only significant results would hide the number of chances that produced them."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Count only significant tests
    # correct result: The correction family contains ten pre-specified tests; the added biomarker is exploratory.
    # state/output: travel BOARD.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   attest:{verification_limit:10,claims:[{id:"secondary_1",signed:true,backed:true,critical:true},{id:"secondary_2",signed:true,backed:true,critical:true},{id:"secondary_3",signed:true,backed:true,critical:true},{id:"secondary_4",signed:true,backed:true,critical:true},{id:"secondary_5",signed:true,backed:true,critical:true},{id:"secondary_6",signed:true,backed:true,critical:true},{id:"secondary_7",signed:true,backed:true,critical:true},{id:"secondary_8",signed:true,backed:true,critical:true},{id:"secondary_9",signed:true,backed:true,critical:true},{id:"secondary_10",signed:true,backed:true,critical:true},{id:"late_biomarker",signed:true,backed:false,critical:true}],correct_verified:["secondary_1","secondary_2","secondary_3","secondary_4","secondary_5","secondary_6","secondary_7","secondary_8","secondary_9","secondary_10"],critical_unbacked:"late_biomarker",answerText:"Count and verify all ten preregistered secondary claims; exclude the biomarker added after results appeared."}

  # --- Stop 52: Correct Before Seeing
  #     Concept: familywise error/complement/power; Keystone: keystone probability/errors; Area: Statistics & Analysis; Learning role: TRANSFER; Difficulty: L5; Story role: decision.
  #     placement: TRIGGER, at trigger-rail.
  - group: STAT
    at: trigger-rail
    title: "Correct Before Seeing"
    concept: 17   # familywise error/complement/power
    reason: "The registered test family needs an error-control threshold before its p-values are revealed."
    scene: "Ten independent null tests at alpha=.05 create about a 40% chance of at least one false positive. Commit the Bonferroni threshold, then reveal the secondary p-values and select survivors."
    motivation: "The family-wise threshold determines which secondary findings survive correction for repeated testing."
    format: TRIGGER
    question: "calculate/commit 1-.95^10=.4013 and.05/10=.005; threshold scale 0-.05, anchors.001,.005,.01,.05; reveal p-values [.0017,.004,.007,.012,.02,.03,.08,.11,.24,.61]; survivors first two."
    answerText: "Use alpha=.005 per test. The slope and one other claim survive; the biomarker does not enter the family."
    why: "Correction protects the family claim while preserving the observed effect sizes for transparent reporting."
    # wrong-path feedback, one rebuttal per wrong option:
    #   family-risk percent, threshold, survivor selection
    # correct result: 40.13%, .005 inclusive; first two survive.
    # state/output: binder13; Evidence locks; M14.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   trigger:{prediction:{equation:"family risk=1-(1-alpha)^m",inputs:{alpha:0.05,m:10},truth:0.4013,tolerance:0.002},decision_rule:"retain only p≤0.005",scale:{min:0,max:0.05,anchors:[0.001,0.005,0.01,0.05]},updates:[0.0017,0.004,0.007,0.012,0.02,0.03,0.08,0.11,0.24,0.61],correct_survivors:[0.0017,0.004],answerText:"Ten uncorrected tests have 40.13% family risk; the Bonferroni line is 0.005, so only the first two p-values survive."}
    trigger:
      scale:
        label: corrected p-value
        unit: p
        min: 0
        max: 0.05
        step: 0.001
        anchors:
          - at: 0.01
            means: routine baseline, not the decision threshold
          - at: 0.0325
            means: elevated evidence requiring attention
      direction: falling
      conditions:
        - id: act
          label: Take the protective action
          leadHours: 12
          window:
            min: 0
            max: 0.025
      stream:
        - at: T-48 h
          value: 0.045
          hoursLeft: 48
        - at: T-24 h
          value: 0.035
          hoursLeft: 24
        - at: T-12 h
          value: 0.025
          hoursLeft: 12
        - at: T-6 h
          value: 0.015
          hoursLeft: 6

    - {"title":"Calculate power","problem":"A test has Type II error probability β=0.20 for one specified alternative. Find its power there.","rule":"Power=1-β.","steps":["Set up the relationship: Power=1-β.","power=1-0.20=0.80."],"answer":"The test rejects the false null 80% of the time under that particular alternative.","mistake":"Power changes with the actual effect, sample size, and testing rule."}
    - {"title":"Distinguish two testing errors","problem":"The null hypothesis says a coin is fair. Describe a Type I and a Type II error.","rule":"Type I means rejecting a true null; Type II means failing to reject a false null.","steps":["Calling a truly fair coin unfair is Type I.","Failing to detect that a biased coin is unfair is Type II."],"answer":"The error type depends on both the decision and the coin's actual fairness.","mistake":"A failure to reject does not prove the null true."}
    - {"title":"Repeated testing","problem":"Five independent tests each have false-positive probability 0.10 under their true nulls. Find the chance of at least one false positive.","rule":"P(at least one)=1-P(none), using independence for the product.","steps":["Set up the relationship: P(at least one)=1-P(none), using independence for the product.","P(at least one)=1-(0.9)^5=1-0.59049=0.40951."],"answer":"The chance is about 41%, not 10%.","mistake":"The independence assumption is needed for this exact product calculation."}
    - {"title":"Read an inclusive threshold","problem":"A fictional laboratory rule permits a sample concentration at or below 5 mg/L. A sample measures exactly 5 mg/L. Classify it under that rule.","rule":"At or below means concentration ≤ limit.","steps":["comparison = 5 ≤ 5, which is true. Equality is included.","classification = passes this concentration rule. No claim about other requirements follows."],"answer":"This measurement passes the stated inclusive threshold.","mistake":"Replacing ≤ with < would wrongly exclude equality."}

  stops:
  # --- Stop 53: Stress the Boundary
  #     Concept: interval sensitivity/practical significance; Keystone: keystone CI; Area: Statistics & Analysis; Learning role: RETRIEVE; Difficulty: L4; Story role: obstacle.
  #     placement: STRESS, asked by Tomas Reed beside uncertainty-console.
  - group: STAT
    at: uncertainty-console
    title: "Stress the Boundary"
    person: reed
    concept: 25   # interval sensitivity/practical significance
    reason: "The corrected benefit finding does not remove uncertainty about late harm."
    scene: "The benefit finding survives, but late harm remains uncertain. The board must distinguish planning further evidence from authorizing more enrollment."
    motivation: "The missing-outcome sensitivity range determines whether benefit supports unconditional continuation or only a bounded follow-up."
    format: STRESS
    question: "Shift the harm interval [−1,+5] by each missing-outcome adjustment from −2 to +2 events per 1,000. Choose the conclusion consistent with every interval: no unconditional enrollment while a plausible upper bound crosses the safety line; prepare an evidence review and apply the separate enrollment gate."
    answerText: "Upper harm bounds range from 3 to 7 events per 1,000. Unconditional enrollment is not justified; prepare the bounded evidence review, with no new enrollment authorized by this card."
    why: "Crossing a safety boundary under plausible assumptions blocks unconditional continuation."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Point estimate alone controls action
    # correct result: The data support benefit, but harm uncertainty rules out unconditional continuation; a bounded follow-up can reduce uncertainty.
    # state/output: travel REG.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   assumption -2 to +2 events/1000 step1; candidates stop now, continue unconditionally, bounded follow-up with trigger; only bounded follow-up remains across full range.
    stress:
      candidates:
        - id: nominal_only
          label: Use only the nominal reading
        - id: common_extreme_mistake
          label: Use the favorable extreme as if it were guaranteed
        - id: robust_plan
          label: The data support benefit, but harm uncertainty rules out unconditional continuation; a bounded follow-up can reduce uncertainty.
      criteria:
        - key: evidence_fit
          label: fit to the stop evidence
        - key: safety_margin
          label: margin at the adverse end
      scores:
        nominal_only:
          evidence_fit: 95
          safety_margin: 20
        common_extreme_mistake:
          evidence_fit: 88
          safety_margin: 5
        robust_plan:
          evidence_fit: 82
          safety_margin: 92
      feasible:
        nominal_only: 0.030000000000000002
        common_extreme_mistake: 0.030000000000000002
        robust_plan: 0.01
      assumption:
        label: stopping boundary
        unit: p-value
        min: 0.01
        max: 0.05
        nominal: 0.030000000000000002
        step: 0.005
      robust: robust_plan
      optimiseOn: evidence_fit

  # --- Stop 54: Buy Decision-Changing Evidence
  #     Concept: value of information; Keystone: keystone decision/inference; Area: Monitoring Board Room; Learning role: COMBINE; Difficulty: L5; Story role: character.
  #     placement: VALUE, asked by Tomas Reed beside evidence-budget-desk.
  - group: SAFE
    at: evidence-budget-desk
    title: "Buy Decision-Changing Evidence"
    person: reed
    concept: 32   # value of information
    reason: "The live decision now turns on unresolved harm rather than settled efficacy or file integrity."
    scene: "Benefit and file integrity are already established, but the harm estimate still depends on uncertain late outcomes and exposure records. Tomas needs both gaps checked before the board revisits enrollment."
    motivation: "The selected evidence must narrow the harm boundary enough to inform the next enrollment decision."
    format: VALUE
    question: "You have 60 staff-hours. Cover every required outcome at the lowest total cost within the budget; keep all unused capacity in reserve. Select whole packages, then submit the plan; the board shows its total and remaining reserve for you to check."
    # MODEL CONVERSION. The payload marks the two options it wants bought
    # `required: true`; the engine's word for "this one would change the decision"
    # is `decisive`, and the pair it names is the payload's own `correct_purchase`.
    # Budget 60, the five costs and the five axes are the payload's, and its
    # `total_available_cost: 115` is what those five costs already add to.
    # The payload gives ids and no labels, so each `label` is that id made readable
    # in the words its own answerText uses ("source calls", "the independent kit
    # audit"). That is a rename, not new copy. The payload supplies no `reveals`
    # line for any option, so none is written; the importer warns and imports.
    value:
      budget:
        amount: 60
        unit: staff-hours
      decision: ""
      requirements:
        - id: r1
          text: verify late-event outcomes
        - id: r2
          text: verify exposure independently
      rule: Cover every required outcome at the lowest total cost within the budget; keep all unused capacity in reserve.
      plans:
        - source_calls,kit_audit
      options:
        - id: source_calls
          label: Late-event source calls
          cost: 30
          axis: ""
          reveals: Checks the clinical source records for late outcomes.
          covers:
            - r1
          decisive: true
        - id: kit_audit
          label: Independent kit audit
          cost: 20
          axis: ""
          reveals: Checks which treatment exposure each record actually represents.
          covers:
            - r2
          decisive: true
        - id: efficacy_rerun
          label: Rerun the efficacy analysis
          cost: 25
          axis: ""
          reveals: Repeats the locked benefit analysis rather than checking late harm.
        - id: staff_survey
          label: Staff workflow survey
          cost: 15
          axis: ""
          reveals: Collects opinions about workflow, not verified outcomes or exposure.
        - id: biomarker
          label: Exploratory biomarker study
          cost: 25
          axis: ""
          reveals: Explores a mechanism without resolving the current late-event and exposure records.
      commit: Commit the decision
    answerText: "Each funded package supplies a required outcome; an affordable package that leaves one unresolved is insufficient."
    why: "More data are not automatically valuable; useful evidence must alter the stop-or-continue decision."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Any new data are valuable
    # correct result: Fund source calls and the independent kit audit; they address the live harm boundary.
    # state/output: evidence orders; travel BOARD.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   value:{budget:60,options:[{id:"source_calls",axis:"late-event outcome verification",cost:30,required:true},{id:"kit_audit",axis:"independent exposure verification",cost:20,required:true},{id:"efficacy_rerun",axis:"settled efficacy estimate",cost:25,required:false},{id:"staff_survey",axis:"workflow opinion",cost:15,required:false},{id:"biomarker",axis:"new exploratory mechanism",cost:25,required:false}],total_available_cost:115,correct_purchase:["source_calls","kit_audit"],reserve:10,answerText:"Buy source calls and the independent kit audit for 50 hours; only they can narrow the unresolved harm boundary."}

  # --- Stop 55: Predict Power Direction
  #     Concept: power/sample size/effect/alpha/sigma; Keystone: keystone errors/power; Area: Randomisation & Blinding; Learning role: RETRIEVE; Difficulty: L3; Story role: decision evidence.
  #     placement: CLOUD, at board-simulator.
  - group: RAND
    at: board-simulator
    title: "Predict Power Direction"
    concept: 14   # power/sample size/effect/alpha/sigma
    reason: "The funded follow-up changes sample size while leaving the test's effect target and threshold fixed."
    scene: "The funded calls add observations and reduce missingness without changing alpha or the target effect. Narrow the sampling cloud by increasing n from 200 to 320 while holding effect and variability assumptions fixed."
    motivation: "The narrower sampling distribution explains how added observations can increase power without changing the expected treatment effect."
    format: CHOICE
    question: "Increase sample size from 200 to 320 while holding alpha=0.025, the target effect, and the variability assumption fixed. Observe the sampling distribution and submit how its spread, center, and test power change."
    figure: {"kind":"line","xLabel":"Sample size","yLabel":"Power","caption":"Power rises as sample size increases with other inputs fixed.","series":[{"name":"Power","points":[[200,0.62],[230,0.69],[260,0.75],[290,0.81],[320,0.86]]}]}
    answerText: "The completed check shows increasing n narrows standard error and increases power; it does not move the expected center."
    why: "A narrower sampling distribution increases power and makes the final trigger informative."
    # wrong-path feedback, one rebuttal per wrong option:
    #   n setting and direction-of-change conclusion
    # correct result: Increasing n narrows standard error and increases power; it does not move the expected center.
    # state/output: S4.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   cloud:{settings:[{id:"n200",n:200,center:0.004,spread:0.0031,power:0.52},{id:"n240",n:240,center:0.004,spread:0.0028,power:0.60},{id:"n280",n:280,center:0.004,spread:0.0026,power:0.67},{id:"n320",n:320,center:0.004,spread:0.0024,power:0.73}],fixed:{alpha:0.025,effect:0.004,variance_assumption:"unchanged"},corridor:"harm boundary",correct_conclusion:"larger n narrows spread and raises power without moving center",answerText:"Increasing n from 200 to 320 narrows the sampling cloud and raises power; its expected center stays fixed."}
    choices:
      - Increasing n narrows standard error and increases power; it does not move the expected center.
      - Treat the settings table as the conclusion without reading the pattern.
      - Claim a cause or trend stronger than the displayed readings support.
    answer: Increasing n narrows standard error and increases power; it does not move the expected center.
    rebuttals:
      - Settings are inputs; the measured cloud or pattern is the evidence.
      - The observations support the bounded conclusion, not the stronger claim.
    cloud:
      bounds: {}
      centre: 0.004
      spread: 0.0031

  # --- Stop 56: Write the Rule
  #     Concept: integrated decision threshold; Keystone: keystone tests/errors; Area: Monitoring Board Room; Learning role: TRANSFER; Difficulty: L5; Story role: decision.
  #     placement: TRIGGER, at trigger-rail.
  - group: SAFE
    at: trigger-rail
    title: "Write the Rule"
    concept: 19   # integrated decision threshold
    reason: "More evidence could help, but the board must limit patient exposure while waiting for it."
    scene: "The board needs a written harm rule before the next update. A follow-up plan is not permission to enroll patients while a stop condition holds."
    motivation: "The precommitted harm thresholds and enrollment cap determine when follow-up must stop, change, or continue."
    format: TRIGGER
    question: "Commit the board's policy: STOP if the upper 95% harm bound is at least 4 excess events per 1,000; MODIFY from 2 inclusive to below 4; CONTINUE below 2. Record a maximum of 120 additional patients, subject to the stop rule, and submit the complete mapping."
    answerText: "The cap limits a later eligible follow-up; it does not override an active harm stop. The earlier uncertain harm interval is not silently replaced by a favorable reading."
    why: "Precommitment prevents a favored outcome from moving the safety boundary tomorrow."
    # wrong-path feedback, one rebuttal per wrong option:
    #   numeric threshold pair, enrollment cap, action mapping
    # correct result: Authorize one 120-patient follow-up under the written 2/4 thresholds; stop is inclusive at 4.
    # state/output: binder14; M15.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   trigger: {visible_prompt: "rule stop if upper 95% harm bound >=4/1000; modify if 2 to <4; continue if <2; max additional enrollment120; scale 0-6 anchors2,4; inclusive stop at4; objective preserve benefit, consequence limit 4 excess serious events/1000.", keyed_result: "Authorize one 120-patient follow-up under the written 2/4 thresholds; stop is inclusive at 4.", feedback: "numeric threshold pair, enrollment cap, action mapping", answerText: "Use the keyed result and explanation printed below."}
    trigger:
      scale:
        label: stopping p-value
        unit: p
        min: 0
        max: 0.1
        step: 0.005
        anchors:
          - at: 0.02
            means: routine baseline, not the decision threshold
          - at: 0.065
            means: elevated evidence requiring attention
      direction: falling
      conditions:
        - id: act
          label: Take the protective action
          leadHours: 12
          window:
            min: 0
            max: 0.025
      stream:
        - at: T-48 h
          value: 0.08
          hoursLeft: 48
        - at: T-24 h
          value: 0.05
          hoursLeft: 24
        - at: T-12 h
          value: 0.025
          hoursLeft: 12
        - at: T-6 h
          value: 0.015
          hoursLeft: 6

    - {"title":"Calculate a one-sample t statistic","problem":"A random sample has n=16, mean 12 and sample SD 4. The null mean is 10. Find t and degrees of freedom.","rule":"t=(x-bar-μ0)/(s/sqrt(n)); df=n-1.","steps":["Set up the relationship: t=(x-bar-μ0)/(s/sqrt(n)); df=n-1.","SE=4/4=1; t=(12-10)/1=2; df=15."],"answer":"The statistic is t=2 with 15 degrees of freedom.","mistake":"Use the sample standard deviation when population spread is unknown."}
    - {"title":"Analyze paired differences","problem":"Four before-after differences, defined as after minus before, are -2,-1,-3,0 units. Find the mean difference.","rule":"Analyze the differences within matched pairs.","steps":["Set up the relationship: Analyze the differences within matched pairs.","mean difference=(-2-1-3+0)/4=-6/4=-1.5 units."],"answer":"The paired measurements decreased by 1.5 units on average.","mistake":"Do not discard the pairing and treat the eight original measurements as independent."}

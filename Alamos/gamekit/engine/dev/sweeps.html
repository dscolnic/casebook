<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sweeps — every SWEEP panel in a theme</title>
<!--
  Every SWEEP in a theme, drawn at the width the modal draws it, on one page.

  A sweep is the one format that cannot be judged from the book. Whether the
  control is reachable, whether the readouts are above the fold, whether a
  boundary sweep's total is legible — all of it is a question about the rendered
  panel, and reaching one in the game means playing to the right day of the right
  campaign with time left on the clock. Six panels shipped in Quantum before
  anybody saw one; the first one anybody looked at had its slider and all three
  readouts below the fold of the modal, which reads exactly like a broken format.

    THEME=quantum npm run dev   →   http://localhost:<port>/engine/dev/sweeps.html

  The panel is wrapped in `.modal` at the modal's real width so the layout here is
  the layout in the game. What this page does NOT show is what sits above the
  panel in a real visit — the scene, the context strip, the equation chips — so it
  answers "does the panel work", not "does the whole card fit".
-->
<link rel="stylesheet" href="/engine/core/styles.css">
<style>
  body{margin:0;padding:28px;background:#eef2f4;font:400 15px/1.5 Inter,system-ui,sans-serif;color:#2f4652}
  h1{font:800 1.4rem/1.2 Inter,system-ui;margin:0 0 4px}
  .lede{color:#6b7c85;margin:0 0 24px}
  .case{max-width:820px;margin:0 auto 26px}
  .caseHead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 8px}
  .caseHead h2{font:800 .95rem/1.3 Inter,system-ui;margin:0}
  .caseHead em{font-style:normal;font:700 .62rem/1 Inter,system-ui;letter-spacing:.07em;
    text-transform:uppercase;color:#8a97a0}
  .modal{padding:18px 22px 22px}
  .facts{font:600 .72rem/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#6b7c85;margin:6px 0 0}
  .q{margin:0 0 2px;font-weight:600}
  .miss{max-width:820px;margin:0 auto;padding:14px 18px;background:#fff2f0;border:1px solid #e3b4ad;
    border-radius:8px}
</style>
</head>
<body>
<h1>Sweeps</h1>
<p class="lede">Every SWEEP panel in this theme, at the width the question modal draws it.</p>
<div id="out"></div>
<script type="module">
// `@theme` is the alias vite.config.js points at whatever THEME the server was
// started with, so this page follows the running game without naming it.
import { CURRICULUM } from '@theme/content/curriculum.js';
import { sweepHTML, bindSweep } from '/engine/core/questionUI.js';

const out = document.getElementById('out');
const found = [];
for(const [group, lessons] of Object.entries(CURRICULUM)){
  lessons.forEach((l, i) => {
    const g = l.game ?? {};
    if(String(g.type ?? '').toUpperCase() === 'SWEEP') found.push({ group, i, l, g });
  });
}

if(!found.length){
  out.innerHTML = '<div class="miss">This theme has no SWEEP lessons.</div>';
}

for(const { group, i, l, g } of found){
  const w = g.sweep ?? {};
  const a = w.axis ?? {};
  const wrap = document.createElement('div');
  wrap.className = 'case';
  wrap.innerHTML = `<div class="caseHead"><h2>${l.title ?? g.title ?? ''}</h2>`
    + `<em>${group} · lesson ${i} · ${w.mode ?? 'peak'}</em></div>`
    + `<div class="modal"><p class="q">${g.question ?? ''}</p>`
    + `<div class="mount"></div>`
    + `<p class="facts">target ${w.target} ±${w.tolerance} ${a.unit ?? ''}`
    + ` · axis ${a.min}–${a.max} step ${a.step} · start ${w.start}`
    + ` · ${(w.series ?? [{}]).length} series</p></div>`;
  out.append(wrap);
  const mount = wrap.querySelector('.mount');
  mount.innerHTML = sweepHTML(g);
  bindSweep(mount, g);
}
</script>
</body>
</html>

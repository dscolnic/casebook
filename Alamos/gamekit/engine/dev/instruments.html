<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Instruments — every live panel in a theme</title>
<!--
  Every panel in a theme that the player operates rather than reads: SWEEP,
  HOLDOUT, PROBE, TALLY. Drawn at the width the modal draws them, on one page.

  These are the formats that cannot be judged from the book. Whether the control
  is reachable, whether the readouts clear the modal's pinned action row, whether
  the question is even printed — all of it is a question about the rendered panel,
  and reaching one in the game means playing to the right day of the right
  campaign with time left on the clock. Six sweeps shipped in Quantum before
  anybody saw one; the first one anybody looked at had its slider and all three
  readouts below the fold, which reads exactly like a broken format.

    THEME=quantum npm run dev   →   http://localhost:<port>/engine/dev/instruments.html

  The panel is wrapped in `.modal` at the modal's real width so the layout here is
  the layout in the game.

  It now also shows what sits above the panel in a real visit — the scene, what
  the question takes as read, and what it is about. That was left out on the
  grounds that this page answers "does the panel work" rather than "does the
  whole card fit", which was true and was also why anybody reading this page came
  away saying they could not tell what they were meant to be doing or learning.
  A panel judged without its card is judged as a puzzle with no situation
  attached, which is not what the player ever sees.
-->
<link rel="stylesheet" href="/engine/core/styles.css">
<style>
  body{margin:0;padding:28px;background:#eef2f4;font:400 15px/1.5 Inter,system-ui,sans-serif;color:#2f4652}
  h1{font:800 1.4rem/1.2 Inter,system-ui;margin:0 0 4px}
  .lede{color:#6b7c85;margin:0 0 24px}
  .case{max-width:820px;margin:0 auto 26px}
  .caseHead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 8px}
  .caseHead h2{font:800 .95rem/1.3 Inter,system-ui;margin:0}
  .caseHead em{font-style:normal;font:700 .62rem/1 Inter,system-ui;letter-spacing:.07em;
    text-transform:uppercase;color:#8a97a0}
  .modal{padding:18px 22px 22px}
  .facts{font:600 .72rem/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#6b7c85;margin:10px 0 0}
  .miss{max-width:820px;margin:8px auto 0;padding:14px 18px;background:#fff2f0;border:1px solid #e3b4ad;
    border-radius:8px}
  .devCard{margin:0 0 10px;padding:0 0 10px;border-bottom:1px solid #e6ecef}
  .devScene{font:400 .92rem/1.6 Georgia,serif;color:#41505a;margin:0}
  .devMeta{font:600 .76rem/1.5 Inter,system-ui;color:#5b6a72;margin:7px 0 0}
  .devMeta span{font:800 .56rem/1.2 Inter,system-ui;letter-spacing:.07em;text-transform:uppercase;
    color:#8a97a0;margin-right:7px}
</style>
</head>
<body>
<h1>Instruments</h1>
<p class="lede">Every panel in this theme the player operates, at the width the question modal draws it.</p>
<div id="out"></div>
<script type="module">
// `@theme` is the alias vite.config.js points at whatever THEME the server was
// started with, so this page follows the running game without naming it.
import { CURRICULUM } from '@theme/content/curriculum.js';
import { sweepHTML, bindSweep, holdoutHTML, bindHoldout, tallyHTML, bindTally,
         probeHTML, bindProbe, sweepVerdictFigure, holdoutVerdictFigure, tallyVerdictFigure,
         probeVerdictFigure } from '/engine/core/questionUI.js';
// The twelve. They already ship a registry of exactly the shape this page wants,
// so they are spread in rather than listed — a page that names them one at a time
// is a page that silently omits the thirteenth.
import { INSTRUMENTS, INERT } from '/engine/core/instruments.js';

// Exposed for engine/dev/instrumentDrive.mjs, which drives every panel from
// outside the page. It cannot import '@theme/...' itself — that alias is
// resolved by vite at transform time and means nothing to a runtime import() —
// and two of the games live in package directories outside gamekit, so the
// served-path fallback cannot reach them either. This module already has the
// content; handing it over is the whole fix.
window.__CURRICULUM = CURRICULUM;

const LIVE = {
  ...Object.fromEntries(Object.entries(INSTRUMENTS).map(([k, v]) =>
    [k, { html: v.html, bind: (mount, g) => v.bind(mount, g, INERT),
          facts: v.facts, tag: v.tag, verdict: v.verdict }])),
  SWEEP: { html: sweepHTML, bind: bindSweep,
    facts: g => `target ${g.sweep.target} ±${g.sweep.tolerance} ${g.sweep.axis.unit ?? ''}`
      + ` · axis ${g.sweep.axis.min}–${g.sweep.axis.max} step ${g.sweep.axis.step}`
      + ` · start ${g.sweep.start} · ${(g.sweep.series ?? [{}]).length} series`,
    tag: g => g.sweep.mode ?? 'peak' },
  HOLDOUT: { html: holdoutHTML, bind: bindHoldout,
    facts: g => `passes at ${g.holdout.pass}${g.holdout.unit ?? ''} on held-out`
      + ` · axis ${g.holdout.axis.min}–${g.holdout.axis.max} ${g.holdout.axis.unit ?? ''}`
      + ` · ${g.holdout.fit.length} calibration points, ${g.holdout.test.length} held-out`,
    tag: () => 'fit, freeze, test' },
  PROBE: { html: probeHTML, bind: bindProbe,
    facts: g => `the load arrives at ${g.probe.target}`
      + ` · ${g.probe.stations.length} stations · ${g.probe.minReadings} readings minimum`,
    tag: () => 'sited readings' },
  TALLY: { html: tallyHTML, bind: bindTally,
    facts: g => `target ${g.tally.target} ±${g.tally.tolerance}`
      + ` · ${g.tally.settings.length} setting pairs · ${g.tally.batch} per batch`
      + ` · ${g.tally.minShots} shots minimum`,
    tag: () => 'counts' },
};

// The page builds its own markup, so it needs the same escaping the engine uses.
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const out = document.getElementById('out');
const found = [];
for(const [group, lessons] of Object.entries(CURRICULUM)){
  lessons.forEach((l, i) => {
    const kind = String(l.game?.type ?? '').toUpperCase();
    if(LIVE[kind]) found.push({ group, i, l, g: l.game, kind });
  });
}

if(!found.length){
  out.innerHTML = '<div class="miss">This theme has no live panels.</div>';
}

for(const { group, i, l, g, kind } of found){
  const spec = LIVE[kind];
  const wrap = document.createElement('div');
  wrap.className = 'case';
  wrap.innerHTML = `<div class="caseHead"><h2>${l.title ?? g.title ?? ''}</h2>`
    + `<em>${kind} · ${group} lesson ${i} · ${spec.tag(g)}</em></div>`
    // The question is NOT printed here. The renderer has to print it, and for a
    // while it did not: the harness supplied its own copy, so the page showed a
    // question the game was dropping. A dev page that helpfully fills a gap hides
    // the gap.
    // `.modalBody` matters: the action row's `position:sticky; bottom:0` rule is
    // scoped to it, and that rule is what hid a sweep's readouts in the game while
    // this page showed them fine.
    + `<div class="modal"><div class="modalBody">`
    // Everything the askCard puts above the panel in a real visit. Same fields,
    // same order, so what is judged here is what a player meets.
    // Its own container, not `.askCard`: that class lays a portrait out beside
    // the body, and without one the body collapses to a column two words wide.
    + `<div class="devCard">`
    + (l.scene ? `<p class="devScene">${esc(l.scene)}</p>` : '')
    + ((l.assumes ?? []).length
        ? `<p class="devMeta"><span>Takes as read</span> ${esc(l.assumes.join(' · '))}</p>` : '')
    + (l.takeaway ? `<p class="devMeta"><span>What this is about</span> ${esc(l.takeaway)}</p>` : '')
    + `</div>`
    + `<div class="mount"></div>`
    + `<p class="facts">${spec.facts(g)}</p></div></div>`;
  out.append(wrap);
  const mount = wrap.querySelector('.mount');
  mount.innerHTML = spec.html(g);
  spec.bind(mount, g);
  if(g.question && !mount.textContent.includes(g.question.slice(0, 40))){
    const warn = document.createElement('div');
    warn.className = 'miss';
    warn.textContent = 'The renderer does not print this stop’s question: ' + g.question;
    wrap.append(warn);
  }
}

// The verdict pictures, which none of these panels can show while it is being
// answered — a sweep plots only what was visited, and a holdout deliberately
// hides the second curve. Each is drawn here for a *wrong* answer, because that is
// the case worth looking at and the one nobody sees until a player hits it.
const verdict = (title, note, html) => {
  const wrap = document.createElement('div');
  wrap.className = 'case';
  wrap.innerHTML = `<div class="caseHead"><h2>${title} — verdict</h2><em>${note}</em></div>`
    + `<div class="modal"></div>`;
  out.append(wrap);
  wrap.querySelector('.modal').innerHTML = html;
};

// A worked wrong answer for each of the twelve, so the page shows the picture a
// player gets when it goes badly — which is the one nobody sees until it ships.
// Each result below is the *plausible* mistake the format was built to catch, not
// a random one: the retarget that did not narrow, the plan that answered
// everything but the required question, the intervention nobody measured.
const WRONG = {
  TRIGGER: g => ({ triggerThresholds: g.trigger.conditions.map(() => g.trigger.scale.max),
    triggerFired: g.trigger.conditions.map(() => null) }),
  VALUE: g => ({ valueBought: g.value.options
    .map((o, i) => (o.decisive ? -1 : i)).filter(i => i >= 0).slice(0, 1) }),
  CLOUD: g => {
    const mid = (g.cloud.bounds.min + g.cloud.bounds.max) / 2;
    return { cloudCentre: mid, cloudSpread: g.cloud.spread, cloudInside: g.cloud.pass * 0.8,
      cloudUsed: [] };
  },
  ALLOCATE: g => ({ allocPicked: g.allocate.items
      .map((it, i) => (it.protected ? i : -1)).filter(i => i >= 0),
    allocAnswered: g.allocate.answers.map(() => false), allocSpend: 0 }),
  TRACE: g => ({ traceRes: 0, traceKeep: [], traceNamedOk: true, traceKeepOk: false }),
  ATTEST: g => ({ attHeld: [], attChecked: [] }),
  CONTROL: g => ({ ctrlNamed: g.control.variables
    .findIndex(v => String(v.id) !== String(g.control.truth)), ctrlTrials: 1 }),
  TRIANGULATE: g => ({ triMark: { x: +g.triangulate.truth.x + +g.triangulate.tolerance * 3,
      y: +g.triangulate.truth.y }, triFixed: false, triOn: 3,
    triMiss: +g.triangulate.tolerance * 3 }),
  DEGENERACY: g => {
    const p = g.degeneracy.locus[0];
    return { degA: +p.a, degB: +p.b, degApplied: false };
  },
  CHAIN: g => ({ chainPlaced: g.chain.links.map((_, i) => i),
    chainGov: g.chain.links.findIndex(l => String(l.id) === String(g.chain.distractor)),
    chainPathOk: false }),
  BALANCE: g => {
    const counted = g.balance.streams.map((s, i) => (s.hidden ? -1 : i)).filter(i => i >= 0);
    return { balCounted: counted, balRead: counted,
      balSum: counted.reduce((n, i) => n + +g.balance.streams[i].value, 0) };
  },
  VERIFY: g => ({ verPred: +g.verify.prediction.min, verMeasured: null }),
};
const NOTE = {
  TRIGGER: 'every threshold written at the top of the scale',
  VALUE: 'bought the thorough option, not the decisive one',
  CLOUD: 'retargeted to the middle and declared it ready',
  ALLOCATE: 'committed only what was protected',
  TRACE: 'right source, whole fortnight thrown away with it',
  ATTEST: 'closed the list on the signatures',
  CONTROL: 'named the machine that changed most recently',
  TRIANGULATE: 'reported without applying the correction',
  DEGENERACY: 'took a size off the first measurement alone',
  CHAIN: 'named the largest member as the governing one',
  BALANCE: 'counted every stream that had a gauge on it',
  VERIFY: 'reported the prediction without measuring',
};
for(const { l, g, kind } of found){
  if(!WRONG[kind]) continue;
  verdict(l.title ?? '', NOTE[kind], INSTRUMENTS[kind].verdict(g, WRONG[kind](g)));
}

for(const { l, g, kind } of found){
  const title = l.title ?? '';
  if(kind === 'SWEEP'){
    const w = g.sweep, a = w.axis ?? {};
    const off = w.target + w.tolerance * 3.5 <= a.max ? w.target + w.tolerance * 3.5
                                                      : w.target - w.tolerance * 3.5;
    const wrong = +off.toFixed(4);
    verdict(title, `answered ${wrong}${a.unit ? ' ' + a.unit : ''}`,
      sweepVerdictFigure(g, wrong, false));
  }
  if(kind === 'HOLDOUT'){
    // Frozen on the spike: the best line on the calibration set, which is the
    // whole trap.
    const spike = g.holdout.fit.reduce((a, b) => (b.value > a.value ? b : a));
    verdict(title, `froze on the calibration peak, ${spike.at}${g.holdout.axis.unit ?? ''}`,
      holdoutVerdictFigure(g, spike.at));
  }
  if(kind === 'PROBE'){
    // Named the coldest station, which is the error the format exists to correct.
    const last = g.probe.stations.length - 1;
    verdict(title, `named ${g.probe.stations[last].label}`, probeVerdictFigure(g, last));
  }
  if(kind === 'TALLY'){
    // A plausible early-reporting history: noisy at a hundred shots, settling.
    const truth = g.tally.settings.reduce((acc, s) =>
      acc + (s.sign === -1 ? -1 : 1) * (2 * s.pSame - 1), 0);
    const wobble = [0.42, -0.31, 0.22, -0.14, 0.09, -0.05, 0.03];
    const hist = wobble.map((w, i) => ({ shots: (i + 1) * 4 * g.tally.batch, value: truth + w }));
    verdict(title, `reported after ${hist.length * 4 * g.tally.batch} shots`,
      tallyVerdictFigure(g, hist));
  }
}
</script>
</body>
</html>

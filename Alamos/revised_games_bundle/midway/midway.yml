    were built on geometry that no longer existed.'
  takeaway: A flatter loop is a gentler ride and a hungrier one, and both of those are the same number.
  segue: 'There is only one real question here: is the 1974 drawing the only one the park owns? It is. So every safety margin
    computed for this coaster used a loop that vanished in 1998. And the coaster is already advertised on posters around town.'

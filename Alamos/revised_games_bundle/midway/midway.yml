    - test weights can stand in for passengers
    takeaway: A test is designed backwards from the number it has to produce.
    format: SEQUENCE
    why: An official test only means something if its conditions are fixed before release. First record the test mass, because
      the measured acceleration belongs to that mass. Then fit and confirm the accelerometer before anything moves. The carriage
      must be released from full height so the brake meets its normal operating entry speed. Only after the drop can the logged
      result be compared with the certificate limit. The final comparison turns a demonstration into evidence.
    cards:
    - Weigh the test weights and record what the carriage mass will be on the drop.
    - Fit the recording accelerometer to the carriage floor and confirm it is logging.
    - Release from the full height with the test weights aboard and no passengers on site.
    - Compare the logged deceleration against the figure the certificate will carry.
    order:
    - 0
    - 1
    - 2
    - 3
  - group: FLUME
    task: Derive what the hydraulic gate multiplies
    title: Two centimetres driving nine
    at: gate-ram
    reason: Santos inherited a flume gate marked "plenty" in Brennan's hand, and won't sign off on a hydraulic ram until somebody
      derives what that word was supposed to mean.
    place: The Log Flume
    scene: The flume's sluice gate is held by a hydraulic ram. A two-centimetre piston at the hand pump drives a nine-centimetre
      piston at the gate. An old note beside the drawing says only 'plenty.'
    guide: Build Pascal's principle down to the force at the gate, one line at a time. Then state the cost. A hydraulic system
      multiplies force and gives something else away, and the derivation shows you exactly what. That is more use than a note
      on the drawing reading only 'plenty'.
    background:
    - What the principle says. Pressure applied to a confined fluid is the same everywhere in it, so the small piston and
      the large one see the same pressure. Force is pressure times area, and area goes as the square of the diameter. That
      is why a two-centimetre piston driving a nine-centimetre one multiplies the hand force by about twenty.
    - 'What is given up. Volume is conserved: the fluid pushed out of the small cylinder is the fluid arriving in the large
      one. So the gate piston moves as much less distance as it gains force, and the work in equals the work out. Nothing
      has been created, and the pump handle has to travel a long way.'
    - Why 'plenty' is not an answer. A number is what tells you whether the ram closes the gate against a head of water. It
      also says how many strokes it takes, and what happens as the seals wear. The old note was true and useless, which is
      the difference this stop is about.
    assumes:
    - pressure applied to an enclosed fluid is passed on undiminished
    - pressure is force divided by the area it acts over
    takeaway: An ideal machine can trade force for distance, but it cannot create work.
    format: DERIVE
    question: Work Pascal's principle down to the force at the gate, and say what the multiplication costs.
    answerText: F₂ = 250 × (9.0/2.0)² ≈ 5,060 N at the gate. The large piston moves only about one twentieth as far as the
      hand piston.
    why: Pascal's principle sends the same pressure through the enclosed fluid. Force therefore scales with piston area, not
      with piston diameter. A diameter ratio of 9 to 2 gives an area ratio of about 20, so 250 N becomes roughly 5.1 kN. The
      gain in force is paid for in distance. The large piston moves about one twentieth as far as the small one. Work is conserved
      apart from losses, so the hydraulic creates no free energy.
    derive:
      hint: Start from the pressures being equal, write each as a force over an area, and remember what an area does when
        a diameter changes.
      start: P₁ = P₂
      startNote: hand piston 2.0 cm across, gate piston 9.0 cm across, 250 N applied by hand
      goal: the force at the gate, and what has been given up to get it
      steps:
      - ask: Write each pressure as a force over its own area.
        answer: 0
        candidates:
        - text: F₁/A₁ = F₂/A₂, so F₂ = F₁ × (A₂/A₁)
          rule: definition
        - text: F₁A₁ = F₂A₂, so F₂ = F₁ × (A₁/A₂)
          rule: definition
          survives: true
          why: Consistent algebra on an inverted definition. Pressure is force divided by area, not multiplied by it, and
            this version makes the wide piston the weak 1 — a ram that would give 5 newtons at the gate for 250 at the hand.
        - text: F₁ = F₂, since pressure is passed on undiminished
          rule: substitution
          why: What is passed on undiminished is the pressure. The force is the pressure times an area, and the 2 areas here
            differ by a factor of 20.
        - text: F₂ = F₁ × (d₂/d₁)
          rule: geometry
          why: This uses the diameters where the areas belong. It gives a multiplication of 4 and a half instead of 20, which
            is the same mistake as pricing a pizza by its width.
      - ask: Put the areas in, from the diameters given.
        answer: 3
        candidates:
        - text: A₂/A₁ = 9.0/2.0 = 4.5
          rule: geometry
          why: That is the ratio of the diameters. Area grows with the square of the diameter, so the ratio of areas is the
            square of this.
        - text: A₂/A₁ = (9.0² − 2.0²)/2.0² = 19.25
          rule: geometry
          why: Subtracting the small area from the large one is the arithmetic for an annulus. These are two separate cylinders
            and each has its own full circle.
        - text: A₂/A₁ = π(9.0)²/π(2.0)², and the π has to be evaluated before dividing
          rule: evaluation
          survives: true
          why: 'Perfectly valid and needlessly so: the π appears above and below and cancels exactly. Evaluating it changes
            nothing except the number of chances to make an arithmetic slip.'
        - text: A₂/A₁ = (9.0/2.0)² = 20.25
          rule: geometry
      - ask: Give the force at the gate and say what it cost.
        answer: 1
        candidates:
        - text: F₂ ≈ 5,060 N, and the ram delivers that over the same distance the hand moved
          rule: evaluation
          survives: true
          why: 'The force is right and the second half is not. Work cannot be created by plumbing: the gate piston moves about
            a twentieth as far as the hand piston, which is exactly what keeps the energy books straight.'
        - text: F₂ ≈ 5,060 N, and the gate piston moves about a twentieth as far
          rule: evaluation
        - text: F₂ ≈ 1,125 N, from the ratio of the diameters
          rule: substitution
          why: This is the diameter ratio again, four and a half times the hand force. It understates the gate force by a
            factor of four and a half.
        - text: F₂ ≈ 5,060 N, so the hand pump does 20 times the work
          rule: evaluation
          why: The work at each end is the same, less what the seals take. 20 times the force over a twentieth of the distance
            is the same product.
- title: What the collision keeps
  objective: Get the speed out of a collision, and the energy that does not come back.
  briefing: 400 logged collisions, and nobody has ever written the equation for 1.
  stake: Monday of week two. Four hundred bumper-car hits are logged, and nobody can say if any single one of them was too
    hard. Today you find the speed a crash leaves two cars at, check the coaster's lift motor, and see what makes a wheel
    hard to start.
  takeaway: A collision hands back its momentum in full and keeps a good share of its energy.
  segue: 'The bumper car''s speed and mass are now posted at the console. The numbers ended the argument fast. But a new operator
    asked a question nobody could answer: what is the rule for a car hit twice in a row? Now one new gap sits on the list
    the certificate will not cover.'
  stops:
  - group: BUMPER
    task: Derive the speed the pair leaves at
    title: Two cars, one velocity
    at: car-on-stands
    reason: Chen's telemetry says the two cars leave together, and turning that reading into a defensible speed is what makes
      his logged momentum data worth anything to Vey.
    concept: 'Elastic against inelastic: which quantity survives'
    place: The Bumper Cars
    scene: A 320 kilogram car and rider at 3.1 metres a second strikes a stationary 290 kilogram car and rider. They stay
      in contact and move off together, which the telemetry confirms.
    guide: 'Build the momentum statement down to the speed the pair leaves at, one line at a time. Then answer the second
      half: work out what fraction of the kinetic energy is still there afterwards. Momentum and energy behave differently
      in this collision, and the derivation is how you find out that they do.'
    background:
    - Why momentum is the one that survives. In the moment of contact the two cars push on each other equally and oppositely.
      So whatever momentum one gains the other loses, and the total is unchanged. That holds whatever happens inside the bumpers,
      which is why the momentum statement can be written before knowing anything about them.
    - Why the energy is not conserved. The cars stay in contact and move off together, which means the collision is perfectly
      inelastic. That is the maximum energy that can go into deformation, heat and noise for the given masses. The fraction
      remaining follows from the masses alone, and it is a fixed number rather than a measurement.
    - What the ride is doing with it. A bumper car is designed to lose that energy in the rubber rather than in the rider's
      neck. So the missing fraction is the whole safety argument of the attraction. Telemetry that confirms the pair moved
      off together is confirming which case of the algebra applies.
    assumes:
    - momentum is mass times velocity, counted with its direction
    - a collision with no outside push conserves total momentum
    takeaway: For a perfectly inelastic collision, momentum fixes the shared speed while kinetic energy tells how much mechanical
      energy was transformed.
    format: DERIVE
    question: Work the momentum statement down to the speed the pair leaves at, and then say what happened to the energy.
    answerText: v = (320 × 3.1) ÷ 610 ≈ 1.63 m/s, and about 47% of the kinetic energy has gone into rubber, heat and noise.
    why: Almost no outside push reaches the two cars while they are touching — a negligible external impulse — so the total
      momentum of the pair is conserved. Conserved means the total is the same after the bang as it was before it. Because
      the cars leave together, one shared speed describes the pair afterward. Solving the momentum equation gives about 1.63
      m/s. Kinetic energy is different. It falls because this collision is inelastic. The missing mechanical energy becomes
      deformation, sound and heat in the bumpers and bodies. Soft structures are useful precisely because they absorb energy
      instead of returning it as rebound.
    derive:
      hint: Write what is conserved, put the numbers in, and check the units of the thing you have solved for.
      start: m₁u₁ + m₂u₂ = (m₁ + m₂)v
      startNote: m₁ = 320 kg at u₁ = 3.1 m/s; m₂ = 290 kg at rest
      goal: the speed of the pair after impact, and the fraction of the kinetic energy left
      steps:
      - ask: Put this collision into the statement.
        answer: 1
        candidates:
        - text: 320(3.1) + 290(3.1) = (320 + 290)v
          rule: substitution
          why: The second car is stationary. Giving it the first car's speed puts momentum into the system that nothing supplied
            and returns the answer that nothing happened.
        - text: 320(3.1) + 290(0) = (320 + 290)v
          rule: substitution
        - text: 320(3.1) = 290v
          rule: conservation
          survives: true
          why: Algebraically fine and it describes a different collision — one where the first car stops dead and hands everything
            to the second. It gives 3.4 m/s, faster than anything on the floor was going, which is the tell.
        - text: ½(320)(3.1²) + 0 = ½(320 + 290)v²
          rule: conservation
          why: This conserves kinetic energy, which a collision that ends with the cars locked together does not do. It gives
            a speed about 40% too high.
      - ask: Solve for the speed of the pair.
        answer: 0
        candidates:
        - text: v = 992 ÷ 610 ≈ 1.63 m/s
          rule: rearrangement
        - text: v = 992 × 610 ≈ 605,000 m/s
          rule: rearrangement
          why: The combined mass divides, since it is multiplying the unknown. Multiplying gives a number with the units of
            kilograms squared metres per second.
        - text: v = 992 ÷ 320 ≈ 3.1 m/s
          rule: rearrangement
          survives: true
          why: Dividing by the striking car's mass alone recovers the speed that went in, which is a consistent piece of arithmetic
            saying the collision did nothing. The mass on the right is the pair's, because the pair is what is moving.
        - text: v = (3.1 + 0) ÷ 2 ≈ 1.55 m/s
          rule: conservation
          why: Averaging the two speeds happens to land near the right answer here and is not the physics. It ignores the
            masses entirely, and with a full car striking an empty one it is wrong by a third.
      - ask: Compare the kinetic energy before and after.
        answer: 2
        candidates:
        - text: 1,538 J before and 1,538 J after, since momentum was conserved and nothing left the floor
          rule: conservation
          why: Momentum being conserved says nothing about the energy. They are different quantities and only one of them
            is protected in a collision like this.
        - text: 1,538 J before and 810 J after, so 47% has been destroyed
          rule: evaluation
          survives: true
          why: The arithmetic is right and the word is wrong. Energy is not destroyed; it has gone into deforming rubber,
            heating the bumpers and making the noise that is most of the ride's appeal.
        - text: 1,538 J before and 810 J after, so 47% has left as heat, sound and deformation
          rule: evaluation
        - text: 1,538 J before and 810 J after, so the collision was elastic
          rule: evaluation
          why: An elastic collision is exactly the one that gives all its kinetic energy back. Losing nearly half of it is
            the definition of the other kind.

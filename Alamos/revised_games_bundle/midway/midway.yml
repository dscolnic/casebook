      hint: Write what is pushing toward the centre at the crown, then ask what happens as one of those forces goes to zero.
      start: N + mg = mv²/r
      startNote: at the crown the centre of the loop is below the train, so both forces point that way
      goal: the least speed the train can cross the crown at, for r = 7.4 m and for r = 5.6 m
      steps:
      - ask: Take the limiting case that fixes the minimum.
        answer: 1
        candidates:
        - text: Set v = 0, giving N = −mg at the crown
          rule: limit
          why: A stationary train at the crown is not a limiting case of a ride, it is a train falling off. The negative sign
            is the algebra reporting that the rail would have to pull.
        - text: 'Set N = 0: the rail stops pushing, so mg = mv²/r'
          rule: limit
        - text: Set N = mg, so the rider feels normal weight at the crown
          rule: dynamics
          survives: true
          why: A perfectly sensible design condition and not the minimum. It gives a speed about 40% higher than the contact
            limit, which is a comfort criterion being mistaken for the minimum safety condition.
        - text: Set N + mg = 0, so the 2 forces balance at the crown
          rule: dynamics
          why: Both forces point the same way at the crown — downward, toward the centre — so they add rather than cancel.
            Setting the sum to zero describes no situation on this track.
      - ask: Solve for the speed.
        answer: 0
        candidates:
        - text: v = √(gr), and the mass has cancelled
          rule: cancellation
        - text: v = √(gr) for a full train, and less for an empty one
          rule: cancellation
          survives: true
          why: The mass divided out of both sides one line ago. Attaching a load condition to the answer means the ride ends
            up with two limits where the physics offers one.
        - text: v = gr
          rule: cancellation
          why: The left side is a speed and the right is a speed squared. As written, the number for the measured radius is
            73, which is not a speed anything on this site reaches.
        - text: v = √(g/r)
          rule: evaluation
          why: Inverting the radius makes a bigger loop need less speed, which is the opposite of what a wider curve does
            — and gives 1.2 m/s at the crown.
      - ask: Evaluate for both radii and say what changed.
        answer: 2
        candidates:
        - text: 8.5 m/s measured against 7.4 m/s drawn, so the drawing was conservative
          rule: evaluation
          why: Conservative means the drawing demanded more than reality does. It demanded less, which is the direction that
            spends a margin nobody knew they had.
        - text: 7.4 m/s measured against 8.5 m/s drawn, so the loop is easier than drawn
          rule: evaluation
          why: The radii have been swapped. The measured crown is the wider one, and a wider crown is the one that needs more
            speed.
        - text: 8.5 m/s measured against 7.4 m/s drawn — the real loop demands 15% more
          rule: evaluation
        - text: 8.5 m/s measured against 7.4 m/s drawn, a difference of 1.1 m/s in the margin
          rule: dynamics
          survives: true
          why: The subtraction is right and the framing hides the size of it. What matters is the ratio to what the train
            actually has, and quoted as a difference it reads like small change.

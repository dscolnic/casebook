      and that changes on every cycle. Twelve adults and four children is a different vehicle from four adults. A current
      that gave a comfortable stop this morning gives a harsher one when the car is light. That is the second law as an operating
      rule rather than an equation. There is a second difficulty. A magnetic brake's force depends on how fast the car moves
      through the field, so it fades as the car slows. Hold the current steady and the deceleration decays away with it. The
      current has to be raised through the stop. And the band narrows at the bottom, where the brake is weakest and the rider's
      neck is no stronger than it was at the top.

      at the bottom of the fall.
    background:
    - Why derive it rather than look it up. The notebook says 'about 29' and nothing else, which cannot be checked, cannot
      be corrected for a different drop height, and cannot be defended to an inspector. A derivation is the same number plus
      the reason it is that number, and the reason is what transfers to the next ride.
    - What the starting relation says. v² = v₀² + 2aΔx is a statement about constant acceleration with the time taken out
      of it. That is exactly the convenient form here, because the question asks about a distance fallen and says nothing
      about how long the fall lasted.
    - 'What is being assumed. Released from rest makes v₀ zero. Treating a as g assumes two things: that the fins do nothing
      until they engage, and that drag on the carriage is small over 42 metres. Both are stated on the card rather than hidden,
      because the number is only as defensible as the assumptions it was computed under.'
    takesAsRead:
    - Acceleration as the rate a velocity changes, whichever part of it changes
    - Newton's second law as the definition of a net force
    assumes:
    - an object in free fall accelerates at about 9.8 metres per second every second
    - the constant-acceleration relations connect speed, acceleration and distance
    takeaway: Choose the constant-acceleration relation that contains the quantities you know and omits the one you do not.
    format: DERIVE
    question: Get the speed at the end of 42 metre free fall, from the constant-acceleration relations rather than from the
      notebook.
    answerText: v = √(2 × 9.8 × 42) ≈ 28.7 m/s, and it is the speed at the moment braking begins.
    why: 'The old notebook''s ''about 29'' was right, but the engineer signing the safety certificate needs a defensible chain.
      The relation v² = v₀² + 2aΔx fits because the distance is known and time is not. Starting from rest leaves v = √(2gΔx),
      with no mass in the result. That is why objects in free fall share the same acceleration. The square matters: doubling
      the fall distance raises speed only by √2, about 41%. The same relation will run backward tomorrow when the brake removes
      that speed over a known distance.'
    derive:
      hint: Each line has to follow from the one above it.
      start: v² = v₀² + 2aΔx
      startNote: the carriage is released from rest and falls 42 m before the fins engage
      goal: the speed at the bottom of the fall, in metres per second
      steps:
      - ask: Put the conditions of this drop into the relation.
        answer: 0
        candidates:
        - text: v² = 0 + 2(9.8)(42)
          rule: substitution
        - text: v² = 0 + 2(9.8)(42)(2.9)
          rule: substitution
          why: The time is already inside the relation; that is what makes it the useful one here. Multiplying by it as well
            counts the fall twice and leaves units of metres squared per second.
        - text: v² = 0 + (9.8)(42)
          rule: substitution
          survives: true
          why: The factor of two is what carries the average speed of an accelerating body. Drop it and every step below is
            clean algebra with a speed 29% low — 20 metres a second, which reads perfectly plausible for a fall of this size.
        - text: v = 0 + 2(9.8)(42)
          rule: substitution
          why: The relation gives the square of the speed. Reading the left side as v and not v² turns a speed into something
            823 units large.
      - ask: Rearrange for the speed itself.
        answer: 1
        candidates:
        - text: v = 823 ÷ 2
          rule: rearrangement
          why: Halving is not the inverse of squaring. It happens to be the operation that appears in the relation, applied
            to the wrong side of it.
        - text: v = √823
          rule: rearrangement
        - text: v = 823²
          rule: rearrangement
          why: Squaring again moves in the wrong direction. The left-hand side is already a square and has to be undone rather
            than repeated.
        - text: v = √(823) with the sign left open, since the root has 2 values
          rule: definition
          survives: true
          why: 'Algebraically correct and physically empty: the negative root is the same speed travelling upward, which this
            carriage is not doing. Carrying it down the page leaves an answer that cannot be reported as a number.'
      - ask: Evaluate it, and say what the answer is a statement about.
        answer: 2
        candidates:
        - text: v ≈ 28.7 m/s, the speed of anybody in the carriage
          rule: evaluation
          survives: true
          why: The arithmetic is right and the claim is too wide. It is the speed of the carriage and of everything falling
            with it, which happens to include the riders, and the derivation says nothing about what any of them feel.
        - text: v ≈ 41.2 m/s by the time the carriage reaches the bottom of the tower
          rule: evaluation
          why: That is the root of 1,700, which is what 2aΔx gives if the drop is taken as the whole tower rather than the
            free part of it. The fins take the last nine metres.
        - text: v ≈ 28.7 m/s, the speed of the carriage where the fins begin
          rule: evaluation
        - text: v ≈ 28.7 m/s, the average speed over the fall
          rule: definition
          why: The average speed of a fall from rest is half the final 1, about 14. This number is the speed at one instant,
            which is the instant the brake has to work at.

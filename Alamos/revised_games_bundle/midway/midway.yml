    task: Match each point on the circuit to what is true of the train's energy there.
    title: Reading a circuit as energy
    at: profile-drawing
    reason: Kovač wants the coaster's own energy story settled today, mark by mark, before anyone argues about what its margins
      are worth.
    concept: Conservation of mechanical energy, and dividing the mass out of it
    place: The Coaster
    scene: Marta Kovač walks the track every morning. On the workshop wall she has four places chalked out. They are the lift
      hill, top of the first hill, bottom of the first drop, and final braking section.
    guide: Four places on the circuit, and four statements about energy. Pair them by asking two things of each. Where is
      the energy sitting, in height or in motion? And is any being added or removed there? Only one place on the whole circuit
      adds energy. One removes it and never gives it back. That is why no later hill reaches the height of the first.
    background:
    - Why this is a matching board and not four separate questions. Responses on boards like this are written to be plausible
      for more than one situation, so choosing them one at a time lets a nearly-right answer through unexamined. Having to
      place all of them forces the comparison — not "is this reasonable here", but "is it more right here than there".
    - How to use the one-each rule. Because the responses are a set to be distributed rather than a list to be sampled, every
      join you make constrains the rest. Settling the two you are confident of can leave the remaining pair decided by elimination.
      Where it does not, two responses are still competing for one situation, and that is exactly the distinction the stop
      is testing.
    - Why you cannot be wrong about exactly one. With every response used once, three correct joins leave the fourth with
      only one place to go. Any error therefore involves at least two joins. That is worth remembering when the last pair
      looks forced. The fault is usually not in the join you are struggling with. It is in one you made early and stopped
      questioning.
    assumes:
    - lifting something stores energy that can be given back
    - a moving body carries energy that depends on the square of its speed
    takeaway: Mechanical energy trades between height and motion, while motors add it and friction or brakes remove it.
    format: PROTOCOL
    why: The lift motor adds mechanical energy while the train climbs. After the top of the first hill, height and speed trade
      energy back and forth. Friction drains some into heat all around the circuit, so later hills cannot reach the height
      of the first hill. The foot of the first drop is fast because much of the stored height has become kinetic energy. The
      final braking section removes the remaining mechanical energy deliberately. Reading the circuit this way separates energy
      transfers from energy losses.
    scenarios:
    - The chain is dragging the train up the lift hill.
    - The train is at the top of the first hill, moving slowly.
    - The train is at the foot of the first drop.
    - The train is in the final braking section at the end.
    choices:
    - A motor is putting energy in, and it is the only place on the circuit where that happens.
    - Almost all of it is stored in the height, and very little is in the motion.
    - Almost all of it is in the motion, and this is the fastest the train will be all circuit.
    - It is being taken out and turned into heat in the fins, and none of it comes back.

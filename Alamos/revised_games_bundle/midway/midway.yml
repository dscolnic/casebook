    answerText: Keep the carousel settlement. Isolate and inspect the cracked car. Log the coaster reading, and return it
      if the limit is crossed or the decline persists.
    why: The cracked bumper car is serious but contained once that car is removed from service. The coaster is still above
      its morning limit, so today's reading belongs in the trend log. The carousel is different. Its foundation is moving
      under a ride that cannot isolate one section, and each cycle keeps loading the same low bearing. That makes it the rising,
      hard-to-reverse problem. Good delegation separates the problem you must stop now from problems that can return on a
      clear condition.
  - group: COASTER
    task: Read a morning speed against the rule
    title: A tenth of a metre a second
    reason: The new morning rule only works if a passing-but-lower reading is logged rather than argued away, and that judgment
      call is today's, on a cold wet morning that could explain it — or could be the first sign it can't.
    place: The Coaster
    scene: The new morning rule sets a minimum station return speed. Today's reading is a tenth of a metre a second below
      yesterday's and still above the minimum, on a cold morning after rain.
    guide: Four options, and the reading is below yesterday's and above the minimum. Ask of each whether it answers the limit
      question or the trend question. A limit says whether the ride may run today. A trend needs several mornings. One cold
      wet morning can move rolling resistance without proving wear. Two of these options make the rule unusable or the trend
      invisible.
    background:
    - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading
      — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each
      belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across
      a whole game the key used to be the longest option far more often than chance. Here it was 88 per cent of passage quizzes,
      before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the
      signal taken out of them deliberately.
    - What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option
      fails, not a restatement of the right one. They are worth reading after a correct answer as well. A right choice made
      for an approximate reason is indistinguishable from a sound one. That holds until the day the approximation is what
      is being tested.
    assumes:
    - the morning reading stands in for a speed at the top of the loop nobody measures
    - rolling resistance changes with temperature and with wet track
    takeaway: A rule with a limit needs a way of telling a trend from a Tuesday.
    format: CHOICE
    question: The reading is down a tenth and still passing. What does the rule require?
    why: A limit and a trend answer different questions. Today's reading is still above the operating minimum, so the rule
      says the coaster may run. The lower value still belongs in the log. One cold, wet morning can shift rolling resistance
      without proving long-term wear. A sequence of similar readings would be different evidence. Stopping every passing ride
      makes the rule unusable, while explaining away an unrecorded reading makes a real trend invisible.
    choices:
    - Run and log it; today's limit is still met.
    - Stop the ride until the reading returns to last week's value.
    - Ignore it because cold rain explains a small drop.
    - Reduce the train load until the reading recovers.
    answer: Run and log it; today's limit is still met.
    rebuttals:
    - Stopping on a passing reading makes the rule unusable and teaches operators to distrust it.
    - The weather is a fair explanation and an unlogged explanation is how a trend disappears.
    - Load has cancelled out of every limit on this ride, so lightening the train changes nothing.
  - group: CAROUSEL
    task: Order the four operations of the overnight repair.
    title: Leveling the carousel overnight
    at: platform-jacks
    reason: Kovač has one night to level the carousel's low bearing before the morning check, and getting the repair order
      wrong means redoing a job with no time left to redo it.
    place: The Carousel and Swings
    scene: The carousel platform sits 11 millimetres low at one bearing. Marta Kovač has one night to lift the ring, add thin
      spacer plates under the support and prove the repair before the morning opening check.
    guide: 'All four operations will happen tonight, so ask what each needs first. A bearing cannot be adjusted while the
      ring is pressing down on it. Spacer thickness comes from the measured level rather than from counting plates. And the
      last card is the test: if the once-a-revolution peak has gone, the measurement that started this is answered.'
    background:
    - 'Why the order is graded whole. A sequence is a claim about dependency: each step is here because the one before it
      has already happened, or has to have. One transposed pair falsifies that claim wherever it sits, so partial credit would
      be credit for a sequence that does not work.'
    - Why the ends are the place to start. The first and last cards are constrained by having nothing before or after them,
      which usually makes them the two you can settle from the scene alone. Pinning them collapses the remaining arrangements
      sharply, and what is left in the middle is where the actual judgement lives.
    - What the rail can be ordered on. Time is the usual axis, but it is not the only one. An order can run on cost, on risk,
      or on reversibility — every observation that leaves the sample as it was, before any that consumes it. On those boards
      a chronological reading finds nothing, because none of the steps has to happen at a particular hour.
    assumes:
    - a load has to be taken off a bearing before its support height can be adjusted
    - a repair is finished when the original problem is measured again
    takeaway: A repair procedure is a chain of physical dependencies, not just a list of tasks.
    format: SEQUENCE
    why: The repair order follows the load path. The low bearing cannot be adjusted while the ring is pressing on it, so nearby
      jacks take the weight first. Spacer thickness comes from the measured level, not from counting plates. After lowering
      the ring, the mounting bolts are tightened to the specified torque. The final run is essential. If the once-per-revolution
      current peak disappears, the measurement that started the repair has also been resolved.
    cards:
    - Jack the ring at the two bearings beside the low one and take the weight off it.
    - Add thin metal spacer plates under the low bearing until the ring is level within two millimetres.
    - Lower the ring onto the adjusted support and tighten the mounting bolts to the specified torque.
    - Turn the ride for ten minutes and confirm the drive current no longer peaks once each revolution.
    order:
    - 0
    - 1
    - 2
    - 3
- title: What the certificate can honestly say
  objective: Separate measured facts, model-based limits and unresolved questions before signing.
  briefing: The inspection is tomorrow, and a signature is not a thing that can be taken back.
  stake: Thursday. Tomorrow the county asks for one signature, so today every ride has to be reduced to a claim you can defend.
    One unresolved wheel joint cannot be allowed to hide inside six rides whose limits have actually been worked out.
  takeaway: A signature says what the working supports, and everything it does not cover has to be written down too.
  segue: The wheel did not make the certificate. So its gate stays shut. Twenty-four gondolas will sit still all season. The
    park signed the loan against next year at nine that night. Nobody dressed up the numbers to make it sound better.
  stops:
  - group: TOWER
    task: Match each ride to the claim its working actually supports.
    title: Seven rides and what can be claimed
    reason: The safety engineer's file has one line for each of the seven rides, and with ninety eight thousand dollars of
      advance bookings against opening weekend, the wording on that line is what the park's insurer and its customers will
      actually be trusting.
    place: The Drop Tower
    scene: The safety engineer's file has one line for each ride. Four are ready to be filled in. The wording matters because
      the sentence on a certificate is the sentence an insurer or court will later read.
    guide: Four rides on the left, and four forms of words on the right. Pair them by asking what the evidence behind each
      ride can carry. A tested claim covers the conditions actually tested. A margin that moves with performance needs a condition
      attached. A limit the machine enforces needs no person in it. And one of them has a known load and an unknown capacity.
    background:
    - Why explanations rather than labels. Naming a finding is not accounting for it, and a plausible-sounding mechanism attached
      to the wrong observation is the commonest way a wrong story survives. Committing an explanation to one clue means claiming
      it accounts for that clue specifically and not for its neighbour, which is where the two come apart.
    - How to use the one-each rule. The explanations are a set to be distributed, not a list to be sampled, so every join
      constrains the rest. Settling the two you are confident of can decide the remaining pair by elimination. Where it does
      not, two explanations are still competing for one clue, and that competition is the distinction the stop is testing.
    - Why you cannot be wrong about exactly one. With every explanation used once, three correct joins leave the fourth with
      only one place to go. Any error therefore involves at least two. That is worth remembering when the last pair looks
      forced. The fault is usually not in the join you are struggling with. It is in one you made early and stopped questioning.
    assumes:
    - a claim is limited by the conditions the working was done under
    - a margin is a ratio between what is available and what is required
    takeaway: A certificate is a set of conditions with a number attached, and the conditions are the harder half.
    format: CASEBOOK
    why: Each certificate claim has to match the evidence that supports it. The witnessed tower drop supports only the tested
      ballast and release condition. The coaster can carry a daily operating condition because its station-speed surrogate
      was checked against crown speed. The carousel controller directly enforces its derived setting. The wheel has a modeled
      joint load and a measured flaw, but no allowable damaged-joint capacity. That missing capacity, not the existence of
      a calculation, is what prevents certification.
    scenarios:
    - The drop tower, with a witnessed 5.9 g carriage-accelerometer peak against a 6.0 g test criterion.
    - The coaster, with an operational crown-speed ratio of 1.20 and a calibrated morning station-speed rule.
    - The swing carousel, derived at about 31° and limited by an automatic speed cutoff at 10 turns a minute.
    - The wheel, with the number-nine joint load estimated and the crack-like indication measured but its allowable damaged
      capacity unresolved.
    choices:
    - Certified as tested, with ballast mass, release height and instrument criterion named.
    - 'Certified with a condition: it opens only when the calibrated morning station-speed minimum is met.'
    - Certified to the controller-enforced speed setting supported by the derivation.
    - 'Not certified: the damaged joint’s allowable capacity is still unknown.'
    mapping:
    - 0
    - 1
    - 2
    - 3
  - group: SHIP
    task: Certify a swing angle
    title: What the seat pushes with at the bottom
    at: seat-frame
    reason: The structural engineer wants the ship's certified swing angle tied to the force it actually produces at the bottom,
      not to how steep it looks from the midway.
    place: The Pirate Ship
    scene: At the bottom of the swing, the seat must support a rider and bend their path upward toward the pivot. The structural
      engineer wants the certified angle tied to seat force rather than to appearance.
    guide: 'Five numbers, and one of them is the period, which does not enter this force. Ask of each whether the seat''s
      job depends on it. At the bottom the seat carries the weight and bends the path upward as well, so the answer has two
      parts. And note how it grows: bottom speed rises with angle, so the seat force outruns the angle itself.'
    background:
    - Why an estimate rather than a calculation. Every quantity on this board is already measured or stated, so nothing here
      has to be derived. What is being tested is whether you can pick the quantities the relationship actually needs. The
      second half is whether the size of the answer looks right once they are in place.
    - Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label
      catches a unit mismatch before it is placed. It also catches a quantity belonging to a different part of the problem.
      That is the habit this format exists to build.
    assumes:
    - a body on a curve needs a net force toward the centre of that curve
    - at the bottom of a swing the seat pushes up and gravity pulls down
    takeaway: An angle is certified by the force it produces, not by the angle it looks like.
    format: BALLPARK
    question: Estimate the seat force at the bottom of a 48° swing, as a multiple of the rider's weight.
    why: At the bottom of the swing, the required centripetal acceleration points upward toward the pivot. Gravity pulls downward,
      so the seat must overcome weight and supply the extra inward force. Using v²/r gives the added acceleration. The total
      seat force is about 1.67 times body weight at 48 degrees. This is what a rider feels as apparent weight. A larger swing
      angle produces a larger bottom speed, so the seat force rises faster than the angle itself suggests.
    estimate:
      prompt: The boat passes the bottom at 7.5 m/s on an arm of 8.6 m. At the bottom the seat pushes up and gravity acts
        down.
      question: Estimate the seat force at the bottom of a 48° swing, as a multiple of the rider's weight.
      labels:
      - 1  (the rider's own weight, always there)
      - 7.5 m/s  (speed through the bottom)
      - 8.6 m  (radius of the swing)
      - 9.8 m/s²  (g)
      - 5.9 s  (period of the swing)
      values:
      - 1
      - 7.5
      - 8.6
      - 9.8
      - 5.9
      slots: 4
      template: '{0} + {1} × {1} ÷ ({2} × {3})'
      formula: a + b*b/(c*d)
      correct:
      - 0
      - 1
      - 2
      - 3
      target: 1.67
      tolerance: 0.12
      units: × the rider's weight
      solution: N/mg = 1 + v²/(rg) = 1 + 7.5² ÷ (8.6 × 9.8) ≈ 1.67.
      explanation: The one is the rider's weight, which the seat carries even at rest. The period is what the swing takes
        and not what it does to anybody.
      relationship: 'N/mg = 1 + v²/(rg): at the bottom the seat carries the weight and supplies the turning force as well.'
  - group: FLUME
    task: Set what a boat may carry
    title: Four adults, and why not five
    reason: McCarthy's four-adult rule came from boats that don't exist anymore, and the certificate needs the real limit
      stated before another season of loading by habit.
    place: The Log Flume
    scene: The new hull is 0.30 m deep. Four adults put it about 0.154 m into calm water; five put it about 0.179 m in. Instrumented
      splash-down tests show the waterline can rise about 0.13 m up the side above its calm position. The certificate must
      now state the passenger limit.
    guide: Four options, and one of them says nothing limits it at all. Ask of each whether floating and having enough side
      above the water are the same question. Five adults still float. What each one costs is height of hull above the waterline,
      and at splash-down the water rises to meet it. The old rule came from boats that no longer exist.
    background:
    - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading
      — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each
      belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across
      a whole game the key used to be the longest option far more often than chance. Here it was 88 per cent of passage quizzes,
      before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the
      signal taken out of them deliberately.
    - What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option
      fails, not a restatement of the right one. They are worth reading after a correct answer as well. A right choice made
      for an approximate reason is indistinguishable from a sound one. That holds until the day the approximation is what
      is being tested.
    assumes:
    - a floating boat sits at whatever depth displaces its own weight
    - the drop at the end of the flume throws up a wave the boat meets
    takeaway: A floating body can still fail if too little of its side remains above the water.
    format: CHOICE
    question: What actually limits the number of adults in one of these boats?
    why: The operating limit comes from freeboard during splash-down, not from whether the boat merely floats. With four adults,
      calm-water freeboard is about 0.146 m, leaving roughly 0.016 m above the measured 0.13 m splash rise. With five adults,
      freeboard falls to about 0.121 m, so the same splash can overtop the side. The four-adult rule is therefore supported
      by the measured hull and splash data rather than by habit.
    choices:
    - 'Four adults: the measured splash rise still fits inside the remaining freeboard.'
    - 'Five adults: buoyancy proves the boat is safe as long as it continues to float.'
    - Four adults only because that was the inherited rule on the old timber boats.
    - Any load below the manufacturer’s structural mass limit, regardless of splash-down freeboard.
    answer: 'Four adults: the measured splash rise still fits inside the remaining freeboard.'
    rebuttals:
    - Floating is necessary but not sufficient; water can overtop a boat that is still buoyant.
    - The old rule is evidence to investigate, not a derivation for a different hull.
    - Structural capacity and freeboard are different limits, and the smaller usable limit controls operation.
- title: The signature
  objective: Decide which rides open, which one stays shut, and sign only what the evidence supports.
  briefing: The inspection is this morning, and what survives it is what was derived.
  stake: Friday. The county inspector is at the gate and the park cannot open without your certificate. Six rides now have
    defensible limits or verified conditions. The Ferris wheel still has a loaded joint with a measured crack-like indication
    and no fracture assessment. Today your signature becomes the decision.
  takeaway: What outlives this fortnight is what somebody wrote down in a form the next person can use.
  stops:
  - group: COASTER
    task: Spend two winter work slots on the evidence that most changes next season's decisions.
    title: What to spend the winter on
    reason: Brennan turned up this morning with a tenth notebook found in a drawer, the 1998 regrade dated and sketched but
      never given a drawing number, and that gap is exactly the kind of unresolved question this winter's two work slots are
      supposed to answer.
    place: The Coaster
    scene: There is money for only two winter jobs before next season. The park manager, Marta Kovač and the safety engineer
      each have a proposal. The Ferris wheel still has no final answer on its number-nine wheel joint.
    guide: 'Two winter slots, three proposals. Open each one to see what its result could change: ''a certification, a design
      decision, or an argument nobody has to settle before reopening. Buy the two whose answers change what the park can decide,
      not the two that study the most interesting problem. The wheel joint has no final answer yet, which is a decision still
      open.'''
    background:
    - What makes a piece of work worth funding. Not how much it would teach — how much it would change. Work that confirms
      something already certified produces a tidy report and no decision. Work on a fault nobody can act on until next season
      can wait a season.
    - Why the wheel joint is the one to watch. An unanswered question about a joint that carries load is a question the park
      cannot reopen around. That makes information about it worth more than information about anything already signed off,
      whatever the relative engineering interest.
    - Why only two. A budget is what makes this a decision rather than a wish list. The third proposal is not wrong. It is
      simply the one whose answer can arrive later without costing anything. Saying that out loud is the part that a manager
      has to be able to defend in spring.
    assumes:
    - the wheel is the only ride still missing a certification decision
    - the coaster drawing has already been shown wrong at the top of the loop
    takeaway: The best investigation is the one that can change a decision, not the one that merely adds detail to something
      already understood.
    format: VALUE
    question: You can fund two pieces of work. Which two buy information that changes what the park can decide before reopening?
    value:
      hint: You have two work slots. Buy the work whose result could change a certification or design decision; each purchase
        reveals what that job would actually settle.
      decision: Which unresolved ride decisions can be settled before next season?
      budget:
        amount: 2
        unit: winter work slots
      options:
      - id: fracture
        label: Crack-strength assessment of the number-nine support arm
        cost: 1
        axis: wheel structural capacity
        decisive: true
        reveals: Whether the measured crack-like mark can carry the computed joint load with an acceptable margin.
      - id: survey
        label: Full coaster geometry survey
        cost: 1
        axis: coaster geometry
        decisive: true
        reveals: Whether other built radii and heights differ from the old drawings enough to change the certified limits.
      - id: overhaul
        label: Coaster bearing and wheel overhaul
        cost: 1
        axis: coaster rolling loss
        decisive: false
        reveals: Whether maintenance recovers some station return speed; the morning rule already tells the park whether today's
          train may run.
      - id: paint
        label: Repaint the midway and carousel horses
        cost: 1
        axis: appearance
        decisive: false
        reveals: The appearance of the rides changes, but no unresolved engineering claim is answered.
      correct:
      - fracture
      - survey
    answerText: Fund the wheel crack-strength assessment and the coaster survey. Each answers an unresolved question that
      can change certification; the overhaul and repaint do not.
    why: The wheel has a known joint load and a measured crack-like mark, but no crack-strength assessment. That missing result
      directly controls whether the wheel can be certified. The coaster has a different unknown because one important radius
      already disagreed with its old drawing. A full geometry survey could reveal other geometry errors. An overhaul may improve
      a known speed loss, but the morning rule already manages that condition. Repainting changes appearance only. With two
      work slots, the best purchases settle unresolved decisions.
  - group: WHEEL
    task: State what can be claimed about the wheel
    title: The honest sentence about number nine
    reason: Raman has the computed bolt load and the inspector has the crack's measured size, and the board needs one honest

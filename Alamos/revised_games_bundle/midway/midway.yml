  stops:
  - group: FLUME
    task: Derive the speed the water leaves the chute at
    title: The same square root, from a different law
    at: header-gauge
    reason: Abara has a manufacturer's number for the outlet speed and no derivation behind it, and getting the same square
      root from an energy statement is what finally lets him defend that number to an inspector.
    place: The Log Flume
    scene: The chute outlet is 4.2 metres below the surface of the water standing in the top pond. Abara has a figure from
      the manufacturer and no derivation, and both surfaces are open to the air.
    guide: Build the energy statement for the flow down to the speed at the outlet, one line at a time. Then say what it has
      in common with the drop tower on day one. The same square root arrives from a different law. Noticing that is the point
      of putting the two stops in one campaign.
    background:
    - Why the pressures cancel. Both surfaces are open to the air, so the pressure term is the same at each end and drops
      out. What is left relates the height difference to the speed. The result is the same √(2gh) the falling carriage gave.
      In both cases gravitational energy is being turned into motion, with nothing else taking a share.
    - What is being assumed. Steady flow, no viscosity, and a pond surface large enough that its own level barely moves. Real
      chutes lose to friction and turbulence, so the derived speed is an upper bound. The manufacturer's figure being lower
      is what you would expect rather than a contradiction.
    - Why the same answer twice matters. A student who derives √(2gh) from kinematics and again from an energy statement about
      a fluid has met the same physics wearing two different notations. That recognition is worth more than either result,
      and it is why the flume is on the syllabus at all.
    assumes:
    - for steady incompressible flow, continuity keeps area times speed constant
    - pressure, motion and height together account for the mechanical energy of a flowing liquid
    takeaway: The same energy model can predict an ideal speed in water and in free fall, but real flow losses still have
      to be measured.
    format: DERIVE
    question: Derive the ideal outlet speed, and say what the calculation can and cannot certify.
    answerText: The outlet speed is v₂ = √(2 × 9.8 × 4.2) ≈ 9.1 m/s. It matches the speed gained by a body falling through
      the same height.
    why: Between the broad upper pond and the outlet, atmospheric pressure cancels and the pond-surface speed is small. Neglecting
      viscous and turbulence losses gives the ideal result v = √(2gh). That is the same square-root form the tower reached
      from gravity. But a real flume loses energy in bends, rough surfaces and contractions, so this result is a prediction
      or upper benchmark, not a substitute for measuring the operating flow.
    derive:
      hint: Write the statement at the top surface and at the outlet, then strike out everything that is the same at both.
      start: P₁ + ½ρv₁² + ρgh₁ = P₂ + ½ρv₂² + ρgh₂
      startNote: point 1 is the pond surface, point 2 the open chute 4.2 m below it
      goal: the speed the water leaves the chute at
      steps:
      - ask: Strike out what is equal at the two points.
        answer: 3
        candidates:
        - text: The heights cancel, since both points are in the same body of water
          rule: cancellation
          why: The height difference is the entire driving term. Cancelling it leaves an expression saying still water squirts,
            which is the one thing everybody knows it does not do.
        - text: The pressures cancel, and the pond surface speed is what the answer depends on
          rule: cancellation
          why: The first half is right and the second reverses it. The pond falls a millimetre a minute, which is why its
            speed term is the one that can be dropped.
        - text: Nothing cancels, since the two points are in different places
          rule: conservation
          survives: true
          why: Formally safe and it refuses the method. Both surfaces are open to the air, so the pressures are equal and
            identical terms on both sides may be struck out — which is what makes this statement usable with a tape measure.
        - text: The pressures cancel, both being atmospheric, and v₁ ≈ 0 at the pond surface
          rule: cancellation
      - ask: Solve what is left for the outlet speed.

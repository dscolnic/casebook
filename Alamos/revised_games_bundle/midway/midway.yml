    - zone: Drive
      label: Current
      value: peaks once a revolution
      status: alarm
    - zone: Drive
      label: Average current
      value: up 18% since autumn
      status: alarm
    - zone: Drive
      label: Speed held
      value: 8.0 rev/min steady
      status: normal
    - zone: Centre bearing
      label: Temperature
      value: unchanged
      status: normal
      note: rules out the main bearing
    - zone: Platform
      label: Level around the ring

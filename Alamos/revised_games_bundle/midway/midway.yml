      harder at the wrong phase adds load without fixing anything, and mass mostly cancels from the period.
    background:
    - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading
      — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each
      belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across
      a whole game the key used to be the longest option far more often than chance. Here it was 88 per cent of passage quizzes,
      before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the
      signal taken out of them deliberately.
    - What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option
      fails, not a restatement of the right one. They are worth reading after a correct answer as well. A right choice made
      for an approximate reason is indistinguishable from a sound one. That holds until the day the approximation is what
      is being tested.
    assumes:
    - a push in step with an oscillation adds energy and an out-of-step push can remove it
    - the operating period can differ from the small-angle estimate at large amplitude
    takeaway: Resonance is a timing problem before it is a force problem.
    format: CHOICE
    question: The drive and the operating swing disagree by three tenths of a second. What should be changed?
    why: The operating period is set by the ride's geometry, gravity and amplitude. The drive interval is a control setting.
      Changing the arm would rebuild the machine to preserve an old setting. Pushing harder at the wrong phase adds structural
      load without fixing the timing. Restricting rider mass also misses the cause because mass largely cancels from the period.
      The direct fix is to retime the drive to the measured operating period and then verify that the swing reaches angle
      without excess load.
    choices:
    - Retime the drive to the measured operating period, then verify the response.
    - Shorten the arm until the boat's period falls to the existing drive interval.
    - Increase the push force until the boat reaches angle despite the timing mismatch.
    - Restrict the ride to lighter loads so fewer pushes are needed.
    answer: Retime the drive to the measured operating period, then verify the response.
    rebuttals:
    - Changing the arm changes the ride geometry and every calculation that depends on it.
    - More force at the wrong phase raises load without correcting when the push arrives.
    - Mass is not the source of the period mismatch, so a load restriction only hides it.
  - group: TOWER
    task: Prove the brake rather than assert it
    title: What the drop test has to show
    at: brake-desk
    reason: The safety engineer has one afternoon before the inspectors leave to prove the tower's brake rather than just
      claim it, so the prediction gets locked in before anyone watches the drop.
    place: The Drop Tower
    scene: Thursday's official drop test has one afternoon to produce a number the safety engineer can compare with the certificate.
      The tower technician has test weights, a recording accelerometer and the full tower before the inspectors leave.
    guide: 'Lock a prediction for the peak deceleration before the drop happens: the panel will not let you look first. Then
      run the test and read what the accelerometer actually recorded. The last step costs something. You have to say what
      the comparison settles. A measurement you interpret after seeing it can be made to agree with anything.'
    background:
    - Why the prediction is locked. A number written down afterwards is not a prediction. The way it fails is not dishonesty
      but memory. With a recording in front of you it is genuinely hard to recall how confident you were. Committing first
      is a procedure that protects you from yourself, which is why it is enforced by the panel rather than recommended.
    - What the test can and cannot settle. It can tell you whether the brakes produce the deceleration the certificate claims,
      on this tower, with these weights, today. It cannot tell you what a loaded carriage of nervous people will do differently,
      and the inspectors will ask about the difference.
    - Why one afternoon is the constraint. The inspectors leave, so a test that produces an ambiguous result is a test that
      cannot be repeated in time. That is the reason for deciding beforehand what result would count as agreement — the alternative
      is discovering the criterion after the data arrives.
    assumes:
    - a prediction made before a test is worth more than an explanation offered after it
    - an instrument records what happens at the place it is fitted
    takeaway: Know what the instrument measures before comparing its number with a calculation.
    format: VERIFY
    question: Predict the peak accelerometer load in the brakes, run the drop, and say what the measurement settles.
    verify:
      hint: Commit to a number before the drop. A test that is interpreted afterwards can be made to agree with anything.
      prediction:
        label: Predicted peak carriage accelerometer load
        unit: g
        min: 2
        max: 8
        step: 0.1
      truth: 5.9
      passRatio:
      - 0.93
      - 1.1
      intervention:
        label: The witnessed drop
        note: Ballast to 640 kg aboard, released from the full height, site closed to the public.
        outcome: Drop completed. Carriage stopped 8.7 m into the braked section with the fins warm.
      measurement:
        label: Logged peak specific force from the carriage accelerometer
        note: Downloaded on the platform, in front of the inspector, before the carriage is moved.
        cost: 1
        costUnit: drops
      unmeasuredMoral: The carriage was dropped, the brake stopped it and the log was never read. Nothing in that sequence
        establishes what the fins did to anybody sitting in it.
      commit: Report the brake performance
      outcome: Drop completed. Carriage stopped 8.7 m into the braked section; the recorded peak was 5.9 g.
    answerText: Expect a peak near 5.9 g on the carriage accelerometer, just above the roughly 5.8 g average support load
      implied by the witnessed stop and below the 6.0 g test criterion.
    why: Stopping distance gives the carriage's net kinematic acceleration. A carriage accelerometer measures non-gravitational
      specific force, so in a vertical stop it also includes the support needed to overcome gravity. For the witnessed 8.7
      m stop, the average accelerometer load is about 5.8 g, making a measured 5.9 g peak plausible for this brake profile.
      The test checks the brake model and the carriage load under the specified ballast condition; it does not by itself reproduce
      every rider-body or restraint load.

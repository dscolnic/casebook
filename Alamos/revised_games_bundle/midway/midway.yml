  - group: COASTER
    task: Derive the speed the top of the loop demands
    title: What the loop asks for at the top
    at: profile-drawing
    reason: Kovač's tape found a wider crown than the 1974 drawing ever showed, and deriving the minimum speed for both radii
      is what tells the park how much of its margin was never really there.
    place: The Coaster
    scene: At the top of the loop the track is above the train and the rider is upside down. Kovač's tape gives a radius of
      7.4 metres there, against 5.6 on the drawing everyone has been working from.
    guide: 'Build the force statement at the crown of the loop down to a minimum speed, one line at a time. Then evaluate

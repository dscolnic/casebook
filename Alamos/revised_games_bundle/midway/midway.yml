  - group: SHIP
    task: Which explanation fits every reading?
    title: Idowu was right
    at: drive-console
    reason: Idowu has said for two seasons that a full boat feels wrong at speed, and reading the drive panel against the
      measured period is what finally proves he was right instead of just persistent.
    place: The Pirate Ship
    scene: The drive pushes the boat at a fixed interval set years ago. A low-angle test gives 5.9 seconds, while the 48°
      operating swing measures about 6.15. Five console readings are available and three look ordinary.
    guide: Five readings, and the ordinary ones matter. The bearing temperature is normal. The drive delivers its rated push.
      Ask of each candidate how many of the five it covers. The deciding reading is the operating period, which at 48 degrees
      is not the small-angle figure the drive was set to. Heavy loads expose a timing mismatch sooner, because they need more
      good pushes.
    background:
    - Why the unremarkable readings decide it. The salient reading is what draws attention, and it is usually consistent with
      several explanations at once, which is why it rarely settles anything. The readings that discriminate are the ones a
      candidate predicts should have moved and which have not. A normal value is a positive result against every mechanism
      that would have disturbed it.
    - How to work the candidates. Take each mechanism and predict the panel it implies before you look at the panel again.
      Which readings it drives, in which direction, and by roughly how much. Then compare. Working that way round is what
      separates a diagnosis from a rationalisation, because the prediction is made before the data is consulted.
    - Why only one candidate survives. Several will account for part of the panel, deliberately so, and a partial fit is exactly
      what a confident wrong answer feels like from the inside. When two remain, look for the reading on which their predictions
      differ and let it decide. If no reading separates them you have not finished reading the panel.
    assumes:
    - a push in step with an oscillation adds energy and an out-of-step push can remove it
    - the small-angle pendulum formula is approximate at a 48-degree swing
    takeaway: Resonance depends on phase — on the push arriving at the right moment in the swing — so the useful period is
      the one the ride actually swings at.
    format: DIAGNOSIS
    question: Which explanation fits the full set of readings, including the operating period?
    why: 'The decisive fact is the measured operating period: the boat is cycling at about 6.15 s while the drive pushes every
      5.85 s. Bearing temperature and play are normal, and the drive produces its commanded push, so a simple friction or
      weak-drive explanation does not fit all the evidence. The timing mismatch means the pushes arrive at the wrong phase.
      A full boat can expose that mismatch more strongly because the same actuator impulse produces a different angular response,
      even though total mass alone does not determine the natural period.'
    headline: Light loads nearly reach the set angle. Heavy loads fall short, while the measured operating period stays about
      6.15 s.
    readings:
    - zone: Drive
      label: Push interval
      value: 5.85 s (fixed since 1996)
      status: alarm
    - zone: Swing
      label: Measured period
      value: 5.90 s at low angle, either way
      status: normal
    - zone: Swing
      label: Angle reached
      value: 48° empty and 39° full
      status: alarm
    - zone: Drive
      label: Push force
      value: at its setting
      status: normal
    - zone: Bearing
      label: Temperature and play
      value: inside limits
      status: normal
      note: rules out friction in the pivot
    choices:
    - label: The drive interval does not match the boat's operating period.
      mechanism: A mistimed push can arrive before the boat reaches the phase where it adds energy.
    - label: The pivot bearing adds drag only when the boat is heavily loaded.
      mechanism: Extra drag would also raise the bearing temperature and motor load.
    - label: The drive delivers too little force on every push.
      mechanism: A weak drive would reduce the response without changing when each push arrives.
    - label: Extra rider mass makes the pendulum's period much longer.
      mechanism: Mass cancels from the pendulum timing to first order.
    answer: The drive interval does not match the boat's operating period.

      It lets you answer for a radius nobody measured when the ride was designed.'
    background:
    - 'Why the crown is the critical point. Upside down at the top, both the track''s push and the rider''s weight point the
      same way: towards the centre of the loop. That is the one place on the circuit where gravity is helping to turn the
      train. So it is the place where the least speed is needed to stay on the track. Below that speed the train does not
      fall off. The track has to pull instead, and it cannot.'
    - What the minimum condition means. Setting the track force to zero is not a design target; it is the boundary of the
      possible. A real ride is engineered well above it, and the margin is the whole safety case. The derivation gives you
      the boundary, and the certificate gives you the margin.
    - Why two radii matter so much. The minimum speed goes as the square root of the radius. So a loop that is actually 7.4
      metres across the crown demands more speed than a 5.6-metre one. Every calculation done from the drawing has been demanding
      too little. That is a paperwork problem with a physical consequence.
    assumes:
    - a body moving in a circle needs a net force toward the centre of that circle
    - a rail can push a train but cannot pull it
    takeaway: The limiting case is the one where a part stops doing anything, and it sets the number.
    format: DERIVE
    question: Work the force statement at the top of the loop down to a minimum speed, and evaluate it for both radii.
    answerText: At the measured radius, v_min = √(9.8 × 7.4) ≈ 8.5 m/s. The old drawing gives 7.4 m/s.
    why: At the top of the loop, both gravity and the rail can point toward the centre. The limiting case occurs when the
      rail's normal force just falls to zero. Then gravity alone must supply mv²/r, giving v_min = √(gr). A larger radius
      at the top of the loop therefore requires a larger minimum speed. Using 7.4 m gives about 8.5 m/s, compared with 7.4
      m/s from the old 5.6 m drawing. Smoother geometry can still demand more speed.

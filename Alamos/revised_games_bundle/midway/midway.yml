  stops:
  - group: BUMPER
    task: Derive the average force on a rider
    title: Turning a collision into a force
    at: dummy-rig
    reason: 'Chen''s telemetry gives the rider''s own speed change directly, and turning it into a force is what lets the
      safety lead finally compare a bumper hit against something riders already understand: their own weight.'
    place: The Bumper Cars
    scene: The rider's own speed change in Wei Chen's telemetry is 1.47 metres a second over 0.18 seconds. The safety lead
      wants that turned into a force and then compared with the rider's weight.
    guide: Build the impulse statement down to an average force on a sixty-kilogram rider, one line at a time. Then express
      that force as a multiple of the rider's own weight. In newtons the number means nothing to the safety lead; as a multiple
      of body weight it is a comparison they can use.
    background:
    - Why the car and the rider get different times. Chen's whole reason for instrumenting this ride is that a car changes
      speed in about a tenth of a second, and the rider strapped into it does not. The seat, the belt and the rider's own
      neck take longer to catch up, and that longer time is the one the force on a person actually depends on.
    - 'Why a newton means nothing and a multiple of weight does. 490 newtons is a number nobody carries a feel for. Divided
      by the rider''s own weight it becomes a comparison anybody already understands: about eight tenths of a g, milder than
      standing up too fast on a bus. That is the number Hart, the midway supervisor, can hand an operator without a calculator.'
    - Why time is the lever a designer actually has. The momentum change is fixed by the collision, but the time it happens
      over is not. Stretch it — with padding, a compliant restraint, a longer crush distance — and the average force drops
      in the same proportion. That is the whole argument for building a car to give a little rather than to be rigid.
    assumes:
    - impulse is force times time and equals the change in momentum
    - a rider's weight is their mass times g
    takeaway: A force from a collision is a momentum change divided by the time somebody was given to make it.
    format: DERIVE
    question: Work the impulse statement down to an average force on a 60 kilogram rider, and express it against their own
      weight.
    answerText: F = 60 × 1.47 ÷ 0.18 ≈ 490 N, which is about 0.83 of the rider's own weight.
    why: Impulse equals the change in momentum, so average force is momentum change divided by contact time. The rider changes
      speed by 1.47 m/s over 0.18 s. For a 60 kg rider, that gives about 490 N. Compared with body weight, the force is roughly
      0.83 g. The design lever is time. Stretching the same momentum change over a longer interval lowers the average force
      in direct proportion, which is why padding and compliant restraints help.
    derive:
      hint: Write the impulse relation, solve for the force, and then compare it with something the reader already has a feel
        for.
      start: FΔt = mΔv
      startNote: rider 60 kg, change of speed 1.47 m/s, over 0.18 s
      goal: the average force, and what it is as a multiple of the rider's weight
      steps:
      - ask: Solve for the average force.
        answer: 2
        candidates:
        - text: F = mΔvΔt = 60 × 1.47 × 0.18 ≈ 15.9 N
          rule: rearrangement
          why: The time multiplies the force in the relation, so it divides when the force is made the subject. Multiplying
            gives a number a hundredth of the real one.
        - text: F = Δv/(mΔt) = 1.47 ÷ (60 × 0.18) ≈ 0.14 N
          rule: rearrangement
          why: 'The mass belongs on top: a heavier rider needs a larger force for the same change of speed in the same time.
            As written, this says the opposite.'
        - text: F = mΔv/Δt = 60 × 1.47 ÷ 0.18 ≈ 490 N
          rule: rearrangement
        - text: F = mΔv/Δt with Δt taken as the car's 0.10 s, giving ≈ 880 N
          rule: definition
          survives: true
          why: Arithmetically clean, and it is the wrong body's time. The rider's momentum changes over the time the seat
            and their neck take, and using the car's collision time nearly doubles the answer.
      - ask: Express it against the rider's own weight.
        answer: 0
        candidates:
        - text: 490 ÷ (60 × 9.8) ≈ 0.83, so about 8 tenths of their weight
          rule: comparison
        - text: 490 ÷ 60 ≈ 8.2, so about 8 times their weight
          rule: comparison
          survives: true
          why: Dividing by the mass gives an acceleration, not a ratio, and 8.2 metres per second squared has been read as
            a multiple of weight. The number is real and it is not what it is being called.
        - text: 490 × 9.8 ≈ 4,800, so nearly 5000 times their weight
          rule: evaluation
          why: Multiplying a force by g gives nothing with a meaning. Weight is a force already; the comparison is a division.
        - text: 490 N is the weight of a 490 kg person, so it is 8 times a rider
          rule: definition
          why: A newton and a kilogram are not the same unit. 490 newtons is the weight of a fifty-kilogram mass, near enough
            1 rider rather than 8.
  - group: COASTER
    task: Turn a shrinking margin into something measurable each morning
    title: A margin that moves
    reason: Kovač has three years of station-speed readings showing the same slow decline, and deciding what the certificate

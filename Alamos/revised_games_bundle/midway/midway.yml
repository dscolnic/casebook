  - group: WHEEL
    task: Say what makes a wheel hard to start
    title: Where the mass is
    reason: Novák is pricing a replacement drive and needs the wheel's rotational inertia pinned down before the supplier
      will quote a number that means anything.
    place: The Ferris Wheel
    scene: Novák is quoting a replacement drive and the supplier wants the wheel's rotational inertia. Two wheels of the same
      total mass are on the table, one with heavy passenger cabins and one with a heavier center hub.
    guide: Two wheels of the same total mass, and four options. Ask of each whether it appeals to where the mass sits, or
      only to how much there is. Each piece counts in proportion to the square of its distance from the axis. So a kilogram
      at the rim is worth many at the hub. Two of these options get the direction of that backwards.
    background:
    - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading
      — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each
      belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across
      a whole game the key used to be the longest option far more often than chance. Here it was 88 per cent of passage quizzes,
      before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the
      signal taken out of them deliberately.
    - What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option
      fails, not a restatement of the right one. They are worth reading after a correct answer as well. A right choice made
      for an approximate reason is indistinguishable from a sound one. That holds until the day the approximation is what
      is being tested.
    assumes:
    - a torque is needed to change how fast something turns
    - the same mass can be arranged near an axle or far from it
    takeaway: Rotational inertia counts every kilogram by the square of how far out it sits.
    format: CHOICE
    question: Two wheels have the same total mass. Which is harder to bring up to speed?
    why: Rotational inertia depends on both mass and where that mass sits. Each piece contributes in proportion to the square
      of its distance from the axis. A kilogram near the outer rim matters far more than a kilogram near the center hub. That
      makes outer-rim-heavy wheels harder to speed up or slow down. Ferris-wheel passenger cabins are therefore kept light
      when possible. A flywheel does the opposite on purpose, putting mass outward so its rotation resists changes.
    choices:
    - The outer-rim-heavy wheel, because radius enters rotational inertia squared.
    - The center-heavy wheel, because the drive shaft turns the center hub directly.
    - Neither; equal total mass means equal rotational inertia.
    - The center-heavy wheel, because its mass follows a tighter circle.
    answer: The outer-rim-heavy wheel, because radius enters rotational inertia squared.
    rebuttals:
    - What the drive turns is the whole assembly, and the center hub contributes least of it whatever it weighs.
    - Straight-line inertia depends on mass alone; rotational inertia depends on where the mass is.
    - Mass near the center axle does turn through a tighter circle, which is exactly why it is easier rather than harder.
- title: The period that ignores the load
  objective: Derive why a pendulum's timing does not depend on what is in it.
  briefing: The drive has been pushing at the wrong moment on a full boat for two seasons, and nobody has said why until now.
  stake: Tuesday, and the same complaint has stood for two years. A full boat pushes late, and riders feel the jolt every

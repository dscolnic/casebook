      once a turn. A failing centre bearing would draw more current all the way round and would be warm, and the temperature
      has not moved. A motor fault would not synchronise itself to the platform''s rotation. And the speed is exactly where
      it is set, so nothing is running fast. The 11 millimetres is small, and it is at the right place in the cycle.'
    headline: The drive current rises once every revolution, and the ride still runs at its set speed.

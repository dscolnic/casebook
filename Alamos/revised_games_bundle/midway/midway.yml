    guide: Two bins. What a rider feels in a turn is the seat pushing them toward the centre. It depends on speed squared
      over radius. So a tight slow turn can beat a fast straight. Sort each complaint on whether it is about how fast or about
      how sharply.
    background:
    - Why riders cannot tell. A body has no sense that measures speed. What it senses is acceleration, which is what a seat,
      a rail or a harness has to supply. On a straight at constant speed there is nothing to feel at all, however fast it
      is.
    - Why the radius does the work. The acceleration in a turn is the speed squared divided by the radius, so halving the
      radius doubles it while nothing about the speed has changed. That is why the tightest bend, not the fastest section,
      is where a ride hurts people.
    assumes:
    - a body feels the force pushing it, not its speed
    takeaway: What a rider feels is acceleration, and a turn supplies it without going any faster.
    format: BELT
    question: Send each complaint to the bin that says what actually produced it.
    answerText: Anything about being thrown sideways or crushed into a seat is the turn. Anything about how fast it went is
      usually not the thing they felt.
    why: 'A rider has no organ that measures speed. What the body senses is acceleration, which is what the seat, the harness
      or the rail has to supply. So a straight run at constant speed produces no sensation at all, however fast it is. A tight
      bend at walking pace can be unpleasant. The acceleration in a turn is the speed squared over the radius. That is why

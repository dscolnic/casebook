  - group: BUMPER
    task: Say what a collision does to a neck
    title: The tenth of a second that matters
    reason: Chen's accelerometers show the car and the rider changing speed over two different times, and picking the right
      one is what keeps the safety lead's rule about rider force honest.
    place: The Bumper Cars
    scene: Wei Chen's accelerometers show the car changing speed in about 0.10 seconds, while the restrained rider's torso
      changes speed over about 0.18 seconds. The safety lead wants to know which interval belongs in a rule about average
      force on the rider.
    guide: Four options, and two intervals on the trace. Ask of each whose momentum change the time belongs to. The car takes
      a tenth of a second. The rider takes longer, because padding and belt stretch let them arrive at the new speed gradually.
      Using the car's interval describes the car. That is also why safety design lengthens rather than shortens the time.
    background:
    - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading
      — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each
      belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across
      a whole game the key used to be the longest option far more often than chance. Here it was 88 per cent of passage quizzes,
      before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the
      signal taken out of them deliberately.
    - What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option
      fails, not a restatement of the right one. They are worth reading after a correct answer as well. A right choice made
      for an approximate reason is indistinguishable from a sound one. That holds until the day the approximation is what
      is being tested.
    assumes:
    - a change in momentum needs a force acting over a time
    - a body and the seat it sits in can change speed over different times
    takeaway: The same speed change over a longer time is a smaller force, and the time is a design choice.
    format: CHOICE
    question: Which time should the force on a rider be computed over, and why?
    why: Impulse connects force, time and momentum change. The time interval must belong to the body whose force you are estimating.
      The restrained rider changes momentum over about 0.18 s, longer than the bumper contact itself. Using 0.10 s would describe
      the car more closely and would overstate the rider's average force. Padding, belt stretch and controlled seat motion
      can lower average force by spreading the rider's momentum change over more time.
    choices:
    - Use 0.18 s, the interval over which the rider changes momentum.
    - Use 0.10 s, because the car is the body that receives the collision.
    - Always use the shorter interval, because safety design should assume the largest force.
    - Time is unnecessary; the rider force follows from mass and speed change alone.
    answer: Use 0.18 s, the interval over which the rider changes momentum.
    rebuttals:
    - The car's time gives the force on the car, which is a question about the chassis rather than the rider.

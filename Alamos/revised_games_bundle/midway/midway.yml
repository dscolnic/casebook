    task: Separate total mass from the quantities that actually set the ship’s timing
    title: Sixty riders, nearly the same clock
    reason: Idowu's logs show nearly the same low-angle period empty and full, and the county wants to know whether that observation
      is physically plausible before anyone builds a control rule around it.
    concept: 'Simple harmonic motion: a restoring force proportional to displacement'
    place: The Pirate Ship
    scene: Sam Idowu has run the pirate ship for 20 years. In low-angle maintenance tests, empty and full runs both come back
      close to 5.9 seconds per cycle. Loading changes the forces in the structure, but the timing barely moves.
    guide: 'All four options explain a period that does not move when the boat fills. Ask of each whether it names a cancellation
      or an accident. The restoring pull is the boat''s own weight, and the inertia resisting it grows in the same proportion.
      So they cancel, and length and gravity are what remain. Note the limit too: this holds at small angles, and the ride
      swings 48 degrees.'
    background:
    - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading
      — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each
      belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across
      a whole game the key used to be the longest option far more often than chance. Here it was 88 per cent of passage quizzes,
      before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the
      signal taken out of them deliberately.
    - What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option
      fails, not a restatement of the right one. They are worth reading after a correct answer as well. A right choice made
      for an approximate reason is indistinguishable from a sound one. That holds until the day the approximation is what
      is being tested.
    assumes:
    - a pendulum has a restoring force toward its lowest point
    - Newton's second law connects net force, mass and acceleration
    takeaway: A model should identify which properties matter, not merely which quantity got larger.
    format: CHOICE
    question: Why is adding riders by itself not enough to predict a longer period?
    answerText: At small angles, the extra restoring force and extra inertia scale together, so mass cancels from the period.
    why: Pendulum timing is not set by total mass alone. In the simple-pendulum model mass cancels exactly; for the real pirate
      ship, which is a physical pendulum, the period depends on rotational inertia and where the combined centre of mass lies
      relative to the pivot. Adding riders can change those quantities, but merely saying 'more mass' does not determine the
      direction or size of the timing change. The park's own measured periods therefore matter more than a mass-only argument.
    choices:
    - Because period is controlled by geometry and mass distribution, not by total mass alone.
    - Because heavier riders make gravity weaker by the same amount that inertia grows.
    - Because the drive motor forces every load to have exactly the same natural period.
    - Because mass affects only speed, never forces or timing.
    answer: Because period is controlled by geometry and mass distribution, not by total mass alone.
    rebuttals:
    - Local gravity does not decrease when riders board the boat.
    - The drive can force motion, but it does not redefine the structure’s natural dynamics.
    - Mass clearly affects structural forces; the issue is that total mass alone does not determine the period.

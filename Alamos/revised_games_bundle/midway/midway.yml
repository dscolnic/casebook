    place: The Coaster
    scene: The crown-speed margin is 1.20. Over the test runs, paired measurements show that a lower station return speed
      tracks a lower crown speed under the same train and operating conditions. Marta Kovač's seasonal records also show station
      return speed drifting downward.
    guide: Four candidate rules, and the quantity that matters is hard to measure every morning. Ask of each whether the crew
      could actually do it before opening, every day. Station return speed is easy and consistent, and the ride's own losses
      link it to the speed at the top. A yearly recalculation cannot catch a decline soon after it starts.
    background:
    - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading
      — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each
      belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across
      a whole game the key used to be the longest option far more often than chance. Here it was 88 per cent of passage quizzes,
      before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the
      signal taken out of them deliberately.
    - What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option
      fails, not a restatement of the right one. They are worth reading after a correct answer as well. A right choice made
      for an approximate reason is indistinguishable from a sound one. That holds until the day the approximation is what
      is being tested.
    assumes:
    - friction losses grow as wheels and bearings wears
    - a margin can be watched by measuring something easier than the quantity itself
    takeaway: A quantity nobody can measure daily is watched through one that can be.
    format: CHOICE
    question: What should the certificate require, given a margin that falls a little each season?
    why: The quantity that matters to the loop model is crown speed. Permanent crown instrumentation would be best, but the
      paired test runs establish a practical relationship between crown speed and the easier station return measurement under
      controlled conditions. That lets the certificate set a conservative daily station-speed minimum as a surrogate, while
      requiring revalidation if train configuration, track condition or braking changes. A surrogate is useful only because
      its connection to the decision variable was actually checked.
    choices:
    - Set a minimum station return speed for each morning.
    - Recompute the loop margin every spring before the season opens.
    - Reweigh the train whenever the margin is questioned.
    - Measure speed at the top of the loop on every circuit automatically.
    answer: Set a minimum station return speed for each morning.
    rebuttals:
    - An annual check is the interval that let a 1998 track alteration go unnoticed for 25 years.
    - The train's mass cancels out of every limit computed this fortnight, so reweighing settles nothing.
    - Measuring that speed directly would be ideal, but adding permanent sensors at the top of the loop is a major installation.

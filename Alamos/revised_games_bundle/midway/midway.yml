- title: The seat, the pole and the ram
  objective: Put forces on the parts that hold people in a circle.
  briefing: The carousel's poles and the flume's gate both hold, and neither has ever been computed.
  stake: Friday, and the first week ends. Three parts are holding riders up this weekend with no number behind any of them.
    Today you find the force on a carousel pole, order the tower's drop test, and see what a hydraulic ram buys and costs.
  takeaway: Every part in this park is holding a force somebody can compute in three lines.
  segue: 'The carousel controller is wired now, with a real number behind it. The flume gate carries its number too. But a
    bigger question just came in: will the rider log survive a packed crowd? The first hot Saturday of the year starts in
    six hours.'

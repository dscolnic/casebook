    background:
    - Why an estimate rather than a calculation. Every quantity on this board is already measured or stated, so nothing here
      has to be derived. What is being tested is whether you can pick the quantities the relationship actually needs. The
      second half is whether the size of the answer looks right once they are in place.
    - Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label
      catches a unit mismatch before it is placed. It also catches a quantity belonging to a different part of the problem.
      That is the habit this format exists to build.
    assumes:
    - a floating body pushes aside its own weight of water
    - water has a density of about 1000 kilograms per cubic metre
    takeaway: A floating body settles until the water it has pushed aside weighs what it does.
    format: BALLPARK
    question: Estimate how deep a boat with four adults sits in the water.
    why: A floating boat settles until the buoyant force equals its weight. That means the displaced water must have the same
      mass as boat plus passengers. Four adults bring the total to 492 kg, which requires about 0.492 m³ of displaced water.
      Spread over the hull area, that is about 0.154 m of depth in the water. A fifth adult still floats. The concern is the
      less hull side left above the water when the boat reaches splash-down and meets a rising wave.
    estimate:
      prompt: Boat 180 kg, 4 adults at 78 kg each, hull 2.9 m by 1.1 m and near enough rectangular.
      question: Estimate how deep a boat with four adults sits in the water.
      labels:
      - 492 kg  (boat plus 4 adults)
      - 1000 kg/m³  (density of water)
      - 2.9 m  (length of the hull)
      - 1.1 m  (width of the hull)
      - 0.30 m  (depth of the hull side)
      values:
      - 492
      - 1000
      - 2.9
      - 1.1
      - 0.3
      slots: 4
      template: '{0} ÷ {1} ÷ ({2} × {3})'
      formula: a/b/(c*d)
      correct:
      - 0
      - 1
      - 2
      - 3
      target: 0.154
      tolerance: 0.02
      units: m
      solution: Volume displaced = 492 ÷ 1000 = 0.492 m³; over 3.19 m² of hull that is 0.154 m deep in the water.
      explanation: The hull height left above the water is a separate safety margin used later; it is not part of this calculation.
      relationship: 'Depth in water = mass ÷ (density × hull area): a boat sinks until it has pushed aside its own mass of
        water.'

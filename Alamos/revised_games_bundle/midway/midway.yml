    assumes:
    - a body in a circle needs a net force toward the centre
    - that force is the mass times the centripetal acceleration
    takeaway: Circular-force problems often hide the needed speed inside a rotation rate, so convert the motion before applying
      F = mv²/r.
    format: BALLPARK
    question: Estimate the sideways force on the rider, converting the carousel's eight revolutions a minute into linear speed
      first.
    why: Eight revolutions a minute is an angular rate, not the rider's linear speed. One revolution covers 2πr, so the rider
      moves about 5.2 m/s at 6.2 m radius. Then F = mv²/r gives about 340 N toward the centre. The square on speed makes controller

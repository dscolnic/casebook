    concept: The pendulum period, and the cancellation that removes the mass from it
    place: The Pirate Ship
    scene: The old manual treats the ship as though its mass were concentrated at one point a distance L below the pivot.
      Idowu's low-angle maintenance log is about 5.9 seconds per cycle. Today you derive what that simplified model predicts
      before deciding whether the actual ride satisfies it.
    guide: Build the simple-pendulum result line by line. The goal is not to prove the pirate ship is simple; it is to know
      what the model predicts and which assumptions tomorrow's decision would depend on.
    background:
    - For a point-mass pendulum at small angle, sinθ ≈ θ in radians. That turns the restoring force into one proportional
      to displacement, the defining form of simple harmonic motion.
    - In that simplified model the mass multiplies both the restoring force and the inertia term, so it cancels. The result
      depends on length and gravity, not on total mass.
    - The real pirate ship is a rigid body with mass spread through a boat, frame and riders. Its period therefore requires
      a physical-pendulum model or direct measurement. Deriving the simple formula is still useful because it exposes exactly
      what would have to be true for the shortcut to work.
    assumes:
    - for a small angle, the sine of the angle is close to the angle itself in radians
    - motion with a restoring force proportional to displacement repeats at a fixed rate
    takeaway: Derive the simple model first; then test whether the real machine deserves it.
    format: DERIVE
    question: Derive the small-angle period for the simple-pendulum model, then state what remains to be checked before using
      it on the ride.
    answerText: For a simple point-mass pendulum, T = 2π√(L/g). The real ship is not a point mass, so its operating period
      must be measured or modeled with its rotational inertia.
    why: For the simple model, sinθ ≈ θ makes the restoring force proportional to displacement. Mass cancels from Newton's
      second law and gives T = 2π√(L/g). That is a valid derivation for a simple pendulum, not automatic proof about a pirate
      ship. The ride has distributed mass and a large operating amplitude, so its actual timing has to come from a physical-pendulum
      model or measurement.
    derive:
      hint: Get the force in terms of the sideways displacement, compare with the form for harmonic motion, and read off what
        is left.
      start: F = −mg sinθ
      startNote: 'candidate simple-pendulum model: a point mass at distance L from the pivot'
      goal: the small-angle period predicted by the simple model, and the assumptions behind it
      steps:
      - ask: Write the restoring force in terms of the sideways displacement x.
        answer: 2
        candidates:
        - text: F = −mgθ, with θ the swing angle measured in degrees
          rule: approximation
          why: The approximation only holds with the angle in radians, where an angle and its sine agree to within a per cent
            up to about 15 degrees. In degrees the 2 differ by a factor of 57.
        - text: F = −mgL sinθ
          rule: substitution
          survives: true
          why: That is the torque about the pivot rather than the force along the arc — correct physics, one line early, and
            it carries a length through everything below where a force belongs.
        - text: F = −mg(x/L), using sinθ ≈ x/L for a small swing
          rule: approximation
        - text: F = −mgx
          rule: approximation
          why: Replacing the sine with the displacement itself loses the length. A ten-metre pendulum and a one-metre one
            would then have the same period, which is the one thing everybody knows is untrue.
      - ask: Compare it with the form that gives harmonic motion.
        answer: 0
        candidates:
        - text: ma = −(mg/L)x, so a = −(g/L)x and ω² = g/L
          rule: comparison
        - text: ma = −(mg/L)x, so ω² = mg/L
          rule: comparison
          survives: true
          why: The mass is on both sides and has to go from both. Keeping it makes the period depend on the load, which contradicts
            the console log this ride has been printing for 20 years.
        - text: ma = −(mg/L)x, so a = −(g/L)x and ω = g/L
          rule: comparison
          why: The comparison is with a = −ω²x, so what is read off is ω squared. Taking it as ω gives a period nearly six
            times too short.
        - text: F = −kx with k = mg/L, so the period depends on the stiffness alone
          rule: substitution
          why: 'The effective stiffness is right and it is not the whole story: a period depends on the mass as well as the
            stiffness, and here the mass is inside k and cancels.'
      - ask: Turn that into the model period and state what it means.
        answer: 1
        candidates:
        - text: T = 2π√(g/L), so a longer pendulum has a shorter period
          rule: evaluation
          why: The ratio is inverted; the units are also those of inverse time rather than time.
        - text: T = 2π√(L/g) for the simple-pendulum model
          rule: evaluation
        - text: T = 2π√(L/g), therefore the real pirate ship must have that exact period
          rule: comparison
          survives: true
          why: The algebra is right and the conclusion outruns the model. A rigid ride is a physical pendulum, not a point
            mass on a massless string.
        - text: T = √(L/g), because 2π only matters for circular motion
          rule: evaluation
          why: The 2π converts angular frequency into the time for one full oscillation and cannot be dropped.

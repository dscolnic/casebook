    title: The order a drop test runs in
    at: bench-notebooks
    reason: Vey will only witness the annual drop test if the order it runs in turns the drop into evidence instead of a demonstration
      he has to take on faith.
    place: The Drop Tower
    scene: The safety engineer must observe and sign off on the tower's annual drop test. The tower technician has the test

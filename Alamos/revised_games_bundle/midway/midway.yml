      pole actually carries.
    concept: Newton's second law as the definition of a net force
    place: The Carousel and Swings
    scene: An outer horse carries a 78 kilogram rider 6.2 metres from the axis. The carousel is turning at eight revolutions
      a minute. Bisi Adeyemi wants the sideways force before anyone raises the controller setting.

      a person does. An alarm still leaves the choice with the operator. A log arrives after the exceedance. And rounded inputs
      are not a licence to add ten per cent, because the clearance that produced the limit has not moved.
    background:
    - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading
      — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each
      belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across
      a whole game the key used to be the longest option far more often than chance. Here it was 88 per cent of passage quizzes,
      before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the
      signal taken out of them deliberately.
    - What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option
      fails, not a restatement of the right one. They are worth reading after a correct answer as well. A right choice made
      for an approximate reason is indistinguishable from a sound one. That holds until the day the approximation is what
      is being tested.
    takesAsRead:
    - 'Velocity against speed: direction is part of the quantity'
    - 'Centripetal acceleration: v² over r, pointing at the centre'
    assumes:
    - a limit that is not enforced by the machine can be exceeded by an operator
    - a ride can be made to refuse a setting rather than to warn about it
    takeaway: A safety limit only works when the response to crossing it is defined before the limit is reached.
    format: CHOICE
    question: What should the controller do when the speed setting is pushed past ten turns a minute?
    why: A calculated limit matters only if the machine enforces it. An alarm still lets an operator choose to exceed the
      value. A log records the exceedance after it has already happened. The controller should therefore refuse settings above
      the derived limit. That makes the physics part of the machine rather than a suggestion beside it. Rounding the inputs
      does not justify adding an arbitrary ten percent, because the physical clearance that produced the limit has not changed.
    choices:
    - Refuse the setting outright, with no key override on the ride's own panel.
    - Sound an alarm on the panel and let the operator decide whether to carry on.
    - Log the exceedance for the maintenance report at the end of the week.
    - Allow it up to 11, since the derivation used rounded figures anyway.
    answer: Refuse the setting outright, with no key override on the ride's own panel.

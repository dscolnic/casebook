    - An alarm hands a safety decision to whoever is most tired, at the moment they are busiest.
    - A log turns the limit into something reviewed on Friday about a Saturday.
    - Rounded inputs do not make a limit approximate; the geometry the number comes from is fixed.
  - group: WHEEL
    task: Put a number on the wind a passenger cabin carries
    title: What the wind does to a passenger cabin
    at: gondola-shell
    reason: Raman wants the wind force on one gondola in hand before anybody argues about where the county's 22-metre-a-second
      limit actually comes from.
    place: The Ferris Wheel
    scene: A passenger cabin presents about 4.2 square metres side-on. Raman wants the force on 1 at the 22 metres a second
      the county's rule names, before anybody argues about the limit.
    guide: Six numbers, and one of them is the number of cabins on the wheel, which belongs to a later total. Ask of each
      whether the force on one cabin depends on it. And note the square on the wind speed. Twenty-two to thirty metres a second
      is nearly twice the force, which is why a rule watches gusts rather than the daily mean.
    background:
    - Why an estimate rather than a calculation. Every quantity on this board is already measured or stated, so nothing here
      has to be derived. What is being tested is whether you can pick the quantities the relationship actually needs. The
      second half is whether the size of the answer looks right once they are in place.
    - Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label
      catches a unit mismatch before it is placed. It also catches a quantity belonging to a different part of the problem.
      That is the habit this format exists to build.
    assumes:
    - moving air exerts a force on a surface that grows with the square of its speed
    - air has a density of about 1.2 kilograms per cubic metre
    takeaway: A wind limit is a force limit in disguise, and the square is why the last few metres a second matter most.
    format: BALLPARK
    question: Estimate the wind force on 1 passenger cabin at 22 metres a second.
    why: Wind force scales with the square of speed. For this passenger cabin, 22 m/s produces about 1.46 kN of sideways force.
      Doubling wind speed would quadruple that load. Even a rise from 22 to 30 m/s increases the force by about 86%. That
      steep growth is why gust speed matters more than the daily mean. A sensible operating rule starts action below the structural
      limit because unloading and stopping the wheel take time.
    estimate:
      prompt: Passenger-cabin area 4.2 m² side-on, drag coefficient 1.2 (a shape factor), air density 1.2 kg/m³, wind 22 m/s.
      question: Estimate the wind force on 1 passenger cabin at 22 metres a second.
      labels:
      - 0.5  (the factor in the wind-force formula)
      - 1.2 kg/m³  (density of air)
      - 1.2  (drag coefficient, a shape factor for the cabin)
      - 4.2 m²  (area presented to the wind)
      - 22 m/s  (wind speed)
      - 24  (passenger cabins on the wheel)
      values:
      - 0.5
      - 1.2
      - 1.2
      - 4.2
      - 22
      - 24
      slots: 5
      template: '{0} × {1} × {2} × {3} × {4} × {4}'
      formula: a*b*c*d*e*e
      correct:
      - 0
      - 1
      - 2
      - 3
      - 4
      target: 1464
      tolerance: 90
      units: N
      solution: F = ½ρC_dAv² = 0.5 × 1.2 × 1.2 × 4.2 × 22² ≈ 1,460 N on 1 passenger cabin.
      explanation: The speed enters squared, which is why the same passenger cabin carries a quarter of this at 11 metres
        a second.
      relationship: 'F = ½ρC_dAv²: wind force depends on air density, a shape factor, exposed area and the square of wind
        speed.'
  - group: FLUME
    task: Set the water cannon on the midway stall.
    title: Angle and charge, at three marks
    at: stall-cannon
    reason: The old water-cannon stall has never been calibrated, so hitting these three marks is the only way anyone learns
      what its pressure dial and worn pump can actually do.
    concept: 'Free fall: everything falls at the same rate whatever its mass'
    place: The Log Flume
    scene: The old midway stall has a water cannon and three targets across the pond. The pressure dial is unmarked, the pump
      is thirty years old, and nobody has a number for what it delivers.
    guide: Set the angle and the charge, and fire. Three marks, working outward. The dial is relative and the pump is worn,
      so nothing here tells you the launch speed. The way to find it is to fire, watch, and put the next shot between two
      you have seen.
    background:
    - Why there is no calculation to do first. Every other stop in this park hands you a number and asks what follows from
      it. This one hands you a dial with no units, on a pump nobody has tested. That is the honest situation, and the reason
      a fairground game is learned rather than solved.
    - What the flight tells you anyway. Once the water leaves the nozzle, gravity is the only thing acting on it downward,
      and it pulls the same whatever the jet weighs. Time in the air is set by the vertical part of the launch and nothing
      else. So a steeper shot hangs longer, and lands shorter at the same charge.
    - Why past forty-five degrees it gets worse. Aim higher and more of the same charge goes into height instead of distance.
      The far mark wants a flatter shot than the near one, which is the opposite of what everybody tries first.
    assumes:
    - a thrown or fired thing rises and falls under gravity
    takeaway: Some quantities are read off an instrument, and a few are found by trying them.
    format: LOB
    question: Land the jet on each mark, working outward.
    answerText: Bracket each mark with a short shot and a long one, then put the third between them. The far mark needs a
      flatter angle than it looks, not more charge.
    why: There is no number to start from, and that is the point of this stall. The dial is unmarked and the pump is worn,
      so the only honest method is bracketing. Fire short, fire long, and put the third shot between two settings you have
      actually watched. What the flights teach while you do it is the physics the rest of the park is built on. Once the water
      is in the air, gravity acts downward and nothing else does. It pulls at the same rate whatever the jet weighs. So the
      time in the air is set by the vertical part of the launch alone. That is why a steeper shot hangs longer and still lands
      shorter at the same charge. Past forty-five degrees the extra effort goes into height rather than distance. The far
      mark wants a flatter shot, which is the opposite of what everybody tries, and finding that out by firing is the fastest
      anybody ever learns it.
    lob:
      shots: 3
      maxSpeed: 34
      gravity: 9.81
      wind: 0
      height: 1.2
      hint: Two shots bracket a mark. The third goes between them.
      targets:
      - label: Bucket on the rail
        distance: 32
        radius: 2.5
      - label: Bell on the post
        distance: 68
        radius: 2
      - label: Far ring
        distance: 104
        radius: 1.8
      commit: Report the shots
- title: The first hot Saturday
  objective: Set the limits the ride will be operated to when nobody has time to think.
  briefing: 30 degrees forecast, a gusting westerly, and a queue that will not stop all afternoon.
  stake: Tuesday, and the forecast just came in. Opening weekend will be hot, windy, and packed with people. Today you set
    the wheel's wind rules with time built in, decide about the ship's drive, and get the tower's brake proved, not just claimed.
  takeaway: A limit written for a calm Tuesday is not a limit; it has to work on the worst afternoon of the year.
  segue: The wind rule got tested twice. It held up — the first plain win all fortnight. The lead time went into the wheel's
    controller by six that evening. But three faults were already on the maintenance board this morning. Only two days remain
    before the inspection.
  stops:
  - group: WHEEL
    task: Write the wind rules with their lead time
    title: Stopping a wheel takes time
    at: brake-drum
    reason: Raman wants the wheel's queue-closing threshold locked in before the gusts arrive, because a rule written while
      the wind is already rising is a rule written to excuse whatever has already happened.
    place: The Ferris Wheel
    scene: The wheel takes about eight minutes to unload after the last riders board, and clearing the existing queue takes
      about two hours. Raman wants the queue trigger fixed before a fast-moving front arrives.
    guide: One rule, written before the forecast updates arrive and fixed once released. Closing the queue and clearing the
      people already standing in it takes two hours, and at 22 m/s the wheel must not be carrying anybody. So the line goes
      back from 22 by however far the gusts climb in two hours. And not so far back that the ride is shut on a breezy afternoon.
    background:
    - Why a threshold is not a limit. The structural limit is where the wheel must already be stopped. The threshold is where
      you start stopping, and the gap between them is the time the action needs. Setting the threshold at the limit means
      beginning the evacuation at the moment it should have finished.
    - Why the two thresholds differ. Emptying the wheel and clearing the queue are different jobs with different durations
      and different consequences if they overrun. Two actions with the same lead time would be one rule. There are two numbers
      to set because one of them takes longer than the other.
    - Why the board is released rather than adjusted. Gusts arrive as a series of forecast updates. Adjusting a rule while
      the updates come in is how an operator ends up justifying whatever they have already done. Writing both numbers first
      is what makes them a rule instead of a commentary.
    assumes:
    - a wheel cannot be emptied instantly, and every action here needs warning
    - wind force grows with the square of the speed
    takeaway: A threshold has to fire early enough for the action behind it to finish.
    format: TRIGGER
    question: At what gust speed do you close the queue, given clearing the people already in it takes two hours?
    trigger:
      hint: The rule needs enough warning for what it starts to finish. The limit is where the queue must already be clear,
        not where the clearing begins.
      scale:

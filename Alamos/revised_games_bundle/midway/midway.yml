      before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the
      signal taken out of them deliberately.
    - What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option
      fails, not a restatement of the right one. They are worth reading after a correct answer as well. A right choice made
      for an approximate reason is indistinguishable from a sound one. That holds until the day the approximation is what
      is being tested.
    assumes:
    - a claim is limited by the working that supports it
    - an unresolved question is not the same as a negative finding
    takeaway: The strength of a claim is set by what was actually established, and saying so is the claim.
    format: CHOICE
    question: What is the honest sentence about the wheel this afternoon?
    why: 'The file supports two different kinds of statement. The joint load is a model-based estimate resting on load-sharing
      assumptions; the crack-like indication is a measurement. Neither supplies the damaged joint''s allowable capacity. Calling
      the wheel safe or unsafe would therefore outrun the evidence. The useful conclusion is narrow: the unresolved capacity
      question is exactly what the specialist fracture assessment must answer.'
    choices:
    - The joint load is estimated, the crack-like indication is measured, and its allowable capacity is still unknown.
    - The wheel is unsafe because any crack-like indication in a loaded joint proves failure is imminent.
    - The wheel is safe because it has carried passengers for 81 seasons.
    - Nothing useful can be said until the fracture assessment is complete.
    answer: The joint load is estimated, the crack-like indication is measured, and its allowable capacity is still unknown.
    rebuttals:
    - A flaw matters in relation to load, geometry, material and crack behavior; its presence alone does not establish imminent
      failure.
    - Past survival is evidence of history, not a quantified margin for the damaged joint.
    - The estimated load and measured indication remain useful because they define the question the specialist must answer.
  - group: TOWER
    task: Sign the park certificate
    title: Which certificate do you sign?
    at: brake-desk
    reason: Vey has the county seal on the desk. The park director wants all seven names on the page, but the wheel still
      has one unanswered question that the calculations cannot make disappear.
    place: The Drop Tower
    scene: The inspection is complete. The tower passed its instrumented drop. The coaster has a measured loop and a daily
      speed condition. The carousel, ship, bumper floor and flume have derived operating limits. The Ferris wheel has a computed
      joint load and a measured crack-like indication, but no fracture assessment.
    guide: The final choice is not which calculation looks best. It is what the evidence allows you to authorize. Separate
      conditions that can be managed operationally from an unresolved structural question that requires specialist evidence.
    takesAsRead:
    - A certificate should distinguish measured results, model-based limits and unresolved structural questions.
    assumes:
    - the instrumented tower test passed the written criterion
    - the coaster daily surrogate was calibrated against paired crown-speed measurements
    - the wheel crack-strength assessment cannot be completed before opening
    takeaway: The final engineering act is deciding what the evidence is sufficient to authorize — and what it is not.
    format: CHOICE
    question: Which certificate do you sign?
    choices:
    - Open six rides under their written limits and conditions; keep the Ferris wheel shut pending the fracture assessment.
    - Open all seven because every ride now has at least one calculation behind it.
    - Keep all seven shut because one unresolved wheel question means the park as a whole is uncertifiable.
    - Open the Ferris wheel but reduce its passenger load until the crack assessment is finished.
    answer: Open six rides under their written limits and conditions; keep the Ferris wheel shut pending the fracture assessment.
    why: 'The certificate should be as broad as the evidence, and no broader. Six rides now have calculations tied to measurements,
      operating limits and, where needed, verification tests. The wheel does not: its joint load is estimated and the crack-like
      indication is measured, but nobody has established the damaged joint''s allowable capacity. A lighter passenger load
      is not a substitute for that assessment because the load path, crack behavior and required margin remain unresolved.
      Signing six and withholding one is the decision the fortnight''s work supports.'
    rebuttals:
    - A calculation somewhere in a file is not the same as evidence that closes the ride-specific safety question.
    - Uncertainty should be isolated to the ride it affects when the other six have independent, defensible evidence.
    - Reducing load invents an allowable value that the missing fracture assessment is supposed to determine.

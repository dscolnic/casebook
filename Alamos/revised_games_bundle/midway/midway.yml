      the final unload adds roughly eight minutes, so the 18 m/s update with two hours remaining is already too late. The
      preceding 12 m/s update leaves four hours. This is a forecast-and-lead-time rule for this scenario, not a claim that
      12 m/s is a universal Ferris-wheel wind limit.
  - group: SHIP
    task: Decide what to do about the drive timing
    title: Three tenths of a second
    reason: Idowu and the structural engineer disagree about what to do with a drive that is three tenths of a second out
      of step with the ship's real swing, and the reopening poster means the disagreement can't wait.
    place: The Pirate Ship
    scene: The drive pushes every 5.85 seconds while the 48° operating swing measures about 6.15. Sam Idowu, the structural

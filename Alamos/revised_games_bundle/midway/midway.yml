    task: Decide whether the simple-pendulum model is valid for the ride
    title: Can the ship measure gravity?
    reason: The safety engineer wants to turn the ship's 5.90-second maintenance period into a local value of g, but doing
      that is only legitimate if the ride behaves like the model used in the equation.
    place: The Drop Tower
    scene: The pirate ship takes 5.90 seconds per low-angle cycle. The distance from pivot to the boat's centre of mass is

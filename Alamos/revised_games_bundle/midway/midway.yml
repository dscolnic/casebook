    - Why the assumption is the answer's fine print. Equal sharing needs the bolts equally tight, equally fitted and the joint
      stiff enough not to favour some over others. A slack or worn bolt sheds its share onto its neighbours, so the number
      you compute is a lower bound on what the worst bolt is really carrying.

    background:
    - Why two equations. A seat on a chain travels a horizontal circle at constant speed, so the net force on it points at
      the axis and has no vertical part. Splitting the tension into its horizontal and vertical components gives one equation
      for each direction, and dividing one by the other eliminates the tension nobody measured.
    - What falls out, and why it matters at the gate. The mass cancels. A heavy rider and a light rider hang at the same angle.
      That is why the operator does not sort the queue by weight. It is also why the old chalk mark is a mark about speed
      rather than about who was sitting there.
    - What the angle does depend on. The rotation rate and the geometry — chain length and hub radius, which together set
      the radius of the circle the seat travels in. So a carousel running slightly fast shows it in the angle, and the chalk
      mark is a record of what fast used to look like.
    assumes:
    - a body moving in a circle needs a net force toward the centre
    - the tension in a chain acts along the chain
    takeaway: Resolving one force into components can remove unknowns and reveal which variables actually control the motion.
    format: DERIVE
    question: Work the two force equations down to a relation for the angle, and say what the angle depends on.
    answerText: The force balance gives tanθ = v²/(rg). Solving with the changing seat radius gives about 31° from vertical
      at ten revolutions a minute.
    why: The chain tension has two jobs. Its vertical component balances the rider's weight, while its horizontal component
      supplies the inward force for circular motion. Dividing those force equations removes both the unknown tension and the
      rider's mass. What remains links the angle to speed and the radius of the seat's circular path. Because the seat swings
      outward, that radius grows with the angle and must be solved with it. At ten rpm, the result is about 31 degrees.
    derive:
      hint: Resolve the tension into two directions, write one equation each way, and divide one by the other.
      start: T sinθ = mv²/r  and  T cosθ = mg
      startNote: θ is measured from the vertical; r is the radius of the circle the seat travels in
      goal: a relation for θ, and the quantities it turns out to depend on
      steps:
      - ask: Divide the horizontal equation by the vertical one.
        answer: 2
        candidates:
        - text: tanθ = v²/(rg) × m
          rule: division
          why: Both sides carried an m and the division removes it. Leaving one in makes the angle depend on the load, which
            would mean a full seat and an empty one hanging differently on the same ride, and they do not.
        - text: sinθ/cosθ = mv²/r ÷ mg, so cotθ = v²/(rg)
          rule: division
          why: Sine over cosine is the tangent. Naming it the cotangent inverts the relation and gives an angle of about 60
            degrees where the chains hang at 30.
        - text: tanθ = v²/(rg)
          rule: division
        - text: T tanθ = v²/(rg)
          rule: division
          survives: true
          why: The tension divides out along with the mass; keeping it leaves an unknown on the left. The line is algebraically
            consistent and every step below it produces an angle in terms of a force nobody has measured.
      - ask: Say what this angle can depend on, given the relation.
        answer: 1
        candidates:
        - text: The speed, the radius and the mass of the loaded seat.
          rule: substitution
          why: Mass appeared on both sides of the original pair and has gone. This is the same result as a pendulum's period
            ignoring its bob, and for the same reason.
        - text: The speed of the seat and the radius of the circle it travels in.
          rule: substitution
        - text: The length of the chain and nothing else, since that is what is hanging.
          rule: resolution
          survives: true
          why: The chain's length is genuinely in the problem — it sets the radius once the angle is known — but it is not
            what fixes the angle, and treating it as the only input gives a ride whose chains hang at one angle at every speed.
        - text: The tension in the chain, which is what holds the seat out.
          rule: resolution
          why: 'The tension is what does the holding and it is not a free quantity: it adjusts itself to whatever the load
            and the angle require, which is why it divides out.'
      - ask: Evaluate the angle at ten turns a minute.
        answer: 0
        candidates:
        - text: About 31° from the vertical, with the seats out at a radius of 5.3 m
          rule: evaluation
        - text: About 31° from the horizontal, with the seats well above the hub
          rule: evaluation
          why: The angle in these equations is measured from the vertical, since that is the direction the weight acts in.
            Reading it from the horizontal puts the chains at 59 degrees and the seats far outside anything this ride does.
        - text: About 21°, taking the radius as the 3.0 m hub
          rule: substitution
          survives: true
          why: Consistent arithmetic on the wrong radius. The seat travels in a circle wider than the hub by however far the
            chain has swung out, so the radius and the angle have to be solved together — and the answer is ten degrees shy.
        - text: About 45°, since the speed and the radius are nearly equal in size
          rule: evaluation
          why: Comparing a speed with a length compares two different quantities. The tangent here is v² over rg, which is
            a pure number, and it is not close to one.

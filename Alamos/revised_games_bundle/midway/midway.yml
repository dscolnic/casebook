    place: The Carousel and Swings
    scene: The carousel drive has drawn uneven current since winter. Bisi Adeyemi has five readings from the control panel
      and the ring survey beside them. Two look alarming. Three are stubbornly ordinary.
    guide: Five readings, and the three ordinary ones do the work. The temperature has not moved. The speed is exactly where

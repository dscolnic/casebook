  # ---------------------------------------------------------------- day 5
  - title: 'How much energy is in one trip?'
    objective: 'Calculate the work of lifting both cage and rope, and show why stretched steel can store energy and give it back.'
    stake: >-
      Friday. A brake does not merely fight a force; it has to remove the energy of everything that is
      moving. The current plan counts the cage but leaves out the rope, even though the amount of rope
      hanging changes every metre of the trip. Today you total the real energy and ask what that long
      steel rope can give back after a stop.
    takeaway: Work done against a force that changes with position is an integral, and the changing part can be the larger part.
    segue: >-
      The cage-only calculation missed more than half the lifting energy, and the rope is no longer just
      a line on a diagram—it can store energy like a spring. Next week you look at another way safety
      calculations go wrong: a moving load can hit a structure harder than its standing weight suggests.
    stops:
      - group: CAGE
        task: 'Calculate the work of lifting the cage and the changing length of hanging rope'
        title: 'How much energy is in one full lift?'
        at: body-bench
        reason: >-
          The safety file counts the cage's energy but not the rope's. Rahimi wants the energy of an
          entire trip from the bottom to the top before anybody uses that file to size a stop.
        concept: Work as a force through a displacement, and as an integral
        place: Shaft and Brake House
        scene: >-
          A loaded four-tonne cage rises 1,240 metres. At the start, almost the whole
          8.9-kilogram-per-metre rope hangs below the drum; by the end, almost none does. The lifting
          force therefore falls continuously as the cage rises.
        guide: >-
          You build the working a line at a time. The force needed depends on how much rope is still
          hanging. So it is a function of position rather than a number. Work against it is an
          accumulation over the 1,240 metres. Write the hanging length in terms of how far the cage
          has come, then integrate. The wind is taken as steady, so no acceleration term appears.
        background:
          - >-
            Why the rope's share is a half rather than a whole. At the bottom of the wind the whole
            rope is hanging and at the top almost none of it is, and the hanging length falls
            linearly in between. Integrating a linear force gives the mean value times the distance,
            which is why the rope contributes as though half of it were being lifted the whole way.
          - >-
            Why the answer is the same by either route. Work against gravity is path-independent. So
            the same total comes out of asking how much each element of rope was raised. The element
            at the top of the shaft hardly moves. The one at the bottom is raised the whole depth.
            That is a different integral with the same answer, which is what makes gravity
            conservative.
          - >-
            What the number is for. 116 megajoules is what the motor puts in going up and what the
            brake has to take out coming down. At the shaft's four winds an hour, divided by the
            cycle time, it is also the plant's electricity bill. That is the other reason Marchetti
            wants the cycle shorter.
        assumes:
          - work against a changing force is the accumulation of force over distance
        takeaway: With a force that falls linearly, the work is the same as if the mean force had acted the whole way.
        format: DERIVE
        question: 'How much work does one trip from the bottom to the top do against gravity?'
        answerText: >-
          About 116 MJ. The integral gives g[m_c·H + μH²/2] = 9.81 × (4.96 + 6.84) × 10⁶.
        why: >-
          The work is about 116 megajoules, of which the cage accounts for 49 and the rope for 67.
          The force is not constant. At the bottom of the wind the drum lifts the cage and 1,240
          metres of rope. At the top it lifts the cage and nothing. Writing the hanging length as
          the depth less the distance travelled turns the force into a linear function of position.
          Integrating it gives the cage's term plus half the rope's. The rope's own weight
          therefore does more of the work than the load does.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: W = ∫₀^H F(y)·dy
          startNote: H = 1,240 m, cage 4,000 kg, rope 8.9 kg a metre; the wind is taken as steady, so no acceleration term
          goal: the work done against gravity for one wind, in megajoules
          askRule: true
          rules:
            - work as an integral of force
            - the force as a function of position
            - integration with respect to position
            - substitution of the stated values
            - rearrangement
          steps:
            - ask: Write the force as a function of how far the cage has risen.
              answer: 2
              candidates:
                - text: F(y) = (m_c + μ·y)·g
                  rule: the force as a function of position
                  survives: true
                  why: >-
                    The hanging length has been written as the distance risen rather than the distance
                    remaining. It is the same integral with the ends swapped, so the total comes out
                    identical and the force at every individual point is wrong.
                - text: F(y) = (m_c + μ·H)·g
                  rule: the force as a function of position
                  why: >-
                    The whole rope hanging for the whole wind. It is the force at the first instant,
                    held constant, and it overstates the work by fifty-eight per cent.
                - text: F(y) = (m_c + μ·(H − y))·g
                  rule: the force as a function of position
                - text: F(y) = m_c·g
                  rule: the force as a function of position
                  why: >-
                    The rope has gone. This is the line the submission carries, and it accounts for
                    forty-two per cent of the work.
            - ask: Set up and split the integral.
              answer: 0
              candidates:
                - text: W = g·∫₀^H m_c dy + g·μ·∫₀^H (H − y) dy
                  rule: work as an integral of force
                - text: W = g·∫₀^H m_c dy × g·μ·∫₀^H (H − y) dy
                  rule: rearrangement
                  why: >-
                    A sum inside the integral gives a sum of integrals, not a product. The units of
                    the product are joules squared.
                - text: W = g·(m_c + μ)·∫₀^H (H − y) dy
                  rule: rearrangement
                  survives: true
                  why: >-
                    A mass and a mass per metre added inside one bracket, then given the rope's own
                    integral. Both terms end up halved and the arithmetic is otherwise faultless.
                - text: W = g·∫₀^H (m_c + μ·(H − y)) dH
                  rule: work as an integral of force
                  why: >-
                    The variable of integration is the position of the cage, not the depth of the
                    shaft. The depth is a fixed number here.
            - ask: Do both integrals.
              answer: 3
              candidates:
                - text: W = g·m_c·H + g·μ·H²
                  rule: integration with respect to position
                  survives: true
                  why: >-
                    The second integral has not picked up its half. It doubles the rope's contribution
                    and puts the total at 183 megajoules, which is the wrong side of the brake's rated
                    capacity and would stop the proposal.
                - text: W = g·m_c·H² /2 + g·μ·H²/2
                  rule: integration with respect to position
                  why: >-
                    The first term's force is constant, so integrating it gives force times distance
                    and no square. As written it has units of joule metres.
                - text: W = g·m_c·H + g·μ·H/2
                  rule: integration with respect to position
                  why: >-
                    The rope term has lost a power of the depth. Its units are then a mass times a
                    speed squared over a metre, which is not an energy.
                - text: W = g·m_c·H + g·μ·H²/2
                  rule: integration with respect to position
            - ask: Put the numbers in.
              answer: 1
              candidates:
                - text: W = 9.81 × (4,960,000 + 768,800) = 56.2 MJ
                  rule: substitution of the stated values
                  survives: true
                  why: >-
                    The rope's term has been left without its mass per metre, so 8.9 kilograms a metre
                    has quietly become one. It is half the truth and it is the same order of magnitude,
                    which is all anybody checks.
                - text: W = 9.81 × (4,960,000 + 6,842,320) = 116 MJ
                  rule: substitution of the stated values

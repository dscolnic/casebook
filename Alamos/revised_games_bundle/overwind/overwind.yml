                - text: F = 88.9 × 2.5 = 222 N
                  rule: substitution of the stated values
          commit: Commit the derivation
      - group: CAGE
        task: 'Relate the force on a stopped mass to the force on the arrestor'
        title: 'What force would the emergency arrestor feel?'
        at: arrestor
        reason: >-
          Above the top landing is a crushable emergency arrestor for an overwind. Rahimi wants its test
          read correctly: whatever force stops a moving mass also appears on the structure doing the
          stopping.
        concept: Newton's third law, and which force acts on which body
        place: Shaft and Brake House
        scene: >-
          A maker's test mass has crushed an arrestor to about half its height. One force acted on the
          falling mass; its partner acted on the arrestor. You identify the pair before anyone combines
          them in the same free-body diagram.
        guide: >-
          Four accounts of what happened between the falling mass and the arrestor on the rig. Ask of
          each which body each force acts on. A force and its partner never appear in the same
          free-body diagram. The distinction that decides this card is between two forces on one
          body and one force seen from both ends.
        assumes:
          - forces come in pairs acting on different bodies
        takeaway: An interaction is one thing seen twice, and its two halves belong to two different diagrams.
        format: CHOICE
        question: 'When an arrestor stops a falling mass, how does the force on the arrestor compare with the force on the mass?'
        why: >-
          They are one interaction seen from both ends. Equal in size, opposite in direction, and
          acting on different bodies. That is why they do not cancel. A cancellation would need both
          forces on the same body. The mass's diagram has the arrestor pushing up on it and gravity
          pulling down. The arrestor's diagram has the mass pushing down on it and the rig holding
          it up. Each diagram is solved on its own, and the pair ties the two solutions together.
        choices:
          - Equal and opposite, and on different bodies, so neither cancels the other
          - Equal and opposite on the same body, so they cancel
          - The falling mass's is larger, since it was the body that was moving
          - The arrestor's is larger, since it stopped the mass
        answer: Equal and opposite, and on different bodies, so neither cancels the other
        rebuttals:
          - Two forces on one body would leave nothing to stop the mass, which plainly stopped.
          - Being the moving body changes the momentum in play and not the size of a contact force.
          - Stopping something is what the pair does between them; it is not evidence of a larger member.
      - group: GRAV
        task: 'Decide which gravity records can be trusted as measurements'
        title: 'Can we trust one gravity reading?'
        at: level-book
        reason: >-
          Every force calculation in the safety case uses g. Before Sokol compares the top and bottom of
          the shaft, Adebayo has to show that the gravimeter's own drift and the station height are not
          being mistaken for physics.
        concept: A measurement carries the conditions it was made under
        place: Gravity Station
        person: true
        scene: >-
          Adebayo opens the gravity field book. Each station has a reading, a time, and an elevation,
          and the reference station is measured again at the end of the day. Those extra entries are
          what turn a sensitive spring reading into a usable measurement.
        guide: >-
          Adebayo reads the same station twice a day for a reason that has nothing to do with
          carefulness for its own sake. A gravimeter is a spring, and a spring left alone still
          creeps. It is the way a bathroom scale drifts if somebody stands on it for an hour.
          Each entry in his field book answers one question. Ask of each whether it says
          something about the ground under your feet, or something about the instrument slowly
          settling in its own case. The one that is about the instrument is exactly why the same
          station gets read twice.
        assumes:
          - an instrument's own behaviour can change over the hours a survey takes
        takeaway: A reading becomes a measurement only once the instrument's own drift and the station's own height are accounted for.
        format: CASEBOOK
        task: 'Match each field-book entry to the correction or measurement it provides.'
        scenarios:
          - The same reference station, read at the start and again at the end of the day.
          - The elevation of each station, to a centimetre.
          - The time each reading was taken.
          - The reading itself, in milligals.
        choices:
          - It measures how far the instrument's own spring has crept during the day.
          - It removes the part of the difference that is only about being higher up.
          - It is what lets the creep be shared out between the readings in between.
          - It is the quantity everything else is a correction to.
        mapping: [0, 1, 2, 3]
        why: >-
          A gravimeter is a weighted spring, and a spring creeps. So the same station read twice, hours
          apart, gives the drift over that interval, and the times of the readings in between are what
          let it be apportioned. Elevation matters because gravity falls with height at about 0.3
          milligals a metre, which is far larger than the rock signal being looked for. What is left
          after both corrections is the measurement, and it means nothing at all without them.
  # ---------------------------------------------------------------- day 7
  - title: 'Does gravity change at the bottom of the mine?'
    objective: 'Predict and measure gravity underground, explain the difference, and use the rope record to expose another old-file error.'
    stake: >-
      Tuesday. Every weight, tension, and energy number in your report uses gravity, yet Kerrow has
      never checked what g is 1,240 metres underground. Sokol's readings at the top and bottom do not
      match the simplest prediction. Today you explain the difference instead of blaming the
      instrument—and a rope-shop record reveals another number the old file got wrong.
    takeaway: Gravity inside a body depends only on the mass below you, which is why a shaft measures what a surface cannot.
    segue: >-
      The gravity readings make sense once the rock around the shaft is included, so the force
      calculations stand. The more important surprise is in the rope book: repeated re-capping has
      shortened the rope by forty metres. A shorter rope is a stiffer rope. After tomorrow's motor-power
      check, that stiffness becomes the central question.
    stops:
      - group: GRAV
        task: 'Predict how gravity should change 1,240 metres below the surface'
        title: 'What should gravity do at the bottom of the mine?'
        at: gravimeter
        reason: >-
          Sokol has a surface reading and a bottom reading that differ from the simplest expectation.
          Before calling that difference geology—or error—you need the physics prediction for a uniform
          spherical Earth.
        concept: The field inside a uniform sphere, and the shell theorem
        place: Gravity Station
        takesAsRead:
          - Newton's law of gravitation
        scene: >-
          At the gravity hut, Sokol puts two corrected readings on the bench, one at the surface and one
          1,240 metres down. The shell theorem tells you which parts of Earth still pull on a point
          inside it. First you predict the change with depth.
        guide: >-
          You build the working a line at a time. The shell theorem says a spherical shell of matter
          pulls nothing that is inside it, so at a radius part-way down only the sphere below counts.
          Write that sphere's mass in terms of the density, put it into the inverse-square law, and
          see what the r's do.
        background:
          - >-
            Why the shells above contribute nothing. Every part of a shell pulls you towards it. For
            a point inside the shell those pulls cancel exactly. The nearer piece of shell is
            smaller and the further piece larger, in exactly compensating proportion. It is a result
            about geometry rather than about gravity, and it is what makes the inside of a planet
            tractable at all.
          - >-
            Why the inverse square becomes a straight line. Only the mass below counts, and that mass
            falls as the cube of the radius while the inverse-square law divides by the square. A cube
            over a square is a first power. So gravity inside a uniform sphere is proportional to how
            far out you are. It reaches zero at the centre.
          - >-
            What the disagreement is worth. The prediction for a uniform earth is a fall of 191
            milligals over this shaft; the measurement is a rise of 105. The earth is not uniform.
            Most of its mass is far in. Locally, what the difference constrains is the density of
            the rock between the two stations. That is the number the exploration people have been
            assuming rather than measuring.
        assumes:
          - a spherical shell of matter exerts no net pull on anything inside it
        takeaway: Inside a uniform sphere gravity grows in proportion to the distance from the centre, because only the mass below you counts.
        format: DERIVE
        question: 'For a uniform spherical Earth, how should gravity change over the 1,240-metre shaft?'
        answerText: >-
          Fall by about 191 milligals: g(r) = g₀·r/R, so the change is g₀ × 1,240 ÷ 6,371,000. The
          measurement is a rise of 105, so the earth is not uniform.
        why: >-
          A uniform earth would give a fall of about 191 milligals. The shell theorem removes
          everything above the measurement point. So what pulls is a sphere whose mass goes as the
          cube of the radius. Dividing that by the square of the radius leaves a straight line
          through the centre. The measurement is a rise of 105 milligals instead. That is not an
          error. The real earth has most of its mass concentrated far inside. The local rock is
          less dense than the average. The disagreement is the measurement.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: g(r) = G·M(r)/r²
          startNote: R = 6,371 km, g₀ = 9.812 m/s² at the surface; the inset is 1,240 m below it
          goal: the predicted change in g over the depth of the shaft, in milligals
          askRule: true
          rules:
            - the shell theorem
            - the mass inside a radius
            - the inverse-square law
            - substitution of the stated values
            - rearrangement
          steps:
            - ask: Say which mass acts at a radius inside the sphere.
              answer: 3
              candidates:
                - text: the whole mass of the sphere, wherever you are inside it
                  rule: the shell theorem
                  survives: true
                  why: >-
                    It gives a gravity that grows as you go down, which is what the measurement does,
                    and it grows by 0.4 milligals rather than 105. Being right about the direction for
                    the wrong reason is the hardest kind of error to find.
                - text: the mass of the shells above the radius
                  rule: the shell theorem
                  why: >-
                    Exactly the part that contributes nothing. This would make gravity zero at the
                    surface and largest at the centre.
                - text: no mass at all, since the pulls cancel
                  rule: the shell theorem
                  why: >-
                    The cancellation is a property of a shell you are inside, not of a sphere you are
                    on top of. Everything below you still pulls.
                - text: the mass of the sphere below the radius
                  rule: the shell theorem
            - ask: Write that mass in terms of the density.
              answer: 0
              candidates:
                - text: M(r) = ρ·(4/3)πr³
                  rule: the mass inside a radius
                - text: M(r) = ρ·4πr²
                  rule: the mass inside a radius
                  why: >-
                    That is the surface area of the sphere times a density, which has units of
                    kilograms a metre. A mass needs a volume.
                - text: M(r) = ρ·(4/3)πR³·(r/R)²
                  rule: the mass inside a radius
                  survives: true
                  why: >-
                    A square where a cube belongs, written in a form that looks like a careful
                    scaling. It makes gravity constant everywhere inside the sphere, which is a tidy
                    and completely wrong result.
                - text: M(r) = ρ·πr³
                  rule: the mass inside a radius
                  why: >-
                    The four thirds is missing. It changes nothing about the shape of the answer and
                    everything about its size.
            - ask: Put it into the inverse-square law.
              answer: 2
              candidates:
                - text: g(r) = (4/3)πGρ·r², so gravity falls as the square of the radius
                  rule: the inverse-square law
                  why: >-
                    The r² from the denominator has not been cancelled properly: the cube over the
                    square leaves a first power, not another square.
                - text: g(r) = (4/3)πGρ/r, so gravity grows towards the centre
                  rule: rearrangement
                  survives: true
                  why: >-
                    The powers have been divided the wrong way round. It predicts infinite gravity at
                    the centre of the earth, and it does give a rise with depth — which is what the
                    measurement shows.
                - text: g(r) = (4/3)πGρ·r, so gravity is proportional to the radius
                  rule: the inverse-square law
                - text: g(r) = GρV/r², with V the whole volume
                  rule: the inverse-square law
                  why: >-
                    The whole volume again, which is the mass that was ruled out two lines ago.
            - ask: Evaluate the change over the depth of the shaft.
              answer: 1
              candidates:
                - text: Δg = g₀·(d/R)² = 3.7 × 10⁻⁸ m/s², which is nothing at all
                  rule: substitution of the stated values
                  why: >-
                    The ratio has been squared. It puts the change four thousand times below what a
                    gravimeter can see, and the instrument plainly sees something.
                - text: Δg = −g₀·d/R = −1.91 × 10⁻³ m/s², a fall of 191 milligals
                  rule: substitution of the stated values
                - text: Δg = −g₀·R/d = −50,400 m/s²
                  rule: rearrangement
                  survives: true
                  why: >-
                    The ratio inverted. It is absurd by five thousand orders of magnitude in the wrong
                    company and looks like a large number in the right one, which is how a value like
                    this reaches a report.
                - text: Δg = −g₀·d/R = −1.91 × 10⁻³ m/s², a fall of 1.91 milligals
                  rule: substitution of the stated values
                  why: >-
                    The arithmetic is right and the unit conversion is out by a hundred. A milligal is
                    10⁻⁵ metres a second squared, so this change is 191 of them.
          commit: Commit the derivation
      - group: GRAV
        task: 'Use the measured gravity gradient to infer the density of the rock around the shaft'
        title: 'Does the gravity difference make physical sense?'
        at: gravimeter
        reason: >-
          The measured gradient differs from the empty-sphere prediction. Sokol wants to know whether
          ordinary rock around the shaft explains that gap before anybody treats the gravimeter as
          unreliable.
        concept: What a measurement of g constrains, and what it leaves free
        place: Gravity Station
        person: true
        scene: >-
          The free-air prediction and the measured shaft gradient are now side by side. Their difference
          comes from rock that changes from being below you to surrounding and above you as you descend.
          The implied density is the consistency check.
        guide: >-
          Five quantities are offered and three of them make the answer. The free-air figure is what
          gravity does with height alone. The measured figure is what this shaft gives. The
          coefficient turns a density into a gradient. Two are not needed. The depth cancels out of
          a gradient, and the mean density of the whole earth belongs to the uniform sphere this
          shaft has just disagreed with.
        takesAsRead:
          - The field inside a uniform sphere, and the shell theorem
        assumes:
          - rock that was above the instrument stops being above it as the instrument goes down
        takeaway: A gravity gradient down a shaft constrains the density of the rock passed through, and constrains nothing about what is deeper.
        format: BALLPARK
        question: 'What rock density does the measured gravity gradient imply?'
        estimate:
          prompt: >-
            Sokol's two hours in the shaft come to this: the measured gradient against the free-air
            one, and what the difference says about the rock.
          question: What density does the measured gradient give for the rock above the inset?
          relationship: >-
            Density = the free-air gradient less the measured gradient, divided by twice the plate
            coefficient.
          labels:
            - 0.3086 mGal/m  (free-air gradient, height alone)
            - 0.0849 mGal/m  (measured gradient down this shaft)
            - 0.0838 mGal/m  (twice the coefficient for a rock plate)
            - 1240 m  (depth of the shaft)
            - 5.51 g/cm³  (mean density of the whole earth)
          values: [0.3086, 0.0849, 0.0838, 1240, 5.51]
          slots: 3
          template: '({0} − {1}) ÷ {2}'
          formula: (a-b)/c
          correct: [0, 1, 2]
          target: 2.67
          tolerance: 0.06
          units: g/cm³
          solution: (0.3086 − 0.0849) ÷ 0.0838 = 2.67 g/cm³.
          explanation: >-
            A gradient is per metre, so the depth of the shaft cancels out of it. The earth's mean
            density is on the list because it is what a uniform-sphere model would have used, and it
            is twice what this rock actually is.
        why: >-
          The rock comes out at about 2.67 grams a cubic centimetre, which is granite. Going down a
          shaft does two things at once. It takes you closer to the centre, which is the free-air
          term. And it puts rock above you that was below you. That removes that rock's upward pull
          twice over. The measured gradient is the difference between them, so the density is what is
          left when one is taken from the other. It says nothing whatever about what lies below the
          inset — that is left entirely free.
      - group: ROPE
        task: 'Work out what repeated rope shortening changes besides its length'
        title: 'What else changed when the rope was shortened?'
        at: rope-bench
        reason: >-
          Nowak's maintenance record shows four re-caps have removed forty metres of rope. If stiffness
          depends on length, the rope in today's safety case is not the rope described in the old file.
        concept: The period of an oscillation, and what it does not depend on
        place: Rope Shop
        scene: >-
          The rope has been shortened four times, ten metres at each re-cap, while its material and
          cross-section stayed the same. Nowak asks which mechanical property moved when the length did.
        guide: >-
          Four claims about what shortening a rope changes. Ask of each whether it follows from the rope having less length, or from it having less material.
          Those are different things here. The steel is unchanged and only its length has gone. One of the four is a property
          that depends on the length and is nowhere in the winder's paperwork.
        assumes:
          - a shorter piece of the same material stretches less under the same pull
        takeaway: A property that depends on a length changes whenever the length does, whether or not anybody writes it down.
        format: CHOICE
        question: 'What has forty metres of shortening changed that nobody updated in the safety file?'
        why: >-
          It has made the rope stiffer, and therefore made the cage bounce on it faster. Stiffness for the
          same steel goes inversely with length. A rope forty metres shorter out of twelve hundred
          and eighty is about three per cent stiffer. So the period of the cage on it is about one
          and a half per cent shorter. That is small, and it matters. The whole question on day nine
          is whether that period lands on a ramp time. A period nobody has recomputed since the file
          was written is a period nobody knows.
        choices:
          - Its stiffness, and so how fast the cage bounces on it
          - Its breaking load, since less steel is carrying the cage
          - The tension at the drum, since less rope is hanging
          - Its mass per metre, since the ends have been re-capped
        answer: Its stiffness, and so how fast the cage bounces on it
        rebuttals:
          - Breaking load is a property of the cross-section, and the cross-section has not changed.
          - The hanging length is set by where the cage is, and forty metres of it is three per cent.
          - Mass per metre is a property of the construction, and cutting a rope does not alter it.
  # ---------------------------------------------------------------- day 8
  - title: 'When is the motor working hardest?'
    objective: 'Find the peak power anywhere in the trip and separate the force a brake applies from the energy its pads must absorb.'
    stake: >-
      Wednesday. The motor's biggest torque and its highest speed happen at different times, so nobody
      can point to the instant that really uses the most power. The inspector will not accept 'inside
      the rating' without that instant. Today you find it, then turn the same motion toward the brake.
    takeaway: Power is a product, so its peak is at neither of the places where its two factors peak.
    segue: >-
      The worst power demand is about eighty-six per cent of rating, so the faster ride does not
      overload the motor. The unresolved risk is now the rope itself. Tomorrow you calculate its
      stiffness and its natural bounce period—the number missing from the March inquiry.
    stops:
      - group: BANK
        task: 'Find the motor power at the instant where high speed and high rope load overlap'
        title: 'Where does the motor need the most power?'
        at: profile-desk
        reason: >-
          Torque alone did not settle the motor limit because power also depends on speed. Ubah wants
          the instant where the cage is already fast but most of the heavy rope is still hanging.
        concept: Power as the rate of doing work
        place: The Bank
        scene: >-
          Just after the acceleration ramp, the cage is moving at 7.2 metres a second while 1,182 metres
          of rope still hang below the drum. The motor is turning quickly and still carrying almost the
          maximum load.
        guide: >-
          You build the working a line at a time. Power is the rate at which work is being done. For a force
          along the motion, that is the force times the speed at that instant. So establish two
          things. What is the tension where the cage happens to be, and how fast is it going there?
          The wind is steady at this instant, so there is no acceleration term.
        background:
          - >-
            Why just after the ramp. The tension falls all the way up, as rope comes off the hanging side. The speed rises to its maximum
            during the ramp and then holds. So the product is largest at the moment the speed has
            just arrived and the rope has hardly begun to shorten. That is neither of the instants
            anybody quotes.
          - >-
            Why the acceleration term is absent here. During the ramp the tension is higher, by the hanging mass times 1.2 metres a second squared. But
            the speed is lower. The two do not peak together. At the end of the ramp the
            acceleration has tapered to nothing by design. That is what makes this instant the worst
            one, and the arithmetic the simplest.
          - >-
            What the answer settles. The motor is rated at 1.2 megawatts continuous, so 1.03 is inside it. The faster cycle raises the
            peak speed rather than the torque. That is where Marchetti's proposal actually presses.
            Power scales with the speed. So the twelve seconds she wants cost about nine per cent
            more peak power, and no more torque at all.
        assumes:
          - power is the rate at which a force does work
        takeaway: The peak power of a wind is at the top of the ramp. The speed has arrived there, and the rope has not yet shortened.
        format: DERIVE
        question: 'What power is the motor supplying at the end of the acceleration ramp?'
        answerText: >-
          About 1.03 MW. The hanging mass is 4,000 + 8.9 × 1,182 = 14,520 kg, so the tension is
          142.5 kN and the power is that times 7.2 m/s.
        why: >-
          The motor is supplying about 1.03 megawatts. Power is the rate of doing work. For a force acting
          along the motion, it is the force times the speed at that instant. It is not anything
          averaged. The tension has to be evaluated where the cage actually is: 1,182 metres of rope
          still hanging, not the full 1,240. The speed is the one the ramp has just delivered. The
          peak is here rather than at the bottom, because the two factors do not peak together.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: P = F·v
          startNote: cage 4,000 kg, rope 8.9 kg a metre, 1,182 m hanging, speed 7.2 m/s, no acceleration at this instant
          goal: the power supplied at that instant, in megawatts
          askRule: true
          rules:
            - power as force times speed
            - the tension at that position
            - substitution of the stated values
            - comparison of magnitudes
            - rearrangement
          steps:
            - ask: Write the tension at that position.
              answer: 0
              candidates:
                - text: T = (4,000 + 8.9 × 1,182) × 9.81 = 142.5 kN
                  rule: the tension at that position
                - text: T = (4,000 + 8.9 × 1,240) × 9.81 = 147.5 kN
                  rule: the tension at that position
                  survives: true
                  why: >-
                    The rope taken at its full hanging length rather than where the cage is. Three per
                    cent high, and it is the number already written down from day three, which is what
                    makes it the natural thing to reach for.
                - text: T = (4,000 + 8.9 × 1,182) × (9.81 + 1.2) = 159.9 kN
                  rule: the tension at that position
                  why: >-
                    The ramp's acceleration applied at an instant where the ramp has tapered to
                    nothing. It is the tension a moment earlier, when the speed was lower.
                - text: T = 4,000 × 9.81 = 39.2 kN
                  rule: the tension at that position
                  why: >-
                    The cage without the rope, which is the submission's own error and is a quarter of
                    the answer.
            - ask: Combine it with the speed.
              answer: 2
              candidates:
                - text: P = T ÷ v = 19.8 kN·s/m
                  rule: rearrangement
                  why: >-
                    Divided rather than multiplied. The units are not watts and nothing about the
                    result is a rate of doing work.
                - text: P = ½T·v² = 3.7 MW
                  rule: rearrangement
                  survives: true
                  why: >-
                    A half and a square borrowed from kinetic energy. It has the units of a power times
                    a speed and it produces a number a large winder could plausibly draw.
                - text: P = T·v = 142.5 kN × 7.2 m/s
                  rule: power as force times speed
                - text: P = T·v·t, over the 172 s of the run
                  rule: power as force times speed
                  why: >-
                    Multiplying by the time turns a power back into an energy. This is the work done

            - ask: Put the numbers in.
              answer: 1
              candidates:
                - text: P = 142,500 × 7.2 = 1.03 kW
                  rule: substitution of the stated values
                  why: >-
                    The arithmetic is right and the prefix is out by a thousand. A kilowatt would not
                    lift the cage against friction, let alone up the shaft.
                - text: P = 142,500 × 7.2 = 1.03 MW
                  rule: substitution of the stated values
                - text: P = 142.5 × 7.2 = 1,026 W
                  rule: substitution of the stated values
                  survives: true
                  why: >-
                    The tension left in kilonewtons and the answer labelled in watts. The digits are
                    the same as the true answer's, which is exactly why nobody re-reads the unit.
                - text: P = 142,500 × 7.2 × 60 = 61.6 MW
                  rule: rearrangement
                  why: >-
                    A conversion to the minute applied to a quantity that is already per second.
            - ask: Put that beside the motor's continuous rating of 1.2 MW.
              answer: 3
              candidates:
                - text: 1.03 MW is 86 per cent of the rating, so the drum's inertia is what limits the cycle
                  rule: comparison of magnitudes
                  why: >-
                    Inertia does not appear in this calculation at all. What is close to the rating is
                    the product of tension and speed.
                - text: 1.03 MW exceeds the rating, so the faster cycle is impossible
                  rule: comparison of magnitudes
                  survives: true
                  why: >-
                    It is the conclusion that follows from the 3.7 MW line, and it stops the proposal at
                    a point where nothing is actually wrong.
                - text: 1.03 MW is 86 per cent of the rating, and raising the torque is what would exceed it
                  rule: comparison of magnitudes
                  why: >-
                    Torque and power are different limits. The faster cycle raises the speed, which is
                    the factor in this product that the proposal actually changes.
                - text: 1.03 MW is 86 per cent of the rating, and it is the speed that the faster cycle raises
                  rule: comparison of magnitudes
          commit: Commit the derivation
      - group: WIND
        task: 'Rank the important moments of a trip by motor demand'
        title: 'Which moment is hardest on the motor?'
        at: winder-desk
        reason: >-
          The electrical engineer will not sign the faster profile from one convenient snapshot.
          Marchetti has to show how the motor demand changes across the whole upward trip.
        concept: Units and dimensional bookkeeping through a derivative or an integral
        place: Winder House
        scene: >-
          Four moments from one upward trip are on the board: early acceleration, the end of the ramp,
          full-speed travel higher in the shaft, and retardation. You put them in order by the power
          each demands.
        guide: >-
          Four instants, and the rail is not a clock. All four happen in one wind. You are ranking them, not
          sequencing them. What decides the order is the product of a force and a speed at each
          instant. So an instant with a large force and no speed can rank below one with a modest
          force and full speed.
        assumes:
          - a power is a force times a speed and has the units of both
        takeaway: Ranking instants by power means multiplying at each one, because neither factor alone decides the order.
        format: SEQUENCE
        task: 'Order the four moments from lowest to highest motor power.'
        axis: >-
          Order the four by the power the motor is supplying, largest first. This is not a clock —
          every one of them happens during the same wind, and the question is which asks most of the
          machine.
        ends: [Most power, Least power]
        cards:
          - Just past the end of the ramp, full speed and 1,182 m of rope hanging.
          - Half way up, full speed and 620 m of rope hanging.
          - The first instant off the inset, full tension and almost no speed.
          - At the bank, crawling in with almost no rope hanging.
        order: [0, 1, 2, 3]
        why: >-
          Power is a product, so the order is not the order of either factor. Just past the ramp both
          are large: 142 kilonewtons at 7.2 metres a second, about 1.03 megawatts. Half way up the
          speed is the same and the tension has fallen to 93, giving 0.67. The first instant off the inset has the largest tension and a speed near zero. Its power is near
          zero too. That is why a winder can start a load it could not accelerate. The crawl at
          the bank is small in both.
      - group: CAGE
        task: 'Decide whether brake-pad damage is set by force or by energy'
        title: 'Why did March destroy the pads?'
        at: body-bench
        reason: >-
          The pads were replaced after March even though the brake force was not unusual. Craig wants
          the quantity that actually predicts pad heating and wear before the new profile is approved.
        concept: Kinetic energy and the work–energy theorem
        place: Shaft and Brake House
        person: true
        scene: >-
          Craig compares years of ordinary stops with the March emergency stop. The clamp force was not
          exceptional, but the pads had to absorb a very different amount of motion before everything
          came to rest.
        guide: >-
          All four options are ways of saying what a brake does. Ask of each whether it is a force, an
          energy or a rate. Those are three different quantities. The pads only wear out
          from one of them. The distinction that decides it is what has to be taken out of the cage
          rather than what has to be applied to it.
        assumes:
          - work done against a body's motion is a change in its kinetic energy
        takeaway: A brake is sized by the energy it has to absorb, and by the force only in so far as that decides the distance.
        format: CHOICE
        question: 'What decides how much punishment an emergency stop gives the brake pads?'
        why: >-
          It is the energy: whatever the cage has as motion and as height has to be turned into heat
          in the pads. The work–energy theorem says the net work on the cage is its change in kinetic
          energy. So the same energy can be taken out with a large force over a short distance, or a
          small one over a long one. The pads feel the total either way. That is why the March
          stop destroyed a set of pads while applying the same force as every other stop. It went on
          for longer. There was more to absorb.
        choices:
          - The energy the cage has to have taken out of it
          - The force the pads are pressed on with
          - The retardation the cage reaches
          - The speed the cage was going at when the brake was applied
        answer: The energy the cage has to have taken out of it
        rebuttals:
          - The same force can take out any amount of energy, depending on how far the drum turns under it.
          - A retardation is what the force produces on that mass and says nothing about the total.
          - Speed decides part of the energy, and the height still to be lost is the rest of it.
  # ---------------------------------------------------------------- day 9
  - title: 'Can the rope keep the cage moving?'
    objective: 'Treat the 1,240-metre steel rope as a spring and find its stiffness, natural period, and stored energy.'
    stake: >-
      Thursday. In March the drum stopped but the cage did not. Otieno's explanation is that 1,240
      metres of stretched steel rope was moving like a spring, but nobody has ever put a number on that
      idea. Today you do. If the rope's natural motion matches the stop, the old brake explanation
      starts to fall apart.
    takeaway: A hoisting rope is a spring with a period, and neither appears anywhere in the plant's paperwork.
    segue: >-
      The cage and rope have a natural period of about 1.2 seconds—almost the same timescale as the hard
      stop. Suddenly Anand's account is physically possible. Tonight the March cage-position tape and
      drum trace go side by side. Tomorrow you test whether the rope alone predicts the 1.6-metre
      overshoot.
    stops:
      - group: ROPE
        task: 'Calculate the rope stiffness and the cage''s natural bounce period'
        title: 'How fast does the cage bounce on the rope?'
        at: coil-rig
        reason: >-
          Otieno's spring explanation for March is only useful if it predicts a real timescale. Today
          the maker's modulus, the rope's area and true length, and the cage mass finally go into one
          calculation.
        concept: Simple harmonic motion out of a linear restoring force
        place: Rope Shop
        scene: >-
          With the cage at the bottom, 1,240 metres of locked-coil steel hang between drum and cage. You
          calculate how stiff that long rope is and how long a four-tonne cage would take to complete
          one natural oscillation on it.
        guide: >-
          You build the working a line at a time. Stiffness is how much pull it takes to stretch the rope by a metre. It comes from the material, the
          area and the length. Then the cage on the end of it is a mass on a spring. The period
          follows from the stiffness and the mass. Watch
          where the length goes: a longer rope is a softer spring.
        background:
          - >-
            Why length divides. Doubling the length of a rope gives twice as much material to stretch under the same pull. So it
            stretches twice as far, and the stiffness halves. That is why deep shafts have soft
            ropes. A laboratory sample tells you nothing about the shaft unless the length is
            carried through.
          - >-
            Why the period does not depend on the load's weight in the way people expect. It depends
            on the mass hanging and on the stiffness, not on how far the rope is already stretched.
            So a cage with four tonnes in it and the same cage empty have different periods. The same cage at
            the inset and at the bank have very different ones. The rope is ten times softer at the
            bottom.
          - >-
            What the static stretch is. Under an ordinary 147 kilonewtons this rope is stretched by
            about 1.3 metres. That is not a fault. It is a metre and a third of stored energy sitting in the rope on every wind.
            It is the reason the next day's question exists at all.
        assumes:
          - a rope's stretch is proportional to the pull on it
        takeaway: Stiffness is the material times the area over the length. The period the cage has on it follows from that and the mass.
        format: DERIVE
        question: 'What is the rope''s stiffness at the bottom, and what natural period does it give the cage?'
        answerText: >-
          About 1.2 s. The stiffness is EA/L = 110 kN/m, so ω = √(k/m) = 5.25 rad/s and the period is
          2π over that.
        why: >-
          The period is about 1.2 seconds. The rope's stiffness is its modulus times its steel area divided by
          its length. That comes out at 110 kilonewtons a metre — soft, because the rope is very
          long. A four-tonne cage on that spring has an angular frequency of 5.25 radians a second.
          The period is 2π divided by it. Neither the stiffness nor the period depends on how far
          the rope is already stretched. That makes them properties of the installation rather than
          of a particular wind.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: k = E·A/L,  ω = √(k/m)
          startNote: E = 120 GPa, A = 1,140 mm², L = 1,240 m, cage and load 4,000 kg
          goal: the period of the cage on the rope, in seconds
          askRule: true
          rules:
            - stiffness from the material
            - the frequency of a mass on a spring
            - the period from the frequency
            - substitution of the stated values
            - rearrangement
          steps:
            - ask: Get the stiffness.
              answer: 2
              candidates:
                - text: k = E·A·L = 1.70 × 10¹¹ N/m
                  rule: stiffness from the material
                  survives: true
                  why: >-
                    Length multiplying instead of dividing. It makes a twelve-hundred-metre rope a
                    million times stiffer than a short one, and the period that comes out of it is a
                    thousandth of a second — which reads as a rope that does not stretch, which is
                    what everybody already believes.
                - text: k = E/A·L = 1.3 × 10¹⁴ N/m
                  rule: rearrangement
                  why: >-
                    Area dividing rather than multiplying. A thinner rope would then be stiffer, which
                    is the opposite of true.
                - text: k = E·A/L = 1.368 × 10⁸ ÷ 1,240 = 110,000 N/m
                  rule: stiffness from the material
                - text: k = E·A/L, with A in mm² = 1.10 × 10¹¹ N/m
                  rule: substitution of the stated values
                  survives: true
                  why: >-
                    The area left in square millimetres. The expression is right, the arithmetic is
                    right, and the answer is a million times too large because 1,140 mm² is
                    1.14 × 10⁻³ m².
            - ask: Get the angular frequency.
              answer: 1
              candidates:
                - text: ω = √(m/k) = √0.0363 = 0.190 rad/s
                  rule: the frequency of a mass on a spring
                  why: >-
                    Inverted. A heavier cage would then bounce faster, and a stiffer rope slower.
                - text: ω = √(k/m) = √27.58 = 5.25 rad/s
                  rule: the frequency of a mass on a spring
                - text: ω = k/m = 27.6 rad/s
                  rule: the frequency of a mass on a spring
                  survives: true
                  why: >-
                    The root has not been taken. The units are the tell — a stiffness over a mass is a
                    frequency squared — and the number is a believable one for a stiff structure.
                - text: ω = √(k·m) = 21,000 rad/s
                  rule: rearrangement
                  why: >-
                    Multiplied rather than divided. That is not a frequency of anything mechanical.
            - ask: Turn the angular frequency into a period.
              answer: 3
              candidates:
                - text: T = ω/2π = 0.836 s
                  rule: the period from the frequency
                  survives: true
                  why: >-
                    Inverted, and inside a factor of two of the truth. A period of 0.84 seconds against
                    1.2 is not a difference anybody catches by looking at it.
                - text: T = 1/ω = 0.190 s
                  rule: the period from the frequency
                  why: >-
                    That is the time for one radian rather than for one full cycle. The 2π is what
                    makes it a period.
                - text: T = ω = 5.25 s
                  rule: the period from the frequency
                  why: >-
                    An angular frequency in radians a second reported as a time. The units are wrong
                    and the number is in the right region, which is the worst combination.
                - text: T = 2π/ω = 1.20 s
                  rule: the period from the frequency
            - ask: Check the static stretch this stiffness implies, under 147 kN.
              answer: 0
              candidates:
                - text: x = F/k = 147,000 ÷ 110,000 = 1.34 m
                  rule: substitution of the stated values
                - text: x = F·k = 147,000 × 110,000 = 1.6 × 10¹⁰ m
                  rule: rearrangement
                  why: >-
                    Multiplied. A stretch of ten billion metres is a check that has done its job by
                    being absurd.
                - text: x = k/F = 0.75 m⁻¹
                  rule: rearrangement
                  survives: true
                  why: >-
                    Inverted, and the number is a plausible-looking 0.75 in units nobody reads. A
                    stretch is metres and this is per metre.
                - text: x = F/(k·L) = 1.1 mm
                  rule: substitution of the stated values
                  why: >-
                    The length is already inside the stiffness. Dividing by it again gives a strain
                    rather than a stretch, and it is the answer that makes the whole effect invisible.
          commit: Commit the derivation
      - group: CAGE
        task: 'Identify the energy stored in the stretched rope'
        title: 'Where is the energy in the stretched rope?'
        at: body-bench
        reason: >-
          Rahimi measured more than a metre of ordinary stretch in the rope. If that stretch stores
          energy, it is a reservoir that can keep moving the cage after the drum is already stopped.
        concept: Energy in an oscillation
        place: Shaft and Brake House
        scene: >-
          The rope is about 1.3 metres longer under load than when unloaded. Rahimi puts that stretch
          beside the March overshoot and asks what physical quantity is stored while the steel is
          stretched.
        guide: >-
          Four accounts of what that stretch means. Ask of each whether it describes something the
          rope is doing or something the rope is holding. Then ask what would happen to it if
          whatever is pulling let go. One of the four is the reason a cage does not stop when the drum does.
        assumes:
          - a stretched spring holds energy that can be recovered
        takeaway: A stretched rope holds energy proportional to the square of its stretch, and it gives it back to whatever is on the end.
        format: CHOICE
        question: 'What is the rope storing while it is stretched by about a metre and a third?'
        why: >-
          It is holding energy, about a hundred kilojoules of it, and it will give that energy back to
          whatever is on the end of it. That is what a spring does: the work done stretching it is
          stored as the square of the stretch, and released as the stretch comes out. So a cage on a
          stretched rope is not a load on a link. It is a mass on a charged spring. Stopping the
          top of that spring does not stop the mass.
        choices:
          - Energy, which it will return to the cage as the stretch comes out
          - Nothing, since the stretch is a consequence of the load rather than a store
          - Momentum, which it transfers to the drum when the brake is applied
          - Heat, since stretching steel warms it
        answer: Energy, which it will return to the cage as the stretch comes out
        rebuttals:
          - The stretch is a consequence of the load and it is also a store; the work done to produce it went somewhere.
          - Momentum belongs to something moving; a stretched rope holding still has none to give.
          - Some heat is produced and it is a tiny fraction, and it is not recoverable at all.
      - group: BANK
        task: 'Explain the safety purpose of the slow final crawl'
        title: 'Why is the slow final crawl there?'
        at: signal-board
        reason: >-
          Marchetti wants to remove two of the final three slow seconds from every trip. Ubah has
          watched thousands of arrivals and wants a physical reason before giving up that margin.
        concept: Damping, and a driving that arrives in step
        place: The Bank
        person: true
        scene: >-
          Every trip ends with a slow crawl into the landing. The cage is not simply trying to cover the
          last few metres; the rope and cage are settling after the earlier changes in speed. You decide
          what that time is buying.
        guide: >-
          Ubah has watched this landing for years, and she has a fair question: what is that
          crawl actually buying? Look at each of the four answers and ask the same thing of it.
          Would a rigid steel bar need it too, or only twelve hundred metres of rope that
          bounces? A habit survives because nobody asks that question. A working margin survives
          because somebody once did, and wrote the answer down.
        assumes:
          - an oscillation loses amplitude over time to whatever damps it
        takeaway: A margin that reads as caution is often a quantity somebody once computed and nobody wrote down.
        format: CHOICE
        question: 'What is the slow crawl at the end of a trip actually doing?'
        why: >-
          It gives whatever the cage is doing on the rope time to die away before the stop. A cage arriving at
          speed is bouncing, at a bit over a second a cycle. The damping in the rope and the guides
          takes several cycles to quieten it. Three seconds is two or three of those cycles. On a
          rigid link there would be nothing to wait for. That is why the crawl looks like caution to
          anybody reading the profile, and is not.
        choices:
          - Letting the bounce on the rope die away before the stop
          - Giving the driver time to read the depth indicator
          - Allowing the banksman to open the gate before the cage arrives
          - Reducing the wear on the brake pads at each stop
        answer: Letting the bounce on the rope die away before the stop
        rebuttals:
          - The indicator is read throughout the wind, and the crawl is at the one point where it matters least.
          - The gate is opened after the cage is at rest, by rule, whatever the profile does.
          - Pad wear depends on the energy taken out, and a crawl removes almost none of it.
  # ---------------------------------------------------------------- day 10
  - title: 'What really happened in March?'
    objective: 'Predict how far the cage should travel after the drum stops, then test that prediction against the original March records.'
    stake: >-
      Friday. This is the question the inquiry never answered. The brake stopped the drum on time, yet
      the cage moved another 1.6 metres. You now have the rope stiffness, the speed, and the original
      records. Today the physics has to predict the distance before you decide what caused the incident.
    takeaway: A brake stops the drum; what stops the cage is the rope, and the rope stretches first.
    segue: >-
      The calculation predicts the recorded 1.6 metres. The brake stopped the drum; the stretched rope
      carried the cage on. The pads were blamed for motion they could not directly control. March is
      explained—but the result creates a new safety question: how much energy can the brake safely
      remove when the cage is moving?
    stops:
      - group: CAGE
        task: 'Predict how far the cage moves after the drum has stopped'
        title: 'Can the rope explain the extra 1.6 metres?'
        at: pad-bench
        reason: >-
          This is the missing calculation from the March inquiry. If the rope model predicts the
          position tape without changing the brake, the old explanation has a serious problem.
        concept: Kinetic energy and the work–energy theorem
        place: Shaft and Brake House
        scene: >-
          In March the drum was braked from 8.4 metres a second while the descending cage was about
          forty metres above the bottom landing. The drum stopped first. Using the rope stiffness and
          the cage's motion, you predict how much farther the cage should travel.
        guide: >-
          You build the working a line at a time. Take the drum as stopped and the cage as a mass on a
          spring anchored at the drum. All the cage's motion has to be turned into stretch, so the
          energy it arrives with is the energy the rope ends up holding. Solve for the stretch, and
          note what the answer depends on.
        background:
          - >-
            Why the answer is the speed over the angular frequency. Set the cage's kinetic energy
            equal to the rope's stored energy and solve for the stretch. It comes out as the speed
            times the root of mass over stiffness. That is the speed divided by the angular frequency
            computed yesterday. So it is not an arbitrary quantity: it is one period's worth of travel, near
            enough, at the speed the cage was making.
          - >-
            Why no brake could have prevented it. The brake acts on the drum. Whatever it does to the
            drum, the cage is a separate body attached through a spring, and its own momentum has to be
            taken out through that spring. A better pad stops the drum sooner and makes this worse
            rather than better, because the drum stopping is what starts the overshoot.
          - >-
            What the inquiry could not have seen. Craig's coefficient was correct. The retardation
            computed from it was correct for the drum. Every number in the finding was right. The
            model behind them had the cage and the drum as one rigid body. Twelve hundred metres
            of steel is not.
        assumes:
          - all of a body's kinetic energy has to be accounted for by work done on it
        takeaway: A cage on a soft rope overshoots its stopped drum by its speed divided by its own angular frequency.
        format: DERIVE
        question: 'How far should the cage travel past the drum''s stopping point?'
        answerText: >-
          About 1.6 m. Setting ½mv² = ½kx² gives x = v·√(m/k) = 8.4 ÷ 5.25, which is the overwind
          measured in March.
        why: >-
          The cage travels about 1.6 metres further, which is what was measured. Once the drum is
          stopped the cage is a mass on a spring, and all of its kinetic energy has to go into
          stretching the rope. Equating the two and solving for the stretch gives the speed divided by
          the angular frequency — 8.4 over 5.25. Nothing about the pads appears in that expression. The
          overwind was a property of the installation and the speed at which the brake was applied,
          and both were within the rules as written.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: ½mv² = ½kx²
          startNote: v = 8.4 m/s at the moment the drum stopped, m = 4,000 kg, k = 110,000 N/m, ω = 5.25 rad/s
          goal: the extra travel of the cage after the drum has stopped, in metres
          askRule: true
          rules:
            - the work–energy theorem
            - energy stored in a spring
            - rearrangement
            - substitution of the stated values
            - comparison with the record
          steps:
            - ask: Say what the cage's kinetic energy has to become.
              answer: 1
              candidates:
                - text: heat in the brake pads
                  rule: the work–energy theorem
                  survives: true
                  why: >-
                    True of the drum's own energy and not of the cage's. The pads act on the drum, and
                    the cage's energy can only reach them through the rope — which is the step this
                    whole day exists to notice.
                - text: energy stored in the stretch of the rope
                  rule: energy stored in a spring
                - text: potential energy, as the cage rises further
                  rule: the work–energy theorem
                  why: >-
                    Some of it does, and over 1.6 metres that is 63 kilojoules against 141 — a
                    correction rather than the mechanism, and it makes the overshoot smaller rather
                    than explaining it.
                - text: 'nothing: the cage stops when the drum stops'
                  rule: the work–energy theorem
                  why: >-
                    That is the rigid-body assumption the inquiry made. It requires the rope to be
                    inextensible, and this one stretches 1.3 metres standing still.
            - ask: Rearrange for the stretch.
              answer: 2
              candidates:
                - text: x = v²·m/k
                  rule: rearrangement
                  survives: true
                  why: >-
                    The root has not been taken. It gives 2.56 metres — larger than the measurement,
                    the right order, and it would have every landing margin set 60 per cent too wide.
                - text: x = v·√(k/m)
                  rule: rearrangement
                  why: >-
                    Stiffness and mass the wrong way up. A stiffer rope would then give a longer
                    overshoot, which is backwards.
                - text: x = v·√(m/k)
                  rule: rearrangement
                - text: x = √(v·m/k)
                  rule: rearrangement
                  why: >-
                    The root has been taken over the whole expression including the speed, so the units
                    inside it are not a length squared.
            - ask: Put the numbers in.
              answer: 0
              candidates:
                - text: x = 8.4 × √(4,000 ÷ 110,000) = 8.4 ÷ 5.25 = 1.60 m
                  rule: substitution of the stated values
                - text: x = 8.4 × √(4,000 ÷ 110,000) = 8.4 ÷ 52.5 = 0.16 m
                  rule: substitution of the stated values
                  survives: true
                  why: >-
                    A factor of ten lost in the root. Sixteen centimetres is small enough that nobody
                    would ever look for a mechanism, which is what makes it the expensive version of
                    this error.
                - text: x = v·ω = 8.4 × 5.25 = 44.1 m
                  rule: rearrangement
                  why: >-
                    Multiplied by the angular frequency rather than divided. Forty-four metres is more
                    than the headframe is tall.
                - text: x = 8.4 ÷ 1.20 = 7.0 m
                  rule: substitution of the stated values
                  why: >-
                    Divided by the period rather than by the angular frequency, which drops the 2π.
            - ask: Put that beside what was measured in March.
              answer: 3
              candidates:
                - text: 1.60 m against 1.6 m measured, so the pads were the cause after all
                  rule: comparison with the record
                  why: >-
                    The expression contains no property of the pads. An agreement reached without them
                    is not evidence about them.
                - text: 1.60 m against 1.6 m measured, so the position recorder was mis-calibrated
                  rule: comparison with the record
                  why: >-
                    The recorder is a tape reel at the inset, checked against the guides afterwards.
                    Doubting the one instrument that saw the effect is how the effect stayed unexplained
                    for eight months.
                - text: 1.60 m against 1.6 m measured, which is a coincidence and settles nothing
                  rule: comparison with the record
                  survives: true
                  why: >-
                    A defensible reflex and wrong here: the prediction was made from the rope's own
                    properties and the recorded speed, with nothing fitted to the outcome, and it lands
                    on the measurement to two figures.
                - text: 1.60 m against 1.6 m measured, so the overshoot is the rope and not the brake
                  rule: comparison with the record
          commit: Commit the derivation
      - group: ROPE
        task: 'Choose the one explanation that fits every March record'
        title: 'Which explanation fits every March record?'
        at: rope-bench
        reason: >-
          The brake certificate, drum trace, cage-position tape, and replaced pads have been argued over
          separately for eight months. Otieno wants one account that makes all four true at once.
        concept: Energy dissipated in a brake
        place: Rope Shop
        scene: >-
          The March evidence is finally on one bench. The brake was applied on time. The drum stopped.
          The cage continued. The pads were replaced afterward. Your job is not to choose the loudest
          clue; it is to choose the cause that explains all of them.
        guide: >-
          Look at every record before choosing, including the two that are not alarming. The pad
          certificate is a good measurement and the drum record shows a stop made on time. What separates the accounts is whether they explain a cage that moved after the drum had stopped.
          The second test is pads worn out by a stop they were strong enough to make.
        assumes:
          - energy taken out of a moving body has to appear somewhere as heat or as work
        takeaway: Pads wear from the energy they absorb. A stop that goes on longer absorbs more of it at the same force.
        format: DIAGNOSIS
        headline: The brake was applied on time, at the right force, and the cage went past the landing.
        task: 'Choose the explanation that makes every March record true at the same time.'
        readings:
          - { zone: Pad certificate, label: "Coefficient, measured cold", value: as specified, status: normal }
          - { zone: Drum record, label: Stopped from 8.4 m/s in, value: 0.9 s, status: normal }
          - { zone: Position tape, label: Travel after the drum stopped, value: 1.6 m, status: alarm }
          - { zone: Pads, label: Replaced after the stop, value: worn through, status: alarm }
        choices:
          - { label: The pads were below specification, mechanism: A weak brake gives a longer stop and a longer overshoot. }
          - { label: The drum stopped and the cage did not, mechanism: "The cage was on a soft rope, with its own energy to lose." }
          - { label: The driver applied the brake late, mechanism: A late application leaves less shaft to stop in. }
          - { label: The position tape was mis-reading, mechanism: A cage stopping with its drum cannot travel afterwards. }
        answer: The drum stopped and the cage did not
        why: >-
          The drum record and the pad certificate are both in order. That rules out the two accounts that need
          one of them to be wrong. What is left has to explain a cage that travelled after the drum
          had stopped, and pads worn through by a stop they were strong enough to make. A cage on a
          rope of 110 kilonewtons a metre overshoots a stopped drum by 1.6 metres at that speed. The
          pads then take out the cage's energy as well as the drum's. That energy arrives back
          through the rope over the following seconds, not during the stop.
      - group: WIND
        task: 'Identify what the brake directly stops'
        title: 'What can the brake actually stop?'
        at: drum
        reason: >-
          Anand has said since March that 'the machine stopped and the cage did not.' The distinction
          only makes sense if you are precise about what the brake is physically clamped to.
        concept: 'A drum and a rope: translation and rotation tied together'
        place: Winder House
        person: true
        scene: >-
          The brake pads clamp the drum flanges in the winder house. The cage is 1,200 metres away,
          connected through a rope that stretches. Anand asks what object the brake can stop directly,
          and what must respond through the rope.
        guide: >-
          All four options are bodies the brake could be said to stop. Ask of each what the brake is physically in contact with. Then ask what has to happen for a body not
          in contact with it to slow down. The depth indicator is the detail that decides it. What
          it reads is one of the four and not the others.
        assumes:
          - a brake acts on whatever it is in contact with
        takeaway: A no-slip relation ties a drum to a rope. It stops being a relation the moment the rope stretches.
        format: CHOICE
        question: 'When the brake clamps on, what does it directly stop?'
        why: >-
          The pads clamp the drum flanges, so the brake stops the drum. Everything else slows down only
          through the rope, and the rope can stretch. So while the drum is being stopped, the
          relation between drum position and cage position quietly stops holding. The depth
          indicator is driven off the drum shaft. It reads where the cage would be if the rope were
          rigid. In March it read the cage stopping at the mark. The cage was a metre and six tenths
          past it.
        choices:
          - The drum, and everything else only through the rope
          - The cage, through the rope, which acts as a rigid link
          - The whole machine at once, since the parts are connected
          - The sheave wheels, which transmit the retardation to both sides
        answer: The drum, and everything else only through the rope
        rebuttals:
          - A rope that stretches 1.3 metres under load is not acting as a rigid link during a stop.
          - Connected is not rigid, and everything in this failure happens in the connection.
          - The sheaves turn freely; they change the rope's direction and apply no retardation to it.
  # ---------------------------------------------------------------- day 11
  - title: 'Can the brakes survive an emergency stop?'
    objective: 'Calculate everything the brake pads must absorb in an emergency stop, then test the predicted stopping time on the real machine.'
    stake: >-
      Monday, two days to the inspection. March was not a brake failure, but that does not mean every
      emergency stop is safe. On a descending trip, gravity adds energy while the brake is trying to
      remove it. Today you calculate what the pads must absorb, make a prediction, and test it on the
      empty cage.
    takeaway: A stop has to absorb the rotation as well as the motion, and the rotation can be the larger half.
    segue: >-
      The test matches the prediction. An upward emergency stop stays near the pad rating; a descending
      one can exceed it badly. That means the original twelve-second saving cannot simply be signed.
      Tomorrow you build the fastest profile that respects the motor, the rope, and the brake—and make
      the recommendation the miners will ride under.
    stops:
      - group: WIND
        task: 'Add every energy term the pads must absorb in an emergency stop'
        title: 'How much energy must the brake absorb?'
        at: drum
        reason: >-
          The faster plan needs an emergency-stop limit based on energy, not on the pad friction number
          that dominated the old inquiry. Marchetti wants the full ledger before the test wind.
        concept: Rotational kinetic energy
        place: Winder House
        scene: >-
          Halfway up the shaft, the cage is moving at 8.4 metres a second, hundreds of metres of rope
          are hanging, and the eighteen-tonne drum is spinning. An emergency stop must remove
          translational and rotational motion while gravity also changes the balance.
        guide: >-
          You build the working a line at a time. Three stores have to be emptied. They are the drum's rotation, the motion of everything travelling,
          and whatever gravity does over the stopping distance. The third one has a sign that
          depends on which way the cage is going. It is the term the whole answer turns on.
        background:
          - >-
            Why the drum is the largest single store. Eighteen tonnes at two metres' radius has an inertia of 72,200 kilogram metres squared. At 4.0
            radians a second that is 578 kilojoules. It is more than the cage and its rope together. It is invisible on the plant
            drawings because nothing about it moves in a straight line.
          - >-
            Why the direction of travel decides the answer. Going up, gravity is taking energy out of
            the cage while the brake is, so the pads absorb less: 558 kilojoules. Going down, gravity
            is putting energy in, and the same stop asks the pads for 1.27 megajoules. The stop that
            destroyed a set of pads in March was a downward one.
          - >-
            What the rating means. Six hundred kilojoules a stop is the maker's figure for the pads
            fitted. An upward emergency stop is inside it, and a downward one is twice it. That is not a fault in the
            pads. It is a fact nobody at this shaft had written down.
        assumes:
          - a turning body holds energy that has to be taken out of it to stop it
        takeaway: The energy a stop must absorb is the rotation plus the motion plus or minus what gravity does over the distance.
        format: DERIVE
        question: 'How much energy does an upward emergency stop put into the brake pads?'
        answerText: >-
          About 558 kJ: 578 in the drum, 336 in the cage and rope, less 355 taken out by gravity as
          the cage rises 3.8 m.
        why: >-
          The pads take about 558 kilojoules, against a rating of 600. Three stores are being emptied, and the
          drum is the biggest of them. A rotational energy is a half times the moment of inertia
          times the square of the angular velocity. This drum's inertia is large. Going up, gravity
          helps: the cage rises 3.8 metres while stopping. So 355 kilojoules leaves the system as height, and the pads never see it. Going down the same term arrives with the opposite sign, and the total is 1.27 megajoules.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: E_pads = K_rot + K_trans ± mgh
          startNote: I = 72,200 kg·m², ω = 4.0 rad/s, cage and hanging rope 9,518 kg, v = 8.4 m/s, 3.8 m of travel
          goal: the energy the pads absorb in an upward emergency stop, in kilojoules
          askRule: true
          rules:
            - rotational kinetic energy
            - kinetic energy of a translating mass
            - work done against gravity
            - the sign of the gravity term
            - substitution of the stated values
            - rearrangement
          steps:
            - ask: Take the drum's rotational energy.
              answer: 2
              candidates:
                - text: K_rot = ½ × 72,200 × 4.0 = 144 kJ
                  rule: rotational kinetic energy
                  why: >-
                    The angular velocity has not been squared. It is a quarter of the answer and it has
                    the units of a torque rather than an energy.
                - text: K_rot = 72,200 × 4.0² = 1,155 kJ
                  rule: rotational kinetic energy
                  survives: true
                  why: >-
                    The half is missing. Twice the true figure, and since it makes the total exceed the
                    pads' rating it would produce the right decision from the wrong number.
                - text: K_rot = ½ × 72,200 × 4.0² = 578 kJ
                  rule: rotational kinetic energy
                - text: K_rot = ½ × 18,000 × 8.4² = 635 kJ
                  rule: kinetic energy of a translating mass
                  why: >-
                    The drum's mass and the cage's speed. The drum does not travel anywhere, and its
                    energy is in the rotation.
            - ask: Take the energy of everything that is travelling.
              answer: 0
              candidates:
                - text: K_trans = ½ × 9,518 × 8.4² = 336 kJ
                  rule: kinetic energy of a translating mass
                - text: K_trans = ½ × 4,000 × 8.4² = 141 kJ
                  rule: kinetic energy of a translating mass
                  survives: true
                  why: >-
                    The cage without the rope travelling with it. Five and a half tonnes of steel is
                    moving at the same speed as the cage and has to be stopped by the same brake.
                - text: K_trans = ½ × 15,036 × 8.4² = 531 kJ
                  rule: kinetic energy of a translating mass
                  why: >-
                    The full rope rather than the hanging length at mid-shaft. That is the figure for
                    the cage at the inset, where the speed would not be 8.4.
                - text: K_trans = 9,518 × 8.4 = 80 kJ
                  rule: rearrangement
                  why: >-
                    A momentum reported as an energy. The units are kilogram metres a second.
            - ask: Deal with what gravity does over the stopping distance.
              answer: 1
              candidates:
                - text: it adds 355 kJ, since the cage is still moving upward
                  rule: the sign of the gravity term
                  survives: true
                  why: >-
                    The cage is rising, so gravity is doing negative work on it and taking energy out
                    of the system. Adding it gives 1.27 MJ, which is the correct figure for a downward
                    stop and the wrong one here.
                - text: it removes 355 kJ, since the cage rises 3.8 m while stopping
                  rule: work done against gravity
                - text: it contributes nothing, since the brake is what stops the cage
                  rule: the sign of the gravity term
                  why: >-
                    Gravity acts throughout the stop whatever else is happening, and 3.8 metres of rise
                    against 93 kilonewtons of weight is not a small term.
                - text: it removes 36 kJ, from the cage alone rising 3.8 m
                  rule: work done against gravity
                  why: >-
                    The rope rises with the cage. Only the cage's four tonnes has been counted, and
                    nine and a half are moving.
            - ask: Add them up, and put the total beside the pads' rating.
              answer: 3
              candidates:
                - text: 578 + 336 + 355 = 1,269 kJ, over twice the rating
                  rule: substitution of the stated values
                  survives: true
                  why: >-
                    The gravity term added rather than subtracted. It is the right answer to the
                    downward stop, arrived at while answering about an upward one, and it is the number
                    that matters most in this campaign.
                - text: 336 − 355 = −19 kJ, so the brake does nothing
                  rule: substitution of the stated values
                  why: >-
                    The drum has been left out altogether, which is the largest of the three stores.
                - text: 578 + 336 = 914 kJ, over the rating
                  rule: substitution of the stated values
                  why: >-
                    Gravity ignored. Over a 3.8 metre rise it is a third of the total and it cannot be
                    dropped on the grounds of being small.
                - text: 578 + 336 − 355 = 558 kJ, inside the rating of 600
                  rule: substitution of the stated values
          commit: Commit the derivation
      - group: CAGE
        task: 'Predict the drum stopping time, run one test, and compare prediction with measurement'
        title: 'Does the real stop match the prediction?'
        at: pad-bench
        reason: >-
          Craig gets one controlled test on the empty cage before the inspector arrives. The prediction
          has to be written first, so the test can check the model rather than be fitted afterward.
        concept: Predicting, then measuring what was predicted
        place: Shaft and Brake House
        scene: >-
          The empty cage is released for one test trip. Before Craig touches the emergency brake, you
          predict how long the drum should take to stop from 8.4 metres a second. The recorder will show
          whether the real machine agrees.
        guide: >-
          Lock a prediction for how long the drum takes to stop before the brake is applied. Nothing
          about it can be changed afterwards, which is the point of making it first. Then apply the
          brake. Then spend a test wind on reading the recorder. A stop that is confirmed to have
          happened and never measured establishes that the brake works. It establishes nothing about
          how fast.
        assumes:
          - a retardation follows from the braking torque and the inertia it acts on
        takeaway: A prediction locked before an intervention is a measurement of the model; the same number chosen afterwards is a description.
        format: VERIFY
        question: Predict how long the drum takes to stop, apply the brake, and report what happened.
        verify:
          hint: >-
            Lock the prediction first. The brake can be applied without measuring anything, and a
            confirmed stop tells you the brake works rather than how long it took.
          prediction: { label: Predicted time for the drum to stop, unit: s, min: 0.3, max: 2.4, step: 0.05 }
          truth: 0.9
          passRatio: [0.6, 1.6]
          intervention:
            label: The emergency brake, from 8.4 m/s
            note: Empty cage, mid-shaft, both pad sets. The oil is dumped and the weights apply the pads.
            outcome: Brake applied. Drum at rest, cage at rest, nothing damaged.
          measurement:
            label: The drum recorder trace
            note: Angular velocity against time through the stop, read off the paper afterwards.
            cost: 1
            costUnit: test winds
          unmeasuredMoral: >-
            The brake was applied and everything stopped. Nothing in that establishes how long the
            drum took, which is the one number the pad rating has to be compared against.
          commit: Report the stopping time
        answerText: >-
          About nine tenths of a second — but only the recorder trace establishes it. A stop that
          happened is not a stop that has been measured.
        why: >-
          The stop takes about nine tenths of a second. It follows from the braking torque acting on
          the drum's inertia and on the translating mass through the rope. So a prediction is a test of
          the model rather than a guess. That is exactly why it has to be locked first. With the
          trace in hand, a number can be chosen that fits and the prediction will appear to have been
          right. The commoner failure is the other one: applying the brake, watching everything stop,
          and treating that as the result.
      - group: TIP
        task: 'Track the momentum of ore when it is dumped into a stationary bin'
        title: 'Why do static load ratings keep failing at Kerrow?'
        at: weightometer
        reason: >-
          The mine has now seen the same mistake in two places: equipment sized for a standing load can
          still fail when a moving load arrives. Lindqvist's sheared bin bolts are the final reminder
          before you write the lift limits.
        concept: Conservation of momentum in a system with no outside force
        place: Tip and Conveyor
        person: true
        scene: >-
          A skip dumps four tonnes of moving ore into a stationary bin twenty times a shift. The old
          bolt calculation used only the weight of a full bin. The missing quantity is the momentum that
          has to go somewhere when the ore stops.
        guide: >-
          All four options are ways of accounting for what the bolts feel. Ask of each what body or
          bodies have been taken together, because a momentum that leaves one body has to arrive at
          another. The one that works is the one where nothing outside the chosen bodies is needed.
        assumes:
          - momentum lost by one body is gained by another unless something outside acts
        takeaway: Taking two bodies together removes the force between them from the accounting and leaves only what comes from outside.
        format: CHOICE
        question: 'What has to happen to the momentum the ore arrives with?'
        why: >-
          It has to be taken by the bin, and through the bin by its bolts. Ore and bin together are a
          system with nothing outside it but gravity and the bolts. So the momentum the ore loses
          appears as an impulse on the bolts. It is spread over however long the ore takes to stop.
          Twenty times a shift, at four tonnes arriving at seven metres a second, that is a real
          load. It was never in the bolt calculation. That calculation was done for the weight of a
          full bin standing still.
        choices:
          - The bin takes it, and passes it to its bolts as an impulse
          - It disappears, since the ore comes to rest
          - The skip keeps it, since the skip was what was moving
          - It becomes heat in the ore and the bin
        answer: The bin takes it, and passes it to its bolts as an impulse
        rebuttals:
          - Momentum does not disappear; something has to have taken it, and here the bolts are the only candidate.
          - The skip has stopped tipping and has no forward motion to carry away.
          - Energy becomes heat; momentum is a separate ledger and it has to balance on its own.
  # ---------------------------------------------------------------- day 12
  - title: 'What should the inspector approve?'
    objective: 'Build the fastest profile the physics supports, choose the measurements that matter, and write the operating limits for the mine lift.'
    stake: >-
      Tuesday. The inspector arrives tomorrow. You now know why March happened, what the motor can do,
      how the rope moves, and what the brake can survive. Today you make the actual call: how much
      faster may the mine run, what limits go with it, and what must be measured from now on?
    takeaway: A revised profile is a decision about which numbers the plant is allowed to reach, and it has to be integrated to be believed.
    stops:
      - group: BANK
        task: 'Integrate the final safe profile and calculate the real time saving'
        title: 'How much faster can Kerrow safely run?'
        at: profile-desk
        reason: >-
          Ubah needs the number miners will actually experience, not the twelve seconds management
          originally asked for. The revised profile must satisfy every limit found during the
          investigation.
        concept: Getting velocity and distance back by integrating an acceleration
        place: The Bank
        scene: >-
          The final profile keeps the safe acceleration ramp and full speed, limits the speed before
          braking, and retains enough slow approach for the rope to settle. You integrate the pieces and
          compare the result with today's 184.3-second trip.
        guide: >-
          You build the working a line at a time. The cycle is a sum of pieces. Each piece is either a distance divided by a speed, or an integral of
          a profile. Work out the shaft the
          ramps use, take what is left for the full-speed run, and add the crawl. Then compare with
          the present cycle rather than with the proposal.
        background:
          - >-
            Why the retardation cap is what costs the seconds. Capping the speed at which the brake may be applied changes the retardation ramp. The ramp has to
            bring the cage down to 4.5 metres a second before the mark. That takes shaft, and
            therefore time. It is five of the twelve seconds Marchetti asked for, and it is the
            price of an overshoot inside a metre.
          - >-
            Why the crawl can be halved. The crawl exists to let the bounce die away, and the bounce
            after a retardation ramp is far smaller than the bounce after a brake application. With
            the brake capped, one and a half seconds is two periods, which is enough.
          - >-
            What the submission now says. Seven seconds a cycle, four winds an hour, eight hours a
            shift: about three and a half minutes a shift, which is a wind and a half. It is less than Marchetti asked for and it is a real saving, and it rests on a limit nobody would have written down a fortnight ago.
        assumes:
          - a cycle time is the sum of the times of the parts of the journey
        takeaway: A cycle time is only as good as the integral behind it. A saving that ignores a limit is not a saving.
        format: DERIVE
        question: 'How many seconds does the final safe profile remove from one trip?'
        answerText: >-
          About 7 s: the ramps and the retardation cap give back 5.5 s of the 12 asked for, and the
          shortened crawl 1.5 s.
        why: >-
          The revised profile saves about seven seconds, not twelve. The ramp up is unchanged at 12 seconds
          for 57.6 metres. The retardation now has to reach 4.5 metres a second rather than nothing before the brake may be
          used. That lengthens the ramp, and eats five and a half of the
          seconds the proposal claimed. The crawl gives one and a half back. What is left is a
          saving that survives the two constraints the fortnight found. That is the only kind worth
          putting in front of an inspector.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: t_cycle = t_ramp + t_run + t_retard + t_crawl
          startNote: 1,240 m of shaft, ramp 12 s for 57.6 m, full speed 7.2 m/s, retardation to 4.5 m/s at 0.9 m/s², crawl 1.5 s
          goal: the saving against the present cycle, in seconds
          askRule: true
          rules:
            - integration with respect to time
            - a distance divided by a speed
            - the sum of the pieces
            - substitution of the stated values
            - comparison of magnitudes
            - rearrangement
          steps:
            - ask: Get the time and distance of the retardation ramp.
              answer: 1
              candidates:
                - text: t = 7.2 ÷ 0.9 = 8.0 s, over 28.8 m
                  rule: substitution of the stated values
                  survives: true
                  why: >-
                    Retarding all the way to rest rather than to the 4.5 metres a second the cap
                    allows. It is the old profile's ramp, and it is what the present cycle already does.
                - text: t = (7.2 − 4.5) ÷ 0.9 = 3.0 s, over 17.6 m
                  rule: substitution of the stated values
                - text: t = (7.2 − 4.5) × 0.9 = 2.4 s, over 14.0 m
                  rule: rearrangement
                  why: >-
                    Multiplied by the retardation rather than divided by it. The units give it away: a
                    speed times an acceleration is not a time.
                - text: t = 4.5 ÷ 0.9 = 5.0 s, over 11.3 m
                  rule: substitution of the stated values
                  why: >-
                    The speed it ends at rather than the change in speed. The ramp starts at 7.2 and
                    that is where the arithmetic has to start.
            - ask: Work out the full-speed run.
              answer: 3
              candidates:
                - text: 1,240 ÷ 7.2 = 172.2 s
                  rule: a distance divided by a speed
                  survives: true
                  why: >-
                    The whole shaft at full speed, with the two ramps counted twice — once as their own
                    time and once inside this. It overstates the cycle by about ten seconds and the
                    error cancels out of the saving, which is what makes it hard to see.
                - text: (1,240 − 57.6) ÷ 7.2 = 164.2 s
                  rule: a distance divided by a speed
                  why: >-
                    Only the accelerating ramp's distance has been taken out. The retardation ramp and
                    the crawl use shaft as well.
                - text: (1,240 − 57.6 − 17.6) ÷ 4.5 = 259 s, at the capped speed
                  rule: a distance divided by a speed
                  why: >-
                    The run divided by the capped speed rather than by the full speed. The cage runs at
                    7.2 between the ramps.
                - text: (1,240 − 57.6 − 17.6 − 6.8) ÷ 7.2 = 160.8 s, the run alone
                  rule: a distance divided by a speed
            - ask: Add the pieces for the revised cycle.
              answer: 0
              candidates:
                - text: 12 + 160.8 + 3.0 + 1.5 = 177.3 s
                  rule: the sum of the pieces
                - text: 12 + 160.8 + 3.0 = 175.8 s
                  rule: the sum of the pieces
                  why: >-
                    The crawl has been left out of the total while its distance was taken out of the
                    run, so a second and a half has gone missing from both sides.
                - text: 12 + 172.2 + 3.0 + 1.5 = 188.7 s
                  rule: the sum of the pieces
                  survives: true
                  why: >-
                    The run that double-counts the ramps. It is eleven seconds long and it is wrong in
                    the same direction for the present cycle, so the saving still comes out at seven.
                - text: 12 × 160.8 × 3.0 × 1.5 = 8,683 s
                  rule: rearrangement
                  why: >-
                    Multiplied rather than added. Two and a half hours for one wind.
            - ask: Compare with the present cycle of 184.3 s.
              answer: 2
              candidates:
                - text: a saving of 12.0 s, which is what was proposed
                  rule: comparison of magnitudes
                  why: >-
                    That is the proposal's own figure. It comes from retarding to rest at the old rate
                    and a crawl of nothing, neither of which survived the fortnight.
                - text: a saving of 1.5 s, the crawl alone
                  rule: comparison of magnitudes
                  why: >-
                    The ramps contribute as well. Only the retardation cap costs time; the shortened
                    crawl and the shorter retardation ramp both give it back.
                - text: a saving of 7.0 s
                  rule: comparison of magnitudes
                - text: a loss of 4.0 s, so the revision is worse than the present cycle
                  rule: comparison of magnitudes
                  survives: true
                  why: >-
                    The conclusion that follows from the double-counted run compared against a
                    correctly computed present cycle. Comparing two numbers computed different ways is
                    how a real saving gets thrown away.
          commit: Commit the derivation
      - group: WIND
        task: 'Prioritize the measurements that would make the next incident easier to prevent and explain'
        title: 'What should Kerrow measure from now on?'
        at: winder-desk
        reason: >-
          The March inquiry failed partly because the mine recorded the drum well and the cage badly.
          Before the next three-year inspection period begins, Marchetti wants the limited monitoring
          budget aimed at the measurements that would actually change a safety decision.
        concept: A measurement carries the conditions it was made under
        place: Winder House
        scene: >-
          Four possible upgrades are on the desk: a cage-position recorder at the top, a direct
          rope-stiffness measurement, a hot brake-friction rig, and a destructive arrestor test. You
          rank them by how much uncertainty they remove from decisions miners will depend on.
        guide: >-
          What the plant holds already. A pad coefficient measured cold on a bench and quoted for winds. A
          rope stiffness computed from the maker's modulus and never measured on this rope. A cage
          position tape at the inset, the only instrument that saw March, and nothing like it at the
          bank. A drum inertia now taken off the drum's own dimensions. The
          arrestors above the bank have never been used and have never been tested.
        rules: >-
          A hundred points, whole points, across the four. Spending is scored on what a measurement
          would change about a decision that gets made repeatedly, rather than on what it would add to
          a file: an instrument that would have seen March, or that turns a handbook number into a
          measured one, is worth more than a test of something already inside its own margin.
        assumes:
          - money spent on a measurement is worth what the measurement would change
        takeaway: Evidence is worth what it would change about a decision, not what it would add to a record.
        format: SCIENCETANK
        task: 'Allocate one hundred monitoring points across the four safety upgrades.'
        proposals:
          - { label: A, text: A cage position recorder at the bank as well as at the inset. }
          - { label: B, text: Measure the rope's stiffness on the rope rather than from the modulus. }
          - { label: C, text: A pad friction rig that works hot and at winding pressure. }
          - { label: D, text: Proof-test one arrestor and replace it. }
        recommended: { A: 40, B: 30, C: 20 }
        why: >-
          The position recorder is the instrument that would have seen March. There is one end of the shaft
          where the same effect would be an overwind, not a step down into a gap. Measuring the
          stiffness turns the number every overshoot rests on into a measured one. The hot friction
          rig is worth something because Craig's figure has been used where it does not apply. That
          will happen again. The arrestor test is real work on equipment that is inside its margin
          and has never been called on.
      - group: CAGE
        task: 'Turn each finding into the operating rule it requires'
        title: 'What safety limits should the inspector sign?'
        at: march-board
        reason: >-
          Rahimi has one final submission to write. The inspector does not need a pile of calculations;
          he needs the operating rules those calculations justify for every miner who rides the cage.
        concept: Energy dissipated in a brake
        place: Shaft and Brake House
        person: true
        scene: >-
          Four findings are on the bench: the motor margin, the rope-driven overshoot, the brake's
          energy limit, and the rope's changing stiffness after re-capping. You turn each one into the
          rule that belongs in the signed operating profile.
        guide: >-
          Each finding on the left has one consequence on the right that the submission has to state.
          What separates them is which of the four is a limit on the machine. Which is a limit on the
          rope. And which is a limit on how a stop may be made. The licence is a set of limits,
          not a set of results.
        assumes:
          - a limit is only useful if it names the quantity it limits
        takeaway: A submission is a list of limits, and each one has to name the quantity it constrains and the reason it exists.
        format: CASEBOOK
        task: 'Match each finding to the operating rule it requires.'
        scenarios:
          - The motor reaches 81 per cent of its torque rating and 86 per cent of its power rating.
          - A cage travels its speed divided by 5.25 after the drum has stopped.
          - A downward emergency stop delivers 1.27 megajoules to pads rated at 600 kilojoules.
          - The rope is 40 m shorter than the file says and 3 per cent stiffer.
        choices:
          - "No limit needed: the machine has the margin and the faster cycle uses it."
          - A cap on the speed at which the brake may be applied.
          - A prohibition on emergency stops on the descending wind except in emergency.
          - A recomputation of every stiffness figure whenever the rope is re-capped.
        mapping: [0, 1, 2, 3]
        why: >-
          Four findings and four different kinds of consequence. The motor's margin needs no limit at
          all, which is the finding that lets the cycle come down. The overshoot is a property of the
          rope and the speed, so the limit belongs on the speed. The pad energy is about how a stop is
          made rather than how fast the cage goes, so it limits the stop. And the rope's stiffness
          changes on a known schedule, so what it needs is not a limit but a standing instruction to
          recompute. A licence that carried only the first of these would be the submission of a
          fortnight ago.


                    — which is 307, wrong by a quarter and entirely believable.
                - text: τ_motor = T·R ÷ I·α
                  rule: rearrangement
                  why: >-
                    A ratio of two torques is a number without units, and the equation being
                    rearranged is a sum.
                - text: τ_motor = I·α + T·R
                  rule: rearrangement
                - text: τ_motor = (I + T)·α
                  rule: rearrangement
                  why: >-
                    An inertia and a force cannot be added. They have different units, which is the
                    quickest check available on any line of this working.
            - ask: Put the numbers in.
              answer: 0
              candidates:
                - text: τ = 72,200 × 0.571 + 166,000 × 2.1 = 41,200 + 348,600 = 390 kN·m
                  rule: substitution of the stated values
                - text: τ = 72,200 × 0.571 + 166,000 = 41,200 + 166,000 = 207 kN·m
                  rule: substitution of the stated values
                  survives: true
                  why: >-
                    The tension has been used as a torque without its lever arm. It is a little over
                    half the truth and it is still comfortably inside the motor's rating, so the
                    conclusion of the day would be unchanged and wrong.
                - text: τ = 72,200 × 2.52 + 166,000 × 2.1 = 182,000 + 348,600 = 531 kN·m
                  rule: substitution of the stated values
                  why: >-
                    The angular acceleration from the multiplied version. This one puts the answer
                    outside the motor's rating and would stop the submission for no reason.
                - text: τ = 72,200 + 166,000 × 2.1 = 421 kN·m
                  rule: substitution of the stated values
                  why: >-
                    The inertia has been added without being multiplied by the angular acceleration.
                    A moment of inertia is not a torque.
            - ask: Put that beside the motor's continuous rating of 480 kN·m.
              answer: 3
              candidates:
                - text: 390 is 81 per cent of the rating, so the ramp cannot be run continuously
                  rule: comparison of magnitudes
                  why: >-
                    The rating is the continuous one, so eighty-one per cent of it is inside the
                    machine's normal working. It is the ramp that is short, not the margin.
                - text: 390 is 81 per cent of the rating, so the drum's inertia is the limiting term
                  rule: comparison of magnitudes
                  why: >-
                    The inertia term is 41 of the 390. What is close to the rating is the rope, and
                    the rope's contribution does not change with how hard the ramp is driven.
                - text: 390 exceeds the rating, so the proposal fails on torque
                  rule: comparison of magnitudes
                  survives: true
                  why: >-
                    It would be the honest conclusion from the 531 line, and it stops the proposal at
                    the wrong point. A wrong reason for the right answer costs the same as a wrong
                    answer once somebody checks it.
                - text: 390 is 81 per cent of the rating, so the machine has the torque
                  rule: comparison of magnitudes
          commit: Commit the derivation
      - group: CAGE
        task: 'Decide what the brake''s cold-bench friction number really proves'
        title: 'Can a cold brake test predict a real emergency stop?'
        at: pad-bench
        reason: >-
          The March inquiry blamed the pads using a friction coefficient measured cold on a bench. Craig
          wants the inspector to see the conditions attached to that number before it is used as proof
          of what happened in a hot brake.
        concept: Friction as a force with a limit
        place: Shaft and Brake House
        scene: >-
          Craig lays the inquiry certificate beside a used brake pad. The certificate lists the friction
          coefficient, test pressure, instrument, and temperature. The inquiry quoted the coefficient
          but mostly forgot the other three.
        guide: >-
          Four readings of what a friction coefficient tells you about a brake. Ask of each what the
          measurement actually did. A coefficient sets the most a surface can hold, not what it is
          holding at any moment. The distinction that decides this card is between a limit and a
          value.
        assumes:
          - a friction force takes whatever value is needed up to a limit set by the surfaces
        takeaway: A friction coefficient gives the largest force a contact can hold, and it carries the conditions it was measured under.
        format: CHOICE
        question: 'What does Craig''s cold-bench friction coefficient actually tell us?'
        why: >-
          It gives the most the pads can hold, at the pressure and temperature she measured. Friction
          is not a fixed force: below the limit it supplies exactly what is needed and nothing more,
          and at the limit it slips. So a coefficient is a ceiling. It is a ceiling under stated
          conditions. A hot drum at the end of a wind is not a cold plate on a bench. The inquiry
          quoted the number without the conditions, which turns a careful measurement into a claim it
          was never making.
        choices:
          - The most the pads can hold, at the pressure and temperature she measured
          - The force the pads apply whenever the brake is on
          - The retardation the cage will reach when the brake is applied
          - The energy the pads can absorb before they fade
        answer: The most the pads can hold, at the pressure and temperature she measured
        rebuttals:
          - Below its limit a friction contact supplies only what is asked of it, which is usually less.
          - A retardation needs the mass and the tension as well, and those change through a wind.
          - How much heat a pad can take is a separate property, measured a different way entirely.

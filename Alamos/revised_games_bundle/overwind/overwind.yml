        rebuttals:
          - Weight decides the tension and says nothing about how the rope responds to being pulled.
          - Returning to length is what makes it elastic rather than what gives it a period.
          - Coils on the drum are supported by the drum, and the stretch that matters is in the hanging part.
  # ---------------------------------------------------------------- day 6
  - title: 'What happens when a moving load is stopped?'
    objective: 'Use momentum and impulse to find forces that static load calculations miss, and decide which measurements are trustworthy enough for the safety case.'
    stake: >-
      Monday. Two bolts at the mine's ore tip have sheared even though the standing load was inside its
      rating. That is a warning for the lift too: moving mass can create forces a static calculation
      never sees. Today you follow momentum through a real failure, then decide whether the field
      measurements used in the safety case can actually be trusted.
    takeaway: A stream of mass arriving at a rate makes a steady force, and no single load in it accounts for that force.
    segue: >-
      The bolts failed because the design counted weight but not momentum. The same lesson matters
      anywhere a moving cage must be stopped. One number used in every force calculation is still
      assumed rather than checked: gravity. Tomorrow Sokol measures it at the top and bottom of the
      1,240-metre shaft.
    stops:
      - group: TIP
        task: 'Find the force created when a continuous stream of ore is accelerated by the belt'
        title: 'Why did the belt-drive bolts shear?'
        at: belt-drive
        reason: >-
          The belt drive failed even though the standing load was within its rating. Lindqvist needs the
          missing dynamic force identified before the same mistake is allowed into any safety
          calculation on the lift.
        concept: Impulse as the integral of a force over time
        place: Tip and Conveyor
        scene: >-
          Ore falls onto the conveyor at 320 tonnes an hour with no forward speed. The belt has to
          accelerate every kilogram to 2.5 metres a second as it lands. That continuous change of
          momentum is a force the old static calculation never included.
        guide: >-
          You build the working a line at a time. Consider the ore that lands in a short interval:
          it arrives with no forward speed and leaves with the belt's. Something has to have given it
          that momentum, and dividing the momentum given by the interval is the force. The rate has
          to be in kilograms a second before any of this works.
        background:
          - >-
            Why this is not the weight of the ore on the belt. The weight is carried by the idlers and
            acts downward. The force computed here is horizontal, it exists only while ore is
            arriving, and it is what the drive has to supply on top of everything else.
          - >-
            Why a stream is not a series of loads. A four-tonne skip tipped into a bin is one event
            with one impulse. The same ore spread over an hour arrives continuously. What the
            drive feels is not a series of jolts. It is a steady force equal to the rate times the
            speed change. Sizing the drive from the loads misses it entirely.
          - >-
            What the vertical part does. The ore also falls about three and a half metres before it
            lands, arriving at over eight metres a second downward, which the belt and its idlers stop.
            That is a larger force than the horizontal one. It is carried by the structure rather
            than by the drive. That is why the drive trips and the frame does not bend.
        assumes:
          - a force acting for a time changes momentum by their product
        takeaway: A mass rate times a speed change is a force, and it is what a drive feels from anything arriving continuously.
        format: DERIVE
        question: 'What horizontal force does the moving ore add to the belt drive?'
        answerText: >-
          About 222 N. The rate is 88.9 kg a second and the speed change is 2.5 m/s, so the force is
          their product.
        why: >-
          The force is about 222 newtons. Every kilogram of ore that lands has to be brought up to
          belt speed. That needs a momentum of 2.5 kilogram metres a second per kilogram. And 88.9
          kilograms land every second. Dividing the momentum given per interval by the interval leaves
          the rate times the speed change, with the interval cancelling. That is why the answer does
          not depend on how the interval is chosen. It is a modest force and it is one nobody had
          included at all.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: J = ∫F dt = Δp
          startNote: 320 tonnes an hour arriving with no forward speed, onto a belt running at 2.5 m/s
          goal: the horizontal force on the belt drive, in newtons
          askRule: true
          rules:
            - conversion of the rate
            - impulse and momentum
            - taking the limit of the interval
            - substitution of the stated values
            - rearrangement

# Overwind — Kerrow No. 3, and twelve working days before the winder is re-licensed.
#
# Written to gamekit/tools/BOOK_TEMPLATE.md. The place is themes/overwind/site.js.
#
# AP Physics C: Mechanics, taught as derivations. Twelve of the thirty-six stops
# are DERIVE panels and they are the spine, in the order the mechanics has to
# arrive in rather than the order a shaft is walked:
#
#   day  1  the profile differentiated and integrated: acceleration, and depth
#   day  2  the drum's moment of inertia, as an integral over its mass
#   day  3  the tension at the drum, with the rope's own weight in it
#   day  4  the torque the wind needs
#   day  5  the work a brake does, as an integral of a force that changes
#   day  6  the force in a stream of ore, out of impulse
#   day  7  gravity at the shaft bottom, out of the shell theorem
#   day  8  the power at the worst instant of the cycle
#   day  9  the period of the cage bouncing on twelve hundred metres of rope
#   day 10  the energy stored in the stretch, and the travel it pays for
#   day 11  everything the brake has to absorb, rotation included
#   day 12  the revised profile, integrated, and what the saving really is
#
# `askRule: true` is on. In this course the name of the licence is the content:
# a student who gets the right line by differentiating when they should have
# integrated has not done mechanics, and the commonest lost point on the paper is
# a line that is algebraically legal and licensed by nothing.
#
# The argument: Marchetti holds that the cycle can come down twelve seconds and
# that every number she has says the plant is inside its limits. Otieno holds
# that a rope is not a wire — it is twelve hundred metres of steel with a period
# of its own — and that a shorter ramp is a fatigue question rather than a torque
# question. Marchetti is right on day 4: the torque is there, and the tension
# stays under limit. Otieno is right on day 10: the ramp she wants lands on the
# stretch of the rope, and the March overrun was that and not the brake.
#
# The timeline the cards are checked against:
#   eighteen years ago   the shaft deepened to 1,240 m; the drum re-roped
#   last March           an emergency stop — the descending cage travelled 1.6 m
#                        after the drum had stopped, and came to rest below the
#                        inset landing, on a brake applied on time
#   the inquiry          blamed the pad friction, measured cold on the bench
#   now                  twelve working days to the inspector's visit
#   day 13               a trial wind, with the inspector in the winder house
#   the licence          decides whether 41 men a shift ride a faster cycle

theme:
  id: overwind
  title: Overwind
  subtitle: 'Mine Lift Safety Engineer · Kerrow Mine No. 3, twelve days to the inspection'

groups:
  - id: BANK
    code: BANK
    name: The Bank
    color: '#4f7fa8'
    desc: The top landing, and the profile every wind is driven to.
    defaultLeader: ubah
    milestones: [Read the profile, Differentiate it, Integrate it back, Ready to hand over]
  - id: WIND
    code: WIND
    name: Winder House
    color: '#c2703f'
    desc: A drum, a motor and a brake, and everything that turns with them.
    defaultLeader: marchetti
    milestones: [Weigh the drum, Take the inertia, Find the torque, Ready to hand over]
  - id: ROPE
    code: ROPE
    name: Rope Shop
    color: '#8a8f4a'
    desc: Twelve hundred metres of steel that weighs more than what it carries.
    defaultLeader: otieno
    milestones: [Measure the rope, Take the tension, Find its period, Ready to hand over]
  - id: CAGE
    code: CAGE
    name: Shaft and Brake House
    color: '#6f6a86'
    desc: What the cage does, what stops it, and where the energy goes.
    defaultLeader: rahimi
    milestones: [Draw the body, Do the work, Absorb the energy, Ready to hand over]
  - id: TIP
    code: TIP
    name: Tip and Conveyor
    color: '#8a5f3f'
    desc: Ore in a stream rather than in a lump, and the force a stream makes.
    defaultLeader: lindqvist
    milestones: [Weigh the stream, Take the impulse, Close the ledger, Ready to hand over]
  - id: GRAV
    code: GRAV
    name: Gravity Station
    color: '#3f8f7a'
    desc: Three hundred metres out on the bench, where g is measured rather than assumed.
    defaultLeader: sokol
    milestones: [Level the meter, Read the drift, Take the difference, Ready to hand over]

roster:
  - id: marchetti
    name: Delia Marchetti
    role: Winding Engineer
    division: WIND
    bio: |
      Responsible for the winder, which means responsible for the only machine on
      this site that carries people. She has driven the proposal to take twelve
      seconds out of the wind cycle for two years, and she has the arithmetic for
      every part of it.

      Her argument is that the plant is nowhere near its limits and that the
      caution here is inherited rather than computed. The motor has the torque,
      the drum has the inertia to smooth it, the rope has four times the tension
      it will see. She has written all three down and nobody has checked them.

      Her limit is that every number she has is a steady-state number. A rope
      with a period of its own does not appear anywhere in her calculation,
      because nothing in the plant handbook has a period.
    quiz:
      - q: Why does Marchetti regard the present cycle time as inherited rather than justified?
        a: Its margins were never computed against what the plant can do
        wrong:
          - The original winder was replaced eighteen years ago and its limits no longer apply
          - Cycle times at this depth are set by regulation and not by engineering
          - The inquiry into the March overrun required a slower cycle as a condition
  - id: anand
    name: Ruth Anand
    role: Winder Driver
    division: WIND
    bio: |
      Drives the winder. Twelve years of it, four winds an hour, and the only
      person here who knows what the machine feels like when it is doing what the
      profile says it is doing.

      She was driving in March. She applied the emergency brake at the mark, on
      time, and the cage at depth went on travelling after the drum had stopped.
      The inquiry accepted that she had done everything right, which she says is
      not the same as anybody explaining what happened.

      Her limit is that what she has is a feel for the machine and no instrument.
      She says the rope talks back on a hard ramp, and there has never been
      anything on the winder that would record it.
    quiz:
      - q: Why is Anand unsatisfied by an inquiry that cleared her?
        a: Being cleared says who was not at fault, not what moved the cage
        wrong:
          - The inquiry's finding on the pad friction was never published in full
          - She believes the brake mark chalked on the drum flange is in the wrong place
          - A driver cleared once is examined again after any second incident
  - id: otieno
    name: Samuel Otieno
    role: Chief Rope Examiner
    division: ROPE
    bio: |
      Examines the winding rope, which at this shaft is twelve hundred and forty
      metres of locked-coil steel weighing about eleven tonnes. It is heavier
      than everything it lifts.

      He is careful about how he puts it. Marchetti is not wrong about the
      torque, and nobody here is careless. His point is narrower: a rope is not a
      link in a diagram, it is a spring with mass, and a spring with mass has a
      period. Drive it with a ramp about as long as that period and the cage
      arrives at the bank still moving.

      His limit is that he can compute the period and has never measured it. The
      instrument that would settle it costs about what the shaft spends on lamps
      in a year, and it has been refused twice.
    quiz:
      - q: Why does Otieno say the rope's stiffness matters to a braking calculation?
        a: A stretched rope gives its energy back, so the cage keeps moving
        wrong:
          - A stiffer rope transmits more of the brake's force to the cage than a slack one
          - Rope stiffness changes the tension at the drum and therefore the braking force available
          - The rope's stretch is the quantity every crawl and landing margin at this shaft is set from
  - id: nowak
    name: Kit Nowak
    role: Rope Splicer
    division: ROPE
    bio: |
      Splices and re-caps the rope, and keeps the record of every metre of it.
      The rope is shortened at the cappel every six months, which changes its
      length and therefore everything that depends on its length.

      What Nowak knows and nobody has asked for is that the rope has not been the
      same object for two years. It is forty metres shorter than it was, which
      makes it stiffer, which moves its period.

      The limit is that the record is a length and a date. Nothing in it says
      what the change did to anything else, because nothing in the shop's remit
      has ever needed to know.
    quiz:
      - q: Why does shortening the rope at the cappel change more than its length?
        a: The same steel in a shorter length is stiffer, so the cage bounces faster
        wrong:
          - A shorter rope weighs less, which lowers the tension at the drum and the braking force
          - Splicing changes the construction where the joint is and reduces the rope's breaking load
          - The drum then holds fewer coils, which changes its moment of inertia
  - id: ubah
    name: Grace Ubah
    role: Banksman
    division: BANK
    bio: |
      Runs the bank, which is the top landing and the place every wind ends.
      Signals the winder, loads the cage, counts the men on and the men off, and
      has the authority to stop a wind by lifting a handle.

      Her subject is the profile: how fast the cage is going at each moment of a
      wind, which she reads as a shape rather than as a table. She can tell you
      where the ramps are and how long the crawl at the end lasts, because she is
      standing on the landing when it arrives.

      Her limit is that she sees one end of a wind. What the cage does at the
      inset twelve hundred metres down arrives as a bell signal.
    quiz:
      - q: Why does Ubah insist the crawl at the end of a wind is not wasted time?
        a: It is the margin between a controlled stop and an uncontrolled one
        wrong:
          - The men waiting at the surface need it to unhook the landing gate before the cage arrives
          - It is the interval the winder driver uses to read the depth indicator
          - Regulations require a fixed low-speed section at the end of every wind
  - id: halloway
    name: Tom Halloway
    role: Onsetter
    division: BANK
    bio: |
      Works the inset at the shaft bottom, twelve hundred and forty metres down.
      Loads the cage, signals the bank, and is the other end of every wind Ubah
      starts.

      He has a working knowledge of the shaft nobody upstairs has: which levels
      make water, where the guides are worn, and how the cage behaves in the
      first seconds after it leaves. He says the start of an upward wind is the
      part that has changed since March.

      His limit is that he cannot be heard. The signal system carries codes
      rather than sentences, and the telephone at the inset has been out since
      the spring.
    quiz:
      - q: Why is Halloway's account of the start of a wind hard to act on?
        a: The signal system carries fixed codes and no sentences
        wrong:
          - Observations from below ground are not admissible in a licence submission
          - The inset has no clock synchronised with the winder house, so nothing he times can be compared
          - He is at the bottom of the shaft, where the cage is moving too slowly to observe
  - id: rahimi
    name: Aziz Rahimi
    role: Shaft Engineer
    division: CAGE
    bio: |
      Responsible for the shaft, the cage, the guides and the arrestors above the
      bank. The arrestors have never been used. What happened in March happened at
      the other end of the shaft, where there is nothing above the landing and a
      cage that goes past it goes into the sump.

      His interest is in where energy goes. A cage coming up at ten metres a
      second with four tonnes in it holds a great deal of it, and every joule has
      to be somewhere afterwards — in the pads, in the arrestors, or in the
      building.

      His limit is that the arrestors are a single-use answer to a question nobody
      has closed. They are the plant's whole answer to a cage that does not stop
      where it should, and they exist at one end of the shaft only.
    quiz:
      - q: Why does Rahimi think the March stop left something unexplained?
        a: Energy the brake was credited with taking out went somewhere else
        wrong:
          - The arrestors were installed after the shaft was deepened and never re-rated
          - The cage's own position recorder was out of calibration on the day
          - The inquiry examined the drum and the pads and never examined the guides the cage runs on
  - id: craig
    name: Iona Craig
    role: Brake Fitter
    division: CAGE
    bio: |
      Fits and tests the brake. Two sets of pads on the drum flanges, held on by
      weights and lifted by oil, so a loss of pressure applies the brake rather
      than releasing it.

      She measured the pad friction for the inquiry. She measured it on the
      bench, cold, at a known pressure, and she wrote all three of those
      conditions on the certificate. The inquiry quoted the number and not the
      conditions.

      Her limit is that a brake is only measurable in pieces. What she can put a
      figure on is a pad against a plate; what nobody can put a figure on is that
      pad on a hot drum at the end of a wind.
    quiz:
      - q: Why does Craig object to how her friction figure was used?
        a: It was measured cold on a bench and quoted for a wind
        wrong:
          - The figure was for one pad and the drum carries two sets
          - Her certificate gave a range and the inquiry used the middle of it
          - The measurement was taken before the last re-lining of the pads and was never repeated
  - id: lindqvist
    name: Bart Lindqvist
    role: Tip and Conveyor Foreman
    division: TIP
    bio: |
      Runs the tip, the bins and the conveyor that takes ore off the shaft and up
      to the plant. Nine hundred tonnes a shift, arriving in loads and leaving as
      a stream.

      His problem is that the two are not the same thing. A skip tipping four
      tonnes into a bin is one event; the belt that carries it away feels a
      steady force from ore landing on it continuously, and the drive was sized
      by somebody who treated the second as though it were the first.

      His limit is that the weightometer on the belt is the only measurement he
      has, and it reads tonnes an hour rather than newtons.
    quiz:
      - q: Why can a belt drive be undersized while every load on it is within limit?
        a: A stream arriving continuously makes a steady force of its own
        wrong:
          - The weightometer averages over a whole minute, which hides the peaks inside it
          - Loads arriving at intervals are heavier than the same ore spread out
          - Belt tension rises with the length of the run rather than with the load
  - id: osei
    name: May Osei
    role: Weightometer Technician
    division: TIP
    bio: |
      Calibrates the weightometer, which is the belt's own scale: a weighed
      length of belt, a speed and an arithmetic unit that turns them into tonnes
      an hour.

      She is exact about what it reports. It gives a mass per unit length times a
      speed, which is a mass a second, and the plant reads it as though it were a
      mass. Both are useful and they are not interchangeable.

      Her limit is the calibration chain: a static weight on a short length of
      belt, extrapolated to a belt running at two and a half metres a second.
    quiz:
      - q: Why is the weightometer's reading a rate rather than a quantity?
        a: It multiplies the mass on a length of belt by the belt's speed
        wrong:
          - It integrates over a minute and reports the total for that minute
          - It weighs each skip load as it is tipped into the bin and adds those weights up
          - It counts belt revolutions and multiplies by a mass fixed at calibration
  - id: sokol
    name: Dr. Lena Sokol
    role: Geophysicist
    division: GRAV
    bio: |
      Runs the gravity station on the bench, three hundred metres out from the
      headframe, and has been measuring g at this site for four years — at the
      surface, and twice at the shaft bottom.

      Her subject is that this mine is an instrument. Nowhere else can a
      gravimeter be lowered a kilometre and a quarter into rock, and the
      difference between the two readings says something about the density of
      what is above it that no surface survey can.

      Her limit is that the shaft is a working shaft. A reading at the inset
      needs the winding stopped, and she has been given that twice in four years.
    quiz:
      - q: Why is a gravity reading taken at the shaft bottom worth more than one at the surface?
        a: Their difference constrains the density of the rock between them
        wrong:
          - Readings underground are unaffected by weather and are therefore more precise
          - The shaft bottom is closer to the centre of the earth, where g is largest
          - A single reading cannot be corrected for latitude unless a second one is taken with it
  - id: adebayo
    name: Femi Adebayo
    role: Survey Assistant
    division: GRAV
    bio: |
      Runs the levels and the drift checks for the gravity station. A gravimeter
      is a spring, and a spring creeps, so a reading is only usable if the same
      station is re-read at the end of the day.

      What he keeps is the correction chain: the elevation of each station, the
      time of each reading, and the reference station the whole set is tied back
      to. Without it the survey is a list of numbers with no zero.

      His limit is the shaft-bottom station, whose elevation is known from the
      shaft's own measurements rather than from a level run, and those are
      eighteen years old.
    quiz:
      - q: Why does Adebayo re-read the reference station at the end of every day?
        a: The instrument's spring creeps, and the drift has to be removed
        wrong:
          - The reference station's own value changes with the tide and must be re-taken
          - Two readings of the same station give the random error of the instrument
          - It confirms that nobody moved or jarred the meter between one station and the next

glossary:
  - name: Mass
    aliases: [mass, masses]
    def: How much matter a body has, in kilograms.
  - name: Force
    aliases: [force, forces]
    def: What one body does to another to change its motion, in newtons.
  - name: Energy
    aliases: [energy]
    def: The quantity that is the same before and after, however it moves between motion, height and heat.
  - name: Shaft
    aliases: [shaft]
    def: The vertical hole down to the workings, 1,240 metres deep at this mine.
  - name: Cage
    aliases: [cage]
    def: The box people ride in, guided down the shaft on rails.
  - name: Skip
    aliases: [skip, skips]
    def: The bucket broken stone rides in, hung from the same rope as a cage when nobody is riding.
  - name: Bank
    aliases: [bank, the bank]
    def: The place at the surface where every upward journey ends.
  - name: Inset
    aliases: [inset]
    def: The loading place at the bottom of the shaft, 1,240 metres down.
  - name: Winding rope
    aliases: [winding rope, rope, ropes]
    def: The line that carries the cage, eleven tonnes of it at this shaft.
  - name: Cappel
    aliases: [cappel]
    def: The fitting that grips the rope end and hangs the cage off it.
  - name: Drum
    aliases: [drum]
    def: The turning cylinder the rope winds on and off.
  - name: Sheave
    aliases: [sheave, sheave wheel]
    def: The wheel at the very top of the headframe that the rope runs over.
  - name: Headframe
    aliases: [headframe]
    def: The steel structure over the shaft that holds the wheels, thirty-two metres of it here.
  - name: Winder
    aliases: [winder, winding engine]
    def: 'The machine that turns the drum: a motor, a gearbox and a brake.'
  - name: Wind
    aliases: [wind cycle, a wind, one wind]
    def: One journey of the cage from one landing to the other, and the pattern of speed it is driven to.
  - name: Ramp
    aliases: [ramp, ramps]
    def: The part of a journey when the speed is being changed on purpose.
  - name: Crawl
    aliases: [crawl]
    def: The slow last stretch before a stop, so that the stop is made under control.
  - name: Overwind
    aliases: [overwind, overwound]
    def: A journey that does not stop where it should and goes on past the bank.
  - name: Arrestor
    aliases: [arrestor, arrestors]
    def: A crushable frame above the shaft that takes an overwind and is destroyed doing it.
  - name: Brake
    aliases: [brake, brakes, braking]
    def: Two sets of pads that clamp the drum flanges, held on by weights and lifted by oil.
  - name: Weightometer
    aliases: [weightometer]
    def: The scale built into a conveyor belt, reporting tonnes an hour rather than tonnes.
  - name: Conveyor
    aliases: [conveyor, belt]
    def: The moving rubber band that carries ore up to the plant.
  - name: Torque
    aliases: [torque, torques]
    def: The turning effort about a line, given by a force times its distance from that line.
  - name: Moment of inertia
    aliases: [moment of inertia]
    def: How hard a body is to spin up, decided by how far its matter sits from the axis.
  - name: Momentum
    aliases: [momentum]
    def: Mass times velocity, and the thing a collision moves from one body to another.
  - name: Impulse
    aliases: [impulse]
    def: A force acting for a time, and the change of momentum it produces.
  - name: Work
    aliases: [work done, work]
    def: What a force does when the body it acts on moves, in joules.
  - name: Power
    aliases: [power]
    def: How fast work is being done, in watts.
  - name: Kinetic energy
    aliases: [kinetic energy]
    def: The energy a body has because it is moving.
  - name: Potential energy
    aliases: [potential energy]
    def: The energy a body has because of where it is, which can be got back.
  - name: Stiffness
    aliases: [stiffness, stiff]
    def: How much pull it takes to stretch something by one metre.
  - name: Period
    aliases: [period]
    def: How long one full swing of something back and forth takes.
  - name: Resonance
    aliases: [resonance, resonant]
    def: What happens when a push arrives in step with a swing, so each one adds to the last.
  - name: Damping
    aliases: [damping, damped]
    def: Whatever takes a swing out of something, so it dies away instead of continuing.
  - name: Jerk
    aliases: [jerk]
    def: How fast an acceleration is itself changing, which is what passengers notice.
  - name: Apparent weight
    aliases: [apparent weight]
    def: What the floor has to push with to carry a body, which changes while the floor is accelerating.
  - name: Free-body diagram
    aliases: [free-body diagram, free body]
    def: A drawing of one chosen body with everything acting on it and nothing else.
  - name: Gravimeter
    aliases: [gravimeter]
    def: A weighted spring in a case, so sensitive that it reads where it is standing to a millionth.
  - name: Milligal
    aliases: [milligal, milligals]
    def: The unit a gravity survey works in, a hundred-thousandth of a metre a second squared.
  - name: Shell theorem
    aliases: [shell theorem]
    def: The result that matter arranged in a sphere around you pulls you nowhere at all.

missions:
  # ---------------------------------------------------------------- day 1
  - title: 'Turn the faster plan into a real ride'
    objective: 'Turn the proposed curve into acceleration, speed, distance, and what the miners would actually experience.'
    stake: >-
      Monday. In twelve days a safety inspector must decide whether Kerrow can speed up the lift that
      carries miners 1,240 metres underground. Management says each trip can be twelve seconds faster,
      but the proposal is still only a curve on paper. Today you turn that curve into real motion and
      find which seconds are actually available.
    takeaway: A speed curve contains the acceleration and the distance, and neither is written on it.
    segue: >-
      The proposed curve is now a real ride: 7.2 metres a second after 57.6 metres, with a force the
      riders can feel through the cage. The saving can only come from the ramps and the final crawl.
      Tomorrow you test the first old number the faster plan relies on: how hard the eighteen-tonne drum
      is to spin.
    stops:
      - group: BANK
        task: 'Turn the proposed acceleration curve into speed and distance'
        title: 'Turn the faster ramp into a real ride'
        at: profile-desk
        reason: >-
          Ubah cannot post a faster trip until the curve on paper becomes two numbers: how fast the cage
          will be moving and how much of the shaft the ramp uses.
        concept: Position, velocity and acceleration as successive derivatives
        place: The Bank
        scene: >-
          At the top landing, Ubah lays the proposed acceleration curve beside the current one. The cage
          starts from rest, accelerates hardest at first, then tapers smoothly for twelve seconds.
          Before miners ride it, she needs to know where the cage is and how fast it is moving at the
          end.
        guide: >-
          You build the working a line at a time, and each line follows the one above. The ramp is stated as
          an acceleration. Speed comes from accumulating it, and distance from accumulating the
          speed. Both start from zero here, which fixes the constants. The taper is what makes this
          an integral rather than a multiplication.
        background:
          - >-
            Why the ramp tapers. An acceleration that switches on and off in a step is felt as a jolt. Everybody in the cage feels
            it. What a passenger notices is how fast the acceleration is changing. Tapering it to nothing at the end of the ramp is what makes a
            fast wind bearable.
          - >-
            Why the constant-acceleration formulas will not do. They are derived on the assumption
            that the acceleration does not change, and here it changes throughout. Using them with the peak value overstates the speed by a factor of two. Using the mean gets the
            speed right and the distance wrong.
          - >-
            What the two answers are for. The speed at the end of the ramp is what the rest of the
            cycle is driven from. The distance is what says whether the ramp fits. There are 1,240 metres of shaft, and the crawl at
            the top needs its share of them.
        assumes:
          - an acceleration is the rate at which a velocity changes
        takeaway: Integrating an acceleration gives a velocity, and integrating that gives a distance. Each integration needs its own starting value.
        format: DERIVE
        question: 'After twelve seconds of the proposed ramp, how fast is the cage moving and how far has it travelled?'
        answerText: >-
          7.2 metres a second, after 57.6 metres of rope. The speed is the area under the taper and
          the distance is the area under the speed.
        why: >-
          The cage reaches 7.2 metres a second, having wound 57.6 metres. The ramp is stated as an
          acceleration that falls linearly to nothing. The speed at any instant is the accumulated
          acceleration up to then. The distance is the accumulated speed. Each integration brings a
          constant. Both are fixed by the cage starting from rest at the landing. Using the peak
          acceleration for the whole twelve seconds would give 14.4 metres a second. That is twice
          what the winder is being asked for.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: a = dv/dt, with a(t) = 1.2·(1 − t/12)
          startNote: metres a second squared, with t in seconds from the start of the ramp; the cage starts from rest
          goal: the speed at t = 12 s and the rope wound by then, in metres
          askRule: true
          rules:
            - integration with respect to time
            - the constant from the starting value
            - evaluation at the two ends
            - differentiation
            - rearrangement
          steps:
            - ask: Get the velocity from the acceleration.
              answer: 2
              candidates:
                - text: v(t) = 1.2 − t/12
                  rule: differentiation
                  why: >-
                    Nothing has been integrated. That is the acceleration with its bracket multiplied
                    out, and its units are still metres a second squared.
                - text: v(t) = 1.2t − 0.1t²
                  rule: integration with respect to time
                  survives: true
                  why: >-
                    The taper has been integrated as though it were 1.2·(1 − t/6). The shape is right
                    and the speed at the end comes out at 0, which reads as a cage that has stopped
                    rather than as an arithmetic slip.
                - text: v(t) = 1.2t − 0.05t²
                  rule: integration with respect to time
                - text: v(t) = 1.2t − 0.05t² + v₀
                  rule: the constant from the starting value
                  why: >-
                    The constant is right to write down and it is zero here, because the cage is at
                    rest at the landing. Carrying it as an unknown leaves the next line unusable.
            - ask: Evaluate the velocity at the end of the ramp.
              answer: 0
              candidates:
                - text: v(12) = 14.4 − 7.2 = 7.2 m/s
                  rule: evaluation at the two ends
                - text: v(12) = 1.2 × 12 = 14.4 m/s
                  rule: evaluation at the two ends
                  survives: true
                  why: >-
                    The taper has been ignored and the peak acceleration applied for the whole ramp.
                    It is exactly twice the truth, and 14.4 metres a second is a believable winding
                    speed for a shaft this deep.
                - text: v(12) = 1.2 × 12 − 0.05 × 12 = 13.8 m/s
                  rule: evaluation at the two ends
                  why: >-
                    The second term has not been squared. It is small enough that the answer looks
                    like the first one with a correction applied.
                - text: v(12) = 0.6 × 12² = 86.4 m/s
                  rule: rearrangement
                  why: >-
                    That is the distance expression evaluated as though it were the speed. The units
                    are metres, not metres a second.
            - ask: Get the distance from the velocity.
              answer: 1
              candidates:
                - text: y(t) = 1.2t² − 0.05t³
                  rule: integration with respect to time
                  why: >-
                    Neither term has picked up the divisor that integration brings: t integrates to
                    t²/2 and t² to t³/3, so both coefficients are too large.
                - text: y(t) = 0.6t² − t³/60
                  rule: integration with respect to time
                - text: y(t) = 0.6t² − 0.05t³
                  rule: integration with respect to time
                  survives: true
                  why: >-
                    The first term is right and the second has been integrated without dividing by
                    three. It gives 0.0 m at the end of the ramp — a cage that has gone nowhere — and
                    the two terms happen to cancel exactly, which reads like a result.
                - text: y(t) = 1.2 − 0.1t
                  rule: differentiation
                  why: >-
                    That is the velocity differentiated rather than integrated. Going the wrong way
                    twice returns the acceleration.
            - ask: Evaluate the distance at the end of the ramp.
              answer: 3
              candidates:
                - text: y(12) = 86.4 − 28.8 = 57.6 m, and the mean speed check gives 43.2 m
                  rule: evaluation at the two ends
                  survives: true
                  why: >-
                    The arithmetic is right and the check is wrong, which is worse than the reverse:
                    the mean of a curve that starts at zero and taper-ends at 7.2 is not half of 7.2,
                    so a disagreement here sends somebody back to correct a line that was right.
                - text: y(12) = 0.6 × 144 = 86.4 m
                  rule: evaluation at the two ends
                  why: >-
                    Only the first term has been evaluated. The second is nearly a third of the total
                    and is the part the taper contributes.
                - text: y(12) = 7.2 × 12 = 86.4 m
                  rule: rearrangement
                  why: >-
                    Final speed times the time, which would be right only if the cage had travelled
                    the whole ramp at the speed it finished at.
                - text: y(12) = 86.4 − 28.8 = 57.6 m
                  rule: evaluation at the two ends
          commit: Commit the derivation
      - group: CAGE
        task: 'Find the support force needed to accelerate the loaded cage'
        title: 'How hard must the rope pull on the loaded cage?'
        at: body-bench
        reason: >-
          Rahimi wants the first force number the safety case actually needs: how hard the rope must
          pull on the loaded cage during the strongest acceleration.
        concept: 'Free-body thinking and the support force on an accelerating body'
        place: Shaft and Brake House
        scene: >-
          The cage and its riders have a total mass of 4,000 kilograms. At the start of the faster ramp
          they accelerate upward at 1.2 metres a second squared. Rahimi asks for the upward rope tension
          needed just for the cage and riders, before the weight of the long rope itself is added later.
        guide: >-
          Draw one body around the loaded cage and its riders. Two external forces act on that body: the
          rope pulls upward and gravity pulls downward. Their difference is the net upward force. The
          rope's own eleven tonnes are not part of this body; they enter later when you calculate the
          tension at the drum.
        assumes:
          - a net force upward means the upward forces exceed the downward ones
        takeaway: 'The rope must support the loaded cage''s weight and also provide the extra force for its upward acceleration. The rope''s own weight is added only when the larger hanging system is considered.'
        format: BALLPARK
        question: 'How much upward force must the rope exert on the loaded cage at peak acceleration?'
        estimate:
          prompt: >-
            Treat the loaded cage and its riders as one body. The rope pulls up, gravity pulls down, and
            the cage accelerates upward at the peak of the proposed ramp.
          question: 'How much upward force must the rope exert on the loaded cage at peak acceleration?'
          relationship: >-
            Net force equals mass times acceleration, so the rope tension is the mass times gravity plus
            the upward acceleration.
          labels:
            - 4000 kg  (cage and men, the chosen body)
            - 9.81 m/s²  (gravity)
            - 1.2 m/s²  (peak acceleration of the ramp)
            - 11000 kg  (the winding rope, which is not this body)
            - 7.2 m/s  (the speed at the end of the ramp)
          values: [4000, 9.81, 1.2, 11000, 7.2]
          slots: 3
          template: '{0} × ({1} + {2})'
          formula: a*(b+c)
          correct: [0, 1, 2]
          target: 44040
          tolerance: 500
          units: N
          solution: '4000 × (9.81 + 1.2) = 44,040 N of rope tension on the loaded cage.'
          explanation: >-
            The rope's eleven tonnes are not inside the chosen body, so they do not belong in this first
            support-force calculation. They matter later when you ask for the tension at the drum. The
            final speed also does not enter a force calculation.
        why: >-
          The rope must pull upward with about 44 kilonewtons on the loaded cage and riders. For this
          body, T − mg = ma, so T = m(g + a). This is only the support force for the cage and its
          occupants. It is not yet the maximum tension in the winding rope, because the long hanging
          rope has its own weight. That larger tension is the question you reach on day three.
      - group: WIND
        task: 'Find which parts of a trip can actually be shortened'
        title: 'Where can twelve seconds safely come from?'
        at: winder-desk
        reason: >-
          Marchetti wants twelve seconds removed from every trip, but Ubah will not let the inspector
          see a saving that quietly changes the shaft depth or the permitted top speed.
        concept: Position, velocity and acceleration as successive derivatives
        place: Winder House
        person: true
        scene: >-
          The current trip and the proposed trip are side by side. The shaft depth, full-speed limit,
          loading time, and signals stay fixed. Only the acceleration ramps and the slow final approach
          are being changed.
        guide: >-
          All four options are places a cycle could be shortened. Ask of each what it would change about the curve on the desk. Then ask which parts of that curve the
          depth of the shaft has already fixed. Only one of the four has any seconds in it that are not already spoken for.
        assumes:
          - a journey is made of a ramp up, a run at speed, a ramp down and a slow approach
        takeaway: A cycle time is the sum of parts fixed by different things. Only some of them are anybody's to choose.
        format: CHOICE
        question: 'Which parts of the trip can actually supply Marchetti''s twelve-second saving?'
        why: >-
          They come out of the ramps and the crawl. The full-speed section is fixed by the depth of the shaft
          and the speed the winder may run at. Shortening it means winding faster, not accelerating
          harder. The loading time at each landing is fixed by how long men take to get on and off.
          What is left is how hard the cage is accelerated, and how long it spends creeping into the
          landing. That is why this proposal is a proposal about acceleration and about margin.
        choices:
          - The ramps and the crawl at the end
          - The full-speed run between the landings
          - The loading time at each landing
          - The signalling between the bank and the inset
        answer: The ramps and the crawl at the end
        rebuttals:
          - The full-speed run is the depth divided by the speed, and both are set elsewhere.
          - Loading is set by how long it takes men to get on and off, which no winder controls.
          - Signalling happens while the cage is standing, and shortening it changes nothing about the journey.
  # ---------------------------------------------------------------- day 2
  - title: 'Can we trust the machine''s old numbers?'
    objective: 'Replace old-file values with physics from the real drum, and recover the only record that watched the cage in March.'
    stake: >-
      Tuesday. The faster plan relies on an equipment file written eighteen years ago, but that file
      already has the rope length wrong by forty metres. If one old number is wrong, every torque and
      stopping calculation built on it is suspect. Today you recalculate the drum from the machine
      itself and pull out the only instrument record of the March stop.
    takeaway: How hard something is to spin up depends on where its mass sits, not on how much of it there is.
    segue: >-
      The drum's inertia is now based on the real machine, not an old file, and the March cage-position
      trace is on the board. The next number the old submission underestimated is the pull at the top of
      a rope that weighs more than the loaded cage it carries.
    stops:
      - group: WIND
        task: 'Recalculate the drum''s inertia from its actual dimensions'
        title: 'How hard is the eighteen-tonne drum to spin?'
        at: drum
        reason: >-
          Every torque calculation depends on the drum's rotational inertia, and the only value on file
          is eighteen years old. Marchetti wants a number taken from the machine that is actually
          turning today.
        concept: Moment of inertia as an integral over the mass
        place: Winder House
        takesAsRead:
          - Angular velocity and angular acceleration
        scene: >-
          The winding drum is an eighteen-tonne steel cylinder, 2.1 metres to its outside and 1.9 metres
          to its bore. Instead of trusting the old file, you use those dimensions to find how strongly
          the drum resists being spun up.
        guide: >-
          You build the working a line at a time. The quantity wanted is a sum over the whole body. Each piece contributes its mass times the square
          of its distance from the axis. So the first decision is what a piece is. Choose it so that
          every part of the piece is the same distance out. The integral then becomes one in a
          single variable.
        background:
          - >-
            Why a thin shell is the right element. Mass at different radii contributes differently,
            so an element has to be all at one radius. A thin cylindrical shell of radius r and thickness dr is exactly that. Its mass is the total mass
            times its share of the cross-sectional area.
          - >-
            Why the fourth powers collapse. Integrating r³ gives r⁴/4. So the shells leave a difference of fourth powers over a difference of
            squares. That factors, because a difference of squares is what a difference of fourth
            powers is made of. What survives is
            the mean of the two squared radii, which is why the answer looks so simple.
          - >-
            Why this is not the mass. A solid cylinder of the same eighteen tonnes and the same outside radius has an inertia of 39,700
            kilogram metres squared. This one comes out at 72,200. The solid drum's mass is spread
            inward towards the axis, where it counts for little. The
            two machines behave nothing alike and weigh the same.
        assumes:
          - the moment of inertia of a small mass is that mass times the square of its distance from the axis
        takeaway: A moment of inertia is an integral over the body. Two bodies of one mass can differ in it by a factor of two.
        format: DERIVE
        question: 'What is the drum''s moment of inertia about its own axis?'
        answerText: >-
          About 72,200 kg·m². The shells give I = ½m(R₁² + R₂²), which is 9,000 × (3.61 + 4.41).
        why: >-
          The drum's inertia is about 72,200 kilogram metres squared. Taking a thin shell as the element makes
          the integral possible. Every part of a shell is the same distance from the axis. The
          shell's mass is the total mass times its share of the cross-section, so the integral is in
          r alone. Integrating r³ between the two radii leaves a difference of fourth powers. That
          factors into the mean of the squares. A solid drum of the same mass would come out at
          about half of this.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: I = ∫r² dm
          startNote: m = 18,000 kg between R₁ = 1.9 m and R₂ = 2.1 m, of uniform steel, turning about its axis
          goal: the moment of inertia about the axis, in kilogram metres squared
          askRule: true
          rules:
            - the choice of the mass element
            - substitution of the element
            - integration with respect to radius
            - factorising a difference of powers
            - substitution of the stated values
            - rearrangement
          steps:
            - ask: Choose the element of mass.
              answer: 1
              candidates:
                - text: a flat slice of thickness dz along the axis
                  rule: the choice of the mass element
                  why: >-
                    Every slice contains matter at every radius from the bore to the outside, so the
                    r² inside the integral has no single value on it and cannot be taken out.
                - text: a thin cylindrical shell of radius r and thickness dr
                  rule: the choice of the mass element
                - text: a wedge of angle dθ cut through the whole thickness of the wall
                  rule: the choice of the mass element
                  survives: true
                  why: >-
                    A perfectly good element and it has the same defect: a wedge spans every radius.
                    The integral in θ then comes out to 2π and looks like progress, while the r² is
                    still inside it.
                - text: the whole wall at its mean radius of 2.0 m
                  rule: substitution of the element
                  survives: true
                  why: >-
                    All the mass placed at one radius gives 72,000 — two hundred out of 72,200, which
                    is within a third of a per cent here and is wrong for a reason that matters: it
                    happens to work only because this wall is thin.
            - ask: Write the element's mass in terms of r.
              answer: 3
              candidates:
                - text: dm = m·dr/(R₂ − R₁)
                  rule: substitution of the element
                  survives: true
                  why: >-
                    Mass shared out evenly across the thickness rather than by area. Outer shells hold
                    more steel than inner ones, and this gives 71,900 — close enough to pass, and it
                    is the wrong model of the body.
                - text: dm = m·2πr·dr
                  rule: substitution of the element
                  why: >-
                    That is an area rather than a fraction of the mass, so the units come out as
                    kilogram metres squared before the r² is even applied.
                - text: dm = m·r·dr/(R₂² − R₁²)
                  rule: substitution of the element
                  why: >-
                    The factor of two from the area of an annulus is missing, so the total mass of all
                    the shells is half the drum.
                - text: dm = 2m·r·dr/(R₂² − R₁²)
                  rule: substitution of the element
            - ask: Do the integral.
              answer: 0
              candidates:
                - text: I = 2m/(R₂² − R₁²) · [r⁴/4] from R₁ to R₂
                  rule: integration with respect to radius
                - text: I = 2m/(R₂² − R₁²) · [r³/3] from R₁ to R₂
                  rule: integration with respect to radius
                  survives: true
                  why: >-
                    The r² and the r from the element have not been combined before integrating, so
                    the cube has been integrated instead of the fourth power. The units give it away
                    and the number, 71,000, does not.
                - text: I = 2m/(R₂² − R₁²) · [r⁴] from R₁ to R₂
                  rule: integration with respect to radius
                  why: >-
                    Integrating r³ brings a divisor of four. Without it the answer is four times too
                    large.
                - text: I = 2m·[r⁴/4] from R₁ to R₂
                  rule: rearrangement
                  why: >-
                    The normalising denominator has been dropped, which is the part that makes the
                    shells add up to the drum's actual mass.
            - ask: Simplify and put the numbers in.
              answer: 2
              candidates:
                - text: I = ½m(R₂² − R₁²) = 9,000 × 0.80 = 7,200 kg·m²
                  rule: factorising a difference of powers
                  survives: true
                  why: >-
                    A difference where a sum belongs. The factorisation of a difference of fourth
                    powers leaves the sum of the squares, and this answer is a factor of ten small in
                    a way nothing downstream would notice.
                - text: I = m(R₁² + R₂²) = 18,000 × 8.02 = 144,000 kg·m²
                  rule: substitution of the stated values
                  why: >-
                    The half has been lost. It comes from the four in the integration against the two
                    in the element.
                - text: I = ½m(R₁² + R₂²) = 9,000 × 8.02 = 72,200 kg·m²
                  rule: factorising a difference of powers
                - text: I = ½m·R₂² = 9,000 × 4.41 = 39,700 kg·m²
                  rule: substitution of the stated values
                  why: >-
                    That is a solid cylinder of the same mass and outside radius. It is the answer to
                    a different drum, and it is the figure in the handover file.
          commit: Commit the derivation
      - group: ROPE
        task: 'Decide which body carries the rope''s own weight'
        title: 'Where does the rope''s eleven tonnes belong?'
        at: cappel
        reason: >-
          The old force calculation put the rope's weight in the wrong place. Otieno wants the free-body
          diagram fixed before anyone uses it to claim the faster ride is safe.
        concept: Newton's second law as a vector statement
        place: Rope Shop
        scene: >-
          With the cage at the bottom, about eleven tonnes of rope hang from the drum. The old
          submission puts that weight into the cage's line and nowhere else. Otieno asks a simpler
          question first: which object is actually supporting that rope?
        guide: >-
          Four accounts of where the rope's weight is carried. Ask of each which body has been drawn round. A force belongs to a diagram rather than to a site. The
          distinction that decides it is between what hangs below a point and what is held above it.
          The answer changes as the cage moves.
        assumes:
          - a force appears in the equation of whichever body it acts on
        takeaway: A force belongs to whichever body it acts on. Choosing the body is the first move in every problem here.
        format: CHOICE
        question: 'Whose free-body diagram does the hanging rope''s weight belong in?'
        why: >-
          It belongs to the drum, through the tension at the top of the rope. Each point of the rope carries
          everything below it. So the tension grows from the cappel at the bottom to the drum at the
          top. The eleven tonnes is fully accounted for only at the drum. The cage carries nothing
          of it: the rope pulls up on the cage, not down. This is why the tension in the submission
          has to be a function of where the cage is.
        choices:
          - The drum's, through the tension at the top of the rope
          - The cage's, since the rope is attached to it
          - Nobody's, since the rope is neither the load nor the machine
          - The headframe's, since the sheave wheels take the whole weight
        answer: The drum's, through the tension at the top of the rope
        rebuttals:
          - The rope pulls up on the cage; the cage carries only itself and its load.
          - Eleven tonnes acts on something, and leaving it out of every diagram loses a third of the tension.
          - The sheave changes the direction of the rope's pull and does not decide what tension is in it.
      - group: BANK
        task: 'Read the only instrument record that watched the cage in March'
        title: 'What did the March recorder actually see?'
        at: profile-desk
        reason: >-
          Halloway kept the only trace that followed the cage itself during the March emergency stop. If
          the story is going to be solved, this record has to say exactly what it measured and nothing
          more.
        concept: Getting velocity and distance back by integrating an acceleration
        place: The Bank
        person: true
        scene: >-
          At the bottom landing, Halloway unrolls the March depth-recorder tape: one pen tracing cage
          position against time. The brake record watched the drum. This tape watched the cage. You need
          to pull every reliable fact from it before the two records are compared later.
        guide: >-
          Halloway is asking a fair question: how can one pen tell you four different things?
          Each thing the inquiry wanted has exactly one operation that would pull it out of a
          trace of position against time. The trick is knowing which direction to go.
          Differentiating takes a rate out of a position. Accumulating does the opposite, building
          a total out of a rate. One of the four is sitting on the paper already, with nothing
          left to do to it at all.
        assumes:
          - a trace of position against time contains every rate derived from it
        takeaway: A single record of position against time yields speed, acceleration and jerk by differentiating, and needs no other instrument.
        format: PROTOCOL
        task: 'Match each fact in the March trace to what that one recorder can establish.'
        scenarios:
          - How fast the cage was going as it approached the bank.
          - How hard it was being retarded in the last two seconds.
          - How far the cage went past the landing.
          - Whether the retardation was itself changing.
        choices:
          - Take the slope of the trace at that point.
          - Take the slope of the slope.
          - Read the difference between two positions off the paper.
          - Take the slope a third time.
        mapping: [0, 1, 2, 3]
        why: >-
          A position record contains everything derived from it. Speed is its slope. Retardation is the slope
          of the speed. How fast the retardation is changing is one slope further down. Three
          quantities, out of one pen. The distance past the landing is on the paper directly,
          because it is a difference of positions. Accumulating is the other way, and you need it
          when the record is a rate rather than a position. That is the case at the winder, where
          the tachometer reads speed.
  # ---------------------------------------------------------------- day 3
  - title: 'How hard is the rope really pulling?'
    objective: 'Find the maximum tension in the rope and what the proposed acceleration and stopping ramps do to the people riding the cage.'
    stake: >-
      Wednesday. The old safety calculation counted the cage but not the full weight of 1,240 metres of
      steel rope. Near the drum, that hanging rope weighs almost three times as much as the loaded cage.
      Today you find the true maximum pull and what the harder ramps would feel like to the miners below
      it.
    takeaway: The tension in a hoisting rope is a function of where the cage is, and its worst value is at the drum.
    segue: >-
      The rope stays inside its tension limit, so Otieno's objection is not that it will snap. But the
      harder ramp changes what riders feel, and Anand still says the rope 'talks back' when the machine
      is driven hard. Tomorrow you ask whether the motor can produce the faster motion at all.
    stops:
      - group: ROPE
        task: 'Find the maximum rope tension at the drum'
        title: 'What is the greatest pull on the rope?'
        at: rope-bench
        reason: >-
          Otieno blocked the faster plan until somebody calculated the tension where the rope carries
          the cage plus nearly its entire own weight. That worst point is at the drum with the cage near
          the bottom.
        concept: Tension in a rope that carries its own weight
        place: Rope Shop
        scene: >-
          The cage is starting upward from 1,240 metres down while almost the whole rope hangs below the
          drum. Otieno has the rope's mass per metre and Marchetti's peak acceleration on the board.
          This is the largest pull the rope is asked to carry in normal operation.
        guide: >-
          You build the working a line at a time. Draw round the cage and everything hanging with it. Then ask what has to be true of the pull at the
          top of that body. Two things go into it. One is the weight of what is hanging, which
          depends on how much rope is out. The other is the extra the acceleration needs. Note which way the acceleration points.
        background:
          - >-
            Why the worst case is at the bottom of the shaft. The rope carries its own weight, so the
            tension at any point is set by everything below that point. With the cage at the inset, everything below the drum is the whole rope plus the cage. With the cage
            at the bank it is almost nothing.
          - >-
            Why the acceleration multiplies rather than adds. The body has to be given a net upward
            force, and every kilogram of it needs its share. So the acceleration acts on the rope's eleven tonnes as well as on the cage's four. That is where
            two thirds of the extra tension comes from.
          - >-
            What the number is for. The rope's breaking load is about 1,600 kilonewtons. The statutory factor of safety at this depth is
            eight, which puts the working limit at 200.
            The figure in the submission is 39 kilonewtons. Both of those are true statements about
            different points on the same rope.
        assumes:
          - a rope's tension at a point carries everything hanging below that point
        takeaway: Tension at the drum is the hanging mass times gravity plus the acceleration, and the hanging mass includes the rope.
        format: DERIVE
        question: 'What is the tension at the drum as the loaded cage accelerates upward from the bottom?'
        answerText: >-
          About 166 kN. The hanging mass is 4,000 + 8.9 × 1,240 = 15,036 kg, and the tension is that
          times 9.81 + 1.2.
        why: >-
          The tension is about 166 kilonewtons, against the 39 in the submission. Drawing round the cage and
          the rope together makes the tension at the drum the only unknown force on that body. The
          second law then fixes it: the hanging mass times gravity, plus the same mass times the
          acceleration. The rope contributes eleven of the fifteen tonnes. Accelerating upward
          increases the tension, and decelerating reduces it. That is why the worst instant of a
          wind is the start of an upward one from the bottom.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: ΣF = ma, on the cage and the hanging rope together
          startNote: cage and load 4,000 kg, rope 8.9 kg a metre, 1,240 m hanging, accelerating upward at 1.2 m/s²
          goal: the tension at the drum, in kilonewtons
          askRule: true
          rules:
            - the choice of the body
            - the second law on that body
            - substitution of the hanging mass
            - substitution of the stated values
            - rearrangement
          steps:
            - ask: Choose the body and say what mass it has.
              answer: 2
              candidates:
                - text: the cage alone, 4,000 kg
                  rule: the choice of the body
                  survives: true
                  why: >-
                    A legitimate body, and the tension it gives is the tension at the cappel rather
                    than at the drum. It is 44 kN, it is the figure in the submission, and it is a
                    correct answer to a question nobody asked.
                - text: the cage and the drum, 22,000 kg
                  rule: the choice of the body
                  why: >-
                    The drum is not hanging from anything. Its bearings carry it, and putting it in
                    the body means accounting for those bearing forces as well.
                - text: the cage and the hanging rope, 4,000 + 8.9 × 1,240 kg
                  rule: the choice of the body
                - text: the whole rope and the cage together, 4,000 + 11,000 kg of steel
                  rule: the choice of the body
                  survives: true
                  why: >-
                    Nearly the same number and the wrong description: the rope on the drum is
                    supported by the drum and hangs from nothing. Here the two agree to within a
                    kilogram, and at the bank the same line would count eleven tonnes that are lying
                    in coils.
            - ask: Write the second law for that body.
              answer: 0
              candidates:
                - text: T − Mg = Ma
                  rule: the second law on that body
                - text: T + Mg = Ma
                  rule: the second law on that body
                  why: >-
                    Both forces cannot point the same way. The tension pulls up and the weight pulls
                    down, and as written the tension would come out negative.
                - text: T − Mg = 0
                  rule: the second law on that body
                  survives: true
                  why: >-
                    The static case, which is right while the cage hangs still and is exactly what the
                    submission has done. It loses 18 kN and every word of it is true of a stationary
                    wind.
                - text: T = Ma
                  rule: rearrangement
                  why: >-
                    The weight has gone. This is the equation for the same cage accelerating along a
                    level floor.
            - ask: Substitute the hanging mass.
              answer: 3
              candidates:
                - text: M = 4,000 + 8.9 = 4,008.9 kg

  # ---------------------------------------------------------------- day 4
  - title: 'Can the motor actually do it?'
    objective: 'Combine drum inertia and rope tension to find the torque the faster ride needs, then test the brake data the plan trusts.'
    stake: >-
      Thursday. A faster ride is meaningless if the winder cannot turn the loaded drum hard enough—or if
      its brake numbers only look safe on a cold test bench. Today you calculate the worst torque,
      compare it with the motor rating, and decide what the old brake measurement really proves.
    takeaway: A rotating machine needs torque for its own inertia and for the load, and they are separate terms.
    segue: >-
      The motor has enough torque. That clears the machine, but not the whole safety case. The plan
      still counts only the cage when it talks about energy, even though every trip also lifts hundreds
      of metres of heavy rope. Tomorrow you find where all that energy goes.
    stops:
      - group: WIND
        task: 'Calculate the motor torque at the hardest part of the upward ramp'
        title: 'Does the motor have enough torque?'
        at: winder-desk
        reason: >-
          Marchetti's faster plan only survives if the motor can turn the heavy drum against the rope's
          pull while also accelerating the drum itself. This is the machine-limit calculation she has
          been waiting for.
        concept: Torque, and the angular form of the second law
        place: Winder House
        scene: >-
          You now have the measured drum inertia, the maximum rope tension, the drum radius, and the
          proposed acceleration. Marchetti puts the motor's continuous torque rating beside them and
          asks for the worst required torque.
        guide: >-
          You build the working a line at a time. The drum is the body. Two torques act on it, the motor's and the rope's. Their difference is what
          spins it up. The angular acceleration is not given. It has to come from the cage's
          acceleration and the radius the rope leaves at. Watch which of the two torques opposes the other.
        background:
          - >-
            Why the load torque is the larger part. The rope pulls on the drum at 2.1 metres from the axis with 166 kilonewtons. That is 348 kilonewton
            metres before the drum is asked to change speed at all. The inertia term adds 41 on top
            of it. That is a tenth of the total, and the part that only exists while the ramp is
            running.
          - >-
            Why the two are tied. The rope does not slip on the drum. So the cage's speed is the drum's angular speed times the
            radius. The two accelerations are tied the same way. That is what turns one unknown into
            the other. It is the only place the radius does two different jobs in one line.
          - >-
            What the answer settles and what it does not. The motor is rated at 480 kilonewton metres continuous, so 389 is inside it with room to spare.
            Marchetti is right about the machine. Nothing in this calculation contains a period, a stretch or a rope that talks
            back, which is the argument that arrives on day nine.
        assumes:
          - a rope that does not slip ties the cage's acceleration to the drum's angular acceleration
        takeaway: The torque a wind needs is the load torque plus the inertia torque. The second is the smaller of the two.
        format: DERIVE
        question: 'What torque must the motor produce at the start of the upward trip, and is it inside the rating?'
        answerText: >-
          About 389 kN·m: 348 from the rope at 2.1 m and 41 from spinning the drum up at
          0.571 rad/s².
        why: >-
          The motor has to produce about 389 kilonewton metres. Two torques act on the drum. The angular form
          of the second law says their difference equals the inertia times the angular acceleration.
          So the motor's torque is the rope's plus that product. The angular acceleration comes from
          the rope not slipping: the cage's 1.2 metres a second squared over the 2.1 metre radius.
          The load term dominates. That is why a bigger drum makes the problem worse rather than
          better on both counts.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: τ_motor − T·R = I·α
          startNote: I = 72,200 kg·m², R = 2.1 m, T = 166 kN, and the cage accelerates at 1.2 m/s²
          goal: the motor torque at the start of the upward wind, in kilonewton metres
          askRule: true
          rules:
            - the angular second law
            - the no-slip relation
            - substitution of the stated values
            - rearrangement
            - comparison of magnitudes
          steps:
            - ask: Get the angular acceleration from the cage's acceleration.
              answer: 1
              candidates:
                - text: α = a·R = 1.2 × 2.1 = 2.52 rad/s²
                  rule: the no-slip relation
                  survives: true
                  why: >-
                    Multiplied where it should divide. The number is plausible for a drum this size,
                    and it inflates the inertia term by a factor of four and a half.
                - text: α = a/R = 1.2 ÷ 2.1 = 0.571 rad/s²
                  rule: the no-slip relation
                - text: α = a = 1.2 rad/s²
                  rule: the no-slip relation
                  why: >-
                    A linear acceleration is not an angular one. The units differ by a length, and the
                    radius is what converts between them.
                - text: α = v/R = 7.2 ÷ 2.1 = 3.43 rad/s²
                  rule: the no-slip relation
                  why: >-
                    That is the angular velocity at the end of the ramp, not the angular acceleration.
                    Its units are radians a second.
            - ask: Rearrange for the motor torque.
              answer: 2
              candidates:
                - text: τ_motor = I·α − T·R
                  rule: rearrangement
                  survives: true
                  why: >-
                    A sign slip that makes the rope help the motor rather than oppose it. It gives a

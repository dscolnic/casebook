    assumes:
    - the mark moves along the centre line
    takeaway: A displacement along one unit's axis is across another's, and each
      angle is recomputed from its own sides.
    format: BALLPARK
    question: Estimate the new down angle from the front bar.
    estimate:
      relationship: tan θ = opposite ÷ adjacent, so the angle is the arctangent 
        of the height over the new horizontal distance.
      prompt: The front bar is 6.2 m up. Its horizontal distance to the mark was
        9.4 m and the mark has moved 1.2 m downstage.
      question: Estimate the new down angle from the front bar.
      labels:
      - 6.2 m  (bar height above the mark)
      - 8.2 m  (new horizontal distance)
      - 9.4 m  (the old horizontal distance)
      - 1.2 m  (how far the mark moved)
      values: [6.2, 8.2, 9.4, 1.2]
      slots: 2
      template: 'arctan({0} ÷ {1})'
      formula: Math.atan(a/b)*180/Math.PI
      correct: [0, 1]
      target: 37.1
      tolerance: 2.5
      units: deg
      solution: θ = arctan(6.2 ÷ 8.2) = arctan(0.756) = 37.1°.

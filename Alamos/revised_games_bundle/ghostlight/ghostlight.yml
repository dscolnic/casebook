      The supported masses total 920 kg, which is about 9.03 kN of vertical weight.
      Leaning lines can have tension magnitudes greater than their vertical shares,
      but the extra magnitude is carried in horizontal components; it is not another
      130 kg of vertical mass. Pell's file therefore records the 9.0 kN vertical total
      plus the local horizontal and vertical components at each pick, and the structural
      assessor checks those point loads against the evaluated limits.

  # ----- day 10. The seat map, and the price of a held seat.
- title: The seat map goes to print at four
  objective: Decide what happens to twelve seats, and price a house that is not 
    full.
  briefing: One argument says a held seat sells to nobody; the other says a 
    blind seat is a refund — both are right.
  stake: >-
    Wednesday. The seat map goes to print at four, and two people arguing about the
    same
    twelve seats are both right at once. Today you put a price on both sides of that
    argument, and find the one number it has been missing all week.
  takeaway: A quantity rising without bound as its input approaches a value has 
    an asymptote there.
  segue: >-
    The mark moved 1.2 metres downstage. All twelve seats came back onto the map.
    The show
    keeps all nine hundred seats, and Hettie Prosser keeps row A. But nothing in the
    rig is
    aimed at that new spot yet.
  stops:
  - group: FRONT
    task: Work out what the last seats are worth
    title: What the curve says the twelve are worth
    place: Box Office
    reason: "Dowd's model says what the last seats are worth as the house fills, and
      Sallow needs that number before four o'clock."
    relationship: >-
      A rational model, y = k ÷ (x − a), with a the input the model blows up at.
    concept: 'Rational functions: vertical asymptotes where the denominator vanishes'
    takesAsRead:
    - 'Zeros, multiplicity and what a graph does at one'
    scene: >-
      Dowd has a scarcity model fitted to comparable late sales: when 60 seats remain
      the model gives £41 per seat, at 30 it gives £82, and at 12 it gives £205. The
      model is k divided by seats remaining, and Dowd wants the implied price at twelve
      — not a promise that anybody will pay it.
    guide: >-
      Find k from one point, then divide by 12 to recover the modelled per-seat value.
      Finally inspect the asymptote: as seats remaining approaches zero the formula
      blows up, which is exactly why the model must not be mistaken for a literal
      last-seat price.
    background:
    - >-
      What the asymptote means here. As the seats remaining approach zero the modelled
      price
      rises without bound, which is a vertical asymptote at zero. No real seat sells
      for an
      unbounded price, so the model is describing scarcity rather than predicting
      a transaction.
    - >-
      Why the reciprocal form is useful here. The three observed pairs all give about
      the same product, £2,460·seats, so k/n is a compact local description of these
      points. That agreement supports using the model nearby; it does not prove that
      ticket value must obey a reciprocal law.
    assumes:
    - the resale price data comes from comparable performances
    takeaway: A constant over a shrinking quantity rises without bound, which is
      a vertical asymptote.
    format: BALLPARK
    question: Estimate the modelled per-seat value when twelve seats remain.
    estimate:
      prompt: Scarcity model k/(seats remaining), with k = £2,460·seats. What 
        does it give per seat when 12 remain?
      question: Estimate the modelled value of the last twelve seats.
      labels:
      - 2460  (fitted constant in £·seats)
      - 12  (seats remaining)
      - 205  (candidate price per seat)
      - 900  (house capacity)
      values:
      - 2460
      - 12
      - 205
      - 900
      slots: 2
      template: '{0} ÷ {1}'
      formula: a/b
      correct:
      - 0
      - 1
      target: 205
      tolerance: 15
      units: '£ per seat'
      solution: £2,460·seats ÷ 12 seats = £205 per seat.
      explanation: The model gives £205 per seat at twelve remaining; its 
        divergence near zero is the warning not to extrapolate it literally.
    answerText: About £205 per seat in the fitted scarcity model; twelve such 
      seats would represent up to about £2,460 of modelled revenue.
    why: >-
      The fitted constant is £2,460·seats, so at 12 seats remaining the model gives
      £205 per seat. Multiplying back by twelve gives £2,460 of modelled revenue at
      risk if all twelve sell at that price. The asymptote is the warning: as the
      denominator approaches zero the formula predicts absurdly large prices, so this
      is a local scarcity model, not a law of ticket value.
    rebuttals:
    - Dividing the constant by the capacity prices a full house, which is a 
      different question.
    - The constant on its own is a fitted parameter rather than a value in 
      pounds until it is used.
  - group: HOUSE
    task: Decide what happens to the twelve
    title: Withdraw, discount or reblock
    place: The House
    reason: "Kettleby has to defend whichever choice goes to print, and Mbatha has
      already said what the band can live with."
    concept: 'Reading a model: what it is a model of, and where it stops being one'
    takesAsRead:
    - 'Choosing a model, and what a residual says about the choice'
    scene: >-
      Twelve already-sold seats have no line to the current mark, including Hettie
      Prosser's. Moving the mark 1.2 metres downstage clears those sightlines, and
      Mbatha says the staging change is musically workable.
    guide: >-
      The choice is not between revenue and knowingly selling a blind seat: these
      seats are already sold. Compare refund/relocation with changing the blocking,
      and choose the option that removes the sightline problem without creating a
      new safety or artistic failure.
    background:
    - >-
      Why discounting is the worst of the three. A seat sold cheap to somebody who
      then cannot
      see the performer produces a refund and a complaint, so the revenue is notional
      and the
      cost is real. Selling a known blind seat is the one option that gets worse after
      the
      transaction.
    - >-
      What reblocking costs. Moving the mark 1.2 metres downstage puts the performer
      nearer the band, which Mbatha
      has already accepted. It changes two lighting angles, and Adeyemi can replot

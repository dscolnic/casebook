    assumes:
    - the two lines are symmetric and the piece hangs level
    takeaway: Angle raises line tension; a safe decision compares force with the
      rated limit under the stated operating condition.
    format: BALLPARK
    question: Estimate the tension in each line at 41 degrees.
    estimate:
      prompt: 260 kg piece, two lines at 41° from vertical. Use g = 9.81 m/s². 

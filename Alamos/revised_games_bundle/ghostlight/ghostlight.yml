  # ----- day 11. Colour, as three channels multiplied.
- title: Three channels and a matrix
  objective: Mix a colour that survives the filter, and say what a 
    transformation does.
  briefing: The wash reads green on camera and nobody can say which channel is 
    lying.
  stake: >-
    Thursday. A film crew arrives on the fourteenth, and three lights can each do
    exactly
    what they are told while the colour on camera still comes out wrong. Today you
    work out
    what a mix of light really sends, and what a transform does to a plotted point.
  takeaway: A transformation applied to every point is a matrix, and it does not
    commute.
  segue: >-
    The wash reads warm on camera now, and warm in the room too. The film crew has
    its look.
    Three dimmer numbers finally mean what they say. But the flyer below the truss
    has never
    hit her mark on the same beat as the revolve. She gets one more try, alone, in
    an empty
    room.
  stops:
  - group: BOARD
    title: Not the numbers on the desk
    place: Lighting Board
    reason: "Adeyemi needs the wash to read true on camera as well as in the room,
      and Ferreira's dimmers aren't delivering what their numbers claim."
    concept: 'Matrices as transformations of the plane'
    takesAsRead:
    - 'Vectors: components, magnitude and direction'
    scene: >-
      A meter check of the installed dimmer curve shows that output fraction is approximately
      the square of fader fraction over the range being used. The desk reads red 80,
      green 80 and blue 40; the colour filters transmit 90%, 70% and 35% respectively.
    guide: >-
      Three things happen to each channel in order: the fader, the dimmer curve and
      the filter.
      Each one multiplies, so the order does not change the product — but the sizes
      do. Work out
      which channel loses most, and say why the room and the camera disagree.
    background:
    - >-
      Why the square appears here. It is the measured response of this installed dimmer/fixture
      chain over the working range, not a universal law for every modern lighting
      system. With that calibration, a fader at 0.80 delivers about 0.64 of the reference
      output before the filter.
    - >-
      Why camera and eye can disagree. Human visual adaptation and a camera's sensor/white-balance
      pipeline do not weight spectra in exactly the same way. The meter and camera
      test therefore belong beside the RGB arithmetic rather than being replaced by
      it.
    assumes:
    - the dimmer curve is the same on all three channels
    takeaway: A chain of multiplications is a transformation, and every stage 
      scales what arrives.
    format: PROTOCOL
    task: Match each channel to what actually arrives.
    columns:
    - The channel
    - What arrives at the performer
    scenarios:
    - Red at 80 on the desk, filter passes 90 per cent
    - Green at 80 on the desk, filter passes 70 per cent
    - Blue at 40 on the desk, filter passes 35 per cent
    - The three faders read 80, 80 and 40
    choices:
    - About 58 per cent of full
    - About 45 per cent of full
    - About 6 per cent of full
    - A set of positions rather than a set of outputs
    mapping: [0, 1, 2, 3]
    rebuttals:
    - Eighty on the fader delivers about 64 through the curve, and 90 per cent 
      of that is 58.
    - The same 64 through a 70 per cent filter is 45, which is why green sits 
      below red.
    - Forty on the fader delivers about 16, and 35 per cent of that is 6 — the 
      blue is almost gone.
    - Fader positions are inputs. What arrives is the product of three 
      multiplications.
    answerText: >-
      Red arrives at about 58 per cent, green at 45 and blue at 6 — and the fader
      positions are
      inputs rather than outputs.
    why: >
      Each channel passes through the fader, the dimmer curve and the filter, and
      every stage
      multiplies. Eighty on the desk is about 64 through a square-law dimmer, and
      90 per cent of
      that leaves red at 58. The same 64 through a 70 per cent filter leaves green
      at 45. Forty on the desk is only 16 through the curve, and 35 per cent of that
      leaves blue at 6.
      So the wash has almost no blue in it at all, and that is the green cast on camera.
      The desk reading of
      80, 80, 40 looks balanced and is a set of inputs; what the performer is lit
      by is the
      product of three multiplications.
  - group: PIT
    task: Say what happens when two things are done in the other order
    title: Order matters, or it does not
    place: Orchestra Pit and Sound
    reason: "Brand and Mbatha are both certain their signal-chain order is the right
      one, and only the arithmetic can settle it before the dress rehearsal."
    concept: 'Matrices as transformations of the plane'
    takesAsRead:
    - 'Vectors: components, magnitude and direction'
    scene: >
      Brand has a compressor and an equaliser in the same channel. Mbatha wants the
      equaliser
      first; the patch has the compressor first. Both insist their order is the correct
      one.
    guide: >-
      Ask of each pair of operations whether swapping them changes the result. Two
      gains in series
      commute, because multiplication does. A compressor responds to the level arriving
      at it, so
      what comes before it changes what it does. Work out which of the four pairs
      commute and
      which do not.
    background:
    - >-
      Why gains commute and processing does not. Multiplying by three then by four
      is the same
      as four then three. A compressor is not a multiplication. It applies a different
      gain depending on the
      level it sees, so changing what arrives changes the gain it picks.
    - >-
      Why this is the same idea as matrices. A transformation of the plane is applied
      to every
      point, and two transformations applied in different orders generally give different
      results. Rotating then stretching is not stretching then rotating, and the reason
      is the
      same as the compressor's.
    assumes:
    - both devices are in the same channel path
    takeaway: Multiplications commute and level-dependent operations do not.
    format: CHOICE
    question: Which pair genuinely gives a different result in the other order?
    choices:
    - The equaliser and the compressor
    - Two fixed gain stages
    - A gain stage and a fixed pad
    - The channel fader and the group fader
    answer: The equaliser and the compressor
    why: >
      A compressor chooses its gain from the level arriving at it. Boost a frequency
      before it
      and it compresses on that frequency. Boost the same frequency after it and the
      compression
      is left alone, then the result is lifted. Those are audibly different, and both
      engineers are describing a real
      preference rather than a mistake. Everything else on the list is a multiplication.
      Two gain stages, a gain and a pad, a
      channel fader and a group fader all commute. The product of two numbers does
      not depend on
      their order. That is the distinction worth carrying, and it is
      exactly why matrices are introduced with the warning that they do not commute.
    rebuttals:
    - Two fixed gains multiply, and multiplication does not care about order.
    - A pad is a fixed multiplication like any gain, so the order changes 
      nothing.
    - Two faders in series are two multiplications; the product is the same 
      either way.
  - group: SHOP
    task: Say what the piece traces as it flies
    title: Two functions of one parameter
    place: Scene Shop
    reason: "Novak needs to know if the truss clears the false proscenium during the
      move itself, not just at the two ends of it."
    concept: 'Parametric functions: position as two functions of one parameter'
    takesAsRead:
    - 'Converting between polar and rectangular'
    scene: >
      The bridled truss rises 4.2 metres while the revolve turns it 1.15 radians.
      Novak needs to
      know whether it clears the false proscenium during the move, not just at the
      ends.
    guide: >-
      The piece has a height that depends on time and a bearing that depends on time,
      so its
      position is two functions of one parameter. Say what that means for the question
      being asked. A clearance at the start and a clearance
      at the end do not establish a clearance in the middle.
    background:
    - >-
      Why the ends are not enough. Both coordinates change through the move, so the
      path
      between the two endpoints is a curve rather than a straight line. A piece can
      clear at
      both ends and foul in the middle, which is exactly the case a rehearsal finds
      and a
      drawing does not.
    - >-
      What the parameter is. Time, here — but it could be a fraction of the move,
      and often
      is, because the flying operator and the revolve are on different clocks. The
      useful
      parameterisation is the one both operators can read.
    assumes:
    - the two movements start and finish together
    takeaway: Two coordinates changing together trace a curve, and the ends say 
      nothing about the middle.
    format: CHOICE
    question: What does the piece's path require to be checked?
    choices:
    - The position at several points through the move
    - The start and end positions only
    - The highest point the truss reaches
    - The total angle the revolve turns through
    answer: The position at several points through the move
    why: >
      Height and bearing both change through the move, so the piece traces a curve
      and the
      clearance has to be evaluated along it. Checking the ends is the standard mistake,
      and it passes a move that fouls in the middle.
      That is the failure a rehearsal finds with forty-one people watching. The highest
      point matters if the obstruction is above, and the
      false proscenium is beside the path rather than over it, so height alone does
      not settle it.
      The total angle is a fact about the revolve and says nothing about where the
      truss is at any
      moment during the turn.
    rebuttals:
    - Two coordinates moving together trace a curve; the endpoints do not 
      describe it.
    - The highest point answers a clearance above, and the false proscenium is 
      beside the path.
    - A total angle says where the revolve finishes rather than where the piece 
      is on the way.

  # ----- day 12. The dress: where two lines have to meet.
- title: Two equations, one stage
  objective: Settle the flying cue against the revolve, and the exit timings 
    against the licence.
  stake: >-
    Friday, and the dress rehearsal is at seven. A licence signed on a guess is worth
    nothing
    at all. Today you find the moment two moving things meet, and time an exit yourself
    instead of guessing it.
  takeaway: Two things moving at different rates meet at one moment, or never.
  segue: >-
    The truss landed on its mark, right on the beat. The exit walk finally has a real
    number:
    161 seconds, against a limit of 150. So the whole licence now rests on eleven
    seconds
    that nobody has found yet.
  stops:
  - group: FLY
    task: Find the moment the two arrive together
    title: When the two rates meet
    place: Fly Floor
    reason: "Haigh has both the cue and the revolve on her sheet with no number yet,
      and the dress rehearsal is tonight with Pell in the room."
    concept: 'Solving a linear system, and what no solution looks like'
    takesAsRead:
    - 'Matrices as transformations of the plane'
    scene: >
      The truss flies out at 0.42 metres a second from 2.4 metres. The revolve brings
      the
      rostrum's edge toward the same point at 0.31 metres a second from 6.8 metres
      away. Haigh
      needs the moment they are level.
    guide: >-
      Write each position as a function of time and set them equal. That is a pair
      of linear
      equations, and where they agree is a single instant — unless the rates are such
      that they
      never do. Work out the time, then check whether it falls inside the length of
      the cue.
    background:
    - >-
      What no solution looks like here. If both moved at the same rate in the same
      direction the gap would never close. The
      two lines would be parallel, and there would be no moment at all. That is the
      geometric meaning of an inconsistent system, and it is a real
      possibility in a flying cue rather than a textbook curiosity.
    - >-
      Why the answer has to be inside the cue. A solution at eleven seconds is useless
      if the
      cue is eight seconds long — mathematically fine and operationally a collision,
      because
      something else happens at eight. The domain is part of the answer.
    assumes:
    - both movements run at constant speed through the cue
    takeaway: Setting two linear positions equal gives one instant, or none if 
      the lines are parallel.
    format: BALLPARK
    question: Estimate the time the truss and the rostrum edge are level.
    estimate:
      relationship: "Set the two positions equal: the gap divided by the sum of the
        two rates is the moment they are level."
      prompt: Truss from 2.4 m rising at 0.42 m/s; rostrum edge from 6.8 m 
        closing at 0.31 m/s. Haigh needs the moment.
      question: Estimate the time the truss and the rostrum edge are level.
      labels:
      - 6.8 m  (the rostrum edge's starting distance)
      - 2.4 m  (the truss's starting height)
      - 0.42 m/s  (the truss's rate)
      - 0.31 m/s  (the rostrum edge's rate)
      - 8 s  (the length of the whole cue)
      values: [6.8, 2.4, 0.42, 0.31, 8]
      slots: 4
      template: '({0} − {1}) ÷ ({2} + {3})'
      formula: (a-b)/(c+d)
      correct: [0, 1, 2, 3]
      target: 6.0
      tolerance: 0.6
      units: s
      solution: The gap is 4.4 m closing at 0.73 m/s, so t = 4.4 ÷ 0.73 = 6.0 s.
      explanation: Six seconds, which is inside an eight-second cue — with two 
        seconds of margin rather than none.
    answerText: About six seconds, which falls inside the eight-second cue with 
      two to spare.
    why: >-
      The initial gap is 4.4 metres and the two positions close it at 0.42 + 0.31
      = 0.73 m/s, so they are level at about six seconds. Adding the rates is correct
      because the motions approach one another. If two position functions had equal
      slopes and different intercepts, they would never meet; in a cue that means
      a missed alignment, not automatically a collision. If they were the same line,
      there would be infinitely many meeting times.
    rebuttals:
    - Subtracting the rates describes two things moving the same way, and gives 
      40 seconds for a cue that is eight long.
    - Dividing the starting distance by the sum ignores where the truss starts 
      from.
  - group: HOUSE
    task: Time the exit by walking it
    title: Walked, not estimated
    place: The House
    reason: "Pell will not sign anything off an estimate, so somebody has to actually
      walk the exit with a stopwatch."
    concept: 'Average rate of change over an interval'
    takesAsRead:
    - 'A function as a rule, its domain and what the domain rules out'
    scene: >-
      For this temporary reopening, Pell's written condition is a full-company clearance
      rehearsal under 150 seconds. The estimate on file, made from seat count divided
      by a steady flow figure, says 138 seconds. Nobody has walked the real route
      yet.
    guide: >-
      Predict the time from the flow figure, then walk the exit with the company and
      measure it.
      Lock the prediction first. The value of the measurement is the comparison: a
      walked figure
      that agrees with an estimate is a different piece of evidence from an estimate
      alone.
    background:
    - >-
      Why an estimate from a flow rate is optimistic. It assumes a steady flow through
      every exit from the first second. Real houses have a
      delay while people stand and gather, and a bottleneck at the narrowest point.
      Both push the real figure above the estimate.
    - >-
      What the licence actually wants. A measured time from a walked rehearsal, because
      the
      file has to show the room rather than the arithmetic. Pell has read enough files
      to know
      the difference and says so.
    assumes:
    - the walked exit uses the exits the licence relies on
    takeaway: A flow estimate is a model; the reopening file needs a measured 
      rehearsal under the stated conditions.
    format: VERIFY
    question: Predict the clearance time from the flow figure, then walk it and 
      report.
    verify:
      hint: >-
        Lock the prediction before the company walks. The seat count and the flow
        figure are both
        already on the file.
      prediction: {label: Predicted clearance time, unit: s, min: 60, max: 300, 
          step: 1}
      truth: 138
      passRatio: [0.85, 1.15]
      intervention:
        label: Walk the exit with the full company
        note: Forty-one people plus the crew, from the seats they will actually 
          be in.
        outcome: Walked once, timed from the cue to the last person through the 
          doors.
      measurement:
        label: Measured clearance time
        note: 161 seconds — over the licence figure, with the bottleneck at the 
          stage-left pass door.
        cost: 1
        costUnit: walks
      unmeasuredMoral: >-
        A clearance time computed from a flow rate is a statement about the flow rate.
        The licence
        is about the room, and only walking it says anything about the room.
      commit: Report the clearance time
    answerText: >-
      The estimate is 138 seconds and the walk gives 161 — over the 150 the licence
      allows, with
      the bottleneck at the stage-left pass door.
    why: >-
      The flow model predicts 138 seconds and the first full-company walk measures
      161, so the Ellery fails Pell's stated reopening condition. The gap is the reason
      to measure: people do not begin moving at steady flow from the first second,
      and a real route develops bottlenecks. The walk also identifies the bottleneck
      at the stage-left pass, which turns a failed number into something that can
      be changed and retested.
  - group: FRONT
    task: Say what the sales curve has done
    title: Where the curve turned
    place: Box Office
    reason: "Sallow and Dowd disagree about whether the curve is still climbing, and
      the run's costing depends on which one is right."
    concept: 'Increasing, decreasing, and where a rate of change turns'
    takesAsRead:
    - 'Average rate of change over an interval'
    scene: >
      Weekly sales now read 41, 66, 188, 402, 511, 566. Sallow reads it as still accelerating.
      Dowd says it turned last week.
    guide: >-
      Work with the differences rather than the totals. Sales are still rising, so
      the totals say
      nothing about the argument. What settles it is whether the rise itself is getting
      bigger or
      smaller, which is the difference of the differences.
    background:
    - >-
      What the two claims actually are. Sallow is claiming the second difference is
      still
      positive — the increase is increasing. Dowd is claiming it has gone negative.
      Both agree
      sales are rising, which is why the totals cannot arbitrate.
    - >-
      Why it matters commercially. If the weekly increase is shrinking, the producer
      cannot honestly treat the earlier acceleration as a guarantee of a sellout.
      The data supports a change in the rate; the pricing or marketing response is
      a separate decision with costs the curve does not contain.
    assumes:
    - all six figures are complete weeks
    takeaway: Whether a rise is speeding up is the difference of the 
      differences, not the total.
    format: CHOICE
    question: What do the six figures say about the argument?
    choices:
    - The rise peaked at week four and has slowed since
    - Sales are still accelerating, as the producer says
    - Sales have started to fall
    - Six points are too few to say either way
    answer: The rise peaked at week four and has slowed since
    why: >-
      The weekly increases are 25, 122, 214, 109 and 55. They grew through the week-four
      checkpoint and then shrank, so cumulative sales are still increasing while the
      increase is slowing. That supports Dowd's description of the recent data. It
      does not show that sales themselves are falling, and it does not justify a forecast
      beyond the observed checkpoints. The operational consequence is simply that
      Sallow cannot use the old acceleration as evidence that the remaining seats
      will sell automatically.
    rebuttals:
    - The producer's claim needs the rises to keep growing, and they have halved
      twice.
    - Every week is larger than the last, so nothing here is falling.
    - Six points show the turn clearly in the differences; it is extrapolation 
      they cannot support.

  # ----- day 13. The board, plotted from the centre out.
- title: The rig, in the coordinates it was drawn in
  objective: Finish the plot, and find the one unit that is in the wrong place.
  briefing: Twenty-eight units are hung and one is about 640 millimetres from 
    the room-coordinate position.
  stake: >-
    Saturday. One of twenty-eight lamps is about 640 millimetres from where the room's
    coordinates say it belongs, and the paperwork makes the wrong position look plausible.
    Today you find the reference error and rewrite the plot so the next crew cannot
    repeat it.
  takeaway: Converting between two descriptions of a point is where a rig's 
    errors live.
  segue: >-
    The bad unit was about 640 millimetres off the room coordinate once the 140-millimetre
    bar offset was included. Its bearing had been measured from the wrong reference
    direction. One unit moved, and the plot now states its origin and reference instead
    of leaving them to memory.
  stops:
  - group: BOARD
    task: Find the unit that is out of position
    title: Six hundred forty millimetres
    place: Lighting Board
    reason: "Ferreira has twenty-eight lamps on four bars and one shadow that the
      plot cannot explain; the notes session is at six."
    concept: 'Converting between polar and rectangular'
    takesAsRead:
    - 'Polar coordinates, and a beam described as r of theta'
    scene: >
      Four units on bar two are plotted at 6.9 metres and bearings of 12, 24, 36 and
      48
      degrees. Ferreira's hanging sheet lists offsets of 1.43, 2.81, 4.06 and 4.63
      metres
      from centre.
    guide: >-
      Convert each plotted bearing into an across-stage offset and compare it with
      the sheet.
      Three will agree within the tolerance a tape measure gives; one will not. Work
      out which,
      and by how much, before anybody climbs a ladder.
    background:
    - >-
      Why the fourth is the suspect. Six point nine metres at 48 degrees gives an
      offset of 5.13 metres, and the sheet says
      4.63. That is half a metre out, which on a focused unit is a shadow on the mark
      rather
      than a slightly different look.
    - >-
      Why this error is always the same kind. Somebody converted with the wrong function,
      or
      read the bearing as an offset directly. Both produce a number that is plausible,
      on the
      right bar, in the right units, and wrong — which is why it survives being written
      down.
    assumes:
    - all four units are on the same bar at the same distance
    takeaway: A plausible number in the right units is the error that survives 
      being written down.
    format: BALANCE
    question: Read what you need and report where the unit should hang, measured
      from centre.
    balance:
      hint: >-
        Reading the plot or the sheet is free. Counting a term is the claim you are
        making about
        where the unit belongs.
      total: {amount: 5.27, unit: m, label: Correct offset from the room centre 
          line}
      streams:
      - {id: plot, label: Plot converted properly, value: 5.13, display: '6.9 m ×
          sin 48° = 5.13 m'}
      - {id: sheet, label: What the hanging sheet says, value: 0, display: '4.63 m
          — the same distance at 42°, so not a term at all'}
      - {id: bar, label: Bar centre offset from the room centre line, value: 
          0.14, display: '140 mm — the bar was hung to the 1911 drawing', hidden: 
          true, note: 'on no paperwork — the paperwork is what is wrong'}
      - {id: yoke, label: Yoke offset within the clamp, value: 0, display: '±0 — the
          clamp centres on the bar'}
      tolerance: 0.08
      commit: Report the offset
    answerText: >-
      About 5.27 m from the room centre line, roughly 0.64 m from the 4.63 m hanging-sheet
      position.
    why: >-
      At 6.9 metres and 48°, the plotted across-stage offset is 5.13 m. The bar itself
      is 0.14 m off the room's measured centre line, so the room-coordinate target
      is 5.27 m. The hanging sheet says 4.63 m, leaving an error of about 0.64 m.
      The 4.63 m value is what 6.9 m at 42° gives, exposing a reference-angle mix-up.
      The important result is that the paperwork can be internally tidy and still
      wrong if the origin or reference direction is unstated.
  - group: FLY
    task: Say what the plot is missing
    title: Bearings without a reference
    place: Fly Floor
    reason: "Adeyemi's plot lists bearings with no stated reference, and until it
      does, nobody can trust any angle on it."
    concept: 'Polar coordinates, and a beam described as r of theta'
    takesAsRead:
    - 'The unit circle, and sine and cosine as coordinates'
    scene: >
      Adeyemi's plot lists distances and bearings. It does not say what the bearings
      are measured
      from, and there are three plausible references in this building.
    guide: >-
      A polar description needs three things and the plot has two. Say what is missing.
      Then say why a set of bearings with no stated reference is not merely
      inconvenient. It is ambiguous by a fixed amount that nobody can detect from
      the numbers.
    background:
    - >-
      What a polar coordinate system requires. An origin, a reference direction and
      a sense of
      rotation. Miss any one of the three and the numbers describe a family of positions
      rather than a
      position.
    - >-
      The three plausible references here. The centre line, the proscenium line and
      the front
      edge of bar one, which differ by 90 degrees and by 400 millimetres. Under two
      of the three, every bearing in the plot is wrong by a fixed amount. That is
      exactly what today's error looked like.
    assumes:
    - the plot's distances are all measured from one origin
    takeaway: A polar description needs an origin, a reference direction and a 
      sense of rotation.
    format: CHOICE
    question: What does the plot have to state before it can be hung from?
    choices:
    - The direction the bearings are measured from
    - The height of each bar above the stage
    - Which dimmer each unit is patched to
    - The beam angle of each unit
    answer: The direction the bearings are measured from
    why: >
      A bearing is an angle from something, and the plot does not say what. The building
      offers three candidates: the centre line, the proscenium line, and the front
      edge of bar one. So every number in the plot names three different positions,
      and nothing
      in the numbers reveals which was meant. That is what produced today's half-metre
      error. Bar heights, dimmer numbers and beam angles are all needed to finish
      the rig, and none of
      them resolves the ambiguity. A unit hung at the wrong bearing is in the wrong
      place
      however well the rest of its paperwork reads.
    rebuttals:
    - Bar heights are needed to focus and do not say what the bearings are 
      measured from.
    - A patch number says which channel controls the unit, not where it hangs.
    - A beam angle describes the spread of the light rather than the direction 
      to the position.
  - group: SHOP
    title: The centre line the room has
    place: Scene Shop
    reason: "Quirke is setting out the false proscenium and needs the room's actual
      centre line, not the one on a drawing from 1911."
    concept: 'Reading a model: what it is a model of, and where it stops being one'
    takesAsRead:
    - 'Choosing a model, and what a residual says about the choice'
    scene: >
      Quirke is setting out the false proscenium. The 1911 drawing gives a centre
      line. The 1958 alteration moved the frame. A tape run from
      the two side walls gives a third line, 140 millimetres from the one on the drawing.
    guide: >-
      Three candidate centre lines and one piece to build. Decide which line the piece
      has to be
      symmetric about, and say what makes that the right answer rather than the average
      of the
      three. The audience is the test rather than the drawing.
    background:
    - >-
      Why the wall measurement wins. The piece is seen against the frame and the walls,
      by
      people sitting in the room. Symmetry that reads to an audience is symmetry about
      what
      they can see, which is the room, not the drawing.
    - >-
      Why averaging is the wrong instinct. Three measurements of the same thing average
      usefully; three different things do not. These are a historical record, an altered
      structure and a current measurement, and the average of them is a line with
      no referent
      at all.
    assumes:
    - the two side walls are the ones visible to the audience
    takeaway: Averaging three measurements of one thing is sensible; averaging 
      three different things is not.
    format: PROTOCOL
    task: Match each candidate centre line to what it is a record of.
    columns:
    - The line
    - What it is a record of
    scenarios:
    - Measured from the two side walls today
    - The 1911 drawing's centre line
    - The line the existing frame is symmetric about
    - The average of the three
    choices:
    - The room as an audience sees it, which is what the piece is looked at 
      against
    - The building before the alteration that created the problem
    - The 1958 alteration itself, which is where the discrepancy came from
    - Nothing at all — three different quantities do not average
    mapping: [0, 1, 2, 3]
    rebuttals:
    - The wall measurement is the only one taken from the room people sit in.
    - The 1911 line records a building that has since been altered.
    - The frame is the thing that moved, so its symmetry is the discrepancy 
      rather than a reference.
    - Averaging a drawing, an alteration and a measurement produces a line 
      nothing is symmetric about.
    answerText: >-
      Build to the walls: the drawing records a building since altered, the frame
      records the
      alteration, and the average of three different things records nothing.
    why: >
      The piece is looked at by people sitting in the room. So it has to be symmetric
      about what
      they can see, and that is the line the walls give today. The 1911 drawing is
      a record of the building
      before the change that caused all this. The frame's own symmetry is a record
      of the 1958
      alteration, which is the discrepancy rather than a reference for it. And the
      average is the instinct worth resisting. Three measurements of one quantity
      average usefully. These are three different quantities, so their average is
      a line nothing
      in the building is symmetric about.

  # ----- day 14. The last full day.
- title: Everything at once, and one rehearsal left
  objective: Fit the last of the numbers and spend the last of the time.
  briefing: One rehearsal, four things to fix, and the licence file closes at 
    noon tomorrow.
  stake: >-
    Sunday. One rehearsal is left, four problems are on the list, and there are only
    four
    hours to spend on them. Today you decide where those four hours go, and finish
    the two
    numbers the file still needs.
  takeaway: A finite pool spent on a list longer than itself is a decision about
    what is not done.
  segue: >-
    The stage-left pass was cleared of the scenery rack that had narrowed it. Two
    full-company walks came in at 146 and 148 seconds, both under Pell's 150-second
    condition. The flying cue repeated inside its window and the moved mark was rehearsed.
    The one number still not rechecked is the band's full-room balance.
  stops:
  - group: HOUSE
    task: Spend the last four hours
    title: Four hours, six jobs
    place: The House
    reason: "Haigh has six jobs on her sheet and four hours of company time to spend
      on them, with the licence and the argument both wanting a piece."
    concept: 'Reading a model: what it is a model of, and where it stops being one'
    takesAsRead:
    - 'Choosing a model, and what a residual says about the choice'
    scene: >-
      Four hours of company time remain before the dress. Six useful jobs are on Haigh's
      sheet. The load plot is already filed; the one remaining licensing failure is
      the 161-second exit walk, and every other job buys confidence somewhere else.
    guide: >-
      The list is larger than the pool. Buy the exit retest first because the building
      currently fails its written reopening condition, then decide which rehearsals
      or measurements can still fit. The output of the exercise is also the list of
      claims you will not be able to make tonight.
    background:
    - >-
      What is actually outstanding for the licence. The load plot was filed on Tuesday.
      The remaining failed condition is the exit rehearsal, which measured 161 seconds
      against Pell's 150-second requirement and identified the stage-left pass as
      the bottleneck.
    - >-
      Why the flying cue has to be run rather than calculated. Six seconds is the
      computed
      answer and a rehearsal is the only thing that establishes the operators can
      hit it, twice,
      with a company on stage.
    assumes:
    - the four hours cannot be extended
    takeaway: A pool smaller than the list is a decision about what will not be 
      done.
    format: ALLOCATE
    question: Four hours before the dress. Build the plan, and know what it 
      stops you being able to say.
    allocate:
      hint: >-
        Nothing here is useless. The load plot is already filed; the exit retest is
        the one remaining failed licensing condition, and the rest of the pool buys
        rehearsal or measurement confidence.
      pool:
        amount: 240
        unit: min
        mode: scalar
      items:
      - id: exits
        label: Clear the stage-left pass and walk the exits twice
        cost: 40
        note: the first walk was 161 s; Pell wants a measured result under 150 s
      - id: fly
        label: Run the flying cue against the revolve, twice
        cost: 60
        note: six seconds computed, nobody has hit it yet
      - id: wash
        label: Re-mix the wash for camera
        cost: 45
      - id: sightline
        label: Re-block the moved mark with the company
        cost: 50
      - id: band
        label: Balance the nine-piece against the room with seats in
        cost: 55
      - id: notes
        label: Give the company the accumulated notes
        cost: 30
        protected: true
        note: forty-one people cannot open on notes they have not heard
      answers:
      - question: Does the file have an exit time the licence will accept?
        requires:
        - exits
        required: true
      - question: Have the operators actually hit the flying cue?
        requires:
        - fly
      - question: Will the recording read as the designer intended?
        requires:
        - wash
      - question: Does the company know where the moved mark is?
        requires:
        - sightline
      - question: Is the band balanced against a room with seats in it?
        requires:
        - band
      commit: Commit the four hours
    answerText: >-
      Notes, the exit retest and the flying cue use 130 minutes, leaving 110: enough
      for both the re-block and camera wash, but not those two plus the 55-minute
      band balance.
    why: >-
      The exit retest comes first because the first walk failed the reopening condition.
      The flying cue is the place where computation has run out, and the notes are
      protected because the company cannot open on instructions it has not heard.
      Those three use 130 minutes, leaving 110. That is enough for the 50-minute re-block
      and 45-minute camera wash together, but not enough to add the 55-minute band
      balance too. The point is to name the measurement being deferred rather than
      pretending the full list fits.
  - group: PIT
    task: Balance the band against a room with seats in it
    title: The tail is different now
    place: Orchestra Pit and Sound
    reason: "Brand has the same decay measurement with the seats installed, and needs
      to state what changed without pretending it directly tells him a fader setting."
    relationship: >-
      The level in decibels, L = 10·log₁₀(I / I₀), applied to a room whose absorption
      has changed.
    concept: 'The decibel: a logarithmic scale on a physical ratio'
    takesAsRead:
    - 'Log properties, and why a product becomes a sum'
    scene: >-
      In the empty house, 1.1 per cent of the initial late-sound energy remained after
      one second. With the upholstered seats installed, the same measurement leaves
      0.36 per cent. Brand wants the change expressed in decibels.
    guide: >-
      Take the ratio of the two energy measurements and use ten times the logarithm.
      The result describes the one-second reverberant tail under these two conditions.
      It does not by itself tell you how many decibels to move the band, because direct
      sound and steady-state level are different measurements.
    background:
    - >-
      Why a deader room needs more level rather than less. Reverberation adds to what
      a listener
      receives — the direct sound plus everything the room returns. Take away the
      returns and the
      total falls, so a band that was balanced in an empty house is quiet in a full
      one.
    - >-
      Why nobody trusts their ears for this. The empty house was audibly wrong and
      the change is
      a factor rather than an impression. Brand wants the decibel figure so the desk
      can be moved
      by a known amount rather than by consensus in a corridor.
    assumes:
    - the direct sound from the pit is unchanged by the seats
    takeaway: A decay-tail ratio can be expressed in decibels, but it is not 
      automatically a fader correction.
    format: BALLPARK
    question: Estimate the change in level from the room alone.
    estimate:
      prompt: Late-sound energy after one second falls from 1.1% empty to 0.36% 
        with the seats installed.
      question: Estimate the change in level from the room alone.
      labels:
      - 0.011  (empty-house fraction)
      - 0.0036  (seats-in fraction)
      - 10  (multiplier for an energy ratio)
      - 20  (multiplier for an amplitude ratio)
      values:
      - 0.011
      - 0.0036
      - 10
      - 20
      slots: 3
      template: '{2} × log₁₀({1} ÷ {0})'
      formula: c*Math.log10(b/a)
      correct:
      - 0
      - 1
      - 2
      target: -4.85
      tolerance: 0.8
      units: dB
      solution: 10 × log₁₀(0.0036 ÷ 0.011) ≈ −4.85 dB.
      explanation: The one-second reverberant tail is about 4.9 dB lower with 
        the seats installed. That is evidence about decay, not a direct 
        instruction to raise the band by 4.9 dB.
    answerText: About −4.9 dB in the one-second reverberant tail with the seats 
      installed; remeasure program level before changing the band.
    why: >-
      The energy ratio is 0.0036/0.011 ≈ 0.327. Ten times its logarithm is about −4.85
      dB, so the late tail is substantially lower with the seats installed. That agrees
      with the physical expectation that added absorption shortens reverberation.
      But this comparison is not a steady-state sound-pressure measurement, so adding
      4.85 dB at the fader would be an unjustified inference.
    rebuttals:
    - Twenty times the log is the voltage definition; these are energies, so it 
      takes ten.
    - Taking the ratio the other way up gives the same size with the wrong sign,
      and moves the desk the wrong way.
  - group: FLY
    task: Run the cue and report what happened
    title: Six seconds, twice
    place: Fly Floor
    reason: "Osei and the revolve operator have never run the cue together, and Haigh
      only has an hour and wants two clean runs before the dress."
    concept: 'Solving a linear system, and what no solution looks like'
    takesAsRead:
    - 'Matrices as transformations of the plane'
    scene: >
      The computed moment is six seconds into the cue. Osei and the revolve operator
      have never
      run it together. Haigh has an hour and wants two clean runs.
    guide: >-
      Predict the moment from the two rates, then run the cue and time what actually
      happens. The
      computation is not in doubt; what is in doubt is whether two operators on different
      clocks
      can arrive at the same instant, twice.
    background:
    - >-
      Why two runs rather than one. One run establishes that it can happen. Two establishes
      that
      it can be repeated, which is what a cue is. A sequence that worked once is an
      anecdote and
      a sequence that worked twice is a cue Haigh will call.
    - >-
      What the measurement is likely to show. Operators anticipate, so the first run
      usually
      arrives early and the second, corrected, arrives late. The useful output is
      the spread
      rather than either number.
    assumes:
    - both operators start on the same call
    takeaway: A computed moment and a rehearsed one are two different pieces of 
      evidence.
    format: VERIFY
    question: Predict the moment the two arrive together, then run the cue and 
      report.
    verify:
      hint: >-
        Lock the prediction before the cue runs. The gap and the two rates are on
        the sheet from
        Friday.
      prediction: {label: Predicted moment of arrival, unit: s, min: 0, max: 20, 
          step: 0.5}
      truth: 6.0
      passRatio: [0.85, 1.15]
      intervention:
        label: Run the cue with both operators
        note: Truss out, revolve in, company clear of the deck.
        outcome: Run twice. Timed from the call to the moment the two were 
          level.
      measurement:
        label: Measured arrival
        note: 5.4 seconds on the first run and 6.3 on the second, both inside 
          the eight-second cue.
        cost: 1
        costUnit: runs
      unmeasuredMoral: >-
        A computed moment nobody has run is a statement about two rates. Whether two
        operators can
        arrive there together is a different claim, and only a rehearsal makes it.
      commit: Report the cue
    answerText: >-
      Computed at six seconds; run at 5.4 and 6.3. Both inside the cue, and the spread
      of nearly a
      second is the number the margin has to cover.
    why: >
      The prediction is six seconds and the two runs came in at 5.4 and 6.3, which
      is the pattern
      operators produce: the first anticipates and the second over-corrects. Both
      are inside the
      eight-second cue, so the sequence stands. The useful output is not either time
      but the spread: nearly a second of variation. That
      is what the margin has to absorb, and it is invisible to any calculation. Two
      runs rather than one is the whole point. One establishes that it can happen
      and two
      establishes that it repeats, and a cue is a thing that repeats.

  # ----- day 15. Opening.
- title: The signature
  objective: Close the evidence, make the box-office call, and sign only what 
    the fortnight actually established.
  briefing: The licence is signed at noon, the house opens at seven, and 
    everything either measures or it does not.
  stake: >-
    Monday, opening day. Pell signs at noon and the audience arrives at seven. The
    file now contains measured sightlines, a reviewed rigging load plot and two exit
    walks under the limit — but only if you write the conditions beside the numbers.
    Today you decide what can open and put your name under it.
  takeaway: A measured local number with a stated period is worth more than an 
    inherited figure.
  stops:
  - group: HOUSE
    title: What the file says
    place: The House
    reason: "Pell will sign or refuse the licence on exactly these four statements,
      and two of them aren't measurements yet."
    concept: 'Reading a model: what it is a model of, and where it stops being one'
    takesAsRead:
    - 'Choosing a model, and what a residual says about the choice'
    scene: >-
      Four statements are drafted for the licence file. Some are measurements, some
      are model outputs, and one has been superseded by a later intervention and repeat
      measurement. Pell will sign only what is labelled honestly.
    guide: >-
      Read each statement against what was actually done in the fortnight. A measurement
      carries
      the conditions it was taken under; an estimate carries the assumptions it was
      computed from.
      Both belong in a file and only one of them can be signed against.
    background:
    - >-
      What the walk established and the calculation did not. A clearance time of 161
      seconds
      from a walked rehearsal with the full company, and where the queue formed. The
      138-second
      estimate assumed a steady flow that no real house produces.
    - >-
      Why the load plot is the strongest item in the file. Every tension in it was
      computed from
      a measured angle and a weighed piece, and the total includes the term that appears
      on no
      weight ticket. It is the only number in the building with a margin stated beside
      it.
    assumes:
    - the file is read as it stands rather than explained in person
    takeaway: A measurement carries its conditions; an estimate carries its 
      assumptions.
    format: PROTOCOL
    task: Match each statement to what supports it.
    columns:
    - The statement
    - What stands behind it
    scenarios:
    - The first full-company exit walk took 161 s and identified the stage-left 
      pass bottleneck
    - The rigging load plot lists the force components at each pick and the 
      assessor accepted them against evaluated limits
    - Twelve sold seats had no line to the original mark before the mark moved
    - The simple flow model predicted a 138 s clearance before anybody walked 
      the route
    choices:
    - A walked rehearsal under the original route, with the bottleneck 
      identified
    - Measured angles/weights resolved into force components, then reviewed 
      against assessed point-load limits
    - A seat-by-seat survey tied to a specific performer mark and blocking 
      condition
    - A steady-flow estimate whose assumptions were contradicted by the first 
      walk
    mapping: [0, 1, 2, 3]
    rebuttals:
    - The 161 is a measured time from a walk, and it names where the queue 
      formed.
    - The load plot is built from weighed pieces and measured angles, including 
      the term that is not a mass.
    - The twelve seats were established by sitting in them with a marker on 
      stage.
    - That figure came from a flow rate. The walk measured 23 seconds more than 
      it.
    answerText: >-
      Keep the measured conditions and the failed model in the record: they explain
      why the later 146/148-second walks and the revised sightline map are credible.
    why: >-
      The file has to preserve the chain of evidence rather than erase the failed
      steps. The first walk measured 161 seconds and found the bottleneck; clearing
      that bottleneck led to repeat walks of 146 and 148 seconds. The rigging item
      is a load plot of force vectors reviewed against assessed limits, not a scalar
      'grid mass'. The sightline result belongs to the original mark, and the 138-second
      flow estimate remains a model that the first walk falsified under real conditions.
  - group: FRONT
    task: Decide what to do with the remaining thirty-nine seats
    title: The last thirty-nine seats
    place: Box Office
    reason: "Sallow wants a sellout claim; Dowd's own differences say only that sales
      are still rising more slowly."
    concept: 'Increasing, decreasing, and where a rate of change turns'
    takesAsRead:
    - 'Average rate of change over an interval'
    scene: >-
      Eight hundred and sixty-one seats are sold and thirty-nine remain. The twelve
      formerly blocked seats are already valid after the mark moved. Weekly cumulative
      sales are still rising, but the weekly increases peaked earlier and have been
      shrinking.
    guide: >-
      Separate what the data says from what the producer wants it to say. A positive
      but shrinking weekly increase does not prove the remaining 39 will sell before
      seven, and it does not prove they will not. Make the box-office action that
      needs the fewest unsupported assumptions.
    background:
    - >-
      What the turn means for the last seats. The rise has halved twice, so the remaining
      thirty-nine will not go the way the first eight hundred did. They need a reason
      —
      day-of-performance release, a price, or somebody telling the town the twelve
      are back on
      sale.
    - >-
      Why the twelve matter out of proportion. They are the only seats whose availability
      is
      news, because they were withdrawn and are now clear. Everything else on the
      list is a seat
      that has been on sale for six weeks.
    assumes:
    - the twelve seats are confirmed clear on the moved mark
    takeaway: A slowing increase is not a decline, and it is not a guaranteed 
      sellout either.
    format: CHOICE
    question: What should the box office do with the remaining thirty-nine?
    choices:
    - Keep them on normal sale through doors, without claiming a sellout
    - Discount all thirty-nine immediately because the rate is slowing
    - Close sales because the curve has turned
    - Hold all thirty-nine for the recording company
    answer: Keep them on normal sale through doors, without claiming a sellout
    why: >-
      Sales are still increasing, so closing sales makes no sense. The increase is
      shrinking, so the data also does not justify claiming the last 39 will disappear
      on their own. Nothing in the evidence establishes that a discount is required
      or that the recording company needs those seats. Keeping them available at the
      existing price while refusing a sellout forecast is the decision supported by
      the data actually in hand.
    rebuttals:
    - Discounting gives away revenue on the seats walk-ups take at full price.
    - The total rising is not the rate rising, and the rate has halved twice.
    - Held seats leave visible gaps in exactly the rows the camera looks at.
  - group: HOUSE
    task: Sign the opening recommendation
    title: Your name under it
    place: The House
    reason: Pell has the county form on the production desk. Every calculation 
      in the fortnight matters only through what you are willing to sign now.
    concept: 'Reading a model: what it is a model of, and where it stops being one'
    takesAsRead:
    - Choosing a model, and what a residual says about the choice
    scene: >-
      The house opens in seven hours. The measured seat map is clear on the moved
      mark. The rigging load plot has been reviewed against evaluated point-load limits.
      After the stage-left pass was cleared, two full-company exit walks took 146
      and 148 seconds against Pell's 150-second reopening condition. The roof leak
      remains, and the band's full-room balance has not been repeated.
    guide: >-
      Choose the statement you can defend line by line. A licence recommendation can
      carry conditions and unresolved work; it cannot turn a model into a measurement
      or an unfinished structural/acoustic question into a fact.
    background:
    - >-
      What a conditional signature means here. The production can open on the measured
      conditions that passed, while the file explicitly preserves the route condition,
      the reviewed rigging configuration and the work still outstanding. If any of
      those operating conditions change, the evidence no longer applies.
    assumes:
    - Pell is the authority setting the fictional Ellery reopening conditions in
      this scenario
    takeaway: The final engineering act is not another calculation; it is 
      stating exactly what the evidence allows you to approve.
    format: CHOICE
    question: Which opening recommendation do you sign?
    choices:
    - Approve opening under the measured seat map, reviewed rigging 
      configuration and cleared-pass egress condition; record the roof and 
      acoustic recheck as unresolved
    - Approve without conditions because every numerical lesson produced an 
      answer
    - Use the 138-second flow estimate instead of the walked exit times because 
      it is mathematically cleaner
    - Refuse the entire production solely because the roof still leaks
    answer: Approve opening under the measured seat map, reviewed rigging 
      configuration and cleared-pass egress condition; record the roof and 
      acoustic recheck as unresolved
    why: >-
      The fortnight did not prove that the building is safe under every imaginable
      condition. It established specific things under specific conditions: the moved
      mark restores the measured sightlines, the reviewed rigging configuration stays
      within the assessed load limits, and the cleared stage-left pass produced repeat
      exit walks of 146 and 148 seconds. Those are defensible grounds for a conditional
      opening recommendation. The 138-second estimate was contradicted by measurement,
      the roof remains a maintenance problem to record, and an unfinished acoustic
      balance is not a reason to invent a result.

# ---------------------------------------------------------------- the rooms
    answerText: 'Sign the conditional opening recommendation: approve only the measured
      configuration and write the unresolved roof/acoustic work beside it.'

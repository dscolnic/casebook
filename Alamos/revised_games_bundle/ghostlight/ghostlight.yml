# ghostlight.yml — Ghost Light. AP Precalculus at the Ellery Variety Theatre.
#
# THE PLACE WAS CHOSEN BECAUSE EVERY FAMILY OF FUNCTION IS A PIECE OF KIT. A
# fader is a logarithm. A beam is polar. A flying line is a vector. The box
# office is a rational function with a real asymptote in it. Nothing here is an
# example of a function; it is a thing in the building that happens to be one.
#
# The argument, both sides right on some day: Sallow has sold nine hundred seats
# and is right on day 10 that a house held back for sightlines nobody has
# measured is a house nobody is paid for. Osei will not fly four tonnes on an
# untested grid and is right on day 9, when the load plot comes out at three and
# a half tonnes with the lines leaning further than anybody drew.
#
#   node tools/import-book.mjs books/ghostlight.yml ghostlight --verify

theme:
  id: ghostlight
  title: Ghost Light
  subtitle: Production Manager · The Ellery Variety Theatre

groups:
- id: FRONT
  code: FRONT
  name: Box Office
  color: '#a8553c'
  desc: What has sold, what will, and the curve it is following.
  defaultLeader: sallow
  milestones: [Read the sales, Fit a model, Test it, Ready for the opening]
- id: BOARD
  code: BOARD
  name: Lighting Board
  color: '#c09a3a'
  desc: Angles, throws and three channels of colour.
  defaultLeader: adeyemi
  milestones: [Plot the beams, Work the angles, Balance the colour, Ready for 
      the opening]
- id: PIT
  code: PIT
  name: Orchestra Pit and Sound
  color: '#3f7fa8'
  desc: Waveforms, levels and everything measured in logarithms.
  defaultLeader: brand
  milestones: [Read the waveform, Add the gains, Set the levels, Ready for the 
      opening]
- id: FLY
  code: FLY
  name: Fly Floor
  color: '#7f8a5c'
  desc: Lines, loads and the vectors they pull along.
  defaultLeader: osei
  milestones: [Weigh the piece, Resolve the lines, Plot the load, Ready for the 
      opening]
- id: SHOP
  code: SHOP
  name: Scene Shop
  color: '#8a6f3c'
  desc: Radians, right triangles and things cut to a curve.
  defaultLeader: novak
  milestones: [Set out the curve, Cut the angles, Check the fit, Ready for the 
      opening]
- id: HOUSE
  code: HOUSE
  name: The House
  color: '#6a4a6a'
  desc: Sightlines, seats and the geometry of a room built in 1911.
  defaultLeader: kettleby
  milestones: [Survey the seats, Draw the sightlines, Settle the map, Ready for 
      the opening]

roster:
- id: sallow
  name: Marguerite Sallow
  role: Producer
  division: FRONT
  bio: |
    Has produced eleven shows in rooms she did not own and has never yet
    opened one late. She sold nine hundred seats for the Ellery before anybody
    had measured the building, which she considers a normal risk and everybody
    else considers the problem.

    Her argument is about the shape of a sales curve rather than about a total.
    Advance sales rise slowly and then steeply in the last fortnight, so a
    house held back on the eighth for a reason nobody can write down is a
    house that never sells.

    What she accepts, and few producers do, is being shown a number. She will
    move a seat map for a measurement and not for an opinion.
  quiz:
  - q: Why does Sallow object to holding seats back without a written reason?
    a: Seats withdrawn late in the curve are seats that never sell
    wrong:
    - Withdrawn seats have to be refunded at a premium under the ticketing 
      contract
    - A held seat cannot be released again once the allocation is filed with the
      box office
    - She believes sightline problems are always exaggerated by technical staff
- id: osei
  name: Kwame Osei
  role: Head Flyman
  division: FLY
  bio: |
    Has run the Ellery's fly floor since he was nineteen, which was two years
    before it went dark. Twenty-six hemp lines, a counterweight system added
    in 1958, and a grid nobody has load-tested since.

    He thinks in components rather than totals. A piece hanging from two lines
    does not put half its weight on each unless the lines are vertical, and
    the lines at the Ellery are not vertical because the grid is narrower than
    the stage.

    His refusal is specific. He will fly anything with a load plot and a
    margin, and nothing at all on an assurance.
  quiz:
  - q: Why does Osei say two lines rarely share a load equally?
    a: Only the vertical part of each line's pull carries the weight
    wrong:
    - Hemp lines and counterweight lines have different breaking strengths, so 
      the load splits unevenly
    - The grid at the Ellery has been out of level since the 1958 conversion 
      work
    - A load always settles on whichever line was tensioned first
- id: brand
  name: Ilse Brand
  role: Sound Designer
  division: PIT
  bio: |
    Came from concert halls to variety and says the difference is that in
    variety everything is amplified and nothing is supposed to sound like it.

    She works in logarithms without saying so. Every fader on her desk is one,
    every gain stage multiplies rather than adds, and her standing complaint
    is that people discuss six decibels as though it were a small number.

    The Ellery's problem is its reverberation. Eleven years shut with the
    seats out has left a room that rings, and the seats coming back is the only
    thing that will fix it.
  quiz:
  - q: Why does Brand object to six decibels being called a small change?
    a: Each three decibels doubles the intensity, so six is four times
    wrong:
    - Six decibels is the smallest change most listeners can reliably detect in 
      a hall
    - Decibel readings on her desk are peak values rather than averages, so they
      understate the change
    - The scale is only logarithmic below the threshold of pain
- id: adeyemi
  name: Tunde Adeyemi
  role: Lighting Designer
  division: BOARD
  bio: |
    Plots a rig in polar coordinates because that is what a lantern is: a
    position, a bearing and a spread. He converts to the plan drawing
    afterwards, which is the opposite of how most designers work and produces
    fewer arguments on the day.

    He is exact about the inverse square law and unpopular for it. Moving a
    lantern from six metres to twelve does not halve the light on the
    performer; it quarters it, and the colour goes with it.

    His limit is the Ellery's own dimmers, which are older than he is and do
    not do what their numbers say.
  quiz:
  - q: Why does Adeyemi plot in polar coordinates rather than on the plan?
    a: A lantern is a bearing and a spread before it is a position on paper
    wrong:
    - Plan drawings of the Ellery were lost when the building closed in the 
      1970s
    - Polar plots are required by the licensing authority for any rig over a 
      public audience
    - It is the only way to record the dimmer number alongside the position
- id: novak
  name: Petra Novak
  role: Head of Construction
  division: SHOP
  bio: |
    Runs the scene shop, which at the Ellery is one room, two benches and a
    band saw older than the counterweight system. She sets out curves in
    radians because a template is an arc and an arc is a radius and an angle.

    She has built for rooms that were surveyed and rooms that were not, and
    the difference she cares about is whether a piece has to be recut on the
    stage in front of a company standing about.

    Her rule is to measure the room rather than the drawing, because the
    Ellery is 1911 and nothing in it is where the drawing says.
  quiz:
  - q: Why does Novak measure the room rather than the drawing?
    a: A 1911 building has moved, and the drawing has not
    wrong:
    - The original drawings were made before the 1958 counterweight conversion
    - Room measurements are required before any piece can be signed off by the 
      licence
    - Drawings show finished dimensions rather than the timber sizes she has to 
      order
- id: kettleby
  name: Alan Kettleby
  role: House Manager
  division: HOUSE
  bio: |
    Has managed three houses and can tell you, of any seat in any of them,
    what it can and cannot see. At the Ellery he inherited a seat map drawn in
    1911, a proscenium narrowed in 1958 and no record of what that did.

    He treats a sightline as two lines that either meet on stage or do not.
    Where they do not, the seat is not a bad seat; it is a seat that cannot see
    a performer standing where the show puts them.

    His argument with the producer is about which of the two numbers moves:
    the seat map, or the blocking.
  quiz:
  - q: Why does Kettleby describe a bad sightline as two lines rather than a bad
      seat?
    a: It depends on where the performer stands, not only where the seat is
    wrong:
    - Seats are rated in pairs under the licensing scheme, so they are assessed 
      two at a time
    - The 1958 proscenium narrowing removed the original seat numbering
    - A seat with an obstructed view can be sold at a reduced price instead
- id: dowd
  name: Ruth Dowd
  role: Box Office Manager
  division: FRONT
  bio: |
    Has sold tickets for this town for twenty-two years, three venues, and
    keeps the only record of what a Tuesday looks like against a Saturday.

    She thinks in curves without using the word. Advance sales for a variety
    bill do not rise steadily: they crawl for three weeks and then go
    vertical, and a decision made in week two on week-two numbers is a
    decision made on the flat part.

    What she will not do is forecast past the last date she has data for, and
    she says so in writing every time she is asked.
  quiz:
  - q: Why does Dowd refuse to forecast past her last data point?
    a: A curve fitted inside a range says nothing certain outside it
    wrong:
    - Her ticketing system cannot export projections beyond the current sales 
      window
    - Forecasts past the last data point would have to be disclosed to the 
      producer's investors
    - Advance sales for variety bills have never been recorded accurately in 
      this town
- id: ferreira
  name: Nuno Ferreira
  role: Chief Electrician
  division: BOARD
  bio: |
    Keeps the dimmer room, which is 1958 equipment feeding a 1911 building
    through cable he has replaced twice himself.

    His interest is the gap between what a channel is set to and what it puts
    out. A fader at 50 per cent is not half the light, the old dimmers have a
    curve of their own, and the two together are why the designer's plot never
    matches the first look.

    He is the person who insists a level be measured at the performer rather
    than read off the desk.
  quiz:
  - q: Why does Ferreira measure light at the performer rather than reading the 
      desk?
    a: A fader position and the light arriving are two different quantities
    wrong:
    - The 1958 dimmers have no calibrated readout on the desk at all
    - Desk readings are averages over the whole rig rather than per channel
    - Light levels at the performer are what the licence requires to be logged
- id: haigh
  name: Simone Haigh
  role: Stage Manager
  division: FLY
  bio: |
    Runs the show from the prompt corner and the rehearsal room from a
    clipboard, and the two jobs are the same job: everything has to happen in
    an order, with a margin, and the margin is what she is actually managing.

    She builds the rehearsal call sheet as a sequence — the same interval
    between calls, repeated — because a plan with an even step in it is a plan
    anybody can see the end of.

    Her limit is that a flying sequence has to be timed, and a timing nobody
    has rehearsed is a number somebody made up.
  quiz:
  - q: Why does Haigh build the call sheet on an even interval?
    a: An even step lets anybody see where the plan ends
    wrong:
    - Union rules require rehearsal calls to be spaced at equal intervals
    - Uneven calls cannot be entered into the theatre's booking system
    - It is the only way to fit forty-one people into one rehearsal room
- id: pell
  name: Douglas Pell
  role: Licensing Officer
  division: HOUSE
  bio: |
    Comes from the council with a folder and a list, and is neither an
    obstacle nor an ally. He signs the licence if the file supports it and not
    if it does not, and he has read enough files to know the difference.

    He is precise about what he needs: a measured seat count, a load plot with
    a margin, sound levels at the seat rather than at the desk, and exit
    timings from a walked rehearsal.

    His complaint about theatres is that they treat a licence as a formality
    and then argue about it at four o'clock on opening day.
  quiz:
  - q: What does Pell mean when he says a licence is not a formality?
    a: The file has to carry measurements, not assurances
    wrong:
    - Licences are issued by a committee that meets only twice a year
    - A theatre closed for more than ten years needs a new licence rather than a
      renewal
    - He has no authority to sign anything on the day of an opening
- id: mbatha
  name: Thandi Mbatha
  role: Musical Director
  division: PIT
  bio: |
    Has a nine-piece band in a pit built for twenty-two, and the arrangement
    she is conducting was written for the twenty-two.

    Her working problem is balance, and she thinks about it in periods and
    phases: two instruments a fraction of a beat apart do not sound like a
    bigger instrument, they sound like a mistake, and the fix is timing rather
    than volume.

    She wants the pit rail lowered by three inches, which is a construction
    question, a sightline question and a sound question at once.
  quiz:
  - q: Why does Mbatha say two instruments slightly out of time are worse than 
      one?
    a: A small phase difference is heard as an error rather than as size
    wrong:
    - Nine players cannot balance an arrangement written for twenty-two at any 
      timing
    - The pit rail reflects sound back at the players and confuses their timing
    - Two instruments playing the same line always cancel at some frequencies
- id: quirke
  name: Eamon Quirke
  role: Master Carpenter
  division: SHOP
  bio: |
    Built for the Ellery before it closed and has come back for the reopening,
    which he refers to as finishing a job rather than starting one.

    He knows the building's history in dimensions: the proscenium was narrowed
    by two feet three inches in 1958, the pit rail was raised, and the fly
    grid was never widened to match. Everything awkward about this fortnight
    is downstream of one of those three.

    He measures twice and quotes the 1958 drawings as a warning rather than a
    source.
  quiz:
  - q: Why does Quirke treat the 1958 drawings as a warning?
    a: They record an alteration whose consequences were never redrawn
    wrong:
    - The 1958 drawings were made in imperial units and cannot be converted 
      reliably
    - They were drawn by the contractor rather than by an architect
    - The alterations they show were never actually carried out

glossary:
- name: Scenery
  aliases: [scenery, scenic, piece, pieces]
  def: What is built for a show and used on stage. Each item has a weight, a 
    width and a place it has to go.
- name: Ironwork
  aliases: [steel, ironwork]
  def: The beams over the stage. They are what finally takes the weight of 
    anything in the air.
- name: Reflector
  aliases: [reflector, fold-back]
  def: A surface put behind or beside players so they hear themselves. The pit 
    rail is one by accident.
- name: Fly floor
  aliases: [fly floor, flying, flown]
  def: The gallery high up at the side of the stage, where a crew works the 
    lines by hand.
- name: Grid
  aliases: [grid, the grid]
  def: The frame over the stage that everything in the air is tied to. It has a 
    stated limit, and here nobody has tested it since 1958.
- name: Batten
  aliases: [batten, battens]
  def: A bar over the stage that lanterns and cloth are bolted to. It goes up 
    and down on lines.
- name: Counterweight
  aliases: [counterweight]
  def: Weights that balance what is on the other end of a line, so one person 
    can move it. Added in 1958.
- name: Amplitude
  aliases: [amplitude]
  def: Half the distance from the top of a wave to the bottom. On a sound 
    waveform it is how loud, before any scale is applied.
- name: Period
  aliases: [period, periodic]
  def: How much input one full cycle of a repeating function takes. For a wave 
    in time, how long one cycle lasts.
- name: Phase
  aliases: [phase, phase shift]
  def: Where in its cycle a wave starts. Two identical waves a little out of 
    phase do not add up to a bigger one.
- name: Decibel
  aliases: [decibel, decibels, db]
  def: A logarithmic scale for a ratio of intensities. Three decibels is a 
    doubling and ten is a factor of ten.
- name: Radian
  aliases: [radian, radians]
  def: An angle measured as the arc it sweeps divided by the radius. A full turn
    is two pi of them.
- name: Polar coordinates
  aliases: [polar, polar coordinates]
  def: Naming a point by a distance and a bearing from a centre, rather than by 
    two perpendicular measurements.
- name: Asymptote
  aliases: [asymptote, asymptotes, asymptotic]
  def: A line a curve approaches without reaching. A vertical one sits where a 
    denominator goes to zero.
- name: Vector
  aliases: [vector, vectors]
  def: A quantity with a size and a direction, which can be split into 
    perpendicular parts and added part by part.
- name: Sightline
  aliases: [sightline, sightlines]
  def: The straight line from a seat to a point on stage. If something solid is 
    in the way, that seat cannot see that point.
- name: Proscenium
  aliases: [proscenium]
  def: The arch framing the stage. The Ellery's was narrowed by two feet three 
    inches in 1958 and nothing downstream was redrawn.
- name: Reverberation
  aliases: [reverberation, reverberant, ring]
  def: Sound continuing after its source has stopped, decaying by the same 
    fraction each interval. An empty room rings; seats and people stop it.
- name: Licence
  aliases: [licence, licences, licensing]
  def: The permission a public theatre needs before it may let an audience in. 
    Granted on measured numbers — exit times, loads, sound levels — and not on 
    assurances.
- name: Residual
  aliases: [residual, residuals]
  def: What a model missed by at one point — the observed value minus the 
    predicted one. A pattern in them means the wrong shape was chosen.

warmups:
  # ONE SENTENCE, and purely functional. This run lands before mission 1, on a
  # morning the player has met nobody and knows no part of the argument, so its
  # reason is orientation itself rather than manufactured drama — who is here and
  # what the ground is. The mission-4, 8 and 13 runs below keep a real authored
  # reason, because by then the cast and the argument are known.
  greet:
    title: Forty-one people, and half of them started yesterday
    why: >-
      Forty-one people were hired separately for this fortnight and most have never
      worked this
      building, so get round as many of them as you can and put a face to each job.
  trial-near:
    title: Walk the building before you sign for it
    why: >-
      Eleven years shut, one alteration in 1958 and no survey since. Eamon Quirke,
      the master
      carpenter, walks every new manager the length of the backstage corridor once,
      because the
      proscenium is two feet three inches narrower than the drawings and everything
      awkward
      about this fortnight comes off that one fact.
  follow:
    title: Follow Novak round the set-out
    why: >-
      Petra Novak, who runs the scene shop, sets out the curved rostrum on the stage
      floor
      itself rather than on paper, and she does not stop walking to explain it. Stay
      with her:
      the arc she is stepping out is the piece the flying sequence has to clear, and
      its radius
      is the number three later calculations use.
  hunt:
    title: Six lanterns went out with the 1974 sale
    item: {name: lantern, plural: lanterns}
    why: >-
      The rig plot lists six units that are not on the bars, and Nuno Ferreira, the
      chief
      electrician, thinks they are still in the building rather than sold. Find all
      six. Every
      one you turn up is a unit the budget does not have to hire, and the plot has
      to be right
      before the board is plotted.
  canvass:
    title: Ask the front six rows what they can see
    why: >-
      Alan Kettleby, the house manager, will not withdraw a seat on an opinion and
      will not sell
      one on a guess. Sit somebody in each of the front rows with the marker on stage,
      ask one
      question and count the answers — a sightline is a measurement and the room is
      the only
      instrument for it.
  evade:
    title: Keep clear of Pell until the load plot is filed
    why: >-
      Douglas Pell, the licensing officer, is in the building and asking about the
      grid. Keep
      your distance until the load plot is in the file: a number given in a corridor
      becomes the
      number on the licence, and the one in your head has no margin written on it
      yet.
  tag:
    title: Catch Sallow before the seat map goes to print
    why: >-
      Marguerite Sallow, who is producing, has the seat map going to the printer at
      four and the
      front six rows are still on it. She is crossing the building at speed with a
      folder under
      her arm, and print is the point after which a sightline problem becomes a refund
      problem.

# ---------------------------------------------------------------- the fortnight
missions:
  # ----- day 1. What the building is, and what has sold.
- title: Eleven years of dust and nine hundred seats
  objective: Establish what the room actually is and what the sales are doing.
  briefing: The seat map is 1911, the proscenium is 1958, and the advance is 
    three weeks old.
    # Hettie Prosser is planted here — off the roster, deliberately, and the seat
    # the 1958 proscenium blinds on day 8.
  stake: >-
    Monday, fourteen days out. The advance shows two rates, one steep and one flat,
    and
    nobody has checked a single seat in this room since 1958. Today you find which
    rate is
    real, and which seats might already be sold blind.
  takeaway: A rate of change belongs to the interval it was measured over.
  segue: >-
    Two rates are on the board now, and the steep one has already slowed. But the
    seat map
    is still in the drawer. Nobody has signed it. Hettie Prosser's seat — row A, seat
    12 —
    still has no line to the stage.
  stops:
  - group: FRONT
    task: Work out what the advance is doing per week
    title: Off the flat part
    place: Box Office
    reason: "Dowd's three weeks of advance are the only numbers anyone has, and Sallow
      is already quoting the wrong one as the fortnight's trend."
    relationship: >-
      The average rate of change, rate = Δy ÷ Δx: the change in sales divided by the
      weeks it happened over.
    concept: 'Average rate of change over an interval'
    takesAsRead:
    - 'A function as a rule, its domain and what the domain rules out'
    scene: >-
      Ruth Dowd, the box office manager, has three weekly checkpoints from the advance:
      41 seats sold in total at the end of week one, 66 by the end of week two, and
      188 by the end of week three. Marguerite Sallow, the producer, is quoting the
      last one-week jump as though it were the rate for the whole fortnight.
    guide: >-
      A rate of change is a change in a cumulative total divided by the time between
      the two checkpoints. Work out the average from week one to week three, then
      compare it with the last one-week jump. Both are correct arithmetic about the
      same curve; they answer different interval questions.
    background:
    - >-
      Why the interval matters as much as the numbers. From the first checkpoint to
      the third, the advance rises by 147 seats over two weeks, or 73.5 seats a week
      on average. Over the final one-week step it rises by 122. Neither rate is wrong;
      the interval is part of the statement.
    - >-
      What a rising rate of change means. The steps are 25 and 122, so the rate is
      not
      constant — the curve is bending upward. A quantity whose rate of change is itself
      increasing cannot be described by any single average without saying which interval
      it
      is the average of.
    - >-
      Why the shape of a variety advance is known. Dowd has twenty-two years of it:
      three
      weeks flat, then vertical in the last fortnight. That is a fact about how people
      buy tickets rather than about this show. It is why a
      week-two decision is a decision made on the flat part.
    assumes:
    - the three weekly figures are complete weeks
    takeaway: A rate of change belongs to an interval, and cumulative totals 
      must be read as cumulative totals.
    format: BALLPARK
    question: Estimate the average rate of change in sales across the three 
      weeks.
    estimate:
      prompt: "Cumulative advance at weekly checkpoints: 41, 66, 188. Dowd wants the
        average rate from the first checkpoint to the third."
      question: Estimate the average rate of change in sales across the three 
        weeks.
      labels:
      - 188  (cumulative seats sold by week three)
      - 41  (cumulative seats sold by week one)
      - 2  (weeks between the first and the third)
      - 122  (the last step on its own)
      values: [188, 41, 2, 122]
      slots: 3
      template: '({0} − {1}) ÷ {2}'
      formula: (a-b)/c
      correct: [0, 1, 2]
      target: 73.5
      tolerance: 6
      units: seats a week
      solution: rate = (188 − 41) ÷ 2 = 73.5 seats a week.
      explanation: Seventy-four a week averaged over the interval, against 122 
        in the last week alone — the curve is bending, so neither figure 
        describes the fortnight.
    answerText: About 73.5 seats a week from the first checkpoint to the third, 
      against 122 seats in the last one-week jump.
    why: >-
      The cumulative advance rises by 147 seats between the first and third checkpoints,
      across two weekly intervals, so the average rate is 73.5 seats a week. The final
      one-week jump is 122. Both are honest rates and they answer different questions.
      Dividing by three is the common slip: three checkpoints contain only two intervals
      between the first and the third.
    rebuttals:
    - Three data points have two intervals between them, so dividing by three 
      understates the rate.
    - The last step alone is a rate over one week and cannot be read as the rate
      across three.
  - group: HOUSE
    task: Say which seats are actually in question
    title: Two lines that have to meet
    place: The House
    reason: "Kettleby has to know which seats are actually in question before he can
      answer for the seat map to anyone who asks."
    concept: 'A function as a rule, its domain and what the domain rules out'
    scene: >
      Alan Kettleby, the house manager, has the 1911 seat map and a proscenium narrowed
      by
      two feet three inches in 1958. Nobody has drawn a sightline since. Nine hundred
      seats
      are on sale.
    guide: >-
      A sightline is a straight line from a seat to a point on stage. So a seat is
      not good or
      bad on its own. It is a seat that can or cannot see a particular place. Work
      out what
      has to be known before any seat can be called into question, and which of the
      four
      things on offer is the one nobody has.
    background:
    - >-
      Why a seat is not the unit. The same seat sees a performer at centre stage and
      not one
      standing three metres left of centre. So the question is a pair: a seat, and
      a place
      somebody stands. That is what makes it two lines rather than a rating.
    - >-
      What the 1958 alteration did. Narrowing the proscenium by two feet three inches
      moved
      both edges of the frame inward. Every seat at the outer end of a row lost some
      of the stage, and the further forward
      the seat, the more it lost. That is why the front rows are the ones in question
      rather
      than the back.
    - >-
      Why the domain matters here. The function that matters takes a seat and a stage
      position and returns whether the line is clear. Its domain is every pair, and
      the
      pairs nobody has evaluated are the ones the show is about to sell.
    assumes:
    - the 1958 alteration was symmetric about the centre line
    takeaway: A sightline is a pair — a seat and a place somebody stands — not a
      property of a seat.
    format: CHOICE
    question: What has to be known before any seat can be called into question?
    choices:
    - Where the show puts a performer, and which seats have a clear line to it
    - The 1911 seat numbering and the current row spacing
    - How much each seat in the front rows was sold for
    - The width of the proscenium before and after 1958
    answer: Where the show puts a performer, and which seats have a clear line 
      to it
    why: >
      A sightline takes two things: a seat, and a place on stage. Without the second,
      no seat
      can be assessed at all, and the blocking is exactly what nobody has written
      down yet.
      That is why the question goes to the director before it goes to the seat map.
      The
      proscenium widths are known and are not sufficient — they say the frame moved
      without
      saying who lost what. The seat numbering is a naming scheme rather than a geometry,
      and
      the price a seat sold for is what the problem costs rather than whether it exists.
    rebuttals:
    - Numbering names the seats; it says nothing about what any of them can see.
    - Price is what the problem costs once it is established, not evidence that 
      it exists.
    - The two widths say the frame moved, without saying which seats lost which 
      part of the stage.
  - group: SHOP
    task: Set out the curve the piece has to follow
    title: An arc, a radius and an angle
    place: Scene Shop
    reason: "Novak can't order timber for the rostrum until the front edge is nailed
      down, and the piece is due on stage this week."
    relationship: >-
      The arc length s = rθ, with θ in radians: an angle measured in radians is the
      arc it sweeps divided by the radius.
    concept: 'Radians, and the arc a radius sweeps'
    scene: >
      Petra Novak, who runs the scene shop, is setting out a curved rostrum on the
      stage floor. The design gives a radius of
      4.2 metres and an arc that turns through 1.15 radians. She needs the length
      of the
      front edge before she orders timber.
    guide: >-
      An angle in radians is defined as the arc divided by the radius, so the arc
      is just the
      radius multiplied by the angle. That is the whole formula, and it is why radians
      have no
      conversion factor in them. Work out the front edge, and note what the same angle
      would
      give at a different radius.
    background:
    - >-
      Why radians make this simple. Measured in degrees the same calculation needs
      a factor
      of pi over 180 every time. A radian is the angle whose arc equals its radius,
      so arc
      length is a multiplication and nothing else. Every formula in the course that
      mixes
      angles with lengths is written this way for that reason.
    - >-
      What the number is for. The front edge is faced with a single strip of ply bent
      round
      the curve, and it is ordered by length. Two hundred millimetres short is a joint
      in the
      middle of the front edge, on the piece the audience looks at all evening.
    - >-
      Why the radius has to come off the floor rather than the drawing. Novak sets
      out on the stage because the 1958 proscenium moved the centre line. A curve
      set out from the drawing's centre lands two feet three inches off the room's.
    assumes:
    - the arc is a single circular curve of constant radius
    takeaway: An angle in radians times a radius is an arc length, with nothing 
      else in it.
    format: BALLPARK
    question: Estimate the length of the rostrum's front edge.
    estimate:
      prompt: The curve has a radius of 4.2 m and turns through 1.15 radians. 
        Novak orders the facing strip by length.
      question: Estimate the length of the rostrum's front edge.
      labels:
      - 4.2 m  (radius of the curve)
      - 1.15 rad  (angle the curve turns through)
      - 65.9 deg  (the same angle in degrees)
      - 8.4 m  (the diameter)
      values: [4.2, 1.15, 65.9, 8.4]
      slots: 2
      template: '{0} × {1}'
      formula: a*b
      correct: [0, 1]
      target: 4.83
      tolerance: 0.3
      units: m
      solution: s = rθ = 4.2 × 1.15 = 4.83 m.
      explanation: Just under five metres, so a single strip covers it — using 
        the angle in degrees would give 277 metres.
    answerText: About 4.83 metres, which one strip of facing covers with a 
      little to spare.
    why: >
      Radius times angle in radians is the arc: 4.2 times 1.15 is 4.83 metres. The
      degree figure is on the tile row because it is the same angle, and it cannot
      be used
      this way. Multiplying by 65.9 gives 277 metres, which is absurd enough to catch.
      It is
      exactly the mistake a calculator left in the wrong mode makes silently. The
      reason radians work here
      is definitional: a radian is the angle whose arc equals its radius, so the conversion
      factor is one. The diameter is the other trap, and it would give twice the answer,
      which
      is not absurd at all.
    rebuttals:
    - The angle in degrees needs a factor of pi over 180 before it can multiply 
      a length.
    - Using the diameter doubles the arc, which is wrong by a factor that looks 
      plausible.

  # ----- day 2. Sequences: the call sheet and the batten heights.
- title: An even step, and a doubling one
  objective: Build the rehearsal sequence and the batten trim heights, and tell 
    the two kinds apart.
  stake: >-
    Tuesday. Before the first flying rehearsal, two lists must exist. One climbs by
    the same
    step each time, while the other climbs by a step that keeps changing. Today you
    build
    both lists, and say which is which.
  takeaway: A constant difference and a constant ratio are two different kinds 
    of list.
  segue: >-
    Both lists are done, and a flyer walked the arc at her own height first. So the
    rehearsal goes ahead. But every angle above her head still comes from the 1911
    plan, and
    nobody has checked one yet.
  stops:
  - group: FLY
    task: Work out the eleventh trim height
    title: The same step, eleven times
    place: Fly Floor
    reason: "Osei needs the eleventh trim height today or he can't set the counterweights
      before the first flying rehearsal."
    relationship: >-
      The arithmetic sequence aₙ = a₁ + (n − 1)d, with d the common difference added
      each time.
    concept: 'Arithmetic sequences: a constant difference'
    takesAsRead:
    - 'Average rate of change over an interval'
    scene: >
      Kwame Osei, the head flyman, has trim heights that start at 2.40 metres for
      the first
      batten and rise 0.34 metres for each one upstage. There are eleven battens.
      He needs
      the last one before he sets the counterweights.
    guide: >-
      A sequence that adds the same amount each time is fixed by two numbers: where
      it starts
      and what it adds. The trap is the count. Going from the first term to the eleventh
      is ten steps, not eleven. One step of 0.34
      metres is the difference between a piece that clears the grid and one that does
      not.
    background:
    - >-
      Why the trim heights rise at all. The grid is not level with the stage. Each
      batten upstage sits a little higher, so a
      cloth hung on the eleventh has to be flown further to clear the one in front
      of it. The rise is set by the ironwork and is genuinely
      constant.
    - >-
      Why the off-by-one is the whole risk. Eleven terms have ten gaps. Using eleven
      gives 6.14 metres instead of 5.80. That is a batten trimmed 340
      millimetres high, enough that the cloth shows its bottom edge to the front rows.
    - >-
      What makes it arithmetic rather than geometric. The heights add a constant,
      they do not
      multiply by one. A geometric rise would put the eleventh batten at nearly forty
      metres,
      which is above the roof, and noticing that is faster than checking the arithmetic.
    assumes:
    - the rise between battens is constant across all eleven
    takeaway: A sequence with n terms has n − 1 steps in it.
    format: VERIFY
    question: Predict the eleventh trim height, then put a tape on it and 
      report.
    verify:
      hint: >-
        Lock the prediction before the tape goes up. Eleven battens have ten gaps
        between them,
        and both numbers are on the ironwork drawing.
      prediction: {label: Predicted trim height of batten eleven, unit: m, min: 
          2, max: 9, step: 0.05}
      truth: 5.80
      passRatio: [0.9, 1.1]
      intervention:
        label: Send a tape up to batten eleven
        note: One flyman on the grid ladder, measuring from the stage floor.
        outcome: Tape up. Read at the batten with the set at working trim.
      measurement:
        label: Measured trim height
        note: 5.74 metres — six centimetres under the drawing, which is the 
          ironwork rather than the arithmetic.
        cost: 1
        costUnit: climbs
      unmeasuredMoral: >-
        A trim height computed from a drawing is a statement about the drawing. The
        counterweights
        are set against the batten, and only the tape knows where the batten is.
      commit: Report the trim height
    answerText: >-
      Predicted 5.80 metres from ten steps of 0.34, measured 5.74 — six centimetres
      of accumulated
      ironwork, and nowhere near the 6.14 that eleven steps would have given.
    why: >
      Eleven battens have ten gaps, so the prediction is 2.40 plus ten steps of 0.34:
      5.80 metres.
      The tape says 5.74. Six centimetres over ten spacings is the ironwork rather
      than the
      arithmetic, and it is exactly the sort of drift a 1911 building accumulates.
      What the measurement rules out is the off-by-one. Eleven steps would have given
      6.14,
      which is 400 millimetres above what the tape found. Of those millimetres, 340
      would have
      been a cloth showing its bottom edge to the front rows all evening.
  - group: SHOP
    task: Say which sequence the timber order follows
    title: Sixteen pieces, each a little shorter
    place: Scene Shop
    reason: "Quirke wrote the tread order as a subtraction, and Novak needs to know
      whether that's actually the right kind of list before cutting timber."
    concept: 'Arithmetic sequences: a constant difference'
    takesAsRead:
    - 'Average rate of change over an interval'
    scene: >
      Novak has sixteen treads for a raked rostrum. The first is 3.60 metres and each
      one is
      4 per cent shorter than the one below it. Quirke, the master carpenter, has
      written the
      order out as a constant subtraction.
    guide: >-
      Read what the design says rather than what the order sheet says. Four per cent
      shorter
      than the one below is a multiplication, repeated; a constant subtraction is
      an addition,
      repeated. Work out where the two lists disagree, and by how much at the top
      of the rake.
    background:
    - >-
      Why the two look identical at first. Over the first two or three terms, four
      per cent of
      3.60 is about 0.14 metres, so a constant subtraction of 0.14 fits almost exactly.
      The
      lists diverge slowly and then obviously, which is why the mistake survives the
      first
      few pieces being cut correctly.
    - >-
      Where they end up. Sixteen terms at four per cent leaves the last tread at 1.98
      metres.
      Sixteen terms subtracting 0.14 leaves it at 1.50. Half a metre of tread, on
      a piece a
      performer stands on.
    - >-
      Which one the design means. A raked rostrum narrows in proportion because it
      is
      following a perspective, and a perspective is a ratio. That is a fact about
      the drawing
      rather than about arithmetic, and it is the reason to ask before ordering.
    assumes:
    - the design's four per cent is per tread rather than overall
    takeaway: A constant proportional change is a ratio, and it only looks like 
      a difference at the start.
    format: CHOICE
    question: What is wrong with writing the treads as a constant subtraction?
    choices:
    - It matches for the first few and is half a metre out by the top
    - It gives a negative length before the sixteenth tread
    - Constant subtraction cannot be used for lengths at all
    - The design's percentage is an overall reduction rather than per tread
    answer: It matches for the first few and is half a metre out by the top
    why: >
      Four per cent of 3.60 is 0.144. So a constant subtraction of about 0.14 fits
      the first two
      or three treads almost exactly, and then drifts. The ratio takes four per cent
      of a
      steadily smaller number, while the subtraction keeps taking the same amount.
      By the
      sixteenth tread the two lists are 1.98 metres and 1.50 metres, which is half
      a metre of
      timber on a piece somebody stands on. The subtraction does not go negative in
      sixteen
      terms, so nothing about the order sheet looks absurd, and that is exactly why
      it would
      have been cut.
    rebuttals:
    - Sixteen steps of 0.14 from 3.60 leaves 1.50 metres, which is short but not
      negative.
    - Constant subtraction is perfectly usable for lengths; it is the wrong 
      model for this design.
    - The design specifies four per cent per tread, which is what makes it a 
      ratio.
  - group: PIT
    task: Work out what the gain stages come to
    title: Four stages, each times something
    place: Orchestra Pit and Sound
    reason: "Brand's signal chain multiplies at every stage, and she needs one plain
      number out of it before the band's first call."
    relationship: >-
      The geometric sequence aₙ = a₁ · rⁿ⁻¹, with r the common ratio multiplied in
      at each stage.
    concept: 'Geometric sequences: a constant ratio'
    takesAsRead:
    - 'Arithmetic sequences: a constant difference'
    scene: >-
      Ilse Brand, the sound designer, has a test signal passing through four gain
      stages, each multiplying voltage by 3.2. The input to the chain is 0.004 volts,
      and she wants the voltage leaving the fourth stage before it reaches the next
      device.
    guide: >-
      Gain stages multiply. Four of them at 3.2 each is not 12.8 times the signal,
      and the
      difference between adding and multiplying is the entire reason a chain like
      this clips.
      Work out what arrives at the amplifier, then compare it with what adding the
      gains would
      have suggested.
    background:
    - >-
      Why every stage multiplies. Each one takes whatever arrives and scales it, so
      the
      output is the input times the product of the gains. That is a geometric sequence
      with the input as its first term. It is why gain is
      quoted in decibels: logarithms turn the multiplication into an addition a person
      can
      do in their head.
    - >-
      What clipping is. Every stage has a ceiling, and a chain that multiplies reaches
      it
      suddenly. Four stages of 3.2 is a factor of 105. So an input a little hotter
      than expected
      arrives at the amplifier far past what it can pass, and the result is distortion
      rather than loudness.
    - >-
      Why the fourth stage is where it shows. The first three multiply a small number
      and
      the fourth multiplies a large one. The same 3.2 is worth 0.009 volts at the
      first stage and 0.29 at the last. That is why
      gain is set from the front of the chain backwards.
    assumes:
    - each stage passes its input to the next without limiting
    takeaway: Gains multiply, so a chain reaches its ceiling suddenly rather 
      than gradually.
    format: BALLPARK
    question: Estimate the signal leaving the fourth gain stage.
    estimate:
      prompt: 0.004 V in, four stages of gain 3.2 each. Brand wants the voltage 
        after the fourth stage.
      question: Estimate the signal leaving the fourth gain stage.
      labels:
      - 0.004 V  (the microphone signal)
      - 3.2  (gain at each stage)
      - 4  (number of stages)
      - 12.8  (the four gains added)
      values: [0.004, 3.2, 4, 12.8]
      slots: 3
      template: '{0} × {1}^{2}'
      formula: a*Math.pow(b,c)
      correct: [0, 1, 2]
      target: 0.42
      tolerance: 0.05
      units: V
      solution: 0.004 × 3.2⁴ = 0.004 × 104.9 = 0.42 V.
      explanation: Four hundred and twenty millivolts, against 51 if the gains 
        had added — a factor of eight between the two answers.
    answerText: About 0.42 volts, where adding the gains would have suggested 
      0.051.
    why: >
      Four stages of 3.2 multiply to 104.9, so 4 millivolts becomes 420. Adding the
      gains gives 12.8 and an answer of 51 millivolts. That is a factor of eight out,
      in the direction that makes a chain look safe when it is not. That is what makes
      this a geometric sequence
      rather than an arithmetic one: each stage scales what arrives rather than adding
      to it.
      It also explains where the trouble appears. The same 3.2 is worth nine millivolts
      at the
      first stage and 290 at the last, so gain is always set from the front backwards.
    rebuttals:
    - Adding the four gains treats each stage as contributing the same amount 
      rather than the same factor.
    - Three stages rather than four is the level at the group output, one stage 
      short of the amplifier.

  # ----- day 3. Angles: the beam and the corner.
- title: What the lantern is pointing at
  objective: Get an angle out of two measurements, and a beam onto a mark.
  briefing: The rig plot is written in bearings, and the bars are hung on a plan
    drawn in 1911.
  stake: >-
    Wednesday. Get the angle wrong, and the crew hangs the same lamp twice before
    the notes
    meeting at six. Today you turn two measurements into one angle, and that angle
    into a
    spot on a bar.
  takeaway: Two sides of a right triangle fix an angle, and the angle is what a 
    rigger can work to.
  segue: >-
    Four bars went up on measured angles, not the 1911 plan. The crew signed the rig
    plot at
    six. Not one lamp had to be hung twice. But a lantern now lights Hettie Prosser's
    row,
    aimed at a mark she may not see at all.
  stops:
  - group: BOARD
    task: Work out the angle the lantern has to make
    title: Six metres up, nine metres out
    place: Lighting Board
    reason: "Ferreira can't set the yokes until Adeyemi's down angle is worked out,
      and a wrong hang means doing it again with the whole company standing about."
    relationship: >-
      The tangent ratio, tan θ = opposite ÷ adjacent, so the angle is the arctan of
      opposite over adjacent.
    concept: 'Right-triangle ratios, and finding an angle from two sides'
    takesAsRead:
    - 'The unit circle, and sine and cosine as coordinates'
    scene: >
      The front-of-house bar is 6.2 metres above the stage floor and 9.4 metres out
      from the
      performer's mark. Tunde Adeyemi, the lighting designer, wants the down angle
      before
      Nuno Ferreira, the chief electrician, sets the yokes.
    guide: >-
      Two sides of a right triangle fix the angle. The height above the mark is opposite
      the angle at the lantern, and the horizontal
      distance is adjacent to it. So the ratio of those two is the tangent, and the
      inverse
      tangent of it is the angle. Work it out, then say
      what the same lantern would need if the bar were two metres lower.
    background:
    - >-
      Why this angle rather than another. A performer's face is lit by what arrives
      from
      above and in front, and the usual figure is somewhere near thirty-five to forty-five
      degrees down. Steeper puts the eyes in shadow; shallower puts the light in the
      audience's eyes and flattens the face.
    - >-
      Why the inverse function is needed. The ratio is the easy part; the angle has
      to be
      recovered from it, and that is what an inverse trigonometric function is for.
      It
      returns one angle from a restricted range, which is all that is wanted here
      because a
      lantern's down angle is between zero and ninety degrees by construction.
    - >-
      Why the numbers come off the room. The bar height is measured with a tape from
      the stage floor, and the distance from the
      mark is stepped out on the deck. The 1911 plan puts the bar 400 millimetres
      further
      out than it is.
    assumes:
    - the mark is on the centre line of the beam
    takeaway: A ratio of two sides gives the tangent, and the inverse tangent 
      gives the angle back.
    format: BALLPARK
    question: Estimate the down angle from the bar to the mark.
    estimate:
      prompt: The bar is 6.2 m above the mark and 9.4 m out from it. Adeyemi 
        needs the angle below the horizontal.
      question: Estimate the down angle from the bar to the mark.
      labels:
      - 6.2 m  (height above the mark)
      - 9.4 m  (horizontal distance to it)
      - 11.3 m  (the straight-line throw)
      - 45 deg  (the angle a designer would prefer)
      values: [6.2, 9.4, 11.3, 45]
      slots: 2
      template: 'arctan({0} ÷ {1})'
      formula: Math.atan(a/b)*180/Math.PI
      correct: [0, 1]
      target: 33.4
      tolerance: 2.5
      units: deg
      solution: θ = arctan(6.2 ÷ 9.4) = arctan(0.660) = 33.4°.
      explanation: Thirty-three degrees — shallow for a face light, which is a 
        rigging problem rather than an arithmetic one.
    answerText: About 33 degrees below the horizontal, which is shallower than 
      the designer wants.
    why: >
      The height is opposite the angle and the distance is adjacent to it. So the
      tangent is 6.2
      over 9.4, which is 0.66, and the inverse tangent of that is 33.4 degrees. The
      arithmetic settles a rigging argument: 33 degrees is shallow for a face light,
      so either
      the bar comes in or the mark moves upstage. Using the straight-line throw of
      11.3 metres as one of the two sides gives 33 degrees for
      the wrong reason. That length is the hypotenuse, and it belongs in a sine or
      a cosine
      rather than a tangent. The 45 degrees is what a designer
      would like and is not a measurement of anything in this room.
    rebuttals:
    - The 11.3 metres is the hypotenuse. Using it with the height gives a sine, 
      not a tangent.
    - The 45 degrees is a preference rather than a measurement of this bar.
  - group: FRONT
    task: Say which curve the advance is following
    title: Flat, then vertical
    place: Box Office
    reason: "Sallow wants Thursday's forecast, and Dowd's four weeks of numbers no
      longer fit the straight line everyone has been using."
    concept: 'Choosing a model, and what a residual says about the choice'
    takesAsRead:
    - 'Average rate of change over an interval'
    scene: >
      Dowd has four weeks now: 41, 66, 188, 402. Sallow wants a forecast for the fortnight.
      A straight line through the four points misses the last one by ninety seats.
    guide: >-
      Compare the fingerprints of the simple families on the list. A line has constant
      first differences, an exponential has a constant ratio, and a quadratic has
      constant second differences. Decide which one best matches these four checkpoints,
      then keep the extrapolation caveat separate from the fit.
    background:
    - >-
      What the differences say. The steps are 25, 122 and 214, which is not constant,
      so it
      is not linear. The ratios are 1.6, 2.8 and 2.1, which is not constant either.
      The
      second differences are 97 and 92, which very nearly are — and that is a quadratic.
    - >-
      Why residuals rather than appearance. Any smooth curve through four points looks
      plausible drawn by hand. The residual is the observed value minus the predicted
      one,
      and a model with a pattern in its residuals is the wrong shape however close
      it looks.
    - >-
      Why the choice matters more than the fit. All three models agree closely inside
      the
      four weeks and disagree wildly outside them, which is where the forecast is.
      The
      fortnight ahead is exactly the region the data cannot arbitrate.
    assumes:
    - the four weekly figures are complete and comparable
    takeaway: A table can support one simple model family better than another 
      without proving that family is the true mechanism.
    format: CHOICE
    question: Which simple family best matches the four weekly checkpoints?
    choices:
    - 'Quadratic: the second differences are nearly constant'
    - 'Linear: the sales rise every week'
    - 'Exponential: the sales more than double at one point'
    - None of them can be compared from only four checkpoints
    answer: 'Quadratic: the second differences are nearly constant'
    why: >-
      The first differences are 25, 122 and 214, so a line is a poor match. The ratios
      are 1.6, 2.8 and 2.1, so a single exponential is also a poor match. The second
      differences are 97 and 92, which makes a quadratic the best match among these
      three simple families. That is evidence for a local model, not proof that ticket
      buying is intrinsically quadratic. Many other functions could pass through four
      points, and extrapolation is exactly where those alternatives separate.
    rebuttals:
    - Rising every week makes it increasing. Linear needs the rise to be the 
      same each week.
    - One doubling is not a constant ratio, and the ratios here run 1.6, 2.8 and
      2.1.
    - Four checkpoints are enough to compare these listed simple families; they 
      are not enough to prove a unique underlying function.

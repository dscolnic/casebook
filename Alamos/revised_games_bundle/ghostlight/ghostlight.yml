    - The gap between frame and performer across the stage, which is 2.3 m
    mapping: [0, 1, 2, 3]
    rebuttals:
    - Two distances from the centre line and the proscenium fix where the 
      performer is standing, and nothing else.
    - The frame edge and the seat's distance back give the angle at which the 
      frame cuts across that seat's view.
    - A seat's offset and its distance back give its own bearing from the centre
      line.
    - Two distances measured across the stage give a gap, which is not an angle 
      at all.
    answerText: >-
      Offset and depth fix the performer; frame and seat distance give the frame's
      angle; offset
      and depth give the seat's bearing; two cross-stage distances give only a gap.
    why: >
      Every angle here comes from two perpendicular distances, and the discipline
      is keeping
      track of which point each one is measured from. The performer's position is
      an offset and a
      depth. The frame's angle is measured from the seat, using the frame's offset
      and the seat's
      distance back. The seat's own bearing uses its own offset and the same depth.
      The fourth pair is the one that is not an angle at all. Two distances measured
      across the
      stage give the gap between the frame and the performer. That gap is 2.3 metres,
      and it
      says nothing about any seat until it is put beside a distance back.

  # ----- day 4. Waves, and a curve that decays.
- title: Four numbers describe a wave
  objective: Read a waveform for its four parameters, and fit a decay to the 
    ticket returns.
  briefing: A trace off the sound desk needs four numbers, and three weeks of 
    returns need a shape.
  stake: >-
    Thursday. The band plays in this room for the first time at two, and nobody in
    the pit
    yet knows if it helps them or fights them. Today you turn that sound into four
    plain
    numbers, and put a shape on this week's ticket returns.
  takeaway: Amplitude, midline, period and phase fix a sinusoid completely.
  segue: >-
    Four numbers now describe the sound. Nine musicians finally have something exact
    to tune
    to. But the ticket returns are still falling on last week's curve. The advance
    is behind
    where the show was budgeted.
  stops:
  - group: PIT
    task: Read the four parameters off the trace
    title: Tall, often, centred, and starting where
    place: Orchestra Pit and Sound
    reason: "Brand has to hand Mbatha's nine players a number instead of an adjective
      before the band's first call into the room."
    relationship: >-
      The sinusoid y = A·sin(B(x − C)) + D, with A the amplitude, B setting the period,
      C the phase shift and D the midline.
    concept: 'A sinusoid: amplitude, midline, period and phase'
    takesAsRead:
    - 'The unit circle, and sine and cosine as coordinates'
    scene: >
      The trace runs between 0.18 and 0.62 volts. It repeats every 4.5 milliseconds.
      Its first
      upward crossing of the middle comes 0.9 milliseconds after the trigger.
    guide: >-
      Four numbers fix any sine wave and each one comes off the trace directly. The
      midline is halfway between the top and the bottom. The amplitude is half the
      distance
      between them. The period is the repeat, and the phase is where the cycle starts
      relative
      to the trigger. Work out the first two and say what the other two are read from.
    background:
    - >-
      Why amplitude is half and not all. The amplitude is measured from the midline
      to the
      peak, so the peak-to-peak figure an oscilloscope shows is twice it. This is
      the most
      common misreading of a trace and it doubles every level derived from it.
    - >-
      Why the midline is not zero here. The signal is riding on a direct offset of
      0.40
      volts, which is a fault rather than a feature: something upstream is passing
      a standing
      voltage. It does not change the sound and it does eat headroom, and it is visible
      only
      because the midline was read rather than assumed.
    - >-
      Why the phase matters to Thandi Mbatha, the musical director, rather than to
      Brand.
      Two instruments a fraction of a
      cycle apart do not sound bigger, they sound wrong, and the fix is timing. The
      phase
      shift is the number that says how far apart they are in the only units that
      matter,
      which is a fraction of a period.
    assumes:
    - the trace is a single sinusoid rather than a sum of several
    takeaway: Amplitude is measured from the midline, not from the bottom of the
      trace.
    format: BALLPARK
    question: Estimate the amplitude of the trace.
    estimate:
      prompt: The trace runs between 0.18 V and 0.62 V. Brand wants the 
        amplitude, not the peak-to-peak.
      question: Estimate the amplitude of the trace.
      labels:
      - 0.62 V  (the top of the trace)
      - 0.18 V  (the bottom of the trace)
      - 2  (the divisor that makes it an amplitude)
      - 4.5 ms  (the repeat interval)
      values: [0.62, 0.18, 2, 4.5]
      slots: 3
      template: '({0} − {1}) ÷ {2}'
      formula: (a-b)/c
      correct: [0, 1, 2]
      target: 0.22
      tolerance: 0.02
      units: V
      solution: A = (0.62 − 0.18) ÷ 2 = 0.22 V, on a midline of 0.40 V.
      explanation: 0.22 volts amplitude on a 0.40 volt midline — and that 
        midline is a standing offset that should not be there.
    answerText: 0.22 volts, sitting on a midline of 0.40 that should not be 
      there at all.
    why: >
      The peak-to-peak span is 0.44 volts, so the amplitude — measured from the midline
      to the
      peak — is half of it: 0.22. Reading 0.44 as the amplitude is the standard error
      and doubles
      every level derived from the trace. The more interesting number is the one that
      falls out for free. The midline is 0.40 volts
      rather than zero, so the signal is riding on a standing offset. It does not
      change what anybody hears and it eats headroom, and it is only visible
      because the midline was read rather than assumed to be zero.
    rebuttals:
    - The full span between the extremes is peak-to-peak, which is twice the 
      amplitude.
    - The top of the trace on its own is a peak measured from zero, not from the
      wave's own middle.
  - group: FRONT
    task: Fit the returns to a decay
    title: The same fraction each week
    place: Box Office
    reason: "Dowd needs the fourth week's figure before she can release any of the
      seats she's been holding back onto the map."
    relationship: >-
      The exponential model y = a · bˣ, with a the value at the start and b the factor
      per week.
    concept: 'Exponential functions, and why a constant ratio is not a constant difference'
    takesAsRead:
    - 'Geometric sequences: a constant ratio'
    scene: >
      Returned tickets: 84 in the first week after they went on sale, then 59, then
      41.
      Dowd wants the fourth week before she releases the held seats.
    guide: >-
      Look at the ratios rather than the differences. Each week's returns divided
      by the week
      before gives roughly the same number, which is what an exponential is. Work
      out the ratio,
      apply it once more, and say what the model does and does not entitle anybody
      to claim
      about week eight.
    background:
    - >-
      Why returns decay proportionally. The people most likely to return a ticket
      do it soon
      after buying, so each week draws on a shrinking pool of recent buyers. That
      produces a
      constant fraction rather than a constant number, which is the signature of an
      exponential.
    - >-
      Why the difference test fails here. The drops are 25 and 18, which is not constant,
      so
      a straight line is out. The ratios are 0.70 and 0.69, which is about as constant
      as
      three real numbers get, and it is the ratio that identifies the family.
    - >-
      What it cannot say. The model is fitted over three weeks and the fortnight ahead
      is
      outside them. Returns will not follow this curve to zero. There is a floor of
      cancellations that
      happen for reasons unrelated to buying. And a model quoted past its data is
      a claim
      about a mechanism nobody has checked.
    assumes:
    - the three weekly return figures cover complete weeks
    takeaway: A constant ratio identifies an exponential; a constant difference 
      identifies a line.
    format: BALLPARK
    question: Estimate next week's returns from the ratio.
    estimate:
      prompt: "Returns by week: 84, 59, 41. Dowd wants the fourth week before releasing
        the held seats."
      question: Estimate next week's returns from the ratio.
      labels:
      - 41  (returns in the third week)
      - 0.70  (the weekly ratio)
      - 18  (the last drop, in tickets)
      - 84  (returns in the first week)
      values: [41, 0.70, 18, 84]
      slots: 2
      template: '{0} × {1}'
      formula: a*b
      correct: [0, 1]
      target: 28.7
      tolerance: 3
      units: tickets
      solution: 41 × 0.70 = 28.7 tickets.
      explanation: About twenty-nine. Subtracting the last drop of 18 instead 
        gives 23, and the two diverge fast after that.
    answerText: About 29 tickets, where subtracting the last drop would have 
      said 23.
    why: >
      The ratios are 0.70 and 0.69, so the sensible model multiplies by about 0.70
      each week:
      41 becomes 29. Subtracting the last drop of 18 gives 23 instead, and the two
      answers
      diverge fast. By week six the ratio model says 14, and the subtraction says
      nothing at
      all, because it has gone negative. That is the practical test between the families
      and it is worth doing on
      three numbers. What the model does not license is week eight. It is fitted on
      three weeks, and returns
      have a floor made of cancellations that happen for their own reasons. A curve
      quoted past
      its data is a claim about a mechanism nobody has checked.
    rebuttals:
    - Subtracting the last drop treats a shrinking quantity as falling by a 
      constant amount, and it goes negative by week six.
    - The first week's figure is where the decay started, not what it is now 
      multiplying.
  - group: BOARD
    task: Say what happens when the lantern moves back
    title: Twice as far, a quarter as bright
    place: Lighting Board
    reason: "Ferreira has to move a unit for the flying sequence, and Adeyemi and
      Sallow are already arguing over what that does to the level."
    concept: 'Transformations: shift, stretch and reflect'
    takesAsRead:
    - 'A function as a rule, its domain and what the domain rules out'
    scene: >-
      Ferreira has to move a unit off the front bar because the flying sequence needs
      the space. The replacement position is twice as far from the mark. For the same
      fixture and the same beam setting, Adeyemi expects the on-axis level to follow
      an inverse-square approximation; Sallow has been told it simply halves.
    guide: >-
      For a pointlike source with the same angular distribution, illuminance on axis
      scales approximately as one over distance squared. Double the distance and compare
      the factor. Real stage optics are not an isotropic sphere, so this relationship
      predicts the distance scaling, not the final meter reading.
    background:
    - >-
      Why the square rather than the distance. The same light spreads over a surface
      that
      grows as the square of the radius, so it is diluted by that square. Doubling
      the
      distance quadruples the area and quarters the level. This is not specific to
      light: it
      is what happens to anything radiating outward from a point.
    - >-
      What can be done about it. A narrower beam angle puts the same output on a smaller
      patch, which recovers level at
      the cost of coverage. So a unit moved back can be re-lensed rather than replaced.
      What cannot be recovered is the softness that comes
      with a wide beam close in.
    - >-
      Why the mistake is so common. Intuition is linear. Twice as far sounding like
      half as bright is one of the most reliable wrong answers in
      a technical rehearsal. The correction is a factor of two on a number somebody
      has
      already set a fader to.
    assumes:
    - the unit can be treated as a point source at these distances
    takeaway: With the same source and beam geometry, inverse-square scaling 
      makes twice the distance about one quarter the illuminance.
    format: CHOICE
    question: What does doubling the throw do to the level at the mark?
    choices:
    - 'Quarters it: four times the area to cover'
    - Halves it, because the level falls in proportion to the distance travelled
    - Leaves it unchanged, since the beam angle has not been altered
    - Reduces it by an amount that depends on the colour in the unit
    answer: 'Quarters it: four times the area to cover'
    why: >-
      Under the inverse-square approximation, doubling the throw multiplies the illuminated
      area scale by four, so the on-axis illuminance falls to about one quarter. The
      useful result is the factor, not a claim that a stage lantern is an isotropic
      point source. Lenses, shutters and beam shape change the absolute level, which
      is why Ferreira still meters the mark.
    rebuttals:
    - Halving is the linear intuition; the area the light covers grows as the 
      square.
    - 'An unchanged beam angle is the case in question: the same cone covers four
      times the area at twice the distance.'
    - A colour filter costs level at every distance and does not change how 
      level falls with distance.

  # ----- day 5. Logs, and a beam described from the centre out.
- title: Adding what multiplies
  objective: Turn the gain chain into decibels and the beam plot into 
    coordinates.
  stake: >-
    Friday. The first run-through starts at four. Right now, two people can talk about
    the
    same rig for an hour and hang nothing, because they are using two different systems.
    Today you add instead of multiply, and turn a bearing into a coordinate everyone
    can use.
  takeaway: Logarithms turn multiplication into addition, which is what a fader 
    is.
  segue: >-
    The gain chain came out as a sum on the desk. A beam went up off a coordinate,
    not an
    argument. The technical run finished on time. But nine musicians are now tuning
    to a
    number instead of to each other.
  stops:
  - group: PIT
    task: Add the gains instead of multiplying them
    title: Why a fader is a logarithm
    place: Orchestra Pit and Sound
    reason: "Brand wants every gain stage marked in decibels so the crew can add levels
      in their heads instead of arguing by ear."
    relationship: >-
      The log rules: log(xy) = log x + log y, so you add the logs instead of multiplying
      the gains, which is why a desk is marked in decibels.
    concept: 'Log properties, and why a product becomes a sum'
    takesAsRead:
    - 'Logarithms as inverse exponentials'
    scene: >
      The chain multiplies by 3.2, then 4.0, then 2.5, then 8.0. Brand wants each
      stage marked
      on the desk in decibels so the crew can add them in their heads.
    guide: >-
      A product of four factors becomes a sum of four logarithms. Take the log of
      each gain,
      multiply by twenty to get voltage decibels, and add. Then check the answer against
      the log of the product. The whole point of the rule is that
      those two are the same number arrived at two ways.
    background:
    - >-
      Why twenty rather than ten. For a voltage ratio the decibel is twenty times
      the log,
      because power goes as the square of voltage and the ten-times-log definition
      is written
      for power. Mixing the two is a factor of two on every number, which is four
      decibels on
      a typical stage gain.
    - >-
      What the rule buys in practice. Four multiplications with a calculator become
      four additions in the head. A crew can
      then talk about a stage as plus ten or minus six rather than as times three
      point two. Every fader, every trim and every pad on the desk
      is marked that way for this reason.
    - >-
      Why the check matters. The sum of the logs and the log of the product are equal
      by the
      rule, so computing both is a free verification. A discrepancy means a gain was
      written
      down wrong, which is what the check is for.
    assumes:
    - the gains are voltage ratios rather than power ratios
    takeaway: The sum of the logs equals the log of the product, which is why 
      gains add on a desk.
    format: BALANCE
    question: Read what you need and report the chain's total gain in decibels.
    balance:
      hint: >-
        Reading a stage off the desk is free. Counting it is the claim you are making
        about what
        the chain does to the signal.
      total: {amount: 38.2, unit: dB, label: Total gain from microphone to 
          amplifier}
      streams:
      - {id: pre, label: Microphone preamp, value: 10.1, display: 'gain 3.2, which
          is 10.1 dB'}
      - {id: chan, label: Desk channel, value: 12.0, display: 'gain 4.0, which is
          12.0 dB'}
      - {id: group, label: Group bus, value: 8.0, display: 'gain 2.5, which is 8.0
          dB'}
      - {id: amp, label: Amplifier input stage, value: 18.1, display: 'gain 8.0, which
          is 18.1 dB'}
      - {id: pad, label: Pad in the microphone barrel, value: -10.0, display: 'a 10
          dB pad, switched in and not on the desk', hidden: true, note: 'nothing on
          the desk shows it'}
      - {id: fader, label: The fader position itself, value: 0, display: 'at unity
          — a position rather than a gain'}
      tolerance: 3
      commit: Report the total gain
    answerText: >-
      About 38 decibels once the barrel pad is counted: 48.2 from the four stages,
      less the ten
      the pad is taking out where nothing on the desk shows it.
    why: >
      Each stage multiplies. A log turns that into a sum. So the four stages add to
      48.2 dB
      rather than being multiplied out to 256. The term that hides is the pad in the
      mike
      barrel. Ten dB, switched in at the capsule, and nothing on the desk shows it.
      It is also
      why the channel needed so much gain. The total is 38 dB, not 48. The fader is
      the other
      trap. At unity it is a position rather than a gain, so counting it adds nothing.
  - group: BOARD
    task: Turn the bearing into a position on the bar
    title: From the centre out
    place: Lighting Board
    reason: "Ferreira works in metres left, right and upstage, and Adeyemi's plot
      only gives him a bearing, so the two can't even discuss the same rig yet."
    relationship: >-
      Polar to rectangular: x = r cos θ and y = r sin θ, so a bearing and a distance
      name the same point as two coordinates.
    concept: 'Converting between polar and rectangular'
    takesAsRead:
    - 'Polar coordinates, and a beam described as r of theta'
    scene: >
      Adeyemi's plot puts a unit 7.4 metres from the centre of the proscenium at a
      bearing of
      38 degrees off the centre line. Ferreira works in metres left or right of centre
      and
      metres upstage.
    guide: >-
      A bearing and a distance are one description of a point and two perpendicular
      offsets are
      another. The conversion is a right triangle: the distance is the hypotenuse,
      the bearing
      is the angle at the centre, and the two offsets are the sides. Work out both
      offsets, and
      say which of them the rigger actually needs first.
    background:
    - >-
      Why a designer works in polar and a rigger in rectangular. A lantern is aimed,
      so its
      natural description is a direction and a throw. A bar is a straight line with
      positions
      along it, so its natural description is a distance from centre. Both are right
      and the
      conversion is the interface between two trades.
    - >-
      Which offset matters first. The across-stage figure is where on the bar the
      unit hangs,
      which has to be right before anything is bolted. The upstage figure decides
      which bar,
      and there are only four to choose from, so it is coarser and easier to fix.
    - >-
      What goes wrong without the conversion. Two people can describe the same rig
      in different coordinate systems and agree on every raw number while still naming
      different physical points. A bearing interpreted as an offset can move a unit
      by hundreds of millimetres without producing an obviously absurd value.
    assumes:
    - the bearing is measured from the centre line toward stage left
    takeaway: A bearing and a distance convert to two offsets through one right 
      triangle.
    format: BALLPARK
    question: Estimate how far off centre the unit hangs.
    estimate:
      prompt: The plot gives 7.4 m at 38 degrees off the centre line. Ferreira 
        needs the across-stage offset.
      question: Estimate how far off centre the unit hangs.
      labels:
      - 7.4 m  (distance from the centre of the proscenium)
      - 38 deg  (bearing off the centre line)
      - 5.8 m  (the upstage offset, for the bar choice)
      - 52 deg  (the complement of the bearing)
      values: [7.4, 38, 5.8, 52]
      slots: 2
      template: '{0} × sin({1})'
      formula: a*Math.sin(b*Math.PI/180)
      correct: [0, 1]
      target: 4.56
      tolerance: 0.3
      units: m
      solution: across = r·sin θ = 7.4 × sin 38° = 4.56 m off centre.
      explanation: Four metres fifty-six off centre, with 5.8 upstage — which 
        picks the bar as well as the position on it.
    answerText: About 4.56 metres off centre, with 5.8 metres upstage choosing 
      the bar.
    why: >
      The distance is the hypotenuse and the bearing is the angle at the centre, so
      the
      across-stage offset is 7.4 times the sine of 38 degrees: 4.56 metres. Using
      the cosine gives 5.83, which is the upstage offset. That is a perfectly real
      number
      for a different question, and the reason the two sit on the same tile row. Getting
      them the wrong way round hangs the unit 1.3 metres out of position. On a front
      bar
      that is the difference between lighting a performer and lighting the person
      beside them. The complement of the angle is on the row
      because using it swaps the two offsets silently.
    rebuttals:
    - The cosine of the bearing gives the upstage offset, which chooses the bar 
      rather than the position along it.
    - Using the complement of the angle swaps the two offsets without changing 
      either number's plausibility.
  - group: FLY
    task: Say what the two lines are each pulling
    title: Not half each
    place: Fly Floor
    reason: "Osei will not fly the cloth again until he has the sideways force each
      line puts on the grid ironwork."
    relationship: >-
      The magnitude of a vector from its components, |v| = √(vₓ² + v_y²).
    concept: 'Vectors: components, magnitude and direction'
    takesAsRead:
    - 'Right-triangle ratios, and finding an angle from two sides'
    scene: >-
      A cloth with mass 180 kilograms hangs from two lines. Each line leans 22 degrees
      from vertical. Osei wants the actual force in each line before the piece moves.
    guide: >-
      Convert the cloth's mass to weight, then resolve each line tension vertically.
      The two vertical components must add to the weight. Only the vertical component
      supports the cloth; the horizontal component loads the rigging sideways.
    background:
    - >-
      Why leaning costs. The vertical components have to sum to the weight whatever
      the angle. So as the lines
      lean further, each one has to pull harder to keep its vertical part the same.
      At 22 degrees the penalty is about eight per cent; at 60 degrees each
      line pulls the whole weight.
    - >-
      Where the horizontal parts go. They point toward each other and cancel at the
      piece,
      which is why it hangs still. They do not cancel at the grid: each line puts
      a sideways
      pull into the ironwork, which is what the 1958 conversion never accounted for.
    - >-
      Why Osei wants it written. A per-line tension is what a line's rating is compared
      against, and half the weight is the number people say. The difference between
      90 and 97
      kilograms is small; the difference at the angles this grid forces on a wide
      cloth is
      not.
    assumes:
    - the two lines are symmetric about the piece's centre of mass
    takeaway: A leaning line carries force along its length; only its vertical 
      component supports the weight.
    format: BALLPARK
    question: Estimate the tension in each of the two lines.
    estimate:
      prompt: 180 kg cloth, two lines each 22° from vertical. Use g = 9.81 m/s² 
        and estimate the tension in each line.
      question: Estimate the tension in each of the two lines.
      labels:
      - 180  (mass in kg)
      - 9.81  (g in m/s²)
      - 2  (lines)
      - 22  (degrees from vertical)
      values:
      - 180
      - 9.81
      - 2
      - 22
      slots: 4
      template: '({0} × {1}) ÷ ({2} × cos {3})'
      formula: a*b/(c*Math.cos(d*Math.PI/180))
      correct:
      - 0
      - 1
      - 2
      - 3
      target: 952
      tolerance: 40
      units: N
      solution: T = (180 × 9.81) ÷ (2 × cos 22°) ≈ 952 N per line.
      explanation: About 0.95 kN per line, slightly above the 0.88 kN each would
        carry if the lines were vertical.
    answerText: About 0.95 kilonewtons in each line, not simply half the cloth's
      weight.
    why: >-
      The cloth weighs about 1.77 kilonewtons. Each line contributes T cos 22° vertically,
      and the two vertical components must sum to that weight. Solving gives about
      0.95 kilonewtons per line. Treating kilograms as a force hides the distinction
      between mass and load; the rigging is rated in force.
    rebuttals:
    - Halving the weight assumes both lines are vertical, which is the one thing
      this grid does not allow.
    - Using the sine gives the horizontal pull, which is what the ironwork feels
      rather than what carries the cloth.

  # ----- day 6. Levels, periods and a resultant.
- title: How often, how loud, how hard
  objective: Set a level against the licence, a period against a cue, and a 
    resultant against a rating.
  stake: >-
    Saturday. A level read at the desk is not the level a seat actually gets. Only
    one of
    those numbers is what the audience really hears, and right now nobody has it.
    Today you
    find the three numbers the safety file still needs.
  takeaway: A level is a ratio on a logarithmic scale, and a period is what one 
    cycle costs.
  segue: >-
    Three numbers are in the file now, each one taken at a seat and dated. The cue
    can be
    called on a count instead of a guess. But the crew measured all three in an empty
    house.
    No seats. Nobody sitting in them.
  stops:
  - group: PIT
    task: Work out the level at the seat
    title: Ten times the log of it
    place: Orchestra Pit and Sound
    reason: "Pell's licence file needs a level measured at a seat, not at the desk,
      and it has to go in dated."
    relationship: >-
      The level in decibels, L = 10·log₁₀(I / I₀), with I the measured intensity and
      I₀ the reference.
    concept: 'The decibel: a logarithmic scale on a physical ratio'
    takesAsRead:
    - 'Log properties, and why a product becomes a sum'
    scene: >-
      The meter at row F reads an intensity of 3.2 × 10⁻⁴ watts per square metre.
      The reference is 1.0 × 10⁻¹² watts per square metre. For this reopening, Pell
      has written a 103 dB test ceiling into the Ellery licence file.
    guide: >-
      A decibel level is ten times the logarithm of the measured intensity divided
      by the
      reference. Work out the ratio first, then the logarithm, then the ten. Compare
      what comes
      out with the licence cap, and note how much the whole argument turns on the
      scale being
      logarithmic rather than linear.
    background:
    - >-
      Why the reference is in the formula at all. A decibel is a ratio, so it needs
      something
      to be a ratio of. The standard reference is the quietest audible intensity,
      which is why
      the numbers come out between zero and about 130 for everything a person meets.
    - >-
      What the cap means in intensity. Three decibels is a doubling, so a house at
      106 is
      twice the intensity of one at 103, not three per cent more. That is what makes
      an
      argument about a few decibels an argument about factors.
    assumes:
    - the meter reading is an average over the passage rather than a peak
    takeaway: Ten decibels is a factor of ten, and three is a factor of two.
    format: BALLPARK
    question: Estimate the level at row F in decibels.
    estimate:
      prompt: The meter reads 3.2 × 10⁻⁴ W/m² at row F, against a reference of 
        1.0 × 10⁻¹². The cap is 103 dB.
      question: Estimate the level at row F in decibels.
      labels:
      - 3.2e-4  (measured intensity, W/m²)
      - 1.0e-12  (the reference intensity)
      - 10  (the multiplier for an intensity ratio)
      - 20  (the multiplier for a voltage ratio)
      values: [3.2e-4, 1.0e-12, 10, 20]
      slots: 3
      template: '{2} × log₁₀({0} ÷ {1})'
      formula: c*Math.log10(a/b)
      correct: [0, 1, 2]
      target: 85
      tolerance: 3
      units: dB
      solution: 10 × log₁₀(3.2 × 10⁸) = 10 × 8.51 = 85.1 dB.
      explanation: Eighty-five decibels, eighteen under the cap — which is a 
        factor of sixty in intensity, not eighteen per cent.
    answerText: About 85 decibels, which is eighteen under the cap and a factor 
      of sixty in intensity.
    why: >-
      The intensity ratio is 3.2 × 10⁸. Ten times its base-ten logarithm is about
      85 dB. The 18 dB gap to the Ellery test ceiling is not 18 per cent; it corresponds
      to about a factor of 63 in intensity. The exact 103 dB figure is a condition
      of this fictional reopening file, not a universal theatre limit.
    rebuttals:
    - Twenty times the log is for a voltage ratio; this is an intensity, so it 
      takes ten.
    - Without dividing by the reference there is no ratio, and a logarithm of a 
      bare intensity is not a level.
  - group: BOARD
    task: Work out how long one turn takes
    title: Two pi over the coefficient
    place: Lighting Board
    reason: "Haigh wants to call the cue on a count instead of watching for it, which
      means knowing the revolve's period exactly."
    relationship: >-
      The period from the inside coefficient, period = 2π ÷ B.
    concept: 'Period from the coefficient inside the function'
    takesAsRead:
    - 'A sinusoid: amplitude, midline, period and phase'
    scene: >
      The chase on the board runs as a sinusoid in the intensity of each circuit,
      written with
      an inside coefficient of 0.42 per second. Haigh needs the period to call the
      cue on a
      count.
    guide: >-
      The coefficient inside the function is what squeezes or stretches the cycle,
      and the period
      is two pi divided by it. Work it out in seconds, then say what a larger coefficient
      would do
      — because the relationship is inverse and the intuition usually runs the wrong
      way.
    background:
    - >-
      Why the relationship is inverse. The function completes a cycle when its argument
      advances by two pi. The argument
      advances B times as fast as the input, so a larger B means a shorter cycle.
      Doubling the coefficient halves the period.
    - >-
      What a count is for. A cue called on a count rather than on a look is repeatable.
      A period in seconds
      converts to a count at whatever tempo the band is playing. That
      conversion is why the number has to be a period and not a description.
    assumes:
    - the chase runs at a constant coefficient through the cue
    takeaway: A larger coefficient inside the function makes a shorter cycle, 
      not a longer one.
    format: VERIFY
    question: Predict the period from the coefficient, then run the chase and 
      time it.
    verify:
      hint: >-
        Lock the prediction before the chase runs. A cycle finishes when the argument
        has advanced
        by two pi, and the coefficient says how fast that happens.
      prediction: {label: Predicted period of the chase, unit: s, min: 2, max: 
          40, step: 0.5}
      truth: 15.0
      passRatio: [0.9, 1.1]
      intervention:
        label: Run the chase and time it
        note: One full cycle, timed on the board's own clock from peak to peak.
        outcome: Chase run once. Timed peak to peak with a stopwatch on the 
          desk.
      measurement:
        label: Measured period
        note: 15.2 seconds, which at 120 beats a minute is a count of thirty.
        cost: 1
        costUnit: runs
      unmeasuredMoral: >-
        A period computed from a coefficient is a statement about the software. Whether
        the board
        runs the chase at the rate it was given is a different claim, and the boards
        here are 1958.
      commit: Report the period
    answerText: >-
      Predicted 15.0 seconds from two pi over 0.42, timed at 15.2 — a count of thirty
      at 120 beats
      a minute, which is what Haigh can call the cue against.
    why: >
      A cycle finishes when the argument advances by two pi. It advances 0.42 times
      as fast as
      the clock, so the period is 6.283 over 0.42: fifteen seconds. The board runs
      it at 15.2,
      which is the software doing what it was told. The relationship is inverse, which
      is where
      intuition fails — doubling the coefficient gives seven and a half seconds rather
      than thirty.
      Using pi instead of two pi halves the answer, and would have put the cue in
      the wrong bar.
      The measurement is what would have caught it.
  - group: FLY
    task: Say what the grid feels sideways
    title: What cancels at the cloth and not at the grid
    place: Fly Floor
    reason: "Osei has a second cloth to fly and wants the first cloth's sideways figure
      to check the second one against."
    concept: 'Adding vectors, and why two lines do not share a load equally'
    takesAsRead:
    - 'Vectors: components, magnitude and direction'
    scene: >-
      Yesterday's cloth hangs on two lines at 22 degrees, each carrying about 0.95
      kilonewtons. Before another piece is added, Osei wants the sideways component
      each line applies at the grid.
    guide: >-
      Resolve the same line force horizontally. The horizontal components cancel at
      the cloth because they are equal and opposite there. At the grid they act at
      different attachment points, so they create local lateral loads that belong
      on the load plot.
    background:
    - >-
      Why cancellation depends on where you stand. Two equal and opposite forces at
      the same
      point sum to nothing. The same two forces applied at points four metres apart
      put the structure between them
      into tension. Nothing about the piece hanging still says otherwise.
    - >-
      What the ironwork was designed for. Vertical load, which is what a grid over
      a
      stage-width flying system carries. The Ellery's grid is narrower than its stage.
      So every wide piece leans its lines, and
      adds a sideways component the drawings do not mention.
    assumes:
    - both lines lean by the same angle
    takeaway: Equal and opposite components can cancel on the hanging piece 
      while still creating local loads at separate supports.
    format: CHOICE
    question: What does the sideways component of each line do?
    choices:
    - Loads the ironwork between the two lines in tension
    - Cancels completely, since the cloth hangs still
    - Adds to the vertical load on the grid
    - Only matters if the two lines lean by different angles
    answer: Loads the ironwork between the two lines in tension
    why: >-
      Each line carries about 0.95 kN. Its horizontal component is T sin 22°, about
      0.36 kN. The two horizontal components cancel at the cloth, so the cloth does
      not accelerate sideways. At the grid they are applied at two different points,
      which means the structure still has to carry those local lateral loads. They
      do not become extra vertical weight.
    rebuttals:
    - The cloth hanging still says the forces cancel at the cloth, not at the 
      two points four metres apart.
    - A horizontal component is perpendicular to the vertical one and cannot add
      to it.
    - Unequal angles make the sideways forces unequal too; equal angles still 
      load the ironwork.

  # ----- day 7. A room that rings.
- title: The room is the instrument
  objective: Measure what the empty house does to sound, and what the seats will
    do about it.
  briefing: The house rings, the seats arrive on Tuesday, and the licence file 
    wants a figure either way.
  stake: >-
    Sunday. The seats arrive by truck on Tuesday, and an empty room is not the room
    anyone
    will sit in. Today you measure how fast a sound dies away in the empty house,
    and
    predict what it will do once the seats are full.
  takeaway: A quantity falling by the same fraction each interval never quite 
    reaches zero.
  segue: >-
    The empty-house decay is now measured, and the rail survey is complete. But the
    seats arrive tomorrow, which changes the room the audience will actually hear.
    The next acoustic number must be measured again under the new condition rather
    than copied forward.
  stops:
  - group: HOUSE
    task: Work out how long the ring takes to fall
    title: The same fraction each half second
    place: The House
    reason: "Brand can hear what the empty house does to a sound, but Pell's file
      needs an actual number, not an ear."
    relationship: >-
      A proportional decay, V = A·(1 − k)ᵗ, with k the fraction lost each interval
      and t the number of intervals.
    concept: 'Exponential functions, and why a constant ratio is not a constant difference'
    takesAsRead:
    - 'Geometric sequences: a constant ratio'
    scene: >-
      Brand records the empty house after an impulse. Every quarter-second the late
      sound energy is about 32 per cent of what it was one step earlier. He wants
      the one-second decay before the seats go in.
    guide: >-
      A constant fractional decay is repeated multiplication. One second contains
      four quarter-second steps, so compute 0.32 to the fourth. Then compare the prediction
      with the measured decay tail rather than treating either one as a full acoustic
      model of the room.
    background:
    - >-
      Why a proportional decay never reaches zero. Each step takes a fraction of what
      remains,
      so there is always something left. In practice the sound falls below what anybody
      can hear. So reverberation time is
      defined against a stated drop rather than against silence.
    - >-
      Why the seats change it. Sound energy leaves a room by being absorbed, and an
      empty
      seat absorbs far less than an occupied one. Eight hundred and sixty people are
      the
      largest absorber the Ellery will ever contain, and their absence is why the
      room is
      currently unusable.
    assumes:
    - the decay fraction is constant across the interval measured
    takeaway: 'A proportional decay is exponential: the same fraction acts on what
      remains, not on the original amount.'
    format: VERIFY
    question: Predict the late-sound energy left after one second, then measure 
      it.
    verify:
      hint: >-
        Lock the prediction first. One second contains four quarter-second intervals,
        each retaining 32 per cent.
      prediction: {label: Predicted energy remaining after one second, unit: '% of
          original', min: 0, max: 60, step: 0.5}
      truth: 1.05
      passRatio:
      - 0.8
      - 1.25
      intervention:
        label: Clap once and record the tail
        note: Empty house, one test impulse from centre stage with the decay 
          trace read at row F.
        outcome: Recorded. Compare the late-sound energy one second after the 
          impulse.
      measurement:
        label: Measured energy remaining
        note: 1.1 per cent of the initial late-sound energy after one second.
        cost: 1
        costUnit: claps
      unmeasuredMoral: >-
        The exponential predicts the tail implied by the measured step ratio. The
        room itself still has to be measured, and the result changes when the seating
        and audience absorption change.
      commit: Report the decay
    answerText: >-
      Predicted about 1.05 per cent after one second; measured 1.1 per cent in the
      empty house.
    why: >-
      Four quarter-second steps leave 0.32⁴ ≈ 0.0105, or about 1.05 per cent of the
      initial late-sound energy. The measured value is 1.1 per cent. That corresponds
      to a substantial decay over one second while still leaving a measurable reverberant
      tail. Using 0.68 as the retained fraction would confuse the fraction lost with
      the fraction remaining.
  - group: SHOP
    task: Decide whether the rail comes down
    title: Three inches, and what it costs
    place: Scene Shop
    reason: "Mbatha wants the pit rail lowered, and Novak has exactly one day of shop
      time left to decide if it's worth starting."
    concept: 'Choosing a model, and what a residual says about the choice'
    takesAsRead:
    - 'Average rate of change over an interval'
    scene: >
      Mbatha wants the pit rail three inches lower. Novak has one day of shop time
      left before
      the seats arrive, and the rail is also a sightline for row A and a reflector
      for the band.
    guide: >-
      One change, three consequences, and they are measured in three different units.
      Work out
      what each of them is actually a function of, and which of the three can be answered
      from
      numbers already in the file. The answer is which measurement to take rather
      than what to do.
    background:
    - >-
      Why three inches is not a small change here. Row A sits 1.1 metres behind the
      rail, so three inches of rail height is nearly two
      degrees of sightline for that row. The rail is the top edge of what those seats
      see
      over.
    - >-
      What the rail does for the band. It reflects sound back at the players, which
      is how
      nine people covering an arrangement for twenty-two hear each other. Lowering
      it improves
      the house and removes some of that, which is Mbatha asking for two contradictory
      things.
    assumes:
    - the shop has one working day before the seats arrive
    takeaway: One change with three consequences needs three measurements, not 
      one opinion.
    format: CHOICE
    question: What should be measured before the rail is cut?
    choices:
    - What row A can see over the rail as it stands
    - How much the band's own level drops with the rail down
    - Whether the shop has time to cut it before Tuesday
    - What the rail weighs
    answer: What row A can see over the rail as it stands
    why: >
      Row A is the consequence that cannot be undone. Sound is adjustable — a fold-back
      for the band, or a reflector added later — and shop time is a scheduling fact
      rather than a measurement. But a seat that cannot see over a rail is a refund.
      The rail is the top edge of what row A looks over, by about four degrees for
      a three-inch change viewed from 1.1 metres back. Measuring the band's drop is
      worth doing and it is a level that can be recovered by other means. What the
      rail weighs is a construction detail with no bearing on any of the three questions
      in the room.
    rebuttals:
    - The band's level can be recovered with fold-back; a sightline lost to a 
      rail cannot.
    - Shop time is a constraint on doing it, not evidence about whether it 
      should be done.
    - The rail's weight matters to whoever lifts it and to none of the three 
      consequences.
  - group: FRONT
    task: Say what the model is a model of
    title: Where it stops being one
    place: Box Office
    reason: "Sallow is about to trust a forecast that predicts more seats than the
      house holds, and somebody has to say where the model breaks down."
    concept: 'Reading a model: what it is a model of, and where it stops being one'
    takesAsRead:
    - 'Choosing a model, and what a residual says about the choice'
    scene: >
      The quadratic through four weeks of advance sales fits closely. Extended to
      week eight it
      predicts 2,140 seats sold, in a house that holds nine hundred.
    guide: >-
      Take the model at its word and see where the word breaks. Work out what the
      prediction says
      and compare it with something the model cannot know, then say which of the four
      statements
      about it is the honest one. A model that fits its data is a claim about that
      data.
    background:
    - >-
      What extrapolation actually assumes. That the mechanism producing the numbers
      keeps
      working the same way outside the range measured. Here it cannot: the house has
      nine
      hundred seats, so sales must flatten no matter what the curve does.
    - >-
      Why the local fit is not the problem. A quadratic is the best of the listed
      simple families over the four measured checkpoints, and its residuals there
      are small. The mistake is turning that local descriptive fit into a mechanism
      that must continue outside the observed range.
    assumes:
    - the house capacity is fixed at nine hundred
    takeaway: A model fitted inside a range says nothing certain outside it.
    format: CHOICE
    question: What is the honest thing to say about the week-eight figure?
    choices:
    - The curve is right and the extrapolation is not
    - The quadratic was the wrong family after all
    - Sales will reach 900 and stop
    - The model needs more data before it can be used
    answer: The curve is right and the extrapolation is not
    why: >-
      Two things are separately true. Over the four measured checkpoints, the quadratic
      is the best of the simple candidate families and describes the data closely.
      Outside that range it predicts a mechanism that cannot keep going because the
      house holds only 900 seats. So the honest statement keeps the local fit and
      refuses the week-eight forecast. More data can extend the range of evidence;
      it never makes extrapolation automatic.
    rebuttals:
    - The residuals inside the four weeks are small, so the family is right 
      about the data it was fitted to.
    - A ceiling at nine hundred is a different model, and it has not been fitted
      to anything.
    - More data moves the edge of the range; it does not license predicting 
      beyond the new edge either.

  # ----- day 8. Lux at the mark, and the second solution.
- title: What arrives at the performer
  objective: Get a level onto a face, and find both angles a cue could be called
    at.
  briefing: The first look is tonight and the plot has not been checked against 
    a meter.
  stake: >-
    Monday. The first full look is at seven, and no one has checked the lighting plot
    with a
    meter yet. Today you find how much light reaches the performer, and which seats
    a walked
    survey rules out.
  takeaway: A ratio falling as the square of a distance, and an equation with 
    two solutions a cycle.
  segue: >-
    Twelve seats in the front six rows have no line to the mark at all. Hettie Prosser's
    seat is one of them. The proscenium has been two feet three inches too narrow
    since 1958,
    and nobody measured it until today. So a real number now replaces a guess. Twelve
    of
    those seats are already sold.
  stops:
  - group: BOARD
    task: Work out the level arriving at the mark
    title: Four pi d squared
    place: Lighting Board
    reason: "Ferreira has never put a meter under Adeyemi's plot, and the first full
      look is tonight."
    relationship: >-
      The inverse square law, I = P ÷ (4πd²), with P the output of the source and
      d the distance to the surface.
    concept: 'Transformations: shift, stretch and reflect'
    takesAsRead:
    - 'A function as a rule, its domain and what the domain rules out'
    scene: >-
      The photometric sheet gives 9,600 candela on axis for the chosen beam. The mark
      is 11.3 metres away along that axis. Ferreira wants the inverse-square prediction
      before he puts a meter under it tonight.
    guide: >-
      On axis, illuminance from a source with known luminous intensity follows E =
      I/d² in the point-source approximation. Use the candela value and the throw
      to predict lux, then compare with the meter. The measurement checks the real
      lens, focus and alignment.
    background:
    - >-
      Why this is an estimate rather than a measurement. A real lantern is not a point
      and does not radiate in all directions. A lens puts most
      of the output into a cone, so the actual level is several times this figure.
      The spherical calculation gives the floor, which is
      why Ferreira meters it rather than trusting it.
    - >-
      What the square does to a rigging decision. Half the distance is four times
      the level, so
      a unit moved from eleven metres to five and a half gains two stops of light.
      That is why
      front-of-house positions are argued about more than any other part of a rig.
    assumes:
    - the unit can be treated as radiating into a sphere for a floor estimate
    takeaway: On-axis illuminance is luminous intensity divided by distance 
      squared; the meter tests how well the fixture matches the approximation.
    format: BALLPARK
    question: Estimate the illuminance arriving at the mark.
    estimate:
      prompt: 'Photometric sheet: 9,600 cd on axis at a throw of 11.3 m. Ferreira
        wants the inverse-square prediction.'
      question: Estimate the illuminance arriving at the mark.
      labels:
      - 9600  (on-axis luminous intensity in cd)
      - 11.3  (throw in m)
      - 12.566  (4π, not needed for candela)
      - 6.2  (bar height, not throw)
      values:
      - 9600
      - 11.3
      - 12.566
      - 6.2
      slots: 2
      template: '{0} ÷ {1}²'
      formula: a/(b*b)
      correct:
      - 0
      - 1
      target: 75.2
      tolerance: 6
      units: lux
      solution: E = 9,600 ÷ 11.3² ≈ 75.2 lux.
      explanation: About 75 lux on axis before the meter checks focus, alignment
        and the real beam.
    answerText: About 75 lux on axis from the photometric sheet; the meter 
      decides what the real rig actually delivers.
    why: >-
      Candela already describes luminous intensity in a direction, so the on-axis
      point-source relation is E = I/d². Dividing 9,600 by 11.3² gives about 75 lux.
      Dividing by 4π again would incorrectly spread a directional intensity over a
      sphere a second time. The meter remains necessary because stage optics, focus
      and aim determine how closely the installed unit follows the photometric value.
    rebuttals:
    - Leaving out the four pi divides by a length squared rather than by an 
      area.
    - Using the bar height rather than the throw measures a vertical drop, not 
      the distance the light travels.
  - group: PIT
    task: Find both times the level is reached
    title: Twice a cycle
    place: Orchestra Pit and Sound
    reason: "Haigh's cue has to fire on one specific crossing of the chase, and calling
      the wrong one fires fifteen seconds late in front of the company."
    concept: 'Solving a trigonometric equation, and the second solution'
    takesAsRead:
    - 'Inverse trigonometric functions, and the range they are restricted to'
    - 'Period from the coefficient inside the function'
    scene: >
      The chase rises and falls on a fifteen-second cycle between 10 and 90 per cent.
      Haigh's
      cue has to fire when it passes 70 per cent. The board's inverse function gives
      her one
      time.
    guide: >-
      A sinusoid passes any level between its extremes twice in every cycle — once
      going up and
      once coming down. The inverse function returns one of the two, because it is
      restricted to a
      single range. Work out where the other one is and say which of them the cue
      should use.
    background:
    - >-
      Why an inverse trigonometric function returns one answer. Sine is not one-to-one,
      so it
      has no inverse until its domain is restricted, and the restriction is what makes
      the
      inverse a function. The cost of that convenience is that the other solutions
      have to be
      recovered by hand.
    - >-
      How to recover the second one. Within one cycle, the two times a rising-then-falling
      wave
      crosses a level are symmetric about the peak. So the second is as far after
      the peak as
      the first is before it, and both repeat every period.
    assumes:
    - the chase runs one full cycle per cue
    takeaway: A sinusoid crosses any interior level twice a cycle, and the 
      inverse gives one of them.
    format: CHOICE
    question: Where is the second time the chase passes 70 per cent?
    choices:
    - As far after the peak as the first is before it
    - Half a period after the first
    - One full period after the first
    - There is no second crossing within a cycle
    answer: As far after the peak as the first is before it
    why: >
      A rising-then-falling wave crosses any level between its extremes twice, and
      the two
      crossings are symmetric about the peak. So the second is as far after the peak
      as the
      first is before it. Half a period after the first is the general shape of the
      mistake.
      That spacing is only right for a crossing of the midline, and 70 per cent is
      well above
      it. One full period later is the same crossing in the next cycle rather than
      the second
      crossing in this one. For a cue that means firing fifteen seconds late. And
      there is certainly a second
      crossing, because the wave has to come back down; the inverse function simply
      does not
      return it.
    rebuttals:
    - Half a period apart is correct for a midline crossing and wrong for any 
      other level.
    - One period later is the same crossing next cycle, which fires the cue 
      fifteen seconds late.
    - The wave returns to every level it passed; the inverse function only 
      reports one of the two.
  - group: HOUSE
    task: Say which seats the measurement condemns
    title: Six rows, two seats each
    place: The House
    reason: "Kettleby has just walked the sightline survey himself, and Sallow has
      already sold every seat it's about to rule out."
    concept: 'Solving a linear system, and what no solution looks like'
    takesAsRead:
    - 'Matrices as transformations of the plane'
    scene: >
      Kettleby has walked the front six rows with a marker on the performer's position.
      Rows A
      to F each lose the two outermost seats on the stage-left side. Sallow has nine
      hundred on
      sale.
    guide: >-
      A sightline is two lines that either meet on the stage or do not, which is a
      pair of
      equations with a solution or without one. Work out what the walked measurement
      establishes. Then say what the honest description of
      a condemned seat is. The difference between a bad seat and a seat that cannot
      see decides
      whether it is sold at all.
    background:
    - >-
      What no solution looks like here. The line from the seat past the proscenium
      edge and the line to the performer do not
      intersect anywhere on stage. There is no point the seat can see the performer
      from. That is a geometric fact rather than a matter of degree.
    - >-
      Why twelve seats and not six or twenty-four. Both sides of the house are symmetric
      about the centre line, so the count is doubled.
      But the marker was on a stage-left position, and a stage-right mark would condemn
      the
      mirror pair instead. Twelve is the count for this
      blocking.
    assumes:
    - the marker was placed where the show puts the performer
    takeaway: A sightline with no solution is a seat that cannot see, rather 
      than a seat that sees badly.
    format: CHOICE
    question: What does the walked survey establish?
    choices:
    - Twelve seats cannot see that mark, for this blocking
    - Twelve seats have a poor view of the stage
    - The front six rows should not be sold
    - The proscenium must be widened before opening
    answer: Twelve seats cannot see that mark, for this blocking
    why: >
      The survey establishes a specific thing: for this blocking, twelve seats have
      no line to the
      performer's mark. That is a pair of lines with no intersection on stage, rather
      than a bad view. The
      qualification matters: move the mark and the twelve seats change. Calling them
      poor-view seats invites selling them at a discount for a problem that is total
      rather than
      partial. Condemning the whole front six rows is a much larger claim than twelve
      seats and
      would cost about ninety. Widening the proscenium is undoing 1958 in six days,
      which is not a
      finding of the survey.
    rebuttals:
    - A poor view is partial. These seats have no line to the mark at all.
    - The rows contain about ninety seats; the survey condemns twelve of them.
    - Reversing the 1958 alteration is a building project, not a conclusion from
      a seat survey.

  # ----- day 9. The load plot.
- title: The load the tickets do not show
  objective: Produce a load plot the grid can be signed against.
  stake: >-
    Tuesday. The flying rehearsal is at two, and the widest piece is too close to
    its line limit to approve from mass alone. Today you resolve the line forces,
    change the geometry if you must, and file a load plot that separates vertical
    and lateral loads instead of hiding them in one total.
  takeaway: A leaning line pulls harder than the load it carries, and the angle 
    sets by how much.
  segue: >-
    The wide cloth was re-rigged before it flew. The load plot now carries forces
    at the actual pick points, not a made-up extra mass for leaning lines, and Pell
    has the structural assessor's acceptance against those local limits. The refusal
    to fly was arithmetic, not stubbornness.

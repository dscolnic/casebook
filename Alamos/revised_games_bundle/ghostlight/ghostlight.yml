      - id: hardware
        label: Bridle hardware
        value: 0.59
        display: 60 kg × g = 0.59 kN
      - id: lean
        label: Horizontal components from leaning lines
        value: 0
        display: record separately at each pick — not extra vertical weight
        hidden: true

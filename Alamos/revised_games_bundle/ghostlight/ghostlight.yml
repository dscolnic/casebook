  - group: HOUSE
    task: File the grid load components
    title: What the grid carries at once
    place: The House
    reason: "Pell will not sign a load plot that hides vector loads inside one scalar
      total; the assessed limits apply at specific points and directions."
    concept: 'Vectors: components, magnitude and direction'

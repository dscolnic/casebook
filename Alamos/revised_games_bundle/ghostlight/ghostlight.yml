      an hour. It costs an hour and no seats.
    assumes:
    - the mark can move without changing the staging elsewhere
    takeaway: When two people are each right about their own number, the answer 
      is usually a third option.
    format: CHOICE
    question: What should happen before the map goes to print?
    choices:
    - Move the mark 1.2 metres downstage and keep all twelve on sale
    - Withdraw the twelve seats and take the loss
    - Sell them at a discount with a note on the ticket
    - Print the map as it stands and deal with complaints
    answer: Move the mark 1.2 metres downstage and keep all twelve on sale
    why: >-
      Kettleby is right that an already-sold seat with no line to the performer is
      a real failure. Sallow is right that refunding or relocating twelve people has
      a cost. Moving the mark 1.2 metres downstage clears the measured sightlines
      and costs an hour of replotting, with the musical director already agreeing
      to the move. The modelled £2,460 is therefore an estimate of revenue exposure,
      not a reason to sell a known blind seat.
    rebuttals:
    - Withdrawal is the honest version of paying £2,460 for something an hour of
      replotting fixes.
    - A discounted blind seat produces a refund and a complaint, so the revenue 
      is notional.
    - Printing unchanged is discounting without the discount, and the complaints
      arrive anyway.
  - group: BOARD
    task: Replot the two angles the move changes
    title: Two angles, an hour
    place: Lighting Board
    reason: "Ferreira has to rehang two angles the moment the mark moves, and Adeyemi

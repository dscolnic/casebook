- title: The Drug Stops Working
  objective: Decide whether treatment failure is best explained by resistance and choose the evidence needed before changing patient care.
  briefing: The therapy that helped Elias now fails in a growing fraction of patients. Drug levels are adequate, the pathogen falls and then rebounds, and a target-site variant becomes more common during failure. The pattern points toward resistance, but changing treatment for the whole city requires stronger evidence than one association.
  stake: Day 60. Increase the dose for the wrong reason and patients take more toxicity without benefit; abandon the drug too quickly and the city loses a treatment that still works for many people. Today you decide what the failure pattern supports and what must be checked next.
  takeaway: Treatment can select resistant variants that were already present or that arise during replication; resistance is strongest when genotype, drug exposure, and treatment response tell the same story.
  segue: >-
    Matched failures and successes make resistance the leading explanation and stop
    the dose-escalation guess. Riverton now needs a strategy that does not depend
    on one drug, one target, or one timescale.
  stops:
  - group: POP
    task: Which explanation fits the complete treatment-response panel?
    title: Why did the therapy fail?
    concept: 'Pathogens: viruses and bacteria'
    place: Clinical Ward
    reason: The outbreak board holds the whole treatment-response panel, and only one explanation fits every reading in it
    at: ops-board
    scene: The therapy that saved Elias Webb's life six weeks ago just failed in another patient overnight. The ward has drug levels, burden over time, the target-site sequence and a reference isolate. Pharmacy wants a new plan before the afternoon doses are prepared.
    guide: >-
      Five readings, and the normal ones do the real work here. The drug reached a
      working concentration. The germ burden fell. The dosing record is complete.
      For each candidate explanation, ask how many of the five readings it covers.
      What happened next was a rebound while the patient was still taking the drug
      —
      and the reference sample staying sensitive to the drug says the test itself
      is
      fine.
    background:
    - >-
      Why the normal readings are the ones that decide it. The reading that jumps
      out grabs your attention, but it usually fits more than one explanation. That
      is why it rarely settles anything by itself. The readings that actually tell
      explanations apart are the ones each one predicts should move. When a reading
      stays normal, that is real evidence — it counts against every explanation that
      would have moved it.
    - >-
      How to work through the candidates. Take one explanation at a time. Before you
      check the readings again, predict what it would do to them — which ones move,
      which way, and by about how much. Then compare your prediction to the real
      readings. Predicting first is what makes this a diagnosis instead of a
      rationalization, because the prediction comes before you look at the data, not
      after.
    - >-
      Why only one explanation should survive. Several explanations will fit part
      of
      the readings, on purpose. A partial fit is exactly what a confident wrong
      answer feels like from the inside. If two explanations are still standing, find
      the one reading where their predictions differ and let it decide. If no reading
      tells them apart, you have not finished reading the panel.
    assumes:
    - a drug only works if it reaches the target at a high enough concentration
    takeaway: Evolution can be observed in real time when a treatment changes which variants are most successful.
    format: DIAGNOSIS
    why: Treatment failure has several possible causes. Adequate drug concentrations and an initial fall in pathogen burden weaken poor delivery and gross underdosing. Rebound during continued treatment plus a target-site variant becoming dominant makes resistance the leading explanation. A reference isolate staying sensitive shows the drug and assay can still work, but genotype alone is not the whole proof; matched clinical and susceptibility evidence strengthens the causal link.
    rebuttals:
    - Poor delivery would mean the drug never arrives. Here the concentration is inside the range where the drug works, and the early response proves it did.
    - A misidentified germ would not have responded at all. This one fell first, and only came back later.
    - A contaminated test would not spare the reference sample, which was run alongside it and stayed sensitive.
    headline: A treatment initially suppresses the infectious agent, but the signal rebounds while the patient is still receiving therapy.
    readings:

    task: Spend the rapid slot on the evidence that best separates ongoing agent-driven injury from a host response that has outlasted it.
    title: Treat the mechanism, not the marker
    concept: Vaccination and treatment
    place: Pathology Archive
    reason: The treatment choices point in opposite directions, so the one fast measurement should be the one whose possible results would actually send the team toward different treatments
    scene: The wrong treatment tonight could save one patient and kill another on the exact same drug. Dr. Nia Okafor, the immunology lead, has one fast lab test slot before tonight's treatment meeting. Patients keep worsening later than expected. Four possible measurements on old samples could come back at different speeds.
    guide: >-
      You have one lab slot before tonight's meeting, and four possible measurements
      that come back at different speeds. For each one, ask what it would prove —
      not how interesting the number sounds. Patients are worsening later than
      expected, and that fact narrows what counts as a useful answer. Spend your one
      slot on the measurement that would change what the team treats.
    background:
    - >-
      Why worsening late is the clue. Getting worse after the virus has already
      peaked points away from the virus itself, and toward the body's response to
      it. Those two causes need different treatments — a drug that fights the
      virus, or one that calms the immune system. Giving the wrong one late can be
      worse than giving nothing.
    - >-
      Why speed is part of the value. A measurement that comes back after the
      meeting can't change tonight's decision. That doesn't mean pick something
      fast just because it's fast and useless. It means the slot has to go to a
      measurement that both tells the guesses apart, and arrives on time.
    - >-
      What a marker is, and is not. A number that rises as someone gets sicker
      tells you how ill they are. A number that points to which process is
      driving the illness tells you what to do about it. Only the second kind is
      a mechanism. Only the second kind changes the treatment.

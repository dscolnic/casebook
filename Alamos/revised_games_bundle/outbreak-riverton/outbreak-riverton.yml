    scene: The region's critical-care unit is 90 of 120 beds deep, and eight more patients like Elias Webb are arriving every day. The transfer centre is calling nearby hospitals for help, while the local council asks how many days are left.
    guide: >-
      You have five numbers, and two of them belong to a different question: the
      total staffed beds, and the average stay. For each number, ask whether this
      bound — the worst case, the outer limit — actually depends on it. The answer
      assumes nobody ever leaves, which is exactly what makes it a bound. What it
      shows is what's missing: nobody is tracking the discharge rate — how fast
      patients leave.
    background:
    - >-
      Why this is an estimate, not a full calculation. Every number on the board
      is already measured or given — nothing has to be worked out from scratch.
      What's being tested is whether you can pick the right numbers for the
      relationship, and whether your answer's size makes sense once they're in.

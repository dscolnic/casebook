        question: How precisely can one household cluster be mapped?
    answerText: Use the 20 slots on the candidate species at case-linked sites, the same species at comparison sites, other species in the same habitat, and a repeat time point. That keeps geography, species, and persistence comparisons alive. The result can strengthen or weaken a reservoir hypothesis; it should not be described as proof from one campaign.
    why: 'A positive animal near a human case fits several stories: reservoir maintenance, spillback from people, or shared exposure. Sampling the same species away from cases tests geography; other species in the same habitat test species specificity; repeat sampling tests persistence. Sequencing can compare relatedness after the field design creates those comparisons, but it cannot rescue a biased sample or prove transmission direction by itself.'
- title: A Variant Rises
  objective: Decide whether a rising variant is best explained by selection, founder effects, sampling change, or laboratory bias.
  briefing: A viral variant has climbed from 8% to 31% of sequenced samples in four weeks. The rise appears in several hospital systems, but frequency is not the same thing as fitness. Before the briefing, you have to test whether the trend survives the obvious sampling and laboratory explanations.
  stake: Day 45. If Riverton mistakes a sampling artifact for a biological advantage, it will redirect the response around a phantom. If it ignores a real growth advantage, the next month of cases will arrive under a new set of assumptions.
  takeaway: A rising frequency is an observation; selection becomes the leading explanation only after competing sampling, founder, and technical explanations are tested.
  segue: >-
    The rise survives the independent checks, so selection is the leading explanation
    — though the exact advantage is not yet known. Soon after, wards report a separate
    emergency: the therapy that worked early in the outbreak is failing in more patients.
  stops:
  - group: MOL
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly placed cards after each check.
    title: What would selection have to do?
    concept: Natural selection and evolution
    place: Sequencing Center
    reason: The sequencing bench has four cards on how a population changes, and the briefing is an hour away
    at: sequencer
    scene: The district where Marcus Webb works the docks is the same one where a new version of the virus just started spreading fastest. People in the briefing room are already saying the word evolution. Four cards describe how a population changes. Nobody has ordered them yet.
    guide: >-
      These four cards form one chain, and nothing in it says a rising variant has
      to be a helpful one. For each card, ask: what has to already exist before this
      can happen? Also try removing the middle step in your head — frequencies can
      still shift for reasons that have nothing to do with which variant survives
      better.
    background:
    - >-
      Why the whole order is graded together. A sequence is a claim about what
      depends on what. Each step is here because the step before it already
      happened, or had to happen first. Swap any two steps, and that claim breaks
      —
      wherever the swap sits. Partial credit would mean giving credit for a chain
      that does not actually work.
    - >-
      Why the two ends are the place to start. The first card has nothing before
      it. The last card has nothing after it. That usually lets you place both just
      from the scene alone. Once those two are pinned down, far fewer arrangements
      are left. The real judgment call is what goes in the middle.
    - >-
      What else an order can be based on. Time is the usual axis, but it is not the
      only one. An order can also run on cost, on risk, or on how reversible each
      step is — every step that leaves the sample untouched comes before any step
      that uses it up. On boards like that, reading for time finds nothing, because
      no step has to happen at a set hour.
    takeaway: Natural selection shifts how common a variant is by favoring heritable differences, ones passed to offspring, in how well individuals reproduce.
    format: SEQUENCE
    rebuttals:
    - Variation comes first, and it shows up whether or not it turns out to be useful. This is the step people most often get backward.
    - Differences in reproductive success come second. The environment does the selecting, but only on variation that already existed.
    - More descendants for successful variants is the actual mechanism, and it plays out over many generations, not within just one.
    - Changed frequencies come last. That is the observation itself. Every other card explains why it happened.
    takesAsRead:
    - Mutation and genetic variation
    assumes:
    - offspring inherit traits from their parents
    cards:
    - Heritable variants, different inheritable versions of a gene, arise through mutation or existing diversity.
    - Current conditions favor some heritable variants, so they reproduce or transmit more successfully than others.
    - The more successful variants leave more descendants in later generations.
    - The population's variant frequencies change, generation after generation.
    order: [0, 1, 2, 3]
    why: Variation must exist or arise before selection can change frequencies; treatment, immunity, behavior, and other conditions do not summon the mutation they need. Those conditions can favor some variants over others, which changes their reproductive or transmission success. Frequencies then shift across generations. The same frequency shift can also happen through drift, founder effects, or biased sampling, which is why a rising variant is not automatically evidence of selection.
  - group: POP
    task: Which explanation best fits the frequency trend and the independent checks?
    title: Selection or sampling artifact?
    concept: Natural selection and evolution
    place: Evolutionary Dynamics Group
    reason: The outbreak board's own checks are the only way to tell real selection from a change in who got tested
    at: ops-board
    scene: Get this wrong, and the city panics over a variant that was never really rising, or ignores one that is. A variant has gone from 8 to 31% of sequences in 4 weeks and the briefing is in an hour. The evolutionary dynamics group has run its checks and put them all on one screen.
    guide: >-
      Five readings, and each one rules out a different rival explanation. The rise
      repeats across hospital systems. Sequencing depth stays stable. Neutral
      variants — ones selection is not acting on — stay flat. For each candidate
      explanation, ask how many of the five readings it survives. And notice what
      even the best answer here does not measure: how big the advantage actually is.
    background:
    - >-
      Why the normal readings are the ones that decide it. The reading that jumps
      out grabs your attention, but it usually fits more than one explanation. That
      is why it rarely settles anything by itself. The readings that actually tell
      explanations apart are the ones each one predicts should move. When a reading
      stays normal, that is real evidence — it counts against every explanation that
      would have moved it.
    - >-
      How to work through the candidates. Take one explanation at a time. Before you
      check the readings again, predict what it would do to them — which ones move,
      which way, and by about how much. Then compare your prediction to the real
      readings. Predicting first is what makes this a diagnosis instead of a
      rationalization, because the prediction comes before you look at the data, not
      after.
    - >-
      Why only one explanation should survive. Several explanations will fit part
      of
      the readings, on purpose. A partial fit is exactly what a confident wrong
      answer feels like from the inside. If two explanations are still standing, find
      the one reading where their predictions differ and let it decide. If no reading
      tells them apart, you have not finished reading the panel.
    takesAsRead:
    - Mutation and genetic variation
    assumes:
    - a change in who gets tested changes what the tests find
    takeaway: A changing share needs competing explanations tested before it can support a claim about biological advantage.
    format: DIAGNOSIS
    why: A rising percentage is observed frequency, not a direct measurement of fitness. Selection is one explanation alongside a founder event, a change in who gets sampled, or laboratory bias. Here the rise repeats across independent hospitals, sequencing quality stays stable, neutral control variants do not show the same pattern, and an adjusted lineage-growth comparison still favors the variant. That makes selection the leading explanation, while leaving the exact mechanism and size of the advantage unresolved.
    rebuttals:
    - A changing sampling mix would move the neutral control variants too, since they ride on the same samples. Those variants are flat.
    - A sequencing problem would show up as changing depth or coverage. Depth has stayed stable across all four weeks.
    - A single lucky cluster would not repeat across three independent hospital systems. It would not survive adjusting for place, either.
    headline: A genetic variant rises quickly in the city data.

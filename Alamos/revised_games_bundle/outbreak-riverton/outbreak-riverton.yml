- title: Why Is Elias Crashing?
  objective: Trace the oxygen-delivery chain and identify which physiological link is failing in the sickest patients.
  briefing: Elias Webb and another patient have similar infection results, but only Elias is deteriorating. His oxygen is low, his haemoglobin and cardiac output are not, and the lung images have changed. Before rounds, you have to find the broken handoff and check whether the downstream acid–base chemistry fits it.
  stake: Day 13. Treat the wrong link and the team can correct a normal number while the real failure continues. Today you trace oxygen from lung to blood to tissue and decide what the bedside numbers actually support.
  takeaway: 'Physiology is a chain of handoffs: normal values can rule out links, but no single reassuring measurement clears the whole system.'
  segue: >-
    The evidence points to impaired gas exchange and a downstream metabolic consequence.
    Elias improves — then, several days later, he and other recovering patients suddenly
    get worse even while the viral signal is falling.
  stops:
  - group: CLIN
    task: Assemble the oxygen path from air to tissue, then name the link that the full panel makes most likely to be limiting.
    title: Locate the oxygen-delivery failure
    concept: Circulatory and respiratory physiology
    place: Intensive Care Unit
    reason: The bedside monitor is the only place to trace which link in the oxygen chain actually broke
    at: icu-monitor
    scene: Elias Webb's oxygen is dropping while Dr. Lena Ortiz watches the bedside monitor, and rounds start in minutes. It shows PaCO₂ 39, low blood oxygen, haemoglobin 14, cardiac output 5.2, and new lung scans. The team needs to find the blocked step before rounds.
    guide: >-
      Build the path that oxygen takes, step by step, from the air in the room to
      the
      tissue that finally uses it. Then find the one link where this patient's chain
      breaks down. Read the numbers, not the diagnosis on the chart. PaCO₂ is the
      carbon dioxide level in the blood — it tells you about breathing. Haemoglobin
      is
      the protein in blood that carries oxygen. Cardiac output is how much blood the
      heart pumps each minute. Each of these numbers is telling you that one
      particular link is working. Only one link is not.
    background:
    - >-
      What the chain is. Air reaches the alveoli — the tiny air sacs deep in the
      lungs — through breathing, a step called ventilation. Oxygen then crosses
      from the alveoli into the blood, a step called diffusion. Haemoglobin carries
      that oxygen through the blood. The heart pumps the blood to deliver it.
      Finally, the body's tissue takes the oxygen up and uses it. Each step can
      fail on its own, and each failure needs a different treatment. That is why
      'low oxygen' is a symptom, not a diagnosis by itself.
    - >-
      How to read the numbers as clues about each link. A normal PaCO₂ means the
      patient is moving air in and out — so ventilation is not the failed link.
      Haemoglobin of 14 means the blood has enough oxygen-carrying protein. A
      cardiac output of 5.2 litres a minute means the heart is pumping enough
      blood. Each normal number rules out one link in the chain.
    - >-
      Why the lung scans matter most here. New changes on the scans point to the
      step between the alveoli and the blood — the diffusion step. That is the one
      link none of the other numbers can clear. It is also the link whose treatment
      looks most different from the others.
    takesAsRead:
    - Homeostasis and feedback
    assumes:
    - oxygen must move from air to alveoli, blood and tissues in sequence
    - a normal reading at one link makes a simple failure there less likely
    takeaway: To find where a delivery chain breaks, trace every handoff in order, and let the normal links rule themselves out one by one.
    format: CHAIN
    question: Which link in the oxygen-delivery chain most likely fails, based on these numbers?
    chain:
      hint: Build the route oxygen must follow. Then use each reading to ask which link is still compatible with the failure; the largest number on the screen is not automatically the governing one.
      distractor: circulation
      links:
      - id: ventilation
        label: Ventilation to the alveoli
        transfers: fresh gas from the airways to the alveoli
        reading: PaCO₂ 39 mmHg
      - id: gas_exchange
        label: Air–blood gas exchange
        transfers: oxygen across the alveolar-capillary interface
        reading: arterial oxygen low; diffuse alveolar involvement on imaging
      - id: hemoglobin
        label: Haemoglobin carriage
        transfers: oxygen bound in circulating blood
        reading: haemoglobin 14 g/dL
      - id: circulation
        label: Cardiac flow
        transfers: oxygenated blood through the systemic circulation
        reading: cardiac output 5.2 L/min
      - id: tissue_delivery
        label: Tissue delivery and use
        transfers: oxygen from capillary blood to cells
        reading: downstream metabolic evidence not yet complete
      order:
      - ventilation
      - gas_exchange
      - hemoglobin
      - circulation
      - tissue_delivery
      governing: gas_exchange

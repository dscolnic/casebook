# What each place says when the player reads it.
# --------------------------------------------------------------- the warm-ups
# This campus has two tiers of ground — the containment ward is out past the fence
# — so the far lap is real and the vehicles come out with it.
warmups:
  trial-near:
    title: Walk the campus before you are needed on it
    why: >-
      Week three, and the hospital has been rebuilt around the outbreak: triage marquees
      in the
      courtyards, a decon tunnel across the main route, container labs where the car
      park was.
      Ortiz, the clinical physiology lead, walks every arrival round once, because
      a route you
      have not walked is a route you will take through a clean corridor in dirty gloves.
  greet:
    title: Six leads, three shifts, and a fence between them
    why: >-
      The clinical side and the laboratory side have barely met, and by the end of
      the week a
      decision will rest on one trusting the other's number. Get round the campus
      and put a name
      to every lead before the next shift change, because at three in the morning
      a phone call
      from somebody you have met is a different conversation.
  trial-far:
    title: The containment ward opens today, and the transport with it
    why: >-
      Everything past the fence has been off the call list all week. From today the
      containment
      ward and the mortuary annexe are on it, and they are far enough out that transport
      is
      signed out to reach them. Drive the route once before somebody is waiting at
      the other end
      of it.
  follow:
    title: Chen walks the specimen path once, end to end
    why: >-
      A swab taken in a marquee reaches the container lab through four pairs of hands,
      and every
      handover is a place contamination can enter. Chen, the cell biology lead, walks
      the whole
      path this morning at the pace it actually happens. Stay with her — the handovers
      are where
      the walk is learned and where somebody following too closely gets in the way.
  hunt:
    title: Six ventilators, and the board accounts for four
    item: {name: ventilator, plural: ventilators}
    why: >-
      Before tonight's admissions the ward has to know what it actually has. Four
      ventilators
      are where the board says. Two were moved during the weekend surge and nobody
      updated
      anything. Find them, because a machine nobody can locate is a machine that does
      not exist
      at two in the morning.
  canvass:
    title: Who in Ferry Ward is actually staying home
    why: >-
      The transmission estimate assumes the advice was followed, and the difference
      between a
      ward that isolated and a ward that could not decides whether the curve is bending.
      Ask
      along the streets until enough answers have come back to tell those two apart.
  evade:
    title: The journalist at the gate who wants a number
    why: >-
      A reporter has been at the main gate since six wanting today's case count before
      it is
      confirmed, and Morales, the epidemiology lead, has been clear that nothing goes
      out before
      the reconcile. Keep clear and finish your round. A number given at a gate is
      a number the
      hospital will spend a week correcting.
  tag:
    title: Catch Patel before he goes into the container lab
    why: >-
      Patel, the molecular diagnostics lead, has the run sheet for last night's plates,
      which is
      the only record of which samples were re-tested and which were not. Once he
      is gowned and
      inside he is unreachable for three hours, and this morning's positives cannot
      be
      interpreted without knowing which of them are repeats.

copy:
  CLIN: <p>The clinical wing. Every hypothesis in this outbreak has to survive contact with an actual patient.</p>
  CELL: <p>Cell and membrane biology. What the pathogen does to a cell, and what that rules out.</p>
  MOL: <p>Molecular diagnostics. Two instruments, a library, and a rule about controls.</p>
  IMM: <p>Immunology and treatment. Where protection and damage are told apart.</p>
  POP: <p>Epidemiology operations. Counts, denominators, and the difference between them.</p>
  FIELD: <p>The One Health field station. The outbreak did not start in a hospital.</p>
  CMD: <p>City Health Command. Decisions are made here whether or not the evidence has arrived.</p>
  TRANSIT: <p>The transit and mobility centre. Trip counts nobody has yet matched to the case map.</p>
  BRIEF: <p>The public briefing room. What the city is told, and how much of it is hedged.</p>
  WASTE: <p>The wastewater plant. Surveillance that sees the city before the city sees a doctor.</p>

# --------------------------------------------------------------- the reviews
# Callback variants. From day 3 the day model serves the oldest taught lesson
# that has an unserved "— Review" variant; matching is on the base title. Each
# is the base's idea on a different case, never a re-serve of its board.
lessons:
- group: POP
  title: Signal or noise? — Review
  takesAsRead:
  - Homeostasis and feedback
  task: Is the Mercy General jump a signal, and what on the desk decides it?
  place: Epidemiology Operations Room
  scene: >-
    Mercy General reports twelve new cases in two days, the sharpest jump of the
    outbreak. Dr. Sofia Morales, the epidemiology lead, has the hospital's testing
    log and the other two hospitals' counts on the desk before anyone briefs the
    city.
  guide: >-
    Six readings, and the same question as the first morning: a count against what
    was expected. Ask of each candidate which readings it predicts should have
    moved, and which it needs flat. A count can rise because the city changed or
    because the counting did, and two readings on this board separate those.
  assumes:
  - more searching finds more cases whether or not the disease has moved
  - a rate is a count measured against a population and a length of time
  takeaway: A count is not a signal until a comparison says what was expected — and until the way it was counted has been ruled out.
  format: DIAGNOSIS
  question: Is the Mercy General jump a signal, and what on the desk decides it?
  headline: Twelve cases in two days at one hospital, and a screening tent that opened on Monday.
  readings:
  - zone: Count
    label: New cases at Mercy General
    value: 12 in two days
    status: alarm
  - zone: Testing
    label: Tests run there
    value: tripled since the screening tent opened
    status: key
  - zone: Positivity
    label: Share of tests positive
    value: falling
    status: key
  - zone: Elsewhere
    label: Counts at the other two hospitals
    value: flat
    status: normal
  - zone: Dates
    label: Specimen dates
    value: all taken this week
    status: normal
  - zone: Wastewater
    label: Community signal
    value: flat this week
    status: normal
  choices:
  - label: A true acceleration of the outbreak
    mechanism: More disease in the city, arriving first at the busiest hospital.
  - label: An artifact of the new screening tent
    mechanism: More searching finds more of what was always there, without anything changing in the city.
  - label: A reporting backlog clearing at once
    mechanism: Cases from earlier days filed together read as a two-day jump.
  - label: An ordinary seasonal rise
    mechanism: Autumn respiratory illness lifting every count with it.
  answer: An artifact of the new screening tent
  rebuttals:
  - More disease raises the share of tests positive along with the count. Positivity is falling while testing triples, and the other hospitals and the wastewater see nothing.
  - A backlog carries old specimen dates with it, and every swab in this jump was taken this week.
  - A seasonal rise lifts the other two hospitals too. Their counts are flat, so whatever moved at Mercy General is local to how Mercy General is counting.
  why: >-
    The count rose because the counting did. A screening tent triples the
    searching, and more searching finds more of whatever was always there — so the
    test of a real acceleration is the share of tests coming back positive, and it
    is falling. A true rise lifts positivity, the neighbouring counts and the
    wastewater together, and all three are quiet. Day one's rule runs both ways:
    two cases found a second way made that cluster real, and twelve found only one
    way is what an artifact looks like.

- group: POP
  title: Build the provisional case definition — Review
  takesAsRead:
  - Populations, transmission chains and exponential growth
  - Rates, ratios and reading data
  task: Order the revision so the counting stays comparable across the change.
  place: Epidemiology Operations Room
  scene: >-
    Week three, and the molecular assay is now reliable enough to join the case
    definition. Each hospital has drafted the change differently. Dr. Lena Ortiz
    wants one revision on every desk by tonight, without breaking three weeks of
    curve counted the old way.
  guide: >-
    All four steps will happen, so ask what each one lets you check before the
    next depends on it. A revised definition is still an instrument wrong in a
    known direction, and it now has a second job: the counts made before and after
    the change have to stay comparable.
  assumes:
  - a curve counted under two definitions is two curves unless both are stated
  takeaway: An operational definition can change, provided the change itself is tested and the record stays comparable across it.
  format: SEQUENCE
  cards:
  - Draft the revised definition, adding the laboratory criterion where the evidence says.
  - Read the discordant cases — definition-positive but assay-negative, and the reverse.
  - Test the revision on known cases and obvious non-cases.
  - Issue it with a version date, and restate the earlier weeks under both definitions.
  order: [1, 0, 2, 3]
  rebuttals:
  - The discordant cases first, because where the assay and the definition disagree is the evidence for what to change. Drafting before reading them is writing down what you expected.
  - 'The draft second: the laboratory criterion goes in where the discordance says the old definition was wrong, not wherever it is easiest to add.'
  - Testing before issue, same as three weeks ago. Known cases catch a revision now too narrow; obvious non-cases catch one the assay has made too wide.
  - The version date and the restated weeks go out together. A curve that changes definition midstream without both is a step nobody can interpret.
  why: >-
    The order is the same instrument logic as the first definition, with one new
    obligation. Evidence first: the discordant cases are the record of exactly
    where the old definition and the assay disagree, and they say what the
    revision should fix. Draft from that evidence, then test both ways before
    anything is issued. The new step is the last one — a definition changed
    mid-outbreak splits the curve, so the earlier weeks are restated under both
    definitions and the change is dated, or every trend across it is lost.

- group: MOL
  title: When heat changes an enzyme assay — Review
  takesAsRead:
  - Cell structure and function
  task: Two reagent batches, one hot van, and the same samples in both runs.
  place: Molecular Diagnostics Bench
  scene: >-
    A reagent shipment for the reporter assay spent a day in an unrefrigerated
    van. Dr. Ravi Patel runs the same patient samples with the old batch and the
    van batch — same buffer, the liquid holding the acidity steady, and the same
    readout — and the van batch gives almost no
    signal.
  guide: >-
    Four options, and the two runs share almost everything. Ask of each option
    what it would do to both runs, and what it would do to only one. An
    explanation that would drag both batches down together cannot account for a
    difference between them.
  assumes:
  - an enzyme is a protein whose function depends on it keeping its shape
  takeaway: A side-by-side comparison indicts the one component that changed, because anything shared cannot explain a difference.
  format: CHOICE
  question: What does the batch comparison show?
  choices:
  - Heat in the van disrupted or destabilized the reporter enzyme’s active structure.
  - The patient samples themselves degraded before the second batch was run.
  - The van's heat destroyed the target sequence inside the patient specimens.
  - The reading instrument drifted between the two batches' runs.
  answer: Heat in the van disrupted or destabilized the reporter enzyme’s active structure.
  rebuttals:
  - The same samples read normally with the old batch minutes apart, so the samples had not degraded.
  - The specimens never went in the van. The target was not the thing that was heated.
  - Instrument drift would move both batches alike, and only the van batch lost its signal.
  why: >-
    Only one thing differs between the two runs: which reporter-enzyme batch went
    into the tube. The samples, buffer, and readout are shared, so a problem in those
    shared components would affect both batches. The hot-van batch losing activity
    therefore points to heat-induced disruption or destabilization of the enzyme’s
    active structure; the comparison does not require claiming that every structural
    change is permanent.

- group: CELL
  title: Choose the membrane mechanism — Review
  takesAsRead:
  - Cell structure and function
  task: Name each delivery route by its mechanism, from what the membrane is seen doing.
  place: Membrane Biology Lab
  scene: >-
    The therapy meeting has moved on to delivery. Four candidate ways a treatment
    could reach the inside of an airway cell are on the board, each described by
    what is observed at the membrane. Dr. Maya Chen wants each named by mechanism
    before costs are argued.
  guide: >-
    Four observations, four mechanisms, each used once. Pair them on the same
    three tests as before. Which way does the movement run against the gradient?
    Is a protein required? And is energy being spent? The poisoning result is the
    receipt for one of those answers.
  assumes:
  - a concentration gradient has a direction
  - ATP is the cell's energy currency
  takeaway: Transport mechanisms are named from direction, protein and energy — never from what the molecule is called.
  format: PROTOCOL
  columns:
  - What is observed at the membrane
  - Which mechanism that is
  scenarios:
  - The candidate crosses fastest when its outside concentration is highest, with no membrane protein needed.
  - The candidate crosses down its gradient, but only in cells expressing one carrier protein.
  - Uptake continues after the inside concentration exceeds the outside, and stops when ATP production is poisoned.
  - The candidate, packaged in a particle too large for any pore, appears inside membrane-bound vesicles.
  choices:
  - Simple diffusion.
  - Facilitated diffusion through a carrier.
  - Active transport.
  - Endocytosis.
  mapping: [0, 1, 2, 3]
  rebuttals:
  - Downhill with no protein is simple diffusion — the rate tracks the gradient because the gradient is the only push.
  - Downhill but carrier-dependent is facilitated diffusion. No energy is spent; the protein supplies the selectivity, not the push.
  - Uphill once the inside exceeds the outside, and dead when ATP is poisoned — the energy receipt names active transport.
  - A particle too large for any pore arriving in vesicles has been wrapped, not passed through. That is endocytosis.
  why: >-
    The same three constraints do all the work, on a therapy instead of a
    nutrient. Direction first: anything moving down its gradient needs no energy,
    so the ATP-poisoning result marks the one true uphill mover. Protein next: a
    gradient-driven crossing that still needs a carrier is facilitated, not
    simple. Size last: a particle too large for any pore cannot cross the bilayer
    at all, so finding it in vesicles means the membrane wrapped it. Choosing a
    delivery route is choosing which of these doors the therapy will use.

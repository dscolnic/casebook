      question: Estimate the upper bound on time to capacity, assuming nobody is discharged.
      labels:
      - 30 open beds
      - 8 admissions/day
      - 120 staffed beds
      - 90 beds occupied
      - 24 h (staffing lead time; not needed for this bound)
      values:
      - 30
      - 8
      - 120
      - 90
      - 24
      slots: 2
      template: '{0} ÷ {1}'
      formula: a/b
      correct: [0, 1]
      target: 3.75
      tolerance: 0.3
      units: days
      solution: 30 ÷ 8 ≈ 3.75 days if nobody is discharged.
      explanation: Thirty beds are open, not 120. Dividing 30 by 8 gives a worst-case fill time of about 3.75 days. Because discharge information is missing, this is a bound rather than a forecast — and that missing flow is exactly the next quantity the operations team should measure.
  - group: POP
    task: Set the occupancy threshold before releasing the next capacity updates, then see whether the staffing still has the lead time it needs.
    title: When do you call in overflow staff?
    concept: 'Epidemiology: case definitions, curves, R and reservoirs'
    place: City Command
    reason: Command's own policy board is where the trigger has to be set before the next update goes out
    at: policy-board
    scene: Wait too long to act, and there is no bed left for the next Elias Webb who comes through the door. Dr. Sofia Morales has today's critical-care occupancy at 75%. She also has a short worst-case trace from the capacity model. Two actions can each be reversed later. But both need lead time before they help.
    guide: >-
      One rule, written before the trace is released, and fixed once it is. Overflow
      staffing and transfer planning both take a full day to arrive once they are
      called. And at 95 % occupancy, there is no staffed bed left for the next
      patient. So the line has to sit back from 95 by however far occupancy climbs
      in
      a day — but not so far back that the unit gets surged over an ordinary bad
      week.
    background:
    - >-
      Why decide the rule in advance. Occupancy is at 75% and climbing, and every
      hour spent deciding is an hour of lead time lost. A rule set now is the same
      decision, just made calmly. It is also the only version you can explain
      afterward to the people whose care was affected.
    - >-
      Why the two actions need different trigger points. They take different
      amounts of time to have an effect. A threshold set for the slower action
      triggers the faster one far too early. A threshold set for the faster action
      means the slower one cannot finish in time. Lead time is the whole reason
      there are two separate numbers.
    - >-
      Why being reversible matters. Both actions can be undone if the trace turns
      out too pessimistic. That is what makes it reasonable to commit to them in
      advance. An action that could not be undone would need a much higher
      standard of evidence before committing to it.
    assumes:
    - a trigger is written before the next number arrives
    - reversible preparations still need time to take effect
    takeaway: A flexible plan works best when its thresholds and lead times are set before the evidence starts moving.
    format: TRIGGER
    question: >-
      At what critical-care occupancy do you activate overflow staffing, given it
      takes a day to
      arrive?
    trigger:
          # data provenance: invented policy thresholds applied to a source-derived worst-case occupancy trace
      hint: >-
        Write the threshold before releasing the trace. The staffing takes a day to
        arrive, so a
        rule that fires with less than that has called something which cannot happen.
      scale:
        min: 70
        max: 100
        unit: '% of staffed beds'
        label: Critical-care occupancy
        anchors:
        - {at: 75, means: a bad week; every admission still meets a staffed bed}
        - {at: 95, means: the emergency trigger zone; only a small staffed-bed buffer remains}
      stream:
      - t: 0
        value: 75
        hoursLeft: 72
        at: day 0
        update: 75 % staffed critical-care beds occupied
      - t: 1
        value: 82
        hoursLeft: 48
        at: day 1
        update: 82 % staffed critical-care beds occupied
      - t: 2
        value: 88
        hoursLeft: 24
        at: day 2
        update: 88 % staffed critical-care beds occupied
      - t: 3
        value: 95
        hoursLeft: 0
        at: day 3
        update: 95 % staffed critical-care beds occupied
      objective: >-
        Overflow staffing is under way before occupancy reaches 95 %.
      rehearsal:
        note: the first wave, the same unit
        stream:
        - {value: 78, hoursLeft: 72}
        - {value: 84, hoursLeft: 48}
        - {value: 89, hoursLeft: 24}
        - {value: 92, hoursLeft: 0}
      conditions:
      - id: staffing
        label: Activate overflow staffing and transfer planning
        leadHours: 24
        window: {min: 78, max: 84}
    answerText: >-
      Activate at around 80 % occupancy. That fires on the 82 % update, giving 48
      hours in
      hand — enough time for the staffing to arrive. Waiting for 88 % leaves only
      24 hours,
      and waiting for 95 % leaves none at all.
    why: A trigger is a decision rule written before the next number arrives. Staffing takes a day to mobilize, so the threshold has to fire while there is still more than a day of buffer in the scenario stream. Starting at 75% and waiting until 95% would consume almost all of that lead time. The value of the rule is not that 80% is universally correct; it is that the threshold is tied to this system’s lead time and can be revised when new capacity data arrive.

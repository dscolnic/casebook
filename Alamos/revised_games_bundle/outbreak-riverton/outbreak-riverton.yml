    task: Sort the specimen tray before the courier goes.
    title: Clean side, dirty side
    concept: Biosafety, aseptic technique and contamination
    place: Container Laboratory
    reason: A contaminated environmental sample could invent a transmission clue, so every item has to be sorted by exposure history before the courier leaves
    at: sample-cabinet
    scene: The city has started sampling wastewater, surfaces, and respiratory specimens to find hidden spread. One contaminated tray could create a false environmental signal that looks like a transmission route. Sort each item by where it has actually been, not by whether it still looks clean.
    guide: >-
      Two bins. Ask one question about each item. Has it been open to anything outside
      the cabinet since it was last sterile — completely free of germs? If yes, it
      goes
      in the dirty bin, no matter how clean it looks. Sort by where it has been, not
      by
      what it looks like.
    background:
    - >-
      Why the two sides never mix. You cannot see contamination — germs from outside
      the
      cabinet. Looking careful does not undo it. Once an item has been open to the
      room,
      it can carry whatever germs the room has. Put it back on the clean side, and
      those
      germs ride along into every sample tested after it.
    - >-
      Why looking fine is the wrong test. A sealed swab pack dropped on the floor
      is still
      sealed, so it still goes on the dirty side, because it touched the floor. An
      open
      plate that sat inside a running cabinet for an hour stays open, so it still
      goes on
      the clean side, because the cabinet's air stayed germ-free. History decides
      it.
      Looks do not.
    assumes:

- title: The River Animals
  objective: Distinguish reservoir, vector, incidental host, and spillback — then decide whether the evidence justifies an animal-control action.
  briefing: A virus closely related to the human outbreak has been detected in animals near the river. That could mean a reservoir, a vector, spillback from infected people, or a shared exposure. The city has scheduled a cull for Saturday, so the field design must distinguish those stories before fear becomes policy.
  stake: Day 33. Get the animal story wrong and Riverton could kill a species that was never maintaining the outbreak — or ignore a real source that keeps seeding new cases. Today you decide what evidence the cull actually requires.
  takeaway: A positive animal sample begins a reservoir investigation; maintenance, exposure, comparison sites, timing, and transmission evidence are what make the claim stronger.
  segue: >-
    The cull is held while a comparison-based field study continues. Then sequencing
    flags a different problem: one viral variant has risen from 8% to 31% of samples
    in four weeks, and the city wants to know whether biology or biased sampling caused
    the jump.
  stops:
  - group: FIELD
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used once.
    title: What role are the river animals playing?
    concept: Ecology, vectors and zoonoses
    place: One Health Field Station
    reason: The evidence board has four animal patterns pinned up, and the cull cannot wait for a slow answer
    at: reservoir-board
    scene: Marcus Webb has spent every morning of this outbreak on the docks near the river. The virus in his father's blood looks close to one carried by the animals living there. The field station has four animal patterns pinned on the board, and a trapper is waiting outside with more to check. By Saturday, the city wants an answer, or it wants a cull.
    guide: >-
      Four animal patterns, four roles. The board is testing two things about each
      pattern. Does the germ stay inside that animal? And does that animal spread
      it
      to others? Ask those two questions before anything else. One pattern is just
      an
      animal seen a lot near sick people. It always tests negative for the germ.
      Being nearby is not the same as carrying the disease.
    background:
    - >-
      Why this is a matching board, not four separate questions. Each answer on this
      board sounds like it could fit more than one animal. Pick one answer at a
      time, and a nearly-right answer can slip through unchecked. Placing all four
      forces you to compare them. The question is not "does this fit here?" It is
      "does this fit here better than it fits somewhere else?"
    - >-
      How the one-each rule helps you. Each answer gets used exactly once. So every
      match you make changes what is left for the others. Settle the two pairs you
      feel sure about first. Often, that leaves the last two decided for you, by
      elimination. If it does not, two answers are still competing for one animal.
      That fight is exactly what this question is testing.
    - >-
      Why you can never be wrong about just one match. Every answer is used once.
      So
      three correct matches leave only one spot for the fourth. Any mistake always
      involves at least two matches, not one. Remember that when the last pair feels
      forced. The problem is usually not the match you are stuck on. It is an
      earlier match you stopped questioning too soon.
    takeaway: An animal's role comes from what it does, not how it looks. Staying infected and passing the germ on are the real tests. Living near people is not enough by itself.
    format: PROTOCOL
    columns:
    - What the species does
    - Which role that makes it
    rebuttals:
    - A reservoir stays infected without getting very sick. It has to survive the germ to keep carrying it.
    - A vector carries the germ from one host to another, often by biting. It does not need to stay infected itself.
    - A dead-end host gets sick but rarely spreads the germ onward. The chain of infection stops there.
    - An animal that is just common near cases, and always tests negative, shares a habitat with people, not an infection. Being nearby is the weakest evidence on this board.
    takesAsRead:
    - 'Pathogens: viruses and bacteria'
    assumes:
    - a species can carry an agent, spread it, or merely be near it
    scenarios:
    - An animal carries the germ for a long time without getting very sick.
    - Mosquitoes trapped near the ward test positive, and the same strain turns up in new patients.
    - An animal gets sick from the germ but rarely spreads it onward.
    - An animal shows up a lot near sick people but always tests negative for the germ.
    choices:
    - Potential reservoir host — a species that may help maintain the agent in the reservoir system over time.
    - Potential vector — an organism that transmits the agent between hosts; the agent may simply be carried or may develop or multiply inside it.
    - Incidental or dead-end host — an animal that catches the germ but does not spread it.
    - Ecological association without evidence of infection — an animal just seen near cases, not actually infected.
    mapping: [0, 1, 2, 3]
    why: An animal’s role is defined by the transmission system, not by how close it lives to people. A reservoir is a host population or environment in which the agent can be maintained. A vector transmits the agent between hosts and may support its development or replication. An incidental or dead-end host can be infected without sustaining onward transmission. One positive animal sample is therefore a clue to role, not the role itself.
  - group: FIELD
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly placed cards after each check.
    title: What evidence would justify the cull?
    concept: 'Epidemiology: case definitions, curves, R and reservoirs'
    place: Wildlife Ecology Site
    reason: The Saturday cull should not proceed unless the field study can separate maintenance in animals from spillback out of the human outbreak
    scene: Get this wrong, and Riverton kills a species that never carried the disease at all, or waits too long while it keeps spreading. Trappers are finding sick animals on the flood plain. Nobody has yet sampled them in a way that can tell a true reservoir from an animal that just caught the germ from people. This campaign only gets funded once.
    guide: >-
      All four steps happen, and this campaign is funded only once. Finding a
      positive animal does not prove it is a reservoir. What proves it is a study
      design that could have found the germ somewhere else — and looked, and
      didn't. For each step, ask what it makes possible for the next step. Where
      you look decides what you find. And a comparison site is what makes a
      prevalence number — how much of a group is infected — mean anything at all.
    background:
    - >-
      Why the whole order is graded together, not step by step. A sequence claims
      that each step depends on the one before it. Swap just one pair, and that
      claim breaks, wherever the swap happens. Partial credit would be credit for
      an order that does not actually work.
    - >-
      Why you should start at the ends. The first and last steps have nothing
      before or after them to fit around. That usually makes them the two you can
      settle just from the scene. Once you pin those two down, far fewer orders
      are still possible. What is left in the middle is where the real judgment
      call is.
    - >-
      What decides the order, on boards like this. Time is the usual axis, but it
      is not the only one. An order can instead run on cost, or on risk, or on
      reversibility — doing the tests that leave a sample untouched before the
      ones that use it up. On boards like that, reading it as a timeline finds
      nothing. None of the steps has to happen at any particular hour.
    takeaway: Reservoir status is a population-level maintenance claim, not a label earned by one positive animal.
    format: SEQUENCE
    rebuttals:
    - Mapping human cases against habitat comes first — it tells you which species and which places are even worth checking.
    - Unbiased sampling with comparison sites comes second. If you only look where you searched hardest, you have measured your own search, not the animal.
    - 'Prevalence and genetic relatedness come third: they connect the two animal groups, and you need samples from both sides to compare them.'
    - Repeated spillover comes last. One event could be luck. A reservoir claim is a claim about a pattern that keeps happening.
    assumes:
    - where you look decides what you can find
    cards:
    - Map where human cases happened against animal habitat and exposure patterns.
    - Sample candidate animal species using an unbiased design, with comparison sites.
    - Compare prevalence, timing, exposure patterns, and genetic relatedness across host species and sites.
    - Ask whether the combined evidence supports ongoing maintenance in the candidate host population and repeated transmission into people.
    order: [0, 1, 2, 3]
    why: A positive animal does not prove a reservoir. The investigation has to ask whether the agent is maintained in that host population or environment and whether infection in people is epidemiologically connected to it. Comparison sites, other species, repeat sampling, exposure histories, and sequence data can make competing explanations more or less plausible. Sequence similarity helps establish relatedness; it does not by itself establish direction of transmission.
  - group: POP
    task: Allocate the 20 slots so the campaign can distinguish a reservoir pattern from spillback or a one-household sampling artifact.
    title: Which samples can actually settle it?
    concept: Ecology, vectors and zoonoses
    place: Comparative Genomics Lab
    reason: Twenty sampling slots have to be spent on the design that can actually settle what the animal is doing
    at: campaign-board
    scene: The cull is set for Saturday. Dr. Sofia Morales has one field campaign to either justify it or call it off in time. Candidate animal species, comparison sites, and a second time point all compete for the same 20 sampling slots and the same field crews.
    guide: >-
      One campaign, twenty sampling slots, and more candidate species, sites and
      time points than the crews can cover. Watch the list of questions, not the
      map — it shows which comparisons your current plan can still make. A plan that
      samples the most animals but keeps no comparison cannot test anything at all.
    background:
    - >-
      Why comparisons matter more than counts. Finding the germ in one animal
      species proves it can be infected. It does not prove that species is the
      reservoir — the animal population where the germ lives long-term between
      outbreaks. That claim needs a contrast: this species against other species,
      this site against a comparison site, now against later. Slots spent with no
      contrast produce a positive result that settles nothing.
    - >-
      What a comparison site is for. If you find the germ everywhere, the finding
      is
      not specific to the outbreak area. Finding it here and not there is what links
      the reservoir to the human cases, and saying that costs half the whole
      campaign.
    - >-
      Why the second time point is expensive and hard to give up. Reservoir patterns
      change with the season and with the outbreak itself. One visit only gives a
      single snapshot. It cannot tell an established reservoir apart from a one-time
      spillover, which is exactly the question the response needs answered.
    takesAsRead:
    - 'Pathogens: viruses and bacteria'
    assumes:
    - a sample represents the population it was drawn from
    - a reservoir claim needs evidence that can distinguish persistence from spillback
    takeaway: A field design is defined by which rival explanations it can rule out with the samples it collects.
    format: ALLOCATE
    question: Which sampling plan keeps the comparisons needed to test the reservoir hypothesis — the idea that this species is where the germ persists long-term?
    allocate:
          # data provenance: invented classroom package sizes; sampling logic is source-derived
      hint: Every package buys a comparison and consumes field capacity. Keep the questions about geography, species and persistence answerable before spending anything on extra depth at one convenient site.
      pool:
        amount: 20
        unit: sampling slots
        label: Field campaign capacity
      items:
      - id: human_data
        label: Existing human case locations and exposure histories
        cost: 0
        note: Already available; they guide sampling but do not establish an animal reservoir by themselves.
        protected: true
      - id: candidate_case
        label: Candidate species at case-linked sites
        cost: 6
      - id: candidate_compare
        label: Same candidate species at comparison sites
        cost: 5
      - id: comparison_species
        label: Comparison species in the same habitats
        cost: 4
      - id: repeat_time
        label: Repeat sampling at a second time point
        cost: 5
      - id: deep_household
        label: Extra dense sampling around one case household
        cost: 6
      answers:
      - required: true
        requires:
        - candidate_case
        - candidate_compare
        question: Is carriage concentrated at case-linked sites rather than everywhere sampled?
      - required: true
        requires:
        - candidate_case
        - comparison_species
        question: Is the candidate species different from other species sharing the habitat?
      - required: true
        requires:
        - candidate_case
        - repeat_time
        question: Does the pattern persist across time rather than reflect one spillback episode?
      - required: false

  - group: IMM
    task: Hold the isolation room while the doors keep opening.
    title: Negative, while the door keeps opening
    concept: Biosafety, aseptic technique and contamination
    place: Isolation Ward
    reason: Every door opening can reverse the airflow that protects the corridor, so the pressure differential has to stay negative throughout the shift rather than merely recover afterward
    at: pressure-panel
    scene: This airborne-isolation room is engineered so its pressure stays below the corridor, pulling air inward when doors open. The room’s operating target in this simulation is about 8 Pa below the corridor. Staff and trolleys keep changing the airflow, and the extract fan is the control that can restore the differential before contaminated room air is pushed outward.
    guide: >-
      Keep the room's pressure difference inside the band on the gauge.
      The band gets narrower as the shift goes on. That's because the ward
      keeps filling — a gap that's fine for two patients isn't safe for
      six. The extract fan is your control. Every open door is a leak,
      and it keeps leaking until the fan answers it.
    background:
    - >-
      What negative pressure is for. Air always moves from higher pressure to
      lower pressure. A room held below the corridor's pressure pulls air in
      under its door, instead of pushing air out. So anything airborne in that
      room stays in that room. It only leaves through the filtered extract fan.
    - >-
      Why an open door isn't a one-time drop. Propping the anteroom door
      doesn't just lower the difference by a couple of pascals and stop there.
      It opens a path that keeps leaking pressure the whole time it's open. So
      a room left alone doesn't settle down. It drifts toward the corridor's
      pressure — and then past it.
    - >-
      Why a positive room is worse than no room at all. Once the pressure flips
      the other way, the room pushes its air out into the corridor. It keeps
      doing that silently, with no smell and no sign. Only the gauge tells you
      it's happening. That's why someone has to read it, instead of assuming
      it's fine.
    assumes:
    - air moves from higher pressure toward lower pressure
    takeaway: A leak you don't answer is not a leak that closes itself.
    format: HOLD
    question: Hold the isolation room's pressure below the corridor's for the whole shift.
    answerText: Keep the room below corridor pressure for the whole shift and adjust the extract fan when a disturbance changes the airflow. Recovering after a reversal is not the same as preventing one.
    why: Negative pressure protects the corridor only while room pressure remains below corridor pressure and airflow stays inward. Door openings and building airflow can disturb that differential, so the fan setting has to respond to the continuing change rather than to one momentary gauge reading. The 8 Pa value here is the room’s operating target; the scientific point is maintaining inward airflow and a reliably negative differential.
    hold:
      quantity: Room pressure below the corridor
      unit: Pa
      control: Extract fan
      hold: 8
      band: 0.4
      narrowTo: 0.2
      duration: 45
      direction: raise
      authority: 0.1
      pass: 0.8
      hint: Each door is a leak that keeps bleeding. Set the fan where it answers the leak, not where it answers the gauge.
      disturbances:
      - {label: Anteroom door propped for a turn, at: 4, amount: -0.03}
      - {label: Corridor window closed upwind, at: 20, amount: 0.05}
      - {label: Second door opens for the trolley, at: 38, amount: -0.045}
      commit: Report the shift
- title: Did the Treatment Work?
  objective: Make a conditional trial decision using absolute benefit, uncertainty, site differences, and safety rather than one flattering statistic.
  briefing: The trial reports fewer hospitalizations in the treated group, but one unusually young site contributes much of the apparent benefit. The overall estimate is promising and imprecise, and serious side effects are uneven. Before enrollment resumes, the board needs to know what the trial actually established.
  stake: Day 96. Calling success too early exposes more patients before the safety signal is understood; stopping reflexively can discard a useful treatment. Today you read the effect in absolute terms and apply the safety rule written before the results arrived.
  takeaway: A trial decision combines effect size, uncertainty, prespecified comparisons, and safety monitoring; no single p-value, percentage, or site settles it alone.
  segue: >-
    The board makes a conditional decision instead of declaring victory. But even
    a useful treatment cannot empty the ICU overnight, and the region is now close
    enough to capacity that a late policy trigger will arrive after the staff it calls
    for.
  stops:
  - group: CLIN
    task: One site enrolled younger patients and contributes much of the apparent benefit. What should the trial team do before attributing the difference to treatment?
    title: Did the comparison stay fair?
    concept: 'Experimental design: controls, sampling and bias'
    place: Clinical Physiology Suite
    reason: One trial site enrolled younger patients, and the comparison has to be checked before anyone credits the treatment
    scene: The drug that might end this outbreak could also be a headline built on one lopsided hospital. One large trial site signed up much younger patients than the other sites did, and that site accounts for most of the treatment's apparent benefit. The health ministry wants an answer today.
    guide: >-
      Four ways to handle one lopsided site. For each one, ask: was this choice made
      before the results came in, or after? Randomisation — randomly assigning
      patients to groups — makes groups similar on average, but not identical in
      every small group. Watch for any choice that lets the analysis change
      depending on what the results show. The study's original plan already has the
      right tools built in, which is what makes this decidable.
    background:
    - >-
      Why the wrong choices are worth studying. Each wrong choice is written to
      look right under one specific mistake. That mistake might be skipping a
      step, mixing up a number with a rate, or mistaking a correlation for a
      cause. Finding which mistake each one matches is where the real learning
      happens. Picking the right answer by instinct alone teaches nothing.
    - >-
      Why the shape of a choice tells you nothing. A correct choice often collects
      extra detail and units, which can make it longer. In the past, the correct
      choice used to be the longest option far more often than chance — across a
      whole game. That happened 88 percent of the time in these quizzes, before it
      was fixed. Now every game is checked for this pattern, so length, hedging,
      and extra detail no longer give away the answer.
    - >-
      What the verdict adds. Every wrong choice gets its own rebuttal, printed in
      the verdict — the reason that choice fails, not just a repeat of the right
      answer. Read them even after answering correctly. A right choice made for a
      shaky reason looks the same as one made for a solid reason. That's true
      until the day the shaky reason is exactly what's being tested.
    assumes:
    - randomization balances groups in expectation, not perfectly inside every site
    - an analysis chosen after seeing outcomes can introduce bias
    takeaway: Randomisation protects a comparison on average, not site by site. An uneven pattern like this should be checked using the analysis plan written before the results came in.
    format: CHOICE
    question: How should the team handle this uneven site, without picking their analysis after already seeing the result?
    why: Randomisation makes treatment groups similar on average, not identical in every small group. A site that enrolled younger patients can create a pattern worth checking, especially when it accounts for most of the apparent benefit. The right move is the by-site and interaction analyses written into the plan before anyone saw the results. Then check whether the pattern is consistent, check the data quality, and report any differences found. Dropping the inconvenient site, or inventing a subgroup after seeing the result, would let the analysis depend on the outcome.
    choices:
    - Use the pre-specified site-stratified analysis and test whether treatment effects differ materially by site.
    - Delete the young site because it makes the treatment look too effective.
    - Ignore site entirely because randomization guarantees identical groups everywhere.
    - Create new age cutoffs after seeing the result until the treatment effect becomes stable.
    answer: Use the pre-specified site-stratified analysis and test whether treatment effects differ materially by site.
    rebuttals:
    - Removing a site because you don't like its result makes inclusion depend on the outcome. That can bias the estimate.
    - Randomisation does not guarantee perfect balance inside every site or small group. Differences between sites still need to be checked.
    - Hunting for a subgroup after seeing the results can manufacture a story that looks solid but isn't. Using the plan written beforehand protects what the comparison actually means.
  - group: POP
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
    title: How big is the benefit in absolute terms?
    concept: 'Statistics: confidence, significance and sample size'
    place: Biostatistics Office
    reason: The safety board cannot weigh benefit against harm until the trial’s absolute benefit is calculated rather than described only as a dramatic relative percentage
    at: stats-desk
    scene: The treatment cut hospitalization from 20 of 200 patients to 10 of 200. Before the safety board decides how many more people should be exposed to the drug, it needs the absolute benefit — including how many patients must be treated for one additional person to avoid hospitalization.
    guide: >-
      Six numbers, and two of them pool the whole trial together — that answers
      nothing here. For each number, ask which group it belongs to. And notice that
      one result can be told three different ways. Cutting the risk in half sounds
      huge. Five fewer admissions per hundred people sounds modest. Only the last
      two
      of those three ways actually tell a minister how much to buy.
    background:
    - >-
      Why this is an estimate, not a calculation you derive from scratch. Every
      number on this board is already measured or given. Nothing here has to be
      worked out first. What is being tested is whether you can pick the right
      numbers for the relationship, and whether your answer comes out a sensible
      size once they are in place.
    - >-
      Why every tile has a label. A bare number cannot be checked against the
      relationship it belongs in. Reading the label first is how you catch a wrong
      unit, or a number that belongs to a different part of the problem, before you
      place it. That habit — read the label first — is the whole point of this
      format.
    takeaway: A cut in relative risk and a cut in absolute risk answer different questions, and both should be reported together.
    format: BALLPARK
    assumes:
    - a risk is events divided by the people who could have had them
    why: The same trial result can be described as a 50% relative risk reduction, a 5-percentage-point absolute risk reduction, or a number needed to treat of 20. All are mathematically true, but the absolute measures are essential for weighing benefit against side effects and limited treatment capacity. Reporting only the relative reduction makes the effect sound larger without changing the underlying data.
    question: Estimate the number of patients who must be treated for one to benefit.
    estimate:
      relationship: Risk = events ÷ people at risk. The number needed to treat is 1 ÷ (control risk − treated risk).
      prompt: The trial reports hospitalisation in 20 of 200 control participants and 10 of 200 treated participants.
      question: Estimate the number of patients who must be treated for one to benefit.
      labels:
      - 20 hospitalised, control arm
      - 200 participants, control arm
      - 10 hospitalised, treated arm
      - 200 participants, treated arm
      - 30 hospitalised in the trial
      - 400 participants in the trial
      values: [20, 200, 10, 200, 30, 400]
      slots: 4
      template: 1 ÷ ( {0} ÷ {1} − {2} ÷ {3} )
      formula: 1/((a/b)-(c/d))
      correct: [0, 1, 2, 3]
      target: 20
      tolerance: 1
      units: patients treated per additional benefit
      solution: Risks of 0.10 and 0.05, an absolute reduction of 0.05, so about 20.
      explanation: The same result is a halving of risk, a five-percentage-point reduction, and 1 benefit per 20 treated. The relative figure sounds largest and is the least useful for deciding how much of the drug to buy.
  - group: POP
    task: The benefit estimate is promising but imprecise, and adverse events are uneven. What is the defensible next decision?
    title: Continue, expand, or pause?
    concept: 'Statistics: confidence, significance and sample size'
    place: Independent Safety Board
    reason: Enrollment is paused because the benefit estimate is uncertain and serious side effects are uneven; the board must apply the safety rule written before either pattern was known
    scene: Seven treated patients and two control patients had serious adverse events. The estimated treatment benefit is 24%, with a 95% confidence interval from 3% to 41% — a wide range of effect sizes still compatible with the data under the planned analysis. Enrollment is paused while the independent safety board applies the stopping rules written before the results arrived.
    guide: >-
      Hold two facts together: the benefit estimate is promising but imprecise, and
      the serious adverse events are uneven. A 95% confidence interval is not a 95%
      probability that the true effect lies inside these endpoints. Use it as a range
      of effect sizes compatible with the data and planned model, then apply the prespecified
      safety review rather than inventing a rule after seeing the counts.
    background:
    - >-
      Why the wrong options matter as much as the right one. Each wrong option is
      written to look correct under one specific mistake — a step skipped, a
      quantity mixed up with a rate, a correlation mistaken for a cause. Figuring
      out which mistake each one comes from is where the real learning happens. You
      can pick the right answer on instinct and still learn nothing.
    - >-
      Why the shape of an option tells you nothing. A correct answer often ends up
      longer, because it needs the extra clause and the unit. In this game's older
      quizzes, the longest option used to be the right one far more often than
      chance — 88 times out of 100. That has been fixed and is now checked every
      game. Length, hedging and detail no longer point to the answer on purpose.
    - >-
      What the verdict adds. Every wrong option gets its own short answer back,
      explaining why that option fails, not just repeating why the right one works.
      Read these even after you pick correctly. A right guess made for a shaky
      reason looks exactly like a right guess made for a good one, until the day the
      shaky reason is exactly what gets tested.
    assumes:
    - a wider interval means less is known, not that the effect is smaller
    takeaway: Benefit and safety must both be judged through the monitoring plan set in advance. A good benefit estimate does not override a possible safety signal.
    format: CHOICE
    question: The results look promising but imprecise, and the side effects are uneven between groups. What does the board decide?
    why: The interval from 3% to 41% is compatible with benefits of very different sizes under the trial model; it does not assign a 95% probability to the true effect lying inside that range. Seven serious adverse events versus two may be chance or a real safety signal, and raw counts alone are not enough to decide. The defensible action is to apply the prespecified safety boundary and independent event review, then resume, modify, expand, or stop according to that plan.
    choices:
    - Apply the safety review set in advance, and resume or expand only if it allows it.
    - Declare success because the benefit interval excludes zero.
    - Ignore the uneven side effects, and collect only data on how the drug works.

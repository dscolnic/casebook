    answerText: Spend the fast slot on paired measurements of pathogen level and inflammation markers over time. The key evidence is direction, not size. If the pathogen level is falling while inflammation is rising, that points toward a late, body-driven phase. It's stronger evidence than one single high inflammation reading would be. It also tells the two guesses apart better than a detailed picture of where the damage is.

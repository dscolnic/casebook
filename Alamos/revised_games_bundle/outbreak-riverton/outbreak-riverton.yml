    answerText: The entry signal follows the change that blocks binding to the receptor. It falls from about 100 to 22 units when binding is blocked. After washout, it returns to about 96. The matched antibody does not reproduce that drop, so ordinary antibody handling does not explain it.
    why: How many receptors a cell has is only an indirect clue. A causal test asks whether binding the receptor is required for entry. Blocking that binding, with dose and handling held fixed, sharply lowers the entry signal. A matched antibody leaves it unchanged, controlling for adding any antibody at all. Washing the blocker away restores entry, so the effect runs both directions. Doubling exposure changes the signal's size, but it doesn't explain why blocking the receptor removes entry.
- title: The Cell Is Hijacked
  objective: Trace host gene expression and choose the measurement that distinguishes more RNA from altered translation or protein breakdown.
  briefing: Infected airway cells contain one familiar human protein at about forty times its normal level. The number is real, but it does not say whether the cell made more messenger RNA, translated each message more efficiently, or stopped breaking the protein down. The therapy team needs to know which part of the chain actually moved.
  stake: Day six. If the team mistakes a downstream protein surge for the place the biology changed, it can spend weeks attacking the wrong mechanism. Today you trace the production chain and decide which measurement comes next.
  takeaway: Protein abundance is an observation, not a mechanism; RNA, translation, and breakdown have to be separated with measurements at different steps.
  segue: >-
    The expression measurements locate the change instead of merely naming the loudest
    protein. At the same time, sequencing gives Patel a distinctive genetic target
    for a rapid diagnostic — but the first overnight run lights up its blank control
    too.
  stops:
  - group: MOL
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly placed cards after each check.
    title: How did the cell make forty times more protein?
    concept: Transcription, translation and gene expression
    place: Sequencing Center
    reason: The therapy team needs the host production chain in order before it can locate which step changed in infected airway cells
    at: sequencer
    scene: Infected airway cells contain one familiar human protein at about forty times its normal amount. That could start with more messenger RNA, or happen later. Four cards show the normal path from an accessible host gene to a working protein. Put the chain in order before anyone points to the step that changed.
    guide: >-
      These four cards form one chain. At any step, the amount of something can
      change on its own. That is why the order matters, instead of treating gene
      expression as one single event. For each card, ask: what does this step need
      before it can happen? Use that question on every card, not just the ones you
      feel sure about.
    background:
    - >-
      Why the whole order is graded together. A sequence is a claim about what
      depends on what. Each step is here because the step before it already
      happened, or had to happen first. Swap any two steps, and that claim breaks
      —
      wherever the swap sits. Partial credit would mean giving credit for a chain
      that does not actually work.
    - >-
      Why the two ends are the place to start. The first card has nothing before
      it. The last card has nothing after it. That usually lets you place both just
      from the scene alone. Once those two are pinned down, far fewer arrangements
      are left. The real judgment call is what goes in the middle.
    - >-
      What else an order can be based on. Time is the usual axis, but it is not the
      only one. An order can also run on cost, on risk, or on how reversible each
      step is — every step that leaves the sample untouched comes before any step
      that uses it up. On boards like that, reading for time finds nothing, because
      no step has to happen at a set hour.
    takeaway: A protein's amount can change at more than one stage of gene expression.
    format: SEQUENCE
    rebuttals:
    - Access comes first. If nothing can reach the template, nothing gets copied from it — no matter what else is true in the cell.
    - Transcription (copying DNA into RNA) comes second. The RNA message is what the next step reads.
    - Translation (building a protein from that message) comes third. A ribosome needs a transcript to read, and codons only get read once there is something there to read.
    - Folding comes last, and it matters. An unfolded amino-acid chain still exists and can be measured — it just cannot do its job yet.
    takesAsRead:
    - DNA structure and replication
    assumes:
    - genes are read into RNA and RNA is read into protein
    cards:
    - The DNA template becomes reachable.
    - RNA polymerase copies the gene into an RNA transcript.
    - A ribosome reads codons in the messenger RNA.
    - The amino-acid chain folds and starts doing its job in the cell.
    order: [0, 1, 2, 3]
    why: For this host protein, DNA accessibility, transcription, translation, folding, and breakdown are distinct steps. A protein can become abundant because more message was made, because each message was translated more efficiently, or because the protein lasted longer. Ordering the normal chain keeps the team from treating “more protein” as if it already named the mechanism.
  - group: MOL
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used once.
    title: Which step changed?
    concept: Transcription, translation and gene expression
    place: Gene Expression Lab
    reason: She wants every expression pattern matched to its stage before anyone names a drug target
    scene: Four expression patterns from infected airway cells are on the screen. Each compares a different pair of measurements — RNA amount, protein amount, sequence, or activity. Match each pattern to the step it actually supports before the therapy team names a target.
    guide: >-
      Four patterns on one side, four stages on the other, and each pattern compares
      two measurements. For each one, ask which two measurements it is comparing,
      and
      which direction each one moved — up, down, or unchanged. Match direction to
      direction. Save your reasoning about why a pattern happened for after you have
      placed it.
    background:
    - >-
      Why this is a matching board, not four separate questions. Each response here
      could sound reasonable for more than one situation. Picking one response at
      a
      time lets an almost-right answer slip through unchecked. Placing all four at
      once forces a real comparison. The question is not "does this sound
      reasonable", but "is it more right here than somewhere else".
    - >-
      How to use the one-each rule. Each response gets used exactly once, so every
      match you make narrows down the rest. Settle the two matches you feel sure of
      first. Often the last two fall into place by elimination. When they do not,
      two responses are still competing for one pattern — and telling those two
      apart is exactly what this stop tests.
    - >-
      Why you can never be wrong about just one match. Since each response is used
      once, three correct matches force the fourth one into place. So any mistake
      always involves at least two matches, not one. Remember that when the last
      pair feels forced. The problem usually is not the match you are stuck on — it
      is an earlier one you stopped questioning too soon.
    takesAsRead:
    - DNA structure and replication
    assumes:
    - the amount of a protein and the amount of its message are measured separately
    takeaway: The path from gene to protein is a chain of separate, measurable steps, not a promise that every step changes together.
    format: PROTOCOL
    why: RNA amount, protein amount, sequence and activity are four separate measurements. The path from gene to protein is a chain of steps, not a promise that all four move together. Message up with protein flat means the message isn't being turned into protein, or the protein is being destroyed as fast as it's made. Protein up with the message unchanged points the other way — better translation, or slower breakdown. A normal amount of protein that isn't working is a claim about the molecule, not the quantity.
    columns:
    - What the data show
    - Where the change could be
    rebuttals:
    - The message going up while the protein stays flat points to a problem after transcription — either a limit on translation, or the protein breaking down fast once it is made.
    - The protein going up while the message stays the same points to faster translation or slower breakdown. Nothing about the gene itself has changed.
    - One codon changing and one amino acid swapping is a sequence change — visible only by reading the sequence.
    - A normal amount with low activity points to folding, a chemical change, or the active site. The molecule is there; it just cannot do its job.
    scenarios:
    - The message (RNA) goes up, but the protein amount stays the same.
    - The message stays the same, but the protein amount goes up.
    - One codon — a three-letter piece of RNA code — changes, swapping one amino acid for another.
    - The protein amount is normal, but its activity is low.
    choices:
    - A limit on translation (building protein from the message), or the protein breaking down fast.
    - Faster translation, or the protein breaking down more slowly.
    - A missense change — one swapped amino acid caused by a DNA change.
    - A problem with folding, a chemical tag added after the fact, or the enzyme's active site (its working pocket).
    mapping: [0, 1, 2, 3]
  - group: MOL
    task: Abundance alone fits every mechanism. Which measurement do you make first?
    title: What should the lab measure next?
    concept: Transcription, translation and gene expression
    place: Protein Analysis Core
    reason: He can only pay for two more measurements, and wants them spent on the step that actually controls this
    scene: One protein is screaming forty times louder than it should, and the lab can only afford to ask two more questions about it. A familiar human protein shows up 40 times more often in sick cells than in healthy ones. Nobody has measured its messenger RNA, its message, yet. The team is already arguing about which pathway changed.
    guide: >-
      Four measurements, and the protein result alone fits every one of these
      explanations. For each choice, ask where it sits in the chain — upstream of
      the others, or downstream? Two of the four choices test something about a
      message (RNA) that nobody has counted yet. The lab can only pay for two
      measurements. The first one should tell you where to spend the second.
    background:
    - >-
      Why the wrong choices matter. Each wrong choice looks right under one kind
      of mistake. Maybe a step gets skipped. Maybe an amount gets mixed up with a
      rate. Maybe a pattern gets mistaken for a cause. Finding which mistake each
      wrong choice matches is where the real learning happens. Picking the right
      answer on instinct, without knowing why the others fail, teaches nothing.
    - >-
      Why the shape of a choice tells you nothing. A correct choice often has extra
      detail — an exact unit, or a clause that qualifies it. In many games here, the
      correct choice used to be the longest one far more often than chance allows.
      That was true in 88 percent of passage quizzes, before it was fixed. Now each
      game is checked with a statistical test, so length, hedging, and detail no
      longer give the answer away.
    - >-
      What the verdict adds. Every wrong choice gets its own rebuttal, and the
      verdict shows all of them. Each rebuttal explains why that choice fails — it
      does not just repeat the right answer. Read the rebuttals even when you got
      the answer right. A right answer for a shaky reason looks the same as a right
      answer for a solid reason, until a question tests the shaky part.
    takesAsRead:
    - DNA structure and replication
    assumes:
    - a protein's abundance is set by how fast it is made and how fast it is destroyed
    takeaway: The amount of a protein alone cannot tell you whether transcription, translation, or breakdown caused the change.
    format: CHOICE
    question: The protein's amount alone fits every explanation. Which measurement should you make first?
    why: 'A protein 40 times more abundant fits several explanations: more messenger RNA, more protein per RNA molecule, or slower breakdown. The first measurement should sit upstream of the other two. Measuring the message over the same time span tests whether its amount moved with the protein. If the message also rises sharply, more transcription becomes the leading explanation. If it stays flat, the search moves downstream — to translation and breakdown — instead of assuming the protein result already found the cause.'
    choices:
    - Measure the protein's messenger RNA, its message, over time.
    - Measure how much of that message the ribosomes are actually reading.
    - Measure the protein's half-life — how fast half of it breaks down.
    - Sequence the DNA region next to this gene.
    answer: Measure the protein's messenger RNA, its message, over time.
    rebuttals:
    - Whether ribosomes are reading the message only means something once you know whether the amount of message itself changed.
    - Half-life asks whether the protein simply breaks down more slowly. That is a real possibility, but it is the third measurement to make, not the first.
    - The neighboring DNA region answers a question nobody asked, about a gene whose location is already known.
- title: A Test Before Morning
  objective: Decide whether the overnight diagnostic run is trustworthy and what a positive result means in the population being tested.
  briefing: Hospitals are ready to move patients in or out of isolation at six o’clock based on a new rapid assay. Then the blank control turns positive. Before anyone acts on the patient wells, you must trace what the results share, reject a contaminated run if necessary, and work out how often a positive would actually be a true case.
  stake: Day nine. A bad test decision can send infected patients back into crowded wards or isolate healthy people while beds run short. The six o’clock report cannot go out until the controls and the population arithmetic agree.
  takeaway: A diagnostic result is trustworthy only when its controls hold, and the meaning of a positive depends on who is being tested as well as the assay itself.
  segue: >-
    The contaminated run is rejected and the replacement workflow earns its trust.
    Now the test can tell the team who is infected — but it still cannot explain why
    two patients with similar infection results can have completely different physiological
    outcomes.
  stops:
  - group: MOL
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly placed cards after each check.
    title: Can tomorrow’s test be trusted?
    concept: 'Molecular diagnostics: PCR and amplification'
    place: Sample Processing Room
    reason: Four hours before sunrise, the processing room needs its four steps built in an order that can be trusted
    at: amp-rig
    scene: By sunrise, hospitals will start moving patients based on this assay. Four steps are on the whiteboard. Amplification does not copy everything in a tube; it uses primers to copy one chosen genetic target many millions of times. If the starting target is RNA, the workflow must first make a DNA copy before PCR amplification.
    guide: >-
      All four steps happen somewhere in this run — the question is what order
      protects the result. Amplification copies whatever DNA is in the tube,
      including anything that came from the room itself. For each step, ask: what
      does it protect against, and what does it need to already be true before it
      can happen?
    background:
    - >-
      Why the whole order is graded together. A sequence is a claim about what
      depends on what. Each step is here because the step before it already
      happened, or had to happen first. Swap any two steps, and that claim breaks
      —
      wherever the swap sits. Partial credit would mean giving credit for a chain
      that does not actually work.
    - >-
      Why the two ends are the place to start. The first card has nothing before
      it. The last card has nothing after it. That usually lets you place both just
      from the scene alone. Once those two are pinned down, far fewer arrangements
      are left. The real judgment call is what goes in the middle.
    - >-
      What else an order can be based on. Time is the usual axis, but it is not the
      only one. An order can also run on cost, on risk, or on how reversible each
      step is — every step that leaves the sample untouched comes before any step
      that uses it up. On boards like that, reading for time finds nothing, because
      no step has to happen at a set hour.
    takeaway: A diagnostic result is the product of a controlled process, not just a number the machine displays.
    format: SEQUENCE
    rebuttals:
    - Extraction comes first, and identity must survive it. A result that cannot be tied to a patient is not a diagnosis of anyone.
    - Controls go into the same run as the samples. Added later, they would be testing a different run, not the one that made the result.
    - Amplification, copying the target DNA, comes third, using tested primers, short DNA starters. Every other step exists to make this one readable.
    - Interpreting the result comes last, and only if the controls passed. If a control misbehaved, the patient's result cannot be trusted, no matter how clean it looks.
    takesAsRead:
    - DNA structure and replication
    assumes:
    - amplification copies whatever template is present, wanted or not
    cards:
    - Pull out the material, and keep track of whose sample it is.
    - Run positive, negative, and no-template controls alongside it.
    - Copy only the chosen genetic target with tested primers and the correct cycling steps; if the target is RNA, first make a DNA copy.
    - Read the patient's result only if every control behaved as expected.
    order: [0, 1, 2, 3]
    why: A patient result is the output of a controlled workflow. Sample identity has to survive extraction, controls have to run alongside the patient material, and the amplification step targets a selected sequence rather than all genetic material in the tube. A positive control shows the chemistry can detect the target; a no-template control checks whether target material contaminated the workflow. Read the patient only if those checks behave as expected.
  - group: MOL
    task: Open the dependency chain behind each result, keep the evidence that still stands, and name the shared source that makes the amplification positives unreliable.
    title: Why did the assay turn positive?
    concept: 'Molecular diagnostics: PCR and amplification'
    place: PCR Diagnostics Lab
    reason: The diagnostics panel is the only way to trace whether tonight's positives share one contaminated source
    at: pcr-panel
    scene: One ward has already started clearing its isolation rooms on the strength of tonight's run. Dr. Ravi Patel, the molecular diagnostics lead, is looking at patient results, two controls, and a result from a different test method. If this run is wrong, patients will be moved before morning.
    guide: >-
      Open up what each result actually depends on. Keep any result that would
      still hold up even if one shared step got contaminated — something leaking
      into more than one tube. Untick the rest. Then name the one dependency that
      the unreliable results all share. A ward has already begun clearing isolation
      rooms, so both directions matter here. A false positive — a positive result
      that is wrong — moves patients for nothing. Throwing out a true positive
      leaves a real outbreak unwatched.
    background:
    - >-
      How a shared workflow can make results agree for the wrong reason. Wells run
      in the same batch go through the same extraction, the same reagents, and the
      same instrument. Contamination anywhere in that chain shows up in every well
      downstream of it. The result looks like a cluster of real positives, even when
      it is not one.
    - >-
      What the controls are actually for. A negative control that stays negative
      rules out contamination across the whole batch. A positive control shows the
      chemistry itself works. Neither one can rule out contamination that happened
      after the controls were already placed. That is why a result from a
      different testing method matters here too.
    - >-
      Why a different method beats repeating the same one. Running the same test
      again on the same extract shares every dependency the first run had, so it
      will reproduce a contaminated result perfectly. Only a different platform,
      using a different sample extract, gives evidence that actually survives this
      question.
    takesAsRead:
    - DNA structure and replication
    assumes:
    - a no-template control contains no patient sample
    - two methods with different chemistry can fail for different reasons
    takeaway: Agreement between results is not real evidence when they all share the same path a contamination could travel.
    format: TRACE
    question: Which results share one workflow dependency, and which result still survives as real evidence?
    trace:
      hint: Do not just count how many wells are positive. Open up what each result depends on, keep the evidence built on a different path, and name the one dependency shared by the unreliable signals.
      target: workflow_carryover
      channels:
      - id: patient_amp
        label: Patient wells after amplification
        reading: several wells test positive (expected, if the target is really there and the run is clean)
        depends:
        - patient_material
        - amp_chemistry
        - workflow_carryover
      - id: ntc
        label: No-template control
        reading: shows a positive signal (it is supposed to stay negative, since it has no patient sample in it)
        depends:
        - amp_chemistry
        - workflow_carryover
      - id: positive_control
        label: Known positive control
        reading: amplifies as expected (this shows the chemistry itself can detect the target)
        depends:
        - amp_chemistry
        - control_template
      - id: orthogonal
        label: A different testing method, on the same patients
        reading: does not detect the target in these same patients (it uses separate sample prep and separate chemistry)
        depends:
        - patient_material
        - orthogonal_chemistry
        - independent_prep
      resources:
      - id: patient_material
        label: Patient material
      - id: amp_chemistry
        label: Amplification chemistry, the copying reaction
      - id: workflow_carryover
        label: Carryover contamination in the amplification workflow
      - id: control_template
        label: Known positive-control template
      - id: orthogonal_chemistry
        label: Chemistry used by the different testing method
      - id: independent_prep
        label: Sample preparation done separately
      independent:
      - positive_control
      - orthogonal
    answerText: The patient wells and the no-template control share the same amplification workflow, so carryover contamination could create both signals. Keep two facts that still stand — the chemistry can work, and the different testing method did not confirm the target. This amplification run cannot be trusted to classify these patients.
    why: A no-template control has no patient material in it, so any positive signal there must come from the shared workflow or its reagents, not a real target. That same shared path runs through the patient wells too, making their positive signals unreliable. The known positive control still shows the chemistry can detect the target — but that can't rescue a contaminated run. The separate testing method uses different preparation and chemistry, so its negative result still means something. The real answer traces what each result depends on, not how many wells are positive.
    headline: The overnight amplification run flags several patients as positive, but one control is also acting strange.
  - group: POP
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
    title: What does a positive mean?
    concept: 'Test performance: sensitivity, specificity, predictive value'
    place: Clinical Statistics Desk
    reason: Before anyone tells a patient that a positive means infection, the team has to combine test accuracy with how uncommon the condition is in the group being screened
    scene: Screen wrong, and healthy people get told they're sick, or sick people get sent home into a crowd. The mayor's office wants to screen a population where the condition is rare. It plans to treat every positive test as a real case. The statistics desk has a ten-thousand-person validation table, showing who truly has it and what the test found.
    guide: >-
      Six numbers, and two of them are tempting figures that belong to a different
      situation. For each one, ask: does this table actually supply it? Sensitivity
      is how many real cases the test catches. Specificity is how many healthy people
      it correctly clears. Both are properties of the test itself, not of the
      population it is used on. What a positive result is worth is different — it
      depends on prevalence, how common the condition already is in the group being
      tested. That is why screening a low-prevalence group turns up more false
      positives than true ones.
    background:
    - >-
      Why this is an estimate, not a calculation you derive from scratch. Every
      number on this board is already measured or given. Nothing here has to be
      worked out first. What is being tested is whether you can pick the right
      numbers for the relationship, and whether your answer comes out a sensible
      size once they are in place.
    - >-
      Why every tile has a label. A bare number cannot be checked against the
      relationship it belongs in. Reading the label first is how you catch a wrong
      unit, or a number that belongs to a different part of the problem, before you
      place it. That habit — read the label first — is the whole point of this
      format.
    assumes:
    - prevalence is the share of a population that has the condition
    - sensitivity and specificity are properties of a test, not of a population
    takeaway: A positive test result depends on prevalence, not just on sensitivity and specificity.
    format: BALLPARK
    question: Estimate the chance that a positive result is a true case.
    why: 'The validation table gives all three numbers. Among 100 infected people, 90 test positive and 10 negative — 90% sensitivity. Among 9,900 uninfected people, 9,801 test negative and 99 positive — 99% specificity. Those same counts show why a positive means less in a low-prevalence group: 90 true positives, but also 99 false positives. Only 90 of the 189 positive tests are real cases — about 48%.'
    estimate:
      relationship: Sensitivity = TP ÷ (TP+FN). Specificity = TN ÷ (TN+FP). PPV = TP ÷ (TP+FP).
      prompt: A reference method identifies 100 infected and 9,900 uninfected people in a 10,000-person validation group. The assay gives 90 true positives, 10 false negatives, 9,801 true negatives and 99 false positives.
      question: Estimate sensitivity, specificity, and the chance that a positive result is a true case.
      labels:
      - 10,000  (people screened)
      - 0.01  (how many really have it, as a fraction)
      - 0.90  (sensitivity — cases the test catches)
      - 0.99  (specificity — clear people it clears)
      - 0.30  (a tempting prevalence, but not this outbreak's)
      - 0.10  (a tempting figure, and not an input here)
      values: [10000, 0.01, 0.9, 0.99, 0.3, 0.1]
      slots: 4
      template: '{0}×{1}×{2} ÷ ( {0}×{1}×{2} + {0}×(1−{1})×(1−{3}) ) × 100'
      formula: a*b*c/(a*b*c + a*(1-b)*(1-d))*100
      correct: [0, 1, 2, 3]
      target: 47.62
      tolerance: 3
      units: '%'
      solution: Sensitivity ≈ 90%, specificity ≈ 99%, PPV ≈ 48%.
      explanation: Sensitivity is 90/100 = 90%. Specificity is 9,801/9,900 = 99%. PPV is 90/(90+99) ≈ 48%. A highly specific test can still produce many false positives when the condition is uncommon.
  - group: CLIN
    task: Work the arrivals board while the triage rule changes.
    title: What the marquee is taking now
    concept: 'Test performance: sensitivity, specificity, predictive value'
    place: Triage Marquee
    reason: The triage board is being rewritten all afternoon, and the arrivals still have to be worked as they come
    at: triage-board
    scene: Patients keep arriving while the triage rule changes as beds fill and reliable swab results return. The cost of a rule change is not the words on the whiteboard; it is the patient who gets routed under yesterday’s rule for the few minutes before everyone updates.
    guide: >-
      Sort each arrival the way the current rule says — and leave the rest alone.
      The
      rule on the whiteboard changes during the afternoon, and nobody announces it.
      Watch the arrivals right around each change. They are the ones that show whether
      you are reading the board, or just going by the last hour.
    background:
    - >-
      Why a triage rule changes at all. Early in a shift, the rule sorts people by
      how sick they are. Isolation beds are the rooms that keep sick patients away
      from others. Once those run out, the rule sorts by who can safely wait at
      home instead. Once swab test results come back, it sorts by who is confirmed
      sick. A confirmed case and a suspected one no longer belong in the same line.
    - >-
      Why the moment of change is where harm happens. If the marquee keeps using
      the old rule for ten more minutes, it can send confirmed cases into the wrong
      line. That line is the one the new rule was written to clear. And nothing on
      the board shows that this happened.
    assumes:
    - a triage rule can be rewritten while patients are still arriving
    takeaway: When a rule is quietly replaced, whoever hasn't heard yet pays the cost of still following it.
    format: SPOT
    question: Sort arrivals by the current rule on the whiteboard, and keep watching that whiteboard for changes.
    answerText: Read the whiteboard, not just the patient standing in front of you. Every time the rule changes, there are a few minutes when the old rule still feels right.
    why: Three rules run through the afternoon, and each wants a different group. First, anybody short of breath. Then, anybody who can't isolate at home. Then, anybody with a confirmed swab. One patient can match two rules at once, which is what makes a switch cost real. The panel scores the few minutes right around each change, since most arrivals fit neither rule and get sorted correctly anyway. Right after isolation beds fill, patients already walking the corridor are still walking under the old rule.

  - group: IMM
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly placed cards after each check.
    title: Which defense should arrive first?
    concept: Innate and adaptive immunity
    place: Immunology Lab
    reason: The immunology lab has the normal response mapped in four cards, and nobody has ordered them yet
    at: timeline-bench
    scene: Elias Webb was sitting up and eating three days ago. Tonight he is back on oxygen, worse than the first time. The immunology lab wants the normal response mapped out first, before it points to what broke. Four cards. No order yet.
    guide: >-
      The lab needs these four steps sorted before it can point to the one
      that broke. Ask two questions of each card. How fast does it happen?
      And how exact is it — does it spot that something is wrong, or does
      it target one exact germ? The last card is not a step in the fight.
      It is what the body keeps afterward, in case that same germ comes back.
    background:
    - >-
      Why the whole order counts, not each step alone. A sequence is a claim:
      each step sits here because the step before it already happened. Swap
      just one pair, and that claim breaks — no matter where the swap is.
      Partial credit would be credit for an order that does not actually work.
    - >-
      Why to start at the two ends. The first card has nothing before it. The
      last card has nothing after it. That usually lets you settle both from
      the scene alone. Once those two are pinned, far fewer arrangements are
      left for the middle. And the middle is where the real judgment happens.
    - >-
      What else an order can run on. Time is the usual axis, but it is not
      the only one. An order can run on cost, on risk, or on reversibility. A
      test that leaves the sample untouched goes before one that uses it up.
      On those boards, reading for time finds nothing. None of the steps has
      to happen at a set hour.
    takeaway: Innate immunity is the fast, general defense. Adaptive immunity is the slower, exact defense. Together they are stages of one team, not two teams fighting each other.
    format: SEQUENCE
    rebuttals:
    - Innate sensors go first. They don't need to have met the germ before — that's exactly why they're the fastest.
    - Recruiting cells goes second. Signals bring more immune cells to the spot, and nothing exact can act until they arrive.
    - Finding and multiplying the right lymphocyte goes third. That's slow, because matching one exact germ and copying the match takes days.
    - Memory goes last. It's what stays after the fight is over, and it's why a second run-in with the same germ goes differently.

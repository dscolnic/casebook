theme:
  id: outbreak_riverton
  title: 'Outbreak: Riverton'
  subtitle: Scientific Response Director · Riverton

# The areas of study. One column of the game each; every group needs somebody on the roster.
groups:
- id: CLIN
  code: CLIN
  name: Clinical Physiology
  color: '#315c78'
  desc: Patient physiology, organ systems, and bedside evidence.
  defaultLeader: ortiz
  milestones:
  - Observe the patient
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: CELL
  code: CELL
  name: Cell & Membrane Biology
  color: '#4b775f'
  desc: Cells, membranes, receptors, transport, and host interactions.
  defaultLeader: chen
  milestones:
  - Build the cell model
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: MOL
  code: MOL
  name: Molecular Diagnostics
  color: '#704f88'
  desc: DNA, RNA, gene expression, sequencing, and diagnostic controls.
  defaultLeader: patel
  milestones:
  - Validate the molecular evidence
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: IMM
  code: IMM
  name: Immunology & Treatment
  color: '#9a3f36'
  desc: Immune mechanisms, treatment response, and intervention evidence.
  defaultLeader: okafor
  milestones:
  - Separate response from damage
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: POP
  code: POP
  name: Epidemiology & Evolution
  color: '#9a741d'
  desc: Population patterns, surveillance, trials, and evolutionary change.
  defaultLeader: morales
  milestones:
  - Connect cases to populations
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: FIELD
  code: FIELD
  name: Ecology & One Health
  color: '#3d6f52'
  desc: Environmental surveillance, animal reservoirs, and ecosystem connections.
  defaultLeader: singh
  milestones:
  - Connect hosts and environment
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off

# The cast. `division` is what makes a person a valid person stop.
roster:
- id: ortiz
  name: Dr. Lena Ortiz
  role: Clinical Physiology Lead
  division: CLIN
  quiz:
  - q: Why does Ortiz read vital signs as a delivery chain rather than as separate numbers?
    a: Oxygen reaching tissue depends on every link, so one normal reading does not clear the chain
    wrong:
    - Vital signs all come off one monitor, so they share whatever error it has
    - Only the chain as a whole is recorded in the notes
    - Individual readings are too imprecise to interpret
  bio: |-
    Runs the physiology side of the clinical group, which in week three means being
    called out to the marquees whenever a patient's numbers stop making sense
    together.

    She reads vital signs as a delivery chain rather than a row of readings: air
    into the lung, oxygen onto the blood, blood out to the tissue, with heat and
    water moving the whole time. Every link has to hold, so one normal number clears
    one link and nothing else. The patients that frighten her are the ones with a
    single reassuring reading.
- id: chen
  name: Dr. Maya Chen
  role: Cell Biology Lead
  division: CELL
  quiz:
  - q: Why can one agent damage one tissue and leave another alone?
    a: Cells differ in the receptors and transport their membranes carry
    wrong:
    - Blood reaches some tissues a great deal faster than it reaches others
    - Larger cells absorb more of any substance
    - Damage depends only on the dose that arrives
  bio: |-
    Heads the cell bench in the second container lab, on the question of why this agent damages some tissues and leaves others comparatively spared.

    Her first suspect is the membrane. Two cells in the same patient can display very different receptors and transport proteins, so exposure to the same agent does not mean equal entry. Receptor expression is one part of tissue vulnerability, not the whole explanation, and she will not call it causal until changing the receptor changes entry.
- id: patel
  name: Dr. Ravi Patel
  role: Molecular Diagnostics Lead
  division: MOL
  quiz:
  - q: What does Patel mean by treating a molecular signal as a claim?
    a: It has to survive its controls, a second method and a known provenance before it means anything
    wrong:
    - Every result has to be published in some form before anybody may act on it
    - A signal is only valid if the same laboratory repeats it
    - Molecular methods are less reliable than culture
  bio: |-
    Runs the molecular laboratory, two containers behind the decon tunnel, and most
    of the numbers this response is arguing about came off his bench.

    He treats a signal as a claim rather than a result. Before it leaves the
    container it has to survive its own controls, be found again by a second method,
    and carry a provenance — which sample, taken by whom, kept how. He has watched
    one contaminated run set a city's policy for a fortnight.
- id: okafor
  name: Dr. Nia Okafor
  role: Immunology Lead
  division: IMM
  quiz:
  - q: Why does Okafor separate protective immune activity from damage?
    a: The treatment that helps one is the treatment that makes the other worse
    wrong:
    - Only the damaging kind of inflammation shows up in a blood sample
    - Protective responses always resolve without treatment
    - The distinction decides which ward a patient goes to
  bio: |-
    Leads the immunology group, and spends most of a day on one distinction: whether
    what is happening to a patient is the immune system working or the immune system
    doing the damage.

    It matters because the treatments point opposite ways. Suppress a protective
    response and the infection wins; leave a damaging one alone and the lung fills
    anyway. So the evidence she asks for is whatever would change that decision —
    the timing, the markers, what became of the patients treated each way.
- id: morales
  name: Dr. Sofia Morales
  role: Epidemiology Lead
  division: POP
  quiz:
  - q: What is Morales's comparison group actually for?
    a: Without it a change in the numbers cannot be told from a change in who was tested
    wrong:
    - It doubles the size of the sample and narrows the confidence interval
    - It is required before any result can be published
    - It identifies which hospital reported first
  bio: |-
    Owns the case numbers, which is harder than it sounds in an outbreak where testing sites and rules keep changing.

    Every figure she puts on a screen carries its denominator and comparison group, because a count on its own cannot separate more disease from more searching. If cases double while testing doubles, that alone does not prove transmission increased. She refuses to show a curve without showing how the curve was built.
- id: singh
  name: Dr. Arjun Singh
  role: One Health Lead
  division: FIELD
  quiz:
  - q: Why does Singh refuse to call an animal finding a transmission route?
    a: The animal may have caught it from people, so prevalence, timing, exposure, and comparison sites are needed to distinguish the stories
    wrong:
    - Animal samples cannot be sequenced to the same depth as human ones
    - Transmission routes can only be confirmed experimentally
    - Wildlife sampling is never representative
  bio: |-
    Works the ground outside the fence — the drains, the market, the animals people
    live beside — and reports into the same morning meeting as the ward teams.

    He will not call an animal finding a transmission route. An animal carrying the
    agent may well have picked it up from people instead. What separates the two
    stories is how common it is among the animals, how much contact people have with
    them, and which of the two appeared first. A positive swab is where the looking
    starts.
- id: nakamura
  name: Rin Nakamura
  role: Critical Care Physician
  division: CLIN
  bio: |-
    Runs the intensive care unit, where the outbreak stops being a case count and
    becomes four people whose oxygen is falling for reasons nobody has settled.

    She reads a patient as a set of coupled systems. A falling oxygen saturation
    can come from the lung, the blood that carries the oxygen or the circulation
    that moves it, and the treatment for each of those is different.

    Her limit is that the sickest patients are the least representative. What is
    happening in her unit is real and it is also the tail of the distribution.
  quiz:
  - q: Why does Nakamura warn against describing the disease from her unit alone?
    a: The sickest patients are the tail of the distribution, not a sample of it
    wrong:
    - Intensive care records are less accurate than ward records
    - Severe cases are treated before they can be measured
    - Her unit only admits patients with confirmed tests
- id: adeyemi
  name: Funke Adeyemi
  role: Cell Biologist
  division: CELL
  bio: |-
    Works out which cells the pathogen can enter and what it does once inside,
    because that constrains everything downstream — which tissues are damaged,
    which drugs could plausibly work, and which route of transmission is possible.

    She runs a negative control on every plate as a matter of habit. A culture
    that shows an effect without a control showing nothing is a result about the
    laboratory as much as about the pathogen.
  quiz:
  - q: Why does Adeyemi run a negative control on every plate?
    a: Without it, an effect of the laboratory looks like an effect of the pathogen
    wrong:
    - Controls make the cultures grow at a reproducible rate
    - A control is what converts a qualitative result into a quantitative one
    - Controls are required only when the sample is from a patient
- id: bergstrom
  name: Lena Bergström
  role: Genomic Epidemiologist
  division: MOL
  bio: |-
    Reads pathogen sequences for what they can and cannot say about transmission — whether cases are closely related, whether clusters may share a recent ancestor, and how lineages are changing over time.

    Genetic distance is her main tool and her main trap. Two sequences being close is evidence of recent common ancestry, not proof that one patient infected the other. Direction still needs timing, contact, and other epidemiological evidence.
  quiz:
  - q: What does Bergström say two nearly identical sequences establish?
    a: A recent common ancestor, which is not the same as one patient infecting the other
    wrong:
    - The direction of transmission between the two patients
    - That both patients were infected on the same day
    - That the pathogen is not mutating
- id: haddad
  name: Yusuf Haddad
  role: Clinical Immunologist
  division: IMM
  bio: |-
    Separates the damage a pathogen does from the damage the immune response does
    while clearing it, which sounds academic until a treatment has to be chosen.

    Suppressing inflammation helps a patient whose injury is immune-driven and
    harms one who is still fighting the infection. The same drug, the same dose,
    opposite outcomes, decided by where the patient is in their course.
  quiz:
  - q: Why can the same anti-inflammatory treatment help one patient and harm another?
    a: It depends whether the damage is immune-driven or the infection is still winning
    wrong:
    - Doses are calculated from body weight, so they vary between patients on the ward
    - Some patients absorb the drug and others do not
    - The drug expires quickly once a vial is opened
- id: oduya
  name: Grace Oduya
  role: Field Epidemiologist
  division: POP
  bio: |-
    Builds the case definition, which decides what counts as a case and therefore
    what every curve in the response is a curve of.

    A definition too narrow misses the spread and one too wide fills the count
    with other illnesses. She changes it when she has to and records the change,
    because a curve that bends on the day the definition moved is not evidence
    about the disease.
  quiz:
  - q: Why does Oduya document every change to the case definition?
    a: A bend on the day the definition changed is an artefact
    wrong:
    - Definitions must be approved by the hospitals before use
    - Changing a definition invalidates every laboratory result taken before it
    - The definition determines which treatment a patient receives
- id: castellanos
  name: Mateo Castellanos
  role: Wildlife Veterinarian
  division: FIELD
  bio: |-
    Samples the animals people live alongside, because many emerging human infections have animal origins and the wrong animal can be blamed very quickly.

    Detecting the agent in one animal shows that the agent was found there; it does not by itself make that species the reservoir. Establishing a reservoir needs evidence that the pathogen is maintained in a host population or environment, plus exposure and comparison data that separate a true source from spillback or a bystander.
  quiz:
  - q: Why is finding the pathogen in an animal not enough to declare a reservoir?
    a: The animal may be a bystander or spillback host; reservoir status requires evidence of maintenance and transmission, not one positive sample
    wrong:
    - Field samples are always contaminated by human handling
    - A reservoir must contain a higher viral load than any patient
    - The organism has to be found in more than one individual animal at the site

# Terms the game may explain in place.
glossary:
- name: Epidemiology
  aliases:
  - epidemiology
  - epidemiologist
  - epidemiological
  def: The study of how health events are spread through a population, and what makes them spread that way.
- name: Antibody
  aliases:
  - antibody
  - antibodies
  def: A protein the immune system makes that binds one specific target.
- name: Catalysis
  aliases:
  - catalysing
  - catalyzing
  - catalyse
  - catalyze
  def: Speeding a reaction by offering an easier path, without being used up. Enzymes are the biological version.
- name: Codon
  aliases:
  - codon
  - codons
  def: Three letters of genetic code that usually specify an amino acid, or sometimes a stop signal.
- name: Control
  aliases:
  - control
  def: A comparison designed to reveal whether a signal could arise without the proposed cause.
- name: Diffusion
  aliases:
  - diffusion
  - diffuses
  def: Net movement down a concentration gradient without direct cellular energy input. Small nonpolar molecules can often cross a lipid membrane this way; many other molecules cannot.
- name: Genomic sequencing
  aliases:
  - genomic
  - genome
  - genomes
  def: Reading an agent’s genetic sequence. It can show how closely pathogen samples are related, but sequence similarity alone does not prove who infected whom.
- name: Homeostasis
  aliases:
  - homeostasis
  def: The regulation that keeps internal conditions within workable ranges.
- name: Incidence
  aliases:
  - incidence
  def: New cases occurring in a defined population over a defined period. It can be expressed as a count, proportion, or rate depending on the question.
- name: Neutralising antibody
  aliases:
  - neutralizing
  - neutralising
  def: An antibody that blocks a critical step needed for infection, often by preventing attachment or entry into cells.
- name: Pathogen
  aliases:
  - pathogen
  - pathogens
  def: An infectious agent capable of causing disease — for example a virus, bacterium, fungus, or parasite.
- name: Prevalence
  aliases:
  - prevalence
  def: The proportion or number of people who have a condition at a specified time or during a specified period.
- name: Reagent
  aliases:
  - reagent
  - reagents
  def: A chemical added to make a test work, as opposed to the sample being tested.
- name: Reservoir
  aliases:
  - reservoir
  def: A host population or environment in which an infectious agent can persist.
- name: Ribosome
  aliases:
  - ribosome
  - ribosomes
  def: The machine in a cell that reads RNA and assembles the protein it specifies.
- name: RNA
  aliases:
  - RNA
  def: A nucleic acid with many jobs. Messenger RNA can carry instructions used to make protein, and many viruses use RNA as their genome.
- name: Saturation
  aliases:
  - saturation
  - saturated
  def: The point at which adding more changes nothing, because every place it could go is taken.
- name: Selection
  aliases:
  - selection
  def: A process in which variants differ in reproductive success, changing frequencies over generations.
- name: Sensitivity
  aliases:
  - sensitivity
  def: The fraction of true cases a test detects.
- name: Solute
  aliases:
  - solute
  - solutes
  def: The substance dissolved in a liquid, as opposed to the liquid doing the dissolving.
- name: Specificity
  aliases:
  - specificity
  def: The fraction of people without the condition that a test correctly identifies as negative.
- name: Vector
  aliases:
  - vector
  - vectors
  def: A living organism that transmits an infectious agent between hosts. In biological vectors the agent may develop or multiply inside the vector; mechanical vectors can simply carry it.

# The campaign: One working day each, 3 stops and a callback from day 3.
missions:
- title: The First Cluster
  objective: Decide whether Riverton has a real outbreak and establish one case definition every hospital can use.
  briefing: Marcus Webb has brought his father Elias to a third emergency room. Six other patients have arrived across Riverton with the same unusual syndrome in four days. Before the city escalates its response, you have to decide whether the cluster is real and make sure every hospital counts the same thing.
  stake: Day one. Seven patients, three hospitals, four days. If this is real, every hour without a common case rule hides where it is spreading; if it is not, Riverton could isolate patients and divert beds for the wrong reason.
  takeaway: A cluster becomes actionable only when it departs from a defensible baseline and every site counts cases by the same rule.
  segue: >-
    The cluster survives a second way of finding cases, so Riverton activates the
    outbreak response. But a real outbreak is not yet a diagnosis: pathology still
    cannot tell Elias Webb’s family what is attacking him.
  stops:
  - group: POP
    task: Is this a signal, and what on the desk decides it?
    title: Signal or noise?
    concept: 'Epidemiology: case definitions, curves, R and reservoirs'
    place: Emergency Department Network
    reason: Seven patients can trigger citywide isolation only if the cluster is real, so the baseline and the second way of finding cases have to agree first
    at: ops-board
    scene: Marcus Webb has carried his father into the third emergency room this week. He is sure that nobody believes him. Six other patients came in the same way — same four symptoms, three hospitals, four days. Dr. Sofia Morales, the epidemiology lead, has the printout that could prove they're right, or prove it's nothing. The press office is already asking what to say.
    guide: >-
      Six readings, and the quiet ones decide it here. A count is not a signal by
      itself. It only becomes one when something written down beforehand says what
      normal looks like. For each explanation, ask how many of the six readings it
      fits. Two of the seven cases turned up on manual chart review, outside the
      alert rule. If all seven had come through that one rule, the cluster might
      just be an artifact of the rule.
    background:
    - >-
      Why the normal readings are the ones that decide it. The reading that jumps
      out grabs your attention, but it usually fits more than one explanation. That
      is why it rarely settles anything by itself. The readings that actually tell
      explanations apart are the ones each one predicts should move. When a reading
      stays normal, that is real evidence — it counts against every explanation that
      would have moved it.
    - >-
      How to work through the candidates. Take one explanation at a time. Before you
      check the readings again, predict what it would do to them — which ones move,
      which way, and by about how much. Then compare your prediction to the real
      readings. Predicting first is what makes this a diagnosis instead of a
      rationalization, because the prediction comes before you look at the data, not
      after.
    - >-
      Why only one explanation should survive. Several explanations will fit part
      of
      the readings, on purpose. A partial fit is exactly what a confident wrong
      answer feels like from the inside. If two explanations are still standing, find
      the one reading where their predictions differ and let it decide. If no reading
      tells them apart, you have not finished reading the panel.
    takesAsRead:
    - Homeostasis and feedback
    assumes:
    - a rate is a count measured against a population and a length of time
    - surveillance only sees the patients who reached it
    - epidemiology is the study of how health events are distributed in populations and what factors shape them
    takeaway: A count becomes a signal only when something says what was expected instead.
    format: DIAGNOSIS
    question: Is this a signal, and what on the desk decides it?
    why: A count is not a signal by itself; it needs a baseline and a check on how the cases were found. Riverton usually logs about two cases a year that meet this narrow syndrome, so seven in four days is hundreds of times the short-term expectation. Two cases were also found by manual chart review, outside the new alert rule. That independent route makes a rule artifact much less likely.
    headline: Seven cases in four days, against a syndrome the city logs about twice a year.
    readings:
    - zone: Count
      label: Cases meeting the syndrome
      value: 7 in four days
      status: alarm
    - zone: Baseline
      label: Same syndrome
      value: about 2 a year
      status: key
    - zone: Reporting
      label: How the cases were found
      value: 5 by one alert rule
      status: key
    - zone: Denominator
      label: Catchment population
      value: supplied by all three hospitals
      status: normal
    - zone: Season
      label: Other respiratory syndromes this week
      value: flat
      status: normal
    - zone: Geography
      label: Shared address
      value: none found
      status: normal
    choices:
    - label: A real departure from the baseline
      mechanism: Seven in four days against two a year is far outside what the system usually does.
    - label: An artifact of the shared alert rule
      mechanism: Every case was found the same way
    - label: Ordinary autumn respiratory illness
      mechanism: This syndrome is common in autumn and the count is within normal seasonal movement.
    - label: Impossible to say — there is no denominator
      mechanism: Seven is a numerator
    answer: A real departure from the baseline
    rebuttals:
    - The alert rule is the right thing to worry about, and this panel rules it out. Five cases came through the rule, and two did not. The pattern survives being checked a second way.
    - Autumn respiratory illness would lift the other syndromes with it. The panel shows those flat, so whatever this is, it is not the season.
    - The denominator is right there on the desk. All three hospitals supplied their catchment — the number of people each one serves. That objection is the right instinct, and it has already been answered.
  - group: POP
    task: Order the build so each step can be checked before the next one depends on it.
    title: Build the provisional case definition
    concept: 'Epidemiology: case definitions, curves, R and reservoirs'
    place: Epidemiology Operations Room
    reason: She wants one case definition all three hospitals use before tomorrow's first counts diverge
    scene: By 6 a.m. three hospitals are counting patients like Elias Webb — each one using a different rulebook. Whichever definition wins decides how big this outbreak looks on paper, and how fast Riverton reacts. Dr. Sofia Morales wants one definition on every desk before the night shift leaves.
    guide: >-
      All four steps will happen, so ask what each one lets you check. A case
      definition — the rule that says who counts as a case — is a tool, and it is
      wrong in a known direction. Too narrow, and it misses real spread. Too wide,
      and it fills up with ordinary autumn illness. That is why it gets tested
      against known cases and against obvious non-cases. Those two tests catch
      opposite mistakes.
    background:
    - >-
      Why you get graded on the whole order, not part of it. Each step needs the
      step before it to be done first. Swap any two steps and the chain breaks.
      So there is no partial credit — a broken chain does not work halfway.
    - >-
      Start with the two ends. The first card has nothing before it, and the last
      card has nothing after it. That usually lets you place both from the scene
      alone. Once those two are set, far fewer orders are possible. The real
      thinking happens in the middle.
    - >-
      What decides the order. Time is the usual rule, but not the only one. An
      order can also run on cost, on risk, or on reversibility. Reversibility means
      every step that leaves the sample untouched comes before any step that uses
      it up. On those boards, looking for clock time finds nothing. None of the
      steps has to happen at a set hour.
    takesAsRead:
    - Populations, transmission chains and exponential growth
    - Rates, ratios and reading data
    assumes:
    - a curve is only meaningful if every hospital counted the same thing
    - a test can be wrong by missing cases or by counting the wrong ones
    takeaway: Operational definitions convert vague concern into reproducible observation.
    format: SEQUENCE
    why: A case definition — the rule for who counts as a case — is a tool, and like any tool it is wrong in a known direction. Too narrow, and real spread stays invisible. Too wide, and the count fills with ordinary autumn illness. That is why it gets tested twice before release. One test uses known cases, which catches a definition too narrow. The other uses obvious non-cases, which catches one too wide. Skip the testing, and nobody can trust the curve it produces.
    rebuttals:
    - Records come first. The shared features have to come from the patients, not from guessing. Writing down symptoms before reading the notes would just record what you expected to find.
    - Symptoms, timing and place come next. Those three are what a clinician at four in the morning can actually use fast. A definition too slow to apply is not a working definition at all.
    - Testing comes before the definition is issued, not after. Known cases catch a definition that is too narrow. Obvious non-cases catch one that is too wide. Skip this step, and the first curve cannot be read — and nobody will know which way it is wrong.
    - The revision date goes out with the definition. Without it, three hospitals keep counting to a rule everyone knows is temporary, but nobody is allowed to change.
    cards:
    - Specify observable symptoms, timing, and location.
    - Read the notes of the patients already admitted, and find the features they share.
    - Test the definition on known cases and obvious non-cases.
    - Attach a revision date and the known uncertainty to the definition every hospital uses.
    order: [1, 0, 2, 3]
  - group: POP
    task: Choose the one action that makes tomorrow’s hospital evidence comparable enough to combine.
    title: Make tomorrow’s counts comparable
    concept: Rates, ratios and reading data
    place: Clinical Data Office
    reason: Tomorrow three hospitals will report the same outbreak; if they use different case rules and fields, the city will not know whether their curves can be combined
    scene: By morning, three hospitals will send case counts to the same command room. One shared line list and case rule can be in place tonight. Wastewater, interviews, and public warnings may all matter later, but none of them can repair three incompatible hospital datasets after the fact.
    guide: >-
      One response slot you can start this afternoon, and four proposals. Open each
      one and ask what tomorrow's conclusions would look like with it, and without
      it. Hospital reports arrive before any second project can begin. So this
      choice decides what the team can reliably say tomorrow — not what it will
      eventually know.
    background:
    - >-
      Why the first purchase is different. It runs while nothing else does, so it
      sets the baseline that everything later gets compared against. A measurement
      started tomorrow can still be useful. But one that should have started today
      can leave a gap in the record, and nothing later fills that gap.
    - >-
      What 'reliably conclude' rules out. Data with no comparison to check it
      against cannot support a conclusion, no matter how big the number looks —
      cases with no denominator, positive tests with no idea who was tested. The
      four proposals differ mostly in this: some produce a real comparison, and
      some produce only a count.
    - >-
      Why the hospital reports change the math. They arrive no matter what you buy.
      So a proposal that just repeats what they will already contain has spent the
      slot on something you were getting for free anyway.
    assumes:
    - three hospitals can only be combined if they count cases the same way
    - an independent signal can be valuable without defining an individual case
    takeaway: The best first measurement is the one that makes later evidence comparable and decision-ready.
    format: VALUE
    question: Which first purchase changes what the response team can reliably conclude tomorrow?
    value:
      hint: You can start one project before tomorrow’s hospital reports arrive. Open each card to see what new conclusion it would make possible, then spend the slot.
      budget:
        amount: 1
        unit: response start
        label: Projects that can begin this afternoon
      decision: Choose the first action that makes tomorrow's citywide outbreak picture interpretable.
      options:
      - id: line_list
        label: Standardised line list across all three hospitals
        cost: 1
        axis: measurement standardization
        decisive: true
        reveals: Whether all three hospitals are counting the same observable case definition with dates and catchment denominators.
      - id: director_interviews
        label: Interview every hospital director
        cost: 1
        axis: expert opinion
        decisive: false
        reveals: Clinicians' impressions of how unusual the week feels, without a common denominator or case definition.
      - id: wastewater
        label: Start wastewater sampling in affected and comparison areas
        cost: 1
        axis: independent population surveillance
        decisive: false
        reveals: A community-level signal that does not depend on care seeking, but cannot define or identify clinical cases.
      - id: warning
        label: Issue a citywide warning now
        cost: 1
        axis: public communication
        decisive: false
        reveals: No new physical evidence; it commits public credibility before the transmission picture is established.
    answerText: Start the standardized line list. Tomorrow’s hospital counts can only turn into one curve you can actually read if all three hospitals use the same case definition, the same dates, and the same denominators. Wastewater testing is a valuable, separate signal — but it cannot fix mismatched hospital counting after the fact.
    why: Three hospitals are about to produce three separate curves, and those combine into one only if the same rule built all three. A standard line list keeps dates, symptoms and denominators in one comparable form. Wastewater testing adds a useful population-wide signal, but can't say who counts as a case. Director interviews have no denominator, and a warning adds no evidence at all. The first scarce action should make tomorrow's numbers comparable — the independent signals matter more once a clinical baseline exists to compare them against.
- title: What Kind of Agent?
  objective: Choose the broad agent classification that best fits all the evidence and the next test that could disprove it.
  briefing: Elias Webb is now on a ventilator. The microscope, culture-style observations, and molecular tests do not all point the same way, and one dramatic image could send the team after the wrong kind of pathogen. You need a broad classification that survives the controls before the overnight laboratory run begins.
  stake: Day two. The wards need to know what kind of threat they are dealing with before treatment and testing plans harden around a guess. Tonight you decide the leading classification and the next test that could prove it wrong.
  takeaway: A broad classification is strongest when several independent observations agree and the negative controls rule out tempting alternatives.
  segue: >-
    The evidence now points to a virus-like agent that depends on living host cells.
    The next puzzle is why the same agent reaches several tissues but only one kind
    of airway cell is being destroyed.
  stops:
  - group: CLIN
    task: Which explanation fits every reading, including the quiet negative controls?
    title: What kind of agent fits the whole panel?
    concept: 'Experimental design: controls, sampling and bias'
    place: Hospital Pathology Suite
    reason: Pathology has four results and still cannot put one name to what is making people sick
    at: pathology-bench
    scene: Elias Webb is on a ventilator, and nobody can tell his family what is attacking him. Pathology has four test results from the same samples, and still can't name the agent — the kind of germ causing the illness. Dr. Lena Ortiz, the clinical physiology lead, needs a safe, broad answer before the team commits to its overnight run.
    guide: >-
      Look at five readings. Three of them are negative — no cells, no bacterial
      marker, no fungal wall. For each guess, check how many of the five readings
      it
      fits. The signal only rises when live host cells are nearby. The extraction
      blank is a test run with nothing in it, meant to catch germs that snuck in by
      accident. It comes back clean. Notice what none of this can tell you: which
      exact virus, or which exact agent.
    background:
    - >-
      Why the quiet readings matter most. The reading that jumps out is not
      always the one that decides the case. It usually fits several guesses at
      once, so it rarely settles anything by itself. The readings that decide are
      the ones a guess predicts should move — and that stayed normal instead. A
      normal reading is real evidence. It counts against every guess that would
      have pushed it off normal.
    - >-
      How to test each guess. First, picture what each guess would do to the
      whole panel. Which readings would it push, which way, and by how much?
      Write that down before you look at the panel again. Then compare your
      guess to what actually happened. Doing it in that order is what makes it a
      real diagnosis, not just a story that fits after the fact. The prediction
      has to come before you look at the data — never after.
    - >-
      Why only one guess survives. Several guesses will explain part of the
      panel — that's on purpose, so a partial fit can feel just as convincing as
      the right answer. When two guesses are left, find the one reading where
      their predictions disagree. Let that reading decide. If no reading tells
      them apart, you haven't finished reading the panel yet.
    assumes:
    - cells and viruses differ in whether they can copy themselves alone
    - a negative control is a result, not an absence of one
    takeaway: Naming what you are dealing with takes more than one dramatic result. Weigh the cell evidence, the need for a host, the molecular result and the controls together, not one at a time.
    format: DIAGNOSIS
    why: 'The quiet negative results do most of the classification work. No intact cellular forms are seen, common bacterial and fungal markers are negative, and the signal rises only when living host cells are present. With a clean extraction blank, a virus-like agent is the leading broad classification. It is still provisional: the panel does not identify the exact virus or even whether its genome is RNA or DNA.'
    rebuttals:
    - A bacterium is a cell. It would leave cell evidence behind — a marker, a wall, something visible under the microscope. Three separate checks for that came back empty.
    - A fungus would show cell-wall material on the stain built to find it. That stain came back negative, and this stain rarely misses.
    - Contamination is the right suspicion whenever a signal comes from nowhere, and the extraction blank checks for exactly that. This blank is clean, so the signal came in with the samples themselves.
    headline: Pathology has several clues from the same positive specimens.
    readings:
    - zone: Microscope
      label: Microscope
      value: No intact cellular forms seen
      status: normal
      note: Several fields examined; image quality is good
    - zone: Host-cell dependence
      label: Host-cell dependence
      value: Signal rises only when living host cells are present
      status: alarm
      note: Acellular control shows no increase
    - zone: Bacterial marker
      label: Bacterial marker
      value: Not detected
      status: normal
      note: Control bacterial sample is detected normally
    - zone: Fungal cell-wall stain
      label: Fungal cell-wall stain
      value: Negative
      status: normal
      note: Positive stain control is normal
    - zone: Extraction blank
      label: Extraction blank
      value: Negative
      status: normal
      note: No target signal in the blank
    choices:
    - label: A virus-like agent
      mechanism: Not a cell of its own, and it can only copy itself inside a living host cell.
    - label: A bacterium of some kind
      mechanism: A cellular organism, which would leave bacterial markers and structures behind.
    - label: A fungus of some kind
      mechanism: A cellular organism with a cell wall the stain is built to find.
    - label: Laboratory contamination
      mechanism: Target material loose in the workflow rather than anything in the patients.
    answer: A virus-like agent
  - group: POP
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly placed cards after each check.
    title: Build the classification from checks, not one image
    concept: Biosafety, aseptic technique and contamination
    place: Microscopy Core
    reason: The sample is limited, and each conclusion should be supported before the team spends material on the next, more specific question
    scene: Pathology has one limited set of patient material and several ways to interrogate it. The most dramatic image is also the easiest result to overread. Put the evidence steps in an order that starts with controls, then asks what kind of biological structure is actually present, and only then assigns a broad classification.
    guide: >-
      All four steps will be done, so ask what each one needs to already be true.
      Two of these steps use up what they measure. Measure a structure in a dirty
      sample, and all you have measured is the dirt, just magnified. And asking
      whether something copies itself on its own only makes sense once you know
      whether it is a cell at all.
    background:
    - >-
      Why you get graded on the whole order, not part of it. Each step needs the
      step before it to be done first. Swap any two steps and the chain breaks.
      So there is no partial credit — a broken chain does not work halfway.
    - >-
      Start with the two ends. The first card has nothing before it, and the last
      card has nothing after it. That usually lets you place both from the scene
      alone. Once those two are set, far fewer orders are possible. The real
      thinking happens in the middle.
    - >-
      What decides the order. Time is the usual rule, but not the only one. An
      order can also run on cost, on risk, or on reversibility. Reversibility means
      every step that leaves the sample untouched comes before any step that uses
      it up. On those boards, looking for clock time finds nothing. None of the
      steps has to happen at a set hour.
    takeaway: A good classification is an evidence synthesis, not a label generated by one instrument.
    format: SEQUENCE
    rebuttals:
    - Controls come first, because everything after them is a claim about the patient, not about the tube.
    - Structure comes before behavior. Whether something needs a host cell is a question about a living thing, and you do not have a living thing to ask about until you know it is one.
    - The replication question comes third because it is the slowest test and the most specific one. It is only worth running on a candidate that survived the first two steps.
    - Integration comes last. A provisional classification is what the other three steps produce together — it is not a step you can take on its own.
    assumes:
    - a measurement of a contaminated preparation measures the contamination
    cards:
    - Compare patient material with negative and healthy controls.
    - Characterize its size, its cell structures, and its nucleic-acid signature — the pattern in its DNA, the molecule an agent carries its instructions in, or in its RNA.
    - Ask whether it can reproduce on its own, or whether it needs a host cell to do it.
    - Combine the separate observations into a provisional classification.
    order: [0, 1, 2, 3]
    why: Each step only makes sense once the one before it holds true. Checking against controls first separates the real germ from the sample it arrived in. Measure a structure in a dirty sample, and all you've measured is the dirt, magnified. Size and structure then say whether this is a cell at all. Only once that's known does asking whether it copies itself on its own mean anything.
  - group: MOL
    task: A reporter enzyme works after 37 °C pre-incubation and loses most activity after 55 °C. What is the strongest interpretation?
    title: When heat changes an enzyme assay
    concept: Enzymes and metabolism
    place: Molecular Diagnostics Bench
    reason: Tonight's test result only means something if the assay itself is proven to still work
    scene: A citywide test rides on one small enzyme doing its job at the right temperature. A reporter enzyme — a protein catalyst that gives off a signal you can measure — works fine warmed to 37°C first. Warmed to 55°C first, it barely works. The chemicals and the way the signal is read stay the same.
    guide: >-
      Four choices, and only one thing was different between the two runs. Check
      each choice: does it name something that really changed? The chemicals, the
      buffer — the liquid that holds the acidity steady — and how the signal was read
      all stayed the same. The patient's sample was never heated, and neither was
      its target DNA — the molecule the test copies. So the answer must be about the
      one thing
      that was heated — and the two temperatures pull it in opposite directions.
    background:
    - >-
      Why the wrong choices matter. Each wrong choice looks right under one kind
      of mistake. Maybe a step gets skipped. Maybe an amount gets mixed up with a
      rate. Maybe a pattern gets mistaken for a cause. Finding which mistake each
      wrong choice matches is where the real learning happens. Picking the right
      answer on instinct, without knowing why the others fail, teaches nothing.
    - >-
      Why the shape of a choice tells you nothing. A correct choice often has extra
      detail — an exact unit, or a clause that qualifies it. In many games here, the
      correct choice used to be the longest one far more often than chance allows.
      That was true in 88 percent of passage quizzes, before it was fixed. Now each
      game is checked with a statistical test, so length, hedging, and detail no
      longer give the answer away.
    - >-
      What the verdict adds. Every wrong choice gets its own rebuttal, and the
      verdict shows all of them. Each rebuttal explains why that choice fails — it
      does not just repeat the right answer. Read the rebuttals even when you got
      the answer right. A right answer for a shaky reason looks the same as a right
      answer for a solid reason, until a question tests the shaky part.
    takesAsRead:
    - Cell structure and function
    assumes:
    - a protein's function depends on it keeping its shape
    - a buffer is a chemical system that resists large pH changes when acid or base is added
    - DNA is the molecule an organism carries its instructions in
    takeaway: A controlled comparison shows exactly which part of a test reacts when conditions change.
    format: CHOICE
    question: What does comparing the two temperatures show about the enzyme?
    why: The two runs differ in the enzyme’s pre-incubation temperature. The sharp activity loss after 55 °C is therefore evidence that the higher temperature disrupted or destabilized the enzyme’s active structure. The comparison does not show that the target genetic material was destroyed, and it does not by itself tell whether the structural change would reverse after cooling.
    choices:
    - The higher temperature disrupted or destabilized the enzyme’s active structure, reducing its activity.
    - The higher temperature sped the reaction up, so the enzyme worked faster.
    - The patient's sample broke down at 55°C, so there was less left to detect.
    - The target DNA was destroyed at 55°C, so there was nothing left to copy.
    answer: The higher temperature disrupted or destabilized the enzyme’s active structure, reducing its activity.
    rebuttals:
    - A reaction's rate rises with heat only while the enzyme still works. Once heat breaks the enzyme's shape, that rise stops.
    - The only thing that changed here was the reporter enzyme's temperature, not the patient's sample.
    - This test only measures enzyme activity. It cannot show that the target DNA was destroyed.
- title: Why the Lungs?
  objective: Explain why particular airway cells are vulnerable and test whether receptor binding is actually required for entry.
  briefing: Elias’s lungs are failing while other organs remain comparatively spared. In culture, the agent reaches several cell types but enters only some of them. If the team mistakes simple exposure for a receptor-dependent entry step, the first targeted therapy will aim at the wrong door.
  stake: Day four. A treatment meeting starts this afternoon. You have to identify the cell-entry step that explains the tissue pattern, prove that changing that step changes entry, and do it before patients like Elias receive a targeted therapy.
  takeaway: Tissue vulnerability can begin at the membrane, but receptor expression becomes a causal explanation only when manipulating it changes entry.
  segue: >-
    Blocking the receptor sharply reduces entry and washout restores it. That settles
    the first door. Inside the infected cells, however, a human protein is now appearing
    at roughly forty times its normal amount, and nobody knows which step in gene
    expression changed.
  stops:
  - group: CELL
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly placed cards after each check.
    title: What has to happen before the virus gets inside?
    concept: Membranes and transport
    place: Cell Culture Wing
    reason: The culture bench has the four steps a pathogen takes into a cell, and nobody has ordered them yet
    at: culture-wing-bench
    scene: Elias Webb's lungs are failing while his kidneys work fine, and nobody can say why one organ falls and another survives. Only some cell types in the respiratory tissue are affected. The culture wing has four cards showing what happens when something crosses into a cell, and nobody has put them in order yet. The therapy meeting is at four.
    guide: >-
      These four are one physical chain, so ask what has to happen before each can.
      Nothing enters until something on the surface is recognised, and a cell
      without the right protein cannot be infected however much material arrives.
      That is why only some cell types are affected. Everything the cell then does
      wrongly is downstream of a barrier already crossed.
    background:
    - >-
      Why the order is graded whole. A sequence claims one step depends on the
      step before it. Each step happens because the step before it already
      happened, or had to happen first. Moving just one pair out of place breaks
      that claim, no matter where it sits. So partial credit would be credit for
      an order that does not actually work.
    - >-
      Why the ends are the place to start. The first and last cards have nothing
      before or after them. That usually makes them the two you can settle just
      from the scene. Once those two are pinned down, the rest of the order
      narrows fast. What is left in the middle is where the real judgment happens.
    - >-
      What the rail can be ordered on. Time is the usual axis, but it is not the
      only one. An order can also run on cost, on risk, or on reversibility. A
      reversible step is one that leaves the sample as it was. That kind of step
      can be ordered before a step that uses the sample up. On boards like that, a
      timeline finds nothing. None of the steps has to happen at a particular hour.
    takeaway: A cell membrane acts like a gatekeeper — the proteins on it decide which cells can be entered.
    format: SEQUENCE
    rebuttals:
    - 'Binding first: it is the step that decides which cells are even candidates, which is what makes some cell types vulnerable and others not.'
    - The membrane bends because something bound to it. Fusion is a consequence of recognition, not a step that happens on its own.
    - Material crosses only after the membrane has rearranged — that is what the rearrangement is for.
    - The hijacked machinery is last because it is an effect. A cell whose machinery is redirected has already been entered.
    takesAsRead:
    - Cell structure and function
    assumes:
    - a cell membrane is a selective barrier, not a wall
    cards:
    - A surface molecule binds a compatible receptor.
    - The membrane bends or a fusion process begins.
    - The biological material enters the cell or an intracellular compartment.
    - Cellular machinery is redirected after entry.
    order: [0, 1, 2, 3]
    why: For this agent, the evidence points to a receptor-dependent entry route. Surface recognition comes first; then membrane fusion or wrapping can begin; then viral material crosses into the cell or an intracellular compartment. The downstream takeover happens only after entry. That order is specific to the entry model being tested here, not a rule that every pathogen uses the same route.
  - group: CELL
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used once.
    title: How did each thing cross the membrane?
    concept: Membranes and transport
    place: Membrane Biology Lab
    reason: The entry model only helps treatment if each observed crossing is identified from direction, protein dependence, size, and energy use rather than from the molecule’s name
    scene: Get this wrong and the therapy meeting builds a treatment for the wrong cells. Four observations from the culture bench each describe something moving across a membrane. The cell biologist wants each one named by its mechanism before the entry model goes further, without guessing from the molecule names.
    guide: >-
      Four observations, four mechanisms — the different ways a molecule can cross
      a membrane. The molecule's own name will not tell you which one to pick. Sort
      each observation using three tests instead. Which way does it move, downhill
      or uphill? Does a protein carry it, or does it cross the fatty membrane layer
      on its own? And is it too big to fit through any channel? Wherever ATP gets
      used up, treat that as a clue, not as the answer by itself. Check it against
      the three tests above.
    background:
    - >-
      Why this is a matching board, not four separate questions. Each response on
      a board like this is written to sound plausible for more than one
      situation. Choosing them one at a time lets a nearly-right answer slip
      through unexamined. Having to place every response forces a real
      comparison. The question is not is this reasonable here, but is it more
      right here than there.
    - >-
      How to use the one-each rule. The four responses are a set to be handed
      out, not a list to sample from. Because of that, every match you make
      narrows down the rest. Settling the two you are confident of can leave the
      remaining pair decided by elimination. Where it does not, two responses are
      still competing for one situation. That is exactly the distinction this stop
      is testing.
    - >-
      Why you cannot be wrong about exactly one. With every response used once,
      three correct joins leave the fourth with only one place to go. Any error
      therefore involves at least two joins. That is worth remembering when the
      last pair looks forced. The fault is usually not in the join you are
      struggling with. It is in one you made earlier and stopped questioning.
    takesAsRead:
    - Cell structure and function
    assumes:
    - a concentration gradient has a direction
    - ATP is the cell's energy currency
    takeaway: You can tell how something crosses a membrane by testing it against the rules, not by knowing the molecule's name.
    format: PROTOCOL
    why: "Three constraints tell these apart, and none is the molecule's name. Direction: downhill needs no energy, uphill does, and ATP use is the receipt. Whether a protein is involved: a small nonpolar molecule crosses the lipid directly, but an ion cannot and needs a pore. Size: a bound particle too large for any channel gets taken in by the membrane wrapping around it."
    columns:
    - What the molecule does
    - Which mechanism that is
    rebuttals:
    - Downhill and needing no protein is simple diffusion — the molecule is small and nonpolar enough to cross the lipid itself.
    - Downhill but through a selective pore is facilitated diffusion. Still no energy spent; the protein supplies the selectivity, not the push.
    - Uphill with ATP consumed is active transport, and the energy cost is the thing that identifies it.
    - A large bound particle enclosed by the membrane is endocytosis — a different process from anything crossing the bilayer.
    scenarios:
    - A small nonpolar molecule moves down its concentration gradient.
    - An ion moves down its gradient through a selective protein pore.
    - A solute moves uphill while ATP is consumed.
    - A large bound particle is enclosed by the membrane.
    choices:
    - Simple diffusion.
    - Facilitated diffusion through a channel.
    - Active transport.
    - Endocytosis.
    mapping: [0, 1, 2, 3]
  - group: CELL
    task: Change one condition at a time, reverse the strongest effect, and decide whether the surface-receptor step is causally required for entry.
    title: Separate binding from entry
    concept: Protein structure and function
    place: Structural Biology Room
    reason: The binding rig is the only way to prove entry needs the receptor and not just proximity
    at: binding-rig
    scene: A treatment aimed at the wrong step could do nothing, or do harm. Dr. Maya Chen, the cell biology lead, is running a simulated test that counts how many labelled particles get inside vulnerable airway cells. Three changes are ready to try, and the therapy meeting needs evidence about the first physical step.
    guide: >-
      The number you are watching is the entry signal — how much labelled particle
      ends up inside the cells. Three things can be changed. Only one of them acts
      on the step the meeting is asking about. A change only counts as real if it
      is
      bigger than the normal noise between test wells. Change one thing, run the
      test, put it back, and name the change the entry signal follows.
    background:
    - >-
      What the test measures, and what it does not. The label reports particles
      that have already gotten inside the cell. It does not count particles that
      are just stuck to the outside. That difference is the whole point of the
      experiment. Binding to the surface and entering the cell are two separate
      steps. A therapy that blocks one step may do nothing about the other.
    - >-
      Why a matched control antibody is on the list. It is there to be changed and
      produce nothing. This second antibody is the same type, but it does not
      target the receptor. Handling any antibody involves the same buffer, the
      same incubation, the same washing steps. The matched antibody controls for
      all of that handling. So a response to the real blocker means something
      only if this matched one gives no response at all.
    - >-
      Why the dose is in the list too. Give more particles and more get in. That
      moves the number without saying anything about the mechanism. It is a
      confound — a change that moves the number for a reason that has nothing to
      do with the step being tested.
    takesAsRead:
    - Transcription, translation and gene expression
    assumes:
    - a causal test changes one factor while holding the others fixed
    - a reversible effect is stronger evidence than a one-way coincidence
    takeaway: Evidence for a cause is strongest when changing it moves the result, and undoing the change brings the result back.

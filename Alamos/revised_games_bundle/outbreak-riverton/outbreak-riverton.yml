    answerText: The estimate is about pH 7.28. Low bicarbonate drives the acidemia, while the lower PaCO₂ partly compensates. The numbers are consistent with a metabolic acidosis with respiratory compensation; they do not identify the cause. The pending lactate and the rest of the oxygen-delivery evidence are still needed.

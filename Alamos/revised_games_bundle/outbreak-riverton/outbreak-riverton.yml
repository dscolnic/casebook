    answer: Apply the safety review set in advance, and resume or expand only if it allows it.
    rebuttals:
    - A benefit signal does not erase the safety question. Stopping just because it looks like it's working would freeze both the uncertainty and the unresolved side-effect question.
    - Data on how the drug works can be useful, but it does not replace an independent review of serious side effects.
    - The uneven side effects deserve review. But raw counts, without the planned safety boundary, clear event definitions, exposure time, and independent review, are not by themselves a reason to stop.
- title: How Close to the Edge?
  objective: Build a simple capacity bound and set an action trigger early enough for staffing and transfers to arrive before the ICU loses its buffer.
  briefing: Ninety of 120 staffed critical-care beds are occupied, and about eight severe patients are arriving each day. Discharges are too uncertain to use for a confident forecast. The council needs a policy that can act before the model is perfect, not after the last bed is gone.
  stake: Day 121. Wait for certainty and the staffing response arrives after the beds are needed. Today you calculate a worst-case bound, expose the missing assumptions, and choose a trigger with enough lead time to matter.
  takeaway: A simple model can be useful when its assumptions stay visible and its trigger is tied to a reversible action with real lead time.
  segue: >-
    The trigger fires while there is still time to add staff and coordinate transfers.
    The emergency phase finally begins to recede. One job remains: decide what Riverton
    is allowed to say it knows, what it must still call uncertain, and what system
    it keeps after the crisis money ends.
  stops:
  - group: POP
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly placed cards after each check.
    title: What must the model decide?
    concept: Epidemic modelling and projection
    place: Population Modeling Group
    reason: The modelling board has nine days of case data, and the council wants one policy from it by Friday
    at: ops-board
    scene: One policy, one city, and three districts already telling three different stories about where this is headed. The council wants it by Friday. The modelling team has nine days of case data and a dozen parameters it can only bound.
    guide: >-
      All four steps will be done, so ask what each one makes possible. A model is
      a
      structured argument, and its assumptions are just as much a part of the output
      as its numbers. Built without a decision in mind, it answers whichever
      question was easiest to model. And a scenario that is not tied to something
      you can observe is a scenario nobody will ever act on.
    background:
    - >-
      Why you get graded on the whole order, not part of it. Each step needs the
      step before it to be done first. Swap any two steps and the chain breaks.
      So there is no partial credit — a broken chain does not work halfway.
    - >-
      Start with the two ends. The first card has nothing before it, and the last
      card has nothing after it. That usually lets you place both from the scene
      alone. Once those two are set, far fewer orders are possible. The real
      thinking happens in the middle.
    - >-
      What decides the order. Time is the usual rule, but not the only one. An
      order can also run on cost, on risk, or on reversibility. Reversibility means
      every step that leaves the sample untouched comes before any step that uses
      it up. On those boards, looking for clock time finds nothing. None of the
      steps has to happen at a set hour.
    takeaway: Models are structured arguments whose assumptions should remain visible.
    format: SEQUENCE
    rebuttals:
    - The decision, the time horizon and the outcomes come first. Otherwise the model just answers whichever question was easiest.
    - Structure and inputs come second, and they need to stay open to inspection, because a structure nobody can check cannot be argued with.
    - Scenarios and sensitivity tests come third. The point is the spread across plausible futures, not just the middle one.
    - Triggers come last, tying a scenario to something you can actually observe. Without them, the model produces a graph and no decision.
    assumes:
    - a model's output is only as good as the assumptions it was given
    cards:
    - State the decision, time horizon, and outcomes that matter.
    - Choose a model structure you can check, and estimate its inputs from real data.
    - Run several plausible scenarios and test how sensitive they are.
    - Link observable triggers to policy changes everyone agreed on in advance.
    order: [0, 1, 2, 3]
    why: A model is a structured argument, not a crystal ball, and its assumptions are just as much a part of the output as its numbers. Stating the decision first stops it from modeling something nobody asked about — a model built without a decision in mind just answers whatever question was easiest. The structure and inputs come next, then a range of plausible futures instead of just one. Finally come the triggers, because a scenario not tied to something observable is one nobody will ever act on.

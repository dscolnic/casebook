warmups:
  trial-near:
    title: Walk Upper Town before you placard anything
    why: 'Three days after, and you have not been here before. Okonkwo, the structural engineer, takes every assessor round the near
      ground once on foot: the office, the structural bench, the materials lab. Nothing is placarded from a map, and the plan card names
      streets that mean nothing until you have stood in them and seen which way the ground falls.'
  greet:
    title: Two agencies, one office, and nobody has been introduced
    why: The office is half council and half seconded engineers who arrived on Saturday, and by Friday somebody will have to take a
      decision on somebody else's assessment. Get round the building and put a name to as many of them as you can now, because a signature
      you cannot attach to a face is a signature you will end up double-checking.
  trial-far:
    title: The Flats open today, and the vehicles come out with them
    why: 'Everything across the scarp has been walkable all week and nothing out there has been called. That changes today: the fill,
      the wharf and Ferry Street go on the list, and they are far enough out that the van is signed out to reach them. Drive the route
      once before the calls start sending you down it.'
  follow:
    title: Mbeki walks the liquefaction line once
    why: The boundary between the granite bench and the fill is not on any map at the accuracy anybody needs, and Mbeki, the geotechnical
      field technician, can see it in the ground. She walks it once, this morning, stopping where the surface changes. Stay with her
      — far enough back to see what she is pointing at, close enough not to lose which way she turned at the ejecta.
  hunt:
    title: Six props went out and the log has four
    item:
      name: prop
      plural: props
    why: Every temporary prop on the Parade has to be accounted for before the cordon can be reduced, because a prop that nobody can
      find is either holding something up or lying in a street where a lorry will hit it. Four are where the log says. Find the rest.
  canvass:
    title: Who actually spent the night in their own bed
    why: The occupancy figures the office is working from came from Saturday, and they decide which buildings get assessed first. Ask
      along the affected streets until enough answers have come back to say whether people went to the hall as instructed or came home
      once the shaking stopped.
  evade:
    title: The developer who wants a green placard in the street
    why: A developer has been in the office car park since eight wanting a verbal assurance about Marina Court, and Cardoso, the network
      technician, has said plainly that nothing is agreed anywhere but on the form. Keep clear of him and get your round done. A placard
      agreed in a car park is a placard nobody signed.
  tag:
    title: Catch Ives before the hospital handover
    why: Ives, the hospital facilities manager, has the only copy of the ward occupancy plan with the yellow-placard rooms marked on
      it, and he is walking back to the hospital for the ten o'clock handover. After that he is on a ward round for four hours, and
      the afternoon's decision about the ground floor rests on a drawing that currently exists once.
copy:
  SEIS: <p>The vault, cut into the bench above town. Concrete, a locked hatch, and the instrument every comparison this fortnight has
    been made against.</p>
  STRUCT: <p>Assessment. Forms on every surface, a plan of the town with 400 coloured dots on it, and a queue outside that starts before
    the door opens.</p>
  GEO: <p>Geotechnical. Boxes of core, a hand auger against the wall, and an 1892 survey showing where the creek used to run.</p>
  MAT: <p>The testing laboratory. A press, a saw, and a chain of custody that means the number belongs to a particular column in a particular
    building.</p>
  HAZ: <p>The incident base, on the boundary between the two halves of town. The aftershock sequence is taped to the wall and updated
    by hand, because people believe a curve they watched being drawn.</p>
  SAFE: <p>Public safety. Cordon tape, printed notices, and the list of who is sleeping where.</p>
  HOSP: <p>Kestrel Bay Hospital. 90 patients on the ground floor, 2 upper floors closed, and a yellow placard nobody has been able to
    resolve.</p>
  SCHOOL: <p>Bay Road School. Green placard, undamaged classrooms, and a gymnasium whose wall panels are held on by anchors that tested
    below demand.</p>
  PARADE: <p>The Parade. 1890s shopfronts with their parapets in the street and timber shores holding the façades in.</p>
  DEPOT: <p>The port gate. The quay moved two metres seaward and the cranes have not turned since.</p>
lessons:
- group: SEIS
  title: The same event, recorded twice — Review
  task: Pair four instruments with what each one recorded
  concept: Intensity against magnitude — one event, many shakings
  place: Seismic Network
  scene: Inês Cardoso, the network technician, has four records of one aftershock from four instruments around the bay. Same event,
    same minute. The traces disagree about how tall they are and about how long the shaking went on.
  guide: 'Four instruments, one event, four records that disagree. Two of the sites are the same short distance from the source and
    two are ten times further out. Pair them by asking two things of each site in turn: how far has the wave travelled, and what is
    it travelling through at the end of the journey. Distance takes amplitude away across the whole band at once. Ground gives some
    of it back in a band of its own. One of these sites is far away and still not quiet.'
  background:
  - Why this is a matching board and not four separate questions. Responses on boards like this are written to be plausible for more
    than one situation, so choosing them one at a time lets a nearly-right answer through unexamined. Having to place all of them forces
    the comparison — not "is this reasonable here", but "is it more right here than there".
  - How to use the one-each rule. Because the responses are a set to be distributed rather than a list to be sampled, every join you
    make constrains the rest. Settling the two you are confident of can leave the remaining pair decided by elimination. Where it does
    not, two responses are still competing for one situation, and that is exactly the distinction the stop is testing.
  - 'Why you cannot be wrong about exactly one. With every response used once, three correct joins leave the fourth with only one place
    to go. Any error therefore involves at least two joins. That is worth remembering when the last pair looks forced: the fault is
    usually not in the join you are struggling with, but in one you made early and stopped questioning.'
  assumes:
  - an instrument records the shaking where it stands
  - distance costs a wave amplitude on the way
  takeaway: There is one number for the earthquake and one record for every place, and what the last few tens of metres of ground are
    made of decides the difference between them.
  format: PROTOCOL
  question: Pair four instruments with what each one recorded
  columns:
  - Where the instrument stands
  - What its record of the same event shows
  scenarios:
  - The vault on the granite bench, 4 kilometres from the source.
  - A field station on the reclaimed port, the same 4 kilometres out.
  - A station on the granite bench 40 kilometres away.
  - A station on deep soft basin sediment 40 kilometres away.
  choices:
  - The quietest and shortest of the four, and the reference the others are quoted against.
  - Several times that amplitude and half a minute longer, from the same distance.
  - Quieter again than the reference, because the wave has spread out on the way.
  - Weak in the short periods for its distance, and surprisingly strong in the long ones.
  mapping:
  - 0
  - 1
  - 2
  - 3
  rebuttals:
  - Competent rock close in is the quietest trace anybody has, which is why the district plan quotes everything against it.
  - Same source, same distance, so the only thing left to explain a factor of several is the ground.
  - Spreading and attenuation cost a wave amplitude at every period, whatever it arrives on.
  - Deep soft sediment hands back at long period some of what the journey took out of the short one.
  why: Magnitude belongs to the source and there is one of it. What an instrument writes down is the shaking where it stands, which
    is the source motion after spreading, after attenuation, and after whatever the last few tens of metres of ground did to it. Distance
    removes amplitude across the whole band. Soft ground puts some of it back in a narrow band of periods and stretches the shaking
    out. So a far station on deep sediment can beat a near station on rock at long period, and both records are honest.
- group: SEIS
  title: How far away it started — Review
  task: Time a second event and turn the gap into a distance
  concept: P and S waves, and what the gap between them measures
  place: Seismic Network
  scene: Inês Cardoso, the network technician, is timing an aftershock rather than the mainshock. On the Bay Road field station the
    P arrival is at 21:47:06 and the S arrival at 21:47:14. She wants a distance before she calls the vault.
  guide: Five numbers again, and the same two questions to ask of each. Does it belong to this station's record or to the earthquake
    itself, and is it half of a pair with a gap in it. The magnitude and the depth are both true about this aftershock and neither one
    is a distance. Read the seconds off the two arrivals, take the difference, and turn it into kilometres with the constant. Then ask
    what the answer is a radius around.
  background:
  - Why an estimate rather than a calculation. Every quantity on this board is already measured or stated, so nothing here has to be
    derived. What is being tested is whether you can pick the quantities the relationship actually needs, and whether the size of the
    answer looks right once they are in place.
  - Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label is how
    a unit mismatch, or a quantity belonging to a different part of the problem, is caught before it is placed — which is the habit
    this format exists to build.
  assumes:
  - P waves travel faster than S waves through the same rock
  takeaway: The gap between the arrivals is a distance and nothing else, and a distance from one station is a circle rather than a place.
  format: BALLPARK
  question: Estimate the distance from this station to the aftershock.
  answerText: About 64 km.
  why: 'Both waves leave the source together and the P wave travels faster, so the gap between the two arrivals grows with distance.
    Eight seconds at about eight kilometres of source distance for each second gives roughly 64 kilometres. Neither the magnitude nor
    the depth is read off this measurement: magnitude comes from the amplitude of the record and depth from how the arrivals vary across
    the network. One station gives a radius, so the aftershock is somewhere on a circle until two more stations cut that circle down
    to a place.'
  estimate:
    prompt: The P wave arrived at 21:47:06 and the S wave at 21:47:14. Use 8 km for each second of separation.
    question: Choose the two arrival times and the constant.
    labels:
    - 14 s  (S arrival, seconds past the minute)
    - 6 s  (P arrival, seconds past the minute)
    - 8 km/s  (distance per second of separation)
    - 4.1  (the aftershock's magnitude)
    - 9 km  (depth of the source)
    values:
    - 14
    - 6
    - 8
    - 4.1
    - 9
    slots: 3
    template: ({0} − {1}) × {2}
    formula: (a-b)*c
    correct:
    - 0
    - 1
    - 2
    target: 64
    tolerance: 8
    units: km
    solution: d = (14 − 6) × 8 = 64 km.
    explanation: About 64 kilometres, which is well inside the sequence and nowhere near the mainshock's 104. The magnitude and the
      depth are real numbers about this aftershock and neither of them is a distance.
    givens:
    - The S minus P interval is 8 seconds
    - Distance is about 8 km for each second of that gap
    relationship: Distance = the S-minus-P interval × 8 km per second, because the 2 waves left together and travel at different speeds.
- group: GEO
  title: Ground that people put there — Review
  task: Say why one street on the fill stayed dry
  concept: 'Liquefaction: when saturated fill stops behaving as a solid'
  place: Geotechnical
  scene: Thandi Mbeki, the geotechnical field technician, has photographed two streets 300 metres apart on the same fill. Ellis Street
    is grey with sand fans, kerb to kerb. Tarrant Street, on the same reclaimed ground and the same shaking, has none.
  guide: 'Both streets sit on the same hydraulic fill at the same distance from the source, and the two nearest instruments agree on
    what the shaking was, so the shaking is not the variable. Navarro''s boreholes find the same loose sand at two to five metres under
    each of them. The one number the two logs disagree on is the depth of the water table: 1.5 metres under Ellis Street and 7 metres
    under Tarrant Street. Three conditions have to arrive together. Ask which option names the one Tarrant Street is missing.'
  background:
  - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading — a step
    skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each belongs to is where
    the learning is; the right answer alone can be reached on instinct and teach nothing.
  - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole game
    the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before it was fixed. It
    is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken out of them deliberately.
  - 'What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option fails,
    not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made for an approximate
    reason is indistinguishable from a sound one until the day the approximation is what is being tested.'
  assumes:
  - ground can be loose without being wet
  takeaway: Susceptible soil, saturation and strong enough shaking are three separate conditions, and a street that fails any one of
    them stays where it is.
  format: CHOICE
  question: Why did one street liquefy and the neighbouring one not?
  choices:
  - The shaking in Tarrant Street was too weak to pack the sand, whatever the ground is made of.
  - The loose layer under Tarrant Street sits above the water table, so it was never saturated.
  - The fill under Tarrant Street is older, and 80 years of consolidation has made it dense.
  - Tarrant Street has no free face nearby, and liquefaction only happens where ground can spread sideways.
  answer: The loose layer under Tarrant Street sits above the water table, so it was never saturated.
  rebuttals:
  - The two nearest instruments agree, and 300 metres cannot halve the shaking at this distance.
  - Both streets were pumped in from the same dredger over the same four summers, so age is not the difference.
  - Lateral spreading wants a free face; the pore pressure that liquefies a layer does not.
  why: 'Liquefaction wants three things together: a soil loose enough to want to pack down, enough water in the gaps that it cannot
    pack down without raising the pore pressure, and shaking strong enough and long enough to drive it. It is the rising pore-water
    pressure that takes the grain contacts apart and leaves the layer with almost no shear strength to offer. Under Tarrant Street the
    loose layer sits above the water table, so there is no pore pressure there to raise. Same fill, same shaking, dry street.'
- group: SAFE
  title: A notice somebody acts on — Review
  task: Order what the seven o'clock slot says about an aftershock
  concept: Magnitude as a logarithmic scale
  place: Public Safety
  scene: A magnitude 5.1 aftershock woke the town at ten past four. Funmi Adeyemi, the public information officer, has a radio slot
    at seven and four things she could put in it. The phones have been going since half past four.
  guide: All four of these will be in the slot, so nothing is being cut. Order them instead. Ask of each whether somebody hears it at
    seven o'clock and does something differently, or whether it is a fact they will repeat to a neighbour later. Then ask which one
    stops a rumour rather than feeding it. A radio slot is heard once, in the order it is read, by somebody who did not sleep.
  axis: Order the four by what a listener can use, most usable first. This is not a clock — all four are true at seven o'clock, and
    the question is which one is worth the first sentence.
  ends:
  - First sentence
  - Last sentence
  background:
  - 'Why the order is graded whole. A sequence is a claim about dependency: each step is here because the one before it has already
    happened, or has to have. One transposed pair falsifies that claim wherever it sits, so partial credit would be credit for a sequence
    that does not work.'
  - Why the ends are the place to start. The first and last cards are constrained by having nothing before or after them, which usually
    makes them the two you can settle from the scene alone. Pinning them collapses the remaining arrangements sharply, and what is left
    in the middle is where the actual judgement lives.
  - What the rail can be ordered on. Time is the usual axis, but it is not the only one. An order can run on cost, on risk, or on reversibility
    — every observation that leaves the sample as it was, before any that consumes it. On those boards a chronological reading finds
    nothing, because none of the steps has to happen at a particular hour.
  assumes:
  - a magnitude scale counts in factors rather than in equal steps
  - a public notice is heard once, quickly, by somebody who is tired
  takeaway: A magnitude scale counts in factors, so the gap between two numbers is a ratio, and the ratio is the part a frightened listener
    actually needs.
  format: SEQUENCE
  question: Order what the seven o'clock slot says about an aftershock
  cards:
  - What to do this morning if you went back into a yellow or red building overnight.
  - Why, in one sentence a neighbour can repeat.
  - That a 5.1 carries about 350 times less energy than the 6.8 did, so it felt sharp and did little.
  - The forecast for the coming week, stated as events per day rather than as a prediction.
  order:
  - 0
  - 1
  - 2
  - 3
  why: 'The order is what somebody can use. The instruction goes first, because a person listening at seven acts on the first usable
    sentence and may not hear the rest. The reason follows, since a reason is what lets an instruction survive being retold. The comparison
    comes third: each unit of magnitude is about 32 times the energy, so 1.7 units of it is a factor near 350, and that number is what
    stops a 5.1 being heard as the start of something worse. The forecast is last, and it is a rate.'

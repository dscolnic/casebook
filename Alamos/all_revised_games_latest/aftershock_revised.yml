- title: Three things at once
  objective: Triage an aftershock, a burst main and a school deadline by asking which hazard is changing fastest and which decision
    closes first.
  briefing: An aftershock, a burst main and a deadline for the school, all inside an hour.
  stake: Wednesday, 15:40, and 3 things arrive together. A magnitude 5.1 aftershock has just shaken the town. It is the largest in a
    week. A water main has burst on Ferry Street. It is pouring into ground everybody now knows is loose. And the district wants a call
    on the school gym by five o'clock. Contractors are holding a slot for Saturday. Marisol Okonkwo has four engineers and no more.
    Bram Halvorsen is on the phone to the water board. Funmi Adeyemi has three drafts of a notice nobody has signed off. Today you decide
    which of the three gets your engineers first.
  takeaway: Priority comes from consequence, rate of change and reversibility—not from which problem sounds most dramatic.
  stops:
  - group: SAFE
    task: Keep one incident under your own engineering attention and delegate the others with an owner, a first action and a return
      condition.
    title: Which of the three cannot wait
    place: Public Safety
    scene: Three calls land within minutes. A burst main is feeding water into the Flats. Several vulnerable buildings need checks after
      the M5.1 aftershock, and Bay Road School needs its reopening message issued. Four engineers are available.
    guide: Three calls, four engineers, and one of the three you have to keep yourself. For each of the others, choose an owner who
      can take a real first action and the reading or event that brings the problem back to you. A handover with an owner and no return
      condition is not a handover. Then take the watch on the one that needs your own judgement.
    background:
    - 'Which one to keep. One of these is getting worse while you decide, one has a life-safety consequence that has to be checked,
      and one is a deadline that is stable — the message will still need issuing in an hour. Keeping the stable one is the classic error:
      it is the easiest to finish, and finishing it costs the field response its hours.'
    - Why a first action is required. "Watch it" is not a handover. An owner who cannot take a concrete step is a person who will come
      back for instructions at the worst moment, so the panel asks for the action they will take before they need to ask anybody.
    - 'Why a return condition is the other half. Delegation is not disposal: the problem comes back if it crosses a threshold, and naming
      that threshold now is what lets somebody else hold it without checking in. A burst main over liquefiable fill and a reopening
      message have very different triggers, and both need one.'
    assumes:
    - a problem still growing is different from one that has finished
    takeaway: Good delegation couples every handoff to a first action and a condition for returning the problem, while scarce expert
      attention stays on the judgment that cannot be automated.
    format: DELEGATE
    question: How do you divide the team so the worsening condition is stopped, the life-safety consequence is checked and the stable
      deadline does not consume the field response?
    delegate:
      hint: Assign each handoff to a role that can take its first real action. The handoff is incomplete until it also says what result
        or threshold brings the problem back to you.
      team:
      - id: utility
        label: utility
      - id: player
        label: player
      - id: desk
        label: desk
      people:
      - id: utility
        label: Utility liaison
      - id: desk
        label: Desk engineer
      - id: field
        label: Field engineer
      - id: player
        label: Building Safety Coordinator
      problems:
      - id: burst_main
        label: Burst water main over liquefaction-susceptible fill
        trend: rising
        irreversible: true
        loud: true
        stable: false
        rate: worsens while uncontrolled flow continues
        consequence: additional water raises pore pressure and can reduce effective-stress margin before another strong aftershock
        owner: utility
        firstAction: Order immediate isolation of the main and confirm that flow is stopping
        returnCondition: Return when flow is isolated or if isolation cannot be achieved promptly
        delegable: true
      - id: aftershock_checks
        label: Known vulnerable occupied or shored buildings after the M5.1 aftershock
        trend: not rising
        irreversible: false
        loud: false
        stable: false
        rate: new damage, if present, occurred during the completed aftershock
        consequence: restrictions could be relaxed or retained on the wrong structural condition without a focused re-check
        owner: player
        firstAction: Start rapid re-checks at the highest-risk occupied or shored buildings
        returnCondition: Do not relax restrictions until the rapid checks establish whether new distress occurred
        delegable: false
      - id: school_deadline
        label: Bay Road School reopening communication deadline
        trend: not rising
        irreversible: false
        loud: true
        stable: true
        rate: communication deadline approaches but the technical conclusion is unchanged
        consequence: families lack a clear route and occupancy message even though the engineering decision already exists
        owner: desk
        firstAction: Issue the classroom-open and gym-closed message with the route controls
        returnCondition: Return only if the isolation plan cannot keep occupied routes clear of the gym hazard
        delegable: true
      first: aftershock_checks
      firstActions:
      - id: a1
        label: Order immediate isolation of the main and confirm that flow is stopping
      - id: a2
        label: Start rapid re-checks at the highest-risk occupied or shored buildings
      - id: a3
        label: Issue the classroom-open and gym-closed message with the route controls
    answerText: Keep the post-aftershock building checks under direct engineering attention. Send the utility liaison to isolate the
      burst main immediately. Give the school communication to the desk engineer. Every handoff needs an owner, a first action and a
      return condition, so field judgment stays on uncertain building consequences.
    why: The burst main is actively worsening the ground condition, so utility isolation starts immediately. The M5.1 aftershock is
      over, but vulnerable or shored buildings may have new distress. That uncertainty needs engineering judgment before restrictions
      change. The school decision is already technically settled and mainly needs communication. Parallel work is therefore better than
      a single ranked list. Stop the growing input, keep direct attention on uncertain building consequences, and hand the stable message
      to the desk.
  - group: GEO
    task: Say what water does to fill
    title: Wetting ground that has already failed
    place: Geotechnical
    scene: Mbeki is on Ferry Street with a standpipe. The water table under the road has risen three quarters of a metre since the main
      went, and the ground surface is soft again underfoot.
    guide: Put a number on what the leak did. The grains are held together by the effective stress, which is the total weight above
      them less the water pressure between them. Pick the total stress at three metres and the pore pressure the risen water table now
      gives, and take one from the other. Two tiles are the pressures before the main burst, which is the comparison rather than the
      answer.
    background:
    - What effective stress is. The soil skeleton carries the difference between the total stress pressing down and the water pressure
      in the pores pushing the grains apart. Strength lives in that difference, which is why a saturated fill can be strong one day
      and behave like a liquid the next without a gram of it moving away.
    - What the leak did and did not do. A higher water table raises the pore pressure and takes the margin down. It liquefies nothing
      on its own — cyclic shaking is still required to build the pressure the rest of the way. What has changed is how much shaking
      that now takes.
    - Why Upper Town is different. On competent granite the same burst main is a plumbing problem. There is no loose saturated skeleton
      whose grain contacts can be unloaded by water pressure, so the mechanism has nothing to act on.
    assumes:
    - liquefaction requires saturated ground
    takeaway: A higher water table lowers effective stress and can worsen liquefaction susceptibility, but the triggering margin is
      not a simple linear percentage of effective stress.
    format: BALLPARK
    question: At three metres down under Ferry Street, what is the effective stress now the water table has risen?
    answerText: About 39 kPa, down from about 47 kPa before the main burst. That is a meaningful reduction in effective stress and a
      reason to reassess liquefaction triggering—not a 16% rule for aftershock size.
    why: At 3 m depth, total vertical stress is about 18 kN/m³ × 3 m = 54 kPa. With the water table now 1.5 m below ground, the pore
      pressure at 3 m is about 9.81 × 1.5 ≈ 14.7 kPa, so σ'≈54−14.7≈39 kPa. Before the rise, u≈7.4 kPa and σ'≈47 kPa. The soil skeleton
      therefore carries less effective stress. That changes liquefaction susceptibility and should trigger a renewed geotechnical check,
      but cyclic resistance and demand do not scale one-for-one with this 16% change. The leak has not liquefied the ground by itself;
      renewed cyclic shaking would still be required.
    estimate:
      prompt: The fill weighs about 18 kN/m³. The water table under Ferry Street is now 1.5 m down, so at 3 m the pore pressure is 9.81
        × 1.5 ≈ 14.7 kPa.
      question: Choose the total vertical stress at three metres and the pore pressure there now.
      labels:
      - 54  (σ, total vertical stress at 3 m, in kPa)
      - 14.7  (u, pore pressure at 3 m now, in kPa)
      - 7.4  (u before the main burst, in kPa)
      - 47  (σ' before the main burst, in kPa)
      - 0.75  (metres the water table has risen)
      values:
      - 54
      - 14.7
      - 7.4
      - 47
      - 0.75
      slots: 2
      template: '{0} − {1}'
      formula: a-b
      correct:
      - 0
      - 1
      target: 39.3
      tolerance: 3
      units: kilopascals (kPa) of effective stress
      solution: 54 − 14.7 ≈ 39 kPa, against 54 − 7.4 ≈ 47 kPa before the main burst.
      explanation: Effective stress falls from about 47 to 39 kPa. That is a material change in starting conditions, not a direct 16%
        reduction in the earthquake required for liquefaction.
      givens:
      - fill at about 18 kN/m³, so σ = 54 kPa at three metres
      - the water table is now 1.5 m down, giving u ≈ 14.7 kPa
      relationship: Effective stress is σ' = σ − u — the total stress less the pore-water pressure, and the strength of the soil lives
        in the difference.
  - group: STRUCT
    task: Work out what the 5.1 did to the shored buildings
    title: A smaller shake against a weaker building
    concept: Peak ground acceleration and what a building feels
    place: Structural Assessment
    scene: The 5.1 was about a tenth of the mainshock's ground motion in the Flats. 11 buildings have been shored since Friday, and
      2 of them have new cracking this afternoon.
    guide: Four readings of the same afternoon. Ask of each what the shoring was for. It is temporary support, not a repair, so new
      cracking is not automatically a failure of it. What has changed since Friday is on the other side of the comparison. Eleven buildings
      have less capacity, and two of them responded.
    background:
    - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading — a
      step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each belongs to is
      where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole
      game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before it was fixed.
      It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken out of them deliberately.
    - 'What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option fails,
      not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made for an approximate
      reason is indistinguishable from a sound one until the day the approximation is what is being tested.'
    takesAsRead:
    - P and S waves, and what the gap between them measures
    assumes:
    - a shored building is being held rather than repaired
    takeaway: New cracking during a smaller aftershock is evidence that residual capacity or detailing deserves escalation; it is not
      a complete diagnosis by itself.
    format: CHOICE
    question: What do the two buildings with new cracking tell the office?
    why: New cracking after a smaller aftershock is evidence of additional distress in already damaged structures. It justifies maintaining
      or tightening restrictions and checking the damaged mechanism and the shoring. It does not by itself locate the building on a
      precise capacity curve, prove the shoring failed, or invalidate the first assessment. The observed change is the reason to re-enter
      the evidence loop.
    choices:
    - That the shoring failed and must automatically be replaced.
    - That the two buildings accumulated new distress under the smaller aftershock, so their restrictions and shoring need focused reassessment.
    - That the aftershock must have been much stronger on those two streets than the network measured.
    - That the original assessment was necessarily wrong.
    answer: That the two buildings accumulated new distress under the smaller aftershock, so their restrictions and shoring need focused
      reassessment.
    rebuttals:
    - The shoring is still standing and doing its job; nothing about it failed.
    - Network stations either side of those streets recorded the same motion, so the shaking was not local.
    - The original assessment said these buildings had reduced capacity, which is exactly what this confirms.
- title: The last morning it can be changed
  objective: Write the rebuilding rule so it reduces the Flats liquefaction hazard without pretending one treatment or one CPT number
    guarantees safety.
  briefing: The recovery plan closes for comment today, and the ground improvement clause is in or out.
  stake: Thursday, and the recovery plan goes to the council tonight. One clause in it matters more than the rest. It decides whether
    rebuilding in the Flats needs the ground itself improved, or only stronger foundations. Elena Navarro has the corrected amplification
    and the borehole programme. Bram Halvorsen has the cost. It is large, and it falls on people who have just lost houses. Yvette Delacroix
    has 400 households who want to rebuild this year. They cannot afford to wait for a scheme. After tonight the clause cannot be reopened
    for five years. Today you decide what goes into that clause.
  takeaway: A rebuilding standard should state the hazard it addresses, a measurable acceptance criterion and the limits of that criterion.
  stops:
  - group: GEO
    task: Say what ground improvement actually does
    title: Fixing the ground instead of the building
    place: Geotechnical
    scene: 'Navarro has three options costed: stone columns, deep densification, and doing nothing to the ground while designing stiffer
      foundations on top of it. The council wants one approach written into the rebuild guidance.'
    guide: 'Three costed options and four readings of what separates them. Ask of each option where in the system it acts: on the soil,
      on the structure, or on neither. A stiff foundation can carry a building across ground that moves. It does nothing for the road,
      the buried services or the site next door. Both approaches can be right, and the council is writing one of them into guidance.'
    background:
    - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading — a
      step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each belongs to is
      where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole
      game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before it was fixed.
      It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken out of them deliberately.
    - 'What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option fails,
      not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made for an approximate
      reason is indistinguishable from a sound one until the day the approximation is what is being tested.'
    assumes:
    - liquefaction can be addressed in the ground or accommodated in the structure
    takeaway: Ground improvement reduces liquefaction susceptibility or its consequences; structural foundations can instead bypass
      or accommodate some ground deformation.
    format: CHOICE
    question: What is the engineering difference between improving the ground and designing foundations to tolerate the hazard?
    why: The strategies act at different places. Densification can increase density and cyclic resistance; drains or stone columns may
      reduce excess pore-pressure buildup or its consequences, depending on the design. None of those guarantees that the soil can never
      liquefy. Piles, rafts or other foundation strategies can bypass weak layers or tolerate some deformation, but roads, utilities
      and neighbouring sites may still move. A town-level rule therefore has to state which consequence it is trying to reduce and what
      performance is required.
    choices:
    - There is no important difference; both eliminate liquefaction.
    - Ground improvement can reduce liquefaction susceptibility or deformation; foundation design can instead bypass or tolerate some
      remaining ground movement.
    - Ground improvement is always cheaper because a whole street can be treated at once.
    - A stiffer foundation prevents earthquake shaking from reaching the building.
    answer: Ground improvement can reduce liquefaction susceptibility or deformation; foundation design can instead bypass or tolerate
      some remaining ground movement.
    rebuttals:
    - Neither strategy eliminates all earthquake or ground-deformation risk.
    - Cost depends strongly on site, treatment depth, access and foundation scheme; there is no universal ordering.
    - Foundation stiffness changes structural response; it does not shield the building from ground motion.
  - group: MAT
    task: Quantify the change in cone resistance without turning it into a false safety factor
    title: A measurable acceptance target
    place: Materials & Testing
    scene: 'Ferreira, the materials engineer, has cone penetration results from a trial panel: the fill tested at 4 MPa before the stone
      columns went in and 11 after. The two CPT traces lie side by side on the desk.'
    guide: 'Five numbers, and three belong elsewhere: the depth of the fill, the amplification factor and a concrete strength. Ask of
      each whether it came from these two cone traces. And note what the factor is and is not. Cone resistance is an input to a liquefaction
      assessment, so 2.75 times the resistance is not 2.75 times the margin.'
    background:
    - Why an estimate rather than a calculation. Every quantity on this board is already measured or stated, so nothing here has to
      be derived. What is being tested is whether you can pick the quantities the relationship actually needs, and whether the size
      of the answer looks right once they are in place.
    - Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label is how
      a unit mismatch, or a quantity belonging to a different part of the problem, is caught before it is placed — which is the habit
      this format exists to build.
    assumes:
    - 'CPT stands for cone penetration test: a standard cone is pushed into the ground and its resistance is recorded'
    takeaway: CPT resistance is a measurable quality-control result; the acceptance criterion still has to be tied to a liquefaction
      evaluation rather than a vague “times safer” claim.
    format: BALLPARK
    question: By what factor did the measured cone resistance increase?
    answerText: About 2.8 times the original cone resistance at the trial location.
    why: 'The measured cone resistance rose from 4 to 11 MPa, a factor of 2.75. That is a strong, auditable construction-control result:
      the treated ground is substantially more resistant to penetration at that location. But qc is an input to liquefaction evaluation,
      not a direct safety factor. Cyclic resistance also depends on overburden, fines, groundwater and the design method used. A good
      specification can therefore require a target corrected CPT resistance or verified performance profile without claiming that ''2.75
      times qc'' means ''2.75 times safer.'''
    estimate:
      prompt: The trial panel tested at 4 MPa cone resistance before treatment and 11 MPa after.
      question: Choose the two cone resistances.
      labels:
      - 11 MPa  (after treatment)
      - 4 MPa  (before treatment)
      - 15 m  (depth of the fill)
      - 5  (the corrected amplification factor)
      - 28 MPa  (concrete strength from the library cores)
      values:
      - 11
      - 4
      - 15
      - 5
      - 28
      slots: 2
      template: '{0} ÷ {1}'
      formula: a/b
      correct:
      - 0
      - 1
      target: 2.75
      tolerance: 0.5
      units: × the original cone resistance
      solution: 11 ÷ 4 ≈ 2.8 times the original cone resistance.
      explanation: Nearly three times. The fill depth, the amplification factor and the library's concrete strength are all real numbers
        from this fortnight and none of them belongs here.
      givens:
      - Cone resistance before treatment was 4 MPa
      - Cone resistance after treatment was 11 MPa
      relationship: Improvement factor = resistance after ÷ resistance before.
  - group: SAFE
    task: Commit, and say what the commitment contains
    title: What the next five years hold
    place: Public Safety
    scene: The clause goes in or it does not, and nobody can reopen it for five years. Delacroix is holding the spring rebuild schedule
      beside the draft ordinance. The geotechnical section is the last unresolved page.
    guide: 'Four versions of the clause on the left, and what each one actually produces on the right. Pair them by asking who has to
      pay and how soon. A requirement nobody can afford stops rebuilding instead of improving ground. No requirement rebuilds the same
      vulnerability on the same fill. And the last pairing is about time: nobody can reopen this for five years.'
    background:
    - Why this is a matching board and not four separate questions. Responses on boards like this are written to be plausible for more
      than one situation, so choosing them one at a time lets a nearly-right answer through unexamined. Having to place all of them
      forces the comparison — not "is this reasonable here", but "is it more right here than there".
    - How to use the one-each rule. Because the responses are a set to be distributed rather than a list to be sampled, every join you
      make constrains the rest. Settling the two you are confident of can leave the remaining pair decided by elimination. Where it
      does not, two responses are still competing for one situation, and that is exactly the distinction the stop is testing.
    - 'Why you cannot be wrong about exactly one. With every response used once, three correct joins leave the fourth with only one
      place to go. Any error therefore involves at least two joins. That is worth remembering when the last pair looks forced: the fault
      is usually not in the join you are struggling with, but in one you made early and stopped questioning.'
    assumes:
    - a decision to require something is also a decision about who pays for it
    takeaway: Science can define the hazard and performance target; the rebuilding policy must also specify affordability, phasing and
      who carries the cost.
    format: PROTOCOL
    question: Commit, and say what the commitment contains
    why: The engineering evidence can define the ground hazard and the performance a treatment programme should demonstrate. It cannot
      decide who pays or how quickly households must comply. A requirement without financing can stall rebuilding. No requirement can
      reproduce the same vulnerability. A workable policy therefore states where the rule applies and names a measurable geotechnical
      acceptance target. It also provides funding or phasing and a review process as new site data arrive. That separates the technical
      standard from the political choices needed to implement it.
    rebuttals:
    - With the clause, the ground improves street by street over about a decade as sites are rebuilt.
    - With the clause, 400 households meet a cost they have not budgeted for, so it needs a scheme beside it.
    - Without it, rebuilding is fast and cheap, and the fill is unchanged when the next earthquake comes.
    - Either way the decision is fixed for five years, which is why it is argued tonight rather than next spring.
    columns:
    - The version
    - What the town is committing to
    scenarios:
    - The clause goes in, with a funding scheme beside it.
    - The clause goes in, with no scheme.
    - The clause stays out.
    - Either version, once council has voted.
    choices:
    - The ground improves street by street over about a decade as sites are rebuilt.
    - A requirement people cannot afford, which stops rebuilding rather than improving ground.
    - Fast, cheap rebuilding on the same fill, in place for the next event.
    - Five years in which the decision cannot be reopened, whatever is learned.
    mapping:
    - 0
    - 1
    - 2
    - 3
- title: What we know, and how well
  objective: Grade each finding by its evidence, state the remaining uncertainty and sign only the Placard Register that says what is
    still unresolved.
  briefing: The Placard Register goes out today. The last job is not another calculation; it is deciding whether the evidence under
    every door is strong enough to sign.
  stake: Friday, two weeks on. The fortnight now goes into a report. Marisol Okonkwo will not sign a report that states everything at
    the same strength. Some of it was measured. Some of it was judged. A reader who cannot tell those apart will act on both the same
    way. Elena Navarro has the borehole results. Rei Tanaka wants her forecast written as a rate with a range. Not as a single number.
    Inês Cardoso wants the vault error set down as a finding. Not buried as a fix. Funmi Adeyemi has to turn all of it into something
    a household can use. Today you sort the findings by the evidence under each one.
  takeaway: The final safety decision is defensible only when measurements, inferences and unresolved unknowns are clearly separated.
  stops:
  - group: SEIS
    task: Sort the findings by their evidence
    title: Measured, inferred, assumed
    concept: 'Documentation: the record somebody inherits'
    place: Seismic Network
    scene: Cardoso lays out four of the fortnight's statements. The office believes all four. They are not held for the same reasons
      and she will not let them into the report as equals.
    guide: 'Four statements the office believes, held for four different reasons. Sort them by what an opponent would have to produce
      to challenge each: a second log, another event, a borehole, or a future earthquake. Belief is not the variable. The weakest of
      the four is the one the plan clause rests on, and saying so in the report is what makes it usable.'
    background:
    - Why explanations rather than labels. Naming a finding is not accounting for it, and a plausible-sounding mechanism attached to
      the wrong observation is the commonest way a wrong story survives. Committing an explanation to one clue means claiming it accounts
      for that clue specifically and not for its neighbour, which is where the two come apart.
    - How to use the one-each rule. The explanations are a set to be distributed, not a list to be sampled, so every join constrains
      the rest. Settling the two you are confident of can decide the remaining pair by elimination. Where it does not, two explanations
      are still competing for one clue, and that competition is the distinction the stop is testing.
    - 'Why you cannot be wrong about exactly one. With every explanation used once, three correct joins leave the fourth with only one
      place to go. Any error therefore involves at least two. That is worth remembering when the last pair looks forced: the fault is
      usually not in the join you are struggling with, but in one you made early and stopped questioning.'
    assumes:
    - a claim can rest on a measurement, on an inference, or on nothing yet
    takeaway: Sorting findings by their evidence is what lets a later reader know which ones to check first.
    format: CASEBOOK
    question: Sort the findings by their evidence
    why: The findings deserve different labels because their evidence chains differ. The vault/reference correction is directly documented
      by the trench log and common-event comparison. The hospital's period-specific recorded motion is measured at one building for
      one event. Marina Court's mechanism is a strong inference from rigid-body rotation, ejecta and ground observations without direct
      access beneath the raft. Future Flats site response is a projection that requires a period-dependent site-response study; the
      corrected 1 Hz ratio is not a universal future multiplier. The report becomes stronger when those distinctions remain visible.
    rebuttals:
    - The reference correction has both documentary and independent instrumental support.
    - The hospital value is direct but event- and period-specific; it is not a universal property of the building.
    - The Marina Court mechanism is an inference with several converging observations, not a direct view beneath the foundation.
    - Site response varies with frequency and can depend on shaking level, so one corrected ratio cannot define the full future spectrum.
    columns:
    - The finding
    - How strongly it is held
    scenarios:
    - The reference vault has a measurable site response relative to nearby competent rock in the 1 Hz band.
    - The hospital record gives about 0.31 g spectral acceleration near the building period.
    - Marina Court rotated because liquefaction-related ground deformation removed support beneath part of the raft.
    - The Flats will amplify by about five at every period in a future earthquake.
    choices:
    - Established for the measured band by the trench log and common-event instrument comparison.
    - Measured once, at one building, for one event and one response period.
    - Inferred strongly from survey, ejecta and ground behaviour, without direct observation beneath the raft.
    - 'Not established: the corrected 1 Hz ratio cannot be projected to every period and future input motion.'
    mapping:
    - 0
    - 1
    - 2
    - 3
  - group: HAZ
    task: State the forecast as a range
    title: The number that has to be a range
    place: Hazard & Forecasting
    scene: Tanaka's aftershock forecast goes into the report. She wants the range in the sentence and Okonkwo wants to know what the
      range is for. The staffing appendix cannot be signed until she chooses the wording.
    guide: Four reasons to publish a range, and they differ in who the range is for. Ask of each whether it is about caution, honesty,
      defensibility, or planning. Nobody staffs an emergency to the average week. A single number tells a planner nothing about how
      far the sequence might run above it, so they invent a margin instead. The staffing appendix cannot be signed until the wording
      is chosen.
    background:
    - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading — a
      step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each belongs to is
      where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole
      game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before it was fixed.
      It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken out of them deliberately.
    - 'What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option fails,
      not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made for an approximate
      reason is indistinguishable from a sound one until the day the approximation is what is being tested.'
    assumes:
    - a forecast is a distribution rather than a single value
    takeaway: A forecast without a range cannot size a decision, because the decision is sized against the range.
    format: CHOICE
    question: Why must the aftershock forecast include a range or probability distribution rather than only one expected count?
    why: An aftershock forecast is probabilistic. The expected count alone hides the spread of plausible outcomes, while staffing and
      inspection capacity are decisions made against that spread. Publishing the distribution or a clearly defined interval also makes
      the forecast testable and keeps model uncertainty visible. The range is not decorative caution and it does not mean the model
      lacks an expected value.
    choices:
    - Because a range merely sounds more cautious after a damaging earthquake.
    - Because future counts vary around the expectation, and staffing decisions need to know how much higher or lower the sequence could
      plausibly run.
    - Because a model that reports a range cannot later be evaluated.
    - Because the expected value is mathematically undefined for aftershock sequences.
    answer: Because future counts vary around the expectation, and staffing decisions need to know how much higher or lower the sequence
      could plausibly run.
    rebuttals:
    - The range is an input to planning, not a rhetorical signal of caution.
    - A stated distribution or interval makes the forecast more testable, not less.
    - The model can have a well-defined expected count while individual realizations vary around it.
  - group: STRUCT
    task: Make the final sign-off decision on the Placard Register
    title: Sign the register
    place: Structural Assessment
    scene: 'The fifteen entries are on the table. Okonkwo has left one blank line above the signature. It is for the condition under
      which you are willing to sign: what happens to every uninspected space and every unresolved hazard after today''s report leaves
      the room.'
    guide: Choose the register you can defend. A signed record may contain uncertainty, but it cannot hide it. The school gym, hospital
      plant room and Ferry Street basement all began as written inspection limits that nobody owned. The final version must turn every
      unresolved item into an assigned action with a deadline or trigger before a later full clearance can erase it.
    background:
    - Why this is the final decision. Every earlier placard was provisional evidence under pressure. The register is the durable record
      other people will use after the emergency team disperses.
    - What makes uncertainty acceptable. An unresolved condition can remain in a signed report if its consequence, current restriction,
      owner and next check are explicit. Hidden uncertainty is the failure.
    - What the fortnight revealed. The repeated blind spot was not that inspectors failed to see through walls; it was that written
      limits of inspection were allowed to become nobody's task.
    assumes:
    - a safety coordinator may sign a report that contains explicit unresolved items and restrictions
    takeaway: Sign only the register that preserves unresolved hazards as owned actions rather than silently converting them into clearances.
    format: TRIAGE
    question: Which version of the Placard Register can you sign?
    why: 'The defensible register does not claim that every building is safe. It states the current use restriction, the evidence behind
      it, the parts not inspected, and who owns each unresolved item with a deadline or trigger for reassessment. That is the lesson
      shared by the school gym, hospital plant room, Ferry Street basement and reference-station error: uncertainty becomes dangerous
      when the record makes it disappear. Signing the qualified register is the actual decision the fifteen days have been building
      toward.'
    choices:
    - Sign the version that keeps each unresolved item visible, assigns an owner and trigger for reassessment, and preserves the current
      restriction until that evidence arrives.
    - Sign only after every building has been fully opened, tested and proved safe with no remaining uncertainty.
    - Sign the current colors without the inspection limits, because the public needs one simple answer per building.
    - Delay the register until the aftershock sequence has ended and no further placard could change.
    answer: Sign the version that keeps each unresolved item visible, assigns an owner and trigger for reassessment, and preserves the
      current restriction until that evidence arrives.
    rebuttals:
    - A post-disaster register cannot wait for complete knowledge; it has to manage explicit uncertainty while the town operates.
    - Removing the limits of inspection is exactly how a provisional placard becomes an unsupported guarantee.
    - Aftershock activity decays rather than supplying a clean end date, and the town needs a usable record now.

      value: diagonal both ways
      status: alarm
    - zone: Column A
      label: Crack width
      value: 0.3 mm
      status: normal
    - zone: Column B
      label: Cover concrete
      value: intact
      status: normal
    - zone: Column C
      label: Crack spacing
      value: even, 120 mm
      status: normal
    - zone: Core sample
      label: Strength
      value: 28 MPa
      status: normal

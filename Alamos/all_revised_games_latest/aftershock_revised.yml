- title: The cordon nobody can lift
  objective: Rebuild the cordon from the hazards that still exist instead of letting the emergency line survive by habit.
  briefing: 11 streets have been closed for 6 days, and the reason is now 3 different reasons.
  stake: Saturday, and the cordon around the Flats is a week old. It was drawn on day one to keep people away from falling masonry.
    It was kept on day three for the gas main. It is being kept today because nobody has said it can come down. Yvette Delacroix has
    a list of 400 households. Sixty of them are sleeping in the sports hall. She has a question the office has not answered. What has
    to be true before people can go home? Bram Halvorsen is losing patience. Marisol Okonkwo will not be hurried. Every street inside
    the line is a different case. Today you decide where the cordon should run tonight.
  takeaway: A cordon is a current safety decision, not a historical trace of where someone drew a line on day one.
  stops:
  - group: SAFE
    task: Review the backing for each cordon segment, then spend one field verification before tonight's boundary map is reissued.
    title: Three reasons wearing one line
    place: Public Safety
    scene: Shopkeepers are waiting at the tape with deliveries and keys in hand. Delacroix walks the cordon with the boundary log. Three
      stretches have written reasons. The southern leg is still closed, but nobody can point to the hazard it is controlling.
    guide: 'Each stretch of cordon is a claim that a hazard is there now. Open the evidence behind each one before spending anything:
      some rest on an inspection, some on a hazard that has since been removed, and one has no written reason at all. You can recheck
      one stretch physically. Hold the claims the evidence does not support, and choose the recheck where opening the wrong street would
      cost the most.'
    background:
    - A cordon is a claim, not a decision. Tape is put up for a reason, and the reason is a statement about a present condition — falling
      glass, an unstable parapet, ground that may still move. Conditions change and reasons expire, so a boundary nobody has revisited
      is a claim nobody has retested.
    - What the cost of a stale cordon is. Shopkeepers are at the tape with keys and deliveries. Every day a stretch stays closed without
      a hazard behind it, the cordon as a whole loses authority, and the stretches that do control real hazards get walked around. Over-closing
      is not the safe error it looks like.
    - Why the unwritten leg is not automatically the answer. A stretch with no logged reason may still be controlling a genuine hazard
      that somebody saw on day one and never wrote down. The point of the check is to find out, which is why the panel makes you spend
      the verification rather than infer from the paperwork.
    assumes:
    - a boundary can be drawn for more than one reason
    takeaway: Every cordon segment is a claim about a current hazard, and each claim should remain traceable to evidence that can be
      rechecked.
    format: ATTEST
    question: Which current exclusion claim most needs to be checked against the physical condition on the ground?
    attest:
      hint: Open the evidence attached to each segment. You can physically recheck one segment before the new map is issued; a line
        on the map is not itself evidence of a present hazard.
      checks: 1
      checkUnit: field verification
      claims:
      - id: north
        label: Keep the northern arc closed to pedestrian access
        critical: true
        backed: true
        evidence: Unsecured Parade parapets are documented directly above this arc.
      - id: east
        label: Keep the eastern leg closed while the gas-main status is unresolved
        critical: true
        backed: true
        evidence: Utility isolation and sign-off status are recorded for this main.
      - id: ferry
        label: Keep Ferry Street restricted to heavy emergency vehicles
        critical: true
        backed: true
        evidence: Road-support observations show the disturbed surface cannot yet support the appliance route.
      - id: south
        label: Keep the southern leg inside the public exclusion boundary
        critical: true
        backed: false
        evidence: No hazard or access reason is recorded for this segment.
    answerText: Verify the southern leg first. Its exclusion is a current safety claim with no recorded physical basis. If a hazard
      is present, document it and keep the segment. If none is found, the line should not survive merely because it was drawn during

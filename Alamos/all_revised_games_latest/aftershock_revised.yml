  - group: HAZ
    task: Correct the measured site-response ratio without turning it into a universal design number
    title: Four point eight — in one band
    concept: 'Site effect: soft ground amplifies'
    place: Hazard & Forecasting
    scene: The dependency trace leaves one clean numerical correction. In the 1 Hz band used in the original comparison, the Flats-to-vault
      spectral ratio was about 3.0. Five days of common aftershocks show the vault itself is about 1.6 times competent rock in that
      same band.
    guide: 'Multiply ratios only because they refer to the same response quantity and frequency band: Flats/vault × vault/rock = Flats/rock.
      Then stop. The result is a corrected 1 Hz spectral ratio, not ''the amplification of the Flats'' at every period and not a replacement
      code coefficient.'
    background:
    - 'What is being corrected. Ratios can be chained when numerator and denominator describe the same quantity: (Flats/vault) × (vault/rock)
      = Flats/rock.'
    - What the number means. About 4.8 is the corrected spectral-amplitude ratio in the specified 1 Hz band for the observed motions.
      Site response varies with frequency and can also depend on shaking level.
    - What the number cannot become. A building design spectrum contains period-dependent ordinates and code factors. One corrected
      spectral ratio is evidence for stronger site effects, not a universal multiplier to paste into every design value.
    takesAsRead:
    - Peak ground acceleration and what a building feels
    assumes:
    - both ratios refer to the same spectral quantity and the same 1 Hz band
    takeaway: A corrected spectral ratio can be scientifically valid while the policy shortcut built from the old ratio is still invalid.
    format: BALLPARK
    question: What is the corrected Flats-to-competent-rock spectral ratio in the measured 1 Hz band?
    answerText: About 4.8 in that 1 Hz band. The district should not turn 4.8 into a universal design multiplier.
    why: 'The measured chain is (Flats/vault) × (vault/competent rock) = 3.0 × 1.6 ≈ 4.8. Because both terms are dimensionless spectral-amplitude
      ratios in the same band, the multiplication is legitimate. What is not legitimate is the next leap: treating 4.8 as the response
      of every structure at every period or as a code design coefficient. The corrected result strengthens the case for a proper site-response
      study and period-dependent design spectrum.'
    estimate:
      prompt: The original 1 Hz spectral ratio was Flats/vault = 3.0. Common aftershocks now give vault/competent-rock = 1.6 in the
        same 1 Hz band.
      question: Choose the two compatible ratios in the same band.
      labels:
      - 3.0  (Flats / vault spectral ratio at 1 Hz)
      - 1.6  (vault / competent-rock spectral ratio at 1 Hz)
      - 0.41  (an unrelated peak acceleration from another display)
      - 0.31  (the hospital response-spectrum coefficient near 0.4 s)
      - 6.8  (moment magnitude)
      values:
      - 3.0
      - 1.6
      - 0.41
      - 0.31
      - 6.8
      slots: 2
      template: '{0} × {1}'
      formula: a*b
      correct:
      - 0
      - 1
      target: 4.8
      tolerance: 0.4
      units: dimensionless spectral ratio at 1 Hz
      solution: 3.0 × 1.6 ≈ 4.8 in the measured 1 Hz band.
      explanation: The ratio chain is valid because both terms use the same spectral quantity and band. The result is not a universal
        building-design multiplier.

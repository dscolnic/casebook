      the vault itself is about ×1.6 relative to competent rock in the same band, a published ×3 Flats-to-vault ratio becomes about
      ×4.8 Flats-to-rock for that measured band. Second, the planning memo made an additional inference by using a single event- and
      frequency-specific ratio as a universal design multiplier. That shortcut should be withdrawn rather than merely changed from 3
      to 4.8. The hospital record, multi-station M_w solution and Marina Court field diagnosis do not depend on the vault and therefore
      remain supported.'
  - group: GEO
    task: Sort the fortnight's conclusions
    title: What still stands
    place: Geotechnical
    scene: Navarro puts four of the fortnight's conclusions on the board. One used the suspect vault directly; the others have independent
      evidence chains.
    guide: Trace each conclusion back to its evidence. The 1 Hz Flats spectral ratio used the vault as its denominator. The hospital's
      period-specific record did not. Marina Court's rigid-body rotation and ejecta did not. The Parade's parapet failures did not.
    background:
    - Why explanations rather than labels. Naming a finding is not accounting for it, and a plausible-sounding mechanism attached to
      the wrong observation is the commonest way a wrong story survives. Committing an explanation to one clue means claiming it accounts
      for that clue specifically and not for its neighbour, which is where the two come apart.
    - How to use the one-each rule. The explanations are a set to be distributed, not a list to be sampled, so every join constrains
      the rest. Settling the two you are confident of can decide the remaining pair by elimination. Where it does not, two explanations
      are still competing for one clue, and that competition is the distinction the stop is testing.
    - 'Why you cannot be wrong about exactly one. With every explanation used once, three correct joins leave the fourth with only one
      place to go. Any error therefore involves at least two. That is worth remembering when the last pair looks forced: the fault is
      usually not in the join you are struggling with, but in one you made early and stopped questioning.'
    assumes:
    - a conclusion can rest on one measurement or on several
    takeaway: A reference error propagates through dependent measurements, not through every conclusion made during the same emergency.
    format: CASEBOOK
    question: Sort the fortnight's conclusions
    why: Trace each conclusion to its evidence. The Flats spectral ratio used the vault directly and must be restated. The district
      design shortcut also depended on that ratio, but it should be withdrawn rather than assigned a new universal factor because site
      response varies with period and input motion. Marina Court's diagnosis came from survey, ejecta and geotechnical observations.
      The hospital motion came from its own instrument, and moment magnitude came from the network source solution.
    rebuttals:
    - The 1 Hz Flats/vault ratio used the bad denominator and must be corrected to a Flats/competent-rock ratio.

  objective: Replace adjectives about the library columns with a measured material property, then keep that property separate from the
    capacity of a damaged member.
  briefing: The library's columns look cracked. Nobody has said what they can still hold.
  stake: Friday, and the argument at the base has moved from buildings to numbers. The public library is a 1970s concrete frame. Three
    of its ground-floor columns have diagonal cracks. Three engineers have looked at those columns. One called the cracking moderate,
    one serious, one superficial. Duarte Ferreira, the materials engineer, points out that none of those words is a number. His laboratory
    can give the office a number in a day. Kirsten Sørensen has already cut four cores for him. She refused a fifth. It arrived with
    no label saying which column it came from. Today you decide what the library may be used for while the testing runs.

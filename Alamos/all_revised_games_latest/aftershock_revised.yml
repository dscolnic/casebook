    - label: Shear from reversing earthquake load
      mechanism: Load pushed one way then the other, opening diagonal cracks in both directions.
    - label: Overloading in compression
      mechanism: Too much weight would crush the concrete.
    - label: Long-term settlement of the foundation
      mechanism: Settlement puts a frame into slow distortion.
    - label: Poor quality concrete
      mechanism: Weak material cracks under ordinary load.

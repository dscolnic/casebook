      treated here as a yield modulus. More importantly, the core says nothing direct about reinforcement, confinement, axial load,
      crack mechanism or residual member capacity. Four reasonable core results narrow the diagnosis; they do not clear the columns.
    estimate:
      prompt: The third core is 100 mm in diameter and failed at 244 kN. Its area is π × 0.05² ≈ 0.00785 m².
      question: Choose the crushing force in newtons and the area it acted on.

# aftershock.yml — revised full-story/science pass
# Preserves the 15-mission / 48-stop engine structure while tightening story logic and scientific claims.

theme:
  id: aftershock
  title: Aftershock
  subtitle: Building Safety Coordinator · Kestrel Bay
groups:
- id: SEIS
  code: SEIS
  name: Seismic Network
  color: '#2980b9'
  desc: What the ground actually did, and which instrument is entitled to say so.
  defaultLeader: okonkwo
  milestones:
  - Read the records
  - Locate the source
  - Check the instruments
  - Ready to hand over
- id: STRUCT
  code: STRUCT
  name: Structural Assessment
  color: '#c0392b'
  desc: Whether a building is safe to enter, and what that placard is worth.
  defaultLeader: halvorsen
  milestones:
  - Walk the building
  - Find the load path
  - Rate the damage
  - Ready to hand over
- id: GEO
  code: GEO
  name: Geotechnical
  color: '#8e6b2f'
  desc: The ground under the town, and why it behaved in two different ways.
  defaultLeader: navarro
  milestones:
  - Log the ground
  - Test the fill
  - Bound the movement
  - Ready to hand over
- id: MAT
  code: MAT
  name: Materials & Testing
  color: '#7d5ba6'
  desc: What the concrete, the brick and the steel can still carry.
  defaultLeader: ferreira
  milestones:
  - Take the sample
  - Test it
  - Compare with design
  - Ready to hand over
- id: HAZ
  code: HAZ
  name: Hazard & Forecasting
  color: '#2f8f7a'
  desc: What might still happen, expressed as a number somebody can act on.
  defaultLeader: tanaka
  milestones:
  - Read the sequence
  - Fit the rate
  - State the uncertainty
  - Ready to hand over
- id: SAFE
  code: SAFE
  name: Public Safety
  color: '#d35400'
  desc: Cordons, notices and the cost of keeping people out of their own houses.
  defaultLeader: adeyemi
  milestones:
  - Set the cordon
  - Tell people why
  - Weigh the cost
  - Ready to hand over
roster:
- id: okonkwo
  name: Marisol Okonkwo
  role: Structural engineer, Building Safety Coordinator's deputy
  division: STRUCT
  color: '#c0392b'
  bio: '<p>Nineteen years assessing buildings, six of them after earthquakes in three countries. She places a building on what the evidence
    supports and not one step further, and she has been overruled enough times to know exactly what it costs when she is right.</p>
    <p>Her rule, said aloud most mornings: a placard is a claim about a building, and a claim you cannot trace is a guess wearing a
    colour.</p>'
  quiz:
  - q: Why does Okonkwo refuse to upgrade a placard on a walk-past?
    a: A rapid assessment samples what is visible from outside
    wrong:
    - Rapid assessments are only valid for the first 24 hours after an event
    - A placard cannot legally be changed once it has been fixed to the door
    - Damage always shows on the outside of a building before the inside
- id: halvorsen
  name: Bram Halvorsen
  role: Emergency manager for the district
  division: SAFE
  color: '#d35400'
  bio: '<p>Ran the response to two floods and a gas main before this. He thinks in what the town cannot do without: a hospital with
    nobody in it, a school that stays shut for a term, a port that stops paying wages. He is not careless and he is not in a hurry for
    its own sake.</p> <p>His argument with Okonkwo is the fortnight''s argument, and each of them is right on a day the other is wrong.</p>'
  quiz:
  - q: What does Halvorsen mean when he says an empty hospital has a cost?
    a: Care not given elsewhere is also harm, and it does not appear on any inspection form
    wrong:
    - Empty buildings deteriorate faster than occupied ones do
    - The hospital loses its funding if it is closed for more than a week
    - An empty building cannot be inspected properly while the power is off
- id: navarro
  name: Elena Navarro
  role: Geotechnical engineer
  division: GEO
  color: '#8e6b2f'
  bio: <p>She wrote her thesis on the fill under this town, which nobody read at the time and four people have asked her for this week.
    She can tell you which streets were creek in 1910 and it turns out those are the streets with sand in them now.</p> <p>She is the
    one who keeps saying that the buildings are not the story, the ground is.</p>
  quiz:
  - q: Why does Navarro care which streets were a creek a century ago?
    a: Loose saturated fill in an old channel is where liquefaction shows up
    wrong:
    - Old creek beds are where the water mains were laid and they break first
    - Historical maps are the only record of where the fault runs
    - Buildings on former creek beds are always older and therefore weaker
- id: ferreira
  name: Duarte Ferreira
  role: Materials engineer, testing laboratory
  division: MAT
  color: '#7d5ba6'
  bio: '<p>He breaks things for a living and is unromantic about it. Cores from a damaged column, coupons cut from a brace, a rebound
    hammer for the cases where nobody will let him cut anything: he wants a number with a method attached and treats everything else
    as an opinion.</p> <p>He is patient with people and impatient with round figures nobody can source.</p>'
  quiz:
  - q: Why will Ferreira not accept a rebound hammer reading as a strength?
    a: It measures surface hardness, which is a proxy that has to be calibrated against cores
    wrong:
    - The hammer only works on concrete poured within the last five years
    - Rebound readings are affected by the weather and are useless in the rain
    - A hammer test damages the surface and cannot be repeated
- id: tanaka
  name: Rei Tanaka
  role: Seismologist, hazard and forecasting
  division: HAZ
  color: '#2f8f7a'
  bio: <p>Fits aftershock sequences for a living and spends most of the week explaining that a forecast is a rate and not a promise.
    She is careful in public and blunt in the room.</p> <p>She keeps a printed copy of the sequence taped to the wall, updated by hand,
    because she says people believe a curve they watched being drawn.</p>
  quiz:
  - q: What does Tanaka's aftershock forecast actually state?
    a: A rate of events per day, with a range around it
    wrong:
    - The date on which the sequence will end
    - The magnitude of the next aftershock
    - Which fault segment will move next
- id: adeyemi
  name: Funmi Adeyemi
  role: Public information officer
  division: SAFE
  color: '#e08a2e'
  bio: '<p>She has to turn everything this office decides into something a person standing in the street can act on, in two sentences,
    without frightening anybody into doing something worse. She is the only one who reads the notices aloud before they go out.</p>
    <p>Her test for a notice: what does somebody do differently after reading it?</p>'
  quiz:
  - q: What is Adeyemi's test for a public notice?
    a: Whether somebody reading it does something different afterwards
    wrong:
    - Whether it uses only words in common use
    - Whether it has been approved by every agency involved
    - Whether it can be printed on a single side of paper
- id: cardoso
  name: Inês Cardoso
  role: Network technician, Seismic Network
  division: SEIS
  color: '#2980b9'
  bio: <p>She maintains the vault on the bench above town and the four field stations below it, which means she is the only person who
    knows that two of them have been running on a clock that drifted since spring.</p> <p>She is not embarrassed about it. She is the
    one who found it.</p>
  quiz:
  - q: Why does Cardoso check the vault instrument against a second one?
    a: A single instrument cannot show its own drift
    wrong:
    - Vault instruments are less accurate than field stations
    - Two instruments together record a wider frequency range
    - The vault instrument is only used for large events
- id: whitcombe
  name: Alan Whitcombe
  role: Assessment engineer, second team
  division: STRUCT
  color: '#a0392b'
  bio: <p>Came up from the city with the second wave of assessors and has placarded more buildings this week than most engineers do
    in a career. He is fast, and he knows the risk in being fast, which is why he writes down what he did not look at.</p> <p>The list
    of what he did not look at is the most useful document in the office.</p>
  quiz:
  - q: Why does Whitcombe keep a second list beside his placards?
    a: A placard says nothing about the parts of a building nobody could get to
    wrong:
    - A second list is required by the standard before a placard can be changed later
    - It records which buildings he expects to collapse in an aftershock
    - Inspectors are rotated, so the next one needs to know who was there
- id: mbeki
  name: Thandi Mbeki
  role: Geotechnical field technician
  division: GEO
  color: '#9e7a3a'
  bio: '<p>Logs the ground: cone tests where a rig can get in, hand augers where it cannot, and a photograph of every sand fan in the
    Flats with a scale bar in it.</p> <p>The photographs are turning into the best record anybody has of what the ground did.</p>'
  quiz:
  - q: Why does Mbeki put a scale bar in every photograph?
    a: Without it the picture records that ejecta happened, not how much
    wrong:
    - Photographs taken without a scale bar cannot be entered as evidence at an inquiry
    - The bar keeps the camera at a fixed distance from the ground
    - It marks which photographs were taken after the first aftershock
- id: sorensen
  name: Kirsten Sørensen
  role: Laboratory technician, Materials & Testing
  division: MAT
  color: '#8b6bb0'
  bio: <p>Runs the press. Cuts, caps and crushes cores, and keeps the chain of custody that makes the result mean anything — which building,
    which column, which face, which day.</p> <p>She has refused two samples this week for arriving without a label.</p>
  quiz:
  - q: Why does Sørensen refuse an unlabelled core?
    a: A strength belongs to one column in one building, and an unlabelled core belongs to none
    wrong:
    - Unlabelled cores dry out on the bench before the press is free to test them
    - The press cannot be calibrated without knowing the concrete's age
    - Regulations require every sample to carry the name of the engineer who cut it
- id: ives
  name: Peter Ives
  role: Hospital facilities manager
  division: HAZ
  color: '#3a9a84'
  bio: <p>He has 90 beds, a yellow placard on his front door and no idea when either of those changes. He knows his building better
    than anybody assessing it, and he knows that is not the same as being able to say it is safe.</p> <p>He is not fighting the process.
    He is asking it to hurry, precisely.</p>
  quiz:
  - q: Why can Ives not simply declare his own building safe?
    a: Knowing a building well is not the same as having assessed what the earthquake did to it
    wrong:
    - Facilities managers are not permitted to enter a building that carries a yellow placard
    - He has no access to the design drawings for the upper floors
    - A declaration by the occupier would invalidate the insurance
- id: delacroix
  name: Yvette Delacroix
  role: Ward councillor for the Flats
  division: SAFE
  color: '#d4762a'
  bio: <p>Represents the half of town that got the worse earthquake and has the smaller houses. She turns up to every meeting with a
    list of who is sleeping where, and she can name the streets that have been cordoned longest.</p> <p>She is not against the cordons.
    She wants somebody to say when they end.</p>
  quiz:
  - q: What is Delacroix actually asking the office for?
    a: The condition each stretch of cordon would have to meet to come down
    wrong:
    - A guaranteed date on which every street reopens
    - Compensation for every household still unable to get back into its own house
    - A second opinion from an engineer she chooses herself
glossary:
- name: Placard
  aliases:
  - placards
  - placarded
  - placarding
  def: The notice fixed to a building after an inspection — green to enter, yellow for restricted use, red for no entry.
- name: Epicentre
  aliases:
  - epicenter
  def: The point on the surface directly above where the fault started to slip.
- name: Magnitude
  aliases:
  - magnitudes
  def: A single number for the size of an earthquake, on a scale where each unit is about 32 times the energy.
- name: Intensity
  aliases: []
  def: How strongly the ground shook at one particular place, which differs across a town in one earthquake.
- name: Liquefaction
  aliases:
  - liquefied
  - liquefy
  def: Wet, loosely packed ground losing its strength while it is shaken, and behaving like a heavy liquid.
- name: Ejecta
  aliases:
  - sand boil
  - sand boils
  def: Sand and water that reached the surface from below, left as grey fans in the street.
- name: Fill
  aliases:
  - hydraulic fill
  - reclaimed
  def: Ground that was placed by people rather than laid down by nature, often dredged and pumped into position.
- name: Bedrock
  aliases:
  - rock site
  def: Solid rock beneath the ground surface, which shakes only lightly where loose fill shakes hard.
- name: Site effect
  aliases:
  - amplification
  - amplify
  - amplified
  def: Soft ground magnifying shaking, so two places the same distance from an earthquake feel different ones.
- name: Natural period
  aliases:
  - fundamental period
  def: The time a building takes to sway back and forth once when it is pushed and let go.
- name: Resonance
  aliases:
  - resonant
  def: What happens when the ground shakes at close to a building's own natural period, so each push adds to the last.
- name: Base shear
  aliases: []
  def: The total horizontal force an earthquake applies at the bottom of a building.
- name: Load path
  aliases:
  - load paths
  def: The route a force takes down through a building to the ground; if it stops anywhere, that is where the damage goes.
- name: Kilopascal
  aliases:
  - kPa
  - kilopascals
  def: A unit of pressure or stress — a thousand newtons spread over a square metre. Soil stresses on this site run to a few tens of
    them.
- name: Soft storey
  aliases:
  - soft story
  - soft-storey
  def: A floor with much lower stiffness than the storeys above it, usually an open ground floor, which takes all the movement.
- name: Ductility
  aliases:
  - ductile
  - brittle
  def: A material's ability to bend a long way without breaking, which is what lets a building absorb an earthquake.
- name: Unreinforced masonry
  aliases:
  - URM
  - masonry
  def: Brick or stone with no steel in it, strong when pressed and weak when pulled sideways.
- name: Factor of safety
  aliases:
  - safety factor
  def: What a part can carry, divided by what was required of it.
- name: Aftershock
  aliases:
  - aftershocks
  def: A smaller earthquake following the main one, in the same place underground, becoming rarer as time passes.
- name: Cordon
  aliases:
  - cordoned
  - cordons
  def: A boundary keeping people out of an area, and a decision with a cost on both sides of it.
- name: Fault
  aliases:
  - faults
  - fault line
  def: A break in the rock where the two sides have moved past each other, and can move again.
- name: Pore pressure
  aliases:
  - pore water pressure
  def: Water pressure in the gaps inside the ground, which holds the packed particles apart.
- name: Loose ground
  aliases:
  - loose
  - loosely packed
  def: Ground that is not tightly packed, so shaking can settle it into a smaller space.
- name: Saturated
  aliases:
  - saturation
  def: Ground in which every gap is already full of water.
- name: Bearing capacity
  aliases:
  - bearing
  def: How much weight the ground can take before it fails under a building.
- name: Shear
  aliases:
  - shear force
  - in shear
  def: A force that slides one part of a wall or column past the part beside it.
- name: Capacity
  aliases:
  - capacities
  def: How much a part of a building can carry before it fails.
- name: Demand
  aliases: []
  def: How much the earthquake actually required that part to carry.
missions:
- title: Two towns, one earthquake
  objective: Explain why the same earthquake made the Flats far more dangerous than Upper Town, so the first reassessment effort goes
    where it can change who gets home.
  briefing: One earthquake hit Kestrel Bay. The ground under the Flats made it a different disaster.
  stake: Friday, three days after the quake. The first thing anybody says at the base is that none of this makes sense. Upper Town sits
    on a granite bench. It has parapets in the street and almost every building still standing. The Flats sit 1100 metres away, on the
    same side of the same fault. There is sand in the gutters there. A six-storey block leans at 8 degrees. A wharf has moved 2 metres.
    Marisol Okonkwo, the structural engineer, will not sign an assessment programme until she can say why. Elena Navarro, the geotechnical
    engineer, thinks she knows already. She wants a borehole to prove it. You have two records of the same shaking. Work out what the
    ground did to that shaking on its way up. Today you decide which half of town gets the assessors first.
  takeaway: The earthquake is one event; the shaking a building receives depends on where it stands.
  stops:
  - group: SEIS
    task: Compare the two records from one earthquake
    title: The same event, recorded twice
    concept: Site response — one earthquake, different local ground motion
    place: Seismic Network
    scene: Inês Cardoso, the network technician, has the vault record from the bench and the field station record from Bay Road. Same
      event, same minute, 1100 metres apart. One trace is short and sharp, the other is three times taller and goes on for half a minute
      longer.
    guide: 'All four options explain two records that disagree. They differ in what they blame: the instrument, the ground, the distance,
      or the timing. Two of them are checkable from the scene. Same event, same minute, 1100 metres apart. Ask what 1100 metres can
      and cannot account for. Which one is right decides whether the Flats get a stronger design value or a service call.'
    background:
    - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading — a
      step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each belongs to is
      where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole
      game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before it was fixed.
      It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken out of them deliberately.
    - 'What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option fails,
      not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made for an approximate
      reason is indistinguishable from a sound one until the day the approximation is what is being tested.'
    assumes:
    - an instrument records the shaking where it stands, not the earthquake itself
    takeaway: A soft-soil/rock ratio from one band and one event is evidence of site response, not a universal multiplier for every
      structure.
    format: CHOICE
    question: What does the difference between the two records mean?
    answerText: The Flats motion is about three times the reference motion in the measured band. That supports a strong local site-response
      effect; the factor depends on frequency and on the input motion, so it is not a single number to paste onto every building.
    why: Both instruments recorded the same earthquake, so the source is not the variable. In the band shown on the board, the Flats
      amplitude is about three times the reference-station amplitude. That is direct evidence that the shallow ground is changing the
      motion before it reaches the surface. Soft, low-velocity deposits can amplify some frequencies strongly, while other frequencies
      may be amplified less or even deamplified. The useful conclusion today is therefore not 'the Flats always shake three times harder';
      it is 'the ground beneath the Flats matters enough that site response has to be measured and carried into the reassessment.'
    choices:
    - One of the two instruments is faulty and its record should be discarded.
    - The soft ground under the Flats amplified and lengthened the shaking.
    - The Flats are closer to the epicentre, which is why the shaking there was stronger.
    - The Flats record includes aftershocks that the vault instrument was not running for.
    answer: The soft ground under the Flats amplified and lengthened the shaking.
    rebuttals:
    - Both instruments checked out against a second sensor this morning; the difference is real.
    - 1100 metres is nothing against a source 20 kilometres away, so distance cannot explain a factor of 3.
    - Both records cover the same 90 seconds, and the aftershocks are on separate traces.
  - group: GEO
    task: Say what the ground under the Flats is made of
    title: Ground that people put there
    place: Geotechnical
    scene: Navarro has an 1892 survey and a photograph from 1948. Where Bay Road now runs there was a tidal creek, and the port was
      pumped into place out of the dredger over four summers.
    guide: 'Four descriptions of ground, and four behaviours under shaking. Pair them by asking two things of each: how loose is it,
      and can the water get out. Age is not the variable it looks like. One of these is the wettest and loosest of all. It is a line
      on an 1892 survey, invisible from the street.'
    background:
    - Why this is a matching board and not four separate questions. Responses on boards like this are written to be plausible for more
      than one situation, so choosing them one at a time lets a nearly-right answer through unexamined. Having to place all of them
      forces the comparison — not "is this reasonable here", but "is it more right here than there".
    - How to use the one-each rule. Because the responses are a set to be distributed rather than a list to be sampled, every join you
      make constrains the rest. Settling the two you are confident of can leave the remaining pair decided by elimination. Where it
      does not, two responses are still competing for one situation, and that is exactly the distinction the stop is testing.
    - 'Why you cannot be wrong about exactly one. With every response used once, three correct joins leave the fourth with only one
      place to go. Any error therefore involves at least two joins. That is worth remembering when the last pair looks forced: the fault
      is usually not in the join you are struggling with, but in one you made early and stopped questioning.'
    assumes:
    - ground can be natural or placed by people
    takeaway: Liquefaction needs susceptible soil, enough saturation and strong cyclic loading; young hydraulic fill often supplies
      the first two.
    format: PROTOCOL
    question: Say what the ground under the Flats is made of
    why: 'Hydraulic fill is deposited loose and commonly remains saturated. During shaking, grains try to rearrange while water cannot
      escape quickly. Effective stress is σ'' = σ − u: as pore-water pressure u rises, the grain-to-grain stress σ'' falls. If that
      contact stress becomes very small, the soil can lose much of its shear strength and behave like a fluid. The old creek line matters
      because it marks especially wet, loose fill, which is also where the sand ejecta appeared.'
    rebuttals:
    - Hydraulic fill is dropped through water, so it settles loose and stays saturated.
    - The granite bench is neither loose nor saturated, so its behaviour under shaking is nothing like the fill.
    - The old creek line is where the loosest wettest material sits, which is why the fans follow it.
    - Age matters because ground gains strength as it consolidates, and 80 years is young.
    columns:
    - The ground
    - What it does when shaken
    scenarios:
    - Hydraulic fill, pumped in from a dredger in the 1940s.
    - The granite bench under Upper Town.
    - The line of the 1892 tidal creek.
    - Ground that has been in place for 10000 years.
    choices:
    - Loose and saturated, so shaking can pack it and the water pressure rises.
    - Stiff and drained, so it passes the shaking on almost unchanged.
    - The loosest and wettest of all, which is where the sand fans appeared.
    - Consolidated by its own weight over time, which is why age is a defence.
    mapping:
    - 0
    - 1
    - 2
    - 3
  - group: STRUCT
    task: Allocate the six assessor-days across the four inspection packages, then check which operational questions the plan can answer.
    title: Where the first day of assessment goes
    place: Structural Assessment
    scene: Six assessors are free for one day. 400 displaced households are waiting on decisions in the Flats. Marina Court and the
      Parade are already cordoned, while Upper Town is mostly occupied. The team board shows six assessor-days available.
    guide: 'Six assessor-days is the whole pool, and each package you drag in spends some of it. Watch the answers list rather than
      the buildings: it shows which questions the current plan can answer, and every package you buy is a question you can answer and
      one you have given up. The cordons already in place cost nothing. Commit the plan when the answers you can give are the ones today
      needs.'
    background:
    - Why the pool is the constraint. Six assessors for one day is a fixed quantity of attention, and the Flats alone could absorb all
      of it. The decision is not what is worth inspecting — nearly everything is — but which inspections change what happens before
      tonight.
    - What makes an answer worth buying today. Four hundred households are waiting on a re-occupancy decision. An inspection that can
      produce that decision by this evening is worth more than one that produces a better answer next week, because the second one has
      already been made for them by the delay.
    - 'Why the existing cordons are on the board at zero. They are already in force, so they cost nothing to keep and they answer nothing
      new. They are there to be noticed: a plan that spends assessor-days re-establishing what is already closed has bought a question
      it had already answered.'
    assumes:
    - an assessment programme is a queue, and the order is a decision
    takeaway: A finite inspection team should be spent on the questions whose answers can still change what happens today.
    format: ALLOCATE
    question: Can your allocation preserve a same-day re-occupancy decision for the waiting Flats households while accepting that some
      lower-value questions will wait?
    allocate:
      hint: Drag inspection packages into the six-day pool. The live panel shows which questions the current plan can answer; you do
        not need to answer every question today.
      pool:
        amount: 6
        unit: assessor-days
        label: Assessment capacity today
      items:
      - id: existing_controls
        label: Existing cordons and closure orders
        cost: 0
        protected: true
      - id: flats
        label: Flats terrace re-occupancy sweep
        cost: 4
      - id: marina
        label: Additional Marina Court documentation
        cost: 2
      - id: upper
        label: Upper Town timber-house follow-up
        cost: 2
      - id: parade
        label: Detailed Parade damage documentation
        cost: 2
      answers:
      - required: true
        requires:
        - flats
        question: Can the waiting Flats households receive an occupancy decision today?
      - required: false
        requires:
        - marina
        question: Can Marina Court be described in more detail today?
      - required: false
        requires:
        - upper
        question: Can the standing Upper Town houses receive an extra follow-up today?
      - required: false
        requires:
        - parade
        question: Can the already-closed Parade be documented in more detail today?
    answerText: Keep at least four assessor-days on the Flats sweep so the waiting households can receive an occupancy decision today.
      Spend the remaining two days on one optional question; the other useful questions have to wait because the team cannot buy all
      four packages.
    why: Assessment capacity is a finite pool, so every useful inspection has an opportunity cost. The Flats package can resolve an
      occupancy decision for hundreds of displaced households. Marina Court and the Parade already have protective controls in place,
      so extra detail there changes less today. Upper Town follow-up is useful but not essential to the immediate re-occupancy decision.
      The allocation should therefore preserve the Flats question first, then spend remaining capacity only where another answer is
      worth the assessor-days it consumes.
- title: The number everybody has already heard
  objective: Separate source size and location from local shaking before the town turns two preliminary numbers into two different earthquakes.
  briefing: Two agencies published two magnitudes, and the difference is being read as a disagreement.
  stake: Saturday, and the town has two numbers for one earthquake. One agency said 6.6 within 20 minutes. Another said 6.8 six hours
    later. Rei Tanaka, the seismologist, can explain the gap to an engineer in one sentence. She has spent the morning failing to explain
    it to a radio station. Funmi Adeyemi, the public information officer, has to put something in a notice by four. Meanwhile Inês Cardoso,
    on the seismic network, has found a second problem. Two field stations have been running on a clock that drifted since spring. That

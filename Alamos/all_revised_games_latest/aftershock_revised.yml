  - group: MAT
    task: Get a strength from a damaged column
    title: A number, with a method attached
    concept: Concrete compressive strength from a core test
    place: Materials & Testing
    scene: '4 cores, 100 mm across, cut from the cracked columns. Sørensen caps and crushes them: 28, 31, 24 and 30 megapascals. The
      1974 drawing calls for 25. The four labelled specimens are still on the testing bench.'
    guide: Work the third core's strength out from the machine's own numbers rather than reading it off the report. Stress is the crushing
      force divided by the area the force acted on, and the area is the circle the core presents — not its diameter. One tile is that
      diameter, left for somebody who divides by the wrong thing.
    background:
    - Why area matters. Compressive stress is load divided by loaded area. A 100 mm diameter core presents a circular area of about
      0.00785 m²; dividing by the diameter instead of the area gives the wrong units and the wrong answer.
    - What the peak load tells you. The maximum compressive load divided by area gives the specimen's measured compressive strength
      for this simplified exercise. Concrete does not have a sharp metal-like yield point that this stop needs to identify.
    - What a core cannot settle. A column's residual capacity also depends on reinforcement, confinement, axial load, damage geometry
      and the load path. Those do not travel with a concrete cylinder into the press.
    assumes:
    - concrete strength is measured by crushing a sample of known size
    takeaway: Core crushing tests characterize sampled concrete strength; the damaged column still requires a member-level structural
      assessment.
    format: BALLPARK
    question: The third core failed at 244 kN. What compressive stress is that, and what does it actually settle?
    answerText: About 31 MPa. It supports the conclusion that grossly weak concrete is not the obvious explanation; it does not establish
      the cracked column's remaining capacity.
    why: Stress is σ=F/A. The 100 mm diameter core has area π(0.05 m)^2≈0.00785 m², so 244,000 N / 0.00785 m² ≈ 31 MPa. That is a specimen

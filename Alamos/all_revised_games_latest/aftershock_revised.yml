    guide: Four explanations, and one fact constrains all of them. Six columns in a row carry the same feature at the same height and
      the same width. Ask of each option whether it would produce that repetition. Six independent failures rarely agree to a millimetre.
      The drawings are open on a crate, which is where a shared construction detail would show up.
    background:
    - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading — a
      step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each belongs to is
      where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole
      game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before it was fixed.
      It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken out of them deliberately.
    - 'What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option fails,
      not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made for an approximate
      reason is indistinguishable from a sound one until the day the approximation is what is being tested.'
    assumes:
    - a defect that repeats in a pattern usually has a construction cause
    takeaway: A repeated crack at the same construction elevation is evidence for a shared detail, but the detail must still be checked
      for earthquake-induced opening or slip.
    format: CHOICE
    question: What is the best-supported explanation to test first?
    why: Six nearly horizontal features at the same elevation make a shared construction detail a strong first hypothesis. A lift joint
      at the top of a concrete pour would naturally repeat from column to column. Earthquake damage can also localize at a pre-existing
      joint, so identifying the joint is not the same as clearing it. Check drawings or pour records, measure displacement and spalling,
      inspect reinforcement continuity where possible, and compare with an undamaged row. The pattern ranks the hypothesis; the follow-up
      inspection decides whether the earthquake changed its condition.
    choices:
    - Earthquake shear damage in every column of the row.
    - A construction joint at the top of the first pour.
    - Foundation settlement lifting the columns.
    - Corrosion of the reinforcement inside the columns.
    answer: A construction joint at the top of the first pour.
    rebuttals:
    - Independent earthquake damage would not be expected to repeat with identical geometry in every column; inspect before ruling it
      out.
    - Differential foundation movement should leave a broader deformation pattern, not only the same horizontal feature at one construction
      elevation.
    - Corrosion is not supported by the repeated elevation and the absence of longitudinal cracking or rust staining.
  - group: SAFE
    task: Say it at six o'clock
    title: The meeting
    place: Public Safety
    scene: 200 people are already in the hall. One photograph has been forwarded all over town. The office has to explain what it found
      tonight, what it did not see on day one, and what happens next before anyone goes home.
    guide: All four of these have to be said tonight, so nothing is being withheld. Ask which one the hall came to hear, and which one

    task: Set what has to be true for people to go home
    title: A condition, not a date
    place: Hazard & Forecasting
    question: What should the office commit to?
    scene: Halvorsen wants a date. Delacroix wants a condition. Tanaka, the hazard seismologist, points out that a date makes a promise
      about the ground and a condition makes a promise about the office. The next resident update is due before the office closes.
    guide: 'Halvorsen and Delacroix are not disagreeing about the engineering. They are disagreeing about what the office is allowed
      to promise. So ask of each option one thing: is this a promise about the ground, or a promise about the office? The office controls
      one of those and not the other. Tanaka has already said which is which, and the update goes out before the office closes.'
    takesAsRead:
    - Peak ground acceleration and what a building feels
    - P and S waves, and what the gap between them measures
    assumes:
    - a commitment can be tied to a date or to an event
    takeaway: Tie a decision to a condition somebody can check, and it stays honest whatever the ground does next.
    format: CHOICE
    why: 'A date promises something about the ground that the office cannot control. A condition promises what evidence the office will
      require before changing the restriction. Publishing those conditions turns an open-ended wait into visible progress. Residents
      can see what remains: utility clearance, access checks, targeted assessment or repair. The aftershock rate is a poor release trigger
      because it does not measure the local hazard on a specific street. The commitment should therefore name the observations and actions
      that will justify reopening, not a day selected for reassurance.'
    rebuttals:
    - A date is a promise about ground behaviour and repair work that nobody can guarantee.
    - The aftershock rate is not the hazard recorded on any of these stretches.
    - Detailed assessment of every building would take a month and is not what most of these streets need.
    choices:
    - A date — the cordon lifts on Friday.
    - A condition — each stretch lifts when its recorded hazard is resolved.
    - A rate — the cordon lifts when aftershocks fall below one a day.
    - No commitment until every building inside the cordon has been assessed in detail.
    answer: A condition — each stretch lifts when its recorded hazard is resolved.
- title: The photograph that changed the meeting
  objective: Absorb a resident photograph into the evidence chain, inspect what the green placard missed and keep the excavation safe
    while the answer is checked.
  briefing: A resident's photograph of a cracked column is on the front page, and the building is green.
  stake: Sunday, and the office is on the back foot. A resident went into the basement car park of an apartment block on Ferry Street.
    He photographed a cracked column down there and gave the picture to the paper. The block carries a green placard. The photograph
    is real and so is the crack. There are 90 flats above that basement with people back inside. Alan Whitcombe placarded the block
    from the street on day one. He never saw the basement. Funmi Adeyemi has a public meeting at six. Marisol Okonkwo has two hours
    and no key to the car park. Today you decide what to say at six about a process that missed this.
  takeaway: Evidence does not become weaker because it arrived outside the official process; it becomes useful when the process can
    test it.
  stops:
  - group: STRUCT
    task: Say what the photograph establishes
    title: A real crack, and an unknown building
    place: Structural Assessment
    scene: The photograph has already been passed around town. It shows a basement column with a horizontal crack, pipework and no daylight.
      There is no scale, no building number and no way to tell which column it is.

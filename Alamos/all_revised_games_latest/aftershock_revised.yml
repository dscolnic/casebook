    task: Decide what the building may be used for meanwhile
    title: Part of a building, for part of a purpose
    place: Public Safety
    scene: Monday's public meeting has 200 residents registered and no backup venue. The library is the only hall large enough. Three
      ground-floor columns are cracked, and the route plan has to be settled before the doors can be advertised.
    guide: All four of these will happen, so the order is what is being decided. Ask of each what has to be settled before it can mean

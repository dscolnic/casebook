    task: Say what the falling rate means for a cracked building
    title: Damaged, and waiting to be asked again
    place: Structural Assessment
    scene: Okonkwo has 11 buildings with cracked shear walls that are still standing. Each has less capacity than it had a week ago,
      and the sequence has not finished. The shoring list is pinned beside the new forecast.
    guide: 'All four options give a reason the eleven buildings stay urgent. They differ in what is changing: the hazard, the buildings,
      or both. Ask of each whether the falling aftershock rate contradicts it. Two of these say the shaking will get worse, and the
      forecast says otherwise. What has changed since Friday is on the other side of the comparison.'
    background:
    - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading — a
      step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each belongs to is
      where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole
      game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before it was fixed.
      It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken out of them deliberately.
    - 'What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option fails,
      not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made for an approximate
      reason is indistinguishable from a sound one until the day the approximation is what is being tested.'
    assumes:
    - a damaged element carries less than it used to
    takeaway: Damage lowers the capacity, so the same aftershock that was survivable last week may not be this week.
    format: CHOICE
    question: Why does a falling aftershock rate still leave these 11 buildings urgent?
    why: The hazard is declining, but the buildings are not the same buildings they were before the mainshock. Cracked shear walls may
      have lost capacity, so a smaller aftershock can now produce additional distress. That does not mean every magnitude-5 event will
      damage them or that the exact remaining capacity is known. It means the acceptable demand has changed. The 11 buildings therefore
      stay urgent because the sequence still supplies repeated loading while their structural reserve is reduced and has not yet been
      restored.
    choices:
    - Because the rate could rise again without warning at any time.
    - Because their capacity has fallen, so a smaller aftershock is now enough.
    - Because aftershocks do more damage than mainshocks to buildings that are already cracked.
    - Because the buildings will keep degrading on their own even if nothing further happens.
    answer: Because their capacity has fallen, so a smaller aftershock is now enough.
    rebuttals:
    - Rates do fluctuate, but the case here does not depend on the rate rising.
    - An aftershock is not inherently worse than a mainshock; what changed is the building.

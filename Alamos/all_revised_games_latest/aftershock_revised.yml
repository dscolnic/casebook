    - 'Why the order is graded whole. A sequence is a claim about dependency: each step is here because the one before it has already
      happened, or has to have. One transposed pair falsifies that claim wherever it sits, so partial credit would be credit for a sequence
      that does not work.'
    - Why the ends are the place to start. The first and last cards are constrained by having nothing before or after them, which usually
      makes them the two you can settle from the scene alone. Pinning them collapses the remaining arrangements sharply, and what is
      left in the middle is where the actual judgement lives.
    - What the rail can be ordered on. Time is the usual axis, but it is not the only one. An order can run on cost, on risk, or on
      reversibility — every observation that leaves the sample as it was, before any that consumes it. On those boards a chronological
      reading finds nothing, because none of the steps has to happen at a particular hour.

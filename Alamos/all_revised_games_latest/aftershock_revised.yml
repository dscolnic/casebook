- title: What the ground will do next
  objective: Turn the aftershock sequence into a forecast the inspection teams can actually use without pretending it predicts a date
    or the next event.
  briefing: 41 aftershocks yesterday, 26 today. Everybody wants to know when it stops.
  stake: Thursday, and the question in every room is when the aftershocks stop. Rei Tanaka has the sequence. There have been 210 events
    above magnitude 3 in 4 days, and the count is falling steadily. Bram Halvorsen wants a date he can put on a notice. Funmi Adeyemi
    has to write that notice. Marisol Okonkwo needs the same rate for a different reason. A damaged building can carry less than it
    could. A red placard is urgent rather than tidy because that weakened building may be shaken hard again. Today you say what the
    forecast is, and what it is not.
  takeaway: An aftershock forecast is a probability distribution over future events, not a schedule.
  stops:
  - group: HAZ
    task: Fit the decay and say what it predicts
    title: The rate, falling
    place: Hazard & Forecasting
    scene: Day 1 had 96 events above magnitude 3. Day 2 had 52, day 3 41, day 4 26. Tanaka's fit has the rate roughly halving as the
      elapsed time doubles.
    guide: 'Five numbers, and two of them belong to other questions: the magnitude and the running total. One is day one, which is four
      doublings back rather than one. Ask of each whether it is a count, a time, or a ratio of times. And note what comes out: an expected
      rate, not a quota. Real days scatter either side of a fitted curve.'
    background:
    - Why an estimate rather than a calculation. Every quantity on this board is already measured or stated, so nothing here has to
      be derived. What is being tested is whether you can pick the quantities the relationship actually needs, and whether the size
      of the answer looks right once they are in place.
    - Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label is how
      a unit mismatch, or a quantity belonging to a different part of the problem, is caught before it is placed — which is the habit
      this format exists to build.
    assumes:
    - a rate can fall smoothly without ever reaching zero
    takeaway: Aftershock rates often decay roughly as a power law; the fitted rate is an expectation, not the number the next day must
      contain.
    format: BALLPARK
    question: Estimate the number of magnitude 3+ aftershocks on day 8.
    answerText: About 13.
    why: The exercise uses a simple Omori-style p ≈ 1 fit. If the rate is about 26 M3+ events per day around day 4, doubling the elapsed
      time to day 8 gives a first-order expectation near 13 per day. Real operational forecasts carry uncertainty and are updated as
      the sequence evolves. Thirteen is therefore a central rate estimate for planning, not a promise that exactly thirteen events will
      occur.
    estimate:
      prompt: Day 4 had 26 events above magnitude 3, and the rate falls roughly as 1 over elapsed time. Day eight is twice as far from
        the mainshock as day four.
      question: Choose the day-four count and the ratio of the two times.
      labels:
      - 26  (events on day 4)
      - 2  (day 8 is twice as far out)
      - 96  (events on day 1)
      - 6.8  (the mainshock magnitude)
      - 210  (total events so far)
      values:
      - 26
      - 2
      - 96
      - 6.8
      - 210
      slots: 2
      template: '{0} ÷ {1}'
      formula: a/b
      correct:
      - 0
      - 1
      target: 13
      tolerance: 4
      units: events
      solution: n ≈ 26 ÷ 2 ≈ 13 events on day 8.
      explanation: About 13. The day-one count and the running total describe the sequence so far, and the magnitude is the size of
        the mainshock rather than anything about the rate.
      givens:
      - Day 4 had 26 events above magnitude 3
      - Day eight is twice as far from the mainshock
      relationship: Rate ≈ K ÷ elapsed time, so doubling the time since the mainshock roughly halves the number of events per day.
  - group: SEIS
    task: Say what a forecast does not claim
    title: A rate is not a schedule
    concept: Probability of a larger event after a mainshock
    place: Seismic Network
    scene: The notice draft says the aftershocks will have stopped by the end of the month. Cardoso points at the sentence and asks
      where the month came from. The sentence is due for the afternoon public bulletin.
    guide: Put the fitted numbers through the decay law and see what day thirty actually gives. The rate falls as a power of the time
      since the mainshock, so pick the productivity, the time offset and the elapsed days, and read the answer as events per day. One
      tile is the exponent, which goes in the power and not in the denominator on its own.
    background:
    - 'What the law says. The rate of aftershocks per day falls roughly as one over the elapsed time raised to a power near one, with
      a small offset that keeps the first hours finite. It is a decay, not a countdown: the curve approaches zero and never arrives,
      which is why no end date can be read off it.'
    - Why a fitted rate is not a schedule. The number that comes out is an expectation over an interval — so many per day on average.
      Actual counts scatter around it, some days three and some days none, and a rate of a tenth of an event per day does not promise
      the tenth day is the one.
    - 'Why size is a separate question. The decay law describes how often, and the magnitude distribution describes how large. A falling
      rate lowers the chance of a large aftershock in the same proportion as a small one, and rules nothing out. Publishing a month
      is therefore two mistakes: an end where there is a fade, and a date where there is a rate.'
    takesAsRead:
    - Aftershock decay as a power law
    assumes:
    - a forecast states what is expected on average
    takeaway: An Omori–Utsu rate approaches zero gradually; operational forecasts integrate that rate over a future window and report
      uncertainty.
    format: BALLPARK
    question: At day 30 after the mainshock, what does the fitted decay law give as the expected rate?
    answerText: About 2.4 events per day above M2 at day 30 in the fitted model. That is an instantaneous expected rate, not the date
      the sequence ends.
    why: With the fitted toy model n(t)=84/(0.2+t)^1.05, the day-30 instantaneous rate is about 84/30.2^1.05 ≈ 2.4 events per day above
      M2. The model never supplies an 'end date'. A useful forecast asks about a future interval—tomorrow, the next week, the next month—and
      turns the fitted rate plus model uncertainty into expected counts and probabilities. That is the quantity an inspection schedule
      can use.
    estimate:
      prompt: The fit for this sequence is K = 84, c = 0.2 days, p = 1.05. The bulletin is being written for day 30 after the mainshock.
      question: Choose the productivity, and the elapsed-time term raised to the fitted power.
      labels:
      - 84  (K, the fitted productivity)
      - 35.6  ((c + t)^p at 30 days, with p = 1.05)
      - 30.2  (c + t at 30 days, before the power is applied)
      - 1.05  (p, the fitted exponent)
      - 0.2  (c, the offset in days)
      values:
      - 84
      - 35.6
      - 30.2
      - 1.05
      - 0.2
      slots: 2
      template: '{0} ÷ {1}'
      formula: a/b
      correct:
      - 0
      - 1
      target: 2.36
      tolerance: 0.4
      units: events a day above magnitude 2
      solution: 84 ÷ 30.2^1.05 = 84 ÷ 35.6 ≈ 2.4 a day, falling and never reaching zero.
      explanation: The aftershock rate is a fading expectation with a range around it. No end date falls out of a power law.
      givens:
      - K = 84, c = 0.2 days, p = 1.05
      - the bulletin is for day 30 after the mainshock
      relationship: The aftershock rate is n(t) = K / (c + t)^p — a power law that decays and never reaches zero.

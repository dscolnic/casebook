    - What is already decided and what is not. Marina Court is cordoned; nobody is going back in this week whatever a test says. The
      open question is whether the ground condition that damaged it requires action on the twelve buildings around it, and that is a
      question about the ground rather than about the building.
    - Why the most visible damage is the trap. A proposal to instrument the worst-damaged structure produces vivid results and answers
      a question that has been closed. It is the most defensible-sounding way to spend five days and learn nothing that changes a decision.
    - What generalising means here. A campaign of cone tests and boreholes across the Flats measures the fill itself, which every one
      of the thirteen buildings sits on. One result then bears on twelve open decisions instead of one closed one — the same money,
      an order of magnitude more use.
    assumes:
    - a decision can treat a symptom or a cause
    takeaway: The best next measurement is the one that can change the decision you still have to make, not the one that studies the
      most visible damage.
    format: VALUE
    question: Which investigation buys information that generalises beyond the one building already cordoned?
    value:
      hint: Open each proposal to see what decision its result could change. The five-day investigation window is fixed, and the current
        cordon remains in place during the work.
      budget:
        amount: 5
        unit: investigation-days
        label: Investigation window
      decision: Decide whether the ground condition that affected Marina Court also requires action on neighbouring blocks.
      options:
      - id: ground_campaign
        label: CPTs, boreholes and groundwater checks across the Flats corridor
        cost: 3
        axis: extent of susceptible ground
        decisive: true
        reveals: Whether the same loose saturated layers and groundwater conditions continue beneath neighbouring blocks.
      - id: lean_monitor
        label: Increase Marina Court lean monitoring
        cost: 1
        axis: motion of the known building
        decisive: false
        reveals: Whether the already-cordoned building is continuing to rotate or has stabilised over the monitoring window.
      - id: demolition_plan
        label: Advance demolition engineering for Marina Court
        cost: 4
        axis: removal of the known hazard
        decisive: false
        reveals: How the known building could be removed safely, without establishing whether nearby buildings share its ground condition.
      - id: underpin_concept
        label: Develop an underpinning concept for Marina Court alone
        cost: 4
        axis: single-building intervention
        decisive: false
        reveals: How one foundation might be strengthened, without mapping the extent of the underlying susceptible fill.
    answerText: Buy the corridor-wide ground investigation. Marina Court still needs its cordon and monitoring, but CPTs, boreholes
      and groundwater data can show whether the same failure mechanism threatens neighbouring blocks. Demolition or underpinning may
      later be justified, but neither answers the town-wide ground question.
    why: Demolition can remove Marina Court as a visible hazard, but it does not reveal whether the same ground condition extends beneath
      nearby buildings. A corridor investigation can. CPTs, boreholes and groundwater checks test the ground shared by several sites
      while the existing cordon controls the known building hazard. Extra lean monitoring or a one-building underpinning concept answer
      narrower questions. Value of information therefore depends on the decision the evidence can change, not on how dramatic or precise
      the proposed work sounds.
    evidence: The raft is uncracked and the frame is plumb within itself. 12 blocks stand on the same fill. Demolition would take three
      weeks and cost about the same as investigating the whole Flats. Nobody is inside the building. The lean has not changed in three
      days of readings.
- title: The one everybody assumed was fine
  objective: Re-open a green school before 400 children return, and find the load-path failure a street inspection could not see.
  briefing: Bay Road School is green, term starts in a week, and nobody has been inside the gym.
  stake: Tuesday, and the school is the quiet problem. Bay Road School came through with a green placard. Its classrooms look untouched.
    The district would like 400 children back in it next week. Alan Whitcombe placarded the school on day one from the street outside.
    On his second list he wrote that the gymnasium was locked. That gym is a single-storey hall with a long-span roof. It has no internal
    walls. Its side walls are heavy precast panels. Nobody has been inside it since the quake. Marisol Okonkwo has the keys this morning.
    You need to know what holds walls like those to a roof like that. Today you decide whether 400 children go into that hall on Monday.
  takeaway: A green exterior does not clear an interior condition that was never inspected.
  stops:
  - group: STRUCT
    task: Assemble the horizontal load path from panel inertia to the ground, then identify the required transfer whose failure opens
      that path.
    title: A hall with nothing in the middle
    place: Structural Assessment
    scene: Bay Road School's gym has a long roof, heavy precast wall panels and no interior bracing line. The structural drawings are
      pinned across a table. One panel connection tested poorly, but the larger members look undamaged.
    guide: 'Build the path the sideways force actually takes, in order, from the moving mass to the ground. Then name the one required
      transfer that would break the path if it went. The largest member is not automatically the answer: a path is only as good as its
      weakest handover, and the readings on each link tell you which handover that is.'
    background:
    - What a lateral system is. In an earthquake the mass of the building wants to keep going sideways while the ground moves under
      it. That inertia has to be carried by something, handed on, and eventually delivered to the foundation. Each of those handovers
      is a connection, and a connection that cannot carry its share ends the path there.
    - 'Why a gym is the hard case. A long roof with heavy precast panels and no interior bracing line has very few paths available:
      the roof has to act as a horizontal plate and hand its load to the end walls, and the panels have to be tied into that plate.
      Remove one tie and the panel is a free-standing wall carrying its own inertia.'
    - Why undamaged members are not reassurance. The beams and columns can be in perfect condition while the connection between them
      is not, and a connection is exactly what the drawings say least about. One panel connection tested poorly, which is a statement
      about the class of connection rather than about that panel.
    assumes:
    - a horizontal force has to travel through a building to reach the ground
    takeaway: A lateral system works only when every required transfer carries force continuously from the moving mass to the foundation.
    format: CHAIN
    question: Which link governs the panel load path when the building shakes sideways?
    chain:
      hint: Arrange the force transfers from the moving panel to the ground. Then choose the required link whose loss would open the
        otherwise continuous path.
      distractor: panel_body
      links:
      - id: panel_inertia
        label: Horizontal inertia of the precast panel
        transfers: lateral inertial force within the panel
      - id: panel_tie
        label: Tie between the precast panel and the roof
        transfers: panel force into the roof diaphragm
      - id: roof_diaphragm
        label: Roof diaphragm carrying force toward the end wall
        transfers: collected lateral force across the roof
      - id: end_wall
        label: Resisting end wall or frame
        transfers: roof shear into the vertical lateral system
      - id: foundation
        label: Foundation and ground
        transfers: base shear into the ground
      - id: panel_body
        label: The large precast panel body
        transfers: internal forces within the panel
      order:
      - panel_inertia
      - panel_tie
      - roof_diaphragm
      - end_wall
      - foundation
      governing: panel_tie
    answerText: The force path is panel inertia → panel-to-roof tie → roof diaphragm → resisting wall or frame → foundation. The governing
      link is the panel-to-roof tie. If that connection lets go, the size of the panel, roof and end wall cannot preserve a continuous
      path for the panel force.
    why: 'Earthquake inertia does not disappear because the visible structural members are large. A base-shear relation such as V =
      C_sW estimates a total lateral demand, but that force still needs a continuous path to the ground. For the gym panel, inertia
      crosses the panel-to-roof tie, enters the roof diaphragm, reaches the resisting end wall or frame, and then reaches the foundation.
      The small tie is therefore load-bearing in the literal sense: if it opens, the rest of the strong path cannot collect that panel''s
      force.'
  - group: MAT
    task: Compare the measured anchor capacity with the estimated earthquake demand
    title: What the tested anchors actually carried
    concept: Measured connection capacity versus assessed demand
    place: Materials & Testing
    scene: Kirsten Sørensen has pulled two cast-in anchors from a spare panel in the yard. The design drawing says 40 kilonewtons each.
      The first came out at 24, the second at 27.
    guide: 'Five numbers, and two of them belong to other questions: the roof span and the number of panels. One is what the drawing
      promised rather than what the wall got. Ask of each whether it describes what the anchors carried or what the wall asks of them.
      And note what two pulls cannot carry: a ratio is not a factor of safety, whatever it comes out at.'
    background:
    - Why an estimate rather than a calculation. Every quantity on this board is already measured or stated, so nothing here has to
      be derived. What is being tested is whether you can pick the quantities the relationship actually needs, and whether the size
      of the answer looks right once they are in place.
    - Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label is how
      a unit mismatch, or a quantity belonging to a different part of the problem, is caught before it is placed — which is the habit
      this format exists to build.
    assumes:
    - a designed capacity is a claim to be checked
    takeaway: Two pull tests can demonstrate a serious shortfall, but they do not define the statistical design resistance of every
      anchor in the school.
    format: BALLPARK
    question: Estimate the observed capacity-to-demand ratio for the two tested anchors.
    answerText: About 0.8 — below 1.
    why: 'The two pulls average 25.5 kN against an assessed demand of 31 kN, so the observed specimen-capacity-to-demand ratio is about
      0.82. That is enough to show that the tested connection detail cannot simply be accepted from the 40 kN drawing value. It is not
      a code resistance factor or a formal factor of safety: two specimens do not characterize variability, failure mode, deterioration
      or the required design margins. The operational decision does not need those questions settled today—keep the gym restricted,
      expand the testing, and design the connection repair.'
    estimate:
      prompt: The 2 anchors tested at 24 kN and 27 kN. The assessed demand on each anchor from this earthquake is 31 kN.
      question: Choose the tested capacity and the demand.
      labels:
      - 25.5 kN  (mean tested capacity)
      - 31 kN  (assessed demand)
      - 40 kN  (the drawing's design capacity)
      - 34 m  (the roof span)
      - 8  (panels on this wall)
      values:
      - 25.5
      - 31
      - 40
      - 34
      - 8
      slots: 2
      template: '{0} ÷ {1}'
      formula: a/b
      correct:
      - 0
      - 1
      target: 0.82
      tolerance: 0.12
      units: (ratio)
      solution: Observed ratio = 25.5 ÷ 31 ≈ 0.82.
      explanation: About 0.82, below 1. This is an observed ratio from two specimens, not by itself a formal code factor of safety;
        variability and design resistance factors still matter.
      givens:
      - The anchors tested at a mean of 25.5 kN
      - The assessed demand on each is 31 kN
      relationship: Observed capacity-to-demand ratio = mean tested capacity ÷ assessed demand.
  - group: SAFE
    task: Say what happens to term
    title: 400 children on Monday
    concept: Placarding as a decision under uncertainty
    place: Public Safety
    scene: 400 children are due back Monday. The classrooms are sound and the gym is not. Halvorsen has parents calling, the district
      has no spare campus, and the morning bus schedule depends on whatever answer comes off this table.
    guide: All four options are defensible readings of one site with two different buildings on it. Ask of each whether it treats the
      site as one thing or as parts. The classrooms and the gym have different evidence behind them. Four hundred children arrive Monday
      and there is no spare campus. A decision that covers both buildings equally is ignoring half of what was measured.
    background:
    - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading — a
      step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each belongs to is
      where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole
      game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before it was fixed.
      It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken out of them deliberately.
    - 'What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option fails,
      not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made for an approximate
      reason is indistinguishable from a sound one until the day the approximation is what is being tested.'
    assumes:
    - a building can be used in part
    takeaway: The useful question is which parts can be occupied, not whether the site is open or shut.
    format: CHOICE
    question: What should happen to Bay Road School on Monday?
    why: The useful decision is component-specific. The classroom block has no identified structural deficiency, while the gym has heavy
      panels attached by connections whose tested capacity is below the estimated demand. If the gym can be physically isolated from
      classroom access and egress, the classrooms can reopen while the hall remains closed and the connections are repaired. If routes
      or falling hazards overlap, that separation has to be solved first. Partial occupancy is not optimism; it is a controlled use
      tied to the actual defect.
    choices:
    - Open the whole site; the placard is green and the classrooms are undamaged.
    - Open the classrooms and close the gymnasium until the panel connections are fixed.
    - Close the whole site until every building on it has had a detailed evaluation.
    - Open the site but hold all classes in the gymnasium, which has no internal walls to fall.
    answer: Open the classrooms and close the gymnasium until the panel connections are fixed.
    rebuttals:
    - The green placard covered what could be seen from outside, and the gym was locked.
    - Closing the classrooms protects nobody, since nothing in them is deficient.
    - The gym is the worst room on the site, not the safest — its walls are the ones tied on by anchors that tested below demand.
- title: The hospital, and what waiting costs
  objective: Resolve the hospital restriction using only evidence that can still change the decision, while counting the harm caused
    by delay.
  briefing: 90 patients, 3 days of yellow, and an argument about whether more evidence is worth more time.
  stake: Wednesday, and the hospital has been yellow for four days. Peter Ives has 90 patients on the ground floor. The 2 upper floors
    are shut. The district's surgery is being done 60 kilometres away. Two people have already been moved who would not have been. Marisol
    Okonkwo wants the plant room opened and the shear walls cored before she signs. Bram Halvorsen says every day of that is a day of
    care not given. This morning he is right. The tests Okonkwo wants will take four days. They will not change what the building is.
    Today you decide what evidence, if any, is worth the wait.
  takeaway: More evidence is valuable only when it can change a decision enough to justify the time and cost of getting it.
  stops:
  - group: STRUCT
    task: Inspect what backs each recorded claim, then spend the single direct-verification visit before the placard review.
    title: The part nobody has seen
    concept: Peak ground acceleration and what a building feels
    place: Structural Assessment
    scene: 90 patients remain on the ground floor while 2 upper floors sit empty. The hospital is still yellow after three days. Frame,
      cladding and stair are documented. The roof plant room remains locked, with two full water tanks above it.
    guide: 'Each claim on the list is signed or checked by somebody. Open the backing before you spend anything: some claims rest on
      an inspection of the thing they describe, and some rest on a document, an assumption or a locked door. You have one physical verification.
      Hold the claims the evidence does not support, and spend the visit where being wrong would cost the most.'
    background:
    - 'What a record is and is not. A signature says somebody took responsibility for a statement. It does not say the condition was
      observed, and on a building three days after an earthquake those two come apart constantly: drawings are checked, cladding is
      looked at from the street, and a locked plant room is written up from the last inspection before the shake.'
    - Why the tanks matter. Two full water tanks are mass, high up, in a room nobody has entered since the earthquake. If their supports
      have moved, the consequence lands on the floor below — where ninety patients are. The claim about that room is therefore the one
      whose being wrong costs the most, whatever its paperwork says.
    - Why one check rather than four. Verification costs time the hospital does not have while it stays yellow. Choosing which claim
      to check is the actual professional judgement, and it is a judgement about consequence rather than about which record looks flimsiest.
    takesAsRead: null
    assumes:
    - a building's parts can be cleared separately
    takeaway: A signed or checked record is useful only to the extent that it is backed by observation of the condition it claims.
    format: ATTEST
    question: Which critical claim still needs physical verification on the current building?
    attest:
      hint: Open the backing attached to each claim before spending the visit. You have one direct verification before the placard review.
      checks: 1
      checkUnit: direct verification visit
      claims:
      - id: frame
        label: The reinforced-concrete frame has no observed condition requiring the current restriction
        critical: true
        backed: true
        evidence: Three days of frame inspection on all accessible floors.
      - id: cladding
        label: The external cladding does not present the unresolved structural issue
        critical: false
        backed: true
        evidence: Cladding inspection completed on day two.
      - id: stairs
        label: The main stair and egress route are usable for the proposed occupancy
        critical: true
        backed: true
        evidence: The stair core was directly inspected because it is the main escape route.
      - id: plant_room
        label: The roof water-tank restraints are adequate for the proposed occupancy
        critical: true
        backed: false
        evidence: No direct observation; the roof plant room remains unvisited.
    answerText: Verify the roof plant room. The frame, cladding and stairs already have direct observations behind them. The two full
      water tanks and their restraints are the critical condition nobody has seen, so that unbacked claim is the one holding the placard
      review open.
    why: A yellow placard should reduce to specific unresolved conditions, not a general feeling that more inspection is always safer.
      The frame, cladding and main stair already have direct observations behind their claims. The roof plant room does not. Its full
      water tanks add substantial mass high in the building, and nobody has seen their restraints. With one verification visit, repeating
      a comfortable backed inspection wastes the chance to resolve the one critical claim that still lacks physical evidence on the
      present configuration.
  - group: HAZ
    task: Put the cost of waiting into the same units
    title: What four more days buys
    place: Hazard & Forecasting
    scene: Tanaka has the aftershock rate for the coming week. Ives has the transfer log. Halvorsen wants both of them stated as consequences
      rather than as principles. The review board meets again at the end of the week.
    guide: All four options are ways of weighing four days. They differ in what they count. Ask of each whether it prices the delay,
      the evidence, or neither. The frame has already been inspected and the unresolved item is a roof plant room nobody has entered.
      So the real test is what this evidence could change, and coring answers a different question.
    background:
    - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading — a
      step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each belongs to is
      where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole
      game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before it was fixed.
      It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken out of them deliberately.
    - 'What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option fails,
      not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made for an approximate
      reason is indistinguishable from a sound one until the day the approximation is what is being tested.'
    assumes:
    - a delay has consequences that can be counted
    takeaway: A decision to wait is a decision with an outcome, and it has to be compared with the outcome of deciding now.
    format: CHOICE
    question: How should the office weigh four more days of evidence-gathering?
    why: 'Both sides of the decision have consequences and both can be estimated. Delay carries transfers, postponed care and operational
      strain. Additional testing is worthwhile when it has a realistic chance of changing the safety decision. Here the frame has already
      been inspected and the unresolved item is the unvisited roof plant room with heavy tanks; a four-day coring programme answers
      a different question. The disciplined test is therefore value of information: what decision could this evidence change, how likely
      is that, and what is paid while waiting for it?'
    choices:
    - Evidence always comes first; the delay is unfortunate but not the engineer's concern.
    - Against what the delay costs, and what the evidence could change.
    - By the aftershock forecast alone, since that is the hazard the placard is about.
    - By what the hospital's management prefers, since they carry the operational risk.
    answer: Against what the delay costs, and what the evidence could change.
    rebuttals:
    - Evidence-first is a good instinct and not a rule; the question is what this evidence could change.
    - The forecast bears on the hazard but says nothing about the cost of the building standing empty.
    - Management carries the operational risk and does not get to set the engineering standard.
  - group: SEIS
    task: Check what the hospital actually experienced
    title: The instrument in the basement
    concept: 'Response spectrum: turning a measured ground-motion record into period-specific demand'
    place: Seismic Network
    scene: There is an accelerograph in the hospital basement, installed in 1998 and finally useful. Cardoso has processed the record
      into a 5%-damped response spectrum. Around the hospital's roughly 0.4 s fundamental period, the spectral acceleration is about
      0.31 g. The comparable screening coefficient used for the old design check is 0.35.
    guide: Do not use the raw peak ground acceleration as though the whole building were a rigid block. Use the period-specific spectral
      ordinate already read from the record, then apply the same simplified V = C·W screening relation used in the design comparison.
    background:
    - What the instrument gives you. An accelerograph records acceleration versus time. From that record, engineers can compute a response
      spectrum showing the demand on idealized oscillators at different periods.
    - Why period matters. A multi-storey building does not necessarily respond at the instant of the record's largest ground acceleration.
      The spectrum near the building's period is a better screening input than raw PGA for comparing dynamic demand.
    - What the comparison still cannot prove. A simplified spectral base-shear screen does not inspect the plant-room restraints, duration
      effects, higher modes, irregularity or damaged details. A value below the historical design comparison is useful evidence, not
      a clearance.
    takesAsRead:
    - Peak ground acceleration and what a building feels
    - P and S waves, and what the gap between them measures
    assumes:
    - a building can be instrumented, and the record is about that building
    takeaway: A building record is most useful when converted to the response quantity the structure actually uses; raw PGA is not automatically
      the building base shear.
    format: BALLPARK
    question: Using the period-specific spectral coefficient, what simplified base-shear demand does the record imply, compared with
      the old design check?
    answerText: About 26 MN from the recorded 0.31 spectral coefficient, versus about 30 MN from the 0.35 design-check coefficient.
    why: 'For this screening calculation the same simplified relation is used on both sides: V = C·W. The processed record gives C ≈
      0.31 at about 0.4 s and the hospital''s seismic weight is about 85 MN, so V ≈ 0.31 × 85 ≈ 26 MN. The historical design-screen
      coefficient 0.35 gives about 30 MN. The useful result is a like-for-like comparison of a measured period-specific demand with
      the old screening check. It is not proof that every component remained below capacity, and it is deliberately not obtained by
      treating raw PGA as the force coefficient for the entire building.'
    estimate:
      prompt: The hospital's seismic weight is about 85 MN. From the recorded motion, the 5%-damped spectral coefficient near the building's
        0.4 s period is 0.31; the comparable historical design-screen coefficient is 0.35.
      question: Choose the recorded coefficient and the building's seismic weight.
      labels:
      - 0.31  (recorded spectral coefficient near T ≈ 0.4 s)
      - 85  (W, the building's seismic weight in MN)
      - 0.35  (historical design-screen coefficient)
      - 14  (the weight of one floor, in MN)
      - 1998  (the year the instrument was installed)
      values:
      - 0.31
      - 85
      - 0.35
      - 14
      - 1998
      slots: 2
      template: '{0} × {1}'
      formula: a*b
      correct:
      - 0
      - 1
      target: 26.35
      tolerance: 2
      units: meganewtons (MN) of base shear
      solution: 0.31 × 85 ≈ 26 MN, versus 0.35 × 85 ≈ 30 MN for the historical screening check.
      explanation: A useful like-for-like screening comparison, not a clearance and not a conversion of raw PGA directly into building
        force.
      givens:
      - the hospital is about four storeys, giving a rough fundamental period near 0.4 s for this exercise
      - seismic weight is about 85 MN
      - the recorded response spectrum gives about 0.31 g near that period; the old comparison used 0.35
      relationship: For this simplified screen, V = C · W using the period-specific spectral coefficient C. Raw PGA is not substituted
        for C.
  - group: STRUCT
    task: Sort the damage photographs before the panel sits.
    title: The frame, or the finish
    concept: Load path, and what happens where it stops
    place: Structural Assessment
    scene: Four hundred photographs came in from the rapid assessment and the panel sits at four. Some of what is in them is the structure.
      The rest is what was hung on it, and the two produce the same alarm in a caption.
    guide: 'Two bins. Structural damage is to the things carrying load down to the ground — columns, beams, walls that hold something
      up, connections between them. Non-structural damage is to what the building carries: cladding, ceilings, partitions, services.
      Sort on whether the item is in the load path.'
    background:
    - Why the split decides the placard rather than the repair bill. A cracked partition is expensive and does not change whether the
      building stands up in the next aftershock. A cracked column does, and it can be behind a partition that looks fine.
    - Why non-structural damage still kills people. Falling cladding, a collapsed ceiling grid and a toppled bookcase all injure. They
      are dealt with by clearing and securing rather than by shoring, which is a different crew and a different day.
    assumes:
    - some parts of a building hold it up and some are carried by it
    takeaway: What decides occupancy is what is in the load path, not what looks worst.
    format: BELT
    question: Send each photograph to the bin that says whether it is in the load path.
    answerText: Anything carrying load to the ground is structural. Anything the building carries is not, however alarming it looks.
    why: 'The placard question is whether the building will stand up to the next shake, and only what carries load answers it. Columns,
      beams, shear walls and their connections are the path down to the foundation, and damage to any of them changes capacity. A shattered
      partition, a collapsed ceiling grid, cladding hanging off a facade and a toppled bookcase are all carried *by* that path, and
      none of them makes the frame weaker. That is why the sort matters more than it sounds: the alarming photographs are mostly non-structural,
      and the photograph that decides the placard is often a hairline diagonal on a column behind an intact wall. Non-structural damage
      still injures people — falling cladding is the commonest injury in a moderate earthquake — so the answer is not that it does not
      matter. It is that it wants a different crew, a different urgency, and no shoring.'

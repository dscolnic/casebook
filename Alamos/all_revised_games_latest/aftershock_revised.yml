    - 0
    - 1
    - 2
    - 3
  - group: GEO
    task: Hold the dewatering while the excavation stands open.
    title: The water table, while the trench is open
    concept: Effective stress, and why water pressure matters
    place: Geotechnical
    scene: The trench for temporary shoring must stay open through the afternoon in saturated fill that liquefied nine days ago. Wellpoints
      keep the groundwater below the excavation. If the water rises too close to the floor, effective stress falls and seepage or local
      instability can develop before the shoring is complete.
    guide: Keep the groundwater level inside the safe band by matching persistent inflows with pumping. The band narrows later in the
      exercise because the staged excavation leaves less hydraulic margin as work proceeds—not because sand automatically loses strength
      merely from being exposed to time.
    background:
    - Why water level matters. Higher pore-water pressure reduces effective stress in the soil skeleton. Around an excavation, adverse
      hydraulic gradients can also drive seepage, piping or boiling.
    - Why inflow is a rate. Rain, a leaking main and harbour groundwater can continue feeding the excavation. A short burst of pumping
      does not balance a persistent inflow.
    - Why this is related to—but not the same as—liquefaction. Earthquake liquefaction is produced by cyclic loading that generates
      excess pore pressure. Excavation instability from groundwater is a static seepage/effective-stress problem unless new shaking
      occurs.
    assumes:
    - water pressure between grains reduces the strength of sandy ground
    takeaway: Dewatering protects an excavation by controlling pore pressure and hydraulic gradients; that is related to effective stress
      but is not slow-motion earthquake liquefaction.
    format: HOLD
    question: Hold the water table below the trench floor while the shoring goes in.
    answerText: Keep the groundwater inside the safe band by matching sustained inflows with sustained pumping, then report any loss
      of hydraulic margin before the next excavation stage.
    why: 'Raising groundwater increases pore pressure and reduces effective stress. In an open excavation, a sufficiently adverse hydraulic
      gradient can also produce seepage, piping or boiling. That is why the pump has to match continuing inflow rather than react only
      after the gauge has moved. This is not liquefaction ''arriving slowly'': liquefaction requires cyclic loading to generate excess
      pore pressure. The game narrows the permitted band as the staged work proceeds to represent a smaller allowed hydraulic margin
      while shoring is incomplete.'
    hold:
      quantity: Water table below the trench floor
      unit: m
      control: Wellpoint pumps
      hold: 1.5
      band: 0.4
      narrowTo: 0.2
      duration: 45
      direction: raise
      authority: 0.1
      pass: 0.8
      hint: Each inflow keeps arriving. Set the pumps to match it rather than starting them when the gauge moves.
      disturbances:
      - label: Rain starts on the fill
        at: 4
        amount: -0.03
      - label: Tide goes out in the harbour
        at: 20
        amount: 0.05
      - label: The leaking main is found
        at: 38
        amount: -0.045
      commit: Report the afternoon
- title: A quiet day on the bench
  objective: Use the quiet day to understand why Upper Town survived and turn one repeated parapet failure into a targeted retrofit.
  briefing: Upper Town has been assessed, cleared and forgotten. Somebody should look at it properly.
  stake: Monday, and for the first time in ten days nothing is on fire. The Flats have their programme. The hospital is open. The school
    is running in its classrooms. Marisol Okonkwo spends a day like this on the half of town nobody is asking about. Upper Town was
    cleared fast, on the strength of still standing up. Standing up is not the same as undamaged. Alan Whitcombe walks the Parade with
    her this morning. The street is heavy old brick. You need to know what ties a wall like that to the floors behind it. Today you
    decide what is worth doing to buildings that are nobody's emergency yet.
  takeaway: A surviving building can reveal the load-path detail that prevented a much larger failure.
  stops:
  - group: STRUCT
    task: Say why the masonry failed the way it did
    title: Walls that fall outward
    concept: Unreinforced masonry, and why it fails outward
    place: Structural Assessment
    scene: Owners are asking when the Parade can reopen. Every parapet fell outward into the street, while the buildings behind them
      remain standing. Timber floors are still connected. The fallen masonry is tagged by frontage, and the barriers are still up.
    guide: Follow the sideways force from the shaking ground up through the building and name the link that gave way. Each step carries
      a reading saying what restraint it can actually provide. The heaviest element on the board is not automatically the one that failed,
      and neither is the first step in the path.
    background:
    - Why out of plane. Masonry is strong in compression and weak in tension, so a wall pushed sideways cannot hold itself up by bending.
      It stays standing only while something ties it back at intervals — a floor, a roof, or a strap into the diaphragm. Where the tie
      stops, the wall is a free cantilever.
    - Why the parapet and not the wall. The wall below is held by the timber floors, which are still connected and did their job. The
      parapet projects above the roof line with nothing above it and nothing behind it, so the whole horizontal force it collects has
      to be resisted at its base, in bending, by mortar.
    - Why this is the useful kind of failure. It is local, repeatable and explained by one missing connection, so the retrofit targets
      the tie rather than the building. A frontage whose parapet is anchored back to the roof structure is a different proposition from
      one whose whole wall needs work.
    assumes:
    - masonry is strong in compression and weak in tension
    takeaway: Unbraced parapets are vulnerable to out-of-plane inertia; the missing restraint can make a local connection retrofit more
      important than strengthening the whole wall.
    format: CHAIN
    question: Trace the sideways force through the frontage and name the link that failed.
    answerText: The load path stops at the unbraced parapet. Its out-of-plane inertia has no positive tie into the roof diaphragm, so
      bending and weak masonry/mortar at the base become the local failure mechanism.
    why: Horizontal shaking gives the parapet an out-of-plane inertia force. Below roof level, the wall is restrained by connected floors
      and can transfer load into the diaphragms and cross walls. Above the roof, the parapet in this scenario lacks a positive brace
      or anchor back to the structure. The unsupported top therefore behaves much more like a cantilever, and weak masonry/mortar at
      the base can fail in bending or rocking. The useful diagnosis is the missing restraint in the load path; the retrofit must be
      designed around a verified anchorage capacity rather than assuming every surviving wall has the same detail.
    chain:
      links:
      - id: mass
        label: Parapet mass collecting horizontal inertia
        transfers: 1.1 m of free-standing brickwork, about 9 kN per metre of frontage
      - id: bed
        label: Mortar bed at the parapet base, resisting that force in bending
        transfers: about 2 kN per metre in tension across the bed, with no tie above it
      - id: wall
        label: Wall below roof level, held by the timber floors
        transfers: restrained every 3.2 m, capacity about 34 kN per metre of wall
      - id: floors
        label: Timber floor diaphragms into the cross walls
        transfers: still connected, carrying an estimated 210 kN in plane
      - id: crosswalls
        label: Cross walls down to the footings
        transfers: 640 kN capacity, the heaviest element on the frontage
      order:
      - mass
      - bed
      - wall
      - floors
      - crosswalls
      governing: bed
      distractor: crosswalls
  - group: MAT
    task: Spend the listed-façade disturbance allowance on the test that can actually support the proposed anchor design.
    title: What you can learn without breaking it
    place: Materials & Testing
    scene: Ferreira has four test proposals for the Parade's listed brickwork. The scaffold permit allows one small trial location this
      week, and owners will not accept large-scale destructive sampling. A tie-back design still needs a defensible capacity number.
    guide: 'Four tests are on the table and the permit allows one trial location. Open each card: it says what the test measures and
      how much listed fabric it consumes. The tie-back design needs a defensible pull-out capacity, so the test worth buying is the
      one that measures that property — not the one that produces the most precise number about something else.'
    background:
    - What the design actually needs. A tie-back is only as good as what it is anchored into, so the number the drawing needs is how
      much force an anchor in this brickwork can carry before it pulls out. Compressive strength, mortar composition and moisture content
      are all real properties of the wall, and none of them is that number.
    - Why precision is not value. A laboratory can give three significant figures on a property the design does not use, and the report
      will look better than a crude pull-out test with wide scatter. The question is which measurement changes the decision, which is
      the same question VALUE asks in every game that has one.
    - 'Why the fabric cost is on the card. This is listed brickwork: every test damages something that cannot be replaced, and the owners
      have already refused large-scale sampling. A test''s cost here is not money but heritage, which makes choosing well a conservation
      decision as much as an engineering one.'
    assumes:
    - a test can be destructive, semi-destructive or neither
    takeaway: A precise test is valuable only when it measures the property that the pending design decision actually needs.
    format: VALUE
    question: Which measurement answers the capacity question the retrofit depends on?
    value:
      hint: Open each test card and read both what it measures and how much listed fabric it consumes. The design decision is about
        a tie anchor in the existing wall.
      budget:
        amount: 1
        unit: fabric-impact points
        label: Listed-façade disturbance allowance
      decision: Choose a measurement that can support the pull-out capacity used in the proposed tie-back design.
      options:
      - id: pullout
        label: Pull-out test on a trial anchor in the existing brickwork
        cost: 1
        axis: anchor pull-out capacity
        decisive: true
        reveals: The force a representative installed anchor can transfer before pull-out in the existing wall.
      - id: brick_core
        label: Cut masonry samples for compressive testing
        cost: 4
        axis: brick compressive strength
        decisive: false
        reveals: The compressive strength of removed masonry samples, not the installed anchor pull-out capacity.
      - id: rebound
        label: Rebound-hammer survey across the façade
        cost: 0.2
        axis: surface hardness
        decisive: false
        reveals: Relative surface hardness and variability across the façade without an anchor-capacity measurement.
      - id: mortar
        label: Visual and penknife survey of mortar joints
        cost: 0.1
        axis: mortar condition
        decisive: false
        reveals: Where mortar is soft or deteriorated, useful context that does not quantify tie-anchor pull-out resistance.
    answerText: Use the disturbance allowance on a representative trial-anchor pull-out test. It measures the capacity the proposed
      tie-back actually needs in the real wall. Brick crushing, rebound hardness and mortar condition may be useful supporting evidence,
      but none provides the anchor pull-out capacity needed for this design.
    why: The design question is whether an anchor installed in this old wall can transfer the required force. A trial-anchor pull-out
      test measures that property directly in the existing masonry and at the intended embedment. Brick compressive strength, rebound
      hardness and mortar condition can all describe parts of the wall, but none is the same as anchor pull-out capacity. The listed
      façade also makes disturbance a real cost. The best test therefore couples decision relevance with the smallest adequate physical
      intervention.
  - group: SEIS
    task: Decide what is worth doing now
    title: Before the next one
    place: Seismic Network
    scene: Nothing on the Parade is dangerous today. The same parapets, on the same walls, will be here for the next earthquake, and
      the recurrence interval on this fault is about 140 years.
    guide: Every parapet on the Parade came down and no wall behind one did. Tying back costs about £8,000 a building while the scaffolding
      stands, and about £25,000 once it is gone. A detailed assessment of one building takes three weeks and produces no strengthening.
      The grant scheme opens in eleven months and is oversubscribed in its first week. Lightweight replacement needs the parapets down
      first and a consented design, which is next summer at the earliest. The last event was six days ago.
    rules: Spread the hundred points across the 4 proposals. At least 75 of them have to be committed, because a panel that funds almost
      nothing has not decided anything. Your largest single allocation must be 35 or more, and it has to land on what the evidence supports
      most. Keep the total sitting on proposals the evidence does not support under fifteen. And a proposal it does support should not
      be left under twenty.
    background:
    - Why the whole spread is graded. Funding is not a vote for one idea. A portfolio says what you think is likely, what is worth hedging
      against, and what is not worth pursuing at all — and the last two are where most of the information is. Backing the right proposal
      while quietly funding a bad one is a worse answer than it looks. That is why the small numbers count as much as the big one.
    - 'What the three numbers are for. Thirty-five is what makes a lead a lead: below it you have hedged rather than chosen. Fifteen
      is the most that can sit on unsupported work before it stops being a rounding error. Past that it is a second opinion nobody argued
      for. Twenty is the floor under a line of work you have already called strong, because funding it too thin to finish spends the
      money and buys nothing.'
    - Why there is a floor on the total. Points held back are not caution; they are a decision not to decide, taken with somebody else's
      money and somebody else's deadline. The floor is what forces the panel to say something.
    assumes:
    - a hazard that has occurred will occur again
    takeaway: Fix a repeatedly observed, low-cost life-safety failure mode while access is already in place; do not let an average recurrence
      interval become a countdown clock.
    format: SCIENCETANK
    question: Decide what is worth doing now
    why: 'Tying parapets back has an unusually strong case: the failure mode occurred repeatedly, the retrofit acts directly on it,
      and scaffolding already in place makes the marginal cost much lower. The quoted 140-year recurrence interval is not a promise
      of 140 quiet years after this event; earthquakes do not reset a calendar. That statistic belongs in long-term hazard context,
      not in the argument for waiting. Act now because the defect is known, the consequence is falling masonry, and the cheapest access
      window is open.'
    proposals:
    - label: A
      text: Tie the parapets back to the floor structure now, while the scaffolding is up.
    - label: B
      text: Commission a detailed seismic assessment of each building on the Parade.
    - label: C
      text: Wait for the strengthening grant scheme, which opens next year.
    - label: D
      text: Demolish the parapets and rebuild them in lightweight material later.
    recommended:
      A: 55
      D: 20
- title: The record that was wrong all along
  objective: Trace every conclusion that depended on the reference station, correct the measured site-response ratio and withdraw the
    design shortcut that copied one ratio into every future building.
  briefing: The reference station is not on competent bedrock. One correction now runs through every conclusion that used it.
  stake: 'Tuesday, and Inês Cardoso has found the reference error. The station above Upper Town was treated as competent bedrock, but
    the 1998 trench log shows several metres of weathered, fractured granite beneath it. A temporary sensor on nearby competent rock
    has now recorded five days of common aftershocks with the vault. In the 1 Hz band used for the Flats comparison, the vault motion
    is about 1.6 times the competent-rock motion. That means the published Flats-to-vault spectral ratio of about 3 was understating
    the Flats-to-rock ratio. The correction matters. So does a second mistake: the district planning memo copied that single-band ratio
    straight into a universal design-demand factor. You have to decide what gets corrected, what gets withdrawn and what remains untouched.'
  takeaway: A bad reference contaminates only the conclusions that depend on it; correcting a measurement does not justify turning one
    event-specific ratio into a universal design factor.
  stops:
  - group: SEIS
    task: Open the dependency chain behind each conclusion, keep the ones that stand independently, and identify the shared reference
      source behind the conclusions that must be revised.
    title: Measuring against the wrong zero
    place: Seismic Network
    scene: Cardoso's five-day side-by-side check is finished, and the benchmark used since day one no longer stands unchanged. Navarro
      lays five fortnight conclusions beside the corrected station report. Some may survive untouched; others may force a redraw before
      the next briefing.
    guide: 'Open a conclusion and the panel shows what it was computed from. Keep the ones that stand on a measurement of their own,
      and untick the ones whose chain runs through the corrected reference. Then name the source the failing ones share. Both halves
      are graded: throwing away an independent conclusion costs you as much as keeping a dependent one.'
    background:
    - What a shared reference is. Every station's record is interpreted against an assumed site response, and one station's has been
      corrected after five days of side-by-side comparison. Anything computed through that station inherits the correction; anything
      measured elsewhere does not. The error is not in the instrument — it is in one number every dependent conclusion was divided by.
    - 'Why untangling matters more than caution. The safe-looking move is to withdraw the whole fortnight, and it is wrong twice over:
      it throws away conclusions that were never affected, and it tells the next briefing that nothing is known when several things
      are. A retraction is a claim too, and it should be as narrow as the evidence.'
    - How to read a chain. A conclusion is supported if some path to it never touches the suspect source. That is a question about the
      graph rather than about the size of the numbers, which is why the panel makes you open each one instead of judging by how alarming
      it looks.
    assumes:
    - a comparison is only as good as the thing compared against
    takeaway: 'Trace both the measurement dependency and the inference built on top of it: the first may be corrected while the second
      must sometimes be withdrawn.'
    format: TRACE
    question: Which conclusions actually inherit the bad reference, and which remain supported by independent evidence?
    trace:
      hint: Open each conclusion and inspect the sources underneath it. Keep conclusions whose evidence chain does not pass through
        the suspect reference, then name the source shared by the conclusions that fail.
      target: vault_ref
      channels:
      - id: ratio
        label: Flats motion comparison
        reading: ×3.0 spectral-amplitude ratio at 1 Hz (fortnight report)
        depends:
        - flats_record
        - vault_ref
      - id: planning_factor
        label: Universal design shortcut copied from the site ratio
        reading: ×3.0 applied as a universal design-demand multiplier (district planning memo)
        depends:

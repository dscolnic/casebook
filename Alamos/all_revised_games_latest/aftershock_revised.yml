    takesAsRead:
    - Concrete compressive strength from a core test
    assumes:
    - a crack runs across the direction of the tension that opened it
    takeaway: The shape and repetition of damage can narrow the failure mechanism, but pattern recognition alone cannot establish remaining
      strength.
    format: CHOICE
    question: Which explanation fits the pattern?
    why: Diagonal cracking is consistent with principal tension produced by shear, and crossed diagonals fit load reversals during earthquake
      shaking. The pattern is therefore much more consistent with cyclic shear demand than with simple long-term settlement or axial
      crushing. Fine, distributed cracks can indicate that reinforcement is controlling crack widths rather than allowing one brittle
      split, but that is not the same as proving the column is safe. Crack pattern identifies a likely mechanism; residual capacity
      still needs an engineering check.

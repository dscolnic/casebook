    - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading — a
      step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each belongs to is
      where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole
      game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before it was fixed.
      It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken out of them deliberately.
    - 'What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option fails,
      not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made for an approximate
      reason is indistinguishable from a sound one until the day the approximation is what is being tested.'
    assumes:
    - a photograph records what was in front of the lens
    takeaway: An authenticated photograph can establish an observation while leaving scale, location, age and mechanism unresolved.
    format: CHOICE
    question: What has the photograph established?
    why: Once the image is accepted as genuine, the crack is evidence, but its scope is narrow. The photograph has no scale, exact location,
      earlier comparison or useful view of the surrounding structure. It cannot establish the crack's width, age, importance or cause.
      It does establish that a basement area outside the rapid inspection contains a real feature worth checking. The response is therefore
      to locate it and gather context quickly. The photograph alone neither justifies evacuation nor supports dismissing the observation.
    choices:
    - That the building is unsafe and should be evacuated tonight.
    - That a crack exists somewhere the green placard never covered.
    - Nothing, because it was not taken by an engineer under controlled conditions.
    - That the assessment team was negligent in issuing a green placard.
    answer: That a crack exists somewhere the green placard never covered.
    rebuttals:
    - Nothing about width, location or age is available from the image, so evacuation is not supported by it.
    - Who took a photograph does not change what is in it, and dismissing it on that basis is how a process loses trust.
    - The team recorded that the basement was not inspected, which is the opposite of negligence.
  - group: MAT
    task: Choose the leading hypothesis and the check that would distinguish it
    title: Down there with a torch

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>First Person Learning</title>
<!-- The shelf. The catalogue is games.json, written by the Alamos repo's sync
     tool (gamekit/tools/sync-casebook.mjs) — adding a game is a sync, not an
     edit here. The account header and the resume line come from the app's own
     API and both degrade to nothing when they are not answered, so this page
     also works opened straight off the filesystem.

     The look is the local picker's — gamekit/tools/gallery.mjs — because that
     is the one that was designed rather than inherited. The two pages are not
     the same file and cannot be: the picker is generated at build time from the
     catalogue and reads localStorage, while this one is served to an account and
     asks the API who is signed in. What is shared is the language, and that is
     deliberate: a player who sees both should not think they are two products.
     If you restyle one, restyle the other. -->
<style>
  :root{
    --bg:#0d0f13; --bg2:#141821; --ink:#e9ecf2; --dim:#98a1b2; --faint:#5d6675;
    --line:#242a36; --radius:16px;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  /* Two wide, very dilute washes off the top corners. On a flat black the cards
     float with nothing behind them; this gives the page a top edge without
     putting a colour anywhere near the screenshots. */
  body{
    margin:0; background:
      radial-gradient(1100px 620px at 12% -8%, #1b2333 0%, transparent 60%),
      radial-gradient(900px 520px at 92% 4%, #201a2b 0%, transparent 58%),
      var(--bg);
    background-attachment:fixed;
    color:var(--ink);
    font:16px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  }
  .wrap{max-width:1320px; margin:0 auto; padding:56px 24px 96px}
  a{color:inherit}

  header{margin-bottom:34px; display:flex; justify-content:space-between;
         align-items:flex-start; gap:30px; flex-wrap:wrap}
  .mast{flex:1; min-width:280px}
  .kicker{
    font:600 12px/1 var(--mono); letter-spacing:.18em;
    text-transform:uppercase; color:var(--faint); margin:0 0 14px;
  }
  h1{
    margin:0 0 10px; font-size:clamp(34px,5.6vw,58px); line-height:1.02;
    letter-spacing:-.025em; font-weight:680;
  }
  /* The one piece of colour in the type. Clipped to the glyphs, so it reads as
     ink rather than as a highlight behind the words. */
  h1 em{font-style:normal; background:linear-gradient(92deg,#6fc7d8,#8f6fd0 46%,#e0868f);
    -webkit-background-clip:text; background-clip:text; color:transparent}
  .lede{margin:0; max-width:60ch; color:var(--dim); font-size:17px}

  /* Account. Hidden until /api/auth/user answers — a static host never will. */
  .account{display:none; align-items:center; gap:12px; font-size:13px}
  .account.show{display:flex}
  .account .who{display:flex; flex-direction:column; line-height:1.25; text-align:right}
  .account .who b{font-size:14px; font-weight:640}
  .account .who span{color:var(--faint); font-size:12px}
  .avatarpic{width:42px; height:42px; border-radius:50%; overflow:hidden;
             border:1px solid var(--line); background:var(--bg2); flex:none}
  .avatarpic img{display:block; width:100%; height:100%; object-fit:cover}
  .avatarpic .initials{display:grid; place-items:center; width:100%; height:100%;
                       font-size:14px; font-weight:700; color:var(--dim)}
  .signout{font-size:13px; color:var(--dim); text-decoration:none;
           border:1px solid var(--line); border-radius:999px; padding:6px 14px; white-space:nowrap}
  .signout:hover{border-color:#39435a; color:var(--ink)}

  /* One segmented control, not a row of loose pills: the levels are alternatives
     and the shared track says so. The count under each label is what makes it
     honest — a level with two games in it should look like a level with two
     games in it before you press it. */
  .levels{display:inline-flex; gap:4px; margin:26px 0 2px; padding:4px;
    border:1px solid var(--line); border-radius:999px; background:#111520}
  .levels[hidden]{display:none}
  .level{
    appearance:none; cursor:pointer; border:0; background:transparent; color:var(--dim);
    border-radius:999px; padding:8px 18px; font:inherit; font-size:14px; line-height:1.15;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    transition:background .16s, color .16s;
  }
  .level small{font-size:11px; letter-spacing:.04em; color:var(--faint)}
  .level:hover{color:var(--ink)}
  .level[aria-pressed="true"]{background:var(--ink); color:#0d0f13}
  .level[aria-pressed="true"] small{color:#4a5262}
  .level:focus-visible{outline:2px solid #6fc7d8; outline-offset:2px}

  .filters{display:flex; flex-wrap:wrap; gap:8px; margin:26px 0 4px}
  .chip{
    appearance:none; cursor:pointer; border:1px solid var(--line); background:var(--bg2);
    color:var(--dim); border-radius:999px; padding:7px 15px; font:inherit; font-size:13.5px;
    transition:border-color .16s, color .16s, background .16s, transform .12s;
  }
  .chip:hover{color:var(--ink); border-color:#39435a; transform:translateY(-1px)}
  .chip[aria-pressed="true"]{background:var(--ink); color:#0d0f13; border-color:var(--ink)}
  .chip:focus-visible{outline:2px solid #6fc7d8; outline-offset:2px}

  .grid{
    display:grid; gap:22px; margin-top:26px;
    grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
  }

  .card{
    display:flex; flex-direction:column; text-decoration:none; color:inherit;
    background:linear-gradient(180deg,#161b25,#111520);
    border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
    transition:transform .18s cubic-bezier(.2,.7,.3,1), border-color .18s, box-shadow .18s;
  }
  /* The game's own accent is the only thing the shelf knows about how it looks,
     so the hover state is built out of it. */
  .card:hover{
    transform:translateY(-4px);
    border-color:color-mix(in srgb, var(--accent) 55%, var(--line));
    box-shadow:0 16px 40px -18px color-mix(in srgb, var(--accent) 70%, transparent),
               0 2px 0 0 color-mix(in srgb, var(--accent) 35%, transparent) inset;
  }
  .card:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
  /* Not `pointer-events:none` on the whole card — an unbuilt game still has a
     syllabus, and killing pointers on the card kills the button that shows it.
     There is simply no link element to press. */
  .card--unbuilt{opacity:.62}

  .shot{position:relative; aspect-ratio:16/9; background:#080a0e; overflow:hidden}
  .shot img{
    width:100%; height:100%; object-fit:cover; display:block;
    transform:scale(1.02); transition:transform .5s cubic-bezier(.2,.7,.3,1); filter:saturate(1.05);
  }
  .card:hover .shot img{transform:scale(1.09)}
  .shot__none{
    width:100%; height:100%; display:grid; place-items:center;
    background:repeating-linear-gradient(135deg,#12161f 0 10px,#0e121a 10px 20px);
    color:var(--faint); font:12px/1 var(--mono); letter-spacing:.1em;
  }
  /* The title sits on the picture, so the picture has to fall away under it.
     A gradient rather than a flat scrim: the top of the shot stays the shot. */
  .shot__veil{
    position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(180deg,rgba(8,10,14,.10) 0%,rgba(8,10,14,.05) 38%,rgba(8,10,14,.88) 100%);
  }
  .shot h2{
    position:absolute; left:16px; right:16px; bottom:11px; margin:0;
    font-size:21px; line-height:1.15; letter-spacing:-.015em; font-weight:640;
    text-shadow:0 2px 14px rgba(0,0,0,.75);
  }
  .field{
    position:absolute; top:12px; left:12px; z-index:1;
    font:600 10.5px/1 var(--mono); letter-spacing:.12em; text-transform:uppercase;
    color:#0d0f13; background:var(--accent); border-radius:999px; padding:5px 9px;
  }
  .play{
    position:absolute; top:11px; right:12px; z-index:1;
    width:28px; height:28px; border-radius:50%; display:grid; place-items:center;
    font-size:11px; color:#0d0f13; background:var(--ink);
    opacity:0; transform:scale(.8); transition:opacity .18s, transform .18s;
  }
  .card:hover .play, .card:focus-visible .play{opacity:1; transform:scale(1)}
  .unbuilt{
    position:absolute; top:12px; right:12px; z-index:1;
    font:600 10px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase;
    color:var(--dim); border:1px solid var(--line); background:#0d0f13cc;
    border-radius:999px; padding:5px 8px;
  }
  /* A campaign already under way. Bottom-RIGHT of the shot: the title is bottom
     left, the field chip top left and the play mark top right, and this is the
     one corner left. */
  .resume{
    position:absolute; right:12px; bottom:12px; z-index:2;
    font:600 10.5px/1 var(--mono); letter-spacing:.08em;
    color:#0d0f13; background:var(--ink); border-radius:999px; padding:5px 9px;
  }
  .resume--done{background:var(--accent)}
  .card--started{outline:1px solid color-mix(in srgb, var(--accent) 55%, transparent)}

  .body{padding:15px 17px 17px; display:flex; flex-direction:column; gap:8px; flex:1}
  .course{margin:0; font-weight:600; font-size:13.5px; line-height:1.35; color:var(--accent)}
  /* The situation, in the game's own opening words. This is the card — what has
     happened and whose problem it is — where it used to be a line about the
     architecture. */
  .drama{margin:0; color:var(--dim); font-size:14.5px; line-height:1.5}

  /* The whole card is the link, but there is a button inside it — and a button
     inside an anchor is neither valid nor clickable. So the link is its own
     empty element stretched over the card, and anything that needs its own
     click sits above it on z-index 2.
     It has to be a direct child of .card: `inset:0` resolves against the
     nearest *positioned* ancestor, and .shot is position:relative, so an
     anchor placed in there covers the screenshot and nothing else. */
  .card{position:relative}
  .card__link{position:absolute; inset:0; z-index:1; border-radius:var(--radius)}

  .cardfoot{margin:auto 0 0; padding-top:12px; display:flex; align-items:center;
            justify-content:space-between; gap:12px}
  .cardfoot .progress{flex:1; min-width:0}
  /* The concepts mark: three nodes and the lines between them. Above the card's
     click layer, or pressing it would start the game instead. */
  .conceptsBtn{
    position:relative; z-index:2; flex:none;
    width:38px; height:38px; display:grid; place-items:center; cursor:pointer;
    border:1px solid var(--line); border-radius:50%; background:#10141c;
    color:var(--dim); padding:0;
    transition:color .16s, border-color .16s, background .16s, transform .16s;
  }
  .conceptsBtn:hover{color:var(--ink); border-color:color-mix(in srgb, var(--accent) 60%, var(--line));
                     transform:translateY(-1px)}
  .conceptsBtn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .conceptsBtn svg{width:20px; height:20px; display:block}
  .conceptsBtn[aria-expanded="true"]{background:var(--accent); border-color:var(--accent); color:#0d0f13}

  .concepts{margin:12px 0 0; padding-top:12px; border-top:1px dashed var(--line);
            position:relative; z-index:2}
  .concepts[hidden]{display:none}
  .concepts p{margin:0 0 8px; font:600 11px/1 var(--mono); letter-spacing:.12em;
              text-transform:uppercase; color:var(--faint)}
  .concepts ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:6px}
  /* Phrases, not labels — so they wrap rather than truncate. Half a concept
     teaches nothing. */
  .concepts li{
    font-size:12.5px; line-height:1.4; color:var(--dim);
    padding-left:15px; position:relative;
  }
  .concepts li::before{content:''; position:absolute; left:0; top:.5em;
    width:5px; height:5px; border-radius:50%; background:var(--accent)}
  .progress{margin:0; font:500 12px/1.45 inherit; color:var(--accent)}
  .progress__bar{display:block; height:3px; margin-top:6px; border-radius:2px;
    background:var(--line); overflow:hidden}
  .progress__bar i{display:block; height:100%; background:var(--accent)}

  .note{margin:56px 0 0; padding-top:22px; border-top:1px solid var(--line);
        color:var(--faint); font-size:13.5px}

  @media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="mast">
      <p class="kicker">First Person Learning · mission-based STEM games</p>
      <h1>Explore the world; <em>save the day.</em></h1>
      <p class="lede">Designed by a Duke University astrophysics professor, a series of
        STEM games with immersive worlds. Save the day by understanding the material.</p>
    </div>
    <div class="account" id="account">
      <div class="avatarpic" id="accountPic"></div>
      <div class="who"><b id="accountName"></b><span id="accountMail"></span></div>
      <a class="signout" href="/sign-out.html">Sign out</a>
    </div>
  </header>

  <div class="levels" id="levels" role="group" aria-label="Choose a level"></div>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
  <p class="note" id="note"></p>

</div>

<script>
const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// A game the player has a campaign in, keyed by theme id. Empty for a signed-out
// visitor, and empty when there is no API at all.
let saves = {};
let games = [];
let field = 'All';

// ------------------------------------------------------------------- level
//
// Several games ship at two reading levels — the same place and the same cast,
// a differently written book — so the catalogue holds two rows for each and the
// shelf drew Planetary Defense twice with nothing to tell them apart. This is
// one or the other, never both.
//
// Youngest first, so the control reads as a scale rather than as three
// unrelated buttons.
//
// `hold: true` keeps a level off the shelf entirely — no segment, and its games
// do not appear anywhere. Elementary is held because it is one game (Hospital
// Heroes), and a whole reading level offered for a single card promises a shelf
// that is not there yet. Delete the flag when there are enough to be worth
// choosing; nothing else here needs to change.
const LEVELS = [
  { id: 'elementary', label: 'Elementary',           has: (g) => g.level === 'elementary', hold: true },
  { id: 'middle',     label: 'Middle School',        has: (g) => g.level === 'middle' },
  { id: 'high',       label: 'High school + above',  has: (g) => g.level === 'high' },
];
const SHOWN = LEVELS.filter(l => !l.hold);
const LEVEL_KEY = 'casebook_shelf_level';
// Senior high is the default because most of the set is written for it. A stored
// value that is unknown — or names a level since put on hold — falls back rather
// than emptying the page.
const stored = localStorage.getItem(LEVEL_KEY);
let level = SHOWN.some(l => l.id === stored) ? stored : 'high';

const inLevel = (g) => (SHOWN.find(l => l.id === level) ?? SHOWN[0]).has(g);

async function json(url){
  try{
    const r = await fetch(url, { credentials: 'same-origin' });
    return r.ok ? await r.json() : null;
  }catch(e){ return null; }
}

function initialsOf(u, name){
  const from = [u.firstName, u.lastName].filter(Boolean);
  if(from.length) return from.map(s => s[0]).join('').toUpperCase();
  return (name || '?').trim()[0].toUpperCase();
}

// The account header. Absent is the normal case on a static host, so failure
// here is silent and the header simply never appears.
async function loadAccount(){
  const u = await json('/api/auth/user');
  if(!u) return;
  const name = [u.firstName, u.lastName].filter(Boolean).join(' ') || u.email || 'Signed in';
  document.getElementById('accountName').textContent = name;
  document.getElementById('accountMail').textContent = u.email || '';
  // Initials rather than an empty disc: Clerk only has a picture when the
  // provider gave it one, and a signed-in player with no photo was getting a
  // blank circle that read as an image that had failed to load.
  document.getElementById('accountPic').innerHTML = u.profileImageUrl
    ? `<img src="${esc(u.profileImageUrl)}" alt="">`
    : `<span class="initials">${esc(initialsOf(u, name))}</span>`;
  document.getElementById('account').classList.add('show');
}

async function loadSaves(){
  const out = await json('/api/saves');
  for(const s of (out?.saves ?? [])) saves[s.theme] = s;
}

// The corner mark on the shot, and the line under the card. A campaign in
// progress is the one piece of state worth putting on a shelf — it is the
// difference between twenty things to start and one thing to carry on with.
function progressOf(g){
  const s = saves[g.id];
  if(!s) return null;
  if(s.status === 'won')  return { pill: 'complete', done: true, text: 'Campaign complete', frac: 1 };
  if(s.status === 'lost') return { pill: 'ended',    done: true, text: 'Campaign ended — start again', frac: 1 };
  const days = g.size?.days;
  const day = s.mission ?? 1;
  return {
    pill: 'resume', done: false,
    text: days ? `Day ${day} of ${days}` : `Day ${day}`,
    frac: days ? Math.min(1, day / days) : 0,
  };
}

// Three nodes and the lines between them — what a syllabus looks like when it is
// not a list. Inline, because the page must draw with no network beyond its own
// origin and a sprite sheet for one mark is not worth a request.
const CONCEPTS_MARK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
  <circle cx="6" cy="7.5" r="2.3"/><circle cx="18" cy="6" r="2.3"/><circle cx="12.5" cy="17.5" r="2.3"/>
  <path d="M7.6 9.3 11 15.4M16.4 8 13.8 15.3M8.3 7 15.7 6.2"/></svg>`;

function cardHTML(g, i){
  const p = progressOf(g);
  const built = g.built !== false;
  const panel = `concepts-${i}`;
  return `
  <div class="card${built ? '' : ' card--unbuilt'}${p && !p.done ? ' card--started' : ''}"
     style="--accent:${esc(g.accent)}">
    ${built ? `<a class="card__link" href="./${esc(g.id)}/index.html"
                  aria-label="Play ${esc(g.title)}"></a>` : ''}
    <div class="shot">
      ${g.hero ? `<img src="${esc(g.hero)}" alt="" loading="lazy">`
               : `<div class="shot__none" aria-hidden="true"><span>no snapshot yet</span></div>`}
      <div class="shot__veil"></div>
      <span class="field">${esc(g.field)}</span>
      ${built ? '<span class="play" aria-hidden="true">▶</span>'
              : '<span class="unbuilt">not built</span>'}
      ${p ? `<span class="resume${p.done ? ' resume--done' : ''}">${esc(p.pill)}</span>` : ''}
      <h2>${esc(g.title)}</h2>
    </div>
    <div class="body">
      <p class="course">${esc(g.course)}</p>
      <p class="drama">${esc(g.drama || g.place)}</p>
      <div class="cardfoot">
        ${g.concepts?.length ? `<button class="conceptsBtn" type="button"
            aria-expanded="false" aria-controls="${panel}"
            title="What this one teaches" aria-label="What this one teaches">${CONCEPTS_MARK}</button>` : ''}
        ${p ? `<p class="progress">${esc(p.text)}
                 <span class="progress__bar"><i style="width:${Math.round(p.frac * 100)}%"></i></span></p>` : ''}
      </div>
      ${g.concepts?.length ? `<div class="concepts" id="${panel}" hidden>
        <p>What this one teaches</p>
        <ul>${g.concepts.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
      </div>` : ''}
    </div>
  </div>`;
}

// One listener on the grid rather than one per card: the grid is rewritten on
// every filter change, and per-card listeners would have to be rebound each time.
document.getElementById('grid').addEventListener('click', (e) => {
  const btn = e.target.closest('.conceptsBtn');
  if(!btn) return;
  // The card's own click layer sits underneath this button, but the event still
  // bubbles up through it — without this, opening the list starts the game.
  e.preventDefault();
  e.stopPropagation();
  const panel = document.getElementById(btn.getAttribute('aria-controls'));
  const open = btn.getAttribute('aria-expanded') === 'true';
  btn.setAttribute('aria-expanded', String(!open));
  if(panel) panel.hidden = open;
});

function render(){
  const shown = games.filter(g => inLevel(g) && (field === 'All' || g.field === field));
  document.getElementById('grid').innerHTML = shown.map(cardHTML).join('');
  const resumable = games.filter(g => saves[g.id] && saves[g.id].status === 'playing').length;
  document.getElementById('note').textContent = resumable
    ? `${resumable} campaign${resumable === 1 ? '' : 's'} in progress. Your progress follows your account, not this browser.`
    : 'Your progress follows your account, so a campaign started here carries on anywhere you sign in.';
}

function renderFilters(){
  // The subjects offered are the subjects the chosen level actually has. Listing
  // every field regardless would offer Psychology to a middle-school reader and
  // then draw an empty shelf, which reads as a broken page rather than as a
  // subject that has no edition yet.
  const here = games.filter(inLevel);
  const fields = ['All', ...Array.from(new Set(here.map(g => g.field)))];
  // Switching level can strand the chosen subject. Fall back rather than
  // showing nothing.
  if(!fields.includes(field)) field = 'All';

  document.getElementById('filters').innerHTML = fields.map(f =>
    `<button class="chip" type="button" data-field="${esc(f)}" aria-pressed="${f === field}">${esc(f)}</button>`
  ).join('');
  document.getElementById('filters').querySelectorAll('.chip').forEach(b => {
    b.addEventListener('click', () => { field = b.dataset.field; renderFilters(); render(); });
  });

  // Only offer a level that has games in it. If every game were senior-high —
  // which was true until the first edition shipped — there is nothing to choose
  // between and the control hides itself rather than offering to empty the page.
  const live = SHOWN.filter(l => games.some(l.has));
  const box = document.getElementById('levels');
  box.hidden = live.length < 2;
  box.innerHTML = live.map(l => {
    const n = games.filter(l.has).length;
    return `<button class="level" type="button" data-level="${l.id}" aria-pressed="${l.id === level}">`
      + `<span>${esc(l.label)}</span><small>${n} game${n === 1 ? '' : 's'}</small></button>`;
  }).join('');
  box.querySelectorAll('.level').forEach(b => {
    b.addEventListener('click', () => {
      level = b.dataset.level;
      try{ localStorage.setItem(LEVEL_KEY, level); }catch(e){}
      renderFilters(); render();
    });
  });
}

(async function start(){
  // The account and the catalogue are independent — the shelf must draw even if
  // the API never answers, so neither await blocks the other.
  const [cat] = await Promise.all([json('./games.json'), loadAccount(), loadSaves()]);
  // A held level is dropped here rather than at each place that reads `games`,
  // so the segments, the subject chips and the campaigns-in-progress note cannot
  // disagree about which games exist.
  games = (cat?.games ?? []).filter(g => SHOWN.some(l => l.has(g)));
  if(!games.length){
    document.getElementById('note').textContent =
      'No games.json here yet — run `npm run sync-casebook` in the Alamos repo.';
  }
  renderFilters();
  render();

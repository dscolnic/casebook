<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover puts the canvas under the home indicator; the touch pads
     inset themselves off it with env(safe-area-inset-*) rather than the page
     being letterboxed. maximum-scale stops a double-tap on the world zooming
     the page, which on a tablet is indistinguishable from the game breaking. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>gamekit</title>
<style>
:root{--panel:#fbf9f4;--ink:#191a1c;--muted:#5f6368;--line:#d3cec3;--accent:#2f7fa8}
*{box-sizing:border-box}
html{font-size:15px}
body{overflow:hidden;margin:0;background:#0e1113;color:var(--ink);
     font:400 1rem/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
/* 100vh on iOS Safari is the height with the toolbars *hidden*, so the canvas
   renders taller than the window and the bottom of it — where the touch pads
   live — sits under the browser chrome. dvh is the visible viewport; the vh
   line stays as the fallback for anything that predates it. */
#canvas{display:block;width:100vw;height:100vh;height:100dvh;touch-action:none}

/* Crosshair. Kept faint until pointer lock so the title screen is not cluttered. */
#crosshair{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;
           pointer-events:none;z-index:5;opacity:.30;transition:opacity .12s}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff;border-radius:1px;
           box-shadow:0 0 2px rgba(0,0,0,.7)}
#crosshair:before{left:6px;top:0;width:2px;height:14px}
#crosshair:after{left:0;top:6px;width:14px;height:2px}
.locked #crosshair{opacity:.75}

#prompt{position:fixed;left:50%;bottom:20%;transform:translateX(-50%);background:var(--panel);color:var(--ink);
        padding:9px 13px;border-radius:10px;font:700 .82rem/1 Inter,system-ui;z-index:6;max-width:80vw;
        text-align:center;border:1px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.35)}
#prompt.hidden{display:none}

/* Status: five readings, top left, over the world rather than above it. */
#hudStatus{position:fixed;top:10px;left:12px;z-index:4;display:flex;gap:0;
  background:rgba(251,249,244,.92);backdrop-filter:blur(10px);border:1px solid var(--line);
  border-radius:10px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.hudStat{padding:6px 13px;display:flex;flex-direction:column;gap:2px;min-width:74px;
  border-right:1px solid var(--line)}
.hudStat:last-child{border-right:0}
.hudLabel{font:700 .58rem/1 Inter,system-ui;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.hudStat b{font:800 .92rem/1.1 Inter,system-ui;font-variant-numeric:tabular-nums;color:var(--ink)}
#hudProjection.great{color:#0a8a0a}
#hudProjection.good{color:#b0762a}
#hudProjection.bad{color:#c0392b}
#hudClock.low{color:#b0762a}
#hudClock.urgent{color:#c0392b}

/* The one instruction, centred, where the eye already is. */
/* Below the readings, not level with them: the why-line is a full sentence and
   at 1350px it ran straight under the status strip. */
/* Under the clock on the left, not across the middle. Centred, it sat over the
   view you are walking into and fought the corner map for the top of the frame;
   the two HUD corners are where a player already looks. */
#objective{position:fixed;top:66px;left:12px;z-index:4;
  max-width:min(420px,42vw);text-align:left;pointer-events:none;
  /* A dark ground rather than a text shadow: the sky is nearly white at the top
     of the frame, and white-on-white survives no amount of shadow. */
  background:rgba(22,25,28,.62);backdrop-filter:blur(6px);
  border-radius:12px;padding:8px 18px}
/* Same size and weight as the clock's own figure (.hudStat b), so the two
   top-left boxes read as one instrument rather than two. */
#objectiveWhere{font:800 .92rem/1.25 Inter,system-ui;color:#fff;letter-spacing:.01em}
#objectiveWhy{font:500 .82rem/1.4 Inter,system-ui;color:rgba(255,255,255,.86);margin-top:3px}
#objective.done #objectiveWhere{color:#9fe6a8}

/* Map and settings, opposite the readings. */
#hudTools{position:fixed;top:10px;right:12px;z-index:4;display:flex;gap:6px}
.hudBtn{background:rgba(251,249,244,.92);backdrop-filter:blur(10px);border:1px solid var(--line);
  border-radius:10px;padding:7px 12px;font:700 .78rem/1 Inter,system-ui;color:var(--ink);cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,.25)}
.hudBtn:hover{background:#fff}

.sheet{position:fixed;inset:0;z-index:110;display:none;place-items:center;padding:20px;
  background:rgba(10,13,15,.6)}
.sheet.show{display:grid}
.sheetCard{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:min(820px,100%);max-height:88vh;overflow:auto;box-shadow:0 28px 80px rgba(0,0,0,.45)}
.sheetHead{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.sheetHead h3{margin:0;font:800 1.2rem/1.2 Georgia,serif}
.sheetBody{padding:14px 18px}
.mapWrap{padding:12px}
.mapWrap svg{display:block;border:1px solid var(--line);border-radius:10px}
.mapLegend{font:500 .74rem/1.4 Inter,system-ui;color:var(--muted);padding:8px 2px 0;text-align:center}
.settingRow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.settingRow:last-child{border-bottom:0}
.settingRow span{display:flex;flex-direction:column;gap:2px;flex:1}
.settingRow small{color:var(--muted);font-size:.76rem}
.settingRow.danger{align-items:center}
.settingRow input{margin-top:3px;width:16px;height:16px}

/* Manual overrides for the two accessibility settings. */
body.highContrast{--line:#6c6558}
body.highContrast .hudBtn,body.highContrast .reading,body.highContrast .candidate{border-color:#4a463d}
body.reduceMotion *,body.reduceMotion *::before,body.reduceMotion *::after{animation:none!important;transition:none!important}
#blocker{position:fixed;inset:0;background:rgba(10,13,15,.72);display:grid;place-items:center;z-index:20}
#blocker.hidden{display:none}
#blockerBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;
            max-width:560px;text-align:left;box-shadow:0 18px 50px rgba(0,0,0,.45)}
#blockerBox h1{font:800 1.5rem/1.2 Georgia,serif;margin:0 0 4px}
#blockerBox h2{font:600 .95rem/1.3 Inter,system-ui;color:var(--muted);margin:0 0 14px}
#blockerBox p{font-size:.86rem;line-height:1.5;color:#3a3d40;margin:0 0 10px}
#blockerBox kbd{background:var(--ink);color:#fff;padding:2px 6px;border-radius:4px;font:800 .74rem ui-monospace,monospace}
#blockerBox .scope{font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:12px}

#statsOverlay{position:fixed;inset:0;background:rgba(10,13,15,.62);display:none;z-index:16;place-items:center;padding:18px}
#statsOverlay.show{display:grid}
#statsBody{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:860px;width:100%;
           padding:16px;max-height:86vh;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.4)}

/* ——— Verdict ——————————————————————————————————————————————————————— */
#verdictOverlay{position:fixed;inset:0;z-index:120;display:none;place-items:center;padding:20px;
  background:rgba(10,13,15,.55);backdrop-filter:blur(3px)}
#verdictOverlay.show{display:grid}
#verdictCard{width:min(620px,100%);max-height:88vh;overflow:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 90px rgba(0,0,0,.5);
  animation:verdictIn .22s cubic-bezier(.2,.9,.3,1.1)}
@keyframes verdictIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}

.verdictHead{padding:20px 24px 16px;border-bottom:1px solid var(--line);
  border-top:6px solid var(--vc,#0ca30c);border-radius:16px 16px 0 0}
.verdictKicker{font:800 .68rem/1 Inter,system-ui;letter-spacing:.14em;text-transform:uppercase;color:var(--vc)}
.verdictTitle{font:800 1.9rem/1.1 Georgia,serif;margin:8px 0 0;color:var(--ink)}
.verdictStake{font:500 .88rem/1.45 Inter,system-ui;color:var(--muted);margin-top:8px}

.verdictLedger{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;
  background:var(--line);border-bottom:1px solid var(--line)}
.ledgerCell{background:var(--panel);padding:12px 14px}
.ledgerLabel{font:700 .62rem/1 Inter,system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ledgerValue{font:800 1.15rem/1.2 Inter,system-ui;margin-top:5px;font-variant-numeric:tabular-nums}
.ledgerNote{font:400 .7rem/1.3 Inter,system-ui;color:var(--muted);margin-top:3px}
.ledgerValue.gain{color:#0a8a0a}
.ledgerValue.cost{color:#c0392b}

.verdictBody{padding:16px 24px}
.verdictBody .answerCompareBox{margin-bottom:10px}
.verdictWhy{font:400 .88rem/1.55 Inter,system-ui;color:#33363a}
.verdictDetail{margin-top:12px}
.verdictDetail summary{cursor:pointer;font:700 .8rem/1 Inter,system-ui;color:var(--accent);padding:6px 0}
.verdictActions{position:sticky;bottom:0;background:var(--panel);display:flex;justify-content:flex-end;
  gap:8px;padding:14px 24px;border-top:1px solid var(--line);flex-wrap:wrap;border-radius:0 0 16px 16px}

/* ---------------------------------------------------------------- touch
   Built by engine/core/touch.js, and only on a device with no mouse to lock.
   z-index 8 puts it over the crosshair and the prompt and under everything
   that is a panel — the title blocker (20), the summary (16), the question
   modal (100) and the sheets (110) all cover it, which is what stops a thumb
   reaching the world through an open card. */
body.touch{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#touchLayer{position:fixed;inset:0;z-index:8;pointer-events:none;touch-action:none}
#touchLayer.off{display:none}
/* The two key hints the engine draws on its own buttons — B on the briefing
   chip, Enter on the turn-in bar — name keys this device does not have. The
   buttons themselves are already tappable, so only the hint goes. */
body.touch #briefingBtn small,
body.touch #turnInBar .btn small{display:none}

/* The zones. The move zone stops short of the top so the readings stay
   readable; the look zone starts below the HUD tools so Map and Settings are
   still tappable, and the corner map sits above both at z-index 40. */
#touchMove{position:absolute;left:0;bottom:0;width:46%;height:62%;pointer-events:auto}
#touchLook{position:absolute;right:0;top:56px;width:54%;bottom:0;pointer-events:auto}

/* A floating stick: drawn where the thumb lands, so it never has to be found.
   A child of #touchLayer rather than of #touchMove, because the layer is the
   only element here whose origin is the top left of the window — which is what
   a Touch's clientX/clientY are measured from. translate(-50%,-50%) then
   centres the ring on the thumb. */
#touchStick{position:absolute;width:112px;height:112px;margin:0;border-radius:50%;
  transform:translate(-50%,-50%);border:2px solid rgba(251,249,244,.42);
  background:rgba(14,17,19,.24);opacity:0;transition:opacity .1s;pointer-events:none}
#touchStick.on{opacity:1}
#touchStick i{position:absolute;left:50%;top:50%;width:52px;height:52px;border-radius:50%;
  background:rgba(251,249,244,.72);box-shadow:0 2px 10px rgba(0,0,0,.45);
  transform:translate(calc(-50% + var(--nx,0px)),calc(-50% + var(--ny,0px)))}

/* Action pad, bottom right, clear of the home indicator. */
#touchPad{position:absolute;right:calc(18px + env(safe-area-inset-right));
  bottom:calc(20px + env(safe-area-inset-bottom));display:flex;align-items:flex-end;
  gap:10px;pointer-events:none}
#touchTools{position:absolute;left:calc(14px + env(safe-area-inset-left));
  bottom:calc(20px + env(safe-area-inset-bottom));display:flex;gap:8px;pointer-events:none}

/* 64px is above the 44pt minimum a thumb needs and below the size at which the
   buttons start hiding the world they are played against. */
.touchBtn{pointer-events:auto;border:1px solid rgba(251,249,244,.5);border-radius:14px;
  background:rgba(14,17,19,.52);color:#fbf9f4;backdrop-filter:blur(8px);
  font:800 .78rem/1 Inter,system-ui,-apple-system,sans-serif;letter-spacing:.05em;
  text-transform:uppercase;padding:0;touch-action:none}
.touchBtn.small{min-width:64px;height:44px}
.touchBtn.big{min-width:96px;height:96px;border-radius:50%;font-size:.9rem;
  background:rgba(47,127,168,.72);border-color:rgba(251,249,244,.72)}
.touchBtn.down{background:rgba(251,249,244,.86);color:#191a1c}
.touchBtn.latched{background:rgba(251,249,244,.86);color:#191a1c}
.touchBtn[hidden]{display:none}

/* The corner map is 171px and hidden below 820px, so on a phone the Map button
   is the only way to it — which is why touch.js draws one rather than relying
   on the HUD's. */
@media (max-width:820px){ #touchLook{top:48px} .touchBtn.big{min-width:82px;height:82px} }

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<canvas id="canvas"></canvas>
<div id="crosshair"></div>
<div id="prompt" class="hidden"></div>

<!-- Five readings and one instruction. The full-width toolbar that was here
     carried the mission name, the route chips, a "Why:" line and a timeline,
     which is a briefing document stapled over the game. -->
<div id="hudStatus">
  <div class="hudStat"><span class="hudLabel">Time left</span><b id="hudClock">—</b></div>
  <div class="hudStat"><span class="hudLabel">Calls</span><b id="hudDaysLeft">—</b></div>
  <div class="hudStat"><span class="hudLabel">Mission</span><b id="hudMission">—</b></div>
  <div class="hudStat"><span class="hudLabel">Projection</span><b id="hudProjection">—</b></div>
  <div class="hudStat"><span class="hudLabel">Funds</span><b id="hudMoney">—</b></div>
</div>

<div id="objective">
  <div id="objectiveWhere"></div>
  <div id="objectiveWhy"></div>
</div>

<div id="hudTools">
  <button class="hudBtn" id="mapBtn" type="button" title="Map (M)"><span aria-hidden="true">🗺</span> Map</button>
  <button class="hudBtn" id="settingsBtn" type="button" title="Settings"><span aria-hidden="true">⚙</span> Settings</button>
</div>

<div id="mapOverlay" class="sheet"><div class="sheetCard">
  <div class="sheetHead"><h3 id="mapTitle">Map</h3><button class="btn small" id="mapClose" type="button">Close</button></div>
  <div id="mapBody"></div>
</div></div>

<div id="settingsOverlay" class="sheet"><div class="sheetCard">
  <div class="sheetHead"><h3>Settings</h3><button class="btn small" id="settingsClose" type="button">Close</button></div>
  <div class="sheetBody">
  <div class="controlsHelp">
    <h4>Controls</h4>
    <p><b>W A S D</b> walk · <b>mouse</b> look · <b>Shift</b> run · <b>E</b> use whatever the crosshair is on ·
       <b>M</b> map · <b>Tab</b> summary · <b>Esc</b> releases the mouse.</p>
  </div>
    <label class="settingRow"><input type="checkbox" id="setHighContrast"> <span><b>High contrast</b><small>Darker outlines on panels and readings.</small></span></label>
    <label class="settingRow"><input type="checkbox" id="setReduceMotion"> <span><b>Reduce motion</b><small>Turns off the verdict animation and the counting readout.</small></span></label>
    <div class="settingRow danger"><span><b>Restart the campaign</b><small>Clears the saved run and starts again at Mission 1.</small></span>
      <button class="btn small" id="setReset" type="button">Restart</button></div>
  </div>
</div></div>

<!-- Question and briefing modal. questionUI.js writes into these ids. -->
<div id="overlay" class="overlay">
  <div class="modal">
    <div class="modalHead">
      <div class="eyebrow" id="modalEyebrow"></div>
      <h3 id="modalTitle"></h3>
      <button class="close" id="modalClose" type="button" aria-label="Close">×</button>
    </div>
    <div class="modalBody" id="modalBody"></div>
  </div>
</div>

<!-- The verdict. Its own layer above the question modal: the result used to be
     appended below the panel, so on a Diagnosis you had to scroll past six
     readings and five candidates to find out whether you were right. -->
<div id="verdictOverlay" aria-live="assertive"><div id="verdictCard"></div></div>

<div id="statsOverlay"><div id="statsBody"></div></div>
<div id="endScreen" class="endScreen hidden"></div>
<div id="gameScreen" class="hidden"></div>
<div id="fallbackTown" class="hidden"></div>

<div id="blocker">
  <div id="blockerBox">
    <h1 id="titleName">Loading…</h1>
    <h2 id="titleRole"></h2>
    <div id="titleStakes"></div>
    <p class="scope" id="titleScope"></p>
    <button class="btn primary" id="startBtn" type="button">Take the response</button>
  </div>
</div>

<!-- The account's campaign is read BEFORE the entry point, not inside it.
     `main.js` calls tryLoadSaved() during module evaluation, so hydrating from
     there would be a top-level await in the middle of the graph — every theme
     served from this page would inherit the ordering. Awaiting here and then
     importing main.js keeps the ordering in one place and out of the game.
     Behind a static server the fetch fails once, cloudSave turns itself off,
     and this is two milliseconds of nothing. -->
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />

<title>The Germline Witness</title>
<style>
  :root{
    --bg:#0c1016; --panel:#141b25; --panel2:#0f151d; --ink:#dfe7f2; --muted:#8a99ad;
    --line:#243244; --accent:#4ea1d3; --accent2:#f0b429; --good:#57c98a; --warn:#e8974b;

  }
  *{box-sizing:border-box}

  body{margin:0; background:radial-gradient(1200px 600px at 70% -10%, #182233 0%, #0c1016 60%);

  .log{display:flex; flex-direction:column; gap:16px}

  .meet .nm{font-size:17px;font-weight:600} .meet .rl{font-size:12px;color:var(--muted)}

  .opt:disabled{opacity:.55; cursor:default} .opt.chosen{border-color:var(--accent2)}
  .qprog{font-family:"Courier New",monospace;font-size:11px;letter-spacing:2px;color:var(--muted);margin-bottom:6px}
  .feedback{margin-top:14px; border-left:3px solid var(--muted); padding:10px 14px; background:#0d131b; border-radius:0 8px 8px 0; font-size:15px}
  .feedback .verdict{font-family:"Courier New",monospace; font-size:12px; letter-spacing:2px; text-transform:uppercase; display:block; margin-bottom:5px}
  .v-expert{border-color:var(--good)} .v-expert .verdict{color:var(--good)}

  .btn{display:inline-block; margin-top:14px; background:var(--accent); color:#04121c; border:none; border-radius:9px; padding:11px 22px; font:inherit; font-weight:700; letter-spacing:.5px; cursor:pointer; transition:.15s}
  .btn:hover{filter:brightness(1.1)} .btn.ghost{background:transparent; color:var(--accent); border:1px solid var(--accent)}
  .btn.warn{background:var(--accent2); color:#1a1400} .btn.small{padding:8px 14px; font-size:14px; margin-top:0}
  .btnrow{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px}

  .cluecard{margin-top:12px; border:1px solid var(--accent2); border-radius:9px; background:linear-gradient(180deg,#241f10,#191408); padding:12px 14px; font-size:14px; animation:rise .35s ease}
  .cluecard .clab{font-family:"Courier New",monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--accent2); margin-bottom:6px}
  .cluecard ul{margin:6px 0 0; padding-left:18px} .cluecard li{margin:3px 0}
  .cluecard .hint{margin-top:8px; font-size:12.5px; color:#c9b789; font-style:italic}
  .nothing{margin-top:12px; border-left:3px solid var(--bad); background:#160f12; padding:10px 14px; border-radius:0 8px 8px 0; font-size:14px; color:#e6b3bc}

  .accuse-box,.ending{border:2px solid var(--accent2); border-radius:14px; background:linear-gradient(180deg,#1a2230,#0e141d); padding:22px 24px}
  .accuse-box h2,.ending h2{margin:0 0 6px} .accuse-box p{color:var(--muted); margin:0 0 16px}
  .acc-field{margin-bottom:15px}
  .acc-field label{display:block; font-family:"Courier New",monospace; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--accent); margin-bottom:6px}
  .acc-field select{width:100%; background:#0e141d; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:11px 12px; font:inherit; font-size:15px}
  .people-row{display:flex; flex-direction:column; gap:10px; margin-top:6px}

  .person:hover{border-color:var(--accent2); background:#151d28}
  .person .pface{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#2a3a4d,#16202b);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;flex:none}
  .person .pn{font-size:15px;font-weight:600} .person .pr{font-size:12px;color:var(--muted); line-height:1.35}
  .ending .rank{font-family:"Courier New",monospace; letter-spacing:2px; text-transform:uppercase; font-size:13px; margin-bottom:14px}

  /* sidebar */
  .side{background:var(--panel); border-left:1px solid var(--line); padding:16px 15px; position:sticky; top:0; align-self:start; height:100vh; overflow-y:auto}
  .agent{display:flex; align-items:center; gap:10px; margin-bottom:10px}

  .agent .who{font-size:15px; font-weight:600} .agent .role{font-size:11px; color:var(--muted)}
  .cf-intro{font-size:12px; color:var(--muted); font-style:italic; margin-bottom:6px; line-height:1.4}
  .cf-h{font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin:14px 0 6px; font-family:"Courier New",monospace; display:flex; justify-content:space-between}
  .cf-h .cnt{color:var(--accent2)} .cf-h .flag{color:var(--accent2); font-weight:700}
  .cf-box{border:1px solid var(--line); border-radius:9px; background:var(--panel2); padding:2px 0}
  .theory{padding:7px 11px; font-size:13px; border-bottom:1px solid #1c2734; display:flex; gap:8px; align-items:flex-start; cursor:pointer; user-select:none; transition:background .12s}
  .theory:last-child{border-bottom:none} .theory:hover{background:#131c28}
  .theory .mk{font-family:"Courier New",monospace; color:var(--muted); flex:none; width:12px; text-align:center}
  .theory.crossed{color:#54606f; text-decoration:line-through; text-decoration-color:var(--bad)}
  .theory.crossed .mk{color:var(--bad); text-decoration:none}
  .theory.cue{background:rgba(240,180,41,.12); box-shadow:inset 3px 0 0 var(--accent2)}
  .theory.cue:hover{background:rgba(240,180,41,.2)} .theory.cue .mk{color:var(--accent2); font-weight:800}
  .theory.only{color:var(--good); font-weight:600} .theory.only .mk{color:var(--good)}
  .theory .tlabel{flex:1; min-width:0}
  .asks{display:flex; gap:3px; flex:none; align-items:center; margin-left:4px}
  .ab{width:15px; height:15px; border-radius:3px; font:700 10px/15px "Courier New",monospace; text-align:center; border:1px solid var(--line); color:var(--muted); background:#0a0f16}
  .ab-has{background:rgba(87,201,138,.28); border-color:var(--good); color:#9af0bf}
  .ab-unsure{background:rgba(240,180,41,.26); border-color:var(--accent2); color:#f6d98a}
  .ab-lacks{background:rgba(224,89,107,.2); border-color:#7a3a44; color:#e79aa4}
  .ab-unasked{opacity:.32}
  .stat{margin-bottom:8px}
  .stat .row{display:flex; justify-content:space-between; font-size:11px; margin-bottom:3px; font-family:"Courier New",monospace; letter-spacing:.5px}
  .bar{height:6px; border-radius:4px; background:#0a0f16; overflow:hidden; border:1px solid var(--line)}
  .bar i{display:block; height:100%; transition:width .5s ease}
  .daysbig{font-family:"Courier New",monospace; font-size:26px; color:var(--accent2); text-align:center; letter-spacing:1px}
  .daysbig small{display:block; font-size:10px; letter-spacing:2px; color:var(--muted); text-transform:uppercase}
  .side .btn{width:100%; text-align:center; margin-top:9px}

  .modal{position:fixed; inset:0; background:rgba(4,7,11,.72); display:none; place-items:center; z-index:50; padding:24px}
  .modal.open{display:grid}
  .reader{background:var(--paper); color:var(--paperink); max-width:720px; width:100%; max-height:86vh; overflow-y:auto; border-radius:8px; padding:30px 38px; font-family:Georgia,"Times New Roman",serif; box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .reader .hdr{border-bottom:2px solid #b9ac8c; padding-bottom:10px; margin-bottom:18px}
  .reader .hdr .from{font-family:"Courier New",monospace; font-size:12px; color:#6b5f45}
  .reader h1{font-size:25px; margin:6px 0 2px; font-weight:700} .reader .lede{font-style:italic; color:#5c5138}
  .reader p{margin:0 0 13px; font-size:16px; line-height:1.65}
  .reader .close{position:sticky; top:0; float:right; background:#3a3020; color:var(--paper); border:none; border-radius:6px; padding:7px 14px; cursor:pointer; font-family:"Courier New",monospace}
  .mailrow{padding:9px 11px; border-radius:7px; cursor:pointer; border:1px solid transparent}
  .mailrow:hover{background:#111a24; border-color:var(--line)} .mailrow .subj{font-size:14px; font-weight:600}
  .mailrow.unread .subj::before{content:"● "; color:var(--accent2)} .mailrow .m{font-size:11px; color:var(--muted); font-family:"Courier New",monospace}

  .title-screen{max-width:680px; margin:5vh auto 0; text-align:center}
  .title-screen h1{font-size:42px; letter-spacing:1px; margin:0 0 6px}
  .title-screen .subt{color:var(--accent2); font-family:"Courier New",monospace; letter-spacing:3px; text-transform:uppercase; font-size:13px}
  .title-screen .blurb{color:var(--muted); margin:20px auto; max-width:580px; text-align:left}
  .title-screen .blurb p{margin:0 0 12px} .title-screen .blurb b{color:var(--ink)}
  .flash{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:#12202c; border:1px solid var(--accent); color:var(--ink); padding:11px 20px; border-radius:10px; font-size:14px; box-shadow:0 10px 40px rgba(0,0,0,.5); z-index:60; animation:rise .3s ease}
</style>

<body>
<div class="wrap">
  <main class="stage">
    <div class="topbar">
      <h1>The Calibration Witness</h1>
      <span class="days" id="daysLabel"></span>
      <span class="loc" id="locLabel"></span>
    </div>
    <div class="log" id="log"></div>
  </main>
  <aside class="side" id="side"></aside>
</div>
<div class="modal" id="modal"><div class="reader" id="reader"></div></div>

<script>
/* =====================================================================
   THE GERMLINE WITNESS — a Clue-style deduction game about CRISPR.
   Solve WHO is behind it + WHERE it culminates + WHAT is happening.
   Three informants (not the suspects) each HOLD 2 clues. Travel the campus
   (1-2 days a hop), pick an informant, and make a SUGGESTION from dropdowns:
   a specific WHO and a specific WHAT (WHERE = where you stand). Answer their
   three questions — ace all for up to 2 clues, one slip for 1, two+ for none —
   and they can only cross off clues they actually hold. A CRISPR bulletin
   pops up before every appointment. Beat the countdown, then accuse.
   Teaches gene-editing mechanism, detection, and ethics; the "bioweapon"
   theory is the overclaim to reject. Shares its engine with calibration-witness.html.
   ===================================================================== */

const DAYS_TOTAL = 8;   // a clean 3x3x3 solve needs ~5 days; this leaves room for slips
const G = {
  view:"title", daysLeft:DAYS_TOTAL, loc:"hq",
  revealed:{}, crossed:{who:{},where:{},what:{}}, clues:[],
  topicQ:{}, given:{}, standing:50, emails:[], emailsRead:{},
  ask:{}, // ask[informant]["cat:id"] = "has" | "lacks" | "unsure" — what we've learned per informant per card
  comboIdx:{}, // per place|person combo, which of its two topics to show next
  meet:null, finished:false,
};
/* Replayability: deal the non-solution clues (the true answers are never held)
   among the informants — an equal number each — so the route and whom-to-press
   differ every game. Works for any category/informant counts. */
function shuffleHands(){
  const pool=[];
  ["who","where","what"].forEach(cat=>CATS[cat].items.forEach(it=>{ if(it.id!==CATS[cat].truth) pool.push({cat:cat,id:it.id}); }));
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
  const infs=Object.keys(CHARACTERS);
  const per=Math.floor(pool.length/infs.length);
  infs.forEach((inf,k)=>{ CHARACTERS[inf].hand=pool.slice(k*per,(k+1)*per); });
}
const key=b=>b.cat+":"+b.id;

/* --------------------------- CLUE CARDS ---------------------------- */
const CATS = {
  who:{ title:"Who is behind it", truth:"kessler", items:[
    {id:"vane",    label:"Prof. Aris Vane — gene-therapy PI"},
    {id:"sable",   label:"Dr. Sable — embryologist"},
    {id:"kessler", label:"Director Kessler — institute head & ethics chair"},
  ]},
  where:{ title:"Where it culminates", truth:"clinic", items:[
    {id:"genomics", label:"Genomics & Sequencing Core"},
    {id:"hq",       label:"Institute HQ & Bioethics Office"},
    {id:"clinic",   label:"IVF & Embryology Clinic"},
  ]},
  what:{ title:"What is happening", truth:"germline", items:[
    {id:"bioweapon", label:"An engineered-pathogen bioweapon"},
    {id:"somatic",   label:"An approved somatic gene-therapy program, only"},
    {id:"germline",  label:"Undeclared human germline editing, behind a cover-up"},
  ]},
};
function itemLabel(cat,id){ const it=CATS[cat].items.find(x=>x.id===id); return it?it.label:id; }
function shortLabel(cat,id){ return itemLabel(cat,id).split(" — ")[0]; }

/* ----------------------------- BOARD ------------------------------- */
const PLACES = {
  hq:       {name:"Institute HQ & Bioethics Office", xy:[140,90]},
  genomics: {name:"Genomics & Sequencing Core",      xy:[330,240]},
  clinic:   {name:"IVF & Embryology Clinic",         xy:[520,90]},
};
const EDGES = [["hq","genomics"],["genomics","clinic"]];
function adjacent(a,b){ return EDGES.some(e=>(e[0]===a&&e[1]===b)||(e[0]===b&&e[1]===a)); }
function travelCost(a,b){ return a===b?1:(adjacent(a,b)?1:2); }

/* --------------------------- INFORMANTS ---------------------------- */
/* Not the suspects. Each HOLDS exactly 3 clues (one per category). Meetable
   at ANY place. Hands are shuffled per game (see shuffleHands) for replay. */
const CHARACTERS = {
  nadia:{ name:"Nadia Sarto", role:"Bench technician", face:"⚗", badge:"N",
    hint:"Runs the sequencers and the edits at the bench; frightened, and looking for someone she can trust.",
    hand:[{cat:"where",id:"genomics"},{cat:"what",id:"bioweapon"}] },
  registrar:{ name:"The Registrar", role:"Records & compliance clerk", face:"▤", badge:"R",
    hint:"Keeps the approvals, consent forms, and sample manifests; understanding is the credential she can't be shown a forgery of.",
    hand:[{cat:"who",id:"vane"},{cat:"where",id:"hq"}] },
  emil:{ name:"Emil", role:"Cold-chain courier", face:"✦", badge:"E",
    hint:"Moves samples, vectors, and cryo-dewars to the institute's quiet corners; hears everything and trusts no one.",
    hand:[{cat:"who",id:"sable"},{cat:"what",id:"somatic"}] },
};

/* --------------- 3 informants x 6 places = 18 stories -------------- */
const STORIES = {
 nadia:{
  hq:"On the glass-walled administration floor Nadia looks like she might bolt. \"They parade us through here for the funders,\" she whispers. \"Down at the bench it's different. Ask me something real, and be quick about it.\"",
  genomics:"Nadia meets you between the sequencers, badge turned backward. \"This is where I actually work — where the reads come out. Some of them I was told to delete. Ask what you need to, quietly.\"",
  clinic:"Nadia will barely step inside the clinic wing. \"I came in here once, to run a sample I wish I hadn't seen. Whatever you want to know, ask fast — I don't want to be found here.\"",
 },
 registrar:{
  hq:"The Registrar is at home in the HQ file room, surrounded by binders. \"I hold every approval this institute ever filed,\" they say evenly, \"and I know exactly which ones were never filed at all.\"",
  genomics:"The Registrar has tracked a chain-of-custody form down to the sequencing core. \"Every sample here is meant to have a matching entry. Some don't. Show me you'd grasp the discrepancy first.\"",
  clinic:"In the clinic's records alcove the Registrar folds their hands. \"The consent forms in this wing are immaculate — for the wrong procedure. Prove you see the difference, and I'll let you read them.\"",
 },
 emil:{
  hq:"Emil is conspicuously out of place in the HQ atrium, cap in hand. \"They don't like the help up here,\" he mutters. \"But I hear the directors talk down in the loading bay. Prove you're worth repeating it to.\"",
  genomics:"Emil wheels a dry-ice cart past the sequencers. \"I deliver what these machines read — and half of it isn't on any manifest. You want the real inventory? Show me you'd know what you're looking at.\"",
  clinic:"Emil lingers by the clinic's cryo-store, uneasy. \"Some of my three-in-the-morning drop-offs come here, and they aren't reagents. Show me you understand what that means, and I'll give you the route.\"",
 },
};

/* ---------------------------- QUESTIONS ---------------------------- */
/* ===================== GENE-EDITING PIONEERS: 18 profiles ==========
   3 places x 3 informants = 9 combos; each maps to TWO pioneers (18 total),
   one shown per meeting (randomized per game, cycling on revisit). The
   pre-appointment circular IS that pioneer's profile; the frame is the
   informant's reason for the quiz; questions are length-balanced.
   right=expert|partial, wrong=wrong|danger.
   ==================================================================== */
const TOPICMAP = {"genomics":{"nadia":["sequencing","repair"],"registrar":["editdetect","offtarget"],"emil":["dnastructure","crisprdx"]},"clinic":{"nadia":["baseediting","primeediting"],"registrar":["somaticgermline","ivfpgd"],"emil":["embryoediting","heritability"]},"hq":{"nadia":["crisprmech","cas9"],"registrar":["bioethics","somaticmodels"],"emil":["viralvectors","dualuse"]}};
const TOPICS = {"sequencing":{"sci":"Frederick Sanger (1918-2013)","topic":"Reading DNA — Sequencing","lede":"The quiet chemist, twice a Nobel laureate, who taught us to read the code letter by letter.","no":5,"profile":"Frederick Sanger is one of only a handful of people to win two Nobel Prizes, and he gave biology the ability to read DNA base by base. His 1977 chain-termination method — 'Sanger sequencing' — dominated for decades and delivered the first human genome. Reading the exact order of the four bases is the ground truth against which every claim about a gene is checked.\n\nSanger's trick was to copy a strand in the presence of a small fraction of chemically modified bases that halt synthesis wherever they are incorporated, producing a ladder of fragments each ending in a known letter; sorting them by size reveals the sequence. Modern next-generation sequencing replaced this with massively parallel reading — millions of fragments at once — which collapsed the cost of a genome from billions of dollars to a routine expense, making it ordinary to sequence a person, a tumor, or an edited cell line.\n\nFor detecting gene editing, sequencing is decisive. An edit is, by definition, a change in the sequence, and sequencing reads that change directly: an insertion, a deletion, a swapped letter. Deep sequencing can even quantify what fraction of cells carry the edit and detect a mixture of edited alleles.\n\nFor an investigator, the lesson is that documents describe intentions while the sequence records reality. A consent form or a shipping label states what a sample is supposed to be; the sequence states what it is. When the two disagree, the reads win. Sanger, who called himself merely 'a chap who messed about in a lab,' modeled the temperament the work rewards: let the data, base by base, settle the argument.","frame":"She slides a printout of a trace toward you, hand trembling. \"They tell me the reads are clean. I don't believe them anymore. If you're a real scientist, you'll know what a sequence can and can't hide:\"","q":[{"q":"What does DNA sequencing determine about a sample?","o":[{"t":"How many copies of a gene are present, by tallying them up without regard to their order.","v":"wrong","fb":"That's quantification; sequencing reads the order of the bases, not the copy number."},{"t":"The exact order of the four bases along a strand, read one letter after another.","v":"expert","fb":"Reading the base order is exactly what sequencing does."},{"t":"Whether the cell is alive, gauged from how actively its DNA is being copied at that moment.","v":"wrong","fb":"Sequencing reads the base order; it says nothing about whether a cell is alive."},{"t":"The folded three-dimensional shape the DNA takes as it packs itself inside the nucleus.","v":"wrong","fb":"That's structural biology; sequencing gives the linear order, not a 3D shape."}]},{"q":"Why is sequencing the decisive test for whether an edit was made?","o":[{"t":"Because a sample can only be sequenced at all once it has already been deliberately edited in a lab.","v":"wrong","fb":"Any DNA can be sequenced, edited or not; the reads show whether a change is present."},{"t":"Because sequencing physically reverses the edit, letting you line up the before and after states.","v":"wrong","fb":"Sequencing reads DNA; it doesn't reverse edits or restore an original."},{"t":"Because an edit is a change in the sequence, and sequencing reads that change directly.","v":"expert","fb":"Documents state intent; the reads state reality, base by base."},{"t":"Because only edited DNA produces any readable signal at all, while untouched DNA comes back blank.","v":"wrong","fb":"Untouched DNA sequences fine; the edit shows as an altered order, not the only signal."}]},{"q":"How does next-generation sequencing (NGS) differ from the older Sanger method?","o":[{"t":"It gives up base-by-base reading and instead estimates a sequence from the DNA's total weight.","v":"wrong","fb":"NGS still reads bases; it just reads huge numbers of fragments at once."},{"t":"It reads far longer stretches in one unbroken pass, which is the source of its lower cost.","v":"partial","fb":"NGS reads are typically short; its power is massive parallelism, not longer single reads."},{"t":"It works only on synthetic lab-made DNA and cannot be used on the natural genomes of cells.","v":"wrong","fb":"NGS routinely sequences natural genomes — that's its main use."},{"t":"It reads millions of fragments in parallel, collapsing the cost of a genome to a routine level.","v":"expert","fb":"Massive parallelism made genomes cheap and edit-detection routine."}]}]},"repair":{"sci":"Maria Jasin (genome-editing pioneer)","topic":"The Double-Strand Break & DNA Repair","lede":"She proved that a single, targeted cut is what makes a genome editable at all.","no":7,"profile":"Maria Jasin, a molecular biologist at Memorial Sloan Kettering, made the discovery that quietly underwrites all of modern genome editing. In 1994, using a rare-cutting enzyme to make a single deliberate double-strand break in a mammalian genome, she showed that the break dramatically stimulates the cell to repair it by homologous recombination — copying from a supplied template. In other words, if you can make a targeted cut, you can direct a precise change. Every editing platform since — zinc fingers, TALENs, and CRISPR — rests on that principle.\n\nThe insight reframes what CRISPR actually does. Cas9 does not 'write' DNA; it cuts, and the cell's own repair machinery determines the outcome. There are two main routes. Non-homologous end joining (NHEJ) simply rejoins the broken ends and is error-prone, frequently leaving small insertions or deletions — the indels that disrupt a gene's reading frame and make NHEJ the workhorse for knockouts. Homology-directed repair (HDR), the pathway Jasin illuminated, uses a template to make precise changes, but works mainly in dividing cells and is far less efficient.\n\nThe pathway that acted leaves evidence of intent. A site riddled with varied indels points to NHEJ-driven knockout; a clean, templated change points to deliberate HDR. In embryos, where repair is unpredictable, editing tends to produce mosaics and stray indels rather than the clean correction advertised.\n\nFor an investigator, Jasin's principle turns the biology into readable evidence: the nuclease is just the scissors, and the scar in the sequence records which repair pathway the cell used — and therefore whether the operators meant to destroy a gene, precisely rewrite one, or were working where they could not control the result.","frame":"On the far bench, away from the cameras, Nadia whispers. \"Everyone says CRISPR 'writes' the gene. I don't think that's even how it works — and if you can explain what really happens, I'll trust you with the rest:\"","q":[{"q":"In classic CRISPR editing, what actually produces the edit?","o":[{"t":"Cas9 writes the intended new sequence straight into the DNA at the very moment it cuts.","v":"wrong","fb":"Cas9 only cuts; it doesn't write the new sequence in classic editing."},{"t":"The guide RNA fills the break with its own sequence, acting as the template for the change.","v":"wrong","fb":"The guide targets the cut; it isn't copied into the DNA as the repair template."},{"t":"The cell's own repair of the break Cas9 makes determines the outcome.","v":"expert","fb":"Editing is really provoking a cut and steering the repair."},{"t":"The PAM signal beside the target rearranges itself to spell out the desired new bases.","v":"wrong","fb":"The PAM is a targeting motif, not a source of edited sequence."}]},{"q":"Why is error-prone end joining (NHEJ) the workhorse for knocking out a gene?","o":[{"t":"Because it copies a supplied donor template across the break to insert a clean stop codon.","v":"wrong","fb":"That describes template-directed HDR, not error-prone NHEJ."},{"t":"Because it precisely restores the gene, which somehow silences it in the process.","v":"wrong","fb":"It doesn't restore precisely; it leaves indels that scramble the gene."},{"t":"Because it leaves small indels that shift the reading frame and disrupt the protein.","v":"expert","fb":"Frameshifting indels from sloppy repair are exactly how a knockout is made."},{"t":"Because it works only in reproductive cells, which conveniently makes the knockout heritable.","v":"wrong","fb":"NHEJ works broadly; heritability depends on the cell type, not the pathway."}]},{"q":"What does the type of repair scar tell an investigator about intent?","o":[{"t":"Nothing at all, since every possible repair outcome looks completely identical in the sequence.","v":"wrong","fb":"They look distinct — varied indels versus a clean templated change — and that reveals intent."},{"t":"That a clean change proves the work was harmless and needs no further scrutiny whatsoever.","v":"wrong","fb":"Precision indicates deliberate, capable editing — often more concerning, not less."},{"t":"That any indel at all automatically proves an attempt to build a heritable trait in the germline.","v":"wrong","fb":"Indels indicate a knockout; heritability depends on whether it was a germline cell."},{"t":"Scattered indels point to a knockout, while a clean templated change points to deliberate editing.","v":"expert","fb":"The scar records which repair pathway acted, and so what they were trying to do."}]}]},"editdetect":{"sci":"Kiran Musunuru (physician-scientist)","topic":"Detecting an Edit — and Mosaicism","lede":"The doctor who read the CRISPR babies' data and showed the world what had really been done.","no":17,"profile":"Kiran Musunuru is a physician-scientist and geneticist who became the field's most exacting reader of what an edit actually did. When He Jiankui's claim of edited babies broke, Musunuru obtained and forensically analyzed the underlying sequencing data, and his dissection — later a book — laid bare the recklessness: the intended change had not been faithfully made, the embryos were mosaic, and the risks were unquantified. He also leads genuine therapeutic editing work, including a landmark bespoke base-editing treatment for a single infant. He embodies the analyst's creed: don't take the claim, read the reads.\n\nThe methods are precise. To detect and characterize an edit, you amplify the target region by PCR and sequence it. Error-prone repair leaves small insertions or deletions clustered at the cut site; a supplied template leaves the intended change; tools decompose the mixture of alleles present, and deep sequencing counts them.\n\nThe most revealing quantity is heterogeneity. A clean cell line edited early and uniformly shows one or two consistent alleles. But an embryo edited after fertilization has begun acquires different edits — or none — in different cells, producing a mosaic individual whose tissues carry a patchwork of genotypes. Mosaicism is both a safety alarm and a fingerprint: it points specifically to editing an early embryo.\n\nFor an investigator, Musunuru is the model. Editing is easy to deny and hard to hide from a sequencer. A facility can claim its work is confined to cell cultures, but a mosaic pattern spread across tissue types tells a different story — one consistent with a human embryo edited and allowed to develop. Distinguish real signal from artifact with proper controls, then read the pattern of alleles, not merely their presence.","frame":"The Registrar does not look up from the logbook. \"Anyone can carry a compliance badge. Tell me how one actually proves a sample was edited, and I'll consider showing you which samples went missing from the record:\"","q":[{"q":"After a CRISPR cut is mended by error-prone joining, what do you see when you sequence the target?","o":[{"t":"A perfectly restored original sequence, because the cell always mends its breaks flawlessly.","v":"wrong","fb":"Error-prone joining is far from flawless; the scars are how it disrupts genes."},{"t":"The entire gene deleted from the genome, since a double-strand break destroys the whole region.","v":"wrong","fb":"A break is a local cut mended locally; it leaves small indels, not loss of a whole gene."},{"t":"Small insertions or deletions clustered at the cut site — the indels that mark the repair.","v":"expert","fb":"Indels at the cut site are the fingerprint of error-prone repair."},{"t":"A visible color change appearing in the DNA at exactly the spot where the enzyme made its cut.","v":"wrong","fb":"DNA has no such marker; the edit is read as altered sequence, not color."}]},{"q":"An edit appears in some of an embryo's cells but not others — a patchwork. What is this?","o":[{"t":"Contamination, which is meaningless noise that should simply be filtered out of the analysis.","v":"wrong","fb":"A patchwork of genotypes in one individual is mosaicism, a real and revealing result."},{"t":"Proof of a clean, uniform edit, since finding it in several cells confirms it took hold everywhere.","v":"wrong","fb":"Uniformity would be the same allele in every cell; a patchwork is the opposite."},{"t":"Mosaicism — a hallmark of editing an early embryo, and a fingerprint of embryo work.","v":"expert","fb":"Mosaicism points specifically to editing after fertilization began."},{"t":"An ordinary feature of every somatic therapy, fully expected in any patient's treated blood cells.","v":"wrong","fb":"Somatic therapies aim for uniform editing; embryo mosaicism is a distinct, telling pattern."}]},{"q":"Why can an institute claim 'cell-culture work only' yet be caught by the sequence data?","o":[{"t":"Because cultured cells cannot actually be sequenced, so any readable data must have come from a person.","v":"wrong","fb":"Cultured cells sequence perfectly well; the tissue-spanning mosaic pattern is the tell."},{"t":"Because sequencing a sample always reveals the specific building it was collected in.","v":"wrong","fb":"Sequencing reads DNA, not locations; the genotype pattern implies embryo origin."},{"t":"Because editing cell cultures is impossible, so any edit found proves work on a whole organism.","v":"wrong","fb":"Editing cell cultures is routine; the giveaway is the mosaic, multi-tissue spread."},{"t":"Because a mosaic edit across many tissue types fits an embryo grown into a body, not a cell line.","v":"expert","fb":"The pattern of alleles across tissues betrays embryo editing despite the claim."}]}]},"offtarget":{"sci":"J. Keith Joung (CRISPR specificity)","topic":"Off-Target Editing & Specificity","lede":"He built the tools to find where CRISPR cuts by mistake — and to stop it.","no":13,"profile":"J. Keith Joung, a pathologist and molecular biologist at Massachusetts General Hospital and Harvard, is one of the field's foremost authorities on the accuracy of gene editing. His laboratory developed both the means to measure where CRISPR cuts unintentionally and high-fidelity Cas9 variants engineered to cut only where intended. If Doudna and Charpentier made CRISPR programmable, Joung and colleagues made it accountable.\n\nThe problem he addressed is fundamental. CRISPR-Cas9 is aimed by a short guide RNA, about twenty bases long, that base-pairs with its target. But the enzyme tolerates imperfection, and a guide can bind and cut other genomic sites that differ by a few mismatches, especially beside a valid PAM. These off-target edits — unintended changes scattered across the genome — are the central safety problem of editing, because an accidental cut can silence a tumor-suppressor gene or disrupt a vital function.\n\nJoung's group created GUIDE-seq and related methods to detect real off-target cuts genome-wide, rather than merely predicting them from the guide sequence, and engineered variants like SpCas9-HF1 to raise specificity. The discipline is to design unique guides, use high-fidelity enzymes, limit the dose and duration of Cas9 activity, and then measure what actually happened.\n\nFor an investigator, off-target analysis is both a safety obligation and a forensic tool. An off-target edit that harmed a trial participant — silencing a gene it was never meant to touch — is exactly the adverse event an institute would be tempted to bury. The same whole-genome scan a responsible lab runs to protect patients is what an auditor runs to expose a concealed harm. A program that cannot produce its off-target data, or whose data vanished after a patient fell ill, is telling you where to look.","frame":"\"I file the safety reports — including the ones that were quietly unfiled,\" the Registrar says. \"You'll need to understand what an off-target event is before I trust you with what happened to a certain patient:\"","q":[{"q":"What is an off-target edit?","o":[{"t":"An edit made correctly at the intended site but, by a mix-up, in the wrong patient's cells.","v":"wrong","fb":"Off-target means the wrong genomic site, not the wrong patient."},{"t":"An edit that fails completely, leaving the intended target sequence entirely unchanged.","v":"wrong","fb":"A failed edit is simply no edit; an off-target edit is a real change in the wrong place."},{"t":"A cut and edit at an unintended site that resembles the target, made by the same guide.","v":"expert","fb":"Guides tolerate mismatches and can act at similar sequences elsewhere."},{"t":"A deliberate second edit placed nearby on purpose to reinforce the effect of the first one.","v":"wrong","fb":"Off-target edits are unintended, not deliberate reinforcements."}]},{"q":"How is a guide's off-target activity actually measured, rather than merely assumed?","o":[{"t":"By trusting the design software, since a well-scored guide is guaranteed to have zero off-target sites.","v":"wrong","fb":"Prediction narrows candidates but can't guarantee; you must measure empirically."},{"t":"By counting how many cells were edited overall, since a high count means the off-target risk is low.","v":"wrong","fb":"Total editing says nothing about where the unintended cuts actually landed."},{"t":"By re-reading the intended site over and over until its editing efficiency finally stabilizes.","v":"wrong","fb":"That measures on-target efficiency, not where else the guide cut."},{"t":"By genome-wide assays like GUIDE-seq or whole-genome sequencing of the edited cells.","v":"expert","fb":"You measure real off-target cuts across the genome, not just predict them."}]},{"q":"Why is off-target analysis both a safety duty and a forensic tool in this case?","o":[{"t":"Because off-target edits are harmless, so a lab's records of them are never worth concealing.","v":"wrong","fb":"Off-target edits can disable vital genes; a concealed injury is exactly the concern."},{"t":"Because measuring a program's off-target edits is what proves it must be building a bioweapon.","v":"danger","fb":"Off-target data speaks to safety and accuracy, not weapons — that's an overclaim."},{"t":"Because off-target sites can only ever be found after the results have been publicly announced.","v":"wrong","fb":"They're found by lab assays at any time; no announcement is needed."},{"t":"Because an off-target edit that injured a patient is just the adverse event an institute would bury.","v":"expert","fb":"The same scan that protects patients is what exposes a concealed harm."}]}]},"dnastructure":{"sci":"Rosalind Franklin (1920-1958)","topic":"The Double Helix & Base Pairing","lede":"Her X-ray photograph made the structure of the molecule of heredity undeniable.","no":2,"profile":"Rosalind Franklin was the British physical chemist whose X-ray diffraction images of DNA — above all the famous 'Photo 51' — captured the molecule's helical form and dimensions with a precision that made the double helix undeniable. Her meticulous crystallography was shown, without her knowledge, to James Watson and Francis Crick, who used it to build their 1953 model. She died of cancer at 37, before the 1962 Nobel Prize, and her decisive contribution was long underacknowledged.\n\nThe structure she resolved is the foundation of everything that follows. DNA is a double helix of two antiparallel strands, and its four bases pair by a strict rule: adenine with thymine, guanine with cytosine. That complementary pairing is not a detail; it is the mechanism of heredity. Because each strand specifies the other, DNA can be copied faithfully, and because a sequence can be read, it can encode genes.\n\nComplementary base pairing is also exactly what makes editing and its detection possible. A CRISPR guide RNA finds its target by base-pairing with a matching DNA sequence; a PCR primer binds the same way; sequencing and diagnostic probes all rely on A-T and G-C recognition. The whole toolkit is an exploitation of Franklin's helix.\n\nFor an investigator, her story is a caution embedded in the science. Structurally, the pairing rule means DNA is legible and targetable — nothing about editing is magic, only chemistry obeying a code. Humanly, the record of who discovered what can be quietly rewritten, and the careful reader must look past the credited names to the underlying data. The helix keeps its own honest account; so should you.","frame":"Emil leans on a humming freezer. \"I haul the stuff of life around in dry ice, and I don't do it for tourists. Prove you're a real scientist — start with what's actually inside these tubes:\"","q":[{"q":"What is the base-pairing rule of the DNA double helix?","o":[{"t":"Any base can pair with any other, which is precisely what lets DNA store so much information.","v":"wrong","fb":"Pairing is strict, not arbitrary; that strictness is what makes copying faithful."},{"t":"Each base pairs with an identical copy of itself, so an A faces an A and a G faces a G.","v":"wrong","fb":"Bases pair with their complements, not identical partners."},{"t":"Adenine pairs with thymine and guanine with cytosine, across two antiparallel strands.","v":"expert","fb":"A-T and G-C complementary pairing is the core rule."},{"t":"The bases pair only when a dedicated protein is present to dictate the matching each time.","v":"wrong","fb":"Pairing is intrinsic chemistry between the bases; no protein dictates it."}]},{"q":"Why is complementary base pairing the foundation of the whole gene-editing toolkit?","o":[{"t":"Because it makes DNA chemically inert, so the various tools can handle it without it reacting.","v":"wrong","fb":"Pairing is about specific recognition, not inertness; the recognition is what tools exploit."},{"t":"Because it lets DNA be cut at random anywhere along its length, giving the editors free rein.","v":"wrong","fb":"Editing is targeted precisely by base-pairing — the opposite of random cutting."},{"t":"Because a guide RNA, a PCR primer, and a probe all find their target by matching bases.","v":"expert","fb":"Guides, primers, and probes are all applications of the pairing rule."},{"t":"Because it stores the chemical energy that powers the editing enzymes throughout a reaction.","v":"wrong","fb":"Pairing provides sequence recognition, not an energy source."}]},{"q":"Franklin's data underpinned the double helix but she went largely uncredited. What is the lesson?","o":[{"t":"That crystallography is fundamentally unreliable, so structural claims should be discounted.","v":"wrong","fb":"Her data were superb; the lesson is about credit, not reliability."},{"t":"That discovery is always a solo effort, which makes any shared credit a purely modern invention.","v":"wrong","fb":"Her story shows discovery is collaborative and credit can be misassigned."},{"t":"That the record of who discovered what can be quietly rewritten, so look past the credited names.","v":"expert","fb":"A caution embedded in the science — read the underlying evidence."},{"t":"That women were absent from early molecular biology, so the old records can be trusted as complete.","v":"wrong","fb":"Franklin's central role shows the record was incomplete and must be questioned."}]}]},"crisprdx":{"sci":"Feng Zhang (b. 1981)","topic":"CRISPR as a Detector — SHERLOCK & DETECTR","lede":"He put CRISPR into human cells first — then turned it into a diagnostic.","no":12,"profile":"Feng Zhang, a bioengineer at the Broad Institute and MIT, was among the first to demonstrate CRISPR-Cas9 editing in mammalian and human cells in early 2013, helping ignite the field's explosive growth. He later showed that CRISPR is not only a scalpel but a detector, developing the SHERLOCK diagnostic — a use that is, for an investigator, poetically apt: the operators' own technology turned into a tool to catch them.\n\nThe detection principle exploits a curious behavior. Certain Cas enzymes, once they recognize their target nucleic acid, begin to cleave other nearby molecules indiscriminately — 'collateral cleavage.' By supplying reporter molecules that produce a signal when cut, a CRISPR reaction can be made to announce, quickly and specifically, whether a particular DNA or RNA sequence is present. Zhang's SHERLOCK uses Cas13 to detect RNA; the related DETECTR, from Jennifer Doudna's group, uses Cas12 for DNA. Both are cheap, fast, and sensitive, and were adapted into point-of-care tests, including for the virus that causes COVID-19.\n\nBecause the guide can be programmed to any sequence, these tools can be designed to detect a specific pathogen — or a specific edited region of a genome.\n\nFor an investigator, this closes a satisfying loop. The institute uses CRISPR to make edits; you can use CRISPR to find them — in the field, cheaply, without shipping samples to a sequencer the institute controls. Understanding detection as the mirror image of editing, recognition by base-pairing followed by a measurable Cas action, hands the sharper edge of the technology to whoever is asking the honest questions.","frame":"\"You want proof without shipping samples through their lab?\" Emil raises an eyebrow. \"There's a way to test right here in the field. Show me you know it, and I'll get you what you need to run it:\"","q":[{"q":"How can CRISPR be turned into a diagnostic detector?","o":[{"t":"By editing the pathogen's own genome so that it can no longer cause any disease in the host.","v":"wrong","fb":"That's editing, not detection; a diagnostic reports presence, it doesn't cure."},{"t":"By having a Cas enzyme, once it recognizes its target, cleave reporter molecules to give a signal.","v":"expert","fb":"Collateral cleavage of reporters announces the target's presence."},{"t":"By sequencing the entire sample end to end and reading out every gene that it happens to contain.","v":"wrong","fb":"CRISPR diagnostics give a fast targeted yes/no, distinct from full sequencing."},{"t":"By growing the sample in culture for several weeks and waiting until visible colonies appear.","v":"wrong","fb":"CRISPR detection is rapid and molecular, not a slow culture method."}]},{"q":"Why is CRISPR detection such a useful field tool for an investigator?","o":[{"t":"Because it can only ever be run inside the institute's own tightly controlled sequencing core.","v":"wrong","fb":"Its advantage is portability — you can run it in the field, away from their lab."},{"t":"Because it completely destroys the sample, so that no one can quietly re-test it afterward.","v":"wrong","fb":"It reports the presence of a sequence; destroying the sample isn't the point."},{"t":"Because it only begins to work after the target sequence has been publicly announced.","v":"wrong","fb":"It works on any programmed target immediately; no announcement is needed."},{"t":"Because it can be programmed to a specific sequence and give a rapid yes/no on the spot.","v":"expert","fb":"You can design an assay against an edited region and test without a distant lab."}]},{"q":"What is the poetic irony of CRISPR diagnostics in this case?","o":[{"t":"That detection and editing share nothing at all in common despite carrying the very same name.","v":"wrong","fb":"They share the same programmable base-pairing recognition — that's the irony."},{"t":"That a CRISPR diagnostic can only detect natural DNA and never a sequence that has been edited.","v":"wrong","fb":"A programmed assay can target an edited region specifically."},{"t":"That running such an assay would first require obtaining the institute's own written permission.","v":"wrong","fb":"It's a portable assay the investigator can run independently."},{"t":"That the operators' own editing technology can be turned into the tool that detects their edits.","v":"expert","fb":"The editor becomes the detector — recognition by base pairing, then a measurable Cas action."}]}]},"baseediting":{"sci":"David Liu (b. 1973)","topic":"Base Editing — Rewriting One Letter","lede":"The chemist who learned to change a single letter of the code without cutting it.","no":14,"profile":"David Liu, a chemist at the Broad Institute, has produced the most precise editing tools yet, beginning with base editing in 2016. Where classic CRISPR cuts both strands and relies on error-prone repair, base editing rewrites a single letter directly, with no double-strand break — a fundamentally gentler and more exact approach.\n\nA base editor fuses a disabled or 'nicking' Cas9, which still finds the target but does not cut cleanly across, to an enzyme that chemically converts one base into another. Cytosine base editors change a C to a T; adenine base editors change an A to a G. Guided to a precise spot, the editor converts the target base and the cell's ordinary machinery finishes the job, installing an exact single-letter change without the indels and upheaval of a double-strand break. This matters because a large share of known disease-causing mutations are single-letter changes — exactly what base editing can correct.\n\nThe precision cuts both ways for an investigator. Base editing is safer and leaves fewer of the messy indels that betray crude cutting; a base-edited site shows a clean, specific letter change. But that very cleanliness is a signature of sophistication: a program using base editing is not a crude operation but a well-resourced, technically advanced one, capable of installing exactly the change it intends.\n\nFor this case, base editing marks the difference between a blunt instrument and a scalpel. Finding precise, programmed single-letter changes — rather than the ragged indels of knockout work — tells you the operators had both the intent and the capability to rewrite specific human traits or correct specific mutations deliberately. The tool's elegance is itself evidence of how seriously, and how capably, someone meant to edit.","frame":"Near the clinic she can barely stand still. \"The precise tools — the ones that don't even cut — that's what frightens me most. If you understand them, you'll understand what they were trying to do here:\"","q":[{"q":"How does base editing differ from classic CRISPR cutting?","o":[{"t":"It makes an even larger double-strand break than usual in order to force a bigger change.","v":"wrong","fb":"It avoids the double-strand break entirely — that's the whole point."},{"t":"It deletes the entire gene from the genome rather than changing just a single letter of it.","v":"wrong","fb":"Base editing changes one letter precisely; it doesn't delete genes."},{"t":"It chemically converts one base into another with no double-strand break at all.","v":"expert","fb":"A gentler, exact single-letter change without cutting both strands."},{"t":"It works only by supplying a long donor DNA template for the cell to copy across the break.","v":"wrong","fb":"Base editing needs no donor template; it converts a base in place."}]},{"q":"Why does base editing matter so much for treating disease?","o":[{"t":"Because most diseases are caused by the loss of whole chromosomes, which base editing restores.","v":"wrong","fb":"Base editing addresses single-letter changes, not whole-chromosome loss."},{"t":"Because it can only be used to enhance already-healthy traits, and never to correct a mutation.","v":"wrong","fb":"Its main promise is correcting pathogenic point mutations."},{"t":"Because it edits RNA instead of DNA, so any change it makes is temporary and therefore safe.","v":"wrong","fb":"Standard base editors change DNA; the safety comes from avoiding the double-strand break."},{"t":"Because a large share of disease mutations are single-letter changes it can precisely correct.","v":"expert","fb":"Point-mutation diseases are exactly what base editing targets."}]},{"q":"Why is the mere presence of base or prime editing itself a clue about a program?","o":[{"t":"It proves the operators were incompetent, since precise tools are a clear sign of a lack of skill.","v":"wrong","fb":"Precise editing signals sophistication and capability, not incompetence."},{"t":"It shows the work must be harmless, since gentle tools can never accomplish anything serious.","v":"wrong","fb":"Precision often makes deliberate edits more, not less, consequential."},{"t":"It indicates the facility only edits plants, which are the organisms that need base editors.","v":"wrong","fb":"Base and prime editing are used across organisms, including human cells."},{"t":"It marks a well-resourced, advanced operation able to install exactly the change it intends.","v":"expert","fb":"The tool's elegance is itself evidence of how capably someone meant to edit."}]}]},"primeediting":{"sci":"Andrew Anzalone (prime editing, 2019)","topic":"Prime Editing — Search and Replace","lede":"As a young researcher, he devised a genomic find-and-replace that needs no cut.","no":18,"profile":"Andrew Anzalone was a postdoctoral researcher in David Liu's laboratory when, in 2019, he devised prime editing — the most versatile precise editor developed to date, often described as a genomic 'search and replace.' The idea reportedly came to him thinking about the problem late at night; the result can install any single-letter change, as well as small insertions and deletions, without a double-strand break and without a separate donor DNA template.\n\nThe system combines a nicking Cas9 with a reverse transcriptase — an enzyme that writes DNA from an RNA instruction — and a specially extended guide, the pegRNA, that carries both the address of the target and the text of the desired edit. The nickase opens one strand; the reverse transcriptase then copies the new sequence, written on the pegRNA, directly into the genome. Because the edit's instructions travel with the guide, prime editing is exceptionally flexible, in principle addressing the great majority of known pathogenic variants.\n\nFor a program with serious intentions, prime editing is the tool of choice when precise, arbitrary changes are needed and the collateral damage of cutting is unacceptable — for instance in an embryo, where indels and mosaicism are especially dangerous. Its presence signals advanced capability and deliberate, fine-grained editing.\n\nFor an investigator, a prime-edited site is a confession of precision. The change is exactly what was programmed, installed with minimal scarring, which both narrows the question of intent — they meant to make this specific change — and marks the operators as capable of the most controlled edits available. Crude editing can be waved away as an experiment gone wrong; a clean prime edit at a human gene is a deliberate, sophisticated act.","frame":"\"They call it search-and-replace like it's nothing,\" she says. \"A real specialist would know why that precision matters so much for what happens in that room. Show me:\"","q":[{"q":"What can prime editing do that base editing cannot?","o":[{"t":"Nothing of note, since prime editing is simply an older and less capable version of base editing.","v":"wrong","fb":"Prime editing is newer and more versatile, handling changes base editing can't."},{"t":"Edit only RNA while leaving the underlying DNA sequence of the cell entirely untouched.","v":"wrong","fb":"Prime editing writes changes into the DNA itself."},{"t":"Install small insertions and deletions as well as any letter change, without a break or template.","v":"expert","fb":"Its search-and-replace flexibility exceeds base editing's letter swaps."},{"t":"Cut both strands of the DNA cleanly across in order to force the error-prone repair pathway.","v":"wrong","fb":"It uses a nickase and avoids the clean double-strand break of classic CRISPR."}]},{"q":"How does prime editing carry the instructions for the change it makes?","o":[{"t":"On a completely separate donor DNA molecule that is supplied alongside the editing enzyme.","v":"wrong","fb":"Prime editing needs no separate donor; the edit is written on the guide itself."},{"t":"In the PAM sequence beside the target, which is rearranged to spell out the intended new bases.","v":"wrong","fb":"The PAM is a fixed targeting signal, not a carrier of the edit's text."},{"t":"Nowhere in particular, since prime editing makes random changes and selects the useful ones later.","v":"wrong","fb":"The change is programmed on the pegRNA, not random."},{"t":"On an extended guide (pegRNA) that a reverse transcriptase then copies into the genome.","v":"expert","fb":"The pegRNA carries both the address and the text of the edit."}]},{"q":"Why is a clean prime-edited site hard to dismiss as an accident?","o":[{"t":"Because prime editing fails so frequently that any successful result must simply be a fluke.","v":"wrong","fb":"A precise programmed change is the opposite of a fluke; it's deliberate."},{"t":"Because prime editing leaves large, random deletions that look just like ordinary natural damage.","v":"wrong","fb":"It's designed to minimize collateral scarring, making the edit look intentional."},{"t":"Because prime editing can only ever occur spontaneously, entirely without human direction at all.","v":"wrong","fb":"It requires deliberately designed components; nothing about it is spontaneous."},{"t":"Because the change is exactly what was programmed, with minimal scarring — a deliberate act.","v":"expert","fb":"The more precise the tool, the harder to claim the result was an accident."}]}]},"somaticgermline":{"sci":"David Baltimore (b. 1938)","topic":"The Somatic / Germline Line","lede":"The Nobel laureate who twice convened the world to draw the line at the germ line.","no":16,"profile":"David Baltimore, a Nobel laureate virologist and a central figure in the governance of biotechnology, chaired the international summits on human genome editing in 2015 and 2018 that articulated the field's most important boundary. A veteran of the 1975 Asilomar meeting decades earlier, he brought the same instinct — that scientists must confront the implications of their power in the open — to the CRISPR era, and it was at the 2018 summit that news of the CRISPR babies broke, forcing the line he had helped draw into the headlines.\n\nThat line is between somatic and germline editing. A somatic edit alters the DNA of ordinary body cells — blood, liver, muscle — and affects only the person treated; when they die, the change is gone. A germline edit alters eggs, sperm, or an early embryo, so the change is present in every cell of the resulting person, including their own reproductive cells, and passes to all descendants.\n\nThe difference is not one of degree but of kind. Somatic editing is medicine: consented, regulated, and now approved for several diseases. Germline editing of humans alters the heritable makeup of future people who cannot consent, and, at scale, the human gene pool itself; clinical germline editing is prohibited or under moratorium across essentially the entire world.\n\nFor an investigator, Baltimore's line is the whole game. A program can be entirely legitimate on the somatic side and criminal a single step across. The task is not to detect editing — editing is everywhere and much of it is good — but to determine which side of this line the concealed work is on. Everything else in the case serves that one question.","frame":"The Registrar finally meets your eyes. \"This is the only distinction that matters in my drawers. Get it right and I'll open them. Get it wrong and you're another auditor who signed whatever we handed you:\"","q":[{"q":"An edit sits only in a patient's blood in one case, and in an embryo bound for implantation in another. Why is the ethical weight so different?","o":[{"t":"Because both are truly identical in consequence, since any CRISPR edit alters the DNA the same way.","v":"wrong","fb":"They differ fundamentally: only the embryo edit is heritable."},{"t":"Because the somatic case is graver, as blood cells divide fastest and spread the change bodywide.","v":"wrong","fb":"Somatic edits stay with the individual; the heritable germline edit carries the greater weight."},{"t":"Because the only real difference is cost, since embryo work needs IVF and heavier oversight.","v":"wrong","fb":"The difference is heritability and the consent of future people, not expense."},{"t":"Because somatic edits affect only the treated person, while embryo edits pass to every descendant.","v":"expert","fb":"Heritability across generations is the whole distinction."}]},{"q":"Why is clinical human germline editing under near-universal prohibition?","o":[{"t":"Because it is simply technically impossible, so laws merely forbid what could never be done anyway.","v":"wrong","fb":"It is technically possible — which is precisely why it is prohibited."},{"t":"Because somatic therapies work better, so germline editing is unnecessary and banned on that basis.","v":"wrong","fb":"The prohibition rests on the ethics of heritable non-consented change, not efficacy."},{"t":"Because it can only ever be used to enhance traits, and trait enhancement is illegal everywhere.","v":"wrong","fb":"The ban covers heritable editing broadly, not only enhancement."},{"t":"Because it alters the heritable makeup of future people who cannot consent, and at scale the gene pool.","v":"expert","fb":"Irreversible, non-consented, heritable change is the core objection."}]},{"q":"Why is this line 'the whole game' for the investigation?","o":[{"t":"Because detecting any editing at all is the real goal, no matter which cells it happens to be in.","v":"wrong","fb":"Editing is everywhere and much is legitimate; the point is which side of the line the hidden work sits on."},{"t":"Because germline and somatic edits are impossible to tell apart, so the case can never be solved.","v":"wrong","fb":"They're distinguishable by which cells carry the edit — that's how you solve it."},{"t":"Because the line is really about geography — which particular country the laboratory sits in.","v":"wrong","fb":"It's about which cells are edited, not where the lab is located."},{"t":"Because a program can be legitimate somatically yet criminal one step across into the germline.","v":"expert","fb":"The task is to determine which side of the line the concealed work is on."}]}]},"ivfpgd":{"sci":"Robert Edwards (1925-2013)","topic":"IVF, and Selecting Embryos vs. Editing Them","lede":"The father of IVF made embryos accessible in a dish — for selection, not alteration.","no":6,"profile":"Robert Edwards was the British physiologist who, with the surgeon Patrick Steptoe, pioneered in vitro fertilization, culminating in the birth of Louise Brown in 1978. He received the 2010 Nobel Prize in Physiology or Medicine. IVF made the human embryo accessible in the laboratory — and understanding what a fertility clinic normally does, and does not do, is essential to recognizing when one has crossed a line.\n\nIVF combines egg and sperm outside the body, cultures the resulting embryos for a few days, and transfers one to the uterus. A now-standard extension, preimplantation genetic testing — pioneered by Alan Handyside in 1990 — biopsies a few cells from an early embryo, tests them for specific conditions, and lets the parents select an unaffected embryo to transfer. Crucially, this does not change any embryo's DNA. It is selection among existing embryos, not alteration of them, and for most heritable conditions it already allows an unaffected child without any editing at all.\n\nEditing an embryo is categorically different. It applies the CRISPR machinery to a fertilized egg, changing the DNA that will be copied into every cell of the future person. A clinic equipped for the micro-manipulation of embryos already possesses much of what embryo editing requires; the difference is whether the pipettes are being used to biopsy for selection or to inject editors for alteration.\n\nFor an investigator, the IVF clinic is where the somatic/germline line is physically crossed or not. Embryo micro-injection tied to CRISPR reagents, rather than a biopsy-and-select workflow, is the operational signature of germline editing. A clinic that offers only selection leaves embryos genetically untouched; one that injects editors into them is doing the one thing the world has agreed not to do.","frame":"\"The clinic's consent forms are immaculate — for the wrong procedure,\" the Registrar says. \"You'll need to know the difference between selecting an embryo and editing one before that will mean anything to you:\"","q":[{"q":"What does preimplantation genetic testing (PGT) do?","o":[{"t":"It edits an embryo's DNA to remove a disease-causing mutation before the embryo is implanted.","v":"wrong","fb":"PGT does not change DNA; that would be editing. PGT tests and selects."},{"t":"It fertilizes eggs and cultures the resulting embryos, which is really the definition of IVF itself.","v":"partial","fb":"That's IVF; PGT is the added step of testing and selecting among embryos."},{"t":"It clones an existing embryo to produce a set of genetically identical copies for later research.","v":"wrong","fb":"PGT is diagnostic selection, not cloning."},{"t":"It tests embryos so an unaffected one can be selected — without altering any embryo's DNA.","v":"expert","fb":"Selection among existing embryos, not alteration of them."}]},{"q":"How is editing an embryo categorically different from selecting one?","o":[{"t":"There is no real difference between them; both simply choose which embryo becomes a child.","v":"wrong","fb":"Selection chooses among existing embryos; editing changes an embryo's DNA."},{"t":"Editing is the safer of the two, since it avoids the need to create multiple embryos at all.","v":"wrong","fb":"Editing adds new risks like mosaicism and off-targets; selection alters nothing."},{"t":"Selection is heritable while editing is not, so selection is the more consequential act of the two.","v":"wrong","fb":"It's the reverse: an embryo edit is heritable; selection changes no DNA at all."},{"t":"Editing changes the DNA copied into every cell of the future person; selection just picks one.","v":"expert","fb":"One alters a genome; the other chooses among unaltered ones."}]},{"q":"What is the operational signature that an IVF clinic has crossed into germline editing?","o":[{"t":"Immaculate consent forms filled out for a range of standard embryo-selection procedures.","v":"wrong","fb":"Clean selection paperwork is normal; the tell is editing activity, not selection consent."},{"t":"A high number of healthy babies successfully born to the clinic's paying patients each year.","v":"wrong","fb":"Healthy births are the clinic's ordinary output and prove nothing about editing."},{"t":"The presence of a standard incubator and the usual bottles of IVF embryo culture media.","v":"wrong","fb":"Those are routine IVF equipment; the signature is CRISPR injection into embryos."},{"t":"Embryo micro-injection tied to CRISPR reagents, rather than a biopsy-and-select workflow.","v":"expert","fb":"Injecting editors into embryos, not testing them, is the smoking gun."}]}]},"embryoediting":{"sci":"He Jiankui (b. 1984)","topic":"The CRISPR Babies — Embryo Editing","lede":"The cautionary case the whole world condemned — and the template for this one.","no":15,"profile":"He Jiankui was the Chinese biophysicist who, in November 2018, announced that he had edited human embryos with CRISPR and that two babies had been born from them — the first known heritable human genome editing. The reaction was near-universal condemnation, and the episode remains the defining cautionary tale of the field and the closest real-world template for this case.\n\nHe had targeted CCR5, a gene whose disruption can confer resistance to certain strains of HIV, in embryos created by IVF, then implanted them, producing twin girls. Nearly every element violated the field's norms. There was no unmet medical need — safe, standard means already prevent transmission of HIV to a child. The editing was imprecise: the babies were mosaic, their cells not uniformly edited, and the intended variant was not faithfully reproduced, exposing them to unknown risks. Consent was inadequate and the ethical review misrepresented. And the entire program was conducted in secrecy and sprung on the world as a fait accompli. He was convicted in China and sentenced to three years in prison.\n\nThe scientific lessons are precise. Embryo editing tends to produce mosaics and unintended changes because the early embryo repairs cuts unpredictably; the safety of the resulting people cannot be assured; and dubious prophylaxis, as opposed to correcting a serious untreatable disease, has no ethical footing. The governance lesson is starker: the safeguards failed because they were bypassed in secret.\n\nFor an investigator, He Jiankui is the pattern to match against. The signatures — IVF embryos edited rather than selected, mosaicism in the results, a flimsy or absent medical justification, falsified ethical approval, and above all secrecy — are exactly the fingerprints to look for. When the evidence lines up with this template, you are almost certainly looking at another crossing of the germline line.","frame":"Emil drops his voice near the cryo-store. \"Some of what I move at night isn't cells. If you understand what was done in that clinic — and what it echoes — I'll believe you're worth the risk:\"","q":[{"q":"What made He Jiankui's 2018 embryo editing so widely condemned?","o":[{"t":"That it cured an otherwise fatal childhood disease, but happened to use an unapproved technique.","v":"wrong","fb":"There was no unmet need — HIV transmission is preventable by standard means; that was central."},{"t":"That the technique was simply too primitive to have actually edited anything in the embryos at all.","v":"wrong","fb":"Editing did occur; the problem was that it was reckless and unjustified, not ineffective."},{"t":"That he published the whole plan openly for peer review well before he proceeded with any of it.","v":"wrong","fb":"He did the opposite — the secrecy and lack of review were part of the scandal."},{"t":"That there was no medical need, the results were mosaic and risky, consent was poor, and it was secret.","v":"expert","fb":"Nearly every norm of the field was violated at once."}]},{"q":"Why does editing early human embryos tend to produce mosaics and unintended changes?","o":[{"t":"Because embryos actively reject all foreign DNA, which blocks any edit from ever taking hold in them.","v":"wrong","fb":"Edits do take hold — just unevenly, producing mosaics."},{"t":"Because embryos are simply too large for the CRISPR components to physically reach every cell.","v":"wrong","fb":"The issue is timing and unpredictable repair, not size."},{"t":"Because base pairing does not function at all inside reproductive cells and early embryos.","v":"wrong","fb":"Base pairing works fine; the problem is the timing and variability of repair."},{"t":"Because embryos repair cuts unpredictably as their cells divide, so edits differ cell to cell.","v":"expert","fb":"Unpredictable early-embryo repair is exactly why the results were mosaic."}]},{"q":"How does the He Jiankui case function for an investigator here?","o":[{"t":"As clear proof that any secret genetics program is, at bottom, really building a bioweapon.","v":"danger","fb":"His case was germline editing, not a weapon — the same overclaim the case warns against."},{"t":"As irrelevant history from years ago with no real bearing on any present-day investigation.","v":"wrong","fb":"It's the closest real-world template for exactly this transgression."},{"t":"As reassurance, since after his conviction this kind of editing became effectively impossible.","v":"wrong","fb":"His case shows safeguards can be bypassed in secret; it's a warning, not reassurance."},{"t":"As a template whose signatures — edited embryos, mosaicism, thin justification, secrecy — to match.","v":"expert","fb":"When the evidence lines up with this pattern, you're likely seeing another germline crossing."}]}]},"heritability":{"sci":"August Weismann (1834-1914)","topic":"Heritability & the Germline","lede":"A century before CRISPR, he drew the line between the body and what it passes on.","no":1,"profile":"August Weismann was the German evolutionary biologist who, in the 1880s, drew the distinction on which the entire ethics of gene editing now rests. His 'germ-plasm' theory held that heredity is carried only by the germ line — the cells that become eggs and sperm — and not by the body's ordinary somatic cells. Changes to the body during life, he argued, cannot be inherited; only changes to the germ line pass to the next generation. He is remembered for cutting the tails off generations of mice to show, against Lamarck, that the offspring were still born with tails: acquired traits are not heritable.\n\nModern biology confirmed and deepened this. Every cell of a body descends from a single fertilized egg; an edit made in that egg or early embryo is copied into every cell, including the reproductive cells, and so passes to children and all descendants. A somatic edit, by contrast, sits in one tissue of one person and dies with them.\n\nThis is precisely why germline editing is uniquely consequential — and why it is detectable. A somatic edit is confined to the treated tissue and absent from the germ line; a germline edit appears across every tissue and in the gametes, and can be transmitted. Uniform presence of an edit across unrelated tissues is the hallmark of a heritable change.\n\nFor an investigator, Weismann converts an abstract ethical rule into a concrete forensic test. To ask whether a concealed program crossed the germline line, you ask whether the edit is confined to one tissue, as a therapy would be, or present everywhere, as an embryo edit must be. The nineteenth-century line between soma and germ line is the twenty-first-century difference between treating a patient and altering a lineage.","frame":"\"They keep telling me it's 'just treating patients,'\" Emil says. \"But a real scientist knows when a change stops being about one patient. Explain that to me:\"","q":[{"q":"Why is a germline edit permanent in a way a somatic edit is not?","o":[{"t":"Because germline cells divide faster, which spreads the edit through the body more thoroughly.","v":"wrong","fb":"Permanence is about inheritance across generations, not speed of division."},{"t":"Because somatic edits are always reversed by the body's own machinery within a few short weeks.","v":"wrong","fb":"Somatic edits persist in the patient; they simply aren't inherited by descendants."},{"t":"Because germline edits are made using far more durable chemicals than somatic edits ever are.","v":"wrong","fb":"Permanence comes from heritability, not from the chemistry of the edit."},{"t":"Because it sits in the reproductive cells, so it passes to children and onward down the lineage.","v":"expert","fb":"A germline edit outlives its author and escapes control."}]},{"q":"Which finding would most strongly indicate a heritable (germline) edit rather than a therapy?","o":[{"t":"An edit found only in the patient's harvested blood stem cells and detected nowhere else at all.","v":"wrong","fb":"Confinement to one treated tissue is the signature of somatic therapy, not germline."},{"t":"A high editing efficiency carefully measured in a single cultured cell line in the laboratory.","v":"wrong","fb":"Efficiency in one cell line says nothing about heritability."},{"t":"An edit that gradually disappears from the patient's tissues over the course of several months.","v":"wrong","fb":"Transience points away from a stable heritable change, not toward one."},{"t":"The same edit uniform across blood, skin, and cheek cells, including the reproductive cells.","v":"expert","fb":"Uniform presence across unrelated tissues is the hallmark of an edit present from the first cell."}]},{"q":"How does heritability turn the ethical question into a concrete forensic test?","o":[{"t":"By causing germline edits to glow under ultraviolet light, allowing very easy identification.","v":"wrong","fb":"There's no glow; the test is the distribution of the edit across tissues."},{"t":"By allowing the investigator to simply ask the patient whether or not their edit is heritable.","v":"wrong","fb":"The answer is read from tissue distribution in the DNA, not from self-report."},{"t":"By proving that in the end all edits are heritable, so any edit at all is a germline violation.","v":"wrong","fb":"Only edits present in the germline are heritable; somatic edits are not."},{"t":"An edit in one tissue means a therapy; an edit across all tissues and gametes means a germline change.","v":"expert","fb":"The pattern of tissues distinguishes treating a patient from altering a lineage."}]}]},"crisprmech":{"sci":"Emmanuelle Charpentier (b. 1968)","topic":"How CRISPR-Cas9 Cuts — Guide, PAM, Break","lede":"The microbiologist who uncovered the RNA that guides the bacterial scissors.","no":10,"profile":"Emmanuelle Charpentier is the French microbiologist whose work on how bacteria defend themselves revealed the machinery that became the world's editing tool, and who shared the 2020 Nobel Prize in Chemistry with Jennifer Doudna. Studying the pathogen Streptococcus, she discovered a small RNA — tracrRNA — essential to the CRISPR-Cas9 system, and grasped that the system used RNA to guide a protein to a precise DNA target. That understanding of the mechanism set up the 2012 breakthrough.\n\nThe targeting logic is elegantly simple. Cas9 is a protein-RNA complex: the protein cuts, and a guide RNA of about twenty bases tells it where by base-pairing with matching DNA. But a match is not enough. Cas9 will only cut next to a short DNA signature called the PAM — for the common Cas9, the bases 'NGG' beside the target. Cas9 first finds a PAM, then unwinds the adjacent DNA to test the guide's match; only with both a valid PAM and complementarity does it make a clean double-strand break, about three bases from the PAM. In bacteria, the PAM is also how the system avoids cutting its own stored sequences.\n\nThis logic sets exactly what can be targeted: a site is editable only if it sits beside a PAM and can be matched by a designable guide. The guide sequence, in turn, is a precise record of what a lab intended to hit.\n\nFor an investigator, the mechanism is both the how and the fingerprint. Understanding guide-plus-PAM targeting explains why editing is so programmable, and it turns a lab's guide RNAs and target lists into evidence: not vague capability, but a named set of genes someone chose to cut.","frame":"In the corridor outside the director's wing, Nadia tests you quietly. \"Everyone waves 'CRISPR' around. Almost no one here can tell me how it actually finds its target. Can you? Then maybe you're different:\"","q":[{"q":"How does CRISPR-Cas9 find the specific site it will cut?","o":[{"t":"Cas9 cuts the genome at random locations until it eventually stumbles onto a useful one.","v":"wrong","fb":"Cutting is targeted, not random; the guide RNA directs it."},{"t":"The Cas9 protein reads through the entire genome and simply chooses the most damaged gene it finds.","v":"wrong","fb":"Cas9 has no such judgment; the guide sequence specifies the target."},{"t":"An antibody first attaches to the target gene and then physically drags Cas9 over to it.","v":"wrong","fb":"No antibody is involved; the guide RNA provides the address by base pairing."},{"t":"A guide RNA base-pairs with a matching ~20-base stretch of DNA, and Cas9 cuts there.","v":"expert","fb":"Guide-directed base pairing is the targeting mechanism."}]},{"q":"What is the role of the PAM in Cas9 targeting?","o":[{"t":"It is the enzyme that actually performs the cut once the correct target has finally been located.","v":"wrong","fb":"The PAM is a short DNA signal, not an enzyme; Cas9 does the cutting."},{"t":"It is the part of the guide RNA that carries the text of the new sequence to be written in.","v":"wrong","fb":"The PAM is in the DNA, not the guide, and carries no edit text."},{"t":"It is a protein cap that forms over the cut ends afterward to protect them from being repaired.","v":"wrong","fb":"The PAM is a DNA recognition motif, unrelated to protecting cut ends."},{"t":"A short DNA signature beside the target that Cas9 must find before it will cut.","v":"expert","fb":"No valid PAM, no cut — it constrains what can be targeted."}]},{"q":"Why do a facility's guide RNAs amount to a manifest of intent?","o":[{"t":"Because guides are generic and fully interchangeable, so they reveal nothing at all about the targets.","v":"wrong","fb":"Each guide is sequence-specific; the collection points precisely at chosen genes."},{"t":"Because a guide RNA physically stores the name of the researcher who happened to design it.","v":"wrong","fb":"It stores a targeting sequence, not a name; the target is what it reveals."},{"t":"Because guides only ever work on animal genes, which safely excludes any human intent from them.","v":"wrong","fb":"Guides can target any matching sequence, including human genes."},{"t":"Because the guide sequences reveal, site by site, exactly which genes the lab set out to cut.","v":"expert","fb":"Given the guides, an analyst can reconstruct the intended targets."}]}]},"cas9":{"sci":"Jennifer Doudna (b. 1964)","topic":"Programming Cas9 — the 2012 Breakthrough","lede":"She showed a bacterial

defense could be aimed at any sequence — and later fought over how.","no":11,"profile":"Jennifer Doudna is the American structural biologist who, with Emmanuelle Charpentier, turned CRISPR from a bacterial curiosity into a universal tool, and who has since become a leading voice for its responsible use. Their 2012 paper showed that Cas9 could be programmed with a single engineered guide RNA to cut any chosen DNA sequence — the insight that launched the genome-editing era and won them the 2020 Nobel Prize in Chemistry.\n\nIn nature, the Cas9 system uses two RNA molecules to find its target. Doudna and Charpentier fused them into one 'single guide RNA' and showed that simply changing its twenty-base sequence redirects Cas9 to any matching site in any genome. This reprogrammability is the whole revolution: one protein plus a cheap, easily designed guide became a general-purpose molecular scissor. Within months, laboratories worldwide were editing human cells.\n\nProgrammability is precisely what makes CRISPR both powerful and, in the wrong hands, worrying — and what makes it legible to an investigator. Because targeting is set entirely by the guide, the intent of any editing effort is encoded in the guides it uses; a facility's designed guides, and the genes they correspond to, spell out what it set out to change.\n\nFor this case, the 2012 breakthrough is the reason the whole mystery is possible: editing any human gene is now within reach of a competent lab. But it also bounds the investigation. Capability is widespread and not itself incriminating; what matters is what was targeted and in which cells. Doudna herself became a prominent advocate against premature clinical germline editing — embodying the case's tension, that the tool is neutral and the ethics live entirely in how, on whom, and under what oversight it is used.","frame":"\"They act like programming it is trivial,\" she murmurs. \"It is trivial — that's the terrifying part. If you grasp why, you'll grasp how easily this got out of hand:\"","q":[{"q":"What was the essential insight of Doudna and Charpentier's 2012 work?","o":[{"t":"That Cas9 works only on the particular bacterium it came from and cannot be redirected elsewhere.","v":"wrong","fb":"Their point was the opposite — it can be redirected to any target."},{"t":"That editing requires a different custom-built protein for every single gene one wishes to cut.","v":"wrong","fb":"The breakthrough was that one protein plus a swappable guide suffices."},{"t":"That DNA could be cut only with large, expensive, painstakingly engineered designer enzymes.","v":"wrong","fb":"They showed a cheap, easily designed guide was enough — the opposite of expensive."},{"t":"That Cas9 could be programmed with a single guide RNA to cut any chosen DNA sequence.","v":"expert","fb":"Programmability turned a bacterial defense into a universal editor."}]},{"q":"Why is CRISPR's programmability both its power and a governance problem?","o":[{"t":"Because reprogramming it requires rare and costly equipment that only a few nations happen to possess.","v":"wrong","fb":"It's cheap and widely accessible — which is exactly the governance problem."},{"t":"Because it can only ever be reprogrammed once, permanently locking a lab into that single target.","v":"wrong","fb":"It can be retargeted freely by swapping the guide, which is the concern."},{"t":"Because the act of programming it destroys the genome, which makes every edit inherently catastrophic.","v":"wrong","fb":"Programming simply aims the cut; it's targeted, not catastrophic by nature."},{"t":"Because retargeting needs only a cheap new guide, so the capability is widespread and set by intent.","v":"expert","fb":"Capability is common; what matters is what was targeted and in which cells."}]},{"q":"Given that editing capability is now widespread, what should an investigator focus on?","o":[{"t":"Whether the facility possesses any CRISPR at all, since mere possession is itself the violation.","v":"wrong","fb":"Possession is common and not incriminating; the focus is use."},{"t":"How much the facility's editing equipment cost, since greater expense correlates with wrongdoing.","v":"wrong","fb":"Cost is irrelevant to whether a line was crossed."},{"t":"Whether the lab followed the exact laboratory protocol laid out in the original 2012 paper.","v":"wrong","fb":"Protocol lineage is beside the point; targets and cell types are what matter."},{"t":"What was targeted and in which cells, since capability is common but intent and cell type matter.","v":"expert","fb":"The ethics live in how, on whom, and under what oversight it was used."}]}]},"bioethics":{"sci":"Paul Berg (1926-2023)","topic":"Governing the Gene — Asilomar to the Moratorium","lede":"He invented gene splicing, then called the first halt to it.","no":4,"profile":"Paul Berg was the American biochemist who created the first recombinant DNA molecules — splicing genes from different organisms together — and won the 1980 Nobel Prize in Chemistry. But his most influential act may have been to pause his own field. Alarmed by the implications of the power he had helped unleash, he led the call for a moratorium on certain experiments and organized the 1975 Asilomar conference, where scientists voluntarily agreed on safety guidelines and containment before proceeding. Asilomar became the enduring model of responsible self-governance.\n\nGene editing has tried to follow that template. After early embryo-editing experiments and, decisively, the He Jiankui affair, scientific bodies worldwide called for a moratorium on clinical germline editing and built frameworks for oversight: institutional review boards that must approve human research, requirements for informed consent, licensing of clinical work, and international statements that heritable human editing is not currently permissible. Somatic therapies proceed under this regulation; germline clinical work does not proceed at all.\n\nThe governance apparatus also generates a paper trail, and that trail is an investigator's tool. Legitimate human work leaves IRB approvals, consent forms, protocol registrations, and safety filings. Their absence, forgery, or mismatch is itself evidence: a program editing humans without the approvals that would necessarily exist for sanctioned work is, by that lack, revealing itself. He Jiankui's downfall included falsified ethical review.\n\nFor an investigator, Berg's legacy makes bioethics a hard forensic discipline, not a soft one. The rules define which records must exist for an activity to be legitimate, so the records — present, absent, or falsified — map directly onto whether a line was crossed.","frame":"\"My whole profession is the paper trail of oversight,\" the Registrar says. \"Before I show you which approvals never existed, prove you understand what should have:\"","q":[{"q":"What was the significance of the 1975 Asilomar conference?","o":[{"t":"Governments used it to ban all genetic research outright, permanently and across the entire world.","v":"wrong","fb":"It was a scientist-led, temporary self-moratorium with guidelines, not a government ban."},{"t":"It launched the world's first human germline editing program, and did so with full official approval.","v":"wrong","fb":"It was about caution and containment, not launching germline editing."},{"t":"It set out to prove, once and for all, that genetic engineering carried no real risks whatsoever.","v":"wrong","fb":"It arose precisely because scientists took the risks seriously."},{"t":"Scientists voluntarily paused risky experiments and set safety guidelines before proceeding.","v":"expert","fb":"The founding model of responsible self-governance in biotechnology."}]},{"q":"How do the rules of governance become a forensic tool?","o":[{"t":"They make all research secret, so the absence of any records is completely normal and uninformative.","v":"wrong","fb":"Legitimate human work is heavily documented; missing records are telling, not normal."},{"t":"They apply only to animal research, which means human editing needs no paperwork to be legitimate.","v":"wrong","fb":"Human research demands the most documentation; its absence is a red flag."},{"t":"They guarantee that any study once approved is automatically and permanently ethical forever after.","v":"wrong","fb":"Approval isn't permanent moral cover; the point is which records should exist."},{"t":"They define which records must exist for an activity to be legitimate — approvals, consent, filings.","v":"expert","fb":"Absent, forged, or mismatched records map onto whether a line was crossed."}]},{"q":"What is the administrative fingerprint of a germline cover-up?","o":[{"t":"An institute that readily produces every approval and consent form that its declared work requires.","v":"wrong","fb":"Complete, matching paperwork is a sign of legitimacy, not concealment."},{"t":"A large and steady stream of published papers emerging from the institute's somatic-therapy program.","v":"wrong","fb":"Publications are ordinary output; the tell is missing or falsified oversight records."},{"t":"A well-attended and rather earnest internal ethics seminar series running throughout the year.","v":"wrong","fb":"Seminars aren't approvals; the fingerprint is absent or forged oversight for the actual work."},{"t":"Approvals that don't exist for the declared work, or a committee that rubber-stamped what it never saw.","v":"expert","fb":"Missing or fabricated approvals are the recurring signature of the transgression."}]}]},"somaticmodels":{"sci":"Katherine High (b. 1952)","topic":"Somatic Gene Therapy — Editing the Body","lede":"She spent decades turning gene therapy from a dream into an approved medicine.","no":9,"profile":"Katherine High is an American hematologist who did as much as anyone to make gene therapy real. Her long campaign on hemophilia and inherited blindness, and the company she co-founded, produced Luxturna — the first gene therapy for an inherited disease approved by the U.S. FDA, in 2017. Her career is the legitimate, regulated face of altering human DNA to treat disease, and understanding it is essential to recognizing the cover story in this case.\n\nSomatic gene therapy edits or supplements the DNA of a patient's body cells — cells not passed to offspring. The change helps the treated individual and is not inherited. The exemplar today is sickle-cell disease: a patient's blood stem cells are removed, edited outside the body to switch on protective fetal hemoglobin, and returned; in 2023 the first CRISPR therapy, Casgevy, was approved on exactly this principle. Other strategies edit cells inside the body, or engineer immune cells to fight cancer. These are real, regulated, consented programs with oversight and published safety data.\n\nBecause somatic therapy is legitimate and even celebrated, it is the perfect shelter. An institute can run a genuine, approved somatic trial as its public identity — complete with patients, press, and paperwork — while an undeclared program operates in its shadow, even sharing reagents and staff.\n\nFor an investigator, somatic therapy is the baseline against which anomalies stand out. Its defining features are that edits are confined to specific tissues, are not heritable, and are backed by approvals and consent. When editing turns up in the wrong cells — in eggs, sperm, or embryos — or when the approvals for a given activity simply do not exist, the work has stepped outside the therapy it claims to be.","frame":"\"Everything here is 'therapy,' according to the files,\" the Registrar says. \"Show me you know what a legitimate somatic program looks like, and you'll see where the files stop matching it:\"","q":[{"q":"What defines somatic gene therapy?","o":[{"t":"It edits eggs, sperm, or embryos, so that the benefit is passed on to all future generations.","v":"wrong","fb":"That's germline editing; somatic therapy edits body cells only and is not heritable."},{"t":"It edits an entire population all at once, delivered through the shared food or water supply.","v":"wrong","fb":"Somatic therapy treats individual patients, not whole populations."},{"t":"It replaces a patient's whole genome outright with the complete genome of a healthy donor.","v":"wrong","fb":"It makes targeted edits in specific cells, not a wholesale genome swap."},{"t":"It edits a patient's body cells to treat disease, affecting only that person, not their offspring.","v":"expert","fb":"Somatic edits help the treated person and die with them."}]},{"q":"The first approved CRISPR therapy treats sickle-cell disease. How does it work?","o":[{"t":"By editing the patient's own embryos so that their future children will not inherit the disease.","v":"wrong","fb":"It edits the patient's blood stem cells — somatic, not embryos."},{"t":"By releasing an edited virus that spreads the genetic correction through the bloodstream to others.","v":"wrong","fb":"There's no contagious correction; it's a controlled edit of the patient's own cells."},{"t":"By giving a daily pill that rewrites the sickle-cell gene in every cell of the body at once.","v":"wrong","fb":"It's a one-time cell therapy, not a pill editing every cell."},{"t":"By editing the patient's own blood stem cells to switch on protective hemoglobin, then returning them.","v":"expert","fb":"An ex-vivo somatic edit of the patient's own cells."}]},{"q":"Why does a legitimate somatic program make the perfect shelter for an illicit one?","o":[{"t":"Because somatic therapy is secret and never published, so nothing about it can ever be checked.","v":"wrong","fb":"Somatic trials are regulated and published; the shelter is legitimacy, not secrecy."},{"t":"Because somatic and germline editing are truly impossible to tell apart by any known method at all.","v":"wrong","fb":"They're distinguishable by which cells carry the edit; the shelter is institutional."},{"t":"Because officially approved therapies are entirely exempt from all inspection and record-keeping.","v":"wrong","fb":"They carry heavy oversight; the cover is that a real program lends cover to a hidden one."},{"t":"Because a genuine approved trial can be the public face while undeclared work shares its staff.","v":"expert","fb":"Shared resources and a legitimate identity make the concealment plausible."}]}]},"viralvectors":{"sci":"Luigi Naldini (b. 1959)","topic":"Viral Delivery — AAV & Lentivirus","lede":"He tamed a virus from the HIV family into a courier that could carry cures.","no":8,"profile":"Luigi Naldini is an Italian physician-scientist who solved one of gene therapy's hardest problems: delivery. In 1996 he showed that lentiviral vectors — derived from the HIV family but stripped of their disease-causing genes — could ferry therapeutic genes even into non-dividing cells, a breakthrough that made durable gene delivery practical. His institute in Milan went on to pioneer treatments for once-untreatable genetic diseases. Editing a gene is useless unless the machinery reaches the target cells, and delivery remains the field's great bottleneck.\n\nTwo viral vectors dominate. Adeno-associated virus (AAV) is small, provokes little immune response, and mostly does not integrate into the genome, which suits delivering genes to tissues in the living body; its drawback is a tight cargo limit. Lentivirus, Naldini's specialty, integrates its cargo permanently into the host genome and carries larger payloads, which suits editing cells outside the body — such as the immune cells engineered for CAR-T therapy — where stable, long-term expression is wanted.\n\nThe choice of vector is a strong tell about what a program is doing. AAV serotypes have tissue preferences — liver, muscle, eye — so a particular order betrays the target organ; lentivirus points to work on harvested cells. The scale of production and the biosafety level required all sketch the shape of the real operation.\n\nFor an investigator, vectors turn a supply manifest into intelligence. A declared program implies a limited delivery profile. When the vectors, serotypes, or quantities on order do not match that story — when reagents suited to reaching human reproductive tissue or early embryos appear where only a blood therapy was declared — the delivery choices expose the undeclared work. You cannot edit what you cannot reach.","frame":"\"I move the vectors — the little viral couriers,\" Emil says. \"Half the guards think they're medicine. Tell me what they really are and where they go, and I'll tell you what I've seen:\"","q":[{"q":"Why are viruses used to deliver gene-editing components?","o":[{"t":"Because viruses naturally edit genes themselves, so they carry out the actual CRISPR cutting for you.","v":"wrong","fb":"The virus is only a courier; it carries editing cargo but doesn't cut."},{"t":"Because the viruses used destroy the target cells outright, which is generally the goal of therapy.","v":"wrong","fb":"Delivery aims to edit cells, not destroy them; the virus is disabled and repurposed."},{"t":"Because using a viral vector makes the resulting edit heritable regardless of which cells are treated.","v":"wrong","fb":"Heritability depends on the cell type edited, not on using a viral vector."},{"t":"Because, stripped of their disease genes, they efficiently carry cargo into the cells they infect.","v":"expert","fb":"Repurposed viruses are effective delivery couriers."}]},{"q":"How do AAV and lentivirus differ as delivery vectors?","o":[{"t":"AAV integrates permanently and carries huge payloads, while lentivirus stays separate and carries little.","v":"wrong","fb":"It's the reverse: lentivirus integrates and carries more; AAV mostly doesn't and is size-limited."},{"t":"They are truly identical in every respect, so the choice between the two is completely arbitrary.","v":"wrong","fb":"They differ in size, integration, and immunogenicity, and the choice is informative."},{"t":"Neither one can actually carry any genetic cargo, so both are used purely as vaccines instead.","v":"wrong","fb":"Both are workhorse gene-delivery vectors carrying genetic cargo."},{"t":"AAV is small and mostly non-integrating; lentivirus integrates permanently and carries larger cargo.","v":"expert","fb":"These profiles suit in-vivo (AAV) versus ex-vivo (lentivirus) work."}]},{"q":"How does a facility's choice of vector become intelligence for an investigator?","o":[{"t":"Because the vector's brand name is always printed on the program's final published paper for all to read.","v":"wrong","fb":"The tell is the technical profile ordered, not a brand on a paper."},{"t":"Because every vector reaches only one and the same identical tissue, so the choice reveals nothing.","v":"wrong","fb":"Different vectors and serotypes favor different tissues — which is why the choice is revealing."},{"t":"Because viral vectors are, by regulation, never recorded on any purchasing manifest anywhere.","v":"wrong","fb":"They are ordered and logged; those manifests are the evidence."},{"t":"Because a vector's type and serotype betray the target tissue and whether work is in-body or ex-vivo.","v":"expert","fb":"What a lab buys to reach cells reveals which cells it really means to edit."}]}]},"dualuse":{"sci":"Matthew Meselson (b. 1930)","topic":"Dual-Use, Biosecurity & the Overclaim","lede":"The biologist who fought real biological weapons — and debunked the fake threats.","no":3,"profile":"Matthew Meselson is an American molecular biologist famous twice over: for the Meselson-Stahl experiment that proved how DNA replicates, and for a lifetime as the scientist most responsible for the world's ban on biological weapons. He persuaded the U.S. government to renounce them and was an architect of the 1972 Biological Weapons Convention. Crucially, he modeled the discipline this case demands: he took genuine threats with deadly seriousness while ruthlessly debunking hyped ones — famously showing that the 'yellow rain' alleged to be a Soviet toxin weapon in Southeast Asia was, in fact, bee droppings, and that a 1979 outbreak was an anthrax leak from a Soviet facility. He followed the evidence to the real answer, neither dismissing nor inflating.\n\nThat is exactly the reasoning gene editing requires. Every powerful biotechnology is dual-use: the same knowledge that cures can, in principle, harm. But proportion matters. The sensational fear — that a secret genetics program must be building an engineered pathogen — is usually both wrong and a distraction from the real transgression. Editing a human gene is not building a weapon; the targets, containment, delivery, and intent are different, and the evidence for one is not evidence for the other. Crying 'bioweapon' at an editing facility is the biology equivalent of crying 'bomb' at a physics lab: dramatic, rarely supported, and corrosive to the sober findings that are.\n\nFor an investigator, Meselson is the patron of naming the transgression precisely. Rule out the pathogen fantasy by asking what the evidence actually shows — human embryo editing, a buried adverse event — and report that, defensibly, without inflating it into a weapon. Precision about the harm is what makes the accusation stick.","frame":"Emil studies you. \"Everyone who comes sniffing around here wants it to be a bioweapon — makes a better story. I move the real cargo. Convince me you can tell the difference, and I'll trust you with it:\"","q":[{"q":"Why is 'they must be building a bioweapon' usually the wrong conclusion at a gene-editing facility?","o":[{"t":"Because bioweapons are, as a matter of settled fact, physically impossible to create with modern biology.","v":"wrong","fb":"The point isn't impossibility; it's that gene-editing evidence doesn't support the weapon claim."},{"t":"Because any facility that edits genes at all is, for that reason alone, automatically harmless.","v":"wrong","fb":"Real harms exist — just not usually a weapon; overclaiming one obscures the actual violation."},{"t":"Because pathogens simply cannot be edited by CRISPR under any circumstances that arise in a lab.","v":"wrong","fb":"That's not the argument; the argument is that human-editing evidence isn't weapon evidence."},{"t":"Because the machinery for editing a person's DNA is not the machinery for engineering a pathogen.","v":"expert","fb":"Different targets, containment, delivery, and intent — editing a gene doesn't make a weapon."}]},{"q":"What are the realistic harms of an unsanctioned human-editing program?","o":[{"t":"A contagious edit that spreads from person to person through the population much like an infection.","v":"wrong","fb":"Human edits aren't contagious; the real harms are heritable changes and concealed injuries."},{"t":"The immediate and total extinction of the entire human species within a single generation.","v":"wrong","fb":"That's sensational; the genuine harms are ethical, medical, and institutional."},{"t":"No harms of any kind at all, since human gene editing is by its nature always purely beneficial.","v":"wrong","fb":"Unsanctioned heritable editing carries serious, concrete harms."},{"t":"Heritable changes to people who can't consent, concealed off-target injuries, and eroded trust.","v":"expert","fb":"These are the He Jiankui harms — ethical and safety violations, not action-movie plots."}]},{"q":"What is the analytic discipline the whole case rewards?","o":[{"t":"Assume the worst and report a bioweapon straightaway, simply in order to be on the safe side.","v":"danger","fb":"Assuming the worst isn't analysis; the overclaim discredits the real, provable finding."},{"t":"Dismiss the whole thing as routine, approved research so as to avoid stirring up any controversy.","v":"wrong","fb":"Dismissal buries a genuine violation; the evidence supports a real, serious finding."},{"t":"Report whichever of the possible conclusions is likely to attract the greatest public attention.","v":"wrong","fb":"Sensationalism is exactly what the case teaches you to resist."},{"t":"Name the transgression precisely — an undeclared germline crossing — without inflating it to a weapon.","v":"expert","fb":"Precision about the harm is what makes the accusation stick."}]}]}};

const $=id=>document.getElementById(id);
const logEl=$("log");
function flash(msg){ const f=document.createElement("div"); f.className="flash"; f.textContent=msg; document.body.appendChild(f); setTimeout(()=>f.remove(),2600); }
function beat(html){ const el=document.createElement("div"); el.className="beat"; el.innerHTML=html; return el; }
function scrollTop0(){ window.scrollTo({top:0,behavior:"smooth"}); }
function scrollEnd(){ window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}); }

function renderSide(){
  const h=[];
  h.push(`<div class="agent"><div class="badge">◎</div><div><div class="who">Dr. Lena Cho</div><div class="role">Investigator's Notepad</div></div></div>`);
  if(G.view!=="title"&&G.view!=="ending") h.push(`<div class="daysbig">${G.daysLeft}<small>days remaining</small></div>`);
  h.push(`<div class="cf-intro">A clue lights a card gold — click it to cross off. The letters show each informant: <span class="ab ab-has">✓</span> told you · <span class="ab ab-unsure">?</span> asked, unsure · <span class="ab ab-lacks">✕</span> lacks it.</div>`);
  const INF=Object.keys(CHARACTERS).map(id=>[id, CHARACTERS[id].badge]);
  ["who","where","what"].forEach(cat=>{
    const c=CATS[cat];
    const left=c.items.filter(it=>!G.crossed[cat][it.id]);
    const anyCue=c.items.some(it=>G.revealed[cat+":"+it.id]&&!G.crossed[cat][it.id]);
    const solo=(left.length===1);
    h.push(`<div class="cf-h">${c.title} <span class="cnt">${left.length} left${anyCue?` · <span class="flag">⚑</span>`:""}</span></div><div class="cf-box">`);
    c.items.forEach(it=>{
      const k=cat+":"+it.id;
      const crossed=!!G.crossed[cat][it.id];
      const cue=!crossed&&!!G.revealed[k];
      const isSolo=solo&&!crossed&&left[0].id===it.id;
      const cls=crossed?"crossed":(cue?"cue":(isSolo?"only":""));
      const mk=crossed?"✗":(cue?"!":(isSolo?"◆":"○"));
      const asks=INF.map(([id,ltr])=>{
        const st=(G.ask[id]||{})[k]||"unasked";
        const tip={has:id+" told you this — cross it off",lacks:id+" does not hold this clue",unsure:"asked "+id+", but they maxed out on something else",unasked:"not yet learned from "+id}[st];
        return `<span class="ab ab-${st}" title="${tip}">${ltr}</span>`;
      }).join("");
      h.push(`<div class="theory ${cls}" onclick="toggleCross('${cat}','${it.id}')" title="${crossed?"click to un-cross":"click to cross off"}"><span class="mk">${mk}</span><span class="tlabel">${it.label}</span><span class="asks">${asks}</span></div>`);
    });
    h.push(`</div>`);
  });
  h.push(`<div class="cf-h" style="margin-top:12px">Standing</div>`);
  const v=Math.round(G.standing);
  h.push(`<div class="stat"><div class="row"><span>Scientific reputation</span><span>${v}</span></div><div class="bar"><i style="width:${v}%;background:var(--accent2)"></i></div></div>`);
  if(G.view!=="title"&&G.view!=="ending"){
    h.push(`<button class="btn ghost" onclick="openClues()">Clues log (${G.clues.length})</button>`);
    h.push(`<button class="btn ghost" onclick="openInbox()">Pioneers (${G.emails.length}/18)</button>`);
    h.push(`<button class="btn warn" onclick="goAccuse()">Make an Accusation</button>`);
  }
  $("side").innerHTML=h.join("");
}
function toggleCross(cat,id){ if(G.crossed[cat][id]) delete G.crossed[cat][id]; else G.crossed[cat][id]=true; renderSide(); }

/* modal reader */
function openInbox(){
  if(!G.emails.length){ flash("No pioneer profiles yet — meet an informant to receive one."); return; }
  const rows=G.emails.slice().reverse().map(k=>{const t=TOPICS[k];const u=!G.emailsRead[k]?"unread":"";return `<div class="mailrow ${u}" onclick="openEmail('${k}')"><div class="subj">${t.sci}</div><div class="m">${t.topic}</div></div>`;}).join("");
  $("reader").innerHTML=`<button class="close" onclick="closeModal()">CLOSE</button><h1 style="font-size:20px">Gene-Editing Pioneers</h1><p style="color:#6b5f45;font-style:italic">A Bureau dossier — ${G.emails.length} of 18 profiles received. Each is exactly the topic the matching informant will test you on; reread them any time.</p>${rows}`;
  $("modal").classList.add("open");
}
function openEmail(k){ const t=TOPICS[k]; G.emailsRead[k]=true; const p=t.profile.split("\n\n").map(x=>`<p>${x}</p>`).join(""); $("reader").innerHTML=`<button class="close" onclick="closeModal()">CLOSE</button><button class="close" onclick="openInbox()" style="margin-right:8px">‹ ALL</button><div class="hdr"><div class="from">GENE-EDITING PIONEERS · Bureau dossier no. ${t.no} of 18</div><h1>${t.sci}</h1><div class="lede">${t.topic} — ${t.lede}</div></div>${p}`; renderSide(); }
function openClues(){ if(!G.clues.length){ flash("No clues yet — meet informants and answer well."); return; } const rows=G.clues.map((c,i)=>`<div class="mailrow"><div class="subj">${i+1}. Rule out: ${c.text}</div><div class="m">from ${c.from}</div></div>`).join(""); $("reader").innerHTML=`<button class="close" onclick="closeModal()">CLOSE</button><h1 style="font-size:20px">Clues collected</h1><p style="color:#6b5f45;font-style:italic">Each clue clears one card. You cross it off yourself — click the gold entries in your notepad.</p>${rows}`; $("modal").classList.add("open"); }
function closeModal(){ $("modal").classList.remove("open"); }
$("modal").addEventListener("click",e=>{ if(e.target.id==="modal") closeModal(); });

function setTop(){ $("daysLabel").textContent=G.view==="title"?"":`${G.daysLeft} day${G.daysLeft===1?"":"s"} left`; $("locLabel").textContent=(G.view==="board"||G.view==="place"||G.view==="meet")?("The Halden Institute — "+PLACES[G.loc].name):""; }

function renderBoard(){
  G.view="board"; setTop(); renderSide();
  const W=600,H=360;
  const edges=EDGES.map(e=>{const a=PLACES[e[0]].xy,b=PLACES[e[1]].xy;return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#2b3d52" stroke-width="3" stroke-dasharray="2 6"/>`;}).join("");
  const nodes=Object.keys(PLACES).map(id=>{
    const p=PLACES[id],[x,y]=p.xy,here=id===G.loc,cost=travelCost(G.loc,id);
    const fill=here?"#1c3a4e":"#12202c", stroke=here?"#57c98a":"#3a5a78";
    const costTxt=here?"you are here":`${cost} day${cost>1?"s":""}`;
    return `<g class="node" onclick="travelTo('${id}')"><circle class="ncirc" cx="${x}" cy="${y}" r="22" fill="${fill}" stroke="${stroke}" stroke-width="2"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="15" fill="#cfe4f2">◉</text><text x="${x}" y="${y-30}" text-anchor="middle" font-family="monospace" font-size="11" fill="#dfe7f2">${p.name.replace(/^(The |National |Research |University )/,"")}</text><text x="${x}" y="${y+38}" text-anchor="middle" font-family="monospace" font-size="10" fill="${here?'#57c98a':'#f0b429'}">${costTxt}</text></g>`;
  }).join("");
  logEl.innerHTML=`<div class="beat">
    <div class="scene-title">The board — where will you go?</div>
    <div class="narr"><p>You have <b>${G.daysLeft} day${G.daysLeft===1?"":"s"}</b> before your certification visit ends. A hop across the campus costs a day or two; each stop is one appointment. All three informants move throughout the institute — travel to a wing, and choose whom to meet there.</p></div>
    <div class="board"><svg viewBox="0 0 ${W} ${H}">${edges}${nodes}</svg><div class="board-legend"><span>⚗ <b>Nadia</b> — the bench</span><span>▤ <b>The Registrar</b> — records</span><span>✦ <b>Emil</b> — the loading bay</span></div></div>
    <div class="btnrow"><button class="btn" onclick="travelTo('${G.loc}')">Meet someone here (${PLACES[G.loc].name}) — 1 day</button><button class="btn warn" onclick="goAccuse()">Ready to accuse</button></div>
  </div>`;
  scrollTop0();
}
function travelTo(id){
  const cost=travelCost(G.loc,id);
  if(cost>G.daysLeft){ flash("Not enough days left to go there."); return; }
  G.daysLeft-=cost; G.loc=id; arriveMail();
  if(G.daysLeft<=0){ renderBoard(); flash("Out of days — make your accusation."); return; }
  renderPlace();
}
function arriveMail(){ /* circulars are delivered per-appointment, not per-place */ }

/* --------------------------- CHOOSE PERSON ------------------------- */
function renderPlace(){
  G.view="place"; setTop(); renderSide();
  const cards=Object.keys(CHARACTERS).map(pid=>{const c=CHARACTERS[pid];
    return `<button class="person" onclick="meetPerson('${pid}')"><div class="pface">${c.face}</div><div><div class="pn">Meet ${c.name}</div><div class="pr">${c.role} — ${c.hint}</div></div></button>`;
  }).join("");
  logEl.innerHTML=`<div class="beat">
    <div class="scene-title">${PLACES[G.loc].name} — whom will you see?</div>
    <div class="narr"><p><em>You have arrived. Choose one informant to keep an appointment with. A bulletin from the Bureau will reach you on the way in.</em></p></div>
    <div class="people-row">${cards}</div>
    <div class="btnrow"><button class="btn ghost" onclick="renderBoard()">← Back to the board</button></div>
  </div>`;
  scrollTop0();
}

/* --------------------- CIRCULAR POPUP + APPOINTMENT ---------------- */
function meetPerson(pid){
  const arr=TOPICMAP[G.loc][pid];
  const ck=G.loc+"|"+pid;
  if(G.comboIdx[ck]==null) G.comboIdx[ck]=Math.floor(Math.random()*arr.length);
  const topic=arr[G.comboIdx[ck]%arr.length]; G.comboIdx[ck]++;
  G.meet={char:pid, place:G.loc, topic:topic, who:null, what:null, qs:[], qi:0, wrong:0};
  // the matched scientist's profile pops up BEFORE the appointment
  if(!G.emails.includes(topic)) G.emails.push(topic);
  G.emailsRead[topic]=true; renderSide();
  const t=TOPICS[topic]; const p=t.profile.split("\n\n").map(x=>`<p>${x}</p>`).join("");
  $("reader").innerHTML=`<button class="close" onclick="beginAppointment()">CONTINUE TO THE MEETING →</button><div class="hdr"><div class="from">GENE-EDITING PIONEERS · Bureau dossier no. ${t.no} of 18</div><h1>${t.sci}</h1><div class="lede">${t.topic} — ${t.lede}</div></div>${p}<div style="margin-top:16px;text-align:center"><button class="btn" onclick="beginAppointment()">Continue to the meeting →</button></div>`;
  $("modal").classList.add("open");
}
function beginAppointment(){
  closeModal();
  G.view="meet"; setTop(); renderSide();
  const c=CHARACTERS[G.meet.char], place=G.meet.place;
  const story=STORIES[G.meet.char][place];
  const whoOpts=CATS.who.items.map(it=>`<option value="${it.id}">${it.label}</option>`).join("");
  const whatOpts=CATS.what.items.map(it=>`<option value="${it.id}">${it.label}</option>`).join("");
  logEl.innerHTML="";
  logEl.appendChild(beat(`<div class="meet">
    <div class="who"><div class="face">${c.face}</div><div><div class="nm">${c.name}</div><div class="rl">${c.role} · at ${PLACES[place].name}</div></div></div>
    <div class="desc">${story}</div>
    <div class="scene-title">Put a suggestion to them</div>
    <p style="color:var(--muted);font-size:14px;margin:2px 0 10px">Name a suspect and a scenario. <b>Where is fixed: ${PLACES[place].name}</b>, since that's where you're standing. ${c.name} can cross off only what they actually know — and how much depends on how you answer.</p>
    <div class="acc-field"><label>Suggest — WHO is in charge</label><select id="meet-who"><option value="">— choose a suspect —</option>${whoOpts}</select></div>
    <div class="acc-field"><label>Suggest — WHAT is happening</label><select id="meet-what"><option value="">— choose a scenario —</option>${whatOpts}</select></div>
    <div class="btnrow"><button class="btn" onclick="submitSuggestion()">Put it to them</button><button class="btn ghost" onclick="renderBoard()">Leave without asking</button></div>
  </div>`));
  scrollTop0();
}
function submitSuggestion(){
  const who=$("meet-who").value, what=$("meet-what").value;
  if(!who||!what){ flash("Choose one WHO and one WHAT to suggest."); return; }
  G.meet.who=who; G.meet.what=what;
  const bank=TOPICS[G.meet.topic].q;
  const start=G.topicQ[G.meet.topic]||0;
  G.meet.qs=[0,1,2].map(k=>bank[(start+k)%bank.length]);
  G.topicQ[G.meet.topic]=(start+3)%bank.length;
  G.meet.qi=0; G.meet.wrong=0;
  // the informant's in-character challenge frames the quiz
  logEl.appendChild(beat(`<div class="meet"><div class="frame">${TOPICS[G.meet.topic].frame}</div></div>`));
  renderQuestion();
}
function renderQuestion(){
  const m=G.meet;
  if(m.qi>=m.qs.length){ finishMeeting(); return; }
  const qd=m.qs[m.qi];
  const el=beat(`<div class="meet"><div class="qprog">Question ${m.qi+1} of 3 · ${m.wrong} wrong so far</div><div class="prompt">${qd.q}</div><div class="opts">${qd.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="lab">${String.fromCharCode(65+i)}.</span>${o.t}</button>`).join("")}</div><div class="fbslot"></div></div>`);
  logEl.appendChild(el); scrollEnd();
  let answered=false;
  el.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    if(answered) return; answered=true;
    const o=qd.o[+b.dataset.i], wrong=(o.v==="wrong"||o.v==="danger");
    if(wrong){ m.wrong++; G.standing=Math.max(0,G.standing-3);} else { G.standing=Math.min(100,G.standing+2);}
    renderSide();
    el.querySelectorAll(".opt").forEach((x,xi)=>{ x.disabled=true; if(xi===+b.dataset.i) x.classList.add("chosen"); });
    const vmap={expert:"EXPERT",partial:"PARTIAL CREDIT",wrong:"WRONG",danger:"DANGEROUS"};
    const slot=el.querySelector(".fbslot");
    slot.innerHTML=`<div class="feedback v-${o.v}"><span class="verdict">${vmap[o.v]}</span>${o.fb}</div><button class="btn">Continue</button>`;
    slot.querySelector(".btn").addEventListener("click",()=>{ slot.querySelector(".btn").remove(); m.qi++; renderQuestion(); });
    scrollEnd();
  }));
}
function finishMeeting(){
  const m=G.meet, ch=CHARACTERS[m.char];
  const allow = m.wrong===0?2 : m.wrong===1?1 : 0;
  // the suggestion, WHERE fixed to current place; reveal held cards among the three, priority where,who,what
  const sug=[{cat:"where",id:m.place},{cat:"who",id:m.who},{cat:"what",id:m.what}];
  const holds=s=>ch.hand.some(b=>b.cat===s.cat&&b.id===s.id);
  const notGiven=s=>!G.given[m.char+"|"+s.cat+":"+s.id];
  const cands=sug.filter(s=>holds(s)&&notGiven(s));
  const give=cands.slice(0,allow);
  give.forEach(s=>{ G.given[m.char+"|"+s.cat+":"+s.id]=true; G.revealed[s.cat+":"+s.id]=true;
    G.clues.push({text:shortLabel(s.cat,s.id)+" — "+CATS[s.cat].title, from:ch.name}); });
  // record what we now know about THIS informant for the three probed cards (Clue-style notepad marks):
  //  has = they told us (revealed it now or earlier); lacks = proven absent (leftover capacity, still not shown);
  //  unsure = we asked but capacity was used up on other clues, so it's undetermined.
  const gaveKeys=new Set(give.map(s=>s.cat+":"+s.id));
  G.ask[m.char]=G.ask[m.char]||{};
  sug.forEach(s=>{ const k=s.cat+":"+s.id, cur=G.ask[m.char][k];
    if(gaveKeys.has(k)) G.ask[m.char][k]="has";
    else if(G.given[m.char+"|"+k]) G.ask[m.char][k]="has";   // told us in an earlier meeting
    else if(give.length<allow) G.ask[m.char][k]="lacks";     // leftover capacity, yet not shown => they don't hold it
    else if(cur!=="lacks") G.ask[m.char][k]="unsure";        // capacity spent elsewhere => undetermined
  });
  renderSide();

  const perf = m.wrong===0?`You answered all three correctly — ${ch.name} speaks freely (up to two clues).`
    : m.wrong===1?`One slip — ${ch.name} offers a single clue.`
    : `Two or more wrong — ${ch.name} loses confidence and shares nothing.`;
  let body;
  if(give.length){
    const lis=give.map(s=>`<li>Rule out <b>${shortLabel(s.cat,s.id)}</b> <span style="color:var(--muted)">(${CATS[s.cat].title})</span></li>`).join("");
    body=`<div class="cluecard"><div class="clab">🔍 ${give.length} new clue${give.length>1?"s":""}</div>${perf}<ul>${lis}</ul><div class="hint">These cards are lit gold in your notepad → cross them off yourself.</div></div>`;
  } else if(allow===0){
    body=`<div class="nothing">${perf} Come back another day, surer of the science.</div>`;
  } else {
    body=`<div class="nothing">${perf} But ${ch.name} holds nothing on <b>${shortLabel("who",m.who)}</b>, <b>${shortLabel("what",m.what)}</b>, or this place — or you've already learned it. Try a different suspect, scenario, place, or informant.</div>`;
  }
  const out = G.daysLeft<=0;
  const btns = out ? `<div class="btnrow"><button class="btn warn" onclick="goAccuse()">Make your accusation</button></div>`
    : `<div class="btnrow"><button class="btn" onclick="renderBoard()">Back to the board</button><button class="btn warn" onclick="goAccuse()">Accuse now</button></div>`;
  logEl.appendChild(beat(`<div class="meet">${body}${out?`<p style="color:var(--bad)"><b>Your time is up.</b></p>`:""}${btns}</div>`));
  scrollEnd();
}

/* --------------------------- ACCUSATION ---------------------------- */
function goAccuse(){
  G.view="accuse"; setTop(); renderSide();
  const sel=cat=>`<select id="acc-${cat}"><option value="">— choose —</option>${CATS[cat].items.map(it=>`<option value="${it.id}">${it.label}</option>`).join("")}</select>`;
  logEl.innerHTML=`<div class="beat"><div class="accuse-box"><h2>Your report to the Bureau</h2>
    <p>Name all three. It only holds if the person, the place, and the nature are all correct — like calling the envelope in Clue.</p>
    <div class="acc-field"><label>Who is in charge</label>${sel("who")}</div>
    <div class="acc-field"><label>Where it culminates</label>${sel("where")}</div>
    <div class="acc-field"><label>What is happening</label>${sel("what")}</div>
    <div class="btnrow"><button class="btn warn" onclick="submitAccuse()">File the report</button>${G.daysLeft>0?`<button class="btn ghost" onclick="renderBoard()">Keep investigating</button>`:""}</div>
  </div></div>`;
  scrollTop0();
}
function submitAccuse(){
  const who=$("acc-who").value, where=$("acc-where").value, what=$("acc-what").value;
  if(!who||!where||!what){ flash("Choose one option in each of the three fields."); return; }
  renderEnding(who,where,what);
}

/* ----------------------------- ENDINGS ----------------------------- */
function renderEnding(who,where,what){
  G.view="ending"; G.finished=true; setTop(); renderSide();
  const got=Object.keys(G.revealed).length;
  const whoOK=who===CATS.who.truth, whereOK=where===CATS.where.truth, whatOK=what===CATS.what.truth;
  let rank,title,body;
  if(whoOK&&whereOK&&whatOK){
    if(got>=5){ rank="EXPERT WITNESS"; title="What the Evidence Supports, and No More";
      body=["Cho names it exactly: Director Kessler orchestrating the concealment; the work culminating in the IVF & Embryology Clinic; an undeclared human germline-editing program hidden behind the approved somatic-therapy trial — and a buried off-target injury. Not a bioweapon.",
        "Every card accounted for. She kept her cover, worked her informants, and claimed precisely what she could defend — refusing the tabloid word. Lena Cho files a compliance report, exactly as her visa said she would, which is the whole point."]; }
    else if(got>=3){ rank="SOUND, THIN"; title="Right — but Lightly Proven";
      body=["Cho names the right three — Kessler, the Clinic, the undeclared germline program behind a cover-up. The shape is correct and her restraint exactly right.",
        "But she left too many cards unturned; the Bureau's lawyers will have to firm up the chain. Close and honest — a few more days of legwork would have made it unassailable."]; }
    else { rank="NAMED, NOT PROVEN"; title="The Right Answer, Unearned";
      body=["Cho names the truth — Kessler, the Clinic, the germline program — but gathered too few clues to back it. It reads like a guess.",
        "The Bureau cannot act on an accusation this thin, however correct. Being right is not the same as being able to prove it."]; }
  }
  else if(!whatOK){
    if(what==="bioweapon"){ rank="OVERCLAIM"; title="The Auditor Who Cried Bioweapon";
      body=["Cho reports a covert engineered-pathogen bioweapon — lurid, and not what the evidence shows.",
        "Nothing she gathered was pathogen work; the machinery for editing a person's DNA is not the machinery for a weapon. The overclaim collapses into human embryo editing plus a safety cover-up, and the real, provable violation is discredited by association with the fantasy stacked on top of it."]; }
    else { rank="HALF THE TRUTH"; title="The Compliance Sign-Off";
      body=["Cho certifies an approved somatic gene-therapy program and stops there. She is half right, and the graver half is missing.",
        "The mosaic edits across every tissue, the approvals that never existed, the injection rigs in the clinic — all point past the sanctioned therapy to an undeclared germline program. She saw the cover story and never what it was sheltering."]; }
  }
  else { rank="RIGHT NATURE, WRONG NAMES"; title="So Close";
    body=["Cho understands what is happening — an undeclared human germline-editing program behind a safety cover-up, not a bioweapon and not routine research. The science, she has cold.",
      `But her accusation misnames ${!whereOK?"where it culminates":""}${(!whereOK&&!whoOK)?" and ":""}${!whoOK?"who is behind it":""}. An accusation that points at the wrong wing or the wrong person doesn't hold. It centers on the IVF & Embryology Clinic, and it is Director Kessler who turned a compliant therapy trial into a shield.`]; }

  logEl.innerHTML=`<div class="beat"><div class="ending"><div class="rank">◆ ${rank}</div><h2>${title}</h2>
    <div class="narr">${body.map(p=>`<p>${p}</p>`).join("")}</div>
    <div style="margin-top:12px;font-family:monospace;font-size:12px;color:var(--muted)">Accused — Who: ${shortLabel("who",who)} · Where: ${shortLabel("where",where)} · What: ${shortLabel("what",what)}</div>
    <div style="margin-top:8px;border-top:1px solid var(--line);padding-top:10px;font-family:monospace;font-size:12px;color:var(--muted)">Clues gathered: ${got}/6 · Pioneers read: ${G.emails.length}/18 · Days used: ${DAYS_TOTAL-G.daysLeft}/${DAYS_TOTAL} · Standing ${Math.round(G.standing)}</div>
    <button class="btn ghost" style="margin-top:16px" onclick="location.reload()">Play again</button></div></div>`;
  scrollTop0();
}

/* --------------------------- TITLE / BOOT -------------------------- */
function showTitle(){
  G.view="title"; setTop();
  logEl.innerHTML=`<div class="title-screen beat">
    <div class="subt">A deduction game inside the Halden Institute for Advanced Genomics</div>
    <h1>The Germline Witness</h1>
    <div class="blurb">
      <p>The <b>Halden Institute for Advanced Genomics</b> runs one of the world's most celebrated gene-therapy programs — approved, published, praised on every magazine cover. But a coded message reached the Bureau: somewhere inside those glass corridors, someone has crossed the one line the whole world agreed never to cross. You are <b>Dr. Lena Cho</b>, and the badge on your coat says <i>biosafety auditor</i>. It's a lie you'll need.</p>
      <p><b>Three people inside will help you</b> — each for their own reasons, and only if you earn it. <b>Nadia Sarto</b>, a bench technician who sees what the sequencers see. <b>The Registrar</b>, keeper of the drawings, logs, and change-orders no one's meant to read twice. And <b>Emil</b>, a cold-chain courier who knows exactly what moves between buildings, and when. None of them is the culprit; each holds only fragments of it.</p>
      <p><b>Someone here is behind it.</b> Three names sit in your notepad: <b>Prof. Aris Vane</b>, the charismatic gene-therapy PI; <b>Dr. Sable</b>, the embryologist; and <b>Director Kessler</b>, who runs the Institute and chairs its ethics board. Each column of the case — <b>who</b> is behind it, <b>where</b> it culminates, <b>what</b> is truly happening — hides a tempting wrong answer. The tabloids already smell an engineered bioweapon. The Institute swears it's nothing but the therapy on the label. The truth is quieter than the first and graver than the second: <b>undeclared human germline editing — and a cover-up to match.</b></p>
      <p>You have <b>${DAYS_TOTAL} days</b> and a single accusation. Get it right and a witness becomes proof; get it wrong and a scandal becomes a smear.</p>
    </div>
    <button class="btn" onclick="beginGame()">Arrive at the Institute</button>
    <div style="margin-top:16px"><a href="#" onclick="openDirections();return false;" style="color:var(--accent2);font-family:'Courier New',monospace;letter-spacing:1px;text-transform:uppercase;font-size:12px;text-decoration:none;border-bottom:1px dotted var(--accent2)">▸ New to the case? Read the Directions</a></div>
  </div>`;
  renderSide();
}
function beginGame(){ shuffleHands(); G.loc="hq"; renderBoard(); }
function openDirections(){
  $("reader").innerHTML=`<button class="close" onclick="closeModal()">CLOSE</button>
    <h1 style="font-size:22px">Directions — How to play</h1>
    <p style="color:#6b5f45;font-style:italic">A Clue-style deduction. Solve three columns of your notepad — <b>Who</b> is behind it, <b>Where</b> it culminates, and <b>What</b> is truly happening — with one answer in each. Education is the way through.</p>
    <p><b>The board.</b> The campus has three sites. A hop between them costs <b>one or two days</b>. Each turn you choose where to go and whom to meet there.</p>
    <p><b>Your informants.</b> Three people hold clues — Nadia, the Registrar, and Emil. Each <b>holds two clues</b> (they are never the suspects), they can only reveal what they actually hold, and their hands are <b>reshuffled every game</b> for a fresh case each run.</p>
    <p><b>The daily reading.</b> Every place-and-person meeting draws one of <b>18 gene-editing pioneers</b> — which one varies run to run. Their profile <b>pops up before the appointment</b>: it is exactly the topic you're about to be tested on, so read it.</p>
    <p><b>The suggestion &amp; the test.</b> You put a suggestion to your informant — a specific <b>Who</b> and <b>What</b>, with <b>Where fixed to where you stand</b>. They then test you with three questions: <b>ace all three for up to two clues, miss one for a single clue, miss two or more and they clam up.</b></p>
    <p><b>Crossing off.</b> Each clue you earn lights a card gold; <b>you cross it off yourself</b> by clicking it in your notepad.</p>
    <p><b>The clock &amp; the accusation.</b> You have <b>${DAYS_TOTAL} days</b>. When you're sure — or out of time — <b>accuse: Who, Where, and What. All three must match.</b></p>
    <p style="color:#6b5f45;font-style:italic">And beware the tabloid conclusion: the evidence points not to a bioweapon, but to something quieter and real.</p>`;
  $("modal").classList.add("open");
}

window.travelTo=travelTo; window.renderPlace=renderPlace; window.meetPerson=meetPerson;
window.beginAppointment=beginAppointment; window.submitSuggestion=submitSuggestion;
window.renderBoard=renderBoard; window.goAccuse=goAccuse; window.submitAccuse=submitAccuse;
window.toggleCross=toggleCross; window.openInbox=openInbox; window.openEmail=openEmail;
window.openClues=openClues; window.closeModal=closeModal; window.beginGame=beginGame;
window.openDirections=openDirections;
showTitle();

</script>
</body>

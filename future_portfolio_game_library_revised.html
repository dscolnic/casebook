tform that improved as semiconductor manufacturing improved.","whyItLookedRight":"A period investor could point to no vacuum tube and can form many pixels on one chip; camera tubes dominate electronic imaging, but semiconductor manufacturing is improving rapidly, while the decisive constraint had not yet been established.","returnRationale":"The eventual upside was large, but the path depended on complementary infrastructure, scale, or timing that made it a high-variance bet at the decision date."},"innovationTree":{"nodes":[{"id":"birth-of-electronic-imaging-idea-1-node-1","label":"CCD image sensor","kind":"root"},{"id":"birth-of-electronic-imaging-idea-1-node-2","label":"astronomical cameras","kind":"application"},{"id":"birth-of-electronic-imaging-idea-1-node-3","label":"digital photography","kind":"application"},{"id":"birth-of-electronic-imaging-idea-1-node-4","label":"medical and scientific imaging","kind":"application"},{"id":"birth-of-electronic-imaging-idea-1-node-5","label":"scanners and machine vision","kind":"application"}],"edges":[{"from":"birth-of-electronic-imaging-idea-1-node-1","to":"birth-of-electronic-imaging-idea-1-node-2"},{"from":"birth-of-electronic-imaging-idea-1-node-1","to":"birth-of-electronic-imaging-idea-1-node-3"},{"from":"birth-of-electronic-imaging-idea-1-node-1","to":"birth-of-electronic-imaging-idea-1-node-4"},{"from":"birth-of-electronic-imaging-idea-1-node-1","to":"birth-of-electronic-imaging-idea-1-node-5"}]},"tags":["solid-state imaging","semiconductor","platform"],"id":"birth-of-electronic-imaging-idea-1","displayOrder":1,"researchPackage":{"costMillions":6,"technicalFinding":"Each light-sensitive site accumulates charge in proportion to incoming light. Clock pulses transfer the charge row by row to an output amplifier.","productionFinding":"The idea depends on making large, clean semiconductor arrays with very few defective sites—difficult at first, but compatible with chip-fabrication learning curves.","adoptionFinding":"Astronomy, scientific imaging, television, surveillance, and eventually consumer photography all need smaller and more stable cameras.","unresolvedRisks":["Readout electronics are difficult","Early chips contain defects","Manufacturing yield is uncertain"]}},{"concealedTitle":"Photoconductive Camera Tube","pitch":"An electron beam scans a light-sensitive target inside a vacuum tube, converting the stored image into a television signal. The design can be evaluated using the period’s available instruments and operating conditions. Its adoption would depend on costs, operating practice, complementary equipment, and repeatable results.","knownAdvantages":["Good image quality for its era","Smaller than earlier camera tubes","Works with existing television electronics"],"knownRisks":["Requires a vacuum tube","Image lag and burn-in","Bulky high-voltage camera systems"],"reveal":{"historicalName":"Vidicon camera tube","impactTier":"medium","returnMultiplier":2.01,"legacyBonusMultiplier":0.25,"historicalOutcome":"Became a major television and industrial-camera technology for decades before solid-state sensors displaced it.","rankingRationale":"It was practical and commercially important, but its vacuum-tube architecture could not shrink and scale like semiconductor sensors.","whyItLookedRight":"A period investor could point to good image quality for its era and smaller than earlier camera tubes; the device can win the near-term camera market even if a smaller solid-state technology eventually overtakes it, while the decisive constraint had not yet been established.","returnRationale":"This path offered a narrower but earlier and more legible route to adoption, making it the stronger risk-adjusted allocation before hindsight."},"innovationTree":{"nodes":[{"id":"birth-of-electronic-imaging-idea-2-node-1","label":"Vidicon tube","kind":"root"},{"id":"birth-of-electronic-imaging-idea-2-node-2","label":"broadcast and studio cameras","kind":"application"},{"id":"birth-of-electronic-imaging-idea-2-node-3","label":"industrial television","kind":"application"},{"id":"birth-of-electronic-imaging-idea-2-node-4","label":"security cameras","kind":"application"},{"id":"birth-of-electronic-imaging-idea-2-node-5","label":"early spacecraft imaging","kind":"application"}],"edges":[{"from":"birth-of-electronic-imaging-idea-2-node-1","to":"birth-of-electronic-imaging-idea-2-node-2"},{"from":"birth-of-electronic-imaging-idea-2-node-1","to":"birth-of-electronic-imaging-idea-2-node-3"},{"from":"birth-of-electronic-imaging-idea-2-node-1","to":"birth-of-electronic-imaging-idea-2-node-4"},{"from":"birth-of-electronic-imaging-idea-2-node-1","to":"birth-of-electronic-imaging-idea-2-node-5"}]},"tags":["camera tube","near-term market"],"id":"birth-of-electronic-imaging-idea-2","displayOrder":2,"researchPackage":{"costMillions":8,"technicalFinding":"Light changes the electrical resistance of a target; a scanning electron beam reads the resulting pattern line by line.","productionFinding":"Tube factories already know how to make vacuum electronics, so production is feasible before large image-sensor chips are mature.","adoptionFinding":"Broadcast, industrial television, security, and early space cameras provide substantial demand.","unresolvedRisks":["Image lag and burn-in","Requires a vacuum tube","Bulky high-voltage camera systems"]}},{"concealedTitle":"Electron Image-Dissector Tube","pitch":"An electronic image is swept across a small aperture so one tiny portion can be measured at a time. Its adoption would depend on costs, operating practice, complementary equipment, and repeatable results. Investors must compare measured performance, production requirements, compatibility, and buyer behavior.","knownAdvantages":["Fully electronic scanning","No mechanical spinning disk","Can demonstrate television images"],"knownRisks":["Very low light sensitivity","Needs intense illumination","Poor signal efficiency"],"reveal":{"historicalName":"Image dissector","impactTier":"limited","returnMultiplier":0.6,"legacyBonusMultiplier":0.0,"historicalOutcome":"Helped demonstrate all-electronic television and found specialized scientific uses, but low sensitivity prevented broad camera adoption.","rankingRationale":"It solved scanning but wasted too much of the light signal, leaving it behind better storage tubes and later solid-state sensors.","whyItLookedRight":"A period investor could point to fully electronic scanning and no mechanical spinning disk; competing storage-type camera tubes preserve more of the incoming signal and therefore produce much stronger images, while the decisive constraint had not yet been established.","returnRationale":"The investment lost capital because a constraint outside the initial demonstration—scale, safety, adoption, economics, or competing systems—restricted durable use."},"innovationTree":{"nodes":[{"id":"birth-of-electronic-imaging-idea-3-node-1","label":"Image dissector","kind":"root"},{"id":"birth-of-electronic-imaging-idea-3-node-2","label":"experimental electronic television","kind":"application"},{"id":"birth-of-electronic-imaging-idea-3-node-3","label":"specialized photometry","kind":"application"},{"id":"birth-of-electronic-imaging-idea-3-node-4","label":"mass-market camera adoption","kind":"blocked"}],"edges":[{"from":"birth-of-electronic-imaging-idea-3-node-1","to":"birth-of-electronic-imaging-idea-3-node-2"},{"from":"birth-of-electronic-imaging-idea-3-node-1","to":"birth-of-electronic-imaging-idea-3-node-3"},{"from":"birth-of-electronic-imaging-idea-3-node-1","to":"birth-of-electronic-imaging-idea-3-node-4","status":"blocked"}]},"tags":["electronic television","sensitivity"],"id":"birth-of-electronic-imaging-idea-3","displayOrder":3,"researchPackage":{"costMillions":7,"technicalFinding":"The tube forms an electron image and magnetically scans it past an aperture, but most available electrons are discarded at any instant.","productionFinding":"It can be built with vacuum-tube methods, though precision alignment is demanding.","adoptionFinding":"Experimental television is interested, but ordinary scenes are not bright enough for easy use.","unresolvedRisks":["Needs intense illumination","Very low light sensitivity","Poor signal efficiency"]}}],"debrief":{"winnerIdeaId":"birth-of-electronic-imaging-idea-1","winnerReason":"The CCD became a general image-capture platform whose cost, size, and quality improved with the semiconductor industry.","investorLesson":"A working mechanism and a workable business are separate questions.","bestReturnIdeaId":"birth-of-electronic-imaging-idea-1","roundStructureExplanation":"The transformative idea had the largest realized upside, while the medium-impact path offered the better risk-adjusted case before the outcome was known."},"sources":["https://www.computerhistory.org/revolution/memory-storage/8/263/1117","https://www.computerhistory.org/siliconengine/tunnel-diode-promises-a-high-speed-semiconductor-switch/"],"roundStructure":"sleeper","calibrationTarget":{"ideaWeights":{"birth-of-electronic-imaging-idea-1":24.3,"birth-of-electronic-imaging-idea-2":45.0,"birth-of-electronic-imaging-idea-3":4.5},"holdWeight":16.2,"researchWeight":10}},{"id":"the-race-to-record-sound","sequence":42,"category":"Computing, Information, and Communications","title":"The Race to Record Sound","discipline":"audio and media technology","era":"1900s–1950s","connection":"Competing media for capturing sound so it can be replayed later.","briefing":"Recorded sound is moving beyond discs. Three technologies can preserve an electrical waveform, but they differ sharply in editing, copying, and the markets they can enter","difficulty":"intermediate","judgmentCall":false,"rankingCaveat":"","contentWarnings":[],"ideas":[{"concealedTitle":"Magnetized Coated Tape","pitch":"A flexible strip coated with magnetic particles records sound continuously and can be erased, edited, copied, and reused. Investors must compare measured performance, production requirements, compatibility, and buyer behavior. The design can be evaluated using the period’s available instruments and operating conditions. Cost, reliability, compatibility, and field performance still require direct comparison.","knownAdvantages":["Long recording time","Easy physical editing","Reusable and duplicable"],"knownRisks":["Background hiss","Tape can stretch or wear","Needs precise heads and transport"],"reveal":{"historicalName":"Magnetic tape recording","impactTier":"transformative","returnMultiplier":3.08,"legacyBonusMultiplier":0.0,"historicalOutcome":"Became the core medium for studio audio, broadcasting, home recording, video, and early large-scale computer storage.","rankingRationale":"Flexible tape made recording editable, copyable, inexpensive, and adaptable to both sound and data.","whyItLookedRight":"A period investor could point to long recording time and easy physical editing; wire recorders exist, while disc recording is established but difficult to edit and reuse, while the decisive constraint had not yet been established.","returnRationale":"The investment return reflects the breadth, durability, and capturability of the use that emerged, not scientific importance alone."},"innovationTree":{"nodes":[{"id":"the-race-to-record-sound-idea-1-node-1","label":"Magnetic tape","kind":"root"},{"id":"the-race-to-record-sound-idea-1-node-2","label":"radio production","kind":"application"},{"id":"the-race-to-record-sound-idea-1-node-3","label":"recorded music and multitracking","kind":"application"},{"id":"the-race-to-record-sound-idea-1-node-4","label":"video recording","kind":"application"},{"id":"the-race-to-record-sound-idea-1-node-5","label":"computer data storage","kind":"application"}],"edges":[{"from":"the-race-to-record-sound-idea-1-node-1","to":"the-race-to-record-sound-idea-1-node-2"},{"from":"the-race-to-record-sound-idea-1-node-1","to":"the-race-to-record-sound-idea-1-node-3"},{"from":"the-race-to-record-sound-idea-1-node-1","to":"the-race-to-record-sound-idea-1-node-4"},{"from":"the-race-to-record-sound-idea-1-node-1","to":"the-race-to-record-sound-idea-1-node-5"}]},"tags":["magnetic recording","editable medium","platform"],"id":"the-race-to-record-sound-idea-1","displayOrder":1,"researchPackage":{"costMillions":8,"technicalFinding":"The audio signal changes magnetization along a moving coated strip; playback converts the magnetic pattern back into electricity.","productionFinding":"Coating uniform particles onto inexpensive tape and maintaining steady speed are the main production challenges.","adoptionFinding":"Radio, music, dictation, film production, broadcasting, and computers all need editable recording.","unresolvedRisks":["Tape can stretch or wear","Background hiss","Needs precise heads and transport"]}},{"concealedTitle":"Variable Optical Track on Film","pitch":"Sound is converted into a changing light pattern photographed beside motion-picture images and read back by a lamp and photoelectric cell. The design can be evaluated using the period’s available instruments and operating conditions. Its adoption would depend on costs, operating practice, complementary equipment, and repeatable results.","knownAdvantages":["Image and sound remain synchronized","Copies with the film","No magnetic head needed"],"knownRisks":["Mainly tied to cinema","Noise and distortion limits","Editing is less flexible"],"reveal":{"historicalName":"Optical sound-on-film","impactTier":"medium","returnMultiplier":1.33,"legacyBonusMultiplier":0.0,"historicalOutcome":"Made synchronized talking pictures practical and remained a durable cinema standard, but its main application stayed tied to film.","rankingRationale":"It transformed movies, yet lacked the cross-industry flexibility of magnetic tape.","whyItLookedRight":"A period investor could point to image and sound remain synchronized and copies with the film; it can dominate one enormous medium without becoming the universal way to record sound elsewhere, while the decisive constraint had not yet been established.","returnRationale":"The investment return reflects the breadth, durability, and capturability of the use that emerged, not scientific importance alone."},"innovationTree":{"nodes":[{"id":"the-race-to-record-sound-idea-2-node-1","label":"Optical soundtrack","kind":"root"},{"id":"the-race-to-record-sound-idea-2-node-2","label":"talking pictures","kind":"application"},{"id":"the-race-to-record-sound-idea-2-node-3","label":"cinema distribution","kind":"application"},{"id":"the-race-to-record-sound-idea-2-node-4","label":"archival film sound","kind":"application"}],"edges":[{"from":"the-race-to-record-sound-idea-2-node-1","to":"the-race-to-record-sound-idea-2-node-2"},{"from":"the-race-to-record-sound-idea-2-node-1","to":"the-race-to-record-sound-idea-2-node-3"},{"from":"the-race-to-record-sound-idea-2-node-1","to":"the-race-to-record-sound-idea-2-node-4"}]},"tags":["cinema","optical recording"],"id":"the-race-to-record-sound-idea-2","displayOrder":2,"researchPackage":{"costMillions":7,"technicalFinding":"The waveform is stored as variations in the width or darkness of an optical track running alongside the film frames.","productionFinding":"Film laboratories can print picture and soundtrack together using established photographic processes.","adoptionFinding":"The movie industry urgently needs reliable synchronized sound.","unresolvedRisks":["Noise and distortion limits","Mainly tied to cinema","Editing is less flexible"]}},{"concealedTitle":"Magnetized Steel Wire","pitch":"A thin steel wire moves past a recording head and stores sound as a magnetic pattern. Its adoption would depend on costs, operating practice, complementary equipment, and repeatable results. Investors must compare measured performance, production requirements, compatibility, and buyer behavior. The design can be evaluated using the period’s available instruments and operating conditions.","knownAdvantages":["Compact reels","Rugged recording medium","Useful for speech and field recording"],"knownRisks":["Hard to splice and edit","Wire tangles and breaks","Lower fidelity and convenience"],"reveal":{"historicalName":"Magnetic wire recorder","impactTier":"limited","returnMultiplier":0.51,"legacyBonusMultiplier":0.25,"historicalOutcome":"Found military, dictation, and early consumer uses but quickly lost to magnetic tape after World War II.","rankingRationale":"It worked, but tape was easier to edit, duplicate, store, and extend into higher-fidelity and data applications.","whyItLookedRight":"A period investor could point to compact reels and rugged recording medium; a flat coated tape can carry more information, is easier to handle, and can be physically edited, while the decisive constraint had not yet been established.","returnRationale":"The investment lost capital because a constraint outside the initial demonstration—scale, safety, adoption, economics, or competing systems—restricted durable use."},"innovationTree":{"nodes":[{"id":"the-race-to-record-sound-idea-3-node-1","label":"Wire recorder","kind":"root"},{"id":"the-race-to-record-sound-idea-3-node-2","label":"wartime field recording","kind":"application"},{"id":"the-race-to-record-sound-idea-3-node-3","label":"office dictation","kind":"application"},{"id":"the-race-to-record-sound-idea-3-node-4","label":"long-term mass recording","kind":"blocked"}],"edges":[{"from":"the-race-to-record-sound-idea-3-node-1","to":"the-race-to-record-sound-idea-3-node-2"},{"from":"the-race-to-record-sound-idea-3-node-1","to":"the-race-to-record-sound-idea-3-node-3"},{"from":"the-race-to-record-sound-idea-3-node-1","to":"the-race-to-record-sound-idea-3-node-4","status":"blocked"}]},"tags":["wire recording","displaced technology"],"id":"the-race-to-record-sound-idea-3","displayOrder":3,"researchPackage":{"costMillions":6,"technicalFinding":"The principle is sound: varying magnetization along the wire stores the audio waveform.","productionFinding":"Steel wire and recording heads are practical, and wartime demand helps production.","adoptionFinding":"Military messages, dictation, and some home users need portable recording.","unresolvedRisks":["Wire tangles and breaks","Hard to splice and edit","Lower fidelity and convenience"]}}],"debrief":{"winnerIdeaId":"the-race-to-record-sound-idea-1","winnerReason":"Magnetic tape did more than record sound: it became a reusable information medium that could support editing, video, and computer data.","investorLesson":"Institutional incentives can defeat a technically efficient product.","bestReturnIdeaId":"the-race-to-record-sound-idea-1","roundStructureExplanation":"One option produced the clearest direct return, but the concealed evidence is intentionally balanced."},"sources":["https://americanhistory.si.edu/collections/object/nmah_2016756","https://americanhistory.si.edu/collections/object/nmah_1301344","https://americanhistory.si.edu/collections/object/nmah_759432"],"roundStructure":"standard","calibrationTarget":{"ideaWeights":{"the-race-to-record-sound-idea-1":61.2,"the-race-to-record-sound-idea-2":17.1,"the-race-to-record-sound-idea-3":3.6},"holdWeight":8.1,"researchWeight":10}},{"id":"the-early-satellite-communications-race","sequence":43,"category":"Earth, Atmosphere, Astronomy, and Space","title":"The Early Satellite-Communications Race","discipline":"space communications","era":"1958–1965","connection":"Early U.S. programs tested radically different ways to use space as a communications relay.","briefing":"Long-distance communications are requires more capital than established alternatives and vulnerable. Investors must choose between a passive mirror, an active satellite in a difficult orbit, and an artificial reflecting belt","difficulty":"intermediate","judgmentCall":false,"rankingCaveat":"","contentWarnings":[],"ideas":[{"concealedTitle":"Active Repeater in a 24-Hour Orbit","pitch":"A satellite receives a radio signal, amplifies it, and retransmits it while orbiting at the same rate that Earth turns. Investors must compare measured performance, production requirements, compatibility, and buyer behavior. The design can be evaluated using the period’s available instruments and operating conditions.","knownAdvantages":["Appears fixed over one region","High communication capacity","Ground antennas do not need constant tracking"],"knownRisks":["Very difficult high orbit","Signal delay","Complex reliable electronics in space"],"reveal":{"historicalName":"Syncom and geostationary communications satellites","impactTier":"transformative","returnMultiplier":3.43,"legacyBonusMultiplier":0.0,"historicalOutcome":"Established the architecture used by global television, telephone, data links, weather satellites, and many modern communications systems.","rankingRationale":"One satellite could continuously cover a huge region, turning an expensive experiment into scalable communications infrastructure.","whyItLookedRight":"A period investor could point to appears fixed over one region and high communication capacity; medium-orbit active satellites and passive reflectors work, but require more satellites or tracking effort, while the decisive constraint had not yet been established.","returnRationale":"The eventual upside was large, but the path depended on complementary infrastructure, scale, or timing that made it a high-variance bet at the decision date."},"innovationTree":{"nodes":[{"id":"the-early-satellite-communications-race-idea-1-node-1","label":"Geostationary active satellite","kind":"root"},{"id":"the-early-satellite-communications-race-idea-1-node-2","label":"global television distribution","kind":"application"},{"id":"the-early-satellite-communications-race-idea-1-node-3","label":"international telephone and data","kind":"application"},{"id":"the-early-satellite-communications-race-idea-1-node-4","label":"weather communications","kind":"application"},{"id":"the-early-satellite-communications-race-idea-1-node-5","label":"remote and maritime connectivity","kind":"application"}],"edges":[{"from":"the-early-satellite-communications-race-idea-1-node-1","to":"the-early-satellite-communications-race-idea-1-node-2"},{"from":"the-early-satellite-communications-race-idea-1-node-1","to":"the-early-satellite-communications-race-idea-1-node-3"},{"from":"the-early-satellite-communications-race-idea-1-node-1","to":"the-early-satellite-communications-race-idea-1-node-4"},{"from":"the-early-satellite-communications-race-idea-1-node-1","to":"the-early-satellite-communications-race-idea-1-node-5"}]},"tags":["geosynchronous orbit","active repeater","platform"],"id":"the-early-satellite-communications-race-idea-1","displayOrder":1,"researchPackage":{"costMillions":7,"technicalFinding":"At geosynchronous altitude, the satellite returns above the same longitude each day; an active transponder strengthens weak incoming signals.","productionFinding":"The spacecraft must survive launch, operate unattended, and maintain attitude and orbit for years.","adoptionFinding":"International telephone, television, military links, and remote regions need continuous long-distance channels.","unresolvedRisks":["Signal delay","Very difficult high orbit","Complex reliable electronics in space"]}},{"concealedTitle":"Giant Reflective Balloon","pitch":"A large metal-coated balloon in low orbit passively reflects radio signals sent from one ground station toward another. The design can be evaluated using the period’s available instruments and operating conditions. Its adoption would depend on costs, operating practice, complementary equipment, and repeatable results.","knownAdvantages":["Simple electronics","Visible and easy to track","Proves space relay is possible"],"knownRisks":["Weak reflected signal","Short passes over each station","Low capacity"],"reveal":{"historicalName":"Echo passive communications satellite","impactTier":"medium","returnMultiplier":1.89,"legacyBonusMultiplier":0.25,"historicalOutcome":"Demonstrated voice and telephone relay through space and supported important geodetic and atmospheric measurements.","rankingRationale":"It proved the concept and generated valuable science, but passive reflection could not match active satellites for capacity and continuous service.","whyItLookedRight":"A period investor could point to simple electronics and visible and easy to track; active satellites promise better signal quality and capacity once reliable space electronics are available, while the decisive constraint had not yet been established.","returnRationale":"This path offered a narrower but earlier and more legible route to adoption, making it the stronger risk-adjusted allocation before hindsight."},"innovationTree":{"nodes":[{"id":"the-early-satellite-communications-race-idea-2-node-1","label":"Echo balloon satellite","kind":"root"},{"id":"the-early-satellite-communications-race-idea-2-node-2","label":"first satellite voice links","kind":"application"},{"id":"the-early-satellite-communications-race-idea-2-node-3","label":"geodesy and atmospheric density","kind":"application"},{"id":"the-early-satellite-communications-race-idea-2-node-4","label":"passive relay experiments","kind":"application"}],"edges":[{"from":"the-early-satellite-communications-race-idea-2-node-1","to":"the-early-satellite-communications-race-idea-2-node-2"},{"from":"the-early-satellite-communications-race-idea-2-node-1","to":"the-early-satellite-communications-race-idea-2-node-3"},{"from":"the-early-satellite-communications-race-idea-2-node-1","to":"the-early-satellite-communications-race-idea-2-node-4"}]},"tags":["passive satellite","demonstration"],"id":"the-early-satellite-communications-race-idea-2","displayOrder":2,"researchPackage":{"costMillions":6,"technicalFinding":"The satellite acts like a mirror rather than an amplifier, so only a tiny fraction of transmitted power reaches the receiver.","productionFinding":"Inflatable reflective spheres are comparatively simple but must deploy reliably in space.","adoptionFinding":"Governme function resume(){const x=load();if(x){state=x;ensureCurrent();render()}}
function currentRound(){return roundById(state.roundIds[state.roundIndex])}
function ensureCurrent(){if(state.current)return;const r=currentRound(),ids=shuffle(r.ideas.map(i=>i.id));state.current={roundId:r.id,roundStartUnits:state.bankrollUnits,ideaOrder:ids,purchasedReports:[],allocations:Object.fromEntries(ids.map(id=>[id,0])),result:null};save()}
function bought(id){return state.current.purchasedReports.includes(id)}
function reportCostUnits(id){const i=ideaById(currentRound(),id);return Math.round(i.researchPackage.costMillions*10)}
function reportSpend(){return state.current.purchasedReports.reduce((s,id)=>s+reportCostUnits(id),0)}
function investable(){return Math.max(0,state.current.roundStartUnits-reportSpend())}
function allocated(){return Object.values(state.current.allocations).reduce((a,b)=>a+b,0)}
function held(){return investable()-allocated()}
function topbar(){const ingame=state.screen!=='home';const shown=state.screen==='reveal'?state.current.result.totalReturn:state.bankrollUnits;return `<header class="topbar"><div class="brand"><div class="brand-title">Future Portfolio</div><div class="brand-sub">${ingame?esc(gameById(state.gameId)?.title||'Historical innovation'):'RECKON · History of technology'}</div></div><div class="status">${ingame?`<span class="status-item">Round <strong>${state.roundIndex+1}/3</strong></span><span class="status-item">Fund <strong>${money(shown)}</strong></span><span class="status-item">Target <strong>${money(state.targetUnits)}</strong></span><button class="text-btn" onclick="goHome()">Games</button><button class="text-btn" onclick="restart()">Restart</button>`:''}</div></header>`}
function render(){ensureCurrentIfNeeded();let body=state.screen==='home'?home():state.screen==='invest'?investView():state.screen==='reveal'?revealView():finalView();$('#app').innerHTML=topbar()+`<main>${body}</main>`}
function ensureCurrentIfNeeded(){if(state.screen==='invest'&&!state.current)ensureCurrent()}
function home(){const saved=load();return `<section><div class="library-head"><div><div class="eyebrow">Game library</div><h1>Future Portfolio</h1><p>Judge three concealed historical ideas, decide whether an integrated research package is worth buying, and size the fund’s bets. Impact and investor return are not always the same.</p></div></div>${saved?`<div class="resume"><div><strong>Game in progress</strong><div class="muted">${esc(gameById(saved.gameId)?.title||'Saved game')} · round ${saved.roundIndex+1} of 3</div></div><button class="btn" onclick="resume()">Resume</button></div>`:''}<div class="games-grid">${GAME_SETS.map((g,i)=>`<button class="game-card" onclick="startGame('${g.id}')"><div><div class="game-number">Game ${String(i+1).padStart(2,'0')}</div><div class="game-title">${esc(g.title)}</div></div><div class="game-words">${g.words.map(w=>`<span class="game-word">${esc(w)}</span>`).join('')}</div><div class="game-foot"><span>Three rounds</span><strong>Play →</strong></div></button>`).join('')}</div></section>`}
function structureName(x){return({standard:'Standard',twoWinners:'Two positive returns',allDuds:'Cash may win',sleeper:'High-upside long shot'}[x]||x)}
function termHelp(tags=[]){return tags.length?tags.map(t=>esc(t)).join(' · '):'The concealed title describes the mechanism rather than the historical name.'}
function investView(){const r=currentRound();return `<section><div class="round-head"><div class="eyebrow">Round ${state.roundIndex+1} · ${esc(r.era)}</div><h2>${esc(r.title)}</h2><p>${esc(r.briefing)}</p><div class="meta"><span class="tag">${esc(r.discipline)}</span><span class="tag">${esc(r.difficulty)}</span></div><div class="structure-note"><strong>Connection:</strong> ${esc(r.connection)} You may hold cash. Each idea has one optional research package containing technical, production, and adoption evidence.</div></div><div class="ideas-grid">${state.current.ideaOrder.map((id,n)=>ideaCard(r,ideaById(r,id),n)).join('')}</div>${portfolio()}</section>`}
function ideaCard(r,i,n){const a=state.current.allocations[i.id]||0;const max=investable()-(allocated()-a);return `<article class="idea-card"><div class="idea-head"><div class="idea-letter">Idea ${LETTERS[n]}</div><h3>${esc(i.concealedTitle)}</h3></div><div class="idea-body"><div class="pitch">${esc(i.pitch)}</div><div class="two-col"><div class="fact-box"><div class="fact-title">Known capabilities</div><ul class="clean">${i.knownAdvantages.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="fact-box"><div class="fact-title">Open questions</div><ul class="clean">${i.knownRisks.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div><div class="research"><div class="research-head"><strong>Research package</strong><span>Optional · paid once</span></div><div class="report-list">${researchControl(i)}</div></div><details class="glossary"><summary>Terms</summary><p>${termHelp(i.tags)}</p></details></div><div class="allocation"><div class="allocation-top"><span>Investment</span><strong>${money(a)}</strong></div><input class="range" type="range" min="0" max="${max}" step="1" value="${a}" oninput="setAllocation('${i.id}',this.value)"><div class="money-row"><input aria-label="Investment in ${esc(i.concealedTitle)}" type="number" min="0" max="${max/10}" step="0.1" value="${(a/10).toFixed(1)}" onchange="setAllocationMillions('${i.id}',this.value)"></div><div class="quick-row"><button class="quick" onclick="bump('${i.id}',50)">+$5</button><button class="quick" onclick="bump('${i.id}',100)">+$10</button><button class="quick" onclick="addAvailable('${i.id}')">Add available</button></div></div></article>`}
function researchControl(i){const r=i.researchPackage,yes=bought(i.id);return yes?`<div><div class="research-package-btn bought"><span>Research package purchased</span><strong>−$${r.costMillions}</strong></div><div class="research-package"><div class="package-findings"><div class="package-finding"><h5>What testing shows</h5><p>${esc(r.technicalFinding)}</p></div><div class="package-finding"><h5>What production requires</h5><p>${esc(r.productionFinding)}</p></div><div class="package-finding"><h5>What prospective users signal</h5><p>${esc(r.adoptionFinding)}</p></div></div><div class="package-risks"><h5>What remains unresolved</h5><ul>${r.unresolvedRisks.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div></div>`:`<button class="research-package-btn" onclick="buyResearch('${i.id}')"><span>Buy research package</span><strong>$${r.costMillions}</strong></button>`}
function buyResearch(id){if(bought(id))return;const c=reportCostUnits(id);if(held()<c)return showToast('Hold or unallocate enough cash to buy that research package.');state.current.purchasedReports.push(id);save();render()}
function setAllocation(id,v){const old=state.current.allocations[id]||0,other=allocated()-old,max=investable()-other;state.current.allocations[id]=Math.max(0,Math.min(Math.round(Number(v)||0),max));save();render()}
function setAllocationMillions(id,v){setAllocation(id,Math.round((Number(v)||0)*10))}
function bump(id,u){setAllocation(id,(state.current.allocations[id]||0)+u)}
function addAvailable(id){setAllocation(id,(state.current.allocations[id]||0)+held())}
function clearBets(){Object.keys(state.current.allocations).forEach(k=>state.current.allocations[k]=0);save();render()}
function splitAvailable(){const ids=state.current.ideaOrder,b=Math.floor(investable()/3),rem=investable()-b*3;ids.forEach((id,n)=>state.current.allocations[id]=b+(n<rem?1:0));save();render()}
function portfolio(){return `<div class="portfolio"><div class="portfolio-main"><div class="financial-table"><div>Round start<strong>${money(state.current.roundStartUnits)}</strong></div><div>Research spent<strong>${money(reportSpend())}</strong></div><div>Invested<strong>${money(allocated())}</strong></div><div>Held as cash<strong>${money(held())}</strong></div></div><div class="portfolio-actions"><button class="btn small" onclick="clearBets()">Clear bets</button><button class="btn small" onclick="splitAvailable()">Split available</button><button class="btn primary" onclick="submitPortfolio()">Submit portfolio</button></div></div><div class="bar">${state.current.ideaOrder.map(id=>`<span style="width:${state.current.roundStartUnits?((state.current.allocations[id]||0)/state.current.roundStartUnits*100):0}%"></span>`).join('')}</div></div>`}
function submitPortfolio(){const r=currentRound();state.current.result=computeResult(r);state.screen='reveal';save();render();scrollTo(0,0)}
function computeCalibration(r){const total=state.current.roundStartUnits,target=r.calibrationTarget;const actual={};for(const id of state.current.ideaOrder)actual[id]=(state.current.allocations[id]||0)/total*100;actual.hold=held()/total*100;actual.research=reportSpend()/total*100;let dist=Math.abs(actual.hold-target.holdWeight)+Math.abs(actual.research-(target.researchWeight||0));for(const [id,w] of Object.entries(target.ideaWeights))dist+=Math.abs((actual[id]||0)-w);return Math.max(0,Math.round(100-dist/2))}
function computeResult(r){const items=state.current.ideaOrder.map(id=>{const i=ideaById(r,id),inv=state.current.allocations[id]||0,ret=Math.round(inv*i.reveal.returnMultiplier);return{ideaId:id,invested:inv,totalReturn:ret}});return{items,heldCash:held(),reportSpend:reportSpend(),totalReturn:held()+items.reduce((s,x)=>s+x.totalReturn,0),calibration:computeCalibration(r)}}
function impactMeaning(t){return t==='transformative'?'Changed a major field or enabled a broad downstream system.':t==='medium'?'Created durable value in a narrower domain, period, or set of uses.':'Had a constrained direct footprint, was displaced, or remained experimental.'}
function downstream(i){return i.innovationTree.nodes.filter(n=>n.kind!=='root'&&n.kind!=='blocked').map(n=>n.label)}
function blocked(i){return i.innovationTree.nodes.filter(n=>n.kind==='blocked').map(n=>n.label)}
function revealView(){const r=currentRound(),x=state.current.result,change=x.totalReturn-state.current.roundStartUnits;return `<section><div class="round-head"><div class="eyebrow">Round ${state.roundIndex+1} result</div><h2>${esc(r.title)}</h2><p>${esc(r.debrief.roundStructureExplanation)}</p></div><div class="result-summary"><div><div>Ending fund</div><strong>${money(x.totalReturn)}</strong></div><div>Research<strong>${money(x.reportSpend)}</strong></div><div>Held<strong>${money(x.heldCash)}</strong></div><div>Net change<strong class="${change>=0?'positive':'negative'}">${change>=0?'+':''}${money(change)}</strong></div><div>Calibration<strong>${x.calibration}/100</strong></div></div><div class="reveal-grid">${state.current.ideaOrder.map((id,n)=>revealCard(r,ideaById(r,id),n,x.items.find(y=>y.ideaId===id))).join('')}</div>${roundAnalysis(r,x)}<div class="section-title"><div class="eyebrow">Innovation trees</div><h2>What each path produced</h2></div><div class="trees-grid">${state.current.ideaOrder.map((id,n)=>treeCard(ideaById(r,id),n)).join('')}</div><details class="sources"><summary>Historical sources</summary><ol>${r.sources.map(u=>`<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></li>`).join('')}</ol></details><div style="display:flex;justify-content:flex-end;margin-top:20px"><button class="btn primary" onclick="finishRound()">${state.roundIndex===2?'See final result':'Continue'}</button></div></section>`}
function revealCard(r,i,n,item){const v=i.reveal,led=downstream(i),blk=blocked(i),isImpactWinner=i.id===r.debrief.winnerIdeaId;return `<article class="reveal-card"><span class="tier">${esc(v.impactTier)} impact${isImpactWinner?' · field leader':''}</span><h3 class="historical-name">${esc(v.historicalName)}</h3><table class="return-table"><tr><td>Invested</td><td>${money(item.invested)}</td></tr><tr><td>Return multiplier</td><td>${v.returnMultiplier.toFixed(2)}×</td></tr><tr><td>Returned</td><td>${money(item.totalReturn)}</td></tr></table><div class="explain"><h4>What happened</h4><p>${esc(v.historicalOutcome)}</p></div><div class="explain"><h4>Why this impact tier</h4><p>${esc(v.rankingRationale)} ${esc(impactMeaning(v.impactTier))}</p></div><div class="explain"><h4>Why this investment return</h4><p>${esc(v.returnRationale)}</p></div>${!isImpactWinner?`<div class="looked-right"><strong>Why it looked right then:</strong> ${esc(v.whyItLookedRight)}</div>`:''}${led.length?`<div class="explain"><h4>Downstream uses</h4><ul>${led.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}${blk.length?`<div class="explain"><h4>Branches that did not materialize</h4><ul>${blk.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}</article>`}
function roundAnalysis(r,x){const best=ideaById(r,r.debrief.bestReturnIdeaId),maxIdea=Math.max(...r.ideas.map(i=>i.reveal.returnMultiplier)),cashWon=maxIdea<1;return `<div class="round-analysis"><div class="analysis-box"><div class="eyebrow">Why the round resolved this way</div><h3>${cashWon?'Preserved cash had the highest direct multiplier':esc(best.reveal.historicalName)+' had the highest direct multiplier'}</h3><p>${esc(r.debrief.roundStructureExplanation)} ${esc(r.debrief.investorLesson)} ${esc(r.debrief.winnerReason)}</p>${r.rankingCaveat?`<p><strong>Ranking caveat:</strong> ${esc(r.rankingCaveat)}</p>`:''}</div><div class="analysis-box"><div class="eyebrow">Calibration</div><h3>${x.calibration>=80?'Well sized':x.calibration>=55?'Partly calibrated':'Exposure did not match the uncertainty'}</h3><div class="calibration-meter"><span style="width:${x.calibration}%"></span></div><p>The authored benchmark included ${r.calibrationTarget.holdWeight}% cash and ${r.calibrationTarget.researchWeight||0}% research. Calibration rewards the relationship between evidence, report spending, cash held, and bet size.</p></div></div>`}
function treeCard(i,n){const nodes=i.innovationTree.nodes,edges=i.innovationTree.edges,incoming=Object.fromEntries(nodes.map(x=>[x.id,0]));edges.forEach(e=>incoming[e.to]=(incoming[e.to]||0)+1);let frontier=nodes.filter(x=>!incoming[x.id]||x.kind==='root').map(x=>x.id),seen=new Set(),levels=[];while(frontier.length){const ids=[...new Set(frontier)].filter(id=>!seen.has(id));if(!ids.length)break;levels.push(ids.map(id=>nodes.find(x=>x.id===id)).filter(Boolean));ids.forEach(id=>seen.add(id));frontier=edges.filter(e=>ids.includes(e.from)).map(e=>e.to)}const rest=nodes.filter(x=>!seen.has(x.id));if(rest.length)levels.push(rest);return `<article class="tree-card"><div class="tree-head"><div class="idea-letter">Idea ${LETTERS[n]}</div><strong>${esc(i.reveal.historicalName)}</strong></div>${levels.map((l,k)=>`${k?'<div class="tree-arrow">↓</div>':''}<div class="tree-level">${l.map(x=>`<span class="tree-node ${x.kind==='root'?'root':''} ${x.kind==='blocked'?'blocked':''}">${esc(x.label)}</span>`).join('')}</div>`).join('')}</article>`}
function finishRound(){const r=currentRound(),x=state.current.result;state.history.push({roundId:r.id,title:r.title,start:state.current.roundStartUnits,research:x.reportSpend,invested:allocated(),held:x.heldCash,returnUnits:x.totalReturn,calibration:x.calibration});state.bankrollUnits=x.totalReturn;if(state.roundIndex===2){state.screen='final';state.current=null}else{state.roundIndex++;state.current=null;state.screen='invest';ensureCurrent()}save();render();scrollTo(0,0)}
function finalView(){const avg=Math.round(state.history.reduce((s,h)=>s+h.calibration,0)/state.history.length),target=state.targetUnits||2250,passed=state.bankrollUnits>=target;return `<section class="final"><div class="eyebrow">Final portfolio</div><h1>${passed?'Target reached':'Target missed'}</h1><div class="final-money">${money(state.bankrollUnits)}</div><p class="muted">Target for this game: ${money(target)} · Average calibration: ${avg}/100. The target reflects the three rounds’ authored opportunity set; the bankroll rewards realized return while calibration separately rewards sizing under uncertainty.</p><div class="history">${state.history.map((h,n)=>`<div class="history-row"><div><strong>Round ${n+1}: ${esc(h.title)}</strong></div><div>Start<br><strong>${money(h.start)}</strong></div><div>Research<br><strong>${money(h.research)}</strong></div><div>Held<br><strong>${money(h.held)}</strong></div><div>Return<br><strong>${money(h.returnUnits)}</strong></div></div>`).join('')}</div><div style="display:flex;gap:8px;margin-top:22px"><button class="btn primary" onclick="restart()">Replay game</button><button class="btn" onclick="goHome()">Choose another</button></div></section>`}
function goHome(){state={screen:'home'};render();scrollTo(0,0)}
function restart(){if(state.gameId)startGame(state.gameId)}
render();
</script>
</body></html>

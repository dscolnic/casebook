elity and convenience"],"reveal":{"historicalName":"Magnetic wire recorder","impactTier":"limited","returnMultiplier":0.51,"legacyBonusMultiplier":0.25,"historicalOutcome":"Found military, dictation, and early consumer uses but quickly lost to magnetic tape after World War II.","rankingRationale":"It worked, but tape was easier to edit, duplicate, store, and extend into higher-fidelity and data applications.","whyItLookedRight":"At the time, the principle is sound: varying magnetization along the wire stores the audio waveform. That made the claims “Compact reels” and “Rugged recording medium” a specific investment argument for “Magnetized Steel Wire.”","returnRationale":"The investment lost capital because a constraint outside the initial demonstration—scale, safety, adoption, economics, or competing systems—restricted durable use."},"innovationTree":{"nodes":[{"id":"the-race-to-record-sound-idea-3-node-1","label":"Wire recorder","kind":"root"},{"id":"the-race-to-record-sound-idea-3-node-2","label":"wartime field recording","kind":"application"},{"id":"the-race-to-record-sound-idea-3-node-3","label":"office dictation","kind":"application"},{"id":"the-race-to-record-sound-idea-3-node-4","label":"long-term mass recording","kind":"blocked"}],"edges":[{"from":"the-race-to-record-sound-idea-3-node-1","to":"the-race-to-record-sound-idea-3-node-2"},{"from":"the-race-to-record-sound-idea-3-node-1","to":"the-race-to-record-sound-idea-3-node-3"},{"from":"the-race-to-record-sound-idea-3-node-1","to":"the-race-to-record-sound-idea-3-node-4","status":"blocked"}]},"tags":["wire recording","displaced technology"],"id":"the-race-to-record-sound-idea-3","displayOrder":3,"researchPackage":{"costMillions":6,"technicalFinding":"The principle is sound: varying magnetization along the wire stores the audio waveform.","productionFinding":"Steel wire and recording heads are practical, and wartime demand helps production.","adoptionFinding":"Military messages, dictation, and some home user apidly. A broad market therefore depended on budgets, compatibility with existing systems, repeat purchases, and confidence around “Carbon dioxide management”."}},{"concealedTitle":"Quantitative Anesthetic Dosing","pitch":"Concentration, temperature, breathing, and patient response are measured to induce and maintain unconsciousness more predictably. Contemporary supporters of “Quantitative Anesthetic Dosing” cited “Improves safety”, “Creates specialist knowledge”, and “General across agents”, but the investment still turned on patient variation and monitoring tools.","knownAdvantages":["Improves safety","Creates specialist knowledge","General across agents"],"knownRisks":["Patient variation","Monitoring tools","Requires training"],"reveal":{"historicalName":"Scientific anesthesiology","impactTier":"medium","returnMultiplier":0.81,"legacyBonusMultiplier":0.0,"historicalOutcome":"Helped establish controlled anesthesia practice and specialist expertise.","rankingRationale":"It had broad medical importance but a narrower societal tree than epidemiological sanitation.","whyItLookedRight":"“Quantitative Anesthetic Dosing” addressed a live public health and anesthesiology problem: dose and vapor concentration can be related systematically to physiological effect. Its period case included “Improves safety” and “Creates specialist knowledge”.","returnRationale":"The historical contribution was real, but the benefit was diffuse, public, open, or difficult for the original backer to capture as a direct financial return."},"innovationTree":{"nodes":[{"id":"john-snow-s-three-investigations-idea-2-node-1","label":"Quantitative anesthesia","kind":"root"},{"id":"john-snow-s-three-investigations-idea-2-node-2","label":"safer surgery","kind":"application"},{"id":"john-snow-s-three-investigations-idea-2-node-3","label":"anesthesiology specialty","kind":"application"},{"id":"john-snow-s-three-investigations-idea-2-node-4","label":"calibrated vaporizers","kind":"application"}],"edges": function load(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY));if(x&&x.version===10&&x.roundIds?.length===3)return x}catch(e){}return null}
function clearSave(){try{localStorage.removeItem(STORAGE_KEY)}catch(e){}}
function benchmarkFactor(r){const t=r.calibrationTarget;let f=t.holdWeight/100;for(const i of r.ideas)f+=(t.ideaWeights[i.id]||0)/100*i.reveal.returnMultiplier;return f}
function gameTargetUnits(g){let b=1000;for(const id of g.roundIds)b*=benchmarkFactor(roundById(id));const raw=Math.round((b*.60)/50)*50;return Math.max(800,Math.min(4000,raw))}
function makeState(g){return{version:10,screen:'invest',gameId:g.id,roundIds:[...g.roundIds],roundIndex:0,bankrollUnits:1000,targetUnits:gameTargetUnits(g),current:null,history:[]}}
function startGame(id){const g=gameById(id);if(!g)return;state=makeState(g);ensureCurrent();save();render();scrollTo(0,0)}
function resume(){const x=load();if(x){state=x;ensureCurrent();render()}}
function currentRound(){return roundById(state.roundIds[state.roundIndex])}
function ensureCurrent(){if(state.current)return;const r=currentRound(),ids=shuffle(r.ideas.map(i=>i.id));state.current={roundId:r.id,roundStartUnits:state.bankrollUnits,ideaOrder:ids,purchasedReports:[],allocations:Object.fromEntries(ids.map(id=>[id,0])),result:null};save()}
function bought(id){return state.current.purchasedReports.includes(id)}
function reportCostUnits(id){const i=ideaById(currentRound(),id);return Math.round(i.researchPackage.costMillions*10)}
function reportSpend(){return state.current.purchasedReports.reduce((s,id)=>s+reportCostUnits(id),0)}
function investable(){return Math.max(0,state.current.roundStartUnits-reportSpend())}
function allocated(){return Object.values(state.current.allocations).reduce((a,b)=>a+b,0)}
function held(){return investable()-allocated()}
function topbar(){const ingame=state.screen!=='home';const shown=state.screen==='reveal'?state.current.result.totalReturn:state.bankrollUnits;return `<header class="topbar"><div class="brand"><div class="brand-title">Future Portfolio</div><div class="brand-sub">${ingame?esc(gameById(state.gameId)?.title||'Historical innovation'):'RECKON · History of technology'}</div></div><div class="status">${ingame?`<span class="status-item">Round <strong>${state.roundIndex+1}/3</strong></span><span class="status-item">Fund <strong>${money(shown)}</strong></span><span class="status-item">Target <strong>${money(state.targetUnits)}</strong></span><button class="text-btn" onclick="goHome()">Games</button><button class="text-btn" onclick="restart()">Restart</button>`:''}</div></header>`}
function render(){ensureCurrentIfNeeded();let body=state.screen==='home'?home():state.screen==='invest'?investView():state.screen==='reveal'?revealView():finalView();$('#app').innerHTML=topbar()+`<main>${body}</main>`}
function ensureCurrentIfNeeded(){if(state.screen==='invest'&&!state.current)ensureCurrent()}
function home(){const saved=load();return `<section><div class="library-head"><div><div class="eyebrow">Game library</div><h1>Future Portfolio</h1><p>Judge three concealed historical ideas, choose which individual research packages are worth their price, and size the fund’s bets. Each idea has one integrated dossier; historical impact and capturable investor return are scored separately.</p></div></div>${saved?`<div class="resume"><div><strong>Game in progress</strong><div class="muted">${esc(gameById(saved.gameId)?.title||'Saved game')} · round ${saved.roundIndex+1} of 3</div></div><button class="btn" onclick="resume()">Resume</button></div>`:''}<div class="games-grid">${GAME_SETS.map((g,i)=>`<button class="game-card" onclick="startGame('${g.id}')"><div><div class="game-number">Game ${String(i+1).padStart(2,'0')}</div><div class="game-title">${esc(g.title)}</div></div><div class="game-words">${g.words.map((w,n)=>`<span class="game-word">${esc(w)} <span class="game-word-year">${roundById(g.roundIds[n])?.pitchYear||''}</span></span>`).join('')}</div><div class="game-foot"><span>Three rounds</span><strong>Play →</strong></div></button>`).join('')}</div></section>`}
function structureName(x){return({standard:'Standard',twoWinners:'Two positive returns',allDuds:'Cash may win',sleeper:'High-upside long shot'}[x]||x)}
function termHelp(tags=[]){return tags.length?tags.map(t=>esc(t)).join(' · '):'The concealed title describes the mechanism rather than the historical name.'}
function investView(){const r=currentRound();return `<section><div class="round-head"><div class="eyebrow">Round ${state.roundIndex+1} · Pitch year ${esc(r.pitchYear)}</div><h2>${esc(r.title)}</h2><p>${esc(r.briefing)}</p><div class="meta"><span class="tag">${esc(r.discipline)}</span><span class="tag">${esc(r.difficulty)}</span><span class="tag">Historical span: ${esc(r.era)}</span></div><div class="structure-note"><strong>Connection:</strong> ${esc(r.connection)} You may hold cash. Each idea has one optional paid research package; buy only the dossiers you think can change your decision.</div></div><div class="ideas-grid">${state.current.ideaOrder.map((id,n)=>ideaCard(r,ideaById(r,id),n)).join('')}</div>${portfolio()}</section>`}
function ideaCard(r,i,n){const a=state.current.allocations[i.id]||0;const max=investable()-(allocated()-a);return `<article class="idea-card"><div class="idea-head"><div class="idea-letter">Idea ${LETTERS[n]}</div><h3>${esc(i.concealedTitle)}</h3></div><div class="idea-body"><div class="pitch">${esc(i.pitch)}</div><div class="two-col"><div class="fact-box"><div class="fact-title">Known capabilities</div><ul class="clean">${i.knownAdvantages.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="fact-box"><div class="fact-title">Open questions</div><ul class="clean">${i.knownRisks.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div><div class="research"><div class="research-head"><strong>Research package</strong><span>Optional · one package for this idea</span></div><div class="report-list">${researchControl(i)}</div></div><details class="glossary"><summary>Terms</summary><p>${termHelp(i.tags)}</p></details></div><div class="allocation"><div class="allocation-top"><span>Investment</span><strong>${money(a)}</strong></div><input class="range" type="range" min="0" max="${max}" step="1" value="${a}" oninput="setAllocation('${i.id}',this.value)"><div class="money-row"><input aria-label="Investment in ${esc(i.concealedTitle)}" type="number" min="0" max="${max/10}" step="0.1" value="${(a/10).toFixed(1)}" onchange="setAllocationMillions('${i.id}',this.value)"></div><div class="quick-row"><button class="quick" onclick="bump('${i.id}',50)">+$5</button><button class="quick" onclick="bump('${i.id}',100)">+$10</button><button class="quick" onclick="addAvailable('${i.id}')">Add available</button></div></div></article>`}
function researchControl(i){const r=i.researchPackage,yes=bought(i.id);return yes?`<div><div class="research-package-btn bought"><span>Research package purchased</span><strong>−$${r.costMillions}</strong></div><div class="research-package"><div class="package-findings"><div class="package-finding"><h5>Technical evidence</h5><p>${esc(r.technicalFinding)}</p></div><div class="package-finding"><h5>Production and scale</h5><p>${esc(r.productionFinding)}</p></div><div class="package-finding market"><h5>Market setting and adoption</h5><p>${esc(r.marketContext||r.adoptionFinding)}</p></div></div><div class="package-risks"><h5>Still unresolved</h5><ul>${r.unresolvedRisks.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div></div>`:`<button class="research-package-btn" onclick="buyResearch('${i.id}')"><span>Buy research package</span><strong>$${r.costMillions}</strong></button>`}
function buyResearch(id){if(bought(id))return;const c=reportCostUnits(id);if(held()<c)return showToast('Hold or unallocate enough cash to buy that research package.');state.current.purchasedReports.push(id);save();render()}
function setAllocation(id,v){const old=state.current.allocations[id]||0,other=allocated()-old,max=investable()-other;state.current.allocations[id]=Math.max(0,Math.min(Math.round(Number(v)||0),max));save();render()}
function setAllocationMillions(id,v){setAllocation(id,Math.round((Number(v)||0)*10))}
function bump(id,u){setAllocation(id,(state.current.allocations[id]||0)+u)}
function addAvailable(id){setAllocation(id,(state.current.allocations[id]||0)+held())}
function clearBets(){Object.keys(state.current.allocations).forEach(k=>state.current.allocations[k]=0);save();render()}
function splitAvailable(){const ids=state.current.ideaOrder,b=Math.floor(investable()/3),rem=investable()-b*3;ids.forEach((id,n)=>state.current.allocations[id]=b+(n<rem?1:0));save();render()}
function portfolio(){return `<div class="portfolio"><div class="portfolio-main"><div class="financial-table"><div>Round start<strong>${money(state.current.roundStartUnits)}</strong></div><div>Research spent<strong>${money(reportSpend())}</strong></div><div>Invested<strong>${money(allocated())}</strong></div><div>Held as cash<strong>${money(held())}</strong></div></div><div class="portfolio-actions"><button class="btn small" onclick="clearBets()">Clear bets</button><button class="btn small" onclick="splitAvailable()">Split available</button><button class="btn primary" onclick="submitPortfolio()">Submit portfolio</button></div></div><div class="bar">${state.current.ideaOrder.map(id=>`<span style="width:${state.current.roundStartUnits?((state.current.allocations[id]||0)/state.current.roundStartUnits*100):0}%"></span>`).join('')}</div></div>`}
function submitPortfolio(){const r=currentRound();state.current.result=computeResult(r);state.screen='reveal';save();render();scrollTo(0,0)}
function computeCalibration(r){const available=state.current.roundStartUnits-reportSpend();if(available<=0)return 0;const target=r.calibrationTarget,actual={};for(const id of state.current.ideaOrder)actual[id]=(state.current.allocations[id]||0)/available*100;actual.hold=held()/available*100;let dist=Math.abs(actual.hold-target.holdWeight);for(const [id,w] of Object.entries(target.ideaWeights))dist+=Math.abs((actual[id]||0)-w);return Math.max(0,Math.round(100-dist/2))}
function computeResult(r){const items=state.current.ideaOrder.map(id=>{const i=ideaById(r,id),inv=state.current.allocations[id]||0,ret=Math.round(inv*i.reveal.returnMultiplier);return{ideaId:id,invested:inv,totalReturn:ret}});return{items,heldCash:held(),reportSpend:reportSpend(),totalReturn:held()+items.reduce((s,x)=>s+x.totalReturn,0),calibration:computeCalibration(r)}}
function impactMeaning(t){return t==='transformative'?'Changed a major field or enabled a broad downstream system.':t==='medium'?'Created durable value in a narrower domain, period, or set of uses.':'Had a constrained direct footprint, was displaced, or remained experimental.'}
function downstream(i){return i.innovationTree.nodes.filter(n=>n.kind!=='root'&&n.kind!=='blocked').map(n=>n.label)}
function blocked(i){return i.innovationTree.nodes.filter(n=>n.kind==='blocked').map(n=>n.label)}
function revealView(){const r=currentRound(),x=state.current.result,change=x.totalReturn-state.current.roundStartUnits;return `<section><div class="round-head"><div class="eyebrow">Round ${state.roundIndex+1} result · ${esc(r.pitchYear)}</div><h2>${esc(r.title)}</h2><p>${esc(r.debrief.roundStructureExplanation)}</p></div><div class="result-summary"><div><div>Ending fund</div><strong>${money(x.totalReturn)}</strong></div><div>Research<strong>${money(x.reportSpend)}</strong></div><div>Held<strong>${money(x.heldCash)}</strong></div><div>Net change<strong class="${change>=0?'positive':'negative'}">${change>=0?'+':''}${money(change)}</strong></div><div>Allocation alignment<strong>${x.calibration}/100</strong></div></div><div class="reveal-grid">${state.current.ideaOrder.map((id,n)=>revealCard(r,ideaById(r,id),n,x.items.find(y=>y.ideaId===id))).join('')}</div>${roundAnalysis(r,x)}<div class="section-title"><div class="eyebrow">Innovation trees</div><h2>What each path produced</h2></div><div class="trees-grid">${state.current.ideaOrder.map((id,n)=>treeCard(ideaById(r,id),n)).join('')}</div><details class="sources"><summary>Historical sources</summary><ol>${r.sources.map(u=>`<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></li>`).join('')}</ol></details><div style="display:flex;justify-content:flex-end;margin-top:20px"><button class="btn primary" onclick="finishRound()">${state.roundIndex===2?'See final result':'Continue'}</button></div></section>`}
function revealCard(r,i,n,item){const v=i.reveal,led=downstream(i),blk=blocked(i),isImpactWinner=i.id===r.debrief.winnerIdeaId;return `<article class="reveal-card"><span class="tier">${isImpactWinner?'Field leader · ':''}historical impact</span><h3 class="historical-name">${esc(v.historicalName)}</h3><div class="impact-return-line"><strong>Historical impact:</strong> ${esc(v.impactTier)}. <strong>Investor return:</strong> ${v.returnMultiplier.toFixed(2)}×.</div>${v.impactVsReturnNote?`<div class="impact-return-note">${esc(v.impactVsReturnNote)}</div>`:''}<table class="return-table"><tr><td>Invested</td><td>${money(item.invested)}</td></tr><tr><td>Returned</td><td>${money(item.totalReturn)}</td></tr></table><div class="explain"><h4>What happened</h4><p>${esc(v.historicalOutcome)}</p></div><div class="explain"><h4>Why this historical impact</h4><p>${esc(v.rankingRationale)} ${esc(impactMeaning(v.impactTier))}</p></div><div class="explain"><h4>Why this investor return</h4><p>${esc(v.returnRationale)}</p></div>${!isImpactWinner?`<div class="looked-right"><strong>Why it looked right then:</strong> ${esc(v.whyItLookedRight)}</div>`:''}${led.length?`<div class="explain"><h4>Downstream uses</h4><ul>${led.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}${blk.length?`<div class="explain"><h4>Branches that did not materialize</h4><ul>${blk.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}</article>`}
function roundAnalysis(r,x){const best=ideaById(r,r.debrief.bestReturnIdeaId),maxIdea=Math.max(...r.ideas.map(i=>i.reveal.returnMultiplier)),cashWon=maxIdea<1;return `<div class="round-analysis"><div class="analysis-box"><div class="eyebrow">Why the round resolved this way</div><h3>${cashWon?'Holding cash was the winning decision':esc(best.reveal.historicalName)+' had the highest capturable return'}</h3><p>${esc(r.debrief.roundStructureExplanation)} ${esc(r.debrief.investorLesson)} ${esc(r.debrief.winnerReason)}</p>${r.rankingCaveat?`<p><strong>Ranking caveat:</strong> ${esc(r.rankingCaveat)}</p>`:''}</div><div class="analysis-box"><div class="eyebrow">Allocation alignment</div><h3>${x.calibration>=80?'Sizing matched the outcome':x.calibration>=55?'Partly aligned':'Sizing missed the return profile'}</h3><div class="calibration-meter"><span style="width:${x.calibration}%"></span></div><p><strong>Return</strong> shows what the fund earned. <strong>Allocation alignment</strong> shows how closely the post-research bankroll was sized to the returns that actually occurred; research cost is reported separately and does not lower this score.</p><p>${esc(r.calibrationRationale)}</p></div></div>`}
function treeCard(i,n){const nodes=i.innovationTree.nodes,edges=i.innovationTree.edges,incoming=Object.fromEntries(nodes.map(x=>[x.id,0]));edges.forEach(e=>incoming[e.to]=(incoming[e.to]||0)+1);let frontier=nodes.filter(x=>!incoming[x.id]||x.kind==='root').map(x=>x.id),seen=new Set(),levels=[];while(frontier.length){const ids=[...new Set(frontier)].filter(id=>!seen.has(id));if(!ids.length)break;levels.push(ids.map(id=>nodes.find(x=>x.id===id)).filter(Boolean));ids.forEach(id=>seen.add(id));frontier=edges.filter(e=>ids.includes(e.from)).map(e=>e.to)}const rest=nodes.filter(x=>!seen.has(x.id));if(rest.length)levels.push(rest);return `<article class="tree-card"><div class="tree-head"><div class="idea-letter">Idea ${LETTERS[n]}</div><strong>${esc(i.reveal.historicalName)}</strong></div>${levels.map((l,k)=>`${k?'<div class="tree-arrow">↓</div>':''}<div class="tree-level">${l.map(x=>`<span class="tree-node ${x.kind==='root'?'root':''} ${x.kind==='blocked'?'blocked':''}">${esc(x.label)}</span>`).join('')}</div>`).join('')}</article>`}
function finishRound(){const r=currentRound(),x=state.current.result;state.history.push({roundId:r.id,title:r.title,pitchYear:r.pitchYear,start:state.current.roundStartUnits,research:x.reportSpend,invested:allocated(),held:x.heldCash,returnUnits:x.totalReturn,calibration:x.calibration});state.bankrollUnits=x.totalReturn;if(state.roundIndex===2){state.screen='final';state.current=null}else{state.roundIndex++;state.current=null;state.screen='invest';ensureCurrent()}save();render();scrollTo(0,0)}
function finalView(){const avg=Math.round(state.history.reduce((s,h)=>s+h.calibration,0)/state.history.length),target=state.targetUnits||2250,passed=state.bankrollUnits>=target;return `<section class="final"><div class="eyebrow">Final portfolio</div><h1>${passed?'Target reached':'Target missed'}</h1><div class="final-money">${money(state.bankrollUnits)}</div><p class="muted">Target for this game: ${money(target)} · Average allocation alignment: ${avg}/100. The target reflects the three rounds’ authored opportunity set; the bankroll shows realized return, while alignment shows how closely post-research capital matched the return profile that occurred.</p><div class="history">${state.history.map((h,n)=>`<div class="history-row"><div><strong>Round ${n+1}: ${esc(h.title)}${h.pitchYear?` · ${esc(h.pitchYear)}`:''}</strong></div><div>Start<br><strong>${money(h.start)}</strong></div><div>Research<br><strong>${money(h.research)}</strong></div><div>Held<br><strong>${money(h.held)}</strong></div><div>Return<br><strong>${money(h.returnUnits)}</strong></div></div>`).join('')}</div><div style="display:flex;gap:8px;margin-top:22px"><button class="btn primary" onclick="restart()">Replay game</button><button class="btn" onclick="goHome()">Choose another</button></div></section>`}
function goHome(){state={screen:'home'};render();scrollTo(0,0)}
function restart(){if(state.gameId)startGame(state.gameId)}
render();
</script>
</body></html>

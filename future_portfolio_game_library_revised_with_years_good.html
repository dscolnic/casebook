<style>
:root{

*{box-sizing:border-box}

.brand{display:flex;align-items:baseline;gap:10px}.brand-title{font-family:var(--serif);font-size:21px;font-weight:700}.brand-sub{font-size:12px;color:var(--muted)}
.status{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.status-item{font-size:13px;color:var(--muted)}.status-item strong{color:var(--ink);font-variant-numeric:tabular-nums}
main{width:min(1180px,calc(100% - 30px));margin:0 auto;padding:34px 0 72px}

.eyebrow{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin-bottom:7px}
.muted{color:var(--muted)}
.btn,.text-btn,.report-btn,.quick{border:1px solid var(--hair);background:var(--panel);padding:9px 12px;border-radius:4px;font-weight:650}.btn:hover,.text-btn:hover,.report-btn:hover,.quick:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}.btn.primary:disabled{opacity:.45;cursor:not-allowed}.btn.small{padding:6px 9px;font-size:12px}.text-btn{background:transparent;font-size:12px;color:var(--muted)}
.library-head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin:22px 0 26px}.library-head p{max-width:720px;margin:10px 0 0;color:var(--muted)}
.games-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--hair);border-left:1px solid var(--hair)}
.game-card{appearance:none;text-align:left;background:var(--panel);border:0;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:18px;min-height:154px;display:flex;flex-direction:column;justify-content:space-between;gap:18px}.game-card:hover{background:var(--hover)}
.game-number{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}.game-title{font-family:var(--serif);font-size:23px;margin-top:6px}.game-words{display:flex;gap:6px;flex-wrap:wrap}.game-word,.tag{font-size:12px;background:var(--chip);padding:5px 7px;border-radius:3px}.game-word{display:inline-flex;align-items:baseline;gap:5px}.game-word-year{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}.game-foot{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.game-foot strong{color:var(--accent)}
.resume{border:1px solid var(--hair);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.round-head{border-bottom:1px solid var(--hair);padding-bottom:20px;margin-bottom:20px}.round-head p{max-width:880px;color:var(--muted);margin:10px 0 0}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.structure-note{border-left:3px solid var(--accent);padding:9px 12px;margin-top:15px;color:var(--muted);background:var(--chip);font-size:13px}
.ideas-grid,.reveal-grid,.trees-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.idea-card,.reveal-card,.tree-card{border:1px solid var(--hair);background:var(--panel);min-width:0}.idea-head{padding:15px;border-bottom:1px solid var(--hair)}.idea-letter{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.11em;font-weight:700}.idea-body{padding:15px}.pitch{min-height:124px;color:var(--ink)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.fact-box{border-top:1px solid var(--hair);padding-top:9px}.fact-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}.clean{padding-left:17px;margin:7px 0 0;color:var(--muted);font-size:13px}.clean li+li{margin-top:5px}
.research{border-top:1px solid var(--hair);margin-top:15px;padding-top:13px}.research-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.research-head strong{font-size:13px}.research-head span{font-size:11px;color:var(--muted)}.report-list{display:grid;gap:9px;margin-top:9px}.report-btn{text-align:left;display:flex;justify-content:space-between;gap:8px;font-size:12px;width:100%}.report-btn.bought{border-color:var(--accent);background:var(--chip)}.report-dossier{border:1px solid var(--hair);border-top:0;padding:11px;background:var(--panel)}.report-verdict{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.report-signal{color:var(--accent);font-weight:750}.report-summary{font-size:12px;color:var(--ink);margin:0 0 9px}.report-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid var(--hair);padding-top:9px}.report-detail h5{font-family:var(--sans);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 5px}.report-detail p,.report-detail ul{font-size:11px;color:var(--muted);margin:0}.report-detail ul{padding-left:16px}.report-detail li+li{margin-top:4px}.report-use{font-size:11px;color:var(--muted);background:var(--chip);padding:8px;margin-top:9px}.report-use strong{color:var(--ink)}
.glossary{margin-top:10px}.glossary summary{font-size:12px;color:var(--accent);cursor:pointer}.glossary p{font-size:12px;color:var(--muted);margin:7px 0 0}
.allocation{border-top:1px solid var(--hair);padding:14px 15px}.allocation-top{display:flex;justify-content:space-between;font-size:13px}.allocation-top strong{font-variant-numeric:tabular-nums}.range{width:100%;accent-color:var(--accent);margin:10px 0}.money-row{display:flex;gap:6px}.money-row input{width:100%;border:1px solid var(--hair);background:var(--bg);padding:8px;border-radius:3px;font-variant-numeric:tabular-nums}.quick-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.quick{padding:5px 7px;font-size:11px}
.portfolio{position:static;background:var(--bg);border:1px solid var(--hair);margin-top:16px;padding:14px;z-index:10}.portfolio-main{display:flex;align-items:center;justify-content:space-between;gap:18px}.financial-table{display:grid;grid-template-columns:repeat(4,auto);gap:8px 22px}.financial-table div{font-size:11px;color:var(--muted)}.financial-table strong{display:block;color:var(--ink);font-size:18px;font-variant-numeric:tabular-nums;font-weight:650}.portfolio-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.bar{height:4px;background:var(--chip);display:flex;margin-top:11px}.bar span{background:var(--accent);border-right:1px solid var(--bg)}
.result-summary{display:grid;grid-template-columns:1.2fr repeat(4,auto);gap:12px 28px;align-items:end;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:15px 0;margin:18px 0}.result-summary div{font-size:11px;color:var(--muted)}.result-summary strong{display:block;color:var(--ink);font-size:22px;font-variant-numeric:tabular-nums}.positive{color:var(--accent)!important}.negative{color:var(--muted)!important}

:7,"technicalFinding":"A movable head can address data on rotating surfaces.","productionFinding":"Precision improves through standardized drives and higher areal density.","adoptionFinding":"Businesses need fast access to inventories, accounts, and records.","unresolvedRisks":["Precision mechanics","Large early hardware","High initial cost"],"marketContext":"Businesses need fast access to inventories, accounts, and records. In 1950s–1960s, the reachable market would begin with organizations already working in storage, platform, rather than with every possible user at once. The commercial case rested on whether buyers valued the documented capabilities—“Fast random access” and “Rewritable”—enough to justify new equipment, training, standards, or operating procedures. Precision improves through standardized drives and higher areal density. The demand question remained whether buyers would commit before the open questions “Large early hardware” and “Precision mechanics” were resolved."}},{"concealedTitle":"Automated Photographic Archive","pitch":"A robotic machine stores digital data as microscopic photographic patterns on film strips. “Automated Photographic Archive” entered consideration with “Exceptional capacity for era”, “Long archival life”, and “Automated retrieval”; its open questions concerned huge footprint, complex robotics, and slow update cycle.","knownAdvantages":["Exceptional capacity for era","Long archival life","Automated retrieval"],"knownRisks":["Huge footprint","Complex robotics","Slow update cycle"],"reveal":{"historicalName":"IBM 1360 Photo-Digital Storage System","impactTier":"limited","returnMultiplier":0.57,"legacyBonusMultiplier":0.0,"historicalOutcome":"Only a few systems were built for specialized archival use.","rankingRationale":"Capacity alone could not offset complexity, cost, and poor general-purpose fit.","whyItLookedRight":"During 1950s–1960s, the claims “Exceptional capacity for era” and “Long archival life” mattered because optica ore.","investorLesson":"Production yield can matter more than peak laboratory performance.","bestReturnIdeaId":"ibm-s-storage-laboratory-idea-2","roundStructureExplanation":"Two options created positive returns; the decision problem was how to split exposure under uncertainty."},"sources":["https://www.ibm.com/history/ramac","https://www.ibm.com/history/magnetic-stripe"],"roundStructure":"twoWinners","calibrationTarget":{"ideaWeights":{"ibm-s-storage-laboratory-idea-1":45.5,"ibm-s-storage-laboratory-idea-2":54.5,"ibm-s-storage-laboratory-idea-3":0.0},"holdWeight":0.0,"researchWeight":0},"calibrationRationale":"RAMAC-style disk storage, Magnetic stripe all beat cash; the benchmark divides post-research capital in proportion to their realized excess returns.","pitchYear":1964},{"id":"xerox-parc-s-office-of-the-future","sequence":5,"category":"Electricity, Electronics, and Hardware","title":"Xerox PARC’s Office of the Future","discipline":"personal computing","era":"1968–1980s","connection":"Same research center; interconnected visions of personal and office computing.","briefing":"Researchers propose a portable learning medium, a graphical personal workstation, and a computer-driven printer","difficulty":"advanced","judgmentCall":true,"rankingCaveat":"Laser printing may have generated more direct Xerox revenue than the Alto; the tier ranks broad societal platform impact.","contentWarnings":[],"ideas":[{"concealedTitle":"Portable Personal Learning Computer","pitch":"A thin, notebook-sized interactive computer becomes a medium for reading, simulation, creativity, and education. Investors examining “Portable Personal Learning Computer” could observe “Highly general vision”, but could not yet resolve immature components, the absence of a near-term manufacturing path, and unclear buyer.","knownAdvantages":["Highly general vision","Personal and portable","Strong educational potential"],"knownRisks":["Components not ready","No near-term manufacturing path","Unclear buyer"],"reveal":{"historicalName":"Dynabook concept","impactTier":"limited","returnMultiplier":0.66,"legacyBonusMultiplier":0.25,"historicalOutcome":"The full product was not built commercially as envisioned, though it anticipated laptops and tablets.","rankingRationale":"Its direct return was low because essential hardware was decades away.","whyItLookedRight":"“Portable Personal Learning Computer” offered a measurable proposition: the software and interaction concepts are coherent. Backers could build a thesis around “Highly general vision” and “Personal and portable”.","returnRationale":"The investment lost capital because a constraint outside the initial demonstration—scale, safety, adoption, economics, or competing systems—restricted durable use."},"innovationTree":{"nodes":[{"id":"xerox-parc-s-office-of-the-future-idea-1-node-1","label":"Dynabook","kind":"root"},{"id":"xerox-parc-s-office-of-the-future-idea-1-node-2","label":"tablet concept","kind":"application"},{"id":"xerox-parc-s-office-of-the-future-idea-1-node-3","label":"educational computing","kind":"application"},{"id":"xerox-parc-s-office-of-the-future-idea-1-node-4","label":"1970s mass-market device","kind":"blocked"}],"edges":[{"from":"xerox-parc-s-office-of-the-future-idea-1-node-1","to":"xerox-parc-s-office-of-the-future-idea-1-node-2"},{"from":"xerox-parc-s-office-of-the-future-idea-1-node-1","to":"xerox-parc-s-office-of-the-future-idea-1-node-3"},{"from":"xerox-parc-s-office-of-the-future-idea-1-node-1","to":"xerox-parc-s-office-of-the-future-idea-1-node-4","status":"blocked"}]},"tags":["vision","timing"],"id":"xerox-parc-s-office-of-the-future-idea-1","displayOrder":1,"researchPackage":{"costMillions":9,"technicalFinding":"The software and interaction concepts are coherent.","productionFinding":"Displays, batteries, memory, and processors are not yet adequate for the full form.","adoptionFinding":"Schools and families may value it eventually, but the market is distant.","unresolvedRisks":["No near-term manufacturing path","Components not ready","Unclear buyer"],"marketContext":"The market case in 1968–1980s centered on a specific use: schools and families may value it eventually, but the market is distant. The idea could enter through specialized users who placed a high value on “Highly general vision”, then expand only if performance and operating routines proved repeatable. Displays, batteries, memory, and processors are not yet adequate for the full form. Demand could stall even with a working system if “Components not ready”, integration costs, or institutional resistance made switching unattractive."}},{"concealedTitle":"Graphical Personal Workstation","pitch":"One person uses a bitmapped display, windows, icons, text, images, and a pointing device. The immediate proposition behind “Graphical Personal Workstation” used “Direct manipulation” and “General-purpose”; scale-up and adoption still depended on costly custom hardware, unfamiliar interface, and the need for software ecosystem.","knownAdvantages":["Direct manipulation","General-purpose","Supports many applications"],"knownRisks":["Costly custom hardware","Unfamiliar interface","Requires software ecosystem"],"reveal":{"historicalName":"Xerox Alto-style graphical personal computing","impactTier":"transformative","returnMultiplier":2.14,"legacyBonusMultiplier":0.0,"historicalOutcome":"Deeply influenced the Macintosh, Windows, personal computing, and modern interfaces.","rankingRationale":"It combined many complementary technologies into a reusable personal-computing model.","whyItLookedRight":"Contemporary evidence showed that bitmapped displays and mouse interaction can make computing visual and flexible. Together with the claims “Direct manipulation” and “General-purpose”, the proposal merited serious consideration.","returnRationale":"This branch created a durable use and a positive investment return; the uncertainty between the two leading options made diversification rational before the reveal."},"innovationTree":{"nodes":[{"id":"xerox-parc-s-office-of-the-future-idea-2-node-1","label":"Graphical workstation","kind":"root"},{"id":"xerox-parc-s-office-of-the-future-idea-2-node-2","label":"desktop publishing","kind":"application"},{"id":"xerox-parc-s-office-of-the-future-idea-2-node-3","label":"Macintosh and Windows","kind":"application"},{"id":"xerox-parc-s-office-of-the-future-idea-2-node-4","label":"modern GUI software","kind":"application"},{"id":"xerox-parc-s-office-of-the-future-idea-2-node-5","label":"networked office","kind":"application"}],"edges":[{"from":"xerox-parc-s-office-of-the-future-idea-2-node-1","to":"xerox-parc-s-office-of-the-future-idea-2-node-2"},{"from":"xerox-parc-s-office-of-the-future-idea-2-node-1","to":"xerox-parc-s-office-of-the-future-idea-2-node-3"},{"from":"xerox-parc-s-office-of-the-future-idea-2-node-1","to":"xerox-parc-s-office-of-the-future-idea-2-node-4"},{"from":"xerox-parc-s-office-of-the-future-idea-2-node-1","to":"xerox-parc-s-office-of-the-future-idea-2-node-5"}]},"tags":["interface","platform"],"id":"xerox-parc-s-office-of-the-future-idea-2","displayOrder":2,"researchPackage":{"costMillions":8,"technicalFinding":"Bitmapped displays and mouse interaction can make computing visual and flexible.","productionFinding":"Early machines are costly, but semiconductor trends favor rapid decline.","adoptionFinding":"Offices, designers, writers, and later households can all use the interface.","unresolvedRisks":["Unfamiliar interface","Costly custom hardware","Requires software ecosystem"],"marketContext":"Offices, designers, writers, and later households can all use the interface. That signal established a possible customer problem, not a guaranteed mass market. Buyers would weigh the proposed gains—“Direct manipulation” and “General-purpose”—against the cost of replacing familiar tools or procedures. Early machines are costly, but semiconductor trends favor rapid decline. The unresolved business issue was whether enough users would move early despite “Costly custom hardware” and “Unfamiliar interface”."}},{"concealedTitle":"Computer-Controlled Xerographic Printer","pitch":"A laser scans complete digital pages onto a copier mechanism, producing high-quality text and graphics. The case available for “Computer-Controlled Xerographic Printer” included “High print quality”, while large early machines, the need for raster processing, and consumables and service remained to be tested.","knownAdvantages":["High print quality","Fast document production","Fits office workflows"],"knownRisks":["Large early machines","Needs raster processing","Consumables and service"],"reveal":{"historicalName":"Laser printer","impactTier":"medium","returnMultiplier":2.05,"legacyBonusMultiplier":0.0,"historicalOutcome":"Became a major office technology and direct commercial success.","rankingRationale":"It solved a clear near-term office problem but did not have the breadth of the personal-computing platform.","whyItLookedRight":"The investment logic during 1968–1980s was concrete: laser modulation can form arbitrary page images precisely, and the proposal carried the claims “High print quality” and “Fast document production”.","returnRationale":"This branch created a durable use and a positive investment return; the uncertainty between the two leading options made diversification rational before the reveal."},"innovationTree":{"nodes":[{"id":"xerox-parc-s-office-of-the-future-idea-3-node-1","label":"Laser printer","kind":"root"},{"id":"xerox-parc-s-office-of-the-future-idea-3-node-2","label":"office printing","kind":"application"},{"id":"xerox-parc-s-office-of-the-future-idea-3-node-3","label":"desktop publishing","kind":"application"},{"id":"xerox-parc-s-office-of-the-future-idea-3-node-4","label":"network print services","kind":"application"}],"edges":[{"from":"xerox-parc-s-office-of-the-future-idea-3-node-1","to":"xerox-parc-s-office-of-the-future-idea-3-node-2"},{"from":"xerox-parc-s-office-of-the-future-idea-3-node-1","to":"xerox-parc-s-office-of-the-future-idea-3-node-3"},{"from":"xerox-parc-s-office-of-the-future-idea-3-node-1","to":"xerox-parc-s-office-of-the-future-idea-3-node-4"}]},"tags":["printing","office"],"id":"xerox-parc-s-office-of-the-future-idea-3","displayOrder":3,"researchPackage":{"costMillions":10,"technicalFinding":"Laser modulation can form arbitrary page images precisely.","productionFinding":"Xerographic manufacturing and service capabilities already exist.","adoptionFinding":"Offices have immediate demand for typeset-quality output.","unresolvedRisks":["Needs raster processing","Large early machines","Consumables and service"],"marketContext":"Market conditions in 1968–1980s created a concrete opening: offices have immediate demand for typeset-quality output. Early customers would be purchasing a change in capability, especially the feature described as “High print quality”, while also accepting changes in how work was organized. Xerographic manufacturing and service capabilities already exist. A broad market therefore depended on budgets, compatibility with existing systems, repeat purchases, and confidence around “Large early machines”."}}],"debrief":{"winnerIdeaId":"xerox-parc-s-office-of-the-future-idea-2","winnerReason":"The Alto creates the widest direct platform; laser printing creates the strongest immediate office business.","investorLesson":"A platform may create more value than its originator can capture.","bestReturnIdeaId":"xerox-parc-s-office-of-the-future-idea-2","roundStructureExplanation":"Two options created positive returns; the decision problem was how to split exposure under uncertainty."},"sources":["https://computerhistory.org/blog/from-alto-to-ai/","https://computerhistory.org/events/40th-anniversary-dynabook/","https://computerhistory.org/profile/robert-w-taylor/"],"roundStructure":"twoWinners","calibrationTarget":{"ideaWeights":{"xerox-parc-s-office-of-the-future-idea-1":0.0,"xerox-parc-s-office-of-the-future-idea-2":52.1,"xerox-parc-s-office-of-the-future-idea-3":47.9},"holdWeight":0.0,"researchWeight":0},"calibrationRationale":"Xerox Alto-style graphical personal computing, Laser printer all beat cash; the benchmark divides post-research capital in proportion to their realized excess returns.","pitchYear":1972},{"id":"the-internet-information-system-race","sequence":6,"category":"Computing, Information, and Communications","title":"The Internet Information-System Race","discipline":"internet and information systems","era":"1989–1993","connection":"Competing systems for finding and publishing information on the early internet.","briefing":"Users need something easier than raw file transfer, but it is unclear whether hierarchy, search, or open linking will win","difficulty":"introductory","judgmentCall":false,"rankingCaveat":"","contentWarnings":[],"ideas":[{"concealedTitle":"Hierarchical Network Menus","pitch":"Institutions publish information in consistent folders and subfolders that users navigate step by step. For “Hierarchical Network Menus,” proponents could point to “Easy to learn”, “Orderly structure”, and “Fast on slow networks”, while central curation and weak cross-linking remained unsettled.","knownAdvantages":["Easy to learn","Orderly structure","Fast on slow networks"],"knownRisks":["Central curation","Weak cross-linking","Publishing bottlenecks"],"reveal":{"historicalName":"Gopher","impactTier":"medium","returnMultiplier":0.73,"legacyBonusMultiplier":0.0,"historicalOutcome":"Became a major early internet information system before losing ground to the Web.","rankingRationale":"It was useful and successful, but its hierarchy was less flexible than universal linking.","whyItLookedRight":"The protocol is simple and efficient. During 1989–1993, the claims “Easy to learn” and “Orderly structure” gave backers a concrete reason to finance “Hierarchical Network Menus.”","returnRationale":"The historical contribution was real, but the benefit was diffuse, public, open, or difficult for the original backer to capture as a direct financial return."},"innovationTree":{"nodes":[{"id":"the-internet-information-system-race-idea-1-node-1","label":"Gopher","kind":"root"},{"id":"the-internet-information-system-race-idea-1-node-2","label":"campus information","kind":"application"},{"id":"the-internet-information-system-race-idea-1-node-3","label":"public information services","kind":"application"},{"id":"the-internet-information-system-race-idea-1-node-4","label":"early internet navigation","kind":"application"}],"edges":[{"from":"the-internet-information-system-race-idea-1-node-1","to":"the-internet-information-system-race-idea-1-node-2"},{"from":"the-internet-information-system-race-idea-1-node-1","to":"the-internet-information-system-race-idea-1-node-3"},{"from":"the-internet-information-system-race-idea-1-node-1","to":"the-internet-information-system-race-idea-1-node-4"}]},"tags":["hierarchy","internet"],"id":"the-internet-information-system-race-idea-1","displayOrder":1,"researchPackage":{"costMillions":5,"technicalFinding":"The protocol is simple and efficient.","productionFinding":"Servers and text clients are easy to deploy.","adoptionFinding":"Universities and public institutions have immediate demand.","unresolvedRisks":["Weak cross-linking","Central curation","Publishing bottlenecks"],"marketContext":"In the 1989–1993 market, universities and public institutions have immediate demand. The proposal could create value through the reported capabilities “Easy to learn” and “Orderly structure”, but that value had to reach a buyer with authority and money to change current practice. Servers and text clients are easy to deploy. Commercial adoption would depend on procurement cycles, supporting infrastructure, and whether “Central curation” was manageable in ordinary use."}},{"concealedTitle":"Distributed Document Search","pitch":"Remote servers index text collections and answer searches over networked databases. The period case for “Distributed Document Search” emphasized “Powerful retrieval”, “Useful for libraries”, and “Works across institutions”; investors still lacked firm answers on complex servers and weak publishing experience.","knownAdvantages":["Powerful retrieval","Useful for libraries","Works across institutions"],"knownRisks":["Complex servers","Weak publishing experience","Competing standards"],"reveal":{"historicalName":"WAIS","impactTier":"limited","returnMultiplier":0.34,"legacyBonusMultiplier":0.25,"historicalOutcome":"Influenced distributed search but did not become the dominant public interface.","rankingRationale":"Search alone did not provide the complete read-link-publish ecosystem.","whyItLookedRight":"During 1989–1993, “Distributed Document Search” had a credible period case because full-text indexing and network queries are feasible; backers could also point to “Powerful retrieval” and “Useful for libraries”.","returnRationale":"The historical contribution was real, but the benefit was diffuse, public, open, or difficult for the original backer to capture as a direct financial return."},"innovationTree":{"nodes":[{"id":"the-internet-information-system-race-idea-2-node-1","label":"WAIS","kind":"root"},{"id":"the-internet-information-system-race-idea-2-node-2","label":"specialized document search","kind":"application"},{"id":"the-internet-information-system-race-idea-2-node-3","label":"influence on later search","kind":"application"},{"id":"the-internet-information-system-race-idea-2-node-4","label":"dominant consumer platform","kind":"blocked"}],"edges":[{"from":"the-internet-information-system-race-idea-2-node-1","to":"the-internet-information-system-race-idea-2-node-2"},{"from":"the-internet-information-system-race-idea-2-node-1","to":"the-internet-information-system-race-idea-2-node-3"},{"from":"the-internet-information-system-race-idea-2-node-1","to":"the-internet-information-system-race-idea-2-node-4","status":"blocked"}]},"tags":["search","internet"],"id":"the-internet-information-system-race-idea-2","displayOrder":2,"researchPackage":{"costMillions":5,"technicalFinding":"Full-text indexing and network queries are feasible.","productionFinding":"Setup and maintenance require expertise.","adoptionFinding":"Libraries and technical organizations value search.","unresolvedRisks":["Weak publishing experience","Complex servers","Competing standards"],"marketContext":"Libraries and technical organizations value search. That signal established a possible customer problem, not a guaranteed mass market. Buyers would weigh the proposed gains—“Powerful retrieval” and “Useful for libraries”—against the cost of replacing familiar tools or procedures. Setup and maintenance require expertise. The unresolved business issue was whether enough users would move early despite “Complex servers” and “Weak publishing experience”."}},{"concealedTitle":"Open Linked Documents","pitch":"Any document can link to any other through universal addresses, and anyone can publish with an open format. Backers considering “Open Linked Documents” were asked to value “Permissionless publishing” and “Flexible links”, with the main unknowns concentrated in broken-link risk.","knownAdvantages":["Permissionless publishing","Flexible links","Supports many media types"],"knownRisks":["Broken links","Disorganized content","Initially sparse"],"reveal":{"historicalName":"World Wide Web","impactTier":"transformative","returnMultiplier":0.85,"legacyBonusMultiplier":0.0,"historicalOutcome":"Became the dominant global publishing and application layer of the internet.","rankingRationale":"Openness, universal addressing, and flexible linking created powerful network effects.","whyItLookedRight":"URLs, HTTP, and HTML form a coherent interoperable system; combined with the claims “Permissionless publishing” and “Flexible links”, that evidence made “Open Linked Documents” a rational contemporary bet.","returnRationale":"The historical contribution was real, but the benefit was diffuse, public, open, or difficult for the original backer to capture as a direct financial return.","impactVsReturnNote":"The Web reshaped communication and commerce, but its open standards were free to adopt, so no single early backer owned the platform’s value."},"innovationTree":{"nodes":[{"id":"the-internet-information-system-race-idea-3-node-1","label":"World Wide Web","kind":"root"},{"id":"the-internet-information-system-race-idea-3-node-2","label":"publishing","kind":"application"},{"id":"the-internet-information-system-race-idea-3-node-3","label":"commerce","kind":"application"},{"id":"the-internet-information-system-race-idea-3-node-4","label":"social networks","kind":"application"},{"id":"the-internet-information-system-race-idea-3-node-5","label":"streaming","kind":"application"},{"id":"the-internet-information-system-race-idea-3-node-6","label":"web applications","kind":"application"}],"edges":[{"from":"the-internet-information-system-race-idea-3-node-1","to":"the-internet-information-system-race-idea-3-node-2"},{"from":"the-internet-information-system-race-idea-3-node-1","to":"the-internet-information-system-race-idea-3-node-3"},{"from":"the-internet-information-system-race-idea-3-node-1","to":"the-internet-information-system-race-idea-3-node-4"},{"from":"the-internet-information-system-race-idea-3-node-1","to":"the-internet-information-system-race-idea-3-node-5"},{"from":"the-internet-information-system-race-idea-3-node-1","to":"the-internet-information-system-race-idea-3-node-6"}]},"tags":["open standard","network effects"],"id":"the-internet-information-system-race-idea-3","displayOrder":3,"researchPackage":{"costMillions":5,"technicalFinding":"URLs, HTTP, and HTML form a coherent interoperable system.","productionFinding":"General-purpose computers can host and browse it.","adoptionFinding":"Every institution and individual can become a publisher.","unresolvedRisks":["Disorganized content","Broken links","Initially sparse"],"marketContext":"The market case in 1989–1993 centered on a specific use: every institution and individual can become a publisher. The idea could enter through specialized users who placed a high value on “Permissionless publishing”, then expand only if performance and operating routines proved repeatable. General-purpose computers can host and browse it. Demand could stall even with a working system if “Broken links”, integration costs, or institutional resistance made switching unattractive."}}],"debrief":{"winnerIdeaId":"the-internet-information-system-race-idea-3","winnerReason":"The Web wins by becoming an extensible platform rather than a single curated service.","investorLesson":"Switching costs can preserve an incumbent after a challenger works.","bestReturnIdeaId":"the-internet-information-system-race-idea-3","roundStructureExplanation":"This was a loss-avoidance round: every idea returned less than held cash. The correct play was to preserve capital because even World Wide Web, despite its long-run historical importance, was not investable on favorable terms in this window."},"sources":["https://www.computerhistory.org/revolution/the-web/20/387","https://computerhistory.org/blog/happy-25th-birthday-to-the-world-wide-web/"],"roundStructure":"allDuds","calibrationTarget":{"ideaWeights":{"the-internet-information-system-race-idea-1":0.0,"the-internet-information-system-race-idea-2":0.0,"the-internet-information-system-race-idea-3":0.0},"holdWeight":100.0,"researchWeight":0},"calibrationRationale":"Every idea returned less than preserved cash, so the aligned benchmark holds all post-research capital.","pitchYear":1991},{"id":"the-1970s-cryptography-portfolio","sequence":7,"category":"Computing, Information, and Communications","title":"The 1970s Cryptography Portfolio","discipline":"mathematics and cybersecurity","era":"1970s–1980s","connection":"Competing solutions for protecting digital communication.","briefing":"Governments and businesses need secure digital communication, but the best balance of key management, speed, and mathematical security is unknown","difficulty":"advanced","judgmentCall":false,"rankingCaveat":"","contentWarnings":[],"ideas":[{"concealedTitle":"Separate Public and Private Keys","pitch":"A user publishes one key while keeping a mathematically related private key for decryption or signing. “Separate Public and Private Keys” was presented through “Solves key distribution”, “Enables signatures”, and “Works across open networks”; practical deployment still depended on heavy computation on 1970s hardware.","knownAdvantages":["Solves key distribution","Enables signatures","Works across open networks"],"knownRisks":["Heavy computation on 1970s hardware","Requires trust infrastructure","New mathematics"],"reveal":{"historicalName":"Public-key cryptography","impactTier":"transformative","returnMultiplier":2.28,"legacyBonusMultiplier":0.0,"historicalOutcome":"Enabled secure web traffic, digital signatures, certificates, encrypted messaging, and electronic commerce.","rankingRationale":"It solved the structural key-distribution problem and created many reusable security services.","whyItLookedRight":"A backer during 1970s–1980s could see a defined path forward because trapdoor mathematical functions can separate public operations from private reversal. The proposal also carried the claims “Solves key distribution” and “Enables signatures”.","returnRationale":"This branch created a durable use and a positive investment return; the uncertainty between the two leading options made diversification rational before the reveal."},"innovationTree":{"nodes":[{"id":"the-1970s-cryptography-portfolio-idea-1-node-1","label":"Public-key cryptography","kind":"root"},{"id":"the-1970s-cryptography-portfolio-idea-1-node-2","label":"secure websites","kind":"application"},{"id":"the-1970s-cryptography-portfolio-idea-1-node-3","label":"digital signatures","kind":"application"},{"id":"the-1970s-cryptography-portfolio-idea-1-node-4","label":"software authentication","kind":"application"},{"id":"the-1970s-cryptography-portfolio-idea-1-node-5","label":"encrypted messaging","kind":"application"}],"edges":[{"from":"the-1970s-cryptography-portfolio-idea-1-node-1","to":"the-1970s-cryptography-portfolio-idea-1-node-2"},{"from":"the-1970s-cryptography-portfolio-idea-1-node-1","to":"the-1970s-cryptography-portfolio-idea-1-node-3"},{"from":"the-1970s-cryptography-portfolio-idea-1-node-1","to":"the-1970s-cryptography-portfolio-idea-1-node-4"},{"from":"the-1970s-cryptography-portfolio-idea-1-node-1","to":"the-1970s-cryptography-portfolio-idea-1-node-5"}]},"tags":["security","platform"],"id":"the-1970s-cryptography-portfolio-idea-1","displayOrder":1,"researchPackage":{"costMillions":9,"technicalFinding":"Trapdoor mathematical functions can separate public operations from private reversal.","productionFinding":"Software and later hardware can implement the calculations.","adoptionFinding":"Open networks desperately need secure exchange among strangers.","unresolvedRisks":["Requires trust infrastructure","Heavy computation on 1970s hardware","New mathematics"],"marketContext":"Open networks desperately need secure exchange among strangers. The first plausible adopters were organizations that placed a high value on the documented factor “Solves key distribution”. Other users could wait because existing methods already worked, even if they offered a different balance of speed, cost, or control. Software and later hardware can implement the calculations. The central market uncertainty was the pace of switching while “Heavy computation on 1970s hardware” and “Requires trust infrastructure” remained open."}},{"concealedTitle":"Standardized Secret-Key Block Cipher","pitch":"A shared secret key transforms fixed blocks of data through repeated substitutions and permutations. Contemporary supporters of “Standardized Secret-Key Block Cipher” cited “Fast”, “Standardizable”, and “Efficient in hardware”, but the investment still turned on the key-distributi -idea-2":57.8,"the-dna-sequencing-contest-idea-3":42.2},"holdWeight":0.0,"researchWeight":0},"calibrationRationale":"Sanger sequencing, Pyrosequencing and 454 sequencing all beat cash; the benchmark divides post-research capital in proportion to their realized excess returns.","pitchYear":1996},{"id":"light-from-a-jellyfish","sequence":23,"category":"Molecular Biology and Biotechnology","title":"Light from a Jellyfish","discipline":"biochemistry and imaging","era":"1960s–2000s","connection":"Molecules isolated while studying marine bioluminescence.","briefing":"A team finds a calcium-sensitive photoprotein, a small light-producing cofactor, and a protein that fluoresces without a continuously supplied substrate","difficulty":"introductory","judgmentCall":false,"rankingCaveat":"","contentWarnings":[],"ideas":[{"concealedTitle":"Calcium-Activated Blue Photoprotein","pitch":"A protein emits blue light when it binds calcium. Prospective users of “Calcium-Activated Blue Photoprotein” were offered “Sensitive calcium readout”, while adoption still required answers about the need for cofactor and brightness. Because calcium changes rapidly inside cells, the light signal could provide a direct readout of cellular activity.","knownAdvantages":["Sensitive calcium readout","Biological compatibility","Fast signal"],"knownRisks":["Requires cofactor","Brightness","Specialized assays"],"reveal":{"historicalName":"Aequorin","impactTier":"medium","returnMultiplier":1.39,"legacyBonusMultiplier":0.0,"historicalOutcome":"Became an important calcium sensor and research tool.","rankingRationale":"It provides high scientific value in a narrower measurement role.","whyItLookedRight":"Period investors could verify that calcium binding triggers a light-producing reaction; the claims “Sensitive calcium readout” and “Biological compatibility” therefore offered a usable route to adoption.","returnRationale":"The investment return reflects the breadth, durability, and capturability of the use that emerged, not scientific importance alone."},"innovationTree":{"nodes":[{"id":"light-from-a-jellyfish-idea-1-node-1","label":"Aequorin","kind":"root"},{"id":"light-from-a-jellyfish-idea-1-node-2","label":"calcium imaging","kind":"application"},{"id":"light-from-a-jellyfish-idea-1-node-3","label":"cell-signaling studies","kind":"application"}],"edges":[{"from":"light-from-a-jellyfish-idea-1-node-1","to":"light-from-a-jellyfish-idea-1-node-2"},{"from":"light-from-a-jellyfish-idea-1-node-1","to":"light-from-a-jellyfish-idea-1-node-3"}]},"tags":["biosensor"],"id":"light-from-a-jellyfish-idea-1","displayOrder":1,"researchPackage":{"costMillions":5,"technicalFinding":"Calcium binding triggers a light-producing reaction.","productionFinding":"Purified protein and engineered versions are feasible.","adoptionFinding":"Cell signaling and physiological measurement offer research demand.","unresolvedRisks":["Brightness","Requires cofactor","Specialized assays"],"marketContext":"Cell signaling and physiological measurement offer research demand. That signal established a possible customer problem, not a guaranteed mass market. Buyers would weigh the proposed gains—“Sensitive calcium readout” and “Biological compatibility”—against the cost of replacing familiar tools or procedures. Purified protein and engineered versions are feasible. The unresolved business issue was whether enough users would move early despite “Requires cofactor” and “Brightness”."}},{"concealedTitle":"Small Marine Light-Producing Cofactor","pitch":"A small molecule participates in many marine bioluminescent systems and can generate light with suitable proteins. The investment thesis for “Small Marine Light-Producing Cofactor” rested on “Broad biochemical role” and “Useful assay reagent”; unresolved engineering and market questions involved the need for external supply, chemical instability, and specialized handling.","knownAdvantages":["Broad biochemical role","Useful assay reagent","Multiple organisms"],"k he method. A broad market therefore depended on budgets, compatibility with existing systems, repeat purchases, and confidence around “Tiny direct market”."}},{"concealedTitle":"Recombinant Human Insulin","pitch":"Engineered microorganisms manufacture the protein chains needed for a widely used diabetes medicine. Support for “Recombinant Human Insulin” came from “Huge established need” and “Human sequence”, with uncertainty centered on regulatory challenge, protein assembly, and public concern over genetic engineering.","knownAdvantages":["Huge established need","Human sequence","Scalable fermentation"],"knownRisks":["Regulatory challenge","Protein assembly","Public concern over genetic engineering"],"reveal":{"historicalName":"Recombinant human insulin","impactTier":"transformative","returnMultiplier":3.5,"legacyBonusMultiplier":0.0,"historicalOutcome":"Became the first major recombinant-DNA medicine and validated the modern biotechnology industry.","rankingRationale":"A large repeat-use market and a credible manufacturing platform produced both revenue and industry legitimacy.","whyItLookedRight":"The idea entered the round with real evidence—bacteria can produce the chains, which can be purified and combined. Its period appeal also rested on “Huge established need” and “Human sequence”.","returnRationale":"The eventual upside was large, but the path depended on complementary infrastructure, scale, or timing that made it a high-variance bet at the decision date."},"innovationTree":{"nodes":[{"id":"genentech-s-first-recombinant-products-idea-2-node-1","label":"Recombinant insulin","kind":"root"},{"id":"genentech-s-first-recombinant-products-idea-2-node-2","label":"diabetes treatment","kind":"application"},{"id":"genentech-s-first-recombinant-products-idea-2-node-3","label":"biotechnology industry","kind":"application"},{"id":"genentech-s-first-recombinant-products-idea-2-node-4","label":"recombinant hormones","kind":"application"},{"id":"genentech-s-first-recombina .5,"legacyBonusMultiplier":0.25,"historicalOutcome":"Played an important early role in mapping and DNA fingerprinting but was largely displaced.","rankingRationale":"The technique was informative yet cumbersome and low-throughput.","whyItLookedRight":"Contemporary evidence showed that restriction-site variation changes fragment lengths predictably. Together with the claims “Genetic markers” and “Identity evidence”, the proposal merited serious consideration.","returnRationale":"The investment lost capital because a constraint outside the initial demonstration—scale, safety, adoption, economics, or competing systems—restricted durable use."},"innovationTree":{"nodes":[{"id":"the-molecular-dna-toolkit-idea-2-node-1","label":"RFLP","kind":"root"},{"id":"the-molecular-dna-toolkit-idea-2-node-2","label":"early forensics","kind":"application"},{"id":"the-molecular-dna-toolkit-idea-2-node-3","label":"genetic mapping","kind":"application"},{"id":"the-molecular-dna-toolkit-idea-2-node-4","label":"modern high-throughput genotyping","kind":"blocked"}],"edges":[{"from":"the-molecular-dna-toolkit-idea-2-node-1","to":"the-molecular-dna-toolkit-idea-2-node-2"},{"from":"the-molecular-dna-toolkit-idea-2-node-1","to":"the-molecular-dna-toolkit-idea-2-node-3"},{"from":"the-molecular-dna-toolkit-idea-2-node-1","to":"the-molecular-dna-toolkit-idea-2-node-4","status":"blocked"}]},"tags":["genotyping"],"id":"the-molecular-dna-toolkit-idea-2","displayOrder":2,"researchPackage":{"costMillions":5,"technicalFinding":"Restriction-site variation changes fragment lengths predictably.","productionFinding":"The method depends on gels, blots, and radioactive or chemical probes.","adoptionFinding":"Forensics and genetic mapping offer immediate use.","unresolvedRisks":["Slow analysis","Large sample needed","Marker density"],"marketContext":"Forensics and genetic mapping offer immediate use. The first plausible adopters were organizations that placed a high value on the documented factor “Genetic markers”. Other users could wait because existing methods already worked, even if they offered a different balance of speed, cost, or control. The method depends on gels, blots, and radioactive or chemical probes. The central market uncertainty was the pace of switching while “Large sample needed” and “Slow analysis” remained open."}},{"concealedTitle":"Repeated Enzymatic Copying","pitch":"Two short primers define a DNA segment that is copied exponentially through repeated heating and cooling cycles. The case available for “Repeated Enzymatic Copying” included “Huge amplification”, while contamination risk, the need for known flanking sequence, and quantitation challenges remained to be tested.","knownAdvantages":["Huge amplification","Fast","Works from tiny samples"],"knownRisks":["Contamination risk","Requires known flanking sequence","Quantitation challenges"],"reveal":{"historicalName":"Polymerase chain reaction","impactTier":"transformative","returnMultiplier":3.16,"legacyBonusMultiplier":0.0,"historicalOutcome":"Became a universal molecular-biology tool spanning medicine, research, forensics, ecology, and biotechnology.","rankingRationale":"Exponential amplification removes a bottleneck shared by many fields.","whyItLookedRight":"The investment logic during 1970s–1990s was concrete: each cycle approximately doubles the target, producing exponential growth, and the proposal carried the claims “Huge amplification” and “Fast”.","returnRationale":"The investment return reflects the breadth, durability, and capturability of the use that emerged, not scientific importance alone."},"innovationTree":{"nodes":[{"id":"the-molecular-dna-toolkit-idea-3-node-1","label":"PCR","kind":"root"},{"id":"the-molecular-dna-toolkit-idea-3-node-2","label":"pathogen diagnostics","kind":"application"},{"id":"the-molecular-dna-toolkit-idea-3-node-3","label":"forensic DNA","kind":"application"},{"id":"the-molecular-dna-toolkit-idea-3-node-4","label":"molecular cloning","kind":"application"}, it-idea-3","winnerReason":"PCR becomes a common enabling layer beneath multiple industries.","investorLesson":"A platform may create more value than its originator can capture.","bestReturnIdeaId":"the-molecular-dna-toolkit-idea-3","roundStructureExplanation":"One option produced the clearest direct return, but the concealed evidence is intentionally balanced."},"sources":["https://www.nobelprize.org/prizes/chemistry/1993/press-release/","https://www.genome.gov/about-genomics/fact-sheets/Polymerase-Chain-Reaction-Fact-Sheet"],"roundStructure":"standard","calibrationTarget":{"ideaWeights":{"the-molecular-dna-toolkit-idea-1":15.3,"the-molecular-dna-toolkit-idea-2":0.0,"the-molecular-dna-toolkit-idea-3":84.7},"holdWeight":0.0,"researchWeight":0},"calibrationRationale":"Polymerase chain reaction, Southern blot all beat cash; the benchmark divides post-research capital in proportion to their realized excess returns.","pitchYear":1985},{"id":"the-industrial-nitrogen-race","sequence":26,"category":"Agriculture, Ecology, and Food Production","title":"The Industrial Nitrogen Race","discipline":"industrial chemistry and agriculture","era":"1890s–1910s","connection":"Competing methods for fixing atmospheric nitrogen.","briefing":"Each route can make reactive nitrogen, but energy use, pressure, catalysts, and product handling determine whether it can feed a global fertilizer industry","difficulty":"intermediate","judgmentCall":false,"rankingCaveat":"","contentWarnings":[],"ideas":[{"concealedTitle":"Calcium-Carbide Nitrogen Fixation","pitch":"High-temperature reactions create calcium cyanamide, which can serve as fertilizer and chemical feedstock. For “Calcium-Carbide Nitrogen Fixation,” proponents could point to “Uses established furnace technology”, “Useful product”, and “Some fertilizer demand”, while energy intensive, caustic handling, and less flexible product remained unsettled.","knownAdvantages":["Uses established furnace technology","Useful product","Some fertilizer demand"],"knownRisks":["Energy intensive","Caustic handling","Less flexible product"],"reveal":{"historicalName":"Frank–Caro calcium cyanamide process","impactTier":"medium","returnMultiplier":2.04,"legacyBonusMultiplier":0.0,"historicalOutcome":"Supported an important early nitrogen industry before ammonia synthesis dominated.","rankingRationale":"It was commercially real but less efficient and versatile than catalytic ammonia.","whyItLookedRight":"Nitrogen can be incorporated into calcium cyanamide at high temperature. During 1890s–1910s, the claims “Uses established furnace technology” and “Useful product” gave backers a concrete reason to finance “Calcium-Carbide Nitrogen Fixation.”","returnRationale":"This branch created a durable use and a positive investment return; the uncertainty between the two leading options made diversification rational before the reveal."},"innovationTree":{"nodes":[{"id":"the-industrial-nitrogen-race-idea-1-node-1","label":"Calcium cyanamide","kind":"root"},{"id":"the-industrial-nitrogen-race-idea-1-node-2","label":"fertilizer","kind":"application"},{"id":"the-industrial-nitrogen-race-idea-1-node-3","label":"chemical feedstocks","kind":"application"}],"edges":[{"from":"the-industrial-nitrogen-race-idea-1-node-1","to":"the-industrial-nitrogen-race-idea-1-node-2"},{"from":"the-industrial-nitrogen-race-idea-1-node-1","to":"the-industrial-nitrogen-race-idea-1-node-3"}]},"tags":["nitrogen fixation"],"id":"the-industrial-nitrogen-race-idea-1","displayOrder":1,"researchPackage":{"costMillions":7,"technicalFinding":"Nitrogen can be incorporated into calcium cyanamide at high temperature.","productionFinding":"Electric furnaces and mineral feedstocks are scalable where power is cheap.","adoptionFinding":"Fertilizer and chemical users provide a real market.","unresolvedRisks":["Caustic handling","Energy intensive","Less flexible product"],"marketContext":"Fertilizer and chemical users provide a real market. In 1890s–1910s, the reachable market would begin with organizations already working in nitrogen fixation, rather than with every possible user at once. The commercial case rested on whether buyers valued the documented capabilities—“Uses established furnace technology” and “Useful product”—enough to justify new equipment, training, standards, or operating procedures. Electric furnaces and mineral feedstocks are scalable where power is cheap. The demand question remained whether buyers would commit before the open questions “Energy intensive” and “Caustic handling” were resolved."}},{"concealedTitle":"Electric-Arc Fixation","pitch":"Powerful arcs imitate lightning and convert air into nitrogen oxides that can be processed into fertilizer. The period case for “Electric-Arc Fixation” emphasized “Uses only air and electricity”; investors still lacked firm answers on enormous energy demand and dilute product stream.","knownAdvantages":["Uses only air and electricity","Technically direct","No high-pressure hydrogen"],"knownRisks":["Enormous energy demand","Dilute product stream","Location dependent"],"reveal":{"historicalName":"Birkeland–Eyde process","impactTier":"limited","returnMultiplier":0.46,"legacyBonusMultiplier":0.0,"historicalOutcome":"Operated commercially in regions with cheap hydropower but was largely displaced.","rankingRationale":"The chemistry worked, but energy intensity destroyed broad competitiveness.","whyItLookedRight":"During 1890s–1910s, “Electric-Arc Fixation” had a credible period case because very high temperatures form nitrogen oxides from air; backers could also point to “Uses only air and electricity” and “Technically direct”.","returnRationale":"The investment lost capital because a constraint outside the initial demonstration—scale, safety, adoption, economics, or competing systems—restricted durable use."},"innovationTree":{"nodes":[{"id":"the-industrial-nitrogen-race-idea-2-node-1","label":"Electric-arc fixation","kind":"root"},{"id":"the-industrial-nitrogen-race-idea-2-node-2","label":"regional fertilizer production","kind":"application"},{"id":"the-industrial-nitrogen-race-idea-2-node-3","label":"global dominant process","kind":"blocked"}],"edges":[{"from":"the-industrial-nitrogen-race-idea-2-node-1","to":"the-industrial-nitrogen-race-idea-2-node-2"},{"from":"the-industrial-nitrogen-race-idea-2-node-1","to":"the-industrial-nitrogen-race-idea-2-node-3","status":"blocked"}]},"tags":["energy economics"],"id":"the-industrial-nitrogen-race-idea-2","displayOrder":2,"researchPackage":{"costMillions":7,"technicalFinding":"Very high temperatures form nitrogen oxides from air.","productionFinding":"Large hydropower supplies and absorption towers are needed.","adoptionFinding":"Fertilizer demand is strong, but electricity cost dominates economics.","unresolvedRisks":["Dilute product stream","Enormous energy demand","Location dependent"],"marketContext":"Fertilizer demand is strong, but electricity cost dominates economics. In 1890s–1910s, the reachable market would begin with organizations already working in energy economics, rather than with every possible user at once. The commercial case rested on whether buyers valued the documented capabilities—“Uses only air and electricity” and “Technically direct”—enough to justify new equipment, training, standards, or operating procedures. Large hydropower supplies and absorption towers are needed. The demand question remained whether buyers would commit before the open questions “Enormous energy demand” and “Dilute product stream” were resolved."}},{"concealedTitle":"Catalytic Ammonia Synthesis","pitch":"Nitrogen and hydrogen react over a catalyst at high pressure and temperature to form ammonia. Backers considering “Catalytic Ammonia Synthesis” were asked to value “Efficient at scale”, with the main unknowns concentrated in high pressure, hydrogen supply, and large capital plants.","knownAdvantages":["Efficient at scale","Versatile product","Continuous process"],"knownRisks":["High pressure","Hydrogen supply","Large capital plants"],"reveal":{"historicalName":"Haber–Bosch process","impactTier":"transformative","returnMultiplier":2.13,"legacyBonusMultiplier":0.0,"historicalOutcome":"Became the dominant source of synthetic nitrogen fertilizer and a foundation of modern agriculture and chemical industry.","rankingRationale":"Scale efficiency and a versatile product created an immense global application tree.","whyItLookedRight":"Equilibrium and catalysts permit practical ammonia yields under controlled conditions; combined with the claims “Efficient at scale” and “Versatile product”, that evidence made “Catalytic Ammonia Synthesis” a rational contemporary bet.","returnRationale":"This branch created a durable use and a positive investment return; the uncertainty between the two leading options made diversification rational before the reveal."},"innovationTree":{"nodes":[{"id":"the-industrial-nitrogen-race-idea-3-node-1","label":"Haber–Bosch","kind":"root"},{"id":"the-industrial-nitrogen-race-idea-3-node-2","label":"nitrogen fertilizer","kind":"application"},{"id":"the-industrial-nitrogen-race-idea-3-node-3","label":"global food production","kind":"application"},{"id":"the-industrial-nitrogen-race-idea-3-node-4","label":"industrial chemicals","kind":"application"},{"id":"the-industrial-nitrogen-race-idea-3-node-5","label":"explosives","kind":"application"}],"edges":[{"from":"the-industrial-nitrogen-race-idea-3-node-1","to":"the-industrial-nitrogen-race-idea-3-node-2"},{"from":"the-industrial-nitrogen-race-idea-3-node-1","to":"the-industrial-nitrogen-race-idea-3-node-3"},{"from":"the-industrial-nitrogen-race-idea-3-node-1","to":"the-industrial-nitrogen-race-idea-3-node-4"},{"from":"the-industrial-nitrogen-race-idea-3-node-1","to":"the-industrial-nitrogen-race-idea-3-node-5"}]},"tags":["industrial process","global impact"],"id":"the-industrial-nitrogen-race-idea-3","displayOrder":3,"researchPackage":{"costMillions":5,"technicalFinding":"Equilibrium and catalysts permi ain","kind":"application"},{"id":"borlaug-s-wheat-program-idea-1-node-4","label":"global wheat replacement","kind":"blocked"}],"edges":[{"from":"borlaug-s-wheat-program-idea-1-node-1","to":"borlaug-s-wheat-program-idea-1-node-2"},{"from":"borlaug-s-wheat-program-idea-1-node-1","to":"borlaug-s-wheat-program-idea-1-node-3"},{"from":"borlaug-s-wheat-program-idea-1-node-1","to":"borlaug-s-wheat-program-idea-1-node-4","status":"blocked"}]},"tags":["new crop"],"id":"borlaug-s-wheat-program-idea-1","displayOrder":1,"researchPackage":{"costMillions":7,"technicalFinding":"Chromosome manipulation can stabilize wheat–rye hybrids.","productionFinding":"Breeding and seed multiplication are feasible but complex.","adoptionFinding":"Feed and marginal-land uses exist.","unresolvedRisks":["Quality tradeoffs","Fertility challenges","Farmer familiarity"],"marketContext":"Market conditions in 1940s–1970s created a concrete opening: feed and marginal-land uses exist. Early customers would be purchasing a change in capability, especially the feature described as “Stress tolerance”, while also accepting changes in how work was organized. Breeding and seed multiplication are feasible but complex. A broad market therefore depended on budgets, compatibility with existing systems, repeat purchases, and confidence around “Fertility challenges”."}},{"concealedTitle":"Two-Location Shuttle Breeding","pitch":"Grow consecutive generations in contrasting locations to shorten breeding cycles and select broadly adapted plants. Contemporary supporters of “Two-Location Shuttle Breeding” cited “Twice-yearly selection”, “Rapid iteration”, and “Broad adaptation”, but the investment still turned on logistics, risk of discarding locally specialized traits, and the need for coordinated sites.","knownAdvantages":["Twice-yearly selection","Rapid iteration","Broad adaptation"],"knownRisks":["Logistics","May discard locally specialized traits","Requires coordinated sites"],"reveal":{"historicalName":"Shuttle breeding","impactTier":"medium","returnMultiplier":1.8,"legacyBonusMultiplier":0.0,"historicalOutcome":"Accelerated wheat improvement and unexpectedly created broadly adapted lines.","rankingRationale":"It was a powerful method and enabling capability, though not itself the final high-yield product.","whyItLookedRight":"“Two-Location Shuttle Breeding” addressed a live plant breeding and agriculture problem: selection across environments can reveal stable performance and photoperiod flexibility. Its period case included “Twice-yearly selection” and “Rapid iteration”.","returnRationale":"This path offered a narrower but earlier and more legible route to adoption, making it the stronger risk-adjusted allocation before hindsight."},"innovationTree":{"nodes":[{"id":"borlaug-s-wheat-program-idea-2-node-1","label":"Shuttle breeding","kind":"root"},{"id":"borlaug-s-wheat-program-idea-2-node-2","label":"faster crop improvement","kind":"application"},{"id":"borlaug-s-wheat-program-idea-2-node-3","label":"broad adaptation","kind":"application"},{"id":"borlaug-s-wheat-program-idea-2-node-4","label":"international breeding networks","kind":"application"}],"edges":[{"from":"borlaug-s-wheat-program-idea-2-node-1","to":"borlaug-s-wheat-program-idea-2-node-2"},{"from":"borlaug-s-wheat-program-idea-2-node-1","to":"borlaug-s-wheat-program-idea-2-node-3"},{"from":"borlaug-s-wheat-program-idea-2-node-1","to":"borlaug-s-wheat-program-idea-2-node-4"}]},"tags":["method innovation"],"id":"borlaug-s-wheat-program-idea-2","displayOrder":2,"researchPackage":{"costMillions":7,"technicalFinding":"Selection across environments can reveal stable performance and photoperiod flexibility.","productionFinding":"Seed transport and coordinated field teams make the method practical.","adoptionFinding":"Every breeding program values faster generation turnover.","unresolvedRisks":["May discard locally specialized traits","Logistics","Requires coordinated sites"],"marketContext":"The market case in 1940s–1970s ot"},{"id":"borlaug-s-wheat-program-idea-3-node-2","label":"higher yields","kind":"application"},{"id":"borlaug-s-wheat-program-idea-3-node-3","label":"Green Revolution","kind":"application"},{"id":"borlaug-s-wheat-program-idea-3-node-4","label":"food-security gains","kind":"application"},{"id":"borlaug-s-wheat-program-idea-3-node-5","label":"modern high-input breeding","kind":"application"}],"edges":[{"from":"borlaug-s-wheat-program-idea-3-node-1","to":"borlaug-s-wheat-program-idea-3-node-2"},{"from":"borlaug-s-wheat-program-idea-3-node-1","to":"borlaug-s-wheat-program-idea-3-node-3"},{"from":"borlaug-s-wheat-program-idea-3-node-1","to":"borlaug-s-wheat-program-idea-3-node-4"},{"from":"borlaug-s-wheat-program-idea-3-node-1","to":"borlaug-s-wheat-program-idea-3-node-5"}]},"tags":["crop yield","global impact"],"id":"borlaug-s-wheat-program-idea-3","displayOrder":3,"researchPackage":{"costMillions":7,"technicalFinding":"Shorter stems redirect biomass and reduce collapse under high grain loads.","productionFinding":"Conventional breeding can incorporate the genes into disease-resistant lines.","adoptionFinding":"Food-short countries and irrigated agriculture offer huge demand.","unresolvedRisks":["Genetic uniformity risk","Needs fertilizer and management","Seed distribution challenge"],"marketContext":"Food-short countries and irrigated agriculture offer huge demand. In 1940s–1970s, the reachable market would begin with organizations already working in crop yield, global impact, rather than with every possible user at once. The commercial case rested on whether buyers valued the documented capabilities—“Higher harvest index” and “Resists lodging”—enough to justify new equipment, training, standards, or operating procedures. Conventional breeding can incorporate the genes into disease-resistant lines. The demand question remained whether buyers would commit before the open questions “Needs fertilizer and management” and “Genetic uniformity risk” were resolved."}}],"debr ation rational before the reveal."},"innovationTree":{"nodes":[{"id":"delivering-water-to-crops-idea-1-node-1","label":"Center pivot","kind":"root"},{"id":"delivering-water-to-crops-idea-1-node-2","label":"Great Plains agriculture","kind":"application"},{"id":"delivering-water-to-crops-idea-1-node-3","label":"mechanized irrigation","kind":"application"},{"id":"delivering-water-to-crops-idea-1-node-4","label":"remote irrigation control","kind":"application"}],"edges":[{"from":"delivering-water-to-crops-idea-1-node-1","to":"delivering-water-to-crops-idea-1-node-2"},{"from":"delivering-water-to-crops-idea-1-node-1","to":"delivering-water-to-crops-idea-1-node-3"},{"from":"delivering-water-to-crops-idea-1-node-1","to":"delivering-water-to-crops-idea-1-node-4"}]},"tags":["mechanization"],"id":"delivering-water-to-crops-idea-1","displayOrder":1,"researchPackage":{"costMillions":6,"technicalFinding":"Water pressure drives sprinkler distribution over broad acreage.","productionFinding":"Standard towers, wheels, pumps, and nozzles can be mass-produced.","adoptionFinding":"Broad-acre grain farms and groundwater regions offer documented demand among identified users.","unresolvedRisks":["High capital","Evaporation losses","Best on regular terrain"],"marketContext":"Broad-acre grain farms and groundwater regions offer documented demand among identified users. That signal established a possible customer problem, not a guaranteed mass market. Buyers would weigh the proposed gains—“Covers huge fields” and “Mechanized”—against the cost of replacing familiar tools or procedures. Standard towers, wheels, pumps, and nozzles can be mass-produced. The unresolved business issue was whether enough users would move early despite “Evaporation losses” and “High capital”."}},{"concealedTitle":"Buried Porous Clay Vessels","pitch":"Refillable ceramic pots slowly release water into dry surrounding soil near plant roots. Support for “Buried Porous Clay Vessels” came from “Very water efficient”, “L burden” remained open."}},{"concealedTitle":"Commercial Hybrid Seed","pitch":"Highly inbred parent lines are crossed to produce uniform first-generation plants with strong hybrid vigor. The case available for “Commercial Hybrid Seed” included “Predictable yield gain” and “Uniform crop”, while farmers must repurchase seed and complex parent production remained to be tested.","knownAdvantages":["Predictable yield gain","Uniform crop","Repeat seed market"],"knownRisks":["Farmers must repurchase seed","Complex parent production","Benefits vary by crop"],"reveal":{"historicalName":"Hybrid maize","impactTier":"transformative","returnMultiplier":3.03,"legacyBonusMultiplier":0.0,"historicalOutcome":"Drove major yield increases and helped establish the modern commercial seed industry.","rankingRationale":"Predictable agronomic performance combined with a scalable recurring business model.","whyItLookedRight":"The investment logic during 1900s–1970s was concrete: heterosis can produce vigorous offspring from selected inbred parents, and the proposal carried the claims “Predictable yield gain” and “Uniform crop”.","returnRationale":"The investment return reflects the breadth, durability, and capturability of the use that emerged, not scientific importance alone."},"innovationTree":{"nodes":[{"id":"three-ways-to-redesign-a-crop-genome-idea-3-node-1","label":"Hybrid maize","kind":"root"},{"id":"three-ways-to-redesign-a-crop-genome-idea-3-node-2","label":"yield growth","kind":"application"},{"id":"three-ways-to-redesign-a-crop-genome-idea-3-node-3","label":"commercial seed industry","kind":"application"},{"id":"three-ways-to-redesign-a-crop-genome-idea-3-node-4","label":"Hybrid breeding","kind":"root"},{"id":"three-ways-to-redesign-a-crop-genome-idea-3-node-5","label":"poultry and crop analogs","kind":"application"},{"id":"three-ways-to-redesign-a-crop-genome-idea-3-node-6","label":"Hybrid seed","kind":"root"},{"id":"three-ways-to-redesign-a-crop-genome-idea-3-node-7","label":"private breeding investment","kind":"application"}],"edges":[{"from":"three-ways-to-redesign-a-crop-genome-idea-3-node-1","to":"three-ways-to-redesign-a-crop-genome-idea-3-node-2"},{"from":"three-ways-to-redesign-a-crop-genome-idea-3-node-1","to":"three-ways-to-redesign-a-crop-genome-idea-3-node-3"},{"from":"three-ways-to-redesign-a-crop-genome-idea-3-node-4","to":"three-ways-to-redesign-a-crop-genome-idea-3-node-5"},{"from":"three-ways-to-redesign-a-crop-genome-idea-3-node-6","to":"three-ways-to-redesign-a-crop-genome-idea-3-node-7"}]},"tags":["heterosis","business model"],"id":"three-ways-to-redesign-a-crop-genome-idea-3","displayOrder":3,"researchPackage":{"costMillions":7,"technicalFinding":"Heterosis can produce vigorous offspring from selected inbred parents.","productionFinding":"Controlled crossing and seed companies can scale production.","adoptionFinding":"Maize and later other crops offer enormous yield and commercial value.","unresolvedRisks":["Complex parent production","Farmers must repurchase seed","Benefits vary by crop"],"marketContext":"Market conditions in 1900s–1970s created a concrete opening: maize and later other crops offer enormous yield and commercial value. Early customers would be purchasing a change in capability, especially the feature described as “Predictable yield gain”, while also accepting changes in how work was organized. Controlled crossing and seed companies can scale production. A broad market therefore depended on budgets, compatibility with existing systems, repeat purchases, and confidence around “Farmers must repurchase seed”."}}],"debrief":{"winnerIdeaId":"three-ways-to-redesign-a-crop-genome-idea-3","winnerReason":"Hybrid maize aligns a biological advantage with standardized production and recurring sales.","investorLesson":"Safety margins determine whether potency becomes value or liability.","bestReturnIdeaId":"three-ways-to-redesign-a-crop-genome-idea-3","roundStructureExplanation":"One option produced the clearest direct return, but the concealed evidence is intentionally balanced."},"sources":["https://www.ars.usda.gov/oc/timeline/corn/","https://www.iaea.org/topics/mutation-breeding"],"roundStructure":"standard","calibrationTarget":{"ideaWeights":{"three-ways-to-redesign-a-crop-genome-idea-1":0.0,"three-ways-to-redesign-a-crop-genome-idea-2":12.9,"three-ways-to-redesign-a-crop-genome-idea-3":87.1},"holdWeight":0.0,"researchWeight":0},"calibrationRationale":"Hybrid maize, Mutation breeding all beat cash; the benchmark divides post-research capital in proportion to their realized excess returns.","pitchYear":1938},{"id":"the-navigation-system-race","sequence":31,"category":"Earth, Atmosphere, Astronomy, and Space","title":"The Navigation-System Race","discipline":"navigation and space systems","era":"1940s–1990s","connection":"Electronic and satellite navigation systems developed for military and civilian use.","briefing":"Investors compare regional terrestrial transmitters, Doppler satellites, and a global constellation broadcasting atomic-clock time","difficulty":"introductory","judgmentCall":false,"rankingCaveat":"","contentWarnings":[],"ideas":[{"concealedTitle":"Synchronized Terrestrial Transmitter Chains","pitch":"Receivers compare precisely timed low-frequency pulses from fixed stations to estimate position. For “Synchronized Terrestrial Transmitter Chains,” proponents could point to “Works without satellites”, while regional coverage remained unsettled. Ships and aircraft could use the same regional transmitter network without carrying an atomic clock.","knownAdvantages":["Works without satellites","Good maritime range","Mature radio engineering"],"knownRisks":["Regional coverage","Infrastructure heavy","Lower precision"],"reveal":{"historicalName":"LORAN-C","impactTier":"limited","returnMultiplier":0.51,"legacyBonusMultiplier":0.25,"historicalOutcome":"Provided important regional navigation for decades but was decommissioned in many places after satellite navigation matured.","rankingRationale":"It was operationally valuable yet geographically bounded and infrastructure intensive.","whyItLookedRight":"Hyperbolic timing differences locate a receiver relative to station pairs. During 1940s–1990s, the claims “Works without satellites” and “Good maritime range” gave backers a concrete reason to finance “Synchronized Terrestrial Transmitter Chains.”","returnRationale":"The investment lost capital because a constraint outside the initial demonstration—scale, safety, adoption, economics, or competing systems—restricted durable use."},"innovationTree":{"nodes":[{"id":"the-navigation-system-race-idea-1-node-1","label":"LORAN","kind":"root"},{"id":"the-navigation-system-race-idea-1-node-2","label":"maritime navigation","kind":"application"},{"id":"the-navigation-system-race-idea-1-node-3","label":"aviation backup","kind":"application"},{"id":"the-navigation-system-race-idea-1-node-4","label":"global universal platform","kind":"blocked"}],"edges":[{"from":"the-navigation-system-race-idea-1-node-1","to":"the-navigation-system-race-idea-1-node-2"},{"from":"the-navigation-system-race-idea-1-node-1","to":"the-navigation-system-race-idea-1-node-3"},{"from":"the-navigation-system-race-idea-1-node-1","to":"the-navigation-system-race-idea-1-node-4","status":"blocked"}]},"tags":["terrestrial navigation"],"id":"the-navigation-system-race-idea-1","displayOrder":1,"researchPackage":{"costMillions":4,"technicalFinding":"Hyperbolic timing differences locate a receiver relative to station pairs.","productionFinding":"Large towers and synchronized chains require more capital than established alternatives but feasible.","adoptionFinding":"Ships and aircraft need reliable regional navigation.","unresolvedRisks":["Infrastructure heavy","Regional coverage","Lower precision"],"marketContext":"Ships and aircraft need reliable regional navigation. That signal established a possible customer problem, not a guaranteed mass market. Buyers would weigh the proposed gains—“Works without satellites” and “Good maritime range”—against the cost of replacing familiar tools or procedures. Large towers and synchronized chains require more capital than established alternatives but feasible. The unresolved business issue was whether enough users would move early despite “Regional coverage” and “Infrastructure heavy”."}},{"concealedTitle":"Doppler Navigation Satellites","pitch":"A receiver infers position from the changing frequency of signals emitted by a satellite in a known orbit. The period case for “Doppler Navigation Satellites” emphasized “Global ocean coverage” and “High accuracy for era”; investors still lacked firm answers on slow position fixes.","knownAdvantages":["Global ocean coverage","High accuracy for era","Proven satellite use"],"knownRisks":["Position fixes take time","Satellites","Primarily specialized receivers"],"reveal":{"historicalName":"Transit satellite navigation","impactTier":"medium","returnMultiplier":1.86,"legacyBonusMultiplier":0.25,"historicalOutcome":"Became a successful military and surveying system and a direct predecessor to GPS.","rankingRationale":"It proved satellite navigation but did not offer continuous universal service.","whyItLookedRight":"During 1940s–1990s, “Doppler Navigation Satellites” had a credible period case because doppler shift encodes relative motion and geometry; backers could also point to “Global ocean coverage” and “High accuracy for era”.","returnRationale":"This path offered a narrower but earlier and more legible route to adoption, making it the stronger risk-adjusted allocation before hindsight."},"innovationTree":{"nodes":[{"id":"the-navigation-system-race-idea-2-node-1","label":"Transit","kind":"root"},{"id":"the-navigation-system-race-idea-2-node-2","label":"submarine navigation","kind":"application"},{"id":"the-navigation-system-race-idea-2-node-3","label":"geodetic surveying","kind":"application"},{"id":"the-navigation-system-race-idea-2-node-4","label":"satellite-navigation expertise","kind":"application"}],"edges":[{"from":"the-navigation-system-race-idea-2-node-1","to":"the-navigation-system-race-idea-2-node-2"},{"from":"the-navigation-system-race-idea-2-node-1","to":"the-navigation-system-race-idea-2-node-3"},{"from":"the-navigation-system-race-idea-2-node-1","to":"the-navigation-system-race-idea-2-node-4"}]},"tags":["Doppler","space"],"id":"the-navigation-system-race-idea-2","displayOrder":2,"researchPackage":{"costMillions":4,"technicalFinding":"Doppler shift encodes relative motion and geometry.","productionFinding":"A small constellation and precise orbit determination are manageable.","adoptionFinding":"Submarines, ships, and surveyors offer documented demand among identified users.","unresolvedRisks":["Satellites","Position fixes take time","Primarily specialized receivers"],"marketContext":"Submarines, ships, and surveyors offer documented demand among identified users. The first plausible adopters were organizations that placed a high value on the documented factor “Global ocean coverage”. Other users could wait because existing methods already worked, even if they offered a different balance of speed, cost, or control. A small constellation and precise orbit determination are manageable. The central market uncertainty was the pace of switching while “Position fixes take time” and “Satellites” remained open."}},{"concealedTitle":"Global Atomic-Clock Satellites","pitch":"Receivers measure travel times from several orbiting atomic clocks to solve continuously for position and receiver time. Backers considering “Global Atomic-Clock Satellites” were asked to value “Global coverage” and “Continuous service”, with the main unknowns concentrated in costly satellite constellation and relativity corrections.","knownAdvantages":["Global coverage","Continuous service","Precise time"],"knownRisks":["Costly satellite constellation","Relativity corrections","Weak signals"],"reveal":{"historicalName":"Global Positioning System","impactTier":"transformative","returnMultiplier":3.48,"legacyBonusMultiplier":0.0,"historicalOutcome":"Became a global platform for navigation, mapping, logistics, timing, finance, and communications.","rankingRationale":"A costly shared infrastructure created extremely cheap marginal use for billions of receivers.","whyItLookedRight":"Multilateration from synchronized clocks yields position and time; combined with the claims “Global coverage” and “Continuous service”, that evidence made “Global Atomic-Clock Satellites” a rational contemporary bet.","returnRationale":"The eventual upside was large, but the path depended on complementary infrastructure, scale, or timing that made it a high-variance bet at the decision date."},"innovationTree":{"nodes":[{"id":"the-navigation-system-race-idea-3-node-1","label":"GPS","kind":"root"},{"id":"the-navigation-system-race-idea-3-node-2","label":"military navigation","kind":"application"},{"id":"the-navigation-system-race-idea-3-node-3","label":"surveying","kind":"application"},{"id":"the-navigation-system-race-idea-3-node-4","label":"precision agriculture","kind":"application"},{"id":"the-navigation-system-race-idea-3-node-5","label":"smartphone maps","kind":"application"},{"id":"the-navigation-system-race-idea-3-node-6","label":"delivery and ride sharing","kind":"application"},{"id":"the-navigation-system-race-idea-3-node-7","label":"financial and grid timing","kind":"application"}],"edges":[{"from":"the-navigation-system-race-idea-3-node-1","to":"the-navigation-system-race-idea-3-node-2"},{"from":"the-navigation-system-race-idea-3-node-1","to":"the-navigation-system-race-idea-3-node-3"},{"from":"the-navigation-system-race-idea-3-node-1","to":"the-navigation-system-race-idea-3-node-4"},{"from":"the-navigation-system-race-idea-3-node-1","to":"the-navigation-system-race-idea-3-node-5"},{"from":"the-navigation-system-race-idea-3-node-1","to":"the-navigation-system-race-idea-3-node-6"},{"from":"the-navigation-system-race-idea-3-node-1",

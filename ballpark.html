<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ballpark — Intentional Real-Facts Edition</title>
<style>
:root{
  --paper:#ffffff;--ink:#1a1a17;--muted:#565651;--line:#e4e4e2;--card:#fff;
  --accent:#2f5d86;--accent-soft:#eef3f7;--good:#197347;--good-soft:#e7f4ec;
  --high:#a84b28;--high-soft:#faeee8;--low:#315fa5;--low-soft:#eaf0fa;
  --mixed:#7a5b12;--mixed-soft:#fbf3d9;--shadow:0 8px 24px rgba(24,32,39,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.45}
button{font:inherit}
.wrap{max-width:1480px;margin:auto;padding:26px 24px 80px}
.kick{font:700 11px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
h1{font-size:34px;line-height:1.05;margin:5px 0 7px}.sub{color:var(--muted);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.homehead{display:flex;justify-content:space-between;gap:16px;align-items:end;flex-wrap:wrap}.homehead .sub{max-width:730px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;text-align:left;padding:17px 18px;cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.card:hover{border-color:var(--accent);box-shadow:var(--shadow)}.card .n{font:700 10px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--accent);letter-spacing:.12em;text-transform:uppercase}.card .t{font-size:20px;font-weight:700;margin:3px 0 3px}.card .d{font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--muted)}
.cardtop{display:flex;gap:14px;align-items:center;margin-bottom:6px}.cardtop>div:last-child{min-width:0}.cardicon{flex:none;width:58px;height:58px;border:none;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 3px 8px rgba(47,93,134,.28)}.cardicon svg{width:32px;height:32px}
.card:hover .cardicon{transform:scale(1.04)}
.topbarleft{display:flex;gap:15px;align-items:flex-start;min-width:0}.gameicon{flex:none;width:58px;height:58px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 3px 8px rgba(47,93,134,.28)}.gameicon svg{width:32px;height:32px}
.briefingkick svg{width:14px;height:14px;vertical-align:-2px;margin-right:5px}
.eqnum svg{width:23px;height:23px;background:var(--accent);color:#fff;border-radius:6px;padding:4px;vertical-align:-8px;margin-right:8px}
.finfo{margin-left:7px;width:17px;height:17px;border-radius:50%;border:1px solid var(--accent);background:#fff;color:var(--accent);font:800 10px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer;padding:0;display:inline-grid;place-items:center;vertical-align:middle}.finfo:hover{background:var(--accent);color:#fff}
.fclue{display:none;margin-top:7px;background:#faf9f5;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:11.5px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--muted)}.flabel:hover + .fclue,.flabel:focus-within + .fclue{display:block}
.topbar{display:flex;justify-content:space-between;gap:12px;align-items:start;flex-wrap:wrap;margin-bottom:8px}.topic{font-size:28px;font-weight:700;line-height:1.1}.round{font:700 13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--ink);color:white;border-radius:999px;padding:9px 13px}
.progress{height:7px;background:#e7e2d8;border-radius:99px;overflow:hidden;margin:14px 0 16px}.progress span{display:block;height:100%;background:var(--accent);transition:width .2s}

.briefing{background:linear-gradient(135deg,#f6f1e8,#eef3f7);border:1px solid #d8d2c6;border-radius:16px;padding:17px 18px;margin:14px 0 15px}
.briefingkick{font:800 10px/1.1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.briefing h2{font-size:22px;line-height:1.15;margin:0 0 7px}
.briefing p{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#3f4548}
.briefgoals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:13px}
.briefgoal{background:rgba(255,255,255,.78);border:1px solid rgba(110,120,125,.16);border-radius:10px;padding:9px 10px;font:12.5px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.briefgoal b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:white;margin-right:6px;font-size:10px}
.purpose{margin-top:8px;padding:8px 10px;border-left:3px solid #c7a04b;background:#fbf7ea;border-radius:0 8px 8px 0;font:12.5px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#554719}
.purpose b{color:#715d1b}

.learn{background:var(--accent-soft);border:1px solid #c9dce4;border-radius:14px;margin:13px 0 17px;overflow:hidden}.learn summary{cursor:pointer;padding:12px 15px;font:700 14px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;list-style:none}.learn summary::-webkit-details-marker{display:none}.learn summary:after{content:"▾";float:right}.learn[open] summary:after{content:"▴"}.learnbody{padding:0 15px 15px}.learnbody p{margin:0 0 10px}.terms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.term{background:rgba(255,255,255,.75);border-radius:9px;padding:8px 10px;font:12.5px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.term b{display:block;color:var(--accent);margin-bottom:2px}
.instructions{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin-bottom:15px}
.gamegrid{display:grid;grid-template-columns:minmax(0,1fr) 276px;gap:24px;align-items:start;width:100%}.gamemain{min-width:0;width:100%;overflow:hidden}.bankside{position:sticky;top:12px;align-self:start;min-width:0;width:100%;max-height:calc(100vh - 24px);overflow:auto;padding:1px;z-index:2}.bank{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}.bankhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:11px}.banktitle{font:800 11px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.remaining{font:12px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--muted);white-space:nowrap}.bankhelp{font:12px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--muted);margin:-2px 0 11px}.tiles{display:flex;flex-wrap:wrap;gap:8px}.tile{border:1px solid #aeb8bd;background:#fff;border-radius:9px;padding:10px 12px;text-align:center;white-space:nowrap;flex:0 0 auto;max-width:100%;font:800 14px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.tile.dragging{opacity:.35}
.tile.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:9999;opacity:.95;cursor:grabbing;box-shadow:0 8px 20px rgba(0,0,0,.28)}.tile:hover{border-color:var(--accent)}.tile.sel{outline:3px solid rgba(36,95,120,.25);border-color:var(--accent);background:var(--accent-soft)}.bankempty{grid-column:1/-1;font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--muted)}
.equations{display:grid;gap:13px;min-width:0}.eqcard{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;box-shadow:0 1px 0 rgba(0,0,0,.02);min-width:0;overflow:hidden}.eqcard.locked{border-color:#a9d0b8;background:#fbfefc}.eqtop{display:flex;justify-content:space-between;align-items:start;gap:12px}.eqnum{font:800 10px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}.eqq{font-size:18px;font-weight:700;margin-top:4px}.status{flex:none;border-radius:999px;padding:7px 10px;font:800 11px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-transform:uppercase;letter-spacing:.04em}.status.right{background:var(--good-soft);color:var(--good)}.status.high{background:var(--high-soft);color:var(--high)}.status.low{background:var(--low-soft);color:var(--low)}.status.mixed{background:var(--mixed-soft);color:var(--mixed)}
.chain{display:flex;align-items:stretch;gap:8px;margin-top:12px;width:100%;max-width:100%;min-width:0;overflow-x:auto;overflow-y:hidden;padding:0 0 7px;scrollbar-gutter:stable}.factor{flex:1 0 190px;min-width:175px;border:1px solid var(--line);border-radius:11px;padding:9px 10px;background:#fcfbf8}.factor.lock,.factor.component-right{background:var(--good-soft);border-color:#b8d8c4}.flabel{font-weight:700;font-size:13.5px;line-height:1.35}.inlineunit{font-weight:500;color:var(--accent);font-size:11.5px}.componentbadge{display:inline-block;margin-top:7px;border-radius:999px;background:#d8ecdf;color:var(--good);padding:4px 7px;font:800 9.5px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.05em;text-transform:uppercase}.fdesc{font:11.5px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--muted);margin-top:3px;min-height:30px}.funit{font:700 10.5px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--accent);margin-top:6px}.slot{margin-top:8px;height:39px;border:2px dashed #c8c5bd;border-radius:8px;display:flex;align-items:center;justify-content:center;font:800 14px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#8a8f92;cursor:pointer;background:#fff}.slot.over,.slot:hover{border-color:var(--accent);background:var(--accent-soft)}.slot.filled{border-style:solid;border-color:#9ca8ad;color:var(--ink);justify-content:space-between;padding:0 8px}.slot.component-right{border-color:var(--good);background:#f4fbf7;color:var(--good)}.slot.filled .v{flex:1;text-align:center}.slot .x{border:0;background:none;color:#a04432;font-size:15px;cursor:pointer;padding:4px}.op{flex:none;align-self:center;font:800 25px/1 Georgia,serif;color:var(--accent)}.equals{flex:none;align-self:center;font:800 25px/1 Georgia,serif}.answer{flex:0 0 150px;align-self:stretch;border-left:1px solid var(--line);padding-left:12px;display:flex;flex-direction:column;justify-content:center}.answer .lab{font:700 10px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.answer .val{font:800 18px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin-top:4px}.answer .unit{font:11px/1.25 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--muted);margin-top:2px}
.feedbackline{margin-top:10px;border-radius:9px;padding:9px 11px;font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.feedbackline.high{background:var(--high-soft);color:#72341e}.feedbackline.low{background:var(--low-soft);color:#244b81}.feedbackline.right{background:var(--good-soft);color:#145b39}.feedbackline.mixed{background:var(--mixed-soft);color:#654b0e}
.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:16px}.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:9px;padding:10px 16px;cursor:pointer;font:700 14px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.btn.ghost{background:#fff;color:var(--ink)}.btn:disabled{opacity:.35;cursor:default}.note{font:12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--muted)}
.revealhead{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px 18px;margin-bottom:14px}.score{font-size:42px;font-weight:800;line-height:1;margin:8px 0 4px}.solution{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:11px 0}.solution h3{font-size:18px;margin:0 0 8px}.solutionchain{font:700 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f2ec;border-radius:9px;padding:9px 11px}.why{margin-top:8px;font-size:14px}.ans{color:var(--good)}
@media(max-width:1180px){.wrap{padding-left:16px;padding-right:16px}.gamegrid{grid-template-columns:minmax(0,1fr) 238px;gap:16px}.tiles{grid-template-columns:1fr}.tile{padding:10px 8px}.factor{flex-basis:170px;min-width:160px}.answer{flex-basis:135px}}
@media(max-width:940px){.cards,.terms,.briefgoals{grid-template-columns:1fr}.gamegrid{display:flex;flex-direction:column}.gamemain{order:1;width:100%}.bankside{order:0;position:sticky;top:0;z-index:8;width:100%;max-height:none;overflow:visible;padding:0 0 10px;background:linear-gradient(var(--paper) 82%,rgba(255,255,255,0))}.bank{padding:10px 11px}.bankhelp{display:none}.tiles{gap:7px}.tile{padding:9px 11px;font-size:13px}.chain{align-items:center}.factor{flex-basis:175px}.answer{flex-basis:135px}.wrap{padding:20px 13px 60px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.casebookmap{font:11.5px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--muted);margin-top:5px}
.sourcebox{margin-top:11px;border-top:1px solid var(--line);padding-top:10px}
.sourcetitle{font:800 10px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.sourcelinks{display:flex;flex-wrap:wrap;gap:6px}
.sourcechip{display:inline-block;border:1px solid #c8dbe3;background:#f3f8fa;color:var(--accent);border-radius:999px;padding:5px 8px;text-decoration:none;font:700 11px/1.15 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.sourcechip:hover{text-decoration:underline}
.factnotes{margin-top:9px;display:grid;gap:5px}
.factnote{font:12px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--muted);background:#faf9f5;border-radius:7px;padding:6px 8px}
.factnote b{color:var(--ink)}
.realbadge{display:inline-block;margin-left:6px;border-radius:999px;background:var(--good-soft);color:var(--good);padding:4px 7px;font:800 9px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.04em;text-transform:uppercase}
.bankscore{margin-top:11px;text-align:center}.bankscore .round{display:inline-block}
.inforow{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0 17px}
.inforow .learn{margin:0;flex:0 0 auto;background:#fff;border-radius:10px}
.inforow .learn[open]{flex:1 1 100%;background:var(--accent-soft)}
.inforow .learn summary{padding:8px 13px;font:700 12.5px/1.1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.inforow .learn summary:after{content:" ▾";float:none;margin-left:6px}
.inforow .learn[open] summary:after{content:" ▴"}
.bphero{flex:none;width:300px;max-width:30%;align-self:flex-start;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#f6f8fa;box-shadow:var(--shadow)}
.bphero svg{display:block;width:100%;height:auto}
@media(max-width:940px){.bphero{width:100%;max-width:none;margin-top:10px}}
</style>
</head>

const app=document.getElementById('app');
let G=null, assignments={}, selected=null, tileOrder=[], locked=new Set(), correctSlots=new Set(), feedback={}, solvedRound={}, round=1, phase='play';

const allFactors=()=>G.eqs.flatMap((e,ei)=>e.factors.map((f,fi)=>({...f,eqi:ei,fi,slot:`${ei}:${fi}`})));
const factorAt=slot=>{const [ei,fi]=slot.split(':').map(Number);return G.eqs[ei].factors[fi]};
const tileById=id=>allFactors().find(f=>f.id===id);
const eqSlots=ei=>G.eqs[ei].factors.map((_,fi)=>`${ei}:${fi}`);
const usedIds=()=>new Set(Object.values(assignments));
const same=(a,b)=>Math.abs(a-b)<=Math.max(1e-12,Math.abs(b)*1e-12);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fmt(n){
  if(!isFinite(n))return '—'; const a=Math.abs(n);
  if(a>=1e15)return (n/1e15).toFixed(a<1e16?1:0).replace(/\.0$/,'')+' quadrillion';
  if(a>=1e12)return (n/1e12).toFixed(a<1e13?1:0).replace(/\.0$/,'')+' trillion';
  if(a>=1e9)return (n/1e9).toFixed(a<1e10?1:0).replace(/\.0$/,'')+' billion';
  if(a>=1e6)return (n/1e6).toFixed(a<1e7?1:0).replace(/\.0$/,'')+' million';
  if(a>=1000)return Math.round(n).toLocaleString();
  if(a>=100)return n.toFixed(1).replace(/\.0$/,'');
  if(a>=10)return n.toFixed(1).replace(/\.0$/,'');
  if(a>=1)return n.toFixed(2).replace(/0+$/,'').replace(/\.$/,'');
  if(a===0)return '0';
  return n.toPrecision(3).replace(/0+$/,'').replace(/\.$/,'');
}
function evalEq(e,ei){
  const vals=eqSlots(ei).map(s=>assignments[s]?tileById(assignments[s]).value:NaN);
  if(vals.some(v=>!isFinite(v)))return NaN;
  let r=vals[0];e.ops.forEach((op,i)=>{if(op==='×')r*=vals[i+1];else if(op==='÷')r/=vals[i+1];else r+=vals[i+1]});return r;
}
function eqCorrect(ei){return eqSlots(ei).every((s,fi)=>assignments[s]&&same(tileById(assignments[s]).value,G.eqs[ei].factors[fi].value))}
function allFilled(){return allFactors().every(f=>assignments[f.slot])}
function resetGame(){try{reckonStart(G&&G.id);}catch(e){}assignments={};selected=null;locked=new Set();correctSlots=new Set();feedback={};solvedRound={};round=1;phase='play';tileOrder=shuffle(allFactors().map(f=>f.id));renderGame()}

function bpHeroGraphic(id){var S=BP_SCENES[id];if(!S)return '';return '<figure class="bphero">'+S.svg+'</figure>';}
function briefingHTML(){return `<section class="briefing"><div class="briefingkick">${topicIcon(G)}Your assignment</div><h2>Build the quantitative briefing</h2><p>${G.mission||G.context}</p><div class="briefgoals">${(G.goals||G.eqs.map(e=>e.prompt||e.q)).map((goal,i)=>`<div class="briefgoal"><b>${i+1}</b>${goal}</div>`).join('')}</div></section>`}

function statusHTML(ei){const f=feedback[ei];if(!f)return'';const labels={right:'Right',high:'Too high',low:'Too low',mixed:'Right total, misplaced'};return `<span class="status ${f.kind}">${labels[f.kind]}</span>`}
function feedbackHTML(ei){const f=feedback[ei];if(!f)return'';let text='';if(f.kind==='right')text=`Round ${f.round}: correct. This equation is locked.`;if(f.kind==='high')text=`Round ${f.round}: ${fmt(f.result)} ${G.eqs[ei].unit} is too high.`;if(f.kind==='low')text=`Round ${f.round}: ${fmt(f.result)} ${G.eqs[ei].unit} is too low.`;if(f.kind==='mixed')text=`Round ${f.round}: the final number is right, but some values are attached to the wrong factor names.`;const names=f.correctFactors||[];const componentText=names.length===G.eqs[ei].factors.length?` All ${names.length} individual components are right.`:names.length?` Correct components: <b>${names.join(', ')}</b>. Those values are now locked in place.`:` No individual components are in the right slot yet.`;return `<div class="feedbackline ${f.kind}">${text}${componentText}</div>`}
function slotHTML(ei,fi){const slot=`${ei}:${fi}`, id=assignments[slot], eqLock=locked.has(ei), componentLock=correctSlots.has(slot), lock=eqLock||componentLock;if(!id)return `<div class="slot ${lock?'disabled':''}" data-slot="${slot}">place number</div>`;const t=tileById(id);return `<div class="slot filled ${componentLock?'component-right':''} ${lock?'disabled':''}" data-slot="${slot}"><span class="v">${t.display}</span>${lock?'':`<button class="x" data-clear="${slot}" aria-label="remove">×</button>`}</div>`}
function isConversionFactor(f){const s=((f.label||'')+' '+(f.playDesc||'')+' '+(f.desc||'')).toLowerCase();return /\b(per|conversion|corresponding to one|number of .* in one|ratio of|percentage points per whole|seconds per|minutes per|hours per|days per|metres per|meters per|kilometres per|kilometers per|litres per|liters per|gallons per|joules per|kilograms per|bytes per|bits per|centimetres per|centimeters per|feet per|inches per|yards per)\b/.test(s)}
function normText(s){return (s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function factorHeading(f){const unit=f.unit||'';if(!unit||normText(f.label).includes(normText(unit)))return f.label;return `${f.label} <span class="inlineunit">(${unit})</span>`}
function factorClue(f){const clue=(f.playDesc||'').trim();if(!clue||isConversionFactor(f))return '';const a=normText(f.label),b=normText(clue);if(!b||a===b||a.includes(b)||b.includes(a))return '';return clue}
function eqHTML(e,ei){const res=evalEq(e,ei), lock=locked.has(ei);let parts=[];e.factors.forEach((f,fi)=>{const slot=`${ei}:${fi}`, componentRight=correctSlots.has(slot), clue=factorClue(f);parts.push(`<div class="factor ${lock?'lock':''} ${componentRight?'component-right':''}"><div class="flabel">${factorHeading(f)}${clue?`<button type="button" class="finfo" aria-label="More information">i</button>`:''}</div>${clue?`<div class="fclue">${clue}</div>`:''}${componentRight&&!lock?'<span class="componentbadge">✓ correct component</span>':''}${slotHTML(ei,fi)}</div>`);if(fi<e.ops.length)parts.push(`<div class="op">${e.ops[fi]}</div>`)});return `<section class="eqcard ${lock?'locked':''}"><div class="eqtop"><div><div class="eqnum">${topicIcon(G)}Question ${ei+1}</div><div class="eqq">${e.prompt||e.q}</div></div>${statusHTML(ei)}</div><div class="chain">${parts.join('')}<div class="equals">=</div><div class="answer"><div class="lab">your final number</div><div class="val">${isFinite(res)?fmt(res):'?'}</div><div class="unit">${e.unit}</div></div></div>${feedbackHTML(ei)}</section>`}

  const used=usedIds(), remaining=tileOrder.filter(id=>!used.has(id));const solved=locked.size;
  app.innerHTML=`<div class="topbar"><div class="topbarleft"><div class="gameicon">${topicIcon(G)}</div><div><div class="topic">${G.title}</div></div></div>${bpHeroGraphic(G.id)}</div><div class="progress"><span style="width:${(solved/4)*100}%"></span></div>${briefingHTML()}<div class="inforow">${termsHTML()}<details class="learn"><summary>How to play</summary><div class="learnbody"><p>Every factor name and operator is already shown. Place each number from the shared bank into one slot — each number is used once. Equations contain only the two or three factors the question naturally requires. When you submit, every final answer is marked right, too high, or too low, and correct components lock in green. The full factual wording and sources appear in the reveal.</p></div></details></div><div class="gamegrid"><main class="gamemain"><div class="equations">${G.eqs.map(eqHTML).join('')}</div><div class="controls">${phase==='play'?`<button class="btn" id="check" ${allFilled()?'':'disabled'}>Check answers</button>`:`<button class="btn" id="reveal">See answers, facts, and sources</button>`}<button class="btn ghost" id="clear" ${phase==='play'?'':'disabled'}>Clear unlocked equations</button><button class="btn ghost" id="restart">Restart topic</button><span class="note">Green equations and green individual components are correct, locked, and removed from play.</span></div></main><aside class="bankside"><div class="bank"><div class="bankhead"><div class="banktitle">Shared number bank</div><div class="remaining">${remaining.length} unplaced</div></div><div class="bankhelp">Drag a number onto a slot — or tap a number, then tap its slot. This bank stays visible while you scroll.</div><div class="tiles">${remaining.map(id=>{const t=tileById(id);return `<button type="button" class="tile ${selected===id?'sel':''}" data-id="${id}">${t.display}</button>`}).join('')||'<div class="bankempty">All values are currently placed in equations.</div>'}</div></div><div class="bankscore"><span class="round">${solved}/4 correct</span></div></aside></div>`;
  app.querySelectorAll('.tile').forEach(t=>{t.onpointerdown=e=>beginDrag(e,t)});
  app.querySelectorAll('.slot').forEach(s=>{const [ei]=s.dataset.slot.split(':').map(Number);if(locked.has(ei)||correctSlots.has(s.dataset.slot))return;s.onclick=ev=>{if(ev.target.closest('.x'))return;if(selected)place(selected,s.dataset.slot)}});
  app.querySelectorAll('.x').forEach(x=>x.onclick=ev=>{ev.stopPropagation();delete assignments[x.dataset.clear];selected=null;phase='play';renderGame()});

  document.getElementById('clear').onclick=()=>{Object.keys(assignments).forEach(s=>{const [ei]=s.split(':').map(Number);if(!locked.has(ei)&&!correctSlots.has(s))delete assignments[s]});selected=null;phase='play';renderGame()};document.getElementById('restart').onclick=resetGame;}
function place(id,slot){if(!id)return;const [ei]=slot.split(':').map(Number);if(locked.has(ei)||correctSlots.has(slot))return;const source=Object.keys(assignments).find(s=>assignments[s]===id);if(source&&correctSlots.has(source))return;Object.keys(assignments).forEach(s=>{if(assignments[s]===id&&!correctSlots.has(s))delete assignments[s]});assignments[slot]=id;selected=null;phase='play';renderGame()}

/* Pointer-based drag: one path for mouse, touch, and stylus. A short move
   past a threshold starts a drag with a floating "ghost"; a tap without
   movement just selects the tile (tap-a-number then tap-a-slot still works,
   handled on the slots above). */
function beginDrag(e, tile){
  if (e.button && e.button !== 0) return;
  const id = tile.dataset.id;
  const startX = e.clientX, startY = e.clientY;
  let dragging = false, ghost = null;
  try { tile.setPointerCapture(e.pointerId); } catch(_) {}
  const move = ev => {
    if (!dragging) {
      if (Math.hypot(ev.clientX - startX, ev.clientY - startY) < 6) return;
      dragging = true;
      selected = id;
      tile.classList.add('dragging');
      ghost = tile.cloneNode(true);
      ghost.classList.add('ghost'); ghost.classList.remove('dragging');
      ghost.style.width = tile.offsetWidth + 'px';
      document.body.appendChild(ghost);
    }
    ghost.style.left = (ev.clientX - ghost.offsetWidth / 2) + 'px';
    ghost.style.top  = (ev.clientY - 18) + 'px';
    highlightSlotUnder(ev.clientX, ev.clientY);
  };
  const end = ev => {
    tile.removeEventListener('pointermove', move);
    tile.removeEventListener('pointerup', end);
    tile.removeEventListener('pointercancel', end);
    try { tile.releasePointerCapture(e.pointerId); } catch(_) {}
    if (dragging) {
      const slot = slotUnder(ev.clientX, ev.clientY);
      if (ghost) ghost.remove();
      clearSlotHighlight();
      if (slot) place(id, slot); else renderGame();
    } else {
      selected = (selected === id) ? null : id;
      renderGame();
    }
  };
  tile.addEventListener('pointermove', move);
  tile.addEventListener('pointerup', end);
  tile.addEventListener('pointercancel', end);
}
function slotUnder(x, y){
  const el = document.elementFromPoint(x, y);
  const s = el && el.closest && el.closest('.slot');
  if (!s || !s.dataset.slot) return null;
  const [ei] = s.dataset.slot.split(':').map(Number);
  if (locked.has(ei) || correctSlots.has(s.dataset.slot)) return null;
  return s.dataset.slot;
}
function highlightSlotUnder(x, y){
  clearSlotHighlight();
  if (slotUnder(x, y)) {
    const s = document.elementFromPoint(x, y).closest('.slot');
    if (s) s.classList.add('over');
  }
}
function clearSlotHighlight(){ app.querySelectorAll('.slot.over').forEach(s => s.classList.remove('over')); }
function checkRound(){if(!allFilled())return;G.eqs.forEach((e,ei)=>{if(locked.has(ei))return;const correctFactors=[];e.factors.forEach((factor,fi)=>{const slot=`${ei}:${fi}`,id=assignments[slot];if(id&&same(tileById(id).value,factor.value)){correctSlots.add(slot);correctFactors.push(factor.label)}});const result=evalEq(e,ei), correct=eqCorrect(ei);let kind;if(correct)kind='right';else{const rel=Math.abs(result-e.answer)/e.answer;if(rel<1e-9)kind='mixed';else kind=result>e.answer?'high':'low'}feedback[ei]={kind,result,round,correctFactors};if(correct){locked.add(ei);solvedRound[ei]=round}});phase='checked';renderGame()}

se in range."]},{"id":"nc_bp_navigation","title":"Dead Reckoning and Current by the Numbers","casebookTitle":"The Greywake Shoal","tag":"navigation · knots · set and drift","context":"The four estimates follow the core dead-reckoning questions a watch team repeatedly asks: how far the ship advanced, how far current set it sideways, how much heading correction the current requires, and how long remains to the waypoint.","terms":[["Knot","One nautical mile per hour."],["Dead reckoning","Advancing a known position using course, speed, and elapsed time."],["Set and drift","The direction and speed with which current carries a vessel."],["Speed over ground","The vessel's actual rate of progress across the chart after current is included."]],"eqs":[{"id":"nc_nav_run","q":"Bridge-watch advance: estimate the dead-reckoning distance.","unit":"nautical miles","factors":[{"label":"Steady ship speed","unit":"nautical miles per hour","value":20,"display":"20","desc":"Defined representative underway speed.","source":{"label":"Defined course scenario","url":"navy_course.html#week-4","accessed":"2026-07-23"},"id":"nc_nav_run_f0","playDesc":"Defined representative underway speed."},{"label":"Bridge-watch duration","unit":"hours","value":4,"display":"4","desc":"Defined four-hour watch interval.","source":{"label":"Defined course scenario","url":"navy_course.html#week-4","accessed":"2026-07-23"},"id":"nc_nav_run_f1","playDesc":"Defined four-hour watch interval."}],"ops":["×"],"answer":80,"answerDisplay":"≈ 80","explain":"At twenty knots, the ship covers about twenty nautical miles each hour. Over a four-hour watch, advance the plot by roughly eighty nautical miles.","revealQ":"How far should the dead-reckoning position advance during the bridge watch?","sources":[{"label":"Defined course scenario","url":"navy_course.html#week-4","accessed":"2026-07-23"}],"purpose":"Memorable benchmark: a ship at twenty knots travels about eighty nautical miles in a four-hour watch.","prompt":"How far should the plot advance during one bridge watch?"},{"id":"nc_nav_set","q":"Cross-current set: estimate the lateral displacement before the next fix.","unit":"nautical miles","factors":[{"label":"Cross-current drift","unit":"nautical miles per hour","value":2.5,"display":"2.5","desc":"Defined current perpendicular to the intended track.","source":{"label":"Defined course scenario","url":"navy_course.html#week-4","accessed":"2026-07-23"},"id":"nc_nav_set_f0","playDesc":"Defined current perpendicular to the intended track."},{"label":"Time without an external fix","unit":"hours","value":2,"display":"2","desc":"Defined interval between reliable position fixes.","source":{"label":"Defined course scenario","url":"navy_course.html#week-4","accessed":"2026-07-23"},"id":"nc_nav_set_f1","playDesc":"Defined interval between reliable position fixes."}],"ops":["×"],"answer":5,"answerDisplay":"≈ 5","explain":"A two-and-a-half-knot cross-current moves the vessel about two and a half nautical miles sideways each hour. In two hours, the uncorrected set grows to about five nautical miles.","revealQ":"How much cross-track error can accumulate before the next external fix?","sources":[{"label":"Defined course scenario","url":"navy_course.html#week-4","accessed":"2026-07-23"}],"purpose":"Memorable benchmark: even a modest current can create several nautical miles of cross-track error between fixes.","prompt":"How large can the cross-track error become before the next fix?"},{"id":"nc_nav_crab","q":"Current correction: estimate the small heading offset in degrees.","unit":"degrees","factors":[{"label":"Cross-current speed","unit":"knots","value":1.8,"display":"1.8","desc":"Defined current perpendicular to the intended ground track.","source":{"label":"Defined course scenario","url":"navy_course.html#week-4","accessed":"2026-07-23"},"id":"nc_nav_crab_f0","playDesc":"Defined current perpendicular to the intended ground track."},{"label":"Ship speed through water","unit":"knots","value":18," rd force equal to the weight of displaced fluid in the ideal static case."]],"eqs":[{"id":"nc_depth_pressure","q":"Operating-depth pressure: estimate the water-column gauge pressure.","unit":"megapascals","factors":[{"label":"Seawater pressure increase per metre","unit":"kilopascals per metre","value":10.05,"display":"10.05","desc":"Derived from representative seawater density and standard gravity.","source":{"label":"Defined conversion from NOAA density and NIST gravity","url":"https://physics.nist.gov/cgi-bin/cuu/Value?gn=","accessed":"2026-07-23"},"id":"nc_depth_pressure_f0","playDesc":"Derived from representative seawater density and standard gravity."},{"label":"Exercise operating depth","unit":"metres","value":100,"display":"100","desc":"Defined representative depth.","source":{"label":"Defined course scenario","url":"navy_course.html#week-7","accessed":"2026-07-23"},"id":"nc_depth_pressure_f1","playDesc":"Defined representative depth."},{"label":"Kilopascals per megapascal","unit":"kilopascals per megapascal","value":1000,"display":"1,000","desc":"Defined SI pressure conversion.","source":{"label":"NIST — SI units and conversions","url":"https://www.nist.gov/pml/owm/si-units-information","accessed":"2026-07-23"},"id":"nc_depth_pressure_f2","playDesc":"Defined SI pressure conversion."}],"ops":["×","÷"],"answer":1.005,"answerDisplay":"≈ 1.0","explain":"Use about ten kilopascals for every metre of seawater. At one hundred metres, that is about one thousand kilopascals, or one megapascal of gauge pressure.","revealQ":"What gauge pressure comes from the exercise operating depth?","sources":[{"label":"NOAA — World Ocean Database introduction","url":"https://www.ncei.noaa.gov/sites/default/files/2020-04/wod_intro_0.pdf","accessed":"2026-07-23"},{"label":"NIST — CODATA standard gravity","url":"https://physics.nist.gov/cgi-bin/cuu/Value?gn=","accessed":"2026-07-23"},{"label":"NIST — SI units and conversions","url":"https://www.nist.gov/pml/owm/si-units-information","accessed":"2026-07-23"},{"label":"Defined course scenario","url":"navy_course.html#week-7","accessed":"2026-07-23"}],"purpose":"Memorable benchmark: one hundred metres of seawater adds roughly one megapascal, about ten atmospheres, of gauge pressure.","prompt":"What gauge pressure acts at the exercise depth?"},{"id":"nc_depth_hatch","q":"Hatch loading: estimate the net force from external water pressure.","unit":"meganewtons","factors":[{"label":"External gauge pressure at hatch depth","unit":"megapascals","value":1.005,"display":"1.005","desc":"Defined pressure scale corresponding to roughly one hundred metres of seawater.","source":{"label":"Defined conversion from NOAA density and NIST gravity","url":"https://physics.nist.gov/cgi-bin/cuu/Value?gn=","accessed":"2026-07-23"},"id":"nc_depth_hatch_f0","playDesc":"Defined pressure scale corresponding to roughly one hundred metres of seawater."},{"label":"Projected hatch area","unit":"square metres","value":0.6,"display":"0.6","desc":"Defined exposed hatch area.","source":{"label":"Defined course scenario","url":"navy_course.html#week-7","accessed":"2026-07-23"},"id":"nc_depth_hatch_f1","playDesc":"Defined exposed hatch area."}],"ops":["×"],"answer":0.603,"answerDisplay":"≈ 0.60","explain":"A megapascal acting over one square metre produces a meganewton. Here the area is a little over half a square metre, so the load is about six tenths of a meganewton.","revealQ":"How much net water force acts across the hatch?","sources":[{"label":"NOAA — World Ocean Database introduction","url":"https://www.ncei.noaa.gov/sites/default/files/2020-04/wod_intro_0.pdf","accessed":"2026-07-23"},{"label":"NIST — CODATA standard gravity","url":"https://physics.nist.gov/cgi-bin/cuu/Value?gn=","accessed":"2026-07-23"},{"label":"Defined course scenario","url":"navy_course.html#week-7","accessed":"2026-07-23"}],"purpose":"Memorable benchmark: a human-scale hatch at one hundred metres can carry a load of hundreds of kilonewtons.","prompt":"How much force is the sea placing across the hatch?"},{"id":"nc_depth_buoyancy","q":"Displacement buoyancy: estimate the upward force from the displaced water.","unit":"kilonewtons","factors":[{"label":"Seawater weight per cubic metre","unit":"kilonewtons per cubic metre","value":10.1,"display":"10.1","desc":"Rounded product of representative seawater density and standard gravity.","source":{"label":"Defined conversion from NOAA density and NIST gravity","url":"https://physics.nist.gov/cgi-bin/cuu/Value?gn=","accessed":"2026-07-23"},"id":"nc_depth_buoyancy_f0","playDesc":"Rounded product of representative seawater density and standard gravity."},{"label":"Displaced seawater volume","unit":"cubic metres","value":25,"display":"25","desc":"Defined submerged displacement volume.","source":{"label":"Defined course scenario","url":"navy_course.html#week-7","accessed":"2026-07-23"},"id":"nc_depth_buoyancy_f1","playDesc":"Defined submerged displacement volume."}],"ops":["×"],"answer":252.5,"answerDisplay":"≈ 250","explain":"Each cubic metre of seawater provides about ten kilonewtons of buoyancy. Twenty-five cubic metres therefore supports about two hundred fifty kilonewtons.","revealQ":"How much buoyant force comes from the displaced seawater?","sources":[{"label":"NOAA — World Ocean Database introduction","url":"https://www.ncei.noaa.gov/sites/default/files/2020-04/wod_intro_0.pdf","accessed":"2026-07-23"},{"label":"NIST — CODATA standard gravity","url":"https://physics.nist.gov/cgi-bin/cuu/Value?gn=","accessed":"2026-07-23"},{"label":"Defined course scenario","url":"navy_course.html#week-7","accessed":"2026-07-23"}],"purpose":"Memorable benchmark: each cubic metre of seawater contributes roughly ten kilonewtons of buoyant force.","prompt":"How much upward force does the displaced water provide?"},{"id":"nc_depth_flood","q":"Flooding load: estimate the mass added to the ship.","unit":"tonnes","factors":[{"label":"Flooded compartment volume","unit":"cubic metres","value":18,"dis dar","title":"Radar Horizon and Timing by the Numbers","casebookTitle":"The Low Contact","tag":"radar · horizon · pulse timing","context":"The four estimates build an operational radar scale: a low shipboard horizon, electromagnetic travel measured in microseconds, pulse width translated into range resolution, and detection range translated into minutes of reaction time.","terms":[["Radar horizon","The line-of-sight limit imposed primarily by Earth curvature for low targets."],["Pulse delay","Elapsed time between transmission and echo reception."],["Range resolution","The minimum range separation at which two targets can be distinguished by pulse timing."],["Reaction time","Time between detection and arrival at the defended position under the simplified geometry."]],"eqs":[{"id":"nc_radar_ownhorizon","q":"Shipboard radar horizon: estimate the geometric line-of-sight distance.","unit":"nautical miles","factors":[{"label":"Geometric-horizon coefficient","unit":"nautical miles per square root metre","value":2.072,"display":"2.072","desc":"Derived from Earth-curvature geometry and unit conversion, neglecting refraction.","source":{"label":"Defined conversion from NASA horizon relation","url":"https://pwg.gsfc.nasa.gov/stargaze/Shorizon.htm","accessed":"2026-07-23"},"id":"nc_radar_ownhorizon_f0","playDesc":"Derived from Earth-curvature geometry and unit conversion, neglecting refraction."},{"label":"Square root of antenna height","unit":"square root metres","value":5,"display":"5","desc":"Square root of the defined twenty-five-metre antenna height.","source":{"label":"Defined course scenario","url":"navy_course.html#week-14","accessed":"2026-07-23"},"id":"nc_radar_ownhorizon_f1","playDesc":"Square root of the defined twenty-five-metre antenna height."}],"ops":["×"],"answer":10.36,"answerDisplay":"≈ 10","explain":"The square root of twenty-five metres is five. Multiplying by roughly two nautical miles per square-root metre gives a horizon near ten nautical miles.","reveal

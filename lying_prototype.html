<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lying</title>
<style>
:root{--paper:#fbfaf7;--ink:#1a1a1a;--gray:#5b5b5b;--line:#dcd8d0;--accent:#2f6f8f;
  --good:#1a7a4c;--bad:#b0402f;--mut:#efece6;--flag:#f4d58a}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.62}
.wrap{max-width:820px;margin:auto;padding:26px 20px 90px}
.kick{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gray);font-family:-apple-system,Helvetica,Arial,sans-serif}
h1{font-size:30px;margin:.1em 0 .05em}
.blurb{font-size:16px;line-height:1.6;color:#33312e;max-width:700px;margin:8px 0 6px}
.sub{color:var(--gray);font-size:14px;font-family:-apple-system,Helvetica,Arial,sans-serif;margin:2px 0 14px}
.cards{display:grid;gap:12px;margin-top:16px}
.pick{border:1px solid var(--line);background:#fff;border-radius:12px;padding:16px 18px;cursor:pointer}
.pick:hover{border-color:var(--accent)}.pick .t{font-size:18px;font-weight:700}.pick .d{font-family:-apple-system,Helvetica,Arial,sans-serif;font-size:12.5px;color:var(--gray);margin-top:3px}
.acct{border:1px solid var(--line);background:#fff;border-radius:12px;padding:16px 20px;margin:14px 0}
.acct .nm{font-weight:700;font-size:16px}
.acct .rl{font-family:-apple-system,Helvetica,Arial,sans-serif;font-size:12.5px;color:var(--gray);margin-bottom:8px}
.acct p{margin:0;font-size:16px;line-height:1.75}
.sent{cursor:pointer;border-radius:4px;padding:1px 2px;transition:background .1s}
.sent:hover{background:#eef4f7}
.sent.sel{background:var(--flag);outline:1px solid #d8b25a}
.controls{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.btn{font-family:-apple-system,Helvetica,Arial,sans-serif;font-size:15px;padding:10px 18px;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink)}.btn:disabled{opacity:.35;cursor:default}
.fb{font-family:-apple-system,Helvetica,Arial,sans-serif;font-size:14.5px;margin-top:12px;padding:11px 14px;border-radius:9px;line-height:1.5}
.fb.bad{background:#fbf1ef;color:var(--bad)}
.reveal{border:1px solid var(--line);background:#fff;border-radius:14px;padding:20px 22px;margin-top:10px}
.reveal h2{font-size:24px;margin:0 0 4px}
.reveal .why{font-size:15px;line-height:1.6;margin:8px 0}
.reveal .lesson{border-left:3px solid var(--accent);background:#eef4f7;padding:12px 15px;border-radius:8px;margin:12px 0;font-size:15px;line-height:1.62}
.reveal .meta{font-size:13.5px;color:var(--gray);font-family:-apple-system,Helvetica,Arial,sans-serif;font-style:italic;line-height:1.55}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="wrap">
<div class="kick">Sift · Lying</div>
<h1>Lying</h1>
<div id="app"></div>
</div>
<script>
const CASES=[
{ id:'eclipse', level:'L1', title:'The Two-Minute Sun', dom:'astronomy · a total eclipse',
  intro:'Three people stood in the path of a total solar eclipse and later wrote down what they saw. Their accounts agree on almost everything — the strange light, the sudden cold, the corona. But one of them is embellishing, and the exaggeration breaks a hard fact about how eclipses work. Read all three, then click the single sentence that cannot be true.',
  accounts:[
   {nm:'Dr. Iyer',rl:'astronomer',sents:[
     "For over an hour the Moon crept across the Sun’s face; through our filters it looked like a cookie with a steadily bigger bite taken out of it.",
     "The daylight turned metallic and thin, shadows went razor-sharp, and the temperature fell about ten degrees as the last sliver of Sun narrowed.",
     "Then the diamond ring flared — one final blazing bead of sunlight — and we tore our glasses off as the Sun’s pearly corona sprang into view.",
     "Totality ran just over two minutes; I counted it down aloud, because that sliver of time is all the corona you ever get.",
     "A second diamond ring burst out on the opposite edge and it was finished — filters back on."]},
   {nm:'Ms. Okafor',rl:'schoolteacher',sents:[
     "My students spotted it on the ground first: every gap between the leaves acted like a pinhole and threw a hundred little crescent Suns across the pavement.",
     "As totality closed in, the whole horizon glowed like a 360-degree sunset and the brightest planets popped out in the darkened sky.",
     "The corona was unreal — those silver streamers only reveal themselves in the couple of minutes the Moon completely hides the Sun’s bright face.",
     "The birds cut out mid-song, as if dusk had dropped at midday, and a genuine chill went through the crowd.",
     "Maybe two and a half minutes later the Sun’s edge exploded back and ordinary daylight came flooding in."]},
   {nm:'Reyes',rl:'local farmer',sents:[
     "The partial stage seemed to take forever — the better part of an hour with the disk shrinking behind the Moon.",
     "When the light finally went dim the cicadas fell silent and the air turned cold, exactly the way the others describe it.",
     "The corona came out like a silver crown, and I stood there gazing up at it for a good twenty minutes before the Sun came back.",
     "The flash at the end was so bright it stung, and I had to look away fast.",
     "By the time full daylight returned the whole field was cheering and hugging."]}],
  liar:2, tell:{a:2,s:2},
  why:'Both the astronomer and the teacher independently timed totality at about two to two-and-a-half minutes. Reyes claims to have gazed at the corona for <b>twenty</b> — impossible for this eclipse, or any eclipse.',
  lesson:'Totality — the only time the faint corona is visible — is astonishingly brief. It lasts only as long as the Moon’s shadow takes to sweep over you: a couple of minutes, and the longest possible anywhere on Earth is about 7½. The instant the Sun’s bright surface returns, its glare washes the corona out completely. So “twenty minutes of corona” can’t happen — and note that it’s the flashiest, most confident line in all three accounts.'},

{ id:'summit', level:'L1', title:'Warm at the Top', dom:'physics of altitude · a summit climb',
  intro:'Three climbers describe their morning on the summit of an 8,000-metre peak. Their stories line up — the gasping for air, the cold, the endless view — except one detail that ignores what altitude does to physics. Click the sentence that cannot be true.',
  accounts:[
   {nm:'Petrova',rl:'lead climber',sents:[
     "We left the high camp at 2 a.m. by headlamp; every single step took three or four heaving breaths in air holding barely a third of the oxygen you get at sea level.",
     "The stove was maddening — up there water boils merely lukewarm, so melting snow for a drink took an age and the tea never came out properly hot.",
     "On the summit the wind knifed straight through our down suits; we could stand it for about fifteen minutes before we had to start down.",
     "Frost caked the mask from my own breath, and the sky directly overhead was a strange deep, dark blue."]},
   {nm:'Adeyemi',rl:'climber',sents:[
     "My fingers went numb even inside expedition mitts; at that height any skin you expose starts to freeze within minutes.",
     "We sipped bottled oxygen the whole way and still felt drunk with exhaustion — the brain simply starves that high up.",
     "The lukewarm drinks were pitiful; you cannot get a hot cup of tea when the water boils that cool.",
     "We lasted maybe ten or fifteen minutes at the top, took our photographs, and got off the summit fast."]},
   {nm:'Boyd',rl:'climber',sents:[
     "The ascent was savage — thin air, three breaths to a step, exactly as the others say.",
     "But at the summit the morning sun was so warm that we peeled off our jackets and happily lingered close to an hour.",
     "We took our photos and the view rolled out a clear hundred miles in every direction.",
     "Only on the descent, once the sun dipped, did the real cold finally catch up with us."]}],
  liar:2, tell:{a:2,s:1},
  why:'Both other climbers describe brutal cold and a stay of only ten to fifteen minutes. Boyd claims it was warm enough to strip off jackets and linger nearly an hour on an 8,000-metre summit.',
  lesson:'A high summit is lethally cold no matter how bright the sun. The air is far too thin to trap heat, so temperatures sit well below freezing and the wind strips away what little warmth you have — exposed skin freezes in minutes and nobody lingers. (The detail the honest climbers mention is real, too: because the air pressure is so low, water boils at only about 70 °C up there — so you genuinely can’t brew a hot drink or cook properly.)'},

{ id:'causeway', level:'L3', title:'Dry Feet', dom:'tides · a tidal-island crossing',
  intro:'A dinghy went missing from a small sailing club one afternoon and turned up over on the tidal island — the one that’s cut off by the sea except near high water. Three members describe the day. Two are telling the truth; one took the dinghy and is lying about how they got across. Here’s the catch: nobody’s account is impossible on its own — you have to put details from different people together. And not every disagreement is a lie. Click the single sentence that cannot be true.',
  accounts:[
   {nm:'Nadia',rl:'club sailor',sents:[
     'It was a big spring tide that afternoon — a new moon, so the range between low and high water was enormous and the flood came racing in.',
     'High water was around three o’clock; a few of us hauled the boats up the slipway just before it, while there was still mud showing.',
     'By five the sea was right over the causeway to the island — after that you’d have needed a boat to get across.',
     'I packed up and left about half past five, as the tide was just beginning to ebb.']},
   {nm:'Owen',rl:'club sailor',sents:[
     'I spent the afternoon on the clubhouse balcony with my binoculars; I watched an osprey dive three separate times and come up with a mullet on the last.',
     'When I looked over around four, the tide was near its peak and the whole causeway and the mudflats were under water.',
     'The dinghy was already gone from its rack by then — I remember thinking someone must have taken it out on the water.',
     'I headed home about five.']},
   {nm:'Cole',rl:'club sailor',sents:[
     'I had a couple of crab pots set just off the island and wanted to check them before the wind got up.',
     'Around half past five I walked out along the causeway, emptied the pots, and strolled back — dry feet the whole way.',
     'The place was deserted by then; everyone else had long since packed up.',
     'I did notice the dinghy was off its rack, but I assumed someone had it out on the water.']}],
  liar:2, tell:{a:2,s:1},
  why:'No single account gives Cole away — his story is perfectly consistent with itself. It only breaks when you combine two others: Nadia says high water was around three and the causeway was under the sea by five, and Owen independently saw it covered near its peak that afternoon. So at half past five the causeway was well under water — Cole could not have walked it with dry feet.',
  meta:'Notice what you could <i>not</i> do here: catch Cole from his own account, or from the flashiest line (that osprey belongs to a truth-teller). You had to chain a detail from Nadia with one from Owen — and set aside an honest disagreement that wasn’t the lie (Nadia’s “around three” vs Owen’s “around four” for the peak; either way, half past five is far too late). Real deception-detection is a collision between sources, not a vibe.',
  lesson:'Tides follow the Moon. Around a new or full Moon you get <b>spring tides</b> — the largest range — and the water floods in quickly. A tidal causeway is only walkable for an hour or so either side of high water; miss that window and it’s under the sea until the next low tide. With high water near three, the crossing was long gone by half past five. It’s exactly how places like Lindisfarne and Mont-Saint-Michel strand careless visitors every year — the sea returns faster than people expect.'}
];

const app=document.getElementById('app');
let C=null, sel=null, tries=0;

function home(){ C=null;
  app.innerHTML=`<div class="blurb">Three people tell the story of the same event. Two are telling the truth; one is lying. The lie is buried in the telling — a single claim that <b>can’t be true</b>, given what the others say and how the world works. Read closely and find it.</div>
   <div class="cards">${CASES.map((c,i)=>`<div class="pick" data-i="${i}"><div class="t">${c.title} <span style="font-family:-apple-system,Helvetica,Arial,sans-serif;font-size:11px;color:var(--accent);font-weight:800">${c.level}</span></div><div class="d">${c.dom}</div></div>`).join('')}</div>`;
  app.querySelectorAll('.pick').forEach(p=>p.onclick=()=>{C=CASES[+p.dataset.i];sel=null;tries=0;play();});
}

function play(fb){
  app.innerHTML=`
   <div class="kick">${C.dom}</div><h1>${C.title}</h1>
   <div class="blurb">${C.intro}</div>
   ${C.accounts.map((ac,ai)=>`<div class="acct"><div class="nm">${ac.nm}</div><div class="rl">${ac.rl}</div>
     <p>${ac.sents.map((s,si)=>`<span class="sent ${sel&&sel.a===ai&&sel.s===si?'sel':''}" data-a="${ai}" data-s="${si}">${s}</span>`).join(' ')}</p></div>`).join('')}
   ${fb?`<div class="fb bad">${fb}</div>`:''}
   <div class="controls"><button class="btn" id="accuse" ${sel?'':'disabled'}>That’s the lie →</button>
     <button class="btn ghost" id="home">↩ cases</button>${tries>=2?`<button class="btn ghost" id="give">Show me</button>`:''}</div>`;
  app.querySelectorAll('.sent').forEach(sp=>sp.onclick=()=>{const a=+sp.dataset.a,s=+sp.dataset.s; sel=(sel&&sel.a===a&&sel.s===s)?null:{a,s}; play();});
  document.getElementById('accuse').onclick=accuse;
  document.getElementById('home').onclick=home;
  const g=document.getElementById('give'); if(g)g.onclick=()=>reveal(false);
}
function accuse(){
  if(sel.a===C.tell.a && sel.s===C.tell.s){ reveal(true); return; }
  tries++;
  const msg = sel.a===C.liar
    ? 'Right person — but that line is actually true. Which single claim is <i>impossible</i>?'
    : 'That account holds up; every detail there is consistent with the others and with the facts. Whose story contains something that can’t be true?';
  play(msg);
}
function reveal(won){
  app.innerHTML=`<div class="reveal">
    <div class="kick">${won?'caught it':'the answer'}</div>
    <h2>${C.accounts[C.liar].nm} was lying.</h2>
    <p class="why">${C.why}</p>
    <div class="lesson"><b>What’s behind it:</b> ${C.lesson}</div>
    <p class="meta">${C.meta||'The giveaway is almost always the most vivid, confident detail — deception tends to sound <i>better</i> than the truth. You don’t catch it by who seems shifty; you catch it by the one thing that collides with what everyone else, and the world, already establishes.'}</p>
    <div class="controls"><button class="btn" id="next">Next case →</button><button class="btn ghost" id="home">↩ cases</button></div>
  </div>`;
  document.getElementById('home').onclick=home;
  document.getElementById('next').onclick=()=>{C=CASES[(CASES.indexOf(C)+1)%CASES.length];sel=null;tries=0;play();};
}
home();
</script></body></html>
